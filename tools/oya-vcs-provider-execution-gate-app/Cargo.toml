[package]
name = "oya-vcs-provider-execution-gate-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "foundry"
bounded_context = "vcs-provider-execution-gate"
kind = "shared"
layer = "app"
purpose = "Composition root for the oya-vcs-provider-execution required-check. Detects workspace metadata, invokes canonical trivy as a subprocess (fs vuln scan, infra config scan, sarif emission), validates the Argo desired-state Application manifest via the gate kernel, and emits the deterministic provider-execution evidence record."
lifecycle.stage = "scaffolded"

[[bin]]
name = "oya-vcs-provider-execution-gate-app"
path = "src/main.rs"

[dependencies]
oya-vcs-provider-execution-gate-kernel = { path = "../../microservices/intelligence/crates/oya-vcs-provider-execution-gate-kernel" }
serde_json = { workspace = true }

[lints]
workspace = true
