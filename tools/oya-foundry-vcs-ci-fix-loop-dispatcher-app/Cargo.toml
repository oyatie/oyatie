[package]
# Naming justification (per feedback_naming_justification):
#   - BNF v4.1:  oya - foundry - vcs-ci-fix-loop-dispatcher - app
#   - slot-2 µservice: `foundry` (registered; internal engineering platform).
#   - bc-tokens: `vcs-ci-fix-loop-dispatcher` (kebab tokens; bounded context is
#                the VCS fix-loop dispatcher binary that serves both CI-source
#                AND review-source per M01-P17-IP-005 §"Dual-source fix-loop").
#   - layer (slot-N): `app` — closed enum {kernel, domain, usecase, app,
#                adapter, infrastructure, cli, rest, grpc, graphql, worker,
#                sdk, api} per ADR-0056 amended by ADR-0105 + ADR-0106. Bin-
#                only tool that orchestrates kernels per ADR-0107 §"tools/
#                binding" amended 2026-05-15 (no implicit-app exception;
#                every tools/ crate carries a canonical layer suffix; binary
#                tools use `-app`).
#   - Sibling pattern: matches other tools/oya-foundry-vcs-*-app crates
#                (admission-gate-app, provider-execution-gate-app).
#
# IP plan symbol-claims (M01-P17-IP-005 §"Symbols to grit-claim") listed
# `tools/oya-ci-fix-loop-dispatcher`. That literal predates BNF v4.1 and
# fails (a) the slot-2 µservice registry (no `oya-ci-*` entry exists; the
# correct slot-2 is `foundry`), (b) the closed layer enum (no `-app`
# suffix). The canonical form below is the conforming rename.
name = "oya-foundry-vcs-ci-fix-loop-dispatcher-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[[bin]]
name = "oya-foundry-vcs-ci-fix-loop-dispatcher-app"
path = "src/main.rs"

[lib]
name = "oya_foundry_vcs_ci_fix_loop_dispatcher_app"
path = "src/lib.rs"
doctest = false

[dependencies]
# IP-009 wiring: the fix-loop dispatcher invokes the subagent runtime
# inline (deterministic-mock for CI, anthropic-api in production) to
# produce a fix-agent response from the context bundle. The kernel
# defines the SubagentPort; the app crate carries the canonical mock
# implementation.
oya-foundry-account-kernel = { path = "../../crates/oya-foundry-account-kernel" }
oya-foundry-subagent-runtime-kernel = { path = "../../crates/oya-foundry-subagent-runtime-kernel" }
oya-foundry-subagent-runtime-usecase = { path = "../../crates/oya-foundry-subagent-runtime-usecase" }

[lints]
workspace = true

[package.metadata.oya]
context     = "foundry"
role        = "app"
feature     = "vcs-ci-fix-loop-dispatcher"
capability  = ""
layer       = "app"
audit_chain = true

[package.metadata.oya.lifecycle]
stage = "scaffolded"
introducing_ip = "M01-P17-IP-005"
