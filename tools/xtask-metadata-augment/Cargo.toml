[package]
name = "xtask-metadata-augment"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "shared"
bounded_context = "xtask"
kind = "shared"
layer = "cli"
purpose = "xtask CLI for metadata augmentation, lockfile rename, rename-map generation, and workspace registry checks."

[[bin]]
name = "xtask-metadata-augment"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
