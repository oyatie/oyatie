[package]
name = "oya-lane-supervisor-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_lane_supervisor_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-lane-supervisor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true }
# Founder-ratification dispatch gate (masterplan v2 sequencing): the lane
# dispatch surface refuses to run when the ratification record is absent or
# stale against the live sequencing in specs/masterplan.json.
oya-fabric-loop-state-app = { path = "../oya-fabric-loop-state-app" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
