[package]
name = "oya-checkout-guard-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "tooling"
kind = "shared"
layer = "app"
purpose = "Rust PreToolUse guard preventing mutating git operations in the canonical checkout."

[lib]
name = "oya_checkout_guard_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-checkout-guard"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
