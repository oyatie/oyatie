[package]
name = "oya-architecture-graph-generator-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "shared"
bounded_context = "architecture-graph"
kind = "shared"
layer = "app"
purpose = "CI pipeline tool: generate docs/architecture/product-graph.html from the curated architecture-graph SSOT + the generated masterplan; drift-gated."

[lib]
name = "oya_architecture_graph_generator_app"
path = "src/lib.rs"

[[bin]]
name = "oya-architecture-graph-generator"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
ci-generated-artifact-freshness = { path = "../../ci/facade/generated-artifact-freshness" }
tempfile = { workspace = true }

[lints]
workspace = true
