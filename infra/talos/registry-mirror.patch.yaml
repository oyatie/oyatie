# Talos machine-config patch: node containerd mirror for the in-cluster registry.
#
# WHY THIS FILE EXISTS: applying this to a live cluster is a one-time imperative
# act (talosctl patch machineconfig) and is LOST on `talosctl cluster
# destroy/create`. Committing it is the only reproducible-from-repo lever — pass
# it at create time with --config-patch. The darwin qemu provisioner has NO
# --registry-mirror flag (that exists only on Linux hosts), so there is no other
# way to make this survive a cluster rebuild.
#
# The ENDPOINT is an IP, deliberately: node containerd resolves via the host
# resolver (machine.network.nameservers), not CoreDNS, so the cluster DNS name
# does not resolve there. The mirror KEY stays the DNS-form reference — it is a
# string match only — so image names in manifests need no rewriting.
# The IP is the registry Service's PINNED spec.clusterIP (see
# infra/registry/registry.k8s.yaml); if that pin changes, change it here too.
#
# Applied without a reboot; verified by a pod pulling
# registry.registry.svc.cluster.local:5000/... successfully after the patch.
machine:
  registries:
    mirrors:
      registry.registry.svc.cluster.local:5000:
        endpoints:
          - http://10.107.56.227:5000
