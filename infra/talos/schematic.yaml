# Talos Image Factory schematic — bakes the Kata Containers (cloud-hypervisor) system extension
# into the Talos arm64 image. POST to https://factory.talos.dev/schematics to get a content-addressed
# schematic ID; that ID pins factory.talos.dev/installer/<id>:<talos-version> used as
# machine.install.image so the extension is present on the on-disk install (not just the live ISO).
#
# Verified at source (2026-05-26): the siderolabs/kata-containers extension ships cloud-hypervisor as
# its SOLE hypervisor ([hypervisor.clh]) and registers the containerd runtime handler `kata`.
# See .omx/plans/talos-on-apple-silicon-procedure.md §2 and ADR-0147 (kata-cloud-hypervisor pin).
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/kata-containers
