# Worker config patch (applied on top of `talosctl gen config` worker.yaml).
# - install.image: same Kata/CLH-baked installer as the control plane.
# - kernel.modules: vhost_net/vhost_vsock for Kata cloud-hypervisor microVMs.
# - nodeLabels: marks the node Kata-capable so the kata-cloud-hypervisor RuntimeClass nodeSelector
#   schedules sandboxed workloads here (only workers carry it; no VIP on workers).
machine:
  install:
    image: factory.talos.dev/installer/3da7f440f279f4814fa73bdf83c84710a8e93c40a4a3cbba4d969f14afb96298:v1.13.2
  kernel:
    modules:
      - name: vhost_net
      - name: vhost_vsock
  nodeLabels:
    katacontainers.io/kata-runtime: "true"
