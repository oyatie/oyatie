# ADR-0381 D2 — storage specialty cell patch.
#
# Applied to the 1 storage specialty worker (storage-0) hosting:
#   - SeaweedFS Deployment (oya-storage; ADR-0381 D4) — currently all-in-one,
#     splits into 4 sibling Deployments (master/volume/filer/bucket-api) once this pool
#     lands.
#   - Future: any other stateful substrate (Postgres for tenant data,
#     observability ClickHouse, etc.) that warrants disk-bound node pinning.
#
# The node carries:
#   - `oya.cell/storage=true` label (scheduling selector).
#   - `dedicated=storage:NoSchedule` taint — protects the disk-bound workloads
#     from being co-scheduled with CPU-greedy CI builds.
#
# Apply with:
#   talosctl apply-config --insecure --nodes $IP \
#     --file $WORKDIR/worker.yaml \
#     --config-patch @infra/talos/local/patches/cell-storage.yaml
#
# Pod templates that need to land here must declare:
#   nodeSelector: { oya.cell/storage: "true" }
#   tolerations: [{ key: dedicated, operator: Equal, value: storage, effect: NoSchedule }]
machine:
  kubelet:
    nodeLabels:
      oya.cell/storage: "true"
      oya.cell/role: "storage-specialty"
    extraArgs:
      register-with-taints: "dedicated=storage:NoSchedule"
