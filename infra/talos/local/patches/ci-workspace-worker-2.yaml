# #1504 repository-side Talos declaration for the currently blank 150 GiB vdb on
# oya-talos-worker-2. This file is NOT rollout evidence and MUST be applied only
# after independent review and a readback confirming that /dev/vdb remains blank.
#
# Apply (credential-gated, outside CI):
#   talosctl --nodes <worker-2-ip> patch mc --patch @infra/talos/local/patches/ci-workspace-worker-2.yaml
#
# The exact path + size predicate fails closed if the VM disk topology changes.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ci-workspace-general
provisioning:
  diskSelector:
    match: "!system_disk && disk.dev_path == '/dev/vdb' && disk.size == 150u * GiB"
  # Dual-worker general cell: admitted by ci-workspace-storage.yaml nodePathMap
  # so the general scale set can place one runner here while worker-1 hosts the
  # other (maxRunners=2 + required hostname anti-affinity). Same path as
  # worker-1; live-postgres remains a separate path/volume on this node.
  # Removal is a separate destructive act after scale-set capacity is reduced.
  minSize: 48GiB
  maxSize: 48GiB
filesystem:
  type: xfs
  projectQuotaSupport: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ci-workspace-live-postgres
provisioning:
  diskSelector:
    match: "!system_disk && disk.dev_path == '/dev/vdb' && disk.size == 150u * GiB"
  minSize: 48GiB
  maxSize: 48GiB
filesystem:
  type: xfs
  projectQuotaSupport: true
