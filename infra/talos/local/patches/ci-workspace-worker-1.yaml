# #1504 repository-side Talos declaration for the currently blank 150 GiB vdb on
# oya-talos-worker-1. This file is NOT rollout evidence and MUST be applied only
# after independent review and a readback confirming that /dev/vdb remains blank.
#
# Apply (credential-gated, outside CI):
#   talosctl --nodes <worker-1-ip> patch mc --patch @infra/talos/local/patches/ci-workspace-worker-1.yaml
#
# The exact path + size predicate fails closed if the VM disk topology changes.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: ci-workspace-general
provisioning:
  diskSelector:
    match: "!system_disk && disk.dev_path == '/dev/vdb' && disk.size == 150u * GiB"
  # Local Path Provisioner does not enforce PVC byte requests. Blast radius is
  # one 44Gi general claim per 48Gi physical volume per node; dual-worker
  # concurrency (maxRunners=2) is enforced by admitting this path on both
  # workers and required hostname anti-affinity, not by stacking on one disk.
  minSize: 48GiB
  maxSize: 48GiB
filesystem:
  type: xfs
  projectQuotaSupport: true
