# Cilium CNI values for Talos. Talos sets cluster.network.cni.name=none + cluster.proxy.disabled=true
# (see controlplane.patch.yaml), so Cilium provides BOTH the CNI and the kube-proxy replacement.
# kube-proxy replacement targets the apiserver via KubePrism, exposed on localhost:7445 on every
# Talos node. Sources: docs.siderolabs.com "Deploy Cilium CNI".
# Install as ArgoCD sync-wave "0" — nothing else schedules until the CNI is Ready.
ipam:
  mode: kubernetes               # use node PodCIDRs from kube-controller-manager
kubeProxyReplacement: true
k8sServiceHost: localhost        # KubePrism in-cluster apiserver endpoint on every Talos node
k8sServicePort: 7445
# Selected endpoints are default-deny in the selected direction. A cell still
# running Flannel must be rebuilt from the Talos+Cilium declaration, not converted
# in place or temporarily run with policy disabled.
policyEnforcementMode: default
operator:
  replicas: 1                      # single-node local cluster (ADR-0378): the default 2 replicas
                                   # cannot satisfy pod anti-affinity on one node (one stays Pending)
cgroup:
  autoMount:
    enabled: false               # Talos already mounts cgroup2; Cilium must not remount
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    # SYS_MODULE intentionally absent: Talos forbids workloads loading kernel modules.
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Hubble — eBPF L4 flow observability. ADR-0148 assigns flow observability to Cilium
# (Hubble is the source of truth at L4; Istio Ambient owns L7 telemetry). Relay + metrics
# are the production baseline (golden-signals INV-FOUR-GOLDEN-SIGNALS). UI is opt-in/heavier.
hubble:
  enabled: true
  relay:
    enabled: true
    # The default startupProbe timeoutSeconds=1 is too short on this single-node Talos
    # cluster: the gRPC health server on :4222 starts but the probe's 1s TCP+gRPC
    # handshake times out before the server accepts connections under node load,
    # causing 450+ restart-loop (exit 137 = OOMKill/SIGKILL from kubelet after probe
    # failure). Raise timeout to 5s and extend the failure window to 120s total
    # (failureThreshold=24 * period=5s) to survive transient startup contention.
    startupProbe:
      timeoutSeconds: 5
      failureThreshold: 24
      periodSeconds: 5
  metrics:
    enableOpenMetrics: true
    # Bootstrap runs before the observability stack installs the
    # monitoring.coreos.com/v1 ServiceMonitor CRD. Keep this disabled so the
    # CRS/Argo CD Day-1 path never emits a CR before its CRD exists.
    serviceMonitor:
      enabled: false
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,destination_ip,destination_namespace"

# Socket-level load balancing must stay in the HOST netns only, so that when Istio Ambient
# (ztunnel) is layered on the workload node pools, pod-originated connections are redirected
# THROUGH ztunnel instead of being short-circuited by Cilium's socket-LB before ztunnel sees
# them. Required for the ADR-0148 Cilium-L4 + Ambient-L7 zero-overlap layering.
# Ref: github.com/istio/istio/wiki/Troubleshooting-Istio-Ambient (bpf-lb-sock-hostns-only).
socketLB:
  hostNamespaceOnly: true
