# In-cluster Cloudflare Tunnel connector — secure control-plane access at k8s.oyatie.dev.
# Design: .omx/plans/cloudflare-controlplane-access.md (ADR-0371 pending).
#
# Architecture (preserves apiserver mTLS end-to-end):
#   Cloudflare Access (Zero Trust, Service Auth)  ->  Tunnel L4 TCP route  ->  apiserver mTLS
#   client:  cloudflared access tcp --hostname k8s.oyatie.dev --url 127.0.0.1:6443
#   kubeconfig server: https://127.0.0.1:6443   (existing client cert/key unchanged)
# cloudflared dials OUTBOUND only — no inbound ports, no public IP. An L7/HTTPS ingress is NOT
# used (it would terminate TLS at the edge and break client-cert auth).
#
# Cloudflare resources (created via the scoped token; non-secret IDs recorded here):
#   tunnel  : oyatie-k8s  id 9e043f73-4d7a-47a7-acdf-1663651cd4a8
#   zone    : oyatie.dev  id be68bf8425a5a3002127f96da68b946a
#   ingress : k8s.oyatie.dev -> tcp://10.211.55.240:6443  (apiserver VIP; set via API once cluster is up)
#
# TUNNEL_TOKEN is sourced from OpenBao/Keychain into the Secret below — NEVER committed. Create it at
# deploy time:
#   kubectl -n oya-cloudflared create secret generic cloudflared-token \
#     --from-literal=token="$(security find-generic-password -s oyatie-cf-tunnel-token -w)"
# (canonical: OpenBao secret/oyatie/cloudflare/tunnel-token via External Secrets — follow-up.)
apiVersion: v1
kind: Namespace
metadata:
  name: oya-cloudflared
  labels: { app.kubernetes.io/part-of: oya-substrate, oya.io/adr: ADR-0371 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: oya-cloudflared
  labels: { app.kubernetes.io/name: cloudflared }
spec:
  replicas: 2                       # HA: survive a node loss (anti-affinity spreads them)
  selector: { matchLabels: { app.kubernetes.io/name: cloudflared } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudflared }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app.kubernetes.io/name: cloudflared } }
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          # TODO before prod: digest-pin + verify signature (infra/kyverno require-signed-images).
          image: cloudflare/cloudflared:2026.7.3
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: token } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 5
            periodSeconds: 10
