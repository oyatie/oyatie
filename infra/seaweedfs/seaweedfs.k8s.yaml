# SeaweedFS-on-Talos — Oyatie's cluster-internal object-bucket substrate
# (ADR-0349 canonical; restored on Talos per ADR-0381 D4 after colima retirement).
# Speaks the industry-standard bucket-api wire protocol for tool interop
# (sccache, BuildKit, etc. consume it unchanged); the substrate is NOT AWS —
# we ship it.
#
# Hyperscaler-lens validation (per memory hyperscaler-lens-architectural-filter):
#   (a) Active upstream: chrislusf/seaweedfs ships frequent releases, large
#       community, Apache 2.
#   (b) License: Apache 2.
#   (c) Self-hostable: pure Go, single binary, runs anywhere — exactly what we
#       need.
#   (d) Hyperscaler-internal-equivalent: SeaweedFS is the OSS analogue of
#       S3/GCS/Blob — what cluster-internal object stores look like when you
#       build them yourself (Colossus, S3 internals, Azure Blob storage).
#
# Current compact cell topology: master + volume + filer + bucket-api gateway in
# one process; the bucket-api gateway is what SeaweedFS's CLI invokes via the
# `-s3` flag — that flag-name is SeaweedFS's own namespace and is unavoidable.
# ADR-0381 D2 storage-pool affinity is already encoded below, while the compact
# deployment remains the current Talos runtime shape until sibling Deployments
# (master, volume, filer, bucket-api gateway) are promoted through GitOps.
#
# Cluster-internal only (no Ingress / LoadBalancer). The bucket-api starts with
# explicit per-consumer credentials read from the `seaweedfs-s3-credentials`
# Secret; no static key material is stored in this manifest.
---
apiVersion: v1
kind: Namespace
metadata:
  name: oya-storage
  labels:
    oya.io/cell: storage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: oya-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: oya-storage
  labels:
    app: seaweedfs
    oya.adr/decided-by: ADR-0349
    oya.adr/restored-by: ADR-0381-D4
spec:
  replicas: 1
  strategy:
    type: Recreate   # single PVC RWO; cannot run two replicas concurrently
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # ADR-0381 D2 cell affinity: prefer the storage specialty pool when it
      # exists; soft preference (preferred… not required…) so single-node Talos
      # still schedules SeaweedFS. Toleration is no-op until the storage pool's
      # NoSchedule taint is applied (see infra/talos/local/patches/cell-storage.yaml).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/storage
                    operator: In
                    values: ["true"]
      tolerations:
        - key: dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.99
          # All-in-one: master + volume + filer + bucket-api gateway in one
          # process (`-s3` is SeaweedFS's CLI flag for the gateway — that
          # naming is its own namespace, not ours). The S3-compatible identity
          # file is generated at start from Kubernetes Secret keys, then passed
          # through SeaweedFS's static S3 config flag.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${SEAWEEDFS_S3_CI_CACHE_ACCESS_KEY:?missing ci-cache access key}"
              : "${SEAWEEDFS_S3_CI_CACHE_SECRET_KEY:?missing ci-cache secret key}"
              : "${SEAWEEDFS_S3_ADMIN_ACCESS_KEY:?missing admin access key}"
              : "${SEAWEEDFS_S3_ADMIN_SECRET_KEY:?missing admin secret key}"
              umask 077
              cat > /tmp/s3.json <<EOF
              {
                "identities": [
                  {
                    "name": "ci-cache",
                    "credentials": [
                      {
                        "accessKey": "${SEAWEEDFS_S3_CI_CACHE_ACCESS_KEY}",
                        "secretKey": "${SEAWEEDFS_S3_CI_CACHE_SECRET_KEY}"
                      }
                    ],
                    "actions": ["Read", "Write", "List", "Tagging"]
                  },
                  {
                    "name": "ops-admin",
                    "credentials": [
                      {
                        "accessKey": "${SEAWEEDFS_S3_ADMIN_ACCESS_KEY}",
                        "secretKey": "${SEAWEEDFS_S3_ADMIN_SECRET_KEY}"
                      }
                    ],
                    "actions": ["Admin", "Read", "Write", "List", "Tagging"]
                  }
                ]
              }
              EOF
              exec weed server \
                -dir=/data \
                -master.port=9333 \
                -master.volumeSizeLimitMB=1024 \
                -volume.port=8080 \
                -volume.max=50 \
                -filer \
                -filer.port=8888 \
                -s3 \
                -s3.port=8333 \
                -s3.config=/tmp/s3.json
          env:
            - name: SEAWEEDFS_S3_CI_CACHE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: ci-cache-access-key
                  optional: false
            - name: SEAWEEDFS_S3_CI_CACHE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: ci-cache-secret-key
                  optional: false
            - name: SEAWEEDFS_S3_ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: admin-access-key
                  optional: false
            - name: SEAWEEDFS_S3_ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-credentials
                  key: admin-secret-key
                  optional: false
          ports:
            - { containerPort: 9333, name: master }
            - { containerPort: 8080, name: volume }
            - { containerPort: 8888, name: filer }
            - { containerPort: 8333, name: bucket-api }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-bucket-api-ingress
  namespace: oya-storage
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              oya.io/seaweedfs-client: "true"
      ports:
        - protocol: TCP
          port: 8333
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9333
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8888
---
# One Service per port — clients pick the one they need (BuildKit cache and
# sccache both consume the bucket-api; filer for blob storage; master for
# cluster ops).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: master, port: 9333, targetPort: 9333 }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: volume, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: filer, port: 8888, targetPort: 8888 }]
---
# Primary consumer surface: the object-bucket API for BuildKit cache, sccache,
# artifact storage. Address:
#   seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333
# The wire protocol is the industry-standard object-bucket API (consumed
# unchanged by sccache + BuildKit). We name OUR Service for the substrate
# role it plays (bucket-api on SeaweedFS), not for the AWS product whose name
# the protocol is often shorthand for — Oyatie does not consume AWS
# (ADR-0381 amendment 3, hyperscaler-lens-architectural-filter).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-bucket-api
  namespace: oya-storage
  labels:
    oya.surface/object-bucket-api: "true"
spec:
  selector:
    app: seaweedfs
  ports: [{ name: bucket-api, port: 8333, targetPort: 8333 }]
