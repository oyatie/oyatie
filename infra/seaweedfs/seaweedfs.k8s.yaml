# SeaweedFS-on-Talos — Oyatie's cluster-internal S3-API-compatible object store
# (ADR-0349 canonical; restored on Talos per ADR-0381 D4 after colima retirement).
#
# Hyperscaler-lens validation (per memory hyperscaler-lens-architectural-filter):
#   (a) Active upstream: chrislusf/seaweedfs ships frequent releases, large
#       community, Apache 2.
#   (b) License: Apache 2.
#   (c) Self-hostable: pure Go, single binary, runs anywhere — exactly what we
#       need.
#   (d) Hyperscaler-internal-equivalent: SeaweedFS is the OSS analogue of
#       S3/GCS/Blob — what cluster-internal object stores look like when you
#       build them yourself (Colossus, S3 internals, Azure Blob storage).
#
# Single-pod all-in-one MVP (master + volume + filer + s3 in one process; runs
# fine on the current single-node Talos). When ADR-0381 D2 lands the storage
# specialty pool, this Deployment splits into 4 sibling Deployments (master,
# volume, filer, s3 gateway) and is node-pinned via:
#   nodeSelector: { oya.cell/storage: "true" }
#   tolerations: [{ key: dedicated, operator: Equal, value: storage, effect: NoSchedule }]
#
# Cluster-internal only (no Ingress / LoadBalancer); S3 anonymous-access MVP.
# Auth (identities.json with explicit credentials per consumer — BuildKit cache,
# sccache, registry overlay) is a hardening follow-on once Cilium L3/L4 cell
# boundaries (ADR-0381 D3) are also live.
---
apiVersion: v1
kind: Namespace
metadata:
  name: oya-storage
  labels:
    oya.io/cell: storage
    # Image runs as root by default; baseline (NOT restricted) profile until the
    # rootless image build per ADR-0381 D2 pool isolation lands.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: oya-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: oya-storage
  labels:
    app: seaweedfs
    oya.adr/decided-by: ADR-0349
    oya.adr/restored-by: ADR-0381-D4
spec:
  replicas: 1
  strategy:
    type: Recreate   # single PVC RWO; cannot run two replicas concurrently
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      # ADR-0381 D2 cell affinity: prefer the storage specialty pool when it
      # exists; soft preference (preferred… not required…) so single-node Talos
      # still schedules SeaweedFS. Toleration is no-op until the storage pool's
      # NoSchedule taint is applied (see infra/talos/local/patches/cell-storage.yaml).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/storage
                    operator: In
                    values: ["true"]
      tolerations:
        - key: dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.79
          # All-in-one: master + volume + filer + s3 in one process. Production
          # splits into 4 Deployments onto the storage specialty pool (ADR-0381 D2).
          command: ["weed"]
          args:
            - "server"
            - "-dir=/data"
            - "-master.port=9333"
            - "-master.volumeSizeLimitMB=1024"
            - "-volume.port=8080"
            - "-volume.max=10"
            - "-filer"
            - "-filer.port=8888"
            - "-s3"
            - "-s3.port=8333"
          ports:
            - { containerPort: 9333, name: master }
            - { containerPort: 8080, name: volume }
            - { containerPort: 8888, name: filer }
            - { containerPort: 8333, name: s3 }
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
# One Service per port — clients pick the one they need (BuildKit s3,
# sccache s3, filer for blob storage, master for cluster ops).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: master, port: 9333, targetPort: 9333 }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: volume, port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: oya-storage
spec:
  selector:
    app: seaweedfs
  ports: [{ name: filer, port: 8888, targetPort: 8888 }]
---
# Primary consumer surface: S3 endpoint for BuildKit cache, sccache, artifact
# storage. Address: seaweedfs-s3.oya-storage.svc.cluster.local:8333
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: oya-storage
  labels:
    oya.surface/s3-api: "true"
spec:
  selector:
    app: seaweedfs
  ports: [{ name: s3, port: 8333, targetPort: 8333 }]
