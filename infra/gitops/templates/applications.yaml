{{- /* One Argo CD Application per entry in .Values.apps. Helm-first app-of-apps. */ -}}
{{- range .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  {{ if .cascadeDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{ end }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .syncWave | default "1" | quote }}
  labels:
    oya.io/cell: {{ $.Values.cell | quote }}
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  {{- if eq .type "chart" }}
    {{- if .valueFiles }}
  sources:                                  {{/* multi-source: chart + in-repo values */}}
    - repoURL: {{ .repoURL }}
      chart: {{ .chart }}
      targetRevision: {{ .targetRevision }}
      helm:
        valueFiles:
          {{- range .valueFiles }}
          - $values/{{ . }}
          {{- end }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision }}
      ref: values
    {{- else }}
  source:
    repoURL: {{ .repoURL }}
    chart: {{ .chart }}
    targetRevision: {{ .targetRevision }}
    {{- with .values }}
    helm:
      valuesObject:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
  {{- else }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    path: {{ .path }}
    {{- if .helmPath }}
    helm: {}
    {{- end }}
    {{- with .include }}
    directory:
      include: {{ . | quote }}
    {{- end }}
  {{- end }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideApply: large CRDs (kyverno/kubewarden/istio/external-secrets) exceed
    # the 256KB client-side last-applied-config annotation limit; SSA avoids it.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
{{- end }}
