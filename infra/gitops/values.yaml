# Per-cell app-of-apps values. Argo CD on each cell renders this chart; override `cell`/`repoURL`
# per cluster (ApplicationSet/CRS injects them, or a per-cell values file).
repoURL: https://github.com/jason931225/oyatie   # bootstrap source; flips to Forgejo post-cutover (ADR-0247)
targetRevision: dev
cell: control-plane                                         # overridden per spoke (eu/jp/kr/...)

# Each app -> one Argo CD Application. type=path (in-repo manifests) or type=chart (Helm repo).
apps:
  - name: kyverno
    type: chart
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.1
    namespace: kyverno
    syncWave: "0"

  # Istio Ambient L7 (ADR-0148) — the full 4-chart set, not a stub. ztunnel/waypoints land on
  # workload pools; istiod on the system pool. syncWave 0 (base CRDs) -> 1 (istiod) -> 2 (cni/ztunnel).
  - name: istio-base
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.0
    namespace: istio-system
    syncWave: "0"
  - name: istiod
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.0
    namespace: istio-system
    values: { profile: ambient }
    syncWave: "1"
  - name: istio-cni
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.0
    namespace: istio-system
    values: { profile: ambient }
    syncWave: "1"
  - name: ztunnel
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.30.0
    namespace: istio-system
    syncWave: "2"

  - name: forgejo
    type: path
    path: infra/forge
    include: forgejo.yaml
    namespace: oya-forge
    syncWave: "1"

  - name: openbao
    type: path
    path: infra/kms
    include: openbao.k8s.yaml
    namespace: oya-kms
    syncWave: "1"

  - name: jenkins
    type: chart
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: 5.9.22
    namespace: oya-ci
    valueFiles: [infra/ci/jenkins/values-local.yaml]
    syncWave: "2"

  - name: observability
    type: path
    path: microservices/observability/iac/helm/observability   # local helm chart
    helmPath: true
    namespace: observability
    syncWave: "2"
