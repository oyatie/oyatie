# Per-cell app-of-apps values. Argo CD on each cell renders this chart; override `cell`/`repoURL`
# per cluster (ApplicationSet/CRS injects them, or a per-cell values file).
repoURL: https://github.com/jason931225/oyatie   # bootstrap source; flips to GitHub post-cutover (ADR-0247)
targetRevision: dev
cell: control-plane                                         # overridden per spoke (eu/jp/kr/...)

# Each app -> one Argo CD Application. type=path (in-repo manifests) or type=chart (Helm repo).
apps:
  # Cilium L3/L4 (ADR-0148). CRS bootstraps Cilium ApplyOnce at cluster provision;
  # Argo CD takes ownership for ongoing lifecycle (drift detection, CVE rollforward,
  # version bumps via PR — the original ADR-0148 amendment 1.16→1.19 was driven by
  # an EOL trap that this lifecycle path closes). Same chart + same values file as the
  # CRS bootstrap, so first reconcile is a no-op.
  - name: cilium
    type: chart
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.19.4
    namespace: kube-system
    valueFiles: [infra/talos/cilium-values.yaml]
    syncWave: "0"

  # Kubewarden — the DEFAULT Kubernetes admission/policy substrate (specs +
  # ADR-0379 superseding ADR-0183). Policies are Rust->WASM modules, aligning with
  # ADR-0023 (Wasmtime server-side WASM) + the Rust-everywhere stack. Kyverno
  # (infra/kyverno/) remains a first-class adapter, NOT base-deployed.
  # crds (wave 0) -> controller (1) -> defaults: policy-server + recommended policies (2).
  - name: kubewarden-crds
    type: chart
    repoURL: https://charts.kubewarden.io
    chart: kubewarden-crds
    targetRevision: 1.27.0
    namespace: kubewarden
    syncWave: "0"
  - name: kubewarden-controller
    type: chart
    repoURL: https://charts.kubewarden.io
    chart: kubewarden-controller
    targetRevision: 5.13.0
    namespace: kubewarden
    syncWave: "1"
  - name: kubewarden-defaults
    type: chart
    repoURL: https://charts.kubewarden.io
    chart: kubewarden-defaults
    targetRevision: 3.13.0
    namespace: kubewarden
    syncWave: "2"

  # Istio Ambient L7 (ADR-0148) — the full 4-chart set, not a stub. ztunnel/waypoints land on
  # workload pools; istiod on the system pool. syncWave 0 (base CRDs) -> 1 (istiod) -> 2 (cni/ztunnel).
  - name: istio-base
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.0
    namespace: istio-system
    syncWave: "0"
  - name: istiod
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.0
    namespace: istio-system
    values: { profile: ambient }
    syncWave: "1"
  - name: istio-cni
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.0
    namespace: istio-system
    values: { profile: ambient }
    syncWave: "1"
  - name: ztunnel
    type: chart
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.30.0
    namespace: istio-system
    syncWave: "2"

  - name: github
    type: path
    path: infra/gitops
    include: vcs-substrate.yaml
    namespace: oya-forge
    syncWave: "1"

  - name: openbao
    type: path
    path: infra/kms
    include: openbao.k8s.yaml
    namespace: oya-kms
    syncWave: "1"

  # External Secrets Operator — projects OpenBao secrets (sref://openbao/...) into
  # workload namespaces (e.g. the CI webhook gateway's HMAC secret, ADR-0043/0374).
  - name: external-secrets
    type: chart
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.5.0
    namespace: external-secrets
    values: { installCRDs: true }
    syncWave: "1"

  # ARC controller — reconciles AutoscalingRunnerSet CRs into ephemeral runner
  # pods. Holds no GitHub credential itself; each scale set references its own
  # githubConfigSecret. ADR-0630.
  - name: arc
    type: chart
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.2
    namespace: arc-systems
    valueFiles: [infra/arc/controller-values.yaml]
    syncWave: "1"

  # Owned CI runner fleet, ONE SCALE SET PER ARCHITECTURE (ADR-0630 D2). An
  # amd64 box joining the cluster adds a sibling entry + values file; it never
  # edits a workflow. Depends on the controller above, hence the later syncWave.
  - name: oya-arm64
    type: chart
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    namespace: arc-runners
    valueFiles: [infra/arc/runner-scale-set-arm64-values.yaml]
    syncWave: "2"

  # Dedicated one-job/one-PostgreSQL-Pod cell for required live-data tests.
  # It deliberately does not inherit the general runner's environment and has
  # no Secret or hostname reference to the shared CNPG data plane.
  - name: oya-live-postgres-arm64
    type: chart
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    namespace: arc-runners
    valueFiles: [infra/arc/runner-scale-set-live-postgres-arm64-values.yaml]
    syncWave: "2"

  - name: oya-live-postgres-network-policy
    type: path
    path: infra/arc
    include: live-postgres-runner-network-policy.yaml
    namespace: arc-runners
    # Establish both ingress and shared-data egress boundaries before either
    # wave-2 runner scale set can create newly labelled Pods.
    syncWave: "1"

  # In-cluster OCI registry (registry:2) — image target for in-cluster builds
  # (gateway + future microservice images); host docker is retired (ADR-0378).
  - name: registry
    type: path
    path: infra/registry
    include: registry.k8s.yaml
    namespace: oya-registry
    syncWave: "1"

  # SeaweedFS (Apache 2; ADR-0349 canonical) — Oyatie's cluster-internal
  # object-bucket substrate, restored on Talos per ADR-0381 D4. Speaks the
  # S3 wire protocol for tool interop; the substrate is NOT AWS. Serves:
  # BuildKit cache (ADR-0381 D1 cache backend wires here once Deployed);
  # CI agent sccache (the deferred half of ADR-0380 D6); artifact overlay.
  # Single-pod all-in-one MVP; splits into 4 Deployments onto the storage
  # specialty pool when ADR-0381 D2 lands.
  - name: seaweedfs
    type: path
    path: infra/seaweedfs
    include: seaweedfs.k8s.yaml
    namespace: oya-storage
    syncWave: "1"

  # cloud-intelligence microservice — agent-dispatch reverse proxy with OpenBao-bound
  # provider keys (per microservices/cloud-intelligence/PRD.md). Kernel + rest adapter
  # + app are Rust-implemented (~5,600 LOC + 30 tests across the 3 crates).
  # The image is BuildKit-built via the operator-run Job (see
  # microservices/cloud-intelligence/k8s/BUILDKIT-JOB-TEMPLATE.md); the Deployment
  # references it at registry.oya-registry.svc.cluster.local:5000/cloud-intelligence:dev.
  - name: cloud-intelligence
    type: path
    path: microservices/cloud-intelligence/k8s
    namespace: oya-cloud-intelligence
    syncWave: "2"

  # Cell-boundary NetworkPolicies (ADR-0381 D3). First boundary: oya-storage
  # ingress restricted to the CI cell + ArgoCD + same-namespace. Cilium L3/L4
  # (ADR-0148) enforces. Sibling boundaries (ci/tenant/foundation) follow as
  # additional files in infra/cilium/cell-boundaries/. syncWave 2 — applied
  # AFTER seaweedfs (1) so the pods exist when the policy attaches.
  - name: cell-boundaries
    type: path
    path: infra/cilium/cell-boundaries
    namespace: oya-storage
    syncWave: "2"

  # jenkins: was bootstrap-managed by bring-up.sh (now deleted per ADR-0515 D3).
  # The CI substrate (cilium/github) is managed declaratively via bootstrap-sync.yaml;
  # ArgoCD owns the full platform stack above it. Jenkins is dropped (ADR-0515:
  # jenkins=drop-now; GitHub Actions is the sole CI authority).

  - name: observability
    type: path
    # The umbrella chart with a Chart.yaml lives at iac/k8s/helm (the
    # iac/helm/observability path has only templates/, no Chart.yaml, so
    # `helm template` fails on it). Per-backend subcharts (clickhouse/loki/
    # mimir/grafana/tempo/...) live under iac/helm/<backend> and are pulled in
    # by this umbrella chart's dependencies.
    path: microservices/observability/iac/k8s/helm   # local helm chart (has Chart.yaml)
    helmPath: true
    namespace: observability
    syncWave: "2"
