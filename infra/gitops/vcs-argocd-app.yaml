# ArgoCD Application — GitOps management of the GitHub (interim) VCS substrate
# (ADR-0363 / ADR-0247). ArgoCD reconciles infra/gitops/vcs-substrate.yaml from
# git so the VCS substrate itself is declaratively managed like every other workload.
# Relocated from infra/forge per ADR-0515 D3 (declarative gitops; no shell bring-up).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oya-vcs-substrate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie.git   # bootstrap host (ADR-0247); migrates to GitHub (interim)
    targetRevision: dev
    path: infra/gitops
    directory:
      include: 'vcs-substrate.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: oya-forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
