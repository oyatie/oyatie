# TEMPLATE — GitHub Commit Status API credential for the CI pipeline.
# DO NOT commit a real token (gitleaks blocks it; the lane runs gitleaks).
# The kubernetes-credentials-provider plugin syncs this labelled Secret into a
# Jenkins string credential with id `github-ci-token`, which the CI lane uses
# to POST the branch-protection required status contexts.
#
# Relocated from infra/forge per ADR-0515 D3 (declarative gitops; no shell).
#
# Create the real secret in-cluster (token from:
#   github admin user generate-access-token --username oya-admin \
#     --token-name ci-token --scopes write:repository --raw ):
#
#   kubectl -n oya-ci create secret generic github-ci-token \
#     --from-literal=text='<REAL_TOKEN>' \
#     --dry-run=client -o yaml \
#   | kubectl label --local -f - -o yaml \
#       jenkins.io/credentials-type=secretText \
#   | kubectl annotate --local -f - -o yaml \
#       jenkins.io/credentials-description='GitHub commit-status token (ADR-0363)' \
#   | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: github-ci-token
  namespace: oya-ci
  labels:
    jenkins.io/credentials-type: secretText
  annotations:
    jenkins.io/credentials-description: GitHub commit-status token (ADR-0363)
type: Opaque
stringData:
  text: REPLACE_VIA_KUBECTL_DO_NOT_COMMIT_REAL_TOKEN
