apiVersion: v2
name: platform
description: >-
  App-of-apps Helm chart — generates the Argo CD Application set for a cell's platform stack.
  Helm-first delivery (ADR/fleet-delivery-stack). Cilium + Argo CD are NOT here — they are
  bootstrapped per cluster by the CAPI ClusterResourceSet (infra/capi/crs/). This chart is
  reconciled by the per-cell Argo CD root app (infra/gitops/root-app.yaml).
type: application
version: 0.1.0
appVersion: "0.1.0"
