# Declarative bootstrap app-of-apps sync — replaces infra/talos/local/bring-up.sh
# per ADR-0515 D3 (no shell; declarative gitops). ArgoCD reconciles the full
# local substrate stack (CNI -> storage -> VCS -> CI) by syncing this Application
# set in wave order. CAPI ClusterResourceSet bootstraps ArgoCD itself; after that,
# this manifest is the one authoritative bring-up declaration.
#
# To apply on a freshly-bootstrapped Talos cell (after ArgoCD is running):
#   kubectl apply -f infra/gitops/bootstrap-sync.yaml
# ArgoCD then syncs every downstream Application in wave order — no shell required.
#
# Wave ordering mirrors the former bring-up.sh sequence:
#   wave -10  root app-of-apps (self-referential; already running post-bootstrap)
#   wave  0   CNI (Cilium) + storage (local-path-provisioner)
#   wave  1   VCS substrate (GitHub interim)
#   wave  2   CI (ci) + observability
#
# Storage: the local-path-provisioner bootstrap is handled by the Talos
# ClusterResourceSet (infra/capi/crs/). Cilium is wired via infra/gitops/values.yaml.
# This file adds the local-dev-only local-path override Application for cells that
# need the Talos-adapted /var path (production cells use the CSI driver instead).
---
# Local-path storage (Talos-adapted). Talos /opt is read-only; provision under /var.
# PodSecurity=baseline forbids the provisioner's helper pod (hostPath) — its
# namespace is labelled pod-security=privileged by the manifest below.
# Only deployed on local/dev cells; production cells use the region CSI driver.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    oya.io/cell: local
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie
    targetRevision: dev
    path: infra/gitops
    directory:
      include: 'local-path-storage.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# VCS substrate (GitHub interim, ADR-0363). Synced after storage (wave 1)
# so the PVC StorageClass exists before the github-data PVC is created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcs-substrate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    oya.io/cell: local
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie
    targetRevision: dev
    path: infra/gitops
    directory:
      include: 'vcs-substrate.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
