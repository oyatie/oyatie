# Per-cell app-of-apps root. Argo CD (bootstrapped on each cell by the CAPI ClusterResourceSet)
# reconciles this; it renders the oya-platform Helm chart -> the cell's Argo CD Applications.
# Source = GitHub at bootstrap; flips to GitHub post-cutover (ADR-0247). Per-cell config via
# helm.values overrides (cell name, etc.) — defaults to the control plane.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie
    targetRevision: dev
    path: infra/gitops
    helm:
      valuesObject:
        cell: control-plane            # spokes override: eu / jp / kr / ksa / us / us-gov / uae
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
