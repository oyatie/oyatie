# Self-hosted Forgejo — the change-coordination substrate per ADR-0363.
# Forgejo is GPLv3+ (OSI-clean; not BSL/SSPL). Single-replica + SQLite is
# sufficient for the dogfood farm; the PVC holds repos + db. This is the
# T1 substrate-realization standup: native PRs, branch protection with
# required status checks (Jenkins -> Forgejo Commit Status API), webhooks,
# and auto-merge — which together retire the enforce_admins-toggle seam.
apiVersion: v1
kind: Namespace
metadata:
  name: oya-forge
  labels:
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0363
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: oya-forge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: oya-forge
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO PVC — never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:11-rootless
          imagePullPolicy: IfNotPresent
          env:
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__server__ROOT_URL
              value: http://forgejo.oya-forge.svc.cluster.local:3000/
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__webhook__ALLOWED_HOST_LIST
              value: "*.cluster.local,oya-ci-jenkins"
          ports:
            - { name: http, containerPort: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: oya-forge
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - { name: http, port: 3000, targetPort: http }
