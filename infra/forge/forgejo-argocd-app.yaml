# ArgoCD Application — GitOps management of the self-hosted Forgejo substrate
# (ADR-0363 / ADR-0247). ArgoCD reconciles infra/forge/forgejo.yaml from git so
# the forge itself is declaratively managed like every other workload.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oya-forge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie.git   # bootstrap host (ADR-0247); migrates to self-hosted Forgejo
    targetRevision: dev
    path: infra/forge
    directory:
      include: 'forgejo.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: oya-forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
