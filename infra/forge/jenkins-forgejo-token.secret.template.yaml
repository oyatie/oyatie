# TEMPLATE — Jenkins string credential for the Forgejo Commit Status API.
# DO NOT commit a real token (gitleaks blocks it; the lane runs gitleaks).
# The kubernetes-credentials-provider plugin syncs this labelled Secret into a
# Jenkins string credential with id `forgejo-ci-token`, which oyaCiLane.groovy
# uses to POST the branch-protection required status contexts.
#
# Create the real secret in-cluster (token from:
#   forgejo admin user generate-access-token --username oya-admin \
#     --token-name jenkins-ci --scopes write:repository --raw ):
#
#   kubectl -n oya-ci-jenkins create secret generic forgejo-ci-token \
#     --from-literal=text='<REAL_TOKEN>' \
#     --dry-run=client -o yaml \
#   | kubectl label --local -f - -o yaml \
#       jenkins.io/credentials-type=secretText \
#   | kubectl annotate --local -f - -o yaml \
#       jenkins.io/credentials-description='Forgejo commit-status token (ADR-0363)' \
#   | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-ci-token
  namespace: oya-ci-jenkins
  labels:
    jenkins.io/credentials-type: secretText
  annotations:
    jenkins.io/credentials-description: Forgejo commit-status token (ADR-0363)
type: Opaque
stringData:
  text: REPLACE_VIA_KUBECTL_DO_NOT_COMMIT_REAL_TOKEN
