# clusterctl config — Cluster API provider pins for the Oyatie fleet.
# Use: CLUSTERCTL_CONFIG=infra/capi/clusterctl.yaml clusterctl init ...
#
# The Talos bootstrap/control-plane providers are NOT in clusterctl's built-in list, so they
# are declared here with their release component URLs. Infra providers (oci, metal3, aws) ARE
# built-in to clusterctl and are selected via `--infrastructure` at init time.
#
# Versions (verified 2026-05-26 — see talos-substrate-doctrine memory / research):
#   CAPI core         v1.13.x
#   CABPT (bootstrap) v0.6.12 stable (v1beta1) — v0.7.x alpha for v1beta2/ClusterClass
#   CACPPT (cp)       v0.5.13
#   CAPOCI (oci)      v0.24.0
#   CAPM3 (metal3)    v1.13.0
providers:
  - name: talos
    # GitHub release-asset URL MUST include /download/ (the /releases/<tag>/<asset>
    # form 404s and clusterctl init fails to fetch the provider components).
    url: https://github.com/siderolabs/cluster-api-bootstrap-provider-talos/releases/download/v0.6.12/bootstrap-components.yaml
    type: BootstrapProvider
  - name: talos
    url: https://github.com/siderolabs/cluster-api-control-plane-provider-talos/releases/download/v0.5.13/control-plane-components.yaml
    type: ControlPlaneProvider
