# Metal3 spoke cell — CAPI Cluster (CAPM3/Ironic infra + Talos providers) for on-prem/colo bare
# metal with BMC (Redfish/IPMI). Servers register as BareMetalHosts (Ironic inspects via BMC);
# CAPM3 provisions them with the Talos image. Fill ${PLACEHOLDERS}; cni:none + Cilium-via-CRS.
# Prereq: BareMetalHost CRs registered in Ironic (BMC creds + boot MAC) — separate from this file.
# Replace ${CELL}, ${TALOS_IMAGE_URL} (Talos metal image served to Ironic), ${IMAGE_CHECKSUM}.
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: oya-${CELL}
  namespace: default
  labels:
    oya.io/cell: "${CELL}"
    oya.io/substrate: metal3
    oya.io/bootstrap: "true"
spec:
  clusterNetwork:
    pods: { cidrBlocks: ["10.244.0.0/16"] }
    services: { cidrBlocks: ["10.96.0.0/12"] }
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
    kind: TalosControlPlane
    name: oya-${CELL}-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: Metal3Cluster
    name: oya-${CELL}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3Cluster
metadata:
  name: oya-${CELL}
  namespace: default
spec:
  controlPlaneEndpoint: { host: "${CP_VIP}", port: 6443 }   # VIP across the CP BareMetalHosts
  noCloudProvider: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: oya-${CELL}-cp
  namespace: default
spec:
  replicas: 3
  version: v1.36.1
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: Metal3MachineTemplate
    name: oya-${CELL}-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      configPatches:
        - { op: add, path: /cluster/network/cni, value: { name: none } }
        - { op: add, path: /cluster/proxy, value: { disabled: true } }
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: oya-${CELL}-cp
  namespace: default
spec:
  template:
    spec:
      image:
        url: "${TALOS_IMAGE_URL}"
        checksum: "${IMAGE_CHECKSUM}"
        format: raw
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  clusterName: oya-${CELL}
  replicas: 2
  selector: { matchLabels: {} }
  template:
    spec:
      clusterName: oya-${CELL}
      version: v1.36.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: oya-${CELL}-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        name: oya-${CELL}-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  template:
    spec:
      image:
        url: "${TALOS_IMAGE_URL}"     # Kata/CLH-baked Talos metal image
        checksum: "${IMAGE_CHECKSUM}"
        format: raw
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      configPatches:
        - { op: add, path: /machine/nodeLabels, value: { "katacontainers.io/kata-runtime": "true" } }
        - { op: add, path: /machine/kernel, value: { modules: [{ name: vhost_net }, { name: vhost_vsock }] } }
