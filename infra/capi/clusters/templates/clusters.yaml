{{- $d := .Values.defaults -}}
{{- range .Values.cells }}
{{- $name := printf "oya-%s" .name -}}
{{- $ns := .namespace | default $d.namespace -}}
{{- $infraApi := include "spoke.infraApiVersion" . -}}
{{- $infraCluster := include "spoke.infraClusterKind" . -}}
{{- $infraMT := include "spoke.infraMachineTemplateKind" . -}}
{{- $ver := .kubernetesVersion | default $d.kubernetesVersion -}}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    oya.io/cell: {{ .name | quote }}
    oya.io/substrate: {{ .substrate | quote }}
    oya.io/bootstrap: "true"            # triggers the CRS (Cilium + Argo CD)
spec:
  clusterNetwork:
    pods: { cidrBlocks: {{ $d.clusterNetwork.pods | toJson }} }
    services: { cidrBlocks: {{ $d.clusterNetwork.services | toJson }} }
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
    kind: TalosControlPlane
    name: {{ $name }}-cp
  infrastructureRef:
    apiVersion: {{ $infraApi }}
    kind: {{ $infraCluster }}
    name: {{ $name }}
---
apiVersion: {{ $infraApi }}
kind: {{ $infraCluster }}
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  {{- if eq .substrate "oci" }}
  compartmentId: {{ required (printf "cell %s: oci.compartmentId is required" .name) .oci.compartmentId | quote }}
  region: {{ required (printf "cell %s: oci.region is required" .name) .oci.region | quote }}
  {{- else if eq .substrate "aws" }}
  region: {{ required (printf "cell %s: aws.region is required" .name) .aws.region | quote }}
  sshKeyName: {{ required (printf "cell %s: aws.sshKeyName is required" .name) .aws.sshKeyName | quote }}
  {{- else if eq .substrate "metal3" }}
  controlPlaneEndpoint: { host: {{ required (printf "cell %s: metal3.controlPlaneVip is required" .name) .metal3.controlPlaneVip | quote }}, port: 6443 }
  noCloudProvider: true
  {{- end }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ $name }}-cp
  namespace: {{ $ns }}
spec:
  replicas: {{ dig "controlPlane" "replicas" $d.controlPlane.replicas . }}
  version: {{ $ver }}
  infrastructureTemplate:
    apiVersion: {{ $infraApi }}
    kind: {{ $infraMT }}
    name: {{ $name }}-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      configPatches:
        - { op: add, path: /cluster/network/cni, value: { name: none } }     # Cilium via CRS
        - { op: add, path: /cluster/proxy, value: { disabled: true } }
        # Kata-baked Talos installer image: without this the on-disk Talos is vanilla
        # and the `katacontainers.io/kata-runtime` worker label has no runtime to bind
        # to — ADR-0147/0338 RuntimeClass scheduling would silently fail on every spoke.
        - { op: add, path: /machine/install/image, value: {{ $d.kataInstallerImage | quote }} }
        # Argo CD CRDs land here (Talos fetches each URL at bootstrap) — they are too
        # large for the CRS ConfigMap path (render.sh ships controllers only). This is
        # what lets the Reconcile CRS root-Application apply succeed on the spoke.
        {{- with $d.argocdCrdManifests }}
        - { op: add, path: /cluster/extraManifests, value: {{ . | toJson }} }
        {{- end }}
---
apiVersion: {{ $infraApi }}
kind: {{ $infraMT }}
metadata:
  name: {{ $name }}-cp
  namespace: {{ $ns }}
spec:
  template:
    spec:
      {{- if eq .substrate "oci" }}
      imageId: {{ required (printf "cell %s: oci.imageId is required" .name) .oci.imageId | quote }}
      shape: {{ required (printf "cell %s: oci.cpShape is required" .name) .oci.cpShape | quote }}
      shapeConfig: { ocpus: "4", memoryInGBs: "16" }
      {{- else if eq .substrate "aws" }}
      ami: { id: {{ required (printf "cell %s: aws.ami is required" .name) .aws.ami | quote }} }
      instanceType: {{ required (printf "cell %s: aws.cpInstanceType is required" .name) .aws.cpInstanceType | quote }}
      sshKeyName: {{ .aws.sshKeyName | quote }}
      {{- else if eq .substrate "metal3" }}
      image:
        url: {{ required (printf "cell %s: metal3.imageUrl is required" .name) .metal3.imageUrl | quote }}
        checksum: {{ required (printf "cell %s: metal3.imageChecksum is required" .name) .metal3.imageChecksum | quote }}
        format: raw
      {{- end }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $name }}-workers
  namespace: {{ $ns }}
spec:
  clusterName: {{ $name }}
  replicas: {{ dig "workers" "replicas" $d.workers.replicas . }}
  # Scope the selector + template labels to THIS cluster. An empty selector matches
  # every MachineSet in the namespace, so co-located cells' MachineDeployments would
  # adopt each other's MachineSets (scale fights / orphaned Machines).
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $name }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $name }}
    spec:
      clusterName: {{ $name }}
      version: {{ $ver }}
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: {{ $name }}-workers
      infrastructureRef:
        apiVersion: {{ $infraApi }}
        kind: {{ $infraMT }}
        name: {{ $name }}-workers
---
apiVersion: {{ $infraApi }}
kind: {{ $infraMT }}
metadata:
  name: {{ $name }}-workers
  namespace: {{ $ns }}
spec:
  template:
    spec:
      {{- if eq .substrate "oci" }}
      imageId: {{ .oci.imageId | quote }}              # Kata/CLH-baked Talos image for tenant workloads
      shape: {{ required (printf "cell %s: oci.workerShape is required" .name) .oci.workerShape | quote }}
      shapeConfig: { ocpus: "8", memoryInGBs: "32" }
      {{- else if eq .substrate "aws" }}
      ami: { id: {{ .aws.ami | quote }} }
      instanceType: {{ required (printf "cell %s: aws.workerInstanceType is required" .name) .aws.workerInstanceType | quote }}
      sshKeyName: {{ .aws.sshKeyName | quote }}
      {{- else if eq .substrate "metal3" }}
      image:
        url: {{ .metal3.imageUrl | quote }}            # Kata/CLH-baked Talos metal image
        checksum: {{ .metal3.imageChecksum | quote }}
        format: raw
      {{- end }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ $name }}-workers
  namespace: {{ $ns }}
spec:
  template:
    spec:
      generateType: worker
      configPatches:
        - { op: add, path: /machine/nodeLabels, value: { "katacontainers.io/kata-runtime": "true" } }   # Kata pool (ADR-0147/0338)
        - { op: add, path: /machine/kernel, value: { modules: [{ name: vhost_net }, { name: vhost_vsock }] } }
        # Same Kata-baked installer image as the control plane: on-disk Talos must carry
        # the Kata Containers extension for the kata-runtime label above to be operational.
        - { op: add, path: /machine/install/image, value: {{ $d.kataInstallerImage | quote }} }
{{ end }}
