# AWS spoke cell — CAPI Cluster (CAPA infra + Talos providers). Unmanaged EC2 (NOT EKS) — Talos
# owns the control plane. Fill ${PLACEHOLDERS}; git-commit; CAPI reconciles. cni:none + Cilium-via-CRS.
# Replace ${CELL}, ${REGION} (aws region), ${SSH_KEY}, ${CP_INSTANCE_TYPE}/${WORKER_INSTANCE_TYPE},
# ${TALOS_AMI} (Talos AMI for the region — see factory.talos.dev / talosctl aws image).
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: oya-${CELL}
  namespace: default
  labels:
    oya.io/cell: "${CELL}"
    oya.io/substrate: aws
    oya.io/bootstrap: "true"
spec:
  clusterNetwork:
    pods: { cidrBlocks: ["10.244.0.0/16"] }
    services: { cidrBlocks: ["10.96.0.0/12"] }
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
    kind: TalosControlPlane
    name: oya-${CELL}-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSCluster
    name: oya-${CELL}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: oya-${CELL}
  namespace: default
spec:
  region: "${REGION}"
  sshKeyName: "${SSH_KEY}"
  # network: let CAPA create the VPC, or reference an existing one.
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: oya-${CELL}-cp
  namespace: default
spec:
  replicas: 3
  version: v1.36.1
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSMachineTemplate
    name: oya-${CELL}-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      configPatches:
        - { op: add, path: /cluster/network/cni, value: { name: none } }
        - { op: add, path: /cluster/proxy, value: { disabled: true } }
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: oya-${CELL}-cp
  namespace: default
spec:
  template:
    spec:
      ami: { id: "${TALOS_AMI}" }
      instanceType: "${CP_INSTANCE_TYPE}"
      sshKeyName: "${SSH_KEY}"
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  clusterName: oya-${CELL}
  replicas: 2
  selector: { matchLabels: {} }
  template:
    spec:
      clusterName: oya-${CELL}
      version: v1.36.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: oya-${CELL}-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachineTemplate
        name: oya-${CELL}-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachineTemplate
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  template:
    spec:
      ami: { id: "${TALOS_AMI}" }
      instanceType: "${WORKER_INSTANCE_TYPE}"
      sshKeyName: "${SSH_KEY}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: oya-${CELL}-workers
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      configPatches:
        - { op: add, path: /machine/nodeLabels, value: { "katacontainers.io/kata-runtime": "true" } }
        - { op: add, path: /machine/kernel, value: { modules: [{ name: vhost_net }, { name: vhost_vsock }] } }
