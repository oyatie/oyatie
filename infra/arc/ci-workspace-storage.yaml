# Dedicated local-path provisioner for disposable ARC workspaces (#1504).
# It uses a distinct provisioner identity and two path-bound StorageClasses; the existing
# rancher.io/local-path class continues to own CNPG, registry, NativeLink,
# OpenBao, and all other stateful data without any configuration change.
apiVersion: v1
kind: Namespace
metadata:
  name: oya-ci-workspace-storage
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-ci-workspace-local-path
  namespace: oya-ci-workspace-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oya-ci-workspace-local-path
  namespace: oya-ci-workspace-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oya-ci-workspace-local-path
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oya-ci-workspace-local-path
  namespace: oya-ci-workspace-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oya-ci-workspace-local-path
subjects:
  - kind: ServiceAccount
    name: oya-ci-workspace-local-path
    namespace: oya-ci-workspace-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oya-ci-workspace-local-path
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oya-ci-workspace-local-path
subjects:
  - kind: ServiceAccount
    name: oya-ci-workspace-local-path
    namespace: oya-ci-workspace-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  # local-path-provisioner discovers helperPod.yaml through this canonical name.
  name: local-path-config
  namespace: oya-ci-workspace-storage
data:
  # Dual-worker general: both workers admit /var/mnt/ci-workspace-general so the
  # general scale set can place one 44Gi ephemeral claim per 48Gi physical volume
  # (maxRunners=2 with required hostname anti-affinity). live-postgres stays on
  # worker-2 only, on a distinct path/volume. Fail-closed: no DEFAULT_PATH entry.
  config.json: |-
    {"nodePathMap":[{"node":"oya-talos-worker-1","paths":["/var/mnt/ci-workspace-general"]},{"node":"oya-talos-worker-2","paths":["/var/mnt/ci-workspace-general","/var/mnt/ci-workspace-live-postgres"]}]}
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -p "$VOL_DIR"
    chown 1001:1001 "$VOL_DIR"
    chmod 0700 "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          image: mirror.gcr.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-ci-workspace-local-path
  namespace: oya-ci-workspace-storage
  labels:
    app.kubernetes.io/name: oya-ci-workspace-local-path
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-ci-workspace-local-path
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-ci-workspace-local-path
    spec:
      serviceAccountName: oya-ci-workspace-local-path
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner@sha256:80496fdeb307541007621959aa13aed41d31db9cd2dc4167c19833e0bfa3878c
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - oyatie.io/ci-workspace-local-path
            - --service-account-name
            - oya-ci-workspace-local-path
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oya-ci-workspace-general
  annotations:
    defaultVolumeType: local
provisioner: oyatie.io/ci-workspace-local-path
parameters:
  nodePath: /var/mnt/ci-workspace-general
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oya-ci-workspace-live-postgres
  annotations:
    defaultVolumeType: local
provisioner: oyatie.io/ci-workspace-local-path
parameters:
  nodePath: /var/mnt/ci-workspace-live-postgres
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
