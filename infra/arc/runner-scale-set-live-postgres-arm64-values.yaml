# =============================================================================
# RETIRED (2026-08-11) — live-postgres ARC cell decommissioned.
# Live-PG merge gates use GitHub-hosted ubuntu-latest + postgres:16 service
# containers. Soft multi-arch stays hosted. Do not schedule jobs on this label.
# Desired state: maxRunners 0. Founder: sync then remove Argo app (README checklist).
# Historical cell prose below is provenance only.
# =============================================================================
#
# Dedicated PostgreSQL-16 integration-test cell (HISTORICAL). Each ARC runner Pod
# executed one GitHub job and owned one same-Pod PostgreSQL native sidecar.
# ADR-0630 (archive).
githubConfigUrl: https://github.com/jason931225/oyatie
githubConfigSecret: oyatie-arc-app
runnerScaleSetName: live-postgres-arm64
# Argo CD renders Helm without live-cluster `lookup` access. Bind the scale set
# to the 0.14.2 controller ServiceAccount name rendered by the sibling `arc`
# Application instead of relying on discovery that is available only to Helm.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
# RETIRED: was maxRunners 1 on the 48 Gi live-postgres volume.
maxRunners: 0  # RETIRED — scale-to-zero; remove Argo app after sync
minRunners: 0
template:
  metadata:
    labels:
      oya.io/ci-cell: live-postgres
  spec:
    nodeSelector:
      kubernetes.io/arch: arm64
      kubernetes.io/hostname: talos-worker-2
    securityContext:
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      # Ordinary init: mint low-value per-Pod test credentials without printing
      # them or reading a cluster Secret. The setgid emptyDir makes both files
      # readable by the runner and PostgreSQL containers through fsGroup 2000.
      - name: generate-postgres-credentials
        image: mirror.gcr.io/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        command: ["/bin/sh", "-ec"]
        args:
          - |
            umask 027
            od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /run/ci-postgres/admin-password
            od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /run/ci-postgres/app-password
            chmod 0640 /run/ci-postgres/admin-password /run/ci-postgres/app-password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 2000
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
        volumeMounts:
          - name: postgres-credentials
            mountPath: /run/ci-postgres

      # Kubernetes native sidecar: restartPolicy Always keeps PostgreSQL alive
      # for the runner lifetime, while startupProbe prevents the runner from
      # accepting work before the database is ready.
      - name: postgres
        image: mirror.gcr.io/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        restartPolicy: Always
        env:
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_DB
            value: oyatie
          - name: POSTGRES_PASSWORD_FILE
            value: /run/ci-postgres/admin-password
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        ports:
          - name: postgres
            containerPort: 5432
            protocol: TCP
        startupProbe:
          exec:
            command: ["/bin/sh", "-ec", "pg_isready -h 127.0.0.1 -U postgres -d oyatie"]
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "2", memory: 2Gi }
        volumeMounts:
          - name: postgres-credentials
            mountPath: /run/ci-postgres
            readOnly: true
          - name: postgres-data
            mountPath: /var/lib/postgresql/data

    containers:
      - name: runner
        image: registry.registry.svc.cluster.local:5000/oya/runner:arm64-pwsh@sha256:c679cbd7cd00b6b51a18eb3124869971a92b083cceedeecf3bbd68299cf7422d
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            # The build tree is on the dedicated generic-ephemeral workspace;
            # root storage accounts only for image and writable-layer pressure.
            ephemeral-storage: 4Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 8Gi
        volumeMounts:
          - name: postgres-credentials
            mountPath: /run/ci-postgres
            readOnly: true
          - name: workspace
            mountPath: /home/runner/_work

    volumes:
      - name: postgres-credentials
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: postgres-data
        emptyDir:
          medium: Memory
          # Keep tmpfs data below the PostgreSQL container's 2Gi memory limit;
          # tmpfs pages count against that limit alongside the server process.
          sizeLimit: 1Gi
      - name: workspace
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels:
                oya.io/lifecycle: disposable-ci-workspace
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: ci-workspace-live-postgres
              resources:
                requests:
                  storage: 44Gi
