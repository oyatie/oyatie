# Runner scale set `oya-arm64` — the owned CI runner fleet holding merge
# authority (founder ruling 2026-07-29). ADR-0630.
#
# ONE SCALE SET PER ARCHITECTURE. The cluster is heterogeneous by design
# ("arm64 / amd64 should both be a supported path"); an amd64 box joining means
# adding a sibling values file, never editing a workflow. Nothing here is
# arch-agnostic-by-accident: the arch appears exactly twice, in the set name and
# in the nodeSelector, and both are load-bearing.
githubConfigUrl: https://github.com/jason931225/oyatie
# GitHub App (NOT a personal token): scoped to this ONE repository with
# Administration:write + Metadata:read. Keys live in the cluster secret, never in
# git. See ADR-0630 for why an App rather than a PAT.
githubConfigSecret: oyatie-arc-app
runnerScaleSetName: oya-arm64
# Ephemeral runners: minRunners 0 means every job pays pod scheduling + a cold
# toolchain. That is a KNOWN, DELIBERATE gap at this slice — a warm pool is
# queued behind the baked runner image, because pre-warming a pod that then
# spends two minutes installing rustc buys almost nothing.
maxRunners: 3
minRunners: 0
template:
  metadata:
    labels:
      # Selects the Cilium egress-deny that prevents candidate code from
      # reaching the shared oya-data namespace even without its credentials.
      oya.io/ci-cell: general
      # REQUIRED for the CAS to be reachable AT ALL. infra/nativelink's
      # NetworkPolicy `nativelink-cas-ingress` admits :50051 only from pods
      # labelled writer=true and :50052 only from reader=true, matching the
      # SOURCE pod in any namespace. Without these the connection is refused at
      # L3 and surfaces as a TIMEOUT rather than a TLS error — a failure mode
      # that costs an afternoon to diagnose if you assume it is a cert problem.
      oya.io/nativelink-cas-reader: "true"
      oya.io/nativelink-cas-writer: "true"
  spec:
    # Without this a runner for THIS scale set can schedule onto a node of
    # another architecture and silently build for the wrong platform, poisoning
    # that platform's buck2 cache namespace (action keys include cpu:/os:).
    nodeSelector:
      kubernetes.io/arch: arm64
    containers:
      - name: runner
        # DIGEST-PINNED baked toolchain image, built from the committed recipe at
        # infra/ci/runner-image/Dockerfile (which is itself pinned to a base image
        # digest). Carries buck2, rustc/cargo from rust-toolchain.toml, clang+lld at
        # the ABSOLUTE path toolchains/BUCK invokes, and pwsh — the last of which is
        # not optional: oya-ci-required.yml runs the gate matrix's main step under
        # `shell: pwsh`, and the stock actions-runner image has none, so all 45 gate
        # legs would fail on this fleet with a missing-shell error that reads like a
        # gate failure. GitHub-hosted ubuntu images ship pwsh, which is why the
        # dependency was invisible until the fleet moved off hosted runners.
        #
        # Served by the in-cluster registry; pullable because Talos machine.registries
        # carries a mirror keyed to the registry Service's PINNED clusterIP.
        # This file is the APPLY SOURCE — never `helm upgrade` from a copy. A previous
        # slice drifted the live fleet from this declaration within hours by upgrading
        # from a scratchpad values file, which is the defect a committed declaration
        # exists to prevent.
        image: registry.oya-registry.svc.cluster.local:5000/oya/runner:arm64-pwsh@sha256:c679cbd7cd00b6b51a18eb3124869971a92b083cceedeecf3bbd68299cf7422d
        command: ["/home/runner/run.sh"]
        # General-purpose candidate runners receive no database administrative
        # credential. Live PostgreSQL coverage runs in the dedicated per-job
        # sidecar cell declared by runner-scale-set-live-postgres-arm64-values.yaml.
        resources:
          requests:
            # 2 CPU tracks the MEASURED buck2 scaling knee (j=2 87s, j=4 67s,
            # j=8 71s, j=18 98s) — over-parallelism degrades, so a wide request
            # would buy nothing and crowd out co-tenants.
            cpu: "2"
            memory: "4Gi"
            # Ephemeral-storage REQUEST is a scheduler accounting floor, not a
            # hard growth ceiling. Measured 2026-08-02 FULL-tier cold baselines
            # on oya-arm64 used 29.49–30.93 Gi before kubelet DiskPressure
            # eviction (pods qj8fm/vm2d4/wsll2; available ~6.1–6.5 Gi under the
            # ~7.3 Gi node threshold). Worker allocatable is 45,909,593,217 B =
            # 42.756 GiB binary. The previous 20Gi request let TWO runners
            # co-locate (40 Gi < 42.756 Gi) even though two measured peaks
            # cannot fit. 22Gi is the smallest integer Gi request for which
            # 2 × request = 44 Gi exceeds that allocatable, so Kubernetes
            # schedules at most one runner per current worker. maxRunners and
            # the 60Gi hard limit are unchanged; this does not green a failed
            # target or weaken any gate. Recompute if worker capacity grows.
            ephemeral-storage: "22Gi"
          limits:
            # 8Gi, arrived at by arithmetic rather than taste. Node allocatable
            # is 28.6Gi and the 4Gi REQUEST lets all maxRunners=3 land on ONE
            # node; at a 12Gi limit they could grow to 36Gi and OOM it, evicting
            # co-tenants — nativelink-cas keeps local-path PVCs on these same
            # nodes, and this cluster is SHARED with the console project.
            # 3 x 8Gi = 24Gi leaves ~4.6Gi headroom.
            memory: "8Gi"
            # buck2 build trees are disk-heavy; FRIC-017 was literally "No space
            # left on device". Bounded so a runaway build is evicted rather than
            # filling the node for every other tenant. Distinct from the 22Gi
            # request above: the limit remains the runaway ceiling.
            ephemeral-storage: "60Gi"
        # NOTE: no CPU limit, deliberately. A throttled compile presents as a
        # flaky slow test, which is worse than a noisy neighbour we can see.
