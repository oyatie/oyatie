# Runner scale set `oya-arm64` — the owned CI runner fleet holding merge
# authority (founder ruling 2026-07-29). ADR-0630.
#
# ONE SCALE SET PER ARCHITECTURE. The cluster is heterogeneous by design
# ("arm64 / amd64 should both be a supported path"); an amd64 box joining means
# adding a sibling values file, never editing a workflow. Nothing here is
# arch-agnostic-by-accident: the arch appears exactly twice, in the set name and
# in the nodeSelector, and both are load-bearing.
githubConfigUrl: https://github.com/jason931225/oyatie
# GitHub App (NOT a personal token): scoped to this ONE repository with
# Administration:write + Metadata:read. Keys live in the cluster secret, never in
# git. See ADR-0630 for why an App rather than a PAT.
githubConfigSecret: oyatie-arc-app
runnerScaleSetName: oya-arm64
# Ephemeral runners: minRunners 0 means every job pays pod scheduling. The cold
# TOOLCHAIN half of that cost is gone now that the image below is the baked one;
# a warm pool remains a deliberate gap at this slice.
#
# minRunners 0 is also the migration window for the superuser projection: with
# no runner pod alive between jobs, arc-runners/oya-pg-superuser can be deleted
# and re-created by ESO without interrupting a job (see infra/oya-pg/).
maxRunners: 3
minRunners: 0
template:
  metadata:
    labels:
      # REQUIRED for the CAS to be reachable AT ALL. infra/nativelink's
      # NetworkPolicy `nativelink-cas-ingress` admits :50051 only from pods
      # labelled writer=true and :50052 only from reader=true, matching the
      # SOURCE pod in any namespace. Without these the connection is refused at
      # L3 and surfaces as a TIMEOUT rather than a TLS error — a failure mode
      # that costs an afternoon to diagnose if you assume it is a cert problem.
      oya.io/nativelink-cas-reader: "true"
      oya.io/nativelink-cas-writer: "true"
  spec:
    # Without this a runner for THIS scale set can schedule onto a node of
    # another architecture and silently build for the wrong platform, poisoning
    # that platform's buck2 cache namespace (action keys include cpu:/os:).
    nodeSelector:
      kubernetes.io/arch: arm64
    containers:
      - name: runner
        # Baked toolchain image, PINNED BY DIGEST (no mutable tag anywhere in the
        # merge-authority path). Carries buck2, rustc/cargo from the repo-root
        # rust-toolchain.toml, and CLANG + LLD — toolchains/BUCK points the buck2
        # cxx toolchain at the ABSOLUTE path /usr/bin/clang as both compiler and
        # linker, so a gcc-only image fails every C/C++ action. Built from
        # infra/ci/runner-image/ (Dockerfile + build.yaml); that pair is the ONLY
        # thing this digest is reproducible from.
        #
        # Pullable because the node registry mirror (Talos
        # machine.registries.mirrors) is keyed to the registry Service's PINNED
        # spec.clusterIP 10.107.56.227 (infra/registry/registry.k8s.yaml) — node
        # containerd resolves via the host resolver, not CoreDNS, so the
        # in-cluster DNS name below only works because of that IP pin.
        image: registry.oya-registry.svc.cluster.local:5000/oya/runner:arm64@sha256:ab648efdf2e4a2e10991816172efd83fae80baf41a5bcd1d92ae72abecef6936
        command: ["/home/runner/run.sh"]
        # The live-Postgres gates need BOTH a superuser and a plain app role: the
        # RLS tests assert that rolsuper/rolbypassrls cannot bypass row-level
        # security, so the DISTINCTION is the test. Credential path is
        # CNPG-minted Secret in oya-data -> ESO projection into arc-runners ->
        # pod env -> gate. The projection (infra/oya-pg/superuser-projection.yaml)
        # replaces a hand-copied Secret that could not rotate with its source.
        #
        # If the projection is missing these resolve EMPTY rather than failing to
        # start, so the RLS gates can go green-on-nothing — which is why the
        # ExternalSecret is declared beside the Cluster that mints the source.
        env:
          - name: OYA_CI_PG_HOST
            value: oya-pg-rw.oya-data.svc.cluster.local
          - name: OYA_CI_PG_SUPERUSER
            valueFrom:
              secretKeyRef:
                name: oya-pg-superuser
                key: username
          - name: OYA_CI_PG_SUPERPASS
            valueFrom:
              secretKeyRef:
                name: oya-pg-superuser
                key: password
        resources:
          requests:
            # 2 CPU tracks the MEASURED buck2 scaling knee (j=2 87s, j=4 67s,
            # j=8 71s, j=18 98s) — over-parallelism degrades, so a wide request
            # would buy nothing and crowd out co-tenants.
            cpu: "2"
            memory: "4Gi"
            ephemeral-storage: "20Gi"
          limits:
            # 8Gi, arrived at by arithmetic rather than taste. Node allocatable
            # is 28.6Gi and the 4Gi REQUEST lets all maxRunners=3 land on ONE
            # node; at a 12Gi limit they could grow to 36Gi and OOM it, evicting
            # co-tenants — nativelink-cas keeps local-path PVCs on these same
            # nodes, and this cluster is SHARED with the console project.
            # 3 x 8Gi = 24Gi leaves ~4.6Gi headroom.
            memory: "8Gi"
            # buck2 build trees are disk-heavy; FRIC-017 was literally "No space
            # left on device". Bounded so a runaway build is evicted rather than
            # filling the node for every other tenant.
            ephemeral-storage: "60Gi"
        # NOTE: no CPU limit, deliberately. A throttled compile presents as a
        # flaky slow test, which is worse than a noisy neighbour we can see.
