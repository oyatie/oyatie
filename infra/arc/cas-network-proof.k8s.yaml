# DARK #1551 network-proof substrate. This file is not registered in GitOps and
# the Job is suspended. A later reviewed activation must first supply a trusted
# Hubble Relay observation path and preserve the checks in RUNBOOK.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cas-network-proof-probe
  namespace: arc-runners
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cas-network-proof-probe
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: cloud-ci
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        oya.io/ci-cell: general
        oya.io/nativelink-cas-reader: "true"
        oya.io/nativelink-cas-writer: "true"
    spec:
      serviceAccountName: cas-network-proof-probe
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: talos-worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: probe
          image: registry.registry.svc.cluster.local:5000/oya/runner:arm64-pwsh@sha256:c679cbd7cd00b6b51a18eb3124869971a92b083cceedeecf3bbd68299cf7422d
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              target=openbao.kms.svc
              probe_id="$(hostname)"
              echo "PROOF probe=${probe_id} phase=start"
              if curl --silent --show-error --connect-timeout 3 --max-time 5 \
                --output /dev/null "http://${target}:8200/v1/sys/health"; then
                echo "PROOF probe=${probe_id} plaintext_8200=unexpected_success" >&2
                exit 1
              fi
              echo "PROOF probe=${probe_id} plaintext_8200=connection_failed"
              curl --fail --silent --show-error --connect-timeout 3 --max-time 5 \
                --cacert /etc/openbao/ca/ca.crt --output /dev/null \
                "https://${target}:8202/v1/sys/health"
              echo "PROOF probe=${probe_id} tls_8202_health=success"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: openbao-ca
              mountPath: /etc/openbao/ca
              readOnly: true
      volumes:
        - name: openbao-ca
          configMap:
            name: openbao-offline-root-ca
