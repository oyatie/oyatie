# BuildKit in-cluster image build (ADR-0381 D1 — Kaniko was archived by Google in 2024).
# BuildKit (Moby, Apache 2) is what Docker itself uses for `docker buildx`; rootless mode
# is PSA-baseline-compatible (no CAP_SYS_ADMIN, no privileged container).
#
# ONE K8s object: the ci-webhook-gateway-build Job — a buildctl client that drives the
# daemon to build microservices/ci-webhook-gateway from the git context and push to the
# in-cluster registry.
#
# THE DAEMON USED TO LIVE HERE AND NO LONGER DOES (ADR-0631 D3). This file declared a
# SECOND buildkitd Deployment+Service, in ns oya-ci, rootless, with different args and a
# different probe, while a privileged daemon in ns oya-build served every real build. The
# oya-ci pair never existed on the cluster and never could — nothing reconciles this
# directory. Two declarations of one daemon, one of them fiction, is exactly the
# drift-by-duplication class, so the daemon is now declared once, at
# infra/buildkit/buildkitd.k8s.yaml, and this Job targets it.
#
# The rootless posture this file argued for (PSA-baseline, no CAP_SYS_ADMIN) is NOT
# retracted and is NOT what runs: the surviving daemon is privileged. Making it rootless
# is a deliberate migration PR — it also needs the readiness probe changed, because the
# rootless daemon listens on a unix socket the privileged one does not — not a second
# Deployment kept alongside as aspiration.
#
# Cache backend: BuildKit's bucket-API cache backend (Moby's library names it
# `type=s3` — that's the wire-protocol identifier, not a brand) is wired to
# SeaweedFS-on-Talos (ADR-0381 D4; service
# seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333). Both
# `--import-cache` (read) and `--export-cache ...,mode=max` (write) point at
# the `oya-ci-buildkit-cache` bucket, which SeaweedFS auto-creates on first PUT.
# First build: cache miss, BuildKit skips import gracefully and exports at end.
# Subsequent builds: import hits + reuses layers. Anonymous-mode bucket access
# (cluster-internal only); auth is a hardening follow-on alongside ADR-0381 D3.
# Note: the inline `type=s3` / `access_key_id` / `secret_access_key` strings
# are Moby's library namespace + wire-protocol parameters — we don't control
# them. The substrate is SeaweedFS; Oyatie does not consume AWS (ADR-0381
# amendment 3, hyperscaler-lens-architectural-filter). The placeholders
# (`oya-ci-anon`) are intentionally non-AWS-branded; SeaweedFS anonymous mode
# ignores them. BuildKit has no equivalent of sccache's *_NO_CREDENTIALS flag.
#
# Re-run a build: delete + re-apply the Job (or bump the image tag in `--output`).
# Git creds: secret `gateway-build-git` (gh token), same as the retired Kaniko Job.
---
# ci-webhook-gateway-build Job — buildctl client connects to the buildkitd Service in
# oya-build and drives the build from the git context. Replaces the retired Kaniko Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ci-webhook-gateway-build
  namespace: oya-ci
  labels:
    oya.adr/decided-by: ADR-0381
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # ADR-0381 D2 cell affinity: prefer the CI specialty pool. NOTE this no longer
      # co-locates the client with its server — the daemon now lives in oya-build and
      # carries no such affinity, so this is a preference for the pool, not for the pod.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/ci
                    operator: In
                    values: ["true"]
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      volumes:
        - name: cosign-key
          secret:
            secretName: cosign-key
            items:
              - key: cosign-key
                path: cosign-key
      containers:
        - name: buildctl
          # CLIENT ONLY. This is deliberately NOT pinned to the daemon's version
          # (moby/buildkit:v0.18.2, infra/buildkit/buildkitd.k8s.yaml): buildctl and
          # buildkitd negotiate, and this client stays rootless because nothing about a
          # client needs privilege. Version skew between the two is the thing to watch
          # if a frontend option is ever rejected.
          image: moby/buildkit:v0.31.2-rootless
          workingDir: /workspace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              CONTEXT_URL="https://${GIT_USERNAME}:${GIT_PASSWORD}@github.com/jason931225/oyatie.git#refs/heads/dev"
              CACHE_PARAMS="type=s3,region=oya-local,bucket=oya-ci-buildkit-cache,endpoint_url=http://seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333,access_key_id=oya-ci-anon,secret_access_key=oya-ci-anon,use_path_style=true"
              buildctl --addr "tcp://buildkitd.oya-build.svc.cluster.local:1234" \
                build \
                --frontend dockerfile.v0 \
                --opt "context=${CONTEXT_URL}" \
                --opt "context-sub-path=microservices/ci-webhook-gateway" \
                --opt "filename=Dockerfile" \
                --output "type=image,name=registry.oya-registry.svc.cluster.local:5000/ci-webhook-gateway:dev,push=true,registry.insecure=true" \
                --import-cache "${CACHE_PARAMS}" \
                --export-cache "${CACHE_PARAMS},mode=max" \
                --metadata-file=/tmp/buildkit-meta.json
              # Sign by digest, not tag — tag can be re-pointed after signing,
              # which would silently break the verification chain.
              DIGEST=$(jq -r '."containerimage.digest"' /tmp/buildkit-meta.json)
              # cosign is not present in moby/buildkit; download a pinned release.
              # cosign v3.1.2 linux/amd64 SHA256, taken from the upstream
              # cosign_checksums.txt for the v3.1.2 release AND independently
              # recomputed from the downloaded asset (both agree):
              #   f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
              #
              # Two-major bump from v2.4.1 (2024-10-03, ~22 months stale).
              #
              # WHAT A VERIFIER OF THESE SIGNATURES NEEDS — both conditions:
              #   1. cosign v3+. A v2 client cannot discover a v3 signature at
              #      all. Verified against a local registry with no egress:
              #      v2.4.1 and v2.5.0 both exit 10 "no signatures found" on a
              #      v3-signed image; v3.1.2 exits 0. (v3 writing its new bundle
              #      format is the likely mechanism, but what was PROVEN is the
              #      effect: the tag is written and a v2 client cannot read it.)
              #   2. `--insecure-ignore-tlog`. REQUIRED, not one option among
              #      several: signing below passes --tlog-upload=false, so no
              #      Rekor entry is ever written and NO amount of egress can
              #      produce one. `verify` requires an entry by default
              #      (--insecure-ignore-tlog defaults to false), so a v3 verifier
              #      WITHOUT this flag exits 1. Stating only "use v3+" would send
              #      someone straight into that failure.
              #
              # If the verifier ALSO has no egress, test one more thing before
              # relying on it: cosign 3.0.2 was reported to reach the sigstore
              # TUF CDN even for --key verification (sigstore/cosign#4550, whose
              # repro uses this exact sign invocation), which fails closed with
              # no egress. That issue is CLOSED by PR #4613 and has NOT been
              # re-verified against the v3.1.2 pinned here — so treat it as a
              # thing to check, not a known defect. The offline recipe, if it
              # does bite: --trusted-root <staged trusted_root.json>
              # --offline=true --new-bundle-format=false (these images are
              # v3-signed, so that last flag is the one likely to matter).
              #
              # Security properties deliberately given up, so this is a decision
              # and not an accident: no transparency-log entry, so these
              # signatures cannot be publicly verified, and no signed timestamp,
              # so a signature cannot be bound to a point in time if this key is
              # later rotated or compromised. A defensible trade for in-cluster
              # signing with no egress. Only the tlog is a change from v2: the
              # v2 invocation passed no --timestamp-server-url (`cosign sign
              # --key oya-ci/cosign-key`, commit 33134e055) and trusted
              # timestamping is opt-in, so v2 produced no signed timestamp
              # either. --use-signing-config=false dropping the TSA path is the
              # likely mechanism for v3, not a verified one.
              #
              # `oya/intelligence/iac/helm/eval/baseline-store/values.yaml` pins
              # cosign v2.5.0 for a sidecar literally named cosignVerifier, and
              # configures rekorPublicLog/rekorMirror. It was NOT established to
              # verify these images; if it ever does, it fails FIRST at (1) —
              # exit 10, it cannot discover the signature at all — and would
              # then fail at (2) after a v3 bump, its rekor config having no
              # entry to find. Tracked F-SEC-COSIGN-VERIFIER-SKEW.
              #
              # v3 defaults to fetching a signing config from the sigstore TUF
              # repo, so `sign` fails closed without egress. The two flags below
              # restore offline keyed signing and must be given TOGETHER —
              # `--tlog-upload=false` alone is rejected as "not supported with
              # --signing-config or --use-signing-config". `--tlog-upload` is
              # DEPRECATED (not removed); the durable replacement is a
              # `--signing-config` file carrying no transparency-log service.
              # `--key` and `--yes` both still exist in v3.1.2.
              curl -fsSL -o /tmp/cosign \
                https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
              echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  /tmp/cosign" | sha256sum -c -
              chmod +x /tmp/cosign
              /tmp/cosign sign --use-signing-config=false --tlog-upload=false \
                --key oya-ci/cosign-key \
                "registry.oya-registry.svc.cluster.local:5000/ci-webhook-gateway@${DIGEST}"
          env:
            - name: GIT_USERNAME
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: username } }
            - name: GIT_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: token } }
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosign-key
                  key: password
                  optional: true
          volumeMounts:
            - name: cosign-key
              mountPath: /workspace/oya-ci
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              memory: 2Gi
