# SLSA-L2 signing chain (attestation pending; see follow-up ADR) for the in-cluster registry.
# External Secrets Operator projects the signing key and verification key from
# OpenBao before the BuildKit jobs and Kyverno policy are applied.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-key
  namespace: oya-ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oya-openbao
    kind: ClusterSecretStore
  target:
    name: cosign-key
    creationPolicy: Owner
  data:
    - secretKey: cosign-key
      remoteRef:
        key: oya/ci/cosign-key
        property: cosign-key
    - secretKey: password
      remoteRef:
        key: oya/ci/cosign-key
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-pub
  namespace: oya-ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oya-openbao
    kind: ClusterSecretStore
  target:
    name: cosign-pub
    creationPolicy: Owner
  data:
    - secretKey: cosign.pub
      remoteRef:
        key: oya/ci/cosign-key
        property: cosign.pub
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-oya-registry-images-signed
  labels:
    oyatie.com/admission-adapter: kyverno
    oyatie.com/slsa-level: "2"
  annotations:
    policies.kyverno.io/title: Verify Oyatie Registry Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/subject: Pod, Image
    policies.kyverno.io/description: >-
      Requires cosign signatures for all images pulled from the in-cluster
      Oyatie registry. The public verification key is projected by External
      Secrets Operator from sref://openbao/oya/ci/cosign-key into
      oya-ci/cosign-pub.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-oya-registry-cosign-key
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.oya-registry.svc.cluster.local:5000/*"
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: k8s://oya-ci/cosign-pub
