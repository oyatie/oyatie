# Keyless Sigstore admission policy for the in-cluster registry.
# Static OpenBao-projected Cosign keys are not readiness authority: this policy
# verifies GitHub OIDC identities, Rekor transparency, SLSA provenance, and SBOM
# attestations for every image pulled from the in-cluster registry.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-oya-registry-images-keyless
  labels:
    oyatie.com/admission-adapter: kyverno
    oyatie.com/slsa-level: "2"
    oyatie.com/readiness-authority: "true"
  annotations:
    policies.kyverno.io/title: Verify Oyatie Registry Image Signatures And Attestations
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/subject: Pod, Image
    policies.kyverno.io/description: >-
      Requires keyless Cosign signatures plus Rekor transparency, SLSA provenance
      attestations, and CycloneDX SBOM attestations for all images pulled from the
      in-cluster Oyatie registry. This is the readiness-authoritative policy; static
      key material is not accepted as production-readiness proof.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-keyless-signature-rekor
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.oya-registry.svc.cluster.local:5000/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: "https://github.com/jason931225/oyatie/.github/workflows/.+@refs/(heads/dev|tags/v.+)"
                    rekor:
                      url: "https://rekor.sigstore.dev"
    - name: verify-slsa-provenance-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.oya-registry.svc.cluster.local:5000/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestations:
            - predicateType: "https://slsa.dev/provenance/v1"
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subjectRegExp: "https://github.com/jason931225/oyatie/.github/workflows/.+@refs/(heads/dev|tags/v.+)"
                        rekor:
                          url: "https://rekor.sigstore.dev"
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: "https://actions.github.io/buildtypes/workflow/v1"
    - name: verify-cyclonedx-sbom-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.oya-registry.svc.cluster.local:5000/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestations:
            - predicateType: "https://cyclonedx.org/bom"
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subjectRegExp: "https://github.com/jason931225/oyatie/.github/workflows/.+@refs/(heads/dev|tags/v.+)"
                        rekor:
                          url: "https://rekor.sigstore.dev"