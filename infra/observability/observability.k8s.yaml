# Observability substrate on k3s (ADR-0130/0131) — OTLP-native, OSI-clean, lean for the farm.
# OTel Collector (OTLP ingest) -> VictoriaMetrics (metrics store, Prometheus-compatible, Apache-2.0,
# low-resource) -> Grafana (viz, AGPL but self-hosted-tool-only, not shipped in product). Services +
# Jenkins emit OTLP to the collector; the gateway/DORA/SLO-engine query VictoriaMetrics. Traces/logs
# (Tempo/Loki/Vector) are a follow-up; metrics + OTLP ingest + dashboards are the core.
# Grafana admin password comes from a k8s Secret (generated at deploy), never plaintext in this file.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: { app.kubernetes.io/part-of: substrate, oya.io/adr: ADR-0130 }
---
# ---------- VictoriaMetrics (single-node metrics store) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: vmsingle-data, namespace: observability }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 5Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: victoriametrics, namespace: observability, labels: { app.kubernetes.io/name: victoriametrics } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: victoriametrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: victoriametrics } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.148.0
          args: ["-storageDataPath=/vmdata", "-retentionPeriod=30d", "-httpListenAddr=:8428"]
          ports: [{ name: http, containerPort: 8428 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /vmdata }]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: vmsingle-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: victoriametrics, namespace: observability }
spec: { selector: { app.kubernetes.io/name: victoriametrics }, ports: [{ name: http, port: 8428, targetPort: http }] }
---
# ---------- OpenTelemetry Collector (OTLP ingest -> VM remote-write) ----------
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: observability }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
    exporters:
      prometheus_remote_write:
        endpoint: http://victoriametrics.observability.svc.cluster.local:8428/api/v1/write
      debug: { verbosity: basic }
    service:
      pipelines:
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus_remote_write] }
        traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
        logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability, labels: { app.kubernetes.io/name: otel-collector } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: otel-collector } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: cfg, mountPath: /etc/otel }]
      volumes: [{ name: cfg, configMap: { name: otel-collector-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# ---------- Grafana (viz; admin password from Secret grafana-admin, created at deploy) ----------
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: observability }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.observability.svc.cluster.local:8428
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: observability, labels: { app.kubernetes.io/name: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:11.6.16
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          ports: [{ name: http, containerPort: 3000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
          volumeMounts: [{ name: ds, mountPath: /etc/grafana/provisioning/datasources }]
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10 }
      volumes: [{ name: ds, configMap: { name: grafana-datasources } }]
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: observability }
spec: { selector: { app.kubernetes.io/name: grafana }, ports: [{ name: http, port: 3000, targetPort: http }] }
