# Self-hosted Omni + bundled Dex (OIDC) for the Oyatie fleet management plane.
# Target host: OCI Always-Free Ampere A1 (arm64, 4 OCPU / 24 GB / 200 GB Balanced vol), Ubuntu + Docker.
# The omni image is multi-arch, so this runs unchanged on arm64.
#
# Run:  ./gen-secrets.sh  &&  docker compose --env-file .env up -d
# Faithful to https://docs.siderolabs.com/omni/self-hosted/run-omni-on-prem — VERIFY flags against
# your pinned OMNI_VERSION (flags drift between releases). Host networking is required: Omni terminates
# the SideroLink WireGuard tunnel (NET_ADMIN + /dev/net/tun) on UDP 50180.
#
# Ports to open on BOTH the OCI Security List/NSG AND the host iptables:
#   TCP 443 (UI/API)  8090 (SideroLink/machine API)  8091 (event sink)  8100 (k8s proxy)  5556 (Dex)
#   UDP 50180 (WireGuard)
services:
  omni:
    image: ghcr.io/siderolabs/omni:${OMNI_VERSION}
    container_name: omni
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes:
      - ./secrets/ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
      - ./secrets/server-key.pem:/server-key.pem:ro
      - ./secrets/server-chain.pem:/server-chain.pem:ro
      - ./secrets/omni.asc:/omni.asc:ro
      - omni-etcd:/_out/etcd
    command:
      - --name=omni
      - --cert=/server-chain.pem
      - --key=/server-key.pem
      - --machine-api-cert=/server-chain.pem
      - --machine-api-key=/server-key.pem
      - --machine-api-bind-addr=0.0.0.0:8090
      - --private-key-source=file:///omni.asc
      - --event-sink-port=8091
      - --bind-addr=0.0.0.0:443
      - --k8s-proxy-bind-addr=0.0.0.0:8100
      - --advertised-api-url=https://${OMNI_ENDPOINT}/
      - --siderolink-api-advertised-url=https://${OMNI_ENDPOINT}:8090/
      # MUST be the literal public IP, not a DNS name:
      - --siderolink-wireguard-advertised-addr=${OMNI_PUBLIC_IP}:50180
      - --advertised-kubernetes-proxy-url=https://${OMNI_ENDPOINT}:8100/
      - --auth-auth0-enabled=false
      - --auth-oidc-enabled=true
      - --auth-oidc-provider-url=https://${AUTH_ENDPOINT}:5556
      - --auth-oidc-client-id=omni
      # client secret is read from the file mount below by Dex; Omni takes it as a flag:
      - --auth-oidc-scopes=openid
      - --auth-oidc-scopes=profile
      - --auth-oidc-scopes=email
      - --initial-users=${OMNI_USER_EMAIL}
      - --eula-accept-name=${EULA_NAME}
      - --eula-accept-email=${EULA_EMAIL}
    depends_on: [dex]

  dex:
    image: ghcr.io/dexidp/dex:latest    # pin a digest before prod
    container_name: dex
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
      - ./secrets/server-key.pem:/tls/key.pem:ro
      - ./secrets/server-chain.pem:/tls/cert.pem:ro
      - dex-data:/var/dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]

volumes:
  omni-etcd:
  dex-data:
