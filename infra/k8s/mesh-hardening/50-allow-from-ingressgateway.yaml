# Counterpart to the default-deny NetworkPolicy + AuthorizationPolicy:
# explicitly ALLOW traffic from the istio-ingressgateway to each service
# namespace. Without this, the default-deny blocks even legitimate ingress.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingressgateway
  namespace: api-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
---
# Future: replicate for foundry/ops/cloud-axis once workloads land in those ns
# (M3-P04 SaaS-platform-preview brings the first cloud-axis pod).
