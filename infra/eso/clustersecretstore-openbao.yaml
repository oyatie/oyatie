# ClusterSecretStore: openbao-cluster-store
#
# Captures, as committed IaC, the External-Secrets-Operator (ESO) -> OpenBao
# wiring that was applied live to the cluster. This manifest is the
# reproducible source of truth for the ClusterSecretStore that every
# ExternalSecret in the repo references (see
# oya/ci-controller/iac/k8s/helm/templates/externalsecret.yaml and
# oya/ci-webhook-gateway/iac/k8s/helm/templates/externalsecret.yaml, both of
# which set secretStoreRef.name: openbao-cluster-store).
#
# OpenBao is Vault-compatible at the API level, so ESO's built-in `vault`
# provider talks to it unchanged.
#
# ---------------------------------------------------------------------------
# WHY disable_local_ca_jwt=true is NOT a field below
# ---------------------------------------------------------------------------
# `disable_local_ca_jwt=true` is configured on the OpenBao SERVER side, on the
# kubernetes auth mount (`bao write auth/kubernetes/config
# disable_local_ca_jwt=true ...`). It is NOT an ESO/ClusterSecretStore field
# and must never appear here.
#
# What it does: with disable_local_ca_jwt=true, OpenBao does NOT use its own
# pod's locally-mounted ServiceAccount token / CA to talk to the Kubernetes
# API. Instead, OpenBao validates the CLIENT JWT that ESO presents (ESO's own
# `external-secrets` ServiceAccount token) by calling the cluster's
# TokenReview API. This is the "client JWT TokenReview" auth path.
#
# Consequence (captured in the sibling manifest in this directory): for that
# TokenReview call to succeed, the `external-secrets` controller
# ServiceAccount must hold the `system:auth-delegator` ClusterRole. That grant
# is encoded in:
#   infra/eso/clusterrolebinding-external-secrets-auth-delegator.yaml
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-store
  labels:
    app.kubernetes.io/part-of: oyatie-secrets
    app.kubernetes.io/managed-by: argocd
    oyatie.com/adr-0043: secrets-management-openbao
  annotations:
    # Non-claim: this manifest CAPTURES live cluster state that was applied by
    # hand; committing it makes the ESO->OpenBao wiring reproducible. It is not
    # itself proof of a passing live sync or a fresh apply.
    oyatie.com/non-claim: captures-live-eso-openbao-clustersecretstore-state-applied-by-hand-not-a-fresh-apply-or-live-sync-proof
spec:
  provider:
    vault:
      # OpenBao Service in the oya-kms namespace, KV listener on :8200.
      # (Captured from the live working store: OpenBao runs in oya-kms, NOT
      # oya-secrets.) OpenBao speaks the Vault API, so ESO's vault provider is
      # used as-is.
      server: http://openbao.oya-kms.svc:8200
      # KV v2 secrets engine mounted at `secret/`.
      path: secret
      version: v2
      auth:
        kubernetes:
          # Matches the OpenBao kubernetes auth method mount path
          # (`bao auth enable -path=kubernetes kubernetes`).
          mountPath: kubernetes
          # OpenBao role bound to a policy that reads secret/oya/ci/* (captured
          # from the live working store; the role name is eso-oya-ci).
          role: eso-oya-ci
          # ESO presents THIS ServiceAccount's token as the client JWT.
          # OpenBao validates it via TokenReview (disable_local_ca_jwt=true),
          # which is why this SA needs system:auth-delegator.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
