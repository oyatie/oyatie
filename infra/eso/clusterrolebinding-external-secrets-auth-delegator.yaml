# ClusterRoleBinding: external-secrets-auth-delegator
#
# Captures live cluster state as committed IaC.
#
# OpenBao's kubernetes auth method is configured with
# disable_local_ca_jwt=true, so OpenBao does NOT use its own pod token to reach
# the Kubernetes API. Instead, when External Secrets Operator (ESO)
# authenticates, OpenBao takes the CLIENT JWT that ESO presents (ESO's own
# `external-secrets` ServiceAccount token) and validates it by calling the
# cluster's TokenReview API (authentication.k8s.io/v1 TokenReview).
#
# To be ALLOWED to call TokenReview, the calling identity must hold the
# built-in `system:auth-delegator` ClusterRole (it grants create on
# tokenreviews + subjectaccessreviews). This binding grants exactly that to the
# `external-secrets` controller ServiceAccount, which is the identity OpenBao
# acts as during the validation handshake.
#
# Without this binding, OpenBao's TokenReview call is rejected and every
# ExternalSecret referencing the openbao-cluster-store ClusterSecretStore fails
# to sync. See infra/eso/clustersecretstore-openbao.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-auth-delegator
  labels:
    app.kubernetes.io/part-of: oyatie-secrets
    app.kubernetes.io/managed-by: argocd
    oyatie.com/adr-0043: secrets-management-openbao
  annotations:
    # Non-claim: captures the live grant applied by hand to make the
    # ESO client-JWT TokenReview auth path reproducible.
    oyatie.com/non-claim: captures-live-auth-delegator-clusterrolebinding-state-applied-by-hand-not-a-fresh-apply-or-live-tokenreview-proof
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
