# In-cluster OCI registry (registry:2) — image target for in-cluster builds.
# Host docker is retired (ADR-0378); gateway + future microservice images are built
# in-cluster by BuildKit (ADR-0381 D1; Kaniko archived 2024) and pushed here.
# Plain-HTTP, in-cluster only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  # PINNED, not allocated. The Talos node registry mirror
  # (machine.registries.mirrors) points at this ClusterIP by IP, because node
  # containerd resolves via the host resolver, not CoreDNS. If this Service is
  # ever recreated it would be assigned a NEW ClusterIP and every node mirror
  # would silently point at nothing — ImagePullBackOff cluster-wide, with no
  # signal here. Pinning makes the mirror a stable contract.
  clusterIP: 10.107.56.227
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      name: http
