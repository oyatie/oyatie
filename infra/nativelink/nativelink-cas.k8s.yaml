# NativeLink CAS + Action Cache — the warm build-cache substrate (ADR-0560,
# consuming the ADR-0556 classification; idea basis
# docs/ideas/nativelink-remote-cache-first.md, founder-decided 2026-05-30).
#
# Cache-first MVP tier ONLY: this manifest deploys the `nativelink-cas` tier (CAS +
# AC) of the founder-decided 3-tier split. The scheduler and worker tiers are NOT
# deployed until the RE phase (ADR-0525 D3) — a scheduler fault must never widen
# into the cache path, and cold-required build classes bypass this service entirely
# (ADR-0556 D3), so no release/canary/untrusted path can ever depend on it.
#
# Precedent (hyperscaler-lens): NativeLink is Rust-native (rust-purity aligned),
# speaks the Bazel Remote-Execution gRPC CAS/AC API (the same wire protocol Bazel /
# Buck2 / Pants / Reclient consume), FSL-1.1-Apache-2.0 (FSL 1.1, converts to
# Apache-2.0 ~2028-07-17 for the pinned v1.6.2 release; deployed as a container,
# not a linked Rust dependency),
# self-hostable; its own production guidance runs CAS and scheduler as separate
# processes (Buildbarn decomposes the same way: bb-storage / bb-scheduler /
# bb-worker).
#
# License posture note: FSL sits in ADR-0013's requires-review tier (AWS-FSL /
# Sentry-FSL family); this is a conscious, reviewed exception, not Apache-2.0.
#
# KEYED AUTHN AT THE SERVICE BOUNDARY (founder 2026-05-30: keyed, never anonymous;
# ADR-0556 D4.4: a property the service refuses, not a convention clients follow):
#   - WRITER listener :50051 — mTLS, verifies clients against the WRITER client CA
#     (ca-writer.crt). Holders: trusted CI lanes only (same-repo branches admitted
#     into the governance pipeline). AC is read-write.
#   - READER listener :50052 — mTLS, verifies clients against the broader READER
#     client CA (ca-reader.crt). AC is served read_only=true at the service
#     boundary, so a reader identity CANNOT poison action-key -> result mappings
#     even if its client config is wrong (the Bazel/Google RBE seam: AC writes are
#     the poisoning vector; CAS blobs are content-addressed, and verify_hash below
#     rejects any blob whose bytes do not match its own digest).
#   - UNTRUSTED AUTHORS hold no certificate at all: the TLS handshake itself
#     refuses them (no participation, ADR-0556 D1 untrusted-author-presubmit), and
#     fork PRs receive no secrets on the runner side as defense in depth.
#   Key material comes from OpenBao via ExternalSecret (below) — never from this
#   manifest. OSS NativeLink does not ship per-identity API-key authz; mTLS client
#   CAs + the read_only AC listener ARE the keyed boundary in slice 1, and a
#   per-identity authz proxy is named follow-up work in ADR-0560.
---
# Slow tier = filesystem on a PersistentVolume, NOT SeaweedFS S3 (ADR-0560 D1
# bring-up evidence). The `experimental_cloud_object_store` tier cannot start in
# this image: constructing it panics with `failure to initialize platform
# verifier: General("No CA certificates were loaded from the system")` — the image
# carries no system CA bundle, and the verifier is built during startup store
# construction, before any request, so a plaintext in-cluster endpoint does not
# avoid it. Shipping that tier active would guarantee CrashLoopBackOff, so this
# manifest deploys the tier ADR-0560 records as indicated.
#
# SeaweedFS revisit (queued in ADR-0560, deliberately NOT wired here): projecting
# a CA bundle into the pod is the precondition. The bucket identity stays reserved
# at OpenBao `oya/ci/nativelink-cas-s3` (dedicated `nativelink-cas` bucket, keyed
# separately from the sccache bucket identity); its ExternalSecret + the
# `oya.io/seaweedfs-client` egress label return with that revisit rather than
# projecting credentials the process never reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nativelink-cas-config
  namespace: oya-ci
  labels:
    app.kubernetes.io/part-of: oya-substrate
    app: nativelink-cas
    oya.io/adr: ADR-0560
data:
  cas.json: |
    {
      "stores": [
        {
          "name": "CAS_MAIN_STORE",
          "verify": {
            "backend": {
              "fast_slow": {
                "fast": {
                  "filesystem": {
                    "content_path": "/cache/cas-content",
                    "temp_path": "/cache/cas-tmp",
                    "eviction_policy": { "max_bytes": 8000000000 }
                  }
                },
                "slow": {
                  "filesystem": {
                    "content_path": "/data/cas-content",
                    "temp_path": "/data/cas-tmp",
                    "eviction_policy": { "max_bytes": 40000000000 }
                  }
                }
              }
            },
            "verify_size": true,
            "verify_hash": true
          }
        },
        {
          "name": "AC_MAIN_STORE",
          "fast_slow": {
            "fast": {
              "filesystem": {
                "content_path": "/cache/ac-content",
                "temp_path": "/cache/ac-tmp",
                "eviction_policy": { "max_bytes": 1000000000 }
              }
            },
            "slow": {
              "filesystem": {
                "content_path": "/data/ac-content",
                "temp_path": "/data/ac-tmp",
                "eviction_policy": { "max_bytes": 5000000000 }
              }
            }
          }
        }
      ],
      "servers": [
        {
          "name": "writer",
          "listener": {
            "http": {
              "socket_address": "0.0.0.0:50051",
              "tls": {
                "cert_file": "/tls/tls.crt",
                "key_file": "/tls/tls.key",
                "client_ca_file": "/tls/ca-writer.crt"
              }
            }
          },
          "services": {
            "cas": [{ "instance_name": "main", "cas_store": "CAS_MAIN_STORE" }],
            "ac": [{ "instance_name": "main", "ac_store": "AC_MAIN_STORE", "read_only": false }],
            "capabilities": [{ "instance_name": "main" }],
            "bytestream": [{ "instance_name": "main", "cas_store": "CAS_MAIN_STORE" }]
          }
        },
        {
          "name": "reader",
          "listener": {
            "http": {
              "socket_address": "0.0.0.0:50052",
              "tls": {
                "cert_file": "/tls/tls.crt",
                "key_file": "/tls/tls.key",
                "client_ca_file": "/tls/ca-reader.crt"
              }
            }
          },
          "services": {
            "cas": [{ "instance_name": "main", "cas_store": "CAS_MAIN_STORE" }],
            "ac": [{ "instance_name": "main", "ac_store": "AC_MAIN_STORE", "read_only": true }],
            "capabilities": [{ "instance_name": "main" }],
            "bytestream": [{ "instance_name": "main", "cas_store": "CAS_MAIN_STORE" }]
          }
        },
        {
          "name": "ops",
          "listener": {
            "http": { "socket_address": "0.0.0.0:50061" }
          },
          "services": {
            "health": {},
            "admin": {}
          }
        }
      ],
      "global": { "max_open_files": 24576 }
    }
---
# mTLS material: server cert/key + the two client CAs, projected out of OpenBao
# (secret/oya/ci/nativelink-cas-tls, KV v2) by ESO — the standing
# external-secrets/OpenBao pattern (see infra/external-secrets/). Rotation in
# OpenBao propagates without redeploying. No key bytes live in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nativelink-cas-tls
  namespace: oya-ci
  labels:
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0560
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-oya
    kind: ClusterSecretStore
  target:
    name: nativelink-cas-tls
    creationPolicy: Owner
  data:
    - secretKey: tls.crt
      remoteRef: { key: oya/ci/nativelink-cas-tls, property: server-cert }
    - secretKey: tls.key
      remoteRef: { key: oya/ci/nativelink-cas-tls, property: server-key }
    - secretKey: ca-writer.crt
      remoteRef: { key: oya/ci/nativelink-cas-tls, property: writer-client-ca }
    - secretKey: ca-reader.crt
      remoteRef: { key: oya/ci/nativelink-cas-tls, property: reader-client-ca }
---
# Durable slow tier. Bounded by the store eviction policies above (40 GB CAS +
# 5 GB AC) so the claim is never the thing that fills. ReadWriteOnce matches the
# repo's `local-path` pattern (infra/seaweedfs, infra/registry) and pins the
# Deployment at one replica until the SeaweedFS revisit restores a shared tier.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nativelink-cas-data
  namespace: oya-ci
  labels:
    app: nativelink-cas
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0560
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nativelink-cas
  namespace: oya-ci
  labels:
    app: nativelink-cas
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0560
    oya.adr/decided-by: ADR-0560
spec:
  # Pinned at 1 while the slow tier is a ReadWriteOnce PV: the fast tier is a
  # node-local LRU on emptyDir (cache-of-cache, safe to lose), but the slow tier is
  # now pod-local durable state, not a shared object store. Horizontal scale-out
  # returns with the SeaweedFS revisit (ADR-0560 D1), which is what made the tier
  # stateless; it is a topology change today, not a replicas edit.
  replicas: 1
  selector:
    matchLabels:
      app: nativelink-cas
  template:
    metadata:
      labels:
        app: nativelink-cas
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nativelink
          # Digest-pinned to the multi-arch INDEX (kyverno verify-image policy
          # applies in-cluster).
          #
          # ADR-0560's multi-arch bring-up check is ANSWERED: v1.4.0 published a
          # single linux/amd64 manifest only (entrypoint
          # nativelink-x86_64-unknown-linux-musl), so it could never have run on
          # the aarch64 Talos pool this manifest targets, nor on ADR-0612 D1's
          # aarch64 worker tier. v1.6.0 is the first release publishing an OCI
          # INDEX covering linux/amd64 + linux/arm64.
          #
          # MUST be the index digest, never a child. A digest pin is resolved by
          # the runtime BEFORE the tag is consulted, so pinning a child manifest
          # silently forces that child's architecture and the `:v1.6.2` tag is
          # decorative. The previous pin here was sha256:b8cb150c… — the
          # linux/amd64 CHILD — which reintroduced on aarch64 the exact defect the
          # bump existed to remove. Verified against the ghcr manifest API with an
          # index Accept header (`docker manifest inspect` after a --platform pull
          # reports the resolved child, which is how the wrong value was taken):
          #   index        sha256:6750ab33…  (application/vnd.oci.image.index.v1+json)
          #     linux/amd64 sha256:b8cb150c…
          #     linux/arm64 sha256:ca6c6969…
          image: ghcr.io/tracemachina/nativelink:v1.6.2@sha256:6750ab337eb1835ebe8452ddb76786641a80e23de71d8a5e630469399219b6ea
          # No shell anywhere: the image entrypoint IS the nativelink binary; the
          # only argument is the declarative config file (ADR-0556 D4 — API-driven
          # service, no exec surface).
          args: ["/etc/nativelink/cas.json"]
          env:
            # No AWS_* here: the AWS SDK env chain exists only for the
            # cloud-object-store tier, which this manifest no longer activates
            # (see the ConfigMap header note). The three variables this container
            # used to set — AWS_ENDPOINT_URL / AWS_ACCESS_KEY_ID /
            # AWS_SECRET_ACCESS_KEY — return with the SeaweedFS revisit.
            - name: RUST_LOG
              value: "warn"
          ports:
            - { containerPort: 50051, name: grpc-writer }
            - { containerPort: 50052, name: grpc-reader }
            - { containerPort: 50061, name: ops }
          volumeMounts:
            - name: config
              mountPath: /etc/nativelink
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /status
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /status
              port: ops
            initialDelaySeconds: 15
            periodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: nativelink-cas-config
        - name: tls
          secret:
            secretName: nativelink-cas-tls
        - name: cache
          # Node-local LRU fast tier; bounded; safe to lose — durable truth lives
          # on the `data` claim below.
          emptyDir:
            sizeLimit: 12Gi
        - name: data
          persistentVolumeClaim:
            claimName: nativelink-cas-data
---
# Writer endpoint — trusted CI lanes only (mTLS writer CA at the listener; the
# warm-cache-rw.buckconfig overlay dials this Service).
apiVersion: v1
kind: Service
metadata:
  name: nativelink-cas-writer
  namespace: oya-ci
  labels:
    app: nativelink-cas
    oya.io/adr: ADR-0560
spec:
  selector:
    app: nativelink-cas
  ports: [{ name: grpc-writer, port: 50051, targetPort: 50051 }]
---
# Reader endpoint — broader reader identities; AC served read_only at the service
# boundary (the warm-cache-ro.buckconfig overlay dials this Service).
apiVersion: v1
kind: Service
metadata:
  name: nativelink-cas-reader
  namespace: oya-ci
  labels:
    app: nativelink-cas
    oya.io/adr: ADR-0560
spec:
  selector:
    app: nativelink-cas
  ports: [{ name: grpc-reader, port: 50052, targetPort: 50052 }]
---
# Defense in depth UNDER the mTLS boundary: only pods labeled as CAS clients may
# even reach the gRPC ports; the ops listener stays namespace-local (probes are
# kubelet traffic and bypass NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nativelink-cas-ingress
  namespace: oya-ci
spec:
  podSelector:
    matchLabels:
      app: nativelink-cas
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              oya.io/nativelink-cas-writer: "true"
      ports:
        - { protocol: TCP, port: 50051 }
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              oya.io/nativelink-cas-reader: "true"
      ports:
        - { protocol: TCP, port: 50052 }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 50061 }
