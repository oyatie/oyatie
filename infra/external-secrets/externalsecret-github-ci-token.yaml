# ExternalSecret: project the GitHub CI commit-status token out of OpenBao into
# the ci namespace as a native k8s Secret. This is the concrete consumer that
# proves the ESO->OpenBao path end-to-end (ADR-0374 CI webhook gateway; the
# gateway/lane POST GitHub commit statuses with this token, ADR-0363).
#
# Source of truth lives in OpenBao at  secret/oya/ci/github-ci-token  (KV v2),
# key `token`. See RUNBOOK.md for how it is seeded. ESO refreshes the target
# Secret on the interval below; rotating the value in OpenBao propagates here
# without redeploying any workload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ci-token
  namespace: ci
  labels:
    app.kubernetes.io/part-of: substrate
    oya.io/adr: ADR-0374
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-oya
    kind: ClusterSecretStore     # cluster-scoped store defined in this directory
  target:
    name: github-ci-token       # the k8s Secret ESO creates/owns in ci
    creationPolicy: Owner        # ESO creates + fully manages this Secret
  data:
    - secretKey: token           # key in the resulting k8s Secret
      remoteRef:
        key: oya/ci/github-ci-token   # KV v2 path under the `secret` mount
        property: token                # field within that KV entry
