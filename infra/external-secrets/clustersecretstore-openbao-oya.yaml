# ClusterSecretStore: External Secrets Operator (ESO) -> OpenBao (oya-kms).
# Captures the runtime ESO->OpenBao wiring as durable IaC so a fresh cluster
# reproduces it (these were previously live-only, applied by hand). ADR-0043
# (OpenBao KMS) + ADR-0374 (CI webhook). Operator chart is installed via the
# app-of-apps (infra/gitops/values.yaml -> external-secrets); OpenBao itself is
# infra/kms/openbao.k8s.yaml. These objects are cluster-scoped ESO bindings, but
# committed ExternalSecret consumers are gate-scoped by namespace + OpenBao key prefix.
#
# ===========================================================================
# CRITICAL OpenBao-side requirement (see RUNBOOK.md in this directory):
#   The OpenBao  auth/kubernetes/config  MUST set  disable_local_ca_jwt=true.
#
#   With disable_local_ca_jwt=true, OpenBao uses the CLIENT JWT (the
#   external-secrets ServiceAccount token that ESO presents) to perform the
#   Kubernetes TokenReview. That SA (external-secrets/external-secrets) is
#   granted system:auth-delegator by the ClusterRoleBinding in this directory
#   (clusterrolebinding-external-secrets-auth-delegator.yaml).
#
#   This DELIBERATELY avoids requiring OpenBao's OWN ServiceAccount to hold
#   system:auth-delegator: OpenBao runs as a plain Deployment SA in oya-kms and
#   is NOT wired for delegated TokenReview. Leaving disable_local_ca_jwt at its
#   default (false) makes OpenBao try to use ITS local SA token for the
#   TokenReview, which 403s and breaks every ExternalSecret. DO NOT remove this
#   requirement without also granting auth-delegator to OpenBao's SA.
# ===========================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-oya
  labels:
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0043
spec:
  provider:
    # OpenBao speaks the Vault wire protocol; ESO's `vault` provider drives it.
    vault:
      server: http://openbao.oya-kms.svc:8200
      path: secret            # KV mount point
      version: v2             # KV v2 (versioned secrets -> secret/data/<path>)
      auth:
        kubernetes:
          # Kubernetes auth method mount path inside OpenBao (`bao auth enable
          # kubernetes` -> mounted at auth/kubernetes).
          mountPath: kubernetes
          # OpenBao role bound to external-secrets/external-secrets with the
          # oya-ci-read policy (see RUNBOOK.md).
          role: eso-oya-ci
          # ESO presents THIS ServiceAccount's token as the client JWT. Because
          # OpenBao runs with disable_local_ca_jwt=true, this same SA is the one
          # that must hold system:auth-delegator for the TokenReview to succeed.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Parallel TLS migration stores. Existing consumers stay on the legacy names
# until all three of these report Ready against the offline-root CA, ESO is
# restarted, and post-restart sync is proven. The referenced ConfigMap contains
# the PUBLIC root certificate only and is installed by the trusted bootstrap.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-oya-tls-migration
spec:
  provider:
    vault:
      server: https://openbao.oya-kms.svc:8202
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-offline-root-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-oya-ci
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloud-k8s-csi-tls-migration
spec:
  provider:
    vault:
      server: https://openbao.oya-kms.svc:8202
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-offline-root-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cloud-k8s-csi
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloud-iam-svid-operator-tls-migration
spec:
  provider:
    vault:
      server: https://openbao.oya-kms.svc:8202
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-offline-root-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cloud-iam-svid-operator
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloud-k8s-csi
  labels:
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0043
spec:
  provider:
    # Dedicated cloud-k8s CSI role; do not reuse openbao-oya / eso-oya-ci for CSI keys.
    vault:
      server: http://openbao.oya-kms.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cloud-k8s-csi
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloud-iam-svid-operator
  labels:
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0043
spec:
  provider:
    # Dedicated cloud-iam SVID-operator join-token role; do not reuse CI policy for cloud-iam keys.
    vault:
      server: http://openbao.oya-kms.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cloud-iam-svid-operator
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
