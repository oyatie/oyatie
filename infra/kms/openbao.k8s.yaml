# OpenBao on k3s — the canonical secrets/KMS substrate (ADR-0043: OpenBao MPL-2,
# OSI-clean). Backs cloud-kms (transit engine = encrypt/decrypt-as-a-service) and
# cloud-secrets (KV + rotation). The agent-dispatch gateway reads its pooled LLM
# API keys FROM here at runtime — never a plaintext file/env (user directive).
# File storage is BARRIER-ENCRYPTED by the seal, so secrets are never at rest in
# plaintext. STAGE-0 single-node; HA + HSM auto-unseal per ADR-0043 is a follow-up.
# NOTE: init unseal-keys + root-token are generated at runtime and stored in a
# k8s Secret (etcd), NEVER committed — no secret appears in this manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: oya-kms
  labels: { app.kubernetes.io/part-of: oya-substrate, oya.io/adr: ADR-0043 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: oya-kms
data:
  openbao.hcl: |
    # This backend is REMOVED at OpenBao v2.7.0 (a minor). The binding version
    # constraint lives at the `image:` pin below, where a bumper actually looks;
    # tracked as F-SEC-OPENBAO-FILE-BACKEND.
    storage "file" { path = "/openbao/data" }   # barrier-encrypted at rest
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true   # plaintext listener is fenced by the NetworkPolicy below
    }
    api_addr     = "http://openbao.oya-kms.svc.cluster.local:8200"
    cluster_addr = "http://openbao.oya-kms.svc.cluster.local:8201"
    ui        = true
    log_level = "info"
    default_lease_ttl = "768h"
    max_lease_ttl     = "8760h"
---
# Staged TLS migration declaration. It is intentionally not mounted by the
# Deployment until the offline root's PUBLIC certificate and the server TLS
# Secret have been installed through the trusted bootstrap path. Legacy HTTP
# 8200/8201 stays live during ESO Ready/restart proof; a later reviewed cutover
# mounts this config and eventually removes the legacy listener.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-tls-migration-config
  namespace: oya-kms
data:
  openbao.hcl: |
    storage "file" { path = "/openbao/data" }
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable     = true
    }
    listener "tcp" {
      address         = "0.0.0.0:8202"
      cluster_address = "0.0.0.0:8203"
      tls_cert_file   = "/openbao/tls/tls.crt"
      tls_key_file    = "/openbao/tls/tls.key"
      tls_min_version = "tls13"
    }
    api_addr     = "https://openbao.oya-kms.svc.cluster.local:8202"
    cluster_addr = "https://openbao.oya-kms.svc.cluster.local:8203"
    ui = true
    log_level = "info"
    default_lease_ttl = "768h"
    max_lease_ttl = "8760h"
---
# Exact GitHub OIDC -> short-lived client-PKI desired state. These are role and
# policy payloads for the authenticated bootstrap reconciler; no token, key, CA
# private material, or issued certificate is stored here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-ci-identity-contract
  namespace: oya-kms
data:
  jwt-config.json: |
    {"oidc_discovery_url":"https://token.actions.githubusercontent.com","bound_issuer":"https://token.actions.githubusercontent.com","default_role":""}
  github-cas-writer-dev-push.json: |
    {"role_type":"jwt","user_claim":"job_workflow_ref","bound_audiences":["oya-openbao"],"bound_claims_type":"string","bound_claims":{"job_workflow_ref":"jason931225/oyatie/.github/workflows/oya-ci-required.yml@refs/heads/dev","ref":"refs/heads/dev","event_name":"push","repository_id":"1236575706","repository_owner_id":"56489493","repository_owner_type":"User","repository_visibility":"private","runner_environment":"self-hosted"},"token_policies":["ci-cas-writer"],"token_ttl":"5m","token_max_ttl":"5m"}
  github-cas-reader-integrity-canary.json: |
    {"role_type":"jwt","user_claim":"job_workflow_ref","bound_audiences":["oya-openbao"],"bound_claims_type":"string","bound_claims":{"job_workflow_ref":"jason931225/oyatie/.github/workflows/cache-integrity-canary.yml@refs/heads/dev","ref":"refs/heads/dev","event_name":["schedule","workflow_dispatch"],"repository_id":"1236575706","repository_owner_id":"56489493","repository_owner_type":"User","repository_visibility":"private","runner_environment":"self-hosted"},"token_policies":["ci-cas-reader"],"token_ttl":"5m","token_max_ttl":"5m"}
  github-re-client-integrity-canary.json: |
    {"role_type":"jwt","user_claim":"job_workflow_ref","bound_audiences":["oya-openbao"],"bound_claims_type":"string","bound_claims":{"job_workflow_ref":"jason931225/oyatie/.github/workflows/cache-integrity-canary.yml@refs/heads/dev","ref":"refs/heads/dev","event_name":["schedule","workflow_dispatch"],"repository_id":"1236575706","repository_owner_id":"56489493","repository_owner_type":"User","repository_visibility":"private","runner_environment":"self-hosted"},"token_policies":["ci-re-client"],"token_ttl":"5m","token_max_ttl":"5m"}
  pki-cas-writer.json: |
    {"allowed_uri_sans":["spiffe://oyatie.dev/ci/cas-writer"],"allow_any_name":false,"server_flag":false,"client_flag":true,"key_type":"ec","key_bits":256,"ttl":"3h","max_ttl":"3h"}
  pki-cas-reader.json: |
    {"allowed_uri_sans":["spiffe://oyatie.dev/ci/cas-reader"],"allow_any_name":false,"server_flag":false,"client_flag":true,"key_type":"ec","key_bits":256,"ttl":"3h","max_ttl":"3h"}
  pki-re-client.json: |
    {"allowed_uri_sans":["spiffe://oyatie.dev/ci/re-client"],"allow_any_name":false,"server_flag":false,"client_flag":true,"key_type":"ec","key_bits":256,"ttl":"3h","max_ttl":"3h"}
  ci-cas-writer.hcl: |
    path "pki_int/issue/cas-writer" { capabilities = ["update"] }
  ci-cas-reader.hcl: |
    path "pki_int/issue/cas-reader" { capabilities = ["update"] }
  ci-re-client.hcl: |
    path "pki_int/issue/re-client" { capabilities = ["update"] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: oya-kms
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: oya-kms
  labels: { app.kubernetes.io/name: openbao }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: openbao } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openbao }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: openbao
          # ⚠ DO NOT BUMP PAST 2.6.x AS A ROUTINE NON-MAJOR CHORE.
          # This deployment stores KMS data on the `file` physical backend (see
          # the openbao.hcl ConfigMap above), which OpenBao deprecates and
          # removes at v2.7.0 — a MINOR. Verified by running this exact pin:
          #   [WARN] storage.file: the file physical backend is deprecated; use
          #          bao operator migrate to move to a supported storage backend
          #          by v2.7.0
          # The raft migration must land BEFORE any 2.7 bump, or this substrate
          # loses the store every secret depends on. Tracked as
          # F-SEC-OPENBAO-FILE-BACKEND. 2.6.1 is current upstream latest, so
          # there is nothing to bump to today regardless.
          image: ghcr.io/openbao/openbao@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
          imagePullPolicy: IfNotPresent
          args: ["server", "-config=/openbao/config/openbao.hcl"]
          ports:
            - { name: http, containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /openbao/config }
            - { name: data, mountPath: /openbao/data }
          readinessProbe:                       # TCP — HTTP /health is non-200 while sealed
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: openbao-config }
        - name: data
          persistentVolumeClaim: { claimName: openbao-data }
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: oya-kms
spec:
  selector: { app.kubernetes.io/name: openbao }
  ports:
    - { name: http, port: 8200, targetPort: http }
    - { name: cluster, port: 8201, targetPort: cluster }
    # Reserved migration endpoints; they become Ready only after the staged TLS
    # config and bootstrap-provisioned server certificate are activated.
    - { name: https-migration, port: 8202, targetPort: 8202 }
    - { name: cluster-tls-migration, port: 8203, targetPort: 8203 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-ingress
  namespace: oya-kms
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: oya-substrate
    oya.io/adr: ADR-0043
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - { protocol: TCP, port: 8200 }
        - { protocol: TCP, port: 8202 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners
      ports:
        - { protocol: TCP, port: 8202 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oya-kms
      ports:
        - { protocol: TCP, port: 8201 }
        - { protocol: TCP, port: 8203 }
