# Apply before the trusted bootstrap writes the public certificate into ca.crt.
# Empty placeholders contain no key material and make both consumers explicit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-offline-root-ca
  namespace: external-secrets
data:
  ca.crt: ""
---
# NativeLink's server CA is an independent trust anchor. It validates the CAS
# server only; it neither authenticates OpenBao nor authorizes CAS clients.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nativelink-server-ca
  namespace: arc-runners
data:
  ca.crt: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-offline-root-ca
  namespace: arc-runners
data:
  ca.crt: ""
