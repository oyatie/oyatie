# GitHub OIDC -> short-lived client-PKI bootstrap inputs. The runbook applies
# these payloads with an authenticated OpenBao session; no controller is implied
# and no token, key, CA private material, or issued certificate is stored here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-ci-identity-contract
  namespace: kms
data:
  jwt-config.json: |
    {"oidc_discovery_url":"https://token.actions.githubusercontent.com","bound_issuer":"https://token.actions.githubusercontent.com","default_role":""}
  github-cas-writer-dev-push.json: |
    {"role_type":"jwt","user_claim":"workflow_ref","bound_audiences":["openbao"],"bound_claims_type":"string","bound_claims":{"workflow_ref":"jason931225/oyatie/.github/workflows/presubmit.yml@refs/heads/dev","job_workflow_ref":"jason931225/oyatie/.github/workflows/presubmit.yml@refs/heads/dev","ref":"refs/heads/dev","event_name":"push","repository_id":"1236575706","repository_owner_id":"56489493","repository_visibility":"public","runner_environment":"self-hosted","sub":"repo:jason931225/oyatie:ref:refs/heads/dev"},"token_policies":["ci-cas-writer"],"token_ttl":"5m","token_max_ttl":"5m"}
  pki-cas-writer.json: |
    {"require_cn":false,"allowed_domains":[],"allow_bare_domains":false,"allow_subdomains":false,"allow_glob_domains":false,"allow_ip_sans":false,"allow_localhost":false,"allowed_uri_sans":["spiffe://oyatie.dev/ci/cas-writer"],"allow_any_name":false,"server_flag":false,"client_flag":true,"key_type":"ec","key_bits":256,"ttl":"3h","max_ttl":"3h"}
  pki-cas-reader.json: |
    {"require_cn":false,"allowed_domains":[],"allow_bare_domains":false,"allow_subdomains":false,"allow_glob_domains":false,"allow_ip_sans":false,"allow_localhost":false,"allowed_uri_sans":["spiffe://oyatie.dev/ci/cas-reader"],"allow_any_name":false,"server_flag":false,"client_flag":true,"key_type":"ec","key_bits":256,"ttl":"3h","max_ttl":"3h"}
  ci-cas-writer.hcl: |
    path "pki_cas_writer/issue/cas-writer" { capabilities = ["update"] }
  ci-cas-reader.hcl: |
    path "pki_cas_reader/issue/cas-reader" { capabilities = ["update"] }
