# Argo Rollouts canary demo — the progressive-delivery substance of ADR-0349.
# A Rollout with a stepped canary (setWeight + pause + analysis gate); on an
# image change, traffic shifts gradually instead of all-at-once.
#
# Install the controller first:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts -f \
#     https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# Local-vs-production: this proves canary STEPPING + an analysis gate. Metric-
# gated auto-rollback needs a metrics provider (Prometheus); the AnalysisTemplate
# below uses a job-based success check as the gate placeholder (prod wires SLO
# burn-rate queries per cloud-observability-slo-target).
---
apiVersion: v1
kind: Namespace
metadata:
  name: oya-rollouts-demo
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-gate
  namespace: oya-rollouts-demo
spec:
  metrics:
    - name: canary-health
      # Local gate: a job that succeeds (stands in for a Prometheus SLO query).
      # Production replaces provider with prometheus + an error-budget burn query.
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: busybox:1.38.0
                    command: ["sh", "-c", "echo canary SLO check OK && exit 0"]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  namespace: oya-rollouts-demo
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: demo }
  template:
    metadata:
      labels: { app: demo }
    spec:
      containers:
        - name: demo
          image: nginx:1.29-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 10 }
        - analysis:
            templates:
              - templateName: canary-gate
        - setWeight: 50
        - pause: { duration: 10 }
        - setWeight: 75
        - pause: { duration: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: oya-rollouts-demo
spec:
  selector: { app: demo }
  ports: [{ port: 80, targetPort: 80 }]
