# In-cluster git server (git daemon) — the local GitOps source for ArgoCD.
# Closes the deferred CD seam: ArgoCD repo-server clones from git:// to sync.
#
# An initContainer seeds a bare repo from the manifests ConfigMap; the main
# container serves it read-only over git://. Production points ArgoCD at the
# real VCS (GitHub; ci-webhook-gateway per ADR-0374/0387); this is the local
# analogue.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-demo-manifests
  namespace: argocd
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gitops-demo
      labels: { app: gitops-demo }
    spec:
      replicas: 2
      selector:
        matchLabels: { app: gitops-demo }
      template:
        metadata:
          labels: { app: gitops-demo }
        spec:
          containers:
            - name: web
              image: nginx:1.29-alpine
              ports: [{ containerPort: 80 }]
              resources:
                requests: { cpu: "25m", memory: "32Mi" }
                limits: { cpu: "100m", memory: "64Mi" }
  service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: gitops-demo
    spec:
      selector: { app: gitops-demo }
      ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: argocd
  labels: { app: git-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: git-server }
  template:
    metadata:
      labels: { app: git-server }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                  # so uid 1000 can write the gitdata volume
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: seed-repo
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              export HOME=/tmp
              git config --global user.email ci@oya.local
              git config --global user.name oya-ci
              git config --global init.defaultBranch main
              git init --bare /srv/git/oya-demo.git
              rm -rf /tmp/wt && mkdir -p /tmp/wt
              cp /manifests/*.yaml /tmp/wt/
              cd /tmp/wt
              git init
              git add -A
              git commit -m "seed gitops demo"
              git remote add origin /srv/git/oya-demo.git
              git push origin HEAD:refs/heads/main
          # Writes only to mounted volumes (/srv/git, /tmp), so a read-only root
          # filesystem is safe; runs as the image's user with all caps dropped.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: gitdata, mountPath: /srv/git }
            - { name: manifests, mountPath: /manifests }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: git-daemon
          # Prebaked image (git-server.Dockerfile): git-daemon is installed at
          # BUILD time, so this runs non-root with a read-only root filesystem.
          # No runtime apk-add (the prior anti-pattern). Build/load per the
          # Dockerfile header before applying on the farm.
          image: oya-git-server:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: git, containerPort: 9418 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: gitdata, mountPath: /srv/git }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: gitdata
          emptyDir: {}
        - name: tmp                      # writable scratch for readOnlyRootFilesystem
          emptyDir: {}
        - name: manifests
          configMap:
            name: gitops-demo-manifests
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: argocd
spec:
  selector: { app: git-server }
  ports: [{ name: git, port: 9418, targetPort: 9418 }]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oya-gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "git://git-server.argocd.svc.cluster.local/oya-demo.git"
    targetRevision: main
    path: .
  destination:
    server: "https://kubernetes.default.svc"
    namespace: oya-gitops-demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
