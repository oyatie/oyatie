# SeaweedFS single-node S3 — the sccache remote-cache backend for the local CI farm.
# Realizes specs/ci-farm-substrate-canonical.json remote_build_cache.backend
# (ADR-0196 canonical object storage) at the spec's endpoint/bucket.
#
# LOCAL profile: single replica, emptyDir-backed PVC, STATIC credentials in a
# plain Secret. Production binds S3 creds from OpenBao and runs SeaweedFS HA
# (master/volume/filer separation) — see README.
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  namespace: oya-ci-jenkins
type: Opaque
stringData:
  # LOCAL-ONLY placeholder creds (not secret-sensitive). Prod: OpenBao-bound.
  access_key: "oya-ci"
  secret_key: "oya-ci-secret-local"
  # SeaweedFS S3 identity config: one admin identity that can auto-create buckets.
  s3.json: |
    {
      "identities": [
        {
          "name": "oya-ci",
          "credentials": [
            { "accessKey": "oya-ci", "secretKey": "oya-ci-secret-local" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: oya-ci-jenkins
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: oya-ci-jenkins
  labels: { app: seaweedfs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-s3.port=8333"
            - "-master.volumeSizeLimitMB=256"
            - "-volume.max=0"
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: volume, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /status, port: 8333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3cfg, mountPath: /etc/seaweedfs }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: seaweedfs-data }
        - name: s3cfg
          secret:
            secretName: seaweedfs-s3
            items:
              - { key: s3.json, path: s3.json }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: oya-ci-jenkins
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
