# Oyatie CI farm — Jenkins controller (Talos local; ADR-0380 D1+D2 redesign)
# Realizes EXE-CI-FARM-SUBSTRATE-CANONICAL (ADR-0349) for the Talos local substrate
# (ADR-0378). JCasC-only; numExecutors=0 on the controller; ephemeral Kubernetes
# agents in the oya-ci-jenkins namespace.
#
# 2026-05-28 — ADR-0380 D1+D2 cutover: this file was redesigned away from the
# colima-era topology (SeaweedFS sccache + hostPath /Users/jasonlee mount, both
# structurally broken on Talos VMs). Concretely:
#   - D1 plugins: added generic-webhook-trigger + build-token-root + http_request
#     so the gated job (D3) can accept token-authed webhook dispatches from the
#     ci-webhook-gateway (ADR-0374) and post Forgejo commit-status via the
#     statuses API. The gitea plugin is intentionally NOT installed — Forgejo
#     is canonical (ADR-0363) and the gateway already does webhook discovery.
#   - D2 agent template: collapsed three colima-era templates (rust-ci /
#     rust-build / rust-parallel) into a single self-contained `rust-ci`; stripped
#     all sccache wiring (RUSTC_WRAPPER, SCCACHE_*, AWS_*); dropped the hostPath
#     /Users/jasonlee/Developer/source mount (a Talos VM cannot see the macOS
#     host filesystem). The Jenkinsfile in D3 will clone the PR ref into the
#     workspace using the GH_TOKEN env (projected from the gateway-build-git
#     Secret), then run `oya gate run-all`, then post the status.
#
# Remote build cache is honest-deferred to ADR-0381 D4 (SeaweedFS-on-Talos
# restored onto the storage specialty pool); BuildKit's cache + Jenkins agent
# sccache will share the same SeaweedFS bucket-api once D4 lands. Until then
# the gate runs against a cold cargo cache (correct but slow — discipline
# beats speed).
#
# LOCAL-vs-PRODUCTION deltas (intentionally simplified — see README.md):
#   - runtimeClass kata-cloud-hypervisor (ADR-0338)  -> omitted; Talos default runc
#   - Karpenter elastic node autoscaling (ADR-0198)  -> omitted; single Talos node
#                                                      (multi-node CP/Worker/Specialty
#                                                      pools land in ADR-0381 D2)
#   - cosign-required digest-pinned agent image      -> public rust image (local only)
#   - SeaweedFS sccache + AWS_* creds                -> deferred to ADR-0381 D4
#   - hostPath /Users/jasonlee/Developer/source      -> retired; pipeline clones
#                                                      from GitHub via GH_TOKEN
# None of these deltas change the controller/agent/JCasC contract; they are the
# capacity/hardening layer that only the real multi-node farm provides.

controller:
  # JCasC-only: the controller schedules, it does not execute (spec: numExecutors=0).
  numExecutors: 0
  serviceType: ClusterIP        # local: reach via `kubectl port-forward`; no LoadBalancer
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - cloudbees-folder
    - pipeline-stage-view
    # ADR-0380 D1: gating-pipeline plugins.
    - generic-webhook-trigger    # token-authed inbound dispatch from ci-webhook-gateway (ADR-0374)
    - build-token-root           # per-job build tokens; the gateway uses these to authorize triggers
    - http_request               # POST to Forgejo statuses API for commit-status (no `gitea` plugin — ADR-0363 Forgejo canonical)
    - job-dsl                    # ADR-0380 D3: declarative oya-ci-gate pipelineJob authoring in JCasC
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  # ADR-0380 D3: project credentials into the controller env so JCasC can
  # materialize them into the Jenkins Credentials store.
  #   - forgejo-ci-token: posts commit-status via the Forgejo statuses API.
  #     Minted by ADR-0380 D4 in-pod (forgejo admin user generate-access-token).
  #     Optional until D4 lands; until then the job's status-post step will
  #     fail at withCredentials (honest failure — not a silent skip).
  #   - gateway-build-git: cpsScm clone of dev (read-only) + GH_TOKEN for the
  #     PR ref fetch inside the pipeline.
  containerEnv:
    - name: FORGEJO_CI_TOKEN
      valueFrom:
        secretKeyRef:
          name: forgejo-ci-token
          key: token
          optional: true
    - name: GH_USERNAME
      valueFrom:
        secretKeyRef: { name: gateway-build-git, key: username, optional: true }
    - name: GH_TOKEN
      valueFrom:
        secretKeyRef: { name: gateway-build-git, key: token, optional: true }
  JCasC:
    defaultConfig: true
    # Contribute ONLY the kubernetes agent cloud. numExecutors (=0) and the
    # systemMessage are owned by the chart's defaultConfig block; redefining
    # them here triggers JCasC's error-on-conflict merge (boot failure).
    configScripts:
      oya-ci-farm: |
        jenkins:
          clouds:
            - kubernetes:
                name: "oya-ci-kubernetes"
                namespace: "oya-ci-jenkins"
                jenkinsUrl: "http://oya-jenkins.oya-ci-jenkins.svc.cluster.local:8080"
                # websocket: agents tunnel inbound over the 8080 HTTP service, so no
                # separate JNLP TCP:50000 endpoint resolution is required.
                webSocket: true
                containerCapStr: "20"           # safety ceiling, not a fixed pool
                connectTimeout: 60
                readTimeout: 60
                templates:
                  - name: "rust-ci"
                    namespace: "oya-ci-jenkins"
                    label: "oya-rust-ci"
                    yamlMergeStrategy: "override"
                    # ADR-0380 D2 (Talos redesign): one self-contained template.
                    # NO sccache substrate (no SeaweedFS on Talos yet — ADR-0381
                    # D4 restores it). NO hostPath mount (Talos VM cannot see
                    # the macOS host filesystem). The Jenkinsfile (D3) clones the
                    # PR ref into /workspace using GH_TOKEN, then runs the gate.
                    yaml: |
                      apiVersion: v1
                      kind: Pod
                      spec:
                        # Run as UID 1000 (the jenkins workspace owner) so the
                        # durable task can write the workspace.
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 1000
                          fsGroup: 1000
                        # ADR-0381 D2 cell affinity: prefer the CI specialty pool
                        # when it exists. Soft preference; single-node Talos
                        # continues to schedule rust-ci on the only node.
                        affinity:
                          nodeAffinity:
                            preferredDuringSchedulingIgnoredDuringExecution:
                              - weight: 100
                                preference:
                                  matchExpressions:
                                    - key: oya.cell/ci
                                      operator: In
                                      values: ["true"]
                        tolerations:
                          - key: dedicated
                            operator: Equal
                            value: ci
                            effect: NoSchedule
                        containers:
                          - name: rust
                            # ADR-0380 D6: custom rust-ci image (rust:1-bookworm
                            # + sccache 0.8). Built by the rust-ci-image-build
                            # Job at infra/ci/jenkins/agent-image/buildkit-build.yaml.
                            # If absent (first bring-up), apply the Job first or
                            # temporarily revert image to rust:1-bookworm.
                            image: registry.oya-registry.svc.cluster.local:5000/rust-ci:dev
                            imagePullPolicy: Always
                            command: ["sleep"]
                            args: ["infinity"]
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
                            env:
                              # ADR-0380 D6 sccache restoration — points at
                              # SeaweedFS-on-Talos (ADR-0381 D4). Bucket auto-
                              # creates on first PUT.
                              - name: RUSTC_WRAPPER
                                value: "sccache"
                              - name: SCCACHE_BUCKET
                                value: "oya-ci-sccache"
                              - name: SCCACHE_ENDPOINT
                                value: "seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333"
                              - name: SCCACHE_S3_USE_SSL
                                value: "false"
                              - name: SCCACHE_REGION
                                value: "oya-local"
                              - name: SCCACHE_S3_KEY_PREFIX
                                value: "oya-ci/dev/"
                              # SeaweedFS-on-Talos runs in anonymous mode for the
                              # cluster-internal CI cache (auth is a hardening
                              # follow-on alongside ADR-0381 D3 cell boundaries).
                              # sccache's SCCACHE_S3_NO_CREDENTIALS=true uses an
                              # unsigned client — no AWS_* env vars, no AWS SDK
                              # credential chain (Oyatie does not consume AWS;
                              # ADR-0381 amendment 3, hyperscaler-lens-architectural-filter).
                              - name: SCCACHE_S3_NO_CREDENTIALS
                                value: "true"
                              # sccache + cargo incremental conflict; disable
                              # incremental so sccache owns the layer caching.
                              - name: CARGO_INCREMENTAL
                                value: "0"
                              # gh token for the pipeline's first-stage `git clone`
                              # of the PR ref. The gateway-build-git Secret already
                              # exists in oya-ci-jenkins (it was minted for the
                              # retired Kaniko Job; ADR-0381 D1 keeps it).
                              - name: GH_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: gateway-build-git
                                    key: token
                            resources:
                              requests:
                                cpu: "2"
                                memory: "4Gi"
                              limits:
                                cpu: "4"
                                memory: "8Gi"
      # ADR-0374 T2: globalLibraries — loads oyaCiLane (infra/ci/jenkins/shared-library)
      # so per-service Jenkinsfiles can use @Library('oya-jenkins-shared') _.
      # Source = this repo at the dev branch; the shared-library path is the
      # subdirectory root (Jenkins treats it as a standard shared library layout
      # with vars/ containing the groovy scripts).
      oya-ci-shared-library: |
        unclassified:
          globalLibraries:
            libraries:
              - name: "oya-jenkins-shared"
                defaultVersion: "dev"
                implicit: false
                allowVersionOverride: true
                includeInChangesets: false
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/jason931225/oyatie.git"
                        credentialsId: "gateway-build-git"
                        traits:
                          - gitBranchDiscovery
                    libraryPath: "infra/ci/jenkins/shared-library"
      # ADR-0380 D3: declare the two credentials used by the oya-ci-gate job.
      oya-ci-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      scope: GLOBAL
                      id: "forgejo-ci-token"
                      description: "ADR-0380 D4 Forgejo CI token — for POST /repos/{owner}/{repo}/statuses/{sha}"
                      secret: "${FORGEJO_CI_TOKEN}"
                  - usernamePassword:
                      scope: GLOBAL
                      id: "gateway-build-git"
                      description: "GitHub clone creds (ADR-0381 D1 reuses the gateway-build-git Secret); used by cpsScm + by the PR-ref fetch step"
                      username: "${GH_USERNAME}"
                      password: "${GH_TOKEN}"
                  - usernamePassword:
                      scope: GLOBAL
                      id: "forgejo-clone"
                      description: "Forgejo git-over-HTTP clone creds (oya-admin + forgejo-ci-token). Used by the oya-ci-gate cpsScm to clone the GATING forge (ADR-0363 Forgejo-of-record): PRs + PR refs (refs/pull/N/head) live on Forgejo, not GitHub."
                      username: "oya-admin"
                      password: "${FORGEJO_CI_TOKEN}"
      # ADR-0380 D3: declare the oya-ci-gate pipelineJob via job-dsl. Pipeline
      # body lives in infra/ci/jenkins/Jenkinsfile-oya-ci-gate (cpsScm; cloned
      # from this repo at trigger time, NOT at boot — Jenkins boots cleanly
      # even when the repo is unreachable).
      oya-ci-gate-job: |
        jobs:
          - script: |
              pipelineJob('oya-ci-gate') {
                description('ADR-0380 D3: webhook-dispatched gated CI job. Triggered by ci-webhook-gateway (ADR-0374) via Generic Webhook Trigger with token=oya-ci-gate. Pipeline body: infra/ci/jenkins/Jenkinsfile-oya-ci-gate.')
                parameters {
                  stringParam('PR_NUMBER', '', 'Forgejo PR number (form param from ci-webhook-gateway buildWithParameters)')
                  stringParam('GIT_SHA', '', 'PR head commit SHA')
                  stringParam('GIT_BRANCH', '', 'PR head branch ref')
                  stringParam('REPO', '', 'owner/repo full name')
                  stringParam('DELIVERY_ID', '', 'Forgejo webhook delivery id')
                }
                authToken('oya-ci-gate')
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('http://forgejo.oya-forge.svc.cluster.local:3000/oya-admin/oyatie.git')
                          credentials('forgejo-clone')
                        }
                        branch('dev')
                        extensions {
                          cloneOptions {
                            depth(1)
                            shallow(true)
                            noTags(true)
                          }
                        }
                      }
                    }
                    scriptPath('infra/ci/jenkins/Jenkinsfile-oya-ci-gate')
                    lightweight(false)
                  }
                }
              }

persistence:
  enabled: true
  storageClass: "local-path"   # k3s default provisioner (Talos: replaced by storage specialty pool in ADR-0381 D2)
  size: "8Gi"

agent:
  # Agent pods are defined by the JCasC pod template above; disable the chart's
  # default inline agent so the JCasC kubernetes cloud is the single source of truth.
  enabled: false

rbac:
  create: true
serviceAccount:
  create: true
