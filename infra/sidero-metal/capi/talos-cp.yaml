apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: oya-sidero-metal-cp
  namespace: default
spec:
  replicas: 3
  version: v1.36.1
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: MetalMachineTemplate
    name: oya-sidero-metal-cp
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      configPatches:
        - op: add
          path: /cluster/network/cni
          value:
            name: none
        - op: add
          path: /cluster/proxy
          value:
            disabled: true
        - op: add
          path: /machine/install/image
          value: factory.talos.dev/installer/3da7f440f279f4814fa73bdf83c84710a8e93c40a4a3cbba4d969f14afb96298:v1.13.3
