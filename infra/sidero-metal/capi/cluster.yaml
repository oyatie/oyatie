apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: oya-sidero-metal
  namespace: default
  labels:
    oya.io/cell: kr-metal
    oya.io/substrate: sidero-metal
    oya.io/bootstrap: "true"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: TalosControlPlane
    name: oya-sidero-metal-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: MetalCluster
    name: oya-sidero-metal
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: MetalCluster
metadata:
  name: oya-sidero-metal
  namespace: default
spec:
  controlPlaneEndpoint:
    host: 10.240.0.20
    port: 6443
