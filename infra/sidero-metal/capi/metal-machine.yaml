apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: MetalMachineTemplate
metadata:
  name: oya-sidero-metal-cp
  namespace: default
spec:
  template:
    spec:
      serverClassName: oya-metal-control-plane
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: oya-sidero-metal-workers
  namespace: default
spec:
  clusterName: oya-sidero-metal
  replicas: 2
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: oya-sidero-metal
      oya.io/node-pool: worker
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: oya-sidero-metal
        oya.io/node-pool: worker
    spec:
      clusterName: oya-sidero-metal
      version: v1.36.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: oya-sidero-metal-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
        kind: MetalMachineTemplate
        name: oya-sidero-metal-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: MetalMachineTemplate
metadata:
  name: oya-sidero-metal-workers
  namespace: default
spec:
  template:
    spec:
      serverClassName: oya-metal-worker
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: oya-sidero-metal-workers
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      configPatches:
        - op: add
          path: /machine/nodeLabels
          value:
            katacontainers.io/kata-runtime: "true"
        - op: add
          path: /machine/kernel
          value:
            modules:
              - name: vhost_net
              - name: vhost_vsock
        - op: add
          path: /machine/install/image
          value: factory.talos.dev/installer/3da7f440f279f4814fa73bdf83c84710a8e93c40a4a3cbba4d969f14afb96298:v1.13.3
