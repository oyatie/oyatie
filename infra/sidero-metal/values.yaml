# Sidero Metal installer Helm values stub for the Oyatie bare-metal management plane.
# Hyperscaler lens: Apache-2.0 Sidero stack, Talos-native enrollment, CAPI-compatible lifecycle.
# Secrets and site-specific BMC credentials stay in OpenBao/SOPS-managed overlays, not this file.

namespace: sidero-system

sidero:
  enabled: true
  image:
    repository: ghcr.io/siderolabs/sidero-controller-manager
    tag: v0.6.0
    pullPolicy: IfNotPresent

server:
  apiEndpoint: https://sidero.oyatie.dev
  enrollmentEndpoint: https://sidero-link.oyatie.dev
  autoAcceptServers: false
  serverClasses:
    - name: oya-metal-control-plane
      selector:
        matchLabels:
          oya.io/role: control-plane
          oya.io/substrate: sidero-metal
      configPatches:
        - op: add
          path: /cluster/network/cni
          value:
            name: none
        - op: add
          path: /cluster/proxy
          value:
            disabled: true
    - name: oya-metal-worker
      selector:
        matchLabels:
          oya.io/role: worker
          oya.io/substrate: sidero-metal
      configPatches:
        - op: add
          path: /machine/nodeLabels
          value:
            katacontainers.io/kata-runtime: "true"

networking:
  dhcp:
    enabled: false
    externalConfig: infra/sidero-metal/dhcp-tftp.yaml
  pxe:
    enabled: true
    ipxeScriptUrl: http://boot.oyatie.local/ipxe/sidero-metal.ipxe

observability:
  serviceMonitor:
    enabled: true
    labels:
      oya.io/component: sidero-metal

security:
  podSecurityStandards:
    enforce: restricted
  admission:
    requireSignedImages: true
