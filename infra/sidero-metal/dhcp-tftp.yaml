# PXE/iPXE/DHCP configuration stub for Sidero Metal enrollment.
# Keep network addresses and hardware identities in per-site overlays.

apiVersion: v1
kind: ConfigMap
metadata:
  name: sidero-metal-dhcp-tftp
  namespace: sidero-system
  labels:
    app.kubernetes.io/name: sidero-metal
    oya.io/substrate: sidero-metal
data:
  dhcp.yaml: |
    interfaces:
      - name: provisioning
        match:
          label: oya.io/network=provisioning
        ipv4:
          cidr: 10.240.0.0/24
          gateway: 10.240.0.1
          rangeStart: 10.240.0.50
          rangeEnd: 10.240.0.199
          dnsServers:
            - 10.240.0.1
        boot:
          nextServer: 10.240.0.10
          filename: ipxe/sidero-metal.efi
    reservations: []
  tftp.yaml: |
    root: /var/lib/sidero/tftp
    files:
      ipxe/sidero-metal.efi:
        source: ghcr.io/siderolabs/ipxe:v0.6.0  # digest TBD: @sha256:<fill-on-deploy>
      ipxe/sidero-metal.ipxe:
        inline: |
          #!ipxe
          dhcp
          set base-url https://factory.talos.dev
          chain ${base-url}/metal-installer || shell  # NOTE: lab default — production must mirror Image Factory in-cluster
