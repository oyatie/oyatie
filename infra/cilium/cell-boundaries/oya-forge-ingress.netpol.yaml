# ADR-0381 D3 — GitHub cell ingress boundary.
#
# Restricts ingress to pods in oya-forge (the GitHub SCM):
#   - same-namespace pod-to-pod.
#   - oya-ci (CI webhook gateway + Jenkins posting commit-status via /api/v1).
#   - oya-ci-jenkins (Jenkins controller doing the cpsScm clone).
#   - argocd (sync of the GitHub Deployment).
#
# GitHub is the SCM front-door for the gated CI loop (ADR-0363). External
# access (developer pushes from outside the cluster) flows through an Ingress
# or LoadBalancer that's NOT in the namespaceSelector list above — those
# clients reach GitHub via the Service mesh ingress gateway, not via direct
# cell-to-cell traffic, so the policy permits exactly the in-cluster seams.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-forge-ingress
  namespace: oya-forge
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "foundation"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oya-ci
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oya-ci-jenkins
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
