# ADR-0381 D3 — CI cell ingress boundary.
#
# Restricts ingress to pods in ci (BuildKit daemon + ci-webhook-gateway +
# any future CI specialty workload):
#   - same-namespace pod-to-pod (BuildKit Job consumes buildkitd daemon).
#   - ci-jenkins (Jenkins agents that drive builds + status posts).
#   - forge (GitHub webhook delivery to ci-webhook-gateway).
#   - argocd (sync + drift detection).
#
# Anything else is denied. Egress unconstrained (the CI cell needs outbound
# CoreDNS + outbound to storage bucket-api + outbound to registry +
# outbound to forge for status posts — restricting egress too aggressively
# breaks the loop).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-ingress
  namespace: ci
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "ci"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-jenkins
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
