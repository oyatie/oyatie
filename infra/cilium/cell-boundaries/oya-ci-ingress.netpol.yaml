# ADR-0381 D3 — CI cell ingress boundary.
#
# Restricts ingress to pods in oya-ci (BuildKit daemon + ci-webhook-gateway +
# any future CI specialty workload):
#   - same-namespace pod-to-pod (BuildKit Job consumes buildkitd daemon).
#
# Anything else is denied. Egress unconstrained (the CI cell needs outbound
# CoreDNS + outbound to oya-storage bucket-api + outbound to oya-registry +
# native SCM/CI/CD endpoints once cutover lands — restricting egress too
# aggressively breaks the loop).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-ci-ingress
  namespace: oya-ci
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "ci"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
