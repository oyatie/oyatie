# ADR-0381 D3 — llm-gateway cell ingress boundary.
#
# Restricts ingress to pods in oya-llm-gateway (the LLM provider reverse proxy):
#   - same-namespace pod-to-pod.
#   - argocd (sync + drift detection on the Deployment).
#   - any namespace that labels itself oya.gateway-client=true (agent-tenant
#     namespaces, opted-in by the operator at namespace create time).
#
# Anything else (including unlabelled namespaces) is denied. Egress is intentionally
# unconstrained — the gateway must reach api.openai.com, api.anthropic.com,
# generativelanguage.googleapis.com.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-llm-gateway-ingress
  namespace: oya-llm-gateway
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "tenant"
spec:
  podSelector:
    matchLabels:
      app: llm-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - from:
        - namespaceSelector:
            matchLabels:
              oya.gateway-client: "true"
