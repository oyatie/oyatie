# ADR-0381 D3 — CI Jenkins cell ingress boundary.
#
# Restricts ingress to pods in oya-ci-jenkins (Jenkins controller + agent
# pods spawned by the kubernetes cloud):
#   - same-namespace pod-to-pod (controller <-> agent over WebSocket on :8080).
#   - oya-ci (ci-webhook-gateway calling /generic-webhook-trigger/invoke).
#   - argocd (sync + drift detection on the JCasC config).
#
# Anything else is denied. Egress unconstrained (Jenkins needs outbound for
# git clone + status post + sccache to oya-storage + image pulls).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-ci-jenkins-ingress
  namespace: oya-ci-jenkins
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "ci"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oya-ci
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
