# ADR-0381 D3 — first cell-boundary NetworkPolicy. Scope: storage cell ingress only.
#
# Restricts ingress to SeaweedFS pods (app=seaweedfs in storage) to the
# legitimate seams:
#   - same-namespace pod-to-pod (future split master/volume/filer/bucket-api Deployments).
#   - the CI cell (ci + ci-jenkins) — BuildKit cache + Jenkins agent
#     sccache + image registry overlay consumers.
#   - argocd — sync + drift detection.
#
# Anything else is denied (any NetworkPolicy attached to a pod turns on
# default-deny for that pod's listed policyTypes — here Ingress only).
#
# Egress is intentionally unconstrained (no policyTypes: [Egress] entry).
# SeaweedFS doesn't initiate outbound traffic beyond local DNS, and a too-
# restrictive egress policy would block CoreDNS lookups (default ClusterFirst
# resolution).
#
# This is enforced by Cilium L3/L4 (ADR-0148; networking.k8s.io/v1 NetworkPolicy
# is what Cilium consumes for namespaced cell boundaries). When ADR-0381 D2
# lands the multi-node topology, this policy continues to work unchanged —
# Cilium evaluates per-pod regardless of node placement.
#
# Rollout discipline: this is the FIRST cell-boundary policy. We're starting
# narrow (only the newest, smallest cell — storage) so an authorization
# regression has a minimal blast radius. The pattern proves out here; the
# remaining cell boundaries (ci, tenant, foundation) follow as additional
# NetworkPolicy resources in sibling files in this directory.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-ingress
  namespace: storage
  labels:
    oya.adr/decided-by: ADR-0381-D3
    oya.cell-boundary/scope: "ingress-only"
    oya.cell-boundary/target-cell: "storage"
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes: [Ingress]
  ingress:
    # Same-namespace pod-to-pod (future split master/volume/filer/bucket-api sibling Deployments).
    - from:
        - podSelector: {}
    # CI cell — BuildKit (ci) + Jenkins agents (ci-jenkins).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-jenkins
    # ArgoCD sync + drift detection.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
