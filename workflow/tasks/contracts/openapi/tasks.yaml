openapi: 3.2.0
info:
  title: oyatie Tasks µservice API
  version: 1.0.0
  description: |
    Tasks µservice REST API. Surfaces task-store, project-list, view-engine,
    dependency-graph, recurrence, search-index, and importers bounded contexts.

    Per ADR-0135 (unbundle) + ADR-0132 (no-grouping forward policy): tasks is a
    standalone tenant-facing µservice. Dual-context (Personal / Professional) isolation
    enforced structurally per `policy/dual-context-isolation.md`.

    Authentication: OIDC + per-tenant API key (over HTTPS + mTLS where applicable).
    Authorisation: Cedar v4.2 policies (`tenant-scope.cedar`, `auditor-scope.cedar`,
    `ci.cedar`, `public-read.cedar`). T2 auto-assign in employment-context REFUSED
    per ADR-TASKS-0006 (EU AI Act Annex III §4).
  contact:
    name: axis-tasks
    email: tasks@oyatie.com
  license:
    name: Internal-Use
servers:
  - url: https://tasks.{pack}.oyatie.com/v1
    description: per-pack production endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
        default: kr

security:
  - oidcBearer: []
  - tenantApiKey: []

tags:
  - name: tasks
    description: Task CRUD + state-transitions + legal-hold (task-store BC)
  - name: projects
    description: Project / list + custom-field schema (project-list BC)
  - name: boards
    description: Board / view rendering + DnD (view-engine BC)
  - name: dependencies
    description: blocks / blocked-by / relates-to (dependency-graph BC)
  - name: recurrence
    description: Recurring task RRULE materialisation (recurrence BC)
  - name: search
    description: Cross-task + cross-project search (search-index BC)
  - name: bulk
    description: Bulk-edit pipeline (task-store BC)
  - name: importers
    description: CSV / Jira / Asana / Trello / Linear / Todoist import (importers BC)

paths:
  /tasks:
    post:
      summary: Create task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      summary: List tasks (per tenant + context + project filter)
      tags: [tasks]
      parameters:
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [personal, professional]
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
        - name: assignee_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string}
        - name: due_after
          in: query
          schema: {type: string, format: date-time}
        - name: due_before
          in: query
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          schema: {type: integer, maximum: 1000, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'

  /tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get task
      tags: [tasks]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '409':
          description: Optimistic-concurrency conflict (version mismatch)
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Archive task (soft-delete; legal-hold blocks hard-delete)
      tags: [tasks]
      responses:
        '204':
          description: Archived

  /tasks/{task_id}/transition:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Transition task state (per project status-workflow)
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_state]
              properties:
                to_state: {type: string}
                expected_version: {type: integer}
                comment: {type: string}
      responses:
        '200':
          description: Transitioned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '422':
          description: Invalid transition per status-workflow (`InvalidTransition::Refused`)

  /tasks/{task_id}/legal-hold:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Open legal hold on task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LegalHoldRequest'}
      responses:
        '201':
          description: Hold opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}

  /tasks/{task_id}/comments:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Add comment to task
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 16000}
                mentions:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskComment'}

  /tasks/{task_id}/dependencies:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Declare a dependency edge from this task
      tags: [dependencies]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependencyAddRequest'}
      responses:
        '201':
          description: Edge declared
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyEdge'}
        '409':
          description: Cycle detected — write refused per ADR-TASKS-0002
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyCycleRefusal'}
    get:
      summary: List dependency edges from + to this task
      tags: [dependencies]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  outgoing:
                    type: array
                    items: {$ref: '#/components/schemas/DependencyEdge'}
                  incoming:
                    type: array
                    items: {$ref: '#/components/schemas/DependencyEdge'}

  /dependencies/graph:
    get:
      summary: Render dependency graph for a project (BFS-bounded)
      tags: [dependencies]
      parameters:
        - name: project_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: depth
          in: query
          schema: {type: integer, maximum: 10, default: 3}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyGraph'}

  /projects:
    post:
      summary: Create project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
    get:
      summary: List projects
      tags: [projects]
      parameters:
        - name: context
          in: query
          required: true
          schema: {type: string, enum: [personal, professional]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: {$ref: '#/components/schemas/Project'}

  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [projects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
    patch:
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}

  /projects/{project_id}/custom-fields:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Declare a custom field on a project (typed-schema-per-project per ADR-TASKS-0001)
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldDefinitionRequest'}
      responses:
        '201':
          description: Field declared
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomFieldDefinition'}
        '422':
          description: Type coercion refused — strict typing per ADR-TASKS-0001
    get:
      tags: [projects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items: {$ref: '#/components/schemas/CustomFieldDefinition'}

  /projects/{project_id}/status-workflow:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Replace status-workflow definition for a project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusWorkflowDefinition'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusWorkflowDefinition'}

  /projects/{project_id}/boards/{board_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: board_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Render board view (columns × tasks)
      tags: [boards]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardView'}

  /projects/{project_id}/boards/{board_id}/reorder:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: board_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Reorder a task on a board (deterministic re-rank per ADR-TASKS-0004)
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, target_column, target_rank_key]
              properties:
                task_id: {type: string, format: uuid}
                target_column: {type: string}
                target_rank_key:
                  type: string
                  description: |
                    Deterministic lexicographic rank key (LexoRank-style); generated client-side
                    or via /rank-helper. Determinism: identical reorder ops always produce
                    identical final order regardless of arrival order. Per ADR-TASKS-0004.
                expected_version: {type: integer}
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardView'}

  /views:
    get:
      summary: List saved views for tenant
      tags: [boards]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  views:
                    type: array
                    items: {$ref: '#/components/schemas/SavedView'}
    post:
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedView'}

  /recurrence/expand:
    post:
      summary: Expand a recurring task rule into materialised instances (bounded ≤ 5y horizon)
      tags: [recurrence]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecurrenceExpandRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecurrenceExpandResponse'}
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /search:
    post:
      summary: Cross-task + cross-project search (Meilisearch backend)
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}

  /bulk-edit:
    post:
      summary: Bulk-edit ≥1 ≤10000 tasks atomically (all-or-nothing per tenant transaction)
      tags: [bulk]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkEditRequest'}
      responses:
        '202':
          description: Bulk job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkEditJob'}
        '422':
          description: Validation refused (e.g., cycle-inducing dependency change)

  /bulk-edit/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [bulk]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkEditJob'}

  /importers/{source}:
    parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
          enum: [csv, jira, asana, trello, linear, todoist]
    post:
      summary: Start an importer job
      tags: [importers]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Import job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}

  /importers/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [importers]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: tasks
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantApiKey:
      type: apiKey
      in: header
      name: X-Tenant-API-Key
  responses:
    Forbidden:
      description: Forbidden (Cedar policy refusal)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Unprocessable Entity (validation error)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Task:
      type: object
      required: [task_id, tenant_id, context, project_id, title, status, created_at]
      properties:
        task_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        context:
          type: string
          enum: [personal, professional]
        project_id: {type: string, format: uuid}
        parent_task_id:
          type: string
          format: uuid
          nullable: true
        title: {type: string, maxLength: 500}
        description: {type: string, maxLength: 65000}
        status: {type: string, description: "per project status-workflow"}
        priority:
          type: string
          enum: [p0, p1, p2, p3]
        assignees:
          type: array
          items: {type: string, format: uuid}
        primary_assignee_id:
          type: string
          format: uuid
          nullable: true
        watchers:
          type: array
          items: {type: string, format: uuid}
        labels:
          type: array
          items: {type: string}
        due_at:
          type: string
          format: date-time
          nullable: true
        start_at:
          type: string
          format: date-time
          nullable: true
        recurrence_rule:
          type: string
          description: RFC 5545 RRULE subset per ADR-TASKS-0003
          nullable: true
        custom_fields:
          type: object
          additionalProperties: true
          description: |
            Strictly-typed per project custom-field schema (ADR-TASKS-0001 hybrid model).
            Server refuses silent coerce-from-string at write time.
        checklist:
          type: array
          items:
            type: object
            properties:
              item_id: {type: string, format: uuid}
              text: {type: string}
              done: {type: boolean}
        retention_policy_id: {type: string}
        legal_hold_open: {type: boolean, default: false}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TaskCreateRequest:
      type: object
      required: [context, project_id, title]
      properties:
        context:
          type: string
          enum: [personal, professional]
        project_id: {type: string, format: uuid}
        parent_task_id: {type: string, format: uuid}
        title: {type: string, maxLength: 500}
        description: {type: string, maxLength: 65000}
        priority:
          type: string
          enum: [p0, p1, p2, p3]
        assignees:
          type: array
          maxItems: 50
          items: {type: string, format: uuid}
        labels:
          type: array
          items: {type: string}
        due_at: {type: string, format: date-time}
        start_at: {type: string, format: date-time}
        recurrence_rule: {type: string}
        custom_fields:
          type: object
          additionalProperties: true

    TaskUpdateRequest:
      type: object
      properties:
        title: {type: string}
        description: {type: string}
        priority: {type: string, enum: [p0, p1, p2, p3]}
        assignees:
          type: array
          items: {type: string, format: uuid}
        labels:
          type: array
          items: {type: string}
        due_at: {type: string, format: date-time}
        custom_fields:
          type: object
          additionalProperties: true
        expected_version: {type: integer}

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        next_cursor: {type: string}

    TaskComment:
      type: object
      properties:
        comment_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        author_id: {type: string, format: uuid}
        body: {type: string}
        mentions:
          type: array
          items: {type: string, format: uuid}
        created_at: {type: string, format: date-time}

    DependencyAddRequest:
      type: object
      required: [to_task_id, kind]
      properties:
        to_task_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [blocks, blocked_by, relates_to]

    DependencyEdge:
      type: object
      properties:
        edge_id: {type: string, format: uuid}
        from_task_id: {type: string, format: uuid}
        to_task_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [blocks, blocked_by, relates_to]
        created_at: {type: string, format: date-time}

    DependencyCycleRefusal:
      type: object
      properties:
        code: {type: string, const: "DependencyCycle::Refused"}
        cycle_path:
          type: array
          items: {type: string, format: uuid}
          description: "Ordered task_id list that would form a cycle"
        message: {type: string}

    DependencyGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              task_id: {type: string, format: uuid}
              title: {type: string}
              status: {type: string}
        edges:
          type: array
          items: {$ref: '#/components/schemas/DependencyEdge'}
        critical_path:
          type: array
          items: {type: string, format: uuid}

    Project:
      type: object
      properties:
        project_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, professional]}
        name: {type: string, maxLength: 200}
        description: {type: string}
        custom_field_schema_id: {type: string, format: uuid}
        status_workflow_id: {type: string, format: uuid}
        members:
          type: array
          items:
            type: object
            properties:
              user_id: {type: string, format: uuid}
              role: {type: string, enum: [owner, admin, editor, viewer]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ProjectCreateRequest:
      type: object
      required: [context, name]
      properties:
        context: {type: string, enum: [personal, professional]}
        name: {type: string, maxLength: 200}
        description: {type: string}
        template_id: {type: string, format: uuid}

    ProjectUpdateRequest:
      type: object
      properties:
        name: {type: string}
        description: {type: string}

    CustomFieldDefinitionRequest:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, maxLength: 100}
        kind:
          type: string
          enum: [text, number, date, dropdown, multi_select, person, url, checkbox]
        options:
          type: array
          items: {type: string}
          description: "required when kind ∈ {dropdown, multi_select}"
        required: {type: boolean, default: false}

    CustomFieldDefinition:
      allOf:
        - $ref: '#/components/schemas/CustomFieldDefinitionRequest'
        - type: object
          properties:
            field_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}

    StatusWorkflowDefinition:
      type: object
      required: [states, initial_state, transitions]
      properties:
        workflow_id: {type: string, format: uuid}
        states:
          type: array
          items: {type: string}
        initial_state: {type: string}
        transitions:
          type: array
          items:
            type: object
            properties:
              from_state: {type: string}
              to_state: {type: string}
              allowed_roles:
                type: array
                items: {type: string}

    BoardView:
      type: object
      properties:
        board_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        columns:
          type: array
          items:
            type: object
            properties:
              column_id: {type: string}
              name: {type: string}
              tasks:
                type: array
                items: {$ref: '#/components/schemas/Task'}
              total_count: {type: integer}

    SavedView:
      type: object
      properties:
        view_id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [list, board, gantt, calendar, timeline, table]
        filter_dsl: {type: string}
        created_at: {type: string, format: date-time}

    SavedViewCreateRequest:
      type: object
      required: [kind, filter_dsl]
      properties:
        kind:
          type: string
          enum: [list, board, gantt, calendar, timeline, table]
        filter_dsl: {type: string}
        name: {type: string}

    RecurrenceExpandRequest:
      type: object
      required: [recurrence_rule, starts_at, window_starts_at, window_ends_at]
      properties:
        recurrence_rule:
          type: string
          description: RFC 5545 RRULE subset aligned with calendar ADR-CAL-0002
        starts_at: {type: string, format: date-time}
        window_starts_at: {type: string, format: date-time}
        window_ends_at:
          type: string
          format: date-time
          description: "Must be within 5y of window_starts_at (ADR-TASKS-0003 bound)"

    RecurrenceExpandResponse:
      type: object
      properties:
        occurrences:
          type: array
          items:
            type: object
            properties:
              instance_at: {type: string, format: date-time}
              due_at: {type: string, format: date-time}

    SearchRequest:
      type: object
      required: [q]
      properties:
        q: {type: string, maxLength: 1024}
        project_ids:
          type: array
          items: {type: string, format: uuid}
        context: {type: string, enum: [personal, professional]}
        status: {type: string}
        assignee_id: {type: string, format: uuid}
        labels:
          type: array
          items: {type: string}
        limit: {type: integer, maximum: 200, default: 25}
        cursor: {type: string}

    SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            type: object
            properties:
              task_id: {type: string, format: uuid}
              project_id: {type: string, format: uuid}
              title: {type: string}
              snippet: {type: string}
              score: {type: number}
        next_cursor: {type: string}
        total_estimated: {type: integer}

    BulkEditRequest:
      type: object
      required: [task_ids, patch]
      properties:
        task_ids:
          type: array
          minItems: 1
          maxItems: 10000
          items: {type: string, format: uuid}
        patch:
          type: object
          properties:
            status: {type: string}
            priority: {type: string, enum: [p0, p1, p2, p3]}
            assignees:
              type: array
              items: {type: string, format: uuid}
            labels_add:
              type: array
              items: {type: string}
            labels_remove:
              type: array
              items: {type: string}
            project_id: {type: string, format: uuid}
        idempotency_key: {type: string, format: uuid}

    BulkEditJob:
      type: object
      properties:
        bulk_op_id: {type: string, format: uuid}
        state:
          type: string
          enum: [pending, applying, completed, partial_failure, refused]
        affected_count: {type: integer}
        refused_count: {type: integer}
        errors:
          type: array
          items:
            type: object
            properties:
              task_id: {type: string, format: uuid}
              reason: {type: string}

    ImportJob:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        source:
          type: string
          enum: [csv, jira, asana, trello, linear, todoist]
        state:
          type: string
          enum: [pending, parsing, mapping, importing, completed, partial_success, failed, quarantined]
        rows_planned: {type: integer}
        rows_imported: {type: integer}
        rows_skipped: {type: integer}
        errors:
          type: array
          items:
            type: object
            properties:
              row: {type: integer}
              error_kind: {type: string}
              sample: {type: string}

    LegalHoldRequest:
      type: object
      required: [opened_by, reason]
      properties:
        opened_by: {type: string, format: uuid}
        reason: {type: string}
        related_matter_id: {type: string}

    LegalHold:
      type: object
      properties:
        hold_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        opened_by: {type: string, format: uuid}
        opened_at: {type: string, format: date-time}
        reason: {type: string}

    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
