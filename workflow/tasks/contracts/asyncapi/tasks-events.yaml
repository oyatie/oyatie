asyncapi: 3.1.0
info:
  title: oyatie Tasks µservice — AsyncAPI Event Catalog
  version: 1.0.0
  description: |
    AsyncAPI definitions for tasks µservice events on the oyatie Workflow event bus.

    Per ADR-0131 + ADR-0132, tasks emits events consumed by:
    - workflow-engine (task-bound automation triggers per ADR-TASKS-0005)
    - audit-chain (Ed25519 + Merkle seal emission per Bominal ADR-0028)
    - messenger (chat notification)
    - mail (email notification)
    - search-index (Meilisearch reindex)
    - observability (telemetry)

    Every event carries a content hash + audit-chain seal pointer + Ed25519 signature
    over (id, type, time, subject, payload_hash) per Bominal ADR-0028.

defaultContentType: application/cloudevents+json

servers:
  workflow-event-bus:
    host: workflow.{pack}.oyatie.com
    protocol: nats
    description: per-pack Workflow event bus
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]

channels:
  tasks.task.lifecycle.v1:
    address: tasks.task.lifecycle.v1
    description: Task lifecycle (create / update / archive)
    messages:
      TaskCreated:
        $ref: '#/components/messages/TaskCreated'
      TaskUpdated:
        $ref: '#/components/messages/TaskUpdated'
      TaskArchived:
        $ref: '#/components/messages/TaskArchived'

  tasks.task.state.v1:
    address: tasks.task.state.v1
    description: Status-workflow transitions
    messages:
      TaskStateTransitioned:
        $ref: '#/components/messages/TaskStateTransitioned'

  tasks.task.assignment.v1:
    address: tasks.task.assignment.v1
    description: Assignment / un-assignment events
    messages:
      TaskAssigned:
        $ref: '#/components/messages/TaskAssigned'
      TaskUnassigned:
        $ref: '#/components/messages/TaskUnassigned'

  tasks.task.comment.v1:
    address: tasks.task.comment.v1
    description: Task comment lifecycle
    messages:
      TaskCommented:
        $ref: '#/components/messages/TaskCommented'

  tasks.task.dependency.v1:
    address: tasks.task.dependency.v1
    description: Dependency-graph events
    messages:
      DependencyAdded:
        $ref: '#/components/messages/DependencyAdded'
      DependencyRemoved:
        $ref: '#/components/messages/DependencyRemoved'

  tasks.task.recurrence.v1:
    address: tasks.task.recurrence.v1
    description: Recurring-task materialisation
    messages:
      RecurrenceMaterialised:
        $ref: '#/components/messages/RecurrenceMaterialised'

  tasks.task.board.v1:
    address: tasks.task.board.v1
    description: Board re-rank events
    messages:
      BoardReordered:
        $ref: '#/components/messages/BoardReordered'

  tasks.task.bulk.v1:
    address: tasks.task.bulk.v1
    description: Bulk-edit pipeline events
    messages:
      BulkUpdated:
        $ref: '#/components/messages/BulkUpdated'

  tasks.task.io.v1:
    address: tasks.task.io.v1
    description: Import / export job lifecycle
    messages:
      TaskImported:
        $ref: '#/components/messages/TaskImported'
      TaskExported:
        $ref: '#/components/messages/TaskExported'

  audit.tasks.legal_hold.v1:
    address: audit.tasks.legal_hold.v1
    description: Legal hold transitions (audit-chain + governance)
    messages:
      LegalHoldApplied:
        $ref: '#/components/messages/LegalHoldApplied'
      LegalHoldReleased:
        $ref: '#/components/messages/LegalHoldReleased'

operations:
  publishTaskCreated:
    action: send
    channel: {$ref: '#/channels/tasks.task.lifecycle.v1'}
    messages:
      - $ref: '#/channels/tasks.task.lifecycle.v1/messages/TaskCreated'

  publishTaskUpdated:
    action: send
    channel: {$ref: '#/channels/tasks.task.lifecycle.v1'}
    messages:
      - $ref: '#/channels/tasks.task.lifecycle.v1/messages/TaskUpdated'

  publishTaskArchived:
    action: send
    channel: {$ref: '#/channels/tasks.task.lifecycle.v1'}
    messages:
      - $ref: '#/channels/tasks.task.lifecycle.v1/messages/TaskArchived'

  publishTaskStateTransitioned:
    action: send
    channel: {$ref: '#/channels/tasks.task.state.v1'}

  publishTaskAssigned:
    action: send
    channel: {$ref: '#/channels/tasks.task.assignment.v1'}

  publishTaskUnassigned:
    action: send
    channel: {$ref: '#/channels/tasks.task.assignment.v1'}

  publishTaskCommented:
    action: send
    channel: {$ref: '#/channels/tasks.task.comment.v1'}

  publishDependencyAdded:
    action: send
    channel: {$ref: '#/channels/tasks.task.dependency.v1'}

  publishDependencyRemoved:
    action: send
    channel: {$ref: '#/channels/tasks.task.dependency.v1'}

  publishRecurrenceMaterialised:
    action: send
    channel: {$ref: '#/channels/tasks.task.recurrence.v1'}

  publishBoardReordered:
    action: send
    channel: {$ref: '#/channels/tasks.task.board.v1'}

  publishBulkUpdated:
    action: send
    channel: {$ref: '#/channels/tasks.task.bulk.v1'}

  publishTaskImported:
    action: send
    channel: {$ref: '#/channels/tasks.task.io.v1'}

  publishTaskExported:
    action: send
    channel: {$ref: '#/channels/tasks.task.io.v1'}

  publishLegalHoldApplied:
    action: send
    channel: {$ref: '#/channels/audit.tasks.legal_hold.v1'}

  publishLegalHoldReleased:
    action: send
    channel: {$ref: '#/channels/audit.tasks.legal_hold.v1'}

components:
  messages:
    TaskCreated:
      name: TaskCreated
      title: Task created
      payload: {$ref: '#/components/schemas/TaskLifecycleEvent'}

    TaskUpdated:
      name: TaskUpdated
      title: Task updated
      payload: {$ref: '#/components/schemas/TaskLifecycleEvent'}

    TaskArchived:
      name: TaskArchived
      title: Task archived (soft-delete)
      payload: {$ref: '#/components/schemas/TaskLifecycleEvent'}

    TaskStateTransitioned:
      name: TaskStateTransitioned
      title: Status-workflow transition
      payload: {$ref: '#/components/schemas/TaskStateTransitionEvent'}

    TaskAssigned:
      name: TaskAssigned
      title: Task assigned (assignee added)
      payload: {$ref: '#/components/schemas/TaskAssignmentEvent'}

    TaskUnassigned:
      name: TaskUnassigned
      title: Task unassigned (assignee removed)
      payload: {$ref: '#/components/schemas/TaskAssignmentEvent'}

    TaskCommented:
      name: TaskCommented
      title: Task comment added
      payload: {$ref: '#/components/schemas/TaskCommentEvent'}

    DependencyAdded:
      name: DependencyAdded
      title: Dependency edge added
      payload: {$ref: '#/components/schemas/DependencyEvent'}

    DependencyRemoved:
      name: DependencyRemoved
      title: Dependency edge removed
      payload: {$ref: '#/components/schemas/DependencyEvent'}

    RecurrenceMaterialised:
      name: RecurrenceMaterialised
      title: Recurring task instance materialised
      payload: {$ref: '#/components/schemas/RecurrenceMaterialiseEvent'}

    BoardReordered:
      name: BoardReordered
      title: Board column re-rank applied
      payload: {$ref: '#/components/schemas/BoardReorderEvent'}

    BulkUpdated:
      name: BulkUpdated
      title: Bulk-edit pipeline applied
      payload: {$ref: '#/components/schemas/BulkUpdateEvent'}

    TaskImported:
      name: TaskImported
      title: Importer job emitted task(s)
      payload: {$ref: '#/components/schemas/TaskIoEvent'}

    TaskExported:
      name: TaskExported
      title: Export job emitted artefact
      payload: {$ref: '#/components/schemas/TaskIoEvent'}

    LegalHoldApplied:
      name: LegalHoldApplied
      title: Legal hold opened on task
      payload: {$ref: '#/components/schemas/LegalHoldEvent'}

    LegalHoldReleased:
      name: LegalHoldReleased
      title: Legal hold lifted (2-person rule)
      payload: {$ref: '#/components/schemas/LegalHoldEvent'}

  schemas:
    CloudEventEnvelope:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - subject
        - tenant_id_hashed
        - pack_tag
        - audit_chain_seal_id
        - signature_ed25519
      properties:
        specversion: {type: string, const: "1.0"}
        id: {type: string, format: uuid}
        source: {type: string, const: "tasks"}
        type: {type: string}
        time: {type: string, format: date-time}
        subject: {type: string}
        tenant_id_hashed:
          type: string
          description: sha256(tenant_id)[..16] per threat-model.md
        pack_tag:
          type: string
          enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
        context_kind:
          type: string
          enum: [personal, professional]
        audit_chain_seal_id: {type: string, format: uuid}
        signature_ed25519:
          type: string
          description: Ed25519 over (id, type, time, subject, payload_hash)

    TaskLifecycleEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [task_id, project_id, version, lifecycle_state]
          properties:
            task_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            parent_task_id: {type: string, format: uuid}
            version: {type: integer}
            lifecycle_state:
              type: string
              enum: [created, updated, archived]
            title_hash:
              type: string
              description: sha256(title) — title itself not in envelope per PII redaction
            assignee_count: {type: integer}
            due_at:
              type: string
              format: date-time
              nullable: true

    TaskStateTransitionEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [task_id, project_id, from_state, to_state]
          properties:
            task_id: {type: string, format: uuid}
            project_id: {type: string, format: uuid}
            from_state: {type: string}
            to_state: {type: string}
            transitioned_by_user_id_hashed: {type: string}
            via_workflow_id:
              type: string
              format: uuid
              nullable: true
              description: "Set when transition was driven by workflow-engine"

    TaskAssignmentEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [task_id, assignee_user_id_hashed, action]
          properties:
            task_id: {type: string, format: uuid}
            assignee_user_id_hashed: {type: string}
            action:
              type: string
              enum: [added, removed]
            assigned_by_user_id_hashed: {type: string}
            primary: {type: boolean}
            via_auto_assign:
              type: boolean
              default: false
              description: |
                When true, action originated from T2 auto-assign capability.
                In employment-context this requires conformity-assessment per
                EU AI Act Annex III §4 — ADR-TASKS-0006.
            ai_capability_id:
              type: string
              nullable: true

    TaskCommentEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [comment_id, task_id, author_user_id_hashed]
          properties:
            comment_id: {type: string, format: uuid}
            task_id: {type: string, format: uuid}
            author_user_id_hashed: {type: string}
            body_hash: {type: string}
            mention_count: {type: integer}

    DependencyEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [from_task_id, to_task_id, kind, action]
          properties:
            from_task_id: {type: string, format: uuid}
            to_task_id: {type: string, format: uuid}
            kind:
              type: string
              enum: [blocks, blocked_by, relates_to]
            action:
              type: string
              enum: [added, removed]

    RecurrenceMaterialiseEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [recurrence_rule_id, window_hash, occurrence_count]
          properties:
            recurrence_rule_id: {type: string, format: uuid}
            seed_task_id: {type: string, format: uuid}
            window_hash: {type: string}
            window_starts_at: {type: string, format: date-time}
            window_ends_at: {type: string, format: date-time}
            occurrence_count: {type: integer}

    BoardReorderEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [board_id, task_id, from_column, to_column, rank_key]
          properties:
            board_id: {type: string, format: uuid}
            task_id: {type: string, format: uuid}
            from_column: {type: string}
            to_column: {type: string}
            rank_key:
              type: string
              description: "Deterministic LexoRank-style key per ADR-TASKS-0004"

    BulkUpdateEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [bulk_op_id, affected_count, outcome]
          properties:
            bulk_op_id: {type: string, format: uuid}
            affected_count: {type: integer}
            refused_count: {type: integer}
            outcome:
              type: string
              enum: [completed, partial_failure, refused]

    TaskIoEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [job_id, direction]
          properties:
            job_id: {type: string, format: uuid}
            direction:
              type: string
              enum: [import, export]
            source:
              type: string
              enum: [csv, jira, asana, trello, linear, todoist]
            rows_planned: {type: integer}
            rows_succeeded: {type: integer}

    LegalHoldEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [hold_id, task_id, action]
          properties:
            hold_id: {type: string, format: uuid}
            task_id: {type: string, format: uuid}
            action:
              type: string
              enum: [applied, released]
            opened_by_user_id_hashed: {type: string}
            reason: {type: string}
            two_person_approver_id_hashed:
              type: string
              description: Required when action=released
