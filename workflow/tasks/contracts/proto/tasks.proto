// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oya.tasks.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "oyatie.dev/tasks/v1;tasksv1";

// =====================================================================================
// Tasks µservice gRPC contracts.
//
// Per ADR-0135 (unbundle) + ADR-0132 (no-grouping policy) + ADR-0131 (per-µservice
// flat layout). Mirrors the REST surface in `contracts/openapi/tasks.yaml`.
//
// Cross-µservice peer: workflow-engine. The workflow-engine ⇔ tasks bridge uses these
// streams bidirectionally — workflow can create + mutate tasks; task state changes
// stream to workflow triggers — per ADR-TASKS-0005.
//
// Authentication: SPIFFE-bound mTLS/TLS 1.3 for this internal-only gRPC contract.
// Public OIDC/API-key authentication belongs to the REST/OpenAPI surface.
// Authorisation: Cedar v4.2 policies per `policy/*.cedar`.
// Dual-context isolation: Personal vs Professional task contexts are enforced
// structurally by separate fields and Cedar policy refusal per ADR-TASKS-0001.
// =====================================================================================

// ==================== Common ====================

enum TaskContext {
  TASK_CONTEXT_UNSPECIFIED = 0;
  TASK_CONTEXT_PERSONAL = 1;
  TASK_CONTEXT_PROFESSIONAL = 2;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_P0 = 1;
  PRIORITY_P1 = 2;
  PRIORITY_P2 = 3;
  PRIORITY_P3 = 4;
}

enum DependencyKind {
  DEPENDENCY_KIND_UNSPECIFIED = 0;
  DEPENDENCY_KIND_BLOCKS = 1;
  DEPENDENCY_KIND_BLOCKED_BY = 2;
  DEPENDENCY_KIND_RELATES_TO = 3;
}

enum CustomFieldKind {
  CUSTOM_FIELD_KIND_UNSPECIFIED = 0;
  CUSTOM_FIELD_KIND_TEXT = 1;
  CUSTOM_FIELD_KIND_NUMBER = 2;
  CUSTOM_FIELD_KIND_DATE = 3;
  CUSTOM_FIELD_KIND_DROPDOWN = 4;
  CUSTOM_FIELD_KIND_MULTI_SELECT = 5;
  CUSTOM_FIELD_KIND_PERSON = 6;
  CUSTOM_FIELD_KIND_URL = 7;
  CUSTOM_FIELD_KIND_CHECKBOX = 8;
}

enum ViewKind {
  VIEW_KIND_UNSPECIFIED = 0;
  VIEW_KIND_LIST = 1;
  VIEW_KIND_BOARD = 2;
  VIEW_KIND_GANTT = 3;
  VIEW_KIND_CALENDAR = 4;
  VIEW_KIND_TIMELINE = 5;
  VIEW_KIND_TABLE = 6;
}

enum ImportSource {
  IMPORT_SOURCE_UNSPECIFIED = 0;
  IMPORT_SOURCE_CSV = 1;
  IMPORT_SOURCE_JIRA = 2;
  IMPORT_SOURCE_ASANA = 3;
  IMPORT_SOURCE_TRELLO = 4;
  IMPORT_SOURCE_LINEAR = 5;
  IMPORT_SOURCE_TODOIST = 6;
}

message CustomFieldValue {
  string field_id = 1;
  // Strictly-typed per project schema (ADR-TASKS-0001). No silent coerce-from-string.
  oneof value {
    string text = 2;
    double number = 3;
    google.protobuf.Timestamp date = 4;
    string dropdown_option_id = 5;
    MultiSelectOptionIds multi_select = 6;
    string person_user_id = 7;
    string url = 8;
    bool checkbox = 9;
  }
}

message MultiSelectOptionIds {
  repeated string option_ids = 1;
}

message ChecklistItem {
  string item_id = 1;
  string text = 2;
  bool done = 3;
}

message Task {
  string task_id = 1;
  string tenant_id = 2;
  TaskContext context = 3;
  string project_id = 4;
  string parent_task_id = 5;
  string title = 6;
  string description = 7;
  string status = 8;       // per project status-workflow
  Priority priority = 9;
  repeated string assignee_user_ids = 10;
  string primary_assignee_user_id = 11;
  repeated string watcher_user_ids = 12;
  repeated string labels = 13;
  google.protobuf.Timestamp due_at = 14;
  google.protobuf.Timestamp start_at = 15;
  string recurrence_rule = 16;  // RFC 5545 RRULE subset per ADR-TASKS-0003
  repeated CustomFieldValue custom_fields = 17;
  repeated ChecklistItem checklist = 18;
  string retention_policy_id = 19;
  bool legal_hold_open = 20;
  int64 version = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

message TaskComment {
  string comment_id = 1;
  string task_id = 2;
  string author_user_id = 3;
  string body = 4;
  repeated string mention_user_ids = 5;
  google.protobuf.Timestamp created_at = 6;
}

message LegalHold {
  string hold_id = 1;
  string task_id = 2;
  string opened_by_user_id = 3;
  google.protobuf.Timestamp opened_at = 4;
  string reason = 5;
}

// ==================== Task Store ====================

service TaskStore {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc ArchiveTask(ArchiveTaskRequest) returns (google.protobuf.Empty);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc TransitionState(TransitionStateRequest) returns (Task);
  rpc AddComment(AddCommentRequest) returns (TaskComment);
  rpc OpenLegalHold(OpenLegalHoldRequest) returns (LegalHold);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (google.protobuf.Empty);
  // Stream task state transitions (consumed by workflow-engine per ADR-TASKS-0005).
  rpc StreamStateTransitions(StreamStateTransitionsRequest) returns (stream StateTransitionEvent);
}

message CreateTaskRequest {
  TaskContext context = 1;
  string project_id = 2;
  string parent_task_id = 3;
  string title = 4;
  string description = 5;
  Priority priority = 6;
  repeated string assignee_user_ids = 7;  // max 50
  repeated string labels = 8;
  google.protobuf.Timestamp due_at = 9;
  google.protobuf.Timestamp start_at = 10;
  string recurrence_rule = 11;
  repeated CustomFieldValue custom_fields = 12;
}

message GetTaskRequest {
  string task_id = 1;
}

message UpdateTaskRequest {
  string task_id = 1;
  Task task = 2;
  int64 expected_version = 3;
}

message ArchiveTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  TaskContext context = 1;
  string project_id = 2;
  string assignee_user_id = 3;
  string status = 4;
  google.protobuf.Timestamp due_after = 5;
  google.protobuf.Timestamp due_before = 6;
  int32 limit = 7;  // max 1000
  string cursor = 8;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  string next_cursor = 2;
}

message TransitionStateRequest {
  string task_id = 1;
  string to_state = 2;
  int64 expected_version = 3;
  string comment = 4;
}

message AddCommentRequest {
  string task_id = 1;
  string body = 2;
  repeated string mention_user_ids = 3;
}

message OpenLegalHoldRequest {
  string task_id = 1;
  string opened_by_user_id = 2;
  string reason = 3;
  string related_matter_id = 4;
}

message ReleaseLegalHoldRequest {
  string hold_id = 1;
  string two_person_approver_id = 2;
  string release_reason = 3;
}

message StreamStateTransitionsRequest {
  string tenant_id = 1;
  string since_cursor = 2;
}

message StateTransitionEvent {
  string task_id = 1;
  string project_id = 2;
  string from_state = 3;
  string to_state = 4;
  google.protobuf.Timestamp at = 5;
  string cursor = 6;
}

// ==================== Project / Custom Field ====================

service ProjectList {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc UpdateProject(UpdateProjectRequest) returns (Project);
  rpc DeclareCustomField(DeclareCustomFieldRequest) returns (CustomFieldDefinition);
  rpc ListCustomFields(ListCustomFieldsRequest) returns (ListCustomFieldsResponse);
  rpc PutStatusWorkflow(PutStatusWorkflowRequest) returns (StatusWorkflow);
}

message Project {
  string project_id = 1;
  string tenant_id = 2;
  TaskContext context = 3;
  string name = 4;
  string description = 5;
  string custom_field_schema_id = 6;
  string status_workflow_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateProjectRequest {
  TaskContext context = 1;
  string name = 2;
  string description = 3;
  string template_id = 4;
}

message GetProjectRequest {
  string project_id = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  Project project = 2;
}

message CustomFieldDefinition {
  string field_id = 1;
  string project_id = 2;
  string name = 3;
  CustomFieldKind kind = 4;
  repeated string options = 5;
  bool required = 6;
  google.protobuf.Timestamp created_at = 7;
}

message DeclareCustomFieldRequest {
  string project_id = 1;
  string name = 2;
  CustomFieldKind kind = 3;
  repeated string options = 4;
  bool required = 5;
}

message ListCustomFieldsRequest {
  string project_id = 1;
}

message ListCustomFieldsResponse {
  repeated CustomFieldDefinition fields = 1;
}

message StatusWorkflow {
  string workflow_id = 1;
  string project_id = 2;
  repeated string states = 3;
  string initial_state = 4;
  repeated StatusTransition transitions = 5;
}

message StatusTransition {
  string from_state = 1;
  string to_state = 2;
  repeated string allowed_roles = 3;
}

message PutStatusWorkflowRequest {
  string project_id = 1;
  StatusWorkflow workflow = 2;
}

// ==================== Dependency Graph ====================

service DependencyGraph {
  rpc AddDependency(AddDependencyRequest) returns (DependencyEdge);
  rpc RemoveDependency(RemoveDependencyRequest) returns (google.protobuf.Empty);
  rpc GetGraph(GetGraphRequest) returns (DependencyGraphResponse);
}

message DependencyEdge {
  string edge_id = 1;
  string from_task_id = 2;
  string to_task_id = 3;
  DependencyKind kind = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AddDependencyRequest {
  string from_task_id = 1;
  string to_task_id = 2;
  DependencyKind kind = 3;
}

message RemoveDependencyRequest {
  string edge_id = 1;
}

message GetGraphRequest {
  string project_id = 1;
  int32 depth = 2;  // max 10
}

message DependencyGraphResponse {
  repeated GraphNode nodes = 1;
  repeated DependencyEdge edges = 2;
  repeated string critical_path_task_ids = 3;
}

message GraphNode {
  string task_id = 1;
  string title = 2;
  string status = 3;
}

// ==================== Recurrence Engine ====================

service RecurrenceEngine {
  rpc ExpandRecurrence(ExpandRecurrenceRequest) returns (ExpandRecurrenceResponse);
}

message ExpandRecurrenceRequest {
  string recurrence_rule = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp window_starts_at = 3;
  google.protobuf.Timestamp window_ends_at = 4;  // ≤ 5y from window_starts_at
}

message RecurrenceOccurrence {
  google.protobuf.Timestamp instance_at = 1;
  google.protobuf.Timestamp due_at = 2;
}

message ExpandRecurrenceResponse {
  repeated RecurrenceOccurrence occurrences = 1;
}

// ==================== View Engine ====================

service ViewEngine {
  rpc GetBoard(GetBoardRequest) returns (BoardView);
  rpc ReorderBoard(ReorderBoardRequest) returns (BoardView);
  rpc ListSavedViews(ListSavedViewsRequest) returns (ListSavedViewsResponse);
}

message BoardColumn {
  string column_id = 1;
  string name = 2;
  repeated Task tasks = 3;
  int32 total_count = 4;
}

message BoardView {
  string board_id = 1;
  string project_id = 2;
  repeated BoardColumn columns = 3;
}

message GetBoardRequest {
  string board_id = 1;
}

message ReorderBoardRequest {
  string board_id = 1;
  string task_id = 2;
  string target_column = 3;
  string target_rank_key = 4;  // deterministic LexoRank-style per ADR-TASKS-0004
  int64 expected_version = 5;
}

message SavedView {
  string view_id = 1;
  string owner_user_id = 2;
  ViewKind kind = 3;
  string filter_dsl = 4;
  string name = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListSavedViewsRequest {
  string tenant_id = 1;
  string owner_user_id = 2;
}

message ListSavedViewsResponse {
  repeated SavedView views = 1;
}

// ==================== Search ====================

service SearchIndex {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse);
}

message SearchRequest {
  string q = 1;
  repeated string project_ids = 2;
  TaskContext context = 3;
  string status = 4;
  string assignee_user_id = 5;
  repeated string labels = 6;
  int32 limit = 7;  // max 200
  string cursor = 8;
}

message SearchHit {
  string task_id = 1;
  string project_id = 2;
  string title = 3;
  string snippet = 4;
  double score = 5;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  string next_cursor = 2;
  int64 total_estimated = 3;
}

message RebuildIndexRequest {
  string tenant_id = 1;
}

message RebuildIndexResponse {
  string job_id = 1;
}

// ==================== Bulk Edit ====================

service BulkEdit {
  rpc SubmitBulkEdit(BulkEditRequest) returns (BulkEditJob);
  rpc GetBulkEditJob(GetBulkEditJobRequest) returns (BulkEditJob);
}

message BulkEditPatch {
  string status = 1;
  Priority priority = 2;
  repeated string assignee_user_ids = 3;
  repeated string labels_add = 4;
  repeated string labels_remove = 5;
  string project_id = 6;
}

message BulkEditRequest {
  repeated string task_ids = 1;  // min 1 max 10000
  BulkEditPatch patch = 2;
  string idempotency_key = 3;
}

message BulkEditError {
  string task_id = 1;
  string reason = 2;
}

message BulkEditJob {
  string bulk_op_id = 1;
  string state = 2;  // pending|applying|completed|partial_failure|refused
  int64 affected_count = 3;
  int64 refused_count = 4;
  repeated BulkEditError errors = 5;
}

message GetBulkEditJobRequest {
  string bulk_op_id = 1;
}

// ==================== Importers ====================

service Importers {
  rpc StartImport(StartImportRequest) returns (ImportJob);
  rpc GetImportJob(GetImportJobRequest) returns (ImportJob);
}

message ImportJob {
  string job_id = 1;
  ImportSource source = 2;
  string state = 3;  // pending|parsing|mapping|importing|completed|partial_success|failed|quarantined
  int64 rows_planned = 4;
  int64 rows_imported = 5;
  int64 rows_skipped = 6;
  repeated ImportError errors = 7;
}

message ImportError {
  int32 row = 1;
  string error_kind = 2;
  string sample = 3;
}

message StartImportRequest {
  ImportSource source = 1;
  bytes payload = 2;  // max 100MB; sandboxed parser; 5min cap per importer
  string target_project_id = 3;
}

message GetImportJobRequest {
  string job_id = 1;
}
