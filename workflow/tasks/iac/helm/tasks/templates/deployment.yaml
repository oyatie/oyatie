# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-J Slice 2 per ADR-0064)
{{- range tuple "taskStoreRest" "customFieldWorker" "recurringTaskMaterializer" "dependencyGraphValidator" "searchIndexWorker" "viewEngineRest" "webhookFanoutWorker" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-{{ . | kebabcase }}
  namespace: tasks
  labels:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: oya-tasks
    oyatie/microservice: tasks
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      {{- if $c.runtimeClassName }}
      runtimeClassName: {{ $c.runtimeClassName }}
      {{- end }}
      serviceAccountName: tasks-{{ . | kebabcase }}
      securityContext:
        {{- include "oya.securityContext.podStandard65534" $ | nindent 8 }}
      containers:
        - name: tasks-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--component={{ . | kebabcase }}", "--pack={{ $.Values.global.pack }}"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: wss, containerPort: 8443}
            - {name: metrics, containerPort: 9091}
          resources:
            {{- include "oya.resourceRequests" (dict "tier" $c.resourceTier) | nindent 12 }}
          livenessProbe:
            {{- include "oya.probes.httpHealthLiveness8080" $ | nindent 12 }}
          readinessProbe:
            {{- include "oya.probes.httpHealthReadiness8080" $ | nindent 12 }}
          envFrom:
            - secretRef: {name: tasks-openbao-injected}
          securityContext:
            {{- include "oya.securityContext.restrictedContainerInline" $ | nindent 12 }}
{{- end }}
