# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tasks
commonLabels:
  app.kubernetes.io/name: tasks
  app.kubernetes.io/part-of: oya-tasks
resources:
  - namespace.yaml
helmCharts:
  - name: oya-tasks
    repo: file://../../helm/tasks
    version: 0.1.0
    releaseName: tasks
    valuesFile: ../../helm/tasks/values.yaml
