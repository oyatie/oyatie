  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-TASKS-0003 (recurrence; rrule-rs align with calendar ADR-CAL-0002).
  - ADR-TASKS-0006 — AI auto-assign + EU AI Act Annex III §4 bounds.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Art. 22 automated decisions; Annex III §4 employment-context.
  - GDPR Art. 22 (automated decisions).
  - EEOC UGESP 1978 (29 CFR §1607); Title VII Civil Rights Act 1964; ADA 42 USC §12101.
  - NY Local Law 144 (AEDT); CO AI Act HB23-1041.
  - 근로기준법 Arts. 23/41; 직장 갑질 protections.
  - Japanese Labour Standards Act; Fair Work Act 2009 (AU).
  - ISO 30414 (HR analytics).
  - microservices/tasks/PRD.md FR-20.
  - microservices/tasks/policy/task-isolation.md + dual-context-isolation.cedar.
  - microservices/tasks/slos/auto-assign-fairness-correctness.openslo.yaml.
  - microservices/tasks/runbooks/ai-assign-classifier-rollback.md.
