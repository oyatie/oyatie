# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T2-auto capabilities — tasks µservice
#
# Autonomy Tier 2: "autonomous, irreversible at completion". The system takes
# actions on a recurring basis WITHOUT per-action user approval, under a
# documented policy boundary. User can revoke the policy; future actions stop.
# Past actions stand.
#
# T2 in tasks has the HIGHEST scrutiny because **T2-task-auto-assign in
# employment-context engages EU AI Act Annex III §4 high-risk AI** and is
# REFUSED at the Cedar layer until ADR-TASKS-0006 conformity-assessment ADR
# ships per pack.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145) + ADR-TASKS-0006.
# Per EU AI Act Art. 50 + Art. 14 + Art. 22 + Annex III §4.

doc_class: AutonomyTierCatalog
microservice: tasks
tier: T2
owner_team: axis-tasks + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly + annually for AI Act conformity + bias-audit per pack-eu / pack-us-employment

capabilities:
  - id: T2-task-auto-assign
    name: "Auto-assign task to best-fit assignee (employment-context)"
    description: |
      For new tasks lacking an assignee, the assistant auto-assigns the
      task to the best-fit team member based on workload + skill profile
      + recent task history. Tenant-admin policy gates which projects
      participate. **In employment-context (where assignment affects
      work allocation among employees), this capability triggers EU AI
      Act Annex III §4 high-risk AI classification + GDPR Art. 22
      automated-decision concern + EEOC UGESP 1978 disparate-impact
      concern + 직장 갑질 (KR) + Fair Work Act (AU) overlays.**

      **REFUSED at Cedar layer until conformity-assessment ADR (ADR-
      TASKS-XXXX) ships per pack**. Currently:
      - pack-eu: REFUSED (EU AI Act Annex III §4).
      - pack-us: REFUSED until fairness-audit per slos/auto-assign-fairness-correctness.openslo.yaml is green.
      - pack-us-NY: REFUSED until NY Local Law 144 AEDT audit complete.
      - pack-kr-employment-context: REFUSED (직장 갑질).
      - pack-jp-employment-context: REFUSED (Labour Standards Act review).
      - pack-au-employment-context: REFUSED (Fair Work Act review).
      - Outside employment-context (personal-project work): PERMITTED with Art. 14 + Art. 50 wired.
    surface: background-worker (oya-tasks-task-store-worker — auto-assign sub-worker)
    triggers:
      - new task created without assignee in opted-in project
      - tenant-admin policy "auto-assign on creation" set
      - '**NOT triggered in employment-context** until conformity ADR ships per pack'
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission + per-employee opt-in (GDPR Art. 22) + works-council consultation evidence
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PII_BEHAVIORAL]
    data_class_emitted:
      - INTERNAL_ONLY (assignee + rationale)
      - PII_IDENTIFYING (notification to affected assignee + manager via mail/messenger bridge)
    reversibility:
      revocability: revocable at any time via tenant-admin policy disable
      past_actions: not auto-reverted (assignments remain; manager/employee can manually re-assign)
      cancel_surface: settings UI + Workflow webhook + REST DELETE /v1/policies/auto-assign
    model:
      primary: tenant-default-llm + workload-balancing optimiser (constraint solver)
      fallback: rule-based heuristic (round-robin within skill-tag match)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 2000 per assignment
    audit_event:
      - TaskAutoAssignPolicyEnabled (one-shot; Ed25519-sealed)
      - TaskAutoAssigned (per-assignment; Ed25519-sealed; payload — task id hash + assignee id hash + model id + version + feature-vector hash + decision rationale token)
      - TaskAutoAssignPolicyDisabled (one-shot; Ed25519-sealed)
      - '**TaskAutoAssignFairnessAudit** (weekly; per-protected-class accept-rate; Ed25519-sealed)'
    risk_classification: '**high-risk (Annex III §4)** in employment-context — REFUSED at Cedar layer pending ADR-TASKS-XXXX conformity-assessment ADR per pack'
    user_label: "AI assigned this task — review by [date]"  # Art. 50 + per-decision banner
    cedar_admission_path: |
      tenant-scope.cedar :: action::TaskT2AutoAssign admits when:
        - tenant.tenant_class IN {demo_trial, paid} AND usage caps allow T2 auto-assign AND
        - tenant_admin.has_opted_in_to_t2_auto_assign AND
        - context.user_ai_opt_in (per-employee) AND
        - context.fairness_audit_complete (pack-us only) AND
        - context.eu_ai_act_conformity_assessment_complete (pack-eu only) AND
        - context.context_kind != "employment" (until conformity ADR ships per pack)
    fairness_audit:
      cadence: weekly
      per_protected_class_threshold: 0.8 (4/5 rule)
      breach_action: auto-rollback per runbooks/ai-assign-classifier-rollback.md
      annual_external_audit: required for pack-eu + pack-us-employment

  - id: T2-task-auto-status-advance
    name: "Auto-advance task status based on dependency state"
    description: |
      When all blocking dependencies of a task transition to "Done", the
      assistant auto-transitions the dependent task from "Blocked" to
      "Ready". Tenant policy decides whether status auto-advance is
      enabled per-project.
    surface: background-worker (oya-tasks-task-store-worker — status-advance sub-worker)
    triggers:
      - dependency edge transitions to "Done" leaving the dependent unblocked
      - tenant-project policy "auto-advance on dependency clear" enabled
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: BEHAVIORAL_TENANT_PRODUCT (status transition event)
    reversibility:
      revocability: revocable at any time via tenant-project policy disable
      past_actions: not auto-reverted (transitions remain; user can manually revert)
      cancel_surface: settings UI + Workflow webhook
    model:
      primary: rule-based (deterministic dependency graph traversal)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 500 per transition
    audit_event:
      - TaskStatusAutoAdvancePolicyEnabled (Ed25519-sealed)
      - TaskStatusAutoAdvanced (per-transition; Ed25519-sealed; payload — task id hash + old state + new state + triggering dependency id hash)
      - TaskStatusAutoAdvancePolicyDisabled (Ed25519-sealed)
    risk_classification: minimal-risk (deterministic; no LLM; no employment-context decision)
    user_label: "Task auto-advanced to Ready by AI"  # Art. 50
    cedar_admission_path: |
      tenant-scope.cedar :: action::TaskT2StatusAutoAdvance admits when
      tenant.tenant_class IN {demo_trial, paid} AND usage caps allow status auto-advance
      AND project.has_opted_in_to_t2_status_auto_advance.

  - id: T2-task-auto-recurring-materialise
    name: "Auto-materialise upcoming recurring task instances"
    description: |
      The recurrence-engine worker auto-materialises the next N instances
      of recurring tasks per the tenant's policy (default N=3 horizon
      30 days). Background; no per-instance user approval.
    surface: background-worker (oya-tasks-recurrence-worker)
    triggers:
      - tick at hourly cadence
      - new recurring rule created
      - tzdb refresh from calendar µservice triggers re-materialisation
    consent_basis:
      personal_context: explicit-on-creation (user created the recurring rule)
      professional_context: explicit-on-creation + tenant-policy-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: BEHAVIORAL_TENANT_PRODUCT (materialised task instances)
    reversibility:
      revocability: revocable at any time via recurring rule deletion
      past_actions: not auto-reverted (materialised instances remain; user can manually cancel)
      cancel_surface: settings UI + Workflow webhook
    model:
      primary: rule-based (rrule-rs expansion per ADR-TASKS-0003)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 1000 per materialisation
    audit_event:
      - TaskRecurrenceMaterialised (Ed25519-sealed; payload — recurrence rule id hash + window + materialised task id list hash)
    risk_classification: minimal-risk (deterministic; no LLM)
    user_label: "Recurring task auto-created"  # Art. 50
    cedar_admission_path: |
      tenant-scope.cedar :: action::TaskT2RecurrenceMaterialise admits when
      project.has_recurrence_rule AND tenant.tenant_class IN {demo_trial, paid}
      AND usage caps allow recurrence materialisation.

verification:
  - All T2 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting AND on each scheduled tick.
  - All T2 actions emit an audit-chain event (Ed25519-sealed) on policy-enabled, on each action, on policy-disabled.
  - All T2 actions are tenant_class-gated: Cedar policy `tenant-class-admission.cedar` admits T2 when tenant_class and usage caps allow the action; paid billing components determine metering, not feature entitlement.
  - '**T2-task-auto-assign in employment-context is REFUSED at the Cedar layer for pack-eu / pack-us / pack-kr / pack-jp / pack-au pending EU AI Act Annex III §4 + EEOC + 근로기준법 + Labour Standards Act + Fair Work Act conformity-assessment ADRs**.'
  - T2 actions respect dual-context isolation: Personal-context T2 actions NEVER touch Professional-context data; Professional-context T2 actions NEVER touch Personal-context data.
  - T2 actions emit user-visible labelling per EU AI Act Art. 50 at each affected user/assignee.
  - T2 actions are continuously reviewed: annual conformity-assessment cycle for any T2 capability that touches EU AI Act Annex III §4 scope.
  - '**T2-task-auto-assign fairness audit** is weekly; per-protected-class accept-rate < 0.8 triggers auto-rollback per `runbooks/ai-assign-classifier-rollback.md`.'
  - T2 actions never bypass dependency-cycle prevention (per ADR-TASKS-0002); auto-status-advance refuses if it would create a cycle (impossible by construction, but invariant-tested).

