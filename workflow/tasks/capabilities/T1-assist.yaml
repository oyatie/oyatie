# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — tasks µservice
#
# Autonomy Tier 1: "assist with bounded reversibility". The system takes an
# action that is bounded, reversible within a short window, attributed clearly.
# User can cancel within the reversibility window.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145) + ADR-TASKS-0006.
# Per EU AI Act Art. 50 transparency + Art. 14 human oversight.

doc_class: AutonomyTierCatalog
microservice: tasks
tier: T1
owner_team: axis-tasks + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-task-auto-categorise
    name: "Auto-categorise tasks into project + label + priority"
    description: |
      For new tasks created via inbound bridges (create-task-from-email,
      create-task-from-message, create-task-from-calendar-event), the
      assistant assigns project + labels + priority based on content
      analysis. User can cancel within a 30-second reversibility
      window. After the window, the assignment stands.
    surface: background-worker (oya-tasks-task-store-worker — auto-categorise sub-worker)
    triggers:
      - new task created via inbound bridge (mail / messenger / calendar)
      - user enabled auto-categorise per-tenant preference
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted:
      - INTERNAL_ONLY (project + label + priority assignment)
      - BEHAVIORAL_TENANT_PRODUCT (task field updates)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert to "Inbox" project + no labels + default priority P2
      cancel_surface: in-product banner + Workflow webhook
    model:
      primary: tenant-default-llm
      fallback: rule-based (regex against project keywords)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 1500
    audit_event: TaskAutoCategorised (Ed25519-sealed; payload — task id hash + project id + label list hash + reversibility window expiry)
    fallback_on_model_failure: fall back to T0 suggestion mode
    risk_classification: minimal-risk (no employment-context auto-action; only categorisation)
    user_label: "AI is categorising your task — cancel within 30s"  # Art. 50 + Art. 14

  - id: T1-task-priority-suggest-with-bulk-apply
    name: "Bulk priority suggestion + apply (user-confirmed)"
    description: |
      Across a tenant's open tasks, the assistant ranks suggested priority
      changes (e.g., "these 50 tasks should be raised to P1 based on
      upcoming due-dates + dependency-blockers"). User reviews + applies
      in bulk; per-task reversibility window 30s.
    surface: assistant-ui (REST POST /v1/assist/bulk-priority-suggest)
    triggers:
      - user clicks "Suggest priority changes across this project"
    consent_basis:
      personal_context: explicit-on-invocation
      professional_context: explicit-on-invocation + tenant-policy-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted: INTERNAL_ONLY (per-task priority suggestion + rationale)
    reversibility:
      window_seconds: 30 per applied change
      action_on_cancel: revert to prior priority
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm
      fallback: rule-based heuristic
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 3000
    audit_event:
      - TaskBulkPrioritySuggestionShown (one-shot)
      - TaskBulkPriorityApplied (per-applied change; Ed25519-sealed)
    fallback_on_model_failure: fall back to T0 suggestion mode
    risk_classification: minimal-risk
    user_label: "AI suggested priority changes — review then apply"

  - id: T1-task-dependency-suggest
    name: "Dependency edge suggestion (suggest blocks/blocked-by)"
    description: |
      When a new task is created in a project that has dense dependency-
      graph history, the assistant suggests likely dependency edges
      (blocks/blocked-by/relates-to). User reviews + applies.
      Reversibility 30s per edge.
    surface: compose-ui (REST POST /v1/assist/dependency-suggest)
    triggers:
      - user creates a new task in a project with dense dependency-graph
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (edge suggestions)
    reversibility:
      window_seconds: 30 per applied edge
      action_on_cancel: revert edge add
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm
      fallback: rule-based (text similarity)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 800
    audit_event: TaskDependencyEdgeSuggested
    fallback_on_model_failure: fall back to T0 suggestion mode
    risk_classification: minimal-risk
    user_label: "AI suggested dependency edges — click to apply"

verification:
  - All T1 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting.
  - All T1 actions emit an audit-chain event (Ed25519-sealed) on action-initiated AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T1 actions are labelled per EU AI Act Art. 50 + offer the Art. 14 human-oversight cancel-within-window control.
  - All T1 actions respect dual-context isolation: Personal-context actions NEVER touch Professional-context data.
  - All T1 actions are tenant_class-gated: Cedar policy `tenant-class-admission.cedar` admits T1 when tenant_class and usage caps allow the action; paid billing components determine metering, not feature entitlement.
  - '**HR-context overlay** (any T1 action used in hiring / performance review / employment-decision adjacent contexts) is DEFERRED to a future ADR-TASKS-XXXX for the EU AI Act Annex III §4 conformity assessment; until that ADR ships, the HR overlay is REFUSED at the Cedar layer for pack-eu tenants.'
  - T1 actions never bypass dependency-cycle prevention (per ADR-TASKS-0002); cycle-creating edge suggestions refused before user can apply.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-TASKS-0002 (dependency-cycle prevention).
  - ADR-TASKS-0006 — AI auto-assign + EU AI Act Annex III §4 bounds.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §4 employment-context.
  - microservices/tasks/PRD.md FR-20.
  - microservices/tasks/policy/task-isolation.md.
  - microservices/calendar/capabilities/T1-assist.yaml — sibling reference.
