# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-editor-rest-latency
  displayName: Workflow Studio Editor REST — Save round-trip latency
  labels:
    microservice: workflow-studio
    bounded_context: visual-canvas
    tier: external-facing
    plane: data
spec:
  service: oya-workflow-studio-visual-canvas-rest
  description: |
    Save round-trip latency SLI. The percentage of save operations that complete
    under the latency budget. GA target: 99% under 100ms.
  indicator:
    metadata:
      name: editor-rest-save-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(http_request_duration_seconds_bucket{service="oya-workflow-studio-visual-canvas-rest",route="/workflow-definitions/{definition_id}:save",le="0.1"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(http_request_duration_seconds_count{service="oya-workflow-studio-visual-canvas-rest",route="/workflow-definitions/{definition_id}:save"}[5m]))'
  objectives:
    - target: 0.99  # GA target: 99% of saves complete in ≤ 100ms
      displayName: 99% of saves under 100ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
