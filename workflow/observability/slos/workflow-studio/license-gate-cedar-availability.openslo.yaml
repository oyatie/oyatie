# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-license-gate-cedar-availability
  displayName: Workflow Studio License Gate — Cedar Evaluator Availability
  labels:
    microservice: workflow-studio
    bounded_context: license-gate-cedar
    tier: external-facing
    plane: control
spec:
  service: oya-workflow-studio-license-gate-cedar
  description: |
    Cedar evaluator availability SLI. Editor open requires Cedar evaluation; if
    evaluator down, editor opens fail-closed (503). Target: 99.99% (load-bearing
    for hero-product billing).
  indicator:
    metadata:
      name: license-gate-cedar-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_license_gate_cedar_eval_total{outcome!="error"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_license_gate_cedar_eval_total[5m]))'
  objectives:
    - target: 0.9999
      displayName: 99.99% successful Cedar evaluations
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
