# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-editor-tti-cdn-availability
  displayName: Workflow Studio Editor TTI — CDN-cached cold load
  labels:
    microservice: workflow-studio
    bounded_context: visual-canvas
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-workflow-studio-visual-canvas-adapter-leptos-wasm
  description: |
    Editor TTI (Time To Interactive) cold-load latency SLI. AC-09: 99% of cold loads
    reach TTI within 2s. CDN-cached static assets.
  indicator:
    metadata:
      name: editor-tti-cdn-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_editor_tti_seconds_bucket{le="2.0"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_editor_tti_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% of cold loads reach TTI in ≤ 2s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
