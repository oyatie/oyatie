# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-collab-crdt-merge-latency
  displayName: Workflow Studio Collab — CRDT merge latency
  labels:
    microservice: workflow-studio
    bounded_context: collab-crdt
    tier: external-facing
    plane: data
spec:
  service: oya-workflow-studio-collab-crdt-worker
  description: |
    Collab CRDT merge latency SLI. The percentage of CRDT op merges that complete
    under 100ms p99. GA target: 99% under 100ms.
  indicator:
    metadata:
      name: collab-crdt-merge-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_collab_merge_seconds_bucket{le="0.1"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_collab_merge_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% of CRDT merges complete in ≤ 100ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
