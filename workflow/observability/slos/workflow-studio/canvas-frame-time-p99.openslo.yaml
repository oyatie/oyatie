apiVersion: openslo/v1
kind: SLO
metadata:
  name: canvas-frame-time-p99
  displayName: Workflow Studio canvas p99 frame time (1000 nodes target)
  labels:
    microservice: workflow-studio
spec:
  service: workflow-studio
  budgetingMethod: Occurrences
  description: |
    Per ADR-0204 + IP-024: p99 frame time ≤ 16.67ms at 1000 nodes on 2024-baseline hardware.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                histogram_quantile(0.99, rate(oya_workflow_studio_canvas_frame_seconds_bucket{node_count_bucket="1000"}[5m])) < 0.01667
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                rate(oya_workflow_studio_canvas_frame_seconds_count{node_count_bucket="1000"}[5m])
  objectives:
    - displayName: p99 frame time ≤ 16.67ms at 1000 nodes (60fps)
      target: 0.99
