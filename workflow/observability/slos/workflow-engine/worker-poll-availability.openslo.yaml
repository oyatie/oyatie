# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-engine-worker-poll-availability
  displayName: "workflow-engine: worker-poll availability 99.9%"
  labels:
    microservice: workflow-engine
    bounded_context: worker-poll-gateway
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-workflow
    pack_scope: all
spec:
  service: workflow-engine
  description: |
    Worker-poll availability SLO. A long-poll is "good" when the
    PollForWorkflowTask / PollForActivityTask request returns either a task
    or an explicit empty-queue ack within long-poll deadline. 5xx + 504-timeout
    + connection-reset counted as bad. Per Temporal worker-poll semantics.
  indicator:
    metadata:
      name: workflow-engine-worker-poll-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_worker_poll_total{outcome=~"task|empty_ack"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_worker_poll_total[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling worker-poll availability ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
