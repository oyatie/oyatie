# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-engine-replay-determinism-correctness
  displayName: "workflow-engine: replay determinism correctness (100% load-bearing)"
  labels:
    microservice: workflow-engine
    bounded_context: replay-debugger
    sli_class: correctness
    tier: load-bearing-invariant
    plane: data
    owner_team: axis-workflow
    pack_scope: all
    invariant: INV-WORKFLOW-REPLAY-DETERMINISM
spec:
  service: workflow-engine
  description: |
    Replay determinism correctness SLO. A replay is "good" when re-executing
    a completed workflow's history against the same workflow-code version
    produces the same command stream (same activity dispatches in same order
    with same arguments). Any non-determinism = catastrophic correctness
    failure — Temporal's load-bearing invariant. Per ADR-0024 deterministic-
    replay invariant. Target = 100%; any miss is Sev-1.
  indicator:
    metadata:
      name: workflow-engine-replay-determinism-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_replay_total{result="deterministic"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_replay_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% replay-determinism (no error budget; any non-determinism is Sev-1)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
