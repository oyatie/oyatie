# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-studio:t0-suggest:v1
name: t0-suggest
namespace: workflow-studio
display_name: Studio T0 — Authoring suggestions (read-only)
description: |
  T0-tier capability: workflow-studio surfaces authoring suggestions to the tenant
  operator (node-type hints, data-class warnings on PII fields, Cedar policy preview,
  jurisdiction-overlay diff summary). No state mutation; pure read + presentation;
  human always in the loop.

  Examples:
  - On PII-class field selection: surface "data_class=PII_IDENTIFYING; this field
    will be redacted in non-pack-kr packs per data-residency.md".
  - On production-tier save attempt: surface Cedar policy preview ("this save will
    trigger 2-person rule per editor-isolation.md").
  - On jurisdiction switch: surface "3 nodes differ between base and pack-kr overlay;
    open spec diff?".

owner_team: axis-workflow + council-design-system
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-0164]
related_specs: [/specs/microservices/workflow-studio.json]
related_artifacts:
  - microservices/workflow-studio/PRD.md FR-09 + FR-16
  - microservices/workflow-studio/policy/tenant-scope.cedar
  - microservices/workflow-studio/contracts/openapi.yaml
  - microservices/workflow-studio/threat-model.md §"T-I-03" DSL injection (suggestions never load-bearing)

autonomy_tier: T0
# T0 = pure suggestion; no state read of sensitive data, no state write.
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: definition_id
    type: string
    required: true
  - name: trigger
    type: enum
    values: [pii_field_selected, production_save_attempted, jurisdiction_switch_attempted, node_dragged, edge_drawn]
    required: true
  - name: context
    type: object
    description: trigger-specific context (field name, node type, etc.)
    required: false

outputs:
  - name: suggestions
    type: array
    item_schema:
      kind: string  # data_class_warning / policy_preview / overlay_diff / next_step_hint
      severity: string  # info / warn / blocking
      message: string
      action_hint: string  # optional UI action

data_classes_touched:
  - INTERNAL_ONLY
  # Suggestions reference data-class hints but never reveal raw values.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-studio.suggestions.emitted
# Suggestions are themselves audit-emitted to detect adversarial probing patterns.

cost_profile:
  type: per-suggestion
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - Local heuristic check (sub-millisecond)
    - Cedar policy preview evaluation (constant-time)

cedar_policy_fragments:
  - microservices/workflow-studio/policy/tenant-scope.cedar
  - microservices/workflow-studio/policy/public-read.cedar

eval_set:
  reference_inputs_path: microservices/workflow-studio/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.95
  eval_metric: suggestion-relevance-and-non-misleadingness-against-curated-test-corpus
  cadence: per-release
  reference: |
    Test corpus covers: data-class hints, policy previews, overlay diffs, anti-patterns
    (suggestions must NEVER mislead author into XSS-risky field or bypass Cedar preview).

sunset:
  status: none
  notes: ""
