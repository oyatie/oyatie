# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas + signing keys.
# Per data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/citus/worker/replicas
        value: 2  # pack-kr trial tier
    target:
      kind: HelmRelease
      name: studio-postgres
  - patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 3
    target:
      kind: HelmRelease
      name: collab-crdt-worker

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=kr-resident
      - NODE_LIBRARY_SIGNING_KEY_OPENBAO_PATH=secret/workflow-studio/node-library-signing/pack-kr
      - CDN_EDGE_REGION=ap-seoul-1
