# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-studio-cdn-edge-config
  namespace: workflow-studio
data:
  cdn-rules.yaml: |
    # Per-pack CDN edge rules.
    # Per threat-model.md T-I-08 (cache pollution) + T-T-06 (WASM SRI).
    cache_key:
      template: "{tenant_hash}.{pack}.{version}.{path}"
      tenant_hash_source: "hmac-sha256(secret/cdn-tenant-hash-salt, oidc.tenant_id)"
    sri:
      enforced_for:
        - "/v*/*.wasm"
        - "/v*/*.js"
      algorithm: sha384
    csp_default: |
      default-src 'self' https://cdn-*.oyatie.dev;
      script-src 'self' 'wasm-unsafe-eval' 'nonce-{NONCE}';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://cdn-*.oyatie.dev;
      connect-src 'self' wss://collab-*.oyatie.dev https://api-*.oyatie.dev;
      object-src 'none';
      frame-ancestors 'none';
      require-trusted-types-for 'script';
      upgrade-insecure-requests
    purge_propagation_sli_seconds: 60
    immutable_assets_window_days: 90
    rate_limit_per_ip_rps: 100
