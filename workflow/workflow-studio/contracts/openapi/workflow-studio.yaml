openapi: 3.2.0
info:
  title: oya-workflow-studio
  version: 1.0.0
  summary: REST API for the workflow-studio µservice — editor session CRUD, spec submit/load, jurisdiction overlay switch, replay-debugger session control, node library distribution, LLM-assist invocation
  description: |
    Tenant-facing and operator-facing REST surface for workflow-studio (visual editor +
    DSL frontend, ADR-0131 unbundle sibling of workflow-engine). All endpoints require
    OIDC + Cedar policy authorization (per microservices/workflow-studio/policy/*.cedar)
    and are tenant-scoped via the X-Scope-OrgID header.

    Per-seat licensing enforced at editor open (license-gate-cedar BC). Saves submit
    the canonical workflow_spec.v1.json (per Bominal ADR-0164) to the workflow-engine
    SDK. Studio never executes; only emits.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT
    carries the principal's tenant_id claim. The X-Scope-OrgID header MUST match the
    claim; mismatch returns 401.
  contact:
    name: axis-workflow + council-design-system
    url: https://oyatie.com/teams/axis-workflow
  license:
    name: Internal
servers:
  - url: https://studio-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: workflow-studio
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/tenant-isolation.md`-style binding
    DefinitionId:
      in: path
      name: definition_id
      required: true
      schema:
        type: string
        pattern: '^def-[0-9A-HJKMNP-TV-Z]{26}$'
      description: ULID for workflow definition
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        pattern: '^ses-[0-9A-HJKMNP-TV-Z]{26}$'
    Pack:
      in: query
      name: pack
      required: false
      schema:
        type: string
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
    Jurisdiction:
      in: query
      name: jurisdiction
      required: false
      schema:
        type: string
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]
        default: base
  schemas:
    EditorSession:
      type: object
      required: [session_id, tenant_id, definition_id, opened_at, last_active]
      properties:
        session_id: {type: string, pattern: '^ses-[0-9A-HJKMNP-TV-Z]{26}$'}
        tenant_id: {type: string}
        definition_id: {type: string}
        user_oidc_sub: {type: string, description: OIDC subject of editor user}
        opened_at: {type: string, format: date-time}
        last_active: {type: string, format: date-time}
        crdt_state_sha: {type: string, description: BLAKE3 hash of current CRDT state}
        license_decision: {type: string, enum: [allow, deny_no_seat, deny_revoked]}
    WorkflowSpec:
      type: object
      required: [spec_id, version_sha, body]
      description: Canonical workflow_spec.v1.json per Bominal ADR-0164
      properties:
        spec_id: {type: string}
        version_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        parent_version_sha: {type: string, nullable: true, pattern: '^[a-f0-9]{40}$'}
        author_oidc_sub: {type: string}
        body:
          type: object
          additionalProperties: true
          description: Strict-schema validated server-side per oya-governance-workflow-spec-schema-strict
        signature:
          type: string
          description: Ed25519 signature over (spec_id, version_sha, body_hash, author_oidc_sub, timestamp)
        data_class_annotations:
          type: array
          items:
            type: object
            properties:
              json_pointer: {type: string}
              data_class: {type: string, enum: [INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, PII_QUASI_IDENTIFIER, PII_IDENTIFYING, SECRET, AUDIT, PHI]}
    SaveRequest:
      type: object
      required: [definition_id, spec]
      properties:
        definition_id: {type: string}
        spec: {$ref: '#/components/schemas/WorkflowSpec'}
        cedar_preview_acknowledged:
          type: boolean
          description: Required true for production-tier saves per tenant-scope.cedar
        commit_message: {type: string, maxLength: 500}
    SaveResponse:
      type: object
      required: [definition_id, version_sha, accepted_at, audit_chain_seal]
      properties:
        definition_id: {type: string}
        version_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        accepted_at: {type: string, format: date-time}
        audit_chain_seal:
          type: string
          description: Ed25519 seal from audit-chain µservice
        engine_spec_store_ack: {type: boolean}
    NodeLibraryDescriptor:
      type: object
      required: [library_id, pack, version_sha, signature]
      properties:
        library_id: {type: string}
        pack: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]}
        version_sha: {type: string}
        signature: {type: string, description: Ed25519 signature by pack-signing key}
        nodes:
          type: array
          items:
            type: object
            properties:
              node_type: {type: string}
              display_name: {type: string}
              config_schema: {type: object}
              data_class_hints: {type: array, items: {type: string}}
    LlmAssistDraftRequest:
      type: object
      required: [definition_id, prose]
      properties:
        definition_id: {type: string}
        prose: {type: string, maxLength: 10000}
        consent_acknowledged: {type: boolean, description: Required true per tenant-scope.cedar PERMIT 5}
        target_jurisdiction: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]}
    LlmAssistDraftResponse:
      type: object
      required: [draft_id, candidate_spec, schema_valid, prompt_injection_detected]
      properties:
        draft_id: {type: string}
        candidate_spec: {$ref: '#/components/schemas/WorkflowSpec'}
        schema_valid: {type: boolean}
        validation_errors:
          type: array
          items:
            type: object
            properties:
              json_pointer: {type: string}
              message: {type: string}
        prompt_injection_detected: {type: boolean}
        pii_redacted_count: {type: integer, description: count of PII tokens scrubbed from prompt}
    DebuggerSession:
      type: object
      required: [debugger_session_id, tenant_id, run_id, opened_at]
      properties:
        debugger_session_id: {type: string}
        tenant_id: {type: string}
        run_id: {type: string}
        opened_at: {type: string, format: date-time}
        last_frame_seq: {type: integer}
        stream_status: {type: string, enum: [active, ended, error]}
    JurisdictionOverlayView:
      type: object
      properties:
        jurisdiction: {type: string}
        overlay_version_sha: {type: string}
        resolved_view: {type: object, additionalProperties: true}
        base_reachable: {type: boolean, description: AC-04 invariant; base view always reachable}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /editor-sessions:
    post:
      summary: Open a new editor session (Cedar per-seat license gate enforced)
      operationId: openEditorSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition_id]
              properties:
                definition_id: {type: string}
                resume_from_offline_buffer_sha: {type: string, nullable: true}
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EditorSession'}
        '402':
          description: License-gate denied (no seat available); audit row emitted
        '401':
          description: OIDC missing or X-Scope-OrgID mismatch
        '403':
          description: Cedar policy denied
        '429':
          description: Per-tenant session cap reached (default 50 concurrent)

    get:
      summary: List active editor sessions for this tenant
      operationId: listEditorSessions
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EditorSession'}

  /editor-sessions/{session_id}:
    get:
      summary: Read editor session state
      operationId: getEditorSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EditorSession'}

    delete:
      summary: Close an editor session
      operationId: closeEditorSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Closed

  /workflow-definitions/{definition_id}:save:
    post:
      summary: Save workflow definition (canonical workflow_spec.v1.json submit to engine; Ed25519 sealed)
      operationId: saveWorkflowDefinition
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/DefinitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveRequest'}
      responses:
        '200':
          description: Saved; engine spec-store ack received; audit-chain sealed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveResponse'}
        '400':
          description: Schema validation failed
        '403':
          description: Cedar policy denied (e.g., production-tier save without cedar_preview_acknowledged=true)
        '409':
          description: Concurrent save detected (parent_version_sha mismatch); reconcile via CRDT op stream
        '422':
          description: Spec schema validation errors; per-pointer detail in body

  /workflow-definitions/{definition_id}:load:
    get:
      summary: Load workflow definition for editor render
      operationId: loadWorkflowDefinition
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/DefinitionId'
        - $ref: '#/components/parameters/Jurisdiction'
      responses:
        '200':
          description: Definition + resolved view
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec: {$ref: '#/components/schemas/WorkflowSpec'}
                  jurisdiction_view: {$ref: '#/components/schemas/JurisdictionOverlayView'}

  /workflow-definitions/{definition_id}/jurisdiction:switch:
    post:
      summary: Switch the active jurisdiction overlay for an editor view (AC-04)
      operationId: switchJurisdictionOverlay
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/DefinitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jurisdiction]
              properties:
                jurisdiction: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]}
      responses:
        '200':
          description: Overlay applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JurisdictionOverlayView'}

  /node-libraries:
    get:
      summary: List node libraries accessible to this tenant's packs (signed; CDN-delivered)
      operationId: listNodeLibraries
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Pack'
      responses:
        '200':
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NodeLibraryDescriptor'}

  /node-libraries/{library_id}:
    get:
      summary: Read a signed node library descriptor (signature verified server-side)
      operationId: getNodeLibrary
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: library_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Library descriptor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeLibraryDescriptor'}
        '410':
          description: Library revoked (per runbooks/template-marketplace-quarantine.md)

  /llm-assist:draft:
    post:
      summary: Request an LLM-assist draft from prose; PII-redacted; schema-validated
      operationId: llmAssistDraft
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlmAssistDraftRequest'}
      responses:
        '200':
          description: Draft returned (may be schema_valid=false; caller decides whether to accept)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LlmAssistDraftResponse'}
        '403':
          description: LLM-assist consent missing (tenant-scope.cedar PERMIT 5)
        '422':
          description: Prompt injection detected; refusing to submit prompt to foundry-providers
        '503':
          description: LLM-assist circuit breaker open; manual authoring still available

  /debugger-sessions:
    post:
      summary: Open a replay-debugger frontend session bound to an engine run
      operationId: openDebuggerSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              properties:
                run_id: {type: string}
      responses:
        '201':
          description: Debugger session opened; subscribe via WS (asyncapi)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DebuggerSession'}

  /debugger-sessions/{session_id}:resync:
    post:
      summary: Re-stream replay-debugger frontend from engine event store (on detected gap)
      operationId: resyncDebuggerSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_seq]
              properties:
                from_seq: {type: integer, minimum: 0}
      responses:
        '200':
          description: Resync initiated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DebuggerSession'}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres + Valkey + engine SDK + foundry-providers SDK reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
