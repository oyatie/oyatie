// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.workflow_engine.v1;

// workflow-engine gRPC contracts.
// Owned by axis-workflow.
// Internal-only sibling-service projection of the REST contract.
// Public Studio and SDK clients use REST/OpenAPI; this surface is for in-cluster workloads.
//
// All RPCs require SPIFFE mTLS workload identity; forwarded user claims are authorized by Cedar.
// Tenant_id is server-side stamped; client cannot override.

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// Service surface
// =============================================================================

service SpecStore {
  rpc SubmitWorkflowSpec(SubmitWorkflowSpecRequest) returns (WorkflowSpec);
  rpc GetWorkflowSpec(GetWorkflowSpecRequest) returns (WorkflowSpec);
  rpc ListWorkflowSpecs(ListWorkflowSpecsRequest) returns (ListWorkflowSpecsResponse);
  rpc TransitionSpecLifecycle(TransitionSpecLifecycleRequest) returns (WorkflowSpec);
}

service ExecutionEngine {
  rpc StartWorkflowRun(StartWorkflowRunRequest) returns (WorkflowRun);
  rpc GetWorkflowRun(GetWorkflowRunRequest) returns (WorkflowRun);
  rpc PauseWorkflowRun(PauseWorkflowRunRequest) returns (WorkflowRun);
  rpc ResumeWorkflowRun(ResumeWorkflowRunRequest) returns (WorkflowRun);
  rpc CancelWorkflowRun(CancelWorkflowRunRequest) returns (WorkflowRun);
  rpc SignalWorkflowRun(SignalWorkflowRunRequest) returns (SignalResponse);
  rpc ListStepExecutions(ListStepExecutionsRequest) returns (ListStepExecutionsResponse);
  rpc GetTenantMetrics(GetTenantMetricsRequest) returns (TenantMetrics);
  rpc StreamRunUpdates(StreamRunUpdatesRequest) returns (stream RunUpdate);
}

service EventBus {
  rpc PublishWorkflowEvent(PublishWorkflowEventRequest) returns (PublishWorkflowEventResponse);
  rpc CreateSubscription(CreateSubscriptionRequest) returns (Subscription);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
  rpc ReplayEvents(ReplayEventsRequest) returns (ReplayEventsResponse);
  rpc SubscribeStream(SubscribeStreamRequest) returns (stream WorkflowEvent);
}

service ReplayDebuggerBackend {
  rpc StartReplay(StartReplayRequest) returns (ReplaySession);
  rpc GetReplaySession(GetReplaySessionRequest) returns (ReplaySession);
  rpc StreamReplaySteps(StreamReplayStepsRequest) returns (stream StepSnapshot);
  rpc GetRunAnalytics(GetRunAnalyticsRequest) returns (RunAnalytics);
}

// =============================================================================
// Spec store
// =============================================================================

message SubmitWorkflowSpecRequest {
  string spec_id = 1;
  google.protobuf.Struct body = 2;
  string signature = 3;
  string signer_identity = 4;
}

message GetWorkflowSpecRequest {
  string spec_id = 1;
  string version_sha = 2;
}

message ListWorkflowSpecsRequest {
  string spec_id_filter = 1;
  string lifecycle_filter = 2;
}

message ListWorkflowSpecsResponse {
  repeated WorkflowSpec specs = 1;
}

message TransitionSpecLifecycleRequest {
  string spec_id = 1;
  string version_sha = 2;
  SpecLifecycle lifecycle_to = 3;
  string reason = 4;
  repeated string two_person_signature = 5;
}

enum SpecLifecycle {
  SPEC_LIFECYCLE_UNSPECIFIED = 0;
  SPEC_LIFECYCLE_DRAFT = 1;
  SPEC_LIFECYCLE_PUBLISHED = 2;
  SPEC_LIFECYCLE_DEPRECATED = 3;
  SPEC_LIFECYCLE_RETIRED = 4;
}

message WorkflowSpec {
  string spec_id = 1;
  string version_sha = 2;
  google.protobuf.Struct body = 3;
  string signature = 4;
  string signer_identity = 5;
  SpecLifecycle lifecycle = 6;
  google.protobuf.Timestamp submitted_at = 7;
  string tenant_id = 8;  // server-stamped
}

// =============================================================================
// Execution engine
// =============================================================================

enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_SANDBOX = 1;
  ENVIRONMENT_STAGING = 2;
  ENVIRONMENT_PRODUCTION = 3;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_PAUSED = 2;
  RUN_STATUS_WAITING = 3;
  RUN_STATUS_COMPLETED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
}

enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_PENDING = 1;
  STEP_STATUS_RUNNING = 2;
  STEP_STATUS_COMPLETED = 3;
  STEP_STATUS_FAILED = 4;
  STEP_STATUS_RETRYING = 5;
}

message StartWorkflowRunRequest {
  string spec_id = 1;
  string version_sha = 2;
  google.protobuf.Struct input = 3;
  Environment environment = 4;
  string idempotency_key = 5;
}

message GetWorkflowRunRequest {
  string run_id = 1;
}

message PauseWorkflowRunRequest {
  string run_id = 1;
  string reason = 2;
}

message ResumeWorkflowRunRequest {
  string run_id = 1;
}

message CancelWorkflowRunRequest {
  string run_id = 1;
  string reason = 2;
  repeated string two_person_signature = 3;
}

message SignalWorkflowRunRequest {
  string run_id = 1;
  string signal_name = 2;
  google.protobuf.Struct payload = 3;
}

message SignalResponse {
  bool accepted = 1;
}

message ListStepExecutionsRequest {
  string run_id = 1;
}

message ListStepExecutionsResponse {
  repeated StepExecution steps = 1;
}

message GetTenantMetricsRequest {}

message TenantMetrics {
  int64 active_runs = 1;
  int64 runs_started_today = 2;
  double step_latency_p50_ms = 3;
  double step_latency_p99_ms = 4;
  double step_failure_rate = 5;
  int64 audit_chain_seal_count = 6;
}

message StreamRunUpdatesRequest {
  string run_id = 1;
}

message RunUpdate {
  string run_id = 1;
  RunStatus status = 2;
  int64 current_step_index = 3;
  google.protobuf.Timestamp emitted_at = 4;
}

message WorkflowRun {
  string run_id = 1;
  string tenant_id = 2;  // server-stamped
  string spec_id = 3;
  string version_sha = 4;
  RunStatus status = 5;
  int64 current_step_index = 6;
  string current_state = 7;
  string waiting_on = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  string terminal_reason = 11;
}

message StepExecution {
  string run_id = 1;
  int64 step_index = 2;
  StepStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  int32 retry_count = 6;
  string error = 7;
}

// =============================================================================
// Event bus
// =============================================================================

message PublishWorkflowEventRequest {
  string event_type = 1;
  google.protobuf.Struct payload = 2;
  string correlation_id = 3;
  string idempotency_key = 4;
}

message PublishWorkflowEventResponse {
  string event_id = 1;
  int64 sequence_num = 2;
  google.protobuf.Timestamp persisted_at = 3;
}

message CreateSubscriptionRequest {
  string event_type_filter = 1;
  string delivery_url = 2;
  string webhook_signing_secret_ref = 3;
  RetryPolicy retry_policy = 4;
}

message Subscription {
  string sub_id = 1;
  string tenant_id = 2;
  string event_type_filter = 3;
  string delivery_url = 4;
  google.protobuf.Timestamp created_at = 5;
  double consumer_lag_seconds = 6;
  google.protobuf.Timestamp last_delivery_at = 7;
}

message RetryPolicy {
  int32 max_attempts = 1;
  string backoff = 2;  // "exponential" | "linear" | "fixed"
  int32 initial_delay_ms = 3;
}

message DeleteSubscriptionRequest {
  string sub_id = 1;
}

message DeleteSubscriptionResponse {}

message ReplayEventsRequest {
  string sub_id = 1;
  int64 from_offset = 2;
  int64 to_offset = 3;
}

message ReplayEventsResponse {
  string replay_id = 1;
  int64 events_queued = 2;
}

message SubscribeStreamRequest {
  string sub_id = 1;
}

message WorkflowEvent {
  string event_id = 1;
  string event_type = 2;
  string tenant_id = 3;
  string run_id = 4;
  google.protobuf.Timestamp emitted_at = 5;
  int64 sequence_num = 6;
  string idempotency_key = 7;
  string correlation_id = 8;
  bool replayed = 9;
  string signature = 10;
  google.protobuf.Struct payload = 11;
}

// =============================================================================
// Replay debugger backend
// =============================================================================

message StartReplayRequest {
  string run_id = 1;
  int64 from_step = 2;
  int64 to_step = 3;
}

message ReplaySession {
  string session_id = 1;
  string run_id = 2;
  string status = 3;  // pending | running | completed | failed
  int64 from_step = 4;
  int64 to_step = 5;
  int64 steps_replayed = 6;
  bool identical_to_original = 7;
}

message GetReplaySessionRequest {
  string session_id = 1;
}

message StreamReplayStepsRequest {
  string session_id = 1;
}

message StepSnapshot {
  string run_id = 1;
  int64 step_index = 2;
  google.protobuf.Struct state_before = 3;
  google.protobuf.Struct state_after = 4;
  StepStatus status = 5;
  google.protobuf.Timestamp original_emitted_at = 6;
  google.protobuf.Timestamp replayed_at = 7;
}

message GetRunAnalyticsRequest {
  string spec_id_filter = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
}

message RunAnalytics {
  int64 total_runs = 1;
  int64 completed_runs = 2;
  int64 failed_runs = 3;
  int64 cancelled_runs = 4;
  double avg_duration_ms = 5;
  double p99_duration_ms = 6;
  double failure_rate = 7;
}
