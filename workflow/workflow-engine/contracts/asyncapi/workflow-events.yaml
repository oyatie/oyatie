asyncapi: 3.1.0
info:
  title: workflow-engine event bus
  version: 0.1.0
  description: |
    Typed workflow event bus. Workflow-engine publishes lifecycle + state events;
    other µservices subscribe to drive their internal state from workflow signal.
    Workflow-engine itself subscribes to upstream µservices' typed events for trigger.

    Tenant_id is server-side-stamped on every event; client cannot override.
    Every event carries idempotency_key + correlation_id for replay-safety.
    Subscribers MUST be idempotent (contract per `docs/standards/workflow-event-consumer.md`).

    Channels are per-tenant; the topic namespace is `oya.workflow-engine.<tenant_hash>.<event_type>`.
  contact:
    name: axis-workflow
    email: axis-workflow@oyatie.com
  license:
    name: Internal

defaultContentType: application/json

servers:
  per-pack:
    host: 'workflow-engine-events.{pack}.oyatie.com'
    protocol: nats-with-jetstream
    description: Per-pack event bus endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

channels:
  WorkflowStarted:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_started'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowStarted:
        $ref: '#/components/messages/WorkflowStarted'

  StepStarted:
    address: 'oya.workflow-engine.{tenant_hash}.step_started'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      StepStarted:
        $ref: '#/components/messages/StepStarted'

  StepCompleted:
    address: 'oya.workflow-engine.{tenant_hash}.step_completed'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      StepCompleted:
        $ref: '#/components/messages/StepCompleted'

  StepFailed:
    address: 'oya.workflow-engine.{tenant_hash}.step_failed'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      StepFailed:
        $ref: '#/components/messages/StepFailed'

  StepRetried:
    address: 'oya.workflow-engine.{tenant_hash}.step_retried'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      StepRetried:
        $ref: '#/components/messages/StepRetried'

  WorkflowPaused:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_paused'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowPaused:
        $ref: '#/components/messages/WorkflowPaused'

  WorkflowResumed:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_resumed'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowResumed:
        $ref: '#/components/messages/WorkflowResumed'

  WorkflowCancelled:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_cancelled'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowCancelled:
        $ref: '#/components/messages/WorkflowCancelled'

  WorkflowCompleted:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_completed'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowCompleted:
        $ref: '#/components/messages/WorkflowCompleted'

  WorkflowFailed:
    address: 'oya.workflow-engine.{tenant_hash}.workflow_failed'
    parameters:
      tenant_hash:
        description: sha256(tenant_id)[..16]
    messages:
      WorkflowFailed:
        $ref: '#/components/messages/WorkflowFailed'

operations:
  publishWorkflowStarted:
    action: send
    channel:
      $ref: '#/channels/WorkflowStarted'
  publishStepStarted:
    action: send
    channel:
      $ref: '#/channels/StepStarted'
  publishStepCompleted:
    action: send
    channel:
      $ref: '#/channels/StepCompleted'
  publishStepFailed:
    action: send
    channel:
      $ref: '#/channels/StepFailed'
  publishStepRetried:
    action: send
    channel:
      $ref: '#/channels/StepRetried'
  publishWorkflowPaused:
    action: send
    channel:
      $ref: '#/channels/WorkflowPaused'
  publishWorkflowResumed:
    action: send
    channel:
      $ref: '#/channels/WorkflowResumed'
  publishWorkflowCancelled:
    action: send
    channel:
      $ref: '#/channels/WorkflowCancelled'
  publishWorkflowCompleted:
    action: send
    channel:
      $ref: '#/channels/WorkflowCompleted'
  publishWorkflowFailed:
    action: send
    channel:
      $ref: '#/channels/WorkflowFailed'

components:
  messages:
    WorkflowStarted:
      name: WorkflowStarted
      title: Workflow run started
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowStartedPayload'

    StepStarted:
      name: StepStarted
      title: Step execution started
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StepLifecyclePayload'

    StepCompleted:
      name: StepCompleted
      title: Step execution completed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StepLifecyclePayload'

    StepFailed:
      name: StepFailed
      title: Step execution failed (post-retry exhaustion)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StepFailedPayload'

    StepRetried:
      name: StepRetried
      title: Step retry attempt
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StepRetriedPayload'

    WorkflowPaused:
      name: WorkflowPaused
      title: Workflow paused by operator
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowLifecyclePayload'

    WorkflowResumed:
      name: WorkflowResumed
      title: Workflow resumed by operator
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowLifecyclePayload'

    WorkflowCancelled:
      name: WorkflowCancelled
      title: Workflow cancelled (terminal)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowTerminalPayload'

    WorkflowCompleted:
      name: WorkflowCompleted
      title: Workflow completed (terminal)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowTerminalPayload'

    WorkflowFailed:
      name: WorkflowFailed
      title: Workflow failed (terminal)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkflowTerminalPayload'

  schemas:
    Envelope:
      type: object
      required:
        - event_id
        - event_type
        - tenant_id
        - run_id
        - emitted_at
        - sequence_num
        - idempotency_key
        - correlation_id
        - replayed
        - signature
      properties:
        event_id:
          type: string
          description: ULID; unique per event
        event_type:
          type: string
        tenant_id:
          type: string
          description: Server-stamped from authenticated tenant
        run_id:
          type: string
        emitted_at:
          type: string
          format: date-time
        sequence_num:
          type: integer
          format: int64
          description: Monotonic per (tenant_id, run_id)
        idempotency_key:
          type: string
          description: Subscriber idempotency key
        correlation_id:
          type: string
          description: Cross-event correlation (e.g., per-trigger lineage)
        replayed:
          type: boolean
          description: True if this event is being delivered as part of a replay (subscribers should refuse side-effecting actions)
        signature:
          type: string
          description: Ed25519 signature over the canonical event body

    WorkflowStartedPayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [spec_id, version_sha, input_class_metadata]
          properties:
            spec_id: {type: string}
            version_sha: {type: string}
            input_class_metadata:
              type: object
              description: Data-class metadata for input fields (not the payload itself; payload only accessible via direct run read with tenant scope)
            environment:
              type: string
              enum: [sandbox, staging, production]

    StepLifecyclePayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [step_index, status]
          properties:
            step_index: {type: integer}
            status:
              type: string
              enum: [running, completed]
            duration_ms: {type: integer, nullable: true}

    StepFailedPayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [step_index, error_code, error_message, retry_count]
          properties:
            step_index: {type: integer}
            error_code: {type: string}
            error_message: {type: string}
            retry_count: {type: integer}

    StepRetriedPayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [step_index, retry_attempt, backoff_ms]
          properties:
            step_index: {type: integer}
            retry_attempt: {type: integer}
            backoff_ms: {type: integer}

    WorkflowLifecyclePayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [actor, reason]
          properties:
            actor: {type: string, description: SPIFFE or OIDC subject}
            reason: {type: string}

    WorkflowTerminalPayload:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [terminal_state, output_class_metadata]
          properties:
            terminal_state:
              type: string
              enum: [completed, failed, cancelled]
            output_class_metadata:
              type: object
              description: Data-class metadata for output fields
            duration_ms: {type: integer}
