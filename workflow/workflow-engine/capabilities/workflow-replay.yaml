# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-engine:workflow-replay:v1
name: workflow-replay
namespace: workflow-engine
display_name: Replay Workflow Run (deterministic)
description: |
  Initiate a deterministic replay of a completed or in-flight workflow run, optionally
  bounded to a step range. Replay reconstructs the run's state transitions from the
  event log; identical event log produces identical step sequence (PRD AC-02).
  Side-effecting steps (HTTP, DB writes) are gated through a side-effect ledger that
  marks replay-emitted events with `replayed=true`; subscribers refuse re-execution.

owner_team: axis-workflow
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0035, ADR-0103, ADR-0131]
related_specs: [/specs/microservices/workflow.json]
related_artifacts:
  - workflow/workflow-engine/PRD.md
  - microservices/workflow-engine/backfill-replay.md
  - workflow/workflow-engine/contracts/openapi/workflow-engine.yaml

autonomy_tier: T2
# T2 = read-side replay; not side-effecting (per the replay-flag semantics).

inputs:
  - name: run_id
    type: string
    required: true
  - name: from_step
    type: integer
    minimum: 0
    default: 0
  - name: to_step
    type: integer
    minimum: 0
    description: Inclusive upper bound; default = last step
  - name: reason
    type: string
    description: Required for production-tier replay; recorded in audit chain

outputs:
  - name: session_id
    type: string
  - name: steps_replayed
    type: integer
  - name: identical_to_original
    type: boolean
    description: Verification result; should always be true per AC-02

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-engine.replay.session

cost_profile:
  type: per-replay
  estimated_cost_usd_per_call: 0.01
  cost_drivers:
    - ClickHouse event log read (full run history)
    - Replay engine CPU (deterministic step reconstruction)
    - Audit-chain seal on the replay session itself

cedar_policy_fragments:
  - workflow/workflow-engine/policy/tenant-scope.cedar
  - workflow/workflow-engine/policy/auditor-scope.cedar
  # Auditors may have read-only replay scope; per auditor-scope.cedar restrictions

eval_set:
  golden_inputs_path: microservices/workflow-engine/capabilities/eval/workflow-replay-golden.jsonl
  pass_threshold: 1.00
  eval_metric: replay-identical-step-sequence-against-original
  cadence: per-release
  reference: PRD AC-02 deterministic replay

sunset:
  status: none
  notes: ""
