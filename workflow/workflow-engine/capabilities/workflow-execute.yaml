# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-engine:workflow-execute:v1
name: workflow-execute
namespace: workflow-engine
display_name: Execute Workflow Run
description: |
  Start a workflow run against a published spec version + initial input payload.
  Engine durably persists run state, dispatches steps, and emits typed events on the bus.
  Returns the run_id; subsequent state queries via getWorkflowRun.

owner_team: axis-workflow
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0035, ADR-0103, ADR-0131]
related_specs: [/specs/microservices/workflow.json]
related_artifacts:
  - workflow/workflow-engine/PRD.md
  - workflow/workflow-engine/contracts/openapi/workflow-engine.yaml
  - workflow/workflow-engine/contracts/proto/workflow-engine.proto
  - workflow/workflow-engine/policy/tenant-scope.cedar

autonomy_tier: T3
# T3 = side-effecting operation (run starts can dispatch external HTTP, write to Ontology, etc.)
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: spec_id
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: version_sha
    type: string
    pattern: '^[a-f0-9]{64}$'
    required: true
  - name: input
    type: object
    description: Initial input payload; data_class-annotated at spec level
    required: true
  - name: environment
    type: enum
    values: [sandbox, staging, production]
    default: production
  - name: idempotency_key
    type: string
    description: Caller idempotency key to deduplicate retries

outputs:
  - name: run_id
    type: string
  - name: started_at
    type: timestamp
  - name: tenant_id
    type: string
    description: server-stamped from authenticated tenant

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # Run state + step payloads carry tenant behavioral signal
  - PII_IDENTIFYING
  # When tenant spec includes user-id fields; subject to data_class annotation on spec
  - AUDIT
  # Run lifecycle is itself audit-emitted
  - PHI
  # pack-us-healthcare only; conditional on BAA + spec PHI declaration

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-engine.workflow.started
# This capability emits to the audit-chain evidence-topic stream per Bominal ADR-0028.

cost_profile:
  type: per-run
  estimated_cost_usd_per_call: 0.0005
  cost_drivers:
    - Postgres + Citus run-state write
    - Initial step dispatch via Valkey lease
    - Audit-chain Ed25519 seal emission

cedar_policy_fragments:
  - workflow/workflow-engine/policy/tenant-scope.cedar
  - workflow/workflow-engine/policy/ci-scope.cedar

eval_set:
  golden_inputs_path: microservices/workflow-engine/capabilities/eval/workflow-execute-golden.jsonl
  pass_threshold: 1.00
  eval_metric: deterministic-step-sequence-against-canonical-fixture
  cadence: per-release
  reference: PRD AC-02 deterministic replay invariant

sunset:
  status: none
  notes: ""
