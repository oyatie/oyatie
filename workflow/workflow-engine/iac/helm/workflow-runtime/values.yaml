# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
image:
  registry: oci-registry.oyatie.dev
  pullPolicy: IfNotPresent
  tag: "0.1.0"

executionEngine:
  worker:
    replicas: 3          # XS tier per capacity-model.md
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 200
      metrics:
        - type: External
          external:
            metric:
              name: oya_workflow_engine_step_queue_depth
            target:
              type: AverageValue
              averageValue: "5000"
    env:
      RESUME_RATE_LIMIT_PER_WORKER: "100"
      PRE_WARM_POOL_SIZE: "10"
  rest:
    replicas: 2
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: 2000m, memory: 4Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 50
      targetCPUUtilizationPercentage: 70
  app:
    replicas: 2          # composition root HA
    resources:
      requests: {cpu: 500m, memory: 1Gi}

eventBus:
  worker:
    replicas: 2          # outbox relay; HA via Valkey lease
    resources:
      requests: {cpu: 500m, memory: 1Gi}
    leaderElection:
      enabled: true
  rest:
    replicas: 2
    resources:
      requests: {cpu: 500m, memory: 1Gi}
  app:
    replicas: 2

specStore:
  rest:
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 512Mi}
  app:
    replicas: 2

replayDebuggerBackend:
  rest:
    replicas: 2
    resources:
      requests: {cpu: 500m, memory: 1Gi}
  app:
    replicas: 2

config:
  postgres:
    host: postgres-coordinator.workflow-engine.svc.cluster.local
    port: 5432
    database: workflow_engine
    passwordSecret:
      name: openbao-postgres
      key: password
  valkey:
    sentinelService: valkey-sentinel.workflow-engine.svc.cluster.local
    sentinelPort: 26379
    masterName: workflow-engine
    passwordSecret:
      name: openbao-valkey
      key: password
  clickhouse:
    host: clickhouse.workflow-engine.svc.cluster.local
    port: 9000
    database: workflow_engine_analytics
    passwordSecret:
      name: openbao-clickhouse
      key: password
  audit_chain:
    signing_key_secret:
      name: openbao-workflow-engine-audit
      key: ed25519_private_key

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true        # scraped by observability µservice's Alloy collector
  podMonitor:
    enabled: true

networkPolicy:
  enabled: true
  ingress:
    allowFromIstio: true
    allowFromObservability: true   # for Alloy metric scrape
  egress:
    allowToPostgres: true
    allowToValkey: true
    allowToClickhouse: true
    allowToOpenbao: true
