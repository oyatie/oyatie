# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:forms:t2-auto:v1
name: t2-auto
namespace: forms
display_name: Forms T2 — Autonomous response capture + workflow trigger + cross-µservice fan-out
description: |
  T2-tier capability: forms autonomously
  (a) accepts a submitter response (given human-originated submit click),
  (b) PII-encrypts at column level,
  (c) seals via audit-chain (Ed25519),
  (d) triggers downstream workflow (workflow-engine via Workflow + Ontology adapter),
  (e) fans out to webhooks + bulk-distribute-replay + sheets-bridge as configured.

  T2 because state mutation is autonomous given the trigger, but the trigger is
  human-originated (submit click). All paths are Cedar default-deny.

  T2-cross sub-tier is the cross-microservice variant for AI-form-build (per
  ADR-FORMS-0005 §"T2 — Auto"): tenant opts-in per destination µservice; reviewer-
  agent gate + ChangeSet review-required.

owner_team: axis-forms + ops-security + foundry-providers-team + council-privacy
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0110, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-FORMS-0003, ADR-FORMS-0005]
related_specs: [/specs/microservices/forms.json]
related_artifacts:
  - microservices/forms/PRD.md FR-05 + FR-06 + FR-18 + FR-19 + FR-22 + AC-06 + AC-25
  - microservices/forms/threat-model.md §"T-D-01" + §"T-T-05" + §"T-E-03"
  - workflow/forms/policy/tenant-scope.cedar
  - workflow/forms/contracts/asyncapi/forms.asyncapi.yaml
  - workflow/forms/runbooks/spam-flood-throttle.md
  - workflow/forms/runbooks/ai-form-build-rollback.md

autonomy_tier: T2
# T2 = autonomous mutation given a human-originated trigger; default-deny policy gate.

risk_class:
  scope: |
    T2-intra (response capture + workflow trigger + webhook fan-out): not an AI
    system; deterministic processing of human-originated submit. Not in scope of
    EU AI Act.

    T2-cross (AI-form-build cross-µservice draft): high-risk by default under
    Arts. 9-15. Tenant DPIA + reviewer-agent gate + 2-person rule mandatory.
  art_72_post_market_monitoring: |
    T2-cross safety signals tracked in dashboards/ai-form-build-quality.json:
    schema-valid rate, acceptance rate, revert rate, safety-signal-count,
    Annex-III-4-misuse-detected count.

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: trigger_kind
    type: enum
    values:
      - response_submit             # → validate + encrypt + seal + fan-out
      - form_publish                # → Cedar-preview-ack + audit-chain seal
      - bulk_distribute_start       # → mail/messenger fan-out
      - export_run                  # → response-stream + redaction + sign
      - dsr_cascade_run             # → response-erase + audit-chain seal
      - ai_build_t2_cross_destination_invoke  # → Cedar destination check + ChangeSet review-required
    required: true
  - name: payload
    type: object
    description: trigger-specific payload
    required: true

outputs:
  - name: action_taken
    type: enum
    values: [accepted, captcha_rejected, validation_rejected, cedar_denied, audit_sealed, fan_out_started, dsr_erased, ai_build_review_required]
  - name: audit_chain_seal
    type: string
    description: Ed25519 over the action
  - name: side_effects_summary
    type: object
    description: |
      For response_submit: {response_id, audit_chain_seal, workflow_trigger_status, webhook_queue_size}.
      For form_publish: {form_id, form_version, schema_hash, audit_chain_seal}.
      For bulk_distribute_start: {job_id, recipient_count, queue_depth}.
      For export_run: {export_id, manifest_seal, row_count, format}.
      For dsr_cascade_run: {subject_hash, removed_count, cascade_targets[]}.
      For ai_build_t2_cross: {draft_id, review_changeset_id, reviewer_assigned}.

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_GDPR_ART9
  - PHI
  - FINANCIAL
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.forms.t2.action

cost_profile:
  type: per-action
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - Postgres column-encrypted write (per submit: 3-6ms)
    - Valkey rate-limit + session update (per submit: 0.5ms)
    - Captcha verification (per submit: 50-200ms)
    - Audit-chain seal Ed25519 sign + emit (1-2ms)
    - Cedar policy evaluation (constant-time, < 1ms)
    - Webhook fan-out enqueue (per submit: 0.3ms)
    - Workflow-trigger via Workflow + Ontology adapter (per submit: 5-15ms)

cedar_policy_fragments:
  - workflow/forms/policy/tenant-scope.cedar
  - workflow/forms/policy/ci-scope.cedar
  - workflow/forms/policy/auditor-scope.cedar
  - workflow/forms/policy/public-read.cedar

eval_set:
  reference_inputs_path: microservices/forms/capabilities/eval/t2-auto-reference.jsonl
  pass_threshold: 0.999
  eval_metric: |
    Composite invariants (must hold over 1000-case corpus):
    (a) Every response Ed25519-sealed; chain reconstructable (AC-06).
    (b) Cross-tenant attempts always rejected (T-I-01 invariant).
    (c) PII column-encrypted at rest (AC-08).
    (d) Captcha invariant: fail-closed (T-D-07).
    (e) Workflow-trigger fail-closed: workflow start failure → audit row, no silent drop (AC-22).
    (f) DSR cascade complete (AC-27).
    (g) T2-cross AI-form-build: reviewer-agent gate enforced (AC-25).
  cadence: per-release + nightly chaos test
  reference: ADR-0028 audit-chain + ADR-0110 ChangeSet state machine + ADR-FORMS-0005 §"T2 — Auto"

invariants:
  - never_silent_loss: |
      A response that cannot be sealed MUST surface failure; never silently
      discard. Asserted by property test test_no_silent_response_loss (AC-06).
  - column_encrypted_pii: |
      Every PII column written with per-tenant DEK envelope (ADR-FORMS-0003).
      Asserted by `oya-forms-pii-column-encryption-correctness` lane.
  - default_deny: |
      Every Cedar policy evaluation that doesn't match a permit returns deny + audit row.
      Asserted by policy-fragment compilation tests.
  - tenant_isolation: |
      Every Postgres + Valkey write tenant_id-scoped (RLS + Citus partition).
      Asserted by `oya-governance-citus-rls-enforced` lane.
  - ed25519_seal_chain: |
      Every action's seal references its predecessor; chain reconstructable.
      Asserted by audit-chain regression tests.
  - captcha_fail_closed: |
      Captcha sidecar unavailable → 503; never accept without verification.
      Asserted by `oya-forms-captcha-fail-closed-conformance` lane.
  - workflow_trigger_fail_closed: |
      Workflow-engine adapter failure → audit row + Kafka dead-letter; no silent drop.
      Asserted by AC-22 test.
  - t2_cross_changeset_review_required: |
      T2-cross AI-form-build → ChangeSet review-required + reviewer-agent gate.
      Asserted by AC-25 test + ADR-FORMS-0005 §"T2 — Auto" §"T2-cross gate".

sunset:
  status: none
  notes: ""
