# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:forms:t0-suggest:v1
name: t0-suggest
namespace: forms
display_name: Forms T0 — Authoring suggestions (read-only)
description: |
  T0-tier capability: forms surfaces authoring suggestions to the tenant operator
  (field-type hints, data-class warnings on PII fields, Cedar policy preview,
  WCAG AA accessibility diagnostics, branching DAG cycle hints). No state mutation;
  pure read + presentation; human always in the loop.

  Examples:
  - On PII-class field selection: surface "data_class=PII_IDENTIFYING; this field
    will be column-encrypted per ADR-FORMS-0003".
  - On production-tier publish attempt: surface Cedar policy preview ("this publish
    will trigger policy_preview_acknowledged gate").
  - On employment-context high-risk auto-decision screening question: surface DPIA prompt if tenant declares true.
  - On branching DAG: surface cycle warning if a branch would create a loop.
  - On accessibility check: surface WCAG 2.2 AA violations before publish.

owner_team: axis-forms + council-design-system + council-privacy
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-FORMS-0001, ADR-FORMS-0004]
related_specs: [/specs/microservices/forms.json]
related_artifacts:
  - microservices/forms/PRD.md FR-01 + FR-12 + FR-17
  - workflow/forms/policy/tenant-scope.cedar
  - workflow/forms/contracts/openapi/forms.openapi.yaml
  - microservices/forms/threat-model.md §"T-T-05" (AI suggestions never load-bearing)

autonomy_tier: T0
# T0 = pure suggestion; no state read of sensitive data, no state write.
# Per ADR-0022 autonomy tiers (Bominal-inherited).
# Per ADR-FORMS-0005 §"T0 — Suggest" — copilot intra-µservice only.

risk_class:
  scope: not_high_risk
  rationale: |
    T0 is purely suggestive; tenant explicitly accepts each suggestion; no
    autonomous output; transparency obligation (Art. 50) met by labeling
    suggestions as AI-generated in the builder UI.
  recital_65_check: not_applicable
  auto_decision_screening_check: not_applicable

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: form_id
    type: string
    required: false
  - name: trigger
    type: enum
    values:
      - pii_field_selected
      - production_publish_attempted
      - auto_decision_screening_declared
      - field_added
      - branching_predicate_authored
      - wcag_accessibility_check
      - cross_field_rule_authored
      - i18n_translation_requested
      - data_class_inferred
    required: true
  - name: context
    type: object
    description: trigger-specific context (field name, field type, branch predicate, etc.)
    required: false

outputs:
  - name: suggestions
    type: array
    item_schema:
      kind: string  # data_class_warning / policy_preview / dpia_prompt / wcag_violation / cycle_warning / next_step_hint
      severity: string  # info / warn / blocking
      message: string
      action_hint: string  # optional UI action
      json_pointer: string  # which form spec node the suggestion targets

data_classes_touched:
  - INTERNAL_ONLY
  # Suggestions reference data-class hints but never reveal raw values.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.forms.suggestions.emitted
# Suggestions are themselves audit-emitted to detect adversarial probing patterns.

cost_profile:
  type: per-suggestion
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - Local heuristic check (sub-millisecond)
    - Cedar policy preview evaluation (constant-time)
    - axe-core rules engine on builder DOM

cedar_policy_fragments:
  - workflow/forms/policy/tenant-scope.cedar
  - workflow/forms/policy/public-read.cedar

eval_set:
  reference_inputs_path: microservices/forms/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.95
  eval_metric: suggestion-relevance-and-non-misleadingness-against-curated-test-corpus
  cadence: per-release
  reference: |
    Test corpus covers: data-class hints, policy previews, employment-context high-risk auto-decision prompts,
    WCAG 2.2 AA violations, branching DAG cycle warnings, i18n hints. Suggestions
    must NEVER mislead author into XSS-risky field choice OR bypass Cedar OR
    miscategorise a PII field as NORMAL.

invariants:
  - never_writes: |
      T0 NEVER writes state; only reads + emits suggestions.
  - never_reveals_pii: |
      Suggestions reference data-class hints but never raw values. Asserted
      by `tests/integration/t0_pii_redaction.rs`.
  - never_bypasses_cedar: |
      Even when suggesting a permissive Cedar setting, the suggestion is
      non-binding; tenant must explicitly accept + policy-preview-acknowledge.

sunset:
  status: none
  notes: ""
