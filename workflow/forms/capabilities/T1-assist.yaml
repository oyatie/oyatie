# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:forms:t1-assist:v1
name: t1-assist
namespace: forms
display_name: Forms T1 — AI-assisted form drafting (tenant reviews)
description: |
  T1-tier capability: forms drafts a candidate form definition from tenant prose.
  Output is bounded to intra-µservice (forms' own field types + Ontology object
  bindings for typed-field configuration). Cross-µservice destinations forbidden
  at T1 per ADR-FORMS-0005 §"T1 — Assist".

  Examples:
  - Tenant: "build me a customer feedback form with 1-5 scale, comment box,
    and email field". Output: candidate form.v1 with three fields.
  - Tenant: "build me a patient intake form" (pack-us-healthcare). Output:
    candidate form.v1 with PHI-tagged fields; DPIA prompt surfaced.
  - Tenant: "build me a job application form". Output: candidate form.v1 + Annex
    III §4 screening prompt + high-risk-classified flag.

  Output is a draft; tenant explicitly reviews + accepts in the builder before
  the form becomes a tenant-owned Form. Acceptance is ChangeSet-bound (ADR-0110)
  for reversibility.

owner_team: axis-forms + foundry-providers-team + council-privacy
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0110, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-FORMS-0005]
related_specs: [/specs/microservices/forms.json]
related_artifacts:
  - microservices/forms/PRD.md FR-22 + AC-25
  - microservices/forms/decisions/ADR-FORMS-0005-ai-form-build-bounds.md
  - workflow/forms/policy/tenant-scope.cedar
  - workflow/forms/contracts/openapi/forms.openapi.yaml /ai-build:draft
  - workflow/forms/dashboards/ai-form-build-quality.json

autonomy_tier: T1
# T1 = AI drafts; tenant reviews + accepts; ChangeSet-bound; reversible.
# Per ADR-FORMS-0005 §"T1 — Assist".

risk_class:
  scope: potentially_high_risk
  rationale: |
    T1 default scope intra-µservice; not high-risk by default. Becomes high-risk
    if tenant attests auto_decision_screening=true (employment/credit/insurance
    screening) — employment-context high-risk auto-decision. Builder requires DPIA + pack-specific conformity
    assessment in that case.
  recital_65_check: applies_if_auto_decision_screening
  auto_decision_screening_check: tenant-attested at publish time
  transparency_obligation: |
    Form spec field `ai_build_origin=true` set; submitter banner per active pack transparency
    rendered above form.
  human_oversight: |
    Tenant explicitly reviews + accepts each draft per active pack human-oversight.
  records: |
    90-day archive of prompt + completion + Cedar decision per active pack audit-record.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: prompt
    type: string
    max_length: 4000
    required: true
  - name: auto_decision_screening
    type: boolean
    description: tenant attestation; if true, triggers high-risk classification
    required: true
  - name: locale_preference
    type: string
    pattern: '^[a-z]{2}(-[A-Z]{2})?$'
    required: false

outputs:
  - name: draft_form
    type: object
    description: candidate form.v1 spec
  - name: high_risk_classified
    type: boolean
    description: true if auto_decision_screening OR LLM inferred high-risk patterns
  - name: dpia_required
    type: boolean
    description: true if high_risk_classified OR SENSITIVE_GDPR_ART9 fields inferred
  - name: lint_warnings
    type: array
    description: data-class mismatches, missing consent_notice, etc.
  - name: rejection_reason
    type: string
    description: present if dsl-loader rejected the LLM output

data_classes_touched:
  - INTERNAL_ONLY
  # T1 reads prompt + emits draft. Prompt may contain PII (mitigated by PII redactor pre-LLM).
  - PII_QUASI_IDENTIFIER
  # Tenant-side; not stored beyond 90-day archive.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.forms.ai_build.requested

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.04
  cost_drivers:
    - LLM token cost (pack-resident provider; varies)
    - PII redactor + prompt-injection scrub (~5ms)
    - dsl-loader schema validation (~2ms)
    - Cedar policy evaluation (constant-time)
    - 90-day archive write (~3ms)

cedar_policy_fragments:
  - workflow/forms/policy/tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/forms/capabilities/eval/t1-assist-reference.jsonl
  pass_threshold: 0.80
  eval_metric: |
    Composite invariants over 1000-prompt corpus:
    (a) Schema-valid completion rate ≥ 80%.
    (b) Data-class inference correctness ≥ 95% on a labelled subset.
    (c) employment-context high-risk auto-decision detection sensitivity ≥ 90% (high-recall).
    (d) Cross-µservice node inclusion = 0% (forbidden at T1).
    (e) Cedar bypass attempts = 0%.
  cadence: per-release + nightly
  reference: ADR-FORMS-0005 §"Decision" + regional AI-risk Art. 15 accuracy

invariants:
  - never_silent_publish: |
      T1 drafts NEVER auto-publish; tenant explicit-accept required.
  - never_cross_microservice: |
      T1 output emitting a foreign µservice node is rejected by dsl-loader.
      Asserted by `tests/integration/t1_no_cross_microservice.rs`.
  - never_data_class_mismatch: |
      LLM emitting `data_class=NORMAL` for an inferred-PII field is rejected.
      Asserted by `tests/integration/t1_pii_inference.rs`.
  - never_cedar_bypass: |
      LLM emitting `cedar_check: skip` is rejected.
      Asserted by `tests/integration/t1_cedar_bypass.rs`.
  - auto_decision_attestation_required: |
      Builder requires tenant attestation at publish; ChangeSet enforces.

sunset:
  status: none
  notes: ""
