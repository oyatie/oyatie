// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oyatie forms — gRPC + Protocol Buffers SDK
//
// Internal SDK between Forms components (form-rest <-> response-collector-rest <->
// export-worker <-> bulk-distribute-worker <-> webhook-worker <-> AI-form-build-worker).
//
// Public REST surface in contracts/openapi/forms.openapi.yaml; internal binary
// surface here. Per ADR-0131 per-microservice flat layout, internal protocols are
// versioned alongside external ones.
//
// Mirrors AsyncAPI event names; uses Ed25519 seal for audit-chain.

syntax = "proto3";

package oyatie.forms.v1;

option go_package = "github.com/oyatie/forms-sdk-go/v1";
option java_package = "ai.oyatie.forms.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// Core types
// =============================================================================

message TenantId {
  string value = 1;
}

message FormId {
  string value = 1;
}

message ResponseId {
  string value = 1;
}

message AuditChainSeal {
  string seal_id = 1;
  bytes ed25519_signature = 2;
  string parent_seal_id = 3;
  google.protobuf.Timestamp sealed_at = 4;
}

enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  NORMAL = 1;
  PII_IDENTIFYING = 2;
  PII_QUASI_IDENTIFIER = 3;
  SENSITIVE_GDPR_ART9 = 4;
  PHI = 5;
  FINANCIAL = 6;
  BEHAVIORAL_TENANT_PRODUCT = 7;
  SECRET = 8;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  NUMBER = 2;
  DATE = 3;
  DATETIME = 4;
  SINGLE_CHOICE = 5;
  MULTI_CHOICE = 6;
  SCALE = 7;
  GRID = 8;
  FILE_UPLOAD = 9;
  SIGNATURE = 10;
  PAYMENT = 11;
  CONDITIONAL = 12;
}

enum TenantClass {
  TENANT_CLASS_UNSPECIFIED = 0;
  DEMO_TRIAL = 1;
  PAID = 2;
}

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

// =============================================================================
// Form definition
// =============================================================================

message Field {
  string field_id = 1;
  FieldType type = 2;
  DataClass data_class = 3;
  bool required = 4;
  map<string, string> i18n_label = 5;  // locale -> label
  FieldValidation validation = 6;
}

message FieldValidation {
  string pattern = 1;
  string min = 2;
  string max = 3;
  int32 min_length = 4;
  int32 max_length = 5;
  repeated string allowed_mime_types = 6;
  int64 max_bytes = 7;
}

message Section {
  string section_id = 1;
  repeated Field fields = 2;
}

message Page {
  string page_id = 1;
  repeated Section sections = 2;
}

message BranchPredicate {
  string when_cel_expression = 1;   // per ADR-FORMS-0004
  repeated string show_field_ids = 2;
  repeated string hide_field_ids = 3;
  string next_page_id = 4;
}

message CrossFieldRule {
  string cel_rule = 1;
  map<string, string> error_message_i18n = 2;
}

message FormSpecV1 {
  string purpose = 1;
  string consent_notice = 2;
  repeated Page pages = 3;
  repeated BranchPredicate branching = 4;
  repeated CrossFieldRule cross_field_rules = 5;
}

message Form {
  FormId form_id = 1;
  TenantId tenant_id = 2;
  string title = 3;
  int32 version = 4;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    DRAFT = 1;
    PUBLISHED = 2;
    ARCHIVED = 3;
  }
  Status status = 5;
  string schema_hash = 6;  // RFC 8785 canonical hash
  bool ai_build_origin = 7;
  bool annex_iii_4_screening = 8;
  bool accepting_submissions = 9;
  bool anonymous_submission_allowed = 10;
  google.protobuf.Timestamp published_at = 11;
  Pack pack = 12;
  bool wcag_22_aa_attested = 13;
  FormSpecV1 spec = 14;
}

// =============================================================================
// Response
// =============================================================================

message Response {
  ResponseId response_id = 1;
  FormId form_id = 2;
  int32 form_version = 3;
  TenantId tenant_id = 4;
  string submitter_hash = 5;
  google.protobuf.Timestamp submitted_at = 6;
  AuditChainSeal audit_chain_seal = 7;
  google.protobuf.Struct fields = 8;  // PII fields encrypted at column level
  bool pii_encrypted = 9;
}

// =============================================================================
// AI-form-build
// =============================================================================

message AiBuildDraftRequest {
  TenantId tenant_id = 1;
  string prompt = 2;
  CapabilityTier tier = 3;
  repeated string cross_microservice_destinations = 4;
  bool annex_iii_4_screening = 5;
}

message AiBuildDraftResponse {
  string draft_id = 1;
  bool high_risk_classified = 2;
  bool dpia_required = 3;
  Form draft_form = 4;
  repeated string lint_warnings = 5;
}

// =============================================================================
// Service definitions
// =============================================================================

service FormsService {
  rpc GetForm(GetFormRequest) returns (Form);
  rpc CreateForm(CreateFormRequest) returns (Form);
  rpc EditFormDraft(EditFormDraftRequest) returns (Form);
  rpc PublishForm(PublishFormRequest) returns (Form);
  rpc ArchiveForm(ArchiveFormRequest) returns (Form);
  rpc SubmitResponse(SubmitResponseRequest) returns (SubmitResponseResult);
  rpc StreamResponses(StreamResponsesRequest) returns (stream Response);
  rpc AiBuildDraft(AiBuildDraftRequest) returns (AiBuildDraftResponse);
  rpc AiBuildAccept(AiBuildAcceptRequest) returns (Form);
  rpc AiBuildReject(AiBuildRejectRequest) returns (AiBuildRejectResult);
}

message GetFormRequest {
  TenantId tenant_id = 1;
  FormId form_id = 2;
}
message CreateFormRequest {
  TenantId tenant_id = 1;
  string title = 2;
  FormSpecV1 spec = 3;
}
message EditFormDraftRequest {
  TenantId tenant_id = 1;
  FormId form_id = 2;
  FormSpecV1 spec = 3;
}
message PublishFormRequest {
  TenantId tenant_id = 1;
  FormId form_id = 2;
  bool policy_preview_acknowledged = 3;
  bool annex_iii_4_screening = 4;
  bool accepting_submissions = 5;
  bool anonymous_submission_allowed = 6;
}
message ArchiveFormRequest {
  TenantId tenant_id = 1;
  FormId form_id = 2;
}
message SubmitResponseRequest {
  string form_runtime_token = 1;  // HMAC-signed published-form token
  string captcha_token = 2;
  string submitter_hash = 3;
  google.protobuf.Struct field_values = 4;
}
message SubmitResponseResult {
  ResponseId response_id = 1;
  AuditChainSeal audit_chain_seal = 2;
  string next_action_hint = 3;
}
message StreamResponsesRequest {
  TenantId tenant_id = 1;
  FormId form_id = 2;
  bool pii_unredacted = 3;  // entitlement-gated
  google.protobuf.Timestamp since = 4;
}
message AiBuildAcceptRequest {
  TenantId tenant_id = 1;
  string draft_id = 2;
}
message AiBuildRejectRequest {
  TenantId tenant_id = 1;
  string draft_id = 2;
  string reason = 3;
}
message AiBuildRejectResult {
  string draft_id = 1;
  google.protobuf.Timestamp rejected_at = 2;
}
