# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-secret-references
  namespace: forms
data:
  # Pointers only; resolved at runtime via OpenBao Agent.
  POSTGRES_BACKUP_BUCKET_REF: "${openbao:secret/forms/postgres-backup/bucket}"
  POSTGRES_BACKUP_KEY_REF: "${openbao:secret/forms/postgres-backup/access-key}"
  KEK_ROOT_REF_PREFIX: "${openbao:secret/forms/{{ .Pack }}/kek}"
  VALKEY_AUTH_REF: "${openbao:secret/forms/valkey/auth-token}"
  MEILISEARCH_MASTER_KEY_REF: "${openbao:secret/forms/meilisearch/master-key}"
  HCAPTCHA_SECRET_REF: "${openbao:secret/forms/captcha/hcaptcha-secret}"
  TURNSTILE_SECRET_REF: "${openbao:secret/forms/captcha/turnstile-secret}"
  FRIENDLY_CAPTCHA_SECRET_REF: "${openbao:secret/forms/captcha/friendly-captcha-secret}"
  AUDIT_CHAIN_SIGNING_KEY_REF: "${openbao:secret/forms/audit-chain/signing-key}"
  HMAC_PREFILL_SECRET_REF: "${openbao:secret/forms/prefill-link/hmac}"
  TEMPLATE_SIGNING_KEY_REF: "${openbao:secret/forms/template-marketplace/signing-key-{{ .Pack }}}"
