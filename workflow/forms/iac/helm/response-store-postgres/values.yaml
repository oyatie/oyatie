# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
citus:
  image:
    tag: "12.1.0"   # LTS pin (per ADR-FORMS-0003)
  primary:
    replicas: 1
    resources:
      requests: {cpu: 2, memory: 8Gi}
      limits: {cpu: 4, memory: 16Gi}
  worker:
    replicas: 3
    resources:
      requests: {cpu: 4, memory: 16Gi}
      limits: {cpu: 8, memory: 32Gi}
  rls:
    enabled: true
  shardKey: tenant_id
  config:
    citus.shard_count: 32
    citus.replication_factor: 2
  initdb:
    secret:
      name: forms-postgres-init
      key: init.sql
    sqlScripts:
      enable-pgaudit.sql: |
        CREATE EXTENSION IF NOT EXISTS pgaudit;
        ALTER SYSTEM SET pgaudit.log = 'ROLE,DDL,WRITE';

columnEncryption:
  enabled: true
  cipher: "aes-256-gcm"
  kmsRoot: "${openbao:secret/forms/<pack>/kek}"
  kekRotationCadence: "quarterly"
  dekRotationCadence: "quarterly"
  aadFields: [tenant_id, form_id, response_id, field_id, data_class]
  dekCacheTtlSeconds: 300

s3Backup:
  endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
  bucket: "${OCI_FORMS_POSTGRES_BACKUP_BUCKET}"
  accessKeyId: "${openbao:secret/forms/postgres-backup/access-key}"
  secretAccessKey: "${openbao:secret/forms/postgres-backup/secret-key}"
  retention:
    hot_days: 35
    cold_months: 12

monitoring:
  enabled: true
  serviceMonitor:
    interval: 30s

networkPolicy:
  enabled: true
  ingress:
    - from: forms.forms.svc.cluster.local
      ports: [5432]
    - from: response-collector-rest.forms.svc.cluster.local
      ports: [5432]
    - from: export-worker.forms.svc.cluster.local
      ports: [5432]
