# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
meilisearch:
  image:
    tag: "0.10.0"  # LTS pin
  replicas: 3
  resources:
    requests: {cpu: 2, memory: 8Gi}
    limits: {cpu: 4, memory: 16Gi}
  storage:
    size: 200Gi
    storageClass: oci-bv-balanced
  config:
    no_analytics: true
    snapshot_interval_sec: 86400
piiIndexPolicy:
  pii_columns_indexed: false  # T-I-05 invariant
  enforced_by: oya-forms-meilisearch-adapter
auth:
  masterKeyRef: "${openbao:secret/forms/meilisearch/master-key}"
networkPolicy:
  enabled: true
  ingress:
    - from: forms.forms.svc.cluster.local
      ports: [7700]
