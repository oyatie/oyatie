# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
waf:
  provider: oci
  ruleSets:
    - name: owasp-crs-v4
      enabled: true
    - name: forms-rate-limit-per-ip
      enabled: true
      rps: 10
      burst: 50
    - name: forms-rate-limit-per-tenant
      enabled: true
      rps: 1000
      burst: 5000
    - name: forms-rate-limit-per-form
      enabled: true
      rps: 100
      burst: 500
    - name: forms-bot-detection
      enabled: true
      challenge_on_score_above: 80
    - name: forms-emergency-ddos-v1
      enabled: false  # activated by runbooks/spam-flood-throttle.md Path C
    - name: forms-anti-bot-v2
      enabled: false  # activated by runbooks/spam-flood-throttle.md Path B

csp:
  enforced: true
  defaultPolicy: |
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://*.oyatie.dev;
    base-uri 'self';
    form-action 'self';
    require-trusted-types-for 'script';
    trusted-types forms-renderer;
