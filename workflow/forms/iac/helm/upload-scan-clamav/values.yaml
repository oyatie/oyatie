# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
clamav:
  image:
    tag: "1.3.1"  # LTS pin
  replicas: 4
  resources:
    requests: {cpu: 1, memory: 2Gi}
    limits: {cpu: 2, memory: 4Gi}
  hpa:
    enabled: true
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  freshclam:
    interval_minutes: 60
opswat:
  enabled: false  # enterprise path; per-tenant entitlement
  endpoint: "${OPSWAT_ENDPOINT}"
  apiKeyRef: "${openbao:secret/forms/opswat/api-key}"
limits:
  max_file_size_mb: 100
  scan_timeout_seconds: 30
failClosed: true  # infected file rejected; scan-failure rejected
