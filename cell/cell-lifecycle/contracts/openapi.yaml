openapi: '3.2.0'
info:
  title: Oyatie Cell Lifecycle API
  version: '2026-05-21'
  summary: Logical cell lifecycle state machine API per ADR-0276 D-3.
  description: >-
    Authoring-only contract for the cell-lifecycle microservice. The API owns
    logical Cell transitions and delegates provisioning, tenant migration, and
    routing to cloud-iac, cell-rebalancer, and api-gateway respectively.
servers:
  - url: https://api.oyatie.com/v/{oyatie_version}
    description: ADR-0267 date-version URL-prefix carrier; service resource paths remain /v1/* per ADR-0276 D-3.3.
    variables:
      oyatie_version:
        default: '2026-05-21'
        description: Public API date version in YYYY-MM-DD form.
tags:
  - name: Cells
    description: Logical cell lifecycle commands and reads.
security:
  - cedarDecision: []
paths:
  /v1/cells:
    get:
      tags: [Cells]
      operationId: listCells
      summary: List cells with optional lifecycle state filter.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/TenantClassQuery'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CellState'
        - name: region_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cells returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCellsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cells]
      operationId: registerCell
      summary: Register a logical cell after cloud-iac readiness evidence is available.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCellRequest'
      responses:
        '201':
          description: Cell registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellTransitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/cells/{cell_id}:activate:
    post:
      tags: [Cells]
      operationId: activateCell
      summary: Activate a registered cell when telemetry and readiness evidence are present.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CellIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCellRequest'
      responses:
        '200':
          description: Cell activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellTransitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/cells/{cell_id}:promote:
    post:
      tags: [Cells]
      operationId: promoteCell
      summary: Promote a cell to the next requested ADR-0204 tier after ADR-0266 gate validation.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CellIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteCellRequest'
      responses:
        '200':
          description: Cell promoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellTransitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/MissingEvidence' }
  /v1/cells/{cell_id}:drain:
    post:
      tags: [Cells]
      operationId: drainCell
      summary: Place a cell into Draining and delegate tenant movement to cell-rebalancer.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CellIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrainCellRequest'
      responses:
        '200':
          description: Cell drain accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellTransitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/cells/{cell_id}:decommission:
    post:
      tags: [Cells]
      operationId: decommissionCell
      summary: Decommission a Draining cell after tenancy proves resident count is zero.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CellIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecommissionCellRequest'
      responses:
        '200':
          description: Cell decommissioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellTransitionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/MissingEvidence' }
  /v1/cells/{cell_id}/lifecycle:
    get:
      tags: [Cells]
      operationId: getCellLifecycle
      summary: Return current cell state and immutable lifecycle history references.
      parameters:
        - $ref: '#/components/parameters/OyatieVersionHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CellIdPath'
      responses:
        '200':
          description: Lifecycle returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLifecycleResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cell-lifecycle
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    cedarDecision:
      type: http
      scheme: bearer
      bearerFormat: Cedar decision token
  parameters:
    OyatieVersionHeader:
      name: Oyatie-Version
      in: header
      required: true
      description: ADR-0267 date-version header carrier.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-05-21'
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CellIdPath:
      name: cell_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantClassQuery:
      name: tenant_class
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TenantClass'
  responses:
    BadRequest:
      description: Invalid carrier, request shape, or command parameters.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Principal authentication missing or invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Cedar authorization denied or missing permit context.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Current state or lifecycle_version does not permit the requested transition.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Cell not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    MissingEvidence:
      description: Evidence pack, gate snapshot, resident-count proof, or compliance receipt is missing or stale.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    CellState:
      type: string
      enum: [Registered, Activated, Promoted-T4, Promoted-T3, Promoted-T2, Promoted-T1, Promoted-T0, Draining, Decommissioned]
    PromotionTier:
      type: string
      enum: [T4, T3, T2, T1, T0]
    TenantClass:
      type: string
      enum: [demo_trial, paid]
    VersionCarrier:
      type: object
      required: [oyatie_version]
      properties:
        oyatie_version:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: ADR-0267 schema-level carrier aligned with the header and URL prefix.
    RegisterCellRequest:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [region_id, placement_class, cloud_iac_receipt_id, tenant_class_scope]
          properties:
            region_id: { type: string }
            placement_class: { $ref: '#/components/schemas/PromotionTier' }
            cloud_iac_receipt_id: { type: string }
            tenant_class_scope:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/TenantClass' }
            reason: { type: string }
    ActivateCellRequest:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [cloud_iac_receipt_id, observability_window_id, evidence_pack_id]
          properties:
            cloud_iac_receipt_id: { type: string }
            observability_window_id: { type: string }
            evidence_pack_id: { type: string }
            expected_lifecycle_version: { type: integer, minimum: 0 }
    PromoteCellRequest:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [target_tier, evidence_pack, cedar_permit_id, expected_lifecycle_version]
          properties:
            target_tier: { $ref: '#/components/schemas/PromotionTier' }
            evidence_pack: { $ref: '#/components/schemas/EvidencePack' }
            cedar_permit_id: { type: string }
            emergency_override:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                incident_id: { type: string }
                signatures:
                  type: array
                  items: { type: string }
            expected_lifecycle_version: { type: integer, minimum: 0 }
    DrainCellRequest:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [reason_code, evidence_pack, cedar_permit_id, expected_lifecycle_version]
          properties:
            reason_code:
              type: string
              enum: [hardware_failure, load_skew, planned_decommission, compliance_withdrawal, emergency_containment, promotion_rollback]
            evidence_pack: { $ref: '#/components/schemas/EvidencePack' }
            cedar_permit_id: { type: string }
            cell_rebalancer_plan_id: { type: string }
            expected_lifecycle_version: { type: integer, minimum: 0 }
    DecommissionCellRequest:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [resident_count_proof, evidence_pack, cedar_permit_id, expected_lifecycle_version]
          properties:
            resident_count_proof:
              type: object
              required: [tenancy_snapshot_id, resident_count]
              properties:
                tenancy_snapshot_id: { type: string }
                resident_count: { type: integer, const: 0 }
            evidence_pack: { $ref: '#/components/schemas/EvidencePack' }
            cedar_permit_id: { type: string }
            expected_lifecycle_version: { type: integer, minimum: 0 }
    EvidencePack:
      type: object
      required: [evidence_pack_id, evidence_pack_sha256, gate_snapshot_sha256, compliance_pack_receipts, blast_radius_check_id]
      properties:
        evidence_pack_id: { type: string }
        evidence_pack_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        gate_snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        observability_window_id: { type: string }
        blast_radius_check_id: { type: string }
        tenant_class_receipts:
          type: array
          items: { $ref: '#/components/schemas/TenantClass' }
        compliance_pack_receipts:
          type: array
          items: { type: string }
        expires_at_hlc: { type: string }
    Cell:
      type: object
      required: [cell_id, state, lifecycle_version, region_id, updated_hlc]
      properties:
        cell_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/CellState' }
        tier: { $ref: '#/components/schemas/PromotionTier' }
        region_id: { type: string }
        tenant_class_scope:
          type: array
          items: { $ref: '#/components/schemas/TenantClass' }
        lifecycle_version: { type: integer, minimum: 0 }
        latest_audit_chain_event_id: { type: string }
        latest_evidence_pack_id: { type: string }
        updated_hlc: { type: string }
    LifecycleHistory:
      type: object
      required: [history_id, cell_id, from_state, to_state, action, principal, hlc_timestamp, audit_chain_event_id]
      properties:
        history_id: { type: string, format: uuid }
        cell_id: { type: string, format: uuid }
        from_state: { $ref: '#/components/schemas/CellState' }
        to_state: { $ref: '#/components/schemas/CellState' }
        action: { type: string }
        principal: { type: string }
        cedar_decision_id: { type: string }
        evidence_pack_id: { type: string }
        gate_snapshot_sha256: { type: string }
        hlc_timestamp: { type: string }
        audit_chain_event_id: { type: string }
        result: { type: string, enum: [accepted, rejected] }
    CellTransitionResponse:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [cell, transition]
          properties:
            cell: { $ref: '#/components/schemas/Cell' }
            transition: { $ref: '#/components/schemas/LifecycleHistory' }
    ListCellsResponse:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [cells]
          properties:
            cells:
              type: array
              items: { $ref: '#/components/schemas/Cell' }
            next_cursor: { type: string }
    GetLifecycleResponse:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [cell, history]
          properties:
            cell: { $ref: '#/components/schemas/Cell' }
            history:
              type: array
              items: { $ref: '#/components/schemas/LifecycleHistory' }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/VersionCarrier'
        - type: object
          required: [error_code, message, request_id]
          properties:
            error_code: { type: string }
            message: { type: string }
            request_id: { type: string }
            cedar_decision_id: { type: string }
            missing_evidence:
              type: array
              items: { type: string }
            latest_lifecycle_version: { type: integer }
