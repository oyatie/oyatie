
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-rebalancer-api-create-latency
  displayName: cell-rebalancer create job API p99 latency
  labels:
    service: cell-rebalancer
    category: latency
spec:
  service: cell-rebalancer
  budgetingMethod: Occurrences
  objectives:
    - displayName: create-job-p99-under-200ms
      target: 0.99
      op: lte
      value: 200
      timeSliceTarget: 0.99
      timeSliceWindow: 5m
  indicator:
    metadata:
      name: api_p99_latency_ms_create
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket{service="cell-rebalancer",operation="createRebalanceJobV20260521Tag8001"}[5m])) by (le)) <= 200
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(http_requests_total{service="cell-rebalancer",operation="createRebalanceJobV20260521Tag8001"}[5m]))
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-rebalancer-api-status-latency
spec:
  service: cell-rebalancer
  budgetingMethod: Occurrences
  objectives:
    - displayName: status-p99-under-50ms
      target: 0.99
      op: lte
      value: 50
  indicator:
    metadata:
      name: api_p99_latency_ms_status
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket{service="cell-rebalancer",operation=~"getRebalanceJobV20260521Tag8001|listTenantMigrationHistoryV20260521Tag8001"}[5m])) by (le)) <= 50
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(http_requests_total{service="cell-rebalancer",operation=~"getRebalanceJobV20260521Tag8001|listTenantMigrationHistoryV20260521Tag8001"}[5m]))
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-rebalancer-migration-duration
spec:
  service: cell-rebalancer
  budgetingMethod: Occurrences
  objectives:
    - displayName: intra-region-p99-under-600s
      target: 0.99
      op: lte
      value: 600
    - displayName: cross-region-p99-under-3600s
      target: 0.99
      op: lte
      value: 3600
  indicator:
    metadata:
      name: migration_duration_p99_seconds
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: histogram_quantile(0.99, sum(rate(cell_rebalancer_migration_duration_seconds_bucket[5m])) by (le, migration_distance))
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-rebalancer-success-rate
spec:
  service: cell-rebalancer
  budgetingMethod: Occurrences
  objectives:
    - displayName: migration-success-rate-99-9
      target: 0.999
  indicator:
    metadata:
      name: migration_success_rate_percent
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(cell_rebalancer_tenant_migration_total{result="cutover_complete"}[30m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(cell_rebalancer_tenant_migration_total[30m]))
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-rebalancer-blast-radius
spec:
  service: cell-rebalancer
  budgetingMethod: Occurrences
  objectives:
    - displayName: no-job-over-100-tenants
      target: 1.0
      op: lte
      value: 100
  indicator:
    metadata:
      name: blast_radius_max_tenants_per_job
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: max(cell_rebalancer_job_tenants_total{service="cell-rebalancer"})
