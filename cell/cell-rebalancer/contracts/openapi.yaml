
openapi: 3.2.0
info:
  title: Oyatie Cell Rebalancer API
  version: 2026-05-21
  summary: Tenant migration across cells per ADR-0276 D-2.
  description: |
    Public REST contract for creating, reading, aborting, and inspecting tenant migration workflows.
    The api-gateway supplies the date-version URL prefix required by ADR-0267; service-local paths remain the /v1 paths named by ADR-0276.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.oyatie.com/v/2026-05-21
    description: Date-versioned api-gateway public boundary.
security:
  - mtlsSpiffe: []
  - oauth2TenantAdmin: [cell-rebalancer.write]
tags:
  - name: RebalanceJobs
  - name: TenantMigrations
paths:
  /v1/rebalance-jobs:
    post:
      tags: [RebalanceJobs]
      operationId: createRebalanceJobV20260521Tag8001
      summary: Create a durable cell rebalance job.
      parameters:
        - $ref: '#/components/parameters/OyatieVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CedarPreEvaluationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRebalanceJobRequest'
      responses:
        '202':
          description: Job accepted and queued.
          headers:
            Oyatie-Version: { $ref: '#/components/headers/OyatieVersion' }
            X-Audit-Chain-Id: { $ref: '#/components/headers/AuditChainId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceJobResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CedarForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/rebalance-jobs/{job_id}:
    get:
      tags: [RebalanceJobs]
      operationId: getRebalanceJobV20260521Tag8001
      summary: Read aggregate job status.
      parameters:
        - $ref: '#/components/parameters/OyatieVersion'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current job status.
          headers:
            Oyatie-Version: { $ref: '#/components/headers/OyatieVersion' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceJobResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/rebalance-jobs/{job_id}:abort:
    post:
      tags: [RebalanceJobs]
      operationId: abortRebalanceJobV20260521Tag8001
      summary: Abort an active rebalance job within Cedar and blast-radius constraints.
      parameters:
        - $ref: '#/components/parameters/OyatieVersion'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CedarPreEvaluationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbortRebalanceJobRequest'
      responses:
        '202':
          description: Abort accepted.
          headers:
            X-Audit-Chain-Id: { $ref: '#/components/headers/AuditChainId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceJobResponse'
        '403': { $ref: '#/components/responses/CedarForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenant_id}:migrate:
    post:
      tags: [TenantMigrations]
      operationId: migrateTenantV20260521Tag8001
      summary: Create a single-tenant migration workflow.
      parameters:
        - $ref: '#/components/parameters/OyatieVersion'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CedarPreEvaluationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateTenantRequest'
      responses:
        '202':
          description: Tenant migration accepted.
          headers:
            X-Audit-Chain-Id: { $ref: '#/components/headers/AuditChainId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMigrationResponse'
        '403': { $ref: '#/components/responses/CedarForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenant_id}/migration-history:
    get:
      tags: [TenantMigrations]
      operationId: listTenantMigrationHistoryV20260521Tag8001
      summary: List tenant-scoped migration history.
      parameters:
        - $ref: '#/components/parameters/OyatieVersion'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant migration history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationHistoryResponse'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cell-rebalancer
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    mtlsSpiffe:
      type: mutualTLS
      description: SPIFFE-backed mTLS at api-gateway and mesh boundaries.
    oauth2TenantAdmin:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://iam.oyatie.com/oauth/token
          scopes:
            cell-rebalancer.write: create or abort migration workflows
            cell-rebalancer.read: read migration history
  parameters:
    OyatieVersion:
      name: Oyatie-Version
      in: header
      required: false
      schema: { type: string, format: date, examples: ['2026-05-21'] }
      description: ADR-0267 date-version header; api-gateway resolves missing values from tenant pinning.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CedarPreEvaluationHeader:
      name: X-Cedar-Pre-Evaluation
      in: header
      required: true
      schema: { type: string, enum: [required] }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
  headers:
    OyatieVersion:
      schema: { type: string, format: date }
    AuditChainId:
      schema: { type: string }
      description: Sealed audit-chain row id for the accepted state change.
  responses:
    BadRequest:
      description: Invalid request or carrier conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CedarForbidden:
      description: Cedar pre-evaluation denied the action.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Workflow state conflict, stale version, or idempotency mismatch.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Job or tenant migration not found in caller scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    CreateRebalanceJobRequest:
      type: object
      required: [trigger, tenant_selector, target_constraints, cedar_pre_evaluation]
      properties:
        trigger: { $ref: '#/components/schemas/RebalanceTrigger' }
        tenant_selector: { $ref: '#/components/schemas/TenantSelector' }
        target_constraints: { $ref: '#/components/schemas/TargetCellConstraints' }
        dry_run: { type: boolean, default: false }
        max_tenants: { type: integer, minimum: 1, maximum: 100 }
        cedar_pre_evaluation: { $ref: '#/components/schemas/CedarPreEvaluation' }
    AbortRebalanceJobRequest:
      type: object
      required: [reason, cedar_pre_evaluation]
      properties:
        reason: { type: string, minLength: 8, maxLength: 512 }
        emergency: { type: boolean, default: false }
        blast_radius_cap: { type: integer, maximum: 100 }
        cedar_pre_evaluation: { $ref: '#/components/schemas/CedarPreEvaluation' }
    MigrateTenantRequest:
      type: object
      required: [trigger, source_cell_id, target_cell_id, cedar_pre_evaluation]
      properties:
        trigger: { $ref: '#/components/schemas/RebalanceTrigger' }
        source_cell_id: { type: string }
        target_cell_id: { type: string }
        compliance_packs: { type: array, items: { $ref: '#/components/schemas/CompliancePack' } }
        residency_domain: { type: string }
        cedar_pre_evaluation: { $ref: '#/components/schemas/CedarPreEvaluation' }
    RebalanceTrigger:
      type: string
      enum: [auto_rebalance, manual_ops, compliance_pack_rotation, residency_change, cell_drain]
    CompliancePack:
      type: string
      enum: [soc2, hipaa, gdpr, csap, pci]
    TenantSelector:
      type: object
      required: [tenant_class]
      properties:
        tenant_ids: { type: array, maxItems: 100, items: { type: string } }
        source_cell_ids: { type: array, items: { type: string } }
        tenant_class: { type: array, items: { type: string, enum: [demo_trial, paid] } }
        load_skew_threshold_percent: { type: integer, default: 30 }
    TargetCellConstraints:
      type: object
      required: [residency_domain, compliance_packs, cell_placement_class]
      properties:
        residency_domain: { type: string }
        compliance_packs: { type: array, items: { $ref: '#/components/schemas/CompliancePack' } }
        cell_placement_class: { type: integer, enum: [0] }
        min_headroom_percent: { type: integer, default: 30 }
        cross_jurisdiction_permit_id: { type: string }
    CedarPreEvaluation:
      type: object
      required: [principal, action, resource, decision_id, result]
      properties:
        principal: { type: string }
        action: { type: string }
        resource: { type: string }
        decision_id: { type: string }
        result: { type: string, enum: [permit, forbid] }
        applied_policies: { type: array, items: { type: string } }
    AuditChainEmission:
      type: object
      required: [event_type, microservice, job_id, pre_state, post_state, hlc_timestamp, audit_chain_seal]
      properties:
        event_type: { type: string }
        microservice: { type: string, const: cell-rebalancer }
        job_id: { type: string, format: uuid }
        tenant_id: { type: string }
        source_cell_id: { type: string }
        target_cell_id: { type: string }
        pre_state: { type: string }
        post_state: { type: string }
        residency_check_result: { type: string }
        compliance_pack_check_result: { type: string }
        cedar_permit_id: { type: string }
        initiated_by: { type: string }
        hlc_timestamp: { type: string }
        audit_chain_seal: { type: string }
    RebalanceJobResponse:
      type: object
      required: [job_id, state, trigger, tenant_counts, audit]
      properties:
        job_id: { type: string, format: uuid }
        state: { type: string, enum: [Queued, Validated, Migrating, Succeeded, PartiallySucceeded, Aborted, Failed] }
        trigger: { $ref: '#/components/schemas/RebalanceTrigger' }
        tenant_counts:
          type: object
          properties:
            total: { type: integer }
            pending: { type: integer }
            complete: { type: integer }
            rolled_back: { type: integer }
        audit: { $ref: '#/components/schemas/AuditChainEmission' }
    TenantMigrationResponse:
      type: object
      required: [migration_id, tenant_id, state, audit]
      properties:
        migration_id: { type: string, format: uuid }
        tenant_id: { type: string }
        state: { type: string, enum: [Pending, SourceQuiesce, DataTransfer, TargetActivate, CutoverComplete, RolledBack] }
        source_cell_id: { type: string }
        target_cell_id: { type: string }
        audit: { $ref: '#/components/schemas/AuditChainEmission' }
    MigrationHistoryResponse:
      type: object
      required: [tenant_id, migrations]
      properties:
        tenant_id: { type: string }
        migrations:
          type: array
          items: { $ref: '#/components/schemas/TenantMigrationResponse' }
    ErrorResponse:
      type: object
      required: [error, message, audit_reference]
      properties:
        error: { type: string }
        message: { type: string }
        cedar_decision_id: { type: string }
        audit_reference: { type: string }
