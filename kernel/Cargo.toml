[workspace]
# Nested-workspace carve-out (ADR-0512): kernel/ is rung-0, separate from the root
# Cargo workspace so its no_std / harness crates resolve independently. Placement is
# sanctioned by governance/capability-registry.json (ADR-0562 CLOSED registry).
members = [
    "core/asterinas-boundary",
    "core/asterinas-abi-matrix",
    "harness/asterinas-real-boot",
    "harness/asterinas-abi-probe",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.97.1"
