[package]
name = "kernel-ksync-kernel"
version.workspace = true
rust-version.workspace = true
# Pinned, NOT `edition.workspace = true`: the kernel/ workspace is edition 2024 and these
# module sources are the verbatim edition-2021 Phase-2 primitives (unsafe_op_in_unsafe_fn /
# static_mut_refs are hard errors in 2024). Relocation must not migrate the edition.
edition = "2021"
publish = false
description = "The kernel's concurrency substrate: the 14 loom/Miri-verified Phase-2 no_std primitives, vendored as one crate."

[package.metadata.oya]
microservice = "kernel"
bounded_context = "kernel"
kind = "shared"
layer = "kernel"
owner_team = "axis-cloud-platform"
purpose = "Cutover-stable no_std kernel concurrency substrate shared by the Frame and architecture backends."
adr_anchors = ["ADR-0512", "ADR-0520", "ADR-0536", "ADR-0562", "ADR-0547"]
design_non_claim = "scaffold_only_no_module_build_boot_artifact_or_runtime_readiness_claim"

[dependencies]

# loom is pulled in ONLY for the concurrency-model-checking build
# (RUSTFLAGS="--cfg loom" cargo test). Production/Miri builds use core atomics.
# It is a cfg-gated, test-only model checker — it never appears in the kernel
# (non-loom) dependency graph, so the no_std + bare-metal build is unaffected.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Carried from the cloud-kernel workspace's `[workspace.lints.rust]`, which declared this
# check-cfg solely for these ksync primitives. `loom` is a custom cfg set via RUSTFLAGS for the
# concurrency-model-check build; tell rustc it is expected so the production/Miri build does not
# warn on every `#[cfg(loom)]`. Inline (not `workspace = true`) because kernel/ declares no
# `[workspace.lints]` and no other kernel/ crate uses `cfg(loom)`.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)'] }
