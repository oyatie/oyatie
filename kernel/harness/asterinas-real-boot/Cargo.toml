[package]
name = "kernel-asterinas-real-boot"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kernel_asterinas_real_boot"
path = "src/lib.rs"

[[bin]]
name = "kernel-asterinas-real-boot-fetch-verify"
path = "src/main.rs"

[[bin]]
# AC2/AC3 boot orchestration: boot the ISO once in QEMU, capture the raw serial log by
# redirection, derive the boot verdict from the closed marker set, and write the receipts.
name = "kernel-asterinas-real-boot-boot"
path = "src/boot.rs"

[dependencies]
kernel-asterinas-boundary = { path = "../../core/asterinas-boundary" }
# Typed HTTP client — the only permitted non-Rust surface for the fetch is the
# release-asset download performed through this client. rustls => aws-lc-rs backend
# (ADR-0506 mandated; ring forbidden). Version pinned to the reindeer-vendored crate.
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
sha2 = "0.10"
# Marker matching against the closed boot-ready regex set (pure; unit-tested via buck2 test).
regex = "1"
