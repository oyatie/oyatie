# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T2-auto capabilities — drive µservice
#
# Autonomy Tier 2: "automate routinely with opt-out". The system takes recurring
# actions on a schedule without per-action user confirmation. Actions persist
# beyond a single user session. Tenant policy + per-user opt-out + auditability
# constrain T2.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 14 + Art. 50 + Annex III §3 risk classification.

doc_class: AutonomyTierCatalog
microservice: drive
tier: T2
owner_team: axis-drive + foundry-runtime + council-privacy + council-architecture
date: 2026-05-17
review_cadence: per-capability-launch + quarterly + on every EU AI Act regulatory update

capabilities:
  - id: T2-drive-auto-organize
    name: "Auto-organize: move files into AI-suggested folders nightly"
    description: |
      Tenant-elected nightly job: for files dropped into the tenant root + lacking
      explicit folder placement, AI suggests + applies a folder placement based
      on filename / mime / content / tenant pattern. Tenant admin reviews via
      monthly digest; per-file undo via undo-window-30d.
    surface: nightly batch job (Workflow trigger)
    triggers:
      - tenant admin enables T2-drive-auto-organize at tenant level
      - per-user opt-out available
    consent_basis:
      personal_context: REFUSED at Cedar layer for personal pillar (T2 is opt-in tenant-level only)
      professional_context: explicit-on-tenant-admin-opt-in + per-user opt-out
    data_class_processed: [PROFESSIONAL_FILE_CONTENT, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (file-move events)
    reversibility:
      window_seconds: 2592000  # 30 days
      action_on_cancel: revert file to root folder
      cancel_surface: tenant-portal monthly digest + per-file undo button
    model:
      primary: tenant-default-llm + heuristic
      fallback: skip (do not move)
      private_inference: tenant-DEK-wrapped pipeline; no cross-tenant training
    latency_budget_p99_seconds: 14400  # nightly job; 4h max per tenant
    audit_event: DriveAutoOrganizeApplied (Ed25519-sealed; payload — file id hashes + before/after folder ids + reversibility-window expiry)
    fallback_on_model_failure: skip; no moves applied
    risk_classification: |
      limited-risk for general business filing; **high-risk if applied in HR
      context (performance reviews, hiring docs, employment decisions)** per
      EU AI Act Annex III §3. Therefore: HR-document overlay REFUSED at Cedar
      layer for pack-eu tenants until a conformity-assessment ADR-DRIVE-XXXX
      ships. pack-us / pack-jp / etc. retain T2 with per-pack risk disclosure.
    user_label: "Auto-organize moved this file — undo within 30 days"

  - id: T2-drive-auto-archive
    name: "Auto-archive: tier cold files to archive storage"
    description: |
      Files not accessed in > 12 mo (per-tenant policy override) are auto-tiered
      to archive storage (SeaweedFS) per ADR-DRIVE-0001. Bytes remain readable
      but with higher first-byte latency. Tenant admin reviews via monthly
      digest.
    surface: nightly batch job
    triggers:
      - tenant admin enables T2-drive-auto-archive
      - per-tenant policy specifies access-age cutoff (default 12mo)
    consent_basis:
      personal_context: REFUSED at Cedar layer
      professional_context: explicit-on-tenant-admin-opt-in
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (tier-transition events)
    reversibility:
      window_seconds: 2592000  # 30 days (then archive retention applies)
      action_on_cancel: promote back to hot tier
      cancel_surface: tenant-portal monthly digest + per-file undo button
    model:
      primary: rule-based (deterministic access-age cutoff)
      fallback: n/a
      private_inference: n/a
    latency_budget_p99_seconds: 14400
    audit_event: DriveAutoArchiveApplied (Ed25519-sealed; payload — file id hashes + new tier)
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic)
    user_label: "Auto-archived — undo within 30 days; first-byte latency increased"

  - id: T2-drive-auto-deduplicate
    name: "Auto-deduplicate: collapse content-identical files to one + symlink"
    description: |
      Files with identical content-address (SHA-256 of bytes) are collapsed: one
      authoritative file; other instances become content-address-pointer
      records. Storage savings; metadata (filename, path, owner) preserved per
      pointer. Tenant admin reviews via monthly digest.
    surface: nightly batch job
    triggers:
      - tenant admin enables T2-drive-auto-deduplicate
    consent_basis:
      personal_context: REFUSED at Cedar layer
      professional_context: explicit-on-tenant-admin-opt-in
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (dedup events)
    reversibility:
      window_seconds: 7776000  # 90 days
      action_on_cancel: re-expand the deduplicated file (write the pointer back to authoritative bytes)
      cancel_surface: tenant-portal quarterly digest
    model:
      primary: rule-based (deterministic content-address compare)
      fallback: n/a
      private_inference: n/a
    latency_budget_p99_seconds: 14400
    audit_event: DriveAutoDedupApplied (Ed25519-sealed; payload — file id hashes + retained authoritative content-address)
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic)
    user_label: "Auto-deduplicated — undo within 90 days"

verification:
  - All T2 actions emit a Cedar-evaluable principal/action/resource triple BEFORE acting.
  - All T2 actions emit an audit-chain event (Ed25519-sealed) on action-applied AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T2 actions are labelled per EU AI Act Art. 50 in the tenant digest.
  - All T2 actions are tenant_class-gated: Cedar policy `cedar/t2-tenant-class-gate.cedar` admits T2 only for paid tenant_class with per_seat billing_component and active compliance_pack.
  - HR-document overlay (T2-drive-auto-organize on HR documents) REFUSED at Cedar layer pending EU AI Act Annex III §3 conformity-assessment ADR-DRIVE-XXXX.
  - All T2 actions respect WORM tier: files under WORM are skipped (not moved, not archived, not deduplicated) per ADR-DRIVE-0006.
  - All T2 actions respect legal hold: held files are skipped.
  - Personal-pillar T2 is REFUSED at Cedar layer; T2 applies only to Professional pillar.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-DRIVE-0001 — object-storage substrate (archive tier).
  - ADR-DRIVE-0006 — immutability + WORM policy (T2 respects WORM).
  - EU AI Act Regulation (EU) 2024/1689 — Annex III §3 employment-context high-risk; Art. 14 human oversight; Art. 50 transparency.
  - microservices/drive/PRD.md §FR-15 / §FR-23 — adjacent surfaces.
  - microservices/drive/policy/dual-context-isolation.md.
