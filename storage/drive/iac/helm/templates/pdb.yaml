{{- range $bc := list "fileStore" "folderHierarchy" "upload" "download" "sync" "shareLink" "permissions" "searchIndex" "preview" "dlpVirusScan" "immutabilityTier" }}
{{- if $.Values.podDisruptionBudget.enabled }}
{{- $kebab := $bc | snakecase | replace "_" "-" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oya-drive-{{ $kebab }}
  namespace: drive
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      microservice: drive
      bc: {{ $kebab }}
{{- end }}
{{- end }}
