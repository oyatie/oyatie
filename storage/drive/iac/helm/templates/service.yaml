{{- range $bc := list "fileStore" "folderHierarchy" "upload" "download" "sync" "shareLink" "permissions" "searchIndex" "preview" "dlpVirusScan" "immutabilityTier" }}
{{- $cfg := index $.Values $bc }}
{{- $kebab := $bc | snakecase | replace "_" "-" }}
---
apiVersion: v1
kind: Service
metadata:
  name: oya-drive-{{ $kebab }}
  namespace: drive
  labels:
    microservice: drive
    bc: {{ $kebab }}
spec:
  type: ClusterIP
  selector:
    microservice: drive
    bc: {{ $kebab }}
  ports:
    - name: http
      port: {{ $cfg.port | default 9000 }}
      targetPort: http
    - name: metrics
      port: {{ $.Values.global.observability.metricsPort }}
      targetPort: metrics
{{- end }}
