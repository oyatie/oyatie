{{- if .Values.serviceMonitor.enabled }}
{{- range $bc := list "fileStore" "folderHierarchy" "upload" "download" "sync" "shareLink" "permissions" "searchIndex" "preview" "dlpVirusScan" "immutabilityTier" }}
{{- $kebab := $bc | snakecase | replace "_" "-" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oya-drive-{{ $kebab }}
  namespace: drive
spec:
  selector:
    matchLabels:
      microservice: drive
      bc: {{ $kebab }}
  endpoints:
    - port: metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      path: /metrics
{{- end }}
{{- end }}
