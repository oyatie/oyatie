{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-drive-alerts
  namespace: drive
spec:
  groups:
    - name: drive-burn-rate-alerts
      rules:
        # File-list latency burn-rate
        - alert: DriveFileListFastBurn1h14x
          expr: |
            (
              histogram_quantile(0.99, sum by (le) (rate(oya_drive_file_list_seconds_bucket[1h])))
              > 0.15 * 14
            )
          for: 5m
          labels: {severity: page, microservice: drive, bc: folder-hierarchy}
          annotations:
            summary: "file-list p99 14× the 30d SLO budget over the last 1h"
            runbook: "storage/drive/runbooks/object-storage-degraded.md"

        # Upload multipart throughput burn-rate
        - alert: DriveUploadMultipartFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_upload_multipart_seconds_bucket{size_bucket="1gb"}[1h])))
              > 90 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: upload}
          annotations:
            summary: "upload multipart 1GB p99 14× the 30d SLO budget over the last 1h"
            runbook: "storage/drive/runbooks/upload-multipart-stuck.md"

        # Download first-byte burn-rate
        - alert: DriveDownloadFirstByteFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_download_first_byte_seconds_bucket{cache_state="warm"}[1h])))
              > 0.1 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: download}
          annotations:
            summary: "download first-byte (warm) p99 14× the 30d SLO budget over the last 1h"
            runbook: "storage/drive/runbooks/object-storage-degraded.md"

        # Search query burn-rate
        - alert: DriveSearchFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_search_query_seconds_bucket{corpus_size_bucket="1m"}[1h])))
              > 0.4 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: search-index}
          annotations:
            summary: "search query p99 14× the 30d SLO budget over the last 1h"

        # Sync delta burn-rate
        - alert: DriveSyncDeltaFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_sync_delta_seconds_bucket{changed_file_count_bucket="100"}[1h])))
              > 30 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: sync}
          annotations:
            summary: "sync delta p99 14× the 30d SLO budget over the last 1h"
            runbook: "storage/drive/runbooks/sync-conflict-resolution.md"

        # Share-link verify CPU/latency burn-rate
        - alert: DriveShareLinkMintFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_share_link_mint_seconds_bucket[1h])))
              > 0.05 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: share-link}
          annotations:
            summary: "share-link mint p99 14× the 30d SLO budget over the last 1h"
            runbook: "storage/drive/runbooks/share-link-takeover-incident.md"

        # Preview render burn-rate
        - alert: DrivePreviewFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_preview_render_seconds_bucket{kind=~"image|pdf|office"}[1h])))
              > 1.0 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: preview}
          annotations:
            summary: "preview render p99 14× the 30d SLO budget over the last 1h"

        # WORM correctness — zero-tolerance immediate alert
        - alert: DriveImmutabilityViolationImmediate
          expr: |
            sum(rate(oya_drive_immutability_tier_violation_total[5m])) > 0
          for: 0m
          labels: {severity: page, microservice: drive, bc: immutability-tier, sev: 1}
          annotations:
            summary: "WORM immutability violation detected (zero-tolerance)"
            runbook: "storage/drive/runbooks/immutability-tier-violation.md"

        # Scan correctness — zero-tolerance immediate alert
        - alert: DriveScanCorrectnessViolationImmediate
          expr: |
            sum(rate(oya_drive_scan_correctness_violation_total[5m])) > 0
          for: 0m
          labels: {severity: page, microservice: drive, bc: dlp-virus-scan, sev: 1}
          annotations:
            summary: "Scan correctness violation: a file reached durable storage without verdict"
            runbook: "storage/drive/runbooks/virus-scan-rollback.md"

        # Share-link enumeration detected
        - alert: DriveShareLinkEnumerationDetected
          expr: |
            sum(rate(oya_drive_share_link_enumeration_pattern_detected_total[5m])) > 0
          for: 1m
          labels: {severity: page, microservice: drive, bc: share-link, sev: 1}
          annotations:
            summary: "Share-link enumeration pattern detected"
            runbook: "storage/drive/runbooks/share-link-takeover-incident.md"
{{- end }}
