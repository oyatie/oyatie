# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# pack-eu overlay for oya-drive Helm chart.
# Pack-specific values:
# - Residency: eu-frankfurt-1
# - GDPR + EDPB + NIS2 + eIDAS + EU AI Act overlays
# - OPSWAT multi-engine scan enabled
# - T2-drive-auto-organize HR-overlay REFUSED at Cedar layer

apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-drive-pack-config
  namespace: drive
data:
  pack-region: "eu"
  residency-primary: "eu-frankfurt-1"
  residency-secondary: "eu-amsterdam-1"
  compliance-frameworks: "GDPR,EDPB-2019-4,EDPB-2022-9,NIS2,eIDAS-910/2014,EU-AI-Act-2024/1689"
  worm-retention-floor-default-days: "730"             # 2y default; per tenant may extend
  cross-border-allowed: "scc-gated"
  opswat-enabled: "true"                               # multi-engine for higher-assurance
  garage-region: "eu-frankfurt-1"
  object-store-primary: "garage"
  object-store-archive: "seaweedfs"
  audit-chain-algorithm: "ed25519-merkle-ades"          # eIDAS Art. 26 AdES
  eu-ai-act-t2-hr-overlay: "refused"                   # Annex III §3 high-risk; scheduled-for-distinct-tracked-work ADR
