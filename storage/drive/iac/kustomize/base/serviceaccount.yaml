# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-drive
  namespace: drive
  annotations:
    openbao.oyatie.dev/role: oya-drive
---
# Per-BC ServiceAccounts inherit OpenBao role binding; each binds to specific secrets only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-drive-file-store
  namespace: drive
  annotations:
    openbao.oyatie.dev/role: oya-drive-file-store
    openbao.oyatie.dev/secrets: "drive/{tenant}/dek"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-drive-share-link
  namespace: drive
  annotations:
    openbao.oyatie.dev/role: oya-drive-share-link
    openbao.oyatie.dev/secrets: "drive/{tenant}/share-link-signing-key"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-drive-preview
  namespace: drive
  annotations:
    openbao.oyatie.dev/role: oya-drive-preview-gvisor
    openbao.oyatie.dev/secrets: "drive/{tenant}/dek"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-drive-immutability-tier
  namespace: drive
  annotations:
    openbao.oyatie.dev/role: oya-drive-immutability-tier
    openbao.oyatie.dev/secrets: "drive/{tenant}/worm-attestation-key"
