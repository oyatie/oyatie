    StructuredReportDraft:
      type: object
      properties:
        studyInstanceUid: { type: string }
        templateId: { type: string }
        radiologistId: { type: string }
    StructuredReport:
      type: object
      properties:
        id: { type: string }
        studyInstanceUid: { type: string }
        templateId: { type: string }
        status: { type: string, enum: [draft, preliminary, final, addendum, corrected] }
        content: { type: object, additionalProperties: true }
        criticalFindings:
          type: array
          items: { $ref: '#/components/schemas/CriticalFinding' }
    CriticalFinding:
      type: object
      properties:
        code: { type: string }
        criticality: { type: string, enum: [I, II, III] }
