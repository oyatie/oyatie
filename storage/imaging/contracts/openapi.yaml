      type: object
      additionalProperties: true
    FhirImagingSelection:
      type: object
      additionalProperties: true
    Worklist:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorklistItem' }
        total: { type: integer }
    WorklistItem:
      type: object
      properties:
        studyInstanceUid: { type: string }
        priority: { type: string, enum: [STAT, preliminary, routine, addendum] }
