        bodyPart: { type: string }
        patientId: { type: string }
        acquisitionTime: { type: string, format: date-time }
        accessionNumber: { type: string }
        subspecialty: { type: string }
    HangingProtocol:
      type: object
      properties:
        protocolId: { type: string }
        viewports: { type: array, items: { type: object } }
