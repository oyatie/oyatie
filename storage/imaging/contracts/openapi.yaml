    AiDispatchRequest:
      type: object
      properties:
        studyInstanceUid: { type: string }
        vendor: { type: string }
        modelVersion: { type: string }
        indication: { type: string }
    AiDispatchAccepted:
      type: object
      properties:
        dispatchId: { type: string }
        vendor: { type: string }
        estimatedCompletionMs: { type: integer }
    AiVendorHealth:
      type: object
      properties:
        vendor: { type: string }
        uptime: { type: number }
        p95Ms: { type: integer }
        p99Ms: { type: integer }
        errorRate: { type: number }
        ppvWeekOverWeekDeltaPct: { type: number }
        clearances:
          type: array
          items: { $ref: '#/components/schemas/FdaCeClearance' }
    FdaCeClearance:
      type: object
      properties:
        regulator: { type: string, enum: [FDA, CE, KFDA, PMDA, ANVISA] }
