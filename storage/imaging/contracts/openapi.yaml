        modalities: { type: array, items: { type: string } }
        clearedDate: { type: string, format: date }
    PeerReviewQueue:
      type: array
      items: { $ref: '#/components/schemas/PeerReviewItem' }
    PeerReviewItem:
      type: object
      properties:
        id: { type: string }
        studyInstanceUid: { type: string }
        sampleType: { type: string, enum: [random, post-procedure, transfer-in, ai-disagreement, pre-litigation] }
