openapi: 3.2.0
info:
  title: Oyatie Imaging — DICOMweb + FHIR Imaging API
  version: 0.1.0-wave-15m-g
  description: |
    DICOMweb (WADO-RS / QIDO-RS / STOW-RS / UPS-RS) + FHIR R5 ImagingStudy /
    ImagingSelection / DiagnosticReport[imaging] / DocumentReference[CDA].

    Per ADR-0253: HTTP/3 + QUIC default. TLS 1.3 minimum. PQC migration per ADR.

    Per ADR-0244: every endpoint is tenant-scoped via the `X-Oyatie-Tenant-Id`
    header (or the JWT `tenant_id` claim).

    Per ADR-0243: every endpoint is Cedar-gated. Cedar evaluation is performed
    pre-execution on the kernel layer. Denial yields 403 + `audit-chain` entry.

    Per ADR-0251: compliance pack overlays apply (HIPAA / GDPR / KR-MD / EU-MDR /
    MQSA / GxP). PHI handling per HIPAA 164.312 + HIPAA Safe Harbor (45 CFR
    164.514(b)(2)) + ISO/TS 25237.

    Authority: split from `diagnostics` per ADR-0132 + user directive 2026-05-21.
  termsOfService: https://oyatie.com/terms
  contact:
    name: axis-imaging
    email: axis-imaging@oyatie.com
  license:
    name: Oyatie Proprietary (Imaging µservice)
    url: https://oyatie.com/licenses/imaging
servers:
  - url: https://imaging.{tenant}.oyatie.com
    description: Per-tenant edge endpoint
    variables:
      tenant:
        default: example
tags:
  - name: dicomweb-studies
    description: DICOMweb study-level endpoints
  - name: dicomweb-series
    description: DICOMweb series-level endpoints
  - name: dicomweb-instances
    description: DICOMweb instance-level endpoints
  - name: dicomweb-frames
    description: DICOMweb frame-level endpoints
  - name: dicomweb-metadata
    description: DICOMweb metadata endpoints
  - name: dicomweb-rendered
    description: DICOMweb rendered (JPEG/PNG) endpoints
  - name: dicomweb-stow
    description: DICOMweb STOW-RS store
  - name: dicomweb-ups
    description: DICOMweb UPS-RS unified-procedure-step
  - name: fhir-imaging-study
    description: FHIR R5 ImagingStudy
  - name: fhir-imaging-selection
    description: FHIR R5 ImagingSelection
  - name: fhir-diagnostic-report
    description: FHIR R5 DiagnosticReport[imaging]
  - name: fhir-document-reference
    description: FHIR R5 DocumentReference[CDA]
  - name: worklist
    description: Radiologist worklist
  - name: hanging-protocol
    description: Hanging protocol matching + apply
  - name: structured-report
    description: Structured report authoring + signing
  - name: ai-marketplace
    description: AI vendor marketplace dispatch + health
  - name: peer-review
    description: Peer review queue + submission
  - name: critical-result
    description: Critical-result closed-loop
  - name: mammography-tracking
    description: Mammography screening recall + BI-RADS audit
  - name: dose-tracking
    description: Radiation dose tracking + dashboards
  - name: patient-portal
    description: Patient portal DICOMweb token issuance + layperson summary
  - name: admin
    description: PACS / VNA admin
paths:
  /dicomweb/studies:
    get:
      tags: [dicomweb-studies]
      operationId: qidoStudies
      summary: QIDO-RS study-level query
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: PatientID
          in: query
          schema: { type: string }
        - name: StudyDate
          in: query
          schema: { type: string, pattern: '^\d{8}(-\d{8})?$' }
        - name: ModalitiesInStudy
          in: query
          schema: { type: string }
        - name: AccessionNumber
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matched studies
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/QidoStudyList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CedarDeny' }
        '429': { $ref: '#/components/responses/RateLimit' }
    post:
      tags: [dicomweb-stow]
      operationId: stowStudies
      summary: STOW-RS store
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          multipart/related:
            schema: { $ref: '#/components/schemas/StowMultipart' }
      responses:
        '200':
          description: Stored
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/StowResponse' }
        '202':
          description: Accepted for async store
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CedarDeny' }
        '409':
          description: Conflict (duplicate SOP Instance UID)
        '413':
          description: Payload too large
  /dicomweb/studies/{study}:
    get:
      tags: [dicomweb-studies]
      operationId: wadoStudy
      summary: WADO-RS retrieve full study
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
      responses:
        '200':
          description: Multipart/related instances
          content:
            multipart/related:
              schema: { $ref: '#/components/schemas/WadoMultipart' }
        '403': { $ref: '#/components/responses/CedarDeny' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dicomweb/studies/{study}/series:
    get:
      tags: [dicomweb-series]
      operationId: qidoSeries
      summary: QIDO-RS series-level query
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
      responses:
        '200':
          description: Series list
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/QidoSeriesList' }
  /dicomweb/studies/{study}/series/{series}:
    get:
      tags: [dicomweb-series]
      operationId: wadoSeries
      summary: WADO-RS retrieve series
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
      responses:
        '200':
          description: Multipart/related instances
          content:
            multipart/related:
              schema: { $ref: '#/components/schemas/WadoMultipart' }
  /dicomweb/studies/{study}/series/{series}/instances:
    get:
      tags: [dicomweb-instances]
      operationId: qidoInstances
      summary: QIDO-RS instance-level query
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
      responses:
        '200':
          description: Instance list
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/QidoInstanceList' }
  /dicomweb/studies/{study}/series/{series}/instances/{instance}:
    get:
      tags: [dicomweb-instances]
      operationId: wadoInstance
      summary: WADO-RS retrieve single instance
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
        - $ref: '#/components/parameters/instanceParam'
      responses:
        '200':
          description: Single instance
          content:
            application/dicom:
              schema: { type: string, format: binary }
  /dicomweb/studies/{study}/series/{series}/instances/{instance}/frames/{frame}:
    get:
      tags: [dicomweb-frames]
      operationId: wadoFrame
      summary: WADO-RS retrieve single frame
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
        - $ref: '#/components/parameters/instanceParam'
        - name: frame
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Single frame
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /dicomweb/studies/{study}/series/{series}/instances/{instance}/metadata:
    get:
      tags: [dicomweb-metadata]
      operationId: wadoMetadata
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
        - $ref: '#/components/parameters/instanceParam'
      responses:
        '200':
          description: Instance metadata
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/InstanceMetadata' }
  /dicomweb/studies/{study}/series/{series}/instances/{instance}/rendered:
    get:
      tags: [dicomweb-rendered]
      operationId: wadoRendered
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
        - $ref: '#/components/parameters/seriesParam'
        - $ref: '#/components/parameters/instanceParam'
        - name: quality
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 90 }
      responses:
        '200':
          description: Rendered image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
  /dicomweb/workitems:
    post:
      tags: [dicomweb-ups]
      operationId: upsCreate
      summary: UPS-RS create workitem
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/dicom+json:
            schema: { $ref: '#/components/schemas/UpsWorkitem' }
      responses:
        '201':
          description: Created
        '403': { $ref: '#/components/responses/CedarDeny' }
    get:
      tags: [dicomweb-ups]
      operationId: upsQuery
      summary: UPS-RS query workitems
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Workitems list
          content:
            application/dicom+json:
              schema: { $ref: '#/components/schemas/UpsWorkitemList' }
  /fhir/ImagingStudy:
    get:
      tags: [fhir-imaging-study]
      operationId: searchImagingStudy
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: patient
          in: query
          schema: { type: string }
        - name: modality
          in: query
          schema: { type: string }
        - name: started
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bundle of ImagingStudy
          content:
            application/fhir+json:
              schema: { $ref: '#/components/schemas/FhirBundle' }
  /fhir/ImagingStudy/{id}:
    get:
      tags: [fhir-imaging-study]
      operationId: readImagingStudy
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ImagingStudy
          content:
            application/fhir+json:
              schema: { $ref: '#/components/schemas/FhirImagingStudy' }
  /fhir/ImagingSelection/{id}:
    get:
      tags: [fhir-imaging-selection]
      operationId: readImagingSelection
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ImagingSelection
          content:
            application/fhir+json:
              schema: { $ref: '#/components/schemas/FhirImagingSelection' }
  /fhir/DiagnosticReport:
    get:
      tags: [fhir-diagnostic-report]
      operationId: searchDiagnosticReport
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: patient
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string, default: 'imaging' }
      responses:
        '200':
          description: Bundle of DiagnosticReport
          content:
            application/fhir+json:
              schema: { $ref: '#/components/schemas/FhirBundle' }
  /fhir/DocumentReference:
    get:
      tags: [fhir-document-reference]
      operationId: searchDocumentReference
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: patient
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string, default: 'imaging-cda' }
      responses:
        '200':
          description: Bundle of DocumentReference
          content:
            application/fhir+json:
              schema: { $ref: '#/components/schemas/FhirBundle' }
  /worklist:
    get:
      tags: [worklist]
      operationId: getWorklist
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: priority
          in: query
          schema: { type: string, enum: [STAT, preliminary, routine, addendum] }
        - name: modality
          in: query
          schema: { type: string }
        - name: bodyPart
          in: query
          schema: { type: string }
        - name: subspecialty
          in: query
          schema: { type: string, enum: [neuro, msk, chest, breast, abd-pelvis, cardio, peds] }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 5000 }
      responses:
        '200':
          description: Worklist items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worklist' }
  /hanging-protocol/{study}/match:
    get:
      tags: [hanging-protocol]
      operationId: matchHangingProtocol
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
      responses:
        '200':
          description: Matched protocol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HangingProtocol' }
  /structured-report:
    post:
      tags: [structured-report]
      operationId: startStructuredReport
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StructuredReportDraft' }
      responses:
        '201':
          description: Draft started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StructuredReport' }
  /structured-report/{id}:
    put:
      tags: [structured-report]
      operationId: saveStructuredReport
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StructuredReport' }
      responses:
        '200':
          description: Saved
  /structured-report/{id}/sign:
    post:
      tags: [structured-report]
      operationId: signStructuredReport
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed; downstream events emitted (imaging.report.signed)
  /ai-marketplace/dispatch:
    post:
      tags: [ai-marketplace]
      operationId: dispatchAiInference
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiDispatchRequest' }
      responses:
        '202':
          description: Dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiDispatchAccepted' }
        '403': { $ref: '#/components/responses/CedarDeny' }
  /ai-marketplace/vendors/{vendor}/health:
    get:
      tags: [ai-marketplace]
      operationId: getAiVendorHealth
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: vendor
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Vendor health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiVendorHealth' }
  /peer-review:
    get:
      tags: [peer-review]
      operationId: getPeerReviewQueue
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Peer review queue (blinded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerReviewQueue' }
  /peer-review/{id}/submit:
    post:
      tags: [peer-review]
      operationId: submitPeerReview
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerReviewSubmission' }
      responses:
        '200':
          description: Submitted
  /critical-result/{id}/confirm:
    post:
      tags: [critical-result]
      operationId: confirmCriticalResult
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Confirmed; closed-loop completed
  /mammography-tracking/recall-queue:
    get:
      tags: [mammography-tracking]
      operationId: getMammographyRecallQueue
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Recall queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MammographyRecallQueue' }
  /mammography-tracking/birads-audit:
    get:
      tags: [mammography-tracking]
      operationId: getBiradsAudit
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: BI-RADS audit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiradsAudit' }
  /dose-tracking/aggregate:
    get:
      tags: [dose-tracking]
      operationId: getDoseAggregate
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - name: patient
          in: query
          schema: { type: string }
        - name: modality
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Aggregate dose
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoseAggregate' }
  /dose-tracking/export/euratom:
    get:
      tags: [dose-tracking]
      operationId: exportEuratomDose
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: EURATOM 2013/59 export
          content:
            application/xml:
              schema: { type: string }
  /patient-portal/token:
    post:
      tags: [patient-portal]
      operationId: issuePatientPortalToken
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientPortalTokenRequest' }
      responses:
        '201':
          description: Token (time-boxed, revocable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPortalToken' }
        '403': { $ref: '#/components/responses/CedarDeny' }
  /patient-portal/layperson-summary/{study}:
    get:
      tags: [patient-portal]
      operationId: getLaypersonSummary
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
        - $ref: '#/components/parameters/studyParam'
      responses:
        '200':
          description: Plain-language summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaypersonSummary' }
  /admin/modalities:
    get:
      tags: [admin]
      operationId: listModalities
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      responses:
        '200':
          description: Configured modalities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModalityList' }
    post:
      tags: [admin]
      operationId: registerModality
      parameters:
        - $ref: '#/components/parameters/tenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModalityRegistration' }
      responses:
        '201':
          description: Registered
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: imaging
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    tenantHeader:
      name: X-Oyatie-Tenant-Id
      in: header
      required: true
      schema: { type: string }
      description: Tenant identifier; enforced per ADR-0244 + Cedar
    studyParam:
      name: study
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9.]+$' }
      description: Study Instance UID (DICOM UID format)
    seriesParam:
      name: series
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9.]+$' }
    instanceParam:
      name: instance
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9.]+$' }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CedarDeny:
      description: Cedar denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CedarDecision' }
    RateLimit:
      description: Rate limited (per-tenant admission control)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
    CedarDecision:
      type: object
      properties:
        decision: { type: string, enum: [ALLOW, DENY] }
        determining_policies:
          type: array
          items: { type: string }
        reason: { type: string }
    QidoStudyList:
      type: array
      items: { type: object, additionalProperties: true }
    QidoSeriesList:
      type: array
      items: { type: object, additionalProperties: true }
    QidoInstanceList:
      type: array
      items: { type: object, additionalProperties: true }
    InstanceMetadata:
      type: object
      additionalProperties: true
    WadoMultipart:
      type: object
      description: multipart/related body
    StowMultipart:
      type: object
      description: multipart/related body for STOW-RS
    StowResponse:
      type: object
      properties:
        00081190: { type: object, description: RetrieveURL }
        00081198: { type: array, items: { type: object }, description: FailedSOPSequence }
        00081199: { type: array, items: { type: object }, description: ReferencedSOPSequence }
    UpsWorkitem:
      type: object
