        positivePredictiveValue: { type: number }
        cancerDetectionRate: { type: number }
        sensitivity: { type: number }
        specificity: { type: number }
    DoseAggregate:
      type: object
      properties:
        patientId: { type: string }
        totalEffectiveDoseMSv: { type: number }
        perModality: { type: object, additionalProperties: { type: number } }
        perProtocolDeviationCount: { type: integer }
    PatientPortalTokenRequest:
      type: object
      properties:
        patientId: { type: string }
        studyInstanceUid: { type: string }
        ttlSeconds: { type: integer, default: 3600, maximum: 604800 }
    PatientPortalToken:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        revocationId: { type: string }
    LaypersonSummary:
      type: object
      properties:
        studyInstanceUid: { type: string }
        plainLanguage: { type: string }
        biradsCategoryIfApplicable: { type: string }
        generatedAt: { type: string, format: date-time }
    ModalityList:
      type: array
      items: { $ref: '#/components/schemas/ModalityRegistration' }
    ModalityRegistration:
      type: object
      properties:
        modality: { type: string }
        aeTitle: { type: string }
        host: { type: string }
        port: { type: integer }
        acceptedSopClasses: { type: array, items: { type: string } }
        transferSyntaxes: { type: array, items: { type: string } }
        mwlFilters: { type: object, additionalProperties: true }
        doseEmissionEnabled: { type: boolean }
        vendorQuirksProfile: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
