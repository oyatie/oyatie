# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-recording-list-latency
  displayName: "recordings: recording-list latency p99 ≤ 200ms (100 recordings)"
  labels:
    microservice: recordings
    bc: recording
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for the GET /recordings list endpoint. A request is "good"
    when its end-to-end latency (REST request received → response sent)
    is ≤ 200ms for a 100-recording page.
  service: recordings
  indicator:
    metadata:
      name: recordings-recording-list-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_list_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_list_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 200ms for 99 % of 5min windows over 30d"
