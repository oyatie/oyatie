# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-download-first-byte-latency
  displayName: "drive: download first-byte p99 (warm CDN)"
  labels:
    microservice: drive
    bc: download
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: PERSONAL_FILE_CONTENT,PROFESSIONAL_FILE_CONTENT
spec:
  description: |
    Download first-byte latency p99 SLO. A download request hitting the warm
    CDN cache is "good" when first-byte arrives within 100ms p99. Cold CDN
    miss has a separate budget (≤ 500ms p99); not part of this SLO.
    PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-download-first-byte-warm-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_download_first_byte_seconds_bucket{cache_state="warm"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.1
      displayName: "30d rolling p99 ≤ 100ms (warm CDN)"
  alertPolicies:
    - alertPolicyRef: drive-download-fast-burn-1h-14x
    - alertPolicyRef: drive-download-slow-burn-6h-6x
