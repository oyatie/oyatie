# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-transcript-search-latency
  displayName: "recordings: transcript-search latency p99 ≤ 300ms across 1k-hour archive"
  labels:
    microservice: recordings
    bc: search
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for the search across recordings + transcripts. A request
    is "good" when its end-to-end latency (REST request received →
    Meilisearch hits returned + Cedar-filtered) is ≤ 300ms for a tenant
    archive ≤ 1,000 hours of recording.
  service: recordings
  indicator:
    metadata:
      name: recordings-transcript-search-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_search_duration_seconds_bucket{le="0.3"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_search_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
