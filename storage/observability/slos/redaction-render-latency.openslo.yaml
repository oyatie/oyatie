# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-redaction-render-latency
  displayName: "recordings: redaction-render latency p99 ≤ 1s per segment"
  labels:
    microservice: recordings
    bc: redaction
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for redaction-overlay rendering at playback time. A "good"
    request applies the redaction overlay (visual + audible) to a media
    segment within ≤ 1s p99.
  service: recordings
  indicator:
    metadata:
      name: recordings-redaction-render-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_redaction_render_duration_seconds_bucket{le="1.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_redaction_render_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
