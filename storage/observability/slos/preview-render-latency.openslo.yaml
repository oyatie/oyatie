# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-preview-render-latency
  displayName: "drive: preview render p99 (image / pdf / office)"
  labels:
    microservice: drive
    bc: preview
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: PERSONAL_FILE_CONTENT,PROFESSIONAL_FILE_CONTENT
spec:
  description: |
    Preview render p99 latency SLO. Aggregate target across image (libvips),
    PDF first-page (qpdf), and Office first-page (LibreOffice in gVisor)
    rendering is "good" when ≤ 1s p99. Video preview (ffmpeg) has a separate
    looser budget. PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-preview-render-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_preview_render_seconds_bucket{kind=~"image|pdf|office"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 1.0
      displayName: "30d rolling p99 ≤ 1s (image / pdf / office)"
  alertPolicies:
    - alertPolicyRef: drive-preview-fast-burn-1h-14x
    - alertPolicyRef: drive-preview-slow-burn-6h-6x
