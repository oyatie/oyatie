apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-phi-audit-completeness
  namespace: imaging
  displayName: PHI Audit Completeness (HIPAA 164.312(b))
  labels:
    microservice: imaging
    bounded_context: (cross-cutting)
    binding_adr: ADR-0251
spec:
  description: |
    Ratio of PHI access events that have a corresponding audit-chain entry.
    Target 100% per HIPAA technical safeguard 164.312(b). Any drift triggers
    a P0 incident.
  service: imaging
  indicator:
    metadata:
      name: phi-audit-completeness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_audit_chain_emit_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_phi_access_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% audit completeness
      target: 1.0
