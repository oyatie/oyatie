# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-search-latency
  displayName: "drive: search query p99 (1M-file corpus)"
  labels:
    microservice: drive
    bc: search-index
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: PERSONAL_FILE_CONTENT,PROFESSIONAL_FILE_CONTENT
spec:
  description: |
    File-search query p99 latency SLO. A search query over a 1M-file corpus
    (Meilisearch + Tika extract) is "good" when it returns within 400ms p99.
    Per-tenant Meilisearch index; cross-context query refused server-side.
    PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-search-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_search_query_seconds_bucket{corpus_size_bucket="1m"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.4
      displayName: "30d rolling p99 ≤ 400ms (1M-file corpus)"
  alertPolicies:
    - alertPolicyRef: drive-search-fast-burn-1h-14x
    - alertPolicyRef: drive-search-slow-burn-6h-6x
