# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-export-transcript-pdf-latency
  displayName: "recordings: export-transcript-pdf latency p99 ≤ 3s"
  labels:
    microservice: recordings
    bc: export
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for transcript-PDF export via Pandoc 3.x. A "good" export
    completes in ≤ 3s p99 for transcripts ≤ 10k segments.
  service: recordings
  indicator:
    metadata:
      name: recordings-export-transcript-pdf-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_export_pdf_duration_seconds_bucket{le="3.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_export_pdf_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
