# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-retention-policy-correctness
  displayName: "recordings: retention-policy correctness 100 % (LOAD-BEARING ZERO-TOLERANCE)"
  labels:
    microservice: recordings
    bc: retention-policy
    sli_class: correctness
    owner_team: ops-compliance + axis-recordings + council-privacy
    load_bearing: "true"
    zero_tolerance: "true"
spec:
  description: |
    Load-bearing zero-tolerance correctness SLO. Every retention policy
    application (purge, KMS-shred, age-down-to-cold, archive) MUST match
    the policy state at the time of application:
      - no recording with legal_hold_engaged=true is purged or KMS-shredded
        (load-bearing invariant)
      - no recording is purged before its retention floor elapses (pack-
        defaults floor)
      - no recording is retained past its ceiling (pack-defaults ceiling +
        tenant-tier override)
      - every retention action emits an audit-chain Ed25519 seal

    A retention-policy-correctness breach is a Sev-1 audit event. The
    100 % target reflects zero-tolerance posture. Aligned with SEC Rule
    17a-4(f), FINRA 4511, MiFID II Art. 16(7), HIPAA §164.530(j), GDPR
    Art. 5(1)(e), KR 전자문서법 Art. 5.
  service: recordings
  indicator:
    metadata:
      name: recordings-retention-policy-correctness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_retention_applied_total{result="correct"}[30d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_retention_applied_total[30d]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      displayName: "100 % correctness (zero-tolerance load-bearing invariant)"
