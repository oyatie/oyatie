# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-upload-multipart-throughput
  displayName: "drive: multipart upload 1GB p99 ≤ 90s"
  labels:
    microservice: drive
    bc: upload
    sli_class: throughput
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: PERSONAL_FILE_CONTENT,PROFESSIONAL_FILE_CONTENT
spec:
  description: |
    Multipart resumable upload throughput SLO. A 1GB upload via S3-multipart
    or tus 1.0 with ≥ 4 concurrent parallel chunk uploads is "good" when it
    completes within 90s p99. PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-upload-multipart-1gb-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_upload_multipart_seconds_bucket{size_bucket="1gb"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 90
      displayName: "30d rolling p99 ≤ 90s for 1GB multipart"
  alertPolicies:
    - alertPolicyRef: drive-upload-fast-burn-1h-14x
    - alertPolicyRef: drive-upload-slow-burn-6h-6x
