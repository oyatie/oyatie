# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-playback-start-latency
  displayName: "recordings: playback-start latency p99 ≤ 400ms warm / 1s cold"
  labels:
    microservice: recordings
    bc: playback
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for the playback-start path. A request is "good" when
    end-to-end latency (POST /recordings/<id>/playback-session → first HLS
    manifest byte at client) is ≤ 400ms warm-CDN, ≤ 1s cold-CDN.
  service: recordings
  indicator:
    metadata:
      name: recordings-playback-start-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_playback_start_duration_seconds_bucket{cdn_state="warm",le="0.4"}[5m]))
                + sum(rate(recordings_playback_start_duration_seconds_bucket{cdn_state="cold",le="1.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_playback_start_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
