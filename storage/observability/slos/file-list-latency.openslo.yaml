# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-file-list-latency
  displayName: "drive: file-list folder p99 (1k entries)"
  labels:
    microservice: drive
    bc: folder-hierarchy
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    File-list folder p99 latency SLO. A request is "good" when a folder-listing
    query for ≤ 1,000 entries resolves in ≤ 150ms. PRD-drive §"Performance"
    p99 target. Cache-hit ratio target > 80% (Postgres + Valkey).
  service: drive
  indicator:
    metadata: {name: drive-file-list-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_file_list_seconds_bucket{entry_count_bucket="1k"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.15
      displayName: "30d rolling p99 ≤ 150ms (1k entries)"
  alertPolicies:
    - alertPolicyRef: drive-file-list-fast-burn-1h-14x
    - alertPolicyRef: drive-file-list-slow-burn-6h-6x
