# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-dlp-scan-correctness
  displayName: "drive: DLP + virus scan correctness (zero-tolerance)"
  labels:
    microservice: drive
    bc: dlp-virus-scan
    sli_class: correctness
    tier: hero-product
    owner_team: axis-drive + ops-security
    pack_scope: all
    data_classes: AUDIT
spec:
  description: |
    DLP + virus scan correctness SLO. Every upload must reach a scan verdict
    BEFORE being promoted to durable storage. Files reaching durable storage
    without a scan verdict, or files with a `pending` verdict served to non-
    uploader principals, count as correctness violations. Target = 100%
    correctness. Zero-tolerance per PRD-drive AC-11 + AC-12.
  service: drive
  indicator:
    metadata: {name: drive-scan-correctness}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              1.0 - (
                sum(rate(drive_scan_correctness_violation_total[5m]))
                /
                sum(rate(drive_file_upload_completed_total[5m]))
              )
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 1.0
      op: gte
      value: 1.0
      displayName: "30d rolling correctness = 100%"
  alertPolicies:
    - alertPolicyRef: drive-scan-correctness-violation-immediate
