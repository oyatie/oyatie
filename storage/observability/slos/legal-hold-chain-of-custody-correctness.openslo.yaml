# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-legal-hold-chain-of-custody-correctness
  displayName: "recordings: legal-hold chain-of-custody correctness 100 % (LOAD-BEARING ZERO-TOLERANCE)"
  labels:
    microservice: recordings
    bc: legal-hold
    sli_class: correctness
    owner_team: ops-compliance + ops-security + council-privacy + axis-recordings
    load_bearing: "true"
    zero_tolerance: "true"
spec:
  description: |
    Load-bearing zero-tolerance correctness SLO. Every legal-hold
    engagement, every state transition within a hold's lifetime, and every
    release MUST satisfy the chain-of-custody invariants:
      - every engage / release event includes a paired four-eyes approver
        (Cedar PERMIT validated)
      - every event is sealed by audit-chain (Ed25519) before the kernel
        returns success to the caller
      - the Merkle root commitment is consistent across the recording's
        full hold timeline
      - no retention purge or KMS-shred executes against a held recording

    A chain-of-custody-correctness breach is a Sev-1 audit event AND may
    trigger spoliation review (FRCP Rule 37(e)). The 100 % target reflects
    zero-tolerance posture. Aligned with FRCP Rule 26(f)/34, Sedona
    Conference, ISO 27037:2012, NIST SP 800-86 §4.3, SEC Rule 17a-4(f),
    FINRA 4511, MiFID II Art. 16(7).
  service: recordings
  indicator:
    metadata:
      name: recordings-legal-hold-chain-of-custody-correctness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_legal_hold_chain_of_custody_event_total{result="correct"}[30d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_legal_hold_chain_of_custody_event_total[30d]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      displayName: "100 % chain-of-custody correctness (zero-tolerance load-bearing invariant)"
