# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-immutability-tier-correctness
  displayName: "drive: WORM immutability tier correctness (zero-tolerance)"
  labels:
    microservice: drive
    bc: immutability-tier
    sli_class: correctness
    tier: hero-product
    owner_team: axis-drive + ops-security + compliance
    pack_scope: all
    data_classes: AUDIT
spec:
  description: |
    WORM (immutability) tier correctness SLO. A WORM-tier file purged before
    retention floor expires is a violation. A file under legal hold purged is
    a violation. Periodic integrity scan compares hold-set + WORM-set vs
    storage layer; mismatch counts as violation. Target = 100% correctness.
    Zero-tolerance per ADR-DRIVE-0006 + PRD-drive AC-09 + AC-10.
    SEC 17a-4(f) + FINRA 4511 + HIPAA §164.316 compliance gates on this SLO.
  service: drive
  indicator:
    metadata: {name: drive-immutability-correctness}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              1.0 - (
                sum(rate(drive_immutability_tier_violation_total[5m]))
                /
                sum(rate(drive_immutability_tier_check_total[5m]))
              )
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 1.0
      op: gte
      value: 1.0
      displayName: "30d rolling correctness = 100%"
  alertPolicies:
    - alertPolicyRef: drive-immutability-violation-immediate
