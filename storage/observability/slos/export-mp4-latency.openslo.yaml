# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-export-mp4-latency
  displayName: "recordings: export-mp4 latency p99 ≤ recording-duration × 0.3"
  labels:
    microservice: recordings
    bc: export
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for MP4 export (transcode via ffmpeg 7.x in gVisor sandbox).
    A "good" export completes in ≤ recording-duration × 0.3 p99.
    Sliced by recording-duration buckets to keep the ratio meaningful.
  service: recordings
  indicator:
    metadata:
      name: recordings-export-mp4-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_export_mp4_duration_ratio_bucket{le="0.3"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_export_mp4_duration_ratio_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
