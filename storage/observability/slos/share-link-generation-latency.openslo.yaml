# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-share-link-generation-latency
  displayName: "drive: share-link generation p99"
  labels:
    microservice: drive
    bc: share-link
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: SECRET
spec:
  description: |
    Share-link mint p99 latency SLO. Generating a signed share-link
    (Ed25519 signature + optional Argon2id password KDF) is "good" when it
    completes within 50ms p99. Argon2id parameters tuned for ≤ 50ms / call.
    PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-share-link-mint-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_share_link_mint_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.05
      displayName: "30d rolling p99 ≤ 50ms"
  alertPolicies:
    - alertPolicyRef: drive-share-link-fast-burn-1h-14x
    - alertPolicyRef: drive-share-link-slow-burn-6h-6x
