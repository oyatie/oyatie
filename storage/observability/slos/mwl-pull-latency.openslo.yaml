apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-mwl-pull-latency
  namespace: imaging
  displayName: Modality Worklist Pull Latency
  labels:
    microservice: imaging
    bounded_context: ImageAcquisition
spec:
  description: |
    Time from modality MWL C-FIND request to response. Target p95 < 500ms
    per FR-ACQ-002.
  service: imaging
  indicator:
    metadata:
      name: mwl-pull-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_mwl_pull_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_mwl_pull_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 500ms
      target: 0.95
    - displayName: 99% within 1.5s
      target: 0.99
