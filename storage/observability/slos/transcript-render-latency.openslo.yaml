# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-transcript-render-latency
  displayName: "recordings: transcript-render latency p99 ≤ 500ms (10-min recording)"
  labels:
    microservice: recordings
    bc: transcript
    sli_class: latency
    owner_team: axis-recordings
spec:
  description: |
    Latency SLO for the transcript-render path. A "good" request renders
    a 10-min recording's transcript JSON to the playback UI in ≤ 500ms p99.
  service: recordings
  indicator:
    metadata:
      name: recordings-transcript-render-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_transcript_render_duration_seconds_bucket{recording_duration_bucket="10min",le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_transcript_render_duration_seconds_count{recording_duration_bucket="10min"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
