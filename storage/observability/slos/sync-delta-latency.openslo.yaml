# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: drive-sync-delta-latency
  displayName: "drive: sync delta p99 (100 changed files)"
  labels:
    microservice: drive
    bc: sync
    sli_class: latency
    tier: hero-product
    owner_team: axis-drive
    pack_scope: all
    data_classes: PERSONAL_FILE_CONTENT,PROFESSIONAL_FILE_CONTENT
spec:
  description: |
    Sync delta protocol p99 latency SLO. A sync session delta-application
    over 100 changed files (FastCDC + LBFS rolling hash) is "good" when it
    completes within 30s p99. PRD-drive §"Performance" p99 target.
  service: drive
  indicator:
    metadata: {name: drive-sync-delta-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(drive_sync_delta_seconds_bucket{changed_file_count_bucket="100"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 30
      displayName: "30d rolling p99 ≤ 30s for 100-changed-file delta"
  alertPolicies:
    - alertPolicyRef: drive-sync-fast-burn-1h-14x
    - alertPolicyRef: drive-sync-slow-burn-6h-6x
