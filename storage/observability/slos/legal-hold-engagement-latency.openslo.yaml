# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: recordings-legal-hold-engagement-latency
  displayName: "recordings: legal-hold engagement p99 ≤ 1s (LOAD-BEARING)"
  labels:
    microservice: recordings
    bc: legal-hold
    sli_class: latency
    owner_team: ops-compliance + axis-recordings
    load_bearing: "true"
spec:
  description: |
    Load-bearing latency SLO for legal-hold engagement. A "good" engagement
    completes (Cedar evaluate → Postgres advisory-lock → all in-scope rows
    marked legal_hold_engaged=true → audit-chain Ed25519 seal computed)
    within ≤ 1s p99.

    Any breach is a Sev-1 audit event. The 99.99 % target reflects the load-
    bearing posture: zero tolerance for engagement latency drift past 1s.

    Aligned with FRCP Rule 26(f) + Sedona Conference + ISO 27037:2012
    spoliation-prevention expectations.
  service: recordings
  indicator:
    metadata:
      name: recordings-legal-hold-engagement-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_legal_hold_engagement_duration_seconds_bucket{le="1.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(recordings_legal_hold_engagement_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9999
      displayName: "p99 ≤ 1s for 99.99 % of 5min windows over 30d (load-bearing)"
