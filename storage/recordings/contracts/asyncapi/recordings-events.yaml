asyncapi: 3.1.0
info:
  title: oyatie recordings µservice events
  version: 1.0.0
  description: |
    Workflow events emitted + consumed by the recordings µservice.
    Events are emitted to the Workflow Engine as the canonical bus per
    parallel ADR-0238 + ADR-0131 cross-product rule (no direct
    µservice-to-µservice calls).

servers:
  workflow-engine:
    host: workflow-engine.internal
    protocol: kafka

defaultContentType: application/json

channels:
  recordings.recording.ingested.v1:
    address: recordings.recording.ingested.v1
    messages:
      RecordingIngested:
        payload:
          type: object
          required: [recording_id, tenant_id, source_kind, content_hash, ingested_at]
          properties:
            recording_id:    {type: string}
            tenant_id:       {type: string}
            source_kind:     {type: string, enum: [meet, messenger_huddle, live_broadcast, manual_upload, workflow_screen_capture]}
            content_hash:    {type: string}
            ingested_at:     {type: string, format: date-time}
            consent_banner_confirmed: {type: boolean}

  recordings.recording.published.v1:
    address: recordings.recording.published.v1
    messages:
      RecordingPublished:
        payload:
          type: object
          required: [recording_id, tenant_id, content_hash, published_at]
          properties:
            recording_id:    {type: string}
            tenant_id:       {type: string}
            content_hash:    {type: string}
            published_at:    {type: string, format: date-time}
            transcript_ready: {type: boolean}
            summary_ready:    {type: boolean}

  recordings.recording.played.v1:
    address: recordings.recording.played.v1
    messages:
      RecordingPlayed:
        payload:
          type: object
          required: [session_id, recording_id, viewer_ref, started_at]
          properties:
            session_id:      {type: string}
            recording_id:    {type: string}
            viewer_ref:      {type: string}
            started_at:      {type: string, format: date-time}
            watermark_key_version: {type: integer}

  recordings.recording.shared.v1:
    address: recordings.recording.shared.v1
    messages:
      RecordingShared:
        payload:
          type: object
          required: [share_link_id, recording_id, created_by, expires_at]
          properties:
            share_link_id:   {type: string}
            recording_id:    {type: string}
            created_by:      {type: string}
            expires_at:      {type: string, format: date-time}
            view_count_cap:  {type: integer}

  recordings.recording.redacted.v1:
    address: recordings.recording.redacted.v1
    messages:
      RecordingRedacted:
        payload:
          type: object
          required: [redaction_id, recording_id, span_start_ms, span_end_ms, reason, applied_by]
          properties:
            redaction_id:    {type: string}
            recording_id:    {type: string}
            span_start_ms:   {type: integer, format: int64}
            span_end_ms:     {type: integer, format: int64}
            reason:          {type: string, enum: [pii_auto, manual_compliance, court_order, dsr_erasure]}
            applied_by:      {type: string}
            applied_at:      {type: string, format: date-time}

  recordings.recording.deleted.v1:
    address: recordings.recording.deleted.v1
    messages:
      RecordingDeleted:
        payload:
          type: object
          required: [recording_id, tenant_id, deleted_at, reason]
          properties:
            recording_id:    {type: string}
            tenant_id:       {type: string}
            deleted_at:      {type: string, format: date-time}
            reason:          {type: string, enum: [user_delete, retention_purge, dsr_erasure, court_order]}
            kms_shred_executed: {type: boolean}

  recordings.transcript.ready.v1:
    address: recordings.transcript.ready.v1
    messages:
      TranscriptReady:
        payload:
          type: object
          required: [transcript_id, recording_id, lang_code, speaker_count, content_hash]
          properties:
            transcript_id:   {type: string}
            recording_id:    {type: string}
            lang_code:       {type: string}
            speaker_count:   {type: integer}
            content_hash:    {type: string}
            model_version:   {type: string, description: "e.g., whisper-large-v3 or whisper-medium-fallback"}

  recordings.translation.ready.v1:
    address: recordings.translation.ready.v1
    messages:
      TranslationReady:
        payload:
          type: object
          required: [translation_id, transcript_id, recording_id, target_lang_code]
          properties:
            translation_id:  {type: string}
            transcript_id:   {type: string}
            recording_id:    {type: string}
            target_lang_code: {type: string}

  recordings.summary.ready.v1:
    address: recordings.summary.ready.v1
    messages:
      SummaryReady:
        payload:
          type: object
          required: [summary_id, recording_id, flavor]
          properties:
            summary_id:      {type: string}
            recording_id:    {type: string}
            flavor:          {type: string, enum: [semantic, chronological]}
            ai_act_classification: {type: string, enum: [minimal_risk, limited_risk, high_risk]}

  recordings.legalhold.engaged.v1:
    address: recordings.legalhold.engaged.v1
    messages:
      LegalHoldEngaged:
        payload:
          type: object
          required: [hold_id, tenant_id, scope_expression, engaged_at, court_order_ref, engaged_by, paired_approver]
          properties:
            hold_id:         {type: string}
            tenant_id:       {type: string}
            scope_expression: {type: string}
            engaged_at:      {type: string, format: date-time}
            court_order_ref:
              type: object
              properties:
                court_id:        {type: string}
                jurisdiction:    {type: string}
                case_no:         {type: string}
                order_date:      {type: string, format: date-time}
            engaged_by:      {type: string}
            paired_approver: {type: string}
            engagement_latency_ms: {type: integer}
            audit_chain_seal_ref: {type: string}

  recordings.legalhold.released.v1:
    address: recordings.legalhold.released.v1
    messages:
      LegalHoldReleased:
        payload:
          type: object
          required: [hold_id, released_at, released_by, paired_approver, reason]
          properties:
            hold_id:         {type: string}
            released_at:     {type: string, format: date-time}
            released_by:     {type: string}
            paired_approver: {type: string}
            reason:          {type: string}

  recordings.ediscovery.export.v1:
    address: recordings.ediscovery.export.v1
    messages:
      EDiscoveryExportExecuted:
        payload:
          type: object
          required: [bundle_id, hold_id, requester, paired_approver, merkle_root, signed_url, executed_at]
          properties:
            bundle_id:       {type: string}
            hold_id:         {type: string}
            requester:       {type: string}
            paired_approver: {type: string}
            merkle_root:     {type: string}
            signed_url:      {type: string, format: uri}
            executed_at:     {type: string, format: date-time}

  recordings.retention.applied.v1:
    address: recordings.retention.applied.v1
    messages:
      RetentionPolicyApplied:
        payload:
          type: object
          required: [recording_id, retention_policy_id, action, applied_at]
          properties:
            recording_id:        {type: string}
            retention_policy_id: {type: string}
            action:              {type: string, enum: [purge, kms_shred, age_down_to_cold, archive]}
            applied_at:          {type: string, format: date-time}

  recordings.watermark.rotated.v1:
    address: recordings.watermark.rotated.v1
    messages:
      WatermarkRotated:
        payload:
          type: object
          required: [tenant_id, key_version, rotated_at, reason]
          properties:
            tenant_id:       {type: string}
            key_version:     {type: integer}
            rotated_at:      {type: string, format: date-time}
            reason:          {type: string, enum: [scheduled, compromise, share_link_leak]}

  # ── Events CONSUMED from other µservices ────────────────────────────────

  meet.session.ended.v1:
    address: meet.session.ended.v1
    messages:
      MeetSessionEnded:
        payload:
          type: object
          required: [session_id, tenant_id, recording_target_id, ended_at, content_hash]
          properties:
            session_id:           {type: string}
            tenant_id:            {type: string}
            recording_target_id:  {type: string}
            ended_at:             {type: string, format: date-time}
            content_hash:         {type: string}
            consent_banner_confirmed: {type: boolean}

  messenger.huddle.ended.v1:
    address: messenger.huddle.ended.v1
    messages:
      MessengerHuddleEnded:
        payload:
          type: object
          required: [huddle_id, tenant_id, recording_target_id, ended_at]
          properties:
            huddle_id:            {type: string}
            tenant_id:            {type: string}
            recording_target_id:  {type: string}
            ended_at:             {type: string, format: date-time}
            consent_banner_confirmed: {type: boolean}
