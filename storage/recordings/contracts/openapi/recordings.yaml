openapi: 3.2.0
info:
  title: oyatie recordings µservice REST API
  version: 1.0.0
  description: |
    Recordings µservice REST API surface. Centralised recording archive +
    transcript + redaction + retention + legal-hold + ediscovery + export +
    share-link + playback for every recording across oyatie (meet sessions +
    messenger huddles + live-broadcast + manual uploads + screen-capture).

    All requests are tenant-scoped via mTLS + per-request Cedar evaluation.
    Anonymous playback is granted only when a valid share-link is present in
    the request context (per `policy/cedar/public-read.cedar`).
  contact:
    name: axis-recordings
    url: https://oyatie.internal/storage/recordings
servers:
  - url: https://recordings.{tenant}.oyatie.com/v1
    variables:
      tenant:
        default: example

security:
  - mTLS: []

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: recordings
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    mTLS:
      type: mutualTLS
  schemas:
    Recording:
      type: object
      required: [recording_id, tenant_id, source_kind, content_hash, ingested_at]
      properties:
        recording_id:    {type: string}
        tenant_id:       {type: string}
        source_kind:     {type: string, enum: [meet, messenger_huddle, live_broadcast, manual_upload, workflow_screen_capture, legacy_workspace_recording]}
        pack_id:         {type: string}
        context_kind:    {type: string, enum: [Personal, Professional]}
        title:           {type: string, maxLength: 1024}
        description:     {type: string, maxLength: 8192}
        ingested_at:     {type: string, format: date-time}
        ended_at:        {type: string, format: date-time, nullable: true}
        duration_seconds: {type: integer, format: int64}
        content_hash:    {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        retention_policy_id: {type: string}
        legal_hold_engaged: {type: boolean}
        author_ref:      {type: string, nullable: true}
        consent_banner_confirmed: {type: boolean}
        cell_id:         {type: string}
    Transcript:
      type: object
      required: [transcript_id, recording_id, lang_code, content_hash, segments]
      properties:
        transcript_id:   {type: string}
        recording_id:    {type: string}
        lang_code:       {type: string, description: "BCP 47"}
        content_hash:    {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        speaker_count:   {type: integer}
        segments:        {type: array, items: {$ref: '#/components/schemas/TranscriptSegment'}}
    TranscriptSegment:
      type: object
      required: [segment_index, speaker_id, start_ms, end_ms, text, confidence]
      properties:
        segment_index:   {type: integer}
        speaker_id:      {type: string}
        start_ms:        {type: integer, format: int64}
        end_ms:          {type: integer, format: int64, description: "exclusive (half-open [start, end))"}
        text:            {type: string}
        confidence:      {type: number, format: float, minimum: 0, maximum: 1}
        redacted_spans:  {type: array, items: {$ref: '#/components/schemas/RedactionSpan'}}
    RedactionSpan:
      type: object
      required: [redaction_id, span_start_ms, span_end_ms, reason]
      properties:
        redaction_id:    {type: string}
        span_start_ms:   {type: integer, format: int64}
        span_end_ms:     {type: integer, format: int64, description: "exclusive (half-open [start, end))"}
        reason:          {type: string, enum: [pii_auto, manual_compliance, court_order, dsr_erasure]}
        applied_at:      {type: string, format: date-time}
        applied_by:      {type: string}
        compensated_at:  {type: string, format: date-time, nullable: true}
    LegalHold:
      type: object
      required: [hold_id, tenant_id, scope_expression, engaged_at, court_order_ref, engaged_by, paired_approver]
      properties:
        hold_id:         {type: string}
        tenant_id:       {type: string}
        scope_expression: {type: string, description: "Cedar-evaluable scope"}
        engaged_at:      {type: string, format: date-time}
        released_at:     {type: string, format: date-time, nullable: true}
        court_order_ref: {$ref: '#/components/schemas/CourtOrderRef'}
        engaged_by:      {type: string}
        paired_approver: {type: string}
        engagement_latency_ms: {type: integer}
        matched_recordings_count: {type: integer}
        audit_chain_seal_ref: {type: string}
    CourtOrderRef:
      type: object
      required: [court_id, jurisdiction, case_no, order_date]
      properties:
        court_id:        {type: string}
        jurisdiction:    {type: string}
        case_no:         {type: string}
        order_date:      {type: string, format: date-time}
    ShareLink:
      type: object
      required: [share_link_id, recording_id, expires_at, view_count_cap, view_count]
      properties:
        share_link_id:   {type: string}
        recording_id:    {type: string}
        expires_at:      {type: string, format: date-time}
        view_count_cap:  {type: integer, minimum: 1}
        view_count:      {type: integer, minimum: 0}
        password_required: {type: boolean}
        revoked_at:      {type: string, format: date-time, nullable: true}
    ExportRequest:
      type: object
      required: [recording_id, formats]
      properties:
        recording_id:    {type: string}
        formats:         {type: array, items: {type: string, enum: [mp4, mp3, wav, vtt, srt, pdf, docx]}}
        watermark_viewer_ref: {type: string, nullable: true}
    ExportBundle:
      type: object
      required: [bundle_id, recording_id, formats, signed_url, expires_at, merkle_root]
      properties:
        bundle_id:       {type: string}
        recording_id:    {type: string}
        formats:         {type: array, items: {type: string}}
        signed_url:      {type: string, format: uri}
        expires_at:      {type: string, format: date-time}
        merkle_root:     {type: string, pattern: "^sha256:[0-9a-f]{64}$"}

  parameters:
    TenantHeader:
      name: X-Oyatie-Tenant
      in: header
      required: true
      schema: {type: string}
    PackHeader:
      name: X-Oyatie-Pack
      in: header
      required: true
      schema: {type: string, enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]}

paths:
  /recordings:
    get:
      summary: List recordings (Cedar-scoped)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: source_kind, in: query, schema: {type: string}}
        - {name: from_date, in: query, schema: {type: string, format: date-time}}
        - {name: to_date, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: page of recordings
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordings: {type: array, items: {$ref: '#/components/schemas/Recording'}}
                  next_cursor: {type: string, nullable: true}

  /recordings/{recording_id}:
    get:
      summary: Get a recording manifest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: recording_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Recording'}}}}
        '403': {description: Cedar deny}
        '404': {description: not found}

  /recordings/{recording_id}/playback-session:
    post:
      summary: Start a playback session (returns signed HLS manifest URL)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: recording_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                share_link_id: {type: string, nullable: true}
                viewer_ref:    {type: string}
      responses:
        '200':
          description: signed playback URL + per-viewer watermark
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:        {type: string}
                  hls_manifest_url:  {type: string, format: uri}
                  expires_at:        {type: string, format: date-time}
                  watermark_key_version: {type: integer}

  /recordings/{recording_id}/transcript:
    get:
      summary: Get the transcript (optionally translated)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: recording_id, in: path, required: true, schema: {type: string}}
        - {name: lang_code, in: query, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Transcript'}}}}

  /recordings/{recording_id}/redactions:
    post:
      summary: Add a redaction overlay span (compliance-officer only; insert-only)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: recording_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [span_start_ms, span_end_ms, reason]
              properties:
                span_start_ms: {type: integer, format: int64}
                span_end_ms:   {type: integer, format: int64}
                reason:        {type: string, enum: [pii_auto, manual_compliance, court_order, dsr_erasure]}
      responses:
        '201': {description: redaction added}

  /search:
    get:
      summary: Search across recordings + transcripts (Cedar-scoped)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: filters, in: query, schema: {type: string}}
      responses:
        '200':
          description: search hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits: {type: array, items: {type: object}}

  /share-links:
    post:
      summary: Create a share-link
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recording_id]
              properties:
                recording_id:    {type: string}
                expires_at:      {type: string, format: date-time}
                view_count_cap:  {type: integer, minimum: 1, maximum: 1000000}
                password:        {type: string, nullable: true}
      responses:
        '201': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/ShareLink'}}}}

  /legal-holds:
    post:
      summary: Engage a legal hold (four-eyes required; load-bearing p99 ≤ 1s)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_expression, court_order_ref, paired_approver]
              properties:
                scope_expression: {type: string, description: "Cedar-evaluable scope expression matching recording IDs or query"}
                court_order_ref:  {$ref: '#/components/schemas/CourtOrderRef'}
                paired_approver:  {type: string}
                reason:           {type: string}
      responses:
        '201': {description: engaged, content: {application/json: {schema: {$ref: '#/components/schemas/LegalHold'}}}}

  /legal-holds/{hold_id}/release:
    post:
      summary: Release a legal hold (four-eyes required)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
        - {name: hold_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paired_approver, reason]
              properties:
                paired_approver: {type: string}
                reason:          {type: string}
      responses:
        '200': {description: released}

  /ediscovery/exports:
    post:
      summary: Trigger eDiscovery export bundle (four-eyes; signed Merkle bundle)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id, paired_approver]
              properties:
                hold_id:         {type: string}
                paired_approver: {type: string}
      responses:
        '202': {description: export queued, content: {application/json: {schema: {$ref: '#/components/schemas/ExportBundle'}}}}

  /exports:
    post:
      summary: Trigger a regular export bundle (mp4/mp3/wav/vtt/srt/pdf/docx)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202': {description: export queued, content: {application/json: {schema: {$ref: '#/components/schemas/ExportBundle'}}}}

  /ingest/presign:
    post:
      summary: Create a presigned S3 upload URL for a manual recording
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mime_type, byte_len, consent_banner_confirmed]
              properties:
                filename:                {type: string}
                mime_type:               {type: string}
                byte_len:                {type: integer, format: int64}
                consent_banner_confirmed: {type: boolean}
      responses:
        '200':
          description: presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:       {type: string}
                  presigned_url:   {type: string, format: uri}
                  expires_at:      {type: string, format: date-time}

  /ingest/finalize:
    post:
      summary: Finalize a manual upload (kick off scan + transcription pipeline)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: {type: string}
      responses:
        '201': {description: ingested, content: {application/json: {schema: {$ref: '#/components/schemas/Recording'}}}}
