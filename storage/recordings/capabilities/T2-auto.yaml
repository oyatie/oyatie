# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:recordings:t2-auto:v1
name: auto-translate-and-auto-publish
namespace: recordings
display_name: Auto-Translate Transcript + Auto-Publish to Workflow Events (T2 auto)
description: |
  T2 auto capability bundle — invoked automatically post-recording when the
  tenant has explicitly enabled auto-translate or auto-publish (per
  ADR-RECORDINGS-0006). Two distinct auto-actions:

    (a) auto-translate transcript to N other tenant-configured languages via
        cross-µservice call into the `translate` µservice. Translated
        transcripts are stored alongside the source transcript.
    (b) auto-publish — emit Workflow events that trigger downstream µservices
        (social/shorts publish; mail share-via-email; workflow-engine task
        creation).

  ⚠ EU AI Act Art. 50 transparency: any consumer of the translated transcript
  or auto-published content sees an AI-generated label.
  ⚠ EU AI Act Annex III medium-risk classification by default; HIGH-RISK if
  the auto-published content is used in employment / law-enforcement /
  administration-of-justice context — tenant attestation required to enable
  in those contexts.

owner_team: axis-recordings + axis-foundry-runtime + ops-compliance
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-RECORDINGS-0006]
related_artifacts:
  - microservices/recordings/PRD.md (FR-13 translation; FR-14 + FR-15 auto-publish events)
  - microservices/recordings/decisions/ADR-RECORDINGS-0006-ai-feature-bounds.md

autonomy_tier: T2
# T2 = auto-write/auto-publish. Requires:
#   - per-tenant explicit opt-in
#   - per-recording opt-out switch
#   - tenant high-risk attestation if context falls under EU AI Act Annex III

inputs:
  - name: recording_id
    type: string
    required: true
  - name: invoking_principal
    type: string
    required: true
    description: "either user_ref (if user-invoked) or system_ref (if recording-ingest finalisation auto-fires)"

outputs:
  - name: translations
    type: array
    items:
      type: object
      properties:
        translation_id:    {type: string}
        target_lang_code:  {type: string}
        content_hash:      {type: string}
  - name: publish_events
    type: array
    items:
      type: object
      properties:
        event_type:        {type: string}
        target_microservice: {type: string}
        emitted_at:        {type: string, format: date-time}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI  # pack-us-healthcare; refused unless BAA + tenant high-risk attestation

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    refused_default: true
    refusal_reason: "HIPAA §164.502(b) minimum-necessary; cannot auto-publish PHI by default"
  pack-us-financial:
    refused_default: true
    refusal_reason: "SEC 17a-4 + FINRA 4511 — recorded communications cannot be auto-published outside the audit-chained archive"
  pack-eu:
    risk_classification:
      default: limited_risk (transparency obligation)
      employment_context: high_risk (Annex III §4(a))
      law_enforcement_context: high_risk (Annex III §6)
      administration_of_justice_context: high_risk (Annex III §8)
    transparency_obligation: must-label-as-AI-generated per Art. 50
    high_risk_obligation: tenant high-risk attestation + FRIA per Art. 27
  pack-kr:
    kr_pipa_art28_consent: tenant-admin opt-in required
    kr_telecom_consent: producer-side consent_banner_confirmed required for transcript-as-source
  pack-au:
    tia_act_consent: producer-side consent_banner_confirmed required

evidence_topic: oya.recordings.capability.t2_auto.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.20  # cross-µservice translate cost + publish event fanout
  cost_drivers:
    - cross-µservice translate cost (per-language)
    - Workflow event publish fanout

cedar_policy_fragments:
  - storage/recordings/policy/cedar/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/recordings/capabilities/eval/t2-auto-baseline.jsonl
  pass_threshold:
    translation_bleu:  0.35
    publish_event_idempotency: 1.0
  eval_metric: BLEU on baseline translation set; idempotency rate for publish-event fanout
  cadence: per-release
  reference: WMT benchmark for translation; chaos-engineering for idempotency

sunset:
  status: none
