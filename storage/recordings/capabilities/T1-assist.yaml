# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:recordings:t1-assist:v1
name: transcription-diarization-summary-pii-redact
namespace: recordings
display_name: Transcription + Diarization + Auto-Summary + Auto-Redact-PII (T1 assist)
description: |
  T1 assist capability bundle — invoked automatically upon recording ingest
  finalisation (per ADR-RECORDINGS-0001) OR on user request for legacy /
  re-process workflows. Produces:
    - speaker-diarised transcript (Whisper-large + pyannote 3.x)
    - auto-PII redaction overlay (no source mutation; ADR-RECORDINGS-0003)
    - auto-summary (semantic + chronological flavours)
  User retains final approval before any cross-µservice publish (per T1
  contract). Output is a draft the user can review or discard.

owner_team: axis-recordings + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-RECORDINGS-0001, ADR-RECORDINGS-0003, ADR-RECORDINGS-0006]
related_artifacts:
  - microservices/recordings/PRD.md (FR-04 transcript; FR-12 summary)
  - microservices/recordings/decisions/ADR-RECORDINGS-0001-transcription-and-diarization-pipeline.md
  - microservices/recordings/decisions/ADR-RECORDINGS-0003-redaction-and-pii-policy.md

autonomy_tier: T1
# T1 = user-invoked OR system-invoked on ingest; human-in-loop for any cross-
# µservice publish. No silent auto-publish.

inputs:
  - name: recording_id
    type: string
    required: true
  - name: invoking_user_ref
    type: string
    required: true
  - name: lang_code_hint
    type: string
    required: false
  - name: enable_diarization
    type: boolean
    required: false
    default: true
  - name: enable_auto_redact_pii
    type: boolean
    required: false
    default: true

outputs:
  - name: transcript
    type: object
    properties:
      transcript_id:   {type: string}
      lang_code:       {type: string}
      content_hash:    {type: string}
      speaker_count:   {type: integer}
      segments_count:  {type: integer}
      model_version:   {type: string, description: "e.g., whisper-large-v3, pyannote-3.1"}
  - name: redaction_overlay
    type: object
    properties:
      redaction_count: {type: integer}
      categories:      {type: array, items: {type: string}}
  - name: summary
    type: object
    properties:
      summary_id:      {type: string}
      flavor:          {type: string, enum: [semantic, chronological]}
      bullet_count:    {type: integer}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI  # pack-us-healthcare; redacted at output

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    requires: signed BAA + tenant opt-in
    reason: HIPAA 45 CFR §164.502(b) — minimum necessary; PHI-aware Whisper post-processing required
  pack-us-financial:
    transcript_retention_floor: 5y per MiFID II 16(7) / SEC 17a-4 / FINRA 4511
  pack-eu:
    risk_classification: limited_risk (transcript + summary) per ADR-RECORDINGS-0006
    transparency_obligation: must-label-as-AI-generated per Art. 50; evidence_topic record per Art. 13
  pack-kr:
    kr_pipa_art28_consent: tenant-admin opt-in required
    kr_telecom_consent: producer-side consent_banner_confirmed required
  pack-au:
    tia_act_consent: producer-side consent_banner_confirmed required

evidence_topic: oya.recordings.capability.t1_assist.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.45  # ≈ 1h audio of Whisper-large + pyannote + summary
  cost_drivers:
    - Whisper-large transcription (foundry-runtime GPU)
    - pyannote 3.x diarization
    - summary inference (open-weights medium model)
    - PII-detector inference (pattern + lightweight NER)

cedar_policy_fragments:
  - storage/recordings/policy/cedar/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/recordings/capabilities/eval/t1-assist-baseline.jsonl
  pass_threshold:
    transcript_wer:        0.08    # ≤ 8 % WER on multilingual baseline set
    diarization_der:       0.12    # ≤ 12 % diarization error rate
    pii_redaction_recall:  0.95
    summary_faithfulness:  0.92    # Likert vs human rater
  eval_metric: WER + DER + PII-redact recall + summary-faithfulness
  cadence: per-release
  reference: HELM benchmark + LibriSpeech + VoxConverse + CALLHOME for diarization

sunset:
  status: none
