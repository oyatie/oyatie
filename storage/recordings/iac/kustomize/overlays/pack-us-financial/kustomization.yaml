# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recordings
commonLabels:
  oyatie.com/microservice: recordings
  oyatie.com/pack: pack-us-financial
  oyatie.com/region: us-ashburn-1
  oyatie.com/sec-17a-4-eligible: "true"
resources:
  - ../../base
configMapGenerator:
  - name: recordings-pack-config
    literals:
      - pack=pack-us-financial
      - cdn_backend=cloudfront
      - storage_hot_retention_days=730        # first 2y in hot non-erasable
      - storage_hot_object_lock_mode=compliance # SEC 17a-4(f) WORM
      - consent_banner_required=false         # implicit recorded-comm regime
      - retention_floor_days=1095             # 3y SEC 17a-4(b)(4)
      - retention_ceiling_days=3650           # 10y configurable; FINRA 6y default
      - mifid_ii_recorded_comms_retention_days=1825  # 5y MiFID II 16(7)
      - auto_publish_t2_default_refused=true  # SEC + FINRA refuse auto-publish
