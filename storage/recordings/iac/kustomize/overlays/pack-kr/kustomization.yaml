# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recordings
commonLabels:
  oyatie.com/microservice: recordings
  oyatie.com/pack: pack-kr
  oyatie.com/region: ap-seoul-1
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: recordings-recording-rest}
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {topology.kubernetes.io/region: ap-seoul-1}
configMapGenerator:
  - name: recordings-pack-config
    literals:
      - pack=pack-kr
      - cdn_backend=self-host           # ADR-RECORDINGS-0004 pack-kr residency-strict
      - storage_hot_retention_days=90
      - consent_banner_required=true    # KR 통신비밀보호법
      - retention_floor_days=365        # KR PIPA labor floor 1y
      - retention_ceiling_days=2555     # 7y configurable
