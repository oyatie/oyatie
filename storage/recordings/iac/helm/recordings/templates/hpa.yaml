# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range $bc, $cfg := .Values }}
{{- if and (kindIs "map" $cfg) (hasKey $cfg "replicas") }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recordings-{{ $bc | replace "_" "-" }}
  namespace: {{ $.Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recordings-{{ $bc | replace "_" "-" }}
  minReplicas: {{ $cfg.replicas }}
  maxReplicas: {{ mul $cfg.replicas 50 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
{{- end }}
