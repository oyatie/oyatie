# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recordings-default-deny
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recordings-allow-ingest-from-producers
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      oyatie.com/microservice: recordings
      oyatie.com/bc: recording-ingest
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: meet
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: messenger
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: workflow-engine
      ports:
        - {port: 9090, protocol: TCP}  # gRPC ingest
        - {port: 8080, protocol: TCP}  # REST presign/finalize
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recordings-allow-egress-to-foundry-runtime
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      oyatie.com/microservice: recordings
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: foundry-runtime
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: audit-chain
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: workflow-engine
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: ontology
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: tenancy
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.com/microservice: cloud-secrets
      ports:
        - {port: 8200, protocol: TCP}  # OpenBao
