# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# oyatie recordings µservice Helm values
#
# Per-pack overlays (storage/recordings/iac/kustomize/overlays/pack-*)
# refine these values. Secrets resolved at request time via OpenBao.

commonLabels:
  oyatie.com/microservice: recordings

global:
  pack: ${pack}  # pack-kr / pack-eu / pack-us / pack-us-healthcare / pack-us-financial / ...
  cell: ${cell}
  namespace: recordings

# ── Per-BC pod sizing ────────────────────────────────────────────────────────
recording_rest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2000m, memory: 2Gi}

recording_ingest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2000m, memory: 2Gi}

transcript_worker:
  replicas: 8
  gpu_requests: 1  # GPU per pod for Whisper-large
  resources:
    requests: {cpu: 2000m, memory: 16Gi}
    limits:   {cpu: 4000m, memory: 32Gi}

diarization_worker:
  replicas: 4
  gpu_requests: 1
  resources:
    requests: {cpu: 1000m, memory: 8Gi}
    limits:   {cpu: 2000m, memory: 16Gi}

transcode_worker:
  replicas: 8
  sandbox: gVisor
  resources:
    requests: {cpu: 2000m, memory: 4Gi}
    limits:   {cpu: 8000m, memory: 8Gi}

search_rest:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1000m, memory: 1Gi}

retention_purge_worker:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1000m, memory: 1Gi}

legal_hold_rest:
  replicas: 4
  load_bearing: true
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2000m, memory: 2Gi}

ediscovery_export_worker:
  replicas: 2
  resources:
    requests: {cpu: 1000m, memory: 4Gi}
    limits:   {cpu: 4000m, memory: 16Gi}

playback_rest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2000m, memory: 2Gi}

share_link_rest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2000m, memory: 2Gi}

watermark_stamper:
  replicas: 4
  sandbox: gVisor
  resources:
    requests: {cpu: 2000m, memory: 2Gi}
    limits:   {cpu: 4000m, memory: 4Gi}

# ── Upstream sub-charts ──────────────────────────────────────────────────────
postgres:
  enabled: true
  version: "16"
  storage: 1Ti
  replicas: 3  # primary + 2 replicas (DR pair within pack)

valkey:
  enabled: true
  version: "7.2"
  storage: 64Gi
  mode: cluster

meilisearch:
  enabled: true
  version: "0.10.0"
  storage: 512Gi

# ── Secret references (OpenBao) ──────────────────────────────────────────────
secrets:
  tenant_dek:               ${openbao:secret/recordings/${tenant}/tenant-dek}
  share_link_hmac:          ${openbao:secret/recordings/${tenant}/share-link-hmac}
  watermark_seed:           ${openbao:secret/recordings/${tenant}/watermark-seed-v1}
  recordings_rest_spiffe:   ${openbao:secret/recordings/spiffe/recordings-rest}
  export_worker_spiffe:     ${openbao:secret/recordings/spiffe/export-worker}

# ── CDN backend selection (per ADR-RECORDINGS-0004) ──────────────────────────
cdn:
  backend: cloudfront  # or 'self-host' per pack overlay
  origin_shield: true

# ── Storage tier (per ADR-RECORDINGS-0005) ───────────────────────────────────
storage:
  hot_tier_class: s3-standard
  cold_tier_class: s3-glacier-instant-retrieval
  hot_retention_days: 90  # overridden per pack
  object_lock_mode: governance  # 'compliance' for pack-us-financial first 2y

# ── Cedar policy fragments ──────────────────────────────────────────────────
policy:
  cedar:
    - storage/recordings/policy/cedar/tenant-scope.cedar
    - storage/recordings/policy/cedar/ci-scope.cedar
    - storage/recordings/policy/cedar/auditor-scope.cedar
    - storage/recordings/policy/cedar/public-read.cedar
    - storage/recordings/policy/cedar/legal-hold.cedar
