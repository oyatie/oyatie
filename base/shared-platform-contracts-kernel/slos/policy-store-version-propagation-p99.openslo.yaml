# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Contract-lock seed (FD-001 Lane C): policy-store version propagation
# freshness — the operational bound behind the zookie-style PolicyVersion
# token in src/pdp.rs (Zanzibar-precedent consistency). Skeleton relocates to
# the policy-store service's own slos/ dir when that lane lands (ADR-0130).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-policy-store-version-propagation-p99
  displayName: "policy-store version propagation p99 freshness"
  labels:
    microservice: policy
    bounded_context: policy-store
    tier: control-plane
    plane: control
spec:
  service: oya-policy
  description: "p99 lag between a policy-store write being acknowledged and every PDP replica evaluating at that policy version. Bounds the staleness window callers experience when they pin min_policy_version for read-your-writes authorization."
  indicator:
    metadata:
      name: oya-policy-store-version-propagation-p99-sli
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_policy_store_version_propagation_lag_seconds_bucket[5m])) by (le))'
  objectives:
    - displayName: "99% of policy-store writes visible at every PDP replica within 30s over rolling 30d"
      target: 0.99
      op: lte
      value: 30
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
