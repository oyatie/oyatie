# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Contract-lock seed (FD-001 Lane C): tenancy lifecycle control-plane
# availability — covers the create/activate/suspend/resume/retire operations
# defined by src/tenancy.rs. Skeleton relocates to the tenancy service's own
# slos/ dir when that lane lands (ADR-0130 SLO-gated promotion).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-tenancy-lifecycle-operation-availability
  displayName: "tenancy lifecycle operation availability"
  labels:
    microservice: tenancy
    bounded_context: lifecycle
    tier: control-plane
    plane: control
spec:
  service: oya-tenancy
  description: "Availability of tenant lifecycle mutations (create, activate, suspend, resume, retire). Lifecycle operations are idempotent AIP-151-shaped long-running mutations; an operation that terminally errors for a valid request consumes error budget."
  indicator:
    metadata:
      name: oya-tenancy-lifecycle-operation-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_tenancy_lifecycle_operations_total{outcome="succeeded"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_tenancy_lifecycle_operations_total{outcome=~"succeeded|failed"}[5m]))'
  objectives:
    - displayName: "99.9% of tenant lifecycle operations succeed over rolling 30d"
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
