# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Contract-lock seed (FD-001 Lane C): PDP decision latency for the policy
# decision point defined by src/pdp.rs (AuthorizationRequest/Response with
# decision id + policy-version echo). Skeleton relocates to the PDP service's
# own slos/ dir when that lane lands (ADR-0130 SLO-gated promotion).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-policy-pdp-decision-latency-p99
  displayName: "PDP authorization decision p99 latency"
  labels:
    microservice: policy
    bounded_context: pdp
    tier: control-plane
    plane: control
spec:
  service: oya-policy
  description: "p99 latency of PARC authorization decisions. The PDP sits on every request hot path, so the bound is in-cell single-digit-to-low-tens of milliseconds; budget burn here degrades every downstream golden-signal latency SLO."
  indicator:
    metadata:
      name: oya-policy-pdp-decision-latency-p99-sli
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_policy_pdp_decision_duration_seconds_bucket[5m])) by (le))'
  objectives:
    - displayName: "99% of authorization decisions complete within 25ms over rolling 30d"
      target: 0.99
      op: lte
      value: 0.025
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
