# logrotate config for the A1 capacity-retry loop log.
# Install: sudo cp scripts/logrotate-a1-capacity-retry.conf /etc/logrotate.d/oyatie-a1-retry
/home/oyatie/projects/oyatie/evidence/oci-readiness/a1-capacity-retry.log {
    rotate 4
    weekly
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 oyatie oyatie
}
