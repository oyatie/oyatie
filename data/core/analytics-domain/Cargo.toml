[package]
name = "data-analytics-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Pure analytics domain: TenantDashboardQuery, AuditLogSearch, BillingRollup, DataExport aggregate roots + value objects. No I/O, no async, std+serde only. ADR-0083 Tier-3."

[package.metadata.oya]
microservice = "analytics"
bounded_context = "analytics"
layer = "domain"
owner_team = "council-analytics"
adr_anchors = ["ADR-0083", "ADR-0193"]
ip_anchor = "IP-015"
data_classification = "AUDIT_INTERNAL, TENANT_AUDIT, TENANT_PUBLIC, TENANT_PRIVATE, FINANCIAL, PII_IDENTIFYING"

[lib]
name = "data_analytics_domain"
path = "src/lib.rs"
doctest = false

[dependencies]
shared-olap-client-kernel = { path = "../shared-olap-client-kernel" }
serde = { workspace = true }

[lints]
workspace = true
