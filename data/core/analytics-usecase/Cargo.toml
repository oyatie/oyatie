[package]
name = "data-analytics-usecase"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Analytics use-case orchestration: GetWorkflowExecutionDashboardUseCase, SearchAuditLogUseCase, RunBillingRollupUseCase, CreateRegulatorExportUseCase. Wires domain to kernel port. ADR-0083 layer 6."

[package.metadata.oya]
microservice = "analytics"
bounded_context = "analytics"
layer = "usecase"
owner_team = "council-analytics"
adr_anchors = ["ADR-0083", "ADR-0193"]
ip_anchor = "IP-015"
data_classification = "AUDIT_INTERNAL, TENANT_AUDIT, FINANCIAL"

[lib]
name = "data_analytics_usecase"
path = "src/lib.rs"
doctest = false

[dependencies]
data-analytics-domain = { path = "../analytics-domain" }
shared-olap-client-kernel = { path = "../shared-olap-client-kernel" }
serde = { workspace = true }

[lints]
workspace = true
