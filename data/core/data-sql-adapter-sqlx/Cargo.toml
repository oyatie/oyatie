# SQLx Postgres adapter for the owned oya-data SQL port (ADR-0536 D-10;
# story G003 sub-slice 2). Binds oya-data-sql-kernel session descriptors,
# statements, and consistency levels onto sqlx::PgPool: tenant sessions run
# the parameterized RLS set_config before any statement (reusing the shared
# postgres-command kernel's SET_LOCAL_TENANT_SQL), commits are stamped with
# HLC timestamps, and Postgres serves every consistency level as Strong
# (the ADR-0510 transitional-impl absorb — follower reads arrive with the
# CRDB-class engine). Ships the env-gated live cross-tenant-deny RLS
# harness for integration runs against a containerized Postgres.
# authoring_adrs: ADR-0510, ADR-0536, ADR-0537

[package]
name = "data-sql-adapter-sqlx"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "data_sql_adapter_sqlx"
path = "src/lib.rs"
doctest = false

[dependencies]
data-sql-kernel = { path = "../data-sql-kernel" }
shared-postgres-command-kernel = { path = "../../../base/shared-postgres-command-kernel" }
sqlx.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
