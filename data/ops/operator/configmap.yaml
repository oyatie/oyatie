apiVersion: v1
kind: ConfigMap
metadata:
  name: data-substrate-operator-contract
  namespace: oya-data-substrate-ops
  labels:
    app.kubernetes.io/name: data-substrate-operator
    app.kubernetes.io/component: operator-contract
  annotations:
    oyatie.com/non-claim: contract-only-no-controller-runtime
    oyatie.com/source-goal: G003-g03-persistence-substrate-oya-data
data:
  operator-contract.yaml: |
    apiVersion: data.oyatie.com/v1alpha1
    kind: DataSubstrateOperatorContract
    metadata:
      name: data-substrate-operator
    spec:
      sourceGoals:
        - G003-g03-persistence-substrate-oya-data
        - DATA-005
      adrReferences:
        - ADR-0139
      watchedSurfaces:
        - resourceContractId: data.postgres_database
          resourceType: PostgresDatabase
          service: cloud-data
        - resourceContractId: data.warehouse
          resourceType: Warehouse
          service: cloud-data
        - resourceContractId: data.stream
          resourceType: Stream
          service: cloud-data
      evidenceRoots:
        openslo:
          - data/observability/slos/data-substrate/operator-reconciliation-latency.openslo.yaml
        gitops:
          - data/ops/gitops/data-substrate-operator.application.yaml
      promotionGate:
        status: blocked_until_required_evidence_is_green
        requiredEvidence:
          - measured_slo_window
          - burn_rate_alert_receipt
          - otel_trace_metric_log_sample
          - audit_chain_correlation_sample
          - progressive_delivery_gate_receipt
      claimControls:
        runtimeStatus: static_manifest_only
        noRuntimeControllerClaim: true
        noDatabaseMigrationClaim: true
        noMeasuredSloClaim: true
        noProductionReadinessClaim: true
