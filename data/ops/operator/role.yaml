apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-substrate-operator
  namespace: oya-data-substrate-ops
  labels:
    app.kubernetes.io/name: data-substrate-operator
    app.kubernetes.io/component: operator
  annotations:
    oyatie.com/non-claim: static-namespace-rbac-skeleton-no-runtime
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
