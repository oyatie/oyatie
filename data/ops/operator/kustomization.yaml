apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oya-data-substrate-ops

resources:
  - namespace.yaml
  - service-account.yaml
  - role.yaml
  - role-binding.yaml
  - configmap.yaml
  - deployment.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: data-substrate
      app.kubernetes.io/managed-by: kustomize
      oyatie.com/adr: ADR-0139
      oyatie.com/data-goal: DATA-005
      oyatie.com/promotion-gate: blocked-until-evidence-green
