apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-substrate-operator
  namespace: oya-data-substrate-ops
  labels:
    app.kubernetes.io/name: data-substrate-operator
    app.kubernetes.io/component: operator
  annotations:
    oyatie.com/non-claim: replicas-zero-static-skeleton-no-controller-runtime
    oyatie.com/source-goal: G003-g03-persistence-substrate-oya-data
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: data-substrate-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-substrate-operator
        app.kubernetes.io/component: operator
        oyatie.com/context: data-substrate
      annotations:
        oyatie.com/non-claim: replicas-zero-static-skeleton-no-controller-runtime
    spec:
      serviceAccountName: data-substrate-operator
      automountServiceAccountToken: false
      containers:
        - name: operator
          image: ghcr.io/oyatie/data-substrate-operator:contract-only
          imagePullPolicy: IfNotPresent
          args:
            - --contract=/etc/data-substrate-operator/operator-contract.yaml
            - --evidence-status=required
            - --promotion-gate=blocked-until-required-evidence-is-green
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: operator-contract
              mountPath: /etc/data-substrate-operator
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: operator-contract
          configMap:
            name: data-substrate-operator-contract
            items:
              - key: operator-contract.yaml
                path: operator-contract.yaml
