apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-substrate-operator-skeleton
  namespace: oya-cd-argocd
  labels:
    app.kubernetes.io/name: data-substrate-operator
    app.kubernetes.io/part-of: data-substrate
    app.kubernetes.io/managed-by: argocd
    oyatie.com/adr: ADR-0139
    oyatie.com/context: data-substrate
    oyatie.com/data-goal: DATA-005
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    oyatie.com/non-claim: static-gitops-skeleton-no-live-sync
    oyatie.com/source-goal: G003-g03-persistence-substrate-oya-data
spec:
  project: default
  source:
    repoURL: https://github.com/jason931225/oyatie
    targetRevision: dev
    path: data/ops/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: oya-data-substrate-ops
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: data-substrate
        oyatie.com/context: data-substrate
      annotations:
        oyatie.com/non-claim: static-gitops-skeleton-no-live-sync
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
