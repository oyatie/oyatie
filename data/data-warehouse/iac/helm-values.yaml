apiVersion: oyatie.dev/v1
kind: HelmValues
metadata:
  name: data-warehouse-helm-values
  labels:
    service: data-warehouse
    binding_adr: ADR-0253-amendment
spec:
  service: data-warehouse
  tenantScoped: true
  audienceType: DATA_PLATFORM_OPERATOR
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/tenant-olap-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Snowflake", "Databricks", "Google BigQuery", "AWS Redshift", "ClickHouse"]
