apiVersion: oyatie.dev/v1
kind: SloAlertPolicy
metadata:
  name: data-warehouse-local-alerts
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: data-warehouse
  burnWindows:
    - short: 5m
      long: 1h
      pageAt: 4
    - short: 30m
      long: 6h
      pageAt: 2
  runbooks:
    - microservices/data-warehouse/runbooks/local-freshness-burn.md
    - microservices/data-warehouse/runbooks/local-completeness-drop.md
