apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: data-warehouse-local-openbao-binding
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: data-warehouse-local-ops
  vaultPath: kv/data-warehouse/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: data-warehouse.local-ops.v1
  requiredFor:
    - partition-refresher
    - sla-tier-controller
