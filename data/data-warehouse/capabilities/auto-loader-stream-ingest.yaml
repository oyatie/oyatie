apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-auto-loader-stream-ingest
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: lake-table
  capability: auto-loader-stream-ingest
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0252, ADR-0254, ADR-0329, ADR-0331]
  benchmarks: ["Databricks Auto Loader", "Snowflake Snowpipe", "BigQuery Storage Write API"]
  sourcesSupported: [s3_directory, gcs_directory, oci_directory, azure_blob_directory, kafka, kinesis, pubsub, oci_streaming]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        events_per_day_max: 1000000
    paid:
      allowed: true
      billingComponents:
        - streaming_ingest_events
        - storage_bytes
  policyEvaluationMode: caller_side_library_first
  cedarFragments: []
  sloBindings:
    - auto-loader-ingest-throughput.openslo.yaml
  ipBindings: [IP-035]
