apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-vector-index-serve
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: semantic-model
  capability: vector-index-serve
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0255, ADR-0329, ADR-0331]
  benchmarks:
    ["Databricks Mosaic AI Vector Search", "BigQuery VECTOR_SEARCH", "Snowflake Cortex Search"]
  indexTypes: [hnsw, ivf_pq, brute_force]
  similarityFunctions: [cosine, dot, l2]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - vector_index_serving
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-vector-search-access.cedar
  sloBindings:
    - vector-search-latency.openslo.yaml
  ipBindings: [IP-038]
