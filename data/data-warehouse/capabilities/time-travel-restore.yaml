apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-time-travel-restore
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: dataset
  capability: time-travel-restore
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0252, ADR-0329, ADR-0331]
  benchmarks: ["Snowflake Time Travel + Fail-Safe", "Iceberg snapshot rollback", "Delta time travel"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - time_travel_storage_days
        - compute_credits
  failSafeWindow:
    paid_default_days: 7
    paid_max_days: 35
    demo_trial_days: 0
  timeTravelWindow:
    paid_default_days: 7
    paid_max_days: 90
    demo_trial_days: 0
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-time-travel-scope.cedar
  sloBindings:
    - time-travel-resolution.openslo.yaml
  ipBindings: [IP-040]
