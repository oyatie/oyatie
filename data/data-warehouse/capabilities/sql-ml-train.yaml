apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-sql-ml-train
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: semantic-model
  capability: sql-ml-train
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0255, ADR-0329, ADR-0331]
  benchmarks: ["BigQuery ML", "Snowflake Cortex", "Databricks Mosaic AI"]
  modelFamiliesSupported: [arima, gbtree, linear, logistic, automl, remote_llm]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - ml_training_units
  callOutMicroservice: intelligence  # warehouse owns call site, intelligence owns weights
  policyEvaluationMode: caller_side_library_first
  cedarFragments: []
  ipBindings: [IP-044]
