apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-federated-external-table-query
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: tenant-olap
  capability: federated-external-table-query
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0329, ADR-0331]
  benchmarks: ["BigQuery BigLake", "Snowflake external tables", "Databricks federated"]
  formatsSupported: [parquet, orc, iceberg, delta, hudi]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - federated_query_bytes
        - compute_credits
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-federated-query-target.cedar
  sloBindings:
    - federated-query-overhead.openslo.yaml
  ipBindings: [IP-039]
