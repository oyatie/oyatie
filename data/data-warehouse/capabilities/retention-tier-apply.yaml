apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-retention-tier-apply
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: retention-tier
  capability: retention-tier-apply
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0243, ADR-0244, ADR-0251, ADR-0329, ADR-0331]
  benchmarks: ["Snowflake table types", "BigQuery active+long-term storage"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
    paid:
      allowed: true
      billingComponents:
        - storage_bytes
        - egress_gb
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-freshness-tier-control.cedar
