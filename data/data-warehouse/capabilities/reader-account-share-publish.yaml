apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-reader-account-share-publish
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: governed-share
  capability: reader-account-share-publish
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0314, ADR-0329, ADR-0331]
  benchmarks:
    ["Snowflake Reader Account", "BigQuery Analytics Hub listing", "Databricks Delta Sharing recipient"]
  consumerKind: reader_account  # non-tenant
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - share_consumer_events
  marketplaceSettlement: DealSet
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-secure-share-create.cedar
  sloBindings:
    - governed-share-consumer-lag.openslo.yaml
  ipBindings: [IP-042]
