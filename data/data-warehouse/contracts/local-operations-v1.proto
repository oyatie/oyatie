// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.data_warehouse.local.v1;

message DataWarehouseLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message DataWarehouseLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message DataWarehouseLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message DataWarehouseLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message DataWarehouseSupportedActions {
  string pipeline_schedule_action = 1;
  string sla_tier_assign_action = 2;
  string partition_refresh_action = 3;
  string lineage_capture_action = 4;
  string query_execute_action = 5;
  string schema_change_approve_action = 6;
}

service DataWarehouseLocalOperationsService {
  rpc CheckLocalPolicy(DataWarehouseLocalPolicyCheckRequest) returns (DataWarehouseLocalPolicyDecision);
  rpc GetLocalSloState(DataWarehouseLocalSloStateRequest) returns (DataWarehouseLocalSloState);
}
