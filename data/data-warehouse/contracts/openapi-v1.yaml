openapi: 3.2.0
info:
  title: Data Warehouse API
  version: 1.0.0
  summary: per-tenant OLAP, workload isolation, retention tiers, and analytical cost controls
  x-binding-adrs: [ADR-0105, ADR-0243, ADR-0244, ADR-0253-amendment, ADR-0258, ADR-0314, ADR-0321]
servers:
  - url: https://api.oyatie.example/data-warehouse/v1
    description: HTTP/3 default, HTTP/2 and HTTP/1.1 fallback, strict TLS 1.3, ECH, PQC hybrid where negotiated
paths:
  /data-warehouse/capabilities:
    get:
      operationId: listDataWarehouseCapabilities
      summary: List tenant-scoped Data Warehouse capabilities
      security: [{ tenantBearer: [] }]
      x-audience-type: DATA_PLATFORM_OPERATOR
      x-marketplace-settlement: DealSet
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
  /data-warehouse/actions/{action_id}:
    post:
      operationId: invokeDataWarehouseAction
      summary: Invoke a Cedar-gated Data Warehouse action
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: action_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
  /v1/lake/tables/{name}/write:
    post:
      operationId: writeLakeTable
      summary: Append/MERGE into a Delta / Iceberg / Hudi tenant lake table (IP-031, IP-032, IP-033).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LakeWriteRequest'
      responses:
        '202':
          description: Commit receipt with version and bytes_written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LakeCommitReceipt'
  /v1/lake/tables/{name}/cdf:
    get:
      operationId: pullChangeDataFeed
      summary: Pull change-data-feed rows for a lake table (IP-037).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: from_version
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - in: query
          name: max_rows
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100000, default: 10000 }
      responses:
        '200':
          description: CDF batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdfBatch'
  /v1/lake/tables/{name}/vector-search:
    get:
      operationId: vectorSearchLakeTable
      summary: kNN vector search over an indexed lake table (IP-038).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Vector search hits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSearchResult'
  /v1/lake/tables/{name}/fail-safe-restore:
    post:
      operationId: failSafeRestoreLakeTable
      summary: Restore a lake table from the fail-safe window (IP-040).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: at_timestamp
          required: true
          schema: { type: string, format: date-time }
      responses:
        '202':
          description: Restore initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
  /v1/lake/streams/{id}/start:
    post:
      operationId: startAutoLoaderStream
      summary: Start an Auto-Loader-class streaming ingest (IP-035).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Stream accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
  /v1/lake/streams/{id}/stop:
    post:
      operationId: stopAutoLoaderStream
      summary: Stop an Auto-Loader-class streaming ingest (IP-035).
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Stream stop accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: data-warehouse
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CapabilityList:
      type: object
      required: [tenant_id, capabilities]
      properties:
        tenant_id: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: ['warehouse-query-run', 'workload-pool-resize', 'retention-tier-apply', 'cost-budget-enforce', 'dataset-export', 'governed-share-create'] }
    ActionRequest:
      type: object
      required: [tenant_id, principal_id, purpose, data_class, deal_set_id]
      properties:
        tenant_id: { type: string }
        principal_id: { type: string }
        purpose: { type: string }
        data_class: { type: string, enum: ['warehouse_query', 'workload_pool', 'retention_tier', 'cost_allocation_row'] }
        deal_set_id: { type: string }
    ActionAccepted:
      type: object
      required: [audit_event_class, workflow_run_id, ontology_object_ref]
      properties:
        audit_event_class: { type: string }
        workflow_run_id: { type: string }
        ontology_object_ref: { type: string }
    LakeWriteRequest:
      type: object
      required: [tenant_id, catalog, schema, table, protocol, payload_uri]
      properties:
        tenant_id: { type: string }
        catalog: { type: string }
        schema: { type: string }
        table: { type: string }
        protocol: { type: string, enum: [delta, iceberg, hudi] }
        payload_uri: { type: string, format: uri }
        commit_mode: { type: string, enum: [append, merge, overwrite], default: append }
    LakeCommitReceipt:
      type: object
      required: [tenant_id, table, protocol, commit_version, bytes_written]
      properties:
        tenant_id: { type: string }
        table: { type: string }
        protocol: { type: string, enum: [delta, iceberg, hudi] }
        commit_version: { type: integer, format: int64 }
        bytes_written: { type: integer, format: int64 }
        conflict_retries: { type: integer, format: int32 }
    CdfBatch:
      type: object
      required: [tenant_id, table, from_version, to_version, row_count]
      properties:
        tenant_id: { type: string }
        table: { type: string }
        from_version: { type: integer, format: int64 }
        to_version: { type: integer, format: int64 }
        row_count: { type: integer, format: int32 }
        truncated: { type: boolean }
    VectorSearchResult:
      type: object
      required: [tenant_id, table, hits]
      properties:
        tenant_id: { type: string }
        table: { type: string }
        hits:
          type: array
          items:
            type: object
            required: [id, distance]
            properties:
              id: { type: string }
              distance: { type: number, format: double }
