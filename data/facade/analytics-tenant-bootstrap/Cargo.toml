[package]
name = "data-analytics-tenant-bootstrap"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Sidecar controller binary: consumes tenancy lifecycle events and reconciles per-tenant ClickHouse state (database creation, row-level policies, quota bindings). Controller-pattern per Kubernetes operator doctrine."

[package.metadata.oya]
microservice = "analytics"
bounded_context = "analytics-tenant-bootstrap"
layer = "app"
owner_team = "council-analytics"
adr_anchors = ["ADR-0083", "ADR-0145", "ADR-0193", "ADR-0155", "ADR-0038"]
ip_anchor = "IP-002"
container_image = "ghcr.io/oyatie/analytics-tenant-bootstrap:<sha> (non_claim: not yet built)"
data_classification = "INTERNAL_ONLY"

[lib]
name = "data_analytics_tenant_bootstrap"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "data-analytics-tenant-bootstrap"
path = "src/main.rs"

[dependencies]
data-analytics-domain = { path = "../../core/analytics-domain" }
shared-olap-client-kernel = { path = "../../core/shared-olap-client-kernel" }
shared-olap-clickhouse-adapter = { path = "../../core/shared-olap-clickhouse-adapter" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
