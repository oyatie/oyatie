# HIPAA-specific audit logging — every query log to immutable S3 audit bucket.
# Authority: HIPAA §164.312(b) audit controls.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: analytics-clickhouse-1
  namespace: analytics
spec:
  configuration:
    files:
      hipaa-audit.xml: |
        <yandex>
          <query_log>
            <database>system</database>
            <table>query_log</table>
            <flush_interval_milliseconds>1000</flush_interval_milliseconds>
            <engine>MergeTree() PARTITION BY toDate(event_date) ORDER BY (event_date, event_time)
              TTL event_date + INTERVAL 6 YEAR DELETE</engine>
          </query_log>
          <part_log>
            <database>system</database>
            <table>part_log</table>
            <flush_interval_milliseconds>1000</flush_interval_milliseconds>
          </part_log>
        </yandex>
