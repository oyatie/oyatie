# US-healthcare pack — HIPAA-compliant cold-tier S3 endpoint.
# Backed by AWS S3 with BAA per HIPAA compliance contract.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: analytics-clickhouse-1
  namespace: analytics
spec:
  configuration:
    files:
      storage.xml: |
        <storage_configuration>
          <disks>
            <s3_cold>
              <type>s3</type>
              <endpoint>https://s3.us-east-1.amazonaws.com/oyatie-analytics-cold-us-healthcare/</endpoint>
              <access_key_id from_env="S3_ACCESS_KEY"/>
              <secret_access_key from_env="S3_SECRET_KEY"/>
              <use_environment_credentials>false</use_environment_credentials>
              <server_side_encryption_header>x-amz-server-side-encryption: aws:kms</server_side_encryption_header>
            </s3_cold>
          </disks>
          <policies>
            <hot_cold>
              <volumes>
                <hot><disk>default</disk></hot>
                <cold><disk>s3_cold</disk></cold>
              </volumes>
            </hot_cold>
          </policies>
        </storage_configuration>
