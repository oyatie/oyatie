apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Analytics µservice — pack-us-healthcare (HIPAA) overlay.
# Authority: ADR-0010 regional packs, ADR-0049 residency, ADR-0193.
# HIPAA requires BAA + additional auditing + restricted IAM.

resources:
  - ../../base

namespace: analytics

patchesStrategicMerge:
  - cold-tier-patch.yaml
  - node-selector-patch.yaml
  - hipaa-audit-patch.yaml

commonLabels:
  oya.pack: us-healthcare
  oya.residency: UsHealthcareHipaa
  oya.compliance: hipaa-baa
