apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Analytics µservice — kustomize base.
# Authority: ADR-0131 flat layout, IP-001.
# Renders the clickhouse-analytics Helm chart with default values.

helmCharts:
  - name: clickhouse-analytics
    repo: file://../../helm/clickhouse-analytics
    version: 0.1.0
    releaseName: analytics-clickhouse
    namespace: analytics
    valuesFile: ../../helm/clickhouse-analytics/values.yaml

namespace: analytics

commonLabels:
  oya.microservice: analytics
  oya.layout: flat-per-adr-0131
