{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-analytics-allowlist
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: clickhouse-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 9000  # native
          protocol: TCP
        - port: 8123  # http
          protocol: TCP
        - port: 9009  # interserver
          protocol: TCP
        - port: 9363  # prometheus
          protocol: TCP
{{- end }}
