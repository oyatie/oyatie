{{- if .Values.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clickhouse-analytics-alerts
  namespace: {{ .Values.namespace }}
  labels:
    release: kube-prometheus-stack
    oya.microservice: analytics
spec:
  groups:
    - name: clickhouse-analytics
      interval: 30s
      rules:
        - alert: ClickHouseKeeperNoLeader
          expr: max(clickhouse_keeper_is_leader{cluster=~"analytics.*"}) == 0
          for: {{ .Values.prometheusRules.rules.keeperNoLeader.forDuration }}
          labels:
            severity: {{ .Values.prometheusRules.rules.keeperNoLeader.severity }}
            pagerduty: {{ .Values.prometheusRules.pagerDutyTarget }}
            opsgenie: {{ .Values.prometheusRules.opsgenieTarget }}
            runbook: data/analytics/runbooks/keeper-quorum-recovery.md
          annotations:
            summary: "ClickHouse Keeper has no leader (analytics cluster)"
            description: "DDL operations halted; reads continue."
        - alert: ClickHouseReplicationLag
          expr: max(clickhouse_replicated_part_log_lag_seconds{cluster=~"analytics.*"}) > {{ .Values.prometheusRules.rules.replicationLag.thresholdSeconds }}
          for: 5m
          labels:
            severity: {{ .Values.prometheusRules.rules.replicationLag.severity }}
            pagerduty: {{ .Values.prometheusRules.pagerDutyTarget }}
            runbook: data/analytics/runbooks/clickhouse.md
          annotations:
            summary: "ClickHouse replication lag > 60s (analytics cluster)"
        - alert: ClickHousePartMergeBacklog
          expr: max(ClickHouseMetrics_PartsActive{cluster=~"analytics.*"} - ClickHouseMetrics_PartsCommitted{cluster=~"analytics.*"}) > {{ .Values.prometheusRules.rules.partMergeBacklog.threshold }}
          for: 15m
          labels:
            severity: {{ .Values.prometheusRules.rules.partMergeBacklog.severity }}
            runbook: data/analytics/runbooks/ingest-lag-burn.md
          annotations:
            summary: "ClickHouse merge backlog > 100 parts (analytics cluster)"
        - alert: ClickHouseInstanceDown
          expr: up{job="clickhouse-server",cluster=~"analytics.*"} == 0
          for: {{ .Values.prometheusRules.rules.instanceDown.forDuration }}
          labels:
            severity: {{ .Values.prometheusRules.rules.instanceDown.severity }}
            pagerduty: {{ .Values.prometheusRules.pagerDutyTarget }}
            runbook: data/analytics/runbooks/clickhouse.md
          annotations:
            summary: "ClickHouse server replica down"
{{- end }}
