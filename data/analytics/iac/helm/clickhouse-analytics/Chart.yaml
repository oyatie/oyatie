apiVersion: v2
name: clickhouse-analytics
description: |
  Analytics-namespace ClickHouse 26.3 LTS cluster (3 shards × 2 replicas + 3-node Keeper).
  Sized for tenant-facing query QPS per ADR-0193. Sibling to clickhouse-observability,
  but namespace-scoped, secret-bound to the analytics OpenBao mount, and tuned for
  read-heavy workload.
type: application
version: 0.1.0
appVersion: "26.3.10.60"
keywords: [clickhouse, analytics, olap, oyatie, adr-0193, adr-0131]
home: https://github.com/oyatie/oyatie/tree/dev/data/analytics
sources:
  - https://github.com/Altinity/clickhouse-operator
maintainers:
  - name: council-analytics
    url: https://github.com/oyatie/oyatie/blob/dev/docs/AGENTS.md
dependencies:
  - name: clickhouse-operator
    version: "0.24.x"
    repository: "https://altinity.github.io/clickhouse-operator"
    condition: clickhouseOperator.enabled
