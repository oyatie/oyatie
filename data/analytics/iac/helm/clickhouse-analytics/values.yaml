# Analytics ClickHouse cluster — default values.
# Authority: ADR-0193, IP-001, ADR-AN-001-ttl-policy, ADR-AN-002-partition-strategy.

namespace: analytics
clusterName: analytics-clickhouse-1

clickhouseOperator:
  enabled: true

server:
  image:
    repository: clickhouse/clickhouse-server
    tag: 26.3.10.60
  replicas: 6                 # 3 shards × 2 replicas
  shards: 3
  replicasPerShard: 2
  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
  storage:
    storageClass: csi-fast-nvme
    size: 500Gi
  nodeSelector:
    oya.disk-class: nvme-premium
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse-server
          topologyKey: kubernetes.io/hostname

keeper:
  image:
    repository: clickhouse/clickhouse-keeper
    tag: 26.3.10.60
  replicas: 3                 # 3-node Raft quorum
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  storage:
    storageClass: csi-fast-nvme
    size: 20Gi
  forceRecovery: false        # set true ONLY during quorum-recovery procedure

# OpenBao-managed credentials per ADR-0043.
secrets:
  externalSecretStoreRef:
    name: openbao-analytics
    kind: ClusterSecretStore
  admin:
    path: secret/data/analytics/clickhouse/admin
  s3Cold:
    path: secret/data/analytics/clickhouse/s3-cold

# Cold tier per ADR-AN-001-ttl-policy + IP-006.
storage:
  hotCold:
    coldDiskName: s3_cold
    coldEndpoint: http://seaweedfs-s3.observability.svc.cluster.local:8333/clickhouse-cold/
    storagePolicy: hot_cold

# Per-workload TTL projection per ADR-AN-001.
workloadTtl:
  auditLog:
    hotDays: 90
    coldDays: 2555           # 7 years
    deleteDays: 2555
  businessKpi:
    hotDays: 90
    coldDays: 365
    deleteDays: 365
  billingDaily:
    hotDays: 30
    coldDays: 2555
    deleteDays: 2555
  billingMonthly:
    hotDays: 30
    coldDays: 2555
    deleteDays: 2555
  telemetryRollup:
    hotDays: 30
    coldDays: 365
    deleteDays: 365

# PrometheusRules per IP-001 T4.
prometheusRules:
  enabled: true
  pagerDutyTarget: pagerduty-analytics
  opsgenieTarget: opsgenie-analytics
  rules:
    keeperNoLeader:
      severity: page
      forDuration: 5m
    replicationLag:
      severity: page
      thresholdSeconds: 60
    partMergeBacklog:
      severity: ticket
      threshold: 100
    instanceDown:
      severity: page
      forDuration: 5m

# NetworkPolicy — analytics namespace + observability namespace (scrape) only.
networkPolicy:
  enabled: true
  allowedNamespaces:
    - analytics
    - observability

# ServiceMonitor for Prometheus.
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 25s

# Sized for tenant-facing query QPS (per ADR-0193).
clickhouseConfig:
  maxServerMemoryUsage: 12884901888    # 12 GiB
  maxConcurrentQueries: 128
  maxQueryExecutionTime: 300
  kafkaBrokerList: pulsar-kafka.observability.svc.cluster.local:9092
  remoteServersDdl: true
