openapi: 3.2.0
info:
  title: Oyatie Analytics API
  version: 1.0.0
  description: |
    Tenant-facing analytics µservice REST API. Wide-aggregate reads against per-tenant
    ClickHouse databases (per ADR-0193). Cedar-authorized (per ADR-0007).
    Tier-A 4-INV invariants baked in: idempotency keys, cursor pagination, X-Request-Id,
    OpenTelemetry-friendly responses.
  contact:
    name: council-analytics
    url: https://github.com/oyatie/oyatie/blob/dev/docs/AGENTS.md
  license:
    name: Internal
servers:
  - url: https://api.{cell}.oyatie.io/analytics/v1
    description: Cell-routed analytics API gateway
    variables:
      cell:
        default: dev
        enum: [dev, kr-seoul-1, eu-frankfurt-1, us-east-1, ksa-1, uae-1]
security:
  - bearerAuth: []
tags:
  - name: dashboards
    description: Tenant-facing dashboard queries
  - name: audit-log
    description: Tenant-scoped audit-log search
  - name: regulator-export
    description: Compliance officer regulator export
  - name: capacity
    description: Internal capacity-planning reads
paths:
  /healthz:
    get:
      tags: [internal]
      summary: Liveness probe
      responses:
        '200':
          description: ok
  /readyz:
    get:
      tags: [internal]
      summary: Readiness probe — verifies ClickHouse connectivity
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /v1/dashboards/workflow-execution:
    get:
      tags: [dashboards]
      summary: Per-hour workflow execution rollup
      description: |
        Returns hourly workflow execution counts and latency percentiles for the
        calling tenant. Backed by `tenant_${tid}.workflow_rolling_hour`
        (AggregatingMergeTree) per IP-005. Cursor-paginated per ADR-0150.
        SLO: p99 ≤ 500ms (per data/observability/slos/analytics/dashboard-api-latency.openslo.yaml).
      operationId: getWorkflowExecutionDashboard
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque HMAC-SHA256-signed cursor per ADR-0150
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Hourly rollup page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /v1/dashboards/billing-rollup:
    get:
      tags: [dashboards]
      summary: Per-day billing rollup for the calling tenant
      operationId: getBillingRollup
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Daily billing rollup page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRollupPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /v1/audit-log/search:
    get:
      tags: [audit-log]
      summary: Tenant-scoped audit-log search
      description: |
        Filter audit-log events by axis, event type, principal, and date range.
        ClickHouse-backed; hot tier 90 d (p99 ≤ 800ms); cold tier up to 7 yr (p99 ≤ 2s).
        Recursive: this query itself emits one audit event (per ADR-0003).
      operationId: searchAuditLog
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: axis
          in: query
          schema:
            type: string
            enum: [auth, workflow, billing, tenancy, compliance, all]
            default: all
        - name: event_type
          in: query
          schema: { type: string }
        - name: principal_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Audit log page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/regulator-export:
    post:
      tags: [regulator-export]
      summary: Initiate regulator-grade evidence pack export
      description: |
        Produces a cosign-signed NDJSON pack for the requested tenant/window.
        Streaming response via chunked-transfer-encoding (per IP-013).
        Idempotent — same Idempotency-Key returns same pack id within 24h.
      operationId: createRegulatorExport
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegulatorExportRequest'
      responses:
        '200':
          description: NDJSON stream
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One JSON object per line; first line is the cosign-signed manifest
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: analytics
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
      description: Distributed-trace correlation; auto-generated if absent (per ADR-0151)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Per ADR-0150 — required on mutating endpoints; 24h window
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Cedar forbid — cross-tenant or insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Per-tenant quota exceeded (per ADR-0155 + IP-011)
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until quota window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    WorkflowExecutionPage:
      type: object
      required: [data, page_info]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExecutionBucket'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    WorkflowExecutionBucket:
      type: object
      required: [hour, tenant_id, run_count, duration_p99_ms]
      properties:
        hour: { type: string, format: date-time }
        tenant_id: { type: string }
        run_count: { type: integer, format: int64 }
        duration_p50_ms: { type: integer, format: int32 }
        duration_p95_ms: { type: integer, format: int32 }
        duration_p99_ms: { type: integer, format: int32 }
        error_count: { type: integer, format: int64 }
    BillingRollupPage:
      type: object
      required: [data, page_info]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingRollupRow'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    BillingRollupRow:
      type: object
      required: [day, tenant_id, resource_type, count]
      properties:
        day: { type: string, format: date }
        tenant_id: { type: string }
        resource_type: { type: string }
        count: { type: integer, format: int64 }
    AuditLogPage:
      type: object
      required: [data, page_info]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    AuditLogEntry:
      type: object
      required: [event_id, emitted_at, tenant_id, axis, event_type, principal_id]
      properties:
        event_id: { type: string, format: uuid }
        emitted_at: { type: string, format: date-time }
        tenant_id: { type: string }
        axis: { type: string }
        event_type: { type: string }
        principal_id: { type: string }
        evidence_ref: { type: string, description: Pointer to canonical entity in the source µservice }
        payload_hash: { type: string, description: SHA-256 of redacted payload }
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    RegulatorExportRequest:
      type: object
      required: [tenant_id, from, to]
      properties:
        tenant_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        axes:
          type: array
          items: { type: string }
          description: Optional subset; defaults to all axes
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, quota_exceeded, conflict, internal, unavailable]
        message: { type: string }
        request_id: { type: string, format: uuid }
        details:
          type: object
          additionalProperties: true
