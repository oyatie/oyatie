apiVersion: oyatie.dev/v1
kind: NetworkPolicy
metadata:
  name: data-pipeline-network-policy
  labels:
    service: data-pipeline
    binding_adr: ADR-0253-amendment
spec:
  service: data-pipeline
  tenantScoped: true
  audienceType: DATA_PIPELINE_OPERATOR
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/lineage-replay-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Fivetran", "Airbyte", "Workato", "Boomi", "MuleSoft", "dbt"]
