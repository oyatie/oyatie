asyncapi: 3.1.0
info:
  title: Data Pipeline Events
  version: 1.0.0
  description: Tenant-scoped event contract for pipeline runs, lineage, replay, ELT, and iPaaS ownership.
defaultContentType: application/json
channels:
  data-pipeline.events.v1:
    address: data-pipeline.events.v1
    messages:
      dataPipelineActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/data-pipeline.events.v1'
    messages:
      - $ref: '#/channels/data-pipeline.events.v1/messages/dataPipelineActionAccepted'
components:
  messages:
    ActionAccepted:
      name: DataPipelineActionAccepted
      title: Data Pipeline action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
