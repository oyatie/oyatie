// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.data_pipeline.local.v1;

message DataPipelineLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message DataPipelineLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message DataPipelineLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message DataPipelineLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message DataPipelineSupportedActions {
  string ingest_batch_accept_action = 1;
  string transform_run_start_action = 2;
  string quality_check_evaluate_action = 3;
  string null_rate_enforce_action = 4;
  string deadletter_replay_action = 5;
  string lineage_record_action = 6;
}

service DataPipelineLocalOperationsService {
  rpc CheckLocalPolicy(DataPipelineLocalPolicyCheckRequest) returns (DataPipelineLocalPolicyDecision);
  rpc GetLocalSloState(DataPipelineLocalSloStateRequest) returns (DataPipelineLocalSloState);
}
