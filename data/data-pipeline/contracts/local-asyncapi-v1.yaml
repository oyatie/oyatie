asyncapi: 3.1.0
info:
  title: Data Pipeline Local Operational Events
  version: 1.0.0
  description: Events for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  data-pipeline.local-ops.v1:
    address: data-pipeline.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/data-pipeline.local-ops.v1'
    messages:
      - $ref: '#/channels/data-pipeline.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/data-pipeline.local-ops.v1'
    messages:
      - $ref: '#/channels/data-pipeline.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: DataPipelineDomainEvent
      title: Data Pipeline domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['ingest.batch.accepted', 'transform.run.started', 'quality.check.failed', 'deadletter.replayed'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['ingest_batch', 'transform_run', 'quality_check', 'null_rate_metric', 'deadletter_event', 'lineage_edge'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: DataPipelineSloBurnEvent
      title: Data Pipeline SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'data-pipeline' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'ingest.batch.accepted' }
