# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-function-read-availability
  displayName: "Ontology Function Read Availability (99.99 %)"
  labels:
    microservice: ontology
    bc: function-engine
    tier: substrate
spec:
  service: ontology
  description: |
    Availability of the Ontology Function read endpoint. The Ontology µservice
    is shared substrate per ADR-0059; every product depends on its Functions.
    Outage cascades to every product.
  indicator:
    metadata:
      name: ontology-function-read-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_function_evaluations_total{outcome="success"}[1m]))
        total:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_function_evaluations_total[1m]))
  objectives:
    - displayName: 99.99 % availability over 30 days
      target: 0.9999
      op: gte
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - burn-rate-fast-1h
    - burn-rate-slow-6h
