# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-action-invocation-availability
  displayName: "Ontology Action Invocation Availability (99.95 %)"
  labels:
    microservice: ontology
    bc: action-engine
    tier: substrate
spec:
  service: ontology
  description: |
    Availability of the Ontology Action invocation endpoint. Lower SLO than
    Function reads (99.95 %) because Action invocations include Cedar gate +
    write + audit-chain seal — failure of any one returns an Action denied
    or error; tenant-affecting but not fatal to read-paths.
  indicator:
    metadata:
      name: ontology-action-invocation-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_action_invocations_total{outcome=~"success|denied"}[1m]))
        total:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_action_invocations_total[1m]))
  objectives:
    - displayName: 99.95 % availability (success+denied; error is unavailable)
      target: 0.9995
      op: gte
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - burn-rate-fast-1h
    - burn-rate-slow-6h
