apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-read-path-library-freshness
  displayName: Ontology read-path library freshness
  labels:
    microservice: ontology
    binding_adr: ADR-0257
    tier: substrate
spec:
  service: ontology
  description: |
    The ontology read-path library, when configured with freshness_floor=TIGHT (≤2s),
    serves ≥99% of lookups within the declared freshness budget. Burn-rate alerting
    on this SLO triggers the ontology-read-library-fallback runbook.
  objectives:
    - displayName: Freshness ≤2s for TIGHT tier
      target: 0.99
      sliRef:
        ratioMetric:
          counter: true
          good:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_ontology_read_path_library_freshness_lag_seconds_bucket{freshness_floor="TIGHT", le="2"}[5m]))'
          total:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_ontology_read_path_library_lookup_total{freshness_floor="TIGHT"}[5m]))'
  alertPolicy:
    burnRate:
      - threshold: 14
        lookback: 1h
        runbook: data/ontology/runbooks/ontology-read-library-fallback.md
      - threshold: 6
        lookback: 6h
        runbook: data/ontology/runbooks/ontology-read-library-fallback.md
