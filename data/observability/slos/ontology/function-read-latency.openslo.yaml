# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-function-read-latency
  displayName: "Ontology Function Read Latency p99 ≤ 50 ms (Bominal ADR-0107 mandate)"
  labels:
    microservice: ontology
    bc: function-engine
    tier: substrate
spec:
  service: ontology
  description: |
    p99 latency of the Ontology Function read endpoint. Bominal ADR-0107
    mandates ≤ 50 ms p99 for the Ontology read path; this SLO enforces it
    continuously and gates promotion via the agentic SLO-gated promotion
    workflow (ADR-0139).
  indicator:
    metadata:
      name: ontology-function-read-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_function_evaluation_duration_seconds_bucket{le="0.050"}[1m]))
        total:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_function_evaluation_duration_seconds_count[1m]))
  objectives:
    - displayName: 99 % of Function reads ≤ 50 ms
      target: 0.99
      op: gte
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - burn-rate-fast-1h
    - burn-rate-slow-6h
