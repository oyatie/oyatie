# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-dynamic-layer-freshness
  displayName: "Ontology Dynamic Layer Freshness ≤ 2 s p99"
  labels:
    microservice: ontology
    bc: query-engine
    tier: substrate
spec:
  service: ontology
  description: |
    Freshness of the 3-layer Knowledge Graph dynamic layer. Per
    /specs/microservices/ontology.json AC-12, dynamic-layer reads MUST be ≤ 2 s
    p99 lag against canonical Postgres state. Violation = silent stale
    reads (DPIA R-04 anti-pattern).
  indicator:
    metadata:
      name: ontology-dynamic-layer-freshness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_dynamic_layer_freshness_lag_seconds_bucket{le="2"}[1m]))
        total:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(ontology_dynamic_layer_freshness_lag_seconds_count[1m]))
  objectives:
    - displayName: 99 % of dynamic-layer reads ≤ 2 s lag
      target: 0.99
      op: gte
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - burn-rate-fast-1h
    - burn-rate-slow-6h
