apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-ingest-freshness
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-pipeline
  description: Ingest batches available inside freshness objective for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations.
  indicator:
    metadata:
      name: ingest-freshness
      labels:
        domain_object: PipelineRun
        operator_audience: DATA_PIPELINE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_ingest_freshness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_ingest_freshness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Ingest batches available inside freshness objective
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
