apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-availability
  labels:
    service: data-pipeline
    adr: ADR-0139
spec:
  service: data-pipeline
  indicator:
    metadata:
      name: availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_availability_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_availability_total[5m]))
  objectives:
    - displayName: Data Pipeline availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
