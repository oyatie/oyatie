apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-transform-latency
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-pipeline
  description: Transform run latency for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations.
  indicator:
    metadata:
      name: transform-latency
      labels:
        domain_object: PipelineRun
        operator_audience: DATA_PIPELINE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_transform_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_transform_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Transform run latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
