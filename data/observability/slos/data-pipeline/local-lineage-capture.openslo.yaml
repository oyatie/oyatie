apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-lineage-capture
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-pipeline
  description: Lineage captured for completed runs for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations.
  indicator:
    metadata:
      name: lineage-capture
      labels:
        domain_object: PipelineRun
        operator_audience: DATA_PIPELINE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_lineage_capture_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_lineage_capture_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Lineage captured for completed runs
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
