apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-quality-null-rate
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-pipeline
  description: Null-rate checks remain below quality threshold for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations.
  indicator:
    metadata:
      name: quality-null-rate
      labels:
        domain_object: PipelineRun
        operator_audience: DATA_PIPELINE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_quality_null_rate_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_quality_null_rate_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Null-rate checks remain below quality threshold
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
