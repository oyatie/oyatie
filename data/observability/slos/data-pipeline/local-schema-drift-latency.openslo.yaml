apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-schema-drift-latency
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-pipeline
  description: Schema drift detected before downstream publish for source ingest, transform execution, data-quality measurement, null-rate controls, dead-letter replay, and lineage operations.
  indicator:
    metadata:
      name: schema-drift-latency
      labels:
        domain_object: PipelineRun
        operator_audience: DATA_PIPELINE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_schema_drift_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_schema_drift_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Schema drift detected before downstream publish
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
