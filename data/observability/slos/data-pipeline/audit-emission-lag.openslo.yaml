apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-pipeline-audit-emission-lag
  labels:
    service: data-pipeline
    adr: ADR-0139
spec:
  service: data-pipeline
  indicator:
    metadata:
      name: audit-emission-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_audit_emission_lag_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_pipeline_audit_emission_lag_total[5m]))
  objectives:
    - displayName: Data Pipeline audit-emission-lag
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
