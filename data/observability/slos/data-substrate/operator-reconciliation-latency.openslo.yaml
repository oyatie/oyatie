apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-substrate-operator-reconciliation-latency
  displayName: Data substrate operator reconciliation latency
  labels:
    microservice: data-substrate
    bounded_context: data-substrate-ops
    tier: internal-substrate
    plane: control
    service: data-substrate
    adr: ADR-0139
    promotion_gate: blocked_until_required_evidence_is_green
    evidence_status: evidence_required
spec:
  service: data-substrate
  description: Evidence-required latency objective for future data substrate operator reconciliation of cloud-data PostgresDatabase, Warehouse, and Stream contracts. This skeleton does not assert a measured SLO window.
  indicator:
    metadata:
      name: data-substrate-operator-reconciliation-latency
      labels:
        domain_object: DataSubstrateOperator
        operator_audience: DATA_SUBSTRATE_OPERATOR
        evidence_status: evidence_required
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_substrate_operator_reconcile_duration_seconds_bucket{le="300"}[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_substrate_operator_reconcile_duration_seconds_count[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Operator reconciliations complete within five minutes
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
