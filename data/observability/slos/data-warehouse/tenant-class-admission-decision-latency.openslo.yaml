apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-tenant-class-admission-decision-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-018
    wave: Wave-15A
spec:
  description: |
    Tenant-class admission decision latency. The admission controller
    looks up tenant_class + billing_components + compute_credits balance
    and returns an admit/refuse verdict. p99 ≤ 10ms.
  service: data-warehouse
  indicator:
    metadata:
      name: tenant-class-admission-decision-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_admission_decision_under_10ms_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_admission_decision_total[5m]))
  objectives:
    - displayName: p99 admission decision under 10ms
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
