apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-dlt-pipeline-freshness
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-036
    wave: Wave-15A
spec:
  description: |
    Delta Live Tables observed pipeline lag vs declared target_lag.
    99% of refresh windows must complete within target_lag; refreshes
    that breach are surfaced to the operator.
  service: data-warehouse
  indicator:
    metadata:
      name: dlt-pipeline-freshness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_dlt_refresh_within_target_lag_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_dlt_refresh_total[5m]))
  objectives:
    - displayName: DLT refresh within target_lag in 99% of windows
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
