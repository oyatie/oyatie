apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-zero-copy-clone-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-041
    wave: Wave-15A
spec:
  description: |
    Snowflake-class zero-copy clone latency. Clone is metadata-only;
    target is p99 ≤ 1s for tables up to 1TiB. Larger tables get higher
    p99 because metadata count grows with partition count.
  service: data-warehouse
  indicator:
    metadata:
      name: zero-copy-clone-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_clone_under_1s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_clone_total[5m]))
  objectives:
    - displayName: p99 zero-copy clone under 1s for tables up to 1TiB
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
