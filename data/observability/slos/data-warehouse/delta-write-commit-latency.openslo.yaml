apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-delta-write-commit-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-031
    wave: Wave-15A
spec:
  description: |
    Delta Lake commit latency. p99 ≤ 2s for batches ≤ 100MiB. Includes
    putIfAbsent retry budget of 5 attempts; if the writer hits contention
    beyond 5 retries the SLO bucket records the slow-path.
  service: data-warehouse
  indicator:
    metadata:
      name: delta-write-commit-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_delta_commit_under_2s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_delta_commit_total[5m]))
  objectives:
    - displayName: p99 Delta commit under 2s for batches up to 100MiB
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
