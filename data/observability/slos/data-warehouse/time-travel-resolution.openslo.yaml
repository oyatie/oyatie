apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-time-travel-resolution
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-040
    wave: Wave-15A
spec:
  description: |
    Snowflake-class time-travel metadata-resolve latency. The actual scan is
    graded separately by local-query-latency. This SLO measures only the
    catalog lookup that resolves AT(TIMESTAMP=…|VERSION=…) to a snapshot.
  service: data-warehouse
  indicator:
    metadata:
      name: time-travel-resolution
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_time_travel_resolve_under_1s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_time_travel_resolve_total[5m]))
  objectives:
    - displayName: p99 time-travel resolve under 1s
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
