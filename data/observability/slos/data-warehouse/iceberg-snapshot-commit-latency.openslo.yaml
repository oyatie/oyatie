apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-iceberg-snapshot-commit-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-032
    wave: Wave-15A
spec:
  description: |
    Apache Iceberg snapshot commit latency. p99 ≤ 3s for batches up to
    100MiB. Includes catalog CAS retry budget; if the writer hits
    contention beyond 5 retries the SLO records the slow-path.
  service: data-warehouse
  indicator:
    metadata:
      name: iceberg-snapshot-commit-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_iceberg_commit_under_3s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_iceberg_commit_total[5m]))
  objectives:
    - displayName: p99 Iceberg snapshot commit under 3s
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
