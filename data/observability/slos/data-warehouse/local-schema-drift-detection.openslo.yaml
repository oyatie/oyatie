apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-schema-drift-detection
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-warehouse
  description: Schema drift detected before serving stale partitions for warehouse pipeline scheduling, SLA-tier enforcement, dimensional completeness, query serving, and lineage operations.
  indicator:
    metadata:
      name: schema-drift-detection
      labels:
        domain_object: WarehouseDataset
        operator_audience: DATA_WAREHOUSE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_schema_drift_detection_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_schema_drift_detection_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Schema drift detected before serving stale partitions
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
