apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-auto-loader-ingest-throughput
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-035
    wave: Wave-15A
spec:
  description: |
    Auto-Loader-class streaming ingest sustained throughput. Per-stream
    target ≥ 1M events/s p99 for paid tenants; demo_trial is capped at
    1M events/day total.
  service: data-warehouse
  indicator:
    metadata:
      name: auto-loader-ingest-throughput
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_ingest_streams_meeting_throughput_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_ingest_streams_total[5m]))
  objectives:
    - displayName: per-stream ingest throughput ≥ 1M events/s
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
