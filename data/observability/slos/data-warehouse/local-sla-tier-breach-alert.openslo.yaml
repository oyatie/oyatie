apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-sla-tier-breach-alert
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-warehouse
  description: SLA-tier breach alerts emitted within objective for warehouse pipeline scheduling, SLA-tier enforcement, dimensional completeness, query serving, and lineage operations.
  indicator:
    metadata:
      name: sla-tier-breach-alert
      labels:
        domain_object: WarehouseDataset
        operator_audience: DATA_WAREHOUSE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_sla_tier_breach_alert_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_sla_tier_breach_alert_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: SLA-tier breach alerts emitted within objective
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
