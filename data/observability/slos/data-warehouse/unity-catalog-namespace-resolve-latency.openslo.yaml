apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-unity-catalog-namespace-resolve-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-034
    wave: Wave-15A
spec:
  description: |
    Unity-Catalog-class 3-level namespace resolve latency. p99 ≤ 30ms
    for catalog.schema.object lookups. Backed by Postgres + per-cell
    cache with TTL ≤ 5s.
  service: data-warehouse
  indicator:
    metadata:
      name: unity-catalog-namespace-resolve-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_catalog_resolve_under_30ms_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_catalog_resolve_total[5m]))
  objectives:
    - displayName: p99 catalog.schema.object resolve under 30ms
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
