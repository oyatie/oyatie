apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-change-data-feed-lag
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-037
    wave: Wave-15A
spec:
  description: |
    CDF emission-to-subscriber lag. p99 ≤ 5s for paid-tenant pull and
    push subscribers. Lag is measured from the producer commit timestamp
    to the subscriber receive timestamp using HLC per ADR-0252.
  service: data-warehouse
  indicator:
    metadata:
      name: change-data-feed-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_cdf_lag_under_5s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_cdf_emit_total[5m]))
  objectives:
    - displayName: p99 CDF lag under 5s
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
