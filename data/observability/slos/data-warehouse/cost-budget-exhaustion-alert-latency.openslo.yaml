apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-cost-budget-exhaustion-alert-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-017
    wave: Wave-15A
spec:
  description: |
    Cost budget exhaustion alert latency. From the moment a tenant's
    compute_credits cross the 90% / 100% threshold to the moment the
    alert is delivered, p99 ≤ 60s. Threshold rows are recomputed every
    30s; alert is sent on first crossing.
  service: data-warehouse
  indicator:
    metadata:
      name: cost-budget-exhaustion-alert-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_budget_alert_under_60s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_budget_threshold_crossing_total[5m]))
  objectives:
    - displayName: p99 budget-exhaustion alert delivered within 60s of crossing
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
