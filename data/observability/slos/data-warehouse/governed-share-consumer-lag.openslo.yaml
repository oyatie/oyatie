apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-governed-share-consumer-lag
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-042
    wave: Wave-15A
spec:
  description: |
    Governed share consumer-side read lag. p99 ≤ 1s from producer commit
    to consumer visible. Includes reader-account consumers (non-tenant)
    over the Delta Sharing + Snowflake Reader Account + Analytics Hub
    protocols.
  service: data-warehouse
  indicator:
    metadata:
      name: governed-share-consumer-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_share_consumer_lag_under_1s_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_share_consumer_read_total[5m]))
  objectives:
    - displayName: p99 share consumer lag under 1s
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
