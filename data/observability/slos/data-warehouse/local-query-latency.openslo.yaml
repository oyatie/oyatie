apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-query-latency
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-warehouse
  description: Interactive warehouse query latency for warehouse pipeline scheduling, SLA-tier enforcement, dimensional completeness, query serving, and lineage operations.
  indicator:
    metadata:
      name: query-latency
      labels:
        domain_object: WarehouseDataset
        operator_audience: DATA_WAREHOUSE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_query_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_query_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Interactive warehouse query latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
