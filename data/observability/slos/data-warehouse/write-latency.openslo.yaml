apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-write-latency
  labels:
    service: data-warehouse
    adr: ADR-0139
spec:
  service: data-warehouse
  indicator:
    metadata:
      name: write-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_write_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_write_latency_total[5m]))
  objectives:
    - displayName: Data Warehouse write-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
