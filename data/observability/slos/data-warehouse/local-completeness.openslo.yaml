apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-completeness
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: data-warehouse
  description: Warehouse partitions complete against source totals for warehouse pipeline scheduling, SLA-tier enforcement, dimensional completeness, query serving, and lineage operations.
  indicator:
    metadata:
      name: completeness
      labels:
        domain_object: WarehouseDataset
        operator_audience: DATA_WAREHOUSE_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_completeness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_completeness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Warehouse partitions complete against source totals
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
