apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-federated-query-overhead
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-039
    wave: Wave-15A
spec:
  description: |
    Federated (BigLake-class / external-table) query overhead. p99
    overhead ≤ 20% over an equivalent native scan of the same bytes.
    Per-cloud overhead may exceed 20% on cross-cloud reads; SLO grades
    same-cloud reads.
  service: data-warehouse
  indicator:
    metadata:
      name: federated-query-overhead
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_federated_overhead_under_20pct_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_federated_query_total[5m]))
  objectives:
    - displayName: p99 federated overhead under 20% vs native
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
