apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-cmk-key-rotation-completion
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-024
    wave: Wave-15A
spec:
  description: |
    CMK/BYOK key rotation completion latency. 99% of tenant-requested
    rotations complete within 24 hours of the rotation request. Re-encrypt
    is asynchronous; tenant sees a 'rotation_completed' event when the new
    key reference covers all storage_bytes accrued at request time.
  service: data-warehouse
  indicator:
    metadata:
      name: cmk-key-rotation-completion
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_key_rotation_completed_within_24h_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_key_rotation_requested_total[5m]))
  objectives:
    - displayName: key rotation completes within 24h in 99% of cases
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
