apiVersion: openslo/v1
kind: SLO
metadata:
  name: data-warehouse-vector-search-latency
  labels:
    service: data-warehouse
    adr: ADR-0329
    ip: IP-038
    wave: Wave-15A
spec:
  description: |
    Vector similarity search latency. Top-10 search on a 1M vector
    index, p99 ≤ 50ms. Larger indexes degrade gracefully; SLO bucket
    measures the 1M class.
  service: data-warehouse
  indicator:
    metadata:
      name: vector-search-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_vector_search_under_50ms_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(data_warehouse_vector_search_total[5m]))
  objectives:
    - displayName: p99 vector top-10 search on 1M-vector index under 50ms
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
