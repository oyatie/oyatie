apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-tenant-bootstrap-latency
  displayName: "Analytics Tenant Bootstrap Latency"
  labels:
    microservice: analytics
    surface: tenant-bootstrap
    adr: "ADR-0145,ADR-0193"
spec:
  service: analytics
  description: |
    99% of `tenant.onboarded` events result in a created tenant database within 30 seconds.
  indicator:
    metadata: { name: tenant-bootstrap-onboard-latency-p99 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_tenant_bootstrap_duration_seconds_bucket{
                  operation="onboard",le="30"
                }[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_tenant_bootstrap_duration_seconds_count{
                  operation="onboard"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 < 30s"
      target: 0.99
  alertPolicies:
    - name: tenant-bootstrap-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets: [{ target: pagerduty-analytics }]
    - name: tenant-bootstrap-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: tenant-bootstrap-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: tenant-bootstrap-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
