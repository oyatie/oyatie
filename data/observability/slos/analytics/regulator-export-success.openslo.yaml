apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-regulator-export-success-rate
  displayName: "Analytics Regulator Export Success Rate"
  labels:
    microservice: analytics
    surface: regulator-export
    adr: "ADR-0038,ADR-0193"
spec:
  service: analytics
  description: |
    99.9% of regulator-export requests complete successfully (manifest produced,
    cosign signature attached, NDJSON stream delivered). Failures are quota,
    cosign-key, or S3 issues.
  indicator:
    metadata: { name: regulator-export-success-rate }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_regulator_export_completed_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_regulator_export_completed_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.9% success"
      target: 0.999
  alertPolicies:
    - name: regulator-export-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets: [{ target: pagerduty-analytics }]
    - name: regulator-export-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: regulator-export-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: regulator-export-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
