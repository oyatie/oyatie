apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-billing-reconciliation
  displayName: "Analytics Billing Daily vs Monthly Reconciliation Accuracy"
  labels:
    microservice: analytics
    surface: billing-rollup
    adr: "ADR-0155,ADR-0193"
spec:
  service: analytics
  description: |
    99.99% of (tenant_id, resource_type, month) tuples have a reconciliation
    drift < 0.01% between daily-rollup sum and monthly-rollup value.
    Drift > 0.01% indicates a pipeline bug; drift > 1% pages immediately.
  indicator:
    metadata: { name: billing-reconciliation-drift }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(analytics_billing_reconcile_within_tolerance_total)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(analytics_billing_reconcile_total)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.99% within 0.01% drift"
      target: 0.9999
  alertPolicies:
    - name: billing-reconcile-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets: [{ target: pagerduty-analytics }]
    - name: billing-reconcile-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: billing-reconcile-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: billing-reconcile-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
