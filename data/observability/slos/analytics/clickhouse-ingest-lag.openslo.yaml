apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-clickhouse-ingest-lag
  displayName: "Analytics ClickHouse Ingest Lag"
  labels:
    microservice: analytics
    substrate: clickhouse
    adr: "ADR-0193,ADR-0195"
spec:
  service: analytics
  description: |
    99% of MV ingest events project from outbox emit to target-table visibility
    within 5 seconds (p99). Source: per-µservice outbox via Pulsar; target:
    AggregatingMergeTree tenant tables.
  indicator:
    metadata:
      name: clickhouse-ingest-lag-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_mv_lag_seconds_bucket{le="5"}[5m])) by (cluster)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(analytics_mv_lag_seconds_count[5m])) by (cluster)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 < 5s"
      target: 0.99
  alertPolicies:
    - name: analytics-clickhouse-ingest-lag-burnrate-fastburn
      kind: AlertPolicy
      spec:
        description: "fast burn — 14.4x in 1h"
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 2m
        notificationTargets:
          - target: pagerduty-analytics
          - target: opsgenie-analytics
    - name: analytics-clickhouse-ingest-lag-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        description: "medium burn — 6x in 6h"
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec:
              op: gte
              threshold: 6.0
              lookbackWindow: 6h
              alertAfter: 15m
    - name: analytics-clickhouse-ingest-lag-burnrate-slowburn
      kind: AlertPolicy
      spec:
        description: "slow burn — 3x in 1d"
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec:
              op: gte
              threshold: 3.0
              lookbackWindow: 1d
              alertAfter: 1h
    - name: analytics-clickhouse-ingest-lag-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        description: "trickle — 1x in 3d"
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec:
              op: gte
              threshold: 1.0
              lookbackWindow: 3d
              alertAfter: 6h
