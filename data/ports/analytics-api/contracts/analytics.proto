// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// Oyatie Analytics µservice — gRPC contract.
// Authority: ADR-0193, ADR-0145 inter-µservice communication.
// Tier-A 4-INV: idempotency keys, cursor pagination, X-Request-Id, OTel-friendly.

syntax = "proto3";

package oyatie.analytics.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/oyatie/analytics-sdk-go/v1;analyticsv1";
option java_multiple_files = true;
option java_package = "co.oyatie.analytics.v1";

service AnalyticsService {
  // Tenant dashboards.
  rpc GetWorkflowExecutionDashboard(GetWorkflowExecutionDashboardRequest) returns (GetWorkflowExecutionDashboardResponse);
  rpc GetBillingRollup(GetBillingRollupRequest) returns (GetBillingRollupResponse);
  // Audit log search.
  rpc SearchAuditLog(SearchAuditLogRequest) returns (SearchAuditLogResponse);
  // Regulator export — streaming.
  rpc StreamRegulatorExport(StreamRegulatorExportRequest) returns (stream RegulatorExportRow);
}

// === Common ===

// Standard request metadata. Per ADR-0151, every request carries X-Request-Id;
// every mutation carries an Idempotency-Key.
message RequestMeta {
  string x_request_id = 1; // uuid; trace correlation
  string idempotency_key = 2; // uuid; required on mutations
  string client_user_agent = 3; // e.g. "oyatie-sdk/go/1.2.3"
}

message PageInfo {
  string next_cursor = 1; // opaque, HMAC-signed (ADR-0150)
  bool has_more = 2;
}

message Error {
  string code = 1; // one of: bad_request, unauthorized, forbidden, not_found,
                   //         quota_exceeded, conflict, internal, unavailable
  string message = 2;
  string request_id = 3;
}

// === Workflow execution dashboard ===

message GetWorkflowExecutionDashboardRequest {
  RequestMeta meta = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string cursor = 4;
  int32 page_size = 5; // default 50, max 500
}

message WorkflowExecutionBucket {
  google.protobuf.Timestamp hour = 1;
  string tenant_id = 2;
  int64 run_count = 3;
  int32 duration_p50_ms = 4;
  int32 duration_p95_ms = 5;
  int32 duration_p99_ms = 6;
  int64 error_count = 7;
}

message GetWorkflowExecutionDashboardResponse {
  repeated WorkflowExecutionBucket data = 1;
  PageInfo page_info = 2;
}

// === Billing rollup ===

message GetBillingRollupRequest {
  RequestMeta meta = 1;
  // ISO date strings (YYYY-MM-DD); date semantics rather than timestamp.
  string from_date = 2;
  string to_date = 3;
  string cursor = 4;
  int32 page_size = 5;
}

message BillingRollupRow {
  string day = 1;
  string tenant_id = 2;
  string resource_type = 3;
  int64 count = 4;
}

message GetBillingRollupResponse {
  repeated BillingRollupRow data = 1;
  PageInfo page_info = 2;
}

// === Audit log search ===

enum Axis {
  AXIS_UNSPECIFIED = 0;
  AXIS_ALL = 1;
  AXIS_AUTH = 2;
  AXIS_WORKFLOW = 3;
  AXIS_BILLING = 4;
  AXIS_TENANCY = 5;
  AXIS_COMPLIANCE = 6;
}

message SearchAuditLogRequest {
  RequestMeta meta = 1;
  Axis axis = 2;
  string event_type = 3;        // optional filter
  string principal_id = 4;      // optional filter
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  string cursor = 7;
  int32 page_size = 8;
}

message AuditLogEntry {
  string event_id = 1; // uuid
  google.protobuf.Timestamp emitted_at = 2;
  string tenant_id = 3;
  Axis axis = 4;
  string event_type = 5;
  string principal_id = 6;
  string evidence_ref = 7;
  string payload_hash = 8; // SHA-256 of redacted payload
}

message SearchAuditLogResponse {
  repeated AuditLogEntry data = 1;
  PageInfo page_info = 2;
}

// === Regulator export (streaming) ===

message StreamRegulatorExportRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  repeated Axis axes = 5; // empty = all
}

message RegulatorExportManifest {
  string pack_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp generated_at = 3;
  string cosign_signature_b64 = 4;
  int64 row_count = 5;
}

message RegulatorExportRow {
  oneof envelope {
    RegulatorExportManifest manifest = 1; // first message in stream
    AuditLogEntry row = 2;
  }
}
