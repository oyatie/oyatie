asyncapi: 3.1.0
info:
  title: oya-ontology events
  version: 1.0.0
  description: |
    Async event surface emitted by the Ontology µservice via Kafka KRaft outbox.
    Every Object Type write, Link Type write, Action invocation, and Function
    Type registration emits one or more typed events here.

    Consumers: workflow (event router), audit-chain (cross-µservice Merkle seal),
    observability (Object Type metric emission), per-tenant subscribers via the
    SDK.

defaultContentType: application/json

servers:
  kafka-pack-kr:
    host: kr-kafka.ontology.oyatie.com:9093
    protocol: kafka-secure
    description: pack-kr Kafka outbox broker
  kafka-pack-eu:
    host: eu-kafka.ontology.oyatie.com:9093
    protocol: kafka-secure
    description: pack-eu Kafka outbox broker

channels:
  ontology.events.object-type-registered:
    address: ontology.events.object-type-registered.v1
    messages:
      ObjectTypeRegistered:
        $ref: '#/components/messages/ObjectTypeRegistered'

  ontology.events.object-instance-mutated:
    address: ontology.events.object-instance-mutated.v1
    messages:
      ObjectInstanceMutated:
        $ref: '#/components/messages/ObjectInstanceMutated'

  ontology.events.link-type-registered:
    address: ontology.events.link-type-registered.v1
    messages:
      LinkTypeRegistered:
        $ref: '#/components/messages/LinkTypeRegistered'

  ontology.events.action-type-registered:
    address: ontology.events.action-type-registered.v1
    messages:
      ActionTypeRegistered:
        $ref: '#/components/messages/ActionTypeRegistered'

  ontology.events.action-type-invoked:
    address: ontology.events.action-type-invoked.v1
    messages:
      ActionTypeInvoked:
        $ref: '#/components/messages/ActionTypeInvoked'

  ontology.events.audit-chain-sealed:
    address: ontology.events.audit-chain-sealed.v1
    messages:
      AuditChainSealed:
        $ref: '#/components/messages/AuditChainSealed'

  ontology.events.cross-pillar-grant-requested:
    address: ontology.events.cross-pillar-grant-requested.v1
    messages:
      CrossPillarGrantRequested:
        $ref: '#/components/messages/CrossPillarGrantRequested'

  ontology.events.cross-pillar-grant-issued:
    address: ontology.events.cross-pillar-grant-issued.v1
    messages:
      CrossPillarGrantIssued:
        $ref: '#/components/messages/CrossPillarGrantIssued'

  ontology.events.schema-migration-completed:
    address: ontology.events.schema-migration-completed.v1
    messages:
      SchemaMigrationCompleted:
        $ref: '#/components/messages/SchemaMigrationCompleted'

  ontology.events.dsr-erasure-executed:
    address: ontology.events.dsr-erasure-executed.v1
    messages:
      DsrErasureExecuted:
        $ref: '#/components/messages/DsrErasureExecuted'

operations:
  publishObjectTypeRegistered:
    action: send
    channel:
      $ref: '#/channels/ontology.events.object-type-registered'

  publishObjectInstanceMutated:
    action: send
    channel:
      $ref: '#/channels/ontology.events.object-instance-mutated'

  publishActionTypeInvoked:
    action: send
    channel:
      $ref: '#/channels/ontology.events.action-type-invoked'

  publishAuditChainSealed:
    action: send
    channel:
      $ref: '#/channels/ontology.events.audit-chain-sealed'

  publishCrossPillarGrantIssued:
    action: send
    channel:
      $ref: '#/channels/ontology.events.cross-pillar-grant-issued'

components:
  messages:
    ObjectTypeRegistered:
      summary: A new Object Type schema was registered (or amended)
      payload:
        type: object
        required: [event_id, occurred_at, tenant_id, object_type, schema_version, pillar_kind]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          tenant_id: {type: string, description: "scope: tenant:oya-self for global schema or tenant-specific"}
          object_type: {type: string}
          schema_version: {type: integer}
          pillar_kind: {type: string, enum: [org, person]}
          property_count: {type: integer}
          deprecated: {type: boolean, default: false}
          audit_chain_ref: {type: string}

    ObjectInstanceMutated:
      summary: An Object Type instance was created, updated, or tombstoned
      payload:
        type: object
        required: [event_id, occurred_at, tenant_id, object_type, object_id, operation, audit_chain_ref]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          tenant_id: {type: string}
          jurisdiction: {type: string}
          object_type: {type: string}
          object_id: {type: string, format: uuid}
          operation: {type: string, enum: [created, updated, tombstoned]}
          actor_principal: {type: string}
          schema_version: {type: integer}
          properties_diff: {type: object, additionalProperties: true, description: "Sparse diff; only changed properties"}
          audit_chain_ref: {type: string}

    LinkTypeRegistered:
      summary: A new Link Type schema was registered
      payload:
        type: object
        required: [event_id, occurred_at, link_type, src_object_type, dst_object_type, cardinality]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          link_type: {type: string}
          src_object_type: {type: string}
          dst_object_type: {type: string}
          cardinality: {type: string, enum: [one-to-one, one-to-many, many-to-many]}
          tenant_scope: {type: string, enum: [same-tenant-only, cross-tenant-allowed-with-grant]}

    ActionTypeRegistered:
      summary: A new Action Type schema was registered
      payload:
        type: object
        required: [event_id, occurred_at, action_type, required_tier, cedar_fragment]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          action_type: {type: string}
          effects: {type: array, items: {type: string}}
          required_tier: {type: string}
          cedar_fragment: {type: string}
          autonomy_tier_ceiling: {type: string}

    ActionTypeInvoked:
      summary: An Action Type was invoked
      payload:
        type: object
        required: [event_id, occurred_at, action_id, action_type, tenant_id, actor_principal, outcome, audit_chain_ref]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          action_id: {type: string, format: uuid}
          action_type: {type: string}
          tenant_id: {type: string}
          actor_principal: {type: string}
          autonomy_tier_used: {type: string, nullable: true}
          object_ids: {type: array, items: {type: string, format: uuid}}
          link_ids: {type: array, items: {type: string, format: uuid}}
          idempotency_key: {type: string, nullable: true}
          outcome: {type: string, enum: [success, denied, error]}
          denial_reason: {type: string, nullable: true}
          cedar_decision_ref: {type: string}
          audit_chain_ref: {type: string}

    AuditChainSealed:
      summary: A new audit-chain Merkle segment was sealed
      payload:
        type: object
        required: [event_id, occurred_at, tenant_id, period_start, period_end, merkle_root, signature, signer_key_id, event_count]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          tenant_id: {type: string}
          period_start: {type: string, format: date-time}
          period_end: {type: string, format: date-time}
          merkle_root: {type: string}
          signature: {type: string, description: "Ed25519 base64"}
          signer_key_id: {type: string}
          event_count: {type: integer}

    CrossPillarGrantRequested:
      summary: A principal requested a cross-pillar grant (org → person or person → org)
      payload:
        type: object
        required: [event_id, occurred_at, request_id, principal, requested_pillars, requested_until, requester_signature]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          request_id: {type: string, format: uuid}
          principal: {type: string}
          requested_pillars: {type: array, items: {type: string, enum: [org, person]}}
          requested_until: {type: string, format: date-time}
          data_class_cap: {type: string}
          rationale: {type: string}
          requester_signature: {type: string}

    CrossPillarGrantIssued:
      summary: A cross-pillar grant was issued (2-person signed)
      payload:
        type: object
        required: [event_id, occurred_at, grant_id, principal, allowed_pillars, expires_at, signed_by, audit_chain_ref]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          grant_id: {type: string, format: uuid}
          principal: {type: string}
          allowed_pillars: {type: array, items: {type: string}}
          data_class_cap: {type: string}
          expires_at: {type: string, format: date-time}
          signed_by: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
          audit_chain_ref: {type: string}

    SchemaMigrationCompleted:
      summary: An Object Type / Link Type / Action Type / Function Type migration finished backfill
      payload:
        type: object
        required: [event_id, occurred_at, schema_id, prev_version, new_version, backfilled_count, audit_chain_ref]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          schema_id: {type: string}
          schema_kind: {type: string, enum: [object_type, link_type, action_type, function_type]}
          prev_version: {type: integer}
          new_version: {type: integer}
          backfilled_count: {type: integer}
          tenant_scope: {type: string, description: "tenant:oya-self if global; otherwise per-tenant"}
          audit_chain_ref: {type: string}

    DsrErasureExecuted:
      summary: A DSR (right-to-erasure) cascade completed for a subject
      payload:
        type: object
        required: [event_id, occurred_at, dsr_request_id, tenant_id, subject_hash, removed_object_type_count, executed_at, audit_chain_ref]
        properties:
          event_id: {type: string, format: uuid}
          occurred_at: {type: string, format: date-time}
          dsr_request_id: {type: string, format: uuid}
          tenant_id: {type: string}
          subject_hash: {type: string}
          removed_object_type_count: {type: integer}
          residual_object_types: {type: array, items: {type: string}, description: "Object Types that could not be tombstoned within SLA"}
          completeness_manifest_hash: {type: string}
          executed_at: {type: string, format: date-time}
          audit_chain_ref: {type: string}
