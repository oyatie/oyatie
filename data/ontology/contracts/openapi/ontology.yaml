openapi: 3.2.0
info:
  title: oya-ontology
  version: 1.0.0
  summary: REST API for the ontology µservice — Object Type / Link Type / Action Type / Function Type CRUD + query + agent gateway
  description: |
    Tenant-facing + operator-facing REST surface for the Ontology µservice. All endpoints
    require OIDC + Cedar policy authorization (per `microservices/ontology/policy/*.cedar`)
    and are tenant-scoped via X-Tenant-Id header (which is matched against the JWT
    tenant_id claim by middleware before request reaches handler).

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries: tenant_id, max_sensitivity_level, pillar_kind, autonomy_tier (for agent JWTs).
    X-Tenant-Id header MUST match the JWT tenant_id claim; mismatch returns 401.
  contact:
    name: axis-ontology
    url: https://oyatie.com/teams/axis-ontology
  license:
    name: Internal
servers:
  - url: https://ontology-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: ontology
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    AgentJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: LLM agent JWT carrying autonomy_tier claim
  parameters:
    XTenantId:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{32}$'
      description: salted-tenant-id per `policy/type-isolation.md`
    ObjectTypeName:
      in: path
      name: object_type
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    LinkTypeName:
      in: path
      name: link_type
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    ActionTypeName:
      in: path
      name: action_type
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    FunctionTypeName:
      in: path
      name: function_type
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    ObjectId:
      in: path
      name: object_id
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
  schemas:
    PropertyDescriptor:
      type: object
      required: [name, type, property_sensitivity_level, data_class]
      properties:
        name: {type: string}
        type:
          type: string
          enum: [scalar, vector, timeseries, geo, ciphertext, struct]
        property_sensitivity_level:
          type: string
          enum: [Tier1Sensitive, Tier2Restricted, Tier3Internal, Tier4Public]
        data_class: {type: string}
        index_strategy: {type: string, nullable: true}
        nullable: {type: boolean, default: false}
        default: {nullable: true}
    ObjectTypeSchema:
      type: object
      required: [name, pillar_kind, properties, schema_version, jurisdiction_overlay]
      properties:
        name: {type: string}
        pillar_kind: {type: string, enum: [org, person]}
        properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyDescriptor'}
        schema_version: {type: integer, minimum: 1}
        jurisdiction_overlay:
          type: object
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/PropertyDescriptor'}
        deprecated: {type: boolean, default: false}
        deprecated_at: {type: string, format: date-time, nullable: true}
        successor: {type: string, nullable: true}
    LinkTypeSchema:
      type: object
      required: [name, src_object_type, dst_object_type, cardinality, traversal_direction]
      properties:
        name: {type: string}
        src_object_type: {type: string}
        dst_object_type: {type: string}
        cardinality:
          type: string
          enum: [one-to-one, one-to-many, many-to-many]
        traversal_direction:
          type: string
          enum: [forward, reverse, bidirectional]
        tenant_scope:
          type: string
          enum: [same-tenant-only, cross-tenant-allowed-with-grant]
          default: same-tenant-only
    ActionTypeSchema:
      type: object
      required: [name, effects, idempotency, required_tier, cedar_fragment, audit_emission]
      properties:
        name: {type: string}
        effects:
          type: array
          items:
            type: string
            enum: [write_object, write_link, side_effect_external, emit_event]
        idempotency: {type: string, enum: [required, optional, not_supported]}
        required_tier:
          type: string
          enum: [Tier1Sensitive, Tier2Restricted, Tier3Internal, Tier4Public]
        cedar_fragment: {type: string, description: "path to fragment under policy/"}
        audit_emission: {type: boolean, default: true}
        autonomy_tier_ceiling:
          type: string
          enum: [observation, recommendation, action, full-autonomy]
    FunctionTypeSchema:
      type: object
      required: [name, query_dsl, result_shape, cache_ttl_seconds, max_memory_projection_mb]
      properties:
        name: {type: string}
        query_dsl: {type: string, description: "JSON-IR or embedded-Rust DSL"}
        result_shape: {type: object}
        cache_ttl_seconds: {type: integer, minimum: 0}
        max_memory_projection_mb: {type: integer, minimum: 1, maximum: 1024}
        olap: {type: boolean, default: false}
    ObjectInstance:
      type: object
      required: [object_id, object_type, tenant_id, properties, created_at]
      properties:
        object_id: {type: string, format: uuid}
        object_type: {type: string}
        tenant_id: {type: string}
        jurisdiction: {type: string}
        pillar_kind: {type: string, enum: [org, person]}
        property_sensitivity_level: {type: string, enum: [Tier1Sensitive, Tier2Restricted, Tier3Internal, Tier4Public]}
        properties: {type: object, additionalProperties: true}
        schema_version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, nullable: true}
        audit_chain_ref: {type: string, description: "Merkle node hash for the create receipt"}
    LinkInstance:
      type: object
      required: [link_id, link_type, src_object_id, dst_object_id, tenant_id]
      properties:
        link_id: {type: string, format: uuid}
        link_type: {type: string}
        src_object_id: {type: string, format: uuid}
        dst_object_id: {type: string, format: uuid}
        src_tenant_id: {type: string}
        dst_tenant_id: {type: string}
        cross_tenant_grant_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        audit_chain_ref: {type: string}
    ActionInvocationReceipt:
      type: object
      required: [action_id, action_type, tenant_id, actor_principal, outcome, executed_at, audit_chain_ref]
      properties:
        action_id: {type: string, format: uuid}
        action_type: {type: string}
        tenant_id: {type: string}
        actor_principal: {type: string, description: "SPIFFE identity or tenant operator OIDC subject"}
        object_ids: {type: array, items: {type: string, format: uuid}}
        link_ids: {type: array, items: {type: string, format: uuid}}
        idempotency_key: {type: string, nullable: true}
        outcome: {type: string, enum: [success, denied, error]}
        denial_reason: {type: string, nullable: true}
        executed_at: {type: string, format: date-time}
        cedar_decision_ref: {type: string}
        audit_chain_ref: {type: string}
        autonomy_tier_used: {type: string, nullable: true}
    FunctionResult:
      type: object
      required: [function_type, tenant_id, result, evaluated_at]
      properties:
        function_type: {type: string}
        tenant_id: {type: string}
        result: {type: array, items: {type: object, additionalProperties: true}}
        result_count: {type: integer}
        cached: {type: boolean}
        evaluated_at: {type: string, format: date-time}
        evaluator_version: {type: string}
        olap_lag_seconds: {type: number, nullable: true}
    AgentToolSpec:
      type: object
      required: [name, description, parameters, function_type, autonomy_tier_required]
      properties:
        name: {type: string}
        description: {type: string}
        parameters: {type: object}
        function_type: {type: string}
        autonomy_tier_required: {type: string}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /object-types:
    get:
      summary: List registered Object Type schemas
      operationId: listObjectTypes
      parameters: [{$ref: '#/components/parameters/XTenantId'}]
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ObjectTypeSchema'}
    post:
      summary: Register a new Object Type schema (governance-controlled; usually via PR not API)
      operationId: registerObjectType
      parameters: [{$ref: '#/components/parameters/XTenantId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObjectTypeSchema'}
      responses:
        '201': {description: created}
        '403': {description: Cedar deny}

  /object-types/{object_type}:
    get:
      summary: Read Object Type schema by name
      operationId: getObjectType
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
      responses:
        '200':
          description: Schema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectTypeSchema'}

  /object-types/{object_type}/instances:
    get:
      summary: List Object Type instances (paginated)
      operationId: listObjectInstances
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
        - {in: query, name: limit, schema: {type: integer, default: 100, maximum: 1000}}
        - {in: query, name: cursor, schema: {type: string, nullable: true}}
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ObjectInstance'}}
                  next_cursor: {type: string, nullable: true}
    post:
      summary: Create an Object Type instance
      operationId: createObjectInstance
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties: {type: object, additionalProperties: true}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectInstance'}
        '403': {description: Cedar deny}

  /object-types/{object_type}/instances/{object_id}:
    get:
      summary: Read one Object Type instance
      operationId: getObjectInstance
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
        - {$ref: '#/components/parameters/ObjectId'}
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectInstance'}
        '403': {description: Cedar deny}
        '404': {description: Not found / RLS-scoped out}
    patch:
      summary: Update an Object Type instance
      operationId: updateObjectInstance
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
        - {$ref: '#/components/parameters/ObjectId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectInstance'}
    delete:
      summary: Tombstone an Object Type instance (DSR-aware; soft-delete + 30d grace)
      operationId: deleteObjectInstance
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ObjectTypeName'}
        - {$ref: '#/components/parameters/ObjectId'}
      responses:
        '204': {description: Tombstoned}

  /link-types:
    get:
      summary: List Link Type schemas
      operationId: listLinkTypes
      parameters: [{$ref: '#/components/parameters/XTenantId'}]
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LinkTypeSchema'}

  /link-types/{link_type}/instances:
    post:
      summary: Create a Link Type instance
      operationId: createLinkInstance
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/LinkTypeName'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                src_object_id: {type: string, format: uuid}
                dst_object_id: {type: string, format: uuid}
                cross_tenant_grant_id: {type: string, nullable: true}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkInstance'}
        '403': {description: Cedar deny + cross-tenant-link refused}

  /link-types/{link_type}/traversals/{src_object_id}:
    get:
      summary: Traverse Link Type from a src Object instance
      operationId: traverseLink
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/LinkTypeName'}
        - {in: path, name: src_object_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: depth, schema: {type: integer, default: 1, maximum: 5}}
      responses:
        '200':
          description: Traversal
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ObjectInstance'}

  /action-types:
    get:
      summary: List Action Type schemas
      operationId: listActionTypes
      parameters: [{$ref: '#/components/parameters/XTenantId'}]
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActionTypeSchema'}

  /action-types/{action_type}/invocations:
    post:
      summary: Invoke an Action Type (Cedar-gated; audit-sealed; transaction-receipt-emitted)
      operationId: invokeAction
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/ActionTypeName'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Invocation result (with receipt)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionInvocationReceipt'}
        '403': {description: Cedar deny}
        '409': {description: Idempotency conflict}

  /function-types/{function_type}/evaluations:
    post:
      summary: Evaluate a Function Type (read-only; Cedar-gated; tier-filtered result)
      operationId: evaluateFunction
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {$ref: '#/components/parameters/FunctionTypeName'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments: {type: object, additionalProperties: true}
                use_olap: {type: boolean, default: false}
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FunctionResult'}
        '403': {description: Cedar deny}
        '429': {description: Per-tenant rate limit}

  /audit-chain/{tenant_id}/{period}:
    get:
      summary: Read audit-chain Merkle root for a (tenant, period) tuple
      operationId: getAuditChainMerkle
      parameters:
        - {$ref: '#/components/parameters/XTenantId'}
        - {in: path, name: tenant_id, required: true, schema: {type: string}}
        - {in: path, name: period, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Merkle root + signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  merkle_root: {type: string}
                  signature: {type: string}
                  signer_key_id: {type: string}
                  sealed_at: {type: string, format: date-time}
                  event_count: {type: integer}

  /agent/tool-specs:
    get:
      summary: List agent gateway tool specs (auto-generated from Function Type schemas)
      operationId: listAgentToolSpecs
      security: [{AgentJWT: []}]
      responses:
        '200':
          description: List of OpenAI-compatible tool-specs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentToolSpec'}

  /agent/tool-call:
    post:
      summary: Dispatch an agent tool-call (Cedar autonomy_tier ceiling enforced)
      operationId: invokeAgentToolCall
      security: [{AgentJWT: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_name: {type: string}
                arguments: {type: object, additionalProperties: true}
                session_id: {type: string}
      responses:
        '200':
          description: Function result returned to LLM
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FunctionResult'}
        '403': {description: autonomy_tier insufficient OR Cedar deny}
        '429': {description: per-LLM-session rate limit}

  /openapi.yaml:
    get:
      summary: Public OpenAPI specification (anonymous; no auth)
      operationId: getOpenApiSpec
      security: []
      responses:
        '200':
          description: OpenAPI 3.2 YAML
          content:
            application/yaml:
              schema: {type: string}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres + Cedar reachable + schema registry warm)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
