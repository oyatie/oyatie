# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
apiVersion: foundry.oya.dev/v1
kind: Capability
metadata:
  name: ontology-cedar-evaluate
  microservice: ontology
  bounded_context: cedar-fragment-coverage
  status: stable
  date: 2026-05-17
spec:
  intent: |
    Evaluate a Cedar v4 policy decision for a given (principal, action, resource,
    context) tuple. This is the policy primitive every Ontology Action Type
    invocation goes through; default-deny baseline is the load-bearing safety net.

  input:
    principal:
      type: object  # carries tenant_id, max_sensitivity_level, pillar_kind, autonomy_tier, cross_pillar_grants
    action:
      type: object  # Action::"action-type-name"
    resource:
      type: object  # carries tenant_id, property_sensitivity_level, pillar_kind, data_class
    context:
      type: object  # now, request_id, agent_session_id (if agent-gateway dispatch)

  preconditions:
    - "Cedar v4 SDK loaded in-process"
    - "Cedar fragments hot-loaded by cedar-fragment-coverage worker"
    - "Per-Action permit fragment exists OR the action is implicitly permitted by the default-deny baseline (impossible — every Action has explicit permit)"

  output:
    decision:
      enum: [permit, forbid]
    diagnostics:
      type: array
      items: {type: string}
    cedar_decision_ref:
      type: string  # for audit-chain emission

  performance_targets:
    p50: 1ms
    p99: 10ms
    p999: 25ms (hard cap; engine timeout)

  side_effects:
    - "audit-chain emit for any deny on a Tier1 or Tier2 resource"
    - "oya_ontology_cedar_deny_total counter incremented"

  authority:
    enforcement_lane: oya-governance-cedar-coverage
    cedar_fragment: policy/{tenant-scope,ci-scope,auditor-scope,public-read,pillar}.cedar
    perf_lane: oya-governance-perf-budget

  failure_modes:
    - "FM-06 (Cedar runaway / pathological) — runbook: runbooks/cedar-fragment-rollback.md"
    - "Forged permit (security incident) — runbook: runbooks/cross-tenant-leak-recovery.md"

  observability:
    metrics:
      - "oya_ontology_cedar_evaluations_total{decision}"
      - "oya_ontology_cedar_evaluation_duration_seconds{quantile}"
      - "oya_ontology_cedar_deny_total{deny_reason}"
      - "oya_ontology_cedar_fragment_hash{fragment}"
    dashboards:
      - dashboards/cedar-policy-coverage.json

  source_evidence:
    - "ADR-0140 (retired per ADR-0145) (Cedar policy enforcement)"
    - "AWS Cedar v4 — cedarpolicy.com"
    - "Bominal ADR-0107 (autonomy_tier_ceiling)"
