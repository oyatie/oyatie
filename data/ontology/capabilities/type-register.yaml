# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
apiVersion: foundry.oya.dev/v1
kind: Capability
metadata:
  name: ontology-type-register
  microservice: ontology
  bounded_context: object-type-registry
  status: stable
  date: 2026-05-17
spec:
  intent: |
    Register or amend an Object Type / Link Type / Action Type / Function Type
    schema in the Ontology registry. This is the governance-controlled entry
    point through which every Oyatie µservice declares the typed entities it
    persists.

  input:
    schema_kind:
      enum: [object_type, link_type, action_type, function_type]
    schema_definition:
      oneOf:
        - $ref: "../contracts/openapi/ontology.yaml#/components/schemas/ObjectTypeSchema"
        - $ref: "../contracts/openapi/ontology.yaml#/components/schemas/LinkTypeSchema"
        - $ref: "../contracts/openapi/ontology.yaml#/components/schemas/ActionTypeSchema"
        - $ref: "../contracts/openapi/ontology.yaml#/components/schemas/FunctionTypeSchema"

  preconditions:
    - "Cedar permit from policy/ci-scope.cedar for principal Service::\"ontology-schema-propagation-worker\""
    - "PR-merged definition under microservices/ontology/specs/<schema_kind>s/<name>.json"
    - "LEAN lane oya-governance-ontology-tier-enforcement exit 0"
    - "LEAN lane oya-governance-cedar-coverage exit 0 (for action_type)"

  output:
    success:
      registered_schema:
        $ref: "..."
      audit_chain_ref:
        type: string

  side_effects:
    - "Postgres schema_registry table updated"
    - "Valkey cache invalidated for the schema kind"
    - "Kafka outbox emits <SchemaKind>Registered event"
    - "audit-chain Merkle node appended; sealed in the next 60s window"

  authority:
    enforcement_lane: oya-governance-ontology-tier-enforcement
    cedar_fragment: policy/ci-scope.cedar
    audit_emission: oya-governance-audit-chain-emission

  failure_modes:
    - "FM-04 (schema corruption) — registry transaction failure; runbook: runbooks/type-registry-migration.md"
    - "Schema validation failure — returns 422 with per-field errors"
    - "CrossPillarGrant required but not present (for cross-pillar property reads in the schema)"

  observability:
    metrics:
      - "oya_ontology_type_registry_writes_total{schema_kind,outcome}"
      - "oya_ontology_type_registry_validation_failures_total{schema_kind,error_type}"
    dashboards:
      - dashboards/type-registry-health.json

  source_evidence:
    - "Bominal ADR-0106 (Ontology architecture)"
    - "ADR-0006 (Ontology typed-entity layer)"
    - "Palantir Foundry Ontology Object Type registration model"
