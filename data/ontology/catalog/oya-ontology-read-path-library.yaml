apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-ontology-read-path-library
  namespace: ontology
spec:
  microservice: ontology
  bounded_context: read-path-library
  layer: kernel
  language: rust
  publish_target: crates-internal
  consumer_pattern: library-first
  binding_adrs:
    - ADR-0257
    - ADR-0246
  freshness_floor_enum:
    - STRICT_REALTIME
    - TIGHT
    - LOOSE
    - EVENTUAL
  cache_eviction_policy: LRU_BY_TENANT
  api_surface:
    - "read_entity(tenant_id, entity_type, entity_id) -> Result<Entity>"
    - "read_relationship(tenant_id, src, dst, type) -> Result<Relationship>"
    - "query(tenant_id, cedar_ctx, query) -> Result<Vec<Entity>>"
  emits_audit_classes:
    - oya.ontology.read-path-library-load
    - oya.ontology.read-path-fallback-network
  test_coverage:
    line_floor: 0.85
    branch_floor: 0.75
  semver_policy: ADR-0258
