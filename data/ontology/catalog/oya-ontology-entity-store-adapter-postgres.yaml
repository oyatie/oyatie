# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
apiVersion: catalog.oya.dev/v1
kind: Crate
metadata:
  name: oya-ontology-entity-store-adapter-postgres
  microservice: ontology
  bounded_context: entity-store
  layer: adapter
  backend: postgres
  status: pending
spec:
  bnf_v4_1_justification: |
    microservice = ontology; bc-tokens = entity-store; layer = adapter-postgres
    (per ADR-0105 Amendment 3 *-adapter-<backend> pattern).
    Postgres 16 + Citus 12 impl with FORCE ROW LEVEL SECURITY;
    app.tenant_id session variable bound from JWT claim;
    Citus tenant_id-sharded; outbox emit per ADR-0050.
  imports: [oya-ontology-entity-store-usecase, oya-ontology-entity-store-domain, oya-ontology-entity-store-kernel]
  external_deps: [sqlx, citus-postgres]
  rls_enabled: true
  shard_key: tenant_id
  related_ip: IP-004
  related_adrs: [ADR-0050, ADR-0105, ADR-0106]
