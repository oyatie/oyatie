# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
apiVersion: catalog.oya.dev/v1
kind: Crate
metadata:
  name: oya-ontology-app
  microservice: ontology
  bounded_context: cross-bc
  layer: app
  status: pending
spec:
  bnf_v4_1_justification: |
    microservice = ontology; layer = app. Composition-root binary wiring
    usecase + adapter + rest + worker for every BC. One binary per
    deployment; multi-BC binary to reduce pod count at small scale.
    Composition-root only; wiring-only; no business logic.
  imports: [
    oya-ontology-object-type-registry-app,
    oya-ontology-link-type-registry-app,
    oya-ontology-action-type-registry-app,
    oya-ontology-function-type-registry-app,
    oya-ontology-entity-store-app,
    oya-ontology-link-store-app,
    oya-ontology-function-engine-app,
    oya-ontology-action-engine-app,
    oya-ontology-query-engine-app,
    oya-ontology-agent-gateway-app,
    oya-ontology-audit-chain-app
  ]
  test_coverage_threshold: {line: 60}
  related_ip: IP-015
