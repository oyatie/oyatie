# Secret bindings via External Secrets Operator + OpenBao backend
# Authority: ADR-0296 library-first credential sidecar; ADR-0255 §D-4

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ontology-openbao
spec:
  provider:
    vault:
      server: https://openbao.oyatie-internal.example:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ontology
          serviceAccountRef:
            name: ontology-app
            namespace: ontology
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ontology-audit-signing-key
  namespace: ontology
spec:
  refreshInterval: 60s  # ≤60s OpenBao TTL per ADR-0296
  secretStoreRef:
    name: ontology-openbao
    kind: ClusterSecretStore
  target:
    name: ontology-audit-signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ontology/audit-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ontology-share-token-signing-key
  namespace: ontology
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: ontology-openbao
    kind: ClusterSecretStore
  target:
    name: ontology-share-token-signing-key
  dataFrom:
    - extract:
        key: ontology/share-token-signing-key
