# Edge WAF + bot-management config — Cloudflare-style schema
# Authority: ADR-0297 abuse-defence baseline
# Authority: docs/standards/documentation-rigor.md §3.2.3
# UX-floor: ≤2ms default-path latency; passive bot scoring only.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: ontology-edge-waf
  namespace: ontology
spec:
  routes:
    - path: /v1/ontology/entities/*
      action: read
      rate_limit:
        per_ip_per_minute: 600
        per_tenant_per_minute_default: 6000
        per_tenant_per_minute_tier_1: 60000
        per_tenant_per_minute_tier_2: 600000
        burst_multiplier: 1.5
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        threshold_block: 99
        friendly_crawler_allowlist:
          - googlebot
          - bingbot
          - applebot
          - duckduckbot
          - axiosbot
    - path: /v1/ontology/queries
      action: read_complex
      rate_limit:
        per_ip_per_minute: 60
        per_tenant_per_minute_default: 600
        per_tenant_per_minute_tier_1: 6000
        burst_multiplier: 1.2
      bot_management:
        mode: passive_score
        threshold_challenge: 95
    - path: /v1/ontology/types
      action: write
      rate_limit:
        per_ip_per_minute: 6
        per_tenant_per_minute_default: 60
      bot_management:
        mode: enforce_passkey_only

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  fingerprinting:
    ja4: enabled
    ja4_plus: enabled
    http2_frame_pattern: enabled
    http3_frame_pattern: enabled
    mode: passive

  device_attestation:
    app_attest: enabled
    play_integrity: enabled
    webauthn_origin_binding: enabled

  anti_scrape:
    pattern_anomaly_detection: enabled
    sequential_id_detection: enabled
    breadth_first_traversal_detection: enabled
    parallel_tab_detection: enabled

  audit:
    emit_class: oya.ontology.abuse-defence-block
    emit_class_allow: oya.ontology.abuse-defence-allow
    emit_class_recalibrate: oya.ontology.abuse-defence-recalibrate-complete
    sampling: full
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
    false_positive_metric: oya_ontology_abuse_defence_false_positive_rate
    blocked_bot_metric: oya_ontology_abuse_defence_blocked_total
