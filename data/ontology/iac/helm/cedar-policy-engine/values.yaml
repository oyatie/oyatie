# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
## Ontology Cedar policy engine values
## Cross-references microservices/ontology/policy/*.cedar
## Cross-references microservices/ontology/runbooks/cedar-fragment-rollback.md

global:
  pack: kr
  imageRegistry: oci.oyatie.dev

cedar:
  version: "4.5.0"                    # pinned per docs/standards/observability-slo.md §"Version Pinning"
  evaluation:
    hardTimeoutMs: 10                 # T-D-03 mitigation
    maxPolicyDepth: 50                # template-depth limit
    enableFuzzing: true               # CI lane fuzz tests at build time

  ## Cedar fragment ConfigMap (mounted into every *-rest pod)
  fragments:
    enabled: true
    sources:
      - microservices/ontology/policy/tenant-scope.cedar
      - microservices/ontology/policy/ci-scope.cedar
      - microservices/ontology/policy/auditor-scope.cedar
      - microservices/ontology/policy/public-read.cedar
      - microservices/ontology/policy/pillar.cedar
    coverage_lane: oya-governance-cedar-coverage

  ## Hot-reload sidecar (Kafka consumer for SchemaRegistered events)
  hotReload:
    enabled: true
    image: oci.oyatie.dev/oya-ontology-cedar-fragment-coverage-adapter:latest
    consumerGroup: ontology-cedar-hot-reload
    inotify_fallback: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    counters:
      - oya_ontology_cedar_evaluations_total
      - oya_ontology_cedar_evaluation_duration_seconds
      - oya_ontology_cedar_deny_total
      - oya_ontology_cedar_fragment_hash

ontology:
  network_policy:
    enabled: true                     # restrict to ontology-* pods only
  audit_chain_emit:
    enabled: true                     # every deny on Tier1/Tier2 resource emits audit event
  ed25519_signing:
    enabled: true
    openbao_path: secret/ontology/cedar-decision-signing
    rotation_days: 90
