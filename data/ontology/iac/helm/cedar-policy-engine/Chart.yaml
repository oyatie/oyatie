# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: ontology-cedar-policy-engine
description: |
  Cedar v4 policy engine in-process distribution for the oyatie Ontology µservice.
  Cedar v4 is pulled as a Rust crate dependency by every *-rest pod; this chart
  ships the Cedar fragment ConfigMap + sidecar reloader watching the fragments
  for hot-reload via the schema-propagation-worker event channel.
version: 1.0.0
appVersion: "4.5.0"
type: application
home: https://oyatie.com/microservices/ontology
keywords:
  - ontology
  - cedar
  - policy
  - oyatie
maintainers:
  - name: axis-ontology
    email: axis-ontology@oyatie.com
  - name: ops-security
    email: ops-security@oyatie.com
annotations:
  artifacthub.io/license: Apache-2.0
  oyatie.dev/related-adrs: ADR-0140 (retired per ADR-0145),ADR-0107,ADR-0132
  oyatie.dev/runbook: runbooks/cedar-fragment-rollback.md
