# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
## Ontology ClickHouse OLAP history-mirror values
## Cross-references microservices/ontology/policy/type-isolation.md TI-08..TI-10
## Cross-references microservices/ontology/capacity-model.md ClickHouse sizing

global:
  pack: kr
  jurisdiction: kr
  imageRegistry: oci.oyatie.dev
  storageClass: oci-bv-perf

clickhouse:
  image:
    tag: 24.10.0
  shards: 4                    # per capacity-model.md XS tier
  replicaCount: 2              # RF = 2 for ClickHouse
  resources:
    requests: {cpu: "8", memory: "32Gi"}
    limits: {cpu: "16", memory: "64Gi"}
  persistence:
    enabled: true
    size: 200Gi                # per capacity-model.md
    storageClass: oci-bv-perf
  configuration:
    listen_host: 0.0.0.0
    tcp_port: 9000
    http_port: 8123
    interserver_http_port: 9009
    max_concurrent_queries: 500
    max_memory_usage: 21474836480     # 20 GB per-query budget
    use_uncompressed_cache: 1
    background_pool_size: 16

  ## Per-tenant row-policy enforcement (TI-08)
  rowPolicies:
    enabled: true
    template: |
      CREATE ROW POLICY IF NOT EXISTS tenant_filter
      ON ontology.{{ .Object Type }} FOR ALL TO ALL
      USING tenant_id = getSetting('app_tenant_id');

  ## S3-compatible cold-tier storage policy (per data-residency.md)
  storagePolicies:
    enabled: true
    config: |
      storage_configuration:
        disks:
          hot:
            type: local
            path: /var/lib/clickhouse/
          warm:
            type: s3
            endpoint: https://oya-ontology-ch-warm-kr.objectstorage.oci.dev/
            metadata_path: /var/lib/clickhouse/disks/warm/
          cold:
            type: s3
            endpoint: https://oya-ontology-ch-cold-kr.objectstorage.oci.dev/
            metadata_path: /var/lib/clickhouse/disks/cold/
        policies:
          tiered:
            volumes:
              - hot:
                  disk: hot
                  max_data_part_size_bytes: 1073741824
              - warm:
                  disk: warm
                  max_data_part_size_bytes: 10737418240
              - cold:
                  disk: cold

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  ## Mirror-ingester worker (consumes Kafka outbox)
  mirrorIngester:
    enabled: true
    image: oci.oyatie.dev/oya-ontology-entity-store-adapter-clickhouse:latest
    replicaCount: 4
    consumerGroup: ontology-clickhouse-mirror
    targetLagSeconds: 60       # SLO threshold; alert above

ontology:
  network_policy:
    enabled: true              # restrict to ontology-* + observability Mimir scrape
  per_tenant_quota:
    enabled: true              # per tenant_scope; trial/production/sandbox/internal
