# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: ontology-clickhouse
description: |
  ClickHouse 24 history-mirror for the oyatie Ontology µservice.
  ReplicatedMergeTree partitioned by (tenant_id, toYYYYMM(ts)); per-tenant
  row-policies for cross-tenant query refusal; cold-tier object storage
  (S3-compatible OCI) for 6mo+ data.
version: 1.0.0
appVersion: "24.10"
type: application
home: https://oyatie.com/microservices/ontology
keywords:
  - ontology
  - clickhouse
  - olap
  - oyatie
maintainers:
  - name: axis-ontology
    email: axis-ontology@oyatie.com
dependencies:
  - name: clickhouse
    version: "24.x.x"
    repository: https://charts.bitnami.com/bitnami
annotations:
  artifacthub.io/license: Apache-2.0
  oyatie.dev/related-adrs: ADR-0105,ADR-0106,ADR-0117,ADR-0131
  oyatie.dev/runbook: runbooks/clickhouse-rebalance.md
