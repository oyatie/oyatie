# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
## Ontology Postgres + Citus values
## Pinned per docs/standards/observability-slo.md §"Version Pinning"
## Cross-references microservices/ontology/policy/type-isolation.md TI-01..TI-13

global:
  pack: kr                     # overridden per pack overlay
  jurisdiction: kr
  imageRegistry: oci.oyatie.dev
  storageClass: oci-bv-perf
  tls:
    enabled: true
    mode: require              # All Postgres connections must use TLS

postgres-base:
  image:
    tag: 16.6.0-debian-12-r0
  primary:
    persistence:
      enabled: true
      size: 100Gi              # XS tier per capacity-model.md; per pack overlay grows
      storageClass: oci-bv-perf
    extraEnvVars:
      - name: POSTGRESQL_LOG_HOSTNAME
        value: "true"
      - name: POSTGRESQL_LOG_CONNECTIONS
        value: "true"
    pgHbaConfiguration: |
      hostssl all all 0.0.0.0/0 scram-sha-256
      hostssl all all ::/0 scram-sha-256
      local all all peer
    extraConfiguration:
      shared_preload_libraries: citus,pg_stat_statements,pgaudit
      max_connections: 500
      ssl: 'on'
      log_statement: ddl
      pgaudit.log: 'write,ddl,role'
      row_security: 'on'        # default-on; FORCE applied per-table via migration
    extraInitContainers:
      - name: openbao-cert-fetch
        image: oci.oyatie.dev/openbao-cert-init:latest
  readReplicas:
    replicaCount: 8             # per capacity-model.md XS tier
    persistence:
      enabled: true
      size: 100Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  backup:
    enabled: true
    schedule: "0 */1 * * *"     # hourly PITR archive
    storage:
      provider: s3-compatible
      bucket: oya-ontology-pg-pitr-kr
      retention: 30d            # per data-residency.md retention matrix

citus:
  coordinator:
    replicaCount: 2             # HA
    resources:
      requests: {cpu: "4", memory: "16Gi"}
      limits: {cpu: "8", memory: "32Gi"}
  worker:
    replicaCount: 8             # per capacity-model.md XS tier
    resources:
      requests: {cpu: "8", memory: "32Gi"}
      limits: {cpu: "16", memory: "64Gi"}
  config:
    multi_shard_modify_mode: strict      # TI-03 invariant; lane validates
    citus.shard_count: 32                # per pack baseline
    citus.shard_replication_factor: 3
    citus.enable_repartition_joins: 'on'
    citus.coordinator_aggregation_strategy: row-gather
  metrics:
    enabled: true

ontology:
  rls_migration:
    enabled: true                # runs ALTER TABLE ... FORCE ROW LEVEL SECURITY on every Object Type table
    image: oci.oyatie.dev/oya-ontology-entity-store-app:latest
    args:
      - migrate
      - --enable-rls
      - --enforce-tenant-isolation
  network_policy:
    enabled: true                # restricts ingress to ontology-* Layer-B pods only
  pgaudit:
    log_format: jsonb            # consumed by observability OTel collector
  pgbouncer:
    enabled: true                # connection pooling for Layer-B
    poolMode: transaction
    maxClientConn: 5000
    defaultPoolSize: 50
