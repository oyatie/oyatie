# Kubernetes NetworkPolicy + Cilium L7 + Ambient ztunnel rules for ontology µservice
# Authority: ADR-0254 K8s + Cloud Hypervisor; ADR-0295 SPIFFE workload identity

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ontology-default-deny
  namespace: ontology
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ontology-allow-substrate-callers
  namespace: ontology
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-agent-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: substrate
        - namespaceSelector:
            matchLabels:
              tier: product
      ports:
        - protocol: TCP
          port: 8443
        - protocol: UDP
          port: 8443  # QUIC / HTTP/3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ontology-egress-allowlist
  namespace: ontology
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 4317
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ontology-l7-spiffe
  namespace: ontology
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-agent-gateway
  ingress:
    - fromEntities: [cluster]
      authentication:
        mode: required
        # SPIFFE attestation required per ADR-0295
