[package]
name = "ci-tide-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ci tide application — merge-queue poll loop + binary.
# Phase 2 of ci bespoke-Prow (ADR-0513): polls GitHub for eligible PRs
# and merges them when CI is green, approved, and not held.

[[bin]]
name = "ci-tide"
path = "src/bin/ci-tide.rs"

[lib]
name = "ci_tide_app"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-tide-kernel = { path = "../kernel" }
ci-tide-github-adapter = { path = "../github-adapter" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
