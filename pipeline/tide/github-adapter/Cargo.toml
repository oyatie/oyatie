[package]
name = "ci-tide-github-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GitHub API client adapter for the ci tide component.
# Implements kernel::ForgeClient via reqwest blocking HTTP.
# Forge of record = GitHub (D-FORGE; ADR-0513 Phase 2).

[lib]
name = "ci_tide_github_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-tide-kernel = { path = "../kernel" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
