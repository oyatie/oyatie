[package]
name = "ci-webhook-gateway-ed25519"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ed25519 signature verifier adapter for the CI webhook gateway (ADR-0387 D2).
# Implements the kernel SignatureVerifier trait using ed25519-dalek 2.x.
# Constant-time verification via VerifyingKey::verify_strict.
# Timestamp window: ±5 minutes (300 seconds).
# Stage-5 GREEN: public key injected via constructor (OpenBao client deferred to Stage-7).

[lib]
name = "ci_webhook_gateway_ed25519"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-webhook-gateway-kernel = { path = "../../core/webhook-gateway-kernel" }
ed25519-dalek = { version = "2", features = ["std"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
