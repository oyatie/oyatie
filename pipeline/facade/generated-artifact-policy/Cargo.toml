[package]
name = "ci-generated-artifact-policy"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-generated-artifact-control-plane: validates the repo-declared generated artifact
# policy manifest against the SCM facts snapshot consumed by cloud-ci. This is the productized,
# hermetic control plane for generated outputs: public repos can adopt the same manifest shape,
# and the gate rejects undeclared generated faces instead of relying on ad-hoc gitignore or
# contributor-local merge drivers.

[lib]
name = "ci_generated_artifact_policy"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "cloud-ci-generated-output-diff-policy"
path = "src/diff_policy.rs"
