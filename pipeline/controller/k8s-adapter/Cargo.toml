[package]
name = "ci-controller-k8s-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# K8s Job spawn + watch adapter for the ci controller.
# Implements kernel::JobSpawner and provides observe_job() projection.
# Uses kube-rs to create/watch batch/v1 Jobs in namespace ci.

[lib]
name = "ci_controller_k8s_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-controller-kernel = { path = "../kernel" }
kube = { workspace = true }
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
