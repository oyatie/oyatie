---
# Namespaced Role for the ci controller.
# Grants the controller the minimum permissions to: create/watch gate Jobs,
# watch owned Pods, and read Pod logs for failure summaries.
# NO cluster-scoped permissions. NO secrets read via API (token arrives via ESO env).
# ADR-0387 least-privilege namespace-scoped RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-role" .Values.microservice.id | quote }}
  namespace: {{ .Values.config.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
rules:
  # Gate Job management
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  # Pod inspection for OOM / evicted / image-pull state-machine branches
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod log fetch for failure summary + optional comment posting
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-rolebinding" .Values.microservice.id | quote }}
  namespace: {{ .Values.config.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-role" .Values.microservice.id | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | quote }}
    namespace: {{ .Values.config.namespace | quote }}
