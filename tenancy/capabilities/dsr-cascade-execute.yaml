# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:tenancy:dsr-cascade-execute:v1
name: dsr-cascade-execute
namespace: tenancy
display_name: Execute DSR Cascade with Proof-of-Erasure
description: |
  Orchestrate the cross-µservice DSR (Data Subject Request) cascade in fulfilment of
  GDPR Art. 17 / KR PIPA Art. 36 / DPDPA §12 / LGPD Art. 18 / equivalent statutes.

  Steps:
  1. Receive DsrRequest with 2-person rule (DPO + ops-security signatures).
  2. Emit TenantDeletionRequested Workflow event to every µservice.
  3. Aggregate per-µservice ErasureReceipts as they arrive.
  4. Compute Merkle root over receipts when received_n == expected_n.
  5. Sign ProofOfErasure certificate via audit-chain Ed25519.
  6. Emit TenantDeletionCompleted; tenant operator notified per per-pack SLA.

  This capability produces the regulator-disclosable cryptographic proof-of-erasure
  certificate that distinguishes oyatie from competitor tenant-lifecycle products.

owner_team: council-privacy + axis-tenancy
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0018, ADR-0028, ADR-0117, ADR-0139, ADR-0131]
related_artifacts:
  - tenancy/PRD.md (FR-05, FR-09)
  - tenancy/runbooks/tenant-deletion-dsr-cascade.md
  - tenancy/policy/data-residency.md (DSR Cascade section)
  - tenancy/contracts/asyncapi/tenant-events.yaml (TenantDeletionRequested + ErasureReceipt + TenantDeletionCompleted)

autonomy_tier: T3
# T3 = irreversible mutation across multi-µservice fan-out; 2-person rule + DPO sign-off +
# audit-chain seal + per-pack legal-SLA enforcement.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: request_type
    type: enum
    values: [right_to_erasure, right_to_rectification, right_to_access, right_to_portability, right_to_restriction]
    required: true
  - name: requester
    type: object
    schema:
      principal: string
      principal_type: enum (tenant_operator | platform_operator | dpo | regulator)
    required: true
  - name: dpo_signature
    type: string
    required: true
    description: Ed25519 signature by council-privacy chair (DPO)
  - name: secondary_signature
    type: string
    required: true
    description: 2-person-rule secondary signer (ops-security)

outputs:
  - name: dsr_id
    type: string
    pattern: '^dsr-[A-Z0-9]{26}$'
  - name: legal_sla_deadline
    type: timestamp
  - name: receipts_expected
    type: integer
  - name: proof_of_erasure_id
    type: string
  - name: proof_of_erasure_merkle_root
    type: string
  - name: completion_at
    type: timestamp
  - name: receipts_received
    type: integer

data_classes_touched:
  - AUDIT
  - SENSITIVE_PIPA_ART23  # tenant_id appears in DSR record
  - BEHAVIORAL_TENANT_PRODUCT  # downstream erased data

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

regulatory_sla:
  pack-eu: 30 days (GDPR Art. 12(3))
  pack-kr: 30 days (KR PIPA Art. 36)
  pack-in: 30 days (DPDPA 2023 §12)
  pack-br: 15 days (LGPD Art. 19)
  pack-jp: best-effort (APPI)
  pack-us-healthcare: per BAA (typically 24h-7d for BA notification; 60d HIPAA breach window)
  pack-au: per APP 11 + 12
  pack-sg: per PDPA Part IV
  pack-ae: per UAE PDPL Art. 17
  pack-ksa: per KSA PDPL

evidence_topic: oya.tenancy.dsr.cascade.execute

cost_profile:
  type: per-cascade
  estimated_cost_usd_per_call: 1.00
  cost_drivers:
    - Workflow event fan-out to every µservice
    - Per-µservice DSR handler execution (variable per data volume)
    - Aggregation Merkle math (constant-time)
    - Audit-chain seal
    - Tenant + regulator notification

cedar_policy_fragments:
  - tenancy/policy/tenant-scope.cedar (PERMIT 3)
  - tenancy/policy/auditor-scope.cedar (regulator/auditor read)

eval_set:
  golden_inputs_path: microservices/tenancy/capabilities/eval/dsr-cascade-golden.jsonl
  pass_threshold: 0.99
  eval_metric: proof-of-erasure-merkle-correctness + receipt-aggregation-completeness + per-pack-sla-compliance
  cadence: quarterly drill + per-release
  reference: GDPR Art. 17; KR PIPA Art. 36; ICO right-to-erasure guidance

sunset:
  status: none
  notes: ""
