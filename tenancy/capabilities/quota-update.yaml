apiVersion: oyatie.io/capabilities/v2
kind: Capability
metadata:
  name: quota-update
  microservice: tenancy
spec:
  tier: T2
  risk_class: medium
  actions: [set_quota]
  binding_adr: ADR-0244
  audit_event_classes:
    - oya.tenancy.quota-updated
  authorized_principals:
    - oyatie::Tenancy::TenantAdminGroup::tenant-admins
    - oyatie::Council::ArchitectureRole::on-call
