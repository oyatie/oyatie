apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenancy
resources:
  - ../../base
configMapGenerator:
  - name: tenancy-pack-overlay
    literals:
      - pack=hipaa
      - jurisdiction=us
      - residency_strict=true
      - baa_required=true
      - cell_tier_eligibility=tier-1
