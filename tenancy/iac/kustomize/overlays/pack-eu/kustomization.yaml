apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenancy
resources:
  - ../../base
patchesStrategicMerge:
  - residency-eu-sovereign.yaml
configMapGenerator:
  - name: tenancy-pack-overlay
    literals:
      - pack=eu-sovereign
      - jurisdiction=eu
      - residency_strict=true
      - cell_tier_eligibility=tier-1,tier-2
