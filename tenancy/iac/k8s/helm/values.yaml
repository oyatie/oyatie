microservice:
  id: tenancy
  cargoPackage: oya-tenancy-api
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-tenancy

image:
  registry: registry.oyatie.dev
  repository: oya-tenancy
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-tenancy-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    // Deployed Cedar mirrors the authored PBAC policy directories for this capability.
    // Broad tenant-class-only permits are forbidden by the cedar-deploy-parity gate.

    // Source: policy/abuse-defence.cedar
    forbid (principal, action, resource) when {
        principal.bot_score > 95
        && !(principal.tenant.audience_type == "FRIENDLY_CRAWLER_PARTNER")
    };

    forbid (principal, action == Action::"signup_tenant", resource) when {
        principal.signup_attempts_per_hour_per_fingerprint > 5
    };

    forbid (principal, action == Action::"tenant_admin_signin", resource) when {
        principal.signin_failures_per_ip_per_5min > 10
    };

    forbid (principal == ?, action == Action::"resolve_tenant", resource) when {
        principal.fingerprint_age_seconds < 30
        && principal.tenant_resolve_count_per_min > 60
    };

    forbid (principal, action == Action::"tenant_admin_signin", resource) when {
        principal.credential_in_hibp_corpus == true
    };

    forbid (principal, action == Action::"webhook_ingest", resource) when {
        principal.hmac_signature_valid == false
        || principal.replay_window_seconds > 300
        || principal.idempotency_key_present == false
    };

    forbid (principal, action, resource) when {
        principal.principal_kind == "workload"
        && principal.spiffe_attested == false
    };

    forbid (principal, action == Action::"challenge_presented", resource) when {
        principal.bot_score < principal.tenant.bot_score_challenge_threshold
    };

    forbid (principal, action == Action::"challenge_presented", resource) when {
        resource.a11y_audio_alternative == false
        || resource.a11y_keyboard_navigable == false
        || resource.a11y_time_pressured == true
    };

    // Source: policy/action-authorization.cedar
    permit (
        principal in oyatie::Tenancy::TenantAdminGroup::"tenant-admins",
        action in [
            Action::"rename_tenant",
            Action::"set_residency",
            Action::"set_quota",
            Action::"request_dr_pair_promotion"
        ],
        resource is Tenant
    ) when {
        principal.tenant_id == resource.tenant_id
        && principal.audience_type == "B2B_TENANT_ADMIN"
    };

    permit (
        principal in oyatie::Tenancy::TenantAdminGroup::"tenant-admins",
        action == Action::"manage_membership",
        resource is TenantMembership
    ) when {
        principal.tenant_id == resource.tenant_id
        && principal.audience_type == "B2B_TENANT_ADMIN"
    };

    permit (
        principal in oyatie::Tenancy::TenantAdminGroup::"tenant-admins",
        action == Action::"complete_kyb_kyc",
        resource is KybKycCase
    ) when {
        principal.tenant_id == resource.tenant_id
        && principal.audience_type == "B2B_TENANT_ADMIN"
    };

    permit (
        principal == oyatie::Tenancy::Principal::"lifecycle-controller",
        action in [
            Action::"create_tenant",
            Action::"suspend_tenant",
            Action::"delete_tenant"
        ],
        resource is TenantLifecycleJob
    ) when {
        principal.spiffe_attested == true &&
        resource.microservice == "tenancy"
    };

    permit (
        principal == oyatie::Tenancy::Principal::"cell-assignment-controller",
        action == Action::"assign_cell",
        resource is CellAssignmentJob
    ) when {
        principal.spiffe_attested == true &&
        resource.microservice == "tenancy"
    };

    permit (
        principal == oyatie::Tenancy::Principal::"isolation-policy-emitter",
        action == Action::"emit_rls_policy",
        resource is RlsPolicyEmissionJob
    ) when {
        principal.spiffe_attested == true &&
        resource.microservice == "tenancy"
    };

    permit (
        principal == oyatie::Tenancy::Principal::"dsr-cascade-runner",
        action == Action::"cascade_dsr",
        resource is DsrCascadeJob
    ) when {
        principal.spiffe_attested == true &&
        resource.microservice == "tenancy"
    };

    permit (
        principal == oyatie::Tenancy::Principal::"kyb-kyc-verifier",
        action == Action::"verify_kyb_kyc",
        resource is KybKycCase
    ) when {
        principal.spiffe_attested == true &&
        resource.microservice == "tenancy"
    };

    forbid (
        principal,
        action in [Action::"create_tenant", Action::"rename_tenant"],
        resource
    ) when {
        resource.tenant_slug in oyatie::Tenancy::ReservedNamespace::"all"
        && !(principal.tenant_id == oyatie::Tenancy::Tenant::"oyatie-platform-owner")
    };

    forbid (principal, action, resource) when {
        principal.tenant_id != resource.tenant_id
        && principal.principal_kind != "workload"
    };

    // Source: policy/auditor-scope.cedar
    permit (
      principal in Auditor::?a,
      action in [
        Action::"read_tenant",
        Action::"read_tenant_status",
        Action::"read_tenant_lifecycle_history",
        Action::"read_cell_assignment",
        Action::"read_audit_chain"
      ],
      resource is TenantAuditRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has tenant_id &&
      principal has scoped_tenants &&
      resource.tenant_id in principal.scoped_tenants
    };

    permit (
      principal in Auditor::?a,
      action in [
        Action::"read_dsr_request",
        Action::"read_dsr_request_history",
        Action::"read_proof_of_erasure",
        Action::"read_erasure_receipt"
      ],
      resource is DsrEvidence
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has tenant_id &&
      principal has scoped_tenants &&
      resource.tenant_id in principal.scoped_tenants
    };

    permit (
      principal in Auditor::?a,
      action in [
        Action::"read_rls_policy_manifest",
        Action::"read_rls_policy_live_state",
        Action::"read_rls_drift_metrics",
        Action::"read_lean_lane_execution_log"
      ],
      resource is RlsIsolationEvidence
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_artifact",
      resource in PolicyArtifact::?r
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has artifact_type &&
      resource.artifact_type in [
        "threat-model",
        "dpia",
        "compliance",
        "rls-isolation",
        "data-residency",
        "policy-cedar",
        "runbook",
        "adr",
        "prd",
        "failure-modes",
        "capacity-model",
        "cost-budget",
        "incident-response",
        "multi-region",
        "competitor-parity-matrix",
        "backfill-replay",
        "sdk-plan"
      ]
    };

    permit (
      principal in Regulator::?r,
      action in [
        Action::"read_dsr_request",
        Action::"read_proof_of_erasure",
        Action::"read_erasure_receipt"
      ],
      resource is DsrEvidence
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      principal has jurisdiction &&
      resource has jurisdiction_code &&
      resource.jurisdiction_code == principal.jurisdiction
    };

    permit (
      principal in Regulator::?r,
      action == Action::"read_tenant_lifecycle_history",
      resource is TenantAuditRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      principal has jurisdiction &&
      resource has jurisdiction_code &&
      resource.jurisdiction_code == principal.jurisdiction
    };

    permit (
      principal in Regulator::?r,
      action == Action::"read_audit_chain",
      resource is AuditChainRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      principal has jurisdiction &&
      resource has jurisdiction_code &&
      resource.jurisdiction_code == principal.jurisdiction
    };

    forbid (
      principal in Auditor::?a,
      action in [
        Action::"create_tenant",
        Action::"suspend_tenant",
        Action::"resume_tenant",
        Action::"delete_tenant",
        Action::"submit_dsr_request",
        Action::"alter_rls_policy",
        Action::"disable_rls",
        Action::"rotate_jwt_signing_key",
        Action::"write_metrics",
        Action::"write_logs",
        Action::"write_traces",
        Action::"write_artifact",
        Action::"delete_artifact"
      ],
      resource
    );

    forbid (
      principal in Regulator::?r,
      action in [
        Action::"create_tenant",
        Action::"suspend_tenant",
        Action::"resume_tenant",
        Action::"delete_tenant",
        Action::"submit_dsr_request",
        Action::"alter_rls_policy",
        Action::"disable_rls",
        Action::"rotate_jwt_signing_key",
        Action::"write_metrics",
        Action::"write_logs",
        Action::"write_traces"
      ],
      resource
    );

    forbid (
      principal in Auditor::?a,
      action,
      resource
    )
    unless {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to
    };

    forbid (
      principal in Auditor::?a,
      action in [
        Action::"read_tenant",
        Action::"read_tenant_status",
        Action::"read_tenant_lifecycle_history",
        Action::"read_cell_assignment",
        Action::"read_dsr_request",
        Action::"read_dsr_request_history",
        Action::"read_proof_of_erasure",
        Action::"read_erasure_receipt"
      ],
      resource
    )
    when {
      resource has tenant_id &&
      principal has scoped_tenants &&
      !(resource.tenant_id in principal.scoped_tenants)
    };

    forbid (
      principal in Auditor::?a,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal in Regulator::?r,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal in Regulator::?r,
      action,
      resource
    )
    when {
      resource has jurisdiction_code &&
      principal has jurisdiction &&
      resource.jurisdiction_code != principal.jurisdiction
    };

    // Source: policy/ci-scope.cedar
    permit (
      principal == Service::"oya-ci",
      action in [
        Action::"read_governance_state",
        Action::"read_rls_policy_state",
        Action::"read_branch_protection_state",
        Action::"read_lifecycle_event_count"
      ],
      resource
    )
    when {
      resource has tenant_id &&
      resource.tenant_id in ["tenant:oya-ci", "tenant:oya-self", "tenant:oya-aggregate", "tenant:oya-system"]
    };

    permit (
      principal == Service::"slo-engine-worker",
      action in [Action::"write_metrics", Action::"write_logs", Action::"write_traces"],
      resource
    )
    when {
      resource has tenant_id &&
      resource.tenant_id == "tenant:oya-self"
    };

    permit (
      principal == Service::"tenancy-isolation-policy-worker",
      action == Action::"write_metrics",
      resource
    )
    when {
      resource has tenant_id &&
      resource.tenant_id == "tenant:oya-ci" &&
      resource has metric_name &&
      resource.metric_name like "oya_tenancy_*"
    };

    forbid (
      principal == Service::"oya-ci",
      action,
      resource
    )
    when {
      resource has tenant_id &&
      !(resource.tenant_id in ["tenant:oya-ci", "tenant:oya-self", "tenant:oya-aggregate", "tenant:oya-system"])
    };

    forbid (
      principal == Service::"oya-ci",
      action in [
        Action::"create_tenant",
        Action::"suspend_tenant",
        Action::"resume_tenant",
        Action::"delete_tenant",
        Action::"submit_dsr_request",
        Action::"alter_rls_policy",
        Action::"disable_rls",
        Action::"rotate_jwt_signing_key"
      ],
      resource
    );

    forbid (
      principal == Service::"oya-ci",
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal == Service::"tenancy-isolation-policy-worker",
      action in [Action::"read_tenant", Action::"read_dsr_request"],
      resource
    )
    when {
      resource has tenant_id &&
      !(resource.tenant_id in ["tenant:oya-ci", "tenant:oya-self", "tenant:oya-aggregate", "tenant:oya-system"])
    };

    forbid (
      principal,
      action in [Action::"write_metrics", Action::"write_logs", Action::"write_traces"],
      resource
    )
    when {
      resource has tenant_id &&
      resource.tenant_id in ["tenant:oya-ci", "tenant:oya-self", "tenant:oya-aggregate", "tenant:oya-system"]
    }
    unless {
      principal in [
        Service::"oya-ci",
        Service::"slo-engine-worker",
        Service::"tenancy-isolation-policy-worker",
        Service::"tenancy-cell-assignment-worker",
        Service::"tenancy-dsr-cascade-worker"
      ]
    };

    // Source: policy/data-residency.cedar
    forbid (principal, action, resource) when {
        resource.processing_region != resource.tenant.home_jurisdiction
        && resource.tenant.residency_strict == true
    };

    forbid (principal, action, resource) when {
        resource.tenant.compliance_packs.contains("kr-csap")
        && resource.processing_region != "kr"
    };

    forbid (principal, action, resource) when {
        resource.tenant.compliance_packs.contains("eu-sovereign")
        && !resource.processing_region.startsWith("eu-sovereign-")
    };

    forbid (principal, action, resource) when {
        resource.tenant.compliance_packs.contains("cn-pipl")
        && resource.processing_region != "cn-onshore"
    };

    forbid (principal, action == Action::"assign_dr_cell", resource) when {
        resource.tenant.residency_strict == true
        && resource.dr_cell.jurisdiction != resource.tenant.home_jurisdiction
    };

    // Source: policy/public-read.cedar
    permit (
      principal == User::"anonymous",
      action == Action::"read_metrics",
      resource
    )
    when {
      resource has tenant_id &&
      resource.tenant_id == "tenant:oya-self" &&
      resource has data_class &&
      resource.data_class == "PUBLIC" &&
      resource has metric_name &&
      resource.metric_name like "oya_tenancy_public_*"
    };

    permit (
      principal == User::"anonymous",
      action == Action::"read_openapi_schema",
      resource in PublicEndpoint::"tenancy-openapi-schema"
    );

    permit (
      principal == User::"anonymous",
      action == Action::"read_cedar_schema",
      resource in PublicEndpoint::"tenancy-cedar-schema"
    );

    permit (
      principal == User::"anonymous",
      action in [Action::"read_health", Action::"read_readiness"],
      resource in PublicEndpoint::"tenancy-health"
    );

    permit (
      principal == User::"anonymous",
      action == Action::"read_pack_registry",
      resource in PublicEndpoint::"tenancy-pack-registry"
    );

    forbid (
      principal == User::"anonymous",
      action,
      resource
    )
    when {
      resource has data_class &&
      !(resource.data_class == "PUBLIC")
    };

    forbid (
      principal == User::"anonymous",
      action,
      resource
    )
    when {
      resource has tenant_id &&
      !(resource.tenant_id in ["tenant:oya-self", "tenant:oya-aggregate"])
    };

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"create_tenant",
        Action::"suspend_tenant",
        Action::"resume_tenant",
        Action::"delete_tenant",
        Action::"submit_dsr_request",
        Action::"write_metrics",
        Action::"write_logs",
        Action::"write_traces",
        Action::"alter_rls_policy",
        Action::"disable_rls",
        Action::"rotate_jwt_signing_key",
        Action::"write_artifact"
      ],
      resource
    );

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"list_tenants",
        Action::"enumerate_tenants",
        Action::"validate_tenant_id_existence"
      ],
      resource
    );

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"read_dsr_request",
        Action::"read_proof_of_erasure",
        Action::"read_rls_policy",
        Action::"read_rls_policy_live_state",
        Action::"read_audit_chain"
      ],
      resource
    );

    // Source: policy/tenant-scope.cedar
    permit (
      principal in TenantOperator::?p,
      action in [
        Action::"read_tenant",
        Action::"read_tenant_status",
        Action::"read_tenant_lifecycle_history",
        Action::"read_cell_assignment",
        Action::"read_jurisdiction_code",
        Action::"read_plan_tier"
      ],
      resource in Tenant::?r
    )
    when {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id
    };

    permit (
      principal in TenantOperator::?p,
      action in [
        Action::"suspend_tenant",
        Action::"resume_tenant"
      ],
      resource in Tenant::?r
    )
    when {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id &&
      principal has plan_tier_role &&
      principal.plan_tier_role in ["admin", "owner"]
    };

    permit (
      principal in TenantOperator::?p,
      action in [
        Action::"submit_dsr_request",
        Action::"read_dsr_request",
        Action::"read_proof_of_erasure"
      ],
      resource in DsrRequest::?d
    )
    when {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id
    };

    permit (
      principal in TenantOperator::?p,
      action == Action::"read_rls_policy",
      resource in RlsPolicy::?r
    )
    when {
      principal has tenant_id &&
      resource has scope &&
      resource.scope == "per-tenant" &&
      resource has tenant_id &&
      resource.tenant_id == principal.tenant_id
    };

    forbid (
      principal in TenantOperator::?p,
      action in [
        Action::"read_tenant",
        Action::"read_tenant_status",
        Action::"read_tenant_lifecycle_history",
        Action::"read_cell_assignment",
        Action::"read_jurisdiction_code",
        Action::"read_plan_tier",
        Action::"suspend_tenant",
        Action::"resume_tenant",
        Action::"submit_dsr_request",
        Action::"read_dsr_request",
        Action::"read_proof_of_erasure",
        Action::"read_rls_policy"
      ],
      resource
    )
    unless {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id
    };

    forbid (
      principal in TenantOperator::?p,
      action in [
        Action::"create_tenant",
        Action::"delete_tenant",
        Action::"hard_delete_tenant",
        Action::"change_jurisdiction",
        Action::"change_pack"
      ],
      resource
    );

    forbid (
      principal in TenantOperator::?p,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal in TenantOperator::?p,
      action in [
        Action::"create_rls_policy",
        Action::"alter_rls_policy",
        Action::"drop_rls_policy",
        Action::"disable_rls"
      ],
      resource
    );

    forbid (
      principal in TenantOperator::?p,
      action in [
        Action::"assume_role",
        Action::"elevate_privilege",
        Action::"impersonate"
      ],
      resource
    );

    // Source: cedar/policies.cedar
    permit(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ComputeAutoshardingPlacement", Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "tenancy" &&
      context.doctrine.adr_0348 == true &&
      context.autosharding_mode == "control_plane_driven" &&
      context.honors_residency == true &&
      context.compliance_pack_check_result == "pass" &&
      context.residency_check_result == "pass" &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "tenancy" &&
      (
        context.honors_residency == false ||
        context.compliance_pack_check_result != "pass" ||
        context.residency_check_result != "pass" ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action == Action::"MigrateTenantCrossJurisdiction",
      resource is TenantMigration
    ) unless {
      resource.microservice == "tenancy" &&
      context.cedar_permit_id != "" &&
      context.cross_jurisdiction_permit_id != "" &&
      context.audit_chain_emit == true
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunCiMirror",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "tenancy" &&
      context.doctrine.adr_0346 == true &&
      context.oya_verify_ci_required == true &&
      context.steps.cargo_fmt_all_check == true &&
      context.steps.cargo_check_workspace_all_targets == true &&
      context.steps.cargo_clippy_workspace_all_targets_d_warnings == true &&
      context.steps.cargo_nextest_workspace_no_fail_fast == true &&
      context.steps.oya_gate_run_all_ci_required == true &&
      context.step_exit_semantics == "block_on_exit_0_each_step" &&
      context.exit_code_contract in [0, 1, 2]
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunSelfHostedCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "tenancy" &&
      context.doctrine.adr_0349 == true &&
      context.github_actions_parity_ok == true &&
      context.jcasc_declared == true &&
      context.lane_prefix in ["oya-governance", "oya-check"] &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action in [Action::"RunCiMirror", Action::"RunSelfHostedCi"],
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "tenancy" &&
      (
        context.github_actions_parity_ok == false ||
        context.jcasc_declared == false ||
        context.lane_id.matches("^oya-governance-.*$")
      )
    };

    permit(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "tenancy" &&
      context.doctrine.adr_0349 == true &&
      context.cosign_signature_verified == true &&
      context.tenant_namespace_isolated == true &&
      context.cedar_policy_gate_granted == true &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "tenancy" &&
      (
        context.cosign_signature_verified == false ||
        context.tenant_namespace_isolated == false ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal,
      action == Action::"AuthorGovernanceLane",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "tenancy" &&
      context.doctrine.adr_0347 == true &&
      context.lane_id.matches("^oya-governance-.*$") &&
      context.historical_reference != true
    };

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
