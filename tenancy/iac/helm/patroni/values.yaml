# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
patroni:
  scope: tenancy-cluster
  namespace: tenancy
  dcs:
    type: etcd
    etcd:
      hosts:
        - etcd-0.etcd.tenancy.svc.cluster.local:2379
        - etcd-1.etcd.tenancy.svc.cluster.local:2379
        - etcd-2.etcd.tenancy.svc.cluster.local:2379
      protocol: https
      cacert: /etc/etcd/ssl/ca.crt
  bootstrap:
    dcs:
      ttl: 30
      loop_wait: 10
      retry_timeout: 10
      maximum_lag_on_failover: 1048576  # 1 MB max lag for failover candidate
      synchronous_mode: true
      synchronous_node_count: 2  # quorum 2 sync replicas required (out of 1 primary + 2 sync + N async)
      postgresql:
        parameters:
          row_security: 'on'
          force_row_level_security: 'on'
          wal_level: 'replica'
          synchronous_commit: 'on'
          max_connections: 500
  restapi:
    listen: 0.0.0.0:8008
    connect_address: ${POD_IP}:8008
    authentication:
      verify_client: required  # mTLS only — per threat-model.md T-E-05
  watchdog:
    mode: required  # hardware watchdog if available
    safety_margin: 5
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
