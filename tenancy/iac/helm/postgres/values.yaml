# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
postgresql:
  image:
    tag: "16.3.0"  # LTS pin
  architecture: replication
  auth:
    existingSecret: tenancy-postgres-credentials  # OpenBao-managed
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: tenancy-app-password
      replicationPasswordKey: replication-password
    username: tenancy_app
    database: tenancy
  primary:
    replicaCount: 1
    persistence:
      enabled: true
      size: 100Gi
      storageClass: oci-bv-fss
    resources:
      requests: {cpu: 4, memory: 32Gi}
      limits:   {cpu: 8, memory: 64Gi}
    extendedConfiguration: |
      shared_preload_libraries = 'citus,pg_stat_statements'
      row_security = on
      force_row_level_security = on
      log_min_duration_statement = 1000
      max_connections = 500
      wal_level = replica
      max_wal_senders = 10
      synchronous_commit = on
      synchronous_standby_names = 'ANY 2 (replica-0,replica-1)'  # quorum-2 of sync replicas
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi
      storageClass: oci-bv-fss
    resources:
      requests: {cpu: 4, memory: 32Gi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true  # observability scrapes
