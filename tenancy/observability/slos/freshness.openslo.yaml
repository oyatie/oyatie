# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenancy-freshness-rls-drift
  displayName: "tenancy — RLS state drift detection within 5 minutes"
  labels:
    microservice: tenancy
    sli: freshness
    pack: pack-kr
    data_classes: AUDIT
spec:
  service: tenancy
  description: |
    The tenancy-rls-state-validator runs every 5min comparing declarative RLS
    YAML manifests vs live Postgres pg_policies + pg_class.relforcerowsecurity.
    Freshness SLO: validator must run + report within 5min of schedule.
    Drift detection itself targets ≤ 5min from drift-introduction to alarm.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tenancy_rls_state_validator_runs_total{success="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tenancy_rls_state_validator_runs_total[5m]))
  objectives:
    - displayName: "99.5% of validator runs complete + report within their scheduled window"
      target: 0.995
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
