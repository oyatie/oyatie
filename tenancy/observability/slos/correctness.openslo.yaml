# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenancy-correctness-rls-probe
  displayName: "tenancy — RLS cross-tenant probe MUST return zero rows (load-bearing)"
  labels:
    microservice: tenancy
    sli: correctness
    pack: pack-kr
    data_classes: AUDIT
spec:
  service: tenancy
  description: |
    The synthetic cross-tenant probe runs every 5 minutes (weekly drill scheduled too).
    A probe success is defined as: tenant-A authenticated, queries tenant-B's row,
    Postgres returns zero rows (RLS prevented the cross-tenant read).
    A probe failure is catastrophic — it means RLS isolation has been bypassed.
    Target: 100% (no failure tolerated). Any failure triggers Sev-1 incident.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tenancy_synthetic_cross_tenant_probe_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tenancy_synthetic_cross_tenant_probe_total[5m]))
  objectives:
    - displayName: "100% — RLS MUST refuse cross-tenant on every probe; any failure = Sev-1"
      target: 1.0
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Occurrences
