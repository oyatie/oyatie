# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenancy-availability
  displayName: "tenancy — validate-path 2xx availability"
  labels:
    microservice: tenancy
    sli: availability
    pack: pack-kr
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  service: tenancy
  description: |
    Validate-path availability. The tenancy validate hot path is called on every
    request to every µservice; its availability is the upper bound on every
    µservice's availability. Tightest SLO in the oyatie catalog.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="tenancy-tenant-lifecycle-rest",route="/api/v1/tenants/.+",status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="tenancy-tenant-lifecycle-rest",route="/api/v1/tenants/.+"}[5m]))
  objectives:
    - displayName: "99.99% over rolling 30d (tightest in catalog)"
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
