[package]
name = "tenancy-tenant-lifecycle-store-postgres"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Real async sqlx/Postgres TenantLifecycleStore adapter: per-transaction tenant GUC (oyatie.tenant_id) + RLS isolation over a PgPool. Transient adapter behind the owned-shaped kernel port (oya-data is the G003 owned-data cutover); aws-lc-rs TLS only (ADR-0506)."

[dependencies]
tenancy-tenant-lifecycle-kernel = { path = "../../core/tenant-lifecycle-kernel" }
shared-platform-contracts-kernel = { path = "../../../base/shared-platform-contracts-kernel" }
shared-postgres-command-kernel = { path = "../../../base/shared-postgres-command-kernel" }
shared-postgres-command-adapter-sqlx = { path = "../../../base/shared-postgres-command-adapter-sqlx" }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
shared-resource-provider-contract-kernel = { path = "../../core/shared-resource-provider-contract-kernel" }

[lib]
name = "tenancy_tenant_lifecycle_store_postgres"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
