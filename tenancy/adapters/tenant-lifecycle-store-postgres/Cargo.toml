[package]
name = "tenancy-tenant-lifecycle-store-postgres"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Review-only Postgres/RLS storage + write-statement plan for the TenantLifecycleStore port: declarative tenant-scoped tables, RLS policies, idempotency-key dedup, and the parameterized statements a future durable adapter must use. Transient adapter behind the owned-shaped kernel port (oya-data is the G003 owned-data cutover); opens no connection and claims no runtime."

[lib]
name = "tenancy_tenant_lifecycle_store_postgres"
path = "src/lib.rs"
doctest = false

