[package]
name = "tenancy-tenant-lifecycle-store-inmemory"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "In-memory TenantLifecycleStore adapter: ordered keyed records over BTreeMaps for single-node bring-up and acceptance tests. Production swaps a persistent store behind the same kernel port."

[dependencies]
tenancy-tenant-lifecycle-kernel = { path = "../../core/tenant-lifecycle-kernel" }
shared-platform-contracts-kernel = { path = "../../../libs/shared-platform-contracts-kernel" }

[dev-dependencies]
shared-resource-provider-contract-kernel = { path = "../../../libs/shared-resource-provider-contract-kernel" }
# Async store port: unit tests `.await` the boxed-future methods under #[tokio::test].
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
name = "tenancy_tenant_lifecycle_store_inmemory"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
