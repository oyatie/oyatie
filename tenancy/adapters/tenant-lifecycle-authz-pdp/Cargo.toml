[package]
name = "tenancy-tenant-lifecycle-authz-pdp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "PDP-backed authorization adapter for the tenant-lifecycle delivery surface (AUTH-005 / ADR-0564 D7). Dogfoods the repo's embedded Cedar PDP (iam/adapters/pdp-cedar over the embedded-PDP port kernel; cloud-iam is the IdP/PDP per ADR-0559): carries the tenancy authz bundle (structural cross-tenant forbid + tenant-operator + platform-admin permits), assembles the PEP entity slice from the verified caller, and maps the PDP decision to the port. Fail-closed, default-deny."

[dependencies]
shared-pdp-kernel = { package = "policy-pdp-kernel", path = "../../../policy/core/pdp-kernel" }
shared-ulid-id-kernel = { path = "../../../data/core/ulid-id-kernel" }
shared-platform-contracts-kernel = { path = "../../../iam/core/platform-contracts-kernel" }
tenancy-tenant-lifecycle-authz-port = { path = "../../ports/tenant-lifecycle-authz" }

iam-pdp-cedar = { package = "policy-pdp-cedar", path = "../../../policy/adapters/pdp-cedar" }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
aws-lc-rs = "1.17.0"

[lib]
doctest = false

[lints]
workspace = true
