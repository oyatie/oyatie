# Canonical multi-window burn-rate alert template (SWEEP-I Slice 4).
# Authority: ADR-0064 canonical-base + localization-packs.
# Source: Google SRE Workbook §"Alerting on SLOs", section "Multi-window, multi-burn-rate alerts".
#
# Consumer pattern: per-µservice .openslo.yaml files reference this template by
#   pointing their PrometheusRule generators at `oya.prometheusRule.perSloBurnRate`
#   (canonical helm helper, SWEEP-I Slice 2).
#
# This template declares the canonical burn-rate windows; per-µservice SLOs
# specify ONLY (a) the SLI name, (b) the SLO target. Burn-rate logic is shared.

apiVersion: openslo/v1
kind: AlertPolicy
metadata:
  name: oya-canonical-burn-rate-multi-window
  displayName: Canonical multi-window burn-rate alert template
  labels:
    canonical_base: "true"
    template: burn-rate-multi-window
spec:
  description: |
    Canonical multi-window, multi-burn-rate alerting pattern per Google SRE
    Workbook. Every per-µservice SLO that emits page-grade alerts inherits these
    four windows. Per-µservice SLOs override ONLY their target.

  alertWhenNoData: false
  alertWhenResolved: true

  conditions:
    # Window 1: 1-hour burn at 14.4x — 2% of monthly budget burned in 1h. PAGE.
    - kind: AlertCondition
      metadata:
        name: fast-burn-1h
      spec:
        description: 14.4x burn rate over 1h triggers page
        severity: page
        condition:
          kind: burnRate
          op: gte
          threshold: 14.4
          lookbackWindow: 1h
          alertAfter: 2m

    # Window 2: 6-hour burn at 6.0x — 5% of monthly budget burned in 6h. PAGE.
    - kind: AlertCondition
      metadata:
        name: medium-burn-6h
      spec:
        description: 6.0x burn rate over 6h triggers page
        severity: page
        condition:
          kind: burnRate
          op: gte
          threshold: 6.0
          lookbackWindow: 6h
          alertAfter: 15m

    # Window 3: 1-day burn at 3.0x — 10% of monthly budget burned in 1d. TICKET.
    - kind: AlertCondition
      metadata:
        name: slow-burn-1d
      spec:
        description: 3.0x burn rate over 1d triggers ticket
        severity: ticket
        condition:
          kind: burnRate
          op: gte
          threshold: 3.0
          lookbackWindow: 1d
          alertAfter: 1h

    # Window 4: 3-day burn at 1.0x — 10% of monthly budget burned in 3d. TICKET.
    - kind: AlertCondition
      metadata:
        name: trickle-burn-3d
      spec:
        description: 1.0x burn rate over 3d triggers ticket
        severity: ticket
        condition:
          kind: burnRate
          op: gte
          threshold: 1.0
          lookbackWindow: 3d
          alertAfter: 3h

  notificationTargets:
    # Per-µservice overlay points at its own escalation chain (PagerDuty rotation
    # / Slack channel / email DL) by referencing this template + overriding the
    # `to:` field in the per-µservice AlertNotificationTarget.
    - kind: AlertNotificationTarget
      ref: canonical-page-escalation
