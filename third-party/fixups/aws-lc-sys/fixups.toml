# aws-lc-sys build script drives C compilation (CcBuilder path on macOS aarch64 —
# no cmake needed; pregenerated bindings at src/aarch64_apple_darwin_crypto.rs).
# default-features must remain ON (founder constraint).

[buildscript.build]
# aws-lc-sys builder/main.rs uses env!("CARGO_PKG_VERSION") at const time.
# Global cargo_env covers the library rule but the build-script binary also needs them.
env = { CARGO_PKG_VERSION = "0.41.0", CARGO_PKG_VERSION_MAJOR = "0", CARGO_PKG_VERSION_MINOR = "41", CARGO_PKG_VERSION_PATCH = "0", CARGO_PKG_VERSION_PRE = "", CARGO_PKG_NAME = "aws-lc-sys" }

[buildscript.run]
# cc-rs requires OPT_LEVEL; Buck2 buildscript_run only injects it when the toolchain
# has an explicit -Copt-level= flag (system_rust_toolchain does not).
# rustc_link_lib/rustc_link_search capture cargo:rustc-link-lib=static=aws_lc_0_41_0_crypto
# and cargo:rustc-link-search=native=<OUT_DIR> so the native C lib links at binary link time.
rustc_link_lib = true
rustc_link_search = true
# No per-OS CC/AR — prelude injects target-correct CC/CXX/AR from the cxx toolchain.
# aws-lc-sys non-FIPS needs no perl/cmake/bindgen (pregenerated bindings + build files).
#
# LDFLAGS=-nostartfiles: aws-lc-sys's cc_builder compiler feature-test
# (memcmp_invalid_stripped_check) LINKS an executable via $CC. Under buck2 the build-script
# $CC is the prelude cc-shim `clang --ld-path=__ld_shim.sh`; __ld_shim re-invokes clang as the
# link driver, which RE-ADDS the C-runtime startfiles on top of the complete ld line the outer
# clang already passed → `ld.lld: duplicate symbol: _start/_init/...` on aarch64-linux (darwin
# ld64 tolerates it; almost no other build script links an executable via $CC). aws-lc-sys
# explicitly respects LDFLAGS for this probe (cc_builder.rs, "parity with CMake" for custom-linker
# setups), so -nostartfiles makes the OUTER clang omit its CRT; the inner __ld_shim clang adds one
# set → clean link, probe still runs. Compile steps are -c (flag ignored), so it is scoped to the
# probe link. Verified on rust-ci clang 19.1.7. Durable class-wide fix = a prelude patch.
env = { OPT_LEVEL = "3", DEBUG = "false", PROFILE = "release", LDFLAGS = "-nostartfiles" }
