# Compiles NEON C source for aarch64 blake3.
# Converted from [buildscript.run] to [[cxx_library]] to avoid the same exec-vs-target
# config mismatch as psm: buildscript_run OUT_DIR is populated under the exec config hash
# but $(location :...[out_dir]) at binary link time resolves to the empty target-config dir.
#
# ARCH NOTE: scoped to cfg(target_arch = "aarch64"). Linux aarch64 CI also matches (correct).
# x86_64 does not need a native library — but it DOES need the rust-intrinsics cfgs below.

buildscript.run = false

# Rust cfg that build.rs would have emitted for NEON support
['cfg(target_arch = "aarch64")']
cfgs = ["blake3_neon"]

# Rust cfgs that build.rs would have emitted on x86/x86_64 down its pure-Rust
# intrinsics path (build.rs:201-203, the is_pure()/NoCompiler/prefer_intrinsics arm).
# platform.rs references crate::{sse2,sse41,avx2} UNCONDITIONALLY on x86, while the
# module declarations in lib.rs are gated on these build.rs-emitted cfgs — without
# them the crate fails E0433 "cannot find sse2/sse41/avx2 in crate" on x86_64 CI.
# The std::arch intrinsics implementations are pure Rust: no cxx_library needed.
# blake3_avx512_ffi is deliberately NOT set (needs a C build); all avx512 references
# are themselves gated on that cfg, so dispatch simply tops out at AVX2.
['cfg(any(target_arch = "x86", target_arch = "x86_64"))']
cfgs = ["blake3_sse2_rust", "blake3_sse41_rust", "blake3_avx2_rust"]

[['cfg(target_arch = "aarch64")'.cxx_library]]
name = "blake3_neon"
srcs = ["c/blake3_neon.c"]
headers = ["c/*.h"]
preferred_linkage = "static"
