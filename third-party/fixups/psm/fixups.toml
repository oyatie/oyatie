# Compiles platform assembly for stack manipulation.
# Converted from [buildscript.run] to [[cxx_library]] to avoid the exec-vs-target
# config mismatch where buildscript_run OUT_DIR is populated under the exec config
# hash but $(location :...[out_dir]) at binary link time resolves to the target
# config hash directory, which is empty.
#
# ARCH NOTE: srcs below are scoped to cfg(target_arch = "aarch64") — darwin/aarch64 only.
# Linux aarch64 CI will also match this rule and compile the same .s (correct).
# Linux x86_64 CI will NOT match and must add an x86_64 section when needed.
# Windows is not supported in this worktree.

buildscript.run = false

# Rust cfgs that build.rs would have emitted via cargo:rustc-cfg=
['cfg(target_arch = "aarch64")']
# link_asm intentionally omitted: it triggers #![cfg_attr(link_asm, link(name="psm_s"))]
# which emits a bare -lpsm_s to the linker. The cxx_library dep below already provides
# the symbols directly as libpsm-0.1-psm_asm.pic.a — no -lpsm_s search needed.
cfgs = ["asm", "switchable_stack"]

[['cfg(target_arch = "aarch64")'.cxx_library]]
name = "psm_asm"
srcs = ["src/arch/aarch_aapcs64.s"]
headers = ["src/arch/psm.h", "src/arch/gnu_stack_note.s"]
# -xassembler-with-cpp allows the .s file to use C preprocessor #include / #define
compiler_flags = ["-xassembler-with-cpp"]
# DARWIN values only here — TOML/reindeer cxx_library fixups cannot express a select().
# psm.h decorates the asm symbol per-OS: darwin/macos/ios -> Mach-O leading underscore
# (_rust_psm_stack_pointer); ELF -> undecorated (rust_psm_stack_pointer). On the aarch64-linux
# gate the darwin value emits the Mach-O symbol while linux-ELF rustc references the undecorated
# one -> `ld.lld: undefined symbol: rust_psm_stack_pointer` at the rust_binary final link (#96/#78).
# The generated third-party/BUCK psm-0.1-psm_asm is HAND-PATCHED to a per-OS select
# (prelude//os:linux -> -DCFG_TARGET_OS_linux; DEFAULT -> -DCFG_TARGET_OS_darwin). PROVEN green
# on aarch64-linux. `reindeer buckify` WILL wipe that select -> re-apply post-buckify (same
# durable-DEP-propagation class as openssl #91 / aws-lc-sys #93).
preprocessor_flags = [
    "-DCFG_TARGET_OS_darwin",
    "-DCFG_TARGET_ARCH_aarch64",
    "-DCFG_TARGET_ENV_",
]
preferred_linkage = "static"
