# openssl wrapper crate: build script reads DEP_OPENSSL_* env vars propagated by
# openssl-sys (version number, include path, lib path) and emits rustc-check-cfg
# directives for conditional compilation of OpenSSL version guards.

[buildscript.run]
# DEP_OPENSSL_* vars are normally propagated by Cargo's links mechanism from
# openssl-sys. In Buck2 they must be injected manually.
# OpenSSL 3.6.2 at /opt/homebrew/opt/openssl@3: version=0x30600020
# conf is empty (no OPENSSL_NO_* defines in Homebrew OpenSSL@3).
env = { DEP_OPENSSL_VERSION_NUMBER = "30600020", DEP_OPENSSL_CONF = "", DEP_OPENSSL_INCLUDE = "/opt/homebrew/opt/openssl@3/include" }
