# openssl wrapper crate: build script reads DEP_OPENSSL_* env vars propagated by
# openssl-sys (version number, include path, lib path) and emits rustc-check-cfg
# directives for conditional compilation of OpenSSL version guards.

[buildscript.run]
# DEP_OPENSSL_* vars are normally propagated by Cargo's links mechanism from
# openssl-sys (which probes the ACTUAL platform OpenSSL). In Buck2 they must be
# injected manually — and they are PLATFORM-SPECIFIC.
#
# This static TOML can only hold ONE value per key, so it carries the darwin/dev
# values (homebrew OpenSSL@3): version=0x30600020, conf="" (no OPENSSL_NO_* defines),
# include=/opt/homebrew/opt/openssl@3/include.
#
# The Linux gate (Debian libssl-dev OpenSSL 3.5.6) DIFFERS and MUST override via a
# select() in the generated third-party/BUCK openssl-0.10-build-script-run env:
#   linux: DEP_OPENSSL_VERSION_NUMBER=30500060 (0x30500060 = 3.5.6),
#          DEP_OPENSSL_CONF="OPENSSL_NO_IDEA,OPENSSL_NO_SSL3_METHOD"
#            (= openssl-sys main.rs:132 tracked OPENSSL_NO_* set INTERSECT Debian's
#             defined macros; without it the openssl crate references ffi::EVP_idea_*
#             that openssl-sys never bound -> error[E0425], #91),
#          DEP_OPENSSL_INCLUDE=/usr/include.
# TOML cannot express select(), so `reindeer buckify` WILL wipe the BUCK select and
# emit only these darwin values — re-apply the select() in BUCK after any buckify
# (same DEP-propagation durability gap as DEP_AWS_LC_*; durable fix = a links-DEP
# propagation mechanism from openssl-sys).
env = { DEP_OPENSSL_VERSION_NUMBER = "30600020", DEP_OPENSSL_CONF = "", DEP_OPENSSL_INCLUDE = "/opt/homebrew/opt/openssl@3/include" }
