# openssl-sys: VENDORED (builds OpenSSL from bundled source via the toolchain cc) —
# hermetic + cross-platform, no system libssl / homebrew OPENSSL_DIR / pkg-config.
# Needs perl + make at build time (provided by the agent image, not per-crate env).
# Sourced transitively from webauthn-rs (FIDO2 attestation X.509).
features = ["vendored"]

[buildscript.build]
# openssl-sys find_normal.rs uses env!("CARGO_PKG_VERSION") at const time.
env = { CARGO_PKG_VERSION = "0.9.116", CARGO_PKG_VERSION_MAJOR = "0", CARGO_PKG_VERSION_MINOR = "9", CARGO_PKG_VERSION_PATCH = "116", CARGO_PKG_VERSION_PRE = "", CARGO_PKG_NAME = "openssl-sys" }

[buildscript.run]
# No per-OS CC/AR / OPENSSL_DIR — prelude injects target-correct CC/CXX/AR from the
# cxx toolchain; vendored builds openssl with it. OPT_LEVEL etc. for cc-rs.
env = { OPT_LEVEL = "3", DEBUG = "false", PROFILE = "release" }
