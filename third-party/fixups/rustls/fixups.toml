# ADR-0506 zero-ring provenance: rustls's `ring` feature is INTENTIONALLY NOT
# enabled in this workspace. The aws-lc-rs backend is the canonical crypto
# provider; rustls + rustls-webpki build on `aws-lc-rs` only. The sole historic
# activator of rustls's `ring` feature was sqlx's `runtime-tokio-rustls`, now
# pinned to `tls-rustls-aws-lc-rs` in the root Cargo.toml — so the dependency
# graph carries NO ring. If a future `reindeer buckify` re-emits a `ring`
# feature or a `:ring-0.17` dep on the rustls/rustls-webpki targets, that is a
# regression: drop it (and the orphaned ring-0.17 targets) and confirm
# `buck2 cquery "deps(//...)" | grep ring-0.17` stays at 0.
[buildscript]
# Pure cfg-detection build script — runs rustc version/feature probes only, no native compilation.
run = true
