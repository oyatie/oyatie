[buildscript]
# Pure cfg-detection build script — runs rustc version/feature probes only, no native compilation.
run = true

# ---------------------------------------------------------------------------
# PUBLIC visibility on the versioned library `:rustls-0.23`
#
# HAND-EDIT CLASS: durable fixup — re-applied post-buckify from
# scripts/ci/third-party-buckify-handedits.patch (same class as psm/aws-lc-sys/openssl).
# A reindeer `visibility = [...]` FIXUP CANNOT express this; see the note below.
#
# Intended edit in the `cargo.rust_library(name = "rustls-0.23", ...)` rule:
#       visibility = []   ->   visibility = ["PUBLIC"]
#
# Why a fixup CANNOT do it (verified against reindeer src @ 8d7a8c8):
#   - The fixups `visibility` key (src/fixups/config.rs `FixupConfig::visibility`)
#     only sets the visibility of the top-level *alias* rule (`alias(name = "rustls",
#     actual = ":rustls-0.23")`), NOT the versioned `cargo.rust_library` itself. Its
#     doc: "Limit an exposed crate's `alias`'s `visibility` ... only has an effect for
#     top-level crates" — it can only NARROW an already-public alias, never promote a lib.
#   - For a non-root, non-split package the versioned `cargo.rust_library.visibility`
#     is HARDCODED to `Visibility::Private` (src/buckify.rs ~1154) → renders `[]`.
#   - reindeer.toml here does NOT set `buck.split`, so there is no `vendor/...` package
#     path that would otherwise widen the lib's visibility.
#   - A `visibility` fixup on a package reindeer does not classify as public is rejected
#     ("only public packages can have a visibility fixup", src/unused.rs:91) and aborts
#     buckify, so it is not even a safe no-op.
#
# Consumer: oya/ci-controller/crates/oya-ci-controller-app/BUCK depends on the VERSIONED
# target `third-party//:rustls-0.23` directly (for installing the aws-lc-rs CryptoProvider
# as the rustls 0.23 process-default). Reindeer's PUBLIC alias is the unversioned
# `:rustls` (which it would emit only when the package is in the public set); the versioned
# lib stays private. Hence the post-buckify hand-edit on `:rustls-0.23` itself.
# ---------------------------------------------------------------------------
