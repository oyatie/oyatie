apiVersion: openslo/v1
kind: SLO
metadata:
  name: cash-position-success-rate
  labels:
    service: treasury
    sap_code: "TRM"
spec:
  description: "Treasury cash-position-success-rate objective; benchmarks SAP TRM Treasury and Risk Management | Oracle Fusion Cash Management | Workday Financial Management cash and treasury counterpart | NetSuite Cash Management | Microsoft Dynamics 365 Finance Cash and Bank"
  service: treasury
  indicator:
    metadata:
      name: cash-position-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_treasury_cash_position_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_treasury_cash_position_attempt_total[5m]))"
  objectives:
    - displayName: cash-position-success-rate
      target: 0.999
