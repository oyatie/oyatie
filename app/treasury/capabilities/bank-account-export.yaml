schema_version: "2.0"
name: treasury-bank-account-export
microservice: treasury
bounded_context: bank-account
autonomy_tier: T1
risk_class: regulated-erp
audit_event_class: EVT-TREASURY-BANK_ACCOUNT-EXPORT
policy_fragments:
  - app/treasury/policy/bank-account-authorization.cedar
benchmarks:
  - "SAP TRM Treasury and Risk Management"
  - "Oracle Fusion Cash Management"
  - "Workday Financial Management cash and treasury counterpart"
  - "NetSuite Cash Management"
  - "Microsoft Dynamics 365 Finance Cash and Bank"
inputs:
  required: [tenant_id, principal_id, idempotency_key, compliance_packs]
transport:
  rest: OpenAPI 3.2.0
  events: AsyncAPI 3.1.0
  grpc: proto3
settlement_boundary: marketplace-settles-tenant-deals-per-ADR-0314
