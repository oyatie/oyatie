// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.global_trade.v1;

option java_package = "dev.oyatie.global_trade.v1";

// SAP GTS; benchmarks: SAP GTS Global Trade Services | Oracle Global Trade Management | Workday supplier-compliance workflow counterpart | NetSuite international tax and trade counterpart | Microsoft Dynamics 365 global trade and export-control counterpart
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.

message CustomsDeclarationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message CustomsDeclarationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message SanctionsScreeningCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message SanctionsScreeningResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message ExportControlClassificationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message ExportControlClassificationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message TradeDocumentCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message TradeDocumentResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message DeniedPartyHitCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message DeniedPartyHitResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message BrokerFilingCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message BrokerFilingResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service GlobalTradeService {
  rpc MutateCustomsDeclaration (CustomsDeclarationCommand) returns (CustomsDeclarationResult);
  rpc MutateSanctionsScreening (SanctionsScreeningCommand) returns (SanctionsScreeningResult);
  rpc MutateExportControlClassification (ExportControlClassificationCommand) returns (ExportControlClassificationResult);
  rpc MutateTradeDocument (TradeDocumentCommand) returns (TradeDocumentResult);
  rpc MutateDeniedPartyHit (DeniedPartyHitCommand) returns (DeniedPartyHitResult);
  rpc MutateBrokerFiling (BrokerFilingCommand) returns (BrokerFilingResult);
}
