asyncapi: 3.1.0
info:
  title: Global Trade Events
  version: 1.0.0
  description: AsyncAPI 3.1.0 channels for SAP GTS parity events.
defaultContentType: application/json
channels:
  global-trade.customs-declaration.events.v1:
    address: global-trade.customs-declaration.events.v1
    messages:
      CustomsDeclarationChanged:
        $ref: "#/components/messages/CustomsDeclarationChanged"
  global-trade.sanctions-screening.events.v1:
    address: global-trade.sanctions-screening.events.v1
    messages:
      SanctionsScreeningChanged:
        $ref: "#/components/messages/SanctionsScreeningChanged"
  global-trade.export-control-classification.events.v1:
    address: global-trade.export-control-classification.events.v1
    messages:
      ExportControlClassificationChanged:
        $ref: "#/components/messages/ExportControlClassificationChanged"
  global-trade.trade-document.events.v1:
    address: global-trade.trade-document.events.v1
    messages:
      TradeDocumentChanged:
        $ref: "#/components/messages/TradeDocumentChanged"
  global-trade.denied-party-hit.events.v1:
    address: global-trade.denied-party-hit.events.v1
    messages:
      DeniedPartyHitChanged:
        $ref: "#/components/messages/DeniedPartyHitChanged"
  global-trade.broker-filing.events.v1:
    address: global-trade.broker-filing.events.v1
    messages:
      BrokerFilingChanged:
        $ref: "#/components/messages/BrokerFilingChanged"
components:
  messages:
    CustomsDeclarationChanged:
      name: CustomsDeclarationChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-CUSTOMS_DECLARATION-CHANGED
          bounded_context:
            type: string
            const: customs-declaration
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    SanctionsScreeningChanged:
      name: SanctionsScreeningChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-SANCTIONS_SCREENING-CHANGED
          bounded_context:
            type: string
            const: sanctions-screening
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    ExportControlClassificationChanged:
      name: ExportControlClassificationChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-EXPORT_CONTROL_CLASSIFICATION-CHANGED
          bounded_context:
            type: string
            const: export-control-classification
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    TradeDocumentChanged:
      name: TradeDocumentChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-TRADE_DOCUMENT-CHANGED
          bounded_context:
            type: string
            const: trade-document
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    DeniedPartyHitChanged:
      name: DeniedPartyHitChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-DENIED_PARTY_HIT-CHANGED
          bounded_context:
            type: string
            const: denied-party-hit
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    BrokerFilingChanged:
      name: BrokerFilingChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-GLOBAL_TRADE-BROKER_FILING-CHANGED
          bounded_context:
            type: string
            const: broker-filing
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
