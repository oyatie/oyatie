# Default values for oya-docs Helm chart.
# Per ADR-0131 (per-µservice flat layout) + ADR-0133 (LTS-pinned versions) +
# ADR-DOCS-0001 (Loro CRDT; cross-µservice consistent with workflow-studio) +
# ADR-DOCS-0003 (Pandoc + WeasyPrint + Chromium-headless inside gVisor) +
# ADR-DOCS-0004 (per-block ACL) + ADR-DOCS-0006 (DOCX import fidelity).
#
# Pack-specific overrides live in `iac/kustomize/overlays/pack-<region>/`.
# All secrets via `${openbao:secret/docs/<path>}` SecretReferences.

global:
  microservice: docs
  ltsImageRegistry: registry.oyatie.dev
  tenantId: "${TENANT_ID}"
  packRegion: kr
  observability:
    metricsPort: 9090
    tracingEndpoint: otel-collector.observability.svc.cluster.local:4317

# ---- Per-BC workloads ----------------------------------------------------

documentStore:
  replicaCount: 5
  image:
    repository: registry.oyatie.dev/oya-docs-document-store-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}
  port: 9101
  encryption:
    tenantDekRef: "${openbao:secret/docs/{tenant}/dek}"

collabCrdt:
  replicaCount: 5
  image:
    repository: registry.oyatie.dev/oya-docs-collab-crdt-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}
  port: 9102
  ws:
    leaseTtlSeconds: 3600
    opSignKeyRef: "${openbao:secret/docs/{pack}/crdt-op-sign-key}"
  loroVersion: "1.4.0"   # LTS pinned per ADR-DOCS-0001 (cross-µservice with workflow-studio)

blockTypes:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-block-types-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9103
  ammoniaVersion: "4.0.0"
  katexVersion: "0.16.10"

commentsAndSuggestions:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-comments-and-suggestions-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9104

versionHistory:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-version-history-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9105
  compactionPolicy:
    versionAligned: true
    everyNVersions: 100

sharingAndPermissions:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-sharing-and-permissions-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9106
  shareLink:
    signingKeyRef: "${openbao:secret/docs/{pack}/share-link-sign-key}"
    keyRotationDays: 90

exportImport:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-export-import-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9107
  workerPoolSize: 10
  gvisorRuntime: runsc
  pandocVersion: "3.6.0"      # LTS pinned per ADR-DOCS-0003
  weasyprintVersion: "62.3"   # LTS pinned per ADR-DOCS-0003
  chromiumVersion: "120.0.6099.224"  # LTS pinned per ADR-DOCS-0003
  veraPdfVersion: "1.26.1"    # PDF/A validator per AC-10
  maxFileSizeBytes: 104857600        # 100 MiB per import; per ADR-DOCS-0006
  ooxmlFidelityFloor: 0.95

embedResolver:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-docs-embed-resolver-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9108
  embedDepthBound: 3
  snapshotTtlSeconds: 300
  ttlJitterSeconds: 30

# ---- Underlying state stores --------------------------------------------

postgres:
  enabled: true
  image:
    repository: registry.oyatie.dev/cloudnative-pg
    tag: "16.4.0"
  rls:
    perTenant: true
    perBlockAcl: true     # ADR-DOCS-0004
  ha:
    syncReplicas: 1
    streamingReplicas: 2
  storage:
    size: 400Gi
  backup:
    s3Ref: "${openbao:secret/docs/{pack}/backup-s3}"

s3:
  enabled: true
  bucketRef: "${openbao:secret/docs/{pack}/s3-bucket}"
  objectLockEnabledForLegalHold: true
  versioning: enabled
  perTenantPrefix: true

valkey:
  enabled: true
  image:
    repository: registry.oyatie.dev/valkey-cluster
    tag: "7.4.0"
  clusterMode: true
  shards: 5
  evictionPolicy: volatile-lru
  persistence:
    aof: every-sec

# ---- Attachment scanners ---------------------------------------------

clamav:
  enabled: true                # default for all packs except us-healthcare
  image:
    repository: registry.oyatie.dev/clamav
    tag: "1.3.0"
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 1,    memory: 1Gi}

opswat:
  enabled: false               # enabled only via pack-us-healthcare overlay
  image:
    repository: registry.oyatie.dev/opswat-metadefender
    tag: "5.6.0"
  licenseKeyRef: "${openbao:secret/docs/us-healthcare/opswat-license}"

# ---- Untrusted-content sandbox pool (export workers per ADR-DOCS-0003) -----
# RuntimeClass selection delegated to oya.runtimeClassName.untrustedContent
# canonical Helm helper per ADR-0147 (amended 2026-05-18: Cloud Hypervisor
# / kata-clh default; kata-clh-sev-snp for sovereign tier).

# NOTE: the values key `gvisor:` is a historical chart-input name; the
# active runtime is now Cloud Hypervisor (kata-clh). The key name is
# retained because the chart template references `.Values.gvisor.perJobTmpfsBytes`;
# rename will follow in a coordinated chart-input migration.
gvisor:
  enabled: true
  # runtimeClassName moved to canonical helper per ADR-0147 (amended:
  # Cloud Hypervisor primary). This key retained only as a transitional
  # fallback for tooling that still reads it; the helper emits kata-clh.
  runtimeClassName: kata-clh
  poolSize: 10
  perJobTmpfsBytes: 1073741824   # 1 GiB tmpfs
  noNetworkEgress: true
  seccompProfile: RuntimeDefault

# ---- HPA + PDB + NetworkPolicy + ServiceMonitor + PrometheusRule -------

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"

networkPolicy:
  enabled: true
  meshOnly: true

serviceMonitor:
  enabled: true
  interval: 30s

prometheusRule:
  enabled: true
