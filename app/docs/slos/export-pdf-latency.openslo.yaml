# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-export-pdf-latency
  displayName: "docs: export PDF p99 (50-page doc)"
  labels:
    microservice: docs
    bc: export-import
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: PERSONAL_DOC_CONTENT,PROFESSIONAL_DOC_CONTENT
spec:
  description: |
    PDF export p99 latency SLO. A 50-page PDF export job (WeasyPrint default
    backend; Chromium fallback) completes in ≤ 3s. Includes gVisor sandbox
    spin-up. Per ADR-DOCS-0003 + PRD-docs §"Performance".
  service: docs
  indicator:
    metadata: {name: docs-export-pdf-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_docs_export_pdf_seconds_bucket{doc_size_bucket="50-page"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 3.0
      displayName: "30d rolling p99 ≤ 3s (50-page doc)"
  alertPolicies:
    - alertPolicyRef: docs-export-pdf-fast-burn-1h-14x
    - alertPolicyRef: docs-export-pdf-slow-burn-6h-6x
