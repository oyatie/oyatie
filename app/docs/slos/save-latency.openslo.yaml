# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-save-latency
  displayName: "docs: save p99"
  labels:
    microservice: docs
    bc: document-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: PERSONAL_DOC_CONTENT,PROFESSIONAL_DOC_CONTENT
spec:
  description: |
    Save p99 latency SLO. A request is "good" when a CRDT commit + audit emit
    + outbox write completes in ≤ 100ms. PRD-docs §"Performance" + ADR-DOCS-0001
    (CRDT op spool write latency). Compaction-time exempted (background).
  service: docs
  indicator:
    metadata: {name: docs-save-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_docs_save_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.1
      displayName: "30d rolling p99 ≤ 100ms"
  alertPolicies:
    - alertPolicyRef: docs-save-fast-burn-1h-14x
    - alertPolicyRef: docs-save-slow-burn-6h-6x
