# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-doc-open-latency
  displayName: "docs: document-open p99 (cold + warm)"
  labels:
    microservice: docs
    bc: document-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: PERSONAL_DOC_CONTENT,PROFESSIONAL_DOC_CONTENT
spec:
  description: |
    Document open p99 latency SLO. A request is "good" when a document-open
    REST call (cold or warm) resolves in ≤ 300ms (cold) / ≤ 100ms (warm).
    Cold = no Valkey cache hit (S3 + Postgres read); warm = Valkey cache hit.
    PRD-docs §"Performance". Aligned with workflow-studio AC-09 TTI budget.
  service: docs
  indicator:
    metadata: {name: docs-doc-open-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_docs_document_open_seconds_bucket{cache_kind="cold"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.3
      displayName: "30d rolling p99 ≤ 300ms (cold)"
  alertPolicies:
    - alertPolicyRef: docs-doc-open-fast-burn-1h-14x
    - alertPolicyRef: docs-doc-open-slow-burn-6h-6x
