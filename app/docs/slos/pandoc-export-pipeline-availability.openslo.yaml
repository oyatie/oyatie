# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-pandoc-export-pipeline-availability
  displayName: "docs: Pandoc-based export pipeline availability"
  labels:
    microservice: docs
    bc: export-import
    sli_class: availability
    tier: hero-product
    owner_team: axis-docs + ops-sre-reliability
    pack_scope: all
    data_classes: PERSONAL_DOC_CONTENT,PROFESSIONAL_DOC_CONTENT
spec:
  description: |
    Pandoc-based export pipeline availability SLO. An export job (DOCX /
    Markdown / HTML / EPUB / LaTeX via Pandoc; PDF via WeasyPrint default or
    Chromium opt-in) is "good" when it returns succeeded status OR returns
    a documented `failed_unsupported_feature` failure (a deliberate user-
    visible "this feature is unsupported" result, not a server failure).
    Target: 99.9% over 30d rolling. Per ADR-DOCS-0003 + ADR-DOCS-0006.
  service: docs
  indicator:
    metadata: {name: docs-export-pipeline-availability-ratio}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_docs_export_job_total{status=~"succeeded|failed_unsupported_feature"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_docs_export_job_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.999
      displayName: "30d rolling 99.9% export pipeline availability"
  alertPolicies:
    - alertPolicyRef: docs-export-fast-burn-1h-14x
    - alertPolicyRef: docs-export-slow-burn-6h-6x
    - alertPolicyRef: docs-export-ticket-burn-3d-1x
