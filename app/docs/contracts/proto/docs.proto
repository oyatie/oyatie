// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oya.docs.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "oyatie.dev/docs/v1;docsv1";

// =====================================================================================
// Docs µservice gRPC contracts.
//
// Per ADR-0135 (unbundle) + ADR-0132 (no-grouping policy) + ADR-0131 (per-µservice
// flat layout). Mirrors the REST surface defined in `contracts/openapi/docs.yaml`.
//
// Authentication: SPIFFE-bound mTLS/TLS 1.3 for this internal-only gRPC contract.
// Public OIDC/API-key authentication belongs to the REST/OpenAPI surface.
// Authorisation: Cedar policies per `policy/*.cedar`.
// Dual-context isolation: Personal vs Professional document types are NOT a shared enum;
// the gRPC service exposes two endpoint families to enforce structural separation.
// Per-block ACL per ADR-DOCS-0004. CRDT op envelope per ADR-DOCS-0001 (Loro 1.x; shared
// shape with workflow-studio per ADR-WS-0001).
// =====================================================================================

// ==================== Common ====================

enum DocumentContext {
  DOCUMENT_CONTEXT_UNSPECIFIED = 0;
  DOCUMENT_CONTEXT_PERSONAL = 1;
  DOCUMENT_CONTEXT_PROFESSIONAL = 2;
}

enum BlockKind {
  BLOCK_KIND_UNSPECIFIED = 0;
  BLOCK_KIND_PARAGRAPH = 1;
  BLOCK_KIND_HEADING_1 = 2;
  BLOCK_KIND_HEADING_2 = 3;
  BLOCK_KIND_HEADING_3 = 4;
  BLOCK_KIND_ORDERED_LIST = 5;
  BLOCK_KIND_UNORDERED_LIST = 6;
  BLOCK_KIND_CHECKLIST = 7;
  BLOCK_KIND_TABLE = 8;
  BLOCK_KIND_IMAGE = 9;
  BLOCK_KIND_EMBED = 10;
  BLOCK_KIND_CODE = 11;
  BLOCK_KIND_MATH = 12;
  BLOCK_KIND_CALLOUT = 13;
  BLOCK_KIND_DIVIDER = 14;
  BLOCK_KIND_PAGE_BREAK = 15;
}

enum BlockVisibility {
  BLOCK_VISIBILITY_UNSPECIFIED = 0;
  BLOCK_VISIBILITY_PUBLIC = 1;
  BLOCK_VISIBILITY_TEAM_VISIBLE = 2;
  BLOCK_VISIBILITY_PRIVATE = 3;
}

enum ShareRole {
  SHARE_ROLE_UNSPECIFIED = 0;
  SHARE_ROLE_VIEWER = 1;
  SHARE_ROLE_COMMENTER = 2;
  SHARE_ROLE_EDITOR = 3;
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_PDF = 1;
  EXPORT_FORMAT_PDF_A_1B = 2;
  EXPORT_FORMAT_PDF_A_2U = 3;
  EXPORT_FORMAT_DOCX = 4;
  EXPORT_FORMAT_MARKDOWN = 5;
  EXPORT_FORMAT_HTML = 6;
  EXPORT_FORMAT_EPUB = 7;
  EXPORT_FORMAT_LATEX = 8;
}

message BlockAcl {
  BlockVisibility visibility = 1;
  repeated string principals_user_ids = 2;
  repeated string teams_team_ids = 3;
  bool inherited_from_doc = 4;
}

message Block {
  string block_id = 1;
  BlockKind kind = 2;
  int32 position = 3;
  string text = 4;
  map<string, string> attributes = 5;
  BlockAcl acl = 6;
  repeated Block children = 7;
}

message BlockTree {
  string root_block_id = 1;
  repeated Block blocks = 2;
}

message Document {
  string document_id = 1;
  string tenant_id = 2;
  DocumentContext context = 3;
  string title = 4;
  BlockTree block_tree = 5;
  string retention_policy_id = 6;
  bool legal_hold_open = 7;
  int64 version = 8;
  string version_sha = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Anchor {
  string block_id = 1;
  string start_tree_id = 2;
  string end_tree_id = 3;
}

message Comment {
  string comment_id = 1;
  string document_id = 2;
  string thread_id = 3;
  Anchor anchor = 4;
  string text = 5;
  string author_user_id = 6;
  bool resolved = 7;
  google.protobuf.Timestamp posted_at = 8;
}

message Suggestion {
  string suggestion_id = 1;
  string document_id = 2;
  Anchor anchor = 3;
  string proposed_content = 4;
  string author_user_id = 5;
  string state = 6; // "pending" | "accepted" | "rejected"
  google.protobuf.Timestamp proposed_at = 7;
}

message ShareGrant {
  string grant_id = 1;
  string document_id = 2;
  string grantee_user_id = 3;
  ShareRole role = 4;
  google.protobuf.Timestamp granted_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ShareLink {
  string share_link_id = 1;
  string document_id = 2;
  ShareRole role = 3;
  string token = 4; // Ed25519-signed
  google.protobuf.Timestamp expires_at = 5;
}

message Version {
  string version_id = 1;
  string document_id = 2;
  string version_sha = 3;
  google.protobuf.Timestamp sealed_at = 4;
  string author_user_id = 5;
}

message ExportJob {
  string job_id = 1;
  string document_id = 2;
  ExportFormat format = 3;
  string status = 4; // "queued" | "running" | "succeeded" | "failed"
  string download_url = 5;
  string sha256 = 6;
}

message ImportJob {
  string job_id = 1;
  string status = 2; // "queued" | "running" | "succeeded" | "failed"
  string document_id = 3;
  float fidelity_ratio = 4;
  repeated string unsupported_features = 5;
}

message Attachment {
  string attachment_id = 1;
  string document_id = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  string mime_type = 5;
  string scan_status = 6;
}

message EmbedSnapshot {
  string embed_ref = 1;
  string source_microservice = 2;
  string snapshot_blob_url = 3;
  google.protobuf.Timestamp refreshed_at = 4;
  int32 staleness_seconds = 5;
  string source_acl_passthrough_status = 6;
}

message LegalHold {
  string hold_id = 1;
  string document_id = 2;
  string opened_by = 3;
  google.protobuf.Timestamp opened_at = 4;
  google.protobuf.Timestamp released_at = 5;
}

// ==================== CRDT Op Envelope (per ADR-DOCS-0001 + ADR-WS-0001) ====================

message CrdtOp {
  string op_id = 1;
  string tenant_id = 2;
  string document_id = 3;
  string author_spiffe_identity = 4;
  string op_kind = 5; // "insert" | "delete" | "update" | "move" | "format"
  bytes op_payload = 6; // Loro-serialised op bytes
  int64 loro_lamport = 7;
  string loro_peer_id = 8;
  bytes signature = 9; // Ed25519 signature at WS gateway
  google.protobuf.Timestamp occurred_at = 10;
}

// ==================== Document Store ====================

service DocumentStore {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc UpdateDocumentMetadata(UpdateDocumentMetadataRequest) returns (Document);
  rpc ArchiveDocument(ArchiveDocumentRequest) returns (google.protobuf.Empty);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc OpenLegalHold(OpenLegalHoldRequest) returns (LegalHold);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (google.protobuf.Empty);
}

message CreateDocumentRequest {
  DocumentContext context = 1;
  string title = 2;
  BlockTree initial_block_tree = 3;
}

message GetDocumentRequest {
  string document_id = 1;
}

message UpdateDocumentMetadataRequest {
  string document_id = 1;
  string title = 2;
  bool archived = 3;
}

message ArchiveDocumentRequest {
  string document_id = 1;
}

message ListDocumentsRequest {
  DocumentContext context = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  string next_cursor = 2;
}

message OpenLegalHoldRequest {
  string document_id = 1;
  string opened_by_user_id = 2;
  string reason = 3;
}

message ReleaseLegalHoldRequest {
  string document_id = 1;
  string hold_id = 2;
}

// ==================== Block Types ====================

service BlockTypes {
  rpc ApplyBlockOperations(ApplyBlockOperationsRequest) returns (Document);
  rpc SetBlockAcl(SetBlockAclRequest) returns (Block);
}

message ApplyBlockOperationsRequest {
  string document_id = 1;
  repeated BlockOperation ops = 2;
  string expected_version_sha = 3;
}

message BlockOperation {
  string op_kind = 1; // "insert" | "update" | "delete" | "move"
  string block_id = 2;
  bytes payload = 3;
}

message SetBlockAclRequest {
  string document_id = 1;
  string block_id = 2;
  BlockAcl acl = 3;
}

// ==================== Collab CRDT (streaming) ====================

service CollabCrdt {
  rpc StreamCrdtOps(stream CrdtOp) returns (stream CrdtOp);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
}

message GetPresenceRequest {
  string document_id = 1;
}

message GetPresenceResponse {
  repeated PresenceSnapshot presences = 1;
}

message PresenceSnapshot {
  string principal_user_id = 1;
  string cursor_block_id = 2;
  int32 cursor_offset = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

// ==================== Comments + Suggestions ====================

service Comments {
  rpc AddComment(AddCommentRequest) returns (Comment);
  rpc ResolveComment(ResolveCommentRequest) returns (Comment);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
}

message AddCommentRequest {
  string document_id = 1;
  Anchor anchor = 2;
  string text = 3;
  string thread_id = 4;
}

message ResolveCommentRequest {
  string comment_id = 1;
}

message ListCommentsRequest {
  string document_id = 1;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

service Suggestions {
  rpc AddSuggestion(AddSuggestionRequest) returns (Suggestion);
  rpc RespondSuggestion(RespondSuggestionRequest) returns (Suggestion);
}

message AddSuggestionRequest {
  string document_id = 1;
  Anchor anchor = 2;
  string proposed_content = 3;
}

message RespondSuggestionRequest {
  string suggestion_id = 1;
  string response = 2; // "accept" | "reject"
}

// ==================== Version History ====================

service VersionHistory {
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc RevertToVersion(RevertToVersionRequest) returns (Document);
}

message ListVersionsRequest {
  string document_id = 1;
}

message ListVersionsResponse {
  repeated Version versions = 1;
}

message RevertToVersionRequest {
  string document_id = 1;
  string version_id = 2;
}

// ==================== Sharing ====================

service Sharing {
  rpc GrantShare(GrantShareRequest) returns (ShareGrant);
  rpc RevokeShare(RevokeShareRequest) returns (google.protobuf.Empty);
  rpc IssueShareLink(IssueShareLinkRequest) returns (ShareLink);
  rpc RedeemShareLink(RedeemShareLinkRequest) returns (Document);
  rpc ListShareGrants(ListShareGrantsRequest) returns (ListShareGrantsResponse);
}

message GrantShareRequest {
  string document_id = 1;
  string grantee_user_id = 2;
  ShareRole role = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message RevokeShareRequest {
  string grant_id = 1;
}

message IssueShareLinkRequest {
  string document_id = 1;
  ShareRole role = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RedeemShareLinkRequest {
  string token = 1;
}

message ListShareGrantsRequest {
  string document_id = 1;
}

message ListShareGrantsResponse {
  repeated ShareGrant grants = 1;
}

// ==================== Export + Import ====================

service ExportImport {
  rpc SubmitExport(SubmitExportRequest) returns (ExportJob);
  rpc GetExportJob(GetExportJobRequest) returns (ExportJob);
  rpc SubmitImport(SubmitImportRequest) returns (ImportJob);
  rpc GetImportJob(GetImportJobRequest) returns (ImportJob);
}

message SubmitExportRequest {
  string document_id = 1;
  ExportFormat format = 2;
  bytes options = 3;
}

message GetExportJobRequest {
  string job_id = 1;
}

message SubmitImportRequest {
  bytes file = 1;
  string source_format = 2;
}

message GetImportJobRequest {
  string job_id = 1;
}

// ==================== Attachments ====================

service Attachments {
  rpc UploadAttachment(UploadAttachmentRequest) returns (Attachment);
  rpc GetAttachment(GetAttachmentRequest) returns (Attachment);
}

message UploadAttachmentRequest {
  string document_id = 1;
  bytes file = 2;
  string mime_type = 3;
}

message GetAttachmentRequest {
  string attachment_id = 1;
}

// ==================== Embed Resolver ====================

service EmbedResolver {
  rpc ResolveEmbed(ResolveEmbedRequest) returns (EmbedSnapshot);
}

message ResolveEmbedRequest {
  string document_id = 1;
  string embed_ref = 2;
}
