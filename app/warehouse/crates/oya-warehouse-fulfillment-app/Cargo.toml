[package]
name = "oya-warehouse-fulfillment-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Warehouse fulfillment application surface."

[package.metadata.oya]
microservice = "warehouse"
title = "Warehouse"
bounded_context = "warehouse-fulfillment"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-warehouse + council-product"
data_classification = "tenant-scoped warehouse records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/warehouse-v1.proto"

[lib]
name = "oya_warehouse_fulfillment_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-warehouse-fulfillment"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
