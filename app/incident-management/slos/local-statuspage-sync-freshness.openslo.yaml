apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-statuspage-sync-freshness
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: incident-management
  description: Status page projection freshness for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations.
  indicator:
    metadata:
      name: statuspage-sync-freshness
      labels:
        domain_object: IncidentCommand
        operator_audience: ONCALL_RESPONDER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_statuspage_sync_freshness_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_statuspage_sync_freshness_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Status page projection freshness
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
