apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-audit-emission-lag
  labels:
    service: incident-management
    adr: ADR-0139
spec:
  service: incident-management
  indicator:
    metadata:
      name: audit-emission-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_audit_emission_lag_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_audit_emission_lag_total[5m]))
  objectives:
    - displayName: Incident Management audit-emission-lag
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
