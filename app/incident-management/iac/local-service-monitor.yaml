apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: incident-management-local-ops
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: incident-management
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_incident_management_page_to_acknowledge_good_total
    - oya_incident_management_escalation_delivery_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-page-dispatch-guard.cedar
