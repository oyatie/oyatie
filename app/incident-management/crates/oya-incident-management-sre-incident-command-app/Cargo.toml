[package]
name = "oya-incident-management-sre-incident-command-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Incident Management SRE incident command application surface."

[package.metadata.oya]
microservice = "incident-management"
title = "Incident Management"
bounded_context = "sre-incident-command"
layer = "app"
wave = "wave-3-k"
owner_team = "axis-incident-management + council-product"
data_classification = "tenant-scoped operational records with audit evidence"
criticality_tier = "Tier 0"
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0132", "ADR-0316"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/incident-management-v1.proto"

[lib]
name = "oya_incident_management_sre_incident_command_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-incident-management-sre-incident-command"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
