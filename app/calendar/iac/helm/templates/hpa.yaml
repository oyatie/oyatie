{{/*
Per-BC HPA. Per PRD §"State strategy" — events-rest + availability-rest
+ CalDAV are CPU-bound; HPA scales on CPU 70% per ADR-0131 + PRD-calendar
§"Scale-out policy".
*/}}
{{- if $.Values.autoscaling.enabled }}
{{- range $bc := list "event-store" "availability-resolver" "ics-import-export" "invitation-flow" "recurrence-engine" "room-booking" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: calendar-{{ $bc }}-app-hpa
  namespace: calendar
  labels:
    microservice: calendar
    bc: {{ $bc }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calendar-{{ $bc }}-app
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 10, periodSeconds: 60}]
{{- end }}
{{- end }}
