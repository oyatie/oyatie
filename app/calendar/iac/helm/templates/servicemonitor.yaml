{{/*
ServiceMonitor — Prometheus scrape config; per-µservice job labels.
*/}}
{{- if $.Values.serviceMonitor.enabled }}
{{- range $bc := list "event-store" "recurrence-engine" "availability-resolver" "room-booking" "invitation-flow" "ics-import-export" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: calendar-{{ $bc }}-sm
  namespace: calendar
  labels:
    microservice: calendar
    bc: {{ $bc }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      microservice: calendar
      bc: {{ $bc }}
  namespaceSelector:
    matchNames: [calendar]
  endpoints:
    - port: metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      scrapeTimeout: 25s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace}
        - {sourceLabels: [__meta_kubernetes_pod_label_microservice], targetLabel: microservice}
        - {sourceLabels: [__meta_kubernetes_pod_label_bc], targetLabel: bc}
{{- end }}
{{- end }}
