{{/*
Per-BC Service template — one Service per BC. Per ADR-0131.
*/}}
{{- range $bc := list "event-store" "recurrence-engine" "availability-resolver" "room-booking" "invitation-flow" "ics-import-export" }}
{{- $cfg := index $.Values (printf "%s" ($bc | replace "-" "")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-{{ $bc }}-app
  namespace: calendar
  labels:
    microservice: calendar
    bc: {{ $bc }}
spec:
  type: ClusterIP
  selector:
    microservice: calendar
    bc: {{ $bc }}
  ports:
    - {name: app,     port: {{ $cfg.port }}, targetPort: {{ $cfg.port }}, protocol: TCP}
    - {name: metrics, port: {{ $.Values.global.observability.metricsPort }}, targetPort: metrics, protocol: TCP}
{{- end }}
