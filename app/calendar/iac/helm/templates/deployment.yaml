{{/*
Per-BC Deployment template — one Deployment per BC (event-store,
recurrence-engine, availability-resolver, room-booking, invitation-flow,
ics-import-export). Per ADR-0131 per-µservice flat layout +
ADR-CAL-0001/0002/0004 component bindings.
*/}}
{{- range $bc := list "event-store" "recurrence-engine" "availability-resolver" "room-booking" "invitation-flow" "ics-import-export" }}
{{- $cfg := index $.Values (printf "%s" ($bc | replace "-" "")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-calendar-{{ $bc }}-app
  namespace: calendar
  labels:
    microservice: calendar
    bc: {{ $bc }}
    app.kubernetes.io/name: oya-calendar-{{ $bc }}-app
    app.kubernetes.io/version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      microservice: calendar
      bc: {{ $bc }}
  template:
    metadata:
      labels:
        microservice: calendar
        bc: {{ $bc }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.global.observability.metricsPort }}"
    spec:
      serviceAccountName: oya-calendar
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app,     containerPort: {{ $cfg.port }}, protocol: TCP}
            - {name: metrics, containerPort: {{ $.Values.global.observability.metricsPort }}, protocol: TCP}
          env:
            - {name: OYA_MICROSERVICE,   value: calendar}
            - {name: OYA_BC,             value: {{ $bc }}}
            - {name: OYA_PACK_REGION,    value: {{ $.Values.global.packRegion }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ $.Values.global.observability.tracingEndpoint }}"}
            - {name: RUST_LOG, value: info}
          resources:
{{ toYaml $cfg.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
