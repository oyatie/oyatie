apiVersion: v2
name: oya-calendar
description: |
  Helm chart for the oyatie calendar µservice. Bundles the per-BC
  Deployments + Services + HPAs + PDBs + NetworkPolicies +
  ServiceMonitors + PrometheusRules + CronJob for the IANA tzdb
  refresh worker. Pulls dependency charts for the CalDAV backends
  (Radicale primary, SabreDAV for pack-us-healthcare per ADR-CAL-0001),
  Postgres (event-store), and Valkey (availability-resolver cache).

  Per ADR-0131 (per-µservice flat layout) + ADR-0133 (LTS-pinned
  versions) + ADR-CAL-0001 (CalDAV backend selection) + ADR-CAL-0004
  (tzdb refresh worker).
type: application
version: 1.0.0
appVersion: "1.0.0"
maintainers:
  - name: axis-calendar
    email: calendar@oyatie.com
keywords:
  - calendar
  - rfc-5545
  - caldav
  - rfc-4791
  - rfc-6638
  - scheduling
home: https://oyatie.com/microservices/calendar
sources:
  - https://github.com/oyatie/oyatie/tree/main/microservices/calendar
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Initial calendar µservice Helm chart (M03 ship surface)"
  artifacthub.io/license: Internal-Use
dependencies:
  - name: radicale
    version: "3.2.3"   # LTS pinned per ADR-CAL-0001
    repository: "oci://registry.oyatie.dev/charts/radicale"
    condition: radicale.enabled
  - name: sabredav
    version: "4.6.0"   # LTS pinned per ADR-CAL-0001 (us-healthcare overlay only)
    repository: "oci://registry.oyatie.dev/charts/sabredav"
    condition: sabredav.enabled
  - name: postgres
    version: "16.4.0"  # CloudNativePG LTS per docs/standards/observability-slo.md
    repository: "oci://registry.oyatie.dev/charts/cloudnative-pg"
    condition: postgres.enabled
  - name: valkey
    version: "7.4.0"   # LTS per docs/standards/observability-slo.md
    repository: "oci://registry.oyatie.dev/charts/valkey-cluster"
    condition: valkey.enabled
