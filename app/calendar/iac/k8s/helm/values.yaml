microservice:
  id: calendar
  cargoPackage: oya-calendar
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: runc

serviceAccount:
  name: oya-calendar

image:
  registry: registry.oyatie.dev
  repository: oya-calendar
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-calendar-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    // Deployed Cedar for calendar is FAIL-CLOSED DEFAULT-DENY: it ships no permit statements,
    // so Cedar denies every request that is not explicitly permitted.
    //
    // Authorization for calendar workloads rides the cloud-iam PDP, which loads the authored
    // policy set under app/calendar/policy/*.cedar and app/calendar/cedar/policies.cedar
    // (auditor-scope, ci-scope, public-read, tenant-scope, sharding/ADR-0346-0349 fragments).
    // Per the cedar-deploy-parity gate (GH #16 / ADR-0608), a deployed ConfigMap must never
    // carry an over-broad tenant-class blanket permit or grant more than the capability
    // authored; until the calendar microservices land with a real deployed policy, this
    // placeholder intentionally deploys no permits (Cedar default deny) so nothing is
    // authorized that the authored policy has not explicitly allowed.

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
