# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-freebusy-query-latency
  displayName: "calendar: free/busy query p99 (1k attendees)"
  labels:
    microservice: calendar
    bc: availability-resolver
    sli_class: latency
    tier: hero-product
    owner_team: axis-calendar
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Free/busy query p99 latency SLO. A request is "good" when a free/busy
    query for up to 1,000 attendees (intra-tenant OR Cedar-admitted cross-
    tenant) resolves in ≤ 200ms. PRD-calendar §"Performance" + problem-
    statement target (200ms p99 for 1k attendees). Cross-tenant queries
    return ONLY free/busy projections — never raw event content; that
    invariant is tested separately via the dual-context-correctness lane.
  service: calendar
  indicator:
    metadata: {name: calendar-freebusy-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_calendar_freebusy_query_seconds_bucket{attendee_count_bucket="1k"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.2
      displayName: "30d rolling p99 ≤ 200ms (1k attendees)"
  alertPolicies:
    - alertPolicyRef: calendar-freebusy-fast-burn-1h-14x
    - alertPolicyRef: calendar-freebusy-slow-burn-6h-6x
