# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-scheduling-convergence-latency
  displayName: "calendar: scheduling-poll convergence p95 (RFC 6638)"
  labels:
    microservice: calendar
    bc: invitation-flow
    sli_class: latency
    tier: hero-product
    owner_team: axis-calendar
    pack_scope: all
    data_classes: PII_IDENTIFYING,BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Scheduling-poll convergence p95 latency SLO. A poll is "good" when, from
    the time the last attendee response arrives (or `dtdue` boundary
    passes), the poll resolves to a final VEVENT and the resolution is
    written to event-store in ≤ 500ms. Per problem-statement +
    `runbooks/scheduling-poll-deadlock.md` + RFC 6638 §5 ordering
    semantics.
  service: calendar
  indicator:
    metadata: {name: calendar-scheduling-poll-convergence-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(calendar_scheduling_poll_convergence_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.5
      displayName: "30d rolling p95 ≤ 500ms (last-response → resolution)"
  alertPolicies:
    - alertPolicyRef: calendar-scheduling-fast-burn-1h-14x
    - alertPolicyRef: calendar-scheduling-slow-burn-6h-6x
