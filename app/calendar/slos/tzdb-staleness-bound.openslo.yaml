# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-tzdb-staleness-bound
  displayName: "calendar: IANA tzdb cluster-default staleness ≤ 30d"
  labels:
    microservice: calendar
    bc: event-store
    sli_class: correctness
    tier: load-bearing-invariant
    owner_team: axis-calendar + ops-sre-reliability
    pack_scope: all
    data_classes: INTERNAL_ONLY
    compliance: [ADR-CAL-0004]
spec:
  description: |
    IANA tzdb staleness-bound SLO. The cluster-default tzdb release MUST
    be no more than 30 days behind the latest IANA release. The metric
    `calendar_tzdb_cluster_default_staleness_days` is "good" iff it
    is ≤ 30 days. Per ADR-CAL-0004 §"30d refresh window". Tenant-pinned
    tzdb is tracked separately via `calendar_tzdb_release_in_use`
    per-tenant; this SLO governs cluster-default only.
  service: calendar
  indicator:
    metadata: {name: calendar-tzdb-staleness}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              max(calendar_tzdb_cluster_default_staleness_days)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 1.0
      op: lte
      value: 30
      displayName: "100% of timeslices ≤ 30 days stale; any exceedance is Sev-2"
  alertPolicies:
    - alertPolicyRef: calendar-tzdb-staleness-exceedance-page
