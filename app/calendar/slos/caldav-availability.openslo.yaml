# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-caldav-availability
  displayName: "calendar: CalDAV availability (RFC 4791)"
  labels:
    microservice: calendar
    bc: ics-import-export
    sli_class: availability
    tier: hero-product
    owner_team: axis-calendar + ops-sre-reliability
    pack_scope: all
    data_classes: PERSONAL_EVENT_CONTENT,PROFESSIONAL_EVENT_CONTENT
spec:
  description: |
    CalDAV availability SLO. A CalDAV request (PROPFIND / REPORT / PUT /
    DELETE per RFC 4791) is "good" when it returns a 2xx OR a documented
    4xx (per RFC 4791 §11 error codes — these are correct-client-error
    behaviours, not server failures). Backend: Radicale primary +
    SabreDAV (pack-us-healthcare) per ADR-CAL-0001.
    Target: 99.95% over 30d rolling.
  service: calendar
  indicator:
    metadata: {name: calendar-caldav-availability-ratio}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(calendar_caldav_request_total{status_class=~"2..|4.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(calendar_caldav_request_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9995
      displayName: "30d rolling 99.95% CalDAV availability"
  alertPolicies:
    - alertPolicyRef: calendar-caldav-fast-burn-1h-14x
    - alertPolicyRef: calendar-caldav-slow-burn-6h-6x
    - alertPolicyRef: calendar-caldav-ticket-burn-3d-1x
