# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-agenda-render-latency
  displayName: "calendar: agenda-render latency p95"
  labels:
    microservice: calendar
    bc: event-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-calendar
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT,PII_IDENTIFYING
spec:
  description: |
    Agenda-render p95 latency SLO. A request is "good" when the REST/CalDAV
    "agenda" round-trip (auth → fetch 1 week / 100 events for the calling
    user, including recurrence expansion + tz resolution) returns in
    ≤ 250ms. PRD-calendar §"Performance" target.
  service: calendar
  indicator:
    metadata: {name: calendar-agenda-render-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(calendar_agenda_render_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.25
      displayName: "30d rolling p95 ≤ 250ms"
  alertPolicies:
    - alertPolicyRef: calendar-agenda-render-fast-burn-1h-14x
    - alertPolicyRef: calendar-agenda-render-slow-burn-6h-6x
    - alertPolicyRef: calendar-agenda-render-ticket-burn-3d-1x
