# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-ics-import-throughput
  displayName: "calendar: .ics import 10k-event throughput p95"
  labels:
    microservice: calendar
    bc: ics-import-export
    sli_class: latency
    tier: hero-product
    owner_team: axis-calendar
    pack_scope: all
    data_classes: PERSONAL_EVENT_CONTENT,PROFESSIONAL_EVENT_CONTENT
spec:
  description: |
    .ics import throughput SLO. An import job is "good" when a 10,000-event
    .ics file completes import (streaming parse → recurrence-bound check →
    event-store write with audit-chain seal) in ≤ 30s p95. PRD-calendar
    §"Performance" + problem-statement target. Streaming parse refuses
    files that would breach the bounded-recurrence invariant (PRD AC-10).
  service: calendar
  indicator:
    metadata: {name: calendar-ics-import-10k-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(calendar_ics_import_seconds_bucket{event_count_bucket="10k"}[15m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 30
      displayName: "30d rolling p95 ≤ 30s for 10k-event file"
  alertPolicies:
    - alertPolicyRef: calendar-ics-import-fast-burn-1h-14x
    - alertPolicyRef: calendar-ics-import-slow-burn-6h-6x
