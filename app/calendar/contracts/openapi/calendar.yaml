openapi: 3.2.0
info:
  title: oyatie Calendar µservice API
  version: 1.0.0
  description: |
    Calendar µservice REST API. Surfaces event-store, recurrence, availability-resolver,
    room-booking, invitation-flow, and ics-import-export bounded contexts.

    Per ADR-0135 (unbundle) + ADR-0132 (no-grouping forward policy): calendar is a
    standalone tenant-facing µservice. Dual-context (Personal / Professional) isolation
    enforced structurally per `policy/event-isolation.md`.

    Authentication: OIDC + per-tenant API key (over HTTPS + mTLS where applicable).
    Authorisation: Cedar policies (`tenant-scope.cedar`, `auditor-scope.cedar`, etc.).
  contact:
    name: axis-calendar
    email: calendar@oyatie.com
  license:
    name: Internal-Use
servers:
  - url: https://calendar.{pack}.oyatie.com/v1
    description: per-pack production endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
        default: kr

security:
  - oidcBearer: []
  - tenantApiKey: []

tags:
  - name: events
    description: Event lifecycle (event-store BC)
  - name: recurrence
    description: Recurrence-engine queries
  - name: availability
    description: Free/busy queries (availability-resolver BC)
  - name: rooms
    description: Resource booking (room-booking BC)
  - name: invitations
    description: Invitation + RSVP (invitation-flow BC)
  - name: ics
    description: .ics + CalDAV import/export (ics-import-export BC)

paths:
  /events:
    post:
      summary: Create event
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      summary: List events (per tenant + context)
      tags: [events]
      parameters:
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [personal, professional]
        - name: starts_after
          in: query
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'

  /events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get event
      tags: [events]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update event
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
    delete:
      summary: Cancel event (soft-delete; legal-hold blocks hard-delete)
      tags: [events]
      responses:
        '204':
          description: Canceled

  /events/{event_id}/legal-hold:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Open legal hold on event
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldRequest'
      responses:
        '201':
          description: Hold opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'

  /events/{event_id}/action-cards/{action_card_id}/approve:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action_card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Explicitly approve a calendar action card and create a policy-gated Workflow handoff
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCardApprovalRequest'
      responses:
        '201':
          description: Explicit action card approved and Workflow handoff audit log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowHandoffAuditLog'
        '403':
          $ref: '#/components/responses/Forbidden'

  /recurrence/expand:
    post:
      summary: Expand a recurrence rule into occurrences (bounded ≤ 5y horizon)
      tags: [recurrence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceExpandRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceExpandResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /availability/query:
    post:
      summary: Query free/busy across attendees (intra-tenant or cross-tenant via grant)
      tags: [availability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityQueryResponse'

  /availability/cross-tenant-grant:
    post:
      summary: Open a cross-tenant availability grant (free/busy projection only)
      tags: [availability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossTenantGrantRequest'
      responses:
        '201':
          description: Grant opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTenantGrant'
    delete:
      summary: Revoke a cross-tenant grant (also invalidates cache)
      tags: [availability]
      parameters:
        - name: grant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked

  /rooms:
    get:
      summary: List rooms / resources
      tags: [rooms]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'

  /rooms/{resource_id}/book:
    parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Book a room / resource
      tags: [rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomBookRequest'
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: Conflict (room already booked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingConflict'

  /invitations/{invitation_id}/rsvp:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Submit RSVP (RFC 5546 reply)
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RsvpRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RsvpResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /ics/import:
    post:
      summary: Import a .ics file (RFC 5545)
      tags: [ics]
      requestBody:
        required: true
        content:
          text/calendar:
            schema:
              type: string
      responses:
        '202':
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcsImportJob'

  /ics/export:
    get:
      summary: Export a calendar to .ics (RFC 5545)
      tags: [ics]
      parameters:
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [personal, professional]
        - name: starts_after
          in: query
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            text/calendar:
              schema:
                type: string

  /caldav/{tenant_id}/{user_id}/calendar:
    description: |
      RFC 4791 CalDAV endpoint. PROPFIND / REPORT / PUT / DELETE per RFC 4791.
      OpenAPI cannot fully model CalDAV (XML / WebDAV verbs); see `contracts/caldav/`
      reference for full RFC 4791 conformance description.

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: calendar
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Record legacy ./bin/oya verify --ci-required / oya verify as optional local-feedback provenance only; protected merge authority lives in ADR-0515 cloud-ci Rust gate packets aggregated into oya-ci-required.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Preserve legacy-CI-shaped wording as historical provenance while ADR-0515 makes GitHub Actions the live runner until explicit owned-runner cutover; ArgoCD remains a bridge/reference CD adapter where separately authorized.
        enforced_by:
          - oya-governance-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-owned-ci-declarative-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantApiKey:
      type: apiKey
      in: header
      name: X-Tenant-API-Key
  responses:
    Forbidden:
      description: Forbidden (Cedar policy refusal)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable Entity (validation error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Event:
      type: object
      required: [event_id, tenant_id, context, ownership_pillar, starts_at, ends_at, retention_policy_id, audit_ref]
      properties:
        event_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        context:
          type: string
          enum: [personal, professional]
        ownership_pillar:
          type: string
          enum: [Org, Personal]
          description: Work events are Org pillar; personal events stay Personal pillar and details never cross pillar.
        title:
          type: string
        description:
          type: string
        location:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        time_zone:
          type: string
          description: IANA tz string, e.g., "Asia/Seoul"
        organiser_user_id:
          type: string
          format: uuid
        attendee_refs:
          type: array
          items:
            $ref: '#/components/schemas/Attendee'
        recurrence_rule:
          type: string
          description: RFC 5545 RRULE string
        retention_policy_id:
          type: string
        retention_disclosure:
          $ref: '#/components/schemas/RetentionPolicyDisclosure'
        legal_hold_open:
          type: boolean
          default: false
        legal_hold_ids:
          type: array
          items:
            type: string
        audit_ref:
          type: string
          description: Immutable audit-chain reference for event create/update, attendee transitions, legal holds, and action-card handoffs.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attendee:
      type: object
      required: [email, rsvp_state]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        rsvp_state:
          type: string
          enum: [pending, accepted, tentative, declined, counter-proposed]
        is_organiser:
          type: boolean

    EventCreateRequest:
      type: object
      required: [context, starts_at, ends_at]
      properties:
        context:
          type: string
          enum: [personal, professional]
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        location:
          type: string
          maxLength: 500
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        time_zone:
          type: string
        attendees:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
        recurrence_rule:
          type: string

    EventUpdateRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        recurrence_rule: { type: string }
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/Attendee'

    EventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: string

    LegalHoldRequest:
      type: object
      required: [opened_by, reason]
      properties:
        opened_by: { type: string, format: uuid }
        reason: { type: string }
        related_matter_id: { type: string }

    LegalHold:
      type: object
      properties:
        hold_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        opened_by: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        reason: { type: string }

    RecurrenceExpandRequest:
      type: object
      required: [recurrence_rule, starts_at, window_starts_at, window_ends_at]
      properties:
        recurrence_rule:
          type: string
          description: RFC 5545 RRULE
        starts_at:
          type: string
          format: date-time
        window_starts_at:
          type: string
          format: date-time
        window_ends_at:
          type: string
          format: date-time
          description: Must be within 5 years of window_starts_at

    RecurrenceExpandResponse:
      type: object
      properties:
        occurrences:
          type: array
          items:
            type: object
            properties:
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }

    AvailabilityQueryRequest:
      type: object
      required: [attendees, window_starts_at, window_ends_at]
      properties:
        attendees:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              user_ref: { type: string, format: uuid }
              tenant_id: { type: string, format: uuid }
        window_starts_at: { type: string, format: date-time }
        window_ends_at: { type: string, format: date-time }
        granularity_minutes:
          type: integer
          default: 30

    AvailabilityQueryResponse:
      type: object
      properties:
        attendees:
          type: array
          items:
            type: object
            properties:
              user_ref: { type: string }
              free_busy:
                type: array
                items:
                  $ref: '#/components/schemas/FreeBusyProjection'

    FreeBusyProjection:
      type: object
      required: [starts_at, ends_at, busy]
      description: Minimum-necessary projection for cross-tenant queries. NO title, description, location, or attendee fields are returned across tenant boundaries.
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        busy: { type: boolean }
        attendee_count_bucket:
          type: string
          enum: [small, medium, large]

    RetentionPolicyDisclosure:
      type: object
      required: [region_pack, selected_retention_days, legal_hold_blocks_purge, policy_basis]
      properties:
        region_pack:
          type: string
          enum: [KR, EU, US]
        selected_retention_days: { type: integer }
        legal_hold_blocks_purge: { type: boolean }
        policy_basis: { type: string }

    ActionCard:
      type: object
      required: [action_card_id, event_id, workflow_capability_ref, recipient_ref, policy_basis, state, audit_ref]
      properties:
        action_card_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        workflow_capability_ref: { type: string }
        recipient_ref: { type: string }
        policy_basis: { type: string }
        state:
          type: string
          enum: [pending, approved, rejected, expired]
        audit_ref: { type: string }

    ActionCardApprovalRequest:
      type: object
      required: [approver_ref, policy_basis, explicit_consent_ref]
      properties:
        approver_ref: { type: string }
        policy_basis: { type: string }
        explicit_consent_ref: { type: string }

    WorkflowHandoffAuditLog:
      type: object
      required: [workflow_handoff_id, event_id, action_card_id, workflow_capability_ref, policy_basis, audit_ref]
      properties:
        workflow_handoff_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        action_card_id: { type: string, format: uuid }
        workflow_capability_ref: { type: string }
        policy_basis: { type: string }
        audit_ref: { type: string }

    CrossTenantGrantRequest:
      type: object
      required: [from_tenant_id, to_tenant_id, scope, expires_at]
      properties:
        from_tenant_id: { type: string, format: uuid }
        to_tenant_id: { type: string, format: uuid }
        scope:
          type: string
          enum: [freebusy]
          description: Only freebusy projection permitted; raw events refused at type level
        expires_at: { type: string, format: date-time }

    CrossTenantGrant:
      type: object
      properties:
        grant_id: { type: string, format: uuid }
        from_tenant_id: { type: string, format: uuid }
        to_tenant_id: { type: string, format: uuid }
        scope: { type: string }
        opened_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at:
          type: string
          format: date-time
          nullable: true

    ResourceListResponse:
      type: object
      properties:
        resources:
          type: array
          items:
            type: object
            properties:
              resource_id: { type: string, format: uuid }
              kind: { type: string, enum: [room, device, vehicle, virtual_meeting] }
              name: { type: string }
              location: { type: string }
              capacity: { type: integer }

    RoomBookRequest:
      type: object
      required: [event_id, starts_at, ends_at]
      properties:
        event_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        idempotency_key: { type: string, format: uuid }

    Booking:
      type: object
      properties:
        booking_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        booker_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    BookingConflict:
      type: object
      properties:
        conflicting_booking_id: { type: string, format: uuid }
        suggested_alternatives:
          type: array
          items:
            type: object
            properties:
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }

    RsvpRequest:
      type: object
      required: [state, reply_token]
      properties:
        state:
          type: string
          enum: [accepted, tentative, declined, counter-proposed]
        reply_token:
          type: string
          description: HMAC-signed single-use token bound to (invitation_id, recipient_email)
        counter_proposal_starts_at:
          type: string
          format: date-time

    RsvpResult:
      type: object
      properties:
        invitation_id: { type: string, format: uuid }
        state: { type: string }
        recorded_at: { type: string, format: date-time }

    IcsImportJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, parsing, importing, completed, partial_success, failed, quarantined]
        event_count_planned: { type: integer }
        event_count_imported: { type: integer }
        event_count_skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              error_kind: { type: string }
              sample: { type: string }

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
