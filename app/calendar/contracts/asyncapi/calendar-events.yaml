asyncapi: 3.1.0
info:
  title: oyatie Calendar µservice — AsyncAPI Event Catalog
  version: 1.0.0
  description: |
    AsyncAPI definitions for calendar µservice events on the oyatie Workflow event bus.

    Per ADR-0131 + ADR-0132, calendar emits events that may be consumed by:
    - mail (invitation delivery)
    - audit-chain (seal emission)
    - workflow-engine (event-bound automation triggers)
    - observability (telemetry)

    Per Bominal ADR-0028: every event carries a content hash + audit-chain seal pointer.

defaultContentType: application/cloudevents+json

servers:
  workflow-event-bus:
    host: workflow.{pack}.oyatie.com
    protocol: nats
    description: per-pack Workflow event bus
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]

channels:
  calendar.event.lifecycle.v1:
    address: calendar.event.lifecycle.v1
    description: Event lifecycle (create / update / cancel); source family calendar.event.v1
    messages:
      EventCreated:
        $ref: '#/components/messages/EventCreated'
      EventUpdated:
        $ref: '#/components/messages/EventUpdated'
      EventCanceled:
        $ref: '#/components/messages/EventCanceled'

  calendar.availability_projection.v1:
    address: calendar.availability_projection.v1
    description: Minimum-necessary free/busy projection; no personal event details cross the pillar boundary.
    messages:
      AvailabilityProjected:
        $ref: '#/components/messages/AvailabilityProjected'

  calendar.action_card.v1:
    address: calendar.action_card.v1
    description: Explicit calendar action-card state transitions with policy_basis and audit_ref.
    messages:
      ActionCardCompleted:
        $ref: '#/components/messages/ActionCardCompleted'

  calendar.workflow_handoff.v1:
    address: calendar.workflow_handoff.v1
    description: Policy-gated Workflow handoff created from an explicit calendar action card.
    messages:
      WorkflowHandoffCreated:
        $ref: '#/components/messages/WorkflowHandoffCreated'

  calendar.invitation.rsvp.v1:
    address: calendar.invitation.rsvp.v1
    description: Invitation RSVP transitions
    messages:
      InvitationAcceptedDeclined:
        $ref: '#/components/messages/InvitationAcceptedDeclined'

  calendar.room.booking.v1:
    address: calendar.room.booking.v1
    description: Room / resource booking
    messages:
      RoomBooked:
        $ref: '#/components/messages/RoomBooked'
      RoomBookingConflict:
        $ref: '#/components/messages/RoomBookingConflict'

  calendar.recurrence.v1:
    address: calendar.recurrence.v1
    description: Recurrence engine events
    messages:
      RecurrenceWindowExpanded:
        $ref: '#/components/messages/RecurrenceWindowExpanded'

  audit.calendar.legal_hold.v1:
    address: audit.calendar.legal_hold.v1
    description: Legal hold transitions (consumed by audit-chain + governance)
    messages:
      LegalHoldApplied:
        $ref: '#/components/messages/LegalHoldApplied'
      LegalHoldReleased:
        $ref: '#/components/messages/LegalHoldReleased'

operations:
  publishEventCreated:
    action: send
    channel:
      $ref: '#/channels/calendar.event.lifecycle.v1'
    messages:
      - $ref: '#/channels/calendar.event.lifecycle.v1/messages/EventCreated'

  publishEventUpdated:
    action: send
    channel:
      $ref: '#/channels/calendar.event.lifecycle.v1'
    messages:
      - $ref: '#/channels/calendar.event.lifecycle.v1/messages/EventUpdated'

  publishEventCanceled:
    action: send
    channel:
      $ref: '#/channels/calendar.event.lifecycle.v1'
    messages:
      - $ref: '#/channels/calendar.event.lifecycle.v1/messages/EventCanceled'

  publishAvailabilityProjected:
    action: send
    channel:
      $ref: '#/channels/calendar.availability_projection.v1'
    messages:
      - $ref: '#/channels/calendar.availability_projection.v1/messages/AvailabilityProjected'

  publishActionCardCompleted:
    action: send
    channel:
      $ref: '#/channels/calendar.action_card.v1'
    messages:
      - $ref: '#/channels/calendar.action_card.v1/messages/ActionCardCompleted'

  publishWorkflowHandoffCreated:
    action: send
    channel:
      $ref: '#/channels/calendar.workflow_handoff.v1'
    messages:
      - $ref: '#/channels/calendar.workflow_handoff.v1/messages/WorkflowHandoffCreated'

  publishInvitationRsvp:
    action: send
    channel:
      $ref: '#/channels/calendar.invitation.rsvp.v1'

  publishRoomBooked:
    action: send
    channel:
      $ref: '#/channels/calendar.room.booking.v1'

  publishRoomBookingConflict:
    action: send
    channel:
      $ref: '#/channels/calendar.room.booking.v1'

  publishRecurrenceWindowExpanded:
    action: send
    channel:
      $ref: '#/channels/calendar.recurrence.v1'

  publishLegalHoldApplied:
    action: send
    channel:
      $ref: '#/channels/audit.calendar.legal_hold.v1'

  publishLegalHoldReleased:
    action: send
    channel:
      $ref: '#/channels/audit.calendar.legal_hold.v1'

components:
  messages:
    EventCreated:
      name: EventCreated
      title: Event created
      payload:
        $ref: '#/components/schemas/EventLifecycleEvent'

    EventUpdated:
      name: EventUpdated
      title: Event updated
      payload:
        $ref: '#/components/schemas/EventLifecycleEvent'

    EventCanceled:
      name: EventCanceled
      title: Event canceled (soft-delete)
      payload:
        $ref: '#/components/schemas/EventLifecycleEvent'

    AvailabilityProjected:
      name: AvailabilityProjected
      title: Availability projection emitted
      payload:
        $ref: '#/components/schemas/AvailabilityProjectionEvent'

    ActionCardCompleted:
      name: ActionCardCompleted
      title: Explicit action card completed
      payload:
        $ref: '#/components/schemas/ActionCardEvent'

    WorkflowHandoffCreated:
      name: WorkflowHandoffCreated
      title: Workflow handoff created from explicit action card
      payload:
        $ref: '#/components/schemas/WorkflowHandoffEvent'

    InvitationAcceptedDeclined:
      name: InvitationAcceptedDeclined
      title: Invitation RSVP transition
      payload:
        $ref: '#/components/schemas/InvitationRsvpEvent'

    RoomBooked:
      name: RoomBooked
      title: Room / resource booked
      payload:
        $ref: '#/components/schemas/RoomBookingEvent'

    RoomBookingConflict:
      name: RoomBookingConflict
      title: Room / resource booking conflict
      payload:
        $ref: '#/components/schemas/RoomBookingConflictEvent'

    RecurrenceWindowExpanded:
      name: RecurrenceWindowExpanded
      title: Recurrence window expanded
      payload:
        $ref: '#/components/schemas/RecurrenceEvent'

    LegalHoldApplied:
      name: LegalHoldApplied
      title: Legal hold opened on event
      payload:
        $ref: '#/components/schemas/LegalHoldEvent'

    LegalHoldReleased:
      name: LegalHoldReleased
      title: Legal hold lifted (requires 2-person rule)
      payload:
        $ref: '#/components/schemas/LegalHoldEvent'

  schemas:
    CloudEventEnvelope:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - subject
        - tenant_id_hashed
        - pack_tag
        - audit_chain_seal_id
        - signature_ed25519
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string, const: "calendar" }
        type: { type: string }
        time: { type: string, format: date-time }
        subject: { type: string }
        tenant_id_hashed:
          type: string
          description: sha256(tenant_id)[..16] per threat-model.md T-L-02
        pack_tag:
          type: string
          enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
        context_kind:
          type: string
          enum: [personal, professional]
        audit_chain_seal_id:
          type: string
          format: uuid
        signature_ed25519:
          type: string
          description: Ed25519 signature over (id, type, time, subject, payload_hash)

    EventLifecycleEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [event_id, version, lifecycle_state, ownership_pillar, retention_policy_id, audit_ref]
          properties:
            event_id: { type: string, format: uuid }
            version: { type: integer }
            lifecycle_state:
              type: string
              enum: [created, updated, canceled]
            ownership_pillar:
              type: string
              enum: [Org, Personal]
            retention_policy_id: { type: string }
            legal_hold_ids:
              type: array
              items:
                type: string
            audit_ref: { type: string }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            attendee_count: { type: integer }
            attendee_emails_hashed:
              type: array
              items:
                type: string
              description: PII-redacted attendee identifiers (hashed)

    AvailabilityProjectionEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [projection_id, source_event_ref, recipient_scope, expires_at, free_busy, audit_ref]
          properties:
            projection_id: { type: string, format: uuid }
            source_event_ref: { type: string, format: uuid }
            recipient_scope: { type: string }
            expires_at: { type: string, format: date-time }
            audit_ref: { type: string }
            free_busy:
              type: array
              description: Free/busy buckets only; no personal title, description, location, or attendees are emitted.
              items:
                type: object
                required: [starts_at, ends_at, busy]
                properties:
                  starts_at: { type: string, format: date-time }
                  ends_at: { type: string, format: date-time }
                  busy: { type: boolean }
                  attendee_count_bucket: { type: string }

    ActionCardEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [action_card_id, event_id, workflow_capability_ref, state, policy_basis, audit_ref]
          properties:
            action_card_id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            workflow_capability_ref: { type: string }
            state:
              type: string
              enum: [pending, approved, rejected, expired]
            policy_basis: { type: string }
            audit_ref: { type: string }

    WorkflowHandoffEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [workflow_handoff_id, event_id, action_card_id, workflow_capability_ref, policy_basis, audit_ref]
          properties:
            workflow_handoff_id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            action_card_id: { type: string, format: uuid }
            workflow_capability_ref: { type: string }
            policy_basis: { type: string }
            audit_ref: { type: string }

    InvitationRsvpEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [invitation_id, event_id, state]
          properties:
            invitation_id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            state:
              type: string
              enum: [pending, accepted, tentative, declined, counter-proposed]
            recipient_email_hashed: { type: string }
            counter_proposal_starts_at:
              type: string
              format: date-time

    RoomBookingEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [booking_id, resource_id, event_id, starts_at, ends_at]
          properties:
            booking_id: { type: string, format: uuid }
            resource_id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            booker_user_id_hashed: { type: string }

    RoomBookingConflictEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [requested_resource_id, conflicting_booking_id, starts_at, ends_at]
          properties:
            requested_resource_id: { type: string, format: uuid }
            conflicting_booking_id: { type: string, format: uuid }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }

    RecurrenceEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [event_id, window_hash, occurrence_count]
          properties:
            event_id: { type: string, format: uuid }
            window_hash: { type: string }
            window_starts_at: { type: string, format: date-time }
            window_ends_at: { type: string, format: date-time }
            occurrence_count: { type: integer }

    LegalHoldEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [hold_id, event_id, action]
          properties:
            hold_id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            action:
              type: string
              enum: [applied, released]
            opened_by_user_id_hashed: { type: string }
            reason: { type: string }
            two_person_approver_id_hashed:
              type: string
              description: Required when action=released
