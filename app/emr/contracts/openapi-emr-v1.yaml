openapi: 3.2.0
info:
  title: oyatie EMR API
  version: 1.0.0-wave-15m-b
  description: |
    FHIR R5 (default) + FHIR R4 (compatibility) API surface for the oyatie EMR microservice.
    Per ADR-0131 (per-microservice flat layout) + ADR-0145 (inter-microservice communication reform)
    + ADR-0244 (tenant as universal scoping primitive) + ADR-0251 (compliance pack discipline).
    Every PHI-touching endpoint is Cedar-gated (ADR-0243) and emits audit events into the
    audit-chain microservice. Default-deny.
  contact:
    name: axis-emr
    url: https://docs.oyatie.com/microservices/emr/
  license:
    name: Proprietary
servers:
  - url: https://api.{tenant}.{region}.oyatie.health/emr/v1
    variables:
      tenant:
        default: tenant-acme
      region:
        default: us-east-1
        enum: [us-east-1, us-west-2, eu-west-3, ap-northeast-2, ap-southeast-1]
security:
  - bearerJWT: []
tags:
  - name: patient
  - name: encounter
  - name: problem
  - name: medication
  - name: allergy
  - name: vital
  - name: note
  - name: order
  - name: result
  - name: care-team
  - name: order-set
  - name: documentation
  - name: billing-code
  - name: patient-education
  - name: portal-session
  - name: fhir-bulk
paths:
  /fhir/Patient:
    post:
      tags: [patient, fhir]
      summary: Create Patient (FHIR R5)
      operationId: createPatient
      x-cedar-action: emr.patient.create
      x-emits-audit: PatientCreated
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema: { $ref: '#/components/schemas/FhirPatient' }
      responses:
        '201': { description: Created, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirPatient' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableFhir' }
    get:
      tags: [patient, fhir]
      summary: Search Patient
      operationId: searchPatient
      x-cedar-action: emr.patient.search
      parameters:
        - $ref: '#/components/parameters/family'
        - $ref: '#/components/parameters/given'
        - $ref: '#/components/parameters/birthdate'
        - $ref: '#/components/parameters/identifier'
      responses:
        '200': { description: OK, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirBundle' } } } }
  /fhir/Patient/{id}:
    get:
      tags: [patient, fhir]
      summary: Read Patient
      operationId: readPatient
      x-cedar-action: emr.patient.read
      x-emits-audit: PatientViewed
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: OK, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirPatient' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [patient, fhir]
      summary: Update Patient
      operationId: updatePatient
      x-cedar-action: emr.patient.update
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirPatient' } } }
      responses:
        '200': { description: OK, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirPatient' } } } }
  /fhir/Patient/{id}/$merge:
    post:
      tags: [patient]
      summary: Merge two patient records (custom operation)
      operationId: mergePatient
      x-cedar-action: emr.patient.merge
      x-emits-audit: PatientMerged
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [survivor_id, retired_id, justification]
              properties:
                survivor_id: { type: string }
                retired_id: { type: string }
                justification: { type: string }
      responses:
        '200': { description: Merged }
  /fhir/Encounter:
    post:
      tags: [encounter, fhir]
      summary: Start Encounter
      operationId: createEncounter
      x-cedar-action: emr.encounter.start
      x-emits-audit: EncounterOpened
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirEncounter' } } }
      responses:
        '201': { description: Created, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirEncounter' } } } }
  /fhir/Encounter/{id}:
    get:
      tags: [encounter, fhir]
      operationId: readEncounter
      x-cedar-action: emr.encounter.read
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: OK, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirEncounter' } } } } }
  /fhir/Encounter/{id}/$discharge:
    post:
      tags: [encounter]
      summary: Discharge Encounter
      operationId: dischargeEncounter
      x-cedar-action: emr.encounter.discharge
      x-emits-audit: EncounterClosed
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition_code, discharge_summary_id]
              properties:
                disposition_code: { type: string, description: HL7 v3 ActCode for discharge disposition }
                discharge_summary_id: { type: string }
      responses: { '200': { description: Discharged } }
  /fhir/Condition:
    post:
      tags: [problem, fhir]
      summary: Add problem
      operationId: addProblem
      x-cedar-action: emr.problem.add
      x-emits-audit: ProblemAdded
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirCondition' } } }
      responses: { '201': { description: Created } }
  /fhir/Condition/{id}:
    get:
      tags: [problem]
      operationId: readProblem
      x-cedar-action: emr.problem.read
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: OK } }
    put:
      tags: [problem]
      summary: Amend problem (per CMS amendment rules)
      operationId: amendProblem
      x-cedar-action: emr.problem.amend
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirCondition' } } }
      responses: { '200': { description: Amended } }
  /fhir/MedicationRequest:
    post:
      tags: [medication, fhir]
      summary: Prescribe medication
      operationId: prescribeMedication
      x-cedar-action: emr.medication.prescribe
      x-emits-audit: MedicationPrescribed
      x-requires-headers: [X-EPCS-2FA-Attestation, X-PDMP-Query-Receipt]
      x-invokes-cds-hooks: [medication-prescribe]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirMedicationRequest' } } }
      responses:
        '201': { description: Created }
        '409': { description: Allergy conflict (CDS hard-stop) }
        '422': { $ref: '#/components/responses/UnprocessableFhir' }
  /fhir/MedicationRequest/{id}:
    get:
      tags: [medication]
      operationId: readMedicationRequest
      x-cedar-action: emr.medication.read
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: OK } }
  /fhir/MedicationStatement:
    get:
      tags: [medication]
      summary: Reconciled medication list
      operationId: listMedicationStatement
      x-cedar-action: emr.medication.list
      responses: { '200': { description: OK, content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirBundle' } } } } }
  /fhir/AllergyIntolerance:
    post:
      tags: [allergy, fhir]
      operationId: recordAllergy
      x-cedar-action: emr.allergy.record
      x-emits-audit: AllergyRecorded
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirAllergyIntolerance' } } }
      responses: { '201': { description: Created } }
    get:
      tags: [allergy]
      operationId: searchAllergy
      x-cedar-action: emr.allergy.search
      responses: { '200': { description: OK } }
  /fhir/Immunization:
    post:
      tags: [patient, fhir]
      operationId: recordImmunization
      x-cedar-action: emr.immunization.record
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { type: object, description: FHIR R5 Immunization } } }
      responses: { '201': { description: Created } }
    get:
      tags: [patient]
      operationId: listImmunization
      x-cedar-action: emr.immunization.list
      responses: { '200': { description: OK } }
  /fhir/Observation:
    post:
      tags: [vital, fhir]
      summary: Record vital (Observation)
      operationId: recordObservation
      x-cedar-action: emr.vital.record
      x-emits-audit: VitalRecorded
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirObservation' } } }
      responses: { '201': { description: Created } }
    get:
      tags: [vital]
      operationId: searchObservation
      x-cedar-action: emr.vital.search
      parameters:
        - { in: query, name: code, schema: { type: string }, description: LOINC code }
        - { in: query, name: date, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK } }
  /vital/$stream:
    post:
      tags: [vital]
      summary: Ingest streaming vital data (WebSocket-upgrade)
      operationId: streamVital
      x-cedar-action: emr.vital.stream
      x-protocol: WebSocket
      responses: { '101': { description: WebSocket-Upgrade } }
  /fhir/DocumentReference:
    post:
      tags: [note, fhir]
      operationId: createNote
      x-cedar-action: emr.note.draft
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirDocumentReference' } } }
      responses: { '201': { description: Drafted } }
  /fhir/DocumentReference/{id}/$sign:
    post:
      tags: [note]
      summary: Sign a clinical note
      operationId: signNote
      x-cedar-action: emr.note.sign
      x-emits-audit: NoteSigned
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Signed } }
  /fhir/DocumentReference/{id}/$amend:
    post:
      tags: [note]
      summary: Amend a signed note (per CMS amendment rules)
      operationId: amendNote
      x-cedar-action: emr.note.amend
      x-emits-audit: NoteAmended
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amendment_block, reason]
              properties:
                amendment_block: { type: string }
                reason: { type: string }
      responses: { '200': { description: Amended } }
  /fhir/ServiceRequest:
    post:
      tags: [order, fhir]
      summary: Enter order (lab, imaging, consult, diet, activity, nursing)
      operationId: enterOrder
      x-cedar-action: emr.order.enter
      x-emits-audit: OrderEntered
      x-invokes-cds-hooks: [order-sign, order-select]
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { $ref: '#/components/schemas/FhirServiceRequest' } } }
      responses: { '201': { description: Entered } }
  /fhir/ServiceRequest/{id}:
    get:
      tags: [order]
      operationId: readOrder
      x-cedar-action: emr.order.read
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: OK } }
    delete:
      tags: [order]
      summary: Cancel order
      operationId: cancelOrder
      x-cedar-action: emr.order.cancel
      x-emits-audit: OrderCanceled
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '204': { description: Canceled } }
  /fhir/DiagnosticReport:
    get:
      tags: [result]
      operationId: listDiagnosticReport
      x-cedar-action: emr.result.list
      responses: { '200': { description: OK } }
  /fhir/DiagnosticReport/{id}/$review:
    post:
      tags: [result]
      summary: Mark result reviewed
      operationId: reviewResult
      x-cedar-action: emr.result.review
      x-emits-audit: ResultReviewed
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Reviewed } }
  /fhir/DiagnosticReport/{id}/$acknowledge:
    post:
      tags: [result]
      summary: Acknowledge critical-value result
      operationId: acknowledgeResult
      x-cedar-action: emr.result.acknowledge
      x-emits-audit: ResultAcknowledged
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Acknowledged } }
  /fhir/CarePlan:
    get:
      tags: [care-team, fhir]
      operationId: readCarePlan
      x-cedar-action: emr.care-plan.read
      responses: { '200': { description: OK } }
  /fhir/CareTeam:
    get:
      tags: [care-team, fhir]
      operationId: readCareTeam
      x-cedar-action: emr.care-team.read
      responses: { '200': { description: OK } }
    post:
      tags: [care-team]
      operationId: assignCareTeam
      x-cedar-action: emr.care-team.assign
      x-emits-audit: CareTeamMemberAdded
      requestBody:
        required: true
        content: { application/fhir+json: { schema: { type: object, description: FHIR R5 CareTeam } } }
      responses: { '201': { description: Assigned } }
  /order-sets:
    post:
      tags: [order-set]
      summary: Author order set
      operationId: authorOrderSet
      x-cedar-action: emr.order-set.author
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses: { '201': { description: Authored } }
  /order-sets/{id}/$publish:
    post:
      tags: [order-set]
      operationId: publishOrderSet
      x-cedar-action: emr.order-set.publish
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Published } }
  /order-sets/{id}/$retire:
    post:
      tags: [order-set]
      operationId: retireOrderSet
      x-cedar-action: emr.order-set.retire
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Retired } }
  /documentation-templates:
    post:
      tags: [documentation]
      operationId: authorTemplate
      x-cedar-action: emr.documentation.template.author
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Authored } }
  /smart-phrases:
    post:
      tags: [documentation]
      operationId: authorSmartPhrase
      x-cedar-action: emr.documentation.smart-phrase.author
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Authored } }
  /billing-codes:
    post:
      tags: [billing-code]
      summary: Capture billing codes for an encounter
      operationId: captureBillingCodes
      x-cedar-action: emr.billing-code.capture
      x-emits-audit: BillingCodeCaptured
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_id, cpt_codes, icd10_codes]
              properties:
                encounter_id: { type: string }
                cpt_codes: { type: array, items: { type: string } }
                hcpcs_codes: { type: array, items: { type: string } }
                icd10_codes: { type: array, items: { type: string } }
                modifiers: { type: array, items: { type: string } }
      responses: { '201': { description: Captured } }
  /billing-codes/{id}/$attest:
    post:
      tags: [billing-code]
      summary: Physician attestation
      operationId: attestBillingCodes
      x-cedar-action: emr.billing-code.physician-attest
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Attested } }
  /patient-education:
    post:
      tags: [patient-education]
      operationId: assignPatientEducation
      x-cedar-action: emr.patient-education.assign
      x-emits-audit: PatientEducationAssigned
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Assigned } }
  /portal/session:
    post:
      tags: [portal-session]
      summary: Patient or proxy login (passkey)
      operationId: portalLogin
      x-cedar-action: emr.portal-session.login
      x-emits-audit: PortalSessionStarted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passkey_assertion: { type: string }
                proxy_grant_id: { type: string }
      responses: { '200': { description: Logged in } }
  /portal/proxy-grants:
    post:
      tags: [portal-session]
      summary: Initiate proxy-grant saga (caregiver/guardian)
      operationId: initiateProxyGrant
      x-cedar-action: emr.portal-session.proxy-grant.initiate
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '202': { description: Saga started } }
  /portal/$export:
    get:
      tags: [fhir-bulk, portal-session]
      summary: Patient bulk export (HIPAA §164.524)
      operationId: portalBulkExport
      x-cedar-action: emr.portal-session.bulk-export
      x-fhir-bulk-data-spec: v2.0
      responses: { '202': { description: "Async kickoff; poll /portal/$export-poll/{id}" } }
  /fhir/$export:
    get:
      tags: [fhir-bulk]
      summary: Group bulk export (tenant scope)
      operationId: groupBulkExport
      x-cedar-action: emr.fhir.bulk-export
      x-fhir-bulk-data-spec: v2.0
      parameters:
        - { in: query, name: _type, schema: { type: string } }
        - { in: query, name: _since, schema: { type: string, format: date-time } }
      responses: { '202': { description: Async kickoff } }
  /break-glass:
    post:
      tags: [patient]
      summary: Invoke break-glass (clinician emergency override)
      operationId: invokeBreakGlass
      x-cedar-action: emr.break-glass.invoke
      x-emits-audit: BreakGlassInvoked
      x-mandatory-review: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, justification_category, justification_text]
              properties:
                patient_id: { type: string }
                justification_category: { type: string, enum: [clinical-emergency, patient-relationship-emergency, IT-emergency] }
                justification_text: { type: string, minLength: 20 }
      responses: { '200': { description: Granted; review queued } }
  /audit/$query:
    get:
      tags: [patient]
      summary: HIM audit query (HIPAA §164.528 accounting of disclosures)
      operationId: queryAudit
      x-cedar-action: emr.audit.query
      parameters:
        - { in: query, name: patient_id, schema: { type: string } }
        - { in: query, name: principal_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses: { '200': { description: OK } }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: emr
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
    family:
      in: query
      name: family
      schema: { type: string }
    given:
      in: query
      name: given
      schema: { type: string }
    birthdate:
      in: query
      name: birthdate
      schema: { type: string, format: date }
    identifier:
      in: query
      name: identifier
      schema: { type: string }
  schemas:
    FhirPatient:
      type: object
      description: FHIR R5 Patient resource (subset)
      properties:
        resourceType: { type: string, const: Patient }
        id: { type: string }
        identifier: { type: array, items: { type: object } }
        name: { type: array, items: { type: object } }
        gender: { type: string, enum: [male, female, other, unknown] }
        birthDate: { type: string, format: date }
        active: { type: boolean }
    FhirEncounter:
      type: object
      properties:
        resourceType: { type: string, const: Encounter }
        id: { type: string }
        status: { type: string, enum: [planned, in-progress, on-hold, discharged, completed, cancelled, discontinued, entered-in-error, unknown] }
        class: { type: object }
        type: { type: array, items: { type: object } }
        subject: { type: object }
        participant: { type: array, items: { type: object } }
        period: { type: object }
        reasonCode: { type: array, items: { type: object } }
    FhirCondition:
      type: object
      properties:
        resourceType: { type: string, const: Condition }
        id: { type: string }
        clinicalStatus: { type: object }
        verificationStatus: { type: object }
