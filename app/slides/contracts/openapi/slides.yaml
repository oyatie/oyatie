openapi: 3.2.0
info:
  title: oya-slides REST surface
  version: 1.0.0
  description: |
    Slides µservice REST surface — collaborative presentation product (Google-Slides /
    PowerPoint Web / Keynote / Pitch / Beautiful.ai / Canva-presentations-class).
    Per ADR-0135 dissolution + ADR-0131 per-microservice flat layout.
    All endpoints OIDC tenant-bound. Cedar v4.2 LTS default-deny enforced per
    `policy/tenant-scope.cedar`. Per-slide ACL granularity per ADR-SLIDES-0007.
  contact:
    name: axis-workspace + council-design-system
    email: axis-workspace@oyatie.com
  license:
    name: Apache-2.0
servers:
  - url: https://api.oyatie.com/slides/v1
    description: production
  - url: https://api-staging.oyatie.com/slides/v1
    description: staging
  - url: https://api-dev.oyatie.com/slides/v1
    description: dev
security:
  - oidcBearer: []
paths:
  /decks:
    get:
      summary: List decks accessible to caller
      operationId: list_decks
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: opaque pagination cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: pack, in: query, schema: { type: string }, description: explicit pack filter (defaults to caller's pack) }
      responses:
        '200':
          description: paginated deck list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeckList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a new deck
      operationId: create_deck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeckCreateRequest' }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Deck' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
  /decks/{deck_id}:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a deck
      operationId: get_deck
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Deck' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Update deck metadata (delta save)
      operationId: update_deck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeckUpdateRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Deck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete deck (soft delete with retention)
      operationId: delete_deck
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /decks/{deck_id}/slides:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: List slides in a deck
      operationId: list_slides
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SlideList' } } } }
    post:
      summary: Insert a new slide
      operationId: insert_slide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlideCreateRequest' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
  /decks/{deck_id}/slides/{slide_id}:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: slide_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a slide
      operationId: get_slide
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
    patch:
      summary: Update slide
      operationId: update_slide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlideUpdateRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Slide' } } } }
    delete:
      summary: Delete slide
      operationId: delete_slide
      responses:
        '204': { description: deleted }
  /decks/{deck_id}/slides/{slide_id}/acl:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: slide_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get per-slide ACL (per ADR-SLIDES-0007)
      operationId: get_per_slide_acl
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PerSlideAcl' } } } }
    put:
      summary: Set per-slide ACL (Cedar preview-required per AC-15)
      operationId: set_per_slide_acl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerSlideAclUpdateRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PerSlideAcl' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /decks/{deck_id}/acl:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get deck-level ACL
      operationId: get_deck_acl
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DeckAcl' } } } }
    put:
      summary: Set deck-level ACL
      operationId: set_deck_acl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeckAclUpdateRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DeckAcl' } } } }
  /decks/{deck_id}/sessions:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Open an editor session (per-seat license check)
      operationId: open_editor_session
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/EditorSession' } } } }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /decks/{deck_id}/sessions/{session_id}:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Close an editor session
      operationId: close_editor_session
      responses:
        '204': { description: closed }
  /decks/{deck_id}/cedar-preview:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Preview Cedar policy impact for a proposed change (AC-15)
      operationId: cedar_preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CedarPreviewRequest' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CedarPreviewResponse' } } } }
  /decks/{deck_id}/version-history:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: List versions
      operationId: list_versions
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VersionList' } } } }
  /decks/{deck_id}/version-history/{version_sha}/restore:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: version_sha, in: path, required: true, schema: { type: string } }
    post:
      summary: Restore a version
      operationId: restore_version
      responses:
        '201': { description: restored, content: { application/json: { schema: { $ref: '#/components/schemas/Deck' } } } }
  /decks/{deck_id}/comments:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: List comments
      operationId: list_comments
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CommentList' } } } }
    post:
      summary: Post a comment
      operationId: post_comment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommentCreateRequest' } } }
      responses:
        '201': { description: created }
  /decks/{deck_id}/charts/bind:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Bind a chart to a sheets cell range (live-link; ADR-SLIDES-0008)
      operationId: bind_chart
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChartBindRequest' } } }
      responses:
        '201': { description: bound, content: { application/json: { schema: { $ref: '#/components/schemas/ChartBinding' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /decks/{deck_id}/themes:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: List themes available to this deck
      operationId: list_themes
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ThemeList' } } } }
    put:
      summary: Apply theme to deck
      operationId: apply_theme
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ThemeApplyRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Deck' } } } }
  /decks/{deck_id}/templates:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: List templates
      operationId: list_templates
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateList' } } } }
  /decks/{deck_id}/export:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Submit export job (PPTX / ODP / PDF / MP4 / PNG-per-slide)
      operationId: submit_export
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /decks/{deck_id}/export/{job_id}:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: job_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get export job status
      operationId: get_export_job
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
  /decks/{deck_id}/import:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Submit import job (PPTX / ODP / Keynote / PDF)
      operationId: submit_import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '202': { description: queued, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
  /decks/{deck_id}/broadcast:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Start broadcast (LiveKit-bridged via messenger; ADR-SLIDES-0005)
      operationId: start_broadcast
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BroadcastStartRequest' } } }
      responses:
        '201': { description: started, content: { application/json: { schema: { $ref: '#/components/schemas/BroadcastSession' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /decks/{deck_id}/broadcast/{session_id}:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      summary: End broadcast
      operationId: end_broadcast
      responses:
        '204': { description: ended }
  /decks/{deck_id}/ai/design-suggest:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: T1 AI design-assist (layout/color/font suggestions)
      operationId: ai_design_suggest
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiDesignSuggestRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AiDesignSuggestResponse' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /decks/{deck_id}/ai/content-generate:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: T2 AI full-deck-from-prompt (regional AI-risk class evaluated per ADR-SLIDES-0006)
      operationId: ai_content_generate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AiContentGenerateRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AiContentGenerateResponse' } } } }
        '403':
          description: Refused (high-risk; pack-override required)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /decks/{deck_id}/accessibility/alt-text:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    post:
      summary: T1 alt-text suggestion for image assets
      operationId: alt_text_suggest
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AltTextSuggestRequest' } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AltTextSuggestResponse' } } } }
  /decks/{deck_id}/accessibility/contrast:
    parameters:
      - { name: deck_id, in: path, required: true, schema: { type: string } }
    get:
      summary: WCAG 2.2 AA color-contrast + color-blind-safe check
      operationId: contrast_check
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ContrastReport' } } } }
  /health:
    get:
      summary: Liveness
      operationId: health
      security: []
      responses:
        '200': { description: ok }
  /ready:
    get:
      summary: Readiness
      operationId: ready
      security: []
      responses:
        '200': { description: ready }
        '503': { description: not-ready }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: slides
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  responses:
    Unauthorized:
      description: missing/invalid OIDC token
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Cedar default-deny / per-slide ACL refusal
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    BadRequest:
      description: schema validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: concurrent edit conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: Cedar preview rejected proposed ACL change
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    PaymentRequired:
      description: per-seat licensing exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    TooManyRequests:
      description: rate-limited
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServiceUnavailable:
      description: dependent service unavailable (e.g., LiveKit, foundry-runtime)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        trace_id: { type: string }
        details: { type: object, additionalProperties: true }
    Deck:
      type: object
      required: [deck_id, tenant_id, pack, title, owner_oidc_sub, created_at, updated_at, version_sha]
      properties:
        deck_id: { type: string }
        tenant_id: { type: string }
        pack: { type: string, enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa] }
        title: { type: string }
        owner_oidc_sub: { type: string }
        author_oidc_subs: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version_sha: { type: string }
        parent_version_sha: { type: string, nullable: true }
        theme_id: { type: string, nullable: true }
        slide_count: { type: integer }
        share_link_enabled: { type: boolean }
        share_link_scope: { type: string, enum: [restricted, anyone_with_link], nullable: true }
        contains_special_category: { type: boolean }
        broadcast_link_public: { type: boolean }
        ai_risk_class: { type: string, enum: [low, medium, high_risk_auto_decision], nullable: true }
    DeckCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        from_template_id: { type: string, nullable: true }
        theme_id: { type: string, nullable: true }
    DeckUpdateRequest:
      type: object
      properties:
        title: { type: string }
        theme_id: { type: string, nullable: true }
        share_link_enabled: { type: boolean }
        share_link_scope: { type: string, enum: [restricted, anyone_with_link] }
        contains_special_category: { type: boolean }
        broadcast_link_public: { type: boolean }
    DeckList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Deck' } }
        next_cursor: { type: string, nullable: true }
    Slide:
      type: object
      required: [slide_id, deck_id, ordinal, layout_id, version_sha]
      properties:
        slide_id: { type: string }
        deck_id: { type: string }
        ordinal: { type: integer }
        layout_id: { type: string }
        version_sha: { type: string }
        content: { type: object, description: opaque slide content (CRDT-projected canonical JSON) }
        speaker_notes: { type: string, nullable: true }
    SlideList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Slide' } }
    SlideCreateRequest:
      type: object
      required: [ordinal, layout_id]
      properties:
        ordinal: { type: integer }
        layout_id: { type: string }
        content: { type: object }
        speaker_notes: { type: string, nullable: true }
    SlideUpdateRequest:
      type: object
      properties:
        ordinal: { type: integer }
        layout_id: { type: string }
        content: { type: object }
        speaker_notes: { type: string, nullable: true }
    PerSlideAcl:
      type: object
      required: [slide_id, entries]
      properties:
        slide_id: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/AclEntry' } }
    PerSlideAclUpdateRequest:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AclEntry' } }
    DeckAcl:
      type: object
      required: [deck_id, entries]
      properties:
        deck_id: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/AclEntry' } }
    DeckAclUpdateRequest:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AclEntry' } }
    AclEntry:
      type: object
      required: [principal_kind, principal_id, role]
      properties:
        principal_kind: { type: string, enum: [user, group, anyone_with_link] }
        principal_id: { type: string }
        role: { type: string, enum: [owner, editor, commenter, viewer, denied] }
    EditorSession:
      type: object
