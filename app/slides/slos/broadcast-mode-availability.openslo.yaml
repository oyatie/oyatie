# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-broadcast-mode-availability
  displayName: Slides — Broadcast-mode signaling availability
  labels:
    microservice: slides
    bounded_context: broadcast-mode
    sli_kind: availability
    tier: external-facing
    plane: data
spec:
  service: oya-slides-broadcast-mode-worker
  description: |
    99.9% monthly availability for broadcast-mode signaling round-trip.
    Inherits messenger LiveKit SLO via ADR-SLIDES-0005. Per PRD §"Availability + SLO".
  indicator:
    metadata: { name: broadcast-signal-availability-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_broadcast_signal_success_total[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_broadcast_signal_attempt_total[5m]))'
  objectives:
    - target: 0.999
      displayName: 99.9% broadcast signaling availability
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: broadcast-availability-burn-rate-high }
      spec:
        notificationTargets: [{ target: "grafana-oncall:slides-sev2" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.995, lookbackWindow: 1h, alertAfter: 0m }
    - kind: AlertPolicy
      metadata: { name: broadcast-availability-sev1 }
      spec:
        notificationTargets: [{ target: "grafana-oncall:slides-sev1" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.95, lookbackWindow: 15m, alertAfter: 0m }
