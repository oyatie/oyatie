# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-slide-render-latency
  displayName: Slides — Single-slide render latency
  labels:
    microservice: slides
    bounded_context: slide
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-slide-adapter-leptos-wasm
  description: |
    p99 ≤ 150ms for individual slide render under editor + present-mode. Per PRD §"Performance".
  indicator:
    metadata: { name: slide-render-p99-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_slide_render_seconds_bucket{le="0.15"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_slide_render_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% slide-render ≤ 150ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: slide-render-burn-rate-high }
      spec:
        notificationTargets: [{ target: "grafana-oncall:slides-sev2" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.95, lookbackWindow: 1h, alertAfter: 0m }
