# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-export-mp4-latency
  displayName: Slides — Export MP4 latency (per-slide × 1s + 5s overhead)
  labels:
    microservice: slides
    bounded_context: import-export
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-import-export-worker
  description: |
    p95 ≤ slide_count × 1s + 5s overhead for MP4 export. Per PRD §"Performance" + ADR-SLIDES-0003
    (ffmpeg deterministic mode in gVisor sandbox).
  indicator:
    metadata: { name: export-mp4-p95-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              # `mp4_within_budget` is a recording rule that compares observed seconds to budget
              # (slide_count × 1 + 5) per job; emits 1 if within budget, 0 if not.
              query: 'sum(rate(oya_slides_export_mp4_within_budget_total[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_export_mp4_completed_total[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% MP4 export ≤ budget (slide_count × 1s + 5s)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: export-mp4-burn-rate }
      spec:
        notificationTargets: [{ target: grafana-oncall:slides-sev3 }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.85, lookbackWindow: 1h, alertAfter: 0m }
