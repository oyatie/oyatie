image:
  registry: registry.oyatie.dev
  repository: slides/slides-runtime
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 4

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: 2,    memory: 4Gi }

perTenantSessionCap: 50  # T-D-01

oidc:
  issuer: https://auth.oyatie.com
  audience: slides
  jwksCacheSeconds: 300

cedar:
  evaluatorEndpoint: "http://acl.slides.svc.cluster.local:8080"
  failClosed: true  # T-D-07

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  egress:
    - to: sheets.sheets.svc.cluster.local
      ports: [8080]
    - to: docs.docs.svc.cluster.local
      ports: [8080]
    - to: forms.forms.svc.cluster.local
      ports: [8080]
    - to: drive.drive.svc.cluster.local
      ports: [8080]
    - to: messenger.messenger.svc.cluster.local
      ports: [8080]
    - to: social.social.svc.cluster.local
      ports: [8080]
    - to: mail.mail.svc.cluster.local
      ports: [8080]
    - to: ontology.ontology.svc.cluster.local
      ports: [8080]
    - to: foundry-runtime.foundry-runtime.svc.cluster.local
      ports: [8080]
    - to: tenancy.tenancy.svc.cluster.local
      ports: [8080]
    - to: audit-chain.audit-chain.svc.cluster.local
      ports: [8080]
    - to: observability.observability.svc.cluster.local
      ports: [8080, 9090]
    - to: slides-postgres-primary.slides.svc.cluster.local
      ports: [5432]
    - to: slides-valkey-primary.slides.svc.cluster.local
      ports: [6379]
    - to: slides-s3.slides.svc.cluster.local
      ports: [443]

secrets:
  spiffeIdentityPath: "secret/slides/spiffe"
  postgresConnectionPath: "secret/slides/postgres"
  valkeyAuthPath: "secret/slides/valkey"
  s3KmsKeyPath: "secret/slides/s3-kms-per-pack"
  ed25519SigningKeyPath: "secret/slides/audit-chain/signing-key"
  collabHmacKeyPath: "secret/slides/collab-hmac"

exportPool:
  replicaCount: 4
  minReplicas: 4
  maxReplicas: 100
  perJobMemoryGiB:
    import: 2
    mp4: 4
    pdf: 2
    pptx: 2
  exportQuotaPerPackPerDay:
    kr: 100000
    eu: 50000
    us: 100000
    us-healthcare: 50000
    jp: 100000
    sg: 100000
    au: 100000
    in: 100000
    br: 100000
    ae: 50000
    ksa: 50000
  gvisor:
    enabled: true
    # runtimeClassName resolved via oya.runtimeClassName.untrustedContent
    # canonical helper per ADR-0147 (amended 2026-05-18: Cloud Hypervisor
    # primary). Helper emits kata-clh; this key retained only as a
    # transitional fallback for tooling that still reads it.
    runtimeClassName: kata-clh

broadcastWorker:
  replicaCount: 2
  minReplicas: 2
  maxReplicas: 50
  perDeckViewerCap: 5000

collabWorker:
  replicaCount: 3
  minReplicas: 3
  maxReplicas: 100
  perSessionOpRateLimitPerSecSustained: 100
  perSessionOpRateLimitPerSecBurst: 1000

serviceMonitor:
  enabled: true
  interval: 30s
  endpoints:
    - port: metrics
      path: /metrics

prometheusRule:
  enabled: true
  ruleFiles:
    - /etc/slides/recording-rules/editor-rest.yaml
    - /etc/slides/alerts/editor-rest-burn-rate.yaml
    - /etc/slides/alerts/collab-silent-loss.yaml
    - /etc/slides/alerts/broadcast-degraded.yaml
    - /etc/slides/alerts/export-pipeline-failure.yaml
