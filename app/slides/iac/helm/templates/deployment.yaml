apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-slides-runtime
  namespace: slides
  labels:
    app.kubernetes.io/name: oya-slides
    app.kubernetes.io/part-of: oya-slides
    oyatie/microservice: slides
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-slides
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-slides
        oyatie/microservice: slides
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: slides-runtime
      {{- /* Untrusted-content sandbox per ADR-0147 (LibreOffice + Chromium export pool) */}}
      {{- if .Values.exportPool.gvisor.enabled }}
      {{- include "oya.runtimeClassName.untrustedContent" $ | nindent 6 }}
      {{- else }}
      runtimeClassName: runc
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: oya-slides
      containers:
        - name: slides-runtime
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: {{ .Values.service.port }}, name: http }
            - { containerPort: {{ .Values.service.metricsPort }}, name: metrics }
          env:
            - { name: PER_TENANT_SESSION_CAP, value: "{{ .Values.perTenantSessionCap }}" }
            - { name: OIDC_ISSUER, value: "{{ .Values.oidc.issuer }}" }
            - { name: OIDC_AUDIENCE, value: "{{ .Values.oidc.audience }}" }
            - { name: CEDAR_EVALUATOR_ENDPOINT, value: "{{ .Values.cedar.evaluatorEndpoint }}" }
            - { name: CEDAR_FAIL_CLOSED, value: "{{ .Values.cedar.failClosed }}" }
            - { name: SPIFFE_IDENTITY_REF, value: "${openbao:{{ .Values.secrets.spiffeIdentityPath }}}" }
            - { name: POSTGRES_CONN_REF, value: "${openbao:{{ .Values.secrets.postgresConnectionPath }}}" }
            - { name: VALKEY_AUTH_REF, value: "${openbao:{{ .Values.secrets.valkeyAuthPath }}}" }
            - { name: S3_KMS_KEY_REF, value: "${openbao:{{ .Values.secrets.s3KmsKeyPath }}}" }
            - { name: ED25519_SIGNING_KEY_REF, value: "${openbao:{{ .Values.secrets.ed25519SigningKeyPath }}}" }
            - { name: COLLAB_HMAC_KEY_REF, value: "${openbao:{{ .Values.secrets.collabHmacKeyPath }}}" }
          resources:
            requests:
              { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
            limits:
              { cpu: {{ .Values.resources.limits.cpu }}, memory: {{ .Values.resources.limits.memory }} }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
