apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-crm-pqc
spec:
  secretName: oya-crm-tls
  commonName: crm.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
