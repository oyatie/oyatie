apiVersion: openslo/v1
kind: SLO
metadata:
  name: crm-availability
  labels:
    service: crm
    sap_code: "CRM"
spec:
  description: "Customer Relationship Management crm-availability objective; benchmarks SAP CRM Customer Relationship Management | Oracle Fusion Sales and Service | Workday customer and service-workflow counterpart | NetSuite CRM | Microsoft Dynamics 365 Customer Engagement"
  service: crm
  indicator:
    metadata:
      name: crm-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"crm\",status=~\"2..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"crm\"}[5m]))"
  objectives:
    - displayName: crm-availability
      target: 0.999
