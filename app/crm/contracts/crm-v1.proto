// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.crm.v1;

option java_package = "dev.oyatie.crm.v1";

// SAP CRM; benchmarks: SAP CRM Customer Relationship Management | Oracle Fusion Sales and Service | Workday customer and service-workflow counterpart | NetSuite CRM | Microsoft Dynamics 365 Customer Engagement
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.

message AccountMasterCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message AccountMasterResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message OpportunityCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message OpportunityResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message QuoteCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message QuoteResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message ServiceCaseCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message ServiceCaseResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message CampaignCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message CampaignResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message LoyaltyLedgerCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message LoyaltyLedgerResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service CrmService {
  rpc MutateAccountMaster (AccountMasterCommand) returns (AccountMasterResult);
  rpc MutateOpportunity (OpportunityCommand) returns (OpportunityResult);
  rpc MutateQuote (QuoteCommand) returns (QuoteResult);
  rpc MutateServiceCase (ServiceCaseCommand) returns (ServiceCaseResult);
  rpc MutateCampaign (CampaignCommand) returns (CampaignResult);
  rpc MutateLoyaltyLedger (LoyaltyLedgerCommand) returns (LoyaltyLedgerResult);
}
