version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Status Update bounded context for the ITSM µservice (statuspage-class incident communications)."

[package.metadata.oya]
microservice = "itsm"
bounded_context = "status-update"
