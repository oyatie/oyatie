asyncapi: 3.1.0
info:
  title: ITSM Local Operational Events
  version: 1.0.0
  description: Events for incident, change, problem, CMDB, knowledge base, and service-level management operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  itsm.local-ops.v1:
    address: itsm.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/itsm.local-ops.v1'
    messages:
      - $ref: '#/channels/itsm.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/itsm.local-ops.v1'
    messages:
      - $ref: '#/channels/itsm.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: ItsmDomainEvent
      title: ITSM domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['incident.ticket.created', 'change.request.approved', 'problem.record.linked', 'sla.clock.recomputed'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['incident_ticket', 'change_request', 'problem_record', 'cmdb_relation', 'sla_clock', 'knowledge_article'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: ItsmSloBurnEvent
      title: ITSM SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'itsm' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'incident.ticket.created' }
