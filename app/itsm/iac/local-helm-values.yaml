service:
  name: itsm
  suite: local-operational-primitive
  audience: IT_SERVICE_MANAGER
workloads:
  ticket-api:
    replicas: 3
    sloMetric: oya_itsm_mttr_objective
  change-controller:
    replicas: 2
    sloMetric: oya_itsm_change_failure_rate
  cmdb-projector:
    replicas: 2
    sloMetric: oya_itsm_ticket_triage_latency
policy:
  directory: policies
  defaultDeny: true
