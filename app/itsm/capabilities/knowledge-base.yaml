apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-knowledge-base
  service: itsm
spec:
  businessCapability: service-management
  capability: knowledge-base
  counterparts:
    - "ServiceNow Knowledge Management (KCS v6)"
    - "Jira Service Management Knowledge Base"
    - "Freshservice Solutions"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0255, ADR-0263, ADR-0328]
  surface:
    operations:
      - article_draft
      - peer_review
      - publish
      - retire
      - retrieve_rag_powered
      - tag_with_ci_relation
    article_kinds:
      - how_to
      - known_error
      - faq
      - runbook_excerpt
  tenantScope:
    requiredFields: [tenant_id, author_principal_id, audience_type, purpose, data_class]
    dataClass: kb_article
  cedarGate: microservices/itsm/policy/knowledge-base-authorization.cedar
  intelligenceBinding:
    rag_corpus: per-tenant
    embedding_model: intelligence-µservice substrate
    reranker: intelligence-µservice substrate
  kcsCompliance: KCS v6
  tenantClassSupport:
    demo_trial: true
    paid: true
  packs:
    demo_trial_caps:
      knowledge_articles: 50
