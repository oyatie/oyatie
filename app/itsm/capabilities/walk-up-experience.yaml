apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-walk-up-experience
  service: itsm
spec:
  businessCapability: service-management
  capability: walk-up-experience
  counterparts:
    - "ServiceNow Walk-Up Experience"
    - "Freshservice Walk-Up"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    flows:
      - kiosk_check_in
      - queue_position_display
      - agent_pickup_notification
      - face_to_face_resolution_capture
      - exit_csat
    locations_supported: [office_lobby_kiosk, dedicated_it_help_desk_terminal]
  tenantScope:
    requiredFields: [tenant_id, requester_principal_id, location_id, audience_type, purpose, data_class]
    dataClass: walk_up_session
  cedarGate: microservices/itsm/policy/walk-up-experience-authorization.cedar
  tenantClassSupport:
    demo_trial: false
    paid: true
