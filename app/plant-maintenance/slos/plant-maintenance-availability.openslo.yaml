apiVersion: openslo/v1
kind: SLO
metadata:
  name: plant-maintenance-availability
  labels:
    service: plant-maintenance
    sap_code: "PM"
spec:
  description: "Plant Maintenance plant-maintenance-availability objective; benchmarks SAP PM Plant Maintenance | Oracle Fusion Maintenance | Workday Extend asset-maintenance workflow counterpart | NetSuite Fixed Assets and Field Service counterpart | Microsoft Dynamics 365 Asset Management"
  service: plant-maintenance
  indicator:
    metadata:
      name: plant-maintenance-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"plant-maintenance\",status=~\"2..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"plant-maintenance\"}[5m]))"
  objectives:
    - displayName: plant-maintenance-availability
      target: 0.999
