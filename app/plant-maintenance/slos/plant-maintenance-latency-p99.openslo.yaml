apiVersion: openslo/v1
kind: SLO
metadata:
  name: plant-maintenance-latency-p99
  labels:
    service: plant-maintenance
    sap_code: "PM"
spec:
  description: "Plant Maintenance plant-maintenance-latency-p99 objective; benchmarks SAP PM Plant Maintenance | Oracle Fusion Maintenance | Workday Extend asset-maintenance workflow counterpart | NetSuite Fixed Assets and Field Service counterpart | Microsoft Dynamics 365 Asset Management"
  service: plant-maintenance
  indicator:
    metadata:
      name: plant-maintenance-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"plant-maintenance\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"plant-maintenance\"}[5m]))"
  objectives:
    - displayName: plant-maintenance-latency-p99
      target: 0.99
