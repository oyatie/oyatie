apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-plant-maintenance-pqc
spec:
  secretName: oya-plant-maintenance-tls
  commonName: plant-maintenance.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
