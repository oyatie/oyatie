# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: social-profile-render-availability
  displayName: "social: profile-render availability ≥ 99.95 %"
  labels:
    microservice: social
    bc: user-profile
    sli_class: availability
    tier: hero-product
    owner_team: axis-social
    pack_scope: all
spec:
  description: |
    Availability SLO for GET /profiles/{handle} (and GET /profiles/me). A request
    is "good" when it returns 2xx with profile body within p99 ≤ 350ms;
    5xx or timeout marks bad. Per Google SRE Workbook ch. 5 multi-window
    multi-burn-rate.
  service: social
  indicator:
    metadata:
      name: social-profile-render-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_profile_render_total{result="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_profile_render_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9995
      displayName: "30d rolling availability ≥ 99.95 %"
  alertPolicies:
    - alertPolicyRef: social-profile-render-fast-burn-1h-14x
    - alertPolicyRef: social-profile-render-slow-burn-6h-6x
