# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: social-search-people-latency
  displayName: "social: search-people p95 ≤ 300ms"
  labels:
    microservice: social
    bc: search
    sli_class: latency
    owner_team: axis-social
spec:
  description: |
    p95 latency for GET /search/people with Cedar-filtered post-process.
    Corpus baseline: per-tenant profile corpus up to ~1M profiles per
    tenant. Beyond 1M profiles, latency follows the search-adapter scaling
    curve and a tenant-tier SLO override applies (see capacity-model.md).
  service: social
  indicator:
    metadata:
      name: social-search-people-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_search_people_duration_seconds_bucket{le="0.3"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_search_people_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 search-people ≤ 300ms"
