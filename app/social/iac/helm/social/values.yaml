# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr  # overridden per-pack overlay
  cluster: social
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-community-social-app
  tag: "1.0.0"  # SHA-pinned at release-pointer advance per ADR-0139

# ============================================================================
# Per-BC deployment sizing (XS-tier baseline; HPA scales up)
# ============================================================================

websocketGateway:
  replicas: 6
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 6
    maxReplicas: 200
    targetCPUUtilizationPercentage: 70

userProfile:
  replicas: 4
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

followGraph:
  replicas: 4
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

postCompositionRest:
  replicas: 6
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 6
    maxReplicas: 100
    targetCPUUtilizationPercentage: 65

postCompositionWorker:
  replicas: 6
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

feedTimeline:
  replicas: 8
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}
  hpa:
    minReplicas: 8
    maxReplicas: 200
    targetCPUUtilizationPercentage: 65

reactions:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

mentions:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

hashtags:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

trendingTopics:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

notifications:
  replicas: 6
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

contentModeration:
  replicas: 4
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

search:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

profileVerification:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ageVerification:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

federationGateway:
  enabled: false  # Off in P01; activated in P02 per ADR-SOC-0004
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

bookmarks:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

lists:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# ============================================================================
# Backing stores — references; provisioning lives in cloud-k8s + cloud-db
# ============================================================================

postgres:
  host: social-pg.${global.pack}.svc.cluster.local
  port: 5432
  database: social
  sslmode: require
  username: "${openbao:secret/social/postgres/username}"
  password: "${openbao:secret/social/postgres/password}"
  partitionStrategy: "by_tenant_user_yyyy_mm"
  rls: enabled  # MANDATORY
  version: "16"  # Postgres 16 LTS per ADR

valkeyCache:
  host: social-valkey-cache.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/social/valkey/cache-auth}"
  version: "7.2"  # Valkey 8.1 (RESP3 wire-compatible)

valkeyStreams:
  host: social-valkey-streams.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/social/valkey/streams-auth}"
  version: "7.2"

s3Media:
  endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
  bucket: oya-community-social-media-${global.pack}
  quarantineBucket: oya-community-social-quarantine-${global.pack}
  cdnBucket: oya-community-social-cdn-${global.pack}
  accessKeyId: "${openbao:secret/social/s3/access-key}"
  secretAccessKey: "${openbao:secret/social/s3/secret-key}"
  sseKms: tenant-DEK

meilisearch:
  enabled: true
  host: social-meilisearch.${global.pack}.svc.cluster.local
  port: 7700
  apiKey: "${openbao:secret/social/meilisearch/master-key}"
  version: "0.10.0"  # Meilisearch 0.10 LTS

# ============================================================================
# Media transcode stack
# ============================================================================

imagemagick:
  enabled: true
  version: "7.1"  # ImageMagick 7.1 LTS
  sandbox: gvisor  # Sandboxed transcode workers per threat-model T-E-05

ffmpeg:
  enabled: true
  version: "7.x"  # ffmpeg 7.x LTS
  sandbox: gvisor

# ============================================================================
# Malware scan
# ============================================================================

opswat:
  enabled: true
  endpoint: "${openbao:secret/social/opswat/endpoint}"
  apiKey: "${openbao:secret/social/opswat/api-key}"
  fallback: clamav
  version: "5.x"  # OPSWAT 5.x

clamav:
  enabled: true  # fallback only; primary is opswat
  version: "1.x"

# ============================================================================
# Federation (ActivityPub) — off by default per ADR-SOC-0004
# ============================================================================

activitypub:
  enabled: false  # Activated per tenant opt-in; Personal-tier never federates
  peerAllowlist: []
  httpSignaturesVersion: "RFC-9421"

# ============================================================================
# Cedar policy + Authz
# ============================================================================

cedar:
  policyConfigMap: social-cedar-policies
  defaultDeny: true
  version: "v4.2"  # Cedar v4.2 LTS

# ============================================================================
# Foundry-runtime classifier client (EU AI Act high-risk)
# ============================================================================

foundryRuntime:
  enabled: true
  endpoint: foundry-runtime.foundry.svc.cluster.local:50051
  classifierVersion: "social-moderation-v1.0"
  rankingVersion: "social-ranking-v1.0"
  batchSize: 100
  euAiActLabel: "ai_generated_assessment"  # Art. 50 transparency

# ============================================================================
# Age verification
# ============================================================================

ageVerificationPolicy:
  enabled: true
  packGdprMinorThreshold: 16  # GDPR Art. 8 default; member states may lower
  packCoppaMinorThreshold: 13  # US COPPA
  packKrMinorThreshold: 14  # KR Youth Protection Act default

# ============================================================================
# Capabilities tier toggles (T0/T1/T2)
# ============================================================================

capabilities:
  t0Suggest:
    enabled: true
  t1Assist:
    enabled: true
  t2Auto:
    enabled: true
    moderation: true
    ranking: true
    adsSubstrateStub: false  # OFF BY DEFAULT per ADR successor-IP

# ============================================================================
# Observability
# ============================================================================

observability:
  otelEndpoint: alloy.observability.svc.cluster.local:4317
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true
