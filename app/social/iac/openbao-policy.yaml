# OpenBao policy bindings for social µservice
# Authority: ADR-0296

apiVersion: openbao.io/v1
kind: PolicyBinding
metadata:
  name: social-openbao-policy
spec:
  policies:
    - name: social-federation-signing-key
      paths:
        - "secret/data/+/social/federation-signing-key":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.social.federation-key-mint
    - name: social-push-notification-providers
      paths:
        - "secret/data/+/social/apns-token":
            capabilities: [read]
            ttl_seconds: 60
        - "secret/data/+/social/fcm-token":
            capabilities: [read]
            ttl_seconds: 60
        - "secret/data/+/social/webpush-vapid-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: social-intelligence-byok
      paths:
        - "secret/data/+/byok/intelligence-provider":
            capabilities: [read]
            ttl_seconds: 60
    - name: social-idv-provider-key
      paths:
        - "secret/data/+/social/idv-provider-api-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: social-photodna-api-key
      paths:
        - "secret/data/+/social/photodna-api-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: social-ncmec-api-key
      paths:
        - "secret/data/+/social/ncmec-api-key":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.social.ncmec-credential-access
  sidecar:
    enabled: true
    image: openbao-sidecar:1.18
    ttl_seconds: 60
    refresh_advance_seconds: 10
    audit_emit_class: oya.social.credential-mint
