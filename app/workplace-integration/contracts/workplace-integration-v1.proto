// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.workplace_integration.v1;

option java_multiple_files = true;
option java_package = "dev.oyatie.workplace_integration.v1";
option go_package = "oyatie.dev/workplace_integration/v1;workplace_integrationv1";

// Naming justifications: BNF v4 service.action.resource grammar and 13-layer-enum conformance are declared in PRD.md.
service WorkplaceAgreementService {
  rpc SubmitWorkplaceAgreement(WorkplaceAgreementCommand) returns (WorkplaceAgreementReceipt);
  rpc GetWorkplaceAgreementEvidence(WorkplaceAgreementEvidenceRequest) returns (WorkplaceAgreementEvidence);
}

message WorkplaceAgreementCommand {
  string tenant_id = 1;
  string sub_scope_path = 2;
  string principal_id = 3;
  string idempotency_key = 4;
  string action = 5;
  string resource_json = 6;
}

message WorkplaceAgreementReceipt {
  bool accepted = 1;
  string state = 2;
  string audit_chain_ref = 3;
}

message WorkplaceAgreementEvidenceRequest {
  string tenant_id = 1;
  string audit_chain_ref = 2;
}

message WorkplaceAgreementEvidence {
  string tenant_id = 1;
  string sub_scope_path = 2;
  string audit_chain_ref = 3;
  string event_name = 4;
  string payload_digest = 5;
}
