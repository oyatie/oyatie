apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workplace-integration-clock-attestation-availability
  displayName: Workplace Integration Clock Attestation Availability
  labels:
    service: workplace-integration
    adr: ADR-0320
spec:
  description: Workplace Integration SLO for clock-attestation-availability using route=/workplace/clock-events
  service: workplace-integration
  indicator:
    metadata:
      name: oya-workplace-integration-clock-attestation-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_dlp_trace_seal_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_dlp_trace_seal_total[5m]))
  objectives:
    - displayName: Clock Attestation Availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "workplace-integration.slo.clock-attestation-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
