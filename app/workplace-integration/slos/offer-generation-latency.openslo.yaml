apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workplace-integration-offer-generation-latency
  displayName: Workplace Integration Offer Generation Latency
  labels:
    service: workplace-integration
    adr: ADR-0320
spec:
  description: Workplace Integration SLO for offer-generation-latency using route=/workplace/offer-letters
  service: workplace-integration
  indicator:
    metadata:
      name: oya-workplace-integration-offer-generation-latency-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_roster_bind_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_roster_bind_total[5m]))
  objectives:
    - displayName: Offer Generation Latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "workplace-integration.slo.offer-generation-latency"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
