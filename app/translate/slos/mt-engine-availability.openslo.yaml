# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-mt-engine-availability
  displayName: "translate: per-engine + aggregate MT engine availability"
  labels:
    microservice: translate
    bc: mt-engine-router
    sli_class: availability
    service_classification: hero-and-substrate
    owner_team: axis-translate + ops-sre-reliability
    pack_scope: all
spec:
  description: |
    MT engine availability SLO. An engine attempt is "good" when the engine returns
    a 2xx-class response (or a successful gRPC OK) within timeout. Both per-engine
    (in-house, anthropic, openai, google-translate, deepl) and aggregate
    availability tracked. PRD §"Availability + SLO": 99.95 % monthly target.

    Engine fallback per ADR-TRANSLATE-0001 means aggregate availability MAY exceed
    any single engine's availability when fallback chains are healthy.
  service: translate
  indicator:
    metadata: {name: translate-mt-engine-availability}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum by (vendor) (rate(oya_translate_engine_invocation_total{result="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum by (vendor) (rate(oya_translate_engine_invocation_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9995
      displayName: "30d rolling per-engine availability ≥ 99.95 %"
    - target: 0.99995
      displayName: "30d rolling aggregate (with fallback) availability ≥ 99.995 %"
  alertPolicies:
    - alertPolicyRef: translate-engine-availability-fast-burn-1h-14x
    - alertPolicyRef: translate-engine-availability-slow-burn-6h-6x
    - alertPolicyRef: translate-engine-multi-vendor-degraded
