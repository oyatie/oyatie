# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-translation-request-latency
  displayName: "translate: single-segment translation-request latency p95"
  labels:
    microservice: translate
    bc: translation-request
    sli_class: latency
    service_classification: hero-and-substrate
    owner_team: axis-translate
    pack_scope: all
    data_classes: PII_IDENTIFYING,BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Single-segment translation request p95 latency SLO. A request is "good" when the
    REST call `/translate` for a segment ≤ 500 characters returns a translation within
    ≤ 250 ms p95. Covers in-house MT path; vendor-routed requests carry vendor RTT.
    PRD §"Performance" budget (FR-01).
  service: translate
  indicator:
    metadata: {name: translate-translation-request-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95,
                sum by (le) (rate(oya_translate_translation_request_duration_seconds_bucket{segment_size_bucket="le_500"}[5m])))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.250
      displayName: "30d rolling p95 ≤ 250 ms"
  alertPolicies:
    - alertPolicyRef: translate-translation-request-fast-burn-1h-14x
    - alertPolicyRef: translate-translation-request-slow-burn-6h-6x
    - alertPolicyRef: translate-translation-request-ticket-burn-3d-1x
