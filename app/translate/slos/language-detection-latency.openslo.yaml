# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-language-detection-latency
  displayName: "translate: language-detection latency p99 (≤ 4 KB input)"
  labels:
    microservice: translate
    bc: language-detection
    sli_class: latency
    service_classification: hero-and-substrate
    owner_team: axis-translate
    pack_scope: all
spec:
  description: |
    Language-detection latency p99 SLO. A request is "good" when `/detect-language`
    returns ISO 639-3 + BCP 47 tag within ≤ 50 ms p99 for input ≤ 4 KB
    (FastText-class model + LangID heuristic). PRD §"Performance" FR-03.
  service: translate
  indicator:
    metadata: {name: translate-language-detection-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(oya_translate_language_detection_duration_seconds_bucket[5m])))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 0.050
      displayName: "30d rolling p99 ≤ 50 ms"
  alertPolicies:
    - alertPolicyRef: translate-langdetect-fast-burn-1h-14x
    - alertPolicyRef: translate-langdetect-slow-burn-6h-6x
