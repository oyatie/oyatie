# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr
  cluster: translate
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-translate-app
  tag: "1.0.0"

translationRequestRest:
  replicas: 6
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 6
    maxReplicas: 120
    targetCPUUtilizationPercentage: 70

batchTranslateWorker:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 75

realTimeStreamGateway:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 1500m, memory: 1.5Gi}
  hpa:
    minReplicas: 4
    maxReplicas: 80
    targetCPUUtilizationPercentage: 70
  correctionReplayWindowMs: 800

documentLocalizationWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}
  # ADR-0147: Pandoc + LibreOffice document localization = untrusted-content.
  workloadClass: untrusted-content
  pandocVersion: "3.1.13"
  libreofficeVersion: "24.2.5"

tmLeverageWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

qualityEstimationWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}
  modelTag: "comet-kiwi-v1.0.0"

mtEngineRouter:
  replicas: 4
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

# Substrate secrets via OpenBao SecretReference
openbao:
  postgresUrl: "${openbao:secret/translate/postgres-url}"
  valkeyUrl: "${openbao:secret/translate/valkey-url}"
  meilisearchKey: "${openbao:secret/translate/meilisearch-master-key}"
  s3AccessKey: "${openbao:secret/translate/s3-access-key}"
  s3SecretKey: "${openbao:secret/translate/s3-secret-key}"
  anthropicApiKey: "${openbao:secret/translate/providers/anthropic-api-key}"
  openaiApiKey: "${openbao:secret/translate/providers/openai-api-key}"
  googleTranslateKey: "${openbao:secret/translate/providers/google-translate-api-key}"
  deeplKey: "${openbao:secret/translate/providers/deepl-api-key}"
  tmHashKey: "${openbao:secret/translate/tm-hash-key}"

# Data-residency enforcement (CI-validated per ADR-TRANSLATE-0004)
dataResidency:
  enforce: true
  defaultDeny: true
  perPackEngineWhitelist:
    kr: [in-house, anthropic-kr, google-translate-kr, deepl-de-with-consent]
    eu: [in-house, anthropic-eu, openai-eu, google-translate-eu, deepl-de]
    us: [in-house, anthropic-us, openai-us, google-translate-us, deepl-de]
    us-healthcare: [in-house, anthropic-us-baa]
    jp: [in-house, anthropic-jp, deepl-jp, google-translate-jp]
    sg: [in-house, anthropic-sg, google-translate-sg]
    au: [in-house, anthropic-au, google-translate-au]
    in: [in-house, anthropic-in, google-translate-in]
    br: [in-house, anthropic-br, google-translate-br]
    ae: [in-house, anthropic-ae]
    ksa: [in-house, anthropic-ksa]
    cn-stub: [in-house]

meilisearch:
  enabled: true
