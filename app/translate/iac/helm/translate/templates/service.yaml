# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: translate-rest
  namespace: translate
  labels: {app.kubernetes.io/name: translate}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: translate
    app.kubernetes.io/component: translation-request-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: v1
kind: Service
metadata:
  name: translate-stream
  namespace: translate
  labels: {app.kubernetes.io/name: translate}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: translate
    app.kubernetes.io/component: real-time-stream-gateway
  ports:
    - {name: wss, port: 443, targetPort: 8443}
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: translate-engine-router
  namespace: translate
  labels: {app.kubernetes.io/name: translate}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: translate
    app.kubernetes.io/component: mt-engine-router
  ports:
    - {name: grpc, port: 50051, targetPort: 50051}
