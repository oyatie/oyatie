# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: translate
resources: [../../base]
commonAnnotations:
  oyatie/pack: "kr"
  oyatie/region: "ap-northeast-2"
  oyatie/legal-citations: |
    KR PIPA Arts. 15/17/22-2/23/28/29 + 통신비밀보호법 Art. 3 + 정보통신망법 Art. 28.
    개인정보 국외이전 (Art. 28) — cross-border default-deny per ADR-TRANSLATE-0004.
    EU AI Act Art. 50 transparency for tenant-EU-end-user disclosures (when consented).
  oyatie/residency-invariant: "data-residency-bound-inference; cross-border permitted ONLY with explicit Art. 28 consent"
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--component=translation-request-rest", "--pack=kr"]
    target:
      kind: Deployment
      name: translate-translation-request-rest
  # Pack-KR engine whitelist tightening: deepl-de cross-border requires Art. 28 consent;
  # configured via openbao secret reference at runtime; this overlay only annotates.
