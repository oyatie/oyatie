# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:translate:t0-suggest:v1
name: translate-segment-suggest-and-lang-hint
namespace: translate
display_name: Segment-Suggest + Language-Hint
description: |
  T0 suggestion capability: invoked while a user is composing or reviewing
  content. Emits up to 3 ranked translation candidates (`segment-suggest`)
  for the focused segment and up to 3 ranked language candidates
  (`lang-hint`) when source language is ambiguous. Always rendered as
  suggestions; never auto-applied; user retains explicit confirmation.

owner_team: axis-translate + axis-foundry-runtime
maturity: preview
created_at: 2026-05-18
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-TRANSLATE-0001, ADR-TRANSLATE-0004]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/translate/PRD.md (FR-01, FR-03)
  - microservices/translate/contracts/openapi/translate.yaml
  - microservices/translate/policy/translate-tenant-scope.cedar

autonomy_tier: T0
# T0 = suggest-only per ADR-0022; no state mutation; no auto-translate-apply.

inputs:
  - name: segment_text
    type: string
    maxLength: 500
    required: true
  - name: source_locale_hint
    type: string
    pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-[A-Z]{2})?$'  # BCP 47
    required: false
  - name: target_locale
    type: string
    pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-[A-Z]{2})?$'
    required: true
  - name: content_class
    type: enum
    values: [marketing, legal, medical, code_comment, ui_string, technical, generic]
    required: true
  - name: tenant_id
    type: string
    required: true
  - name: project_id
    type: string
    required: false
  - name: pack
    type: enum
    values: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa, pack-cn-stub]
    required: true

outputs:
  - name: segment_suggestions
    type: array
    max_items: 3
    items:
      type: object
      properties:
        translation: {type: string, maxLength: 1000}
        engine: {type: string, enum: [in-house, anthropic, openai, google-translate, deepl]}
        confidence: {type: number, minimum: 0, maximum: 1}
        leverage_match: {type: string, enum: [exact, ice, fuzzy, none]}
        leverage_score: {type: number, minimum: 0, maximum: 1, nullable: true}
        rationale_token: {type: string, description: opaque rationale id for audit replay}
  - name: lang_hints
    type: array
    max_items: 3
    items:
      type: object
      properties:
        bcp47_tag: {type: string}
        iso_639_3_tag: {type: string}
        confidence: {type: number}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

context_kind_constraint:
  # Translate has no Personal/Professional split (no E2E client-only path);
  # all paths server-side; tenant boundary is the unit of isolation.
  Tenant: server-side via tenant-DEK; tenant-admin entitlement required to enable
  enforcement: oya-check-translate-tenant-isolation + Cedar permit

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa, pack-cn-stub]

pack_overrides:
  pack-us-healthcare:
    requires: signed BAA + explicit per-tenant opt-in
    reason: HIPAA 45 CFR §164.502(b) minimum-necessary; PHI translations require in-house only
    forbidden_engines: [google-translate, deepl, openai-non-baa]
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: must-label-as-AI-suggested per EU AI Act Art. 50; render visible disclosure in client
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required for cross-border engine; in-house default
  pack-cn-stub:
    forbidden_engines_all_external: true
    in_house_only: true
    reason: CN PIPL Art. 38-43 + CN DSL cross-border restrictions

evidence_topic: oya.translate.capability.t0_suggest.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0006
  cost_drivers:
    - In-house MT inference (small open-weights model; on-prem GPU pool)
    - TM leverage query (Meilisearch + Postgres)
    - Per-vendor RTT amortized

cedar_policy_fragments:
  - microservices/translate/policy/translate-tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/translate/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.90
  eval_metric: |
    suggestion-relevance vs human-rater baseline (Likert 1-5);
    lang-hint precision@1 ≥ 0.95 (FastText-class baseline);
    BLEU and chrF on WMT-24 dev sets per (source, target) pair
  cadence: per-release
  reference: WMT-24 + chrF++ + COMET (translation quality); FastText LangID (lang-hint baseline)

sunset:
  status: none
