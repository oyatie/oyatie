apiVersion: oyatie.dev/v1
kind: PqcCert
metadata:
  name: healthcare-integration-pqc-cert
  labels:
    service: healthcare-integration
    binding_adr: ADR-0253-amendment
spec:
  service: healthcare-integration
  tenantScoped: true
  audienceType: HEALTHCARE_OPERATOR
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/clinical-interoperability-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Epic", "Cerner", "Allscripts", "Veeva", "FHIR/HL7 connectors"]
