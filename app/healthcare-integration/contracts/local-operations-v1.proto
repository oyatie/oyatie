// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.healthcare_integration.local.v1;

message HealthcareIntegrationLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message HealthcareIntegrationLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message HealthcareIntegrationLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message HealthcareIntegrationLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message HealthcareIntegrationSupportedActions {
  string hl7_message_ingest_action = 1;
  string fhir_bundle_exchange_action = 2;
  string phi_delivery_authorize_action = 3;
  string consent_sync_action = 4;
  string audit_export_action = 5;
  string breakglass_access_action = 6;
}

service HealthcareIntegrationLocalOperationsService {
  rpc CheckLocalPolicy(HealthcareIntegrationLocalPolicyCheckRequest) returns (HealthcareIntegrationLocalPolicyDecision);
  rpc GetLocalSloState(HealthcareIntegrationLocalSloStateRequest) returns (HealthcareIntegrationLocalSloState);
}
