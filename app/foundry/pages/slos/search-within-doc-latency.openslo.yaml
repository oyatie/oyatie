# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-search-within-doc-latency
  displayName: "docs: search-within-doc p99"
  labels:
    microservice: docs
    bc: document-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: PERSONAL_DOC_CONTENT,PROFESSIONAL_DOC_CONTENT
spec:
  description: |
    Search-within-doc p99 latency SLO. A per-doc full-text search request
    (Postgres FTS over block-tree) resolves in ≤ 100ms. PRD-docs §"Performance".
  service: docs
  indicator:
    metadata: {name: docs-search-within-doc-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(docs_search_within_doc_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.1
      displayName: "30d rolling p99 ≤ 100ms"
  alertPolicies:
    - alertPolicyRef: docs-search-fast-burn-1h-14x
    - alertPolicyRef: docs-search-slow-burn-6h-6x
