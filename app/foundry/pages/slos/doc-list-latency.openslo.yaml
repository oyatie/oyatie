# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-doc-list-latency
  displayName: "docs: doc-list p99 (1000 docs)"
  labels:
    microservice: docs
    bc: document-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Doc-list p99 latency SLO. A paginated doc-list query (1000 docs) resolves
    in ≤ 200ms. PRD-docs §"Performance".
  service: docs
  indicator:
    metadata: {name: docs-doc-list-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(docs_document_list_seconds_bucket{page_size="1000"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.2
      displayName: "30d rolling p99 ≤ 200ms (1000-doc page)"
  alertPolicies:
    - alertPolicyRef: docs-doc-list-fast-burn-1h-14x
    - alertPolicyRef: docs-doc-list-slow-burn-6h-6x
