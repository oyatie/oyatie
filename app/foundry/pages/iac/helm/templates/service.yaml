{{/*
Per-BC Service template — one Service per BC. Per ADR-0131.
*/}}
{{- range $bc := list "document-store" "collab-crdt" "block-types" "comments-and-suggestions" "version-history" "sharing-and-permissions" "export-import" "embed-resolver" }}
{{- $cfgKey := $bc | replace "-" "" }}
{{- $cfg := index $.Values $cfgKey }}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-{{ $bc }}-app
  namespace: docs
  labels:
    microservice: docs
    bc: {{ $bc }}
spec:
  type: ClusterIP
  selector:
    microservice: docs
    bc: {{ $bc }}
  ports:
    - {name: app,     port: {{ $cfg.port }}, targetPort: {{ $cfg.port }}, protocol: TCP}
    - {name: metrics, port: {{ $.Values.global.observability.metricsPort }}, targetPort: metrics, protocol: TCP}
{{- end }}
