{{/*
Per-BC HPA. Per ADR-0131 + PRD-docs §"Scale-out policy".
*/}}
{{- if $.Values.autoscaling.enabled }}
{{- range $bc := list "document-store" "collab-crdt" "block-types" "comments-and-suggestions" "version-history" "sharing-and-permissions" "export-import" "embed-resolver" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docs-{{ $bc }}-app-hpa
  namespace: docs
  labels:
    microservice: docs
    bc: {{ $bc }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docs-{{ $bc }}-app
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 10, periodSeconds: 60}]
{{- end }}
{{- end }}
