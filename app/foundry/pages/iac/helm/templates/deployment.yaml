{{/*
Per-BC Deployment template — one Deployment per BC (document-store,
collab-crdt, block-types, comments-and-suggestions, version-history,
sharing-and-permissions, export-import, embed-resolver). Per ADR-0131
per-µservice flat layout + ADR-DOCS-0001/0003/0004/0006 component bindings.

Export-import deployment runs under gVisor runtimeClass per ADR-DOCS-0003.
*/}}
{{- range $bc := list "document-store" "collab-crdt" "block-types" "comments-and-suggestions" "version-history" "sharing-and-permissions" "export-import" "embed-resolver" }}
{{- $cfgKey := $bc | replace "-" "" }}
{{- $cfg := index $.Values $cfgKey }}
{{- $useGvisor := eq $bc "export-import" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-{{ $bc }}-app
  namespace: docs
  labels:
    microservice: docs
    bc: {{ $bc }}
    app.kubernetes.io/name: docs-{{ $bc }}-app
    app.kubernetes.io/version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      microservice: docs
      bc: {{ $bc }}
  template:
    metadata:
      labels:
        microservice: docs
        bc: {{ $bc }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.global.observability.metricsPort }}"
    spec:
      serviceAccountName: docs
{{- if $useGvisor }}
      {{- /* Untrusted-content sandbox per ADR-0147; gVisor default, Kata for sovereign tenants */}}
      {{- include "oya.runtimeClassName.untrustedContent" $ | nindent 6 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app,     containerPort: {{ $cfg.port }}, protocol: TCP}
            - {name: metrics, containerPort: {{ $.Values.global.observability.metricsPort }}, protocol: TCP}
          env:
            - {name: OYATIE_MICROSERVICE,   value: docs}
            - {name: OYATIE_BC,             value: {{ $bc }}}
            - {name: OYATIE_PACK_REGION,    value: {{ $.Values.global.packRegion }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ $.Values.global.observability.tracingEndpoint }}"}
            - {name: RUST_LOG, value: info}
{{- if eq $bc "collab-crdt" }}
            - {name: OYATIE_DOCS_LORO_VERSION, value: "{{ $cfg.loroVersion }}"}
{{- end }}
{{- if eq $bc "export-import" }}
            - {name: OYATIE_DOCS_PANDOC_VERSION,     value: "{{ $cfg.pandocVersion }}"}
            - {name: OYATIE_DOCS_WEASYPRINT_VERSION, value: "{{ $cfg.weasyprintVersion }}"}
            - {name: OYATIE_DOCS_CHROMIUM_VERSION,   value: "{{ $cfg.chromiumVersion }}"}
            - {name: OYATIE_DOCS_OOXML_FIDELITY_FLOOR, value: "{{ $cfg.ooxmlFidelityFloor }}"}
{{- end }}
          resources:
{{ toYaml $cfg.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- if $useGvisor }}
          volumeMounts:
            - name: export-tmpfs
              mountPath: /var/tmp/export
{{- end }}
{{- if $useGvisor }}
      volumes:
        - name: export-tmpfs
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.gvisor.perJobTmpfsBytes }}
{{- end }}
{{- end }}
