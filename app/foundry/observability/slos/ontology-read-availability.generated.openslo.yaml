# Generated from `app/foundry/facade/ontology-app/src/slo.rs`. Do not hand-edit:
# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-read-availability
  displayName: "foundry-ontology — read surface availability"
  labels:
    microservice: foundry-ontology
    sli_class: availability
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "Reads are refused. A surface refusing everything still answers, so this is not reachability."
    runbook.first-check: "An absent credential, a policy denial and an unusable revision pin are all counted here. Check whether refusals share one caller, one pin, or all callers."
    runbook.mitigation: "A single bad revision pin is the caller's to correct. Refusals across all callers point at the authorizer or at a projection the process could not read; prefer restoring the projection over serving unauthorized reads."
    runbook.escalation: "foundry, with whether refusals were caller-scoped or global."
spec:
  service: foundry-ontology
  description: |
    A read is good when the projection answered it. Refusals — absent
    credential, policy denial, unusable revision pin, a log the process
    could not read — are counted, so a surface that refuses everything
    cannot report itself available. /statusz counts here too: it is an
    authorized read-plane surface, so an operator polling it moves this
    ratio, and the number reflects polling frequency alongside service
    health.
  indicator:
    metadata:
      name: ontology-read-availability-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_read_served_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_read_served_total[5m])) + sum(rate(foundry_read_refused_total[5m]))
  objectives:
    - target: 0.995
      displayName: "99.5% of reads answered over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
