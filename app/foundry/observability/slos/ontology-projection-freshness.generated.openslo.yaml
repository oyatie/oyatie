# Generated from `app/foundry/facade/ontology-app/src/slo.rs`. Do not hand-edit:
# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-projection-freshness
  displayName: "foundry-ontology — projection caught up to its log"
  labels:
    microservice: foundry-ontology
    sli_class: freshness
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "foundry_projection_fresh is 0: a tenant the process could read has its durable projection store behind its log head, a tenant's log head or store could not be read, or no tenant could be observed at all."
    runbook.first-check: "GET /statusz: projection_lag is a store behind its log, unreadable_tenants is a log head or store that could not be read, and contended_tenants is a request in flight rather than a fault."
    runbook.mitigation: "Lag is repaired only by a catch-up, which runs at boot and after a migration run and never in the background, so restart the process; a restart that logs boot refused naming the projection store or its catch-up has named the storage fault. A poisoned entry advances the fold and is not this objective's event."
    runbook.escalation: "foundry, with projection_lag, unreadable_tenants and contended_tenants from /statusz and whether foundry_projection_contended stayed non-zero across scrapes."
spec:
  service: foundry-ontology
  description: |
    A scrape is good when every tenant the process could read had its
    durable projection store at its log head. A store behind its log is
    one this process's write path could not mirror, or one whose log
    grew behind the process; readiness refuses until a catch-up repairs
    it. This is a SCRAPE-level boolean, not a per-tenant ratio: the
    signal is process-wide and unlabelled because this surface is
    unauthenticated and must not become a tenancy oracle. A tenant whose
    log head or projection store could not be READ scores zero — an
    unreadable store is not a fresh one. A tenant that was merely BUSY
    does not, because a lock held by a request in flight is a service
    being used, and an objective that reds because the service is being
    used teaches operators to ignore it; lag persists, so a tenant
    genuinely behind is seen on the scrapes that are not contended. A
    scrape that observed NO tenant scores zero rather than vacuously
    good. What this cannot see is a partial wedge: if some tenants stay
    contended forever while the rest are fresh, the claim narrows to the
    tenants it could read and stays true. Alert on sustained non-zero
    foundry_projection_contended for that; it is not a question a
    per-scrape boolean can answer. /readyz answers the stricter question
    and orders its refusals so a measured fault outranks a busy tenant.
    Poison is excluded: a poisoned entry advances the fold, so counting
    it would make the objective unrecoverable. During a total outage no
    series is scraped at all, so budget consumption is the evaluator's
    no-data policy, not this objective's claim.
  indicator:
    metadata:
      name: ontology-projection-freshness-indicator
    spec:
      ratioMetric:
        counter: false
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(foundry_projection_fresh)
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(foundry_projection_fresh)
  objectives:
    - target: 0.999
      displayName: "99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
