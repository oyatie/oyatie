# Generated from `app/foundry/facade/ontology-app/src/slo.rs`. Do not hand-edit:
# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-projection-freshness
  displayName: "foundry-ontology — projection caught up to its log"
  labels:
    microservice: foundry-ontology
    sli_class: freshness
    plane: app
    owner_team: foundry
spec:
  service: foundry-ontology
  description: |
    A scrape is good when the process reports no aggregate lag: every
    served tenant has consumed its whole log. Reads from a lagging
    projection are answers to a question about the past. This is a
    SCRAPE-level boolean, not a per-tenant ratio — the lag gauge is a
    process-wide sum with no tenant label, because this surface is
    unauthenticated and must not become a tenancy oracle, so a
    per-tenant objective is not computable from what is exported and is
    not claimed. Poison is deliberately excluded: a poisoned entry
    advances the fold and is a permanent property of the log, so
    counting it would make the objective unrecoverable.
  indicator:
    metadata:
      name: ontology-projection-freshness-indicator
    spec:
      ratioMetric:
        counter: false
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(foundry_projection_lag == 0)
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(foundry_projection_lag)
  objectives:
    - target: 0.999
      displayName: "99.9% of scrapes with no aggregate lag over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
