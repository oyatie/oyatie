# Generated from `app/foundry/facade/ontology-app/src/slo.rs`. Do not hand-edit:
# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-submit-availability
  displayName: "foundry-ontology — Action submission availability"
  labels:
    microservice: foundry-ontology
    sli_class: availability
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "foundry_action_submit_refused_total is rising against foundry_action_submit_served_total: the single-Action and migration run surfaces are answering, but refusing."
    runbook.first-check: "The refusal body's gate and HTTP status. A 503 with gate log is the action log refusing to be written. A 403 with gate authorization for every caller at once is the policy decision point failing every decision, since any error it returns is a denial; the runtime guard's circuit, open after five consecutive runtime faults such as a decision past its 250 ms deadline or a crash, is one such error. A 403 with gate parameters or admission is the writer refusing one submission, which is the denial-trail objective's event; a 401, 400, 409 or a 403 for one caller is that request's credential, body, idempotency key or grant."
    runbook.mitigation: "A refusal at one caller is that caller's request to fix. The policy engine is compiled into this binary, so a universal authorization refusal has no authorizer to reconnect; the circuit retries the engine after a 30 s cooldown. A restart reloads the compiled-in bundle and re-opens the log, and refuses to boot with PolicyRejected or ActionLogUnopenable if either is the fault."
    runbook.escalation: "foundry, with the gate and HTTP status of the refusals and whether every caller received them."
spec:
  service: foundry-ontology
  description: |
    A submission is good when the writer accepted it into the log. A
    policy refusal counts against this objective deliberately: from the
    caller's side an Action it was entitled to submit and could not is
    an outage, and hiding refusals here would make the number flatter
    than the service.
  indicator:
    metadata:
      name: ontology-submit-availability-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m])) + sum(rate(foundry_action_submit_refused_total[5m]))
  objectives:
    - target: 0.99
      displayName: "99% of submissions accepted over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
