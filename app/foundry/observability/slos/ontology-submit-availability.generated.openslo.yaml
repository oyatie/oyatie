# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-submit-availability
  displayName: "foundry-ontology — Action submission availability"
  labels:
    microservice: foundry-ontology
    sli_class: availability
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "Writes are refused. Callers see a refusal rather than a timeout, so the surface is answering."
    runbook.first-check: "Separate authorization from storage: a policy denial refuses every caller identically, while a storage fault refuses regardless of identity and is not a conflict."
    runbook.mitigation: "If the authorizer is unreachable the surface denies by default and that is intended; restore the authorizer rather than bypassing it. If the log is unwritable, restore write access to it before retrying."
    runbook.escalation: "foundry, naming which of the two the first check ruled out."
spec:
  service: foundry-ontology
  description: |
    A submission is good when the writer accepted it into the log. A
    policy refusal counts against this objective deliberately: from the
    caller's side an Action it was entitled to submit and could not is
    an outage, and hiding refusals here would make the number flatter
    than the service.
  indicator:
    metadata:
      name: ontology-submit-availability-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m])) + sum(rate(foundry_action_submit_refused_total[5m]))
  objectives:
    - target: 0.99
      displayName: "99% of submissions accepted over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
