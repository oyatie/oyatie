# the suite compares this file byte-for-byte against the renderer.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-submit-availability
  displayName: "foundry-ontology — Action submission availability"
  labels:
    microservice: foundry-ontology
    sli_class: availability
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "Submissions are refused. The surface is answering, so this is not reachability."
    runbook.first-check: "A policy refusal counts here deliberately, so separate it from a writer fault by scope: policy is identity-dependent and refuses one caller or one tenant, since every grant is scoped to a role and to principal.tenant == resource.tenant. A writer fault refuses regardless of who asks."
    runbook.mitigation: "An identity-scoped refusal is usually a correct denial; confirm the caller's grant before treating it as an outage. A refusal that ignores identity points at the writer or the log it appends to. The policy engine is compiled into this binary, so there is no authorizer to reconnect: a policy bundle rejected at boot fails the process rather than degrading it."
    runbook.escalation: "foundry, with whether refusals were identity-scoped or universal."
spec:
  service: foundry-ontology
  description: |
    A submission is good when the writer accepted it into the log. A
    policy refusal counts against this objective deliberately: from the
    caller's side an Action it was entitled to submit and could not is
    an outage, and hiding refusals here would make the number flatter
    than the service.
  indicator:
    metadata:
      name: ontology-submit-availability-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_submit_served_total[5m])) + sum(rate(foundry_action_submit_refused_total[5m]))
  objectives:
    - target: 0.99
      displayName: "99% of submissions accepted over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
