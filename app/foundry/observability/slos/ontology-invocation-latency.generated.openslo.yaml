apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-invocation-latency
  displayName: "foundry-ontology — accepted invocations answered within budget"
  labels:
    microservice: foundry-ontology
    sli_class: latency
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "foundry_action_invocation_answered_within_250ms_total is falling behind foundry_action_invocation_answered_total: accepted single-Action submissions are answering, but past 250 ms. Only accepted submissions on that surface are timed; migration runs are not."
    runbook.first-check: "contended_tenants on /statusz, read as whether a migration run was in flight: the clock starts at handler entry and includes the policy decision, waiting for the tenant lock, the log append and the durable SQLite mirror into the projection store, and a migration run holds that lock across its whole fixpoint and catch-up, so a submit that arrives during one waits with the clock running."
    runbook.mitigation: "Do not run a migration while latency matters: one run holds the tenant lock for its whole duration. The fold itself is in memory; the durable mirror is a SQLite write inside the budget, and the policy decision's own deadline equals the whole budget. The shared tenant lock is what couples this objective to freshness, and foundry_projection_contended measures it."
    runbook.escalation: "foundry, with whether a migration run was in flight and whether foundry_projection_contended was non-zero over the window."
spec:
  service: foundry-ontology
  description: |
    An accepted single-Action invocation is good when the handler
    answered within 250 ms of its entry: credential, policy decision,
    tenant lock, append and fold all inside the budget. Only ACCEPTED
    invocations are measured; a refusal is the availability objective's
    event, and timing it here would let fast refusals buy latency
    budget. The migration run surface is not timed against this budget,
    because one run is many writes. The budget is a counter pair rather
    than a histogram because this exposition is hand-rendered and
    unlabelled; the series name carries the budget so a change to one
    without the other is visible.
  indicator:
    metadata:
      name: ontology-invocation-latency-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_invocation_answered_within_250ms_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_invocation_answered_total[5m]))
  objectives:
    - target: 0.99
      displayName: "99% of accepted invocations answered within 250 ms over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
