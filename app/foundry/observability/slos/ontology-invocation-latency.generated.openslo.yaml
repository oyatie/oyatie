apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-invocation-latency
  displayName: "foundry-ontology — accepted invocations answered within budget"
  labels:
    microservice: foundry-ontology
    sli_class: latency
    plane: app
    owner_team: foundry
  annotations:
    runbook.symptom: "Accepted single-Action invocations are answering, but outside the 250 ms budget. This is the WRITE path: credential, policy decision, tenant lock, append and fold."
    runbook.first-check: "Only accepted invocations are timed, so a rise here is not refusals getting slower. Compare against projection freshness: the fold is inside this budget, so a tenant whose store is behind or contended pays for it in this objective."
    runbook.mitigation: "Contention on a tenant lock is relieved by letting an in-flight write finish rather than by retrying into the same lock. A slow fold is the projection store's problem and shows up in freshness first. Migration runs are deliberately not timed against this budget, so a run in progress is not the cause."
    runbook.escalation: "foundry, with whether projection freshness moved with the latency."
spec:
  service: foundry-ontology
  description: |
    An accepted single-Action invocation is good when the handler
    answered within 250 ms of its entry: credential, policy decision,
    tenant lock, append and fold all inside the budget. Only ACCEPTED
    invocations are measured; a refusal is the availability objective's
    event, and timing it here would let fast refusals buy latency
    budget. The migration run surface is not timed against this budget,
    because one run is many writes. The budget is a counter pair rather
    than a histogram because this exposition is hand-rendered and
    unlabelled; the series name carries the budget so a change to one
    without the other is visible.
  indicator:
    metadata:
      name: ontology-invocation-latency-indicator
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_invocation_answered_within_250ms_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(foundry_action_invocation_answered_total[5m]))
  objectives:
    - target: 0.99
      displayName: "99% of accepted invocations answered within 250 ms over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
