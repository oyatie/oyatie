# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:sheets:t0-suggest:v1
name: t0-suggest
namespace: sheets
display_name: Sheets T0 — Formula auto-complete + range suggestion + format suggest
description: |
  T0-tier capability: sheets surfaces authoring suggestions to the tenant operator
  (formula auto-complete based on partially-typed prefix, range suggestion based on
  cursor position + neighbouring data, format suggestion based on cell value type,
  data-class warnings on PII / PHI fields, Cedar policy preview, jurisdiction-overlay
  diff summary). No state mutation; pure read + presentation; human always in the loop.

  Examples:
  - User types `=VLO` → suggest `VLOOKUP(`, `VLOOKUP_SIMPLE(`, with one-line docstrings.
  - User selects cell A10 with numeric values in A1:A9 above → suggest `=SUM(A1:A9)`.
  - User enters '2026-05-17' in cell → suggest "format as Date".
  - On PII-class field selection: surface "data_class=PII_IDENTIFYING; this field will
    be masked in non-pack-kr packs per data-residency.md".
  - On production-tier save attempt: surface Cedar policy preview ("this save will trigger
    2-person rule per editor-isolation.md").

owner_team: axis-sheets + council-design-system
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0135, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-SHEETS-0002, ADR-SHEETS-0006]
related_specs: [/specs/app/sheets.json]
related_artifacts:
  - app/sheets/PRD.md FR-17 (data-class markers)
  - app/sheets/policy/tenant-scope.cedar
  - app/sheets/contracts/openapi/sheets.yaml
  - app/sheets/threat-model.md §"T-I-03" formula injection (suggestions never load-bearing)

autonomy_tier: T0
# T0 = pure suggestion; no state read of sensitive data, no state write.
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: workbook_id
    type: string
    required: true
  - name: trigger
    type: enum
    values: [formula_prefix_typed, cell_selected, value_entered, pii_field_selected, production_save_attempted, jurisdiction_switch_attempted, format_apply_attempted, range_drag_started]
    required: true
  - name: context
    type: object
    description: trigger-specific context (prefix, cell_ref, value, etc.)
    required: false

outputs:
  - name: suggestions
    type: array
    item_schema:
      kind: string  # formula_completion / range_hint / format_suggest / data_class_warning / policy_preview / overlay_diff
      severity: string  # info / warn / blocking
      message: string
      action_hint: string  # optional UI action (e.g., "insert =SUM(A1:A9)")
      doc_url: string  # optional link to function-library docs

data_classes_touched:
  - INTERNAL_ONLY
  # Suggestions reference data-class hints but never reveal raw values.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.sheets.suggestions.emitted
# Suggestions are themselves audit-emitted to detect adversarial probing patterns.

cost_profile:
  type: per-suggestion
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - Local function-library prefix-match (sub-millisecond; static dictionary)
    - Range-hint heuristic (sub-millisecond; neighbouring-data scan)
    - Cedar policy preview evaluation (constant-time)

cedar_policy_fragments:
  - app/sheets/policy/tenant-scope.cedar
  - app/sheets/policy/public-read.cedar

eval_set:
  reference_inputs_path: app/sheets/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.95
  eval_metric: suggestion-relevance-and-non-misleadingness-against-curated-test-corpus
  cadence: per-release
  reference: |
    Test corpus covers: formula-prefix completions for top-100 functions, range-hint
    heuristics for top-50 patterns (SUM/AVG/COUNT chain detection), format suggestions
    for number/date/currency/percent, data-class hints, policy previews, overlay diffs,
    anti-patterns (suggestions must NEVER mislead author into XSS-risky field or bypass
    Cedar preview).

sunset:
  status: none
  notes: ""
