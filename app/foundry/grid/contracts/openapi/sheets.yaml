openapi: 3.2.0
info:
  title: sheets
  version: 1.0.0
  summary: REST API for the sheets µservice — workbook session CRUD, cell/range read/write, formula authoring, sharing + per-range ACL, XLSX import/export, AI-formula invocation, connected-sheets queries, version-history, comments, embed-bridge
  description: |
    Tenant-facing and operator-facing REST surface for sheets (spreadsheet + structured-data editor;
    ADR-0135 net-new hero product). All endpoints require OIDC + Cedar policy authorization
    (per app/sheets/policy/*.cedar) and are tenant-scoped via the X-Scope-OrgID header.

    Per-seat licensing enforced at workbook open (license-gate-cedar BC). Per-range ACL
    granularity per ADR-SHEETS-0006 enforced at every cell/range read/write path. Saves submit
    the canonical cell graph to the cell µservice SDK. Sheets never executes; only emits.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
  contact:
    name: axis-sheets + council-design-system
    url: https://oyatie.com/teams/axis-sheets
  license:
    name: Internal
servers:
  - url: https://sheets-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: sheets
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that presubmit is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    WorkbookId:
      in: path
      name: workbook_id
      required: true
      schema:
        type: string
        pattern: '^wb-[0-9A-HJKMNP-TV-Z]{26}$'
    SheetId:
      in: path
      name: sheet_id
      required: true
      schema:
        type: string
        pattern: '^sh-[0-9A-HJKMNP-TV-Z]{26}$'
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        pattern: '^ses-[0-9A-HJKMNP-TV-Z]{26}$'
    Pack:
      in: query
      name: pack
      required: false
      schema:
        type: string
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
    Jurisdiction:
      in: query
      name: jurisdiction
      required: false
      schema:
        type: string
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]
        default: base
  schemas:
    WorkbookSession:
      type: object
      required: [session_id, tenant_id, workbook_id, opened_at, last_active]
      properties:
        session_id: {type: string, pattern: '^ses-[0-9A-HJKMNP-TV-Z]{26}$'}
        tenant_id: {type: string}
        workbook_id: {type: string}
        user_oidc_sub: {type: string}
        opened_at: {type: string, format: date-time}
        last_active: {type: string, format: date-time}
        crdt_state_sha: {type: string, description: BLAKE3 hash of current CRDT state}
        license_decision: {type: string, enum: [allow, deny_no_seat, deny_revoked]}
    Workbook:
      type: object
      required: [workbook_id, version_sha, sheets]
      properties:
        workbook_id: {type: string}
        version_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        parent_version_sha: {type: string, nullable: true, pattern: '^[a-f0-9]{40}$'}
        author_oidc_sub: {type: string}
        title: {type: string, maxLength: 500}
        sheets:
          type: array
          items: {$ref: '#/components/schemas/Sheet'}
        named_ranges:
          type: array
          items: {$ref: '#/components/schemas/NamedRange'}
        signature:
          type: string
          description: Ed25519 signature over canonical-sheet bytes
    Sheet:
      type: object
      required: [sheet_id, name]
      properties:
        sheet_id: {type: string}
        name: {type: string, maxLength: 200}
        position: {type: integer, minimum: 0}
        freeze_rows: {type: integer, default: 0}
        freeze_cols: {type: integer, default: 0}
        protected: {type: boolean, default: false}
    Cell:
      type: object
      required: [cell_ref]
      properties:
        cell_ref: {type: string, pattern: '^[A-Z]+[0-9]+$', description: A1-notation cell reference}
        value:
          oneOf:
            - {type: string}
            - {type: number}
            - {type: boolean}
            - {type: null}
        formula: {type: string, nullable: true, description: starts with '='}
        format: {type: string, nullable: true, description: format-string or named format}
        data_class: {type: string, enum: [INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, PII_QUASI_IDENTIFIER, PII_IDENTIFYING, SECRET, AUDIT, PHI]}
        formula_error:
          type: string
          nullable: true
          enum: [null, '#NULL!', '#DIV/0!', '#VALUE!', '#REF!', '#NAME?', '#NUM!', '#N/A', '#CIRCULAR', '#SLOW!']
    Range:
      type: object
      required: [sheet_id, start, end]
      properties:
        sheet_id: {type: string}
        start: {type: string, pattern: '^[A-Z]+[0-9]+$'}
        end: {type: string, pattern: '^[A-Z]+[0-9]+$'}
        cells:
          type: array
          items: {$ref: '#/components/schemas/Cell'}
        range_id: {type: string, nullable: true, description: named-range id if applicable}
    NamedRange:
      type: object
      required: [name, scope, range_ref]
      properties:
        name: {type: string, maxLength: 200}
        scope: {type: string, enum: [workbook, sheet]}
        range_ref: {type: string, description: 'A1-notation, optionally sheet-qualified (e.g., Sheet1!A1:B10)'}
    Chart:
      type: object
      required: [chart_id, sheet_id, type, source_range]
      properties:
        chart_id: {type: string}
        sheet_id: {type: string}
        type: {type: string, enum: [bar, line, pie, scatter, area, combo, sparkline]}
        source_range: {type: string, description: A1-notation range}
        title: {type: string, nullable: true}
        x_axis: {type: object, nullable: true}
        y_axis: {type: object, nullable: true}
        series: {type: array, items: {type: object}}
    Pivot:
      type: object
      required: [pivot_id, sheet_id, source_range, rows, columns, values]
      properties:
        pivot_id: {type: string}
        sheet_id: {type: string}
        source_range: {type: string}
        rows: {type: array, items: {type: string}}
        columns: {type: array, items: {type: string}}
        values:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              aggregator: {type: string, enum: [sum, count, avg, min, max, stddev, median, distinct_count]}
        filters: {type: array, items: {type: object}}
    ConditionalFormatRule:
      type: object
      required: [range, condition, format]
      properties:
        range: {type: string}
        condition:
          type: object
          properties:
            kind: {type: string, enum: [greater_than, less_than, equal, between, formula, text_contains, top_n, bottom_n]}
            operand: {}
        format:
          type: object
          properties:
            background_color: {type: string, nullable: true}
            text_color: {type: string, nullable: true}
            bold: {type: boolean, nullable: true}
    DataValidationRule:
      type: object
      required: [range, rule]
      properties:
        range: {type: string}
        rule:
          type: object
          properties:
            kind: {type: string, enum: [dropdown, range, custom_formula, number_range, date_range, text_length]}
            params: {type: object}
            on_invalid: {type: string, enum: [reject, warn]}
    Share:
      type: object
      required: [workbook_id, principal, permission]
      properties:
        workbook_id: {type: string}
        principal: {type: string, description: 'oidc_sub or group:id'}
        permission: {type: string, enum: [view, comment, edit]}
        range_acl:
          type: array
          items:
            type: object
            properties:
              range_id: {type: string}
              decision: {type: string, enum: [allow_read, allow_edit, deny]}
    Comment:
      type: object
      required: [comment_id, cell_ref, author_oidc_sub, content]
      properties:
        comment_id: {type: string}
        cell_ref: {type: string}
        author_oidc_sub: {type: string}
        content: {type: string, maxLength: 10000}
        parent_comment_id: {type: string, nullable: true}
        resolved: {type: boolean, default: false}
        created_at: {type: string, format: date-time}
    ImportJob:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [queued, av_scanning, importing_in_sandbox, completed, failed, refused_av_positive]}
        workbook_id: {type: string, nullable: true, description: populated on success}
        error_message: {type: string, nullable: true}
    ExportJob:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [queued, exporting_in_sandbox, completed, failed]}
        download_url: {type: string, nullable: true, description: pre-signed S3 URL; TTL ≤ 1h}
        error_message: {type: string, nullable: true}
    AiFormulaDraftRequest:
      type: object
      required: [workbook_id, sheet_id, cell_ref, prose]
      properties:
        workbook_id: {type: string}
        sheet_id: {type: string}
        cell_ref: {type: string}
        prose: {type: string, maxLength: 10000}
        consent_acknowledged: {type: boolean}
        target_jurisdiction: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]}
    AiFormulaDraftResponse:
      type: object
      required: [draft_id, candidate_formula, grammar_valid, prompt_injection_detected]
      properties:
        draft_id: {type: string}
        candidate_formula: {type: string, description: 'starts with ='}
        grammar_valid: {type: boolean}
        validation_errors:
          type: array
          items:
            type: object
            properties:
              position: {type: integer}
              message: {type: string}
        prompt_injection_detected: {type: boolean}
        pii_redacted_count: {type: integer}
    SmartFillRequest:
      type: object
      required: [workbook_id, sheet_id, range, seed_cells]
      properties:
        workbook_id: {type: string}
        sheet_id: {type: string}
        range: {type: string, description: target range to fill}
        seed_cells:
          type: array
          minItems: 3
          maxItems: 10
          items:
            type: object
            properties:
              cell_ref: {type: string}
              value: {type: string}
    SmartFillResponse:
      type: object
      required: [inference_id, inferred_cells]
      properties:
        inference_id: {type: string}
        inferred_cells:
          type: array
          items: {$ref: '#/components/schemas/Cell'}
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
    ConnectedQuery:
      type: object
      required: [query_id, workbook_id, sheet_id, range, source_descriptor, refresh_policy]
      properties:
        query_id: {type: string}
        workbook_id: {type: string}
        sheet_id: {type: string}
        range: {type: string}
        source_descriptor:
          type: object
          properties:
            kind: {type: string, enum: [postgres, bigquery_equivalent, snowflake_equivalent, custom_via_foundry_runtime]}
            credentials_ref: {type: string, description: 'OpenBao path; never inline credentials'}
            query_sql: {type: string, maxLength: 10000}
        refresh_policy:
          type: object
          properties:
            kind: {type: string, enum: [manual, on_open, scheduled]}
            schedule_cron: {type: string, nullable: true}
        last_refreshed_at: {type: string, format: date-time, nullable: true}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /workbook-sessions:
    post:
      summary: Open a new workbook session (Cedar per-seat license gate enforced)
      operationId: openWorkbookSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workbook_id]
              properties:
                workbook_id: {type: string}
                resume_from_offline_buffer_sha: {type: string, nullable: true}
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbookSession'}
        '402':
          description: License-gate denied
        '401':
          description: OIDC missing or X-Scope-OrgID mismatch
        '403':
          description: Cedar policy denied
        '429':
          description: Per-tenant session cap reached
    get:
      summary: List active workbook sessions
      operationId: listWorkbookSessions
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkbookSession'}

  /workbook-sessions/{session_id}:
    get:
      summary: Read workbook session state
      operationId: getWorkbookSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbookSession'}
    delete:
      summary: Close a workbook session
      operationId: closeWorkbookSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Closed

  /workbooks/{workbook_id}:load:
    get:
      summary: Load workbook for editor render
      operationId: loadWorkbook
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/Jurisdiction'
      responses:
        '200':
          description: Workbook
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workbook'}
        '403':
          description: Cedar policy denied (e.g., per-range ACL)

  /workbooks/{workbook_id}:save:
    post:
      summary: Save workbook (cell ops submit to cell µservice; Ed25519 sealed)
      operationId: saveWorkbook
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cell_ops]
              properties:
                cell_ops:
                  type: array
                  items:
                    type: object
                    properties:
                      sheet_id: {type: string}
                      cell_ref: {type: string}
                      op: {type: string, enum: [set_value, set_formula, set_format, delete]}
                      value: {}
                cedar_preview_acknowledged: {type: boolean}
                commit_message: {type: string, maxLength: 500}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_sha: {type: string}
                  accepted_at: {type: string, format: date-time}
                  audit_chain_seal: {type: string}
        '403':
          description: Cedar policy denied
        '409':
          description: Concurrent save detected; reconcile via CRDT op stream
        '422':
          description: Validation errors

  /workbooks/{workbook_id}/sheets/{sheet_id}/cells/{cell_ref}:
    get:
      summary: Read cell (Cedar per-range ACL evaluated)
      operationId: readCell
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - in: path
          name: cell_ref
          required: true
          schema: {type: string, pattern: '^[A-Z]+[0-9]+$'}
      responses:
        '200':
          description: Cell
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cell'}
        '403':
          description: Per-range ACL denied per ADR-SHEETS-0006
    put:
      summary: Write cell (Cedar per-range ACL evaluated)
      operationId: writeCell
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - in: path
          name: cell_ref
          required: true
          schema: {type: string, pattern: '^[A-Z]+[0-9]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Cell'}
      responses:
        '200':
          description: Written
        '403':
          description: Per-range ACL denied
        '422':
          description: Formula grammar invalid (per formula-engine grammar; ADR-SHEETS-0002)

  /workbooks/{workbook_id}/sheets/{sheet_id}/ranges/read:
    post:
      summary: Read range (Cedar per-range ACL evaluated)
      operationId: readRange
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: {type: string}
                end: {type: string}
      responses:
        '200':
          description: Range
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Range'}

  /workbooks/{workbook_id}/named-ranges:
    post:
      summary: Add named range
      operationId: addNamedRange
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NamedRange'}
      responses:
        '201':
          description: Named range created

  /workbooks/{workbook_id}/charts:
    post:
      summary: Author chart
      operationId: authorChart
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Chart'}
      responses:
        '201':
          description: Chart created

  /workbooks/{workbook_id}/pivots:
    post:
      summary: Author pivot table
      operationId: authorPivot
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pivot'}
      responses:
        '201':
          description: Pivot created

  /workbooks/{workbook_id}/conditional-formats:
    post:
      summary: Apply conditional formatting rule
      operationId: applyConditionalFormat
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConditionalFormatRule'}
      responses:
        '201':
          description: Rule applied

  /workbooks/{workbook_id}/data-validations:
    post:
      summary: Add data-validation rule
      operationId: addDataValidation
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DataValidationRule'}
      responses:
        '201':
          description: Validation rule added

  /workbooks/{workbook_id}:share:
    post:
      summary: Share workbook (with per-range ACL)
      operationId: shareWorkbook
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Share'}
      responses:
        '201':
          description: Shared
        '403':
          description: Share-admin entitlement missing

  /workbooks/{workbook_id}/comments:
    post:
      summary: Add comment
      operationId: addComment
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Comment'}
      responses:
        '201':
          description: Comment created

  /import-jobs:
    post:
      summary: Import XLSX/ODS/CSV/TSV/JSON-Sheet (async; AV-scanned; gVisor sandboxed)
      operationId: importXlsx
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_url, format]
              properties:
                file_url: {type: string, description: 'pre-signed S3 upload URL'}
                format: {type: string, enum: [xlsx, ods, csv, tsv, json_sheet]}
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '413':
          description: File too large (cap 200 MB)
        '415':
          description: Unsupported format

  /import-jobs/{job_id}:
    get:
      summary: Poll import job status
      operationId: getImportJob
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}

  /export-jobs:
    post:
      summary: Export workbook to XLSX/ODS/CSV/TSV/JSON-Sheet (async; ACL-aware masking)
      operationId: exportXlsx
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workbook_id, format]
              properties:
                workbook_id: {type: string}
                format: {type: string, enum: [xlsx, ods, csv, tsv, json_sheet]}
                fidelity_tier:
                  type: string
                  enum: [best_effort]
                  default: best_effort
                  description: 'strict-OOXML round-trip scheduled-for-distinct-tracked-work subsequent-to-M03-completion per ADR-SHEETS-0007'
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJob'}

  /export-jobs/{job_id}:
    get:
      summary: Poll export job status
      operationId: getExportJob
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJob'}

  /ai-formula:draft:
    post:
      summary: Request AI-formula draft from prose; PII-redacted; grammar-validated
      operationId: aiFormulaDraft
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiFormulaDraftRequest'}
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiFormulaDraftResponse'}
        '403':
          description: AI-formula consent missing OR AI Act conformity not attested (per ADR-SHEETS-0005)
        '422':
          description: Prompt injection detected
        '503':
          description: AI-formula circuit breaker open

  /smart-fill:infer:
    post:
      summary: Smart-fill inference from N seed examples
      operationId: smartFillInfer
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmartFillRequest'}
      responses:
        '200':
          description: Inferred
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartFillResponse'}

  /connected-queries:
    post:
      summary: Register connected-sheets external-source query
      operationId: registerConnectedQuery
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectedQuery'}
      responses:
        '201':
          description: Registered

  /connected-queries/{query_id}:refresh:
    post:
      summary: Refresh connected-sheets external-source query
      operationId: refreshConnectedQuery
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: query_id
          required: true
          schema: {type: string}
      responses:
        '202':
          description: Refresh initiated

  /workbooks/{workbook_id}/version-history:
    get:
      summary: List version history
      operationId: listVersionHistory
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    version_sha: {type: string}
                    created_at: {type: string, format: date-time}
                    author_oidc_sub: {type: string}
                    label: {type: string, nullable: true}

  /workbooks/{workbook_id}/version-history/{version_sha}:restore:
    post:
      summary: Restore workbook from version-history
      operationId: restoreVersion
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WorkbookId'
        - in: path
          name: version_sha
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{40}$'}
      responses:
        '200':
          description: Restored

  /embed-bridges:
    post:
      summary: Open embed-bridge into docs / slides
      operationId: openEmbedBridge
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workbook_id, target_microservice]
              properties:
                workbook_id: {type: string}
                target_microservice: {type: string, enum: [docs, slides]}
                target_id: {type: string, description: docs document_id or slides deck_id}
                range: {type: string, nullable: true, description: A1-notation cell range (for docs embed)}
                chart_id: {type: string, nullable: true, description: chart_id (for slides embed)}
                refresh_policy: {type: string, enum: [live, snapshot]}
      responses:
        '201':
          description: Embed created

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres + Valkey + cell SDK + foundry-runtime SDK reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
