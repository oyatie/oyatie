# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sheets-recalc-1m-cells-latency
  displayName: Sheets — Recalc 1M-cell workbook latency
  labels:
    microservice: sheets
    bounded_context: recalc-engine
    tier: external-facing
    plane: data
spec:
  service: sheets-recalc-engine-worker
  description: |
    Recalc-engine latency SLI for 1M-cell workbooks (hybrid postgres + Arrow/Parquet path per
    ADR-SHEETS-0003). GA target: 95% under 10s (per PRD AC-08).
  indicator:
    metadata:
      name: recalc-1m-cells-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_recalc_1m_seconds_bucket{le="10.0"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_recalc_1m_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of 1M-cell recalcs under 10s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
