# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sheets-export-xlsx-latency
  displayName: Sheets — XLSX export latency (100k-cell workbook)
  labels:
    microservice: sheets
    bounded_context: import-export
    tier: external-facing
    plane: data
spec:
  service: sheets-import-export-worker
  description: |
    XLSX export latency SLI for 100k-cell workbooks (best-effort fidelity tier per
    ADR-SHEETS-0007; gVisor sandboxed). GA target: 95% under 5s (per PRD AC-12).
  indicator:
    metadata:
      name: export-xlsx-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_xlsx_export_seconds_bucket{le="5.0"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_xlsx_export_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of XLSX exports (100k-cell) under 5s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
