# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sheets-collab-cursor-sync-latency
  displayName: Sheets Collab — Cursor sync latency (aligned with workflow-studio collab)
  labels:
    microservice: sheets
    bounded_context: collab-crdt
    tier: external-facing
    plane: data
spec:
  service: sheets-collab-crdt-worker
  description: |
    Collab cursor sync latency SLI. Aligned with workflow-studio collab budget per
    ADR-SHEETS-0001 (Loro 1.x). GA target: 99% under 150ms.
  indicator:
    metadata:
      name: collab-cursor-sync-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_collab_cursor_sync_seconds_bucket{le="0.15"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(sheets_collab_cursor_sync_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% of cursor syncs under 150ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
