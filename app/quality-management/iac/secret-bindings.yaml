apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: oya-quality-management
spec:
  openbaoPaths:
    - secret/{{ tenant_id }}/quality-management/database
    - secret/{{ tenant_id }}/quality-management/signing
  maxTtlSeconds: 60
  auditEventClass: EVT-QUALITY_MANAGEMENT-INSPECTION_PLAN-SECRET_LEASE
