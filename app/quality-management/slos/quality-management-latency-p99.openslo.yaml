apiVersion: openslo/v1
kind: SLO
metadata:
  name: quality-management-latency-p99
  labels:
    service: quality-management
    sap_code: "QM"
spec:
  description: "Quality Management quality-management-latency-p99 objective; benchmarks SAP QM Quality Management | Oracle Fusion Quality Management | Workday Extend quality-workflow counterpart | NetSuite Quality Management | Microsoft Dynamics 365 Supply Chain Quality Management"
  service: quality-management
  indicator:
    metadata:
      name: quality-management-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"quality-management\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"quality-management\"}[5m]))"
  objectives:
    - displayName: quality-management-latency-p99
      target: 0.99
