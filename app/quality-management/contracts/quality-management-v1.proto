// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.quality_management.v1;

option java_package = "dev.oyatie.quality_management.v1";

// SAP QM; benchmarks: SAP QM Quality Management | Oracle Fusion Quality Management | Workday Extend quality-workflow counterpart | NetSuite Quality Management | Microsoft Dynamics 365 Supply Chain Quality Management
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.

message InspectionPlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message InspectionPlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message InspectionLotCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message InspectionLotResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message CertificateOfAnalysisCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message CertificateOfAnalysisResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message QualityNotificationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message QualityNotificationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message QualityHoldCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message QualityHoldResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message AuditEvidenceCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message AuditEvidenceResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service QualityManagementService {
  rpc MutateInspectionPlan (InspectionPlanCommand) returns (InspectionPlanResult);
  rpc MutateInspectionLot (InspectionLotCommand) returns (InspectionLotResult);
  rpc MutateCertificateOfAnalysis (CertificateOfAnalysisCommand) returns (CertificateOfAnalysisResult);
  rpc MutateQualityNotification (QualityNotificationCommand) returns (QualityNotificationResult);
  rpc MutateQualityHold (QualityHoldCommand) returns (QualityHoldResult);
  rpc MutateAuditEvidence (AuditEvidenceCommand) returns (AuditEvidenceResult);
}
