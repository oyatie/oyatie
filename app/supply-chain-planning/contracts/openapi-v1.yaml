openapi: 3.2.0
info:
  title: Supply Chain Planning API
  version: 1.0.0
  summary: SAP SCM/APO parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/supply-chain-planning
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP SCM/APO and SAP IBP"
  - "Oracle Supply Chain Planning"
  - "Workday Adaptive Planning supply-chain scenario counterpart"
  - "NetSuite Demand Planning"
  - "Microsoft Dynamics 365 Master Planning"
paths:
  /v1/supply-chain-planning/demand-plan:
    post:
      summary: Create or amend Supply Chain Planning demand-plan
      operationId: supply_chain_planning_demand_plan_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandPlanCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/supply-chain-planning/supply-network-plan:
