apiVersion: openslo/v1
kind: SLO
metadata:
  name: demand-plan-success-rate
  labels:
    service: supply-chain-planning
    sap_code: "SCM/APO"
spec:
  description: "Supply Chain Planning demand-plan-success-rate objective; benchmarks SAP SCM/APO and SAP IBP | Oracle Supply Chain Planning | Workday Adaptive Planning supply-chain scenario counterpart | NetSuite Demand Planning | Microsoft Dynamics 365 Master Planning"
  service: supply-chain-planning
  indicator:
    metadata:
      name: demand-plan-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_supply_chain_planning_demand_plan_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_supply_chain_planning_demand_plan_attempt_total[5m]))"
  objectives:
    - displayName: demand-plan-success-rate
      target: 0.999
