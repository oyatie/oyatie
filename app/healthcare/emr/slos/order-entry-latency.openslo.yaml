apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-order-entry-latency
  displayName: EMR CPOE order entry latency
  microservice: emr
  bc: order
spec:
  description: |
    CPOE order persistence latency from validated input to durable commit. Critical for
    sepsis-bundle compliance (CMS SEP-1) and ED throughput (US-INP-002, US-ED-010).
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell, order_type) (rate(emr_order_entry_duration_seconds_bucket[1m]))) <= 0.2
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell, order_type) (rate(emr_order_entry_duration_seconds_count[1m]))
  objectives:
    - displayName: 99.9% of orders within 200ms p99
      target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
