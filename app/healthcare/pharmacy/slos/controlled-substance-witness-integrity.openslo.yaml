apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-controlled-substance-witness-integrity
  displayName: Pharmacy controlled-substance witness integrity
  labels:
    microservice: pharmacy
    bounded_context: controlled-substance
spec:
  service: pharmacy
  description: 100% of CII–CV transactions MUST carry a witness signature.
  indicator:
    metadata:
      name: oya-pharmacy-controlled-substance-witness-integrity
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_controlled_witness_total{outcome="signed"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_controlled_witness_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% witness-signed
      target: 1.0
