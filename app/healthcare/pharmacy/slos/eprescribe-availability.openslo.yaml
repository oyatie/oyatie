apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-eprescribe-availability
  displayName: Pharmacy ePrescribe transmission availability
  labels:
    microservice: pharmacy
    bounded_context: eprescribe
spec:
  service: pharmacy
  description: ePrescribe transmission availability ≥ 99.9%.
  indicator:
    metadata:
      name: oya-pharmacy-eprescribe-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_eprescribe_total{outcome="ok"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_eprescribe_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.9% success
      target: 0.999
