apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-bcma-scan-latency
  displayName: Pharmacy BCMA scan latency
  labels:
    microservice: pharmacy
    bounded_context: bcma
spec:
  service: pharmacy
  description: BCMA five-rights scan p99 ≤ 100 ms.
  indicator:
    metadata:
      name: oya-pharmacy-bcma-scan-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_bcma_duration_seconds_bucket{le="0.1"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_bcma_duration_seconds_count[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% under 100 ms
      target: 0.99
