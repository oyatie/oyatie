apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-dscsa-saleable-return-verification-rate
  displayName: Pharmacy DSCSA saleable return verification rate
  labels:
    microservice: pharmacy
    bounded_context: dscsa
spec:
  service: pharmacy
  description: ≥ 99.9% of saleable returns are verified before re-stock.
  indicator:
    metadata:
      name: oya-pharmacy-dscsa-saleable-return-verification-rate
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dscsa_saleable_return_total{outcome="verified"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dscsa_saleable_return_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.9% verified
      target: 0.999
