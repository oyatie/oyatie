apiVersion: openslo/v1
kind: SLO
metadata:
  name: healthcare-integration-fhir-bundle-success
  labels:
    service: healthcare-integration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: healthcare-integration
  description: FHIR bundle exchange success for HL7 ingestion, FHIR exchange, HIPAA access controls, PHI delivery, consent synchronization, and audit completeness operations.
  indicator:
    metadata:
      name: fhir-bundle-success
      labels:
        domain_object: ClinicalExchange
        operator_audience: HEALTHCARE_INTEGRATION_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_fhir_bundle_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_fhir_bundle_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: FHIR bundle exchange success
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
