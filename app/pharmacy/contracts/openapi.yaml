openapi: 3.1.0
info:
  title: Oyatie Pharmacy API
  version: 1.0.0
  description: |
    Pharmacy microservice REST surface. FHIR R5-aligned Medication / MedicationRequest / MedicationDispense /
    MedicationAdministration / MedicationStatement plus pharmacy-specific extensions for ePrescribe (Surescripts/NCPDP),
    drug-interaction CDS, allergy check, dose checking, pharmacist verification, compounding, inventory, auto-dispensing
    cabinets, BCMA, IV admixture + smart pumps, controlled substances, reimbursement (340B + PBM NCPDP D.0), operations,
    interventions, medication reconciliation, outpatient retail, MTM, and DSCSA serialization.
  contact:
    name: axis-pharmacy
    email: axis-pharmacy@oyatie.com
  license:
    name: Proprietary
servers:
  - url: https://api.oyatie.com/pharmacy/v1
    description: Production
  - url: https://api.dev.oyatie.com/pharmacy/v1
    description: Development
tags:
  - name: catalog
  - name: formulary
  - name: eprescribe
  - name: interaction
  - name: allergy
  - name: dose
  - name: verification
  - name: compounding
  - name: inventory
  - name: cabinet
  - name: bcma
  - name: iv-admixture
  - name: controlled-substance
  - name: reimbursement
  - name: operations
  - name: interventions
  - name: med-rec
  - name: outpatient-rx
  - name: mtm
  - name: dscsa
security:
  - oyatie-oidc:
      - pharmacy.read
      - pharmacy.write
paths:
  /Medication:
    get:
      tags: [catalog]
      summary: Search medications (FHIR R5 Medication)
      parameters:
        - name: rxcui
          in: query
          schema: { type: string }
        - name: ndc
          in: query
          schema: { type: string }
        - name: gpi
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: _count
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: Bundle of FHIR Medications
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/Bundle" }
  /Medication/{id}:
    get:
      tags: [catalog]
      summary: Get medication by id (RxCUI)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A FHIR Medication
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/Medication" }
  /Formulary:
    get:
      tags: [formulary]
      summary: Lookup formulary status for a medication in a tenant
      parameters:
        - name: rxcui
          in: query
          required: true
          schema: { type: string }
        - name: tenant
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Formulary status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormularyStatus" }
  /MedicationRequest:
    post:
      tags: [eprescribe]
      summary: Submit a new prescription (NewRx via Surescripts when remote)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema: { $ref: "#/components/schemas/MedicationRequest" }
      responses:
        "201":
          description: MedicationRequest created
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/MedicationRequest" }
  /MedicationRequest/{id}/epcs-sign:
    post:
      tags: [eprescribe]
      summary: Sign an EPCS-required controlled-substance prescription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EPCSSignRequest" }
      responses:
        "200":
          description: EPCS signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EPCSSignResponse" }
  /Interaction/evaluate:
    post:
      tags: [interaction]
      summary: Evaluate DDI/DAI/DCI/DPI/DDxI/DLI/DFI/DDoseI for an order set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionRequest" }
      responses:
        "200":
          description: Interaction findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionResponse" }
  /Allergy/check:
    post:
      tags: [allergy]
      summary: Cross-check medication against patient allergy list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllergyCheckRequest" }
      responses:
        "200":
          description: Allergy check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllergyCheckResponse" }
  /Dose/check:
    post:
      tags: [dose]
      summary: Dose range check (weight / BSA / renal / hepatic / age-band / cumulative)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoseCheckRequest" }
      responses:
        "200":
          description: Dose check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoseCheckResponse" }
  /Verification:
    post:
      tags: [verification]
      summary: Pharmacist verification of an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationRequest" }
      responses:
        "201":
          description: Verification ticket created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationTicket" }
  /MedicationDispense:
    post:
      tags: [eprescribe, controlled-substance]
      summary: Record a medication dispense (FHIR R5 MedicationDispense)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema: { $ref: "#/components/schemas/MedicationDispense" }
      responses:
        "201":
          description: MedicationDispense created
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/MedicationDispense" }
  /MedicationAdministration:
    post:
      tags: [bcma]
      summary: Record a medication administration (BCMA scan submit)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema: { $ref: "#/components/schemas/MedicationAdministration" }
      responses:
        "201":
          description: MedicationAdministration created
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/MedicationAdministration" }
  /MedicationStatement:
    get:
      tags: [med-rec]
      summary: Patient medication statement (current med list)
      parameters:
        - name: patient
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bundle of MedicationStatements
          content:
            application/fhir+json:
              schema: { $ref: "#/components/schemas/Bundle" }
  /Compounding:
    post:
      tags: [compounding]
      summary: Open a compounding record (USP 795/797/800)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompoundingRecord" }
      responses:
        "201":
          description: Compounding record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompoundingRecord" }
  /Inventory/lot:
    get:
      tags: [inventory]
      summary: Get inventory lot by SGTIN-198 or by NDC + lot
      parameters:
        - name: sgtin
          in: query
          schema: { type: string }
        - name: ndc
          in: query
          schema: { type: string }
        - name: lot
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Inventory lot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryLot" }
  /Cabinet/transaction:
    post:
      tags: [cabinet]
      summary: Ingest a cabinet transaction (Pyxis/Omnicell/Carousel)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CabinetTransaction" }
      responses:
        "201":
          description: Cabinet transaction ingested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CabinetTransaction" }
  /BCMA/scan:
    post:
      tags: [bcma]
      summary: Submit BCMA scan for five-rights verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BCMAScan" }
      responses:
        "200":
          description: Five-rights result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiveRightsResult" }
  /IV/admixture:
    post:
      tags: [iv-admixture]
      summary: Open an IV admixture preparation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IVAdmixtureOrder" }
      responses:
        "201":
          description: IV admixture order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IVAdmixtureOrder" }
  /Pump/program:
    post:
      tags: [iv-admixture]
      summary: Push pump auto-program to smart pump (Alaris/Plum 360/Hospira)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PumpAutoProgram" }
      responses:
        "200":
          description: Pump programmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PumpAutoProgram" }
  /Controlled/form-222:
    post:
      tags: [controlled-substance]
      summary: Submit a DEA Form 222 order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Form222Order" }
      responses:
        "201":
          description: Form 222 order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Form222Order" }
  /Controlled/witnessed-waste:
    post:
      tags: [controlled-substance]
      summary: Record a witnessed waste event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WitnessedWaste" }
      responses:
        "201":
          description: Witnessed waste recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WitnessedWaste" }
  /Reimbursement/claim:
    post:
      tags: [reimbursement]
      summary: Submit an NCPDP D.0 PBM claim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PBMClaim" }
      responses:
        "201":
          description: PBM claim submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PBMClaimResponse" }
  /Reimbursement/340b/eligibility:
    post:
      tags: [reimbursement]
      summary: Evaluate 340B eligibility for a dispense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/B340EligibilityRequest" }
      responses:
        "200":
          description: 340B determination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/B340Determination" }
  /Operations/queue:
    get:
      tags: [operations]
      summary: Read the operations queue
      parameters:
        - name: lane
          in: query
          schema: { type: string, enum: [order, prep, verify, deliver] }
      responses:
        "200":
          description: Queue items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueItems" }
  /Interventions:
    post:
      tags: [interventions]
      summary: Capture a clinical intervention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalIntervention" }
      responses:
        "201":
          description: Intervention captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalIntervention" }
  /MedRec/session:
    post:
      tags: [med-rec]
      summary: Open a medication reconciliation session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationSession" }
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationSession" }
  /Outpatient/refill:
    post:
      tags: [outpatient-rx]
      summary: Submit a refill request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefillRequest" }
      responses:
        "201":
          description: Refill request queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefillRequest" }
  /MTM/session:
    post:
      tags: [mtm]
      summary: Open an MTM session (CMR or TMR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MTMSession" }
      responses:
        "201":
          description: MTM session opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MTMSession" }
  /DSCSA/transaction:
    post:
      tags: [dscsa]
      summary: Ingest a DSCSA T3 transaction (TI + TH + TS)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/T3Transaction" }
      responses:
        "201":
          description: T3 transaction ingested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/T3Transaction" }
  /DSCSA/saleable-return/verify:
    post:
      tags: [dscsa]
      summary: Verify a saleable return
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleableReturnVerify" }
      responses:
        "200":
          description: Saleable return verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleableReturnVerifyResult" }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: pharmacy
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oyatie-oidc:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.oyatie.com/authorize
          tokenUrl: https://identity.oyatie.com/token
          scopes:
            pharmacy.read: read pharmacy data
            pharmacy.write: write pharmacy data
  schemas:
    Bundle:
      type: object
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string }
        entry:
          type: array
          items: { type: object }
    Medication:
      type: object
      properties:
        resourceType: { type: string, const: Medication }
        id: { type: string, description: RxCUI as canonical id }
        code: { $ref: "#/components/schemas/CodeableConcept" }
        status: { type: string, enum: [active, inactive, entered-in-error] }
        ingredient:
          type: array
          items: { type: object }
        identifier:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              value: { type: string }
              type:
                type: object
                properties:
                  text: { type: string, examples: [NDC11, GPI, ATC, GTIN-14, UNII] }
        extension:
          type: array
          items: { type: object }
    MedicationRequest:
      type: object
      properties:
        resourceType: { type: string, const: MedicationRequest }
        id: { type: string }
        status: { type: string, enum: [active, on-hold, ended, stopped, completed, cancelled, entered-in-error, draft, unknown] }
        intent: { type: string, enum: [proposal, plan, order, original-order, reflex-order, filler-order, instance-order, option] }
        subject: { type: object }
        requester: { type: object }
        medicationCodeableConcept: { $ref: "#/components/schemas/CodeableConcept" }
        dosageInstruction:
          type: array
          items: { type: object }
        dispenseRequest:
          type: object
          properties:
            quantity: { type: object }
            numberOfRepeatsAllowed: { type: integer }
            expectedSupplyDuration: { type: object }
        substitution:
          type: object
          properties:
            allowedBoolean: { type: boolean }
        priorPrescription: { type: object }
        controlledSubstance:
          type: object
          properties:
            schedule: { type: string, enum: [CII, CIII, CIV, CV] }
            epcsRequired: { type: boolean }
            deaPrescriberId: { type: string }
        extension:
          type: array
          items: { type: object }
    MedicationDispense:
      type: object
      properties:
        resourceType: { type: string, const: MedicationDispense }
        id: { type: string }
        status: { type: string }
        medicationCodeableConcept: { $ref: "#/components/schemas/CodeableConcept" }
        subject: { type: object }
        performer: { type: array, items: { type: object } }
        quantity: { type: object }
        daysSupply: { type: object }
        whenPrepared: { type: string, format: date-time }
        whenHandedOver: { type: string, format: date-time }
        dosageInstruction: { type: array, items: { type: object } }
        substitution: { type: object }
        sgtin: { type: string, description: GS1 SGTIN-198 of dispensed unit (DSCSA) }
        lot: { type: string }
        expiry: { type: string, format: date }
    MedicationAdministration:
      type: object
      properties:
        resourceType: { type: string, const: MedicationAdministration }
        id: { type: string }
        status: { type: string }
        medicationCodeableConcept: { $ref: "#/components/schemas/CodeableConcept" }
        subject: { type: object }
        performer: { type: array, items: { type: object } }
        occurrenceDateTime: { type: string, format: date-time }
        dosage: { type: object }
        bcmaScanId: { type: string }
        fiveRights:
          type: object
          properties:
            rightPatient: { type: boolean }
            rightDrug: { type: boolean }
            rightDose: { type: boolean }
            rightRoute: { type: boolean }
            rightTime: { type: boolean }
        overrideReason: { type: string }
    CodeableConcept:
      type: object
      properties:
        coding:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              code: { type: string }
              display: { type: string }
        text: { type: string }
    FormularyStatus:
      type: object
      properties:
        tenant: { type: string }
        rxcui: { type: string }
        status: { type: string, enum: [preferred, non-preferred, restricted, non-formulary] }
        tier: { type: integer }
        criteria:
          type: array
          items: { type: string }
        priorAuthRequired: { type: boolean }
        therapeuticInterchangeAvailable: { type: boolean }
    EPCSSignRequest:
      type: object
      properties:
        prescriberId: { type: string }
        deaNumber: { type: string }
        twoFactorEvidence: { type: string, description: opaque token from identity step-up }
        envelopeHash: { type: string }
    EPCSSignResponse:
      type: object
      properties:
        signature: { type: string }
        kmsKeyId: { type: string }
        signedAt: { type: string, format: date-time }
    InteractionRequest:
      type: object
      properties:
        patient: { type: string }
        medications:
          type: array
          items: { type: string, description: RxCUI }
        engines:
          type: array
          items: { type: string, enum: [DDI, DAI, DCI, DPI, DDxI, DLI, DFI, DDoseI] }
    InteractionResponse:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              engine: { type: string }
              severity: { type: string, enum: [contraindicated, severe, major, moderate, minor, informational] }
              source: { type: string }
              monographRef: { type: string }
              actors:
                type: array
                items: { type: string }
              detail: { type: string }
    AllergyCheckRequest:
      type: object
      properties:
        patient: { type: string }
        rxcui: { type: string }
    AllergyCheckResponse:
      type: object
      properties:
        match: { type: boolean }
        matchKind: { type: string, enum: [exact-ingredient, class-match, no-match] }
        severity: { type: string }
        allergen: { type: string }
        crossClass: { type: string }
        overrideEligible: { type: boolean }
    DoseCheckRequest:
      type: object
      properties:
        patient: { type: string }
        rxcui: { type: string }
        dose:
          type: object
          properties:
            value: { type: number }
            unit: { type: string }
        frequency: { type: string }
        indication: { type: string }
    DoseCheckResponse:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              band: { type: string }
              exceeds: { type: boolean }
              exceedsBy: { type: number }
              recommendation: { type: string }
    VerificationRequest:
      type: object
      properties:
        orderId: { type: string }
        pharmacistId: { type: string }
        alertsDismissed:
          type: array
          items: { type: string }
        witnessPharmacistId:
          type: string
          description: required for CII
    VerificationTicket:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        pharmacistId: { type: string }
        witnessPharmacistId: { type: string }
        decision: { type: string, enum: [verified, rejected, deferred] }
        timestamp: { type: string, format: date-time }
    CompoundingRecord:
      type: object
      properties:
        id: { type: string }
        masterFormulationRecordRef: { type: string }
        uspClass: { type: string, enum: [USP-795, USP-797, USP-800] }
        bud: { type: string, format: date-time }
        ingredientsUsed:
          type: array
          items: { type: object }
        environmentalLog:
          type: object
    InventoryLot:
