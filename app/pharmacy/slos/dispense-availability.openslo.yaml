apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-dispense-availability
  displayName: Pharmacy dispense path availability
  labels:
    microservice: pharmacy
    bounded_context: eprescribe
spec:
  service: pharmacy
  description: Dispense path availability ≥ 99.99%.
  indicator:
    metadata:
      name: oya-pharmacy-dispense-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dispense_total{outcome="ok"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dispense_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.99% success
      target: 0.9999
