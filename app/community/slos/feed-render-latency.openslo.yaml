# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: community-feed-render-latency
  displayName: "community: per-space feed render p99 ≤ 300 ms"
  labels:
    microservice: community
    bc: post-store
    sli_class: latency
    owner_team: axis-community
spec:
  description: |
    Latency SLO for per-space feed render (cold + warm). A request is "good"
    when its end-to-end latency (REST request received → fully serialised feed
    response) is ≤ 300 ms. Warm hits via Valkey hot-feed cache; cold hits via
    Postgres + ADR-COMM-0002 rank materialised view. Aligns to PRD-community
    §"Performance" feed-render row.
  service: community
  indicator:
    metadata:
      name: community-feed-render-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_feed_render_duration_seconds_bucket{le="0.3"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_feed_render_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 300 ms for 99 % of 5min windows over 30d"
