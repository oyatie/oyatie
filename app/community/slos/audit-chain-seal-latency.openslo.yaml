# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: community-audit-chain-seal-latency
  displayName: "community: audit-chain seal latency p99 ≤ 1 s"
  labels:
    microservice: community
    bc: post-store
    sli_class: latency
    owner_team: axis-community + axis-audit-chain
spec:
  description: |
    Latency SLO for sealing community events (PostCreated, PostEdited,
    PostDeleted, VoteCast, ModerationActioned, KBArticlePublished) into
    the audit-chain. A request is "good" when the seal record is
    confirmed within 1 s of the originating event being persisted to
    Postgres. Aligns to PRD-community §"Audit + Compliance" 1 s seal SLO
    and ADR-COMM-0001 per-hop seal invariant.
  service: community
  indicator:
    metadata:
      name: community-audit-chain-seal-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_community_audit_seal_duration_seconds_bucket{le="1.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_community_audit_seal_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.999  # tight: missed seals are P0
      displayName: "p99 ≤ 1 s for 99.9 % of 5min windows over 30d"
