# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: community-moderation-action-latency
  displayName: "community: moderation-action latency p99 ≤ 200 ms"
  labels:
    microservice: community
    bc: moderation-queue
    sli_class: latency
    owner_team: axis-community
spec:
  description: |
    Latency SLO for a moderator-issued moderation action (hide / lock / pin /
    unpin / merge / move). A request is "good" when end-to-end latency
    (REST request received → Postgres update + audit-chain seal queued +
    Cedar evaluation green) is ≤ 200 ms. Aligns to PRD-community
    §"Performance" moderation-action row + ADR-COMM-0001 chain-of-handlers
    pipeline.
  service: community
  indicator:
    metadata:
      name: community-moderation-action-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_moderation_action_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_moderation_action_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 200 ms for 99 % of 5min windows over 30d"
