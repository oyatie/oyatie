# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: community-search-query-latency
  displayName: "community: search query p99 ≤ 500 ms"
  labels:
    microservice: community
    bc: search-index
    sli_class: latency
    owner_team: axis-community
spec:
  description: |
    Latency SLO for cross-BC search query. A request is "good" when its
    end-to-end latency (REST request received → Meilisearch multi-search
    response merged + Cedar post-filtered + serialised) is ≤ 500 ms.
    Aligns to PRD-community FR-07 + ADR-COMM-0004 search backend selection.
  service: community
  indicator:
    metadata:
      name: community-search-query-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_community_search_query_duration_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_community_search_query_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 500 ms for 99 % of 5min windows over 30d"
