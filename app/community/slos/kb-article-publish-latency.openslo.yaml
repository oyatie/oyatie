# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: community-kb-article-publish-latency
  displayName: "community: KB article publish p99 ≤ 500 ms"
  labels:
    microservice: community
    bc: kb-article-store
    sli_class: latency
    owner_team: axis-community
spec:
  description: |
    Latency SLO for the KB article publish path (state transition
    PendingReview → Published per ADR-COMM-0003). A request is "good"
    when end-to-end latency (REST request → Postgres revision append +
    head-pointer advance + S3 attachment commit + audit-chain seal) is
    ≤ 500 ms. Excludes resumable multipart upload of the attachment body
    itself (measured separately as upload throughput). Aligns to PRD-
    community §"Performance" kb-article-publish row.
  service: community
  indicator:
    metadata:
      name: community-kb-article-publish-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_kb_article_publish_duration_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(community_kb_article_publish_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 500 ms for 99 % of 5min windows over 30d"
