{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" .Values.microservice.id .Values.gateway.routeNameSuffix | trunc 63 | trimSuffix "-" | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-backbone-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/gateway-api: httproute-v1
    oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
  annotations:
    oyatie.com/audit-chain-event: "EVT-BACKBONE-GATEWAY-ROUTE-DECLARED"
    oyatie.com/non-claim: {{ .Values.gateway.nonClaim | quote }}
    oyatie.com/openapi-contract: {{ .Values.gateway.openapiContract | quote }}
    oyatie.com/tls-termination: {{ .Values.gateway.tlsTermination | quote }}
    oyatie.com/ech-config-ref: {{ .Values.gateway.echConfigRef | quote }}
    oyatie.com/pqc-certificate-ref: {{ .Values.gateway.pqcCertificateRef | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.parentRef.name | quote }}
      namespace: {{ .Values.gateway.parentRef.namespace | quote }}
      sectionName: {{ .Values.gateway.parentRef.sectionName | quote }}
  hostnames:
{{ range .Values.gateway.hostnames }}
    - {{ . | quote }}
{{ end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Oyatie-Microservice
                value: {{ .Values.microservice.id | quote }}
              - name: X-Oyatie-OpenAPI-Contract
                value: {{ .Values.gateway.openapiContract | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.microservice.id | quote }}
          port: {{ .Values.service.port }}
{{- end }}
