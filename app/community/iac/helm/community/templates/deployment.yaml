# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-J Slice 2 per ADR-0064)
{{- range tuple "postStoreRest" "postStoreWorker" "threadTree" "votingEngine" "votingEngineWorker" "moderationQueue" "moderationQueueWorker" "kbArticleStore" "searchIndexRest" "searchIndexWorker" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-{{ . | kebabcase }}
  namespace: community
  labels:
    app.kubernetes.io/name: community
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: community
    oyatie/microservice: community
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: community
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: community
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: community-{{ . | kebabcase }}
      securityContext:
        {{- include "oya.securityContext.podStandard65534" $ | nindent 8 }}
      containers:
        - name: community-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--component={{ . | kebabcase }}", "--pack={{ $.Values.global.pack }}"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          resources:
            requests: {{- toYaml $c.resources.requests | nindent 14 }}
            limits: {{- toYaml $c.resources.limits | nindent 14 }}
          livenessProbe:
            {{- include "oya.probes.httpHealthLiveness8080" $ | nindent 12 }}
          readinessProbe:
            {{- include "oya.probes.httpHealthReadiness8080" $ | nindent 12 }}
          envFrom:
            - secretRef:
                name: community-openbao-injected
          securityContext:
            {{- include "oya.securityContext.restrictedContainerInline" $ | nindent 12 }}
{{- end }}
