# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — bug-bounty-submission capability record
# Posting mode: fully-anonymous (initial submission); identity-optional (after triage)
# ADR-0300 binding: §B-* invariants
# §3.2.5 critical-path matrix reference: row 27
# Owner: axis-community + ops-security + council-privacy
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — §B-* sub-invariants)
#   - community/policy/anonymity-mode-fully-anonymous.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product
#   - §3.2.5 critical-path matrix row 27

capability_id: community-bug-bounty-submission
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, ops-security, council-privacy, council-architecture

purpose: |
  The bug-bounty-submission capability enables security researchers to submit
  vulnerability reports anonymously. Per ADR-0300 §B-1 (researcher pseudonym
  protection), the initial submission is fully anonymous: an encrypted report
  routed to the bug-bounty triage team. After triage, the researcher may
  optionally disclose identity to claim a reward — but this is researcher-
  initiated and never platform-initiated.

  Per §3.2.5 critical-path matrix row 27, this capability is a required
  component of the community µservice's trust-and-safety surface.

  This capability was previously scaffolded under microservices/anonymous/.
  Per user clarification 2026-05-21, it is a fully-anonymous posting-mode
  capability within community/.

posting_mode: fully-anonymous (initial); identity-optional (post-triage)
adr_0300_surface: bug_bounty
critical_path_row: 27

scope:
  authorised:
    - encrypted vulnerability report submission (no identity required)
    - bug-bounty triage read (triage team only; after triage keypair decryption)
    - severity classification (triage team assigns CVSS score)
    - reward eligibility determination (triage team; researcher identity optional)
    - researcher identity disclosure (researcher-initiated ONLY; never platform-initiated)
    - CVE coordination (triage team coordinates with MITRE after fix lands)
    - public disclosure (coordinated; 90-day default; researcher consent)
    - transparency-report count (aggregate; per quarter)
  forbidden:
    - platform linking researcher to user_id without researcher consent (ADR-0300 §B-2)
    - identity demand from triage team before reward (ADR-0300 §B-3)
    - retaliatory action against researcher for valid report
    - third-party tracker egress
    - public disclosure before fix lands (or before coordinated deadline)

encryption_model:
  scheme: hybrid (X25519 + AES-256-GCM; same scheme as whistleblower-submission)
  triage_key_custody: bug-bounty triage principal (single-party for triage; dual-
                      control NOT required for bug-bounty unlike whistleblower)
  exception: if report involves platform-employee wrongdoing (conflicts of interest),
             escalate to dual-control whistleblower channel instead
  platform_stores:
    - encrypted_report_blob
    - content_hash
    - triage_encryption_key_id (reference; not the key itself)
    - submission_timestamp
    - severity_placeholder (null until triage)
  platform_does_not_store:
    - plaintext_report
    - researcher_identity (unless researcher discloses post-triage)
    - researcher_ip
    - researcher_device_fingerprint

severity_taxonomy:
  - critical (CVSS ≥ 9.0): remote code execution, authentication bypass, mass data leak
  - high (CVSS 7.0-8.9): privilege escalation, SSRF, significant data exposure
  - medium (CVSS 4.0-6.9): CSRF, stored XSS, information disclosure
  - low (CVSS 0.1-3.9): UI redress, open redirect, minor info disclosure
  - informational (CVSS 0.0): no direct security impact; acknowledged

reward_model:
  critical: bounty_tier_critical (amount per internal reward table)
  high: bounty_tier_high
  medium: bounty_tier_medium
  low: bounty_tier_low (acknowledgement only)
  informational: acknowledgement only
  identity_required_for_reward: false (anonymous reward via crypto payout supported)
  identity_optional_for_reward: true (researcher may disclose for bank transfer)

coordinated_disclosure:
  default_window_days: 90
  extension_policy: negotiable; researcher must agree; max extension 180 days
  early_disclosure: permitted if public exploit observed in the wild
  cve_filing: triage team files CVE after fix lands + disclosure window closes

safe_harbor:
  scope: |
    Researchers acting in good faith under this program WILL NOT face legal action
    under CFAA (US), Computer Misuse Act (UK), or equivalent national laws for:
    - accessing systems to find vulnerabilities (within scoped systems only)
    - reporting vulnerabilities through this channel
    - retaining a copy of the report for personal records
  out_of_scope: social engineering, physical access, DoS attacks

regulatory_flags:
  - CFAA 18 U.S.C. §1030 (safe harbor for good-faith research)
  - UK Computer Misuse Act 1990 (safe harbor alignment)
  - EU NIS2 Directive Art. 12 (vulnerability disclosure policies)
  - ADR-0300 §B-* (researcher pseudonym protection)

acceptance_criteria:
  - encrypted report submission completes in p99 ≤ 2 s
  - triage team receives report in p99 ≤ 30 s (after submission)
  - severity classification recorded within 5 business days (SLO)
  - researcher identity disclosure is researcher-initiated (Cedar gate rejects
    platform-initiated identity demand)
  - public disclosure before fix is rejected by workflow gate
  - quarterly aggregate count in transparency-report (CI-verified)

references:
  - ADR-0300 (PRIMARY — §B-* researcher-pseudonym-protection invariants)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - §3.2.5 critical-path matrix row 27
  - community/policy/anonymity-mode-fully-anonymous.cedar
  - community/capabilities/whistleblower-submission.yaml (sibling surface)
  - community/capabilities/securedrop-press-source.yaml (sibling surface)
  - community/ARCHITECTURE.md §community-as-4-mixture-product
