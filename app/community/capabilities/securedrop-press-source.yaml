# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — securedrop-press-source capability record
# Posting mode: fully-anonymous
# ADR-0300 binding: PRIMARY §P-* invariants
# Owner: axis-community + ops-security + council-privacy
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — PRIMARY authority §P-*)
#   - community/policy/anonymity-mode-fully-anonymous.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product

capability_id: community-securedrop-press-source
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, ops-security, council-privacy, council-architecture

purpose: |
  The SecureDrop press-source capability enables fully-anonymous document
  submission from sources to verified journalists. Per ADR-0300 §P-1 (press-
  freedom encryption guarantee), the platform routes ciphertexts to journalist
  mailboxes WITHOUT ever holding the decryption key. The platform sees ONLY:
  encrypted_blob + content_hash + journalist_mailbox_id.

  This models the Freedom of the Press Foundation's SecureDrop architecture
  adapted for the community µservice's multi-tenant substrate.

  This capability was previously scaffolded under microservices/anonymous/.
  Per user clarification 2026-05-21, it is a fully-anonymous posting-mode
  capability within community/.

posting_mode: fully-anonymous
adr_0300_surface: press_source

scope:
  authorised:
    - encrypted document bundle submission to journalist mailbox
    - journalist mailbox read (journalist identity required; ciphertext only)
    - journalist reply to source (ciphertext; source reads via codename)
    - platform routing of ciphertext blobs (no decryption)
    - transparency-report aggregate count
  forbidden:
    - platform decryption at any time (ADR-0300 §P-2)
    - linking source to user_id, IP address, device fingerprint (ADR-0300 §P-3)
    - journalist list exposure to unauthenticated requests
    - third-party tracker egress
    - submission without rate-limiting

encryption_model:
  scheme: Signal Protocol X3DH + Double Ratchet (per ADR-0300 §P-4)
  source_perspective: |
    Source generates ephemeral keypair. Encrypts document bundle to journalist's
    public key (fetched from journalist key directory). Submits ciphertext + ephemeral
    public key. Platform stores ciphertext; never the source private key.
  journalist_perspective: |
    Journalist authenticates (identity-anchored; separate from the source surface).
    Reads ciphertext from mailbox. Decrypts locally. Platform never sees plaintext.
  platform_stores:
    - encrypted_blob
    - ephemeral_source_public_key
    - journalist_mailbox_id
    - content_hash
    - submission_timestamp
  platform_does_not_store:
    - plaintext
    - source_identity
    - source_ip (stripped at load-balancer per ADR-0300 §P-5 network-level stripping)
    - source_device_fingerprint

journalist_directory:
  onboarding: trust-and-safety vetting + press-credentials verification
  key_publication: journalist uploads PGP/Curve25519 public key during onboarding
  key_rotation: journalist-initiated; old key retained 30 days for in-flight messages
  visibility: journalist name + affiliation visible to sources (by design; source
              chooses recipient)

source_codename:
  purpose: allow journalist-to-source reply without source identity
  generation: cryptographically random 7-word passphrase (Diceware-equivalent)
  storage: source stores codename locally; platform stores HMAC(codename) only
  codename_rotation: source-initiated; old codename invalidated after rotation

network_level_protections:
  - Tor onion service (.onion address) for source-facing submission endpoint
  - no JavaScript on submission page (static HTML form only)
  - IP stripping at load-balancer (before any application-layer logging)
  - no CDN for submission endpoint (CDN logs would capture source IP)

regulatory_framework:
  - First Amendment (US press freedom; platform is conduit not publisher)
  - EU Charter Art. 11 (freedom of expression including press freedom)
  - UK Human Rights Act 1998 Art. 10 (freedom of expression)
  - ECHR Art. 10 (press freedom doctrine; Goodwin v UK [1996] ECHR 16)
  - "Journalist shield laws (US: varies by state; FR: Code de procédure pénale
    Art. 56-2; DE: StPO §97; AU: Evidence Amendment Act 2011)"
  - "ADR-0300 §P-6: platform will contest any legal-process demand targeting
    source identity using available legal remedies before compliance"

acceptance_criteria:
  - source submission completes in p99 ≤ 3 s (includes E2EE encryption)
  - journalist mailbox read completes in p99 ≤ 500 ms
  - IP stripping verified: no source IP in any application log (CI scan)
  - plaintext never appears in any tenant RBAC storage (CI scan of storage schemas)
  - platform decryption attempt rejected by Cedar gate (never reaches storage layer)
  - Tor onion service availability ≥ 99.9% (SLO)

references:
  - ADR-0300 (PRIMARY — §P-* press-freedom invariants)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - community/policy/anonymity-mode-fully-anonymous.cedar
  - community/capabilities/whistleblower-submission.yaml (sibling surface)
  - community/capabilities/bug-bounty-submission.yaml (sibling surface)
  - community/ARCHITECTURE.md §community-as-4-mixture-product
