# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
capability_id: oya.community.moderate-action
microservice: community
bc: moderation-queue
version: 0.1.0
status: incubating
description: |
  Apply a moderation action (hide / lock / pin / unpin / unhide / unlock /
  merge / move / delete / ban / quarantine / resolve_flag) on a target.
  Destructive verbs (delete / ban) require two-eyes when over threshold.
preconditions:
  - "principal authenticated via tenancy JWT"
  - "principal has moderator_role == true"
  - "for destructive verbs over threshold: two_eyes_approver_id provided + verified"
inputs:
  - name: target_id
    type: string
    required: true
  - name: target_type
    type: enum[post, reply, kb_article, attachment, member]
    required: true
  - name: verb
    type: enum[hide, lock, pin, unpin, unhide, unlock, merge, move, delete, ban, quarantine, resolve_flag]
    required: true
  - name: reason
    type: string
    required: false
  - name: two_eyes_approver_id
    type: string
    required: conditional
outputs:
  - name: action
    type: ModerationAction
side_effects:
  - "Postgres INSERT into community.moderation_actions (append-only)"
  - "Postgres UPDATE moderation_state on target"
  - "Audit-chain seal of ModerationActioned event (Ed25519 signed)"
  - "AsyncAPI emit community.moderation.actioned"
  - "Search-index reindex (async)"
slo_targets:
  - { metric: latency_p99, value: 200ms }
  - { metric: success_rate, value: 99.95% }
required_policies:
  - policy/tenant-scope.cedar (PERMIT 3 — TenantModerator)
  - policy/tenant-scope.cedar (PERMIT 4 — TenantAdmin for destructive verbs)
events_emitted:
  - oya.community.moderation.actioned.v1
two_eyes_threshold:
  - "delete_post: > 100 / day per moderator"
  - "ban_member: > 10 / day per moderator"
  - "purge_kb_article: always"
audit:
  - "Every action emits an audit-chain seal signed by moderator JWT key"
  - "Append-only table; UPDATE/DELETE forbidden by Postgres trigger"
