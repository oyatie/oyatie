# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — whistleblower-submission capability record
# Posting mode: fully-anonymous
# ADR-0300 binding: PRIMARY (every section cites ADR-0300 sub-invariant)
# Owner: axis-community + ops-security + council-privacy + general-counsel
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — PRIMARY authority)
#   - community/policy/anonymity-mode-fully-anonymous.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product

capability_id: community-whistleblower-submission
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, ops-security, council-privacy, council-architecture, general-counsel

purpose: |
  The whistleblower-submission capability enables fully-anonymous evidence
  submission by employees, citizens, or third parties reporting suspected
  wrongdoing to the platform's trust-and-safety team or a designated regulatory
  body. Per ADR-0300 §W-1, submission integrity is guaranteed: the platform
  records an encrypted blob + content-addressed hash, NEVER the decryption key.

  This capability was previously scaffolded under microservices/anonymous/
  (mis-scaffold 2026-05-20). Per user clarification 2026-05-21, it is a
  fully-anonymous posting-mode capability within community/.

  ADR-0300 is the binding authority. This YAML is the capability record;
  the Cedar policy is community/policy/anonymity-mode-fully-anonymous.cedar.

posting_mode: fully-anonymous
adr_0300_surface: whistleblower

scope:
  authorised:
    - encrypted evidence bundle submission (no identity required)
    - content-addressed hash recording (platform holds hash; not ciphertext key)
    - trust-and-safety triage (after dual-control key-custody ceremony)
    - case escalation to regulatory body (with dual-control approval)
    - transparency-report aggregate count (no per-case detail)
  forbidden:
    - platform decryption without dual-control ceremony (ADR-0300 §W-3)
    - linking submission to user_id, IP address, or device fingerprint (ADR-0300 §W-4)
    - third-party tracker egress
    - submission without rate-limiting (DDoS/spam protection)

encryption_model:
  scheme: hybrid (X25519 key agreement + AES-256-GCM content encryption)
  key_custody: |
    dual-control per ADR-0300 §W-3
    - key_share_1: trust-and-safety principal (ops-security team)
    - key_share_2: general-counsel designated trustee
    - both shares required to decrypt; neither can decrypt alone
  platform_stores: encrypted_blob + content_hash + submission_timestamp + channel="whistleblower"
  platform_does_not_store: decryption_key, user_id, ip_address, device_fingerprint

submission_channels:
  - web form (Tor-compatible; no JavaScript trackers; ADR-0300 §W-5)
  - REST API endpoint (for integrated reporting tools)

regulatory_protections:
  - EU Whistleblower Protection Directive 2019/1937 (Art. 6: secure reporting channels)
  - UK Public Interest Disclosure Act 1998 (protected disclosures)
  - US Dodd-Frank §21F (SEC whistleblower; platform provides secure channel)
  - KR 공익신고자 보호법 Art. 8 (anonymous report channels)
  - GDPR Art. 9 (sensitive data minimisation — submission encryption ensures no
    special-category data is processed by platform)

dual_control_ceremony:
  trigger: trust-and-safety APPROVED triage verdict
  participants:
    - ops-security designated principal (key_share_1 holder)
    - general-counsel designated trustee (key_share_2 holder)
  ceremony_audit: dual-control ceremony logged to audit-chain with Merkle seal
  ceremony_recording: ceremony video stored in legal-hold (90 days)

legal_process_disclosure:
  applicable: true
  cedar_fragment: community/policy/anonymity-mode-fully-anonymous.cedar PERMIT 4
  requires_dual_control: true (separate from decryption ceremony)
  court_order_required: true (no voluntary disclosure without court order)

transparency_reporting:
  per_quarter: aggregate count of submissions received + triaged + escalated
  per_case: NEVER disclosed in transparency report (ADR-0300 §W-6)

acceptance_criteria:
  - submission accepted in p99 ≤ 2 s (includes encryption on client; REST round-trip)
  - encrypted blob stored durably (3-copy replication) within p99 ≤ 5 s
  - rate-limit (Cedar gate) rejects flood submissions in p99 ≤ 50 ms
  - dual-control ceremony audit entry visible in audit-chain within 60 s
  - decryption-without-ceremony attempt rejected by Cedar gate (never reaches storage)
  - quarterly transparency-report includes aggregate count (CI-verified)

references:
  - ADR-0300 (PRIMARY — whistleblower + press-freedom doctrine)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - community/policy/anonymity-mode-fully-anonymous.cedar
  - community/capabilities/securedrop-press-source.yaml (sibling surface)
  - community/capabilities/bug-bounty-submission.yaml (sibling surface)
  - community/ARCHITECTURE.md §community-as-4-mixture-product
