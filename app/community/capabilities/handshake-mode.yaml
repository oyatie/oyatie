# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — Handshake-mode capability record
# Posting mode: identity-anchored (verified student + employer)
# Owner: axis-community + council-privacy
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — not primary; informs taxonomy)
#   - community/policy/anonymity-mode-identity-anchored.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product

capability_id: community-handshake-mode
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, council-privacy, council-architecture

purpose: |
  The Handshake-mode surface enables student-employer recruiting workflows
  anchored to verified student identity + university affiliation. Features
  include: verified-student status (tied to .edu email or university SSO),
  university-tied feeds (career events, club announcements, alumni channels),
  job/internship board, employer recruiting campaigns, on-campus events (virtual
  + in-person), and a graduation-year-aware recommendation engine.

  This is the student-recruiting identity-anchored mode within community's
  4-mixture product (TeamBlind + Reddit + LinkedIn + Handshake). Identity
  anchoring is mandatory — anonymity is not available on this surface because
  employer-student trust depends on verified credentials.

product_surface: handshake-style
posting_mode: identity-anchored

scope:
  authorised:
    - verified-student profile (name, major, grad year, GPA optional, university)
    - university SSO integration (SAML/OIDC per institution)
    - job + internship listings (employer-posted; student-facing)
    - employer recruiting campaigns (targeted by major + grad year + university)
    - "application tracking (student side: status; employer side: pipeline)"
    - on-campus events (virtual + in-person; RSVP + check-in)
    - university-tied feeds (career office posts, club announcements, alumni Q&A)
    - alumni mentorship connections
    - early-offer + return-offer workflows
    - placement outcome tracking (optional; student opt-in)
  forbidden:
    - switching to blinded/pseudonymous/anonymous mode within this surface
    - employer access to student GPA without explicit student consent
    - cross-university employer targeting without student consent
    - cross-tenant reads
    - third-party tracker egress

student_verification:
  methods:
    - university email domain (.edu or institution-specific domain)
    - university SSO (SAML/OIDC; preferred; unlocks "verified student" badge)
  verified_attributes:
    - full_name
    - university (normalized institution name)
    - graduation_year
    - major (optional; student-disclosed)
  not_verified_by_platform:
    - GPA (student self-reported; employer-verifiable at offer stage)
    - extracurriculars (self-reported)

employer_verification:
  methods:
    - employer email domain (OIDC)
    - manual vetting (for new employers; trust-and-safety review)
  recruiter_entitlement: employer_verified = true AND recruiter_seat_licensed = true

university_feed:
  publishers:
    - career_office (verified by university admin)
    - student_clubs (verified by university admin delegation)
    - alumni (verified by grad year + university)
    - employers (in career-office-approved campaigns only)
  visibility: university-scoped (students + alumni of same institution by default)
  cross_university: allowed only where student explicitly opts in

on_campus_events:
  rsvp_gate: verified student or verified employer recruiter
  check_in: QR-code (in-person) or join-link (virtual)
  recording: opt-in (student consent + employer disclosure required)

placement_outcomes:
  opt_in: true (student explicit consent per FERPA §99.30)
  data_use: aggregate anonymized placement stats only; no individual disclosure
  ferpa_compliance: FERPA §99.30 consent captured at opt-in; stored in audit chain

regulatory_flags:
  - FERPA §99.30 (student education records; placement outcome opt-in)
  - COPPA §312 (if any student under 13; age-gate mandatory)
  - GDPR Art. 6(1)(b) (contract basis; student-employer matching)
  - EU DSA Art. 14 (appeal mechanism for moderation)
  - regional AI-risk Art. 50 (ai_assessed_label on recommendation engine outputs)
  - EEOC / OFCCP (employer-side anti-discrimination in job targeting)

acceptance_criteria:
  - student profile creation completes in p99 ≤ 400 ms
  - university SSO handshake completes in p99 ≤ 800 ms
  - job listing search (by major + grad year) completes in p99 ≤ 500 ms
  - employer campaign targeting rejects non-consenting students (Cedar gate)
  - FERPA opt-in captured in audit chain (verified by audit-chain SLO)

references:
  - ADR-0300 (whistleblower + press-freedom doctrine; anonymity-mode taxonomy)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - ADR-0119 (capability-tier enum)
  - community/policy/anonymity-mode-identity-anchored.cedar
  - community/ARCHITECTURE.md §community-as-4-mixture-product
