# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — LinkedIn-mode capability record
# Posting mode: identity-anchored (verified professional identity)
# Owner: axis-community + council-privacy
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — not primary; informs taxonomy)
#   - community/policy/anonymity-mode-identity-anchored.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product

capability_id: community-linkedin-mode
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, council-privacy, council-architecture

purpose: |
  The LinkedIn-mode surface enables professional identity-anchored posting and
  networking. Every action is bound to the user's verified professional identity.
  Features include: professional profile + work history + education, skill
  endorsements, connection graph, job listings (post + apply), articles (long-form),
  posts (short-form), DMs, and recruiting workflows.

  This is the identity-anchored posting mode within community's 4-mixture product
  (TeamBlind + Reddit + LinkedIn + Handshake). Users on this surface have NO
  anonymity guarantee — by design. Privacy controls are about data-minimisation
  and visibility scoping (connections-only, public, private), not identity concealment.

product_surface: linkedin-style
posting_mode: identity-anchored

scope:
  authorised:
    - professional profile (work history, education, skills, headline, about)
    - skill endorsements + recommendations
    - connection graph (1st/2nd/3rd degree)
    - job listings (post, apply, track, close)
    - posts + articles (long-form rich text)
    - direct messages (identity-anchored; not E2EE by default; E2EE opt-in via MLS)
    - company pages
    - events (virtual + in-person)
    - learning content (links to internal or external courses)
    - recruiter search (visibility-scoped)
    - open-to-work signal
  forbidden:
    - switching to blinded/pseudonymous/anonymous mode within this session
    - cross-tenant reads
    - third-party tracker egress

identity_verification:
  methods:
    - work email domain (OIDC)
    - document verification (optional; unlocks "verified" badge)
    - phone number (SMS 2FA floor)
  verified_attributes:
    - full_name
    - employer (current; optional past)
    - role_title
    - education_institution (optional)

connection_graph:
  degree_visibility:
    - 1st: full profile visible (per visibility settings)
    - 2nd: partial profile visible
    - 3rd: name + headline only
    - out_of_network: name only (if profile is public)
  connection_request_rate_limit: 100 per week (spam prevention)

job_board:
  post_requires: verified_employer = true
  apply_sends: full identity to employer (explicit consent at apply-time)
  ats_integration: webhook to external ATS (optional; tenant-configured)
  salary_transparency: optional field; nudged for DE&I compliance

dm_model:
  default: identity-anchored plaintext (TLS in transit, encrypted at rest)
  e2ee_opt_in: MLS RFC 9420 group per ADR-0246 (MLS messenger substrate)
  inmail_equivalent: premium feature; gated by capability-tier config

regulatory_flags:
  - GDPR Art. 6(1)(b) contract basis for profile data
  - GDPR Art. 17 right to erasure (hard-delete propagation chain)
  - EU DSA Art. 14 (appeal for moderation actions)
  - CCPA (US California; data access + deletion)
  - EEOC / OFCCP (US job-board anti-discrimination)
  - EU Accessibility Act (digital products)
  - regional AI-risk Art. 50 (ai_assessed_label on any AI-generated content label)

acceptance_criteria:
  - profile read completes in p99 ≤ 300 ms
  - connection request completes in p99 ≤ 200 ms
  - job listing publish completes in p99 ≤ 500 ms
  - identity-anchored post publish completes in p99 ≤ 400 ms
  - blinded-credential issuance is refused (Cedar gate rejects in p99 ≤ 50 ms)

references:
  - ADR-0300 (whistleblower + press-freedom doctrine; anonymity-mode taxonomy)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - ADR-0119 (capability-tier enum)
  - community/policy/anonymity-mode-identity-anchored.cedar
  - community/ARCHITECTURE.md §community-as-4-mixture-product
