// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oya.community.v1;

option go_package = "github.com/oyatie/oya-community/gen/proto/community/v1;communityv1";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Service definitions
// ---------------------------------------------------------------------------

service PostStoreService {
  rpc CreatePost(CreatePostRequest) returns (Post);
  rpc EditPost(EditPostRequest) returns (Post);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc ReadPost(ReadPostRequest) returns (Post);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
}

service ThreadTreeService {
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse);
  rpc PostReply(PostReplyRequest) returns (ThreadNode);
}

service VotingEngineService {
  rpc CastVote(CastVoteRequest) returns (VoteTally);
  rpc AcceptAnswer(AcceptAnswerRequest) returns (AcceptAnswerResponse);
  rpc ReadTally(ReadTallyRequest) returns (VoteTally);
}

service ModerationQueueService {
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc ApplyAction(ApplyActionRequest) returns (ApplyActionResponse);
  rpc RaiseFlag(RaiseFlagRequest) returns (RaiseFlagResponse);
}

service KbArticleStoreService {
  rpc CreateKbArticle(CreateKbArticleRequest) returns (KbArticle);
  rpc EditKbArticle(EditKbArticleRequest) returns (KbArticle);
  rpc PublishKbArticle(PublishKbArticleRequest) returns (KbArticle);
  rpc ReadKbArticle(ReadKbArticleRequest) returns (KbArticle);
  rpc UploadAttachment(stream UploadAttachmentChunk) returns (Attachment);
}

service SearchIndexService {
  rpc Search(SearchRequest) returns (SearchResults);
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
}

// ---------------------------------------------------------------------------
// Domain types
// ---------------------------------------------------------------------------

enum PostKind {
  POST_KIND_UNSPECIFIED = 0;
  POST_KIND_ANNOUNCEMENT = 1;
  POST_KIND_QUESTION = 2;
  POST_KIND_ANSWER = 3;
  POST_KIND_REPLY = 4;
  POST_KIND_DISCUSSION = 5;
}

enum ModerationState {
  MODERATION_STATE_UNSPECIFIED = 0;
  MODERATION_STATE_APPROVED = 1;
  MODERATION_STATE_PENDING = 2;
  MODERATION_STATE_HIDDEN = 3;
  MODERATION_STATE_LOCKED = 4;
}

enum VoteDirection {
  VOTE_DIRECTION_UNSPECIFIED = 0;
  VOTE_DIRECTION_UP = 1;
  VOTE_DIRECTION_DOWN = 2;
  VOTE_DIRECTION_CLEAR = 3;
}

enum FlagReason {
  FLAG_REASON_UNSPECIFIED = 0;
  FLAG_REASON_SPAM = 1;
  FLAG_REASON_ABUSE = 2;
  FLAG_REASON_ILLEGAL = 3;
  FLAG_REASON_IMPERSONATION = 4;
  FLAG_REASON_OFF_TOPIC = 5;
  FLAG_REASON_OTHER = 99;
}

enum ModerationVerb {
  MODERATION_VERB_UNSPECIFIED = 0;
  MODERATION_VERB_HIDE = 1;
  MODERATION_VERB_LOCK = 2;
  MODERATION_VERB_PIN = 3;
  MODERATION_VERB_UNPIN = 4;
  MODERATION_VERB_UNHIDE = 5;
  MODERATION_VERB_UNLOCK = 6;
  MODERATION_VERB_MERGE = 7;
  MODERATION_VERB_MOVE = 8;
  MODERATION_VERB_DELETE = 9;
  MODERATION_VERB_BAN = 10;
  MODERATION_VERB_QUARANTINE = 11;
  MODERATION_VERB_RESOLVE_FLAG = 12;
}

enum KbArticleState {
  KB_ARTICLE_STATE_UNSPECIFIED = 0;
  KB_ARTICLE_STATE_DRAFT = 1;
  KB_ARTICLE_STATE_PUBLISHED = 2;
  KB_ARTICLE_STATE_ARCHIVED = 3;
}

message Post {
  string id = 1;
  string tenant_id = 2;
  string space_id = 3;
  string author_id = 4;
  PostKind kind = 5;
  string body = 6;
  int32 revision = 7;
  repeated string tags = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp edited_at = 10;
  ModerationState moderation_state = 11;
  int32 vote_score = 12;
  string accepted_answer_id = 13;
  repeated string mentions = 14;
  repeated string ontology_links = 15;
}

message ThreadNode {
  string id = 1;
  string parent_id = 2;
  int32 depth = 3;
  string path = 4;
  string body = 5;
  string author_id = 6;
  int32 vote_score = 7;
}

message VoteTally {
  int32 upvotes = 1;
  int32 downvotes = 2;
  int32 score = 3;
  VoteDirection my_vote = 4;
}

message Flag {
  string id = 1;
  string target_id = 2;
  string target_type = 3;
  FlagReason reason = 4;
  string note = 5;
  string reporter_id = 6;
  google.protobuf.Timestamp raised_at = 7;
}

message ModerationAction {
  string id = 1;
  string target_id = 2;
  string target_type = 3;
  ModerationVerb verb = 4;
  string moderator_id = 5;
  string two_eyes_approver_id = 6;
  string reason = 7;
  google.protobuf.Timestamp applied_at = 8;
}

message KbArticle {
  string id = 1;
  string tenant_id = 2;
  string space_id = 3;
  string author_id = 4;
  string title = 5;
  string body = 6;
  int32 revision = 7;
  KbArticleState state = 8;
  repeated string tags = 9;
  repeated Attachment attachments = 10;
  repeated string ontology_links = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp published_at = 13;
}

message Attachment {
  string id = 1;
  string filename = 2;
  string sha256 = 3;
  int64 size_bytes = 4;
  string content_type = 5;
  string s3_url = 6;
  string scan_state = 7;
}

// ---------------------------------------------------------------------------
// Requests / responses
// ---------------------------------------------------------------------------

message CreatePostRequest {
  string space_id = 1;
  PostKind kind = 2;
  string body = 3;
  repeated string tags = 4;
  string parent_post_id = 5;
  repeated string mentions = 6;
  repeated string ontology_links = 7;
}

message EditPostRequest {
  string post_id = 1;
  string body = 2;
  string edit_reason = 3;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {}

message ReadPostRequest {
  string post_id = 1;
}

message ListPostsRequest {
  string space_id = 1;
  string sort = 2;
  string tag = 3;
  string cursor = 4;
  int32 limit = 5;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
}

message ListRepliesRequest {
  string post_id = 1;
  int32 depth = 2;
  string cursor = 3;
}

message ListRepliesResponse {
  repeated ThreadNode nodes = 1;
  string next_cursor = 2;
}

message PostReplyRequest {
  string post_id = 1;
  string parent_node_id = 2;
  string body = 3;
}

message CastVoteRequest {
  string post_id = 1;
  VoteDirection direction = 2;
  string idempotency_key = 3;
}

message AcceptAnswerRequest {
  string post_id = 1;
  string reply_id = 2;
}

message AcceptAnswerResponse {}

message ReadTallyRequest {
  string post_id = 1;
}

message ListQueueRequest {
  string state = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListQueueResponse {
  repeated QueueItem items = 1;
  string next_cursor = 2;
}

message QueueItem {
  string id = 1;
  string target_id = 2;
  string target_type = 3;
  int32 flag_count = 4;
  repeated Flag flags = 5;
  google.protobuf.Timestamp oldest_flag_at = 6;
  string state = 7;
}

message ApplyActionRequest {
  string target_id = 1;
  string target_type = 2;
  ModerationVerb verb = 3;
  string reason = 4;
  string two_eyes_approver_id = 5;
}

message ApplyActionResponse {
  ModerationAction action = 1;
}

message RaiseFlagRequest {
  string target_id = 1;
  string target_type = 2;
  FlagReason reason = 3;
  string note = 4;
}

message RaiseFlagResponse {
  Flag flag = 1;
}

message CreateKbArticleRequest {
  string space_id = 1;
  string title = 2;
  string body = 3;
  repeated string tags = 4;
}

message EditKbArticleRequest {
  string article_id = 1;
  string title = 2;
  string body = 3;
  string edit_reason = 4;
}

message PublishKbArticleRequest {
  string article_id = 1;
}

message ReadKbArticleRequest {
  string article_id = 1;
}

message UploadAttachmentChunk {
  string article_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 offset = 4;
  bytes data = 5;
  bool final_chunk = 6;
}

message SearchRequest {
  string q = 1;
  string scope = 2;
  int32 limit = 3;
  string cursor = 4;
}

message SearchResults {
  repeated SearchHit hits = 1;
  string next_cursor = 2;
  int32 total = 3;
  int32 took_ms = 4;
}

message SearchHit {
  string id = 1;
  string kind = 2;
  string title = 3;
  string snippet = 4;
  double score = 5;
}

message ReindexRequest {
  string scope = 1;
  string from_index = 2;
  string to_index = 3;
}

message ReindexResponse {
  string job_id = 1;
}
