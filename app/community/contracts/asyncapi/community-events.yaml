asyncapi: 3.1.0
info:
  title: community-events
  version: 0.1.0
  description: |
    Event surface for the community µservice. Consumed by foundry-guardrails
    (spam / abuse), audit-chain (sealing), search-index worker (reindex), and
    notifier (subscription delivery). Per ADR-0135 Connect-unbundle.
  contact:
    name: axis-community
defaultContentType: application/cloudevents+json
servers:
  nats-prod:
    host: nats.oyatie.svc.cluster.local:4222
    protocol: nats
    description: NATS JetStream cluster
channels:
  community.post.created:
    address: community.post.created
    description: A new post (announcement, question, discussion) was created.
    messages:
      PostCreated:
        $ref: '#/components/messages/PostCreated'
  community.post.edited:
    address: community.post.edited
    description: A post was edited (revision appended).
    messages:
      PostEdited:
        $ref: '#/components/messages/PostEdited'
  community.post.deleted:
    address: community.post.deleted
    description: A post was tombstoned.
    messages:
      PostDeleted:
        $ref: '#/components/messages/PostDeleted'
  community.reply.posted:
    address: community.reply.posted
    description: A threaded reply was posted.
    messages:
      ReplyPosted:
        $ref: '#/components/messages/ReplyPosted'
  community.vote.cast:
    address: community.vote.cast
    description: A vote (up / down / clear) was cast.
    messages:
      VoteCast:
        $ref: '#/components/messages/VoteCast'
  community.answer.accepted:
    address: community.answer.accepted
    description: An answer was marked accepted on a Q&A post.
    messages:
      AnswerAccepted:
        $ref: '#/components/messages/AnswerAccepted'
  community.flag.raised:
    address: community.flag.raised
    description: A member raised a flag against a target.
    messages:
      FlagRaised:
        $ref: '#/components/messages/FlagRaised'
  community.moderation.actioned:
    address: community.moderation.actioned
    description: A moderator took an action.
    messages:
      ModerationActioned:
        $ref: '#/components/messages/ModerationActioned'
  community.kb.article.published:
    address: community.kb.article.published
    description: A KB article was published or republished.
    messages:
      KBArticlePublished:
        $ref: '#/components/messages/KBArticlePublished'
  community.kb.article.archived:
    address: community.kb.article.archived
    description: A KB article was archived.
    messages:
      KBArticleArchived:
        $ref: '#/components/messages/KBArticleArchived'
  community.search.reindex.requested:
    address: community.search.reindex.requested
    description: Request to reindex documents into search-index.
    messages:
      SearchReindexRequested:
        $ref: '#/components/messages/SearchReindexRequested'
operations:
  publishPostCreated:
    action: send
    channel: { $ref: '#/channels/community.post.created' }
  publishPostEdited:
    action: send
    channel: { $ref: '#/channels/community.post.edited' }
  publishPostDeleted:
    action: send
    channel: { $ref: '#/channels/community.post.deleted' }
  publishVoteCast:
    action: send
    channel: { $ref: '#/channels/community.vote.cast' }
  publishModerationActioned:
    action: send
    channel: { $ref: '#/channels/community.moderation.actioned' }
  publishKBArticlePublished:
    action: send
    channel: { $ref: '#/channels/community.kb.article.published' }
  guardrailsSubscribe:
    action: receive
    channel: { $ref: '#/channels/community.post.created' }
    description: foundry-guardrails consumes PostCreated for spam classification.
  auditSubscribe:
    action: receive
    channel: { $ref: '#/channels/community.moderation.actioned' }
    description: audit-chain seals every moderation action.
components:
  schemas:
    BaseEvent:
      type: object
      required: [specversion, type, source, id, time, tenant_id]
      properties:
        specversion: { type: string, const: '1.0' }
        type: { type: string }
        source: { type: string, const: 'urn:oya:community' }
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        tenant_id: { type: string }
  messages:
    PostCreated:
      name: PostCreated
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [post_id, author_id, kind]
            properties:
              type: { const: 'oya.community.post.created.v1' }
              post_id: { type: string }
              space_id: { type: string }
              author_id: { type: string }
              kind: { type: string, enum: [announcement, question, discussion] }
              body_sha256: { type: string }
              mentions: { type: array, items: { type: string } }
              ontology_links: { type: array, items: { type: string } }
    PostEdited:
      name: PostEdited
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [post_id, revision]
            properties:
              type: { const: 'oya.community.post.edited.v1' }
              post_id: { type: string }
              revision: { type: integer }
              body_sha256: { type: string }
              editor_id: { type: string }
              edit_reason: { type: string, nullable: true }
    PostDeleted:
      name: PostDeleted
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [post_id]
            properties:
              type: { const: 'oya.community.post.deleted.v1' }
              post_id: { type: string }
              deletor_id: { type: string }
              reason: { type: string, enum: [author, moderator, dsr] }
    ReplyPosted:
      name: ReplyPosted
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [reply_id, parent_post_id]
            properties:
              type: { const: 'oya.community.reply.posted.v1' }
              reply_id: { type: string }
              parent_post_id: { type: string }
              parent_node_id: { type: string, nullable: true }
              author_id: { type: string }
              depth: { type: integer }
    VoteCast:
      name: VoteCast
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [post_id, member_id, direction]
            properties:
              type: { const: 'oya.community.vote.cast.v1' }
              post_id: { type: string }
              member_id: { type: string }
              direction: { type: string, enum: [up, down, clear] }
              idempotency_key: { type: string }
    AnswerAccepted:
      name: AnswerAccepted
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [question_post_id, answer_reply_id]
            properties:
              type: { const: 'oya.community.answer.accepted.v1' }
              question_post_id: { type: string }
              answer_reply_id: { type: string }
              accepter_id: { type: string }
    FlagRaised:
      name: FlagRaised
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [target_id, target_type, reason]
            properties:
              type: { const: 'oya.community.flag.raised.v1' }
              target_id: { type: string }
              target_type: { type: string, enum: [post, reply, kb_article, attachment] }
              reason: { type: string }
              reporter_id: { type: string }
    ModerationActioned:
      name: ModerationActioned
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [target_id, target_type, verb, moderator_id]
            properties:
              type: { const: 'oya.community.moderation.actioned.v1' }
              target_id: { type: string }
              target_type: { type: string }
              verb: { type: string }
              moderator_id: { type: string }
              two_eyes_approver_id: { type: string, nullable: true }
              reason: { type: string, nullable: true }
    KBArticlePublished:
      name: KBArticlePublished
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [article_id, revision]
            properties:
              type: { const: 'oya.community.kb.article.published.v1' }
              article_id: { type: string }
              revision: { type: integer }
              author_id: { type: string }
              attachment_count: { type: integer }
    KBArticleArchived:
      name: KBArticleArchived
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [article_id]
            properties:
              type: { const: 'oya.community.kb.article.archived.v1' }
              article_id: { type: string }
              archiver_id: { type: string }
    SearchReindexRequested:
      name: SearchReindexRequested
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - type: object
            required: [scope]
            properties:
              type: { const: 'oya.community.search.reindex.requested.v1' }
              scope: { type: string, enum: [post, kb_article, all] }
              requested_by: { type: string }
              from_index: { type: string, nullable: true }
              to_index: { type: string }
