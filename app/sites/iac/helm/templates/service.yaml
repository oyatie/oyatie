{{/*
Per-BC Service template — one Service per BC. Per ADR-0131.
*/}}
{{- range $bc, $cfg := dict "site" $.Values.site "page" $.Values.page "block" $.Values.block "theme" $.Values.theme "navigation" $.Values.navigation "url-routing" $.Values.urlRouting "domain-binding" $.Values.domainBinding "seo" $.Values.seo "cms-collection" $.Values.cmsCollection "search" $.Values.search "cdn-delivery" $.Values.cdnDelivery }}
---
apiVersion: v1
kind: Service
metadata:
  name: oya-sites-{{ $bc }}-app
  namespace: sites
  labels:
    microservice: sites
    bc: {{ $bc }}
spec:
  type: ClusterIP
  selector:
    microservice: sites
    bc: {{ $bc }}
  ports:
    - {name: app,     port: {{ $cfg.port }}, targetPort: {{ $cfg.port }}, protocol: TCP}
    - {name: metrics, port: {{ $.Values.global.observability.metricsPort }}, targetPort: metrics, protocol: TCP}
{{- end }}
