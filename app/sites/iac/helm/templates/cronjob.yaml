{{/*
CronJobs — ACME cert renewal worker + sitemap.xml regeneration worker +
search reindex worker.
*/}}
{{- if $.Values.acmeRenewalWorker.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oya-sites-acme-renewal-worker
  namespace: sites
  labels:
    microservice: sites
    component: acme-renewal
spec:
  schedule: "{{ $.Values.acmeRenewalWorker.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {microservice: sites, component: acme-renewal}
        spec:
          serviceAccountName: oya-sites
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          restartPolicy: OnFailure
          containers:
            - name: acme-renewal
              image: "{{ $.Values.acmeRenewalWorker.image.repository }}:{{ $.Values.acmeRenewalWorker.image.tag }}"
              env:
                - {name: ACME_DIRECTORY_URL, value: "{{ $.Values.domainBinding.acme.directoryUrl }}"}
                - {name: ACME_ACCOUNT_POOL_SIZE, value: "{{ $.Values.domainBinding.acme.accountPoolSize }}"}
                - {name: RUST_LOG, value: info}
              resources:
{{ toYaml $.Values.acmeRenewalWorker.resources | indent 16 }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
{{- end }}
{{- if $.Values.sitemapRegenWorker.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oya-sites-sitemap-regen-worker
  namespace: sites
  labels: {microservice: sites, component: sitemap-regen}
spec:
  schedule: "{{ $.Values.sitemapRegenWorker.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {microservice: sites, component: sitemap-regen}
        spec:
          serviceAccountName: oya-sites
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          restartPolicy: OnFailure
          containers:
            - name: sitemap-regen
              image: "{{ $.Values.sitemapRegenWorker.image.repository }}:{{ $.Values.sitemapRegenWorker.image.tag }}"
              env:
                - {name: RUST_LOG, value: info}
              resources:
{{ toYaml $.Values.sitemapRegenWorker.resources | indent 16 }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
{{- end }}
{{- if $.Values.searchReindexWorker.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oya-sites-search-reindex-worker
  namespace: sites
  labels: {microservice: sites, component: search-reindex}
spec:
  schedule: "{{ $.Values.searchReindexWorker.schedule }}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {microservice: sites, component: search-reindex}
        spec:
          serviceAccountName: oya-sites
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          restartPolicy: OnFailure
          containers:
            - name: search-reindex
              image: "{{ $.Values.searchReindexWorker.image.repository }}:{{ $.Values.searchReindexWorker.image.tag }}"
              env:
                - {name: MEILISEARCH_ENDPOINT, value: "{{ $.Values.search.meilisearch.endpoint }}"}
                - {name: RUST_LOG, value: info}
              resources:
{{ toYaml $.Values.searchReindexWorker.resources | indent 16 }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
{{- end }}
