{{/*
Per-BC PodDisruptionBudget. min-available 50% per ADR-0131 baseline.
*/}}
{{- if $.Values.podDisruptionBudget.enabled }}
{{- range $bc := list "site" "page" "block" "theme" "navigation" "url-routing" "domain-binding" "seo" "cms-collection" "search" "cdn-delivery" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oya-sites-{{ $bc }}-app-pdb
  namespace: sites
  labels:
    microservice: sites
    bc: {{ $bc }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      microservice: sites
      bc: {{ $bc }}
{{- end }}
{{- end }}
