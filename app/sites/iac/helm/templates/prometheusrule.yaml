{{/*
PrometheusRule — fast-burn + slow-burn alert rules per SLO.
Aligns with slos/*.openslo.yaml alertPolicyRef bindings.
*/}}
{{- if $.Values.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-sites-slo-burn-rules
  namespace: sites
  labels:
    microservice: sites
    release: kube-prometheus-stack
spec:
  groups:
    - name: sites-page-render-latency
      interval: 30s
      rules:
        - alert: sites-page-render-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_sites_page_render_seconds_bucket{le="0.20"}[1h]))
              /
              sum(rate(oya_sites_page_render_seconds_count[1h]))
            )) > 14 * (1 - 0.99)
          for: 2m
          labels: {severity: page, slo: page-render-latency, burn: fast-1h-14x}
          annotations:
            summary: "Page-render latency burning 14x over 1h"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/publish-pipeline-rollback.md"
        - alert: sites-page-render-slow-burn-6h-6x
          expr: |
            (1 - (
              sum(rate(oya_sites_page_render_seconds_bucket{le="0.20"}[6h]))
              /
              sum(rate(oya_sites_page_render_seconds_count[6h]))
            )) > 6 * (1 - 0.99)
          for: 15m
          labels: {severity: ticket, slo: page-render-latency, burn: slow-6h-6x}

    - name: sites-publish-latency
      interval: 30s
      rules:
        - alert: sites-publish-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_sites_publish_duration_seconds_bucket{le="5", site_size_class="medium"}[1h]))
              /
              sum(rate(oya_sites_publish_duration_seconds_count{site_size_class="medium"}[1h]))
            )) > 14 * (1 - 0.95)
          for: 2m
          labels: {severity: page, slo: publish-latency, burn: fast-1h-14x}
          annotations:
            summary: "Publish pipeline latency burning 14x over 1h"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/publish-pipeline-rollback.md"

    - name: sites-acme-renew-latency
      interval: 30s
      rules:
        - alert: sites-cert-expiry-near-page
          expr: |
            min(oya_sites_cert_expiry_seconds) < 86400
          for: 5m
          labels: {severity: page, slo: acme-renew-latency, slo_target: 86400s}
          annotations:
            summary: "TLS cert expires within 24h — ACME renewal failed"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/acme-cert-renewal-failure.md"
        - alert: sites-cert-expiry-near-ticket
          expr: |
            min(oya_sites_cert_expiry_seconds) < 604800
          for: 1h
          labels: {severity: ticket, slo: acme-renew-latency}
          annotations:
            summary: "TLS cert expires within 7d"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/acme-cert-renewal-failure.md"

    - name: sites-accessibility-wcag-correctness
      interval: 30s
      rules:
        - alert: sites-wcag-correctness-any-fail-page
          expr: |
            sum(rate(oya_sites_wcag_aa_validation_total{result="failed"}[5m])) > 0
          for: 1m
          labels: {severity: page, slo: accessibility-wcag-correctness, slo_target: 1.0}
          annotations:
            summary: "WCAG 2.2 AA correctness FAILED — Sev-1 for pack-us-healthcare patient portals"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/page-export-corruption.md"

    - name: sites-seo-meta-correctness
      interval: 30s
      rules:
        - alert: sites-seo-correctness-any-fail-page
          expr: |
            sum(rate(oya_sites_seo_meta_validation_total{result="failed"}[5m])) > 0
          for: 1m
          labels: {severity: page, slo: seo-meta-correctness, slo_target: 1.0}
          annotations:
            summary: "SEO meta correctness FAILED"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/page-export-corruption.md"

    - name: sites-search-cross-tenant-leak
      interval: 30s
      rules:
        - alert: sites-search-cross-tenant-leak-page
          expr: |
            sum(rate(oya_sites_search_cross_tenant_result_total[5m])) > 0
          for: 1m
          labels: {severity: page, sev: 1}
          annotations:
            summary: "Cross-tenant search result LEAK detected — Sev-1; immediate runbook"
            runbook_url: "https://oyatie.com/microservices/sites/incident-response.md"

    - name: sites-cdn-cache
      interval: 30s
      rules:
        - alert: sites-cdn-cache-hit-ratio-low
          expr: |
            (
              sum(rate(oya_sites_cdn_cache_hit_total[5m]))
              /
              sum(rate(oya_sites_cdn_request_total[5m]))
            ) < 0.30
          for: 15m
          labels: {severity: page, slo: page-render-latency}
          annotations:
            summary: "CDN cache hit ratio < 30% for > 15m; origin overwhelmed risk"
            runbook_url: "https://oyatie.com/microservices/sites/runbooks/cdn-cache-purge-cascade.md"
{{- end }}
