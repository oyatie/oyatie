# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# Kustomize base — shared resources referenced by all pack overlays.
# Per ADR-0131 (per-µservice flat layout).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sites

commonLabels:
  microservice: sites
  app.kubernetes.io/part-of: oyatie

resources:
  - namespace.yaml
  - serviceaccount.yaml

helmCharts:
  - name: oya-sites
    repo: oci://registry.oyatie.dev/charts
    version: 1.0.0
    releaseName: oya-sites
    namespace: sites
    valuesFile: ../../helm/values.yaml
