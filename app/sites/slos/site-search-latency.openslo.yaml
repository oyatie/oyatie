# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-site-search-latency
  displayName: "sites: site-search latency p95"
  labels:
    microservice: sites
    bc: search
    sli_class: latency
    tier: hero-product
    owner_team: axis-sites
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT,PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    Site-search p95 latency SLO. A query is "good" when Meilisearch returns
    in ≤ 300ms per the PRD performance target. Per-tenant Meilisearch index.
  service: sites
  indicator:
    metadata: {name: sites-site-search-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_search_query_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.30
      displayName: "30d rolling p95 ≤ 300ms"
  alertPolicies:
    - alertPolicyRef: sites-search-fast-burn-1h-14x
    - alertPolicyRef: sites-search-slow-burn-6h-6x
