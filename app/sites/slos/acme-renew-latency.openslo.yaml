# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-acme-renew-latency
  displayName: "sites: ACME cert renewal latency p95"
  labels:
    microservice: sites
    bc: domain-binding
    sli_class: latency
    tier: hero-product
    owner_team: axis-sites
    pack_scope: all
    data_classes: SECRET_TLS_KEY,INTERNAL_ONLY
spec:
  description: |
    ACME cert renewal p95 duration SLO. A renewal is "good" when it completes
    (challenge issued → answered → cert downloaded → cert loaded to CDN) in
    ≤ 30s. Per PRD-sites §"Performance" target + ADR-SITES-0004 ACME flow.
  service: sites
  indicator:
    metadata: {name: sites-acme-renew-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_acme_renewal_duration_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.95
      op: lte
      value: 30.0
      displayName: "30d rolling p95 ≤ 30s"
  alertPolicies:
    - alertPolicyRef: sites-acme-renew-fast-burn-1h-14x
    - alertPolicyRef: sites-acme-renew-slow-burn-6h-6x
    - alertPolicyRef: sites-cert-expiry-near-page
