# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-web-clipper-capture-latency
  displayName: "notes: web-clipper capture p95 ≤ 500ms"
  labels:
    microservice: notes
    bc: web-clipper-bridge
    sli_class: latency
    owner_team: axis-notes
spec:
  description: |
    Latency SLO for web-clipper capture: extension POST → REST ack.
    Excludes user-side network variance beyond observable RTT.
  service: notes
  indicator:
    metadata:
      name: notes-web-clipper-capture-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_web_clipper_capture_duration_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_web_clipper_capture_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 500ms for 95 % of 5min windows over 30d"
