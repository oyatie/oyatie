# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-sync-data-residency-correctness
  displayName: "notes: sync data-residency correctness = 100% (zero cross-pack residency violations)"
  labels:
    microservice: notes
    bc: note-store
    sli_class: correctness
    owner_team: council-privacy + ops-sre-reliability + axis-notes
    severity: load-bearing-invariant
spec:
  description: |
    Correctness SLO for the pack-residency invariant per policy/data-residency.md.
    The metric `oya_notes_pack_residency_violation_total` MUST stay at zero.
    Any non-zero increment indicates a row landed in the wrong pack — a Sev-1
    data-residency violation under GDPR Arts. 44-50 + KR PIPA Art. 28 + relevant
    pack regulations.
  service: notes
  indicator:
    metadata:
      name: notes-sync-data-residency-correctness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_pack_residency_check_total{result="ok"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_pack_residency_check_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      displayName: "100 % of writes land in the correct pack over 30d"
