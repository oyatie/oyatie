# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-full-text-search-latency
  displayName: "notes: full-text-search p95 ≤ 200ms (Professional only)"
  labels:
    microservice: notes
    bc: search-index
    sli_class: latency
    owner_team: axis-notes
spec:
  description: |
    Latency SLO for full-text-search via Meilisearch (Professional-tier only).
    Personal-tier full-text-search is client-side per ADR-NOTES-0004; this SLO
    covers server-side queries only.
  service: notes
  indicator:
    metadata:
      name: notes-full-text-search-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_full_text_search_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_full_text_search_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 200ms for 95 % of 5min windows over 30d"
