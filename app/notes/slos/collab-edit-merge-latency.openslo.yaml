apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-collab-edit-merge-latency
  displayName: Notes collaborative-edit merge latency
  labels:
    microservice: notes
    binding_adr: ADR-NOTES-0003
spec:
  service: notes
  description: |
    Loro CRDT merge operations complete within 200ms P99 server-acknowledgement after the
    first arriving op-set. Burn rate triggers the crdt-divergence-recovery runbook.
  objectives:
    - displayName: Merge ack ≤200ms
      target: 0.99
      sliRef:
        ratioMetric:
          counter: true
          good:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_notes_collab_edit_merge_duration_seconds_bucket{le="0.2"}[5m]))'
          total:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_notes_collab_edit_merge_total[5m]))'
  alertPolicy:
    burnRate:
      - threshold: 14
        lookback: 1h
        runbook: microservices/notes/runbooks/crdt-divergence-recovery.md
      - threshold: 6
        lookback: 6h
