# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-sync-latency
  displayName: "notes: sync-after-edit p99 ≤ 500ms"
  labels:
    microservice: notes
    bc: note-store
    sli_class: latency
    owner_team: axis-notes
spec:
  description: |
    Latency SLO for sync-after-edit. A request is "good" when end-to-end
    latency (client edit committed → WebSocket delta acknowledged → persisted)
    is ≤ 500ms p99.
  service: notes
  indicator:
    metadata:
      name: notes-sync-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_sync_after_edit_duration_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_sync_after_edit_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 500ms for 99 % of 5min windows over 30d"
