# OpenBao policy bindings for notes µservice
# Authority: ADR-0296

apiVersion: openbao.io/v1
kind: PolicyBinding
metadata:
  name: notes-openbao-policy
spec:
  policies:
    - name: notes-mls-key-escrow
      paths:
        - "secret/data/+/notes/mls-group-key":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.notes.mls-key-mint
    - name: notes-share-token-signing-key
      paths:
        - "secret/data/+/notes/share-token-signing-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: notes-attachment-s3-kms
      paths:
        - "secret/data/+/notes/attachment-s3-kms":
            capabilities: [read]
            ttl_seconds: 60
    - name: notes-tenant-byok-intelligence
      paths:
        - "secret/data/+/byok/intelligence-provider":
            capabilities: [read]
            ttl_seconds: 60
  sidecar:
    enabled: true
    image: openbao-sidecar:1.18
    ttl_seconds: 60
    refresh_advance_seconds: 10
    audit_emit_class: oya.notes.credential-mint
