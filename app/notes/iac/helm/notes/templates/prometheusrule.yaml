# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notes-burn-rate-rules
  namespace: notes
  labels:
    app.kubernetes.io/name: notes
    prometheus: mimir
spec:
  groups:
    - name: notes-recording-rules
      interval: 60s
      rules:
        - record: notes:note_create:availability_5m
          expr: |
            sum(rate(oya_notes_note_create_total{result="success"}[5m]))
            /
            sum(rate(oya_notes_note_create_total[5m]))
        - record: notes:sync:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_notes_sync_latency_seconds_bucket[5m]))
            )

    - name: notes-burn-rate-alerts
      rules:
        - alert: NotesNoteCreateFastBurn1h
          expr: |
            (1 - notes:note_create:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: notes
          annotations:
            summary: "notes note-create fast-burn (14.4x) for 5m"

        - alert: NotesNoteCreateSlowBurn6h
          expr: |
            (1 - avg_over_time(notes:note_create:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: notes

        - alert: NotesE2ELeakageDetected
          expr: |
            increase(oya_notes_e2e_content_to_inference_attempts_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: e2e-personal-tier-default
            microservice: notes
          annotations:
            summary: "notes E2E invariant violation: AI feature attempted to read E2E note content"
            runbook_url: "https://oyatie.com/microservices/notes/runbooks/ai-classifier-rollback-e2e-respect"
