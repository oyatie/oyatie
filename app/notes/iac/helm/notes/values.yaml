# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr
  cluster: notes
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-notes-app
  tag: "1.0.0"

# Per-component resourceTier (canonical-base: oya.resourceRequests dispatcher).
# See microservices/governance/iac/helm/_oya-helpers/templates/_helpers.tpl for
# canonical CPU/memory grids per tier letter.
noteStoreRest:
  replicas: 4
  resourceTier: M
  hpa:
    minReplicas: 4
    maxReplicas: 80
    targetCPUUtilizationPercentage: 70

tagGraphWorker:
  replicas: 2
  resourceTier: S

backlinkGraphWorker:
  replicas: 2
  resourceTier: S

collabEditGateway:
  replicas: 3
  resourceTier: M
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 70

searchIndexWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

webClipperBridgeRest:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 512Mi}

e2eKeyManagementApi:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 750m, memory: 512Mi}

importExportWorker:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1500m, memory: 2Gi}
  # ADR-0147: Pandoc/LibreOffice import-export = untrusted-content workload class.
  workloadClass: untrusted-content

# Substrate secrets via OpenBao SecretReference
openbao:
  postgresUrl: "${openbao:secret/notes/postgres-url}"
  valkeyUrl: "${openbao:secret/notes/valkey-url}"
  meilisearchKey: "${openbao:secret/notes/meilisearch-master-key}"
  s3AccessKey: "${openbao:secret/notes/s3-access-key}"
  s3SecretKey: "${openbao:secret/notes/s3-secret-key}"
  mlsRootKey: "${openbao:secret/notes/mls-root-key}"

meilisearch:
  enabled: true
