# Edge WAF + bot-management config — notes µservice
# Authority: ADR-0297
# UX-floor: ZERO friction on sync; ≤2ms p99 default-path latency.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: notes-edge-waf
  namespace: notes
spec:
  routes:
    - path: /v1/notes/sync
      action: sync
      rate_limit:
        per_ip_per_minute: 600
        per_tenant_per_minute_default: 6000
        per_tenant_per_minute_tier_1: 60000
        burst_multiplier: 2.0
      bot_management:
        mode: passive_score_no_challenge  # UX-floor: never block sync
    - path: /v1/notes/signup
      action: signup
      rate_limit:
        per_ip_per_minute: 5
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 80
        challenge_provider: turnstile
    - path: /v1/notes/share-link/*
      action: share_link
      rate_limit:
        per_ip_per_minute: 60
        per_tenant_per_minute_default: 600
      bot_management:
        mode: challenge_on_high_volume
        threshold_volume_per_minute: 20
    - path: /v1/notes/collab-edit
      action: collab_edit
      rate_limit:
        per_ip_per_minute: 6000
      bot_management:
        mode: passive_score_no_challenge

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  audit:
    emit_class_block: oya.notes.abuse-defence-block
    emit_class_allow: oya.notes.abuse-defence-allow
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
