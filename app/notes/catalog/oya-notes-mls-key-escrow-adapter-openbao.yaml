apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-notes-mls-key-escrow-adapter-openbao
  namespace: notes
spec:
  microservice: notes
  bounded_context: e2e-key-management
  layer: adapter
  language: rust
  binding_adrs:
    - ADR-NOTES-0001
    - ADR-0296
  backend: openbao
  emits_audit_classes:
    - oya.notes.mls-key-escrow-deposit
    - oya.notes.mls-key-escrow-recover
    - oya.notes.mls-key-rotate
  sidecar_ttl_seconds: 60
