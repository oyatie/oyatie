# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:notes:t0-suggest:v1
name: next-word-and-title-suggest
namespace: notes
display_name: Next-word + title suggestion
description: |
  T0 capability — micro-suggestions during typing (next word, title from first
  line). Lowest autonomy tier; user-keystroke-driven; refused on E2E content
  server-side; on-device-only fallback for Personal-tier via SDK.

owner_team: axis-notes + axis-foundry-runtime
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-NOTES-0001, ADR-NOTES-0005]
related_artifacts:
  - microservices/notes/PRD.md (FR-18; AC-03)
  - microservices/notes/policy/tenant-scope.cedar
  - microservices/notes/policy/e2e-personal-tier-default.md
  - microservices/notes/runbooks/ai-classifier-rollback-e2e-respect.md

autonomy_tier: T0
# T0 = micro-suggestion; user-keystroke-driven; zero autonomy; user
# accepts/rejects every output.

inputs:
  - name: note_id
    type: string
    required: true
  - name: invoking_user_ref
    type: string
    required: true
  - name: cursor_context
    type: string
    description: ≤ 256 characters of plaintext immediately preceding the cursor
    required: true
  - name: capability_kind
    type: enum
    values: [next_word, title_from_first_line]
    required: true
  - name: context_kind
    type: enum
    values: [Personal, Professional]
    required: true

outputs:
  - name: suggestion
    type: string
    description: short string (≤ 64 chars for next-word; ≤ 200 chars for title)
  - name: confidence
    type: number
    minimum: 0
    maximum: 1

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

context_kind_constraint:
  Personal: REFUSED server-side per ADR-NOTES-0005 + DCI-08. Client SDK MAY run on-device (Apple Intelligence on iOS/macOS; local LLM on desktop) if `on-device-ai` feature enabled; oyatie server is NOT involved.
  Professional: server-side via tenant-DEK; tenant-admin opt-in required; per-user consent enforced.

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    requires: signed BAA + explicit per-notebook opt-in
    reason: HIPAA 45 CFR §164.502(b) — minimum necessary
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: per Art. 50 transparency label on output
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required

evidence_topic: oya.notes.capability.t0_suggest.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0008
  cost_drivers:
    - LLM inference (small fast model; ≤ 100 tokens)
    - Cache hit probability ≈ 30 % (per-keystroke)

cedar_policy_fragments:
  - microservices/notes/policy/tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/notes/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.85
  eval_metric: prefix-accuracy@1 (next-word) + ROUGE-1 on title generation
  cadence: per-release
  reference: HellaSwag + LAMBADA + custom held-out from licensed corpus

e2e_refusal:
  enforced_at:
    - type_system: AssistInvoker::invoke(ProfessionalNoteRef) — refuses PersonalNoteRef
    - cedar: forbid Action::"invoke_ai_assist" when context_kind == "Personal"
    - ci_lane: oya-check-e2e-ai-refusal
    - runtime_metric: oya_notes_ai_call_blocked_e2e_total > 0 → Sev-1
  on_device_personal:
    allowed: true
    feature_flag: on-device-ai
    providers:
      - Apple Intelligence (iOS / macOS 26.0+ — explicit user-Intelligence-opt-in)
      - Local LLM via Tauri runtime (Linux / Windows / macOS desktop)

sunset:
  status: none
