# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Application Shell composition-root binaries
# Values for the application µservice per ADR-0131 + ADR-0121 + ADR-0123.

image:
  registry: registry.oyatie.dev
  repository: application
  pullPolicy: IfNotPresent

components:
  shellRouting:
    image:
      tag: "0.1.0"  # pinned per LTS policy
    replicas: 4   # HA + headroom; per capacity-model.md
    resources:
      requests: { cpu: 2, memory: 1Gi }
      limits:   { cpu: 4, memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 4
      maxReplicas: 50
      targetCPUUtilization: 70

  tenantContext:
    image: { tag: "0.1.0" }
    replicas: 2
    resources:
      requests: { cpu: 1, memory: 512Mi }
      limits:   { cpu: 2, memory: 1Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 20, targetCPUUtilization: 70 }

  authGatewayRest:
    image: { tag: "0.1.0" }
    replicas: 4
    resources:
      requests: { cpu: 2, memory: 1Gi }
      limits:   { cpu: 4, memory: 2Gi }
    hpa: { enabled: true, minReplicas: 4, maxReplicas: 50, targetCPUUtilization: 70 }

  authGatewayWorker:
    image: { tag: "0.1.0" }
    replicas: 2
    resources:
      requests: { cpu: 0.5, memory: 256Mi }
      limits:   { cpu: 1, memory: 512Mi }

  moduleLoader:
    image: { tag: "0.1.0" }
    replicas: 2
    resources:
      requests: { cpu: 1, memory: 512Mi }
      limits:   { cpu: 2, memory: 1Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 30, targetCPUUtilization: 70 }

  frontendBundleServeWorker:
    image: { tag: "0.1.0" }
    replicas: 2
    resources:
      requests: { cpu: 0.5, memory: 256Mi }
      limits:   { cpu: 1, memory: 512Mi }

# Secrets via OpenBao (per-pack); never in this file
openbao:
  enabled: true
  endpoint: http://openbao.cloud-secrets.svc.cluster.local:8200
  secrets:
    sessionHmac: "secret/application/<pack>/session-hmac"
    publisherKeys: "secret/application/<pack>/module-publisher-keys"
    oidcProviders: "secret/application/<pack>/oidc"
    samlProviders: "secret/application/<pack>/saml"
    cdnAdminToken: "secret/application/<pack>/cdn/admin-token"
    postgresCredentials: "secret/application/<pack>/postgres"

# Persistent state references (managed by sibling charts)
postgres:
  host: application-postgres-citus-coordinator.application.svc.cluster.local
  port: 5432
  database: application
  poolSize: 50

valkey:
  endpoint: application-valkey-cluster.application.svc.cluster.local:6379
  cluster: true
  ttlSecondsIdle: 900
  ttlSecondsAbsolute: 28800

# OIDC defaults per ADR-0123
oidc:
  algAllowList: [ES256, RS256]
  audienceSuffix: ".app.oyatie.dev"
  cookieDomain: ".app.oyatie.dev"
  jwksRefreshIntervalSeconds: 3600
  sessionEntropyBits: 256

cedar:
  policyDir: /etc/application/policy
  evalBudgetMs: 10
  failureBehavior: deny  # circuit-break to default-deny on timeout

csp:
  default: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://workflow-events.application.svc.cluster.local; frame-src 'self' https://*.app.oyatie.dev; frame-ancestors 'none'"

hsts:
  enabled: true
  maxAge: 31536000
  includeSubDomains: true
  preload: true

http3:
  enabled: true

# Observability wiring (consumed by observability)
otel:
  endpoint: http://observability-alloy.observability.svc.cluster.local:4317

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: true
  className: istio
  hosts:
    - host: "{tenant-hash}.app-{pack}.oyatie.dev"
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - secretName: app-tls-cert  # ACME-provisioned per pack
      hosts: ["*.app-{pack}.oyatie.dev"]
