openapi: 3.2.0
info:
  title: application
  version: 1.0.0
  summary: REST API for the Application Shell — sign-in, route resolve, module manifest, session, CDN purge
  description: |
    Tenant-facing + operator-facing REST surface for the Application Shell.
    All endpoints require OIDC + Cedar policy authorization (per
    `microservices/application/policy/*.cedar`) and are tenant-scoped via
    the host header + JWT `tenant_id` claim.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries the principal's tenant_id claim. The host header
    `<tenant-hash>.app.oyatie.com` MUST resolve to the same tenant; mismatch
    returns 401.

    Anonymous endpoints (login page, status, asset fetch) are governed by
    `policy/public-read.cedar`.
  contact:
    name: axis-application
    url: https://oyatie.com/teams/axis-application
  license:
    name: Internal
servers:
  - url: https://{tenant}.app-{pack}.oyatie.com/api/v1
    description: Per-pack tenant endpoint
    variables:
      tenant:
        default: example
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: application
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    SessionCookie:
      type: apiKey
      in: cookie
      name: app_session
  parameters:
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        pattern: '^user:[a-f0-9]{16}$'
    ModuleName:
      in: path
      name: module
      required: true
      schema:
        type: string
        pattern: '^oya-[a-z][a-z0-9-]*-module$'
    BundleVersion:
      in: path
      name: version
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
  schemas:
    SessionStartRequest:
      type: object
      required: [provider, redirect_uri, state, nonce, code_verifier_sha256]
      properties:
        provider: { type: string, enum: [oidc, saml] }
        redirect_uri: { type: string, format: uri }
        state: { type: string, minLength: 32 }
        nonce: { type: string, minLength: 32 }
        code_verifier_sha256: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    Session:
      type: object
      required: [session_id, tenant_id, user_id, started_at, expires_at]
      properties:
        session_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        mfa_factor: { type: string, enum: [none, totp, webauthn], default: none }
        ip_address: { type: string }
        user_agent: { type: string }
    RouteResolveResponse:
      type: object
      required: [route, tenant_scope, required_roles, pack_residency]
      properties:
        route: { type: string }
        tenant_scope: { type: string, enum: [global-public, tenant-scoped, cross-tenant-operator] }
        required_roles: { type: array, items: { type: string } }
        pack_residency: { type: string }
        admin_scope: { type: boolean, default: false }
        csp_module_id: { type: string }
        required_mfa: { type: string, enum: [none, totp, webauthn] }
    ModuleManifest:
      type: object
      required: [module, version, sri_hash, signer_key_id, signature, routes]
      properties:
        module: { type: string }
        version: { type: string }
        sri_hash: { type: string, pattern: '^sha384-[A-Za-z0-9+/=]+$' }
        signer_key_id: { type: string }
        signature: { type: string, description: 'detached Ed25519 over canonical CBOR of manifest body, base64url' }
        routes:
          type: array
          items: { $ref: '#/components/schemas/RouteResolveResponse' }
        bundle_url: { type: string, format: uri }
        published_at: { type: string, format: date-time }
    BundleVersionPointer:
      type: object
      required: [environment, active_sha, prior_sha]
      properties:
        environment: { type: string, enum: [dev, staging, production] }
        active_sha: { type: string }
        prior_sha: { type: string }
        promoted_at: { type: string, format: date-time }
    CdnPurgeRequest:
      type: object
      required: [pattern, reason]
      properties:
        pattern: { type: string }
        reason: { type: string }
    StatusSummary:
      type: object
      properties:
        pack: { type: string }
        overall: { type: string, enum: [operational, degraded, partial_outage, major_outage] }
        components:
          type: object
          additionalProperties:
            type: string
            enum: [operational, degraded, outage]
    Error:
      type: object
      required: [error_id, code, message]
      properties:
        error_id: { type: string }
        code: { type: string }
        message: { type: string }
        correlation_id: { type: string }

paths:
  /health:
    get:
      summary: Liveness probe (anonymous)
      operationId: get_health
      security: []
      responses:
        '200': { description: alive }
  /ready:
    get:
      summary: Readiness probe (anonymous)
      operationId: get_ready
      security: []
      responses:
        '200': { description: ready }
        '503': { description: not ready }
  /status:
    get:
      summary: Public status page summary (anonymous; public-class only)
      operationId: get_status
      security: []
      responses:
        '200':
          description: status summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSummary' }
  /auth/start:
    post:
      summary: Begin OIDC/SAML sign-in flow (issues state + nonce + PKCE)
      operationId: start_auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionStartRequest' }
      responses:
        '302':
          description: Redirect to IdP authorize endpoint
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
  /auth/callback:
    get:
      summary: OIDC callback (IdP returns; verify + create session)
      operationId: auth_callback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to post-login path
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly + Secure + SameSite=Lax session cookie
  /auth/saml/callback:
    post:
      summary: SAML POST callback (IdP returns; XSW-hardened verify)
      operationId: saml_callback
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        '302': { description: Redirect to post-login path }
  /auth/session:
    get:
      summary: Read current session (refreshes idle TTL)
      operationId: get_session
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: no session }
    delete:
      summary: Sign out (revoke session)
      operationId: delete_session
      security: [{ SessionCookie: [] }]
      responses:
        '204': { description: signed out }
  /routes/resolve:
    get:
      summary: Resolve a route's scope (used by SSR + module-loader)
      operationId: resolve_route
      security: [{ OIDC: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResolveResponse' }
        '403': { description: forbidden (Cedar deny) }
  /modules/{module}/manifest:
    get:
      summary: Read a product module's signed manifest
      operationId: get_module_manifest
      security: [{ OIDC: [] }]
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      responses:
        '200':
          description: manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleManifest' }
  /modules/{module}/manifest:publish:
    post:
      summary: Publish a new module manifest (ServiceAccount ci-publish only)
      operationId: publish_module_manifest
      security: [{ OIDC: [] }]
      parameters:
        - $ref: '#/components/parameters/ModuleName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleManifest' }
      responses:
        '201':
          description: published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleManifest' }
        '400': { description: signature / SRI invalid }
        '403': { description: not authorized (publisher key mismatch) }
  /bundles/{module}/pointer:
    get:
      summary: Read current bundle pointer (environment, active SHA, prior SHA)
      operationId: get_bundle_pointer
      security: [{ OIDC: [] }]
      parameters:
        - $ref: '#/components/parameters/ModuleName'
        - in: query
          name: environment
          schema: { type: string, enum: [dev, staging, production] }
      responses:
        '200':
          description: pointer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundleVersionPointer' }
  /cdn/purge:
    post:
      summary: Trigger CDN purge (operator only; sealed)
      operationId: purge_cdn
      security: [{ OIDC: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CdnPurgeRequest' }
      responses:
        '202': { description: purge accepted; jobs enqueued }
        '403': { description: operator role required }

security:
  - OIDC: []
