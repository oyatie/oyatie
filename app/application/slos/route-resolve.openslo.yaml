# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: application-route-resolve
  microservice: application
  display_name: Application Shell — Route Resolution Latency
spec:
  service: application-shell-routing-rest
  description: |
    Server-side route resolve (Cedar evaluation + Postgres registry lookup)
    p99 must stay under 100 ms per PRD §"Performance".
  indicator:
    metricSource:
      type: Prometheus
      spec:
        query: |
          histogram_quantile(0.99,
            sum by (le, pack, tenant_id) (
              rate(application_route_resolve_seconds_bucket[5m])
            )
          )
  objectives:
    - target: 0.999
      threshold: 0.1
  timeWindow:
    - duration: 30d
      isRolling: true
