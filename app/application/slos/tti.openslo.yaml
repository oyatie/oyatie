# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-application-tti
  microservice: application
  display_name: Application Shell — Time-to-Interactive (TTI)
spec:
  service: application-shell-frontend
  description: |
    The p99 time-to-interactive for the Application Shell warm-cache path
    must stay under 2 s per `microservices/application/PRD.md` §"Performance"
    and `feedback_quality_performance_scalability_bar.md`.
  indicator:
    metricSource:
      type: Prometheus
      spec:
        query: |
          histogram_quantile(0.99,
            sum by (le, pack, tenant_id) (
              rate(oya_application_tti_seconds_bucket{cache="warm"}[5m])
            )
          )
  objectives:
    - target: 0.999
      threshold: 2.0
  timeWindow:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - microservices/application/slos/burn-rate-tti.yaml
