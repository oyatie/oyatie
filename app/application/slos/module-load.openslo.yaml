# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: application-module-load
  microservice: application
  display_name: Application Shell — Module Load Success Rate
spec:
  service: application-module-loader-rest
  description: |
    Module load success rate (loaded vs. total attempts, excluding cedar-deny
    which is an authorization decision not a failure) must stay above 99.9 %
    per PRD §"Performance" and threat-model.md §M-04.
  indicator:
    ratioMetric:
      counter: true
      good:
        metricSource:
          type: Prometheus
          spec:
            query: |
              sum by (pack, module) (
                rate(application_module_load_total{result="loaded"}[5m])
              )
      total:
        metricSource:
          type: Prometheus
          spec:
            query: |
              sum by (pack, module) (
                rate(application_module_load_total{result!="cedar_deny"}[5m])
              )
  objectives:
    - target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
