# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:application:shell-render:v1
name: shell-render
namespace: application
display_name: Render Shell Frame
description: |
  Render the Application Shell HTML frame for a tenant + user, including hydration
  payload, the Leptos WASM bundle URL with SRI hash, and the active module-loader
  manifest list. Server-side rendered (Leptos SSR) with scheduled-for-distinct-tracked-work client hydration.

owner_team: axis-application
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0065, ADR-0121, ADR-0123, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/application/PRD.md
  - microservices/application/contracts/openapi/application.yaml
  - microservices/application/policy/tenant-scope.cedar
  - microservices/application/policy/route-isolation.md

autonomy_tier: T1
# T1 = read-only render; no side-effects beyond observability metric emission.
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: user_id
    type: string
    pattern: '^user:[a-f0-9]{16}$'
    required: true
  - name: requested_path
    type: string
    required: false
  - name: pack
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
    required: true

outputs:
  - name: shell_html
    type: string
    description: 'SSR-rendered HTML with hydration payload + WASM bundle <link> + SRI'
  - name: bundle_url
    type: string
  - name: sri_hash
    type: string
    pattern: '^sha384-'
  - name: module_manifest_urls
    type: array
  - name: render_time_ms
    type: integer

data_classes_touched:
  - PII_IDENTIFYING   # user_id may surface in hydration payload (encrypted-at-edge if PII)
  - INTERNAL_ONLY     # route registry data
  - AUDIT             # render event emitted

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.application.shell.render

cost_profile:
  type: per-render
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - Leptos SSR compute
    - Postgres cache-miss lookup for route registry (rare)

cedar_policy_fragments:
  - microservices/application/policy/tenant-scope.cedar
  - microservices/application/policy/public-read.cedar

eval_set:
  canonical_inputs_path: microservices/application/capabilities/eval/shell-render-canonical.jsonl
  pass_threshold: 0.99
  eval_metric: render-correctness-against-reference-html
  cadence: per-release

sunset:
  status: none
  notes: ""
