# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-sheets-import-export
  labels:
    oyatie/microservice: sheets
handler: runsc
scheduling:
  nodeSelector:
    oyatie/runtime-class: gvisor
overhead:
  podFixed:
    cpu: 100m
    memory: 64Mi
