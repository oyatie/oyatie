# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
image:
  registry: registry.oyatie.dev
  repository: sheets/cell-grid-rest
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 4

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

# Per-tenant workbook session cap; per threat-model T-D-01
perTenantSessionCap: 50

# OIDC + Cedar enforcement settings
oidc:
  issuer: https://auth.oyatie.com
  audience: sheets
  jwksCacheSeconds: 300

cedar:
  evaluatorEndpoint: "http://license-gate-cedar.sheets.svc.cluster.local:8080"
  rangeAclEvaluatorEndpoint: "http://license-gate-cedar.sheets.svc.cluster.local:8080/range-acl"
  failClosed: true  # T-D-07 invariant: cedar crash → 503, never fail-open

# Service mesh
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

# HPA
hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 2

# NetworkPolicy egress allowlist (cross-µservice SDK consumers per LEAN-A2)
networkPolicy:
  enabled: true
  egress:
    - to: cell.cell.svc.cluster.local
      ports: [8080, 9090]
    - to: ontology.ontology.svc.cluster.local
      ports: [8080]
    - to: foundry-runtime.foundry-runtime.svc.cluster.local
      ports: [8080]
    - to: tenancy.tenancy.svc.cluster.local
      ports: [8080]
    - to: audit-chain.audit-chain.svc.cluster.local
      ports: [8080]
    - to: workflow-engine.workflow-engine.svc.cluster.local
      ports: [8080]
    - to: docs.docs.svc.cluster.local
      ports: [8080]
    - to: slides.slides.svc.cluster.local
      ports: [8080]
    - to: drive.drive.svc.cluster.local
      ports: [8080]
    - to: forms.forms.svc.cluster.local
      ports: [8080]
    - to: mail.mail.svc.cluster.local
      ports: [8080]
    - to: community.community.svc.cluster.local
      ports: [8080]
    - to: sheets-postgres-primary.sheets.svc.cluster.local
      ports: [5432]
    - to: sheets-valkey-primary.sheets.svc.cluster.local
      ports: [6379]

# Secret references (OpenBao)
secrets:
  spiffeIdentityPath: "secret/sheets/cell-grid-rest/spiffe"
  postgresConnectionPath: "secret/sheets/cell-grid-rest/postgres"
  valkeyAuthPath: "secret/sheets/cell-grid-rest/valkey"
  ed25519SigningKeyPath: "secret/sheets/audit-chain/signing-key"
  ociObjectStorageCredsPath: "secret/sheets/oci-object-storage/creds"
  foundryRuntimeTokenPath: "secret/sheets/foundry-runtime/token"

# Prometheus monitoring
serviceMonitor:
  enabled: true
  interval: 30s
  endpoints:
    - port: metrics
      path: /metrics

# PrometheusRule for SLO alerts
prometheusRule:
  enabled: true
  ruleFiles:
    - /etc/sheets/recording-rules/editor-rest.yaml
    - /etc/sheets/alerts/editor-rest-burn-rate.yaml
