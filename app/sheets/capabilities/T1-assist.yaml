# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:sheets:t1-assist:v1
name: t1-assist
namespace: sheets
display_name: Sheets T1 — Smart-fill + formula-from-natural-language + anomaly-flag (advisory; human reviews)
description: |
  T1-tier capability: sheets bridges to foundry-runtime for three advisory features:

  1. Smart-fill: tenant provides 3-10 seed cells; foundry-runtime ML inference proposes
     values for the remaining range based on inferred column pattern (e.g., parse
     emails, extract domains, capitalize names). Tenant accepts/rejects.

  2. Formula-from-natural-language: tenant prose ("calculate average revenue per region
     for Q3") drafts a candidate formula; tenant reviews + accepts.

  3. Anomaly-flag: foundry-runtime scans a column for outliers + surfaces with
     "investigate?" tooltip; tenant decides.

  All three are advisory; the LLM/ML proposes, the human disposes. No autonomous mutation.

  All three pipelines:
  1. PII-redacted before ML/LLM submission (per threat-model T-I-05).
  2. Prompt-injection-scrubbed (per threat-model T-S-05).
  3. Formula-engine grammar-validated against the canonical ≥400-function library per
     ADR-SHEETS-0002 BEFORE editor surfaces it.
  4. Surfaced to the human author for explicit accept/reject; never auto-applied.

owner_team: axis-sheets + foundry-runtime-team
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-SHEETS-0002, ADR-SHEETS-0005]
related_specs: [/specs/app/sheets.json]
related_artifacts:
  - app/sheets/PRD.md FR-14 + FR-15 + AC-05 + AC-16
  - app/sheets/threat-model.md §"T-I-05" + §"T-S-05" + §"T-D-05"
  - app/sheets/runbooks/ai-formula-disable.md
  - app/sheets/contracts/openapi/sheets.yaml /ai-formula:draft + /smart-fill:infer

autonomy_tier: T1
# T1 = advisory; LLM/ML proposes, human disposes.

risk_classification:
  default: limited-risk-ai-system  # Annex III §10 (advisory drafting) per ADR-SHEETS-0005
  conditional_high_risk:
    - "AI-formula drafting in credit-scoring workflow (Annex III §5(b))"
    - "AI-formula drafting in insurance pricing workflow (Annex III §5(c))"
    - "AI-formula drafting in employment-decision workflow (Annex III §4)"
  obligations_when_high_risk:
    - "Conformity assessment required pre-deployment (Art. 9)"
    - "Transparency obligation: tenant operator UI shows 'AI-generated; review before accept' (Art. 13)"
    - "Human oversight: explicit-accept (never auto-apply) per FR-14 + FR-15 (Art. 14)"
    - "Record-keeping: 90d retention of prompt + completion (Art. 12)"
    - "Post-market monitoring: monthly review of acceptance + revert rate (Art. 72)"

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: workbook_id
    type: string
    required: true
  - name: sheet_id
    type: string
    required: true
  - name: subcapability
    type: enum
    values: [smart_fill, formula_from_nl, anomaly_flag]
    required: true
  - name: prose
    type: string
    max_length: 10000
    required_if: formula_from_nl
  - name: seed_cells
    type: array
    min_items: 3
    max_items: 10
    required_if: smart_fill
  - name: range
    type: string
    required_if: smart_fill | anomaly_flag
  - name: cell_ref
    type: string
    required_if: formula_from_nl
  - name: consent_acknowledged
    type: boolean
    required: true
    description: |
      Must be true; per tenant-scope.cedar PERMIT 5, AI-formula invocation requires
      explicit per-session consent click.
  - name: target_jurisdiction
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]
    required: false
    default: base

outputs:
  formula_from_nl:
    - name: draft_id
      type: string
    - name: candidate_formula
      type: string
      description: "starts with '='"
    - name: grammar_valid
      type: boolean
    - name: validation_errors
      type: array
    - name: prompt_injection_detected
      type: boolean
    - name: pii_redacted_count
      type: integer
    - name: provider_routed
      type: string
  smart_fill:
    - name: inference_id
      type: string
    - name: inferred_cells
      type: array
      item_schema: Cell (per contracts/openapi/sheets.yaml)
    - name: confidence
      type: number  # 0.0..1.0
  anomaly_flag:
    - name: anomaly_id
      type: string
    - name: flagged_cells
      type: array
      item_schema:
        cell_ref: string
        anomaly_score: number  # 0.0..1.0
        explanation: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # Tenant prose / seed cells may contain BEHAVIORAL_TENANT_PRODUCT signal.
  - PII_QUASI_IDENTIFIER
  # Prose / seed cells occasionally mention end-user data; redactor scrubs before submission.
  - AUDIT
  # Every invocation audit-sealed.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.sheets.ai-formula.draft

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.02
  cost_drivers:
    - LLM provider token usage (typical prose 100-500 tokens; completion 50-200 tokens for formulas)
    - ML inference token usage for smart-fill (typical 3-10 seed → 100-row inference)
    - PII redactor + injection classifier (sub-millisecond)
    - Formula-engine grammar validation on completion
    - foundry-runtime SDK overhead

cedar_policy_fragments:
  - app/sheets/policy/tenant-scope.cedar  # PERMIT 5
  - app/sheets/policy/ci-scope.cedar

eval_set:
  reference_inputs_path: app/sheets/capabilities/eval/t1-assist-reference.jsonl
  pass_threshold: 0.80
  eval_metric: |
    Composite per subcapability:
    Smart-fill:
      (a) inference accuracy ≥ 80% on 3-cell-seed corpus per AC-16;
      (b) human-author-accept rate (proxy via reviewer panel);
      (c) PII-leak rate (must be < 0.1% of invocations).
    Formula-from-NL:
      (a) grammar_valid_rate over corpus of 100 prose inputs;
      (b) human-author-accept rate;
      (c) prompt-injection-bypass rate (must be 0%);
      (d) PII-leak rate (< 0.1%).
    Anomaly-flag:
      (a) precision + recall on labelled-outlier corpus;
      (b) false-positive rate;
      (c) tenant-action-taken-on-flag rate.
  cadence: per-release
  reference: |
    Test corpus authored by axis-sheets + council-design-system + foundry-runtime-team;
    covers 5 domain packs × 3 complexity tiers. Adversarial-set covers prompt-injection
    vectors from OWASP Top 10 LLM A01 + curated by ops-security.

regulatory_compliance:
  ai_act_2024_1689:
    classification: limited-risk-ai-system (default) / high-risk (conditional per ADR-SHEETS-0005)
    arts_applicable: [Art. 9 risk management, Art. 13 transparency, Art. 14 human oversight, Art. 50 transparency to users]
    transparency_obligation: tenant operator UI shows "AI-generated; review before accept"
    human_oversight: explicit-accept (never auto-apply) per FR-14 + FR-15
  gdpr_2016_679:
    art_22: "Sheets AI-formula is advisory; no solely-automated-with-legal-effect decision"
    art_32: "PII redactor + audit-chain seal"

sunset:
  status: none
  notes: ""
