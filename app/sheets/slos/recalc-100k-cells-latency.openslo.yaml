# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-sheets-recalc-100k-cells-latency
  displayName: Sheets — Recalc 100k-cell sheet latency
  labels:
    microservice: sheets
    bounded_context: recalc-engine
    tier: external-facing
    plane: data
spec:
  service: oya-sheets-recalc-engine-worker
  description: |
    Recalc-engine latency SLI for 100k-cell sheets. GA target: 95% under 1s (per PRD AC-07).
  indicator:
    metadata:
      name: recalc-100k-cells-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_recalc_100k_seconds_bucket{le="1.0"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_recalc_100k_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of 100k-cell recalcs under 1s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
