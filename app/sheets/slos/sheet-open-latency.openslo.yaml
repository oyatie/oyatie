# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-sheets-sheet-open-latency
  displayName: Sheets — Sheet-open latency (cold + warm)
  labels:
    microservice: sheets
    bounded_context: cell-grid
    tier: external-facing
    plane: data
spec:
  service: oya-sheets-cell-grid-rest
  description: |
    Sheet-open latency SLI. The percentage of sheet-open operations that complete under
    the cold-load budget. GA target: 95% under 400ms for cold open (10k cells, CDN-cached).
  indicator:
    metadata:
      name: sheet-open-cold-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_sheet_open_cold_seconds_bucket{le="0.4"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_sheet_open_cold_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of cold sheet-opens under 400ms (10k cells, CDN-cached)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: sheet-open-latency-budget-breach
      spec:
        description: Sheet-open p95 budget breached
        notificationTargets:
          - target: grafana-oncall:sheets-ticket
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 1
              lookbackWindow: 15m
              alertAfter: 10m
