# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-sheets-cell-edit-render-latency
  displayName: Sheets — Cell-edit-render latency (60fps cap)
  labels:
    microservice: sheets
    bounded_context: cell-grid
    tier: external-facing
    plane: data
spec:
  service: oya-sheets-cell-grid-adapter-leptos-wasm
  description: |
    Cell-edit-render latency SLI. The percentage of cell-edit-render operations that complete
    under the 60fps budget. GA target: 99% under 50ms (per PRD AC-10).
  indicator:
    metadata:
      name: cell-edit-render-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_cell_edit_render_seconds_bucket{le="0.05"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_cell_edit_render_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% of cell-edit-render under 50ms (60fps cap)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
