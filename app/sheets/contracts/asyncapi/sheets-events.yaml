asyncapi: 3.1.0
info:
  title: oya-sheets — workbook + cell-edit + collab + audit events
  version: 1.0.0
  summary: Workbook session, cell-edit, save, collab, AI-formula, license-gate, sharing, range-ACL, XLSX import/export, connected-sheets, version-history, embed-bridge, trigger-bridge events
  description: |
    Cross-µservice events emitted and consumed by sheets. Per ADR-0135 net-new µservice, Sheets
    publishes events for: workbook session lifecycle, cell-edit (sampled), save, collab CRDT merge /
    conflict, license-gate, share + range-ACL change, jurisdiction switch, AI-formula draft, smart-fill
    inferred, connected-sheets refresh, XLSX import/export complete, formula-engine version change,
    workbook embedded, edit-triggers-workflow dispatch.

    Sheets CONSUMES events for ontology type-descriptor updates, tenancy seat-limit updates,
    workflow-engine workflow-definition updates, forms response-appended (cross-product flow),
    drive workbook-moved.

    All events Ed25519-sealed per Bominal ADR-0028 audit-chain.

    Consumers:
    - audit-chain µservice (Ed25519 seal of every event)
    - observability µservice (SLI emission)
    - tenancy µservice (per-seat billing)
    - workflow-engine µservice (trigger-bridge dispatch)
    - foundry-runtime µservice (AI-formula downstream audit)
    - docs / slides µservices (embed-bridge lifecycle)
  contact:
    name: axis-sheets

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.sheets.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus consumed by audit-chain + observability + tenancy + workflow-engine
  collab-websocket:
    host: collab.sheets.svc.cluster.local
    protocol: ws
    description: Per-tenant per-workbook WebSocket fan-out (CRDT ops + recalc-progress)

channels:
  workbook-opened:
    address: workflow-events/workbook.opened
    messages:
      WorkbookOpenedMessage:
        $ref: '#/components/messages/WorkbookOpened'

  workbook-closed:
    address: workflow-events/workbook.closed
    messages:
      WorkbookClosedMessage:
        $ref: '#/components/messages/WorkbookClosed'

  workbook-saved:
    address: workflow-events/workbook.saved
    messages:
      WorkbookSavedMessage:
        $ref: '#/components/messages/WorkbookSaved'

  cell-edited:
    address: workflow-events/cell.edited
    messages:
      CellEditedMessage:
        $ref: '#/components/messages/CellEdited'
    description: 'Sampled; full-fidelity for pack-us-healthcare; configurable per-pack sampling for others.'

  collab-merged:
    address: workflow-events/collab.merged
    messages:
      CollabMergedMessage:
        $ref: '#/components/messages/CollabMerged'

  collab-conflict-surfaced:
    address: workflow-events/collab.conflict_surfaced
    messages:
      CollabConflictSurfacedMessage:
        $ref: '#/components/messages/CollabConflictSurfaced'

  license-gate-emitted:
    address: workflow-events/license.gate_emitted
    messages:
      LicenseGateEmittedMessage:
        $ref: '#/components/messages/LicenseGateEmitted'

  share-acl-changed:
    address: workflow-events/share_acl.changed
    messages:
      ShareAclChangedMessage:
        $ref: '#/components/messages/ShareAclChanged'

  formula-engine-version-changed:
    address: workflow-events/formula_engine.version_changed
    messages:
      FormulaEngineVersionChangedMessage:
        $ref: '#/components/messages/FormulaEngineVersionChanged'

  xlsx-imported:
    address: workflow-events/xlsx.imported
    messages:
      XlsxImportedMessage:
        $ref: '#/components/messages/XlsxImported'

  xlsx-exported:
    address: workflow-events/xlsx.exported
    messages:
      XlsxExportedMessage:
        $ref: '#/components/messages/XlsxExported'

  ai-formula-draft-requested:
    address: workflow-events/ai_formula.draft_requested
    messages:
      AiFormulaDraftRequestedMessage:
        $ref: '#/components/messages/AiFormulaDraftRequested'

  ai-formula-draft-accepted:
    address: workflow-events/ai_formula.draft_accepted
    messages:
      AiFormulaDraftAcceptedMessage:
        $ref: '#/components/messages/AiFormulaDraftAccepted'

  smart-fill-inferred:
    address: workflow-events/smart_fill.inferred
    messages:
      SmartFillInferredMessage:
        $ref: '#/components/messages/SmartFillInferred'

  connected-query-refreshed:
    address: workflow-events/connected_query.refreshed
    messages:
      ConnectedQueryRefreshedMessage:
        $ref: '#/components/messages/ConnectedQueryRefreshed'

  workbook-embedded:
    address: workflow-events/workbook.embedded
    messages:
      WorkbookEmbeddedMessage:
        $ref: '#/components/messages/WorkbookEmbedded'

  edit-trigger-dispatched:
    address: workflow-events/edit_trigger.dispatched
    messages:
      EditTriggerDispatchedMessage:
        $ref: '#/components/messages/EditTriggerDispatched'

  ontology-type-descriptor-updated:
    address: workflow-events/ontology.type_descriptor_updated
    messages:
      OntologyTypeDescriptorUpdatedMessage:
        $ref: '#/components/messages/OntologyTypeDescriptorUpdated'

  tenant-seat-limit-updated:
    address: workflow-events/tenant.seat_limit_updated
    messages:
      TenantSeatLimitUpdatedMessage:
        $ref: '#/components/messages/TenantSeatLimitUpdated'

  workflow-definition-updated:
    address: workflow-events/workflow.definition_updated
    messages:
      WorkflowDefinitionUpdatedMessage:
        $ref: '#/components/messages/WorkflowDefinitionUpdated'

  forms-response-appended:
    address: workflow-events/forms.response_appended
    messages:
      FormsResponseAppendedMessage:
        $ref: '#/components/messages/FormsResponseAppended'

operations:
  emitWorkbookOpened:
    action: send
    channel: {$ref: '#/channels/workbook-opened'}
  emitWorkbookClosed:
    action: send
    channel: {$ref: '#/channels/workbook-closed'}
  emitWorkbookSaved:
    action: send
    channel: {$ref: '#/channels/workbook-saved'}
  emitCellEdited:
    action: send
    channel: {$ref: '#/channels/cell-edited'}
  emitCollabMerged:
    action: send
    channel: {$ref: '#/channels/collab-merged'}
  emitCollabConflictSurfaced:
    action: send
    channel: {$ref: '#/channels/collab-conflict-surfaced'}
  emitLicenseGateEmitted:
    action: send
    channel: {$ref: '#/channels/license-gate-emitted'}
  emitShareAclChanged:
    action: send
    channel: {$ref: '#/channels/share-acl-changed'}
  emitFormulaEngineVersionChanged:
    action: send
    channel: {$ref: '#/channels/formula-engine-version-changed'}
  emitXlsxImported:
    action: send
    channel: {$ref: '#/channels/xlsx-imported'}
  emitXlsxExported:
    action: send
    channel: {$ref: '#/channels/xlsx-exported'}
  emitAiFormulaDraftRequested:
    action: send
    channel: {$ref: '#/channels/ai-formula-draft-requested'}
  emitAiFormulaDraftAccepted:
    action: send
    channel: {$ref: '#/channels/ai-formula-draft-accepted'}
  emitSmartFillInferred:
    action: send
    channel: {$ref: '#/channels/smart-fill-inferred'}
  emitConnectedQueryRefreshed:
    action: send
    channel: {$ref: '#/channels/connected-query-refreshed'}
  emitWorkbookEmbedded:
    action: send
    channel: {$ref: '#/channels/workbook-embedded'}
  emitEditTriggerDispatched:
    action: send
    channel: {$ref: '#/channels/edit-trigger-dispatched'}
  consumeOntologyTypeDescriptorUpdated:
    action: receive
    channel: {$ref: '#/channels/ontology-type-descriptor-updated'}
  consumeTenantSeatLimitUpdated:
    action: receive
    channel: {$ref: '#/channels/tenant-seat-limit-updated'}
  consumeWorkflowDefinitionUpdated:
    action: receive
    channel: {$ref: '#/channels/workflow-definition-updated'}
  consumeFormsResponseAppended:
    action: receive
    channel: {$ref: '#/channels/forms-response-appended'}

components:
  messages:
    WorkbookOpened:
      name: WorkbookOpened
      payload: {$ref: '#/components/schemas/WorkbookOpenedPayload'}
    WorkbookClosed:
      name: WorkbookClosed
      payload: {$ref: '#/components/schemas/WorkbookClosedPayload'}
    WorkbookSaved:
      name: WorkbookSaved
      payload: {$ref: '#/components/schemas/WorkbookSavedPayload'}
    CellEdited:
      name: CellEdited
      payload: {$ref: '#/components/schemas/CellEditedPayload'}
    CollabMerged:
      name: CollabMerged
      payload: {$ref: '#/components/schemas/CollabMergedPayload'}
    CollabConflictSurfaced:
      name: CollabConflictSurfaced
      payload: {$ref: '#/components/schemas/CollabConflictSurfacedPayload'}
    LicenseGateEmitted:
      name: LicenseGateEmitted
      payload: {$ref: '#/components/schemas/LicenseGateEmittedPayload'}
    ShareAclChanged:
      name: ShareAclChanged
      payload: {$ref: '#/components/schemas/ShareAclChangedPayload'}
    FormulaEngineVersionChanged:
      name: FormulaEngineVersionChanged
      payload: {$ref: '#/components/schemas/FormulaEngineVersionChangedPayload'}
    XlsxImported:
      name: XlsxImported
      payload: {$ref: '#/components/schemas/XlsxImportedPayload'}
    XlsxExported:
      name: XlsxExported
      payload: {$ref: '#/components/schemas/XlsxExportedPayload'}
    AiFormulaDraftRequested:
      name: AiFormulaDraftRequested
      payload: {$ref: '#/components/schemas/AiFormulaDraftRequestedPayload'}
    AiFormulaDraftAccepted:
      name: AiFormulaDraftAccepted
      payload: {$ref: '#/components/schemas/AiFormulaDraftAcceptedPayload'}
    SmartFillInferred:
      name: SmartFillInferred
      payload: {$ref: '#/components/schemas/SmartFillInferredPayload'}
    ConnectedQueryRefreshed:
      name: ConnectedQueryRefreshed
      payload: {$ref: '#/components/schemas/ConnectedQueryRefreshedPayload'}
    WorkbookEmbedded:
      name: WorkbookEmbedded
      payload: {$ref: '#/components/schemas/WorkbookEmbeddedPayload'}
    EditTriggerDispatched:
      name: EditTriggerDispatched
      payload: {$ref: '#/components/schemas/EditTriggerDispatchedPayload'}
    OntologyTypeDescriptorUpdated:
      name: OntologyTypeDescriptorUpdated
      payload: {$ref: '#/components/schemas/OntologyTypeDescriptorUpdatedPayload'}
    TenantSeatLimitUpdated:
      name: TenantSeatLimitUpdated
      payload: {$ref: '#/components/schemas/TenantSeatLimitUpdatedPayload'}
    WorkflowDefinitionUpdated:
      name: WorkflowDefinitionUpdated
      payload: {$ref: '#/components/schemas/WorkflowDefinitionUpdatedPayload'}
    FormsResponseAppended:
      name: FormsResponseAppended
      payload: {$ref: '#/components/schemas/FormsResponseAppendedPayload'}

  schemas:
    Common:
      type: object
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        pack: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]}
        occurred_at: {type: string, format: date-time}
        event_id: {type: string}
        signature: {type: string, description: Ed25519}

    WorkbookOpenedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [session_id, workbook_id, user_oidc_sub, license_decision]
          properties:
            session_id: {type: string}
            workbook_id: {type: string}
            user_oidc_sub: {type: string}
            license_decision: {type: string, enum: [allow, deny_no_seat, deny_revoked]}
            seat_count_used: {type: integer}
            seat_count_limit: {type: integer}

    WorkbookClosedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [session_id]
          properties:
            session_id: {type: string}
            close_reason: {type: string, enum: [user_close, idle_timeout, ws_disconnect, license_revoked]}

    WorkbookSavedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, version_sha, parent_version_sha, author_oidc_sub, audit_chain_seal]
          properties:
            workbook_id: {type: string}
            version_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
            parent_version_sha: {type: string, nullable: true}
            author_oidc_sub: {type: string}
            audit_chain_seal: {type: string}
            target_environment: {type: string, enum: [draft, staging, production]}
            cedar_preview_acknowledged: {type: boolean}
            cell_ops_count: {type: integer}

    CellEditedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, sheet_id, cell_ref, op, author_oidc_sub]
          properties:
            workbook_id: {type: string}
            sheet_id: {type: string}
            cell_ref: {type: string}
            op: {type: string, enum: [set_value, set_formula, set_format, delete]}
            old_value_hash: {type: string, description: BLAKE3 hash of prior value}
            new_value_hash: {type: string, description: BLAKE3 hash of new value}
            author_oidc_sub: {type: string}
            data_class: {type: string}

    CollabMergedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, op_count, merged_seq]
          properties:
            workbook_id: {type: string}
            op_count: {type: integer}
            merged_seq: {type: integer}
            participants: {type: array, items: {type: string}}

    CollabConflictSurfacedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, conflict_id, branches]
          properties:
            workbook_id: {type: string}
            conflict_id: {type: string}
            cell_ref: {type: string, description: 'cell where conflict surfaced'}
            branches:
              type: array
              items:
                type: object
                properties:
                  branch_id: {type: string}
                  author_oidc_sub: {type: string}
                  ops_summary: {type: string}
            resolution: {type: string, enum: [pending, branch_a_accepted, branch_b_accepted, merged_manually]}

    LicenseGateEmittedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [principal_oidc_sub, decision, seat_count_used, seat_count_limit]
          properties:
            principal_oidc_sub: {type: string}
            decision: {type: string, enum: [allow, deny_no_seat, deny_revoked, deny_unknown_principal]}
            seat_count_used: {type: integer}
            seat_count_limit: {type: integer}
            cedar_policy_sha: {type: string}

    ShareAclChangedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, change_kind, old_acl_hash, new_acl_hash, actor_oidc_sub]
          properties:
            workbook_id: {type: string}
            change_kind: {type: string, enum: [share_granted, share_revoked, range_acl_added, range_acl_modified, range_acl_removed]}
            old_acl_hash: {type: string}
            new_acl_hash: {type: string}
            actor_oidc_sub: {type: string}
            target_principal: {type: string, description: 'principal that gained/lost access'}
            range_id: {type: string, nullable: true}

    FormulaEngineVersionChangedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [old_version, new_version, corpus_pass_rate]
          properties:
            old_version: {type: string}
            new_version: {type: string}
            corpus_pass_rate: {type: number, description: 'fraction of LibreOffice Calc reference corpus passing'}
            release_id: {type: string}

    XlsxImportedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [job_id, workbook_id, fidelity_warnings_count]
          properties:
            job_id: {type: string}
            workbook_id: {type: string}
            source_size_bytes: {type: integer}
            cell_count: {type: integer}
            fidelity_warnings_count: {type: integer, description: 'count of best-effort downgrades per ADR-SHEETS-0007'}
            av_scan_result: {type: string, enum: [clean, av_positive_refused]}

    XlsxExportedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [job_id, workbook_id, output_size_bytes]
          properties:
            job_id: {type: string}
            workbook_id: {type: string}
            output_size_bytes: {type: integer}
            fidelity_tier: {type: string, enum: [best_effort]}
            acl_masked_cell_count: {type: integer, description: 'cells masked due to per-range ACL'}

    AiFormulaDraftRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [draft_id, workbook_id, sheet_id, cell_ref, prompt_hash, consent_acknowledged]
          properties:
            draft_id: {type: string}
            workbook_id: {type: string}
            sheet_id: {type: string}
            cell_ref: {type: string}
            prompt_hash: {type: string}
            pii_redacted_count: {type: integer}
            prompt_injection_detected: {type: boolean}
            consent_acknowledged: {type: boolean}
            provider_routed: {type: string}
            ai_act_high_risk: {type: boolean, description: 'high-risk classification per ADR-SHEETS-0005'}

    AiFormulaDraftAcceptedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [draft_id, workbook_id, accepted_version_sha]
          properties:
            draft_id: {type: string}
            workbook_id: {type: string}
            accepted_version_sha: {type: string}
            user_modifications_before_accept: {type: integer}

    SmartFillInferredPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [inference_id, workbook_id, range, confidence]
          properties:
            inference_id: {type: string}
            workbook_id: {type: string}
            range: {type: string}
            seed_cell_count: {type: integer}
            inferred_cell_count: {type: integer}
            confidence: {type: number}

    ConnectedQueryRefreshedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [query_id, workbook_id, refresh_kind, row_count]
          properties:
            query_id: {type: string}
            workbook_id: {type: string}
            refresh_kind: {type: string, enum: [manual, on_open, scheduled]}
            row_count: {type: integer}
            duration_ms: {type: integer}
            source_kind: {type: string}

    WorkbookEmbeddedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, target_microservice, target_id, refresh_policy]
          properties:
            workbook_id: {type: string}
            target_microservice: {type: string, enum: [docs, slides]}
            target_id: {type: string}
            range_or_chart: {type: string}
            refresh_policy: {type: string, enum: [live, snapshot]}

    EditTriggerDispatchedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workbook_id, sheet_id, cell_ref, workflow_id]
          properties:
            workbook_id: {type: string}
            sheet_id: {type: string}
            cell_ref: {type: string}
            workflow_id: {type: string, description: 'workflow-engine workflow id dispatched'}

    OntologyTypeDescriptorUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [type_name, descriptor_version_sha]
          properties:
            type_name: {type: string}
            descriptor_version_sha: {type: string}
            change_kind: {type: string, enum: [created, modified, deprecated]}

    TenantSeatLimitUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [seat_count_limit, effective_at]
          properties:
            seat_count_limit: {type: integer}
            effective_at: {type: string, format: date-time}

    WorkflowDefinitionUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [workflow_id, version_sha]
          properties:
            workflow_id: {type: string}
            version_sha: {type: string}

    FormsResponseAppendedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [form_id, response_id, target_workbook_id, target_sheet_id]
          properties:
            form_id: {type: string}
            response_id: {type: string}
            target_workbook_id: {type: string}
            target_sheet_id: {type: string}
            row_appended_count: {type: integer}
