# Canonical-base: specs/capabilities/canonical-tier-schema.json (per ADR-0064)
id: cap:payments:subscription-lifecycle:v1
name: subscription-lifecycle
namespace: payments
display_name: Recurring billing lifecycle
description: |
  Schedule + retry + dunning + trial + upgrade / downgrade / cancel for
  recurring subscriptions. Smart-retry schedule (24h / 72h / 7d / 14d).
  Pre-expiry card-update prompt. Tenant-configurable dunning policy.

owner_team: axis-payments + axis-billing
maturity: incubating
created_at: 2026-05-20
related_adrs: [ADR-0244, ADR-0246, ADR-0263]
related_artifacts:
  - app/payments/PRD.md
  - app/payments/contracts/openapi-v1.yaml

autonomy_tier: T2

inputs:
  - name: tenant_id
    type: string
    format: uuid
    required: true
  - name: customer_id
    type: string
    format: uuid
    required: true
  - name: price_id
    type: string
    required: true
  - name: trial_days
    type: integer
    minimum: 0
    required: false
  - name: idempotency_key
    type: string
    required: true

outputs:
  - name: subscription
    type: object
    schema: Subscription
  - name: audit_event
    type: object
    schema: AuditEvent
    description: oya.payments.subscription.created|dunning-attempted|cancelled

data_classes_touched:
  - PAYMENT_METHOD_TOKEN
  - AUDIT

regulatory_packs_consumed:
  - pack-pci-dss-l1-v4
  - pack-kr-fss
  - pack-eu-psd2-sca
  - pack-ccpa-cpra-2023

evidence_topic: oya.payments.subscription

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.30
  cost_drivers:
    - PSP fee per renewal-charge (same as charge capability)
    - Dunning-retry compute

cedar_policy_fragments:
  - app/payments/policy/charge-authorization.cedar
  - app/payments/policy/subscription-authorization.cedar

sunset:
  status: none
