# Canonical-base: specs/capabilities/canonical-tier-schema.json (per ADR-0064)
id: cap:payments:refund:v1
name: refund
namespace: payments
display_name: Issue Refund (full / partial)
description: |
  Issue a full or partial refund against a previously-captured charge. Validates
  original-charge exists, refund-amount ≤ original-amount − prior-refunds, within
  tenant refund-window. Refunds beyond original-amount are forbidden by Cedar +
  DDL CHECK.

owner_team: axis-payments
maturity: incubating
created_at: 2026-05-20
related_adrs: [ADR-0244, ADR-0246, ADR-0263]
related_artifacts:
  - app/payments/PRD.md
  - app/payments/contracts/openapi-v1.yaml
  - app/payments/policy/refund-authorization.cedar

autonomy_tier: T2

inputs:
  - name: tenant_id
    type: string
    format: uuid
    required: true
  - name: charge_id
    type: string
    format: uuid
    required: true
  - name: amount
    type: object
    schema: Money
    required: true
  - name: reason
    type: string
    enum: [duplicate, fraudulent, requested_by_customer, expired_uncaptured_charge, other]
    required: true
  - name: idempotency_key
    type: string
    required: true

outputs:
  - name: refund
    type: object
    schema: Refund
  - name: audit_event
    type: object
    schema: AuditEvent
    description: oya.payments.refund.issued|failed

data_classes_touched:
  - PAYMENT_METHOD_TOKEN
  - AUDIT

regulatory_packs_consumed:
  - pack-pci-dss-l1-v4
  - pack-kr-fss
  - pack-eu-psd2-sca

evidence_topic: oya.payments.refund

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.005
  cost_drivers:
    - PSP fee (Stripe: $0 refund-fee but original-fee not refunded)
    - DB write + audit-chain row

cedar_policy_fragments:
  - app/payments/policy/refund-authorization.cedar

sunset:
  status: none
