# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (per ADR-0064)
id: cap:payments:charge:v1
name: charge
namespace: payments
display_name: Create / Authorize / Capture a Charge
description: |
  Create a tenant-scoped charge against a tokenised payment-method via the
  per-PSP adapter (Stripe / Adyen / Toss / KakaoPay / LINE Pay / WeChat Pay /
  Alipay). Returns the charge with state and PSP-side charge-id. Idempotent
  per `(tenant_id, idempotency_key)` UNIQUE.

owner_team: axis-payments
maturity: incubating
created_at: 2026-05-20
related_adrs: [ADR-0145, ADR-0244, ADR-0246, ADR-0255, ADR-0263, ADR-0292]
related_specs:
  - /specs/app/payments.json
  - /specs/tenant-model.json
related_artifacts:
  - app/payments/PRD.md
  - app/payments/contracts/openapi-v1.yaml
  - app/payments/contracts/payments-v1.proto
  - app/payments/policy/charge-authorization.cedar

autonomy_tier: T2
# T2 = write to tenant ledger + emit money via PSP; gated by Cedar default-deny;
#       tenant must have completed KYB; sub-merchant must have completed KYC.

inputs:
  - name: tenant_id
    type: string
    format: uuid
    required: true
  - name: amount
    type: object
    schema: Money
    required: true
  - name: payment_method_id
    type: string
    required: true
    description: PSP-tokenised payment-method-id; never raw card-data
  - name: idempotency_key
    type: string
    required: true
  - name: sub_merchant_id
    type: string
    format: uuid
    required: false

outputs:
  - name: charge
    type: object
    schema: Charge
  - name: audit_event
    type: object
    schema: AuditEvent
    description: oya.payments.charge.authorized|captured|declined|errored

data_classes_touched:
  - PAYMENT_METHOD_TOKEN  # tokenised; never raw PAN
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT
  - PII_BILLING_ADDRESS  # country + ZIP for AVS only; not full address by default

regulatory_packs_consumed:
  - pack-pci-dss-l1-v4
  - pack-kr-fss
  - pack-eu-psd2-sca
  - pack-us-state-mtl
  - pack-ccpa-cpra-2023
  - pack-au-aml-ctf
  - pack-br-lgpd-finance
  - pack-in-rbi
  - pack-cn-pipl-2021
  - pack-coppa-minor-refusal

evidence_topic: oya.payments.charge

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.69  # includes Stripe PSP fee @ avg $10 ASP + infra
  cost_drivers:
    - PSP fee (2.9% + $0.30 for Stripe; variable per PSP)
    - Cedar evaluation (library-first)
    - Ontology read (tenant + user)
    - Fraud-scoring (library-first)
    - DB write (charges row + audit-chain row)

cedar_policy_fragments:
  - app/payments/policy/charge-authorization.cedar
  - app/payments/policy/abuse-defence.cedar

sunset:
  status: none
  notes: ""
