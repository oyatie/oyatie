# Canonical-base: specs/openapi/canonical-envelope-schema.json (per ADR-0064)
# Authoring authority: ADR-0244 tenant scoping + ADR-0145 inter-µservice communication.
# Transport: HTTP/3 + QUIC default per ADR-0253; Alt-Svc h3 advertised; TLS 1.3 floor.
openapi: 3.2.0
info:
  title: payments REST API
  version: 1.0.0-mvp
  description: |
    Payments substrate REST surface. Charge / refund / payout / dispute /
    subscription / sub-merchant lifecycle operations. Provider-BYOK per
    ADR-0255 §D-4 (tenant brings own Stripe / Adyen / Toss credentials).

    All endpoints are tenant-scoped (per ADR-0244). Authentication via OIDC
    Bearer + SPIFFE SVID for service-to-service. Idempotency-Key header
    required on every mutating call.

    Hyperscaler precedents: Stripe REST API + Adyen API + Toss Payments API.
  contact:
    name: axis-payments
    url: https://docs.oyatie.com/payments
  license:
    name: oyatie-internal
servers:
  - url: https://payments.oyatie.com
    description: Production (regional routing via tenant.region_pin)
  - url: https://payments-sandbox.oyatie.com
    description: Sandbox (PSP test-mode keys only)
security:
  - bearerAuth: []
tags:
  - name: charge
    description: One-time charge / authorize / capture / void
  - name: refund
    description: Full / partial refund
  - name: payout
    description: Bank-account verification + payout
  - name: dispute
    description: Chargeback lifecycle
  - name: subscription
    description: Recurring billing
  - name: sub-merchant
    description: Stripe sub-merchant + KYC / KYB
paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Create a charge
      tags: [charge]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listCharges
      summary: List charges (tenant-scoped)
      tags: [charge]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: state
          schema:
            type: string
            enum: [authorized, captured, voided, declined, errored]
      responses:
        '200':
          description: A page of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'
  /v1/charges/{charge_id}:
    parameters:
      - in: path
        name: charge_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCharge
      summary: Get a charge
      tags: [charge]
      responses:
        '200':
          description: Charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/charges/{charge_id}/capture:
    parameters:
      - in: path
        name: charge_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: captureCharge
      summary: Capture a previously authorized charge
      tags: [charge]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '200':
          description: Charge captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
  /v1/charges/{charge_id}/void:
    parameters:
      - in: path
        name: charge_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: voidCharge
      summary: Void an authorized charge
      tags: [charge]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Charge voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
  /v1/refunds:
    post:
      operationId: createRefund
      summary: Issue a refund
      tags: [refund]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/refunds/{refund_id}:
    get:
      operationId: getRefund
      summary: Get a refund
      tags: [refund]
      parameters:
        - in: path
          name: refund_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/payouts:
    post:
      operationId: schedulePayout
      summary: Schedule a payout
      tags: [payout]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StepUpAuthClass'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayoutRequest'
      responses:
        '201':
          description: Payout scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
  /v1/payouts/{payout_id}:
    get:
      operationId: getPayout
      summary: Get a payout
      tags: [payout]
      parameters:
        - in: path
          name: payout_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
  /v1/disputes:
    get:
      operationId: listDisputes
      summary: List open disputes
      tags: [dispute]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Disputes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeList'
  /v1/disputes/{dispute_id}/evidence:
    post:
      operationId: submitDisputeEvidence
      summary: Submit dispute representment bundle
      tags: [dispute]
      parameters:
        - in: path
          name: dispute_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeEvidenceBundle'
      responses:
        '200':
          description: Evidence submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
  /v1/subscriptions:
    post:
      operationId: createSubscription
      summary: Create a recurring subscription
      tags: [subscription]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
  /v1/sub-merchants:
    post:
      operationId: onboardSubMerchant
      summary: Onboard a sub-merchant (Stripe / Adyen MarketPay)
      tags: [sub-merchant]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardSubMerchantRequest'
      responses:
        '201':
          description: Sub-merchant onboarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubMerchant'
  /v1/webhooks/{psp}/v1:
    parameters:
      - in: path
        name: psp
        required: true
        schema:
          type: string
          enum: [stripe, adyen, toss, kakaopay, line-pay, wechat-pay, alipay]
    post:
      operationId: receivePspWebhook
      summary: Receive a PSP webhook (HMAC-signed)
      tags: [charge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: HMAC invalid
        '410':
          description: Replay-window exceeded
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: payments
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
        description: |
          Idempotency key per `(tenant_id, idempotency_key)` UNIQUE constraint.
          SDK auto-generates if not provided. 30-day reuse window.
    TenantId:
      name: X-Oya-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    StepUpAuthClass:
      name: X-Oya-StepUp-Auth
      in: header
      required: false
      schema:
        type: string
        enum: [passkey, webauthn, totp, otp]
        description: |
          Step-up auth class for high-value actions per documentation-rigor §3.2.3.
  schemas:
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount in minor units (e.g. cents for USD)
          example: 1099
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
    CreateChargeRequest:
      type: object
      required: [amount, payment_method_id]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        payment_method_id:
          type: string
          description: PSP-tokenised payment-method-id; never raw card-data
          example: pm_tok_visa_4242
        description:
          type: string
          maxLength: 500
        capture:
          type: boolean
          default: true
          description: If false, only authorize (capture later via /capture)
        sub_merchant_id:
          type: string
          format: uuid
          description: For / MarketPay flows
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 50
    CaptureRequest:
      type: object
      properties:
        amount: { $ref: '#/components/schemas/Money' }
    CreateRefundRequest:
      type: object
      required: [charge_id, amount]
      properties:
        charge_id:
          type: string
          format: uuid
        amount: { $ref: '#/components/schemas/Money' }
        reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer, expired_uncaptured_charge, other]
    SchedulePayoutRequest:
      type: object
      required: [bank_account_id, amount]
      properties:
        bank_account_id:
          type: string
          format: uuid
        amount: { $ref: '#/components/schemas/Money' }
        scheduled_for:
          type: string
          format: date-time
          description: Default = next-scheduled-batch
    CreateSubscriptionRequest:
      type: object
      required: [customer_id, price_id]
      properties:
        customer_id:
          type: string
          format: uuid
        price_id:
          type: string
        trial_days:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties:
            type: string
    OnboardSubMerchantRequest:
      type: object
      required: [legal_entity_name, business_jurisdiction, tos_accepted]
      properties:
        legal_entity_name:
          type: string
        business_jurisdiction:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166-1 alpha-2
        beneficial_owners:
          type: array
          items:
            type: object
            required: [name, dob, address]
            properties:
              name: { type: string }
              dob: { type: string, format: date }
              address: { type: string }
        tos_accepted:
          type: boolean
        tos_accepted_at:
          type: string
          format: date-time
    Charge:
      type: object
      required: [id, tenant_id, amount, state, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        audience_type: { type: string, enum: [B2B_TENANT, B2C_CONSUMER, PARTNER_AGENCY] }
        psp: { type: string }
        psp_charge_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        state: { type: string, enum: [authorized, captured, voided, declined, errored] }
        payment_method_id: { type: string }
        sub_merchant_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        captured_at: { type: string, format: date-time }
        decline_reason: { type: string }
    ChargeList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Charge' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    Refund:
      type: object
      required: [id, charge_id, amount, state, created_at]
      properties:
        id: { type: string, format: uuid }
        charge_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        state: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, tenant_id, bank_account_id, amount, state, scheduled_for]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        sub_merchant_id: { type: string, format: uuid }
        bank_account_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        state: { type: string, enum: [scheduled, initiated, completed, failed_insufficient_funds, failed_closed_account, failed_sanctions, failed_kyc_revoked, cancelled] }
        scheduled_for: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        failure_reason: { type: string }
    Dispute:
      type: object
      required: [id, charge_id, reason_code, state]
      properties:
        id: { type: string, format: uuid }
        charge_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        reason_code: { type: string, enum: [fraud, product_not_received, product_unacceptable, duplicate, credit_not_processed, general] }
        state: { type: string, enum: [needs_response, under_review, won, lost, charge_refunded] }
        opened_at: { type: string, format: date-time }
        evidence_due_at: { type: string, format: date-time }
    DisputeList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        has_more: { type: boolean }
    DisputeEvidenceBundle:
      type: object
      properties:
        product_description: { type: string }
        shipping_tracking_number: { type: string }
        customer_communication: { type: string }
        avs_result: { type: string }
        cvv_result: { type: string }
        receipt_url: { type: string, format: uri }
    Subscription:
      type: object
      required: [id, customer_id, state]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        price_id: { type: string }
        state: { type: string, enum: [trialing, active, past_due, cancelled, paused] }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
    SubMerchant:
      type: object
      required: [id, tenant_id, legal_entity_name, state]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        legal_entity_name: { type: string }
        state: { type: string, enum: [pending_verification, verified, restricted, suspended] }
        kyc_tier: { type: string, enum: [tier_1, tier_2, tier_3] }
        restricted_reason: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Forbidden (Cedar deny)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Idempotency-key conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate-limited (per-tenant quota or abuse-defence)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
      headers:
        Retry-After:
          schema: { type: integer }
    ServiceUnavailable:
      description: Service unavailable (PSP outage; tenant fallback applies if policy permits)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
