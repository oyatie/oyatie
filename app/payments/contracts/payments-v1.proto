// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// Canonical-base: specs/proto/canonical-message-shape.json (per ADR-0064)
// Authoring authority: ADR-0145 inter-microservice communication (direct gRPC + 3 invariants).
// Transport: internal sibling-service gRPC over HTTP/2 with mTLS/TLS 1.3 and SPIFFE SVID.

syntax = "proto3";

package oyatie.payments.v1;

option go_package = "dev.oyatie/payments/v1;paymentsv1";
option java_package = "dev.oyatie.payments.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// Common
// =============================================================================

message Money {
  // Amount in minor units (e.g. cents for USD)
  int64 amount_minor = 1;
  // ISO 4217 currency code
  string currency = 2;
}

enum AudienceType {
  AUDIENCE_TYPE_UNSPECIFIED = 0;
  AUDIENCE_TYPE_B2B_TENANT = 1;
  AUDIENCE_TYPE_B2C_CONSUMER = 2;
  AUDIENCE_TYPE_PARTNER_AGENCY = 3;
}

enum Psp {
  PSP_UNSPECIFIED = 0;
  PSP_STRIPE = 1;
  PSP_ADYEN = 2;
  PSP_TOSS = 3;
  PSP_KAKAOPAY = 4;
  PSP_LINE_PAY = 5;
  PSP_WECHAT_PAY = 6;
  PSP_ALIPAY = 7;
}

// =============================================================================
// Charge
// =============================================================================

enum ChargeState {
  CHARGE_STATE_UNSPECIFIED = 0;
  CHARGE_STATE_AUTHORIZED = 1;
  CHARGE_STATE_CAPTURED = 2;
  CHARGE_STATE_VOIDED = 3;
  CHARGE_STATE_DECLINED = 4;
  CHARGE_STATE_ERRORED = 5;
}

message Charge {
  string charge_id = 1;
  string tenant_id = 2;
  AudienceType audience_type = 3;
  Psp psp = 4;
  string psp_charge_id = 5;
  Money amount = 6;
  ChargeState state = 7;
  string payment_method_id = 8;
  string sub_merchant_id = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp captured_at = 11;
  string decline_reason = 12;
  map<string, string> metadata = 13;
}

message CreateChargeRequest {
  string tenant_id = 1;
  Money amount = 2;
  string payment_method_id = 3;
  string description = 4;
  bool capture = 5;
  string sub_merchant_id = 6;
  string idempotency_key = 7;
  map<string, string> metadata = 8;
}

message CaptureChargeRequest {
  string tenant_id = 1;
  string charge_id = 2;
  Money amount = 3;
  string idempotency_key = 4;
}

message VoidChargeRequest {
  string tenant_id = 1;
  string charge_id = 2;
  string idempotency_key = 3;
}

message GetChargeRequest {
  string tenant_id = 1;
  string charge_id = 2;
}

message ListChargesRequest {
  string tenant_id = 1;
  int32 limit = 2;
  string cursor = 3;
  ChargeState state = 4;
}

message ListChargesResponse {
  repeated Charge charges = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

// =============================================================================
// Refund
// =============================================================================

enum RefundState {
  REFUND_STATE_UNSPECIFIED = 0;
  REFUND_STATE_PENDING = 1;
  REFUND_STATE_SUCCEEDED = 2;
  REFUND_STATE_FAILED = 3;
}

message Refund {
  string refund_id = 1;
  string charge_id = 2;
  string tenant_id = 3;
  Money amount = 4;
  RefundState state = 5;
  string reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateRefundRequest {
  string tenant_id = 1;
  string charge_id = 2;
  Money amount = 3;
  string reason = 4;
  string idempotency_key = 5;
}

// =============================================================================
// Payout
// =============================================================================

enum PayoutState {
  PAYOUT_STATE_UNSPECIFIED = 0;
  PAYOUT_STATE_SCHEDULED = 1;
  PAYOUT_STATE_INITIATED = 2;
  PAYOUT_STATE_COMPLETED = 3;
  PAYOUT_STATE_FAILED_INSUFFICIENT_FUNDS = 4;
  PAYOUT_STATE_FAILED_CLOSED_ACCOUNT = 5;
  PAYOUT_STATE_FAILED_SANCTIONS = 6;
  PAYOUT_STATE_FAILED_KYC_REVOKED = 7;
  PAYOUT_STATE_CANCELLED = 8;
}

message Payout {
  string payout_id = 1;
  string tenant_id = 2;
  string sub_merchant_id = 3;
  string bank_account_id = 4;
  Money amount = 5;
  PayoutState state = 6;
  google.protobuf.Timestamp scheduled_for = 7;
  google.protobuf.Timestamp completed_at = 8;
  string failure_reason = 9;
}

message SchedulePayoutRequest {
  string tenant_id = 1;
  string bank_account_id = 2;
  Money amount = 3;
  google.protobuf.Timestamp scheduled_for = 4;
  string idempotency_key = 5;
}

// =============================================================================
// Dispute
// =============================================================================

enum DisputeState {
  DISPUTE_STATE_UNSPECIFIED = 0;
  DISPUTE_STATE_NEEDS_RESPONSE = 1;
  DISPUTE_STATE_UNDER_REVIEW = 2;
  DISPUTE_STATE_WON = 3;
  DISPUTE_STATE_LOST = 4;
  DISPUTE_STATE_CHARGE_REFUNDED = 5;
}

message Dispute {
  string dispute_id = 1;
  string charge_id = 2;
  string tenant_id = 3;
  string reason_code = 4;
  DisputeState state = 5;
  google.protobuf.Timestamp opened_at = 6;
  google.protobuf.Timestamp evidence_due_at = 7;
  google.protobuf.Timestamp resolved_at = 8;
  string outcome = 9;
}

message DisputeEvidenceBundle {
  string product_description = 1;
  string shipping_tracking_number = 2;
  string customer_communication = 3;
  string avs_result = 4;
  string cvv_result = 5;
  string receipt_url = 6;
}

message SubmitDisputeEvidenceRequest {
  string tenant_id = 1;
  string dispute_id = 2;
  DisputeEvidenceBundle bundle = 3;
}

// =============================================================================
// Subscription
// =============================================================================

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_TRIALING = 1;
  SUBSCRIPTION_STATE_ACTIVE = 2;
  SUBSCRIPTION_STATE_PAST_DUE = 3;
  SUBSCRIPTION_STATE_CANCELLED = 4;
  SUBSCRIPTION_STATE_PAUSED = 5;
}

message Subscription {
  string subscription_id = 1;
  string tenant_id = 2;
  string customer_id = 3;
  string price_id = 4;
  SubscriptionState state = 5;
  google.protobuf.Timestamp current_period_start = 6;
  google.protobuf.Timestamp current_period_end = 7;
}

message CreateSubscriptionRequest {
  string tenant_id = 1;
  string customer_id = 2;
  string price_id = 3;
  int32 trial_days = 4;
  string idempotency_key = 5;
}

// =============================================================================
// Sub-merchant
// =============================================================================

enum SubMerchantState {
  SUB_MERCHANT_STATE_UNSPECIFIED = 0;
  SUB_MERCHANT_STATE_PENDING_VERIFICATION = 1;
  SUB_MERCHANT_STATE_VERIFIED = 2;
  SUB_MERCHANT_STATE_RESTRICTED = 3;
  SUB_MERCHANT_STATE_SUSPENDED = 4;
}

message SubMerchant {
  string sub_merchant_id = 1;
  string tenant_id = 2;
  string legal_entity_name = 3;
  string business_jurisdiction = 4;
  SubMerchantState state = 5;
  string kyc_tier = 6;
  string restricted_reason = 7;
}

message OnboardSubMerchantRequest {
  string tenant_id = 1;
  string legal_entity_name = 2;
  string business_jurisdiction = 3;
  bool tos_accepted = 4;
  string idempotency_key = 5;
}

// =============================================================================
// Services
// =============================================================================

service ChargeService {
  rpc CreateCharge(CreateChargeRequest) returns (Charge);
  rpc CaptureCharge(CaptureChargeRequest) returns (Charge);
  rpc VoidCharge(VoidChargeRequest) returns (Charge);
  rpc GetCharge(GetChargeRequest) returns (Charge);
  rpc ListCharges(ListChargesRequest) returns (ListChargesResponse);
}

service RefundService {
  rpc CreateRefund(CreateRefundRequest) returns (Refund);
}

service PayoutService {
  rpc SchedulePayout(SchedulePayoutRequest) returns (Payout);
}

service DisputeService {
  rpc SubmitEvidence(SubmitDisputeEvidenceRequest) returns (Dispute);
}

service SubscriptionService {
  rpc CreateSubscription(CreateSubscriptionRequest) returns (Subscription);
}

service SubMerchantService {
  rpc OnboardSubMerchant(OnboardSubMerchantRequest) returns (SubMerchant);
}
