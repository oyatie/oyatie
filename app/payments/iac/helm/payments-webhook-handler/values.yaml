# payments-webhook-handler Helm values
# ADR-0254: Kata VM per pod; ADR-0253: HTTP/3; ADR-0295: SPIFFE SVID

webhookHandler:
  image:
    repository: registry.oyatie.dev/payments-webhook-handler
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  replicaCount: 6
  # 6 replicas: high-availability for inbound webhook storm (PSP recovery surge)
  # HPA scales up to 256 during webhook-storm per runbooks/psp-outage.md

  runtimeClassName: kata-clh

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # Per-PSP queue depth limits (backpressure)
  pspQueues:
    stripe:
      maxQueueDepth: 50000
      workerConcurrency: 32
    adyen:
      maxQueueDepth: 50000
      workerConcurrency: 32
    toss:
      maxQueueDepth: 10000
      workerConcurrency: 16
    kakaopay:
      maxQueueDepth: 10000
      workerConcurrency: 16
    linepay:
      maxQueueDepth: 20000
      workerConcurrency: 16

  # Idempotency-key dedup window (CRDB-backed)
  idempotencyWindowSeconds: 86400  # 24h per Stripe idiom

  # Replay-window enforcement per abuse-defence.cedar
  replayWindowSeconds: 300

  autoscaling:
    enabled: true
    minReplicas: 6
    maxReplicas: 256
    targetCPUUtilizationPercentage: 50

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  openbao:
    enabled: true
    role: "payments-webhook-handler"
    secretPath: "secret/data/payments/webhook-hmac"
    ttl: "60s"

  spiffe:
    enabled: true
    spireSocketPath: /run/spire/sockets/agent.sock

  metrics:
    enabled: true
    port: 9090
    path: /metrics
