apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: oyatie-microservices
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: http
      port: {{ .Values.webhookHandler.service.port }}
      targetPort: {{ .Values.webhookHandler.service.port }}
    - name: metrics
      port: {{ .Values.webhookHandler.metrics.port }}
      targetPort: {{ .Values.webhookHandler.metrics.port }}
