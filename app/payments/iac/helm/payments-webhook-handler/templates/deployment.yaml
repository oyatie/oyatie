apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.webhookHandler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
    spec:
      runtimeClassName: {{ .Values.webhookHandler.runtimeClassName }}
      securityContext:
{{ toYaml .Values.webhookHandler.podSecurityContext | indent 8 }}
      containers:
        - name: webhook-handler
          image: "{{ .Values.webhookHandler.image.repository }}:{{ .Values.webhookHandler.image.tag }}"
          imagePullPolicy: {{ .Values.webhookHandler.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.webhookHandler.metrics.port }}
          resources:
{{ toYaml .Values.webhookHandler.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.webhookHandler.containerSecurityContext | indent 12 }}
