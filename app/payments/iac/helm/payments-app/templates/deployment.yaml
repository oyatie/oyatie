{{- if .Values.payments.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.payments.replicaCount }}
  minReadySeconds: {{ .Values.payments.minReadySeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
    spec:
      runtimeClassName: {{ .Values.payments.runtimeClassName }}
      securityContext:
{{ toYaml .Values.payments.podSecurityContext | indent 8 }}
      containers:
        - name: app
          image: "{{ .Values.payments.image.repository }}:{{ .Values.payments.image.tag }}"
          imagePullPolicy: {{ .Values.payments.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Materialized by terraform (payments-crdb.tf
                  # payments_crdb_external_secret).
                  name: payments-crdb-credentials
                  key: url
            - name: OYA_OPENBAO_ROLE
              value: {{ .Values.payments.openbao.role | quote }}
            - name: OYA_OPENBAO_SECRET_PATH
              value: {{ .Values.payments.openbao.secretPath | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.payments.service.port }}
            - name: metrics
              containerPort: {{ .Values.payments.service.metricsPort }}
          livenessProbe:
            httpGet:
              path: {{ .Values.payments.livenessProbe.httpGet.path }}
              port: {{ .Values.payments.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.payments.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.payments.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.payments.readinessProbe.httpGet.path }}
              port: {{ .Values.payments.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.payments.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.payments.readinessProbe.periodSeconds }}
          resources:
{{ toYaml .Values.payments.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.payments.containerSecurityContext | indent 12 }}
        {{- if .Values.payments.openbao.enabled }}
        # ADR-0296 library-first credential sidecar: fetches tenant PSP
        # credentials from OpenBao with the declared role/path and TTL.
        - name: openbao-agent
          image: {{ .Values.payments.openbao.agent.image | quote }}
          args: ["agent", "-config=/etc/openbao-agent/openbao.hcl", "-log-level=error"]
          env:
            - name: OYA_OPENBAO_ROLE
              value: {{ .Values.payments.openbao.role | quote }}
          volumeMounts:
            - name: openbao-agent-config
              mountPath: /etc/openbao-agent
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.payments.openbao.enabled }}
        - name: openbao-agent-config
          configMap:
            # OpenBao agent config for the payments role; supplied by the
            # cluster bootstrap (per-cell OpenBao address + auth method).
            name: payments-openbao-agent-config
        {{- end }}
{{- end }}
