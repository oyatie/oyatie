apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: oya-payments
    oyatie/microservice: payments
    oyatie/pci-scope: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    oyatie/adrs: "ADR-0131,ADR-0248,ADR-0254"
    oyatie/slo-tier: tier-0-revenue-critical
    # PCI DSS Req 1: network-isolated namespace; Cilium L4 NetworkPolicy enforced
    oyatie/pci-req: "1"
