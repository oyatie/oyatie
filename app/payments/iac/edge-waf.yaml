# Edge WAF configuration for payments µservice
# Per ADR-0297 (abuse-defence) + documentation-rigor.md §3.2.4 Domain 1+2 + §3.2.3.
# Backed by terraform/payments-edge-waf.tf which provisions the cloud-vendor primitives
# (Cloudflare Bot Management + AWS WAF Managed Rules + Google Cloud Armor).
#
# This file declares the per-µservice rule set in vendor-neutral form; terraform
# materializes it across the multi-cloud edge.
---
schema_version: 1
microservice: payments
adr: "ADR-0297 + ADR-0253-amendment + ADR-0292 + ADR-0298 (when published)"

# §3.2.4 Domain 1 — DDoS protection
ddos_protection:
  l3_l4_volumetric:
    enabled: true
    providers: [cloudflare-magic-transit, aws-shield-advanced]
    anycast: true
    syn_cookies: true
    bgp_flowspec: true
  l4_protocol:
    enabled: true
    tcp_state_tracking: true
    quic_connection_limit: 10000
    slow_loris_timeout_seconds: 30
  l7_application:
    enabled: true
    adaptive_rate_limit:
      per_ip_per_minute: 600
      per_tenant_per_minute_tier_low: 6000
      per_tenant_per_minute_tier_mid: 60000
      per_tenant_per_minute_tier_high: 600000
    js_challenge_threshold: 95  # only on bot_score > 95
  egress:
    enabled: true
    outbound_dlp_scan: true
    per_psp_rate_limit:
      stripe: 100  # /sec per ADR-0254 capacity model
      adyen: 200
      toss: 50
      kakaopay: 50
      line-pay: 30
      wechat-pay: 50

# §3.2.4 Domain 2 — WAF (OWASP Top 10 + API Top 10)
waf:
  managed_rules:
    - AWSManagedRulesCommonRuleSet
    - AWSManagedRulesAmazonIpReputationList
    - AWSManagedRulesKnownBadInputsRuleSet
    - AWSManagedRulesSQLiRuleSet
    - AWSManagedRulesPHPRuleSet
    - cloudflare-owasp-core
    - cloudflare-pci-dss-v4
  custom_rules:
    - rule_id: payments-pci-card-data-in-url
      description: Block any PAN-shaped string in URL or query
      action: BLOCK
      pattern: "[0-9]{13,19}"
    - rule_id: payments-bin-attack-detection
      description: Sequential BIN range probing
      action: CHALLENGE
      condition: "rate(distinct_pan_prefix) > 10/minute per IP"
    - rule_id: payments-velocity-abuse
      description: Excessive failed-charge attempts
      action: BLOCK
      condition: "rate(charge_failed) > 20/minute per (tenant, IP)"

# §3.2.3 — Abuse-defence (anti-bot + anti-spoof + anti-scrape)
abuse_defence:
  anti_bot:
    bot_management_provider: cloudflare-bot-management
    ja4_fingerprint: enabled
    device_attestation:
      ios_app_attest: enabled
      android_play_integrity: enabled
      webauthn_origin_binding: enabled
    captcha_on_suspicion:
      threshold: 95  # bot_score crossing
      providers: [hcaptcha, turnstile, cloudflare-challenge]
      ux_floor:
        accessibility_alternatives: [audio, keyboard_only, screen_reader_friendly]
        max_solve_seconds: 10
        no_time_pressure_for_assistive_tech: true
        session_continuity_preserved: true
        locale_aware: true
  anti_spoof:
    payload_signing:
      webhook_hmac_required: true
      replay_window_seconds: 300
      idempotency_key_required: true
    spiffe_workload_identity:
      enabled: true
      issuer: oyatie-spire-server
  anti_scrape:
    per_tenant_per_fingerprint_rate_limit: enabled
    pattern_anomaly_detection: enabled
    robots_txt_authority: true
    paid_api_tier_for_scrapers: stripe-class-rate-limit-passes
    dynamic_content_rewriting: false  # payments API surface is stable

# §3.2.3 LIFE-SAFETY HARD RULE — emergency-services bypass (ADR-0298)
emergency_services_bypass:
  enabled: true
  audience_types_bypassed:
    - EMERGENCY_SERVICES_OPERATOR  # 911 dispatchers + EMS + crisis-hotlines
  bypass_at_edge: true
  audit_event_class: AbuseDefenceEmergencyServiceBypass
  rate_limit_elevation_factor: 10
  forgery_detection: spiffe_attestation_chain

# §3.2.3 UX-floor — friendly-crawler allow-list
friendly_crawler_allowlist:
  - googlebot
  - bingbot
  - applebot
  - duckduckbot
  - kakaobot  # KR
  - naverbot  # KR
  - yandexbot
  - baiduspider

# §3.2.5 critical-path UX preservation
critical_path_preservation:
  - critical_path_row: 3   # fraud-dispute fast-track
    treatment: never_throttle_at_edge
  - critical_path_row: 4   # elder-financial-abuse
    treatment: trusted_contact_alert_no_block
  - critical_path_row: 15  # financial inclusion
    treatment: lower_kyb_tier_floor_per_pack_only
  - critical_path_row: 22  # mass-casualty surge
    treatment: emergency_services_elevated_rate
  - critical_path_row: 25  # mistaken-action undo
    treatment: undo_window_15s_default

# Per-pack overlay (some packs mandate stricter edge rules)
pack_overlays:
  PCI-DSS-L1-v4:
    additional_managed_rules: [pci-dss-v4-strict]
    pan_in_url_action: BLOCK
  KR-FSS:
    additional_managed_rules: [kr-fss-financial-fraud-2024]
    high_value_cooling_off: 24h
  EU-PSD2:
    additional_managed_rules: [eu-psd2-sca-required]
    sca_threshold_eur: 30
