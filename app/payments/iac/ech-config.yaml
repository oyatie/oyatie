# Encrypted Client Hello (ECH) configuration for payments µservice
# Per ADR-0253 amendment + documentation-rigor.md §3.2.1 row 12.
# RFC 9460 + draft-ietf-tls-esni-22.
#
# ECH-disabled clients gracefully fall through to standard TLS 1.3.
# Per documentation-rigor.md: never refuse a session because peer lacks ECH.
#
# Note: a fuller per-cluster ECH config also exists at tls/payments-ech-config.yaml;
# this file is the canonical-name pointer + per-µservice declarative summary.
---
schema_version: 1
microservice: payments
adr: "ADR-0253-amendment"
rfc_anchor: "RFC 9460 + draft-ietf-tls-esni-22"

ech_enabled: true

# HTTPS RR with ech= config published via DNS via per-tenant ADR-0273 toolchain
dns_https_rr:
  publisher: "tools/dns/adr-0273-dns-publisher"
  ttl_seconds: 300
  per_cell: true  # ech config differs per cell
  rotation:
    cadence: P90D
    grace_window: P14D
    rotation_runbook: "docs/runbooks/cedar-fragment-emergency-rollback.md (pattern; adapt for ECH)"

# Per-cell ECH config (materialized by terraform; this declares the shape)
per_cell_config_shape:
  config_id: uint8  # 0-255; rotated per cadence
  hpke:
    kem_id: 0x0020  # X25519
    kdf_id: 0x0001  # HKDF-SHA256
    aead_id: 0x0001  # AES-128-GCM
  public_name: payments.oyatie.com
  extensions:
    # PQC kicker: when ECH negotiated, prefer PQC hybrid in inner ClientHello
    - prefer_pqc_kem_when_available: true
    - prefer_pqc_signature_when_available: true

# Graceful degradation per documentation-rigor.md §3.2.1 row 12
graceful_degradation:
  ech_unsupported_clients_pass_through_to_tls_1_3: true
  pqc_unsupported_clients_pass_through_to_classical: true
  log_event_class: "TlsEchDegradedSession"  # informational; not blocking

# Critical-path exception per §3.2.5 row 1: emergency-services connectivity
# MUST work even on legacy clients lacking ECH/PQC.
critical_path_exception:
  emergency_services_clients_never_refused_for_missing_ech: true
  emergency_services_clients_never_refused_for_missing_pqc: true
