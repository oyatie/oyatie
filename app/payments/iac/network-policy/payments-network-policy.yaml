# payments µservice — Cilium L4 NetworkPolicy
# PCI DSS Req 1: restrict inbound/outbound to minimum required.
# ADR-0254: Kata VM per pod; Cilium L4 + Istio mTLS mesh.
# ADR-0295: SPIFFE SVID on every cross-µservice call.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payments-ingress-egress
  namespace: payments
  annotations:
    oyatie/pci-req: "1"
    oyatie/adrs: "ADR-0254,ADR-0295"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: oya-payments

  # ─── Ingress ─────────────────────────────────────────────────────────────────
  ingress:
    # gRPC from internal µservices (cloud-billing, messenger, etc.)
    - fromEndpoints:
        - matchLabels:
            oyatie/microservice-family: product
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/payments.v1.PaymentsService/.*"

    # REST from API gateway
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oya-api-gateway
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # PSP webhook inbound (Stripe, Adyen, Toss IPs)
    - fromCIDRSet:
        # Stripe webhook source CIDRs (https://stripe.com/docs/ips)
        - cidr: "3.18.12.63/32"
        - cidr: "3.130.192.231/32"
        - cidr: "13.235.14.237/32"
        - cidr: "13.235.122.149/32"
        - cidr: "18.211.135.69/32"
        - cidr: "35.154.171.200/32"
        - cidr: "52.15.183.38/32"
        - cidr: "54.187.174.169/32"
        - cidr: "54.187.205.235/32"
        - cidr: "54.187.216.72/32"
        - cidr: "54.241.31.99/32"
        - cidr: "54.241.31.102/32"
        - cidr: "54.241.34.107/32"
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Prometheus scrape from observability namespace
    - fromEndpoints:
        - matchLabels:
            oyatie/microservice: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

    # SPIRE agent (SVID issuance)
    - fromEndpoints:
        - matchLabels:
            app: spire-agent
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

  # ─── Egress ──────────────────────────────────────────────────────────────────
  egress:
    # PSP APIs: Stripe, Adyen, Toss, LINE Pay — HTTPS (port 443) only
    - toFQDNs:
        - matchName: "api.stripe.com"
        - matchName: "api.adyen.com"
        - matchName: "api.tosspayments.com"
        - matchName: "api-pay.line.me"
        - matchName: "api.wechatpay.cn"
        - matchName: "openapi.alipay.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # OpenBao (secrets)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # CRDB (CockroachDB) — payments namespace
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cockroachdb
            oyatie/microservice: payments
      toPorts:
        - ports:
            - port: "26257"
              protocol: TCP

    # Policy-engine (Cedar evaluation fallback)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: policy-engine
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Intelligence µservice (network-opt-in for dispute representment)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: intelligence
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Notifications µservice (receipts + dunning + webhooks)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: notifications
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # DNS resolution (CoreDNS)
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # SPIRE server (workload attestation)
    - toEndpoints:
        - matchLabels:
            app: spire-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
