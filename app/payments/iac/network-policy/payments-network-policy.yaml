# payments µservice — Cilium L4 NetworkPolicy
# PCI DSS Req 1: restrict inbound/outbound to minimum required.
# ADR-0254: Kata VM per pod; Cilium L4 + Istio mTLS mesh.
# ADR-0295: SPIFFE SVID on every cross-µservice call.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payments-ingress-egress
  namespace: payments
  annotations:
    oyatie/pci-req: "1"
    oyatie/adrs: "ADR-0254,ADR-0295"
spec:
  endpointSelector:
    matchLabels:
      # Must match the pod labels applied by the deployed Helm chart
      # (iac/k8s/helm/templates/deployment.yaml): part-of: oyatie-microservices.
      app.kubernetes.io/part-of: oyatie-microservices

  # ─── Ingress ─────────────────────────────────────────────────────────────────
  ingress:
    # gRPC from internal µservices (cloud-billing, messenger, etc.). Paths are
    # rooted at the services declared by contracts/payments-v1.proto
    # (package oyatie.payments.v1): ChargeService, RefundService, PayoutService,
    # DisputeService, SubscriptionService, SubMerchantService. Callers are
    # selected by the label the product workloads actually carry
    # (app.kubernetes.io/part-of: oyatie-microservices — the family label used
    # by the payments chart and sibling product charts), not a fabricated
    # microservice-family label that matches nothing.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: oyatie-microservices
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/oyatie.payments.v1.ChargeService/.*"
              - method: POST
                path: "/oyatie.payments.v1.RefundService/.*"
              - method: POST
                path: "/oyatie.payments.v1.PayoutService/.*"
              - method: POST
                path: "/oyatie.payments.v1.DisputeService/.*"
              - method: POST
                path: "/oyatie.payments.v1.SubscriptionService/.*"
              - method: POST
                path: "/oyatie.payments.v1.SubMerchantService/.*"

    # REST from API gateway
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oya-api-gateway
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            # HTTP/3 (QUIC) per the advertised Alt-Svc: h3=":8443" — QUIC rides
            # UDP, so both transports must be admitted or the upgrade can never
            # reach the workload (ADR-0253 HTTP/3 default).
            - port: "8443"
              protocol: UDP

    # PSP webhook inbound (Stripe, Adyen, Toss, KakaoPay, LINE Pay, WeChat Pay,
    # Alipay). PSP sources are not pinned by a single-provider CIDR allowlist
    # (a Stripe-only list would drop every other enabled provider's callbacks);
    # webhook traffic is admitted only through the authenticated north-south
    # ingress above (API gateway), which performs the per-PSP HMAC signature
    # validation declared in contracts/openapi-v1.yaml and enforced by
    # policy/abuse-defence.cedar (HMAC + 300s replay window).

    # Prometheus scrape from observability namespace
    - fromEndpoints:
        - matchLabels:
            oyatie/microservice: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

    # SPIRE agent (SVID issuance)
    - fromEndpoints:
        - matchLabels:
            app: spire-agent
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

  # ─── Egress ──────────────────────────────────────────────────────────────────
  egress:
    # PSP APIs: Stripe, Adyen, Toss, KakaoPay, LINE Pay, WeChat Pay, Alipay —
    # HTTPS (port 443) only
    - toFQDNs:
        - matchName: "api.stripe.com"
        - matchName: "api.adyen.com"
        - matchName: "api.tosspayments.com"
        - matchName: "kapi.kakao.com"
        - matchName: "api-pay.line.me"
        - matchName: "api.wechatpay.cn"
        - matchName: "openapi.alipay.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Payment event broker (contracts/asyncapi-v1.yaml): AMQP to the
    # production broker at payments-events.oyatie.com:5671
    - toFQDNs:
        - matchName: "payments-events.oyatie.com"
      toPorts:
        - ports:
            - port: "5671"
              protocol: TCP

    # OpenBao (secrets)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP

    # CRDB (CockroachDB) — managed CockroachDB Cloud cluster
    #
    # cockroach_cluster.payments (terraform/payments-crdb.tf) is a MANAGED
    # CockroachDB Cloud cluster, not an in-cluster Service, so a toEndpoints
    # label match can never select it; its randomized SQL hostname is computed
    # at apply time and surfaced as the terraform output
    # payments_crdb_sql_host. A STABLE DNS alias (CNAME) is created once by the
    # operator pointing at that output (e.g. payments-crdb.oyatie.dev), and the
    # policy admits the stable alias so the rule does not depend on a
    # randomized, provision-time hostname. The DATABASE_URL secret stores the
    # same host.
    - toFQDNs:
        - matchName: "payments-crdb.oyatie.dev"
      toPorts:
        - ports:
            - port: "26257"
              protocol: TCP

    # Outbound tenant webhook deliveries (webhook-delivery-success SLO):
    # tenant-configured subscriber endpoints are not admitted directly (arbitrary
    # destinations); deliveries egress through the controlled webhook egress
    # proxy, which applies per-destination allow-listing and retry policy.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: webhook-egress-proxy
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Policy-engine (Cedar evaluation fallback)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: policy-engine
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Intelligence µservice (network-opt-in for dispute representment)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: intelligence
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # Notifications µservice (receipts + dunning + webhooks)
    - toEndpoints:
        - matchLabels:
            oyatie/microservice: notifications
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

    # DNS resolution (CoreDNS)
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # SPIRE server (workload attestation)
    - toEndpoints:
        - matchLabels:
            app: spire-server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
