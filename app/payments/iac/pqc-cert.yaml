# PQC certificate configuration for payments µservice
# Per ADR-0253 amendment + documentation-rigor.md §3.2.1 row 12.
# Post-quantum hybrid: X25519MLKEM768 KEM + ed25519+ml_dsa_65 signature.
# Non-PQ clients fall through to classical X25519 / Ed25519 (graceful degradation).
#
# Issuance: rooted under oyatie's offline-CA per ADR-0247 Tier-0 ceremony; rotation ≤90d
# per documentation-rigor.md §3.2.4 Domain 16.
#
# This file is consumed by cert-manager + Cilium ambient mesh + the edge WAF
# (terraform/payments-edge-waf.tf) to provision PQC certificates per cell.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payments-pqc-hybrid-cert
  namespace: payments
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: pqc-cert
    oyatie.tier: substrate
    oyatie.cell-tier: tier-3
  annotations:
    oyatie.adr: "ADR-0253-amendment + ADR-0297"
    oyatie.rotation-cadence: "P90D"
    oyatie.pqc-kem: "X25519MLKEM768"
    oyatie.pqc-signature: "ed25519+ml_dsa_65"
    oyatie.classical-fallback: "X25519 + Ed25519"
spec:
  secretName: payments-pqc-hybrid-tls
  issuerRef:
    name: oyatie-tier-0-offline-rooted-ca
    kind: ClusterIssuer
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  privateKey:
    # cert-manager admits only its supported algorithms (e.g. Ed25519); the
    # ML-DSA hybrid augmentation is performed by the implemented issuer
    # (oyatie offline-CA ceremony, ADR-0247) rather than as a composite
    # privateKey.algorithm string that the standard CRD would reject.
    algorithm: Ed25519
    encoding: PKCS8
  dnsNames:
    - payments.oyatie.com
    - payments.cell-${CELL_ID}.oyatie.com
    - "*.payments.oyatie.com"
  uris:
    - spiffe://oyatie.dev/ns/payments/sa/payments-app
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
---
# IngressGateway TLS profile pinning PQC hybrid + classical fallback
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: payments-pqc-gateway
  namespace: payments
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-pqc
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: payments-pqc-hybrid-tls
        minProtocolVersion: TLSV1_3
        # Cipher suites: AEAD-only; PQC-hybrid preferred; classical fallback enabled.
        cipherSuites:
          - TLS_AES_256_GCM_SHA384
          - TLS_CHACHA20_POLY1305_SHA256
          - TLS_AES_128_GCM_SHA256
        # ALPN: HTTP/3 + HTTP/2 + HTTP/1.1 per ADR-0253 amendment fallback chain.
        # h3 advertised via Alt-Svc header at edge.
      hosts:
        - "payments.oyatie.com"
        - "payments.cell-*.oyatie.com"
---
# Cilium L7 envoy filter to enforce HTTP/3 negotiation order
apiVersion: cilium.io/v2alpha1
kind: CiliumEnvoyConfig
metadata:
  name: payments-h3-negotiation
  namespace: payments
spec:
  services:
    - name: payments-app
      namespace: payments
  resources:
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: payments-listener
      address:
        socketAddress:
          protocol: TCP
          portValue: 443
      filterChains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typedConfig:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codecType: AUTO  # negotiate H3 > H2 > H1
                # h3 served on UDP/443 by separate listener; h2/h1 share this TCP/443
                httpFilters:
                  - name: envoy.filters.http.router
