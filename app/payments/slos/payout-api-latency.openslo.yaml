apiVersion: openslo/v1
kind: SLO
metadata:
  name: payments-payout-api-latency
  namespace: payments
  labels:
    oyatie/microservice: payments
    oyatie/bc: payout
    oyatie/slo-tier: tier-0-revenue-critical
  annotations:
    oyatie/adrs: "ADR-0130,ADR-0131"
    oyatie/ip-ref: IP-008
spec:
  description: |
    Payout API p99 latency ≤ 3000ms for SchedulePayout and InitiatePayout calls.
    Excludes payout-completion-time (bank clearing lag is PSP-external).
  service: payments-payout
  indicator:
    metadata:
      name: payout-api-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: >
                sum(rate(payments_payout_api_latency_ms_bucket{le="3000"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(payments_payout_api_latency_ms_count[5m]))
  timeWindow:
    - count: 28
      unit: Day
      isRolling: true
  objectives:
    - displayName: "Payout API p99 ≤ 3000ms (99.5% of requests)"
      target: 0.995
      targetPercent: 99.5
  alertPolicies:
    - name: payments-payout-latency-fast-burn
  budgetingMethod: Occurrences
