# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-refund-api-availability
  displayName: "payments: refund-API availability 99.9%"
  labels:
    microservice: payments
    bounded_context: refund
    sli_class: availability
    tier: data-plane
    plane: data
    owner_team: axis-payments
    pack_scope: all
spec:
  service: payments
  description: |
    Refund-API availability. A request is "good" only when the REST surface
    returns 2xx within deadline. Client errors are excluded from BOTH sides:
    the unclassified status-code counter cannot distinguish a recognized
    business decline from a server-generated 4xx during a deployment
    regression, so counting any 4xx (including 400/409/422) as good would keep
    availability at 100% while valid requests fail. A dedicated classified
    business-outcome label can replace this once the service emits one.
    Auth/rate-limit responses (401, 403, 429) are likewise excluded from the
    numerator.
  indicator:
    metadata:
      name: payments-refund-api-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_refund_api_requests_total{status_code=~"2.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_refund_api_requests_total[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling refund-API availability ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
