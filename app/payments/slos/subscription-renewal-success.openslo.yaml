# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
# Authoring authority: ADR-0139 agentic SLO-gated promotion.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-subscription-renewal-success
  displayName: "payments: subscription-renewal success ≥ 99.0%"
  labels:
    microservice: payments
    bounded_context: subscription-lifecycle
    sli_class: correctness
    tier: data-plane
    plane: data
    owner_team: axis-payments + axis-billing
    pack_scope: all
spec:
  service: payments
  description: |
    Subscription renewal charge success rate over a rolling window. Includes
    first-attempt + dunning-recovered renewals. Target ≥99.0% — lower than
    charge-API because dunning by design retries failures.
  indicator:
    metadata:
      name: payments-subscription-renewal-success-rate
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_subscription_renewal_total{outcome="succeeded"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_subscription_renewal_total[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling subscription-renewal success ≥ 99.0%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
