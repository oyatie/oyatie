apiVersion: openslo/v1
kind: SLO
metadata:
  name: payments-subscription-renewal-success
  namespace: payments
  labels:
    oyatie/microservice: payments
    oyatie/bc: subscription-lifecycle
    oyatie/slo-tier: tier-0-revenue-critical
  annotations:
    oyatie/adrs: "ADR-0130,ADR-0131"
    oyatie/ip-ref: IP-012
spec:
  description: |
    Subscription renewal charge success rate over 24h rolling window.
    Includes first-attempt + dunning-recovered renewals.
    Target: ≥99.0% — lower than charge-api because dunning by design retries failures.
  service: payments-subscription-lifecycle
  indicator:
    metadata:
      name: subscription-renewal-success-rate
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(payments_subscription_renewal_total{outcome="succeeded"}[24h]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(payments_subscription_renewal_total[24h]))
  timeWindow:
    - count: 28
      unit: Day
      isRolling: true
  objectives:
    - displayName: "Renewal success 99.0% (28d)"
      target: 0.99
      targetPercent: 99.0
  alertPolicies:
    - name: payments-subscription-renewal-fast-burn
  budgetingMethod: Occurrences
