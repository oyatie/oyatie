# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-payout-completion-success
  displayName: "payments: payout-completion-success ≥ 99.9% (24h)"
  labels:
    microservice: payments
    bounded_context: payout
    sli_class: correctness
    tier: data-plane
    plane: data
    owner_team: axis-payments + ops-treasury
    pack_scope: all
spec:
  service: payments
  description: |
    Per-24h share of payouts that complete successfully (cleared at bank). The
    denominator is the `scheduled` series, which records each payout exactly
    once at schedule time — counting state-transition series (scheduled +
    initiated + completed) would triple-count every healthy payout and drive
    the ratio toward ~33% — while payouts still in-flight remain in the
    denominator so a PSP or clearing outage that stalls the pending backlog
    cannot report 100% completion. Intentional kyc-revoked / sanctions
    failures are correctness-correct outcomes and are subtracted from the
    denominator so they neither count against nor inflate the ratio.
  indicator:
    metadata:
      name: payments-payout-completion-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_payout_total{state="completed"}[24h]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_payout_total{state="scheduled"}[24h])) - sum(rate(payments_payout_total{state="failed_kyc_revoked"}[24h])) - sum(rate(payments_payout_total{state="failed_sanctions"}[24h]))
  objectives:
    - target: 0.999
      displayName: "30d rolling payout-completion-success ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
