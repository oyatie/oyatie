# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-payout-completion-success
  displayName: "payments: payout-completion-success ≥ 99.9% (24h)"
  labels:
    microservice: payments
    bounded_context: payout
    sli_class: correctness
    tier: data-plane
    plane: data
    owner_team: axis-payments + ops-treasury
    pack_scope: all
spec:
  service: payments
  description: |
    Share of payouts that complete successfully (cleared at bank) out of the
    terminal-outcome cohort. Each payout reaches exactly ONE terminal state, so
    the numerator and denominator describe the same payout cohort: the ratio
    stays in [0,1] and cannot drift across the 24h boundary or exceed 100%.
    Intentional kyc-revoked / sanctions failures are correctness-correct
    outcomes and are deliberately OUTSIDE the measured cohort (they are not
    completion failures). Payouts still in-flight (scheduled/initiated) are not
    part of this completion cohort either; a stalled pending backlog is covered
    by the availability numerator and queue signals rather than by a
    cohort-mixing subtraction.
  indicator:
    metadata:
      name: payments-payout-completion-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_payout_total{state="completed"}[24h]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_payout_total{state=~"completed|failed_insufficient_funds|failed_closed_account"}[24h]))
  objectives:
    - target: 0.999
      displayName: "30d rolling payout-completion-success ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
