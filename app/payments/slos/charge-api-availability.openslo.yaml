# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (per ADR-0064)
# Authoring authority: ADR-0139 agentic SLO-gated promotion.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: payments-charge-api-availability
  displayName: "payments: charge-API availability 99.95%"
  labels:
    microservice: payments
    bounded_context: charge
    sli_class: availability
    tier: substrate-hero
    plane: data
    owner_team: axis-payments
    pack_scope: all
spec:
  service: payments
  description: |
    Charge-API availability. A request is "good" when the REST surface returns
    2xx OR 4xx-from-business-rule (e.g., legit decline) within deadline.
    Excludes 5xx (true server errors).
  indicator:
    metadata:
      name: payments-charge-api-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_charge_api_requests_total{status_code=~"2..|4.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_charge_api_requests_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling charge-API availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
