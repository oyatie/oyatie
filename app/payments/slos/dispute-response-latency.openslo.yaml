# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: payments-dispute-response-latency
  displayName: "payments: dispute-evidence-submission latency p95 ≤ 24h"
  labels:
    microservice: payments
    bounded_context: dispute
    sli_class: latency
    tier: substrate-hero
    plane: data
    owner_team: axis-payments + ops-fraud
    pack_scope: all
spec:
  service: payments
  description: |
    p95 lag between dispute.opened and evidence-submitted ≤ 24h. Misses risk
    dispute-loss; meets keeps card-network monitoring thresholds healthy.
  indicator:
    metadata:
      name: payments-dispute-evidence-submission-under-24h-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_dispute_evidence_submission_lag_seconds_bucket{le="86400"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_dispute_evidence_submission_lag_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "30d rolling dispute-evidence-submission p95 ≤ 24h"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
