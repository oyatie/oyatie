# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-webhook-delivery-success
  displayName: "payments: outbound webhook delivery success ≥ 99.99% within 5 min retries"
  labels:
    microservice: payments
    bounded_context: webhook-handler
    sli_class: correctness
    tier: substrate-hero
    plane: data
    owner_team: axis-payments
    pack_scope: all
spec:
  service: payments
  description: |
    Per-24h share of outbound webhook deliveries (to tenant subscriber endpoints)
    that succeed within 5 minutes (including up to 3 exponential retries).
    Misses indicate webhook-subscriber outage or our retry-logic bug.
  indicator:
    metadata:
      name: payments-webhook-outbound-delivery-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_webhook_outbound_delivery_total{outcome="success_within_5min"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_webhook_outbound_delivery_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "24h rolling webhook delivery success ≥ 99.99%"
  timeWindow:
    - duration: 24h
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
