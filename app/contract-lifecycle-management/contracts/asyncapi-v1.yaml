asyncapi: 3.1.0
info:
  title: Contract Lifecycle Management Events
  version: 1.0.0
  description: Tenant-scoped event contract for contract state, clause controls, obligations, approvals, and renewal risk.
defaultContentType: application/json
channels:
  contract-lifecycle-management.events.v1:
    address: contract-lifecycle-management.events.v1
    messages:
      contractLifecycleManagementActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/contract-lifecycle-management.events.v1'
    messages:
      - $ref: '#/channels/contract-lifecycle-management.events.v1/messages/contractLifecycleManagementActionAccepted'
components:
  messages:
    ActionAccepted:
      name: ContractLifecycleManagementActionAccepted
      title: Contract Lifecycle Management action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
