[package]
name = "mail-relay"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
mail-api = { path = "../../ports/mail-api" }
mail-kernel = { path = "../../core/mail-kernel" }
tokio = { workspace = true, features = ["io-util"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
base64 = "=0.22.1"
smtp-proto = "=0.2.4"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
