[package]
name = "mail-protocol"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[features]
upstream-tests = []

[[test]]
name = "stalwart"
path = "tests/stalwart.rs"
required-features = ["upstream-tests"]

[[test]]
name = "imap_stalwart"
path = "tests/imap_stalwart.rs"
required-features = ["upstream-tests"]

[[test]]
name = "imap_condstore"
path = "tests/imap_condstore.rs"
required-features = ["upstream-tests"]

[[test]]
name = "imap_thread"
path = "tests/imap_thread.rs"
required-features = ["upstream-tests"]

[[test]]
name = "imap_objectid"
path = "tests/imap_objectid.rs"
required-features = ["upstream-tests"]

[[test]]
name = "imap_uidonly"
path = "tests/imap_uidonly.rs"
required-features = ["upstream-tests"]

[[test]]
name = "pop_stalwart"
path = "tests/pop_stalwart.rs"
required-features = ["upstream-tests"]

[[test]]
name = "jmap_profile_stalwart"
path = "tests/jmap_profile_stalwart.rs"
required-features = ["upstream-tests"]

[[test]]
name = "submission_stalwart"
path = "tests/submission_stalwart.rs"
required-features = ["upstream-tests"]

[[test]]
name = "jmap_vacation_stalwart"
path = "tests/jmap_vacation_stalwart.rs"
required-features = ["upstream-tests"]

[dependencies]
base64 = "=0.22.1"
mail-kernel = { path = "../../core/mail-kernel" }
mail-service = { path = "../../core/mail-service" }
mail-api = { path = "../../ports/mail-api" }
axum = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = ["io-util"] }
serde_json.workspace = true
sha2.workspace = true
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
unicode-normalization = "=0.1.25"
unicode-case-mapping = "=1.0.0"
mail-builder = { version = "=1.0.0", default-features = false }

[dev-dependencies]
rusqlite.workspace = true
mail-sqlite = { path = "../mail-sqlite" }
tower.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
