[package]
name = "mail-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
mail-api = { path = "../../ports/api" }
mail-smtp-relay = { path = "../../adapters/smtp-relay" }
mail-kernel = { path = "../../core/kernel" }
mail-service = { path = "../../core/service" }
mail-sqlite-store = { path = "../../adapters/sqlite-store" }
mail-protocol-imap = { path = "../../adapters/protocol-imap" }
mail-auth = { version = "=0.13.3", default-features = false, features = [
    "aws-lc-rs",
] }
axum.workspace = true
tokio.workspace = true
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
base64 = "=0.22.1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
