# Retired-vocabulary registry — machine-readable record of retired CLI
# surfaces, retired crates, retired script paths, and other retired
# terms.
#
# Each row asserts that the listed `term` MUST NOT appear in any live
# document (excluding evidence/audits/, which is a historical record).
# The Rust retired-vocabulary kernel reads this file through Buck2/Prow-owned
# lanes and fails fast on any drift. Retired Oya CLI runners are historical
# provenance only and MUST NOT be restored as merge or CI authority.
#
# Adding a row: every retirement commit that removes a CLI surface,
# crate, or script SHOULD add the corresponding row here in the SAME
# commit so the lane stays green and future drift is caught
# immediately.
#
# Schema (per row):
#   term                  — literal substring searched verbatim
#                            (case-sensitive)
#   retired_at            — YYYY-MM-DD (date the retirement landed)
#   canonical_replacement — the surface to use instead
#   adr                   — optional ADR identifier recording the
#                            retirement decision (e.g. ADR-0123). Omit
#                            or leave blank for changes that did not
#                            require an ADR.
#
# Lane: oya-governance-retired-vocabulary
# Kernel: crates/oya-check-retired-vocabulary
# Runner: Buck2/Prow-owned Rust lane wrapper around libs/oya-check-retired-vocabulary
# Lane invocation: `buck2 build //libs/oya-check-retired-vocabulary:oya-check-retired-vocabulary`

retired:
  - term: "repoctl pre-push"
    retired_at: "2026-05-15"
    canonical_replacement: "Buck2-backed local verification plus trusted Rust/Prow oya-ci-required status"
    adr: ""
  - term: "oya dev check"
    retired_at: "2026-05-15"
    canonical_replacement: "Buck2 build/test/check targets and trusted Rust/Prow oya-ci-required status"
    adr: ""
  - term: "scripts/check.sh"
    retired_at: "2026-05-15"
    canonical_replacement: "Buck2 lane targets declared in registry/quality/lanes.yaml"
    adr: ""
  - term: "scripts/check-architecture-boundaries.sh"
    retired_at: "2026-05-15"
    canonical_replacement: "Rust/Buck2 architecture-boundary check target"
    adr: ""
  - term: "scripts/hooks/pre-push-repoctl.sh"
    retired_at: "2026-05-15"
    canonical_replacement: "optional local Buck2 pre-push evidence; merge authority remains Rust/Prow oya-ci-required"
    adr: ""
  - term: ".omc/hooks/grit-claim-intent-gate.sh"
    retired_at: "2026-05-16"
    canonical_replacement: "native SCM worktree lease plus GitHub PR adapter; retired CLI remains tombstone/provenance only"
    adr: ""
