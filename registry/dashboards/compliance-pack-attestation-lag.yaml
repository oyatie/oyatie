schema_version: "2026-05-20.observability-dashboard.v1"
doc_class: ObservabilityDashboard
dashboard_id: compliance-pack-attestation-lag
owner: ops-compliance
related_oyatie_adrs:
  - ADR-0263
  - ADR-0130
  - ADR-0139
  - ADR-0251
  - ADR-0316
title: "Compliance Pack Attestation Lag"
description: "Compliance-pack dashboard for audit-attestation latency, regulator evidence export success rate, evidence expiry alerts, pack overlay drift, and per-pack SLO override health. Covers GDPR, HIPAA, SOC2 Type II, PCI DSS v4, KR PIPA, CSAP, EU AI Act, and EU CSRD registry packs."
refresh: 1m
time_from: now-30d
time_to: now
timezone: utc
folder: oyatie-compliance
schema_tags:
  - compliance-pack
  - attestation
  - evidence-export
  - expiry
  - adr-0263
datasource_defaults:
  metrics: Mimir
  logs: Loki
  analytics: ClickHouse
variables:
  - name: environment
    label: Environment
    type: custom
    default: production
    values:
      - dev
      - staging
      - production
  - name: pack_id
    label: Compliance Pack
    type: custom
    default: ".*"
    values:
      - GDPR-2016-EU
      - HIPAA-US
      - SOC2-Type-II
      - PCI-DSS-v4
      - KR-PIPA
      - CSAP
      - EU-AI-Act
      - EU-CSRD
      - ".*"
  - name: tenant_id
    label: Tenant
    type: query
    datasource: Mimir
    query: "label_values(oya:compliance-pack:attestation:events_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\"}, tenant_id)"
    multi: true
    include_all: true
  - name: audit_class
    label: Audit Class
    type: query
    datasource: Mimir
    query: "label_values(oya:compliance-pack:attestation:events_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\"}, audit_class)"
    multi: true
    include_all: true
  - name: regulator
    label: Regulator
    type: query
    datasource: Mimir
    query: "label_values(oya:compliance-pack:evidence_export:attempts_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\"}, regulator)"
    multi: true
    include_all: true
  - name: cell_id
    label: Cell
    type: query
    datasource: Mimir
    query: "label_values(oya:compliance-pack:attestation:lag_seconds:gauge{environment=\"$environment\",pack_id=~\"$pack_id\"}, cell_id)"
    multi: true
    include_all: true
  - name: window
    label: Query Window
    type: custom
    default: 30m
    values:
      - 5m
      - 30m
      - 6h
      - 1d
annotations:
  - name: pack_activation_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"CompliancePackInstalled|CompliancePackOverlayUpdated|CompliancePackRevoked\",environment=\"$environment\",tenant_id=~\"$tenant_id\"} | json | pack_id=~\"$pack_id\" | line_format \"{{.tenant_id}} {{.pack_id}} {{.event_class}} {{.audit_id}}\""
    tags:
      - pack
      - activation
  - name: evidence_export_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"RegulatorEvidenceExportStarted|RegulatorEvidenceExportCompleted|RegulatorEvidenceExportFailed\",environment=\"$environment\",tenant_id=~\"$tenant_id\"} | json | pack_id=~\"$pack_id\" | line_format \"{{.pack_id}} {{.regulator}} {{.export_id}} {{.status}}\""
    tags:
      - evidence-export
      - regulator
  - name: incident_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"ComplianceAttestationLagBreach|EvidenceExpiryBreach|RegulatorEvidenceExportFailed\",environment=\"$environment\"} | json | line_format \"{{.severity}} {{.pack_id}} {{.tenant_id}} {{.incident_id}}\""
    tags:
      - incident
      - compliance
panels:
  - title: "Attestation event throughput by pack"
    type: graph
    datasource: Mimir
    unit: events/sec
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "sum by (pack_id, tenant_id, audit_class, cell_id) (rate(oya:compliance-pack:attestation:events_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",audit_class=~\"$audit_class\",cell_id=~\"$cell_id\"}[$window]))"
        labels:
          signal: attestation_event_throughput
          adr_anchor: ADR-0263
  - title: "Audit attestation latency p50"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "histogram_quantile(0.50, sum by (le, pack_id, audit_class, cell_id) (rate(oya:compliance-pack:attestation:latency_seconds:bucket{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",audit_class=~\"$audit_class\",cell_id=~\"$cell_id\"}[$window])))"
        labels:
          signal: attestation_latency_p50
          bucket_label: le
  - title: "Audit attestation latency p95"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "histogram_quantile(0.95, sum by (le, pack_id, audit_class, cell_id) (rate(oya:compliance-pack:attestation:latency_seconds:bucket{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",audit_class=~\"$audit_class\",cell_id=~\"$cell_id\"}[$window])))"
        labels:
          signal: attestation_latency_p95
          bucket_label: le
  - title: "Audit attestation latency p99"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "histogram_quantile(0.99, sum by (le, pack_id, audit_class, cell_id) (rate(oya:compliance-pack:attestation:latency_seconds:bucket{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",audit_class=~\"$audit_class\",cell_id=~\"$cell_id\"}[$window])))"
        labels:
          signal: attestation_latency_p99
          bucket_label: le
  - title: "Current attestation lag by pack"
    type: gauge
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (pack_id, tenant_id, audit_class, cell_id) (oya:compliance-pack:attestation:lag_seconds:gauge{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",audit_class=~\"$audit_class\",cell_id=~\"$cell_id\"})"
        labels:
          signal: current_attestation_lag
          target_max_seconds: "300"
  - title: "Regulator evidence export success rate"
    type: gauge
    datasource: Mimir
    unit: percent
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "100 * sum by (pack_id, regulator, tenant_id) (rate(oya:compliance-pack:evidence_export:attempts_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",regulator=~\"$regulator\",result=\"success\"}[$window])) / clamp_min(sum by (pack_id, regulator, tenant_id) (rate(oya:compliance-pack:evidence_export:attempts_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",regulator=~\"$regulator\"}[$window])), 0.001)"
        labels:
          signal: regulator_export_success_rate
          target_percent: "99"
  - title: "Evidence export latency p99"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "histogram_quantile(0.99, sum by (le, pack_id, regulator, tenant_id) (rate(oya:compliance-pack:evidence_export:duration_seconds:bucket{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\",regulator=~\"$regulator\"}[$window])))"
        labels:
          signal: evidence_export_latency_p99
          bucket_label: le
  - title: "Evidence items expiring soon"
    type: table
    datasource: Mimir
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (pack_id, tenant_id, evidence_class, evidence_id) (oya:compliance-pack:evidence:expires_in_seconds:gauge{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\"} < 604800)"
        labels:
          signal: evidence_expiring_within_7d
          expiry_threshold_seconds: "604800"
  - title: "Expired evidence count"
    type: gauge
    datasource: Mimir
    unit: evidence_items
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "sum by (pack_id, tenant_id, evidence_class) (oya:compliance-pack:evidence:expired:gauge{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\"})"
        labels:
          signal: expired_evidence_count
          target_value: "0"
  - title: "Pack overlay drift"
    type: graph
    datasource: Mimir
    unit: drift/sec
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "sum by (pack_id, tenant_id, drift_type, source_microservice) (rate(oya:compliance-pack:overlay:drift_detected_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\"}[$window]))"
        labels:
          signal: compliance_overlay_drift
          target_value: "0"
  - title: "Pack SLO override breaches"
    type: graph
    datasource: Mimir
    unit: breaches/sec
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "sum by (pack_id, tenant_id, slo_id, override_id) (rate(oya:compliance-pack:slo_override:breaches_total:counter{environment=\"$environment\",pack_id=~\"$pack_id\",tenant_id=~\"$tenant_id\"}[$window]))"
        labels:
          signal: pack_slo_override_breaches
          promotion_gate: held
  - title: "Evidence export audit trail"
    type: table
    datasource: Loki
    targets:
      - ref_id: A
        query_type: LogQL
        expr: "{event_class=~\"RegulatorEvidenceExportStarted|RegulatorEvidenceExportCompleted|RegulatorEvidenceExportFailed\",environment=\"$environment\",tenant_id=~\"$tenant_id\"} | json | pack_id=~\"$pack_id\" | regulator=~\"$regulator\" | line_format \"{{.ts}} {{.tenant_id}} {{.pack_id}} {{.regulator}} {{.export_id}} {{.status}} {{.audit_id}}\""
        labels:
          signal: evidence_export_audit_log
          requires_field: audit_id
  - title: "Pack attestation SQL evidence"
    type: table
    datasource: ClickHouse
    targets:
      - ref_id: A
        query_type: SQL
        expr: "SELECT tenant_id, pack_id, audit_class, regulator, quantile(0.99)(attestation_latency_ms) AS p99_attestation_ms, countIf(export_result = 'success') / greatest(count(), 1) AS export_success_ratio, min(expires_at) AS next_expiry, max(audit_id) AS latest_audit_id FROM oya_compliance_pack_attestations WHERE environment = '$environment' AND ts >= now() - INTERVAL 30 DAY GROUP BY tenant_id, pack_id, audit_class, regulator ORDER BY next_expiry ASC LIMIT 200"
        labels:
          signal: pack_attestation_history
          storage: clickhouse
alerts:
  - alert_id: compliance_attestation_lag_high
    title: "Compliance attestation lag above five minutes"
    datasource: Mimir
    severity: page
    condition: "max(oya:compliance-pack:attestation:lag_seconds:gauge{environment=\"$environment\"}) > 300"
    for: 5m
    labels:
      gate: oya-vcs-promotion-readiness
      verdict_on_fire: held
  - alert_id: regulator_export_success_low
    title: "Regulator evidence export success below 99 percent"
    datasource: Mimir
    severity: page
    condition: "100 * sum(rate(oya:compliance-pack:evidence_export:attempts_total:counter{environment=\"$environment\",result=\"success\"}[30m])) / clamp_min(sum(rate(oya:compliance-pack:evidence_export:attempts_total:counter{environment=\"$environment\"}[30m])), 0.001) < 99"
    for: 30m
    labels:
      regulator_evidence: export
  - alert_id: compliance_evidence_expired
    title: "Compliance evidence expired"
    datasource: Mimir
    severity: critical
    condition: "sum(oya:compliance-pack:evidence:expired:gauge{environment=\"$environment\"}) > 0"
    for: 1m
    labels:
      remediation: regenerate-evidence-or-hold-pack
  - alert_id: compliance_evidence_expiring_soon
    title: "Compliance evidence expires within seven days"
    datasource: Mimir
    severity: ticket
    condition: "max(oya:compliance-pack:evidence:expires_in_seconds:gauge{environment=\"$environment\"} < 604800) > 0"
    for: 10m
    labels:
      expiry_window: 7d
