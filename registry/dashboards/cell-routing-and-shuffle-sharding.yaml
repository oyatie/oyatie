schema_version: "2026-05-20.observability-dashboard.v1"
doc_class: ObservabilityDashboard
dashboard_id: cell-routing-and-shuffle-sharding
owner: axis-cell
related_oyatie_adrs:
  - ADR-0248
  - ADR-0263
  - ADR-0130
  - ADR-0139
  - ADR-0009
title: "Cell Routing and Shuffle Sharding"
description: "Cell topology dashboard for ADR-0248: per-cell capacity, tenant-to-cell assignment health, shuffle-shard overlap risk, routing error rates, cell drain progress, and blast-radius indicators. Used by SRE and promotion gates to verify that cells remain bounded failure domains."
refresh: 30s
time_from: now-12h
time_to: now
timezone: utc
folder: oyatie-cell-architecture
schema_tags:
  - cell
  - shuffle-sharding
  - capacity
  - cell-drain
  - adr-0248
datasource_defaults:
  metrics: Mimir
  logs: Loki
  analytics: ClickHouse
variables:
  - name: environment
    label: Environment
    type: custom
    default: dev
    values:
      - dev
      - staging
      - production
  - name: cell_id
    label: Cell
    type: query
    datasource: Mimir
    query: "label_values(oya:cell:capacity:available_units:gauge{environment=\"$environment\"}, cell_id)"
    multi: true
    include_all: true
  - name: cell_tier
    label: Cell Tier
    type: custom
    default: ".*"
    values:
      - tier-1-bootstrap
      - tier-2-control-plane
      - tier-3-data-plane
      - service-cell
      - tier-4-reserved
      - ".*"
  - name: shuffle_shard_id
    label: Shuffle Shard
    type: query
    datasource: Mimir
    query: "label_values(oya:cell:shuffle_shard:health:gauge{environment=\"$environment\",cell_id=~\"$cell_id\"}, shuffle_shard_id)"
    multi: true
    include_all: true
  - name: tenant_id
    label: Tenant
    type: query
    datasource: Mimir
    query: "label_values(oya:cell:routing:requests_total:counter{environment=\"$environment\",cell_id=~\"$cell_id\"}, tenant_id)"
    multi: true
    include_all: true
  - name: region
    label: Region
    type: query
    datasource: Mimir
    query: "label_values(oya:cell:capacity:available_units:gauge{environment=\"$environment\"}, region)"
    multi: true
    include_all: true
  - name: window
    label: Query Window
    type: custom
    default: 5m
    values:
      - 1m
      - 5m
      - 30m
      - 1h
annotations:
  - name: cell_deployment_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"CellTemplateDeployed|CellRouteTableUpdated\",environment=\"$environment\",cell_id=~\"$cell_id\"} | json | line_format \"{{.cell_id}} {{.version}} {{.audit_id}}\""
    tags:
      - deploy
      - cell
  - name: cell_drain_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"CellDrainStarted|CellDrainProgressed|CellDrainCompleted|CellDrainRolledBack\",environment=\"$environment\",cell_id=~\"$cell_id\"} | json | line_format \"{{.cell_id}} {{.drain_phase}} {{.progress_percent}}\""
    tags:
      - drain
      - capacity
  - name: incident_markers
    datasource: Loki
    enable: true
    query: "{event_class=~\"CellIsolationBreach|CellCapacityExhausted|ShuffleShardOverlapBreach\",environment=\"$environment\"} | json | line_format \"{{.severity}} {{.incident_id}} {{.cell_id}}\""
    tags:
      - incident
      - blast-radius
panels:
  - title: "Per-cell capacity available"
    type: gauge
    datasource: Mimir
    unit: capacity_units
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (cell_id, cell_tier, region) (oya:cell:capacity:available_units:gauge{environment=\"$environment\",cell_id=~\"$cell_id\",cell_tier=~\"$cell_tier\",region=~\"$region\"})"
        labels:
          signal: cell_capacity_available
          adr_anchor: ADR-0248
  - title: "Per-cell capacity utilization"
    type: graph
    datasource: Mimir
    unit: percent
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "100 * max by (cell_id, cell_tier, region) (oya:cell:capacity:allocated_units:gauge{environment=\"$environment\",cell_id=~\"$cell_id\",cell_tier=~\"$cell_tier\",region=~\"$region\"}) / clamp_min(max by (cell_id, cell_tier, region) (oya:cell:capacity:total_units:gauge{environment=\"$environment\",cell_id=~\"$cell_id\",cell_tier=~\"$cell_tier\",region=~\"$region\"}), 1)"
        labels:
          signal: cell_capacity_utilization
          warning_percent: "80"
  - title: "Routing request rate by cell"
    type: graph
    datasource: Mimir
    unit: reqps
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "sum by (cell_id, route_family, tenant_id) (rate(oya:cell:routing:requests_total:counter{environment=\"$environment\",cell_id=~\"$cell_id\",tenant_id=~\"$tenant_id\",region=~\"$region\"}[$window]))"
        labels:
          signal: cell_routing_rate
          metric_family: red
  - title: "Routing error rate by cell"
    type: graph
    datasource: Mimir
    unit: percent
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "100 * sum by (cell_id, route_family) (rate(oya:cell:routing:requests_total:counter{environment=\"$environment\",cell_id=~\"$cell_id\",tenant_id=~\"$tenant_id\",status=~\"5..|429\"}[$window])) / clamp_min(sum by (cell_id, route_family) (rate(oya:cell:routing:requests_total:counter{environment=\"$environment\",cell_id=~\"$cell_id\",tenant_id=~\"$tenant_id\"}[$window])), 0.001)"
        labels:
          signal: routing_error_rate
          metric_family: red
  - title: "Routing latency p99"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "histogram_quantile(0.99, sum by (le, cell_id, route_family) (rate(oya:cell:routing:decision_duration_seconds:bucket{environment=\"$environment\",cell_id=~\"$cell_id\",tenant_id=~\"$tenant_id\",region=~\"$region\"}[$window])))"
        labels:
          signal: routing_latency_p99
          bucket_label: le
  - title: "Shuffle-shard health"
    type: gauge
    datasource: Mimir
    unit: bool
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "min by (shuffle_shard_id, cell_id, region) (oya:cell:shuffle_shard:health:gauge{environment=\"$environment\",shuffle_shard_id=~\"$shuffle_shard_id\",cell_id=~\"$cell_id\",region=~\"$region\"})"
        labels:
          signal: shuffle_shard_health
          target_value: "1"
  - title: "Shuffle-shard full-overlap risk"
    type: graph
    datasource: Mimir
    unit: probability
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (shuffle_shard_id, tenant_id, compared_tenant_id) (oya:cell:shuffle_shard:full_overlap_probability:gauge{environment=\"$environment\",shuffle_shard_id=~\"$shuffle_shard_id\",tenant_id=~\"$tenant_id\"})"
        labels:
          signal: shuffle_shard_overlap_risk
          target_max: "0.000000000001"
  - title: "Shard member cell count"
    type: graph
    datasource: Mimir
    unit: cells
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "count by (shuffle_shard_id, tenant_id) (oya:cell:shuffle_shard:membership:gauge{environment=\"$environment\",shuffle_shard_id=~\"$shuffle_shard_id\",tenant_id=~\"$tenant_id\",cell_id=~\"$cell_id\"} == 1)"
        labels:
          signal: shuffle_shard_width
          adr_anchor: ADR-0248-D7
  - title: "Cell drain progress"
    type: gauge
    datasource: Mimir
    unit: percent
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (cell_id, drain_id, drain_phase) (oya:cell:drain:progress_percent:gauge{environment=\"$environment\",cell_id=~\"$cell_id\"})"
        labels:
          signal: cell_drain_progress
          target_complete_percent: "100"
  - title: "Tenants remaining in draining cells"
    type: graph
    datasource: Mimir
    unit: tenants
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (cell_id, drain_id) (oya:cell:drain:remaining_tenants:gauge{environment=\"$environment\",cell_id=~\"$cell_id\"})"
        labels:
          signal: drain_remaining_tenants
          target_value: "0"
  - title: "Cell route table convergence lag"
    type: graph
    datasource: Mimir
    unit: seconds
    targets:
      - ref_id: A
        query_type: PromQL
        expr: "max by (cell_id, route_table_version) (time() - oya:cell:routing:route_table_loaded_at:gauge{environment=\"$environment\",cell_id=~\"$cell_id\"})"
        labels:
          signal: route_table_convergence_lag
          target_max_seconds: "60"
  - title: "Cell and shard incident evidence"
    type: table
    datasource: Loki
    targets:
      - ref_id: A
        query_type: LogQL
        expr: "{event_class=~\"CellIsolationBreach|CellCapacityExhausted|ShuffleShardOverlapBreach|CellDrainRolledBack\",environment=\"$environment\",cell_id=~\"$cell_id\"} | json | line_format \"{{.ts}} {{.cell_id}} {{.shuffle_shard_id}} {{.tenant_id}} {{.severity}} {{.audit_id}}\""
        labels:
          signal: cell_incident_evidence
          requires_field: audit_id
  - title: "Cell assignment SQL audit"
    type: table
    datasource: ClickHouse
    targets:
      - ref_id: A
        query_type: SQL
        expr: "SELECT tenant_id, shuffle_shard_id, groupArray(cell_id) AS assigned_cells, max(route_table_version) AS latest_version, max(audit_id) AS latest_audit_id FROM oya_cell_assignments WHERE environment = '$environment' AND updated_at >= now() - INTERVAL 12 HOUR GROUP BY tenant_id, shuffle_shard_id ORDER BY tenant_id LIMIT 200"
        labels:
          signal: cell_assignment_audit
          storage: clickhouse
alerts:
  - alert_id: cell_capacity_exhaustion
    title: "Cell capacity utilization above 90 percent"
    datasource: Mimir
    severity: page
    condition: "100 * max(oya:cell:capacity:allocated_units:gauge{environment=\"$environment\"}) / clamp_min(max(oya:cell:capacity:total_units:gauge{environment=\"$environment\"}), 1) > 90"
    for: 10m
    labels:
      gate: oya-governance-promotion-readiness
      verdict_on_fire: held
  - alert_id: shuffle_shard_unhealthy
    title: "Shuffle shard health below one"
    datasource: Mimir
    severity: page
    condition: "min(oya:cell:shuffle_shard:health:gauge{environment=\"$environment\"}) < 1"
    for: 5m
    labels:
      adr_anchor: ADR-0248
  - alert_id: cell_drain_stalled
    title: "Cell drain stalled"
    datasource: Mimir
    severity: ticket
    condition: "max(oya:cell:drain:remaining_tenants:gauge{environment=\"$environment\"}) > 0 and deriv(max by (cell_id) (oya:cell:drain:progress_percent:gauge{environment=\"$environment\"})[30m:5m]) == 0"
    for: 30m
    labels:
      runbook: cell-drain-recovery
