# Per-microservice DR tier declarations per ADR-0180.
# Updated as each microservice's DR plan is signed off by ops-dr-capacity.
authored: 2026-05-18
authority: ADR-0180
schema: /specs/dr-business-continuity.json

t1:
  - foundry          # foundry runtime; capability invocation
  - audit-chain      # the audit chain itself
  - observability    # observability is the substrate during DR
  - tenancy          # identity kernel
  - cloud-secrets    # the KMS / vault surface
  - cell             # cell registry; cell-router on the critical path

t2:
  - workflow-engine
  - workflow-studio
  - ontology
  - drive
  - mail
  - calendar
  - meet
  - messenger
  - connect

t3:
  - sheets
  - slides
  - forms
  - notes
  - sites
  - recordings
  - social
  - community
  - shorts
  - tasks
  - translate
  - application
  - anonymous

t4:
  - governance       # internal staff governance tooling

