---
doc_class: WorkflowTemplate
template_id: workflow-template.retail-inventory-replenishment-with-demand-sensing.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0059-workflow-ontology-ecosystem-adapter-layer
  - ADR-0185-workflow-studio-client-stack
title: Retail inventory replenishment with demand sensing
description: >-
  Coordinates store and distribution-center replenishment by ingesting POS,
  promotion, weather, and cycle-count signals, generating demand forecasts,
  recalculating safety stock, routing exceptions, creating replenishment orders,
  and validating receipt against shelf availability.
tags:
  - retail
  - inventory
  - demand-sensing
  - replenishment
  - cycle-counting
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: silver
    reason: "Retail operators need cycle-count and replenishment orchestration."
  - tier: gold
    reason: "Adds ML demand sensing, safety stock recalculation, and exception approval."
ontology_refs:
  object: RetailReplenishmentCase
  actions:
    - InventorySignalsIngested
    - DemandForecastGenerated
    - SafetyStockCalculated
    - CycleCountReconciled
    - ReplenishmentOrderCreated
    - StockReceiptValidated
tenant_context:
  required_fields:
    - tenant_id
    - banner_id
    - store_cluster_id
    - inventory_planner_principal_id
principal_context:
  system_principal: workflow-engine.retail-replenishment
  human_approval_roles:
    - inventory_planner
    - store_manager
    - merchandising_owner
    - distribution_center_owner
data_classes:
  - POINT_OF_SALE
  - INVENTORY_POSITION
  - PROMOTION_CALENDAR
  - WEATHER_SIGNAL
  - DEMAND_FORECAST
  - REPLENISHMENT_ORDER
residency_pack_overlays:
  - pack: gdpr
    behavior: "Use aggregated POS demand signals without customer-level identifiers."
  - pack: sox
    behavior: "Preserve inventory adjustment approvals and cycle-count variance evidence."
observability:
  metrics:
    - retail_replenishment_step_latency_seconds
    - retail_replenishment_stockout_risk_total
    - retail_replenishment_cycle_count_variance_total
  traces:
    - workflow.template.retail_inventory_replenishment
  logs:
    - workflow_retail_replenishment_audit_projection
cost_allocation:
  unit: replenishment_plan
  dimensions:
    - tenant_id
    - banner_id
    - store_cluster_id
idempotency:
  key_shape: "tenant_id:store_cluster_id:sku_set_id:planning_date:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: create_replenishment_order
  on_cancel: withdraw_unapproved_replenishment_plan
  audit_event_class: RetailReplenishmentCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_idempotent_actions
inputs:
  tenant_id:
    type: string
    default: tenant_retail_demo
  banner_id:
    type: string
    default: banner_urban_market
  store_cluster_id:
    type: string
    default: stores_nyc_core
  sku_set_id:
    type: string
    default: sku_set_beverages_weekly
  planning_date:
    type: date
    default: "2026-06-04"
  inventory_planner_principal_id:
    type: string
    default: principal_inventory_planner_001
  demand_model_version:
    type: string
    default: retail-demand-sensing-2026-05
outputs:
  replenishment_case_id:
    type: string
  terminal_state:
    type: string
  replenishment_order_id:
    type: string
  stockout_risk_delta:
    type: number
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: ingest_inventory_signals
    type: start
    config:
      trigger: retail.replenishment.window.opened.v1
      validates:
        - tenant_id
        - store_cluster_id
        - sku_set_id
        - planning_date
      signal_sources:
        - pos_sales
        - inventory_position
        - promotion_calendar
        - weather_forecast
    cedar_permits_required:
      - 'Action::"StartRetailReplenishmentWorkflow"'
    audit_event_class: RetailInventorySignalsIngested
    slo_target: "PT30M after planning window opens"
    failure_modes:
      - code: INVENTORY_SIGNAL_MISSING
        behavior: "Proceed with stale-signal warning only after planner approval."
    on_success:
      - edge_to_generate_demand_forecast
    on_failure:
      - edge_to_exception_end
  - id: generate_demand_forecast
    type: action
    config:
      service: retail-demand-ml
      contract: demand-sensing-forecast.v1
      method: POST
      url: "https://retail-ml.internal/v1/demand-forecasts"
      model_version: "${inputs.demand_model_version}"
      features:
        - last_28_day_sales
        - promotion_lift
        - local_weather
        - holiday_calendar
        - stockout_censored_sales
      body:
        store_cluster_id: "${inputs.store_cluster_id}"
        sku_set_id: "${inputs.sku_set_id}"
        planning_date: "${inputs.planning_date}"
    cedar_permits_required:
      - 'Action::"GenerateRetailDemandForecast"'
    audit_event_class: RetailDemandForecastGenerated
    slo_target: "PT45M"
    failure_modes:
      - code: FORECAST_CONFIDENCE_LOW
        behavior: "Route low-confidence SKU group to planner review."
    on_success:
      - edge_to_compute_safety_stock
    on_failure:
      - edge_to_planner_review
  - id: compute_safety_stock
    type: action
    config:
      service: inventory-planning
      contract: safety-stock-calculation.v1
      method: POST
      url: "https://inventory.internal/v1/safety-stock/calculate"
      body:
        forecast_id: "${nodes.generate_demand_forecast.output.forecast_id}"
        service_level_target: 0.98
        lead_time_source: supplier_and_dc_history
        demand_variability_window: P90D
    cedar_permits_required:
      - 'Action::"ComputeRetailSafetyStock"'
    audit_event_class: RetailSafetyStockCalculated
    slo_target: "PT20M"
    failure_modes:
      - code: SAFETY_STOCK_OUTLIER
        behavior: "Require merchandising approval before replenishment order creation."
    on_success:
      - edge_to_reconcile_cycle_count
    on_failure:
      - edge_to_planner_review
  - id: reconcile_cycle_count
    type: human_task
    config:
      assignee_role: store_manager
      task_contract: cycle-count-reconciliation.v1
      variance_thresholds:
        unit_variance_percent: 5
        value_variance_amount: 1000
      required_attestations:
        - counted_high_velocity_skus
        - variance_reason_recorded
    cedar_permits_required:
      - 'Action::"ReconcileRetailCycleCount"'
    audit_event_class: RetailCycleCountReconciled
    slo_target: "P1D"
    failure_modes:
      - code: CYCLE_COUNT_VARIANCE_HIGH
        behavior: "Hold affected SKUs and create loss-prevention review."
    on_success:
      - edge_to_replenishment_decision
    on_failure:
      - edge_to_planner_review
  - id: replenishment_decision
    type: decision
    config:
      expression: "${nodes.compute_safety_stock.output.replenishment_required}"
      cases:
        true: create_replenishment_order
        false: close_workflow
      default_case: planner_review
    cedar_permits_required:
      - 'Action::"DecideRetailReplenishmentNeed"'
    audit_event_class: RetailReplenishmentDecisionEvaluated
    slo_target: "PT10M after cycle count"
    failure_modes:
      - code: REPLENISHMENT_DECISION_AMBIGUOUS
        behavior: "Route to inventory planner with forecast and cycle-count evidence."
    on_success:
      - edge_to_create_replenishment_order
      - edge_to_close_no_replenishment
    on_failure:
      - edge_to_planner_review
  - id: planner_review
    type: human_task
    config:
      assignee_role: inventory_planner
      task_contract: replenishment-exception-review.v1
      review_reasons:
        - low_forecast_confidence
        - safety_stock_outlier
        - cycle_count_variance
        - supplier_constraint
    cedar_permits_required:
      - 'Action::"ApproveRetailReplenishmentException"'
    audit_event_class: RetailReplenishmentPlannerReviewCompleted
    slo_target: "P2D"
    failure_modes:
      - code: PLANNER_REVIEW_OVERDUE
        behavior: "Escalate to merchandising owner and keep SKU group on watchlist."
    on_success:
      - edge_to_create_replenishment_order
    on_failure:
      - edge_to_exception_end
  - id: create_replenishment_order
    type: action
    config:
      service: inventory-procurement
      contract: replenishment-order.v1
      method: POST
      url: "https://inventory.internal/v1/replenishment-orders"
      body:
        store_cluster_id: "${inputs.store_cluster_id}"
        sku_set_id: "${inputs.sku_set_id}"
        safety_stock_plan_id: "${nodes.compute_safety_stock.output.plan_id}"
        cycle_count_id: "${nodes.reconcile_cycle_count.output.cycle_count_id}"
    cedar_permits_required:
      - 'Action::"CreateRetailReplenishmentOrder"'
    audit_event_class: RetailReplenishmentOrderCreated
    slo_target: "PT4H after approval"
    failure_modes:
      - code: SUPPLIER_ALLOCATION_CONSTRAINT
        behavior: "Split order by supplier allocation and notify planner."
    on_success:
      - edge_to_allocate_dc_stock
    on_failure:
      - edge_to_exception_end
  - id: allocate_dc_stock
    type: action
    config:
      service: distribution-center
      contract: dc-stock-allocation.v1
      method: POST
      url: "https://dc.internal/v1/stock/allocate"
      body:
        replenishment_order_id: "${nodes.create_replenishment_order.output.replenishment_order_id}"
        allocation_strategy: service_level_then_margin
        substitution_allowed: false
    cedar_permits_required:
      - 'Action::"AllocateRetailDcStock"'
    audit_event_class: RetailDistributionStockAllocated
    slo_target: "PT6H"
    failure_modes:
      - code: DC_STOCK_SHORTAGE
        behavior: "Backorder constrained lines and recalculate stockout risk."
    on_success:
      - edge_to_validate_receipt
    on_failure:
      - edge_to_planner_review
  - id: validate_receipt
    type: human_task
    config:
      assignee_role: store_manager
      task_contract: retail-replenishment-receipt.v1
      captures:
        - received_quantity
        - shelf_fill_confirmed
        - damaged_units
        - substitute_units
    cedar_permits_required:
      - 'Action::"ValidateRetailReplenishmentReceipt"'
    audit_event_class: RetailReplenishmentReceiptValidated
    slo_target: "P1D after delivery"
    failure_modes:
      - code: RECEIPT_VARIANCE
        behavior: "Open DC reconciliation task and update available inventory."
    on_success:
      - edge_to_close_workflow
    on_failure:
      - edge_to_exception_end
  - id: close_workflow
    type: end
    config:
      terminal_state: completed
      emits:
        - replenishment_case_closed
        - inventory_position_updated
        - demand_model_feedback_posted
    cedar_permits_required:
      - 'Action::"CloseRetailReplenishmentWorkflow"'
    audit_event_class: RetailReplenishmentWorkflowClosed
    slo_target: "PT2H after receipt validation"
    failure_modes:
      - code: MODEL_FEEDBACK_POST_FAILED
        behavior: "Close operational case and queue model feedback retry."
    on_success: []
    on_failure:
      - edge_to_exception_end
  - id: exception_end
    type: end
    config:
      terminal_state: exception
      requires_manual_owner: true
    cedar_permits_required:
      - 'Action::"RecordRetailReplenishmentException"'
    audit_event_class: RetailReplenishmentExceptionRecorded
    slo_target: "PT30M after exception"
    failure_modes:
      - code: EXCEPTION_AUDIT_WRITE_FAILED
        behavior: "Emit dead-letter event for inventory workflow replay."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_generate_demand_forecast
    from: ingest_inventory_signals
    to: generate_demand_forecast
    name: signals_ingested
  - id: edge_to_compute_safety_stock
    from: generate_demand_forecast
    to: compute_safety_stock
    name: forecast_generated
  - id: edge_to_reconcile_cycle_count
    from: compute_safety_stock
    to: reconcile_cycle_count
    name: safety_stock_calculated
  - id: edge_to_replenishment_decision
    from: reconcile_cycle_count
    to: replenishment_decision
    name: cycle_count_reconciled
  - id: edge_to_create_replenishment_order
    from: replenishment_decision
    to: create_replenishment_order
    name: replenishment_required
  - id: edge_to_close_no_replenishment
    from: replenishment_decision
    to: close_workflow
    name: replenishment_not_required
  - id: edge_to_create_replenishment_order_after_review
    from: planner_review
    to: create_replenishment_order
    name: planner_approved
  - id: edge_to_allocate_dc_stock
    from: create_replenishment_order
    to: allocate_dc_stock
    name: order_created
  - id: edge_to_validate_receipt
    from: allocate_dc_stock
    to: validate_receipt
    name: stock_allocated
  - id: edge_to_close_workflow
    from: validate_receipt
    to: close_workflow
    name: receipt_validated
  - id: edge_to_planner_review
    from: "*"
    to: planner_review
    name: planner_review_required
  - id: edge_to_exception_end
    from: "*"
    to: exception_end
    name: exception_recorded
failure_modes:
  - code: POLICY_DENIED
    behavior: "Stop current node, emit Cedar denial audit, and keep replenishment plan unchanged."
  - code: DEMAND_SIGNAL_DRIFT
    behavior: "Require planner review and preserve model feature snapshot."
  - code: INVENTORY_CONTROL_VARIANCE
    behavior: "Hold affected SKU decisions until cycle-count variance is resolved."
worked_example:
  sample_input:
    tenant_id: tenant_retail_demo
    banner_id: banner_urban_market
    store_cluster_id: stores_nyc_core
    sku_set_id: sku_set_beverages_weekly
    planning_date: "2026-06-04"
    inventory_planner_principal_id: principal_inventory_planner_001
    demand_model_version: retail-demand-sensing-2026-05
  sample_expected_output:
    replenishment_case_id: repl_2026_0604_001
    terminal_state: completed
    replenishment_order_id: ro_2026_778899
    stockout_risk_delta: -0.34
    audit_chain_refs:
      - audit://workflow/retail-replenishment/signals/01
      - audit://workflow/retail-replenishment/forecast/02
      - audit://workflow/retail-replenishment/receipt/09
