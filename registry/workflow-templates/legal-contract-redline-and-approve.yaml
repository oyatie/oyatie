---
doc_class: WorkflowTemplate
template_id: workflow-template.legal-contract-redline-and-approve.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0059-workflow-ontology-ecosystem-adapter-layer
  - ADR-0185-workflow-studio-client-stack
title: Legal contract redline and approve
description: >-
  Manages contract intake from counterparty paper through clause extraction,
  automated redline suggestions, counsel review, business approval, DocuSign
  signature routing, counterparty negotiation loops, executed-contract archive,
  and obligation handoff.
tags:
  - legal
  - contracts
  - redline
  - approval
  - docusign
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: gold
    reason: "Legal teams need redline routing, approval gates, and signature orchestration."
  - tier: platinum
    reason: "Adds clause risk scoring, DocuSign integration, and obligation handoff."
ontology_refs:
  object: ContractNegotiationCase
  actions:
    - ContractIntakeReceived
    - ContractRiskClassified
    - RedlineDrafted
    - CounselApproved
    - CounterpartySigned
    - ContractArchived
tenant_context:
  required_fields:
    - tenant_id
    - contract_id
    - business_owner_principal_id
    - counsel_principal_id
    - counterparty_id
principal_context:
  system_principal: workflow-engine.contract-redline
  human_approval_roles:
    - legal_counsel
    - business_owner
    - security_reviewer
    - finance_reviewer
data_classes:
  - CONTRACT_DRAFT
  - CLAUSE_RISK
  - COMMERCIAL_TERMS
  - COUNTERPARTY_CONTACT
  - SIGNATURE_ENVELOPE
residency_pack_overlays:
  - pack: gdpr
    behavior: "Limit counterparty personal contact details to signing and notice steps."
  - pack: soc2
    behavior: "Preserve approval evidence for material customer and vendor contracts."
observability:
  metrics:
    - legal_contract_step_latency_seconds
    - legal_contract_redline_round_total
    - legal_contract_docusign_failure_total
  traces:
    - workflow.template.legal_contract_redline
  logs:
    - workflow_legal_contract_audit_projection
cost_allocation:
  unit: workflow_step_transition
  dimensions:
    - tenant_id
    - contract_type
    - counterparty_id
idempotency:
  key_shape: "tenant_id:contract_id:template_version:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: send_docusign_envelope
  on_cancel: withdraw_unsigned_drafts_and_notify_counterparty_owner
  audit_event_class: ContractRedlineWorkflowCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_idempotent_actions
inputs:
  tenant_id:
    type: string
    default: tenant_legal_demo
  contract_id:
    type: string
    default: contract_2026_4477
  contract_type:
    type: string
    default: customer_msa
  counterparty_id:
    type: string
    default: counterparty_991
  business_owner_principal_id:
    type: string
    default: principal_sales_owner_001
  counsel_principal_id:
    type: string
    default: principal_counsel_001
  target_signature_date:
    type: date
    default: "2026-06-20"
outputs:
  negotiation_case_id:
    type: string
  terminal_state:
    type: string
  executed_contract_id:
    type: string
  docusign_envelope_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: contract_intake_start
    type: start
    config:
      trigger: legal.contract.intake_received.v1
      validates:
        - tenant_id
        - contract_id
        - contract_type
        - counterparty_id
    cedar_permits_required:
      - 'Action::"StartContractRedlineWorkflow"'
    audit_event_class: ContractRedlineWorkflowStarted
    slo_target: "PT15M after intake"
    failure_modes:
      - code: CONTRACT_DRAFT_MISSING
        behavior: "Reject intake and notify business owner."
    on_success:
      - edge_to_extract_clauses
    on_failure:
      - edge_to_exception_end
  - id: extract_clauses
    type: action
    config:
      service: contract-intelligence
      contract: clause-extraction.v1
      method: POST
      url: "https://contract-intel.internal/v1/clauses/extract"
      clause_sets:
        - limitation_of_liability
        - indemnity
        - data_processing
        - termination
        - payment_terms
      body:
        contract_id: "${inputs.contract_id}"
        counterparty_id: "${inputs.counterparty_id}"
    cedar_permits_required:
      - 'Action::"ExtractContractClauses"'
    audit_event_class: ContractClausesExtracted
    slo_target: "PT30M"
    failure_modes:
      - code: CLAUSE_EXTRACTION_LOW_CONFIDENCE
        behavior: "Route to paralegal review before risk classification."
    on_success:
      - edge_to_classify_risk
    on_failure:
      - edge_to_exception_end
  - id: classify_risk
    type: action
    config:
      service: contract-intelligence
      contract: contract-risk-classification.v1
      method: POST
      url: "https://contract-intel.internal/v1/risk/classify"
      risk_model_version: contract-risk-2026-05
      body:
        contract_id: "${inputs.contract_id}"
        clause_extraction_id: "${nodes.extract_clauses.output.extraction_id}"
        playbook: "${inputs.contract_type}"
    cedar_permits_required:
      - 'Action::"ClassifyContractRisk"'
    audit_event_class: ContractRiskClassified
    slo_target: "PT30M"
    failure_modes:
      - code: MATERIAL_RISK_DETECTED
        behavior: "Require counsel approval and business owner attestation."
    on_success:
      - edge_to_generate_redline
    on_failure:
      - edge_to_counsel_review
  - id: generate_redline
    type: action
    config:
      service: document-redline
      contract: contract-redline-draft.v1
      method: POST
      url: "https://documents.internal/v1/contracts/redlines"
      body:
        contract_id: "${inputs.contract_id}"
        risk_classification_id: "${nodes.classify_risk.output.risk_classification_id}"
        clause_playbook: "${inputs.contract_type}"
        redline_style: tenant_standard
    cedar_permits_required:
      - 'Action::"GenerateContractRedline"'
    audit_event_class: ContractRedlineGenerated
    slo_target: "PT1H"
    failure_modes:
      - code: REDLINE_GENERATION_FAILED
        behavior: "Create counsel drafting task with clause extraction evidence."
    on_success:
      - edge_to_counsel_review
    on_failure:
      - edge_to_exception_end
  - id: counsel_review
    type: human_task
    config:
      assignee_role: legal_counsel
      task_contract: counsel-redline-review.v1
      required_attestations:
        - legal_risk_accepted
        - data_processing_terms_reviewed
        - liability_cap_reviewed
        - negotiation_position_recorded
    cedar_permits_required:
      - 'Action::"ApproveContractRedlineAsCounsel"'
    audit_event_class: ContractCounselReviewCompleted
    slo_target: "P3D"
    failure_modes:
      - code: COUNSEL_REJECTED_TERMS
        behavior: "Return to redline drafting with counsel notes."
    on_success:
      - edge_to_business_approval
    on_failure:
      - edge_to_exception_end
  - id: business_approval
    type: human_task
    config:
      assignee_role: business_owner
      task_contract: contract-business-approval.v1
      required_attestations:
        - commercial_terms_accepted
        - margin_impact_reviewed
        - target_signature_date_confirmed
    cedar_permits_required:
      - 'Action::"ApproveContractCommercialTerms"'
    audit_event_class: ContractBusinessApprovalCompleted
    slo_target: "P2D"
    failure_modes:
      - code: COMMERCIAL_APPROVAL_REJECTED
        behavior: "Return to negotiation queue and notify counsel."
    on_success:
      - edge_to_send_docusign_envelope
    on_failure:
      - edge_to_exception_end
  - id: send_docusign_envelope
    type: action
    config:
      service: docusign-adapter
      contract: docusign-envelope-create.v1
      method: POST
      url: "https://docusign-adapter.internal/v1/envelopes"
      body:
        contract_id: "${inputs.contract_id}"
        counterparty_id: "${inputs.counterparty_id}"
        signer_order: counterparty_then_company
        target_signature_date: "${inputs.target_signature_date}"
    cedar_permits_required:
      - 'Action::"SendContractForDocuSignSignature"'
    audit_event_class: ContractDocuSignEnvelopeSent
    slo_target: "PT2H after approval"
    failure_modes:
      - code: DOCUSIGN_ENVELOPE_FAILED
        behavior: "Retry envelope creation and alert legal operations."
    on_success:
      - edge_to_signature_wait
    on_failure:
      - edge_to_exception_end
  - id: signature_wait
    type: loop
    config:
      poll_contract: docusign-envelope-status.v1
      poll_interval: PT6H
      max_elapsed: P14D
      terminal_statuses:
        - completed
        - declined
        - voided
        - counterparty_changes_requested
    cedar_permits_required:
      - 'Action::"PollContractSignatureStatus"'
    audit_event_class: ContractSignatureStatusPolled
    slo_target: "P14D"
    failure_modes:
      - code: COUNTERPARTY_CHANGES_REQUESTED
        behavior: "Return to counsel review with counterparty markups."
    on_success:
      - edge_to_signature_decision
    on_failure:
      - edge_to_exception_end
  - id: signature_decision
    type: decision
    config:
      expression: "${nodes.signature_wait.output.status}"
      cases:
        completed: archive_executed_contract
        counterparty_changes_requested: counsel_review
        declined: exception_end
        voided: exception_end
      default_case: counsel_review
    cedar_permits_required:
      - 'Action::"DecideContractSignatureOutcome"'
    audit_event_class: ContractSignatureOutcomeDecided
    slo_target: "PT30M after signature status"
    failure_modes:
      - code: SIGNATURE_STATUS_UNKNOWN
        behavior: "Keep polling and notify legal operations."
    on_success:
      - edge_to_archive_executed_contract
      - edge_to_counsel_review_after_changes
    on_failure:
      - edge_to_exception_end
  - id: archive_executed_contract
    type: action
    config:
      service: contract-repository
      contract: executed-contract-archive.v1
      method: POST
      url: "https://contracts.internal/v1/executed/archive"
      body:
        contract_id: "${inputs.contract_id}"
        docusign_envelope_id: "${nodes.send_docusign_envelope.output.envelope_id}"
        obligation_handoff: true
    cedar_permits_required:
      - 'Action::"ArchiveExecutedContract"'
    audit_event_class: ContractExecutedArchiveCompleted
    slo_target: "PT4H after signature complete"
    failure_modes:
      - code: ARCHIVE_WRITE_FAILED
        behavior: "Hold contract as executed-pending-archive and alert legal operations."
    on_success:
      - edge_to_close_workflow
    on_failure:
      - edge_to_exception_end
  - id: close_workflow
    type: end
    config:
      terminal_state: completed
      emits:
        - contract_negotiation_closed
        - executed_contract_archived
        - obligation_handoff_created
    cedar_permits_required:
      - 'Action::"CloseContractRedlineWorkflow"'
    audit_event_class: ContractRedlineWorkflowClosed
    slo_target: "PT1H after archive"
    failure_modes:
      - code: OBLIGATION_HANDOFF_FAILED
        behavior: "Keep workflow close-pending and create obligation repair task."
    on_success: []
    on_failure:
      - edge_to_exception_end
  - id: exception_end
    type: end
    config:
      terminal_state: exception
      requires_manual_owner: true
    cedar_permits_required:
      - 'Action::"RecordContractRedlineException"'
    audit_event_class: ContractRedlineExceptionRecorded
    slo_target: "PT30M after exception"
    failure_modes:
      - code: EXCEPTION_AUDIT_WRITE_FAILED
        behavior: "Emit dead-letter event for legal workflow replay."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_extract_clauses
    from: contract_intake_start
    to: extract_clauses
    name: contract_intake_valid
  - id: edge_to_classify_risk
    from: extract_clauses
    to: classify_risk
    name: clauses_extracted
  - id: edge_to_generate_redline
    from: classify_risk
    to: generate_redline
    name: risk_classified
  - id: edge_to_counsel_review
    from: generate_redline
    to: counsel_review
    name: redline_generated
  - id: edge_to_business_approval
    from: counsel_review
    to: business_approval
    name: counsel_approved
  - id: edge_to_send_docusign_envelope
    from: business_approval
    to: send_docusign_envelope
    name: business_approved
  - id: edge_to_signature_wait
    from: send_docusign_envelope
    to: signature_wait
    name: envelope_sent
  - id: edge_to_signature_decision
    from: signature_wait
    to: signature_decision
    name: signature_status_available
  - id: edge_to_archive_executed_contract
    from: signature_decision
    to: archive_executed_contract
    name: signature_completed
  - id: edge_to_counsel_review_after_changes
    from: signature_decision
    to: counsel_review
    name: counterparty_changes_requested
  - id: edge_to_close_workflow
    from: archive_executed_contract
    to: close_workflow
    name: executed_contract_archived
  - id: edge_to_exception_end
    from: "*"
    to: exception_end
    name: exception_recorded
failure_modes:
  - code: POLICY_DENIED
    behavior: "Stop current node, emit Cedar denial audit, and preserve draft version state."
  - code: COUNTERPARTY_NEGOTIATION_LOOP_LIMIT
    behavior: "Escalate to general counsel after configured redline round limit."
  - code: SIGNATURE_AUTHORITY_MISSING
    behavior: "Block DocuSign envelope until signer authority is resolved."
worked_example:
  sample_input:
    tenant_id: tenant_legal_demo
    contract_id: contract_2026_4477
    contract_type: customer_msa
    counterparty_id: counterparty_991
    business_owner_principal_id: principal_sales_owner_001
    counsel_principal_id: principal_counsel_001
    target_signature_date: "2026-06-20"
  sample_expected_output:
    negotiation_case_id: negcase_2026_4477
    terminal_state: completed
    executed_contract_id: executed_contract_2026_4477
    docusign_envelope_id: ds_env_883001
    audit_chain_refs:
      - audit://workflow/legal-contract/intake/01
      - audit://workflow/legal-contract/counsel-approval/05
      - audit://workflow/legal-contract/executed-archive/10
