---
doc_class: WorkflowTemplate
template_id: workflow-template.data-subject-access-request-dsar.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0244-tenant-as-universal-scoping-primitive
  - ADR-0276-backup-portability-format-gdpr-article-20
title: Data subject access request DSAR
description: >-
  Fulfills a DSAR through request intake, identity verification, tenant-scoped
  data location, legal-hold and redaction decisions, export packaging,
  requester notification, and immutable audit logging.
tags:
  - privacy
  - dsar
  - gdpr
  - data-export
  - audit-chain
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: gold
    reason: "Privacy fulfillment requires cross-service discovery, evidence, and legal-hold controls."
ontology_refs:
  object: DataSubjectRequestCase
  actions:
    - RequestIntakeCreated
    - IdentityVerified
    - DataLocated
    - ExportRedacted
    - RequesterNotified
    - AuditLogSealed
tenant_context:
  required_fields:
    - tenant_id
    - data_subject_principal_id
    - privacy_owner_principal_id
    - request_type
principal_context:
  system_principal: workflow-engine.dsar
  human_approval_roles:
    - privacy_owner
    - legal_owner
    - tenant_admin
data_classes:
  - DSAR_REQUEST
  - DATA_SUBJECT_IDENTIFIER
  - PERSONAL_DATA_EXPORT
  - REDACTION_DECISION
  - LEGAL_HOLD_STATUS
residency_pack_overlays:
  - pack: gdpr
    behavior: "Default response deadline P30D; include source category and recipient metadata."
  - pack: kr-pipa
    behavior: "Map request to personal information access and deletion obligations."
observability:
  metrics:
    - dsar_fulfillment_latency_seconds
    - dsar_identity_verification_failure_total
    - dsar_legal_hold_block_total
  traces:
    - workflow.template.dsar
  logs:
    - workflow_dsar_audit_projection
cost_allocation:
  unit: dsar_workflow_step
  dimensions:
    - tenant_id
    - request_type
    - jurisdiction
idempotency:
  key_shape: "tenant_id:data_subject_principal_id:request_id:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: package_export
  on_cancel: close_request_and_delete_unsealed_export_artifacts
  audit_event_class: DsarWorkflowCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_identity_export_and_notification_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  request_id:
    type: string
    default: dsar_001
  data_subject_principal_id:
    type: string
    default: principal_subject_001
  requester_contact_ref:
    type: string
    default: contact_secure_portal_001
  request_type:
    type: string
    default: access
  jurisdiction:
    type: string
    default: EU
  privacy_owner_principal_id:
    type: string
    default: principal_privacy_001
outputs:
  dsar_case_id:
    type: string
  terminal_state:
    type: string
  export_package_id:
    type: string
  requester_notification_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: request_intake_start
    type: start
    config:
      trigger: privacy.dsar.request_submitted.v1
      validates:
        - tenant_id
        - request_id
        - data_subject_principal_id
        - request_type
    cedar_permits_required:
      - 'Action::"StartDsarFulfillment"'
    audit_event_class: DsarFulfillmentStarted
    slo_target: "PT1H after request submission"
    timeout:
      duration: PT10M
      on_timeout: intake_start_retry
    retry:
      max_attempts: 2
      backoff: PT2M
      retryable_errors:
        - DSAR_REQUEST_EVENT_LAG
    failure_modes:
      - code: REQUEST_TYPE_UNSUPPORTED
        behavior: "Reject intake with privacy-owner visible reason."
    on_success:
      - edge_to_create_dsar_case
    on_failure:
      - edge_to_dsar_exception
  - id: create_dsar_case
    type: action
    config:
      service: privacy
      contract: dsar-case.v1
      method: POST
      url: "https://privacy.internal/v1/dsar/cases"
      body:
        request_id: "${inputs.request_id}"
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        request_type: "${inputs.request_type}"
        jurisdiction: "${inputs.jurisdiction}"
    cedar_permits_required:
      - 'Action::"CreateDsarCase"'
    audit_event_class: DsarCaseCreated
    slo_target: "PT4H"
    timeout:
      duration: PT10M
      on_timeout: dsar_case_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - PRIVACY_CASE_WRITE_TIMEOUT
    failure_modes:
      - code: DUPLICATE_DSAR_CASE
        behavior: "Return existing case and continue idempotently."
    on_success:
      - edge_to_identity_verify
    on_failure:
      - edge_to_dsar_exception
  - id: identity_verify
    type: action
    config:
      service: identity
      contract: data-subject-identity-verification.v1
      method: POST
      url: "https://identity.internal/v1/data-subject-verifications"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        requester_contact_ref: "${inputs.requester_contact_ref}"
        verification_level: privacy_sensitive
    cedar_permits_required:
      - 'Action::"VerifyDataSubjectIdentity"'
    audit_event_class: DsarIdentityVerificationCompleted
    slo_target: "P7D"
    timeout:
      duration: P7D
      on_timeout: identity_verification_expired
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - VERIFICATION_PROVIDER_DELAY
    failure_modes:
      - code: IDENTITY_NOT_VERIFIED
        behavior: "Close request as unverified; no data discovery starts."
    on_success:
      - edge_to_identity_decision
    on_failure:
      - edge_to_dsar_exception
  - id: identity_decision
    type: decision
    config:
      expression: "${nodes.identity_verify.output.status}"
      cases:
        verified: discovery_parallel
        needs_more_info: requester_info_request
        failed: dsar_exception_end
    cedar_permits_required:
      - 'Action::"DecideDsarIdentityStatus"'
    audit_event_class: DsarIdentityStatusDecided
    slo_target: "PT2H after verification result"
    timeout:
      duration: PT4H
      on_timeout: privacy_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: VERIFICATION_STATUS_UNKNOWN
        behavior: "Block data discovery and notify privacy owner."
    on_success:
      - edge_to_discovery_parallel
    on_failure:
      - edge_to_dsar_exception
  - id: discovery_parallel
    type: parallel
    config:
      fan_out_limit: 5
      join_semantics: all_success_required
      branches:
        - locate_identity_data
        - locate_workflow_data
        - locate_audit_data
        - locate_intelligence_data
        - legal_hold_check
    cedar_permits_required:
      - 'Action::"RunDsarDiscoveryFanout"'
    audit_event_class: DsarDiscoveryStarted
    slo_target: "P14D"
    timeout:
      duration: P14D
      on_timeout: discovery_manual_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: DISCOVERY_BRANCH_FAILED
        behavior: "Block export and attach missing service list."
    on_success:
      - edge_to_locate_identity_data
      - edge_to_locate_workflow_data
      - edge_to_locate_audit_data
      - edge_to_locate_intelligence_data
      - edge_to_legal_hold_check
    on_failure:
      - edge_to_dsar_exception
  - id: locate_identity_data
    type: action
    config:
      service: identity
      contract: dsar-identity-data-locate.v1
      method: POST
      url: "https://identity.internal/v1/dsar/locate"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        tenant_id: "${inputs.tenant_id}"
    cedar_permits_required:
      - 'Action::"LocateIdentityPersonalData"'
    audit_event_class: DsarIdentityDataLocated
    slo_target: "P3D"
    timeout:
      duration: P3D
      on_timeout: identity_locate_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - IDENTITY_LOCATE_TIMEOUT
    failure_modes:
      - code: IDENTITY_INDEX_STALE
        behavior: "Require re-index before export."
    on_success:
      - edge_to_discovery_join
    on_failure:
      - edge_to_dsar_exception
  - id: locate_workflow_data
    type: action
    config:
      service: workflow-engine
      contract: dsar-workflow-data-locate.v1
      method: POST
      url: "https://workflow.internal/v1/dsar/locate"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        tenant_id: "${inputs.tenant_id}"
    cedar_permits_required:
      - 'Action::"LocateWorkflowPersonalData"'
    audit_event_class: DsarWorkflowDataLocated
    slo_target: "P3D"
    timeout:
      duration: P3D
      on_timeout: workflow_locate_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - WORKFLOW_LOCATE_TIMEOUT
    failure_modes:
      - code: WORKFLOW_HISTORY_UNAVAILABLE
        behavior: "Escalate because workflow history is audit-relevant."
    on_success:
      - edge_to_discovery_join
    on_failure:
      - edge_to_dsar_exception
  - id: locate_audit_data
    type: action
    config:
      service: audit-chain
      contract: dsar-audit-data-locate.v1
      method: POST
      url: "https://audit-chain.internal/v1/dsar/locate"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        tenant_id: "${inputs.tenant_id}"
        export_mode: reference_and_redacted_projection
    cedar_permits_required:
      - 'Action::"LocateAuditPersonalData"'
    audit_event_class: DsarAuditDataLocated
    slo_target: "P5D"
    timeout:
      duration: P5D
      on_timeout: audit_locate_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - AUDIT_LOCATE_TIMEOUT
    failure_modes:
      - code: AUDIT_TAMPER_CHECK_FAILED
        behavior: "Block DSAR export and open security incident."
    on_success:
      - edge_to_discovery_join
    on_failure:
      - edge_to_dsar_exception
  - id: locate_intelligence_data
    type: action
    config:
      service: intelligence
      contract: dsar-intelligence-data-locate.v1
      method: POST
      url: "https://intelligence.internal/v1/dsar/locate"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        include_prompt_history: true
        include_memory_records: true
    cedar_permits_required:
      - 'Action::"LocateConsumerAiPersonalData"'
    audit_event_class: DsarIntelligenceDataLocated
    slo_target: "P5D"
    timeout:
      duration: P5D
      on_timeout: intelligence_locate_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - INTELLIGENCE_LOCATE_TIMEOUT
    failure_modes:
      - code: AI_MEMORY_SCOPE_CONFLICT
        behavior: "Escalate to privacy owner before export or erasure."
    on_success:
      - edge_to_discovery_join
    on_failure:
      - edge_to_dsar_exception
  - id: legal_hold_check
    type: action
    config:
      service: legal
      contract: dsar-legal-hold-check.v1
      method: POST
      url: "https://legal.internal/v1/dsar/legal-hold-checks"
      body:
        data_subject_principal_id: "${inputs.data_subject_principal_id}"
        tenant_id: "${inputs.tenant_id}"
        request_type: "${inputs.request_type}"
    cedar_permits_required:
      - 'Action::"CheckDsarLegalHold"'
    audit_event_class: DsarLegalHoldChecked
    slo_target: "P3D"
    timeout:
      duration: P3D
      on_timeout: legal_hold_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - LEGAL_HOLD_CHECK_TIMEOUT
    failure_modes:
      - code: LEGAL_HOLD_ACTIVE
        behavior: "Export access copy but block erasure and note legal basis."
    on_success:
      - edge_to_discovery_join
    on_failure:
      - edge_to_dsar_exception
  - id: discovery_join
    type: decision
    config:
      expression: "${parallel.discovery_parallel.all_branches_succeeded}"
      cases:
        "true": redaction_decision
        "false": dsar_exception_end
    cedar_permits_required:
      - 'Action::"EvaluateDsarDiscoveryCompleteness"'
    audit_event_class: DsarDiscoveryCompletenessEvaluated
    slo_target: "P15D"
    timeout:
      duration: PT8H
      on_timeout: privacy_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: DISCOVERY_INCOMPLETE
        behavior: "Do not produce requester package."
    on_success:
      - edge_to_redaction_decision
    on_failure:
      - edge_to_dsar_exception
  - id: redaction_decision
    type: decision
    config:
      expression: "${nodes.legal_hold_check.output.hold_status}"
      cases:
        none: package_export
        active: redact_or_export
        partial: redact_or_export
    cedar_permits_required:
      - 'Action::"DecideDsarRedactionPath"'
    audit_event_class: DsarRedactionPathDecided
    slo_target: "PT4H after discovery"
    timeout:
      duration: PT8H
      on_timeout: legal_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: LEGAL_HOLD_STATUS_UNKNOWN
        behavior: "Route to legal owner; no package generated."
    on_success:
      - edge_to_redact_or_export
      - edge_to_package_export
    on_failure:
      - edge_to_dsar_exception
  - id: redact_or_export
    type: action
    config:
      service: privacy
      contract: dsar-redaction.v1
      method: POST
      url: "https://privacy.internal/v1/dsar/redactions"
      body:
        dsar_case_id: "${nodes.create_dsar_case.output.case_id}"
        legal_hold_ref: "${nodes.legal_hold_check.output.hold_ref}"
        discovery_refs:
          - "${nodes.locate_identity_data.output.discovery_ref}"
          - "${nodes.locate_workflow_data.output.discovery_ref}"
          - "${nodes.locate_audit_data.output.discovery_ref}"
          - "${nodes.locate_intelligence_data.output.discovery_ref}"
    cedar_permits_required:
      - 'Action::"RedactDsarExport"'
    audit_event_class: DsarRedactionCompleted
    slo_target: "P20D after intake"
    timeout:
      duration: P3D
      on_timeout: redaction_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - REDACTION_WORKER_TIMEOUT
    failure_modes:
      - code: REDACTION_POLICY_MISSING
        behavior: "Block package and route to legal owner."
    on_success:
      - edge_to_package_export
    on_failure:
      - edge_to_dsar_exception
  - id: package_export
    type: action
    config:
      service: privacy
      contract: dsar-export-package.v1
      method: POST
      url: "https://privacy.internal/v1/dsar/export-packages"
      body:
        dsar_case_id: "${nodes.create_dsar_case.output.case_id}"
        redaction_ref: "${nodes.redact_or_export.output.redaction_ref}"
        format: jsonl_plus_manifest
        encrypt_for_requester: true
    cedar_permits_required:
      - 'Action::"PackageDsarExport"'
    audit_event_class: DsarExportPackaged
    slo_target: "P25D after intake"
    timeout:
      duration: P3D
      on_timeout: package_export_timeout
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - EXPORT_PACKAGE_TIMEOUT
    failure_modes:
      - code: EXPORT_DIGEST_MISMATCH
        behavior: "Discard package and rebuild; do not notify requester."
    on_success:
      - edge_to_notify_requester
    on_failure:
      - edge_to_dsar_exception
  - id: notify_requester
    type: action
    config:
      service: notifications
      contract: dsar-requester-notification.v1
      method: POST
      url: "https://notifications.internal/v1/dsar/requester"
      body:
        dsar_case_id: "${nodes.create_dsar_case.output.case_id}"
        requester_contact_ref: "${inputs.requester_contact_ref}"
        export_package_id: "${nodes.package_export.output.package_id}"
    cedar_permits_required:
      - 'Action::"NotifyDsarRequester"'
    audit_event_class: DsarRequesterNotified
    slo_target: "P30D after intake"
    timeout:
      duration: PT30M
      on_timeout: requester_notification_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - NOTIFICATION_TIMEOUT
    failure_modes:
      - code: REQUESTER_CHANNEL_UNAVAILABLE
        behavior: "Escalate to privacy owner before deadline breach."
    on_success:
      - edge_to_seal_audit_log
    on_failure:
      - edge_to_dsar_exception
  - id: seal_audit_log
    type: action
    config:
      service: audit-chain
      contract: dsar-completion-audit.v1
      method: POST
      url: "https://audit-chain.internal/v1/dsar/completions"
      body:
        dsar_case_id: "${nodes.create_dsar_case.output.case_id}"
        export_package_id: "${nodes.package_export.output.package_id}"
        requester_notification_id: "${nodes.notify_requester.output.notification_id}"
    cedar_permits_required:
      - 'Action::"SealDsarAuditLog"'
    audit_event_class: DsarAuditLogSealed
    slo_target: "PT1H after requester notification"
    timeout:
      duration: PT15M
      on_timeout: audit_seal_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: AUDIT_SEAL_FAILED
        behavior: "Do not mark DSAR complete."
    on_success:
      - edge_to_dsar_completed
    on_failure:
      - edge_to_dsar_exception
  - id: requester_info_request
    type: action
    config:
      service: notifications
      contract: dsar-more-info-request.v1
      method: POST
      url: "https://notifications.internal/v1/dsar/more-info"
      body:
        dsar_case_id: "${nodes.create_dsar_case.output.case_id}"
        requester_contact_ref: "${inputs.requester_contact_ref}"
    cedar_permits_required:
      - 'Action::"RequestDsarAdditionalInformation"'
    audit_event_class: DsarAdditionalInformationRequested
    slo_target: "PT24H after verification challenge"
    timeout:
      duration: PT30M
      on_timeout: info_request_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - NOTIFICATION_TIMEOUT
    failure_modes:
      - code: INFO_REQUEST_CHANNEL_MISSING
        behavior: "Route to privacy owner."
    on_success:
      - edge_to_dsar_exception
    on_failure:
      - edge_to_dsar_exception
  - id: dsar_completed_end
    type: end
    config:
      terminal_state: fulfilled
      output_contract: dsar-fulfillment-result.v1
    cedar_permits_required:
      - 'Action::"CompleteDsarFulfillment"'
    audit_event_class: DsarFulfillmentCompleted
    slo_target: "P30D after intake"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Keep DSAR case open."
    on_success: []
    on_failure:
      - edge_to_dsar_exception
  - id: dsar_exception_end
    type: end
    config:
      terminal_state: blocked_or_more_info_required
      output_contract: dsar-fulfillment-exception.v1
    cedar_permits_required:
      - 'Action::"CloseDsarFulfillmentException"'
    audit_event_class: DsarFulfillmentExceptionClosed
    slo_target: "PT1D after blocker"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep privacy owner task open."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_dsar_case
    from: request_intake_start
    to: create_dsar_case
    name: intake_valid
  - id: edge_to_identity_verify
    from: create_dsar_case
    to: identity_verify
    name: dsar_case_created
  - id: edge_to_identity_decision
    from: identity_verify
    to: identity_decision
    name: verification_result
  - id: edge_to_discovery_parallel
    from: identity_decision
    to: discovery_parallel
    name: requester_verified
  - id: edge_to_locate_identity_data
    from: discovery_parallel
    to: locate_identity_data
    name: identity_discovery_branch
  - id: edge_to_locate_workflow_data
    from: discovery_parallel
    to: locate_workflow_data
    name: workflow_discovery_branch
  - id: edge_to_locate_audit_data
    from: discovery_parallel
    to: locate_audit_data
    name: audit_discovery_branch
  - id: edge_to_locate_intelligence_data
    from: discovery_parallel
    to: locate_intelligence_data
    name: intelligence_discovery_branch
  - id: edge_to_legal_hold_check
    from: discovery_parallel
    to: legal_hold_check
    name: legal_hold_branch
  - id: edge_to_discovery_join
    from: discovery_parallel
    to: discovery_join
    name: discovery_join
  - id: edge_to_redaction_decision
    from: discovery_join
    to: redaction_decision
    name: discovery_complete
  - id: edge_to_redact_or_export
    from: redaction_decision
    to: redact_or_export
    name: redaction_required
  - id: edge_to_package_export
    from: redaction_decision
    to: package_export
    name: export_ready
  - id: edge_to_notify_requester
    from: package_export
    to: notify_requester
    name: package_ready
  - id: edge_to_seal_audit_log
    from: notify_requester
    to: seal_audit_log
    name: requester_notified
  - id: edge_to_dsar_completed
    from: seal_audit_log
    to: dsar_completed_end
    name: audit_log_sealed
  - id: edge_to_dsar_exception
    from: request_intake_start
    to: dsar_exception_end
    name: blocked_or_failed
failure_modes:
  - code: IDENTITY_VERIFICATION_FAILED
    behavior: "No data discovery or export occurs."
  - code: LEGAL_HOLD_BLOCKS_ERASURE
    behavior: "Return access package and record why erasure is blocked."
  - code: EXPORT_DIGEST_INVALID
    behavior: "Rebuild export before requester notification."
worked_example:
  sample_input:
    tenant_id: tenant_acme
    request_id: dsar_2026_0042
    data_subject_principal_id: principal_subject_42
    requester_contact_ref: secure_portal_contact_42
    request_type: access
    jurisdiction: EU
    privacy_owner_principal_id: principal_privacy_07
  sample_expected_output:
