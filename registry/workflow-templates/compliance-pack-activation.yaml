---
doc_class: WorkflowTemplate
template_id: workflow-template.compliance-pack-activation.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0069-active-machine-readable-artifact-contract
  - ADR-0316-capability-tier-over-product-fragmentation
title: Compliance pack activation
description: >-
  Activates a tenant compliance pack by validating prerequisites, scanning data
  classification coverage, enabling Cedar policies, emitting attestation, and
  notifying stakeholders without allowing partial silent pack activation.
tags:
  - compliance
  - cedar
  - attestation
  - data-classification
  - tenant-pack
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: silver
    reason: "Tenant-visible compliance activation requires auditable policy and evidence steps."
ontology_refs:
  object: CompliancePackActivationCase
  actions:
    - PackPrerequisitesValidated
    - DataClassificationScanned
    - CedarPoliciesEnabled
    - AttestationEmitted
    - StakeholdersNotified
tenant_context:
  required_fields:
    - tenant_id
    - pack_id
    - compliance_owner_principal_id
    - security_owner_principal_id
principal_context:
  system_principal: workflow-engine.compliance-pack-activation
  human_approval_roles:
    - compliance_owner
    - security_owner
    - tenant_admin
data_classes:
  - COMPLIANCE_PACK_CONFIG
  - DATA_CLASSIFICATION_RESULT
  - CEDAR_POLICY_BINDING
  - ATTESTATION_RECORD
residency_pack_overlays:
  - pack: gdpr
    behavior: "Activation evidence for EU tenants remains in the EU evidence mirror."
  - pack: kr-pipa
    behavior: "Personal information handling rows require Korean lawful-basis mapping."
observability:
  metrics:
    - compliance_pack_activation_latency_seconds
    - compliance_pack_policy_denial_total
    - compliance_pack_attestation_total
  traces:
    - workflow.template.compliance_pack_activation
  logs:
    - workflow_compliance_pack_activation_audit_projection
cost_allocation:
  unit: compliance_pack_activation_step
  dimensions:
    - tenant_id
    - pack_id
    - jurisdiction
idempotency:
  key_shape: "tenant_id:pack_id:template_version:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: enable_cedar_policies
  on_cancel: remove_pending_policy_draft_and_close_activation_case
  audit_event_class: CompliancePackActivationCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_policy_and_attestation_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  pack_id:
    type: string
    default: GDPR
  requested_by_principal_id:
    type: string
    default: principal_tenant_admin_001
  compliance_owner_principal_id:
    type: string
    default: principal_compliance_001
  security_owner_principal_id:
    type: string
    default: principal_security_001
  jurisdiction:
    type: string
    default: EU
  activation_deadline:
    type: datetime
    default: "2026-06-01T00:00:00Z"
outputs:
  activation_case_id:
    type: string
  terminal_state:
    type: string
  enabled_policy_set_ids:
    type: array
    items: string
  attestation_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: activation_request_start
    type: start
    config:
      trigger: tenant.compliance_pack.activation_requested.v1
      validates:
        - tenant_id
        - pack_id
        - requested_by_principal_id
    cedar_permits_required:
      - 'Action::"StartCompliancePackActivation"'
    audit_event_class: CompliancePackActivationStarted
    slo_target: "PT5M after request"
    timeout:
      duration: PT10M
      on_timeout: activation_start_retry
    retry:
      max_attempts: 2
      backoff: PT2M
      retryable_errors:
        - PACK_REQUEST_EVENT_LAG
    failure_modes:
      - code: PACK_NOT_SUPPORTED
        behavior: "Reject activation before any policy mutation."
    on_success:
      - edge_to_create_activation_case
    on_failure:
      - edge_to_activation_exception
  - id: create_activation_case
    type: action
    config:
      service: compliance
      contract: compliance-pack-activation-case.v1
      method: POST
      url: "https://compliance.internal/v1/pack-activations"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        requested_by_principal_id: "${inputs.requested_by_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateCompliancePackActivationCase"'
    audit_event_class: CompliancePackActivationCaseCreated
    slo_target: "PT15M"
    timeout:
      duration: PT5M
      on_timeout: case_creation_retry
    retry:
      max_attempts: 3
      backoff: PT2M
      retryable_errors:
        - COMPLIANCE_CASE_WRITE_TIMEOUT
    failure_modes:
      - code: DUPLICATE_ACTIVATION_CASE
        behavior: "Return existing case and continue idempotently."
    on_success:
      - edge_to_validate_prereqs
    on_failure:
      - edge_to_activation_exception
  - id: validate_prereqs
    type: action
    config:
      service: compliance
      contract: compliance-pack-prerequisites.v1
      method: POST
      url: "https://compliance.internal/v1/pack-prerequisites/validate"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        jurisdiction: "${inputs.jurisdiction}"
    cedar_permits_required:
      - 'Action::"ValidateCompliancePackPrerequisites"'
    audit_event_class: CompliancePackPrerequisitesValidated
    slo_target: "PT1H"
    timeout:
      duration: PT20M
      on_timeout: prereq_validation_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - PREREQ_VALIDATOR_TIMEOUT
    failure_modes:
      - code: REQUIRED_REGION_MISSING
        behavior: "Block activation and return missing region evidence."
      - code: REQUIRED_OWNER_MISSING
        behavior: "Route to tenant admin before scan."
    on_success:
      - edge_to_prereq_decision
    on_failure:
      - edge_to_activation_exception
  - id: prereq_decision
    type: decision
    config:
      expression: "${nodes.validate_prereqs.output.status}"
      cases:
        passed: scan_parallel
        needs_remediation: remediation_task
        failed: activation_exception_end
    cedar_permits_required:
      - 'Action::"DecideCompliancePackPrerequisites"'
    audit_event_class: CompliancePackPrerequisiteOutcomeDecided
    slo_target: "PT10M after prerequisite scan"
    timeout:
      duration: PT30M
      on_timeout: compliance_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: PREREQ_STATUS_UNKNOWN
        behavior: "Escalate to compliance owner; do not scan or enable policies."
    on_success:
      - edge_to_scan_parallel
    on_failure:
      - edge_to_activation_exception
  - id: scan_parallel
    type: parallel
    config:
      fan_out_limit: 3
      join_semantics: all_success_required
      branches:
        - data_classification_scan
        - residency_readiness_scan
        - audit_sink_readiness_scan
    cedar_permits_required:
      - 'Action::"RunCompliancePackReadinessScans"'
    audit_event_class: CompliancePackReadinessScansStarted
    slo_target: "PT4H"
    timeout:
      duration: PT4H
      on_timeout: scan_manual_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: READINESS_SCAN_FAILED
        behavior: "Block policy enablement and attach failed scan refs."
    on_success:
      - edge_to_data_classification_scan
      - edge_to_residency_readiness_scan
      - edge_to_audit_sink_readiness_scan
    on_failure:
      - edge_to_activation_exception
  - id: data_classification_scan
    type: action
    config:
      service: data-classification
      contract: tenant-data-classification-scan.v1
      method: POST
      url: "https://classification.internal/v1/scans"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        require_field_annotations: true
    cedar_permits_required:
      - 'Action::"RunDataClassificationScan"'
    audit_event_class: CompliancePackDataClassificationScanned
    slo_target: "PT2H"
    timeout:
      duration: PT2H
      on_timeout: data_scan_timeout
    retry:
      max_attempts: 2
      backoff: PT15M
      retryable_errors:
        - CLASSIFICATION_SCAN_TIMEOUT
    failure_modes:
      - code: UNCLASSIFIED_FIELD_FOUND
        behavior: "Create remediation task and block activation."
    on_success:
      - edge_to_scan_join
    on_failure:
      - edge_to_remediation_task
  - id: residency_readiness_scan
    type: action
    config:
      service: tenancy
      contract: residency-readiness-scan.v1
      method: POST
      url: "https://tenancy.internal/v1/residency-readiness"
      body:
        tenant_id: "${inputs.tenant_id}"
        jurisdiction: "${inputs.jurisdiction}"
    cedar_permits_required:
      - 'Action::"RunResidencyReadinessScan"'
    audit_event_class: CompliancePackResidencyReadinessScanned
    slo_target: "PT1H"
    timeout:
      duration: PT1H
      on_timeout: residency_scan_timeout
    retry:
      max_attempts: 2
      backoff: PT10M
      retryable_errors:
        - RESIDENCY_SCAN_TIMEOUT
    failure_modes:
      - code: REQUIRED_CELL_NOT_READY
        behavior: "Block activation until tenant cell exists."
    on_success:
      - edge_to_scan_join
    on_failure:
      - edge_to_remediation_task
  - id: audit_sink_readiness_scan
    type: action
    config:
      service: audit-chain
      contract: audit-sink-readiness.v1
      method: POST
      url: "https://audit-chain.internal/v1/readiness"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        evidence_retention_required: true
    cedar_permits_required:
      - 'Action::"RunAuditSinkReadinessScan"'
    audit_event_class: CompliancePackAuditSinkReadinessScanned
    slo_target: "PT1H"
    timeout:
      duration: PT1H
      on_timeout: audit_readiness_timeout
    retry:
      max_attempts: 2
      backoff: PT10M
      retryable_errors:
        - AUDIT_READINESS_TIMEOUT
    failure_modes:
      - code: AUDIT_RETENTION_NOT_CONFIGURED
        behavior: "Block activation and create audit-chain owner task."
    on_success:
      - edge_to_scan_join
    on_failure:
      - edge_to_remediation_task
  - id: scan_join
    type: decision
    config:
      expression: "${parallel.scan_parallel.all_branches_succeeded}"
      cases:
        "true": approval_gate
        "false": remediation_task
    cedar_permits_required:
      - 'Action::"EvaluateCompliancePackReadiness"'
    audit_event_class: CompliancePackReadinessEvaluated
    slo_target: "PT30M after scans complete"
    timeout:
      duration: PT30M
      on_timeout: compliance_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: READINESS_INCOMPLETE
        behavior: "Activation cannot continue."
    on_success:
      - edge_to_approval_gate
    on_failure:
      - edge_to_remediation_task
  - id: approval_gate
    type: action
    config:
      service: approvals
      contract: compliance-pack-approval.v1
      method: POST
      url: "https://approvals.internal/v1/compliance-pack-approvals"
      body:
        activation_case_id: "${nodes.create_activation_case.output.case_id}"
        approver_roles:
          - compliance_owner
          - security_owner
        quorum: 2
        deadline: P2D
    cedar_permits_required:
      - 'Action::"ApproveCompliancePackActivation"'
    audit_event_class: CompliancePackActivationApproved
    slo_target: "P2D"
    timeout:
      duration: P2D
      on_timeout: approval_escalation
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: APPROVAL_REJECTED
        behavior: "Close activation as rejected with reviewer rationale."
    on_success:
      - edge_to_enable_cedar_policies
    on_failure:
      - edge_to_activation_exception
  - id: enable_cedar_policies
    type: action
    config:
      service: policy-engine
      contract: cedar-policy-pack-enable.v1
      method: POST
      url: "https://policy.internal/v1/cedar/policy-packs/enable"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        activation_case_id: "${nodes.create_activation_case.output.case_id}"
    cedar_permits_required:
      - 'Action::"EnableCompliancePackCedarPolicies"'
    audit_event_class: CompliancePackCedarPoliciesEnabled
    slo_target: "PT30M after approval"
    timeout:
      duration: PT15M
      on_timeout: cedar_enable_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - CEDAR_POLICY_ENABLE_TIMEOUT
    failure_modes:
      - code: POLICY_COMPILATION_FAILED
        behavior: "Rollback enabled policy fragments and route to security owner."
    on_success:
      - edge_to_policy_smoke_test
    on_failure:
      - edge_to_activation_exception
  - id: policy_smoke_test
    type: action
    config:
      service: policy-engine
      contract: cedar-policy-smoke-test.v1
      method: POST
      url: "https://policy.internal/v1/cedar/smoke-tests"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        deny_cases_required: true
    cedar_permits_required:
      - 'Action::"RunCompliancePackPolicySmokeTest"'
    audit_event_class: CompliancePackPolicySmokeTestCompleted
    slo_target: "PT30M"
    timeout:
      duration: PT15M
      on_timeout: policy_test_retry
    retry:
      max_attempts: 2
      backoff: PT5M
      retryable_errors:
        - POLICY_TEST_TIMEOUT
    failure_modes:
      - code: POLICY_TEST_FAILED
        behavior: "Disable pack policies and reopen remediation."
    on_success:
      - edge_to_emit_attestation
    on_failure:
      - edge_to_activation_exception
  - id: emit_attestation
    type: action
    config:
      service: compliance
      contract: compliance-pack-attestation.v1
      method: POST
      url: "https://compliance.internal/v1/attestations"
      body:
        activation_case_id: "${nodes.create_activation_case.output.case_id}"
        enabled_policy_set_ids: "${nodes.enable_cedar_policies.output.policy_set_ids}"
        scan_refs:
          - "${nodes.data_classification_scan.output.scan_ref}"
          - "${nodes.residency_readiness_scan.output.scan_ref}"
          - "${nodes.audit_sink_readiness_scan.output.scan_ref}"
    cedar_permits_required:
      - 'Action::"EmitCompliancePackAttestation"'
    audit_event_class: CompliancePackAttestationEmitted
    slo_target: "PT30M after policy smoke test"
    timeout:
      duration: PT10M
      on_timeout: attestation_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - ATTESTATION_WRITE_TIMEOUT
    failure_modes:
      - code: ATTESTATION_DIGEST_MISMATCH
        behavior: "Do not mark activation complete."
    on_success:
      - edge_to_notify_stakeholders
    on_failure:
      - edge_to_activation_exception
  - id: notify_stakeholders
    type: action
    config:
      service: notifications
      contract: compliance-pack-stakeholder-notify.v1
      method: POST
      url: "https://notifications.internal/v1/compliance-pack-activation"
      body:
        tenant_id: "${inputs.tenant_id}"
        pack_id: "${inputs.pack_id}"
        attestation_id: "${nodes.emit_attestation.output.attestation_id}"
        recipients:
          - compliance_owner
          - security_owner
          - tenant_admin
    cedar_permits_required:
      - 'Action::"NotifyCompliancePackStakeholders"'
    audit_event_class: CompliancePackStakeholdersNotified
    slo_target: "PT15M after attestation"
    timeout:
      duration: PT10M
      on_timeout: stakeholder_notify_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - NOTIFICATION_TIMEOUT
    failure_modes:
      - code: STAKEHOLDER_CHANNEL_MISSING
        behavior: "Complete activation but keep notification remediation task open."
    on_success:
      - edge_to_activation_completed
    on_failure:
      - edge_to_activation_completed
  - id: remediation_task
    type: action
    config:
      service: tasks
      contract: compliance-pack-remediation-task.v1
      method: POST
      url: "https://tasks.internal/v1/compliance-remediations"
      body:
        activation_case_id: "${nodes.create_activation_case.output.case_id}"
        pack_id: "${inputs.pack_id}"
        owner_principal_id: "${inputs.compliance_owner_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateCompliancePackRemediationTask"'
    audit_event_class: CompliancePackRemediationTaskCreated
    slo_target: "PT1H after readiness failure"
    timeout:
      duration: PT10M
      on_timeout: remediation_task_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - TASK_WRITE_TIMEOUT
    failure_modes:
      - code: REMEDIATION_OWNER_MISSING
        behavior: "Route to tenant admin fallback."
    on_success:
      - edge_to_activation_exception
    on_failure:
      - edge_to_activation_exception
  - id: activation_completed_end
    type: end
    config:
      terminal_state: activated
      output_contract: compliance-pack-activation-result.v1
    cedar_permits_required:
      - 'Action::"CompleteCompliancePackActivation"'
    audit_event_class: CompliancePackActivationCompleted
    slo_target: "By activation_deadline"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Keep activation case open."
    on_success: []
    on_failure:
      - edge_to_activation_exception
  - id: activation_exception_end
    type: end
    config:
      terminal_state: blocked_or_remediation_required
      output_contract: compliance-pack-activation-exception.v1
    cedar_permits_required:
      - 'Action::"CloseCompliancePackActivationException"'
    audit_event_class: CompliancePackActivationExceptionClosed
    slo_target: "PT30M after blocker"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep remediation case visible."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_activation_case
    from: activation_request_start
    to: create_activation_case
    name: activation_request_valid
  - id: edge_to_validate_prereqs
    from: create_activation_case
    to: validate_prereqs
    name: activation_case_created
  - id: edge_to_prereq_decision
    from: validate_prereqs
    to: prereq_decision
    name: prerequisites_checked
  - id: edge_to_scan_parallel
    from: prereq_decision
    to: scan_parallel
    name: prerequisites_passed
  - id: edge_to_data_classification_scan
    from: scan_parallel
    to: data_classification_scan
    name: data_scan_branch
  - id: edge_to_residency_readiness_scan
    from: scan_parallel
    to: residency_readiness_scan
    name: residency_branch
  - id: edge_to_audit_sink_readiness_scan
    from: scan_parallel
    to: audit_sink_readiness_scan
    name: audit_sink_branch
  - id: edge_to_scan_join
    from: scan_parallel
    to: scan_join
    name: readiness_join
  - id: edge_to_approval_gate
    from: scan_join
    to: approval_gate
    name: readiness_passed
  - id: edge_to_enable_cedar_policies
    from: approval_gate
    to: enable_cedar_policies
    name: activation_approved
  - id: edge_to_policy_smoke_test
    from: enable_cedar_policies
    to: policy_smoke_test
    name: policies_enabled
  - id: edge_to_emit_attestation
    from: policy_smoke_test
    to: emit_attestation
    name: policy_smoke_green
  - id: edge_to_notify_stakeholders
    from: emit_attestation
    to: notify_stakeholders
    name: attestation_emitted
  - id: edge_to_activation_completed
    from: notify_stakeholders
    to: activation_completed_end
    name: stakeholders_notified
  - id: edge_to_remediation_task
    from: scan_join
    to: remediation_task
    name: remediation_required
  - id: edge_to_activation_exception
    from: activation_request_start
    to: activation_exception_end
    name: activation_blocked
failure_modes:
  - code: CEDAR_POLICY_DENIED
    behavior: "Stop activation and preserve policy-denial evidence."
  - code: PARTIAL_POLICY_ENABLEMENT
    behavior: "Disable enabled fragments and require security owner review."
  - code: ATTESTATION_NOT_SEALED
    behavior: "Do not mark pack active until audit-chain confirms attestation."
worked_example:
  sample_input:
    tenant_id: tenant_acme
    pack_id: EU-AI-ACT-2024-HIGH-RISK
    requested_by_principal_id: principal_admin_01
    compliance_owner_principal_id: principal_compliance_20
    security_owner_principal_id: principal_security_08
    jurisdiction: EU
    activation_deadline: "2026-06-01T00:00:00Z"
  sample_expected_output:
    activation_case_id: cpa_2026_0071
    terminal_state: activated
    enabled_policy_set_ids:
      - policy_set_eu_ai_act_high_risk_v1
      - policy_set_ai_act_human_oversight_v1
    attestation_id: attest_pack_2026_0071
    audit_chain_refs:
      - audit://workflow/compliance-pack/prereqs/01
      - audit://workflow/compliance-pack/cedar-enabled/02
      - audit://workflow/compliance-pack/attested/03
