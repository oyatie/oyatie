---
doc_class: WorkflowTemplate
template_id: workflow-template.agentic-prompt-fence-with-rag-and-cedar.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0059-workflow-ontology-ecosystem-adapter-layer
  - ADR-0185-workflow-studio-client-stack
title: Agentic prompt fence with RAG and Cedar
description: >-
  Runs an agentic LLM task through intent classification, prompt-fence policy,
  tenant-scoped RAG retrieval, per-tool-call Cedar authorization, tool execution,
  output grounding, human escalation, and response delivery with durable audit
  evidence for every agent decision.
tags:
  - agentic
  - llm
  - rag
  - cedar
  - tool-authorization
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: gold
    reason: "Agentic workflows need prompt fences, RAG grounding, and tool-call audit evidence."
  - tier: platinum
    reason: "Adds per-call Cedar permits, human escalation, and grounded-output checks."
ontology_refs:
  object: AgenticRunCase
  actions:
    - AgenticRequestReceived
    - PromptFenceApplied
    - RagContextRetrieved
    - ToolCallAuthorized
    - AgentOutputEvaluated
    - AgenticRunClosed
tenant_context:
  required_fields:
    - tenant_id
    - workspace_id
    - requester_principal_id
    - agent_profile_id
principal_context:
  system_principal: workflow-engine.agentic-prompt-fence
  human_approval_roles:
    - workspace_admin
    - data_owner
    - security_reviewer
data_classes:
  - USER_PROMPT
  - RETRIEVED_CONTEXT
  - TOOL_CALL_ARGUMENTS
  - TOOL_CALL_RESULT
  - AGENT_OUTPUT
residency_pack_overlays:
  - pack: gdpr
    behavior: "Keep RAG retrieval and agent output inside tenant data region."
  - pack: eu-ai-act
    behavior: "Require refusal and human review for high-risk automated decisions."
observability:
  metrics:
    - agentic_prompt_fence_step_latency_seconds
    - agentic_prompt_fence_refusal_total
    - agentic_cedar_tool_denial_total
  traces:
    - workflow.template.agentic_prompt_fence
  logs:
    - workflow_agentic_prompt_fence_audit_projection
cost_allocation:
  unit: agentic_run_step
  dimensions:
    - tenant_id
    - workspace_id
    - agent_profile_id
idempotency:
  key_shape: "tenant_id:workspace_id:agent_run_id:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: execute_authorized_tool_calls
  on_cancel: stop_pending_tool_calls_and_emit_cancelled_run
  audit_event_class: AgenticPromptFenceWorkflowCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_idempotent_actions
inputs:
  tenant_id:
    type: string
    default: tenant_agentic_demo
  workspace_id:
    type: string
    default: workspace_research_001
  agent_run_id:
    type: string
    default: agentrun_2026_5050
  requester_principal_id:
    type: string
    default: principal_researcher_001
  agent_profile_id:
    type: string
    default: analyst_agent_guarded
  user_prompt:
    type: string
    default: "Summarize supplier risk and draft a remediation checklist."
  rag_collection_id:
    type: string
    default: collection_supplier_risk
outputs:
  agent_run_result_id:
    type: string
  terminal_state:
    type: string
  response_status:
    type: string
  authorized_tool_call_count:
    type: integer
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: agent_request_start
    type: start
    config:
      trigger: agentic.request.submitted.v1
      validates:
        - tenant_id
        - workspace_id
        - agent_run_id
        - requester_principal_id
    cedar_permits_required:
      - 'Action::"StartAgenticPromptFenceWorkflow"'
    audit_event_class: AgenticRequestReceived
    slo_target: "PT1M after request"
    failure_modes:
      - code: REQUEST_CONTEXT_MISSING
        behavior: "Reject run and return missing context fields."
    on_success:
      - edge_to_classify_intent
    on_failure:
      - edge_to_exception_end
  - id: classify_intent
    type: action
    config:
      service: agent-router
      contract: agentic-intent-classification.v1
      method: POST
      url: "https://agent-router.internal/v1/intents"
      body:
        agent_run_id: "${inputs.agent_run_id}"
        prompt: "${inputs.user_prompt}"
        agent_profile_id: "${inputs.agent_profile_id}"
    cedar_permits_required:
      - 'Action::"ClassifyAgenticIntent"'
    audit_event_class: AgenticIntentClassified
    slo_target: "PT5S"
    failure_modes:
      - code: INTENT_CLASSIFICATION_UNCERTAIN
        behavior: "Route to human review before any retrieval or tool call."
    on_success:
      - edge_to_apply_prompt_fence
    on_failure:
      - edge_to_human_review
  - id: apply_prompt_fence
    type: action
    config:
      service: prompt-policy
      contract: prompt-fence-evaluation.v1
      method: POST
      url: "https://prompt-policy.internal/v1/fences/evaluate"
      fences:
        - tenant_data_boundary
        - unsafe_instruction_refusal
        - high_risk_decision_block
        - secret_exfiltration_guard
      body:
        intent_id: "${nodes.classify_intent.output.intent_id}"
        prompt: "${inputs.user_prompt}"
        requester_principal_id: "${inputs.requester_principal_id}"
    cedar_permits_required:
      - 'Action::"ApplyAgenticPromptFence"'
    audit_event_class: AgenticPromptFenceApplied
    slo_target: "PT10S"
    failure_modes:
      - code: PROMPT_FENCE_REFUSAL
        behavior: "Return refusal response and skip RAG and tool execution."
    on_success:
      - edge_to_retrieve_rag_context
    on_failure:
      - edge_to_deliver_refusal
  - id: retrieve_rag_context
    type: action
    config:
      service: rag-retrieval
      contract: tenant-rag-retrieval.v1
      method: POST
      url: "https://rag.internal/v1/retrieve"
      retrieval_policy:
        tenant_scope: strict
        max_chunks: 12
        require_citations: true
      body:
        collection_id: "${inputs.rag_collection_id}"
        query: "${inputs.user_prompt}"
        requester_principal_id: "${inputs.requester_principal_id}"
    cedar_permits_required:
      - 'Action::"RetrieveTenantRagContext"'
    audit_event_class: AgenticRagContextRetrieved
    slo_target: "PT20S"
    failure_modes:
      - code: RAG_CONTEXT_EMPTY
        behavior: "Continue only if prompt fence allows no-context answer; otherwise escalate."
    on_success:
      - edge_to_plan_tool_calls
    on_failure:
      - edge_to_human_review
  - id: plan_tool_calls
    type: action
    config:
      service: agent-runtime
      contract: agent-tool-plan.v1
      method: POST
      url: "https://agent-runtime.internal/v1/tool-plans"
      planning_constraints:
        - cite_retrieved_context
        - no_unapproved_external_calls
        - least_privilege_arguments
      body:
        agent_run_id: "${inputs.agent_run_id}"
        rag_context_id: "${nodes.retrieve_rag_context.output.context_id}"
        prompt_fence_id: "${nodes.apply_prompt_fence.output.fence_id}"
    cedar_permits_required:
      - 'Action::"PlanAgenticToolCalls"'
    audit_event_class: AgenticToolCallsPlanned
    slo_target: "PT30S"
    failure_modes:
      - code: TOOL_PLAN_UNSAFE
        behavior: "Block tool execution and route to security review."
    on_success:
      - edge_to_authorize_tool_calls
    on_failure:
      - edge_to_human_review
  - id: authorize_tool_calls
    type: action
    config:
      service: cedar-policy
      contract: cedar-tool-call-authorization.v1
      method: POST
      url: "https://cedar-policy.internal/v1/authorize/tool-calls"
      authorization_mode: per_tool_call
      decision_context:
        requester_principal_id: "${inputs.requester_principal_id}"
        tenant_id: "${inputs.tenant_id}"
        workspace_id: "${inputs.workspace_id}"
        tool_plan_id: "${nodes.plan_tool_calls.output.tool_plan_id}"
    cedar_permits_required:
      - 'Action::"AuthorizeAgenticToolCall"'
    audit_event_class: AgenticToolCallCedarAuthorized
    slo_target: "PT10S per tool call"
    failure_modes:
      - code: TOOL_CALL_DENIED
        behavior: "Remove denied call from plan and require human approval if required output cannot be completed."
    on_success:
      - edge_to_execute_authorized_tool_calls
    on_failure:
      - edge_to_human_review
  - id: execute_authorized_tool_calls
    type: loop
    config:
      service: agent-runtime
      contract: authorized-tool-call-execution.v1
      execution_mode: sequential_with_per_call_audit
      max_tool_calls: 8
      per_call_requirements:
        - cedar_permit_id
        - argument_schema_validation
        - output_redaction
    cedar_permits_required:
      - 'Action::"ExecuteAuthorizedAgenticToolCall"'
    audit_event_class: AgenticAuthorizedToolCallExecuted
    slo_target: "PT2M"
    failure_modes:
      - code: TOOL_CALL_RESULT_UNSAFE
        behavior: "Redact output, stop remaining calls, and route to human review."
    on_success:
      - edge_to_evaluate_grounded_output
    on_failure:
      - edge_to_human_review
  - id: evaluate_grounded_output
    type: action
    config:
      service: agent-evaluation
      contract: grounded-output-evaluation.v1
      method: POST
      url: "https://agent-eval.internal/v1/grounding/evaluate"
      checks:
        - citation_coverage
        - retrieved_context_support
        - policy_refusal_consistency
        - secret_redaction
      body:
        agent_run_id: "${inputs.agent_run_id}"
        tool_execution_id: "${nodes.execute_authorized_tool_calls.output.execution_id}"
        rag_context_id: "${nodes.retrieve_rag_context.output.context_id}"
    cedar_permits_required:
      - 'Action::"EvaluateAgenticGroundedOutput"'
    audit_event_class: AgenticGroundedOutputEvaluated
    slo_target: "PT30S"
    failure_modes:
      - code: OUTPUT_NOT_GROUNDED
        behavior: "Regenerate once with stricter citation requirement, then human review."
    on_success:
      - edge_to_delivery_decision
    on_failure:
      - edge_to_human_review
  - id: human_review
    type: human_task
    config:
      assignee_role: security_reviewer
      task_contract: agentic-run-human-review.v1
      review_reasons:
        - prompt_fence_refusal
        - unsafe_tool_plan
        - cedar_tool_denial
        - ungrounded_output
    cedar_permits_required:
      - 'Action::"ApproveAgenticRunException"'
    audit_event_class: AgenticHumanReviewCompleted
    slo_target: "P1D"
    failure_modes:
      - code: HUMAN_REVIEW_REJECTED
        behavior: "Deliver refusal and close run as rejected."
    on_success:
      - edge_to_deliver_response
    on_failure:
      - edge_to_deliver_refusal
  - id: deliver_response
    type: action
    config:
      service: agent-runtime
      contract: agentic-response-delivery.v1
      method: POST
      url: "https://agent-runtime.internal/v1/responses"
      body:
        agent_run_id: "${inputs.agent_run_id}"
        response_status: completed
        include_citations: true
        include_tool_audit_summary: true
    cedar_permits_required:
      - 'Action::"DeliverAgenticResponse"'
    audit_event_class: AgenticResponseDelivered
    slo_target: "PT1M after output evaluation"
    failure_modes:
      - code: RESPONSE_DELIVERY_FAILED
        behavior: "Retry delivery and preserve completed run result."
    on_success:
      - edge_to_close_workflow
    on_failure:
      - edge_to_exception_end
  - id: deliver_refusal
    type: action
    config:
      service: agent-runtime
      contract: agentic-refusal-delivery.v1
      method: POST
      url: "https://agent-runtime.internal/v1/responses/refusal"
      body:
        agent_run_id: "${inputs.agent_run_id}"
        refusal_reason: policy_or_authorization_denial
        include_safe_alternative: true
    cedar_permits_required:
      - 'Action::"DeliverAgenticRefusal"'
    audit_event_class: AgenticRefusalDelivered
    slo_target: "PT1M after refusal"
    failure_modes:
      - code: REFUSAL_DELIVERY_FAILED
        behavior: "Retry delivery and alert workspace admin."
    on_success:
      - edge_to_close_workflow
    on_failure:
      - edge_to_exception_end
  - id: close_workflow
    type: end
    config:
      terminal_state: completed
      emits:
        - agentic_run_closed
        - cedar_tool_call_audit_committed
        - rag_citation_map_committed
    cedar_permits_required:
      - 'Action::"CloseAgenticPromptFenceWorkflow"'
    audit_event_class: AgenticPromptFenceWorkflowClosed
    slo_target: "PT30S after response delivery"
    failure_modes:
      - code: RUN_AUDIT_CHAIN_INCOMPLETE
        behavior: "Hold run close and retry audit projection."
    on_success: []
    on_failure:
      - edge_to_exception_end
  - id: exception_end
    type: end
    config:
      terminal_state: exception
      requires_manual_owner: true
    cedar_permits_required:
      - 'Action::"RecordAgenticPromptFenceException"'
    audit_event_class: AgenticPromptFenceExceptionRecorded
    slo_target: "PT30M after exception"
    failure_modes:
      - code: EXCEPTION_AUDIT_WRITE_FAILED
        behavior: "Emit dead-letter event for agentic run replay."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_classify_intent
    from: agent_request_start
    to: classify_intent
    name: request_valid
  - id: edge_to_apply_prompt_fence
    from: classify_intent
    to: apply_prompt_fence
    name: intent_classified
  - id: edge_to_retrieve_rag_context
    from: apply_prompt_fence
    to: retrieve_rag_context
    name: prompt_fence_passed
  - id: edge_to_plan_tool_calls
    from: retrieve_rag_context
    to: plan_tool_calls
    name: rag_context_available
  - id: edge_to_authorize_tool_calls
    from: plan_tool_calls
    to: authorize_tool_calls
    name: tool_plan_ready
  - id: edge_to_execute_authorized_tool_calls
    from: authorize_tool_calls
    to: execute_authorized_tool_calls
    name: tool_calls_authorized
  - id: edge_to_evaluate_grounded_output
    from: execute_authorized_tool_calls
    to: evaluate_grounded_output
    name: tool_calls_executed
  - id: edge_to_delivery_decision
    from: evaluate_grounded_output
    to: deliver_response
    name: output_grounded
  - id: edge_to_human_review
    from: "*"
    to: human_review
    name: human_review_required
  - id: edge_to_deliver_response
    from: human_review
    to: deliver_response
    name: human_review_approved
  - id: edge_to_deliver_refusal
    from: "*"
    to: deliver_refusal
    name: refusal_required
  - id: edge_to_close_workflow
    from: "*"
    to: close_workflow
    name: response_delivered
  - id: edge_to_exception_end
    from: "*"
    to: exception_end
    name: exception_recorded
failure_modes:
  - code: POLICY_DENIED
    behavior: "Stop current node, emit Cedar denial audit, and avoid side effects."
  - code: PROMPT_FENCE_BYPASS_ATTEMPT
    behavior: "Refuse unsafe instruction and record security event."
  - code: TOOL_CALL_WITHOUT_PERMIT
    behavior: "Block execution, revoke run lease, and notify security reviewer."
worked_example:
  sample_input:
    tenant_id: tenant_agentic_demo
    workspace_id: workspace_research_001
    agent_run_id: agentrun_2026_5050
    requester_principal_id: principal_researcher_001
    agent_profile_id: analyst_agent_guarded
    user_prompt: "Summarize supplier risk and draft a remediation checklist."
    rag_collection_id: collection_supplier_risk
  sample_expected_output:
    agent_run_result_id: agentresult_2026_5050
    terminal_state: completed
    response_status: delivered
    authorized_tool_call_count: 3
    audit_chain_refs:
      - audit://workflow/agentic-prompt-fence/start/01
      - audit://workflow/agentic-prompt-fence/cedar-tool/06
      - audit://workflow/agentic-prompt-fence/closed/12
