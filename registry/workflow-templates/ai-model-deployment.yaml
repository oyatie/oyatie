---
doc_class: WorkflowTemplate
template_id: workflow-template.ai-model-deployment.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0144-eu-ai-act-graduated-risk-tier-model
  - ADR-0220-consumer-intelligence-substrate
  - ADR-0308-ml-model-lifecycle-ai-act-compliance
title: AI model deployment
description: >-
  Deploys an AI model through training, evaluation, bias audit, EU AI Act
  conformity assessment, human oversight approval, controlled release, and
  post-market monitoring while keeping consumer AI under Intelligence rather
  than Foundry audience boundaries.
tags:
  - ai
  - model-lifecycle
  - eu-ai-act
  - human-oversight
  - post-market-monitoring
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: platinum
    reason: "AI deployment requires model governance, risk classification, and conformity evidence."
ontology_refs:
  object: AiModelDeploymentCase
  actions:
    - ModelTrainingStarted
    - ModelEvaluated
    - BiasAuditCompleted
    - HumanOversightApproved
    - ModelDeployed
    - PostMarketMonitoringStarted
tenant_context:
  required_fields:
    - tenant_id
    - model_id
    - deployment_context_id
    - model_owner_principal_id
principal_context:
  system_principal: workflow-engine.ai-model-deployment
  human_approval_roles:
    - model_owner
    - ai_risk_reviewer
    - human_oversight_approver
    - release_manager
data_classes:
  - AI_TRAINING_DATA
  - AI_VALIDATION_DATA
  - AI_TEST_DATA
  - MODEL_EVALUATION_RESULT
  - BIAS_AUDIT_RESULT
  - CONFORMITY_EVIDENCE
  - AI_HIGH_RISK_DECISION_LOG
residency_pack_overlays:
  - pack: eu-ai-act
    behavior: "High-risk deployments require conformity evidence and post-market monitoring."
  - pack: gdpr
    behavior: "Training and prompt artifacts containing personal data remain in lawful processing scope."
observability:
  metrics:
    - ai_model_eval_pass_rate
    - ai_model_bias_audit_gap_total
    - ai_model_post_market_signal_total
  traces:
    - workflow.template.ai_model_deployment
  logs:
    - workflow_ai_model_deployment_audit_projection
cost_allocation:
  unit: ai_model_deployment_step
  dimensions:
    - tenant_id
    - model_id
    - risk_class
idempotency:
  key_shape: "tenant_id:model_id:model_version:deployment_context_id:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: deploy_model
  on_cancel: revoke_release_candidate_and_preserve_evaluation_evidence
  audit_event_class: AiModelDeploymentCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_training_eval_and_registry_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  model_id:
    type: string
    default: model_001
  model_version:
    type: string
    default: "1.0.0"
  deployment_context_id:
    type: string
    default: context_customer_support
  model_owner_principal_id:
    type: string
    default: principal_model_owner_001
  target_region:
    type: string
    default: eu-frankfurt
  declared_use_case:
    type: string
    default: customer-support-assist
  high_risk_candidate:
    type: boolean
    default: false
outputs:
  deployment_case_id:
    type: string
  terminal_state:
    type: string
  model_registry_release_id:
    type: string
  conformity_attestation_id:
    type: string
  monitoring_plan_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: deployment_request_start
    type: start
    config:
      trigger: intelligence.model.deployment_requested.v1
      validates:
        - tenant_id
        - model_id
        - model_version
        - deployment_context_id
    cedar_permits_required:
      - 'Action::"StartAiModelDeployment"'
    audit_event_class: AiModelDeploymentStarted
    slo_target: "PT30M after deployment request"
    timeout:
      duration: PT10M
      on_timeout: deployment_start_retry
    retry:
      max_attempts: 2
      backoff: PT2M
      retryable_errors:
        - MODEL_DEPLOYMENT_EVENT_LAG
    failure_modes:
      - code: FOUNDRY_AUDIENCE_BOUNDARY_VIOLATION
        behavior: "Reject consumer deployment routed through Foundry audience scope."
    on_success:
      - edge_to_create_deployment_case
    on_failure:
      - edge_to_ai_exception
  - id: create_deployment_case
    type: action
    config:
      service: intelligence
      contract: ai-model-deployment-case.v1
      method: POST
      url: "https://intelligence.internal/v1/model-deployments"
      body:
        model_id: "${inputs.model_id}"
        model_version: "${inputs.model_version}"
        deployment_context_id: "${inputs.deployment_context_id}"
        owner_principal_id: "${inputs.model_owner_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateAiModelDeploymentCase"'
    audit_event_class: AiModelDeploymentCaseCreated
    slo_target: "PT1H"
    timeout:
      duration: PT10M
      on_timeout: case_creation_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - INTELLIGENCE_CASE_WRITE_TIMEOUT
    failure_modes:
      - code: DUPLICATE_DEPLOYMENT_CASE
        behavior: "Return existing case and continue idempotently."
    on_success:
      - edge_to_risk_classification
    on_failure:
      - edge_to_ai_exception
  - id: risk_classification
    type: action
    config:
      service: intelligence
      contract: ai-act-risk-classification.v1
      method: POST
      url: "https://intelligence.internal/v1/ai-act/risk-classifications"
      body:
        model_id: "${inputs.model_id}"
        declared_use_case: "${inputs.declared_use_case}"
        high_risk_candidate: "${inputs.high_risk_candidate}"
    cedar_permits_required:
      - 'Action::"ClassifyAiActRiskTier"'
    audit_event_class: AiActRiskTierClassified
    slo_target: "P1D before model promotion"
    timeout:
      duration: PT1H
      on_timeout: risk_classification_retry
    retry:
      max_attempts: 3
      backoff: PT20M
      retryable_errors:
        - AI_RISK_CLASSIFIER_TIMEOUT
    failure_modes:
      - code: RISK_CLASS_UNKNOWN
        behavior: "Block deployment until AI risk reviewer classifies."
    on_success:
      - edge_to_training_plan
    on_failure:
      - edge_to_ai_exception
  - id: training_plan
    type: action
    config:
      service: model-registry
      contract: model-training-plan.v1
      method: POST
      url: "https://model-registry.internal/v1/training-plans"
      body:
        model_id: "${inputs.model_id}"
        training_data_scope: tenant_scoped
        target_region: "${inputs.target_region}"
    cedar_permits_required:
      - 'Action::"CreateModelTrainingPlan"'
      - 'Action::"ReadAiTrainingData"'
    audit_event_class: AiModelTrainingPlanCreated
    slo_target: "P2D"
    timeout:
      duration: PT2H
      on_timeout: training_plan_retry
    retry:
      max_attempts: 3
      backoff: PT30M
      retryable_errors:
        - TRAINING_PLAN_TIMEOUT
    failure_modes:
      - code: TRAINING_DATA_SCOPE_DENIED
        behavior: "Block training and emit data-scope denial."
    on_success:
      - edge_to_train_model
    on_failure:
      - edge_to_ai_exception
  - id: train_model
    type: action
    config:
      service: model-training
      contract: model-training-run.v1
      method: POST
      url: "https://model-training.internal/v1/runs"
      body:
        training_plan_id: "${nodes.training_plan.output.training_plan_id}"
        model_id: "${inputs.model_id}"
        model_version: "${inputs.model_version}"
    cedar_permits_required:
      - 'Action::"RunModelTraining"'
    audit_event_class: AiModelTrainingCompleted
    slo_target: "P7D"
    timeout:
      duration: P7D
      on_timeout: training_timeout
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: TRAINING_FAILED
        behavior: "Close release candidate and keep training evidence."
    on_success:
      - edge_to_evaluation_parallel
    on_failure:
      - edge_to_ai_exception
  - id: evaluation_parallel
    type: parallel
    config:
      fan_out_limit: 4
      join_semantics: all_success_required
      branches:
        - functional_eval
        - safety_eval
        - bias_audit
        - robustness_eval
    cedar_permits_required:
      - 'Action::"RunAiModelEvaluationFanout"'
    audit_event_class: AiModelEvaluationStarted
    slo_target: "P3D after training"
    timeout:
      duration: P3D
      on_timeout: eval_manual_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: EVAL_BRANCH_FAILED
        behavior: "Block promotion and attach failed eval refs."
    on_success:
      - edge_to_functional_eval
      - edge_to_safety_eval
      - edge_to_bias_audit
      - edge_to_robustness_eval
    on_failure:
      - edge_to_ai_exception
  - id: functional_eval
    type: action
    config:
      service: model-eval
      contract: functional-eval-run.v1
      method: POST
      url: "https://model-eval.internal/v1/functional"
      body:
        model_artifact_ref: "${nodes.train_model.output.model_artifact_ref}"
        eval_dataset_ref: "${nodes.training_plan.output.validation_dataset_ref}"
    cedar_permits_required:
      - 'Action::"RunModelFunctionalEval"'
    audit_event_class: AiModelFunctionalEvalCompleted
    slo_target: "P1D"
    timeout:
      duration: P1D
      on_timeout: functional_eval_timeout
    retry:
      max_attempts: 2
      backoff: PT2H
      retryable_errors:
        - EVAL_WORKER_TIMEOUT
    failure_modes:
      - code: QUALITY_THRESHOLD_FAILED
        behavior: "Block deployment and require model owner remediation."
    on_success:
      - edge_to_evaluation_join
    on_failure:
      - edge_to_ai_exception
  - id: safety_eval
    type: action
    config:
      service: model-eval
      contract: safety-eval-run.v1
      method: POST
      url: "https://model-eval.internal/v1/safety"
      body:
        model_artifact_ref: "${nodes.train_model.output.model_artifact_ref}"
        policy_pack: ai-safety-baseline
    cedar_permits_required:
      - 'Action::"RunModelSafetyEval"'
    audit_event_class: AiModelSafetyEvalCompleted
    slo_target: "P1D"
    timeout:
      duration: P1D
      on_timeout: safety_eval_timeout
    retry:
      max_attempts: 2
      backoff: PT2H
      retryable_errors:
        - SAFETY_EVAL_TIMEOUT
    failure_modes:
      - code: SAFETY_POLICY_FAILED
        behavior: "Block deployment and open risk remediation."
    on_success:
      - edge_to_evaluation_join
    on_failure:
      - edge_to_ai_exception
  - id: bias_audit
    type: action
    config:
      service: model-eval
      contract: bias-audit-run.v1
      method: POST
      url: "https://model-eval.internal/v1/bias-audits"
      body:
        model_artifact_ref: "${nodes.train_model.output.model_artifact_ref}"
        protected_class_matrix_ref: "${nodes.risk_classification.output.bias_matrix_ref}"
    cedar_permits_required:
      - 'Action::"RunModelBiasAudit"'
    audit_event_class: AiModelBiasAuditCompleted
    slo_target: "P2D"
    timeout:
      duration: P2D
      on_timeout: bias_audit_timeout
    retry:
      max_attempts: 2
      backoff: PT4H
      retryable_errors:
        - BIAS_AUDIT_TIMEOUT
    failure_modes:
      - code: BIAS_THRESHOLD_EXCEEDED
        behavior: "Block deployment and require bias mitigation evidence."
    on_success:
      - edge_to_evaluation_join
    on_failure:
      - edge_to_ai_exception
  - id: robustness_eval
    type: action
    config:
      service: model-eval
      contract: robustness-eval-run.v1
      method: POST
      url: "https://model-eval.internal/v1/robustness"
      body:
        model_artifact_ref: "${nodes.train_model.output.model_artifact_ref}"
        cybersecurity_profile: ai-act-article-15
    cedar_permits_required:
      - 'Action::"RunModelRobustnessEval"'
    audit_event_class: AiModelRobustnessEvalCompleted
    slo_target: "P2D"
    timeout:
      duration: P2D
      on_timeout: robustness_eval_timeout
    retry:
      max_attempts: 2
      backoff: PT4H
      retryable_errors:
        - ROBUSTNESS_EVAL_TIMEOUT
    failure_modes:
      - code: ROBUSTNESS_THRESHOLD_FAILED
        behavior: "Block deployment and require release-candidate remediation."
    on_success:
      - edge_to_evaluation_join
    on_failure:
      - edge_to_ai_exception
  - id: evaluation_join
    type: decision
    config:
      expression: "${parallel.evaluation_parallel.all_branches_succeeded}"
      cases:
        "true": conformity_assessment
        "false": ai_exception_end
    cedar_permits_required:
      - 'Action::"EvaluateModelPromotionReadiness"'
    audit_event_class: AiModelEvaluationReadinessDecided
    slo_target: "PT4H after eval completion"
    timeout:
      duration: PT8H
      on_timeout: ai_risk_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: EVALUATION_INCOMPLETE
        behavior: "No human approval until every eval branch is sealed."
    on_success:
      - edge_to_conformity_assessment
    on_failure:
      - edge_to_ai_exception
  - id: conformity_assessment
    type: action
    config:
      service: compliance
      contract: ai-act-conformity-assessment.v1
      method: POST
      url: "https://compliance.internal/v1/ai-act/conformity-assessments"
      body:
        model_id: "${inputs.model_id}"
        risk_classification_ref: "${nodes.risk_classification.output.classification_ref}"
        eval_refs:
          - "${nodes.functional_eval.output.eval_ref}"
          - "${nodes.safety_eval.output.eval_ref}"
          - "${nodes.bias_audit.output.audit_ref}"
          - "${nodes.robustness_eval.output.eval_ref}"
    cedar_permits_required:
      - 'Action::"RunAiActConformityAssessment"'
    audit_event_class: AiActConformityAssessmentCompleted
    slo_target: "P2D"
    timeout:
      duration: P2D
      on_timeout: conformity_timeout
    retry:
      max_attempts: 2
      backoff: PT4H
      retryable_errors:
        - CONFORMITY_ASSESSMENT_TIMEOUT
    failure_modes:
      - code: CONFORMITY_EVIDENCE_GAP
        behavior: "Block release and list missing evidence."
    on_success:
      - edge_to_human_oversight_approve
    on_failure:
      - edge_to_ai_exception
  - id: human_oversight_approve
    type: action
    config:
      service: approvals
      contract: ai-human-oversight-approval.v1
      method: POST
      url: "https://approvals.internal/v1/ai-human-oversight"
      body:
        deployment_case_id: "${nodes.create_deployment_case.output.case_id}"
        approver_roles:
          - human_oversight_approver
          - ai_risk_reviewer
        quorum: 2
        deadline: P3D
    cedar_permits_required:
      - 'Action::"ApproveAiHumanOversightRelease"'
    audit_event_class: AiHumanOversightApprovalCompleted
    slo_target: "P3D"
    timeout:
      duration: P3D
      on_timeout: approval_escalation
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: HUMAN_OVERSIGHT_REJECTED
        behavior: "Close release candidate as rejected."
    on_success:
      - edge_to_register_release_candidate
    on_failure:
      - edge_to_ai_exception
  - id: register_release_candidate
    type: action
    config:
      service: model-registry
      contract: model-release-candidate.v1
      method: POST
      url: "https://model-registry.internal/v1/release-candidates"
      body:
        model_artifact_ref: "${nodes.train_model.output.model_artifact_ref}"
        conformity_assessment_id: "${nodes.conformity_assessment.output.assessment_id}"
        human_approval_ref: "${nodes.human_oversight_approve.output.approval_ref}"
    cedar_permits_required:
      - 'Action::"RegisterModelReleaseCandidate"'
    audit_event_class: AiModelReleaseCandidateRegistered
    slo_target: "PT1D after human approval"
    timeout:
      duration: PT30M
      on_timeout: release_candidate_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - MODEL_REGISTRY_WRITE_TIMEOUT
    failure_modes:
      - code: ARTIFACT_SIGNATURE_MISSING
        behavior: "Block deployment until signed artifact exists."
    on_success:
      - edge_to_deploy_model
    on_failure:
      - edge_to_ai_exception
  - id: deploy_model
    type: action
    config:
      service: intelligence
      contract: ai-model-controlled-deploy.v1
      method: POST
      url: "https://intelligence.internal/v1/model-deployments/deploy"
      body:
        release_candidate_id: "${nodes.register_release_candidate.output.release_candidate_id}"
        target_region: "${inputs.target_region}"
        rollout_strategy: canary_then_progressive
    cedar_permits_required:
      - 'Action::"DeployAiModel"'
      - 'Action::"RouteConsumerAiTraffic"'
    audit_event_class: AiModelDeployed
    slo_target: "PT1D after release candidate registration"
    timeout:
      duration: PT1H
      on_timeout: deployment_retry
    retry:
      max_attempts: 2
      backoff: PT15M
      retryable_errors:
        - MODEL_DEPLOY_TIMEOUT
    failure_modes:
      - code: CANARY_HEALTH_FAILED
        behavior: "Rollback release candidate and block promotion."
    on_success:
      - edge_to_post_market_monitor
    on_failure:
      - edge_to_ai_exception
  - id: post_market_monitor
    type: action
    config:
      service: intelligence
      contract: ai-post-market-monitoring-plan.v1
      method: POST
      url: "https://intelligence.internal/v1/post-market-monitoring"
      body:
        model_id: "${inputs.model_id}"
        model_version: "${inputs.model_version}"
        risk_classification_ref: "${nodes.risk_classification.output.classification_ref}"
        deployment_ref: "${nodes.deploy_model.output.deployment_ref}"
    cedar_permits_required:
      - 'Action::"StartAiPostMarketMonitoring"'
    audit_event_class: AiPostMarketMonitoringStarted
    slo_target: "PT4H after deployment"
    timeout:
      duration: PT30M
      on_timeout: monitoring_plan_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - MONITORING_PLAN_WRITE_TIMEOUT
    failure_modes:
      - code: MONITORING_PLAN_MISSING
        behavior: "Rollback deployment for high-risk models."
    on_success:
      - edge_to_ai_completed
    on_failure:
      - edge_to_ai_exception
  - id: ai_completed_end
    type: end
    config:
      terminal_state: deployed_with_monitoring
      output_contract: ai-model-deployment-result.v1
    cedar_permits_required:
      - 'Action::"CompleteAiModelDeployment"'
    audit_event_class: AiModelDeploymentCompleted
    slo_target: "P21D from deployment request"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Keep deployment case open."
    on_success: []
    on_failure:
      - edge_to_ai_exception
  - id: ai_exception_end
    type: end
    config:
      terminal_state: blocked_or_rejected
      output_contract: ai-model-deployment-exception.v1
    cedar_permits_required:
      - 'Action::"CloseAiModelDeploymentException"'
    audit_event_class: AiModelDeploymentExceptionClosed
    slo_target: "PT1D after blocker"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep risk-review task open."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_deployment_case
    from: deployment_request_start
    to: create_deployment_case
    name: deployment_request_valid
  - id: edge_to_risk_classification
    from: create_deployment_case
    to: risk_classification
    name: deployment_case_created
  - id: edge_to_training_plan
    from: risk_classification
    to: training_plan
    name: risk_classified
  - id: edge_to_train_model
    from: training_plan
    to: train_model
    name: training_plan_ready
  - id: edge_to_evaluation_parallel
    from: train_model
    to: evaluation_parallel
    name: training_complete
  - id: edge_to_functional_eval
    from: evaluation_parallel
    to: functional_eval
    name: functional_eval_branch
  - id: edge_to_safety_eval
    from: evaluation_parallel
    to: safety_eval
    name: safety_eval_branch
  - id: edge_to_bias_audit
    from: evaluation_parallel
    to: bias_audit
    name: bias_audit_branch
  - id: edge_to_robustness_eval
    from: evaluation_parallel
    to: robustness_eval
    name: robustness_eval_branch
  - id: edge_to_evaluation_join
    from: evaluation_parallel
    to: evaluation_join
    name: evaluation_join
  - id: edge_to_conformity_assessment
    from: evaluation_join
    to: conformity_assessment
    name: evals_passed
  - id: edge_to_human_oversight_approve
    from: conformity_assessment
    to: human_oversight_approve
    name: conformity_passed
  - id: edge_to_register_release_candidate
    from: human_oversight_approve
    to: register_release_candidate
    name: oversight_approved
  - id: edge_to_deploy_model
    from: register_release_candidate
    to: deploy_model
    name: release_candidate_registered
  - id: edge_to_post_market_monitor
    from: deploy_model
    to: post_market_monitor
    name: model_deployed
  - id: edge_to_ai_completed
    from: post_market_monitor
    to: ai_completed_end
    name: monitoring_started
  - id: edge_to_ai_exception
    from: deployment_request_start
    to: ai_exception_end
    name: blocked_or_failed
failure_modes:
  - code: HIGH_RISK_WITHOUT_CONFORMITY
    behavior: "Block deployment and emit EU AI Act denial evidence."
  - code: HUMAN_OVERSIGHT_MISSING
    behavior: "No release candidate can be registered."
  - code: POST_MARKET_MONITORING_MISSING
    behavior: "Rollback high-risk deployment and notify AI risk owner."
worked_example:
  sample_input:
    tenant_id: tenant_health_eu
    model_id: model_claims_assist
    model_version: "2.4.0"
    deployment_context_id: context_claims_triage
    model_owner_principal_id: principal_model_18
    target_region: eu-frankfurt
    declared_use_case: essential-service-eligibility-assist
    high_risk_candidate: true
  sample_expected_output:
    deployment_case_id: aimd_2026_240
    terminal_state: deployed_with_monitoring
    model_registry_release_id: mr_release_claims_assist_2_4_0
    conformity_attestation_id: ai_act_attest_2026_240
    monitoring_plan_id: pmm_2026_240
    audit_chain_refs:
      - audit://workflow/ai-model/risk-classified/01
      - audit://workflow/ai-model/conformity/02
      - audit://workflow/ai-model/deployed/03
