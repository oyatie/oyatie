---
doc_class: WorkflowTemplate
template_id: workflow-template.quarterly-board-pack-assembly.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0059-workflow-ontology-ecosystem-adapter-layer
  - ADR-0185-workflow-studio-client-stack
title: Quarterly board pack assembly
description: >-
  Assembles a quarterly board pack from draft source sections through counsel
  review, audit-committee review, board presentation readiness, approval,
  minutes capture, and archive sealing with privilege and disclosure controls.
tags:
  - board
  - governance
  - counsel-review
  - audit-committee
  - minutes-archive
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: platinum
    reason: "Board materials require counsel review, immutable evidence, and archive retention."
ontology_refs:
  object: BoardPackAssemblyCase
  actions:
    - BoardPackDraftCreated
    - CounselReviewCompleted
    - AuditCommitteeReviewCompleted
    - BoardPresentationApproved
    - MinutesArchived
tenant_context:
  required_fields:
    - tenant_id
    - board_cycle_id
    - corporate_secretary_principal_id
    - counsel_owner_principal_id
principal_context:
  system_principal: workflow-engine.board-pack-assembly
  human_approval_roles:
    - corporate_secretary
    - general_counsel
    - audit_committee_chair
    - board_chair
data_classes:
  - BOARD_MATERIAL
  - PRIVILEGED_LEGAL_REVIEW
  - FINANCIAL_REPORTING_SUMMARY
  - AUDIT_COMMITTEE_PACKET
  - BOARD_MINUTES
residency_pack_overlays:
  - pack: sec
    behavior: "Preserve board approval evidence and financial-reporting disclosure flags."
  - pack: gdpr
    behavior: "Redact personal data in people sections unless board-level lawful basis is present."
observability:
  metrics:
    - board_pack_stage_latency_seconds
    - board_pack_counsel_rework_total
    - board_minutes_archive_failure_total
  traces:
    - workflow.template.quarterly_board_pack_assembly
  logs:
    - workflow_board_pack_audit_projection
cost_allocation:
  unit: board_pack_step
  dimensions:
    - tenant_id
    - board_cycle_id
    - fiscal_quarter
idempotency:
  key_shape: "tenant_id:board_cycle_id:fiscal_quarter:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: board_presentation_approve
  on_cancel: archive_draft_snapshot_and_close_open_review_tasks
  audit_event_class: BoardPackAssemblyCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_review_archive_and_notification_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  board_cycle_id:
    type: string
    default: board_2026_q2
  fiscal_quarter:
    type: string
    default: "2026-Q2"
  corporate_secretary_principal_id:
    type: string
    default: principal_corpsec_001
  counsel_owner_principal_id:
    type: string
    default: principal_counsel_001
  audit_committee_chair_principal_id:
    type: string
    default: principal_audit_chair_001
  board_meeting_datetime:
    type: datetime
    default: "2026-07-15T14:00:00Z"
outputs:
  board_pack_case_id:
    type: string
  terminal_state:
    type: string
  board_pack_id:
    type: string
  minutes_archive_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: board_cycle_start
    type: start
    config:
      trigger: governance.board_cycle.opened.v1
      validates:
        - tenant_id
        - board_cycle_id
        - fiscal_quarter
        - board_meeting_datetime
    cedar_permits_required:
      - 'Action::"StartBoardPackAssembly"'
    audit_event_class: BoardPackAssemblyStarted
    slo_target: "P30D before board meeting"
    timeout:
      duration: PT10M
      on_timeout: board_cycle_start_retry
    retry:
      max_attempts: 2
      backoff: PT2M
      retryable_errors:
        - BOARD_CYCLE_EVENT_LAG
    failure_modes:
      - code: BOARD_CYCLE_ALREADY_OPEN
        behavior: "Return existing board pack case."
    on_success:
      - edge_to_create_board_pack_case
    on_failure:
      - edge_to_board_exception
  - id: create_board_pack_case
    type: action
    config:
      service: governance
      contract: board-pack-case.v1
      method: POST
      url: "https://governance.internal/v1/board-pack-cases"
      body:
        board_cycle_id: "${inputs.board_cycle_id}"
        fiscal_quarter: "${inputs.fiscal_quarter}"
        owner_principal_id: "${inputs.corporate_secretary_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateBoardPackCase"'
    audit_event_class: BoardPackCaseCreated
    slo_target: "P29D before meeting"
    timeout:
      duration: PT10M
      on_timeout: board_case_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - GOVERNANCE_CASE_WRITE_TIMEOUT
    failure_modes:
      - code: DUPLICATE_BOARD_PACK_CASE
        behavior: "Continue with existing case."
    on_success:
      - edge_to_draft_parallel
    on_failure:
      - edge_to_board_exception
  - id: draft_parallel
    type: parallel
    config:
      fan_out_limit: 5
      join_semantics: all_success_required
      branches:
        - draft_financial_section
        - draft_security_section
        - draft_compliance_section
        - draft_people_section
        - draft_strategy_section
    cedar_permits_required:
      - 'Action::"RunBoardPackDraftFanout"'
    audit_event_class: BoardPackDraftStarted
    slo_target: "P21D before meeting"
    timeout:
      duration: P7D
      on_timeout: draft_escalation
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: DRAFT_BRANCH_FAILED
        behavior: "Block counsel review until missing section is resolved."
    on_success:
      - edge_to_draft_financial_section
      - edge_to_draft_security_section
      - edge_to_draft_compliance_section
      - edge_to_draft_people_section
      - edge_to_draft_strategy_section
    on_failure:
      - edge_to_board_exception
  - id: draft_financial_section
    type: action
    config:
      service: finance
      contract: board-financial-section-draft.v1
      method: POST
      url: "https://finance.internal/v1/board-pack/financial-section"
      body:
        fiscal_quarter: "${inputs.fiscal_quarter}"
        board_cycle_id: "${inputs.board_cycle_id}"
    cedar_permits_required:
      - 'Action::"DraftBoardFinancialSection"'
    audit_event_class: BoardFinancialSectionDrafted
    slo_target: "P21D before meeting"
    timeout:
      duration: P3D
      on_timeout: financial_section_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - FINANCE_REPORTING_DELAY
    failure_modes:
      - code: FINANCIAL_CLOSE_NOT_READY
        behavior: "Mark board pack at risk and notify CFO delegate."
    on_success:
      - edge_to_draft_join
    on_failure:
      - edge_to_board_exception
  - id: draft_security_section
    type: action
    config:
      service: security
      contract: board-security-section-draft.v1
      method: POST
      url: "https://security.internal/v1/board-pack/security-section"
      body:
        fiscal_quarter: "${inputs.fiscal_quarter}"
        include_incident_summary: true
    cedar_permits_required:
      - 'Action::"DraftBoardSecuritySection"'
    audit_event_class: BoardSecuritySectionDrafted
    slo_target: "P21D before meeting"
    timeout:
      duration: P3D
      on_timeout: security_section_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - SECURITY_REPORT_DELAY
    failure_modes:
      - code: INCIDENT_DISCLOSURE_UNREVIEWED
        behavior: "Hold section for counsel review marker."
    on_success:
      - edge_to_draft_join
    on_failure:
      - edge_to_board_exception
  - id: draft_compliance_section
    type: action
    config:
      service: compliance
      contract: board-compliance-section-draft.v1
      method: POST
      url: "https://compliance.internal/v1/board-pack/compliance-section"
      body:
        fiscal_quarter: "${inputs.fiscal_quarter}"
        include_pack_status: true
    cedar_permits_required:
      - 'Action::"DraftBoardComplianceSection"'
    audit_event_class: BoardComplianceSectionDrafted
    slo_target: "P21D before meeting"
    timeout:
      duration: P3D
      on_timeout: compliance_section_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - COMPLIANCE_REPORT_DELAY
    failure_modes:
      - code: REGULATORY_STATUS_STALE
        behavior: "Require compliance owner refresh before counsel review."
    on_success:
      - edge_to_draft_join
    on_failure:
      - edge_to_board_exception
  - id: draft_people_section
    type: action
    config:
      service: hr
      contract: board-people-section-draft.v1
      method: POST
      url: "https://hr.internal/v1/board-pack/people-section"
      body:
        fiscal_quarter: "${inputs.fiscal_quarter}"
        aggregate_only: true
    cedar_permits_required:
      - 'Action::"DraftBoardPeopleSection"'
    audit_event_class: BoardPeopleSectionDrafted
    slo_target: "P21D before meeting"
    timeout:
      duration: P3D
      on_timeout: people_section_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - HR_REPORT_DELAY
    failure_modes:
      - code: PERSONAL_DATA_PRESENT
        behavior: "Route to privacy redaction before pack join."
    on_success:
      - edge_to_draft_join
    on_failure:
      - edge_to_board_exception
  - id: draft_strategy_section
    type: action
    config:
      service: strategy
      contract: board-strategy-section-draft.v1
      method: POST
      url: "https://strategy.internal/v1/board-pack/strategy-section"
      body:
        board_cycle_id: "${inputs.board_cycle_id}"
        fiscal_quarter: "${inputs.fiscal_quarter}"
    cedar_permits_required:
      - 'Action::"DraftBoardStrategySection"'
    audit_event_class: BoardStrategySectionDrafted
    slo_target: "P21D before meeting"
    timeout:
      duration: P3D
      on_timeout: strategy_section_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - STRATEGY_REPORT_DELAY
    failure_modes:
      - code: STRATEGY_SECTION_MISSING
        behavior: "Notify corporate secretary."
    on_success:
      - edge_to_draft_join
    on_failure:
      - edge_to_board_exception
  - id: draft_join
    type: decision
    config:
      expression: "${parallel.draft_parallel.all_branches_succeeded}"
      cases:
        "true": assemble_draft_pack
        "false": board_exception_end
    cedar_permits_required:
      - 'Action::"EvaluateBoardDraftCompleteness"'
    audit_event_class: BoardPackDraftCompletenessEvaluated
    slo_target: "P20D before meeting"
    timeout:
      duration: PT8H
      on_timeout: corporate_secretary_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: DRAFT_INCOMPLETE
        behavior: "No counsel review until all sections exist."
    on_success:
      - edge_to_assemble_draft_pack
    on_failure:
      - edge_to_board_exception
  - id: assemble_draft_pack
    type: action
    config:
      service: governance
      contract: board-pack-draft-assemble.v1
      method: POST
      url: "https://governance.internal/v1/board-packs/drafts"
      body:
        board_cycle_id: "${inputs.board_cycle_id}"
        section_refs:
          - "${nodes.draft_financial_section.output.section_ref}"
          - "${nodes.draft_security_section.output.section_ref}"
          - "${nodes.draft_compliance_section.output.section_ref}"
          - "${nodes.draft_people_section.output.section_ref}"
          - "${nodes.draft_strategy_section.output.section_ref}"
    cedar_permits_required:
      - 'Action::"AssembleBoardPackDraft"'
    audit_event_class: BoardPackDraftAssembled
    slo_target: "P19D before meeting"
    timeout:
      duration: PT4H
      on_timeout: draft_assembly_retry
    retry:
      max_attempts: 3
      backoff: PT1H
      retryable_errors:
        - DOCUMENT_ASSEMBLY_TIMEOUT
    failure_modes:
      - code: SECTION_DIGEST_MISMATCH
        behavior: "Reject assembly and regenerate affected section."
    on_success:
      - edge_to_counsel_review
    on_failure:
      - edge_to_board_exception
  - id: counsel_review
    type: action
    config:
      service: legal
      contract: board-pack-counsel-review.v1
      method: POST
      url: "https://legal.internal/v1/board-pack/counsel-reviews"
      body:
        board_pack_draft_id: "${nodes.assemble_draft_pack.output.draft_id}"
        counsel_owner_principal_id: "${inputs.counsel_owner_principal_id}"
        privilege_marking_required: true
    cedar_permits_required:
      - 'Action::"ReviewBoardPackAsCounsel"'
    audit_event_class: BoardPackCounselReviewCompleted
    slo_target: "P14D before meeting"
    timeout:
      duration: P5D
      on_timeout: counsel_review_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - COUNSEL_REVIEW_DELAY
    failure_modes:
      - code: PRIVILEGED_CONTENT_UNMARKED
        behavior: "Return to corporate secretary for correction."
    on_success:
      - edge_to_counsel_decision
    on_failure:
      - edge_to_board_exception
  - id: counsel_decision
    type: decision
    config:
      expression: "${nodes.counsel_review.output.outcome}"
      cases:
        approved: audit_committee_review
        rework_required: assemble_draft_pack
        rejected: board_exception_end
    cedar_permits_required:
      - 'Action::"DecideBoardPackCounselOutcome"'
    audit_event_class: BoardPackCounselOutcomeDecided
    slo_target: "PT4H after counsel review"
    timeout:
      duration: PT8H
      on_timeout: counsel_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: COUNSEL_OUTCOME_UNKNOWN
        behavior: "Block audit committee review."
    on_success:
      - edge_to_audit_committee_review
      - edge_to_assemble_draft_pack
    on_failure:
      - edge_to_board_exception
  - id: audit_committee_review
    type: action
    config:
      service: governance
      contract: audit-committee-review.v1
      method: POST
      url: "https://governance.internal/v1/audit-committee/reviews"
      body:
        board_pack_draft_id: "${nodes.assemble_draft_pack.output.draft_id}"
        audit_committee_chair_principal_id: "${inputs.audit_committee_chair_principal_id}"
    cedar_permits_required:
      - 'Action::"ReviewBoardPackAuditCommittee"'
    audit_event_class: BoardPackAuditCommitteeReviewCompleted
    slo_target: "P7D before meeting"
    timeout:
      duration: P5D
      on_timeout: audit_committee_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - AUDIT_COMMITTEE_REVIEW_DELAY
    failure_modes:
      - code: AUDIT_COMMITTEE_REWORK_REQUIRED
        behavior: "Return to corporate secretary and counsel."
    on_success:
      - edge_to_board_presentation_approve
    on_failure:
      - edge_to_board_exception
  - id: board_presentation_approve
    type: action
    config:
      service: approvals
      contract: board-presentation-approval.v1
      method: POST
      url: "https://approvals.internal/v1/board-presentation"
      body:
        board_pack_draft_id: "${nodes.assemble_draft_pack.output.draft_id}"
        approver_roles:
          - corporate_secretary
          - board_chair
        quorum: 2
        deadline: P3D
    cedar_permits_required:
      - 'Action::"ApproveBoardPresentationPack"'
    audit_event_class: BoardPresentationPackApproved
    slo_target: "P3D before meeting"
    timeout:
      duration: P3D
      on_timeout: board_presentation_approval_timeout
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: PRESENTATION_APPROVAL_REJECTED
        behavior: "Do not distribute board pack."
    on_success:
      - edge_to_distribute_board_pack
    on_failure:
      - edge_to_board_exception
  - id: distribute_board_pack
    type: action
    config:
      service: governance
      contract: board-pack-distribution.v1
      method: POST
      url: "https://governance.internal/v1/board-packs/distribute"
      body:
        board_pack_draft_id: "${nodes.assemble_draft_pack.output.draft_id}"
        board_meeting_datetime: "${inputs.board_meeting_datetime}"
        watermark_and_expiry_required: true
    cedar_permits_required:
      - 'Action::"DistributeBoardPack"'
    audit_event_class: BoardPackDistributed
    slo_target: "P2D before meeting"
    timeout:
      duration: PT2H
      on_timeout: distribution_retry
    retry:
      max_attempts: 3
      backoff: PT30M
      retryable_errors:
        - BOARD_PORTAL_TIMEOUT
    failure_modes:
      - code: BOARD_MEMBER_ACCESS_DENIED
        behavior: "Notify corporate secretary; do not email unprotected pack."
    on_success:
      - edge_to_minutes_capture
    on_failure:
      - edge_to_board_exception
  - id: minutes_capture
    type: action
    config:
      service: governance
      contract: board-minutes-capture.v1
      method: POST
      url: "https://governance.internal/v1/board-minutes"
      body:
        board_cycle_id: "${inputs.board_cycle_id}"
        board_pack_id: "${nodes.distribute_board_pack.output.board_pack_id}"
        capture_mode: secretary_attested
    cedar_permits_required:
      - 'Action::"CaptureBoardMinutes"'
    audit_event_class: BoardMinutesCaptured
    slo_target: "P5D after meeting"
    timeout:
      duration: P5D
      on_timeout: minutes_capture_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - MINUTES_CAPTURE_DELAY
    failure_modes:
      - code: MINUTES_NOT_ATTESTED
        behavior: "Do not archive as final."
    on_success:
      - edge_to_minutes_archive
    on_failure:
      - edge_to_board_exception
  - id: minutes_archive
    type: action
    config:
      service: records
      contract: board-minutes-archive.v1
      method: POST
      url: "https://records.internal/v1/board-minutes/archive"
      body:
        board_cycle_id: "${inputs.board_cycle_id}"
        minutes_ref: "${nodes.minutes_capture.output.minutes_ref}"
        retention_profile: board_records_retention
    cedar_permits_required:
      - 'Action::"ArchiveBoardMinutes"'
    audit_event_class: BoardMinutesArchived
    slo_target: "P7D after meeting"
    timeout:
      duration: PT4H
      on_timeout: archive_retry
    retry:
      max_attempts: 3
      backoff: PT1H
      retryable_errors:
        - RECORDS_ARCHIVE_TIMEOUT
    failure_modes:
      - code: ARCHIVE_DIGEST_MISMATCH
        behavior: "Retry archive and keep minutes unsealed."
    on_success:
      - edge_to_board_completed
    on_failure:
      - edge_to_board_exception
  - id: board_completed_end
    type: end
    config:
      terminal_state: archived
      output_contract: board-pack-assembly-result.v1
    cedar_permits_required:
      - 'Action::"CompleteBoardPackAssembly"'
    audit_event_class: BoardPackAssemblyCompleted
    slo_target: "P7D after meeting"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Keep board cycle open."
    on_success: []
    on_failure:
      - edge_to_board_exception
  - id: board_exception_end
    type: end
    config:
      terminal_state: blocked_or_rework_required
      output_contract: board-pack-assembly-exception.v1
    cedar_permits_required:
      - 'Action::"CloseBoardPackAssemblyException"'
    audit_event_class: BoardPackAssemblyExceptionClosed
    slo_target: "PT1D after blocker"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep corporate-secretary task visible."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_board_pack_case
    from: board_cycle_start
    to: create_board_pack_case
    name: board_cycle_valid
  - id: edge_to_draft_parallel
    from: create_board_pack_case
    to: draft_parallel
    name: case_created
  - id: edge_to_draft_financial_section
    from: draft_parallel
    to: draft_financial_section
    name: financial_branch
  - id: edge_to_draft_security_section
    from: draft_parallel
    to: draft_security_section
    name: security_branch
  - id: edge_to_draft_compliance_section
    from: draft_parallel
    to: draft_compliance_section
    name: compliance_branch
  - id: edge_to_draft_people_section
    from: draft_parallel
    to: draft_people_section
    name: people_branch
  - id: edge_to_draft_strategy_section
    from: draft_parallel
    to: draft_strategy_section
    name: strategy_branch
  - id: edge_to_draft_join
    from: draft_parallel
    to: draft_join
    name: draft_join
  - id: edge_to_assemble_draft_pack
    from: draft_join
    to: assemble_draft_pack
    name: draft_complete
  - id: edge_to_counsel_review
    from: assemble_draft_pack
    to: counsel_review
    name: draft_assembled
  - id: edge_to_counsel_decision
    from: counsel_review
    to: counsel_decision
    name: counsel_review_complete
  - id: edge_to_audit_committee_review
    from: counsel_decision
    to: audit_committee_review
    name: counsel_approved
  - id: edge_to_board_presentation_approve
    from: audit_committee_review
    to: board_presentation_approve
    name: audit_committee_approved
  - id: edge_to_distribute_board_pack
    from: board_presentation_approve
    to: distribute_board_pack
    name: presentation_approved
  - id: edge_to_minutes_capture
    from: distribute_board_pack
    to: minutes_capture
    name: board_pack_distributed
  - id: edge_to_minutes_archive
    from: minutes_capture
    to: minutes_archive
    name: minutes_captured
  - id: edge_to_board_completed
    from: minutes_archive
    to: board_completed_end
    name: minutes_archived
  - id: edge_to_board_exception
    from: board_cycle_start
    to: board_exception_end
    name: blocked_or_failed
failure_modes:
  - code: PRIVILEGE_REVIEW_FAILED
    behavior: "Stop distribution until counsel clears the pack."
  - code: AUDIT_COMMITTEE_REWORK
    behavior: "Return to draft assembly with rework reasons."
  - code: MINUTES_ARCHIVE_FAILED
    behavior: "Do not close board cycle until archive digest is sealed."
worked_example:
  sample_input:
    tenant_id: tenant_acme
    board_cycle_id: board_2026_q2
    fiscal_quarter: "2026-Q2"
    corporate_secretary_principal_id: principal_corpsec_10
    counsel_owner_principal_id: principal_gc_01
    audit_committee_chair_principal_id: principal_audit_chair_02
    board_meeting_datetime: "2026-07-15T14:00:00Z"
  sample_expected_output:
