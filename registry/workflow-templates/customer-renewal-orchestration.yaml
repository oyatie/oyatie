---
doc_class: WorkflowTemplate
template_id: workflow-template.customer-renewal-orchestration.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0059-workflow-ontology-ecosystem-adapter-layer
  - ADR-0185-workflow-studio-client-stack
  - ADR-0316-capability-tier-over-product-fragmentation
title: Customer renewal orchestration
description: >-
  Runs renewal touchpoints from 60-day pre-expiry notice through usage review,
  renewal pitch, contract update, invoice generation, and payment confirmation
  with account-team approval gates and customer-safe audit evidence.
tags:
  - revenue
  - customer-success
  - contract
  - invoicing
  - renewal
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: gold
    reason: "Customer-facing renewals need contract, billing, and approval orchestration."
  - tier: platinum
    reason: "Adds regulated contract evidence and enterprise invoice controls."
ontology_refs:
  object: CustomerRenewalCase
  actions:
    - RenewalWindowOpened
    - UsageReviewed
    - RenewalPitchSent
    - ContractUpdated
    - InvoiceGenerated
    - PaymentConfirmed
tenant_context:
  required_fields:
    - tenant_id
    - customer_account_id
    - account_owner_principal_id
    - finance_owner_principal_id
principal_context:
  system_principal: workflow-engine.customer-renewal
  human_approval_roles:
    - account_owner
    - legal_reviewer
    - finance_owner
data_classes:
  - CUSTOMER_ACCOUNT
  - CONTRACT_COMMERCIAL_TERMS
  - USAGE_ANALYTICS
  - BILLING_CONTACT
  - PAYMENT_STATUS
residency_pack_overlays:
  - pack: gdpr
    behavior: "Usage review excludes personal-level telemetry unless lawful basis is present."
  - pack: soc2
    behavior: "Contract and invoice state transitions emit immutable evidence rows."
observability:
  metrics:
    - customer_renewal_stage_latency_seconds
    - customer_renewal_at_risk_total
    - customer_renewal_payment_delay_total
  traces:
    - workflow.template.customer_renewal
  logs:
    - workflow_customer_renewal_audit_projection
cost_allocation:
  unit: workflow_step_transition
  dimensions:
    - tenant_id
    - customer_account_id
    - renewal_segment
idempotency:
  key_shape: "tenant_id:customer_account_id:contract_id:renewal_term:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: contract_update
  on_cancel: close_open_tasks_and_preserve_quote_snapshot
  audit_event_class: CustomerRenewalCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_idempotent_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  customer_account_id:
    type: string
    default: customer_001
  contract_id:
    type: string
    default: contract_001
  renewal_term_months:
    type: integer
    default: 12
  expiry_date:
    type: date
    default: "2026-08-31"
  account_owner_principal_id:
    type: string
    default: principal_ae_001
  finance_owner_principal_id:
    type: string
    default: principal_finance_001
  discount_ceiling_percent:
    type: integer
    default: 15
outputs:
  renewal_case_id:
    type: string
  terminal_state:
    type: string
  signed_contract_id:
    type: string
  invoice_id:
    type: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: renewal_window_start
    type: start
    config:
      trigger: contract_expiry_minus_60_days
      validates:
        - tenant_id
        - customer_account_id
        - contract_id
        - expiry_date
    cedar_permits_required:
      - 'Action::"StartCustomerRenewal"'
    audit_event_class: CustomerRenewalWindowOpened
    slo_target: "P60D before expiry"
    timeout:
      duration: PT10M
      on_timeout: renewal_start_retry
    retry:
      max_attempts: 2
      backoff: PT5M
      retryable_errors:
        - CONTRACT_EVENT_LAG
    failure_modes:
      - code: CONTRACT_NOT_ACTIVE
        behavior: "Do not create renewal case; emit non-renewable audit row."
    on_success:
      - edge_to_create_renewal_case
    on_failure:
      - edge_to_renewal_exception
  - id: create_renewal_case
    type: action
    config:
      service: crm
      contract: renewal-case.v1
      method: POST
      url: "https://crm.internal/v1/renewal-cases"
      body:
        customer_account_id: "${inputs.customer_account_id}"
        contract_id: "${inputs.contract_id}"
        expiry_date: "${inputs.expiry_date}"
        owner_principal_id: "${inputs.account_owner_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateRenewalCase"'
    audit_event_class: CustomerRenewalCaseCreated
    slo_target: "PT30M after renewal window opens"
    timeout:
      duration: PT5M
      on_timeout: crm_case_retry
    retry:
      max_attempts: 3
      backoff: PT2M
      retryable_errors:
        - CRM_WRITE_TIMEOUT
    failure_modes:
      - code: DUPLICATE_RENEWAL_CASE
        behavior: "Return existing case and continue idempotently."
    on_success:
      - edge_to_usage_review
    on_failure:
      - edge_to_renewal_exception
  - id: usage_review
    type: action
    config:
      service: analytics
      contract: customer-usage-review.v1
      method: POST
      url: "https://analytics.internal/v1/customer-usage-reviews"
      body:
        customer_account_id: "${inputs.customer_account_id}"
        period_end: "${inputs.expiry_date}"
        aggregate_only: true
    cedar_permits_required:
      - 'Action::"ReadCustomerUsageAggregate"'
      - 'Action::"CreateRenewalUsageReview"'
    audit_event_class: CustomerUsageReviewCreated
    slo_target: "P55D before expiry"
    timeout:
      duration: PT30M
      on_timeout: usage_review_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - ANALYTICS_SNAPSHOT_DELAYED
    failure_modes:
      - code: PERSONAL_TELEMETRY_DENIED
        behavior: "Fallback to account aggregate and record privacy-safe degradation."
    on_success:
      - edge_to_health_decision
    on_failure:
      - edge_to_account_owner_review
  - id: account_health_decision
    type: decision
    config:
      expression: "${nodes.usage_review.output.health_score}"
      cases:
        green: standard_pitch
        yellow: executive_attention
        red: retention_plan
    cedar_permits_required:
      - 'Action::"DecideRenewalHealth"'
    audit_event_class: RenewalHealthDecided
    slo_target: "P54D before expiry"
    timeout:
      duration: PT1H
      on_timeout: account_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: HEALTH_SCORE_MISSING
        behavior: "Route to account owner before customer contact."
    on_success:
      - edge_to_prepare_pitch_parallel
    on_failure:
      - edge_to_account_owner_review
  - id: prepare_pitch_parallel
    type: parallel
    config:
      fan_out_limit: 3
      join_semantics: all_success_required
      branches:
        - commercial_terms
        - stakeholder_map
        - success_plan
    cedar_permits_required:
      - 'Action::"PrepareRenewalPitch"'
    audit_event_class: RenewalPitchPreparationStarted
    slo_target: "P50D before expiry"
    timeout:
      duration: P2D
      on_timeout: pitch_preparation_exception
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: PITCH_INPUT_INCOMPLETE
        behavior: "Block customer pitch and notify account owner."
    on_success:
      - edge_to_commercial_terms
      - edge_to_stakeholder_map
      - edge_to_success_plan
    on_failure:
      - edge_to_account_owner_review
  - id: commercial_terms
    type: action
    config:
      service: pricing
      contract: renewal-commercial-terms.v1
      method: POST
      url: "https://pricing.internal/v1/renewal-terms"
      body:
        contract_id: "${inputs.contract_id}"
        renewal_term_months: "${inputs.renewal_term_months}"
        discount_ceiling_percent: "${inputs.discount_ceiling_percent}"
    cedar_permits_required:
      - 'Action::"GenerateRenewalTerms"'
    audit_event_class: RenewalCommercialTermsGenerated
    slo_target: "PT4H"
    timeout:
      duration: PT20M
      on_timeout: pricing_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - PRICING_SERVICE_TIMEOUT
    failure_modes:
      - code: DISCOUNT_POLICY_DENIED
        behavior: "Route to finance owner; do not expose quote."
    on_success:
      - edge_to_pitch_join
    on_failure:
      - edge_to_finance_review
  - id: stakeholder_map
    type: action
    config:
      service: crm
      contract: renewal-stakeholder-map.v1
      method: POST
      url: "https://crm.internal/v1/stakeholder-maps"
      body:
        customer_account_id: "${inputs.customer_account_id}"
        renewal_case_id: "${nodes.create_renewal_case.output.case_id}"
    cedar_permits_required:
      - 'Action::"ReadCustomerContacts"'
      - 'Action::"CreateRenewalStakeholderMap"'
    audit_event_class: RenewalStakeholderMapCreated
    slo_target: "PT4H"
    timeout:
      duration: PT15M
      on_timeout: stakeholder_map_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - CRM_READ_TIMEOUT
    failure_modes:
      - code: BILLING_CONTACT_MISSING
        behavior: "Create account-owner task before renewal pitch."
    on_success:
      - edge_to_pitch_join
    on_failure:
      - edge_to_account_owner_review
  - id: success_plan
    type: action
    config:
      service: customer-success
      contract: renewal-success-plan.v1
      method: POST
      url: "https://customer-success.internal/v1/success-plans"
      body:
        usage_review_id: "${nodes.usage_review.output.review_id}"
        customer_account_id: "${inputs.customer_account_id}"
    cedar_permits_required:
      - 'Action::"CreateCustomerSuccessPlan"'
    audit_event_class: RenewalSuccessPlanCreated
    slo_target: "PT8H"
    timeout:
      duration: PT30M
      on_timeout: success_plan_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - SUCCESS_PLAN_WRITE_TIMEOUT
    failure_modes:
      - code: SUCCESS_OWNER_MISSING
        behavior: "Assign account owner as fallback."
    on_success:
      - edge_to_pitch_join
    on_failure:
      - edge_to_account_owner_review
  - id: pitch_join
    type: decision
    config:
      expression: "${parallel.prepare_pitch_parallel.all_branches_succeeded}"
      cases:
        "true": renewal_pitch
        "false": account_owner_review
    cedar_permits_required:
      - 'Action::"ApproveRenewalPitchReadiness"'
    audit_event_class: RenewalPitchReadinessEvaluated
    slo_target: "P48D before expiry"
    timeout:
      duration: PT1H
      on_timeout: account_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: PITCH_NOT_READY
        behavior: "No customer communication until all required inputs exist."
    on_success:
      - edge_to_renewal_pitch
    on_failure:
      - edge_to_account_owner_review
  - id: renewal_pitch
    type: action
    config:
      service: communications
      contract: renewal-pitch-send.v1
      method: POST
      url: "https://communications.internal/v1/renewal-pitches"
      body:
        renewal_case_id: "${nodes.create_renewal_case.output.case_id}"
        stakeholder_map_id: "${nodes.stakeholder_map.output.map_id}"
        terms_id: "${nodes.commercial_terms.output.terms_id}"
    cedar_permits_required:
      - 'Action::"SendRenewalPitch"'
    audit_event_class: RenewalPitchSent
    slo_target: "P45D before expiry"
    timeout:
      duration: PT15M
      on_timeout: pitch_send_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - COMMUNICATION_SEND_TIMEOUT
    failure_modes:
      - code: CUSTOMER_CONTACT_POLICY_DENIED
        behavior: "Stop send and require account owner remediation."
    on_success:
      - edge_to_customer_response_wait
    on_failure:
      - edge_to_account_owner_review
  - id: customer_response_wait
    type: loop
    config:
      poll_contract: renewal-response-status.v1
      poll_interval: P2D
      max_elapsed: P30D
      terminal_statuses:
        - accepted
        - rejected
        - negotiation
    cedar_permits_required:
      - 'Action::"ReadRenewalResponseStatus"'
    audit_event_class: RenewalResponseStatusPolled
    slo_target: "P20D before expiry"
    timeout:
      duration: P30D
      on_timeout: account_owner_escalation
    retry:
      max_attempts: 15
      backoff: P2D
      retryable_errors:
        - RESPONSE_NOT_READY
    failure_modes:
      - code: CUSTOMER_NON_RESPONSE
        behavior: "Escalate to account owner and mark at-risk."
    on_success:
      - edge_to_response_decision
    on_failure:
      - edge_to_account_owner_review
  - id: response_decision
    type: decision
    config:
      expression: "${nodes.customer_response_wait.output.status}"
      cases:
        accepted: contract_update
        negotiation: legal_review
        rejected: renewal_lost_end
    cedar_permits_required:
      - 'Action::"DecideRenewalResponse"'
    audit_event_class: RenewalResponseDecided
    slo_target: "PT2H after response"
    timeout:
      duration: PT4H
      on_timeout: account_owner_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: RESPONSE_STATUS_UNKNOWN
        behavior: "Block contract update until human review."
    on_success:
      - edge_to_contract_update
    on_failure:
      - edge_to_account_owner_review
  - id: legal_review
    type: action
    config:
      service: legal
      contract: renewal-legal-review.v1
      method: POST
      url: "https://legal.internal/v1/renewal-reviews"
      body:
        renewal_case_id: "${nodes.create_renewal_case.output.case_id}"
        response_notes_ref: "${nodes.customer_response_wait.output.response_ref}"
    cedar_permits_required:
      - 'Action::"ReviewRenewalContractChanges"'
    audit_event_class: RenewalLegalReviewCompleted
    slo_target: "P10D before expiry"
    timeout:
      duration: P5D
      on_timeout: legal_escalation
    retry:
      max_attempts: 2
      backoff: P1D
      retryable_errors:
        - LEGAL_QUEUE_DELAY
    failure_modes:
      - code: NON_STANDARD_TERMS_REJECTED
        behavior: "Return to account owner with legal rationale."
    on_success:
      - edge_to_contract_update
    on_failure:
      - edge_to_account_owner_review
  - id: contract_update
    type: action
    config:
      service: contracts
      contract: renewal-contract-update.v1
      method: POST
      url: "https://contracts.internal/v1/renewals"
      body:
        contract_id: "${inputs.contract_id}"
        terms_id: "${nodes.commercial_terms.output.terms_id}"
        renewal_term_months: "${inputs.renewal_term_months}"
    cedar_permits_required:
      - 'Action::"UpdateCustomerContract"'
    audit_event_class: RenewalContractUpdated
    slo_target: "P7D before expiry"
    timeout:
      duration: PT30M
      on_timeout: contract_update_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - CONTRACT_WRITE_TIMEOUT
    failure_modes:
      - code: CONTRACT_VERSION_CONFLICT
        behavior: "Reload latest contract and route to legal if terms changed."
    on_success:
      - edge_to_invoice_generation
    on_failure:
      - edge_to_legal_review
  - id: invoice_generation
    type: action
    config:
      service: billing
      contract: renewal-invoice.v1
      method: POST
      url: "https://billing.internal/v1/invoices"
      body:
        signed_contract_id: "${nodes.contract_update.output.signed_contract_id}"
        finance_owner_principal_id: "${inputs.finance_owner_principal_id}"
    cedar_permits_required:
      - 'Action::"GenerateRenewalInvoice"'
    audit_event_class: RenewalInvoiceGenerated
    slo_target: "P5D before expiry"
    timeout:
      duration: PT20M
      on_timeout: invoice_generation_retry
    retry:
      max_attempts: 3
      backoff: PT10M
      retryable_errors:
        - BILLING_WRITE_TIMEOUT
    failure_modes:
      - code: TAX_PROFILE_MISSING
        behavior: "Route to finance owner; do not send invoice."
    on_success:
      - edge_to_payment_confirmation_wait
    on_failure:
      - edge_to_finance_review
  - id: payment_confirmation_wait
    type: loop
    config:
      poll_contract: invoice-payment-status.v1
      poll_interval: P1D
      max_elapsed: P30D
      terminal_statuses:
        - paid
        - failed
        - write_off_approved
    cedar_permits_required:
      - 'Action::"ReadRenewalPaymentStatus"'
    audit_event_class: RenewalPaymentStatusPolled
    slo_target: "P10D after invoice issue"
    timeout:
      duration: P30D
      on_timeout: finance_escalation
    retry:
      max_attempts: 30
      backoff: P1D
      retryable_errors:
        - PAYMENT_STATUS_NOT_READY
    failure_modes:
      - code: PAYMENT_OVERDUE
        behavior: "Create collections task and mark renewal incomplete."
    on_success:
      - edge_to_payment_decision
    on_failure:
      - edge_to_finance_review
  - id: payment_decision
    type: decision
    config:
      expression: "${nodes.payment_confirmation_wait.output.status}"
      cases:
        paid: renewal_completed_end
        write_off_approved: renewal_completed_end
        failed: finance_review
    cedar_permits_required:
      - 'Action::"DecideRenewalPaymentOutcome"'
    audit_event_class: RenewalPaymentOutcomeDecided
    slo_target: "PT2H after terminal payment status"
    timeout:
      duration: PT4H
      on_timeout: finance_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: PAYMENT_STATUS_UNKNOWN
        behavior: "Keep renewal case open."
    on_success:
      - edge_to_renewal_completed
    on_failure:
      - edge_to_finance_review
  - id: renewal_completed_end
    type: end
    config:
      terminal_state: renewed
      output_contract: customer-renewal-result.v1
    cedar_permits_required:
      - 'Action::"CompleteCustomerRenewal"'
    audit_event_class: CustomerRenewalCompleted
    slo_target: "By contract expiry"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Do not mark case complete until audit event is sealed."
    on_success: []
    on_failure:
      - edge_to_renewal_exception
  - id: renewal_exception_end
    type: end
    config:
      terminal_state: at_risk_or_lost
      output_contract: customer-renewal-exception.v1
    cedar_permits_required:
      - 'Action::"CloseCustomerRenewalException"'
    audit_event_class: CustomerRenewalExceptionClosed
    slo_target: "PT1H after terminal exception"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep manual owner task open."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_renewal_case
    from: renewal_window_start
    to: create_renewal_case
    name: renewal_window_open
  - id: edge_to_usage_review
    from: create_renewal_case
    to: usage_review
    name: case_created
  - id: edge_to_health_decision
    from: usage_review
    to: account_health_decision
    name: usage_review_ready
  - id: edge_to_prepare_pitch_parallel
    from: account_health_decision
    to: prepare_pitch_parallel
    name: health_decided
  - id: edge_to_commercial_terms
    from: prepare_pitch_parallel
    to: commercial_terms
    name: commercial_terms_branch
  - id: edge_to_stakeholder_map
    from: prepare_pitch_parallel
    to: stakeholder_map
    name: stakeholder_branch
  - id: edge_to_success_plan
    from: prepare_pitch_parallel
    to: success_plan
    name: success_plan_branch
  - id: edge_to_pitch_join
    from: prepare_pitch_parallel
    to: pitch_join
    name: pitch_join
  - id: edge_to_renewal_pitch
    from: pitch_join
    to: renewal_pitch
    name: pitch_ready
  - id: edge_to_customer_response_wait
    from: renewal_pitch
    to: customer_response_wait
    name: pitch_sent
  - id: edge_to_response_decision
    from: customer_response_wait
    to: response_decision
    name: customer_response_terminal
  - id: edge_to_contract_update
    from: response_decision
    to: contract_update
    name: accepted_or_reviewed
  - id: edge_to_legal_review
    from: response_decision
    to: legal_review
    name: legal_review_required
  - id: edge_to_invoice_generation
    from: contract_update
    to: invoice_generation
    name: signed_contract_ready
  - id: edge_to_payment_confirmation_wait
    from: invoice_generation
    to: payment_confirmation_wait
    name: invoice_issued
  - id: edge_to_payment_decision
    from: payment_confirmation_wait
    to: payment_decision
    name: payment_terminal
  - id: edge_to_renewal_completed
    from: payment_decision
    to: renewal_completed_end
    name: renewal_confirmed
  - id: edge_to_account_owner_review
    from: account_health_decision
    to: renewal_exception_end
    name: account_owner_review_required
  - id: edge_to_finance_review
    from: invoice_generation
    to: renewal_exception_end
    name: finance_review_required
  - id: edge_to_renewal_exception
    from: renewal_window_start
    to: renewal_exception_end
    name: unrecoverable_exception
  - id: edge_to_renewal_lost_end
    from: response_decision
    to: renewal_exception_end
    name: customer_declined
failure_modes:
  - code: CONTRACT_POLICY_DENIED
    behavior: "Stop contract mutation and expose denial to account owner."
  - code: BILLING_SIDE_EFFECT_DUPLICATE
    behavior: "Return existing invoice generated under the idempotency key."
  - code: CUSTOMER_NON_RESPONSE
    behavior: "Escalate without marking customer renewed."
worked_example:
  sample_input:
    tenant_id: tenant_acme
    customer_account_id: customer_globex
    contract_id: contract_2025_881
    renewal_term_months: 24
    expiry_date: "2026-08-31"
    account_owner_principal_id: principal_ae_77
    finance_owner_principal_id: principal_fin_12
    discount_ceiling_percent: 12
  sample_expected_output:
    renewal_case_id: renewal_2026_0042
    terminal_state: renewed
    signed_contract_id: contract_2026_992
    invoice_id: inv_2026_1001
    audit_chain_refs:
      - audit://workflow/customer-renewal/window-opened/01
      - audit://workflow/customer-renewal/contract-updated/02
      - audit://workflow/customer-renewal/payment-confirmed/03
