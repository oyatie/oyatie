---
doc_class: WorkflowTemplate
template_id: workflow-template.incident-response-workflow.v1
version: 1.0.0
owner: workflow-studio
related_oyatie_adrs:
  - ADR-0035-workflow-engine-state-machine-and-dag-hybrid
  - ADR-0114-canary-observability-rollback
  - ADR-0186-observability-backplane-layering
title: Incident response workflow
description: >-
  Coordinates SEV-N incident response from page through acknowledge, triage,
  mitigation, resolution, and postmortem closure with explicit incident command,
  rollback authority, audit evidence, and customer/status-page controls.
tags:
  - incident-response
  - observability
  - on-call
  - sev-management
  - postmortem
owner_microservice: workflow-studio
runtime_microservice: workflow-engine
template_shape: state_machine_plus_dag
capability_tier_bindings:
  - tier: gold
    reason: "Production incident operations require on-call, status, rollback, and evidence orchestration."
ontology_refs:
  object: IncidentCase
  actions:
    - PageCreated
    - IncidentAcknowledged
    - SeverityClassified
    - MitigationExecuted
    - IncidentResolved
    - PostmortemPublished
tenant_context:
  required_fields:
    - tenant_id
    - affected_service_id
    - incident_commander_principal_id
    - on_call_rotation_id
principal_context:
  system_principal: workflow-engine.incident-response
  human_approval_roles:
    - incident_commander
    - service_owner
    - communications_owner
data_classes:
  - INCIDENT_TELEMETRY
  - CUSTOMER_IMPACT_SUMMARY
  - RUNBOOK_ACTION
  - STATUS_PAGE_UPDATE
residency_pack_overlays:
  - pack: fedramp
    behavior: "Keep incident evidence in authorized region and require communications-owner review."
  - pack: hipaa
    behavior: "Mask PHI-bearing logs before any status or postmortem export."
observability:
  metrics:
    - incident_ack_latency_seconds
    - incident_mitigate_latency_seconds
    - incident_status_update_total
  traces:
    - workflow.template.incident_response
  logs:
    - workflow_incident_response_audit_projection
cost_allocation:
  unit: incident_workflow_step
  dimensions:
    - tenant_id
    - affected_service_id
    - severity
idempotency:
  key_shape: "tenant_id:incident_id:template_version:node_id"
  duplicate_policy: return_existing_node_result
cancellation_behavior:
  allowed_until_node: severity_decision
  on_cancel: close_duplicate_page_and_link_primary_incident
  audit_event_class: IncidentWorkflowCancelled
replay_behavior:
  replay_safe: true
  event_history_source: workflow-engine
  side_effect_replay_policy: skip_completed_status_and_rollback_actions
inputs:
  tenant_id:
    type: string
    default: tenant_demo
  incident_id:
    type: string
    default: inc_001
  affected_service_id:
    type: string
    default: workflow-engine
  initial_severity:
    type: string
    default: sev3
  on_call_rotation_id:
    type: string
    default: rotation_primary
  incident_commander_principal_id:
    type: string
    default: principal_ic_001
  customer_impact_detected:
    type: boolean
    default: false
outputs:
  incident_id:
    type: string
  terminal_state:
    type: string
  final_severity:
    type: string
  mitigation_action_refs:
    type: array
    items: string
  audit_chain_refs:
    type: array
    items: string
nodes:
  - id: page_start
    type: start
    config:
      trigger: observability.alert.fired.v1
      validates:
        - tenant_id
        - incident_id
        - affected_service_id
    cedar_permits_required:
      - 'Action::"StartIncidentWorkflow"'
    audit_event_class: IncidentWorkflowStarted
    slo_target: "PT1M after alert fire"
    timeout:
      duration: PT2M
      on_timeout: page_start_retry
    retry:
      max_attempts: 2
      backoff: PT30S
      retryable_errors:
        - ALERT_EVENT_LAG
    failure_modes:
      - code: DUPLICATE_INCIDENT
        behavior: "Link to primary incident and close duplicate workflow."
    on_success:
      - edge_to_create_incident_case
    on_failure:
      - edge_to_exception_end
  - id: create_incident_case
    type: action
    config:
      service: incident-management
      contract: incident-case.v1
      method: POST
      url: "https://incident.internal/v1/incidents"
      body:
        incident_id: "${inputs.incident_id}"
        service_id: "${inputs.affected_service_id}"
        initial_severity: "${inputs.initial_severity}"
    cedar_permits_required:
      - 'Action::"CreateIncidentCase"'
    audit_event_class: IncidentCaseCreated
    slo_target: "PT3M"
    timeout:
      duration: PT2M
      on_timeout: incident_case_retry
    retry:
      max_attempts: 3
      backoff: PT30S
      retryable_errors:
        - INCIDENT_CASE_WRITE_TIMEOUT
    failure_modes:
      - code: INCIDENT_CASE_EXISTS
        behavior: "Continue with existing incident case."
    on_success:
      - edge_to_page_on_call
    on_failure:
      - edge_to_exception_end
  - id: page_on_call
    type: action
    config:
      service: on-call
      contract: page-on-call.v1
      method: POST
      url: "https://oncall.internal/v1/pages"
      body:
        rotation_id: "${inputs.on_call_rotation_id}"
        incident_id: "${inputs.incident_id}"
        severity: "${inputs.initial_severity}"
    cedar_permits_required:
      - 'Action::"PageOnCallResponder"'
    audit_event_class: IncidentResponderPaged
    slo_target: "PT2M"
    timeout:
      duration: PT1M
      on_timeout: secondary_page
    retry:
      max_attempts: 3
      backoff: PT30S
      retryable_errors:
        - PAGE_PROVIDER_TIMEOUT
    failure_modes:
      - code: PRIMARY_ROTATION_EMPTY
        behavior: "Escalate to secondary rotation and incident commander."
    on_success:
      - edge_to_acknowledgement_wait
    on_failure:
      - edge_to_escalate_page
  - id: acknowledgement_wait
    type: loop
    config:
      poll_contract: incident-ack-status.v1
      poll_interval: PT1M
      max_elapsed: PT15M
      terminal_statuses:
        - acknowledged
        - escalated
    cedar_permits_required:
      - 'Action::"ReadIncidentAcknowledgement"'
    audit_event_class: IncidentAcknowledgementPolled
    slo_target: "PT15M for SEV3, PT5M for SEV1"
    timeout:
      duration: PT15M
      on_timeout: escalate_page
    retry:
      max_attempts: 15
      backoff: PT1M
      retryable_errors:
        - ACK_NOT_READY
    failure_modes:
      - code: ACK_TIMEOUT
        behavior: "Escalate to backup responder and service owner."
    on_success:
      - edge_to_ack_decision
    on_failure:
      - edge_to_escalate_page
  - id: ack_decision
    type: decision
    config:
      expression: "${nodes.acknowledgement_wait.output.status}"
      cases:
        acknowledged: triage_parallel
        escalated: triage_parallel
    cedar_permits_required:
      - 'Action::"DecideIncidentAcknowledgement"'
    audit_event_class: IncidentAcknowledgementDecided
    slo_target: "PT1M after ack status"
    timeout:
      duration: PT2M
      on_timeout: escalate_page
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: ACK_STATUS_UNKNOWN
        behavior: "Keep paging path open and notify incident commander."
    on_success:
      - edge_to_triage_parallel
    on_failure:
      - edge_to_escalate_page
  - id: triage_parallel
    type: parallel
    config:
      fan_out_limit: 4
      join_semantics: all_success_required
      branches:
        - collect_telemetry
        - classify_severity
        - identify_customer_impact
        - assign_incident_roles
    cedar_permits_required:
      - 'Action::"RunIncidentTriageFanout"'
    audit_event_class: IncidentTriageStarted
    slo_target: "PT10M after acknowledgement"
    timeout:
      duration: PT10M
      on_timeout: triage_manual_command
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: TRIAGE_BRANCH_FAILED
        behavior: "Incident commander receives incomplete branch list."
    on_success:
      - edge_to_collect_telemetry
      - edge_to_classify_severity
      - edge_to_identify_impact
      - edge_to_assign_roles
    on_failure:
      - edge_to_exception_end
  - id: collect_telemetry
    type: action
    config:
      service: observability
      contract: incident-telemetry-snapshot.v1
      method: POST
      url: "https://observability.internal/v1/incident-snapshots"
      body:
        incident_id: "${inputs.incident_id}"
        service_id: "${inputs.affected_service_id}"
        redact_sensitive_logs: true
    cedar_permits_required:
      - 'Action::"CollectIncidentTelemetry"'
    audit_event_class: IncidentTelemetrySnapshotCreated
    slo_target: "PT5M"
    timeout:
      duration: PT3M
      on_timeout: telemetry_snapshot_retry
    retry:
      max_attempts: 3
      backoff: PT1M
      retryable_errors:
        - TELEMETRY_BACKEND_TIMEOUT
    failure_modes:
      - code: TELEMETRY_STALE
        behavior: "Mark stale telemetry and require commander acknowledgement."
    on_success:
      - edge_to_triage_join
    on_failure:
      - edge_to_exception_end
  - id: classify_severity
    type: action
    config:
      service: incident-management
      contract: severity-classification.v1
      method: POST
      url: "https://incident.internal/v1/severity"
      body:
        incident_id: "${inputs.incident_id}"
        initial_severity: "${inputs.initial_severity}"
    cedar_permits_required:
      - 'Action::"ClassifyIncidentSeverity"'
    audit_event_class: IncidentSeverityClassified
    slo_target: "PT5M"
    timeout:
      duration: PT3M
      on_timeout: severity_manual_review
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - SEVERITY_RULE_TIMEOUT
    failure_modes:
      - code: SEVERITY_CONFLICT
        behavior: "Incident commander picks final severity; audit both values."
    on_success:
      - edge_to_triage_join
    on_failure:
      - edge_to_exception_end
  - id: identify_customer_impact
    type: action
    config:
      service: customer-impact
      contract: customer-impact-assessment.v1
      method: POST
      url: "https://customer-impact.internal/v1/assessments"
      body:
        incident_id: "${inputs.incident_id}"
        service_id: "${inputs.affected_service_id}"
    cedar_permits_required:
      - 'Action::"AssessCustomerImpact"'
    audit_event_class: IncidentCustomerImpactAssessed
    slo_target: "PT10M"
    timeout:
      duration: PT5M
      on_timeout: customer_impact_retry
    retry:
      max_attempts: 3
      backoff: PT2M
      retryable_errors:
        - IMPACT_QUERY_TIMEOUT
    failure_modes:
      - code: CUSTOMER_IMPACT_UNKNOWN
        behavior: "Default to conservative customer-impact communication path."
    on_success:
      - edge_to_triage_join
    on_failure:
      - edge_to_exception_end
  - id: assign_incident_roles
    type: action
    config:
      service: incident-management
      contract: incident-role-assignment.v1
      method: POST
      url: "https://incident.internal/v1/roles"
      body:
        incident_id: "${inputs.incident_id}"
        incident_commander_principal_id: "${inputs.incident_commander_principal_id}"
    cedar_permits_required:
      - 'Action::"AssignIncidentRoles"'
    audit_event_class: IncidentRolesAssigned
    slo_target: "PT10M"
    timeout:
      duration: PT3M
      on_timeout: role_assignment_retry
    retry:
      max_attempts: 3
      backoff: PT1M
      retryable_errors:
        - ROLE_ASSIGNMENT_TIMEOUT
    failure_modes:
      - code: COMMANDER_UNAVAILABLE
        behavior: "Escalate to service owner as commander."
    on_success:
      - edge_to_triage_join
    on_failure:
      - edge_to_exception_end
  - id: triage_join
    type: decision
    config:
      expression: "${parallel.triage_parallel.all_branches_succeeded}"
      cases:
        "true": severity_decision
        "false": exception_end
    cedar_permits_required:
      - 'Action::"EvaluateIncidentTriage"'
    audit_event_class: IncidentTriageCompleted
    slo_target: "PT15M after acknowledgement"
    timeout:
      duration: PT2M
      on_timeout: command_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: TRIAGE_INCOMPLETE
        behavior: "Block mitigation automation until commander review."
    on_success:
      - edge_to_severity_decision
    on_failure:
      - edge_to_exception_end
  - id: severity_decision
    type: decision
    config:
      expression: "${nodes.classify_severity.output.final_severity}"
      cases:
        sev1: customer_status_update
        sev2: customer_status_update
        sev3: mitigation_action
        sev4: mitigation_action
    cedar_permits_required:
      - 'Action::"DecideIncidentSeverityPath"'
    audit_event_class: IncidentSeverityPathDecided
    slo_target: "PT1M after triage"
    timeout:
      duration: PT2M
      on_timeout: command_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: UNSUPPORTED_SEVERITY
        behavior: "Route to incident commander."
    on_success:
      - edge_to_status_update
      - edge_to_mitigation_action
    on_failure:
      - edge_to_exception_end
  - id: customer_status_update
    type: action
    config:
      service: status-page
      contract: incident-status-update.v1
      method: POST
      url: "https://status.internal/v1/updates"
      body:
        incident_id: "${inputs.incident_id}"
        customer_impact_ref: "${nodes.identify_customer_impact.output.impact_ref}"
        severity: "${nodes.classify_severity.output.final_severity}"
    cedar_permits_required:
      - 'Action::"PublishIncidentStatusUpdate"'
    audit_event_class: IncidentStatusUpdatePublished
    slo_target: "PT30M for SEV1, PT60M for SEV2"
    timeout:
      duration: PT5M
      on_timeout: status_update_retry
    retry:
      max_attempts: 3
      backoff: PT2M
      retryable_errors:
        - STATUS_PAGE_TIMEOUT
    failure_modes:
      - code: CUSTOMER_COPY_REVIEW_DENIED
        behavior: "Hold status update and notify communications owner."
    on_success:
      - edge_to_mitigation_action
    on_failure:
      - edge_to_exception_end
  - id: mitigation_action
    type: action
    config:
      service: deployment-ops
      contract: mitigation-action.v1
      method: POST
      url: "https://ops.internal/v1/mitigations"
      body:
        incident_id: "${inputs.incident_id}"
        service_id: "${inputs.affected_service_id}"
        allowed_actions:
          - rollback
          - feature_flag_disable
          - traffic_shift
    cedar_permits_required:
      - 'Action::"ExecuteIncidentMitigation"'
      - 'Action::"RequestRollbackOrTrafficShift"'
    audit_event_class: IncidentMitigationExecuted
    slo_target: "PT30M for SEV1, PT2H for SEV2"
    timeout:
      duration: PT20M
      on_timeout: mitigation_command_review
    retry:
      max_attempts: 2
      backoff: PT5M
      retryable_errors:
        - MITIGATION_API_TIMEOUT
    failure_modes:
      - code: ROLLBACK_POLICY_DENIED
        behavior: "Require service owner approval; do not run manual SSH path."
    on_success:
      - edge_to_resolution_wait
    on_failure:
      - edge_to_exception_end
  - id: resolution_wait
    type: loop
    config:
      poll_contract: incident-health-status.v1
      poll_interval: PT5M
      max_elapsed: PT4H
      terminal_statuses:
        - healthy
        - still_degraded
    cedar_permits_required:
      - 'Action::"ReadIncidentHealthStatus"'
    audit_event_class: IncidentHealthStatusPolled
    slo_target: "PT4H"
    timeout:
      duration: PT4H
      on_timeout: unresolved_escalation
    retry:
      max_attempts: 48
      backoff: PT5M
      retryable_errors:
        - HEALTH_NOT_READY
    failure_modes:
      - code: MITIGATION_INEFFECTIVE
        behavior: "Escalate to commander for next mitigation."
    on_success:
      - edge_to_resolution_decision
    on_failure:
      - edge_to_exception_end
  - id: resolution_decision
    type: decision
    config:
      expression: "${nodes.resolution_wait.output.status}"
      cases:
        healthy: resolve_incident
        still_degraded: mitigation_action
    cedar_permits_required:
      - 'Action::"DecideIncidentResolution"'
    audit_event_class: IncidentResolutionDecided
    slo_target: "PT5M after health terminal status"
    timeout:
      duration: PT10M
      on_timeout: command_review
    retry:
      max_attempts: 1
      backoff: PT0S
      retryable_errors: []
    failure_modes:
      - code: HEALTH_STATUS_UNKNOWN
        behavior: "Keep incident open."
    on_success:
      - edge_to_resolve_incident
      - edge_to_mitigation_action
    on_failure:
      - edge_to_exception_end
  - id: resolve_incident
    type: action
    config:
      service: incident-management
      contract: incident-resolve.v1
      method: POST
      url: "https://incident.internal/v1/resolve"
      body:
        incident_id: "${inputs.incident_id}"
        final_severity: "${nodes.classify_severity.output.final_severity}"
        mitigation_refs: "${nodes.mitigation_action.output.action_refs}"
    cedar_permits_required:
      - 'Action::"ResolveIncident"'
    audit_event_class: IncidentResolved
    slo_target: "PT15M after healthy"
    timeout:
      duration: PT5M
      on_timeout: resolve_retry
    retry:
      max_attempts: 3
      backoff: PT2M
      retryable_errors:
        - INCIDENT_RESOLVE_TIMEOUT
    failure_modes:
      - code: RESOLUTION_EVIDENCE_MISSING
        behavior: "Do not close incident until mitigation refs are present."
    on_success:
      - edge_to_postmortem_task
    on_failure:
      - edge_to_exception_end
  - id: postmortem_task
    type: action
    config:
      service: tasks
      contract: postmortem-task.v1
      method: POST
      url: "https://tasks.internal/v1/postmortems"
      body:
        incident_id: "${inputs.incident_id}"
        due_in: P5D
        owner_principal_id: "${inputs.incident_commander_principal_id}"
    cedar_permits_required:
      - 'Action::"CreateIncidentPostmortemTask"'
    audit_event_class: IncidentPostmortemTaskCreated
    slo_target: "PT1H after resolution"
    timeout:
      duration: PT10M
      on_timeout: postmortem_task_retry
    retry:
      max_attempts: 3
      backoff: PT5M
      retryable_errors:
        - TASK_WRITE_TIMEOUT
    failure_modes:
      - code: POSTMORTEM_OWNER_MISSING
        behavior: "Assign service owner fallback."
    on_success:
      - edge_to_postmortem_wait
    on_failure:
      - edge_to_exception_end
  - id: postmortem_wait
    type: loop
    config:
      poll_contract: postmortem-status.v1
      poll_interval: P1D
      max_elapsed: P14D
      terminal_statuses:
        - published
        - waived
    cedar_permits_required:
      - 'Action::"ReadPostmortemStatus"'
    audit_event_class: IncidentPostmortemStatusPolled
    slo_target: "P14D after incident resolution"
    timeout:
      duration: P14D
      on_timeout: postmortem_overdue_escalation
    retry:
      max_attempts: 14
      backoff: P1D
      retryable_errors:
        - POSTMORTEM_NOT_READY
    failure_modes:
      - code: POSTMORTEM_OVERDUE
        behavior: "Escalate to engineering leadership."
    on_success:
      - edge_to_complete_end
    on_failure:
      - edge_to_exception_end
  - id: complete_end
    type: end
    config:
      terminal_state: completed
      output_contract: incident-response-result.v1
    cedar_permits_required:
      - 'Action::"CompleteIncidentWorkflow"'
    audit_event_class: IncidentWorkflowCompleted
    slo_target: "P14D after resolution"
    timeout:
      duration: PT5M
      on_timeout: completion_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: COMPLETION_AUDIT_FAILED
        behavior: "Keep workflow open until audit row seals."
    on_success: []
    on_failure:
      - edge_to_exception_end
  - id: exception_end
    type: end
    config:
      terminal_state: manual_recovery_required
      output_contract: incident-response-exception.v1
    cedar_permits_required:
      - 'Action::"CloseIncidentWorkflowException"'
    audit_event_class: IncidentWorkflowExceptionClosed
    slo_target: "PT15M after unrecoverable exception"
    timeout:
      duration: PT5M
      on_timeout: exception_retry
    retry:
      max_attempts: 2
      backoff: PT1M
      retryable_errors:
        - AUDIT_CHAIN_APPEND_TIMEOUT
    failure_modes:
      - code: EXCEPTION_AUDIT_FAILED
        behavior: "Keep commander task open."
    on_success: []
    on_failure: []
edges:
  - id: edge_to_create_incident_case
    from: page_start
    to: create_incident_case
    name: page_valid
  - id: edge_to_page_on_call
    from: create_incident_case
    to: page_on_call
    name: incident_case_created
  - id: edge_to_acknowledgement_wait
    from: page_on_call
    to: acknowledgement_wait
    name: responder_paged
  - id: edge_to_ack_decision
    from: acknowledgement_wait
    to: ack_decision
    name: ack_terminal
  - id: edge_to_triage_parallel
    from: ack_decision
    to: triage_parallel
    name: incident_acknowledged
  - id: edge_to_collect_telemetry
    from: triage_parallel
    to: collect_telemetry
    name: telemetry_branch
  - id: edge_to_classify_severity
    from: triage_parallel
    to: classify_severity
    name: severity_branch
  - id: edge_to_identify_impact
    from: triage_parallel
    to: identify_customer_impact
    name: impact_branch
  - id: edge_to_assign_roles
    from: triage_parallel
    to: assign_incident_roles
    name: roles_branch
  - id: edge_to_triage_join
    from: triage_parallel
    to: triage_join
    name: triage_join
  - id: edge_to_severity_decision
    from: triage_join
    to: severity_decision
    name: triage_complete
  - id: edge_to_status_update
    from: severity_decision
    to: customer_status_update
    name: customer_update_required
  - id: edge_to_mitigation_action
    from: severity_decision
    to: mitigation_action
    name: mitigation_required
  - id: edge_to_resolution_wait
    from: mitigation_action
    to: resolution_wait
    name: mitigation_executed
  - id: edge_to_resolution_decision
    from: resolution_wait
    to: resolution_decision
    name: health_terminal
  - id: edge_to_resolve_incident
    from: resolution_decision
    to: resolve_incident
    name: service_healthy
  - id: edge_to_postmortem_task
    from: resolve_incident
    to: postmortem_task
    name: incident_resolved
  - id: edge_to_postmortem_wait
    from: postmortem_task
    to: postmortem_wait
    name: postmortem_task_created
  - id: edge_to_complete_end
    from: postmortem_wait
    to: complete_end
    name: postmortem_done
  - id: edge_to_escalate_page
    from: acknowledgement_wait
    to: exception_end
    name: page_escalation_failed
  - id: edge_to_exception_end
    from: page_start
    to: exception_end
    name: exception
failure_modes:
  - code: POLICY_DENIED
    behavior: "Do not run mitigation or customer update; record Cedar denial."
