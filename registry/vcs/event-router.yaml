# registry/vcs/event-router.yaml
#
# Retired historical evidence only. These rows document the former
# agentic-VCS event-router shape so old evidence and decisions can replay
# provenance. They are not active routing, merge, CI, or agent-dispatch
# authority.
#
# Current native SCM/CI direction is Rust services/libraries, Buck2 targets,
# Prow-shaped Kubernetes jobs, and Git/GitHub adapters as compatibility seams.
# See /specs/gitops-vcs-replacement.json, /specs/masterplan.json, and
# /specs/oya-ci-prow-capability-parity.json.
#
# Operational rules:
# - Do not add rows.
# - Do not wire new readers to this file.
# - Do not treat the historical agent names below as executable surfaces.
#
# Historical row shape:
#   rows:
#     - event:      <X-GitHub-Event header value>
#       action:     <payload "action" field, or "" for wildcard>
#       conclusion: <optional payload "workflow_run.conclusion" or
#                    "check_suite.conclusion" discriminator; omit or
#                    set to "" to match any conclusion>
#       agent:      <historical foundry-agent or workflow name>
#       purpose:    <one-line description, audit-friendly>
#
# Historical lookup precedence inside the deleted kernel:
#   1. exact (event, action, conclusion)
#   2. exact (event, action) with no conclusion declared (wildcard)
#   3. exact (event) with empty action (event-level wildcard)
# The most-specific match always wins.

rows:
  - event: pull_request
    action: opened
    agent: oya-foundry-vcs-orchestrator-app
    purpose: Begin changeset state transition to pr_open

  - event: pull_request
    action: synchronize
    agent: oya-vcs-merge-queue-fix-loop-app + oya-vcs-ci-fix-loop-dispatcher-app
    purpose: Fix-at-any-stage re-validate (ADR-0111)

  - event: pull_request
    action: closed
    agent: oya-foundry-vcs-orchestrator-app
    purpose: If merged=true, transition to merged_dev

  # ADR-0112 §"Event-router table" rows 4-5: workflow_run/completed is
  # split by `conclusion`. v1 router honors the conclusion discriminator
  # so each row still resolves to exactly one agent per ADR-0112 §"Open
  # questions" #2. If a workflow_run delivery arrives with a conclusion
  # other than success/failure (e.g. cancelled, timed_out, skipped),
  # the lookup falls through to RoutingFailed and the
  # oya-governance-event-router-completeness lane (wave-C) alerts.
  - event: workflow_run
    action: completed
    conclusion: success
    agent: oya-intelligence-pr-review-dispatcher-app
    purpose: Run multispectrum review (IP-004)

  - event: workflow_run
    action: completed
    conclusion: failure
    agent: oya-vcs-ci-fix-loop-dispatcher-app
    purpose: Run fix-loop with retry budget (IP-005)

  - event: check_suite
    action: completed
    agent: oya-vcs-merge-queue-fix-loop-app
    purpose: Re-evaluate queue (some checks landed)

  - event: push
    action: ""
    agent: oya-vcs-promotion-controller-kernel
    purpose: Trigger promotion workflow (dev->staging->production)

  - event: pull_request_review
    action: submitted
    agent: oya-foundry-vcs-orchestrator-app
    purpose: Update changeset state if human override
