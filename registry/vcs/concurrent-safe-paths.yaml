# registry/vcs/concurrent-safe-paths.yaml
#
# Per-product whitelist of paths considered "concurrent-safe" for the
# merge-queue's path-overlap invariant (ADR-0111 invariant 2).
#
# Default is empty per ADR-0111 §"Open questions" decision-2: v0 ships
# strict (any overlap = refuse admission). Wave-D adds entries for
# files where concurrent edits are routinely safe to land (the
# canonical example is `docs/CHANGELOG.md`).
#
# Schema:
#   products:
#     <product-name>:
#       safe_paths:
#         - <repo-relative path string>
#
# Loader: tools/oya-vcs-merge-queue-fix-loop-app/src/
#         projected_merge_state.rs (concurrent_safe_paths_for_product).
#
# Schema version pinned for lane parity with
# `oya-governance-merge-queue-ref-hygiene`.
schema_version: 1

# Swarm Delivery Law (ADR-0711): append-only / per-lane surfaces that must not
# refuse concurrent admission. Referenced from specs/integ-branch-envelopes.json
# #concurrent_safe_exemptions. These exemptions do NOT authorize envelope escape
# for product code.
products:
  oyatie:
    safe_paths:
      - .beads/**
      # Per-lane paths ONLY (fix-1644-codex). The former evidence/ci/** and
      # .grok/programs/*/evidence/** rows also exempted FIXED shared outputs
      # (evidence/ci/slsa/slsa-provenance.predicate.json, trivy-summary.txt,
      # .grok/programs/cas-fabric/evidence/parallel-monitor-status.json,
      # PORTABLE-SWARM-CONTRACT.md) — two waves could pass overlap admission
      # while editing the SAME shared file. Distinct per-lane filenames never
      # overlap and need no exemption; same-path shared/latest/snapshot/
      # contract/generated outputs stay contested. Grow this list back only
      # with NARROW named rows.
      - evidence/lanes/**
      - evidence/**/lane-*/
