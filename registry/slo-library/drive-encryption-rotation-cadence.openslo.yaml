apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-drive-cmk-rotation-cadence
  displayName: "Drive Encryption CMK Rotation Cadence"
  labels:
    library: slo-authoring
    catalog_template: drive-encryption-rotation-cadence
    microservice: drive
    bounded_context: tenant-storage-security
    sli: key-rotation-cadence
    data_classes:
      - customer-managed-key
      - tenant-file-metadata
      - encryption-attestation
    pack: storage-security
    tier: control-plane
    capability_tiers:
      - Gold
      - Platinum
    plane: control
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Per-tenant customer-managed-key rotation cadence template for drive."
    oyatie.dev/source-spec: "specs/tenant-model.json"
    oyatie.dev/time-window-mode: "calendar"
    oyatie.dev/dashboard-template: "registry/dashboards/drive-cmk-rotation-cadence.yaml"
    oyatie.dev/runbook-template: "microservices/drive/runbooks/cmk-rotation-overdue.md"
spec:
  service: drive
  description: |
    Calendar-quarter SLO for tenant CMK rotation cadence. It measures planned
    rotation completion, evidence emission, envelope rewrap progress, stale-key
    prevention, and break-glass exception closure for encrypted drive content.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Gold
        rotationCadence: 90d
        maxRewrapLag: 24h
      - name: Platinum
        rotationCadence: 30d
        maxRewrapLag: 4h
    rejectionRule: "Promotion is held when overdue CMK rotation or rewrap lag burns the storage security budget."
  indicator:
    metadata:
      name: gold-cmk-rotation-on-time
      displayName: "Gold CMK rotation on time"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: drive-gold-cmk-rotation-good
              query: |
                sum(rate(oya_drive_cmk_rotation_total{
                  service="drive",
                  capability_tier="Gold",
                  result="completed_on_time"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: drive-gold-cmk-rotation-total
              query: |
                sum(rate(oya_drive_cmk_rotation_total{
                  service="drive",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 1Q
      calendar:
        startTime: "2026-04-01 00:00:00"
        timeZone: UTC
      isRolling: false
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Gold CMK rotation completed every 90d"
      name: gold-cmk-rotation-on-time
      targetName: gold-cmk-rotation-target
      target: 0.999
      windowName: calendar-quarter
      description: "Gold tenant customer-managed keys complete scheduled rotation within ninety days."
      indicator:
        metadata:
          name: drive-gold-cmk-rotation
          displayName: "Gold CMK rotation"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-gold-cmk-rotation-good
                  query: |
                    sum(rate(oya_drive_cmk_rotation_total{service="drive",capability_tier="Gold",result="completed_on_time"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-gold-cmk-rotation-total
                  query: |
                    sum(rate(oya_drive_cmk_rotation_total{service="drive",capability_tier="Gold"}[5m]))
    - displayName: "Platinum CMK rotation completed every 30d"
      name: platinum-cmk-rotation-on-time
      targetName: platinum-cmk-rotation-target
      target: 0.999
      windowName: calendar-quarter
      description: "Platinum tenant customer-managed keys complete scheduled rotation within thirty days."
      indicator:
        metadata:
          name: drive-platinum-cmk-rotation
          displayName: "Platinum CMK rotation"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-platinum-cmk-rotation-good
                  query: |
                    sum(rate(oya_drive_cmk_rotation_total{service="drive",capability_tier="Platinum",result="completed_on_time"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-platinum-cmk-rotation-total
                  query: |
                    sum(rate(oya_drive_cmk_rotation_total{service="drive",capability_tier="Platinum"}[5m]))
    - displayName: "Gold envelope rewrap <= 24h"
      name: gold-envelope-rewrap-under-24h
      targetName: gold-rewrap-target
      target: 0.999
      windowName: calendar-quarter
      description: "Gold encrypted objects are rewrapped under the rotated key within twenty-four hours."
      indicator:
        metadata:
          name: drive-gold-rewrap-under-24h
          displayName: "Gold envelope rewrap"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-gold-rewrap-good
                  query: |
                    sum(rate(oya_drive_envelope_rewrap_seconds_bucket{service="drive",capability_tier="Gold",le="86400"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-gold-rewrap-total
                  query: |
                    sum(rate(oya_drive_envelope_rewrap_seconds_count{service="drive",capability_tier="Gold"}[5m]))
    - displayName: "Platinum envelope rewrap <= 4h"
      name: platinum-envelope-rewrap-under-4h
      targetName: platinum-rewrap-target
      target: 0.999
      windowName: calendar-quarter
      description: "Platinum encrypted objects are rewrapped under the rotated key within four hours."
      indicator:
        metadata:
          name: drive-platinum-rewrap-under-4h
          displayName: "Platinum envelope rewrap"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-platinum-rewrap-good
                  query: |
                    sum(rate(oya_drive_envelope_rewrap_seconds_bucket{service="drive",capability_tier="Platinum",le="14400"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-platinum-rewrap-total
                  query: |
                    sum(rate(oya_drive_envelope_rewrap_seconds_count{service="drive",capability_tier="Platinum"}[5m]))
    - displayName: "Rotation attestation emitted"
      name: rotation-attestation-emitted
      targetName: rotation-attestation-target
      target: 0.9999
      windowName: calendar-quarter
      description: "Each completed key rotation emits audit-chain attestation with tenant, key version, and actor."
      indicator:
        metadata:
          name: drive-rotation-attestation
          displayName: "Rotation attestation"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-attestation-good
                  query: |
                    sum(rate(oya_drive_cmk_rotation_attestation_total{service="drive",result="emitted"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: drive-attestation-total
                  query: |
                    sum(rate(oya_drive_cmk_rotation_attestation_total{service="drive"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
