apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-cross-tenant-message-delivery
  displayName: "Cross-Tenant MLS Message Delivery"
  labels:
    library: slo-authoring
    catalog_template: cross-tenant-message-delivery
    microservice: messenger
    bounded_context: secure-messaging
    sli: delivery
    data_classes:
      - message-envelope
      - mls-key-package
      - tenant-routing-metadata
    pack: secure-collaboration
    tier: data-plane
    capability_tiers:
      - Silver
      - Gold
      - Platinum
    plane: data
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    standard:
      - RFC-9420
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "MLS RFC 9420 cross-tenant delivery and decryptability SLO template."
    oyatie.dev/source-standard: "docs/standards/messenger-e2e-encryption-mls.md"
    oyatie.dev/time-window-mode: "rolling"
    oyatie.dev/dashboard-template: "registry/dashboards/mls-key-delivery-health.yaml"
    oyatie.dev/runbook-template: "microservices/messenger/runbooks/cross-tenant-mls-delivery.md"
spec:
  service: messenger
  description: |
    SLO for cross-tenant message delivery when MLS group state, tenancy policy,
    cell routing, and audit emission all participate. The SLO measures delivery,
    decryptability, key-package availability, and replay-safe ordering for
    tenant-to-tenant collaboration workflows.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Silver
        deliveryWithin: 2s
        decryptabilityTarget: 0.999
      - name: Gold
        deliveryWithin: 1s
        decryptabilityTarget: 0.9995
      - name: Platinum
        deliveryWithin: 500ms
        decryptabilityTarget: 0.9999
    rejectionRule: "Promotion is held when cross-tenant MLS delivery or decryptability burns budget."
  indicator:
    metadata:
      name: gold-cross-tenant-delivery-under-1s
      displayName: "Gold cross-tenant delivery under 1s"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: mls-gold-delivery-good
              query: |
                sum(rate(oya_mls_cross_tenant_delivery_seconds_bucket{
                  service="messenger",
                  capability_tier="Gold",
                  le="1"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: mls-gold-delivery-total
              query: |
                sum(rate(oya_mls_cross_tenant_delivery_seconds_count{
                  service="messenger",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Silver delivery <= 2s"
      name: silver-cross-tenant-delivery-under-2s
      targetName: silver-delivery-target
      target: 0.999
      windowName: rolling-30d
      description: "Silver cross-tenant MLS messages are delivered within two seconds."
      indicator:
        metadata:
          name: mls-silver-delivery-under-2s
          displayName: "Silver MLS delivery"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-silver-delivery-good
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_bucket{service="messenger",capability_tier="Silver",le="2"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-silver-delivery-total
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_count{service="messenger",capability_tier="Silver"}[5m]))
    - displayName: "Gold delivery <= 1s"
      name: gold-cross-tenant-delivery-under-1s
      targetName: gold-delivery-target
      target: 0.9995
      windowName: rolling-30d
      description: "Gold cross-tenant MLS messages are delivered within one second."
      indicator:
        metadata:
          name: mls-gold-delivery-under-1s
          displayName: "Gold MLS delivery"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-gold-delivery-good
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_bucket{service="messenger",capability_tier="Gold",le="1"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-gold-delivery-total
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_count{service="messenger",capability_tier="Gold"}[5m]))
    - displayName: "Platinum delivery <= 500ms"
      name: platinum-cross-tenant-delivery-under-500ms
      targetName: platinum-delivery-target
      target: 0.9995
      windowName: rolling-30d
      description: "Platinum cross-tenant MLS messages are delivered within five hundred milliseconds."
      indicator:
        metadata:
          name: mls-platinum-delivery-under-500ms
          displayName: "Platinum MLS delivery"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-platinum-delivery-good
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_bucket{service="messenger",capability_tier="Platinum",le="0.5"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-platinum-delivery-total
                  query: |
                    sum(rate(oya_mls_cross_tenant_delivery_seconds_count{service="messenger",capability_tier="Platinum"}[5m]))
    - displayName: "MLS decryptability success"
      name: mls-decryptability-success
      targetName: mls-decryptability-target
      target: 0.9999
      windowName: rolling-30d
      description: "Delivered cross-tenant envelopes decrypt successfully with the expected MLS epoch."
      indicator:
        metadata:
          name: mls-decryptability-ratio
          displayName: "MLS decryptability ratio"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-decrypt-good
                  query: |
                    sum(rate(oya_mls_decrypt_attempts_total{service="messenger",scope="cross_tenant",result="success"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-decrypt-total
                  query: |
                    sum(rate(oya_mls_decrypt_attempts_total{service="messenger",scope="cross_tenant"}[5m]))
    - displayName: "MLS key package availability"
      name: mls-key-package-availability
      targetName: mls-key-package-target
      target: 0.9995
      windowName: rolling-30d
      description: "Cross-tenant delivery can obtain fresh MLS key packages without retry exhaustion."
      indicator:
        metadata:
          name: mls-key-package-availability-ratio
          displayName: "MLS key package availability"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-key-package-good
                  query: |
                    sum(rate(oya_mls_key_package_resolution_total{service="messenger",result="available"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: mls-key-package-total
                  query: |
                    sum(rate(oya_mls_key_package_resolution_total{service="messenger"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
