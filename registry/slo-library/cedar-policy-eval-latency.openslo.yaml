apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-cedar-eval-latency
  displayName: "Cedar Policy Evaluation Latency"
  labels:
    library: slo-authoring
    catalog_template: cedar-policy-eval-latency
    microservice: policy-engine
    bounded_context: authorization
    sli: latency
    data_classes:
      - authorization-decision
      - tenant-policy-metadata
    pack: regulated-access-control
    tier: control-plane
    capability_tiers:
      - Gold
      - Platinum
    plane: control
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Gold and Platinum Cedar authorization hot-path latency authoring template."
    oyatie.dev/source-spec: "specs/agentic-slo-gated-promotion.json"
    oyatie.dev/performance-budget: "docs/performance-budgets/cedar-hot-path-1ms-p99.md"
    oyatie.dev/time-window-mode: "rolling"
    oyatie.dev/runbook-template: "microservices/policy-engine/runbooks/cedar-eval-latency-regression.md"
    oyatie.dev/dashboard-template: "registry/dashboards/cedar-policy-evaluation-latency.yaml"
spec:
  service: policy-engine
  description: |
    Canonical SLO for Cedar policy evaluation latency on the authorization
    hot path. Gold tenants must keep p99 policy evaluations at or below 5ms.
    Platinum tenants must keep p99 policy evaluations at or below 1ms. The
    objectives use latency-under-budget ratio metrics so burn-rate evaluation
    composes with ADR-0139 promotion gates.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Gold
        maxP99Latency: 5ms
        route: policy-engine.authorize
      - name: Platinum
        maxP99Latency: 1ms
        route: policy-engine.authorize
    rejectionRule: "Promotion is held when either tier burns its evaluation latency budget."
  indicator:
    metadata:
      name: cedar-gold-eval-under-5ms
      displayName: "Cedar Gold eval latency under 5ms"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: cedar-gold-eval-under-5ms-good
              query: |
                sum(rate(oya_cedar_eval_duration_seconds_bucket{
                  service="policy-engine",
                  capability_tier="Gold",
                  decision="authorize",
                  le="0.005"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: cedar-gold-eval-total
              query: |
                sum(rate(oya_cedar_eval_duration_seconds_count{
                  service="policy-engine",
                  capability_tier="Gold",
                  decision="authorize"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Gold p99 eval <= 5ms"
      name: gold-p99-under-5ms
      targetName: gold-p99-5ms-target
      target: 0.99
      windowName: rolling-30d
      description: "Gold authorization calls meet the p99 <= 5ms latency commitment."
      indicator:
        metadata:
          name: cedar-gold-p99-under-5ms
          displayName: "Gold p99 under 5ms"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-gold-p99-good
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_bucket{service="policy-engine",capability_tier="Gold",le="0.005"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-gold-p99-total
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_count{service="policy-engine",capability_tier="Gold"}[5m]))
    - displayName: "Gold p95 eval <= 2ms"
      name: gold-p95-under-2ms
      targetName: gold-p95-2ms-target
      target: 0.95
      windowName: rolling-30d
      description: "Gold steady-state evals stay comfortably below the p99 ceiling."
      indicator:
        metadata:
          name: cedar-gold-p95-under-2ms
          displayName: "Gold p95 under 2ms"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-gold-p95-good
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_bucket{service="policy-engine",capability_tier="Gold",le="0.002"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-gold-p95-total
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_count{service="policy-engine",capability_tier="Gold"}[5m]))
    - displayName: "Platinum p99 eval <= 1ms"
      name: platinum-p99-under-1ms
      targetName: platinum-p99-1ms-target
      target: 0.99
      windowName: rolling-30d
      description: "Platinum authorization calls meet the p99 <= 1ms hot-path latency commitment."
      indicator:
        metadata:
          name: cedar-platinum-p99-under-1ms
          displayName: "Platinum p99 under 1ms"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-platinum-p99-good
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_bucket{service="policy-engine",capability_tier="Platinum",le="0.001"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-platinum-p99-total
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_count{service="policy-engine",capability_tier="Platinum"}[5m]))
    - displayName: "Platinum cache-hit eval <= 500us"
      name: platinum-cache-hit-under-500us
      targetName: platinum-cache-hit-500us-target
      target: 0.995
      windowName: rolling-30d
      description: "Platinum cache-hit authorizations preserve sub-millisecond headroom."
      indicator:
        metadata:
          name: cedar-platinum-cache-hit-under-500us
          displayName: "Platinum cache-hit under 500us"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-platinum-cache-hit-good
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_bucket{service="policy-engine",capability_tier="Platinum",cache_state="hit",le="0.0005"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-platinum-cache-hit-total
                  query: |
                    sum(rate(oya_cedar_eval_duration_seconds_count{service="policy-engine",capability_tier="Platinum",cache_state="hit"}[5m]))
    - displayName: "Policy fragment reload does not degrade eval latency"
      name: fragment-reload-latency-stability
      targetName: reload-stability-target
      target: 0.999
      windowName: rolling-30d
      description: "Evaluation latency remains inside tier budget during Cedar fragment reload windows."
      indicator:
        metadata:
          name: cedar-reload-latency-stability
          displayName: "Reload latency stability"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-reload-stable-good
                  query: |
                    sum(rate(oya_cedar_eval_latency_stability_total{service="policy-engine",reload_state="active",state="within_tier_budget"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: cedar-reload-stable-total
                  query: |
                    sum(rate(oya_cedar_eval_latency_stability_total{service="policy-engine",reload_state="active"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
