apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-merkle-attestation-lag
  displayName: "Audit Chain Merkle Attestation Lag"
  labels:
    library: slo-authoring
    catalog_template: audit-chain-merkle-attestation-lag
    microservice: audit-chain
    bounded_context: immutable-audit
    sli: freshness
    data_classes:
      - audit-event
      - merkle-root
      - compliance-evidence
    pack: regulated-audit
    tier: internal-substrate
    capability_tiers:
      - Gold
      - Platinum
    plane: audit
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0263
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Merkle root commit and attestation freshness template for audit-chain."
    oyatie.dev/source-spec: "specs/agentic-slo-gated-promotion.json"
    oyatie.dev/time-window-mode: "rolling"
    oyatie.dev/dashboard-template: "registry/dashboards/compliance-pack-attestation-lag.yaml"
    oyatie.dev/runbook-template: "microservices/audit-chain/runbooks/merkle-root-attestation-lag.md"
spec:
  service: audit-chain
  description: |
    SLO for the lag between accepted audit events, Merkle root commitment, and
    tenant-visible attestation availability. It protects promotion eligibility
    from silent audit backlog, signer degradation, object-storage write delay,
    and regulator evidence incompleteness.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Gold
        maxRootCommitLag: 60s
        maxAttestationPublishLag: 120s
      - name: Platinum
        maxRootCommitLag: 15s
        maxAttestationPublishLag: 30s
    rejectionRule: "Any unsealed audit segment holds promotion for services using regulated audit packs."
  indicator:
    metadata:
      name: gold-merkle-root-commit-under-60s
      displayName: "Gold Merkle root commit under 60s"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: gold-merkle-root-commit-good
              query: |
                sum(rate(oya_audit_merkle_root_commit_lag_seconds_bucket{
                  service="audit-chain",
                  capability_tier="Gold",
                  le="60"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: gold-merkle-root-commit-total
              query: |
                sum(rate(oya_audit_merkle_root_commit_lag_seconds_count{
                  service="audit-chain",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Gold Merkle root commit lag <= 60s"
      name: gold-root-commit-under-60s
      targetName: gold-root-commit-target
      target: 0.999
      windowName: rolling-30d
      description: "Gold audit events receive a committed Merkle root within sixty seconds."
      indicator:
        metadata:
          name: audit-gold-root-commit-under-60s
          displayName: "Gold root commit freshness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-gold-root-commit-good
                  query: |
                    sum(rate(oya_audit_merkle_root_commit_lag_seconds_bucket{service="audit-chain",capability_tier="Gold",le="60"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-gold-root-commit-total
                  query: |
                    sum(rate(oya_audit_merkle_root_commit_lag_seconds_count{service="audit-chain",capability_tier="Gold"}[5m]))
    - displayName: "Gold attestation publish lag <= 120s"
      name: gold-attestation-publish-under-120s
      targetName: gold-attestation-publish-target
      target: 0.999
      windowName: rolling-30d
      description: "Gold tenants can retrieve the signed attestation within two minutes."
      indicator:
        metadata:
          name: audit-gold-attestation-under-120s
          displayName: "Gold attestation publish freshness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-gold-attestation-good
                  query: |
                    sum(rate(oya_audit_attestation_publish_lag_seconds_bucket{service="audit-chain",capability_tier="Gold",le="120"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-gold-attestation-total
                  query: |
                    sum(rate(oya_audit_attestation_publish_lag_seconds_count{service="audit-chain",capability_tier="Gold"}[5m]))
    - displayName: "Platinum Merkle root commit lag <= 15s"
      name: platinum-root-commit-under-15s
      targetName: platinum-root-commit-target
      target: 0.9995
      windowName: rolling-30d
      description: "Platinum audit events receive a committed Merkle root within fifteen seconds."
      indicator:
        metadata:
          name: audit-platinum-root-commit-under-15s
          displayName: "Platinum root commit freshness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-platinum-root-commit-good
                  query: |
                    sum(rate(oya_audit_merkle_root_commit_lag_seconds_bucket{service="audit-chain",capability_tier="Platinum",le="15"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-platinum-root-commit-total
                  query: |
                    sum(rate(oya_audit_merkle_root_commit_lag_seconds_count{service="audit-chain",capability_tier="Platinum"}[5m]))
    - displayName: "Platinum attestation publish lag <= 30s"
      name: platinum-attestation-publish-under-30s
      targetName: platinum-attestation-publish-target
      target: 0.9995
      windowName: rolling-30d
      description: "Platinum tenants can retrieve the signed attestation within thirty seconds."
      indicator:
        metadata:
          name: audit-platinum-attestation-under-30s
          displayName: "Platinum attestation publish freshness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-platinum-attestation-good
                  query: |
                    sum(rate(oya_audit_attestation_publish_lag_seconds_bucket{service="audit-chain",capability_tier="Platinum",le="30"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: audit-platinum-attestation-total
                  query: |
                    sum(rate(oya_audit_attestation_publish_lag_seconds_count{service="audit-chain",capability_tier="Platinum"}[5m]))
    - displayName: "Merkle proof verification completeness"
      name: merkle-proof-verification-complete
      targetName: proof-verification-completeness-target
      target: 0.9999
      windowName: rolling-30d
      description: "Committed Merkle roots produce verifiable inclusion proofs for every exported event batch."
      indicator:
        metadata:
          name: audit-merkle-proof-completeness
          displayName: "Merkle proof completeness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: merkle-proof-good
                  query: |
                    sum(rate(oya_audit_merkle_proof_verification_total{service="audit-chain",result="valid"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: merkle-proof-total
                  query: |
                    sum(rate(oya_audit_merkle_proof_verification_total{service="audit-chain"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
