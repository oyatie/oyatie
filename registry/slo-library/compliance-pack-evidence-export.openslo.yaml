apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-compliance-evidence-export
  displayName: "Compliance Pack Evidence Export"
  labels:
    library: slo-authoring
    catalog_template: compliance-pack-evidence-export
    microservice: compliance
    bounded_context: regulator-evidence
    sli: evidence-export
    data_classes:
      - compliance-evidence
      - audit-event
      - regulator-export
    pack: regulated-evidence-export
    tier: control-plane
    capability_tiers:
      - Gold
      - Platinum
    plane: audit
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Regulator evidence export latency and completeness template."
    oyatie.dev/source-spec: "specs/compliance-pack-schema.json"
    oyatie.dev/time-window-mode: "calendar"
    oyatie.dev/dashboard-template: "registry/dashboards/compliance-pack-attestation-lag.yaml"
    oyatie.dev/runbook-template: "microservices/compliance/runbooks/regulator-evidence-export-delay.md"
spec:
  service: compliance
  description: |
    Calendar-month SLO for regulator evidence exports. It measures export
    latency, manifest completeness, Merkle inclusion proof availability,
    retention policy mapping, and per-pack evidence integrity for tenant-bound
    compliance packs.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Gold
        exportWithin: 15m
        completenessTarget: 0.9995
      - name: Platinum
        exportWithin: 5m
        completenessTarget: 0.9999
    rejectionRule: "Promotion is held when evidence export latency or completeness burns the audit budget."
  indicator:
    metadata:
      name: gold-evidence-export-under-15m
      displayName: "Gold evidence export under 15m"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: compliance-gold-export-good
              query: |
                sum(rate(oya_compliance_evidence_export_seconds_bucket{
                  service="compliance",
                  capability_tier="Gold",
                  le="900"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: compliance-gold-export-total
              query: |
                sum(rate(oya_compliance_evidence_export_seconds_count{
                  service="compliance",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 1M
      calendar:
        startTime: "2026-05-01 00:00:00"
        timeZone: UTC
      isRolling: false
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Gold evidence export <= 15m"
      name: gold-evidence-export-under-15m
      targetName: gold-export-latency-target
      target: 0.9995
      windowName: calendar-month
      description: "Gold regulator evidence exports complete within fifteen minutes."
      indicator:
        metadata:
          name: compliance-gold-export-under-15m
          displayName: "Gold export latency"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-gold-export-good
                  query: |
                    sum(rate(oya_compliance_evidence_export_seconds_bucket{service="compliance",capability_tier="Gold",le="900"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-gold-export-total
                  query: |
                    sum(rate(oya_compliance_evidence_export_seconds_count{service="compliance",capability_tier="Gold"}[5m]))
    - displayName: "Platinum evidence export <= 5m"
      name: platinum-evidence-export-under-5m
      targetName: platinum-export-latency-target
      target: 0.9995
      windowName: calendar-month
      description: "Platinum regulator evidence exports complete within five minutes."
      indicator:
        metadata:
          name: compliance-platinum-export-under-5m
          displayName: "Platinum export latency"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-platinum-export-good
                  query: |
                    sum(rate(oya_compliance_evidence_export_seconds_bucket{service="compliance",capability_tier="Platinum",le="300"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-platinum-export-total
                  query: |
                    sum(rate(oya_compliance_evidence_export_seconds_count{service="compliance",capability_tier="Platinum"}[5m]))
    - displayName: "Evidence manifest completeness"
      name: evidence-manifest-completeness
      targetName: manifest-completeness-target
      target: 0.9999
      windowName: calendar-month
      description: "Each export manifest includes required controls, audit refs, pack version, tenant, and retention fields."
      indicator:
        metadata:
          name: compliance-manifest-completeness
          displayName: "Evidence manifest completeness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-manifest-good
                  query: |
                    sum(rate(oya_compliance_export_manifest_checks_total{service="compliance",result="complete"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-manifest-total
                  query: |
                    sum(rate(oya_compliance_export_manifest_checks_total{service="compliance"}[5m]))
    - displayName: "Merkle proof attached to exports"
      name: export-merkle-proof-attached
      targetName: export-proof-target
      target: 0.9999
      windowName: calendar-month
      description: "Regulator exports include verifiable Merkle inclusion proofs for evidence batches."
      indicator:
        metadata:
          name: compliance-export-proof-attached
          displayName: "Export proof attachment"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-proof-good
                  query: |
                    sum(rate(oya_compliance_export_merkle_proof_total{service="compliance",result="attached"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compliance-proof-total
                  query: |
                    sum(rate(oya_compliance_export_merkle_proof_total{service="compliance"}[5m]))
    - displayName: "Control-to-evidence mapping completeness"
      name: control-evidence-mapping-complete
      targetName: control-evidence-map-target
      target: 0.9999
      windowName: calendar-month
      description: "Every exported control maps to at least one current evidence artifact."
      indicator:
        metadata:
          name: compliance-control-evidence-map
          displayName: "Control evidence mapping"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: control-evidence-map-good
                  query: |
                    sum(rate(oya_compliance_control_evidence_mapping_total{service="compliance",result="mapped"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: control-evidence-map-total
                  query: |
                    sum(rate(oya_compliance_control_evidence_mapping_total{service="compliance"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
