apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-tenant-onboarding-e2e
  displayName: "Tenant Onboarding End-to-End"
  labels:
    library: slo-authoring
    catalog_template: tenant-onboarding-end-to-end
    microservice: tenancy
    bounded_context: tenant-lifecycle
    sli: onboarding-cycle
    data_classes:
      - tenant-profile
      - billing-intent
      - identity-configuration
    pack: tenant-lifecycle
    tier: control-plane
    capability_tiers:
      - Bronze
      - Silver
      - Gold
      - Platinum
    plane: control
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Intent-to-active onboarding cycle SLO for tenant lifecycle services."
    oyatie.dev/source-spec: "specs/tenant-model.json"
    oyatie.dev/time-window-mode: "rolling"
    oyatie.dev/dashboard-template: "registry/dashboards/tenant-onboarding-health.yaml"
    oyatie.dev/runbook-template: "microservices/tenancy/runbooks/onboarding-pipeline-stall.md"
spec:
  service: tenancy
  description: |
    End-to-end SLO for converting an accepted tenant intent into active tenant
    state. The cycle begins at TenantIntentAccepted and ends when identity,
    tenancy, policy seed, billing profile, default cell assignment, audit-chain
    stream, and first admin session are active.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Bronze
        activeWithin: 30m
      - name: Silver
        activeWithin: 15m
      - name: Gold
        activeWithin: 5m
      - name: Platinum
        activeWithin: 2m
    rejectionRule: "Promotion is held when onboarding active-state lag burns the target tier budget."
  indicator:
    metadata:
      name: tenant-gold-intent-to-active-under-5m
      displayName: "Gold intent to active under 5m"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: tenant-gold-onboarding-good
              query: |
                sum(rate(oya_tenant_onboarding_duration_seconds_bucket{
                  service="tenancy",
                  capability_tier="Gold",
                  terminal_state="active",
                  le="300"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: tenant-gold-onboarding-total
              query: |
                sum(rate(oya_tenant_onboarding_duration_seconds_count{
                  service="tenancy",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Bronze intent to active <= 30m"
      name: bronze-intent-active-under-30m
      targetName: bronze-onboarding-cycle-target
      target: 0.99
      windowName: rolling-30d
      description: "Bronze tenants complete basic active-state bootstrap within thirty minutes."
      indicator:
        metadata:
          name: tenant-bronze-onboarding-under-30m
          displayName: "Bronze onboarding duration"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-bronze-onboarding-good
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_bucket{service="tenancy",capability_tier="Bronze",terminal_state="active",le="1800"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-bronze-onboarding-total
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_count{service="tenancy",capability_tier="Bronze"}[5m]))
    - displayName: "Silver intent to active <= 15m"
      name: silver-intent-active-under-15m
      targetName: silver-onboarding-cycle-target
      target: 0.995
      windowName: rolling-30d
      description: "Silver tenants complete identity, billing, cell, and policy seed within fifteen minutes."
      indicator:
        metadata:
          name: tenant-silver-onboarding-under-15m
          displayName: "Silver onboarding duration"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-silver-onboarding-good
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_bucket{service="tenancy",capability_tier="Silver",terminal_state="active",le="900"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-silver-onboarding-total
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_count{service="tenancy",capability_tier="Silver"}[5m]))
    - displayName: "Gold intent to active <= 5m"
      name: gold-intent-active-under-5m
      targetName: gold-onboarding-cycle-target
      target: 0.999
      windowName: rolling-30d
      description: "Gold tenants complete production-ready onboarding within five minutes."
      indicator:
        metadata:
          name: tenant-gold-onboarding-under-5m
          displayName: "Gold onboarding duration"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-gold-onboarding-good
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_bucket{service="tenancy",capability_tier="Gold",terminal_state="active",le="300"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-gold-onboarding-total
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_count{service="tenancy",capability_tier="Gold"}[5m]))
    - displayName: "Platinum intent to active <= 2m"
      name: platinum-intent-active-under-2m
      targetName: platinum-onboarding-cycle-target
      target: 0.999
      windowName: rolling-30d
      description: "Platinum tenants complete mission-critical onboarding bootstrap within two minutes."
      indicator:
        metadata:
          name: tenant-platinum-onboarding-under-2m
          displayName: "Platinum onboarding duration"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-platinum-onboarding-good
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_bucket{service="tenancy",capability_tier="Platinum",terminal_state="active",le="120"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-platinum-onboarding-total
                  query: |
                    sum(rate(oya_tenant_onboarding_duration_seconds_count{service="tenancy",capability_tier="Platinum"}[5m]))
    - displayName: "Active tenant seed completeness"
      name: active-tenant-seed-completeness
      targetName: seed-completeness-target
      target: 0.9999
      windowName: rolling-30d
      description: "Active tenants have identity, policy, audit, billing, and cell seed records present."
      indicator:
        metadata:
          name: tenant-active-seed-completeness
          displayName: "Active seed completeness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-seed-complete-good
                  query: |
                    sum(rate(oya_tenant_onboarding_seed_checks_total{service="tenancy",result="complete"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: tenant-seed-complete-total
                  query: |
                    sum(rate(oya_tenant_onboarding_seed_checks_total{service="tenancy"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
