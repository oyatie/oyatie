apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slo-workflow-saga-success
  displayName: "Workflow Engine Saga Success Rate"
  labels:
    library: slo-authoring
    catalog_template: workflow-engine-saga-success-rate
    microservice: workflow-engine
    bounded_context: durable-execution
    sli: saga-success
    data_classes:
      - workflow-instance
      - saga-step
      - compensation-event
    pack: durable-workflow
    tier: control-plane
    capability_tiers:
      - Silver
      - Gold
      - Platinum
    plane: control
    adr:
      - ADR-0131
      - ADR-0139
      - ADR-0316
    openslo_profile: openslo-v1
  annotations:
    oyatie.dev/library-purpose: "Durable function, saga success, and compensation correctness SLO template."
    oyatie.dev/source-spec: "specs/microservices/workflow.json"
    oyatie.dev/time-window-mode: "rolling"
    oyatie.dev/dashboard-template: "registry/dashboards/workflow-engine-saga-health.yaml"
    oyatie.dev/runbook-template: "microservices/workflow-engine/runbooks/saga-compensation-failure-investigation.md"
spec:
  service: workflow-engine
  description: |
    SLO for durable function execution and saga orchestration. The SLO measures
    successful completion, deterministic replay, bounded compensation, and
    exactly-once externally visible terminal states across tenant workflows.
  tier:
    doctrine: ADR-0316
    capabilityTiers:
      - name: Silver
        successTarget: 0.999
        compensationTarget: 0.995
      - name: Gold
        successTarget: 0.9995
        compensationTarget: 0.999
      - name: Platinum
        successTarget: 0.9999
        compensationTarget: 0.9995
    rejectionRule: "Promotion is held when saga success, replay correctness, or compensation completion burns budget."
  indicator:
    metadata:
      name: gold-saga-terminal-success
      displayName: "Gold saga terminal success"
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              queryName: workflow-gold-saga-success-good
              query: |
                sum(rate(oya_workflow_saga_terminal_total{
                  service="workflow-engine",
                  capability_tier="Gold",
                  terminal_state="succeeded"
                }[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              queryName: workflow-gold-saga-success-total
              query: |
                sum(rate(oya_workflow_saga_terminal_total{
                  service="workflow-engine",
                  capability_tier="Gold"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "Saga terminal success"
      name: saga-terminal-success
      targetName: saga-terminal-success-target
      target: 0.9995
      windowName: rolling-30d
      description: "Saga instances reach succeeded terminal state without manual repair."
      indicator:
        metadata:
          name: workflow-saga-terminal-success
          displayName: "Saga terminal success"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: saga-terminal-success-good
                  query: |
                    sum(rate(oya_workflow_saga_terminal_total{service="workflow-engine",terminal_state="succeeded"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: saga-terminal-success-total
                  query: |
                    sum(rate(oya_workflow_saga_terminal_total{service="workflow-engine"}[5m]))
    - displayName: "Compensation completion success"
      name: compensation-completion-success
      targetName: compensation-completion-target
      target: 0.999
      windowName: rolling-30d
      description: "Failed saga branches complete registered compensations within policy."
      indicator:
        metadata:
          name: workflow-compensation-completion
          displayName: "Compensation completion"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compensation-complete-good
                  query: |
                    sum(rate(oya_workflow_compensation_total{service="workflow-engine",result="completed"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compensation-complete-total
                  query: |
                    sum(rate(oya_workflow_compensation_total{service="workflow-engine"}[5m]))
    - displayName: "Durable replay determinism"
      name: durable-replay-determinism
      targetName: replay-determinism-target
      target: 0.9999
      windowName: rolling-30d
      description: "Workflow replay yields the same command sequence for persisted histories."
      indicator:
        metadata:
          name: workflow-replay-determinism
          displayName: "Durable replay determinism"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: replay-determinism-good
                  query: |
                    sum(rate(oya_workflow_replay_checks_total{service="workflow-engine",result="deterministic"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: replay-determinism-total
                  query: |
                    sum(rate(oya_workflow_replay_checks_total{service="workflow-engine"}[5m]))
    - displayName: "Idempotent command dedupe"
      name: idempotent-command-dedupe
      targetName: command-dedupe-target
      target: 0.9999
      windowName: rolling-30d
      description: "Duplicate workflow commands are deduped without duplicate external side effects."
      indicator:
        metadata:
          name: workflow-command-dedupe
          displayName: "Command dedupe correctness"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: command-dedupe-good
                  query: |
                    sum(rate(oya_workflow_command_dedupe_total{service="workflow-engine",result="deduped_or_unique"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: command-dedupe-total
                  query: |
                    sum(rate(oya_workflow_command_dedupe_total{service="workflow-engine"}[5m]))
    - displayName: "Saga compensation latency <= 5m"
      name: compensation-latency-under-5m
      targetName: compensation-latency-target
      target: 0.999
      windowName: rolling-30d
      description: "Compensation chains complete within five minutes after failure detection."
      indicator:
        metadata:
          name: workflow-compensation-latency-under-5m
          displayName: "Compensation latency"
        spec:
          ratioMetric:
            counter: true
            good:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compensation-latency-good
                  query: |
                    sum(rate(oya_workflow_compensation_duration_seconds_bucket{service="workflow-engine",le="300"}[5m]))
            total:
              metricSource:
                type: Prometheus
                spec:
                  queryName: compensation-latency-total
                  query: |
                    sum(rate(oya_workflow_compensation_duration_seconds_count{service="workflow-engine"}[5m]))
  alertPolicies:
    - alertPolicyRef: oya-canonical-fast-burn-page
    - alertPolicyRef: oya-canonical-slow-burn-page
    - alertPolicyRef: oya-canonical-ticket-burn
    - alertPolicyRef: oya-canonical-budget-exhausted
