pack_id: "PCI-DSS-v4.0.1"
pack_name: "Payment Card Industry Data Security Standard compliance pack - PCI Security Standards Council v4.0.1"
version:
  source_framework_version: "PCI DSS v4.0.1"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://www.pcisecuritystandards.org/standards/"
effective_date:
  source_effective_date: "2024-06-11 v4.0.1 publication with future-dated requirements effective 2025-03-31"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "Global payment card industry standard"
  covered_entities:
    - "merchant"
    - "service-provider"
    - "processor"
    - "acquirer"
    - "issuer"
    - "entity-that-stores-processes-or-transmits-cardholder-data"
  data_classes:
    - "PAYMENT_ACCOUNT_DATA"
    - "CARDHOLDER_DATA"
    - "PAN"
    - "SENSITIVE_AUTHENTICATION_DATA"
    - "CVV"
    - "TRACK_DATA"
    - "PIN_BLOCK"
    - "TOKENIZED_PAN"
    - "CARDHOLDER_NAME"
    - "PAYMENT_PAGE_SCRIPT_INTEGRITY"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "residency"
    - "cloud-kms"
    - "cloud-network-vpc"
    - "cloud-network-lb"
    - "marketplace"
    - "payments"
    - "billing"
    - "connect-dlp"
    - "workflow-engine"
    - "control-center"
activated_cedar_policies:
  - "pack/PCI-DSS-v4.0.1/v1.0.0/cardholder-data-environment-default-deny"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/network-segmentation-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/pan-display-truncation-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/sad-storage-forbidden-after-authorization"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/strong-cryptography-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/mfa-for-cde-access"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/payment-page-script-inventory"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/log-monitoring-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/vulnerability-management-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/targeted-risk-analysis-required"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/qsa-evidence-export"
  - "pack/PCI-DSS-v4.0.1/v1.0.0/cde-cross-pack-egress-deny"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "pack activation event"
  - event_class: "PciCdeAccessPermitted"
    adr_0263_anchor: "state-changing access event"
  - event_class: "PciCdeAccessDenied"
    adr_0263_anchor: "CedarEvaluation linked"
  - event_class: "PciPanDisplayTruncated"
    adr_0263_anchor: "data minimization event"
  - event_class: "PciSadStorageBlocked"
    adr_0263_anchor: "forbidden data event"
  - event_class: "PciPaymentPageScriptChanged"
    adr_0263_anchor: "payment page integrity event"
  - event_class: "PciVulnerabilityScanCompleted"
    adr_0263_anchor: "security operations event"
  - event_class: "PciTargetedRiskAnalysisApproved"
    adr_0263_anchor: "risk event"
  - event_class: "PciIncidentResponseStarted"
    adr_0263_anchor: "incident event"
  - event_class: "PciQsaEvidenceExported"
    adr_0263_anchor: "regulator evidence export"
  - event_class: "PciCdeSegmentationVerified"
    adr_0263_anchor: "network evidence event"
required_slo_overrides:
  - slo_id: "pci-log-review"
    baseline: "security-log-review p99 <= P7D"
    override: "CDE security-log-review p99 <= P1D"
    citation: "PCI DSS Requirement 10"
  - slo_id: "pci-critical-vulnerability-remediation"
    baseline: "critical-vulnerability-remediation p99 <= P14D"
    override: "CDE critical-vulnerability-remediation p99 <= P3D"
    citation: "PCI DSS Requirement 6 and Requirement 11"
  - slo_id: "pci-sad-block"
    baseline: "dlp-block p99 <= PT60S"
    override: "SAD storage block p99 <= PT1S"
    citation: "PCI DSS Requirement 3"
  - slo_id: "pci-access-revocation"
    baseline: "access-revocation p99 <= P7D"
    override: "CDE access revocation p99 <= PT4H"
    citation: "PCI DSS Requirement 7 and Requirement 8"
  - slo_id: "pci-qsa-export"
    baseline: "audit-export p99 <= P7D"
    override: "QSA evidence export p99 <= P1D"
    citation: "PCI DSS Requirement 12"
required_data_residency:
  must_stay_in_regions:
    - "pci-cde-primary-cell"
    - "pci-cde-dr-cell"
    - "pci-evidence-cell"
  must_not_cross_to_regions:
    - "non-cde-general-cell"
    - "developer-laptop"
    - "public-demo-cell"
    - "unrestricted-global-analytics-cell"
  residency_controls:
    - "PAN and SAD never leave the segmented CDE except tokenized PAN exports"
    - "SAD is not retained after authorization even inside CDE cells"
    - "payment page script evidence remains linked to CDE tenant and release"
required_encryption:
  at_rest_level: "PCI strong cryptography for stored account data with HSM-backed key hierarchy"
  ciphers:
    - "AES-256-GCM"
    - "AES-256-XTS"
    - "RSA-OAEP-3072 for legacy wrapping only during migration"
    - "HKDF-SHA-384"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "PCI PTS HSM or FIPS 140-3 Level 3 HSM"
    byok_required: true
    rotation: "P90D data-encryption-key rotation; P1Y key-encryption-key rotation"
    split_knowledge: "dual-control key ceremony for production CDE roots"
required_consent_capture:
  flows:
    - flow_id: "pci-cardholder-payment-authorization"
      ui_string: "I authorize this payment and understand my card data will be processed for this transaction."
      retention: "P7Y after transaction settlement or dispute closure"
    - flow_id: "pci-merchant-cde-scope-attestation"
      ui_string: "I attest that this merchant integration is in PCI DSS scope."
      retention: "P7Y after integration closure"
    - flow_id: "pci-qsa-evidence-export-approval"
      ui_string: "I authorize this PCI DSS evidence export for the selected assessment period."
      retention: "P7Y after assessment closure"
    - flow_id: "pci-payment-method-storage"
      ui_string: "I agree to store this payment method as a token for future payments."
      retention: "P7Y after token deletion or last chargeback closure"
required_dlp_rules:
  - "dlp.pci.pan-luhn"
  - "dlp.pci.cvv"
  - "dlp.pci.track1"
  - "dlp.pci.track2"
  - "dlp.pci.pin-block"
  - "dlp.pci.expiry-plus-pan"
  - "dlp.pci.payment-page-script"
  - "dlp.pci.tokenized-pan"
  - "dlp.pci.cardholder-name-plus-pan"
required_audit_retention:
  - audit_class: "PciCdeAccessPermitted"
    hot: "P90D"
    warm: "P1Y"
    cold: "P7Y"
  - audit_class: "PciCdeAccessDenied"
    hot: "P90D"
    warm: "P1Y"
    cold: "P7Y"
  - audit_class: "PciPaymentPageScriptChanged"
    hot: "P90D"
    warm: "P1Y"
    cold: "P7Y"
  - audit_class: "PciVulnerabilityScanCompleted"
    hot: "P90D"
    warm: "P1Y"
    cold: "P7Y"
  - audit_class: "PciQsaEvidenceExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
conflict_with_other_packs:
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "PCI DSS pack requires live CDE scope, segmentation, and assessment evidence"
  - pack_id: "UNSEGMENTED-CARD-DATA"
    reason: "cardholder data environment must be explicitly segmented and gated"
  - pack_id: "UNRESTRICTED-GLOBAL-ANALYTICS"
    reason: "PAN and SAD cannot flow to unrestricted analytics cells"
gracefully_combines_with_other_packs:
  - "SOC2-TYPE-II-2024"
  - "GDPR-2016-EU"
  - "HIPAA-2024-US"
  - "KR-PIPA-17799"
  - "CSAP-KR-2024"
  - "EU-CSRD-2022"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/PCI-DSS-v4.0.1/evidence-exports/qsa"
  file_format: "ZIP containing JSONL audit chain, CDE scope CSV, network segmentation JSON, vulnerability scan CSV, ASV attestations, and COSE_Sign1 manifest"
  cadence: "monthly internal refresh, quarterly scan evidence, annual QSA assessment, and on incident"
  signing_key: "external-attestor:pci-qsa:v1"
references:
  - law_section: "PCI DSS Requirement 1"
    title: "Install and maintain network security controls"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 2"
    title: "Apply secure configurations to all system components"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 3"
    title: "Protect stored account data"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 4"
    title: "Protect cardholder data with strong cryptography during transmission"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 5"
    title: "Protect all systems and networks from malicious software"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 6"
    title: "Develop and maintain secure systems and software"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 7"
    title: "Restrict access to system components and cardholder data by business need to know"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 8"
    title: "Identify users and authenticate access"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 9"
    title: "Restrict physical access to cardholder data"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 10"
    title: "Log and monitor all access to system components and cardholder data"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 11"
    title: "Test security of systems and networks regularly"
    url: "https://www.pcisecuritystandards.org/standards/"
  - law_section: "PCI DSS Requirement 12"
    title: "Support information security with organizational policies and programs"
    url: "https://www.pcisecuritystandards.org/standards/"
