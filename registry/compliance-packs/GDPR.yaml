pack_id: "GDPR-2016-EU"
pack_name: "General Data Protection Regulation compliance pack - European Union Regulation (EU) 2016/679"
version:
  source_framework_version: "Regulation (EU) 2016/679 consolidated baseline"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://op.europa.eu/en/publication-detail/-/publication/5f2552c2-cc45-11e6-ad7c-01aa75ed71a1/language-en"
effective_date:
  source_effective_date: "2018-05-25"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "European Union and European Economic Area"
  regulated_roles:
    - "controller"
    - "processor"
    - "joint-controller"
    - "representative"
  data_classes:
    - "PII_EU"
    - "PII_EU_SPECIAL_CATEGORY"
    - "PII_EU_CHILD"
    - "PII_EU_BIOMETRIC"
    - "PII_EU_GENETIC"
    - "PII_EU_CRIMINAL_OFFENCE"
    - "DEVICE_IDENTIFIER"
    - "ONLINE_IDENTIFIER"
    - "LOCATION_DATA"
    - "DSAR_EXPORT_RECORD"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "residency"
    - "consent"
    - "dsr"
    - "workflow-engine"
    - "workspace-messenger"
    - "workspace-drive"
    - "mail"
    - "dlp"
    - "cloud-region"
    - "marketplace"
activated_cedar_policies:
  - "pack/GDPR-2016-EU/v1.0.0/purpose-limitation-default-deny"
  - "pack/GDPR-2016-EU/v1.0.0/lawful-basis-required"
  - "pack/GDPR-2016-EU/v1.0.0/special-category-explicit-condition"
  - "pack/GDPR-2016-EU/v1.0.0/child-consent-age-gate"
  - "pack/GDPR-2016-EU/v1.0.0/dsar-access-permit"
  - "pack/GDPR-2016-EU/v1.0.0/right-erasure-cascade"
  - "pack/GDPR-2016-EU/v1.0.0/right-portability-export"
  - "pack/GDPR-2016-EU/v1.0.0/automated-decision-review"
  - "pack/GDPR-2016-EU/v1.0.0/dpia-high-risk-required"
  - "pack/GDPR-2016-EU/v1.0.0/breach-notification-72h"
  - "pack/GDPR-2016-EU/v1.0.0/eu-residency-transfer-gate"
  - "pack/GDPR-2016-EU/v1.0.0/processor-dpa-required"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "tenant_id and audit_id required"
  - event_class: "GdprLawfulBasisRecorded"
    adr_0263_anchor: "state-changing event"
  - event_class: "GdprConsentCaptured"
    adr_0263_anchor: "consent event"
  - event_class: "GdprConsentWithdrawn"
    adr_0263_anchor: "consent event"
  - event_class: "GdprDsarAccessRequested"
    adr_0263_anchor: "workflow event"
  - event_class: "GdprDsarExportCompleted"
    adr_0263_anchor: "evidence export event"
  - event_class: "GdprErasureCascadeCompleted"
    adr_0263_anchor: "state-changing event"
  - event_class: "GdprPortabilityExportCompleted"
    adr_0263_anchor: "evidence export event"
  - event_class: "GdprBreachDpaNoticeExported"
    adr_0263_anchor: "breach workflow event"
  - event_class: "GdprCrossBorderTransferDenied"
    adr_0263_anchor: "residency event"
  - event_class: "GdprDpiaApproved"
    adr_0263_anchor: "DPIA event"
required_slo_overrides:
  - slo_id: "gdpr-breach-dpa-notice"
    baseline: "emit-to-regulator p99 <= P14D"
    override: "supervisory-authority-notice p99 <= PT48H to protect the 72-hour rule"
    citation: "GDPR Article 33"
  - slo_id: "gdpr-data-subject-breach-notice"
    baseline: "notify-data-subject p99 <= P7D"
    override: "notify-data-subject p99 <= P2D when high risk is confirmed"
    citation: "GDPR Article 34"
  - slo_id: "gdpr-dsar-response"
    baseline: "dsr-response p99 <= P45D"
    override: "dsar-response p99 <= P25D to protect the one-month deadline"
    citation: "GDPR Article 12(3)"
  - slo_id: "gdpr-erasure-cascade"
    baseline: "erasure p99 <= P30D"
    override: "erasure-cascade p99 <= P20D"
    citation: "GDPR Article 17"
  - slo_id: "gdpr-consent-revocation"
    baseline: "consent-withdrawal p99 <= P7D"
    override: "consent-withdrawal p99 <= PT24H"
    citation: "GDPR Article 7(3)"
required_data_residency:
  must_stay_in_regions:
    - "eu-central-sovereign-cell"
    - "eu-west-sovereign-cell"
    - "eea-dr-cell"
  must_not_cross_to_regions:
    - "us-general-cell-without-transfer-mechanism"
    - "kr-general-cell-without-adequacy-binding"
    - "cn-mainland-cell"
    - "global-analytics-cell"
  transfer_controls:
    - "third-country transfers require adequacy, SCC, derogation, or explicit council-legal approval"
    - "special-category exports require DPIA approval and explicit condition"
    - "processor subservice export requires DPA and subprocessor listing"
required_encryption:
  at_rest_level: "CMEK envelope encryption for all EU personal data"
  ciphers:
    - "AES-256-GCM"
    - "XChaCha20-Poly1305 for backup archives"
    - "HKDF-SHA-384"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "EU-sovereign managed HSM tier with region-pinned keys"
    byok_required: false
    rotation: "P90D data-encryption-key rotation"
    deletion: "crypto-shred within erasure cascade when legally allowed"
required_consent_capture:
  flows:
    - flow_id: "gdpr-purpose-consent"
      ui_string: "I consent to processing for the selected purpose."
      retention: "P6Y after withdrawal or purpose closure"
    - flow_id: "gdpr-special-category-consent"
      ui_string: "I explicitly consent to processing this special category data for the named purpose."
      retention: "P6Y after withdrawal or purpose closure"
    - flow_id: "gdpr-child-guardian-consent"
      ui_string: "I confirm I am the guardian and consent to this child's data processing."
      retention: "P6Y after child reaches local age threshold or consent withdrawal"
    - flow_id: "gdpr-direct-marketing-opt-in"
      ui_string: "I agree to receive direct marketing for this purpose."
      retention: "P3Y after last interaction or withdrawal"
required_dlp_rules:
  - "dlp.eu.national-id"
  - "dlp.eu.passport"
  - "dlp.eu.iban"
  - "dlp.eu.health-data"
  - "dlp.eu.biometric-template"
  - "dlp.eu.child-data"
  - "dlp.eu.location-trail"
  - "dlp.eu.online-identifier"
  - "dlp.eu.special-category-keywords"
required_audit_retention:
  - audit_class: "GdprLawfulBasisRecorded"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "GdprConsentCaptured"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "GdprConsentWithdrawn"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "GdprDsarExportCompleted"
    hot: "P90D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "GdprBreachDpaNoticeExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P6Y"
conflict_with_other_packs:
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "GDPR pack requires real lawful-basis, DSR, and erasure controls"
  - pack_id: "UNRESTRICTED-GLOBAL-ANALYTICS"
    reason: "unrestricted global analytics violates transfer and purpose-limitation controls"
gracefully_combines_with_other_packs:
  - "SOC2-TYPE-II-2024"
  - "HIPAA-2024-US"
  - "EU-AI-ACT-2024-HIGH-RISK"
  - "EU-CSRD-2022"
  - "PCI-DSS-v4.0.1"
  - "KR-PIPA-17799"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/GDPR-2016-EU/evidence-exports/supervisory-authority"
  file_format: "ASiC-E ZIP containing JSONL audit chain, RoPA JSON, DPIA PDF/A, DSAR CSV, and JWS manifest"
  cadence: "on regulator pull, on breach, and quarterly internal evidence refresh"
  signing_key: "compliance-office:gdpr-2016-eu:v1"
