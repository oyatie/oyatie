pack_id: "EU-AI-ACT-2024-HIGH-RISK"
pack_name: "Artificial Intelligence Act compliance pack - European Union Regulation (EU) 2024/1689 Annex III high-risk systems"
version:
  source_framework_version: "Regulation (EU) 2024/1689"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3"
effective_date:
  source_effective_date: "2024-08-01 entry into force with phased application under Article 113"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "European Union and European Economic Area"
  high_risk_basis:
    - "Article 6(2)"
    - "Annex III"
  data_classes:
    - "AI_TRAINING_DATA"
    - "AI_VALIDATION_DATA"
    - "AI_TEST_DATA"
    - "AI_HIGH_RISK_INPUT"
    - "AI_HIGH_RISK_OUTPUT"
    - "BIOMETRIC_TEMPLATE"
    - "EMPLOYMENT_DECISION_DATA"
    - "EDUCATION_DECISION_DATA"
    - "CREDITWORTHINESS_DATA"
    - "ESSENTIAL_SERVICE_ELIGIBILITY_DATA"
    - "FRIA_RECORD"
    - "CONFORMITY_EVIDENCE"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "intelligence"
    - "workflow-engine"
    - "consent"
    - "dsr"
    - "foundry-eval"
    - "foundry-policy"
    - "marketplace"
    - "workspace-studio"
    - "connect-dlp"
    - "model-registry"
activated_cedar_policies:
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/annex-iii-classification-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/prohibited-practice-default-deny"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/risk-management-system-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/data-governance-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/technical-documentation-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/record-keeping-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/human-oversight-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/accuracy-robustness-cybersecurity"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/deployer-fria-required"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/eu-database-registration"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/serious-incident-reporting"
  - "pack/EU-AI-ACT-2024-HIGH-RISK/v1.0.0/transparency-notice-required"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "pack activation state change"
  - event_class: "AiActAnnexIIIClassificationRecorded"
    adr_0263_anchor: "classification evidence"
  - event_class: "AiActHighRiskUseDenied"
    adr_0263_anchor: "CedarEvaluation linked"
  - event_class: "AiActRiskManagementCycleCompleted"
    adr_0263_anchor: "risk evidence event"
  - event_class: "AiActTrainingDataGovernanceAttested"
    adr_0263_anchor: "data governance event"
  - event_class: "AiActTechnicalDocumentationSealed"
    adr_0263_anchor: "documentation evidence"
  - event_class: "AiActHumanOversightIntervention"
    adr_0263_anchor: "state-changing event"
  - event_class: "AiActFriaApproved"
    adr_0263_anchor: "fundamental rights evidence"
  - event_class: "AiActSeriousIncidentReported"
    adr_0263_anchor: "regulator notification event"
  - event_class: "AiActEuDatabaseRegistrationExported"
    adr_0263_anchor: "regulator evidence export"
  - event_class: "AiActPostMarketMonitoringReview"
    adr_0263_anchor: "post-market monitoring event"
required_slo_overrides:
  - slo_id: "ai-act-classification"
    baseline: "model-release-classification p99 <= P7D"
    override: "annex-iii-classification p99 <= P1D before model promotion"
    citation: "AI Act Article 6 and Annex III"
  - slo_id: "ai-act-human-oversight"
    baseline: "manual-review p99 <= P7D"
    override: "high-risk-human-oversight-intervention p99 <= PT4H for blocked consequential action"
    citation: "AI Act Article 14"
  - slo_id: "ai-act-log-retention"
    baseline: "model-log-retention >= P90D"
    override: "high-risk-automated-log-retention >= P6Y"
    citation: "AI Act Article 12 and Article 19"
  - slo_id: "ai-act-serious-incident"
    baseline: "regulator-incident-export p99 <= P14D"
    override: "serious-incident-export p99 <= P2D"
    citation: "AI Act Article 73"
  - slo_id: "ai-act-fria"
    baseline: "impact-assessment-review p99 <= P30D"
    override: "FRIA approval required before first high-risk deployment"
    citation: "AI Act Article 27"
required_data_residency:
  must_stay_in_regions:
    - "eu-ai-high-risk-cell"
    - "eu-sovereign-model-registry-cell"
    - "eea-audit-evidence-cell"
  must_not_cross_to_regions:
    - "unclassified-global-model-training-cell"
    - "third-country-provider-without-transfer-basis"
    - "public-demo-cell"
  residency_controls:
    - "Annex III high-risk logs remain in EEA evidence cells unless a transfer basis exists"
    - "training data containing GDPR special categories inherits GDPR transfer controls"
    - "model registry artifacts require EU AI Act pack evidence before marketplace publish"
required_encryption:
  at_rest_level: "CMEK envelope encryption for datasets, model artifacts, logs, and FRIA records"
  ciphers:
    - "AES-256-GCM"
    - "AES-256-XTS"
    - "SHA-384 evidence digest"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "EU managed HSM tier with signed model-artifact attestations"
    byok_required: true
    rotation: "P90D data-encryption-key rotation; per-release model artifact signing"
    evidence_lock: "conformity evidence immutable after release candidate approval"
required_consent_capture:
  flows:
    - flow_id: "ai-act-transparency-notice"
      ui_string: "I understand this interaction uses an AI system and may be subject to human review."
      retention: "P6Y after interaction"
    - flow_id: "ai-act-high-risk-deployer-fria"
      ui_string: "I attest that the required fundamental rights impact assessment is approved for this deployment."
      retention: "P10Y after system withdrawal"
    - flow_id: "ai-act-biometric-exception"
      ui_string: "I acknowledge the lawful basis and oversight controls for this biometric AI use."
      retention: "P10Y after use case closure"
    - flow_id: "ai-act-human-oversight-confirmation"
      ui_string: "I confirm human oversight has reviewed this high-risk AI outcome before action."
      retention: "P10Y after consequential action"
required_dlp_rules:
  - "dlp.ai.training-personal-data"
  - "dlp.ai.biometric-template"
  - "dlp.ai.employment-decision"
  - "dlp.ai.education-decision"
  - "dlp.ai.creditworthiness"
  - "dlp.ai.essential-service"
  - "dlp.ai.law-enforcement"
  - "dlp.ai.migration-asylum-border"
  - "dlp.ai.fria-record"
required_audit_retention:
  - audit_class: "AiActAnnexIIIClassificationRecorded"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "AiActTechnicalDocumentationSealed"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "AiActHumanOversightIntervention"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "AiActSeriousIncidentReported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "AiActPostMarketMonitoringReview"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
conflict_with_other_packs:
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "high-risk AI pack requires real classification and post-market monitoring evidence"
  - pack_id: "NO-HUMAN-OVERSIGHT-AUTOMATION"
    reason: "Article 14 human oversight cannot be disabled"
gracefully_combines_with_other_packs:
  - "GDPR-2016-EU"
  - "SOC2-TYPE-II-2024"
  - "EU-CSRD-2022"
  - "HIPAA-2024-US"
  - "KR-PIPA-17799"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/EU-AI-ACT-2024-HIGH-RISK/evidence-exports/eu-ai-office"
  file_format: "ASiC-E ZIP containing Annex III classification JSON, FRIA PDF/A, technical-documentation bundle, model-card JSON, logs JSONL, and JWS manifest"
  cadence: "on release, on substantial modification, on serious incident, and annual post-market monitoring review"
  signing_key: "compliance-office:eu-ai-act-2024-high-risk:v1"
references:
  - law_section: "AI Act Article 5"
