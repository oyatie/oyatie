pack_id: "EU-CSRD-2022"
pack_name: "Corporate Sustainability Reporting Directive compliance pack - European Union Directive (EU) 2022/2464"
version:
  source_framework_version: "Directive (EU) 2022/2464 with ESRS delegated standards"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://finance.ec.europa.eu/financial-markets/company-reporting-and-auditing/company-reporting/corporate-sustainability-reporting_en"
effective_date:
  source_effective_date: "2023-01-05 entry into force with phased reporting application"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "European Union corporate sustainability reporting"
  reporting_scope:
    - "large-eu-undertaking"
    - "listed-sme-when-applicable"
    - "non-eu-parent-with-eu-reporting-threshold"
    - "consolidated-group-reporting"
  data_classes:
    - "SUSTAINABILITY_REPORTING_DATA"
    - "ESRS_ENVIRONMENT_METRIC"
    - "ESRS_SOCIAL_METRIC"
    - "ESRS_GOVERNANCE_METRIC"
    - "GHG_SCOPE_1"
    - "GHG_SCOPE_2"
    - "GHG_SCOPE_3"
    - "DOUBLE_MATERIALITY_ASSESSMENT"
    - "VALUE_CHAIN_ESTIMATE"
    - "ASSURANCE_EVIDENCE"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "cloud-finops"
    - "cloud-billing"
    - "cloud-resource"
    - "cloud-region"
    - "marketplace"
    - "workflow-engine"
    - "workspace-drive"
    - "sheets"
    - "foundry-evidence"
    - "control-center"
activated_cedar_policies:
  - "pack/EU-CSRD-2022/v1.0.0/reporting-entity-scope-required"
  - "pack/EU-CSRD-2022/v1.0.0/double-materiality-assessment-required"
  - "pack/EU-CSRD-2022/v1.0.0/esrs-datapoint-lineage-required"
  - "pack/EU-CSRD-2022/v1.0.0/value-chain-estimate-disclosure"
  - "pack/EU-CSRD-2022/v1.0.0/ghg-scope-evidence-required"
  - "pack/EU-CSRD-2022/v1.0.0/management-report-export"
  - "pack/EU-CSRD-2022/v1.0.0/eu-taxonomy-article-8-linkage"
  - "pack/EU-CSRD-2022/v1.0.0/assurance-provider-access"
  - "pack/EU-CSRD-2022/v1.0.0/board-approval-before-filing"
  - "pack/EU-CSRD-2022/v1.0.0/xhtml-esef-output-required"
  - "pack/EU-CSRD-2022/v1.0.0/nonpublic-esg-default-deny"
  - "pack/EU-CSRD-2022/v1.0.0/sustainability-report-retention"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "pack activation event"
  - event_class: "CsrdReportingScopeDetermined"
    adr_0263_anchor: "scope event"
  - event_class: "CsrdDoubleMaterialityAssessmentApproved"
    adr_0263_anchor: "assessment event"
  - event_class: "CsrdEsrsDatapointLineageSealed"
    adr_0263_anchor: "evidence event"
  - event_class: "CsrdGhgMetricImported"
    adr_0263_anchor: "metric evidence event"
  - event_class: "CsrdValueChainEstimateApproved"
    adr_0263_anchor: "estimate event"
  - event_class: "CsrdAssuranceEvidenceExported"
    adr_0263_anchor: "assurance event"
  - event_class: "CsrdBoardApprovalSealed"
    adr_0263_anchor: "approval event"
  - event_class: "CsrdManagementReportExported"
    adr_0263_anchor: "regulator filing event"
  - event_class: "CsrdTaxonomyArticle8MappingSealed"
    adr_0263_anchor: "taxonomy mapping event"
  - event_class: "CsrdRestatementRecorded"
    adr_0263_anchor: "correction event"
required_slo_overrides:
  - slo_id: "csrd-datapoint-lineage"
    baseline: "evidence-lineage-write p99 <= PT60S"
    override: "ESRS datapoint lineage write p99 <= PT10S"
    citation: "Directive 2013/34/EU Article 19a as amended by Directive 2022/2464"
  - slo_id: "csrd-management-report-export"
    baseline: "board-report-export p99 <= P7D"
    override: "management-report-export p99 <= P1D after board approval"
    citation: "Directive 2013/34/EU Article 30 as amended"
  - slo_id: "csrd-assurance-evidence"
    baseline: "auditor-evidence-export p99 <= P7D"
    override: "limited-assurance evidence export p99 <= P2D"
    citation: "Directive 2013/34/EU Article 34 as amended"
  - slo_id: "csrd-materiality-review"
    baseline: "materiality-review p99 <= P30D"
    override: "double-materiality review p99 <= P10D"
    citation: "Directive 2013/34/EU Article 19a and Article 29a"
  - slo_id: "csrd-restatement"
    baseline: "restatement-ledger p99 <= P14D"
    override: "sustainability restatement ledger p99 <= P3D"
    citation: "ESRS 1 and ESRS 2 disclosure governance"
required_data_residency:
  must_stay_in_regions:
    - "eu-reporting-primary-cell"
    - "eu-reporting-assurance-cell"
    - "eea-audit-evidence-cell"
  must_not_cross_to_regions:
    - "unapproved-third-country-assurance-cell"
    - "public-demo-cell"
    - "developer-laptop"
  residency_controls:
    - "nonpublic sustainability datapoints remain EU-scoped until management report approval"
    - "assurance provider exports are read-only and scoped by reporting period"
    - "value-chain supplier evidence redacts unrelated tenant identifiers"
required_encryption:
  at_rest_level: "CMEK envelope encryption for sustainability datapoints and assurance evidence"
  ciphers:
    - "AES-256-GCM"
    - "SHA-256 Merkle chain hash"
    - "Ed25519 evidence signature"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "EU managed HSM tier for report and assurance signatures"
    byok_required: false
    rotation: "P180D evidence key rotation; per-report signing attestation"
    report_lock: "immutable after board approval and assurance sign-off"
required_consent_capture:
  flows:
    - flow_id: "csrd-board-approval"
      ui_string: "I approve this sustainability statement for the selected reporting period."
      retention: "P10Y after report publication"
    - flow_id: "csrd-assurance-provider-access"
      ui_string: "I authorize the named assurance provider to access this CSRD evidence package."
      retention: "P10Y after assurance engagement closure"
    - flow_id: "csrd-value-chain-supplier-disclosure"
      ui_string: "I authorize use of this supplier datapoint for the named CSRD disclosure."
      retention: "P10Y after reporting period"
    - flow_id: "csrd-restatement-attestation"
      ui_string: "I attest this sustainability datapoint restatement is complete and traceable."
      retention: "P10Y after restatement publication"
required_dlp_rules:
  - "dlp.csrd.nonpublic-esg"
  - "dlp.csrd.ghg-scope1"
  - "dlp.csrd.ghg-scope2"
  - "dlp.csrd.ghg-scope3"
  - "dlp.csrd.workforce-metric"
  - "dlp.csrd.supplier-estimate"
  - "dlp.csrd.board-approval"
  - "dlp.csrd.assurance-evidence"
  - "dlp.csrd.taxonomy-article8"
required_audit_retention:
  - audit_class: "CsrdReportingScopeDetermined"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "CsrdDoubleMaterialityAssessmentApproved"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "CsrdEsrsDatapointLineageSealed"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "CsrdAssuranceEvidenceExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
  - audit_class: "CsrdManagementReportExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P10Y"
conflict_with_other_packs:
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "CSRD requires real reporting-entity scope, datapoint lineage, and assurance evidence"
  - pack_id: "UNRETAINED-AUDIT-STREAM"
    reason: "CSRD report assurance requires retained lineage and approval records"
gracefully_combines_with_other_packs:
  - "SOC2-TYPE-II-2024"
  - "GDPR-2016-EU"
  - "EU-AI-ACT-2024-HIGH-RISK"
  - "KR-PIPA-17799"
  - "CSAP-KR-2024"
  - "PCI-DSS-v4.0.1"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/EU-CSRD-2022/evidence-exports/corporate-reporting"
  file_format: "ESEF-ready XHTML package with XBRL tags, JSONL audit chain, ESRS datapoint CSV, assurance PDF/A, and JWS manifest"
  cadence: "annual management report, assurance pull, and restatement-triggered export"
  signing_key: "compliance-office:eu-csrd-2022:v1"
references:
  - law_section: "Directive (EU) 2022/2464 Article 1"
    title: "Amendments to Regulation 537/2014 and Directives 2004/109/EC, 2006/43/EC, 2013/34/EU"
    url: "https://eur-lex.europa.eu/eli/dir/2022/2464/oj"
  - law_section: "Directive 2013/34/EU Article 19a as amended"
    title: "Sustainability reporting"
    url: "https://eur-lex.europa.eu/eli/dir/2022/2464/oj"
  - law_section: "Directive 2013/34/EU Article 29a as amended"
    title: "Consolidated sustainability reporting"
