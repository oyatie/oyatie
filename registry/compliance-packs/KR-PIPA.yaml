required_slo_overrides:
  - slo_id: "kr-pipa-breach-pipc-notice"
    baseline: "emit-to-regulator p99 <= P14D"
    override: "PIPC breach notice p99 <= PT24H after confirmation"
    citation: "PIPA Article 34"
  - slo_id: "kr-pipa-data-subject-access"
    baseline: "dsr-access p99 <= P30D"
    override: "data-subject-access p99 <= P10D"
    citation: "PIPA Article 35"
  - slo_id: "kr-pipa-correction-deletion"
    baseline: "correction-deletion p99 <= P30D"
    override: "correction-deletion p99 <= P10D"
    citation: "PIPA Article 36"
  - slo_id: "kr-pipa-processing-suspension"
    baseline: "processing-suspension p99 <= P14D"
    override: "processing-suspension p99 <= P5D"
    citation: "PIPA Article 37"
  - slo_id: "kr-pipa-cross-border-transfer-ledger"
    baseline: "transfer-ledger-write p99 <= PT60S"
    override: "cross-border-transfer-ledger-write p99 <= PT5S"
    citation: "PIPA Article 28-8"
required_data_residency:
  must_stay_in_regions:
    - "kr-seoul-sovereign-cell"
    - "kr-busan-dr-cell"
    - "kr-audit-evidence-cell"
  must_not_cross_to_regions:
    - "global-analytics-cell"
    - "third-country-processor-without-disclosure"
    - "developer-laptop"
    - "public-demo-cell"
  residency_controls:
    - "unique identification information remains in KR sovereign cells unless statutory basis and transfer disclosure are recorded"
    - "cross-border transfer ledger records recipient country, recipient name, purpose, retention, and refusal right where required"
    - "pseudonymized datasets remain link-separation protected inside KR evidence cells"
required_encryption:
  at_rest_level: "KMS-backed AES-256 envelope encryption with KR region-pinned keys"
  ciphers:
    - "AES-256-GCM"
    - "ARIA-256-GCM where Korean public-sector profile requires domestic cipher allowance"
    - "SHA-256 Merkle chain hash"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "KR region-pinned managed HSM with KMS audit export"
    byok_required: false
    rotation: "P90D data-encryption-key rotation"
    unique_id_access: "dual-control approval and audit seal"
required_consent_capture:
  flows:
    - flow_id: "kr-pipa-collection-use-consent"
      ui_string: "I consent to collection and use of my personal information for the stated purpose."
      retention: "P5Y after consent withdrawal or purpose closure"
    - flow_id: "kr-pipa-third-party-provision"
      ui_string: "I consent to provision of my personal information to the named third party."
      retention: "P5Y after provision ends"
    - flow_id: "kr-pipa-sensitive-info-consent"
      ui_string: "I explicitly consent to processing of sensitive personal information for this purpose."
      retention: "P5Y after withdrawal or purpose closure"
    - flow_id: "kr-pipa-cross-border-transfer"
      ui_string: "I acknowledge the overseas transfer recipient, country, purpose, retention period, and refusal right."
      retention: "P5Y after transfer relationship ends"
required_dlp_rules:
  - "dlp.kr.rrn"
  - "dlp.kr.passport"
  - "dlp.kr.driver-license"
  - "dlp.kr.foreigner-registration"
