pack_id: "SOC2-TYPE-II-2024"
pack_name: "System and Organization Controls 2 Type II compliance pack - AICPA Trust Services Criteria"
version:
  source_framework_version: "AICPA Trust Services Criteria 2017 with revised points of focus"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
effective_date:
  source_effective_date: "2017-12-15 trust services criteria baseline; Type II observation period configured per audit"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "AICPA attestation framework used by United States and international service organizations"
  trust_services_categories:
    - "security"
    - "availability"
    - "processing-integrity"
    - "confidentiality"
    - "privacy"
  data_classes:
    - "CUSTOMER_CONFIDENTIAL"
    - "CUSTOMER_PII"
    - "INTERNAL_CONTROL_EVIDENCE"
    - "SERVICE_COMMITMENT"
    - "SECURITY_EVENT"
    - "CHANGE_RECORD"
    - "AVAILABILITY_METRIC"
    - "PROCESSING_INTEGRITY_RECORD"
    - "VENDOR_RISK_RECORD"
    - "AUDITOR_REQUEST_RECORD"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "workflow-engine"
    - "cloud-iam"
    - "cloud-kms"
    - "cloud-resource"
    - "cloud-region"
    - "foundry-policy"
    - "foundry-evidence"
    - "marketplace"
    - "release"
    - "control-center"
activated_cedar_policies:
  - "pack/SOC2-TYPE-II-2024/v1.0.0/common-criteria-default-deny"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc1-control-environment-evidence"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc2-communication-information"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc3-risk-assessment"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc4-monitoring-controls"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc5-control-activities"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc6-logical-access"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc7-system-operations"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc8-change-management"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/cc9-risk-mitigation"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/privacy-category-if-selected"
  - "pack/SOC2-TYPE-II-2024/v1.0.0/auditor-evidence-pull"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "state-changing event"
  - event_class: "Soc2ControlEvidenceCollected"
    adr_0263_anchor: "control evidence event"
  - event_class: "Soc2ControlExceptionRecorded"
    adr_0263_anchor: "audit_id required"
  - event_class: "Soc2ChangeManagementApprovalSealed"
    adr_0263_anchor: "change state event"
  - event_class: "Soc2AccessReviewCompleted"
    adr_0263_anchor: "access-control evidence"
  - event_class: "Soc2AvailabilityIncidentReviewed"
    adr_0263_anchor: "availability evidence"
  - event_class: "Soc2VendorRiskReviewCompleted"
    adr_0263_anchor: "risk mitigation evidence"
  - event_class: "Soc2AuditorEvidenceExported"
    adr_0263_anchor: "regulator evidence event"
  - event_class: "Soc2ObservationPeriodOpened"
    adr_0263_anchor: "attestation lifecycle event"
  - event_class: "Soc2ObservationPeriodClosed"
    adr_0263_anchor: "attestation lifecycle event"
  - event_class: "CedarEvaluation"
    adr_0263_anchor: "policy decision correlation"
required_slo_overrides:
  - slo_id: "soc2-control-evidence-latency"
    baseline: "control-evidence-freshness p99 <= P7D"
    override: "control-evidence-freshness p99 <= P1D during observation period"
    citation: "TSC CC4 and CC7"
  - slo_id: "soc2-access-review-closure"
    baseline: "access-review p99 <= P30D"
    override: "privileged-access-review p99 <= P7D"
    citation: "TSC CC6"
  - slo_id: "soc2-change-approval-seal"
    baseline: "change-record-seal p99 <= PT1H"
    override: "change-record-seal p99 <= PT10M"
    citation: "TSC CC8"
  - slo_id: "soc2-incident-response-review"
    baseline: "incident-review p99 <= P14D"
    override: "security-incident-review p99 <= P5D"
    citation: "TSC CC7"
  - slo_id: "soc2-auditor-export"
    baseline: "audit-export p99 <= P7D"
    override: "auditor-evidence-export p99 <= P1D"
    citation: "Type II evidence operating effectiveness"
required_data_residency:
  must_stay_in_regions:
    - "tenant-selected-primary-cell"
    - "tenant-selected-dr-cell"
    - "audit-evidence-cell"
  must_not_cross_to_regions:
    - "unapproved-third-party-auditor-cell"
    - "developer-laptop"
    - "synthetic-demo-cell"
  residency_controls:
    - "auditor exports are read-only and scoped to the selected observation period"
    - "customer-confidential evidence remains in tenant evidence cell unless DPA authorizes export"
    - "subprocessor evidence redacts unrelated tenant identifiers"
required_encryption:
  at_rest_level: "CMEK envelope encryption with immutable evidence bucket retention"
  ciphers:
    - "AES-256-GCM"
    - "AES-256-XTS"
    - "SHA-256 Merkle chain hash"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "managed HSM or CloudHSM FIPS 140-2 Level 2 minimum"
    byok_required: false
    rotation: "P90D data-encryption-key rotation; P1Y evidence-signing-key rotation"
    evidence_lock: "WORM lock for closed observation period"
required_consent_capture:
  flows:
    - flow_id: "soc2-auditor-access-consent"
      ui_string: "I authorize this auditor evidence export for the named SOC 2 observation period."
      retention: "P7Y after report issuance"
    - flow_id: "soc2-subprocessor-disclosure"
      ui_string: "I acknowledge the subprocessors included in this SOC 2 evidence package."
      retention: "P7Y after acknowledgement"
    - flow_id: "soc2-privacy-category-consent"
      ui_string: "I consent to privacy-category processing needed for SOC 2 evidence."
      retention: "P7Y when privacy category is selected"
    - flow_id: "soc2-control-owner-attestation"
      ui_string: "I attest this control operated as described for the selected period."
      retention: "P7Y after observation period closure"
required_dlp_rules:
  - "dlp.soc2.customer-confidential"
  - "dlp.soc2.audit-sample"
  - "dlp.soc2.access-review"
  - "dlp.soc2.change-ticket"
  - "dlp.soc2.vendor-risk"
  - "dlp.soc2.secret-material"
  - "dlp.soc2.incident-retrospective"
  - "dlp.soc2.observation-period"
required_audit_retention:
  - audit_class: "Soc2ControlEvidenceCollected"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "Soc2ControlExceptionRecorded"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "Soc2AccessReviewCompleted"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "Soc2ChangeManagementApprovalSealed"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "Soc2AuditorEvidenceExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
conflict_with_other_packs:
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "Type II pack requires operating effectiveness evidence from real controls"
  - pack_id: "UNRETAINED-AUDIT-STREAM"
    reason: "Type II evidence cannot be produced without retained audit-chain records"
gracefully_combines_with_other_packs:
  - "HIPAA-2024-US"
  - "GDPR-2016-EU"
  - "KR-PIPA-17799"
  - "PCI-DSS-v4.0.1"
  - "EU-CSRD-2022"
  - "CSAP-KR-2024"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/SOC2-TYPE-II-2024/evidence-exports/auditor"
  file_format: "ZIP containing JSONL audit chain, control matrix CSV, PDF management assertion, and COSE_Sign1 manifest"
  cadence: "monthly internal refresh and per-auditor pull during observation period"
  signing_key: "external-attestor:soc2-cpa-firm:v1"
references:
  - law_section: "TSC CC1"
    title: "Control environment"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC2"
    title: "Communication and information"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC3"
    title: "Risk assessment"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC4"
    title: "Monitoring activities"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC5"
    title: "Control activities"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC6"
    title: "Logical and physical access controls"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC7"
    title: "System operations"
    url: "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
  - law_section: "TSC CC8"
    title: "Change management"
