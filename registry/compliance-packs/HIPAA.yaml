pack_id: "HIPAA-2024-US"
pack_name: "Health Insurance Portability and Accountability Act compliance pack - United States HHS OCR, 45 CFR Parts 160, 162, and 164"
version:
  source_framework_version: "45 CFR Parts 160, 162, 164 current eCFR baseline"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C"
effective_date:
  source_effective_date: "2003-04-14 privacy rule; 2005-04-20 security rule; 2009-09-23 breach-notification rule"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "United States federal healthcare"
  covered_entities:
    - "covered-healthcare-provider"
    - "health-plan"
    - "healthcare-clearinghouse"
    - "business-associate"
  data_classes:
    - "PHI"
    - "EPHI"
    - "HEALTH_PLAN_IDENTIFIER"
    - "CLINICAL_RECORD"
    - "PRESCRIPTION_RECORD"
    - "CLAIMS_TRANSACTION"
    - "ENCOUNTER_RECORD"
    - "DEVICE_HEALTH_TELEMETRY"
    - "GENOMIC_HEALTH_DATA"
    - "MINIMUM_NECESSARY_DERIVED_DATA"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "residency"
    - "consent"
    - "dsr"
    - "workflow-engine"
    - "cloud-kms"
    - "dlp"
    - "workspace-drive"
    - "workspace-meet"
    - "workspace-messenger"
    - "connector-epic-fhir"
activated_cedar_policies:
  - "pack/HIPAA-2024-US/v1.0.0/phi-access-default-deny"
  - "pack/HIPAA-2024-US/v1.0.0/phi-minimum-necessary-permit"
  - "pack/HIPAA-2024-US/v1.0.0/ephi-security-rule-safeguards"
  - "pack/HIPAA-2024-US/v1.0.0/baa-coverage-required"
  - "pack/HIPAA-2024-US/v1.0.0/breach-notification-clock"
  - "pack/HIPAA-2024-US/v1.0.0/audit-stream-selection"
  - "pack/HIPAA-2024-US/v1.0.0/cross-tenant-phi-default-forbid"
  - "pack/HIPAA-2024-US/v1.0.0/deidentification-safe-harbor-only"
  - "pack/HIPAA-2024-US/v1.0.0/hipaa-consent-and-authorization"
  - "pack/HIPAA-2024-US/v1.0.0/emergency-access-break-glass"
  - "pack/HIPAA-2024-US/v1.0.0/right-of-access-export"
  - "pack/HIPAA-2024-US/v1.0.0/accounting-of-disclosures"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "state-changing event carries tenant_id, trace_id, span_id, audit_id, schema_version, source_microservice, cell_id"
  - event_class: "PhiAccessPermitted"
    adr_0263_anchor: "pack-specific state change"
  - event_class: "PhiAccessDenied"
    adr_0263_anchor: "pack-specific state change"
  - event_class: "EmergencyPhiBreakGlassUsed"
    adr_0263_anchor: "audit_id required"
  - event_class: "BusinessAssociateAgreementAttached"
    adr_0263_anchor: "agreement-lifecycle event"
  - event_class: "MinimumNecessaryOverrideDenied"
    adr_0263_anchor: "CedarEvaluation linked"
  - event_class: "HipaaBreachClockStarted"
    adr_0263_anchor: "breach workflow event"
  - event_class: "HipaaBreachRegulatorNoticeExported"
    adr_0263_anchor: "regulator evidence event"
  - event_class: "AccountingOfDisclosureExported"
    adr_0263_anchor: "tenant evidence export"
  - event_class: "PhiDeidentificationAttested"
    adr_0263_anchor: "de-identification event"
  - event_class: "CrossPackDifferentRegulationsCallForbidden"
    adr_0263_anchor: "cross-pack matrix event"
required_slo_overrides:
  - slo_id: "hipaa-breach-clock-start"
    baseline: "incident-triage p99 <= PT15M"
    override: "breach-notification-clock-start p99 <= PT5M"
    citation: "45 CFR 164.404 and 164.410"
  - slo_id: "hipaa-breach-regulator-export"
    baseline: "emit-to-regulator p99 <= P30D"
    override: "emit-to-regulator p99 <= P14D so the 60-day outside limit remains protected"
    citation: "45 CFR 164.408"
  - slo_id: "hipaa-individual-access-export"
    baseline: "dsr-export p99 <= P30D"
    override: "right-of-access-export p99 <= P20D"
    citation: "45 CFR 164.524"
  - slo_id: "hipaa-audit-seal"
    baseline: "audit-seal p99 <= PT60S"
    override: "phi-audit-seal p99 <= PT10S"
    citation: "45 CFR 164.312(b)"
  - slo_id: "hipaa-break-glass-review"
    baseline: "manual-review p99 <= P7D"
    override: "emergency-access-review p99 <= P1D"
    citation: "45 CFR 164.308(a)(1)(ii)(D)"
required_data_residency:
  must_stay_in_regions:
    - "us-east-hipaa-cell"
    - "us-west-hipaa-dr-cell"
    - "us-gov-hipaa-cell"
  must_not_cross_to_regions:
    - "eu-general-cell"
    - "kr-general-cell"
    - "cn-mainland-cell"
    - "unclassified-global-analytics-cell"
  residency_controls:
    - "tenant.home_cell and tenant.dr_cell must both include hipaa-certified"
    - "PHI analytics exports require de-identification attestation before non-HIPAA cell egress"
    - "cross-pack PHI to PCI-only tenants is denied unless de-identified"
required_encryption:
  at_rest_level: "FIPS 140-3 Level 3 HSM-backed envelope encryption"
  ciphers:
    - "AES-256-GCM"
    - "AES-256-XTS"
    - "HKDF-SHA-384"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "CloudHSM FIPS 140-3 Level 3 or managed-HSM equivalent"
    byok_required: true
    rotation: "P90D data-encryption-key rotation; P1Y key-encryption-key rotation"
    break_glass_key_access: "dual-control with PhiKeyAccess audit event"
required_consent_capture:
  flows:
    - flow_id: "hipaa-treatment-payment-operations-notice"
      ui_string: "I acknowledge the HIPAA Notice of Privacy Practices for treatment, payment, and healthcare operations."
      retention: "P6Y after last effective notice acknowledgement"
    - flow_id: "hipaa-authorization-disclosure"
      ui_string: "I authorize this specific disclosure of protected health information."
      retention: "P6Y after authorization expiration or revocation"
    - flow_id: "hipaa-research-authorization"
      ui_string: "I authorize use of my health information for the named research purpose."
      retention: "P6Y after study closure"
    - flow_id: "hipaa-break-glass-attestation"
      ui_string: "I attest this emergency access is necessary to prevent serious harm."
      retention: "P6Y after emergency access event"
required_dlp_rules:
  - "dlp.phi.icd10-code"
  - "dlp.phi.cpt-code"
  - "dlp.phi.mrn"
  - "dlp.phi.npi"
  - "dlp.phi.rx-number"
  - "dlp.phi.dob-plus-name"
  - "dlp.phi.lab-result"
  - "dlp.phi.dicom-header"
  - "dlp.phi.fhir-resource"
required_audit_retention:
  - audit_class: "PhiAccessPermitted"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "PhiAccessDenied"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
  - audit_class: "EmergencyPhiBreakGlassUsed"
    hot: "P90D"
    warm: "P2Y"
    cold: "P6Y"
  - audit_class: "HipaaBreachRegulatorNoticeExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P6Y"
  - audit_class: "BusinessAssociateAgreementAttached"
    hot: "P30D"
    warm: "P1Y"
    cold: "P6Y"
conflict_with_other_packs:
  - pack_id: "CN-PIPL-2021-CIIO"
    reason: "PHI cannot be placed in mainland-China-only CIIO cells without separate legal basis and de-identification"
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "HIPAA pack requires regulated PHI controls and cannot run in synthetic-only demo cells"
gracefully_combines_with_other_packs:
  - "SOC2-TYPE-II-2024"
  - "GDPR-2016-EU"
  - "KR-PIPA-17799"
  - "EU-AI-ACT-2024-HIGH-RISK"
  - "EU-CSRD-2022"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/HIPAA-2024-US/evidence-exports/hhs-ocr"
  file_format: "ZIP containing JSONL audit chain, PDF control narrative, CSV disclosure accounting, and COSE_Sign1 manifest"
  cadence: "quarterly and on regulator pull"
  signing_key: "compliance-office:hipaa-2024-us:v1"
