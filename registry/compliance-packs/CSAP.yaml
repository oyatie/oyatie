pack_id: "CSAP-KR-2024"
pack_name: "Cloud Security Assurance Program compliance pack - Republic of Korea KISA and Ministry of Science and ICT"
version:
  source_framework_version: "KISA Cloud Security Assurance Program public-sector cloud certification baseline"
  manifest_version: "1.0.0"
  pack_release: "2026.05.20-w1"
citing_authority_url: "https://isms.kisa.or.kr/main/csap/intro/index.jsp"
effective_date:
  source_effective_date: "Cloud Computing Development and User Protection Act Article 23-2 certification program"
  manifest_effective_date: "2026-05-20"
compliance_scope:
  jurisdiction: "Republic of Korea public-sector cloud"
  certification_scope:
    - "public-sector-cloud-service"
    - "cloud-service-provider"
    - "IaaS"
    - "PaaS"
    - "SaaS"
  data_classes:
    - "KR_PUBLIC_SECTOR_DATA"
    - "KR_ADMINISTRATIVE_DATA"
    - "KR_CLOUD_SECURITY_EVIDENCE"
    - "KR_CLOUD_ACCESS_LOG"
    - "KR_CLOUD_SYSTEM_CONFIG"
    - "KR_CLOUD_VULNERABILITY_RECORD"
    - "KR_CLOUD_INCIDENT_RECORD"
    - "KR_CLOUD_BACKUP_RECORD"
    - "KR_CLOUD_CHANGE_RECORD"
    - "KR_CLOUD_CERTIFICATION_EVIDENCE"
  microservices:
    - "tenancy"
    - "identity"
    - "policy-engine"
    - "audit-chain"
    - "observability"
    - "residency"
    - "cloud-region"
    - "cloud-iam"
    - "cloud-kms"
    - "cloud-network-vpc"
    - "cloud-network-lb"
    - "cloud-storage-object"
    - "cloud-compute-k8s"
    - "workflow-engine"
    - "control-center"
activated_cedar_policies:
  - "pack/CSAP-KR-2024/v1.0.0/kr-public-sector-cell-required"
  - "pack/CSAP-KR-2024/v1.0.0/admin-access-mfa-required"
  - "pack/CSAP-KR-2024/v1.0.0/management-plane-kr-residency"
  - "pack/CSAP-KR-2024/v1.0.0/cloud-asset-inventory-required"
  - "pack/CSAP-KR-2024/v1.0.0/vulnerability-remediation-sla"
  - "pack/CSAP-KR-2024/v1.0.0/security-log-collection-required"
  - "pack/CSAP-KR-2024/v1.0.0/backup-dr-drill-required"
  - "pack/CSAP-KR-2024/v1.0.0/change-approval-required"
  - "pack/CSAP-KR-2024/v1.0.0/subcontractor-approval-required"
  - "pack/CSAP-KR-2024/v1.0.0/kisa-evidence-export"
  - "pack/CSAP-KR-2024/v1.0.0/tenant-public-sector-boundary"
  - "pack/CSAP-KR-2024/v1.0.0/security-incident-escalation"
activated_audit_events:
  - event_class: "CompliancePackInstalled"
    adr_0263_anchor: "pack activation state change"
  - event_class: "CsapCellCertificationVerified"
    adr_0263_anchor: "cell certification event"
  - event_class: "CsapAdminAccessReviewed"
    adr_0263_anchor: "access review event"
  - event_class: "CsapCloudAssetInventorySealed"
    adr_0263_anchor: "configuration evidence event"
  - event_class: "CsapVulnerabilityRemediationRecorded"
    adr_0263_anchor: "security operations event"
  - event_class: "CsapSecurityLogExported"
    adr_0263_anchor: "audit evidence event"
  - event_class: "CsapBackupDrillCompleted"
    adr_0263_anchor: "DR evidence event"
  - event_class: "CsapChangeApprovalSealed"
    adr_0263_anchor: "change-management event"
  - event_class: "CsapSubcontractorApprovalRecorded"
    adr_0263_anchor: "third-party event"
  - event_class: "CsapKisaEvidenceExported"
    adr_0263_anchor: "regulator evidence event"
  - event_class: "CsapIncidentEscalated"
    adr_0263_anchor: "incident event"
required_slo_overrides:
  - slo_id: "csap-critical-vulnerability-remediation"
    baseline: "critical-vulnerability-remediation p99 <= P14D"
    override: "critical-vulnerability-remediation p99 <= P3D"
    citation: "KISA CSAP security management controls"
  - slo_id: "csap-security-log-export"
    baseline: "security-log-export p99 <= PT1H"
    override: "security-log-export p99 <= PT5M"
    citation: "Cloud Computing Act Article 23-2 certification evidence"
  - slo_id: "csap-admin-access-review"
    baseline: "privileged-access-review p99 <= P30D"
    override: "privileged-access-review p99 <= P7D"
    citation: "CSAP access-control audit controls"
  - slo_id: "csap-backup-drill"
    baseline: "dr-drill evidence p99 <= P90D"
    override: "DR drill evidence p99 <= P30D"
    citation: "CSAP availability and continuity controls"
  - slo_id: "csap-regulator-export"
    baseline: "regulator-export p99 <= P7D"
    override: "KISA evidence export p99 <= P1D"
    citation: "KISA CSAP assessment evidence"
required_data_residency:
  must_stay_in_regions:
    - "kr-public-sector-primary-cell"
    - "kr-public-sector-dr-cell"
    - "kr-csap-evidence-cell"
  must_not_cross_to_regions:
    - "non-kr-management-plane"
    - "global-analytics-cell"
    - "third-country-support-cell-without-approval"
    - "developer-laptop"
  residency_controls:
    - "public-sector tenant control-plane metadata remains in KR cells"
    - "support access from outside KR requires explicit public-sector tenant approval and CsapAdminAccessReviewed event"
    - "cloud asset inventory exports are regulator scoped and redacted by tenant"
required_encryption:
  at_rest_level: "KR region-pinned encryption with HSM-backed control-plane keys"
  ciphers:
    - "AES-256-GCM"
    - "ARIA-256-GCM where public-sector profile requires domestic cipher allowance"
    - "SHA-256 evidence digest"
  in_transit:
    - "TLS 1.3"
    - "mTLS with SPIFFE SVID"
  key_management:
    hsm_tier: "KR public-sector certified HSM or managed HSM tier"
    byok_required: true
    rotation: "P90D data-encryption-key rotation; P1Y root-key ceremony"
    administrator_access: "dual-control approval for key-admin operations"
required_consent_capture:
  flows:
    - flow_id: "csap-public-sector-tenant-certification-ack"
      ui_string: "I acknowledge this tenant must run only in CSAP-certified Korean public-sector cells."
      retention: "P7Y after tenant offboarding"
    - flow_id: "csap-support-access-approval"
      ui_string: "I approve the named support access for this Korean public-sector tenant."
      retention: "P7Y after access closure"
    - flow_id: "csap-subcontractor-approval"
      ui_string: "I approve the listed subcontractor for this certified cloud service scope."
      retention: "P7Y after subcontractor removal"
    - flow_id: "csap-evidence-export-approval"
      ui_string: "I authorize this KISA CSAP evidence export for the selected assessment period."
      retention: "P7Y after assessment closure"
required_dlp_rules:
  - "dlp.csap.public-sector-identifier"
  - "dlp.csap.cloud-config-secret"
  - "dlp.csap.admin-access-log"
  - "dlp.csap.vulnerability-record"
  - "dlp.csap.kisa-evidence"
  - "dlp.csap.network-topology"
  - "dlp.csap.backup-manifest"
  - "dlp.csap.subcontractor-record"
required_audit_retention:
  - audit_class: "CsapCellCertificationVerified"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "CsapAdminAccessReviewed"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "CsapSecurityLogExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "CsapBackupDrillCompleted"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
  - audit_class: "CsapKisaEvidenceExported"
    hot: "P90D"
    warm: "P2Y"
    cold: "P7Y"
conflict_with_other_packs:
  - pack_id: "UNRESTRICTED-GLOBAL-ANALYTICS"
    reason: "CSAP public-sector data cannot use unrestricted global analytics cells"
  - pack_id: "PUBLIC-DEMO-SYNTHETIC-ONLY"
    reason: "CSAP requires certified operational evidence, not demo-only controls"
gracefully_combines_with_other_packs:
  - "KR-PIPA-17799"
  - "SOC2-TYPE-II-2024"
  - "PCI-DSS-v4.0.1"
  - "EU-CSRD-2022"
regulator_evidence_export_format:
  endpoint: "/api/compliance-packs/CSAP-KR-2024/evidence-exports/kisa"
  file_format: "ZIP containing JSONL audit chain, asset inventory CSV, vulnerability remediation CSV, network diagram JSON, PDF/A control statement, and JWS manifest"
  cadence: "monthly internal refresh, annual certification renewal, and on KISA assessment pull"
  signing_key: "compliance-office:csap-kr-2024:v1"
references:
