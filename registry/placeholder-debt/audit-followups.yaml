# PR-143 µservice template audit — queued follow-ups (2026-05-18)
#
# Concrete tracked items for HARD-but-too-large-to-inline-fix violations and
# SOFT violations found in the 33-µservice template audit. Each item names the
# canonical ADR it conforms to, the affected packs, the fix shape, and the
# trigger criterion that promotes it from queued to in-flight.
#
# Schema mirrors adr-follow-ups.yaml:
#   id: kebab-case slug
#   intent: one-line summary of the fix
#   canonical_adr: the ADR(s) the fix conforms to
#   affected_packs: list of µservices touched by the fix
#   fix_shape: structural | text-only | hybrid
#   scope_estimate: rough effort (S/M/L/XL)
#   owner: council or axis that owns the migration IP
#   trigger: precondition that promotes the item to in-flight
#   status: queued | drafting | in-flight | landed
#   landed_pr: filled in when the migration PR lands
#
# Provenance: evidence/pr-143-existing-microservice-template-audit-report.json

version: 1

follow_ups:
  - id: redis-to-valkey-migration
    intent: >-
      Rename every Redis 7.x reference across the 26 affected µservice packs to
      Valkey 8.1; rename IP-NNN-redis-* files; rename catalog entries
      `oya-*-adapter-redis` to `-adapter-valkey`; update helm chart values
      (image tag 7.2.4 → valkey/valkey:8.1.x); update manifest.json IP ids;
      update cross-µservice citations.
    canonical_adr: ADR-0184
    affected_packs:
      - anonymous
      - application
      - audit-chain
      - calendar
      - cell
      - cloud-iac
      - community
      - docs
      - drive
      - forms
      - foundry
      - mail
      - meet
      - messenger
      - network
      - notes
      - observability
      - recordings
      - sheets
      - shorts
      - sites
      - slides
      - social
      - tasks
      - translate
      - workflow-engine
      - workflow-studio
    fix_shape: structural
    scope_estimate: XL
    owner: axis-shared-storage
    trigger: ADR-0184 acceptance landed (2026-05-18); migration IP must precede
      any per-µservice promotion past dev that touches Tier 3 cache.
    status: partial-landed
    landed_pr: pr-143
    notes: |-
      Total occurrence count: 1,328 across 26 packs (foundry alone: 327 hits).
      Cannot be text-replaced naively because IP file names, manifest IP ids,
      crate names in catalog/*.yaml, and helm chart filenames carry "redis" as
      a structural token. Plan: one migration IP per affected pack, sequenced
      after foundry (largest blast radius); a single coordinator IP defines
      the canonical Valkey 8.1 Helm chart pattern at
      microservices/cloud-iac/iac/helm/valkey/ and the canonical Cargo crate
      shape oya-shared-tier3-cache-{kernel,adapter-valkey}.

      2026-05-18 PR-143 sweep: prose / config-value / version-pin migration
      LANDED (474 files first pass + 118 second pass; 2,374 line changes);
      idempotency verified (third run = 0 changes). 117 mid-sweep regressions
      ('Valkey wire-compat' corruption) caught and repaired (230 occurrences
      restored to 'Redis wire-compat'). REMAINING: 143 in-scope occurrences
      that are BNF-identifier-protected crate names + filenames + manifest IP
      ids (see new entry F-PR143-VALKEY-CRATE-RENAME below). See full report
      at evidence/pr-143-structural-migration-report.json.

  - id: minio-to-seaweedfs-migration
    intent: >-
      Remove MinIO from the canonical object-storage adapter list and helm
      manifests; the kernel port stays the same but the adapter list collapses
      to SeaweedFS (primary) and Ceph RGW (scale-up); MinIO retained only as
      an external-target reference in adapters that need S3-compat parity
      testing.
    canonical_adr: ADR-0196
    affected_packs:
      - drive
      - foundry
      - cloud-k8s
      - shorts
    fix_shape: hybrid
    scope_estimate: M
    owner: axis-shared-storage
    trigger: ADR-0196 accepted (2026-05-18); drive µservice is the canonical
      consumer and must lead.
    status: partial-landed
    landed_pr: pr-143
    notes: |-
      Total occurrence count: 69 across 4 packs (drive: 21). MinIO Client (mc)
      can stay as an S3 CLI compat-testing tool; MinIO server cannot ship.

      2026-05-18 PR-143 sweep: product-name + Docker-image + Helm-chart
      references LANDED (38 files; 122 line changes); idempotency verified.
      REMAINING: 18 in-scope occurrences of `minio:` as a YAML/Helm values key
      mandated by the upstream Bitnami chart schema (see new entry
      F-PR143-SEAWEEDFS-HELM-KEY-RENAME). Bitnami → seaweedfs chart switch is
      the gating dependency for the rest.

