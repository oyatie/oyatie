    status: partial-landed
    landed_pr: pr-143
    notes: |-
      Total occurrence count: 5 active CLI invocations across 3 packs. File
      rename is mechanical; CI runner image update is the gating dependency.

      2026-05-18 PR-143 sweep: terraform CLI commands + 'Terraform plan/state/
      refresh' prose LANDED (66 files; 104 line changes); idempotency verified.
      Competitor-parity matrix rows (Atlantis / Spacelift / Pulumi / 'fork of
