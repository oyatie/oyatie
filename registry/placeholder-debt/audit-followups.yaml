  - id: F-PR143-VALKEY-CRATE-RENAME
    intent: >-
      Rename the residual 143 in-scope occurrences of `*-adapter-redis` crate
      names + `IP-NNN-redis-*.md` filenames + `redis-failover.md` runbooks +
      manifest.json IP ids + AUDIT-FINDINGS-*.json cross-references to the
      Valkey-suffixed canonical shape (or KEEP `*-adapter-redis` as a
      protocol-name aligned with redis-rs and document the decision).
    canonical_adr: ADR-0184
    affected_packs:
      - anonymous
      - workflow-engine
      - tasks
      - foundry
      - calendar
      - audit-chain
      - mail
    fix_shape: structural
    scope_estimate: L
    owner: council-architecture
    trigger: ADR-grade decision needed on the canonical crate-name suffix
      (-adapter-redis vs -adapter-valkey) since the crate speaks the Redis wire
      protocol regardless of which server (Redis vs Valkey) it connects to.
    status: queued
    landed_pr: null
    notes: |-
      Emitted from PR-143 structural-migration sweep (2026-05-18). Cannot be
      blind-renamed because (a) crate names are BNF-identifier-conformant and
      cross-referenced everywhere, (b) renaming requires full git-mv chain +
      IP renumbering, (c) redis-rs the Rust crate is wire-protocol-named so
      `-adapter-redis` is arguably the correct long-term suffix. See report at
      evidence/pr-143-structural-migration-report.json §categories.redis_to_
      valkey.flagged_for_followup.

