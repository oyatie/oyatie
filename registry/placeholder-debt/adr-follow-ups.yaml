  - id: cloud-intelligence-internaldogfood-bypass-removal
    intent: |
      Document the removal of the implicit InternalDogfood escape clause from
      the cloud-intelligence Cedar policy (LANE-1 hardening 2026-05-28). The previous
      bypass shorted forbid rules for any principal in Role::"InternalDogfood";
      that is incompatible with default-deny forbid-wins semantics required by
      ADR-0183. Existing dogfood principals must be migrated to explicit Role
      bindings (admin / ingress_proxy / audit). If a dogfood principal still
      hits Forbidden after this PR, that surfaces as a typed auth failure
      rather than a silent allow.
    driver_docs:
      - microservices/cloud-intelligence/policy/cloud-intelligence.cedar
    owner: council-architecture + axis-cloud-intelligence
    trigger: First dogfood principal hits a Forbidden response on a route that previously worked.
    status: pending
    adr_when_landed: ""
