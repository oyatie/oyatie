# ADR follow-up tracker
#
# Concrete, tracked references for ADRs that will be authored in the future.
# Replaces ad-hoc `ADR-NNNN-<slug>` and `ADR-XXXX` placeholders scattered
# across PRDs / runbooks / standards. Each entry pins a stable id so doc
# refs can be resolved without a real ADR file existing yet.
#
# Schema:
#   id: stable kebab-case slug, e.g. "personal-mail-key-recovery"
#   intent: one-line summary of the decision the ADR will codify
#   driver_docs: list of doc paths that cite this follow-up
#   owner: council or axis that drafts the ADR when the trigger fires
#   trigger: precondition that must hold before the ADR is authored
#   status: pending | drafting | accepted (transitions to accepted when the
#           real ADR-NNNN lands and is back-linked here)
#   adr_when_landed: filled in when the real ADR is authored
#
# Sigil convention (per docs/governance-lanes/adr-citation.md): in active text,
# unresolved future ADRs are cited as `registry/placeholder-debt/adr-follow-ups.yaml#<id>`
# rather than the legacy `ADR-NNNN-<slug>` pattern. Template files use the
# `ADR-####` sigil as the schema marker for "fill in a real ADR id here".
version: 1

