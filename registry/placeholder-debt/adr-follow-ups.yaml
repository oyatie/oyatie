  # ADR-0145 enforcement skeleton follow-ups
  # ----------------------------------------
  # PR #143 (2026-05-18) landed five enforcement skeleton crates as part
  # of the ADR-0145 hyperscaler-shape reform. Each crate ships a trait
  # surface + advisory-mode evaluation; the strict-mode / production
  # impl lands per the trigger below. While the skeletons are in place
  # the three check-crates run in DEFERRED (advisory) mode in
  # `oya gate run-all`.

  - id: adr-0145-audit-client-impl
    intent: |
      Production implementation of `oya-shared-audit-chain-client-kernel`
      — wires every µservice's calling site to the audit-chain µservice's
      canonical gRPC seal surface. Replaces the skeleton's
      `SkeletonAuditChainClient::emit_seal` returning
      `SkeletonNotYetImplemented`.
    driver_docs:
      - docs/decisions/ADR-0145-inter-microservice-communication-reform.md
      - crates/oya-shared-audit-chain-client-kernel/src/lib.rs
    owner: council-architecture + axis-audit-chain
    trigger: |
      First µservice past skeleton phase requires real seal emission
      OR `oya gate validate audit-chain-seal-coverage` promoted from
      advisory to strict mode.
    status: pending

  - id: adr-0145-tracing-client-impl
    intent: |
      Production implementation of `oya-shared-tracing-client-kernel` —
      W3C Trace Context injection/extraction via OpenTelemetry SDK +
      Hubble OTel exporter (Cilium mesh) integration; Tier-2 namespaces
      additionally integrate Istio Ambient telemetry. Replaces the
      skeleton's `SkeletonTracingClient` `unimplemented`-equivalent path.
    driver_docs:
      - docs/decisions/ADR-0145-inter-microservice-communication-reform.md
      - docs/decisions/ADR-0148-service-mesh-cilium.md
      - crates/oya-shared-tracing-client-kernel/src/lib.rs
    owner: council-architecture + axis-observability
    trigger: |
      First µservice past skeleton phase requires real trace propagation
      OR Cilium + Hubble LTS pin lands in `registry/lts-pins.yaml`.
    status: pending

  - id: adr-0145-otel-propagation-validator
    intent: |
      Strict-mode parser for `oya-check-otel-trace-propagation`. The
      current crate ships only `validate_advisory`; strict mode requires
      a Rust-syntax parser that walks every `crates/oya-*-adapter-grpc-*`
      crate and asserts W3C traceparent injection on every outbound
      gRPC call. Replaces the kernel's `validate_strict` `unimplemented!`.
    driver_docs:
      - docs/decisions/ADR-0145-inter-microservice-communication-reform.md
      - crates/oya-check-otel-trace-propagation/src/lib.rs
    owner: council-architecture + axis-observability
    trigger: |
      ≥ 80% of µservices integrate the tracing client kernel AND advisory
      mode surfaces < 10 findings on `oya gate validate otel-trace-propagation`.
    status: pending

  - id: adr-0145-ontology-projection-validator
    intent: |
      Strict-mode parser for `oya-check-ontology-projection-coverage`.
      The current crate ships only `validate_advisory` with tolerant
      JSON string-match; strict mode requires a real JSON parser that
      cross-checks `manifest.json#ontology_projections` against
      `registry/ontology/entities.json`. Replaces `validate_strict`
      `unimplemented!`.
    driver_docs:
      - docs/decisions/ADR-0145-inter-microservice-communication-reform.md
      - specs/microservices/manifest-schema.json
      - crates/oya-check-ontology-projection-coverage/src/lib.rs
    owner: council-architecture + axis-ontology
    trigger: |
      `registry/ontology/entities.json` reaches authority-source GA
      AND ≥ 80% of canonical-entity-owning µservices declare projections.
    status: pending

  - id: adr-0145-audit-chain-seal-validator
    intent: |
      Strict-mode parser for `oya-check-audit-chain-seal-coverage`. The
      current crate inspects `manifest.json#audit_chain.seal_events`;
      strict mode requires source-level proof that every capability
      with `eu_ai_act_risk_class != "none"` AND with state-changing
      verbs emits a seal at its calling site. Replaces `validate_strict`
      `unimplemented!`.
    driver_docs:
      - docs/decisions/ADR-0145-inter-microservice-communication-reform.md
      - crates/oya-check-audit-chain-seal-coverage/src/lib.rs
    owner: council-architecture + axis-audit-chain
    trigger: |
      `adr-0145-audit-client-impl` lands AND ≥ 80% of µservices integrate
      the audit-chain client kernel.
    status: pending

