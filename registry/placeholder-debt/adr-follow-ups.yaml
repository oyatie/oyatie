  # PR #143 close-out 2026-05-18 — Vendor-lockin trait-path annotation handling.
  - id: adr-0173-vendor-lockin-trait-path-annotation-handling
    intent: |
      PR #143 close-out surfaced multiple registry entries where
      seam_adapter_trait values include parenthetical annotations like
      `crates/oya-edge-cdn-kernel (not yet created — would be created
      on adoption)`. The validator at crates/oya-dev-cli/src/lib.rs:1164-1176
      strips no annotations on the trait field (only impls strip
      whitespace-delimited trailing parentheticals). Doctrine choices:
      (a) align validator to strip parentheticals on trait field
      symmetrically with impls, (b) require registry entries to use a
      separate `notes` field instead of inline annotation, (c) treat
      parenthetical-annotated trait paths as Tier-pre-classified
      exemption (no resolution required). Pre-existing entries that
      hit this: cloudflare-cdn (line 521, 533), potentially others.
      Inline fix deferred to PR-144 because the choice is doctrinal.
    driver_docs:
      - registry/vendor-lockin-phaseout/index.json
      - crates/oya-dev-cli/src/lib.rs
      - docs/decisions/ADR-0173-vendor-lockin-discipline.md
    owner: council-architecture + axis-foundry
    trigger: |
      Doctrine decision on (a) / (b) / (c) above; then either align
      validator or sweep registry entries.
    status: pending

  # PR #143 close-out 2026-05-18 — Workspace manifest parser hardening.
  - id: workspace-manifest-parser-comment-handling
    intent: |
      Replace the naive `,`-split workspace member parser at
      crates/oya-dev-cli/src/workspace_manifest.rs:21-52 with a proper
      TOML parser (toml crate, kernel-tier exempt). Current implementation
      silently corrupts the members array when an inline comment appears
      between entries: the comment collapses with the next quoted entry,
      yielding a non-empty path that includes the comment text + opening
      quote. PR #143 close-out 2026-05-18 hit this when adding a comment
      above the new `oya-collab-crdt-portability-kernel` member; the
      vendor-lockin-discipline gate failed even though the entry existed
      because the parser saw a malformed path. Inline fix removed the
      comment; structural fix is to use the toml crate.
    driver_docs:
      - crates/oya-dev-cli/src/workspace_manifest.rs
      - Cargo.toml
    owner: axis-foundry + council-quality
    trigger: |
      Workspace manifest authoring is sensitive enough that the parser
      must accept TOML comments without silently corrupting the members
      list. Promote to BLOCKER once a follow-up PR replaces the naive
      parser with toml-rs (or a hand-rolled comment-aware parser).
    status: pending

