context: cloud-intelligence
role: adapter
capability: llm-oauth-subscription-pool-eventsink-valkey-stream
plane: data
slo: preview-data-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  changeset: CS-CLOUD-INTELLIGENCE-WIRE-REAL-ADAPTERS-001
  source_adrs: [ADR-0105, ADR-0131, ADR-0384]
non_claims:
  - implements EventSink from intelligence-kernel; emits LlmGatewayEvent to Valkey Stream cloud-intelligence-receipts:<tenant_id> via XADD (one stream per tenant)
  - emit is best-effort — failures are logged via tracing::warn and swallowed per D6 non-fatal contract; errors never propagate to the request path
  - no consumer-group management or MAXLEN trimming (Stage-8 follow-up)
  - no automatic reconnect beyond what the redis crate provides on the established connection
  - no TLS client-certificate authentication; operator supplies rediss:// URL for TLS; mTLS deferred
  - no per-message acknowledgement or delivery guarantee (at-most-once; Valkey stream durability is operator-configured)
