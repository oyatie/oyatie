context: build
role: kernel
capability: adr-citation-closure
plane: control
slo: cataloged-no-runtime-claim
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  source_crate: governance/check/adr-citation-closure/Cargo.toml
non_claims:
  - checks citation MEANING against the supersession closure, never that a path resolves; a valid path to an existing file is exactly the defect class this gate exists to catch
  - parses only the top-level status/supersedes/superseded_by frontmatter keys; ADR bodies mention ids constantly and are deliberately not read
  - attributes a citation to the ADRs named on its own line only, so a subject stated on an adjacent line or in an enclosing heading is not seen
  - shrink-only ratchet pinned by equality against frozen ceilings; it blocks new findings and forces repaired ones to lower the ceiling, but does not itself repair
