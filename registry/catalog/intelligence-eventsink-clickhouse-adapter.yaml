context: cloud-intelligence
role: adapter
capability: llm-oauth-subscription-pool-eventsink-clickhouse
plane: data
slo: preview-data-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  changeset: CS-CLOUD-INTELLIGENCE-WIRE-REAL-ADAPTERS-001
  source_adrs: [ADR-0105, ADR-0131, ADR-0193, ADR-0384]
non_claims:
  - implements EventSink from intelligence-kernel; INSERTs LlmGatewayEvent rows into cloud_intelligence_receipts table via shared-olap-clickhouse-adapter (ADR-0193)
  - emit is best-effort — failures are logged via tracing::warn and swallowed per D6 non-fatal contract; errors never propagate to the request path
  - no batching or coalescing of INSERT calls (Stage-8 follow-up)
  - no DDL bootstrap — the cloud_intelligence_receipts table must exist before the adapter is used; creation is an operator runbook item
  - no retry on transient ClickHouse errors
  - ClickHouse backend is plan-only (IP-003 deferred) — all CI tests pass against the deferred stub; live ClickHouse wiring is a Stage-8 item
