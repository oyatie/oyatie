context: shared
role: kernel
capability: cloud-ci-gitops-chart-license
plane: control
slo: preview-control-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  changeset: ADR-0706-D5-GITOPS-CHART-LICENSE-001
  source_crate: ci/facade/gitops-chart-license/Cargo.toml
non_claims:
  - resolves chart pulls structurally from infra/gitops/values.yaml and
    observability/iac/helm/*/Chart.yaml only; it does not run Helm or resolve a live
    Argo CD deployment, and it does not inspect container image licences separately from
    the chart that ships them
  - the plane a chart is assigned belongs to the policy DATA (gitops-chart-license-policy.json),
    reviewed per entry; this crate enforces the assignment, it does not decide it
