context: build
role: kernel
capability: integ-envelope
plane: control
slo: cataloged-no-runtime-claim
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  source_crate: governance/check/integ-envelope/Cargo.toml
non_claims:
  - judges integ/* heads ONLY; ADR-0711 Phase C (branch protection restricting dev PRs to integ/* and hotfix/*) is founder-paired and has not landed, so every non-integ head is deliberately out of scope
  - the per-PR containment check needs the PR head ref and changed-path list from the workflow context and is NOT wired into oya-ci-required here; what runs today is the authority's own structural validation
  - glob matching is prefix-shaped, not general; the authority's vocabulary is prefix/**, a bare prefix, or an exact path, and a general globber would accept patterns it never uses and silently redefine containment
  - reports a two-owner path as a defect rather than resolving it, because the authority itself calls that "a defect, not a choice"
  - the 17 pre-existing adjunct-claim overlaps are frozen shrink-only; this gate blocks NEW overlaps and forces released ones to lower the count, but does not itself release any claim
