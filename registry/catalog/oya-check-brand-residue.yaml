context: foundry
role: worker
capability: check-brand-residue
plane: control
slo: preview-control-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
# Forbidden / retired brand-token deny-list. Naming a token here is the
# deny-list itself (not residue). The brand-residue gate fails on any docs
# occurrence of an `executable: true` token (founder rule: a dropped brand must
# not come back up). SSOT for executable tokens is
# libs/oya-check-brand-residue/src/lib.rs::FORBIDDEN_BRAND_TOKENS.
forbidden_brand_tokens:
  - token: forgejo
    executable: true
    reason: "D-FORGE: Forgejo dropped; GitHub interim -> Sapling-inspired bespoke SCM."
  - token: foundry
    executable: false
    reason: "D-FOUNDRY-CLARIFY: tracked for the foundry-rename campaign. Not executable yet -- the docs corpus still carries live `foundry` references, so a substring gate would false-fail. Promote to executable once the corpus is cleared."
