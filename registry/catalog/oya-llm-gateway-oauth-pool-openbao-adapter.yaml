context: llm-gateway
role: adapter
capability: openbao-transit-envelope-encryption
plane: control
slo: preview-control-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: [SECRET]
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  changeset: CS-LLM-GATEWAY-OPENBAO-ADAPTER-D8-001
  source_adrs: [ADR-0105, ADR-0131, ADR-0181, ADR-0183, ADR-0384]
non_claims:
  - no automatic vault-token rotation (operator runs `vault token renew` or configures a token with a long TTL / periodic token; this adapter does not self-renew)
  - no DEK rotation (Transit key version rotation is a Stage-7 enhancement; current impl uses the current key version on every encrypt call)
  - no per-tenant Transit key isolation (single shared key for all tenants; per-tenant key isolation is a Stage-7 enhancement when >10 tenants are onboarded)
  - no KV-v2 versioned read (always reads the latest secret version; version pinning deferred to Stage-7)
  - no TLS client-certificate authentication (mTLS vault auth deferred; current auth model is vault token via X-Vault-Token header)
  - no token lease renewal or re-auth (operator responsibility per non_claims above)
