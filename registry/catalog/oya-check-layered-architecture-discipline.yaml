purpose: |
  Pure-fn kernel for the `oya gate validate layered-architecture-discipline`
  fitness lane. Enforces zero feature overlap across the layered hyperscaler
  architecture: Cilium L3/L4 vs Istio Ambient L7 (ADR-0148), gateway vs mesh
  (ADR-0182), Cedar vs Kyverno (ADR-0183), Valkey vs Memcached Tier-3 cache
  (ADR-0184). Rejects under-claimed mesh tiers and misplaced
  `north_south_only` declarations.
naming_justification: |
  oya-check-layered-architecture-discipline follows BNF v4.1:
  `oya-<topic:check>-<axis:layered-architecture-discipline>`.
