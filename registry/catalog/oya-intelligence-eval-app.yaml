non_claims:
  - composition root that wires the intelligence-eval vertical slice (kernel + domain + usecase + adapter + worker) into an end-to-end metadata-only dispatch use-case (`dispatch_eval_job`) that loads a queued `EvalWorkerJob`, resolves the next `EvalRunnerStatus`, drives the worker's deterministic validate -> usecase -> adapter -> retry/exhaust/deny progression, and sinks the resulting `EvalWorkerReceipt` + worker/usecase audit events
  - port surface for `EvalJobRepository` (TenantId, JobId → EvalWorkerJob), `EvalRunnerStatusSource` (per-dispatch EvalRunnerStatus), `EvalReceiptSink` (capture worker receipts), and `EvalAuditEventSink` (capture worker + usecase event streams), with in-memory reference adapters for tests + single-node bring-up
  - typed `HyperEvalRunnerStatusSource` scaffold that surfaces the `Unimplemented::HostedEvalRunnerDispatch` honest boundary today (no silent stub: hosted-runner dispatch returns a typed `RunnerStatusError` referencing `registry/placeholder-debt/adr-follow-ups.yaml#adr-0374-intelligence-eval-app-hosted-runner-dispatch`)
  - no production deployment, daemonized listener readiness, immutable `intel.eval.v1` audit-chain emission, hosted-runner credential resolution, per-tenant rate limiting / budget admission, cross-tenant eval aggregation, or REST/gRPC surface (the slice + this app are wired by sibling REST adapters downstream)
