# Forbidden / retired brand-token deny-list. Naming a token here is the
# deny-list itself (not residue). The brand-residue gate fails on any docs
# occurrence of an `executable: true` token (founder rule: a dropped brand must
# not come back up). SSOT for executable tokens is
# libs/check-brand-residue/src/lib.rs::FORBIDDEN_BRAND_TOKENS.
forbidden_brand_tokens:
  - token: forgejo
    executable: true
    reason: "D-FORGE: Forgejo dropped; GitHub interim -> Sapling-inspired bespoke SCM."
  - token: foundry
    executable: false
    reason: "D-FOUNDRY-CLARIFY: tracked for the foundry-rename campaign. Not executable yet -- the docs corpus still carries live `foundry` references, so a substring gate would false-fail. Promote to executable once the corpus is cleared."

# Machine-readable doctrine for historical Wave 15-ZB lane labels. These labels are
# audit-only doctrine aliases; they are NOT live lane-baseline expansion inputs.
# Active enforcement remains the per-PR brand-residue ratchet plus destination
# cloud-ci/ci Rust gate contexts.
historical_wave_15zb_audit_only_labels:
  status: audit_doctrine_only
  active_product_enforcement:
    - brand-residue
    - cloud-ci-rust-gate-contexts
    - presubmit
  prohibited_uses:
    - live_baseline_expansion
    - signoff_door_expansion
    - branch_protection_context_expansion
  labels:
    - governance-no-foundry-fitness-residue
    - governance-lane-prefix-vocabulary
    - governance-rename-inventory-presence
