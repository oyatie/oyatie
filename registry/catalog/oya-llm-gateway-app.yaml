non_claims:
  - composition root that mounts the OpenAI-canonical REST surface (`/v1/chat/completions`, `/v1/embeddings`, `/v1/models`) on top of the existing per-group reverse-proxy router and binds them on a TCP listener via hyper/axum only
  - upstream-transport seam (`UpstreamTransport` port) with a `hyper-util` legacy-client + `hyper-rustls` (ring crypto, webpki trust roots) adapter for production and an in-memory scripted adapter for tests
  - typed `GatewayConfigRepository` / `KeyMaterialRepository` ports with in-memory reference adapters and a binary-only OpenBao-backed key adapter that fails closed when `BAO_TOKEN` is absent (no plaintext provider key read from file/env)
  - no production deployment, daemonized listener readiness, Bedrock-shaped audit-chain emission, per-tenant rate limiting / budget admission, OpenBao secret-rotation, prompt/response body parsing or logging, or cloud provisioning claim
