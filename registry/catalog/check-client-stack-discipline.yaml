purpose: |
  Pure-fn kernel for the `oya gate validate client-stack-discipline` fitness
  lane. Enforces ADR-0185 native-per-platform client stack: SvelteKit (Phase
  1) → Leptos (Phase 2) on web (sequential not parallel); Swift+SwiftUI on
  Apple (no KMP klib imports); Kotlin+Compose+KMP on Android (Android-scope
  only); WinUI 3 on Windows; gtk4-rs + libadwaita on Linux. Banned:
  React/Vue/Flutter/Electron/Cordova/Tauri/Avalonia/MAUI.
naming_justification: |
  check-client-stack-discipline follows the ADR-0532/0533 de-branded grammar:
  `<group:check>-<axis:client-stack-discipline>`, matching its home at
  governance/check/client-stack-discipline. The former oya- BNF v4.1 form
  retired with the move out of libs/.
