context: cloud-intelligence
role: adapter
capability: openai-codex-oauth-subscription-adapter
plane: data
slo: preview-data-plane
data_classes_owned: [INTERNAL_ONLY]
operational_classes_owned: []
api_stability: preview
security_review: unreviewed
supply_chain: source-only
traceability:
  changeset: CS-CLOUD-INTELLIGENCE-CODEX-ADAPTER-001
  source_adrs: [ADR-0105, ADR-0131, ADR-0384]
non_claims:
  - cli_version is hard-coded as cli/0.27.0; operator must update the constant on every Codex CLI release that changes the User-Agent contract with chatgpt.com
  - data endpoint (/backend-api/codex/responses) is undocumented and reverse-engineered from auth2api/CLIProxyAPI; it may change without notice
  - no Anthropic compat layer (this adapter targets OpenAI Codex only; Anthropic is handled by intelligence-rest)
  - no automated browser OAuth flow; the operator manually obtains the refresh token from a logged-in ChatGPT browser session (Stage-6 deferred per ADR-0384 §v1-scope)
  - no Cedar policy evaluation (AuthzGate seam consumed from kernel; Cedar adapter lives in intelligence-authz-cedar-adapter)
  - no ClickHouse or Valkey Stream concrete adapter (trait-only seams; real adapter crates ship separately)
  - no real OpenBao transit client (refresh token storage deferred to intelligence-openbao-adapter follow-up PR)
  - no app composition crate (wiring deferred to intelligence-app)
  - no token TTL cache or upstream singleflight for Codex refresh (deferred to a follow-up PR once the session endpoint's token TTL behavior is confirmed)
  - Codex v1 scope only; no Cursor adapter work in this lane (per cloud-intelligence-reference-repo-audit memory: Cursor v3 / Codex v1)
