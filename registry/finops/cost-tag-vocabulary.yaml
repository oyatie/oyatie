# Canonical cost-center enum per ADR-0174.
# Adding a new center requires an ADR amendment.
authored: 2026-05-18
authority: ADR-0174
schema: /specs/finops-cost-attribution.json

cost_centers:
  cc-foundry-runtime:
    description: Foundry capability invocation runtime (compute + provider per-token cost)
    owner_team: axis-foundry
    p_and_l_account: COGS-FOUNDRY-RUNTIME
  cc-cloud-substrate:
    description: Per-cell cloud-IaC substrate spend (k8s + storage + network + secrets)
    owner_team: axis-cloud
    p_and_l_account: COGS-CLOUD-INFRA
  cc-workspace-runtime:
    description: Workspace µservice runtime (drive/mail/calendar/etc.)
    owner_team: axis-workspace
    p_and_l_account: COGS-WORKSPACE-RUNTIME
  cc-search-runtime:
    description: Search ranker, crawler, index storage
    owner_team: axis-search
    p_and_l_account: COGS-SEARCH-RUNTIME
  cc-ads-runtime:
    description: Ads auction, serve, attribution pipeline
    owner_team: axis-ads-analytics
    p_and_l_account: COGS-ADS-RUNTIME
  cc-saas-runtime:
    description: SaaS-vertical runtime (vertical pack µservices)
    owner_team: axis-saas
    p_and_l_account: COGS-SAAS-RUNTIME
  cc-vertical-runtime:
    description: Vertical-pack µservice runtime (healthcare / supply-chain / etc.)
    owner_team: axis-saas
    p_and_l_account: COGS-VERTICAL-RUNTIME
  cc-shared-infra:
    description: Cross-axis shared infrastructure (audit-chain, observability, tenancy, identity)
    owner_team: council-architecture
    p_and_l_account: COGS-SHARED-INFRA
  cc-ops-internal:
    description: Internal ops tooling (ops-portal, on-call, incident response)
    owner_team: ops-sre-reliability
    p_and_l_account: OPEX-OPS-INTERNAL
  cc-rd-internal:
    description: Internal R&D tooling (foundry dev clusters, evaluation harness internal use)
    owner_team: council-architecture
    p_and_l_account: OPEX-RD-INTERNAL
  cc-marketing-internal:
    description: Marketing site, developer-relations runtime
    owner_team: gtm-marketing
    p_and_l_account: OPEX-MARKETING
  cc-gtm-internal:
    description: GTM tooling (CRM integration, sales support)
    owner_team: gtm-sales-se
    p_and_l_account: OPEX-GTM
