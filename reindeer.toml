##
## Reindeer Config — Oyatie monorepo
##
## Buckifies third-party Cargo dependencies from the workspace Cargo.lock.
## Canonical regeneration: scripts/ci/regen-third-party.sh
##

# Workspace Cargo.toml (workspace root)
manifest_path = "Cargo.toml"

# A missing decision for any build script can truncate dependency traversal and
# leave a stale generated graph.  Every such script must therefore have an
# explicit fixup rather than merely producing a warning.
unresolved_fixup_error = true

# Output directory for generated BUCK rules
third_party_dir = "third-party"

# Inject standard Cargo package env vars into every generated rule.
# Several crates use env!("CARGO_PKG_VERSION_*") at compile time (ring, serde_derive,
# thiserror-impl, ref-cast-impl, aws-lc-sys, openssl-sys, and others). Rather than
# per-crate fixups, inject globally since Buck2's sandbox doesn't set these automatically.
cargo_env = [
    "CARGO_PKG_NAME",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
    "CARGO_MANIFEST_LINKS",
    "CARGO_MANIFEST_DIR",
]

[buck]
file_name = "BUCK"

# Macros that resolve reindeer rule names to actual Buck2 prelude rules
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""

generated_file_header = """
##
## @generated by reindeer — do not edit by hand.
## Canonical regeneration: `scripts/ci/regen-third-party.sh`.
## Bare `reindeer buckify` output is incomplete until the wrapper's fail-closed
## semantic overlay succeeds.
##
"""
