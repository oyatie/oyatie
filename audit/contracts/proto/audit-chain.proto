// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// audit-chain — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/audit-chain.yaml.
// Per Bominal ADR-0028 + ADR-0003.

syntax = "proto3";

package oya.audit_chain.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: AuditChain
// =========================================================================
//
// Authn: internal gRPC uses SPIFFE mTLS/TLS 1.3; public user-token auth belongs to REST/OpenAPI.
// Authz: Cedar policy server-side.
// Tenancy: per-request metadata "x-scope-orgid" = "tenant:<hashed-id>".
// Idempotency: every Emit RPC carries "idempotency-key" = ULID.

service AuditChain {
  rpc Emit(EmitRequest) returns (EmitReceipt);
  rpc GetProof(GetProofRequest) returns (ProofResponse);
  rpc Verify(VerifyRequest) returns (Verdict);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc RequestExport(ExportRequest) returns (ExportBundleHandle);
  rpc GetExportStatus(GetExportStatusRequest) returns (ExportBundleHandle);
  rpc GetSignedRoot(GetSignedRootRequest) returns (SignedRoot);
  rpc GetPublicKey(GetPublicKeyRequest) returns (PublicKeyRecord);

  // Server-streaming: subscribe to verification-failed events for this tenant.
  rpc SubscribeVerificationFailed(SubscribeVerificationFailedRequest)
      returns (stream VerificationFailedEvent);
}

// =========================================================================
// Common types
// =========================================================================

enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  DATA_CLASS_INTERNAL_ONLY = 1;
  DATA_CLASS_BEHAVIORAL_TENANT_PRODUCT = 2;
  DATA_CLASS_PII_IDENTIFYING = 3;
  DATA_CLASS_PII_QUASI_IDENTIFIER = 4;
  DATA_CLASS_SENSITIVE_PIPA_ART23 = 5;
  DATA_CLASS_PHI = 6;
  DATA_CLASS_AUDIT = 7;
  DATA_CLASS_SECRET = 8;
}

enum VerdictReason {
  VERDICT_REASON_UNSPECIFIED = 0;
  VERDICT_REASON_OK = 1;
  VERDICT_REASON_SIGNATURE_INVALID = 2;
  VERDICT_REASON_PROOF_INVALID = 3;
  VERDICT_REASON_ROOT_CHAIN_INVALID = 4;
  VERDICT_REASON_KEY_EPOCH_MISMATCH = 5;
  VERDICT_REASON_EVENT_NOT_FOUND = 6;
  VERDICT_REASON_PAYLOAD_REDACTED = 7;
}

enum AuditFramework {
  AUDIT_FRAMEWORK_UNSPECIFIED = 0;
  AUDIT_FRAMEWORK_SOC2 = 1;
  AUDIT_FRAMEWORK_ISO27001 = 2;
  AUDIT_FRAMEWORK_HIPAA = 3;
  AUDIT_FRAMEWORK_GDPR_DPA = 4;
  AUDIT_FRAMEWORK_KR_PIPC = 5;
  AUDIT_FRAMEWORK_APPI = 6;
  AUDIT_FRAMEWORK_PDPA = 7;
  AUDIT_FRAMEWORK_DPDPA = 8;
  AUDIT_FRAMEWORK_LGPD = 9;
  AUDIT_FRAMEWORK_UAE_PDPL = 10;
  AUDIT_FRAMEWORK_KSA_PDPL = 11;
  AUDIT_FRAMEWORK_INTERNAL = 100;
}

message Principal {
  string spiffe_id = 1;
  string human_id_hash = 2;
}

message AuditEvent {
  string tenant_id = 1;
  string source_microservice = 2;
  string event_class = 3;
  Principal principal = 4;
  bytes payload = 5;
  DataClass payload_data_class = 6;
  string pack = 7;
  google.protobuf.Timestamp emitted_at = 8;
  string subject_hash = 9;
  string entity_ref = 10;
}

message EmitReceipt {
  string event_id = 1;
  string period_id = 2;
  string pack = 3;
  string tenant_partition = 4;
  google.protobuf.Timestamp accepted_at = 5;
  bool sealed = 6;
}

message MerkleProof {
  uint64 leaf_index = 1;
  repeated string siblings = 2;
}

message SignedRoot {
  string pack = 1;
  string tenant_partition = 2;
  string period_id = 3;
  string root_hash = 4;
  string signature = 5;
  string signer_public_key_fp = 6;
  string prior_root_hash = 7;
  google.protobuf.Timestamp signed_at = 8;
}

message PublicKeyRecord {
  string pack = 1;
  string epoch_id = 2;
  string public_key = 3;
  string algorithm = 4;
  google.protobuf.Timestamp active_from = 5;
  google.protobuf.Timestamp active_to = 6;
}

// =========================================================================
// Request / response messages
// =========================================================================

message EmitRequest {
  AuditEvent event = 1;
  string idempotency_key = 2;
}

message GetProofRequest {
  string event_id = 1;
}

message ProofResponse {
  AuditEvent event = 1;
  MerkleProof proof = 2;
  SignedRoot signed_root = 3;
}

message VerifyRequest {
  AuditEvent event_envelope = 1;
  MerkleProof proof = 2;
  SignedRoot signed_root = 3;
}

message Verdict {
  bool verified = 1;
  VerdictReason reason = 2;
}

message QueryRequest {
  google.protobuf.Timestamp time_start = 1;
  google.protobuf.Timestamp time_end = 2;
  repeated string event_class_filter = 3;
  repeated string source_microservice_filter = 4;
  string entity_ref_filter = 5;
  string page_token = 6;
  uint32 limit = 7;
}

message QueryResponseEntry {
  string event_id = 1;
  string period_id = 2;
  bool sealed = 3;
  AuditEvent event = 4;
}

message QueryResponse {
  repeated QueryResponseEntry events = 1;
  string next_page_token = 2;
}

message ExportRequest {
  google.protobuf.Timestamp time_start = 1;
  google.protobuf.Timestamp time_end = 2;
  repeated string scoped_event_classes = 3;
  AuditFramework audit_framework = 4;
}

message ExportBundleHandle {
  string export_id = 1;
  string status = 2;  // pending | building | ready | failed
  string bundle_url = 3;
  string signature = 4;
}

message GetExportStatusRequest {
  string export_id = 1;
}

message GetSignedRootRequest {
  string pack = 1;
  string period_id = 2;
}

message GetPublicKeyRequest {
  string pack = 1;
  string epoch_id = 2;
}

message SubscribeVerificationFailedRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp since = 2;
}

message VerificationFailedEvent {
  string event_id = 1;
  string claimed_root_hash = 2;
  VerdictReason failure_reason = 3;
  google.protobuf.Timestamp requested_at = 4;
}
