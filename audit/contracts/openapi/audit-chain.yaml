openapi: 3.2.0
info:
  title: audit-chain
  version: 1.0.0
  summary: REST API for the audit-chain µservice — emit, verify, query, export
  description: |
    Internal-mesh + tenant-facing + auditor REST surface for audit-chain.
    Internal mesh callers authenticate via mTLS + SPIFFE; tenant + auditor
    callers via OIDC bearer + Cedar policy authorisation. All endpoints are
    tenant-scoped via X-Scope-OrgID convention from
    `audit/policy/tenant-scope.cedar`.

    Cross-cutting: OIDC bearer in `Authorization: Bearer <jwt>` (external).
    SPIFFE-bound mTLS for internal callers. X-Scope-OrgID for both.
  contact:
    name: axis-audit-chain
    url: https://oyatie.com/teams/axis-audit-chain
  license:
    name: Internal
servers:
  - url: https://audit-chain-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
        default: pack-kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: audit-chain
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    SPIFFEmTLS:
      type: mutualTLS
      description: SPIFFE-identity-bound mTLS for internal mesh callers
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: ulid
    EventId:
      in: path
      name: event_id
      required: true
      schema:
        type: string
        format: ulid
    Pack:
      in: path
      name: pack
      required: true
      schema:
        type: string
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
    PeriodId:
      in: path
      name: period_id
      required: true
      schema:
        type: string
  schemas:
    AuditEvent:
      type: object
      required: [tenant_id, source_microservice, event_class, payload, payload_data_class, emitted_at]
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        source_microservice: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        event_class: {type: string, description: dotted-namespaced event-type identifier e.g. 'oya.tenancy.tenant.onboarded'}
        principal:
          type: object
          properties:
            spiffe_id: {type: string}
            human_id_hash: {type: string, nullable: true}
        payload:
          type: object
          description: caller-redacted opaque payload; audit-chain treats as bytes
        payload_data_class:
          type: string
          enum: [INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PII_QUASI_IDENTIFIER, SENSITIVE_PIPA_ART23, PHI, AUDIT, SECRET]
        pack: {type: string}
        emitted_at: {type: string, format: date-time}
        subject_hash: {type: string, nullable: true, description: 'sha256(subject_canonical_id ++ pack_salt)[..16] when applicable'}
        entity_ref: {type: string, nullable: true, description: 'Ontology entity reference e.g. ObjectType.id'}
    EmitReceipt:
      type: object
      required: [event_id, period_id, pack, tenant_partition, accepted_at, sealed]
      properties:
        event_id: {type: string, format: ulid}
        period_id: {type: string}
        pack: {type: string}
        tenant_partition: {type: string}
        accepted_at: {type: string, format: date-time}
        sealed:
          type: boolean
          description: 'false at receipt time; tenant can poll verify endpoint for sealed status'
    MerkleProof:
      type: object
      required: [leaf_index, siblings]
      properties:
        leaf_index: {type: integer}
        siblings:
          type: array
          items: {type: string, description: 'hex-encoded sha256'}
    SignedRoot:
      type: object
      required: [pack, tenant_partition, period_id, root_hash, signature, signer_public_key_fp, prior_root_hash, signed_at]
      properties:
        pack: {type: string}
        tenant_partition: {type: string}
        period_id: {type: string}
        root_hash: {type: string}
        signature: {type: string, description: 'hex-encoded Ed25519 signature'}
        signer_public_key_fp: {type: string}
        prior_root_hash: {type: string}
        signed_at: {type: string, format: date-time}
    VerifyRequest:
      type: object
      required: [event_envelope, proof, signed_root]
      properties:
        event_envelope: {$ref: '#/components/schemas/AuditEvent'}
        proof: {$ref: '#/components/schemas/MerkleProof'}
        signed_root: {$ref: '#/components/schemas/SignedRoot'}
    Verdict:
      type: object
      required: [verified, reason]
      properties:
        verified: {type: boolean}
        reason:
          type: string
          enum: [ok, signature_invalid, proof_invalid, root_chain_invalid, key_epoch_mismatch, event_not_found, payload_redacted]
    QueryRequest:
      type: object
      properties:
        time_range:
          type: object
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        event_class_filter:
          type: array
          items: {type: string}
        source_microservice_filter:
          type: array
          items: {type: string}
        entity_ref_filter: {type: string}
        page_token: {type: string, nullable: true}
        limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
    QueryResult:
      type: object
      required: [events, next_page_token]
      properties:
        events:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AuditEvent'
              - type: object
                properties:
                  event_id: {type: string}
                  period_id: {type: string}
                  sealed: {type: boolean}
        next_page_token: {type: string, nullable: true}
    ExportRequest:
      type: object
      required: [time_range, scoped_event_classes, audit_framework]
      properties:
        time_range:
          type: object
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        scoped_event_classes:
          type: array
          items: {type: string}
        audit_framework:
          type: string
          enum: [soc2, iso27001, hipaa, gdpr-dpa, kr-pipc, appi, pdpa, dpdpa, lgpd, uae-pdpl, ksa-pdpl, internal]
        receiving_bucket_attestation:
          type: object
          nullable: true
          description: 'when present, tenant-controlled receiving bucket attestation'
    ExportBundleHandle:
      type: object
      required: [export_id, status, bundle_url, signature]
      properties:
        export_id: {type: string, format: ulid}
        status:
          type: string
          enum: [pending, building, ready, failed]
        bundle_url: {type: string, nullable: true}
        signature: {type: string, nullable: true}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []
  - SPIFFEmTLS: []

paths:
  /emit:
    post:
      summary: Emit an audit event (internal mesh callers)
      operationId: emitEvent
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditEvent'}
      responses:
        '202':
          description: Accepted (durable; sealing pending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmitReceipt'}
        '401': {description: SPIFFE identity invalid or X-Scope-OrgID mismatch}
        '403': {description: Cedar policy denied (e.g., cross-pack emission)}
        '409': {description: Idempotency-Key replay; existing receipt returned}
        '413': {description: Payload exceeds size limit}
        '422': {description: Schema validation failed (missing data_class)}

  /events/{event_id}/proof:
    get:
      summary: Read inclusion proof for an event
      operationId: getProof
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Proof returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: {$ref: '#/components/schemas/AuditEvent'}
                  proof: {$ref: '#/components/schemas/MerkleProof'}
                  signed_root: {$ref: '#/components/schemas/SignedRoot'}
        '404': {description: Event not yet sealed OR redacted}

  /verify:
    post:
      summary: Verify an event + proof + root + signature
      operationId: verifyEvent
      security: []
      description: 'Public + anonymous-rate-limited endpoint per policy/public-read.cedar'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyRequest'}
      responses:
        '200':
          description: Verdict returned (verified=true or false)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Verdict'}

  /query:
    post:
      summary: Tenant-scoped audit query
      operationId: queryEvents
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryResult'}

  /export:
    post:
      summary: Request an export bundle (tenant or auditor scope)
      operationId: requestExport
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202':
          description: Export accepted; handle returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportBundleHandle'}

  /export/{export_id}:
    get:
      summary: Poll export bundle status
      operationId: getExportStatus
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: export_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportBundleHandle'}

  /roots/{pack}/{period_id}:
    get:
      summary: Read a published signed root (public)
      operationId: getSignedRoot
      security: []
      parameters:
        - $ref: '#/components/parameters/Pack'
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: Signed root
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedRoot'}
        '404': {description: Period not yet sealed}

  /keys/{pack}/{epoch_id}:
    get:
      summary: Read a published public key (public)
      operationId: getPublicKey
      security: []
      parameters:
        - $ref: '#/components/parameters/Pack'
        - in: path
          name: epoch_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public key + epoch
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: {type: string}
                  epoch_id: {type: string}
                  public_key: {type: string}
                  algorithm: {type: string, enum: [Ed25519]}
                  active_from: {type: string, format: date-time}
                  active_to: {type: string, format: date-time, nullable: true}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres reachable + HSM session active)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
