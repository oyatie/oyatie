[package]
name = "audit-chain-domain"
edition.workspace = true
# Override workspace version per ADR-0083 amendment 2026-05-15:
# `append_classifications` returns `Result<&AuditEvent, AuditChainError>` —
# breaking-change versioned at 0.2.0.
version = "0.2.0"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
data-boundary-kernel = { path = "../../../data/core/boundary-kernel" }

[lib]
name = "audit_chain_domain"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
