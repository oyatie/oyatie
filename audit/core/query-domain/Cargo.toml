[package]
name = "audit-query-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Pure query validation, pagination-cursor codec, and auditor-engagement
# authorization gating for the audit-chain query path. Depends only on the
# audit-query-api port DTOs; see src/lib.rs for the full rule set and the
# audit/policy/*.cedar fragments it encodes.

[dependencies]
audit-query-api = { path = "../../ports/query-api" }

[lib]
name = "audit_query_domain"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
