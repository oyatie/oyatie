[package]
name = "audit-verification-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Pure (I/O-free) verifier: resolve key, verify signature, verify proof,
# walk prior root, reject cross-pack mixtures, report redaction honestly.
# Reuses audit-chain-domain's Ed25519 + RFC 6962 Merkle behavior directly;
# see src/lib.rs's crate doc for the full "what this crate owns" breakdown.

[dependencies]
audit-chain-domain = { path = "../chain-domain" }
audit-verification-api = { path = "../../ports/verification-api" }

[lib]
name = "audit_verification_domain"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
