[package]
name = "audit-sealing-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Merkle-root and inclusion-proof math is not reimplemented here: this crate
# wraps audit_chain_domain::MerkleTree (RFC 6962 ss2.1) behind the
# MerkleEngine port instead of re-deriving any hashing. See src/lib.rs's
# crate doc for the full "what this crate owns" breakdown.

[dependencies]
audit-chain-domain = { path = "../chain-domain" }
audit-sealing-kernel = { path = "../../ports/sealing-kernel" }

[lib]
name = "audit_sealing_domain"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
