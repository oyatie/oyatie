# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:audit-chain:verify-merkle:v1
name: verify-merkle
namespace: audit-chain
display_name: Verify Merkle Proof
description: |
  Given (event_envelope, claimed_proof, claimed_root, claimed_signature, claimed_period_id),
  return verified=true|false with structured reason. Pure function over published
  artefacts; offline-verifiable; no state mutation.

  Anonymous-allowed (rate-limited at WAF); tenant + auditor scopes have higher quotas.
  Reference implementation in oya-audit-chain-verification-sdk; open-source per sdk-plan.md.

owner_team: axis-audit-chain
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0131]
related_specs: [/specs/audit-chain-merkle-ed25519.json]
related_artifacts:
  - microservices/audit-chain/policy/seal-integrity.md §"SI-14"
  - audit/contracts/openapi/audit-chain.yaml /verify path
  - audit/policy/public-read.cedar

autonomy_tier: T0
# T0: pure-function; no state read of restricted data; no state write.

inputs:
  - name: event_envelope
    type: object
    required: true
  - name: proof
    type: object
    description: MerkleProof { leaf_index, siblings[] }
    required: true
  - name: signed_root
    type: object
    description: SignedRoot { root_hash, signature, signer_public_key_fp, prior_root_hash, period_id }
    required: true

outputs:
  - name: verified
    type: boolean
  - name: reason
    type: enum
    values: [ok, signature_invalid, proof_invalid, root_chain_invalid, key_epoch_mismatch, event_not_found, payload_redacted]

data_classes_touched: []
# Pure function over caller-supplied artifacts; no class touched.
# Note: the published root + public key channels are themselves AUDIT-class but
# verify() doesn't read tenant-attributable payloads.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.audit-chain.verification
# Every verify is audit-emitted to detect probing patterns; verified=false events
# additionally emit VerificationFailed per failure-modes.md FM-10.

cost_profile:
  type: per-call
  estimated_cost_usd_per_call: 0.000001
  cost_drivers:
    - Ed25519 verify (≤ 1ms)
    - Merkle proof walk O(log n) hash (≤ 1ms)
    - KeyResolver lookup (cached; ≤ 1ms)
    - Rate-limited at WAF (anonymous: 10 req/s per IP)

cedar_policy_fragments:
  - audit/policy/public-read.cedar
  - audit/policy/tenant-scope.cedar
  - audit/policy/auditor-scope.cedar

eval_set:
  golden_inputs_path: microservices/audit-chain/capabilities/eval/verify-merkle-golden.jsonl
  pass_threshold: 1.0
  eval_metric: verify-correctness-against-known-tamper-set
  cadence: per-release
  reference: |
    10k synthetic tampered EventEnvelope inputs; every mutation must classify
    verified=false. Property-based test in microservices/audit-chain/src/crates/
    oya-audit-chain-verification-domain/tests/.

sunset:
  status: none
  notes: ""
