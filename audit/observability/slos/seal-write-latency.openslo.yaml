# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-seal-write-latency
  displayName: "audit-chain: seal-write latency p99 ≤ 50ms"
  labels:
    microservice: audit-chain
    bounded_context: sealing
    sli_class: latency
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain
    pack_scope: all
    cross_cutting: "true"
spec:
  service: audit-chain
  description: |
    Seal-write latency p99 SLO. A seal write is "good" when the
    POST /seal → HSM-sign → Postgres-commit → S3-mirror path completes
    in ≤ 50ms p99. Every µservice's evidence-emission path includes a
    sync seal-write — tight latency budget is cross-cutting.
  indicator:
    metadata:
      name: audit-chain-seal-write-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_write_duration_seconds_bucket{le="0.05"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_write_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 50ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
