# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-chain-of-custody-integrity-correctness
  displayName: "audit-chain: chain-of-custody integrity correctness (100% — load-bearing)"
  labels:
    microservice: audit-chain
    bounded_context: verification
    sli_class: correctness
    tier: load-bearing-invariant
    plane: audit
    owner_team: axis-audit-chain + council-privacy
    pack_scope: all
    invariant: INV-AUDIT-CHAIN-CUSTODY
    compliance: [SOC2-CC7, ISO27001-A12.4, HIPAA-164.312b]
spec:
  service: audit-chain
  description: |
    Chain-of-custody integrity correctness SLO. A verification pass is "good"
    when every sealed batch's Ed25519 signature verifies AND every Merkle
    leaf's parent-hash chains back to a sealed root. Any failure = sealed
    evidence has been tampered (or sealing logic is broken). Per ADR-0028
    chain-of-custody + ADR-0030 Ed25519 signature scheme. Target = 100%
    (any miss is Sev-1 catastrophic compliance event).
  indicator:
    metadata:
      name: audit-chain-custody-integrity-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_custody_verify_total{outcome="intact"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_custody_verify_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% chain-of-custody integrity (no error budget; any tamper is Sev-1)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
