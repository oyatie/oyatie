# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
# Authoring authority: ADR-0130 agentic SLO-gated promotion + ADR-0139 per-µservice SLO authoring.
# CROSS-CUTTING: every µservice depends on seal-write availability for evidence emission.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-seal-write-availability
  displayName: "audit-chain: seal-write availability 99.99% (cross-cutting)"
  labels:
    microservice: audit-chain
    bounded_context: sealing
    sli_class: availability
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain
    pack_scope: all
    cross_cutting: "true"
spec:
  service: audit-chain
  description: |
    Seal-write availability SLO. A seal request is "good" when the sealing
    worker successfully appends the canonical Merkle-leaf to the per-tenant
    chain and returns durable-commit ack. Every µservice in oyatie depends
    on this surface for evidence emission — therefore tight target. Per
    ADR-0028 chain-of-custody requirement + cross-cutting bottleneck noted
    in performance review PERF-143-001.
  indicator:
    metadata:
      name: audit-chain-seal-write-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_write_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_write_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "30d rolling seal-write availability ≥ 99.99% (cross-cutting tight)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
