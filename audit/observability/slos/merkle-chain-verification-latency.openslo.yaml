# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-merkle-chain-verification-latency
  displayName: "audit-chain: Merkle chain verification latency p95 ≤ 200ms per batch"
  labels:
    microservice: audit-chain
    bounded_context: verification
    sli_class: latency
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain
    pack_scope: all
spec:
  service: audit-chain
  description: |
    Merkle chain verification latency p95 SLO. A verification is "good" when
    a per-batch (10k-leaf) chain-walk + Ed25519 signature re-check completes
    in ≤ 200ms p95. Required for eDiscovery + compliance reads. Per
    PRD §"Performance Targets" verification path.
  indicator:
    metadata:
      name: audit-chain-merkle-verification-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_merkle_verify_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_merkle_verify_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 200ms per 10k-leaf batch for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
