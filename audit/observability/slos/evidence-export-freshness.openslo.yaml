# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-evidence-export-freshness
  displayName: "audit-chain: evidence export freshness p95 ≤ 5 min"
  labels:
    microservice: audit-chain
    bounded_context: verification
    sli_class: freshness
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain + ops-compliance
    pack_scope: all
spec:
  service: audit-chain
  description: |
    Evidence export freshness SLO. An export request is "good" when the
    sealed-evidence bundle is sealed + zipped + signed within ≤ 5min p95
    for a 100k-event window. Required for compliance + incident-response.
    Per PRD §"Performance Targets" evidence-export path.
  indicator:
    metadata:
      name: audit-chain-evidence-export-freshness-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_evidence_export_duration_seconds_bucket{le="300"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_evidence_export_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 5 min for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
