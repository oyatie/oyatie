# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (audit-chain coherence audit 2026-05-20)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-seal-cycle-latency
  displayName: "audit-chain: seal-cycle latency p99 ≤ 1s"
  labels:
    microservice: audit-chain
    bounded_context: sealing
    sli_class: latency
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain
    pack_scope: all
    cross_cutting: "true"
spec:
  service: audit-chain
  description: |
    Seal-cycle latency p99 SLO. A seal cycle is "good" when an event accepted
    into a 1-second period receives a signed RFC 6962-shaped SHA-256 Merkle root
    within ≤ 1s p99. This closes the PRD/tenant_class/OpenSLO contract for
    the full emit-to-root path; seal-write latency remains the tighter storage
    sub-step SLO.
  indicator:
    metadata:
      name: audit-chain-seal-cycle-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_cycle_duration_seconds_bucket{le="1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_seal_cycle_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 1s for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
