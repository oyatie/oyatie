# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-seal-storage-availability
  displayName: "audit-chain: seal storage availability 99.99% (Postgres + S3)"
  labels:
    microservice: audit-chain
    bounded_context: sealing
    sli_class: availability
    tier: internal-substrate
    plane: audit
    owner_team: axis-audit-chain + ops-storage
    pack_scope: all
spec:
  service: audit-chain
  description: |
    Seal storage availability SLO. A storage read/write is "good" when both
    the Postgres canonical-row commit AND the S3-mirror put succeed (dual-
    write semantics). Either-side failure = bad. Per PRD §"Storage Backend"
    dual-write durability invariant.
  indicator:
    metadata:
      name: audit-chain-seal-storage-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_storage_op_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(audit_chain_storage_op_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "30d rolling storage availability ≥ 99.99%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
