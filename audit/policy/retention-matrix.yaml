# audit-chain retention matrix
# Canonical local matrix referenced by policy/data-residency.md, policy/ci-scope.cedar,
# threat-model.md, and IP-013-retention-cascade.md.
schema_version: 1.0
microservice: audit-chain
date: 2026-05-20
owner_team: axis-audit-chain
defaults:
  hot_tier_days: 365
  cold_tier_years: 7
  dsr_redaction_grace_days: 30
packs:
  pack-kr:
    minimum_years: 3
    financial_services_years: 5
    worm_required: true
  pack-eu:
    minimum_years: 2
    purpose_limited: true
    worm_required: true
  pack-us:
    minimum_years: 7
    worm_required: true
  pack-us-healthcare:
    minimum_years: 6
    legal_basis: HIPAA_164_316_b_2
    worm_required: true
  pack-jp:
    minimum_years: 5
    worm_required: true
  pack-sg:
    minimum_years: 5
    worm_required: true
  pack-au:
    minimum_years: 7
    worm_required: true
  pack-in:
    minimum_years: 5
    worm_required: true
  pack-br:
    minimum_years: 5
    worm_required: true
  pack-ae:
    minimum_years: 7
    worm_required: true
  pack-ksa:
    minimum_years: 7
    worm_required: true
classes:
  AUDIT:
    preserve_merkle_proof: true
    delete_payload_after_retention: true
  PHI:
    preserve_merkle_proof: true
    minimum_years_override: 6
  PII_IDENTIFYING:
    preserve_merkle_proof: true
    dsr_redaction_supported: true
  SECRET:
    preserve_merkle_proof: true
    payload_export_forbidden: true
