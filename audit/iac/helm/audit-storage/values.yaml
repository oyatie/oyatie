# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# S3-compatible bucket configuration (OCI Object Storage equivalent).
# Wrapped as Helm chart to declarate the bucket lifecycle + policy from git.
# Actual bucket creation happens via OpenTofu (iac/terraform/), this chart
# applies bucket-policies to the deployed cluster's S3 SDK configuration.

audit_storage:
  bucket:
    name_pattern: "audit-chain-${pack}-raw-blobs"  # per-pack residency per policy/data-residency.md
    region_pattern: "${pack_region}"

  # WORM-Object-Lock-Compliance mode mandatory per policy/seal-integrity.md SI-04
  object_lock:
    enabled: true
    mode: COMPLIANCE  # Compliance mode prevents shortening retention even by bucket owner
    # default retention per pack legal minimum from policy/data-residency.md §"Retention"
    default_retention_days_per_pack:
      pack-kr: 1095     # 3y
      pack-eu: 730      # 2y
      pack-us: 1095     # 3y
      pack-us-healthcare: 2190  # 6y HIPAA §164.316(b)(2)
      pack-jp: 730
      pack-sg: 730
      pack-au: 730  # 2555 = 7y for APRA-finance overlay
      pack-in: 730
      pack-br: 730
      pack-ae: 730
      pack-ksa: 730  # 3650 = 10y for SAMA-finance overlay

  encryption:
    sse: kms
    kms_key_id_pattern: "${pack}-audit-chain-kms-key"  # per-pack KMS key per ADR-0117

  versioning:
    enabled: true  # Object Lock requires versioning

  lifecycle:
    transitions:
      - days: 30
        storage_class: STANDARD_IA  # warm tier
      - days: 180
        storage_class: ARCHIVE      # cold tier

  bucket_policy:
    # Deny cross-pack reads + cross-pack writes
    # Enforced via condition: aws:RequestedRegion = pack region
    # Implemented in OpenTofu module
    deny_cross_pack: true

    # Deny operations that would shorten retention (defence beyond Object Lock Compliance)
    deny_retention_shortening: true

    # 2-person-rule break-glass principal can delete only after retention expiry
    break_glass_principal_arn: "arn:openbao:audit-chain-break-glass-${pack}"

  monitoring:
    metric_filter: audit_chain_s3_*
    sla_target_per_request: 99.95
