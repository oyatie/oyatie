# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs
# pack-EU overlay over default values.yaml.

global:
  pack: pack-eu
  region: eu-frankfurt-1

waypoint:
  replicaCount: 3                              # EU pack — full HA across 3 AZs
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule         # strict spread for regulated tier
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: oyatie-regulatory-waypoint
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
    oyatie/regulatory-pack: pack-eu

authorizationPolicy:
  fragments:
    pack-eu:
      - pack-eu-risk_anchor-iii-refusal
      - pack-eu-gdpr-art-22-routing
      - pack-eu-dsa-transparency

observability:
  tracing:
    samplingRate: 100                          # 100% sampling on EU regulated traffic
