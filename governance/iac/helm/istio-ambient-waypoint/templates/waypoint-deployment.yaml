{{- /*
  Istio Ambient waypoint Deployment per ADR-0174.
  Deploys an Envoy waypoint proxy in the regulated namespace.
  The waypoint terminates HBONE from ztunnel, evaluates AuthorizationPolicy,
  and shapes regulatory responses per .Values.regulatoryResponseShape.

  Source of truth for regulatory anchors:
    - GDPR Art. 22, EU AI Act Annex III §4, EU DSA Arts. 14/17/27
    - KR PIPA Art. 17 + 22-2 + 28
    - HIPAA 45 CFR §164.502 minimum necessary
    - KSA PDPL + SAMA-CSF
    - UAE PDPL + Cybersecurity Council frameworks
*/}}
{{- if .Values.waypoint.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: istio-ambient-waypoint
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: oyatie-mesh
    istio.io/dataplane-mode: ambient
    istio.io/waypoint-for: service
    gateway.networking.k8s.io/gateway-name: {{ .Values.waypoint.name }}
    oyatie/microservice: governance
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/region: {{ .Values.global.region }}
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.adr/related: "ADR-0044,ADR-0064,ADR-0121,ADR-0145,ADR-0146,ADR-0147,ADR-0148,ADR-0171"
    oyatie.istio.profile: ambient
    oyatie.istio.version: {{ .Values.global.istioVersion | quote }}
    oyatie.compliance.legal-axis-signoff-required: {{ .Values.compliance.legalAxisSignOffRequired | quote }}
spec:
  replicas: {{ .Values.waypoint.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.waypoint.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.waypoint.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: istio-ambient-waypoint
        istio.io/dataplane-mode: ambient
        istio.io/waypoint-for: service
        sidecar.istio.io/inject: "false"
        oyatie/pack: {{ .Values.global.pack }}
        oyatie/regulatory-tier: tier-2-a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: "/stats/prometheus"
        oyatie.regulation.pack: {{ .Values.global.pack | quote }}
        oyatie.istio.revision: {{ .Values.global.istioRevision | quote }}
    spec:
      runtimeClassName: {{ .Values.waypoint.runtimeClassName }}
      serviceAccountName: {{ .Values.waypoint.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.waypoint.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waypoint.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.waypoint.image.pullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.waypoint.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.waypoint.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.waypoint.tolerations }}
      tolerations:
        {{- toYaml .Values.waypoint.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.waypoint.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.waypoint.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if .Values.waypoint.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Values.waypoint.name }}
                topologyKey: {{ .Values.waypoint.antiAffinity.topologyKey }}
      {{- end }}
      containers:
        - name: istio-proxy
          image: "{{ .Values.waypoint.image.repository }}:{{ .Values.waypoint.image.tag }}"
          imagePullPolicy: {{ .Values.waypoint.image.pullPolicy }}
          {{- with .Values.waypoint.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - proxy
            - waypoint
            - --domain
            - "$(POD_NAMESPACE).svc.cluster.local"
            - --serviceCluster
            - {{ .Values.waypoint.name }}.$(POD_NAMESPACE)
            - --proxyLogLevel=warning
            - --proxyComponentLogLevel=misc:error
            - --log_output_level=default:info
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ISTIO_META_WORKLOAD_NAME
              value: {{ .Values.waypoint.name }}
            - name: ISTIO_META_MESH_ID
              value: "oyatie-mesh"
            - name: ISTIO_META_CLUSTER_ID
              value: "{{ .Values.global.pack }}-{{ .Values.global.region }}"
            - name: ISTIO_META_DNS_CAPTURE
              value: "false"                   # Cilium owns DNS
            - name: OYATIE_PACK
              value: {{ .Values.global.pack | quote }}
            - name: OYATIE_REGULATORY_TIER
              value: "tier-2-a"
            - name: OYATIE_TRACE_SAMPLING_RATE
              value: {{ .Values.observability.tracing.samplingRate | quote }}
          ports:
            - name: hbone
              containerPort: 15008
              protocol: TCP
            - name: status-port
              containerPort: 15021
              protocol: TCP
            - name: prom
              containerPort: 15020
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.waypoint.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: workload-socket
              mountPath: /var/run/secrets/workload-spiffe-uds
            - name: workload-certs
              mountPath: /var/run/secrets/workload-spiffe-credentials
            - name: istio-data
              mountPath: /var/lib/istio/data
            - name: istio-envoy
              mountPath: /etc/istio/proxy
            - name: regulatory-response-shape
              mountPath: /etc/oyatie/regulatory
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workload-socket
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: workload-certs
          emptyDir:
            medium: Memory
        - name: istio-data
          emptyDir: {}
        - name: istio-envoy
          emptyDir:
            medium: Memory
        - name: regulatory-response-shape
          configMap:
            name: {{ .Values.waypoint.name }}-regulatory-response-shape
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/component: istio-ambient-waypoint
    oyatie/microservice: governance
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/adr: ADR-0174
  annotations:
    oyatie.adr/primary: ADR-0174
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/component: istio-ambient-waypoint
    gateway.networking.k8s.io/gateway-name: {{ .Values.waypoint.name }}
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/adr: ADR-0174
spec:
  type: ClusterIP
  ports:
    - name: hbone
      port: 15008
      targetPort: 15008
      protocol: TCP
    - name: status-port
      port: 15021
      targetPort: 15021
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.waypoint.name }}-regulatory-response-shape
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/component: istio-ambient-waypoint
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/adr: ADR-0174
data:
  gdpr-art-22.json: |
    {{ .Values.regulatoryResponseShape.gdprArt22.bodyTemplate | nindent 4 | trim }}
  eu-dsa-art-17.json: |
    {{ .Values.regulatoryResponseShape.euDsaArt17.bodyTemplate | nindent 4 | trim }}
  eu-ai-act-risk_anchor-iii.json: |
    {{ .Values.regulatoryResponseShape.euAiActAnnexIII.bodyTemplate | nindent 4 | trim }}
  kr-pipa-art-17.json: |
    {{ .Values.regulatoryResponseShape.krPipaArt17.bodyTemplate | nindent 4 | trim }}
  ksa-pdpl.json: |
    {{ .Values.regulatoryResponseShape.ksaPdpl.bodyTemplate | nindent 4 | trim }}
  uae-pdpl.json: |
    {{ .Values.regulatoryResponseShape.uaePdpl.bodyTemplate | nindent 4 | trim }}
{{- if .Values.waypoint.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/component: istio-ambient-waypoint
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/adr: ADR-0174
spec:
  minAvailable: {{ .Values.waypoint.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.waypoint.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
