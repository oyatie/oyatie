{{- /*
  Gateway API Gateway resource binding the waypoint Deployment to the
  in-namespace traffic plane. Per ADR-0174 + Istio Ambient 1.24 LTS.

  The gatewayClassName "istio-waypoint" is provisioned cluster-wide by the
  istio-system install (out of this chart's scope); this resource only binds
  it into the regulated namespace.
*/}}
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.waypoint.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: istio-ambient-waypoint-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: oyatie-mesh
    istio.io/waypoint-for: service
    oyatie/microservice: governance
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/region: {{ .Values.global.region }}
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.istio.profile: ambient
    oyatie.istio.version: {{ .Values.global.istioVersion | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      {{- if .allowedRoutes }}
      allowedRoutes:
        {{- toYaml .allowedRoutes | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if .Values.gateway.addresses }}
  addresses:
    {{- toYaml .Values.gateway.addresses | nindent 4 }}
  {{- end }}
  infrastructure:
    labels:
      oyatie/microservice: governance
      oyatie/pack: {{ .Values.global.pack }}
      oyatie/regulatory-tier: tier-2-a
      oyatie/adr: ADR-0174
    annotations:
      oyatie.adr/primary: ADR-0174
      oyatie.istio.revision: {{ .Values.global.istioRevision | quote }}
{{- end }}
