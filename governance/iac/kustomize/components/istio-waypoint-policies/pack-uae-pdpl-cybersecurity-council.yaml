---
# pack-uae UAE PDPL + Cybersecurity Council enforcement at the Istio Ambient
# waypoint. Per ADR-0174. Per UAE Federal Decree-Law No. 45 of 2021 (Personal
# Data Protection Law):
#   - Art. 22 (cross-border transfer to non-adequate jurisdictions)
#   - Art. 23 (transfer with appropriate safeguards)
#   - Art. 24 (data subject rights)
# Plus UAE Cybersecurity Council frameworks (Information Assurance Standard
# v2; National Cybersecurity Strategy).
#
# Decision shape:
#   1. DENY cross-border egress unless destination is an EU Commission-style
#      "adequate" jurisdiction OR the request carries explicit data-subject
#      consent under Art. 23.
#   2. INJECT UAE Cybersecurity Council monitoring header on every response.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   forbid(principal, action == Action::"cross_border_transfer",
#          resource in Resource::"uae-personal-info")
#     when { !resource.destination_is_adequate &&
#            !resource.has_data_subject_consent_art_23 };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-uae-pdpl-cybersecurity-council
  namespace: pack-uae
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-uae
    oyatie/regulation: UAE-PDPL
    oyatie/regulation-article: "22,23,24"
    oyatie/regulation-action: "cross-border-refusal-with-cybersec-monitoring"
    oyatie/regulation-extension: "UAE-Cybersecurity-Council"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "UAE Federal Decree-Law 45/2021 (PDPL) Arts. 22-24; UAE Cybersecurity Council Information Assurance Standard v2"
    oyatie.cedar.source: "microservices/governance/policy/uae-pdpl.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "GET"]
            paths:
              - "/mail/*/egress"
              - "/mail/*/forward"
              - "/drive/*/share-external"
              - "/calendar/*/share-external"
              - "/recordings/*/export"
              - "/foundry/providers/*/invoke"
              - "/messenger/*/share-external"
      when:
        - key: request.headers[x-oyatie-destination-residency]
          notValues: ["uae", "pack-uae"]
        - key: request.headers[x-oyatie-destination-adequacy]
          notValues: ["adequate-eu-style", "adequate-uae-determined"]
        - key: request.headers[x-oyatie-pii-present]
          values: ["true", "yes", "1"]
        - key: request.headers[x-oyatie-data-subject-consent-art-23]
          notValues: ["explicit-recorded"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-uae-pdpl-response-shape
  namespace: pack-uae
  labels:
    oyatie/pack: pack-uae
    oyatie/regulation: UAE-PDPL
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  -- Inject UAE Cybersecurity Council monitoring header on every response.
                  response_handle:headers():add("x-oyatie-cybersecurity-council-monitor", "true")
                  -- Shape cross-border denial response.
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-uae-pdpl-cybersecurity-council") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "UAE-PDPL-Art-22")
                      response_handle:headers():add("x-oyatie-cross-border-refused", "true")
                      response_handle:headers():add("x-oyatie-data-residency", "uae")
                      local body = [[
                        {
                          "regulation": "UAE Federal Decree-Law 45/2021 (PDPL) Arts. 22-24",
                          "decision": "cross_border_transfer_refused",
                          "data_residency": "uae",
                          "approval_path": "https://app.oyatie.example/uae/cross-border-consent",
                          "art_23_safeguards_endpoint": "https://app.oyatie.example/uae/art-23-safeguards",
                          "art_24_data_subject_rights_endpoint": "https://app.oyatie.example/uae/data-subject-rights",
                          "regulatory_monitor": "uae_cybersecurity_council",
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
