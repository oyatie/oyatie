---
# pack-ksa KSA PDPL sovereign data routing at the Istio Ambient waypoint.
# Per ADR-0174. Per KSA Personal Data Protection Law:
#   - Art. 5  (data residency baseline; KSA personal data processed in KSA)
#   - Art. 29 (cross-border transfer; conditional and regulator-approved)
# Plus SAMA Cyber Security Framework v1.0 (regulatory monitoring header injection
# for SAMA-regulated entities — banks, insurance, FX, finance).
#
# Decision shape:
#   1. DENY cross-border egress unless the request carries an explicit
#      KSA-regulator approval token (DenDP / SDAIA / SAMA depending on sector).
#   2. INJECT SAMA monitoring header on every response for SAMA-regulated tenants
#      so SAMA's monitoring fabric receives the regulatory anchor without the
#      µservice needing to know it is SAMA-regulated.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   forbid(principal, action == Action::"cross_border_transfer",
#          resource in Resource::"ksa-personal-info")
#     when { !resource.has_dendp_or_sdaia_approval };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-ksa-pdpl-sovereign-routing
  namespace: pack-ksa
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-ksa
    oyatie/regulation: KSA-PDPL
    oyatie/regulation-article: "5,29"
    oyatie/regulation-action: "sovereign-routing"
    oyatie/regulation-extension: "SAMA-CSF-v1"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "KSA PDPL Arts. 5 (residency), 29 (cross-border); SAMA Cyber Security Framework v1.0 (regulatory monitoring)"
    oyatie.cedar.source: "microservices/governance/policy/ksa-pdpl.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "GET"]
            paths:
              - "/mail/*/egress"
              - "/mail/*/forward"
              - "/drive/*/share-external"
              - "/calendar/*/share-external"
              - "/recordings/*/export"
              - "/foundry/providers/*/invoke"
              - "/messenger/*/share-external"
      when:
        - key: request.headers[x-oyatie-destination-residency]
          notValues: ["ksa", "pack-ksa"]
        - key: request.headers[x-oyatie-pii-present]
          values: ["true", "yes", "1"]
        - key: request.headers[x-oyatie-ksa-regulator-approval]
          notValues: ["dendp-approved", "sdaia-approved", "sama-approved"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-ksa-pdpl-sovereign-routing-response-shape
  namespace: pack-ksa
  labels:
    oyatie/pack: pack-ksa
    oyatie/regulation: KSA-PDPL
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  -- Inject SAMA monitoring header on every response for SAMA-regulated tenants.
                  local sama_tenant = response_handle:streamInfo():dynamicMetadata():get("oyatie")["sama_regulated"]
                  if sama_tenant then
                    response_handle:headers():add("x-oyatie-sama-monitor", "true")
                    response_handle:headers():add("x-oyatie-regulation", "SAMA-CSF-v1")
                  end
                  -- Shape sovereign-routing denial response.
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-ksa-pdpl-sovereign-routing") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "KSA-PDPL-Art-29")
                      response_handle:headers():add("x-oyatie-sovereign-routing", "enforced")
                      response_handle:headers():add("x-oyatie-data-residency", "ksa")
                      local body = [[
                        {
                          "regulation": "KSA PDPL Arts. 5 + 29 (+ SAMA-CSF v1.0)",
                          "decision": "cross_border_transfer_refused",
                          "data_residency": "ksa",
                          "approval_required_from": ["DenDP", "SDAIA", "SAMA"],
                          "approval_path": "https://app.oyatie.example/ksa/regulator-approval",
                          "regulatory_monitor": "SAMA",
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
