apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-au canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: AU (Privacy Act). Region: ap-sydney-1.

commonAnnotations:
  oyatie/pack: pack-au
  oyatie/jurisdiction: au
  oyatie/region: ap-sydney-1
  oyatie/data-residency: au-resident
  oyatie/kms-key-ref: ocikms://au/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-au
      - REGION=ap-sydney-1
      - JURISDICTION=au
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-sydney-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=au-resident
      - CDN_EDGE_REGION=ap-sydney-1
