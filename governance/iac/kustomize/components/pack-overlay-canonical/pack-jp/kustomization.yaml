apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-jp canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: JP (APPI). Region: ap-tokyo-1.

commonAnnotations:
  oyatie/pack: pack-jp
  oyatie/jurisdiction: jp
  oyatie/region: ap-tokyo-1
  oyatie/data-residency: jp-resident
  oyatie/kms-key-ref: ocikms://jp/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-jp
      - REGION=ap-tokyo-1
      - JURISDICTION=jp
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-tokyo-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=jp-resident
      - CDN_EDGE_REGION=ap-tokyo-1
