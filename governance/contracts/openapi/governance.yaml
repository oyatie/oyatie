openapi: 3.2.0
info:
  title: Governance — Lane Status + Finding Queries API
  version: 0.1.0
  description: |
    Read + admission-gate query API for governance µservice. Surfaces lane status,
    Findings, lane runs, evidence replay, and admission verdicts. ABAC-enforced via
    `tenant-scope.cedar` + `auditor-scope.cedar`.

    Authentication: OIDC bearer token; per-tenant claim binds resources.
    Rate limit: per-principal 100 req/s; per-source-ip 50 req/s.
  contact:
    name: axis-governance
    url: https://github.com/oyatie/oyatie
  license:
    name: MIT
servers:
  - url: https://governance.{pack}.oyatie.com
    description: per-pack endpoint
    variables:
      pack:
        default: pack-kr
        enum: [pack-kr, pack-eu, pack-us, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa, pack-us-healthcare]

paths:
  /lanes:
    get:
      summary: List registered fitness lanes
      operationId: listLanes
      tags: [lanes]
      parameters:
        - in: query
          name: severity
          schema: { type: string, enum: [BLOCKER, WARN, INFO] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LaneSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lane-runs:
    get:
      summary: Query lane runs by microservice + window
      operationId: queryLaneRuns
      tags: [lane-runs]
      parameters:
        - in: query
          name: microservice
          required: true
          schema: { type: string }
        - in: query
          name: window_start
          schema: { type: string, format: date-time }
        - in: query
          name: window_end
          schema: { type: string, format: date-time }
        - in: query
          name: lane_id
          schema: { type: string }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaneRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /findings:
    get:
      summary: Query Findings (tenant-scoped per tenant-scope.cedar)
      operationId: queryFindings
      tags: [findings]
      parameters:
        - in: query
          name: microservice
          required: true
          schema: { type: string }
        - in: query
          name: severity
          schema: { type: string, enum: [BLOCKER, WARN, INFO] }
        - in: query
          name: window_start
          schema: { type: string, format: date-time }
        - in: query
          name: window_end
          schema: { type: string, format: date-time }
        - in: query
          name: view
          schema: { type: string, enum: [audit, non-audit], default: non-audit }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /findings/{finding_id}:
    get:
      summary: Get a single Finding by id (signed)
      operationId: getFinding
      tags: [findings]
      parameters:
        - in: path
          name: finding_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }

  /evidence/{blob_id}:
    get:
      summary: Fetch evidence blob (raw lane output)
      operationId: getEvidenceBlob
      tags: [evidence]
      parameters:
        - in: path
          name: blob_id
          required: true
          schema: { type: string, format: hex }
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admission-verdict:
    get:
      summary: Query admission-gate verdict for a PR (merge-queue endpoint)
      operationId: queryAdmissionVerdict
      tags: [admission]
      parameters:
        - in: query
          name: pr_number
          required: true
          schema: { type: integer }
        - in: query
          name: target_branch
          required: true
          schema: { type: string, enum: [dev, staging, production] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /evidence/export:
    post:
      summary: Auditor JIT-scoped evidence bundle export
      operationId: exportEvidenceBundle
      tags: [evidence, auditor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceExportRequest' }
      responses:
        '202':
          description: Export accepted; bundle being assembled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceExportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Auditor scope or window invalid; refer to auditor-scope.cedar

  /evidence/export/{ticket_id}:
    get:
      summary: Retrieve assembled evidence bundle
      operationId: getEvidenceExport
      tags: [evidence, auditor]
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bundle ready
          content:
            application/zstd:
              schema: { type: string, format: binary }
        '202': { description: Still assembling }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /baseline-pins:
    get:
      summary: List industry-baseline pins (public read; per public-read.cedar)
      operationId: listBaselinePins
      tags: [baseline]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BaselinePin' }

  /conformance-posture:
    get:
      summary: Get current 6-axis conformance posture (public read)
      operationId: getConformancePosture
      tags: [conformance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConformancePosture' }

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: governance
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-legacy-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare self-hosted CI (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-self-hosted-ci-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-self-hosted-ci-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  schemas:
    LaneSummary:
      type: object
      required: [lane_id, severity, version, registered_at]
      properties:
        lane_id: { type: string }
        severity: { type: string, enum: [BLOCKER, WARN, INFO] }
        version: { type: string }
        registered_at: { type: string, format: date-time }
        microservice_scope:
          type: string
          enum: [all, per-microservice]
        rule_pack_sha: { type: string, format: hex }

    LaneRun:
      type: object
      required: [run_id, lane_id, microservice, sha, verdict, started_at, duration_ms]
      properties:
        run_id: { type: string, format: uuid }
        lane_id: { type: string }
        microservice: { type: string }
        sha: { type: string }
        verdict: { type: string, enum: [PASS, FAIL, ERROR, SKIPPED, TIMEOUT] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        runner_profile: { type: string }
        runner_id: { type: string }

    LaneRunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LaneRun' }
        next_page_token: { type: string }

    Finding:
      type: object
      required: [finding_id, microservice, lane_id, severity, sha, citation, signature, sealed_at]
      properties:
        finding_id: { type: string, format: uuid }
        microservice: { type: string }
        tenant_id: { type: string }
        lane_id: { type: string }
        severity: { type: string, enum: [BLOCKER, WARN, INFO] }
        sha: { type: string }
        citation:
          $ref: '#/components/schemas/Citation'
        evidence_blob_id: { type: string }
        view: { type: string, enum: [audit, non-audit] }
        signature: { type: string, description: Ed25519 signature over canonical-JSON }
        signed_by: { type: string, description: signing key identifier }
        sealed_at: { type: string, format: date-time, description: audit-chain seal time }
        merkle_root: { type: string, format: hex }
        finding_hash: { type: string, format: hex }
        created_at: { type: string, format: date-time }
        pr_number: { type: integer }
        pr_author_subject: { type: string }

    FindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        next_page_token: { type: string }

    Citation:
      type: object
      required: [rule_id, file_line]
      properties:
        rule_id: { type: string, description: "rule-pack rule ID (e.g., 'data-class.r-001')" }
        file_line: { type: string, description: "'path:line' (e.g., 'crates/foo/src/lib.rs:42')" }
        industry_baseline: { type: string, description: "e.g., SLSA Build L3 §source-provenance" }
        remediation_url: { type: string, format: uri }
        rule_pack_version: { type: string }

    AdmissionVerdict:
      type: object
      required: [pr_number, target_branch, verdict, computed_at]
      properties:
        pr_number: { type: integer }
        target_branch: { type: string }
        verdict: { type: string, enum: [ADMIT, REFUSE, PENDING] }
        blocker_findings_count: { type: integer }
        warn_findings_count: { type: integer }
        info_findings_count: { type: integer }
        lanes_passed: { type: integer }
        lanes_failed: { type: integer }
        lanes_pending: { type: integer }
        lanes_total: { type: integer }
        computed_at: { type: string, format: date-time }
        stale_replica: { type: boolean, description: true if served from read-replica during failover (F-05) }

    EvidenceExportRequest:
      type: object
      required: [scope_microservices, window_start, window_end]
      properties:
        scope_microservices:
          type: array
          items: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        include_audit_view:
          type: boolean
          description: true requires auditor in role=audit-view-permitted

    EvidenceExportTicket:
      type: object
      required: [ticket_id, expected_ready_at]
      properties:
        ticket_id: { type: string, format: uuid }
        expected_ready_at: { type: string, format: date-time }
        expected_size_bytes: { type: integer }

    BaselinePin:
      type: object
      required: [axis, source_url, pinned_sha, effective_at]
      properties:
        axis: { type: string, enum: [pipeline, directory, naming, standards, practices, policies] }
        baseline_name: { type: string }
        source_url: { type: string, format: uri }
        pinned_sha: { type: string, format: hex }
        effective_at: { type: string, format: date-time }
        last_refresh_quarter: { type: string }

    ConformancePosture:
      type: object
      required: [period, axes]
      properties:
        period: { type: string, description: 'e.g., 2026-Q2' }
        axes:
          type: array
          items:
            type: object
            properties:
              axis: { type: string }
              pass_rate: { type: number, format: double }
              total_lanes: { type: integer }
              passing_lanes: { type: integer }
              published_at: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: OIDC bearer token missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              detail: { type: string }
    Forbidden:
      description: Cedar policy refused; see tenant-scope.cedar / auditor-scope.cedar
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              policy_fragment: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
