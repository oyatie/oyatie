asyncapi: 3.1.0
info:
  title: Governance — Event Contracts
  version: 0.1.0
  description: |
    Async event contracts emitted by governance µservice. Events flow through the
    Workflow event bus (tenancy µservice) per ADR-0131 §"Integration via Workflow + Ontology".
    Every event carries an audit-chain Ed25519 seal.
  contact:
    name: axis-foundry

defaultContentType: application/json

servers:
  workflow-bus:
    host: workflow-bus.oyatie.svc.cluster.local:9092
    protocol: kafka
    description: tenancy µservice's Workflow event bus
    bindings:
      kafka:
        schemaRegistryUrl: http://schema-registry:8081

channels:
  lane-failed:
    address: oyatie.governance.lane-failed.v1
    messages:
      laneFailed:
        $ref: '#/components/messages/LaneFailed'
    description: A lane verdict transitioned to FAIL (any severity).

  finding-emitted:
    address: oyatie.governance.finding-emitted.v1
    messages:
      findingEmitted:
        $ref: '#/components/messages/FindingEmitted'
    description: A new Finding has been signed + persisted.

  audit-completed:
    address: oyatie.governance.audit-completed.v1
    messages:
      auditCompleted:
        $ref: '#/components/messages/AuditCompleted'
    description: Full ~50-lane set finished for a PR.

  baseline-pin-updated:
    address: oyatie.governance.baseline-pin-updated.v1
    messages:
      baselinePinUpdated:
        $ref: '#/components/messages/BaselinePinUpdated'
    description: Quarterly refresh promoted a new baseline pin.

  aggregation-index-regenerated:
    address: oyatie.governance.aggregation-index-regenerated.v1
    messages:
      aggregationIndexRegenerated:
        $ref: '#/components/messages/AggregationIndexRegenerated'
    description: Central indices regenerated from per-µservice sources.

  pull-request-opened:
    address: oyatie.github.pull-request-opened.v1
    messages:
      pullRequestOpened:
        $ref: '#/components/messages/PullRequestOpened'
    description: |
      Consumed event: a PR was opened. Governance's lane-runtime enqueues
      the full ~50-lane set.

  microservice-registered:
    address: oyatie.tenancy.microservice-registered.v1
    messages:
      microserviceRegistered:
        $ref: '#/components/messages/MicroserviceRegistered'
    description: |
      Consumed event: a new µservice scaffolded. lane-runtime registers it
      for per-PR fitness-lane execution.

operations:
  publishLaneFailed:
    action: send
    channel: { $ref: '#/channels/lane-failed' }
    summary: governance emits LaneFailed

  publishFindingEmitted:
    action: send
    channel: { $ref: '#/channels/finding-emitted' }
    summary: governance emits FindingEmitted

  publishAuditCompleted:
    action: send
    channel: { $ref: '#/channels/audit-completed' }
    summary: governance emits AuditCompleted

  publishBaselinePinUpdated:
    action: send
    channel: { $ref: '#/channels/baseline-pin-updated' }
    summary: governance emits BaselinePinUpdated

  publishAggregationIndexRegenerated:
    action: send
    channel: { $ref: '#/channels/aggregation-index-regenerated' }
    summary: governance emits AggregationIndexRegenerated

  receivePullRequestOpened:
    action: receive
    channel: { $ref: '#/channels/pull-request-opened' }
    summary: governance receives PullRequestOpened

  receiveMicroserviceRegistered:
    action: receive
    channel: { $ref: '#/channels/microservice-registered' }
    summary: governance receives MicroserviceRegistered

components:
  messages:
    LaneFailed:
      name: LaneFailed
      title: Lane verdict transitioned to FAIL
      summary: A fitness lane emitted a non-PASS verdict.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LaneFailed'

    FindingEmitted:
      name: FindingEmitted
      title: New Finding signed + persisted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FindingEmitted'

    AuditCompleted:
      name: AuditCompleted
      title: Full ~50-lane set completed for a PR
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuditCompleted'

    BaselinePinUpdated:
      name: BaselinePinUpdated
      title: Quarterly refresh promoted new baseline pin
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BaselinePinUpdated'

    AggregationIndexRegenerated:
      name: AggregationIndexRegenerated
      title: Central indices regenerated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AggregationIndexRegenerated'

    PullRequestOpened:
      name: PullRequestOpened
      title: New PR opened (consumed from tenancy event bus)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PullRequestOpened'

    MicroserviceRegistered:
      name: MicroserviceRegistered
      title: New µservice scaffolded (consumed from tenancy)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MicroserviceRegistered'

  schemas:
    AuditChainEnvelope:
      type: object
      required: [event_id, emitted_at, signed_by, signature, merkle_root]
      properties:
        event_id: { type: string, format: uuid }
        emitted_at: { type: string, format: date-time }
        signed_by: { type: string }
        signature: { type: string, description: Ed25519 over canonical-JSON payload }
        merkle_root: { type: string, format: hex }

    LaneFailed:
      type: object
      allOf:
        - $ref: '#/components/schemas/AuditChainEnvelope'
        - type: object
          required: [run_id, lane_id, microservice, sha, severity, verdict, citation]
          properties:
            run_id: { type: string, format: uuid }
            lane_id: { type: string }
            microservice: { type: string }
            sha: { type: string }
            severity: { type: string, enum: [BLOCKER, WARN, INFO] }
            verdict: { type: string, enum: [FAIL, ERROR, TIMEOUT] }
            citation:
              type: object
              properties:
                rule_id: { type: string }
                file_line: { type: string }
                industry_baseline: { type: string }
            duration_ms: { type: integer }
            pr_number: { type: integer }

    FindingEmitted:
      type: object
      allOf:
        - $ref: '#/components/schemas/AuditChainEnvelope'
        - type: object
          required: [finding_id, microservice, severity, sha, lane_id]
          properties:
            finding_id: { type: string, format: uuid }
            microservice: { type: string }
            tenant_id: { type: string }
            severity: { type: string }
            sha: { type: string }
            lane_id: { type: string }
            pr_number: { type: integer }
            finding_hash: { type: string, format: hex }

    AuditCompleted:
      type: object
      allOf:
        - $ref: '#/components/schemas/AuditChainEnvelope'
        - type: object
          required: [pr_number, target_branch, lanes_total, lanes_passed, lanes_failed, verdict]
          properties:
            pr_number: { type: integer }
            target_branch: { type: string }
            lanes_total: { type: integer }
            lanes_passed: { type: integer }
            lanes_failed: { type: integer }
            lanes_pending: { type: integer }
            verdict: { type: string, enum: [ADMIT, REFUSE] }
            total_duration_ms: { type: integer }

    BaselinePinUpdated:
      type: object
      allOf:
        - $ref: '#/components/schemas/AuditChainEnvelope'
        - type: object
          required: [axis, baseline_name, previous_sha, new_sha, effective_at, direction]
          properties:
            axis: { type: string, enum: [pipeline, directory, naming, standards, practices, policies] }
            baseline_name: { type: string }
            previous_sha: { type: string, format: hex }
            new_sha: { type: string, format: hex }
            effective_at: { type: string, format: date-time }
            direction: { type: string, enum: [stricter, softer, lateral] }
            adr_rationale_ref: { type: string, description: ADR if softer }

    AggregationIndexRegenerated:
      type: object
      allOf:
        - $ref: '#/components/schemas/AuditChainEnvelope'
        - type: object
          required: [trigger, paths_updated, duration_ms]
          properties:
            trigger: { type: string, enum: [per-pr, scheduled-cron, manual] }
            paths_updated:
              type: array
              items: { type: string }
            duration_ms: { type: integer }
            divergence_count: { type: integer }

    PullRequestOpened:
      type: object
      required: [pr_number, repo, sha, author_subject, target_branch]
      properties:
        pr_number: { type: integer }
        repo: { type: string }
        sha: { type: string }
        author_subject: { type: string }
        target_branch: { type: string }
        diff_files_count: { type: integer }

    MicroserviceRegistered:
      type: object
      required: [microservice, owner_team, registered_at]
      properties:
        microservice: { type: string }
        owner_team: { type: string }
        sales_segment: { type: string }
        tier: { type: string }
        registered_at: { type: string, format: date-time }
