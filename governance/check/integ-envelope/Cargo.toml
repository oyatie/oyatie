[package]
name = "check-integ-envelope"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR-0711 Phase B. The Swarm Delivery Law says a PR from `integ/R` may touch only paths inside
# envelope(R), plus adjunct leaves claimed for R and hub files waivered for R. Until this crate
# existed that rule had NO evaluator: `governance/check/integ-envelope/` held BUCK, OWNERS,
# judgments and waivers, and nothing read them. The ADR's own rollout table records the check as
# Phase B and marks Phase A "advisory", so the law has been unenforced by construction, not by
# oversight.
#
# The kernel is pure: envelope authority + head branch + changed paths in, findings out. The live
# corpus walk lives in tests/.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "check_integ_envelope"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
