[package]
name = "check-brand-residue"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "check_brand_residue"
path = "src/lib.rs"
doctest = false

# forbidden_vocab.rs is the SSOT for the forbidden-vocab shrink-only ratchet: the stem
# catalog (foundry/forgejo/jenkins/oya-vcs), the carve-out DATA table, and the pure
# per-(stem,file) census the accounting-registry producer freezes into the firewall
# baseline. It is pure over &str inputs the producer reads; serde_json only carries the
# corpus shape the producer hands in. No other deps (ADR-0083 Tier-3: pure lib).
[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
