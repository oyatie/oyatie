[package]
name = "check-shardability"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "check_shardability"
path = "src/lib.rs"
doctest = false

# The kernel stays pure (port-in-kernel, ADR-0056); the LIVE-TREE walk that grounds it in this
# repository's migrations lives in tests/shardability_live.rs and reads its frozen baseline from
# shardability-policy.json, which is why serde_json is a dev-dependency and not a dependency.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
