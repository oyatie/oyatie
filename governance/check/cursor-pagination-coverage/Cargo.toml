[package]
name = "check-cursor-pagination-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Pure-fn kernel (port-in-kernel, ADR-0056). Reads OpenAPI 3.2.0
# documents and returns findings for list endpoints missing cursor
# pagination or carrying forbidden offset parameters per ADR-0150.
# The kernel stays pure; the LIVE-TREE walk that grounds it lives in tests/.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "check_cursor_pagination_coverage"
path = "src/lib.rs"
doctest = false

# The fixture suite inside src/lib.rs proves the kernel correct and says nothing about this
# repository. This target is the LIVE-TREE walk that grounds the doctrine in the real OpenAPI
# corpus; it stands BESIDE those fixtures, never in place of them.
[[test]]
name = "cursor_pagination_coverage"
path = "tests/cursor_pagination_coverage.rs"

[lints]
workspace = true
