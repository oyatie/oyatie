[package]
name = "check-apex-gist-integrity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Apex gist INTEGRITY gate. The ten live apex ADRs were produced by a mechanical consolidation that
# cut every carried-forward member block at a fixed character budget and the member list itself at a
# fixed count. Both cuts are silent — no ellipsis, no marker, no pointer — so a truncated gist is
# indistinguishable from a deliberately terse one and the apex asserts less than was ratified while
# READING as complete. The kernel is pure; the live corpus walk lives in tests/.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "check_apex_gist_integrity"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
