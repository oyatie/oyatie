[package]
name = "check-layered-architecture-discipline"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Pure-fn kernel (port-in-kernel, ADR-0056). Validates that no
# microservice violates the layered hyperscaler architecture invariants
# from ADR-0148 (Cilium L3/L4 + Istio Ambient L7), ADR-0182 (gateway vs
# mesh), ADR-0183 (Cedar vs Kyverno), and ADR-0184 (Valkey vs Memcached
# tier-3 cache).

# The kernel stays pure; the LIVE-TREE walk that grounds it in this repository's manifests lives in
# tests/layered_architecture_discipline_live.rs and reads both its frozen baseline
# (layered-architecture-discipline-policy.json) and each manifest's DECLARED identity as JSON,
# which is why serde_json is a dev-dependency and not a dependency.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
