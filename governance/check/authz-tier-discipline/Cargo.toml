[package]
name = "check-authz-tier-discipline"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Advisory-mode gate: refuse Cedar policies that mention IP/ASN/geo (edge concerns) and refuse Envoy filters that mention OIDC principal/ACR (origin concerns). Authority: ADR-0191."

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "check_authz_tier_discipline"
path = "src/lib.rs"
doctest = false

[[test]]
name = "authz_tier_discipline"
path = "tests/authz_tier_discipline.rs"

[lints]
workspace = true
