[package]
name = "check-adr-citation-closure"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR citation CLOSURE gate. A mechanical de-stale pass rewrote thousands of ADR path citations
# onto the ten live apex ADRs; every rewritten path is valid and every target file exists, so a link
# checker passes all of them, while many point at an apex that never claimed the ADR the sentence is
# about. Syntactically valid, semantically wrong — only a supersession oracle built from BOTH
# frontmatter sides catches it. The kernel is pure; the live tree walk lives in tests/.

[dependencies]

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "check_adr_citation_closure"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
