[package]
name = "check-wasm-runtime-discipline"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR-0200 advisory gate. Detects µservices that import a WASM
# runtime crate (`wasmtime`, `wasmer`, `wasmedge`) directly instead
# of routing through `oya-shared-wasm-runtime-kernel`. The gate
# parses surfaced Cargo.toml texts; full workspace-scan integration
# is wired by the parent (lanes.yaml + dispatcher).

[dependencies]

[lib]
name = "check_wasm_runtime_discipline"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
