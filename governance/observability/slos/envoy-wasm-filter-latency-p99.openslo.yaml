apiVersion: openslo/v1
kind: SLO
metadata:
  name: governance-envoy-wasm-filter-latency-p99
  displayName: "governance · Envoy WASM filter added latency p99"
  labels:
    microservice: governance
    adr: ADR-0200
    pillar: latency
spec:
  service: governance
  description: |
    p99 added latency from the Envoy WASM filter chain. Target:
    5 ms per filter, 15 ms aggregate across the chain.
  indicator:
    metadata:
      name: envoy_wasm_filter_added_latency_p99_ms
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: |
                histogram_quantile(0.99,
                  sum by (le) (rate(governance_envoy_wasm_filter_added_latency_ms_bucket[5m])))
                <= 15
        total:
          metricSource:
            spec:
              query: count_over_time(up{job="governance"}[5m])
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 ≤ 15 ms aggregate"
      target: 0.99
