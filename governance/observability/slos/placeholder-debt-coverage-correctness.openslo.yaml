# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-placeholder-debt-coverage-correctness
  displayName: "governance: placeholder-debt-coverage correctness 100%"
  labels:
    microservice: governance
    bounded_context: policy-engine
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-governance + council-quality
    pack_scope: all
spec:
  service: governance
  description: |
    Placeholder-debt coverage correctness SLO. A scan is "good" when every
    `todo!()`, `unimplemented!()`, `// TODO`, `// FIXME` carries a linked
    GitHub issue + sunset date OR is registered in registry/fixuptasks.jsonl.
    Per ADR-0058 placeholder-debt registry. Target = 100% (any orphan is
    a covert deferral against autonomous-implementation policy).
  indicator:
    metadata:
      name: governance-placeholder-coverage-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_placeholder_total{covered="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_placeholder_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% placeholder-debt coverage (any orphan is Sev-2)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
