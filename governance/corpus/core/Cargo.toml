[package]
name = "corpus-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Phase -1 corpus substrate (ADR-0580): the content-addressed `Function` fact type + the stable
# `AstSource` trait that the extractor implements. Pure, cloud-agnostic, ZERO runtime/persistence
# deps. blake3 = content-address; serde = canonical-json serialization. The bespoke-rowan CST is a
# W-tier successor behind `AstSource`; salsa/rowan stay ABSENT for the conservative-v1 posture.

[dependencies]
blake3 = "1.8.5"
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "corpus_core"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
