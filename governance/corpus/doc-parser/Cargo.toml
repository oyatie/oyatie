[package]
name = "corpus-doc-parser"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "corpus"
kind = "shared"
layer = "kernel"
purpose = "Markdown/doc parser substrate skeleton that emits content-addressed doc node IDs for ADR headings and references per ADR-0517/ADR-0541."

[dependencies]
sha2 = { workspace = true }
work-area-tree-kernel = { path = "../work-area-tree-kernel" }

[lib]
name = "corpus_doc_parser"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
