[package]
name = "corpus-extract"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Phase -1 corpus extractor (ADR-0580): a deterministic, hermetic binary that resolves a
# capability's crates via libs/oya-workspace-members-kernel, walks each crate's git-tracked sources
# (via `git ls-files` — no ambient filesystem walk), parses them with `syn`, and emits one
# content-addressed `Function` fact per item plus the OPAQUE-RATE. NO hand-listed function set — the
# facts ARE the syn output. No clock/rand/net; output is sorted/canonical.

[dependencies]
blake3 = "1.8.5"
corpus-core = { path = "../core" }
corpus-yaml-kernel = { path = "../yaml-kernel" }
oya-workspace-members-kernel = { path = "../../../libs/oya-workspace-members-kernel" }
syn = { workspace = true }
quote = { workspace = true }

[lib]
name = "corpus_extract"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "corpus-extract"
path = "src/main.rs"

# The buck2-action entry point for the YAML artifact class. Inputs arrive as explicit argv paths
# (never a filesystem walk), so an action's inputs are exactly what buck2 declared.
[[bin]]
name = "corpus-yaml-facts"
path = "src/yaml_facts_main.rs"

[lints]
workspace = true
