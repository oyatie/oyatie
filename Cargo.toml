[workspace]
members = [
  # SHAPE-DECLARING membership (ADR-0538 glob-only contract, generalized one level up).
  #
  # ADR-0538 globbed membership so that adding a CRATE needs no edit to this shared array —
  # it named the merge-conflict class explicitly: "eliminating the 100%-by-construction
  # merge-conflict class on Cargo.toml across concurrent lanes". That intent was right and
  # this array had drifted away from it: membership was enumerated ONE GLOB PER CAPABILITY
  # (`messaging/*/*`, `iac/*/*`, `observability/*/*`, ... 24 of them), so adding a CAPABILITY
  # still edited the array — and every capability move did. The array was a mutex again, one
  # level up, which is why every reorg move serialized on this file (68 of 68 movers).
  #
  # The four globs below describe the northstar LAYOUT instead of enumerating its instances.
  # `<capability>/{core,ports,adapters,facade}/<leaf>` is ADR-0562 §1's shape, so a conforming
  # capability — present or future — is a member by construction and needs ZERO edit here.
  #
  # The old `<cap>/*/*` form matched EVERY non-crate subdir (`<cap>/observability/`,
  # `<cap>/slos/`, ...), and Cargo errors on a matched directory with no manifest. The
  # face-specific globs below select package-shaped paths, so satellite and grouping
  # directories do not need a hand-maintained exclusion list.
  #
  # The canonical resolver remains pipeline/core/workspace-members-kernel; gates must resolve
  # members there, never by parsing this array.
  "*/core/*",
  # Source markers are bounded to a direct leaf. D-28 draft leaves get their
  # own exact depth below; neither shape can descend into a crate's Rust or
  # integration-test tree and mistake a nested `src/` fixture for a package.
  "*/ports/*/src/..",
  "*/adapters/*/src/..",
  # Facades use the same source marker. A broad `facade/*` would
  # enroll the non-crate `facade/proto/` contract tree and break Cargo loading.
  "*/facade/*/src/..",
  # ADR-0562 composition ring. The layer globs above are single-segment and cannot reach
  # `app/<product>/<face>/<crate>`, so without these an app absorb lands crates OUTSIDE the
  # build — which evaluation_gate.forbidden calls move_now_fix_later. app/calendar landed
  # only because it holds zero crates.
  "app/*/core/*",
  "*/ports/draft/*/src/..",
  "*/adapters/draft/*/src/..",
  "app/*/ports/*/src/..",
  "app/*/adapters/*/src/..",
  "app/*/ports/draft/*/src/..",
  "app/*/adapters/draft/*/src/..",
  "app/*/facade/*/src/..",
  "app/foundry/pages/crates/*",
  "app/foundry/grid/core/*",

  # The owned deterministic port engine (ADR-0637 D1, archived; live via apex ADR-0704). This ONE
  # entry is the ADR-0538 exception that decision authorizes by name: `build/port-engine/` is a new
  # root, no glob above admits it, and the ADR forbids avoiding this line by homing the engine in
  # `ci/` — that placement would misstate a build-meta engine as CI capability work.
  #
  # TWO segments, not one, and a REVIEWER SHOULD KNOW THE STRING DOES NOT MATCH THE ADR'S. The
  # sentence in ADR-0637 D1 that grants this ADR-0538 exception spells the home `build/port-engine/*`
  # — one segment. What lands here is `build/port-engine/*/*`. The reason: the engine's own
  # admission plan (.grok/programs/k8s-port/W0-B-ADMISSION-PLAN.md §"Root membership") fixes six
  # crates under `build/port-engine/{ports,core,adapters,facade}/<leaf>` — the same capability-first
  # shape the four globs above describe — and prints `build/port-engine/*/*` verbatim as the single
  # reviewed line. A one-segment glob would admit NONE of those six and force a SECOND amendment to
  # this shared array, which is precisely the merge-conflict class ADR-0538 exists to prevent. So
  # the two-segment form serves the ADR's intent and contradicts its literal string; that is a
  # reviewer's call to make knowingly, not one to discover.
  #
  "build/port-engine/*/*",
]
# Cargo retains an unmatched member glob as a literal path. These exact
# exclusions suppress only that literal fallback after the final draft is
# promoted; Cargo does not apply them to real expanded draft directories.
exclude = [
  "*/ports/draft/*",
  "*/adapters/draft/*",
  "app/*/ports/draft/*",
  "app/*/adapters/draft/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98.0"

# Workspace lints baseline (TEMPORARY — re-tighten under Wave 15-ZA cleanup PR per ADR-0346 successor).
#
# `dead_code` + `unused_imports` are intentionally relaxed workspace-wide because:
# 1. Wave 15-IMPL-truth-up scaffolded ~140 crates with declared-but-undispatched types/fns
#    pending owning-IP execution (per anti-stamping discipline). These show as dead_code.
# 2. Origin/dev #172-#176 merge introduced unused imports that our local doesn't reference
#    (post-merge `-X ours` strategy preserved our shape; their imports came along for ride).
#
# CI uses `cargo clippy --workspace --all-targets --keep-going -- -D warnings` which would
# otherwise escalate these to errors and block the realignment PR landing.
# Wave 15-ZA will: (a) wire dispatch for scaffolded modules, (b) prune merge-fallout
# unused imports, (c) restore these to `deny` to re-enforce the strict baseline.
[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"

[workspace.metadata.oya]
# v4.1 BNF registry: oya-<microservice>[-<bc>]-<layer> (flat catalog; no shared|vertical binary)
# Layer enum (12 canonical values per ADR-0056 amended by ADR-0105 + ADR-0106 + ADR-0565):
#   kernel|domain|usecase|app|adapter|infrastructure|cli|rest|grpc|worker|sdk|api
# Adopted patterns (ADR-0105 §Adopted Patterns):
#   check-<feature>  — self-layering check family (the µservice IS the layer).
#   *-adapter-<backend>  — backend-qualifier sub-suffix where backend ∈
#                          {fake,inmemory,aws,oci,gcp,azure,postgres,redis,sqlite,...}.
# tools/ binding (ADR-0107 amended 2026-05-15 — NO implicit-app exception):
#   Every crate under tools/ MUST carry a canonical layer suffix from the enum.
#   Binary tools SHALL use `-app`. There is no directory-implicit naming.
#   Sole doctrinal carve-out: `tooling-agent-read` is locked by CLAUDE.md
