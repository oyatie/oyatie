[workspace]
members = [
  # Shape-declaring membership keeps capability additions out of this shared file (ADR-0538).
  # Face-specific globs avoid enrolling non-crate satellite directories. The canonical resolver
  # remains pipeline/core/workspace-members-kernel; gates must not parse this array.
  "*/core/*",
  # Source markers are bounded to a direct leaf. D-28 draft leaves get their
  # own exact depth below; neither shape can descend into a crate's Rust or
  # integration-test tree and mistake a nested `src/` fixture for a package.
  "*/ports/*/src/..",
  "*/adapters/*/src/..",
  # Facades use the same source marker. A broad `facade/*` would
  # enroll the non-crate `facade/proto/` contract tree and break Cargo loading.
  "*/facade/*/src/..",
  # ADR-0562 composition ring. The layer globs above are single-segment and cannot reach
  # `app/<product>/<face>/<crate>`, so without these an app absorb lands crates OUTSIDE the
  # build — which evaluation_gate.forbidden calls move_now_fix_later. app/calendar landed
  # only because it holds zero crates.
  "app/*/core/*",
  "*/ports/draft/*/src/..",
  "*/adapters/draft/*/src/..",
  "app/*/ports/*/src/..",
  "app/*/adapters/*/src/..",
  "app/*/ports/draft/*/src/..",
  "app/*/adapters/draft/*/src/..",
  "app/*/facade/*/src/..",

  # Named ADR-0538 exception for the owned build-meta port engine (ADR-0704). Two segments admit
  # its capability-shaped face crates without moving the engine into pipeline/.
  "build/port-engine/*/*",
  "build/dependency-declarations/*/*/src/..",
]
# Cargo retains an unmatched member glob as a literal path. These exact
# exclusions suppress only that literal fallback after the final draft is
# promoted; Cargo does not apply them to real expanded draft directories.
exclude = [
  "*/ports/draft/*",
  "*/adapters/draft/*",
  "app/*/ports/draft/*",
  "app/*/adapters/draft/*",
  "build/dependency-declarations/*/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98.0"

# Temporary workspace relaxation for declared-but-undispatched scaffolds; the owning cleanup
# restores deny after wiring dispatch and pruning unused imports.
[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"

[workspace.dependencies]
# Canonical Phase-1 crypto backend (ADR-0506). Drop-in ring replacement backed
# by AWS-LC (FIPS-validatable BoringSSL fork). Apache-2.0 + ISC — OSI-clean.
# Default (aws-lc-sys / non-fips) backend; FIPS backend is a later opt-in per ADR-0506.
# NOTE: do NOT set default-features = false — aws-lc-rs requires a backend feature
# (aws-lc-sys|non-fips|fips) or its build script panics.
aws-lc-rs = { version = "1" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Phase -1 corpus extractor (ADR-0580): the source-level Rust AST parser behind the corpus
# `AstSource` seam. Promoted from a transitive-only dep to a DIRECT workspace dep so reindeer emits
# a PUBLIC `third-party//:syn` alias (the buck dep label); the locked version (2.0.117) and the
# generated feature set (full/extra-traits/parsing/visit/clone-impls) are unchanged by this flip.
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "visit", "clone-impls"] }
# Companion to `syn` for the corpus extractor (ADR-0580): renders parsed AST nodes back to a
# canonical, whitespace/comment-normalized token string (the reformatting-invariant signature
# pre-image). Promoted to a DIRECT workspace dep so reindeer emits a PUBLIC `third-party//:quote`
# alias; the locked version (1.0.45) is unchanged by this flip.
quote = "1.0"
# The Rust formatter behind the port engine's `Renderer` seam (P1). Promoted from a transitive-only
# dep so `formatter_digest` can name a formatter that actually exists: the axis previously hashed
# the string "fmt-port-go-v1", i.e. a label, so one of the six receipt axes attested to nothing.
# `prettyplease` rather than shelling out to rustfmt because the emit path must stay hermetic and
# in-process — a receipt axis that depends on whichever rustfmt is on PATH is not reproducible.
prettyplease = "0.2"
# Maintained Meta Starlark AST behind Build's bounded BUCK projection port.
starlark_syntax = "=0.14.2"
# `quote!` produces a `proc_macro2::TokenStream`, so the IR's lowering functions have to name the
# type. Already resolved transitively via syn/quote; promoted to a direct dep so the buck label
# exists too.
proc-macro2 = "1.0"
# Owned supply-chain advisory gate (cloud-ci-supply-chain-audit; replaces the reverted #974 shell
# cargo-audit/deny). Promoted from a transitive-only dep (already locked at 1.0.28 via
# cedar-policy/rustc_version/wasmparser) to a DIRECT workspace dep so reindeer emits a PUBLIC
# `third-party//:semver` alias (the buck dep label the gate matches locked Cargo.lock versions
# against advisory VersionReqs with). The locked version is UNCHANGED by this flip — ZERO new crate
# enters Cargo.lock. Deliberately NOT the rustsec/cargo-lock crates: those pull libgit2-C + a
# network index, defeating rust-purity + hermeticity.
semver = "1.0"
# Descriptor-relative filesystem operations for the canonical retirement-facts
# writer. Keep this direct so reindeer emits the public `third-party//:rustix`
# alias consumed by first-party Buck2 targets.
rustix = { version = "1.1.4", features = ["fs"] }
libc = "0.2"
prost = "0.14.3"
protoc-bin-vendored = "3.2.0"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false, features = ["cleanup-markdown"] }
# ADR-0506 zero-ring: sqlx's `runtime-tokio-rustls` is the SOLE activator of
# rustls's `ring` feature (it pulls `tls-rustls-ring`); pin the aws-lc-rs TLS
# drop-in (`runtime-tokio` + `tls-rustls-aws-lc-rs`) so the resolved rustls/
# rustls-webpki carry NO ring and `ring 0.17` drops from the graph entirely.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["metrics"] }
# Hyper canonical HTTP backbone per ADR-0090 (user-issued 2026-05-14).
# Only http-runtime-hyper-adapter (Layer 5) consumes these directly;
# Layers 1-4 remain std-only.
#
# Pooling-convergence campaign (slice 1, 2026-05-29; historical .omc/ plan retired from tracked durables):
# the intelligence/provider-pool runtime needs an OUTBOUND HTTPS client, not just
# the inbound server. `client` + `http2` are added to hyper, and `client-legacy`
# (the hyper-util pooled legacy Client) + `http2` to hyper-util.
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false }
# TLS for the canonical HTTP adapter. aws-lc-rs backend (ADR-0506; ring is
# FORBIDDEN); prefer-post-quantum makes X25519MLKEM768 the first offered TLS 1.3
# group while retaining classical X25519 fallback. webpki-tokio = webpki-roots
# trust anchors (no OS native-certs dependency for self-hostable hyperscaler posture).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "logging"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs", "webpki-tokio"] }
# Axum HTTP framework (ADR-0090 sanctioned-with-justification; isolated to app/adapter layers).
# Used by ci-webhook-gateway and similar microservices that expose HTTP surfaces.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Leptos SSR executor initialization; native streaming renders can run before the server-function
# handler that otherwise initializes this transitively.
any_spawner = "=0.3.0"
# Canonical native Axum integration for the Leptos application shell. Keep this a direct
# workspace dependency so reindeer materializes the public Buck2 alias consumed by the host.
leptos_axum = "=0.8.9"
# reqwest HTTP client — workspace pin so all crates share one resolved version.
# Used by ci-controller-github-adapter (status poster), ci-tide-github-adapter
# (GitHub status/merge API), and gateway adapters. Destination is hyper-direct per line 1094.
# blocking feature: adapter layers implementing synchronous kernel traits.
# rustls: TLS via aws-lc-rs/rustls (no native-tls / OpenSSL dep).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
# Tower middleware stack — utility layer for axum/hyper service composition.
tower = { version = "0.5", default-features = false, features = ["util"] }
# Collision-detecting Git SHA-1 verification; direct so Reindeer publishes the Buck alias.
sha1-checked = { version = "0.10", default-features = false }
# RustCrypto SHA-2. OSI-clean (MIT/Apache-2.0); no ring/aws-lc-rs dependency.
#
# `hmac` and `subtle` were both removed here rather than bumped, because neither
# had a consumer. The REASON matters and the earlier note recorded it wrongly:
# ci-webhook-gateway has NOT moved to ed25519. It still verifies HMAC-SHA256, and
# prefers it (oya/ci-webhook-gateway/src/receiver.rs: "HMAC-SHA256 (preferred) or
# ed25519"). Both crates are unused because that gateway HAND-ROLLS the primitives
# on top of `sha2`:
#   - RFC 2104 HMAC in signature.rs `hmac_sha256` ("using only sha2 — no hmac dep")
#   - constant-time compare in signature.rs `ct_eq_bytes` ("no subtle dep")
# That is a deliberate-looking choice with no recorded rationale, and it is
# tracked as a defect, not endorsed here: registry/fixuptasks.jsonl F-HSA-O8 and
# F-QUAL-CONSTTIME already cover hand-rolled constant-time comparison across the
# repo, and F-SEC-WEBHOOK-HMAC (added with this change) covers the hand-rolled MAC.
# Removing the declarations does not change the resolved graph: `hmac` remains in
# Cargo.lock via hkdf and sqlx-postgres.
sha2 = "0.10"

# Real X.509 issuance (rcgen) + parsing (x509-parser) for the workload-identity
# X.509-SVID trust substrate (G002 slice-1b-i; ADR-0561, ADR-0506). BOTH are
# pinned onto the aws-lc-rs crypto backend and FORBIDDEN from pulling ring:
#   - rcgen default-features pull ring, so default-features=false + the aws_lc_rs
#     feature selects AWS-LC (ADR-0506). pem = base64 PEM serialization;
#     x509-parser = Issuer::from_ca_cert_pem support (unused here but feature-gated
#     off the default path stays ring-free).
#   - x509-parser's `verify` feature uses ring; `verify-aws` uses aws-lc-rs. We
#     enable ONLY verify-aws so signature verification stays on AWS-LC with NO ring.
# The kernel-purity gate + the no-ring dep-tree check both reject a ring edge.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify-aws"] }
# `time` is rcgen's validity-window type (CertificateParams::not_before/not_after
# are time::OffsetDateTime); rcgen does not re-export it, so the trustd domain
# pins it at the workspace seam to convert its unix-seconds Validity. No default
# features (no std formatting machinery beyond what we use).
time = { version = "0.3", default-features = false }

# Dedup baseline added 2026-05-15 (audit item #6: "workspace.dependencies has
# 7 entries total; the dedup table you wrote a workspace for is empty for all
# the deps that need deduping"). Versions chosen to satisfy the highest pin
# seen across crates so no crate's semver range narrows.
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
walkdir = "2"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
# Cedar authorization engine (AWS, Apache-2.0) — formally-verified default-deny +
# forbid-overrides-permit policy evaluation. Isolated to the workload-authz adapter
# per ADR-0183 (Cedar app-authz). See registry/dependency-rationales.json.
cedar-policy = "4.11"
# ClickHouse 26.3 LTS OLAP client — dependency-seam: isolated to
# shared-olap-clickhouse-adapter only (layer_seam=adapter-only per ADR-0092).
# Version pin matches manifest.json lts_pins.clickhouse = "26.3.10.60-lts".
# See registry/dependency-blessed-allowlist.json and registry/dependency-rationales.json.
clickhouse = { version = "0.13", default-features = false, features = ["lz4"] }

# Kubernetes client + controller-runtime + API types (ADR-0376 managed-k8s
# control-plane-host adapter seam; policy_ref ADR-0092 layer_seam adapter-only).
# Isolated to managed-k8s-control-plane-host-adapter-capi ONLY — the live
# Kamaji TenantControlPlane / Talos control-plane CRD reconciliation is
# honest-deferred (registry/placeholder-debt/adr-follow-ups.yaml#kamaji-provider-live-integration),
# so the adapter references kube-rs's dynamic API surface and returns a typed
# Unimplemented rather than faking reconciliation. See registry/dependency-rationales.json.
kube = { version = "3.1", default-features = false, features = ["client", "runtime", "rustls-tls"] }
kube-runtime = { version = "3.1", default-features = false }
k8s-openapi = { version = "0.27", default-features = false, features = ["latest"] }

# Workspace lints — DENY since 2026-05-15. Phase E1 promotion fully landed:
# 128-warning cleanup arc + Tier 1 refactors at 7 production `.expect()` sites
# (PrivacyDataClass::internal_only(), CapabilityCostProfile direct
# construction, deterministic indexing on AuditChain::events, append_legacy_*
# Result propagation). Site 3 (`append_classifications`) authorized by
# ADR-0083 amendment 6a84735 (2026-05-15) + audit-chain-domain version
# bump 0.1.0 → 0.2.0 + ~30 call-site `?` propagation in commit 4a434a7.
# Each workspace member opts in via `[lints] workspace = true` in its own
# Cargo.toml.
#
# Tests legitimately use `.unwrap()`, `.expect()`, and `panic!`. Exemption
# pattern: each crate's lib.rs / main.rs carries
#   #![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used, clippy::panic))]
# so DENY applies to production code and ALLOW applies under `cfg(test)`.
# Integration tests under `tests/` are separate crates that carry their own
# per-file `#![allow(...)]` header.
[workspace.lints.clippy]
# TEMPORARY: relaxed from "deny" to "allow" for the Wave 15 realignment PR landing.
# These patterns legitimately appear in inline `mod tests` blocks within src/lib.rs
# (per ADR-0083 Tier 3 test exemption). The canonical fix is per-crate
# `#![cfg_attr(test, allow(...))]` at the lib.rs top so deny applies to production
# and allow applies under cfg(test). Wave 15-ZA cleanup PR will:
#   1. Add `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used, clippy::panic))]`
#      to every crate's src/lib.rs that has an inline `mod tests` block.
#   2. Restore these three lints to "deny" to re-enforce the production hygiene.
# Per-µservice Cargo.toml files that override workspace.lints.clippy with their own
# "deny" remain enforced (e.g. data-warehouse, contact-center, performance-management).
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

# Release-profile hardening per 2026-05-15 audit + hyperscaler-grade
# performance/scalability bar (specs/oyatie-doctrine.json P8,
# docs/standards/hyperscaler-best-practices.md).
#
# panic = "abort"     — no unwinding in release; smaller binaries; faster panic
#                       paths; matches release-musl.yml static-binary deploy
#                       posture. Dev/test profiles keep panic = "unwind" so
#                       `#[should_panic]` and `std::panic::catch_unwind` still
#                       work for tests.
# lto = true          — full link-time optimization across crate boundaries.
# codegen-units = 1   — single codegen unit = better whole-program optimization.
# strip = "symbols"   — strip debug symbols from release artifacts; smaller
#                       distroless image surface per supply-chain workflow.
#
# Build time trade-off accepted: release builds get slower (LTO + cgu=1), but
# release builds only run on tag (release-musl.yml) — they are not on the PR
# critical path (pr-tests.yml uses dev profile via cargo build/check/clippy
# and test profile via nextest).
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
