rust-version = "1.95.0"

[workspace.metadata.oya]
# v4.1 BNF registry: oya-<microservice>[-<bc>]-<layer> (flat catalog; no shared|vertical binary)
# Layer enum (13 canonical values per ADR-0056 amended by ADR-0105 + ADR-0106):
#   kernel|domain|usecase|app|adapter|infrastructure|cli|rest|grpc|graphql|worker|sdk|api
# Adopted patterns (ADR-0105 §Adopted Patterns):
#   oya-check-<feature>  — self-layering check family (the µservice IS the layer).
#   *-adapter-<backend>  — backend-qualifier sub-suffix where backend ∈
#                          {fake,inmemory,aws,oci,gcp,azure,postgres,redis,sqlite,...}.
# tools/ binding (ADR-0107 amended 2026-05-15 — NO implicit-app exception):
#   Every crate under tools/ MUST carry a canonical layer suffix from the enum.
#   Binary tools SHALL use `-app`. There is no directory-implicit naming.
#   Sole doctrinal carve-out: `oya-tooling-agent-read` is locked by CLAUDE.md
#   sanctioned-primitive contract (ADR-0053), not by a layer-enum exception.
# Microservice registry (open set; registered microservice names)
[workspace.metadata.oya.microservices.cloud]
owner = "council-cloud"
rationale = "Cloud infrastructure vertical: compute, storage, network, billing, IAM, KMS, observability."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.foundry]
owner = "council-foundry"
rationale = "Engineering platform vertical: evidence, eval, MCP gateway, capability registry, run/step pipeline."
adr_cite = "ADR-0056"
[workspace.metadata.oya.microservices.connect]
owner = "council-connect"
rationale = "Connect µservice (dual-context: Professional B2B + Personal B2C): mail, calendar, drive, messenger, meet, docs, sheets, slides, tasks."
adr_cite = "ADR-0056"

# M02 substrate µservices (registered when at least one workspace crate exists; see oya-shared-documentation-check-cli)
[workspace.metadata.oya.microservices.application]
owner = "council-application"
rationale = "Application B2B unified shell — tenants sign in, enable µservices à-la-carte (per ADR-0061)."
adr_cite = "ADR-0061"

[workspace.metadata.oya.microservices.ontology]
owner = "council-architecture"
rationale = "Cross-µservice information adapter (Palantir Ontology equivalent): Object Types + Link Types + Action Types + Functions; audit-chain provenance; RLS tenant isolation."
adr_cite = "ADR-0059"

[workspace.metadata.oya.microservices.tenancy]
owner = "platform-substrate"
rationale = "Substrate µservice: Tenant lifecycle, RLS partition key, customer × domain isolation (Bominal ADR-0018 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.identity]
owner = "platform-substrate"
rationale = "Substrate µservice: User, Person, Session, OIDC auth principal (Bominal ADR-0123 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.audit-chain]
owner = "platform-substrate"
rationale = "Substrate µservice: Merkle-sealed Ed25519 segments per (tenant_id, period) (Bominal ADR-0028 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.eventing]
owner = "platform-substrate"
rationale = "Substrate µservice: outbox → Kafka KRaft (Bominal ADR-0116 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.secrets]
owner = "platform-substrate"
rationale = "Substrate µservice: OpenBao + HSM per-cell SecretReference path."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.observability]
owner = "ops-sre-reliability"
rationale = "Substrate µservice: OpenTelemetry + VictoriaMetrics structured JSON logs + p50/p99/p999 histograms (Bominal ADR-0020 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.policy]
owner = "council-privacy"
rationale = "Substrate µservice: Cedar engine + per-tenant rule packs (Bominal ADR-0132 inherited)."
adr_cite = "ADR-0056"

[workspace.metadata.oya.microservices.data-boundary]
owner = "council-privacy"
rationale = "Substrate µservice: Data-Use Boundary enforcement, DSR cascade engine, tenant data isolation."
adr_cite = "ADR-0056"

# M02 µservices registered as planned (Phase-Spec exists; introducing phase will scaffold crates)
[workspace.metadata.oya.microservices.workflow]
owner = "council-architecture"
rationale = "Workflow µservice — cross-µservice action/orchestration adapter (per ADR-0059); n8n-class hero product per Workflow Studio scope. Introducing phase: M02-P12-workflow-engine."
adr_cite = "ADR-0059"
status = "planned"

[workspace.metadata.oya.microservices.kms]
owner = "platform-substrate"
rationale = "Substrate µservice: KMS envelope encryption + per-cell HSM (Bominal ADR-0111 inherited). Introducing phase: M02-P08-kms."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.search]
owner = "platform-substrate"
rationale = "Substrate µservice: pgroonga + Tantivy + Mecab-ko/Khaiii morphology. Introducing phase: M02-P09-search."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.vector]
owner = "platform-substrate"
rationale = "Substrate µservice: pgvector HNSW + per-tenant per-object-type embedding tables. Introducing phase: M02-P10-vector."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.finance-library]
owner = "council-architecture"
rationale = "Substrate µservice: Money/CurrencyCode/JournalEntry + PV/FV/NPV/IRR/WACC + depreciation/amortization (Bominal ADR-0120 inherited). Pure crate, no I/O. Introducing phase: M02-P11-finance-library."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.capability-registry]
owner = "axis-foundry"
rationale = "Substrate µservice: agent autonomy ceiling + capability registry (Bominal ADR-0107 inherited). Introducing phase: M02-P17-capability-registry."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.records]
owner = "platform-substrate"
rationale = "Substrate µservice: FHIR-R5-canonical records substrate; healthcare-pack adapters per ADR-0064 §1.5. Introducing phase: M02-P16-records."
adr_cite = "ADR-0056"
status = "planned"

# M03 workforce µservices (Phase-Specs exist; crates ship in M03)
[workspace.metadata.oya.microservices.hr]
owner = "axis-enterprise"
rationale = "HR µservice — employees / employments / classifications / organizations (Bominal ADR-0125 / 0126 inherited). KR pack pack #1 material_scope. Introducing phase: M03-P01-hr."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.payroll]
owner = "axis-enterprise"
rationale = "Payroll µservice — gross-to-net + 4대보험 EDI + 연말정산 + disbursement (KR pack #1 material_scope). Introducing phase: M03-P02-payroll."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.accounting]
owner = "axis-enterprise"
rationale = "Accounting µservice — K-GAAP double-entry + auto-journal from Payroll + period-close + Typst statements (KR pack #1 material_scope). Introducing phase: M03-P03-accounting."
adr_cite = "ADR-0056"
status = "planned"

[workspace.metadata.oya.microservices.medical]
owner = "axis-healthcare"
rationale = "Medical µservice — encounter / clinical / HIRA DUR / NHIS billing (KR pack #1 material_scope). Introducing phase: M04-P01-medical-clinical."
adr_cite = "ADR-0056"
status = "planned"

# M02-P18 Cloud sub-µservices (each owns a distinct kernel; per MASTERPLAN §2.1)
[workspace.metadata.oya.microservices.cloud-tenancy]
owner = "council-cloud"
rationale = "Cloud-tenancy µservice — runtime tenant lifecycle, cell binding, region pinning. Introducing phase: M02-P18-cloud-tenancy."
adr_cite = "ADR-0056"
status = "active"

[workspace.metadata.oya.microservices.cloud-iam]
owner = "council-cloud"
rationale = "Cloud-IAM µservice — runtime IAM (separate from substrate identity; for service-to-service auth). Introducing phase: M02-P18-cloud-tenancy."
adr_cite = "ADR-0056"
status = "active"

[workspace.metadata.oya.microservices.cloud-kms]
owner = "council-cloud"
rationale = "Cloud-KMS µservice — runtime KMS API (envelope encryption surface; differs from substrate kms which provides per-cell HSM). Introducing phase: M02-P18-cloud-tenancy."
adr_cite = "ADR-0056"
status = "active"

[workspace.metadata.oya.microservices.cloud-compute]
owner = "council-cloud"
rationale = "Cloud-compute µservice — VM / K8s / Functions / Capacity. Introducing phase: M02-P18-cloud-tenancy."
adr_cite = "ADR-0056"
status = "active"

[workspace.metadata.oya.microservices.cloud-storage]
owner = "council-cloud"
rationale = "Cloud-storage µservice — Object/Block/File runtime API. Introducing phase: M02-P18-cloud-tenancy."
adr_cite = "ADR-0056"
status = "active"

