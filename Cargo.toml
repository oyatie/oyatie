rust-version = "1.95.0"

# Workspace lints baseline (TEMPORARY — re-tighten under Wave 15-ZA cleanup PR per ADR-0346 successor).
#
# `dead_code` + `unused_imports` are intentionally relaxed workspace-wide because:
# 1. Wave 15-IMPL-truth-up scaffolded ~140 crates with declared-but-undispatched types/fns
#    pending owning-IP execution (per anti-stamping discipline). These show as dead_code.
# 2. Origin/dev #172-#176 merge introduced unused imports that our local doesn't reference
#    (post-merge `-X ours` strategy preserved our shape; their imports came along for ride).
#
# CI uses `cargo clippy --workspace --all-targets --keep-going -- -D warnings` which would
# otherwise escalate these to errors and block the realignment PR landing.
# Wave 15-ZA will: (a) wire dispatch for scaffolded modules, (b) prune merge-fallout
# unused imports, (c) restore these to `deny` to re-enforce the strict baseline.
[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"

[workspace.metadata.oya]
# v4.1 BNF registry: oya-<microservice>[-<bc>]-<layer> (flat catalog; no shared|vertical binary)
# Layer enum (13 canonical values per ADR-0056 amended by ADR-0105 + ADR-0106):
#   kernel|domain|usecase|app|adapter|infrastructure|cli|rest|grpc|graphql|worker|sdk|api
# Adopted patterns (ADR-0105 §Adopted Patterns):
#   oya-check-<feature>  — self-layering check family (the µservice IS the layer).
#   *-adapter-<backend>  — backend-qualifier sub-suffix where backend ∈
#                          {fake,inmemory,aws,oci,gcp,azure,postgres,redis,sqlite,...}.
# tools/ binding (ADR-0107 amended 2026-05-15 — NO implicit-app exception):
#   Every crate under tools/ MUST carry a canonical layer suffix from the enum.
