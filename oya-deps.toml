# oya-deps.toml — closed-schema DATA contract for Oyatie dependency automation.
# ADR-0535 rejects external dependency-bot adoption for the owned stack. The destination actuator is an
# in-house Rust bump-bot that opens scm-facts ChangeSets and runs license/advisory/version gates
# before proposing dependency changes. GitHub PRs are a transitional adapter, not the source of truth.
schema_version = "1.0.0"

[metadata]
purpose = "Owned dependency automation policy for the in-house Rust bump-bot."
owner = "cloud-ci-platform"
decision = "ADR-0535"
status = "accepted"

[automation]
engine = "owned-rust-bump-bot"
changeset_transport = "scm-facts"
github_actions = "adapter-only"
external_bots = "disabled"
merge_authority = "oya-ci-required"

[rust]
channel = "stable"
pin = "1.97.1"
update_policy = "latest-stable"
drift_guard = "cloud/cloud-ci/gates/oya-cloud-ci-freshness-app/src/rust_toolchain_drift.rs"
exclusions = ["cloud/cloud-kernel/"]

[supply_chain]
license_policy = "deny.toml"
advisory_policy = "cargo-deny"
audit_policy = "cargo-vet"
stewardship_registry = "specs/oss-stewardship-registry.json"
bot_gate = "cloud-ci-dependency-automation"

[[managed_file]]
path = "rust-toolchain.toml"
role = "rust-toolchain-pin"
update = "sync-rust-pin"
reason = "Canonical stable Rust toolchain pin."

[[managed_file]]
path = "Cargo.toml"
role = "workspace-msrv"
update = "sync-rust-pin"
reason = "Workspace MSRV follows the stable Rust pin."

[[managed_file]]
path = "Dockerfile.distroless"
role = "container-builder-toolchain"
update = "sync-rust-pin"
reason = "Release image builder uses the same Rust pin."

[[managed_file]]
path = "toolchains/BUCK"
role = "buck2-toolchain-comment"
update = "sync-rust-pin"
reason = "Buck2 toolchain documentation follows the same Rust pin."

[[managed_file]]
path = "docs/standards/dependency-policy.md"
role = "human-policy-summary"
update = "sync-rust-pin"
reason = "Human policy row remains aligned with the machine policy."
