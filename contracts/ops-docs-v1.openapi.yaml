# PURPOSE: OpenAPI 3.2 contract for the ops docs-portal BC per
# ralplan-docs-portal v7 + ADR-0066 (live code-introspection docs portal).
# Consumer of oya-ops-docs-portal-kernel types (ManifestPort + LiveFeedPort +
# ExtractorClass hot/warm/cold).
# Cedar-gated initially by ops-internal-public.cedar (M02-P20). Unsupported
# tenant-scoped reads are refused at the kernel port boundary.
# Per ADR-0067 §5: SSR p99 ≤500ms, SSE p99 ≤2s, 10k concurrent SSE.
# Per markdown-retirement-policy: this YAML is canonical source.
openapi: 3.2.0
info:
  title: Ops Docs Portal
  version: 1.0.0
  description: |
    Internal manifest and live-feed contract for ops.oyatie.com/workspace/docs.
    Models ADR/runbook/glossary/dead-code/link-broken events and extractor freshness:
    Hot ≤500ms / Warm ≤2s / Cold ≤10min.

    Registered in `/registry/artifact-capabilities-registry.json` per
    ADR-0069 v3.0.0.
  contact:
    name: council-foundry
  license:
    name: Apache-2.0
servers:
  - url: https://ops.oyatie.com
    description: Production (planned; foundation-prerequisite-gated)
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: manifest
    description: ManifestPort read-side projection
  - name: live-feed
    description: LiveFeedPort SSE stream
  - name: extractor
    description: Extractor lifecycle ops
paths:
  /workspace/docs/manifest:
    get:
      tags: [manifest]
      summary: Read the current docs portal manifest
      operationId: getManifest
      x-cedar-fragments: [ops-internal-public]
      parameters:
        - in: query
          name: class
          required: false
          schema:
            $ref: "#/components/schemas/ExtractorClass"
          x-oyatie-data-class: INTERNAL_ONLY
        - in: query
          name: include_stale
          required: false
          schema: { type: boolean, default: false }
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        "200":
          description: Manifest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestSnapshot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/docs/live:
    get:
      tags: [live-feed]
      summary: SSE stream of live docs portal events
      operationId: subscribeLiveFeed
      x-cedar-fragments: [ops-internal-public]
      parameters:
        - in: query
          name: since
          required: false
          schema:
            type: integer
            format: int64
            description: Unix timestamp ms; replay events emitted after this point
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        "200":
          description: text/event-stream of LiveFeedEvent records
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/LiveFeedEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/docs/api/v1/extractors/{extractor_id}/refresh:
    post:
      tags: [extractor]
      summary: Trigger extractor refresh (internal-sre+)
      operationId: refreshExtractor
      x-cedar-fragments: [ops-internal-public, ops-internal-sre]
      parameters:
        - in: path
          name: extractor_id
          required: true
          schema:
            $ref: "#/components/schemas/ExtractorId"
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshExtractorRequest"
      responses:
        "200":
          description: Manifest refresh applied; outcome reports event-recording status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshExtractorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Stale-timestamp conflict (monotonic invariant violated)
components:
  schemas:
    ExtractorClass:
      type: string
      enum: [hot, warm, cold]
      description: Per ADR-0066 §5 SLA budgets (Hot ≤500ms / Warm ≤2s / Cold ≤10min)
    ExtractorId:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
    ExtractorRecord:
      type: object
      additionalProperties: false
      required: [id, class, source_path, last_refreshed_unix_ms, manifest_record_count]
      properties:
        id:
          $ref: "#/components/schemas/ExtractorId"
          x-oyatie-data-class: INTERNAL_ONLY
        class:
          $ref: "#/components/schemas/ExtractorClass"
          x-oyatie-data-class: INTERNAL_ONLY
        source_path:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
        last_refreshed_unix_ms:
          type: integer
          format: int64
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
        manifest_record_count:
          type: integer
          format: int64
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
        is_stale:
          type: boolean
          description: Computed; true if (now - last_refreshed) > class.sla_budget_ms
          x-oyatie-data-class: INTERNAL_ONLY
    ManifestSnapshot:
      type: object
      additionalProperties: false
      required: [records, freshness_unix_ms, stale_record_count]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ExtractorRecord"
          x-oyatie-data-class: INTERNAL_ONLY
        freshness_unix_ms:
          type: integer
          format: int64
          x-oyatie-data-class: INTERNAL_ONLY
        stale_record_count:
          type: integer
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
    LiveFeedEventKind:
      type: string
      enum: [extractor-refreshed, manifest-row-changed, dead-code-detected, link-broken]
    LiveFeedEvent:
      type: object
      additionalProperties: false
      required: [kind, emitted_at_unix_ms, payload_hash]
      properties:
        kind:
          $ref: "#/components/schemas/LiveFeedEventKind"
          x-oyatie-data-class: INTERNAL_ONLY
        extractor_id:
          oneOf:
            - $ref: "#/components/schemas/ExtractorId"
            - type: "null"
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_scope:
          type: [string, "null"]
          description: SHA-256 hash of tenant id; never raw
          x-oyatie-data-class: INTERNAL_ONLY
        emitted_at_unix_ms:
          type: integer
          format: int64
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
        payload_hash:
          type: string
          description: SHA-256 of normalized event payload
          x-oyatie-data-class: INTERNAL_ONLY
    RefreshExtractorRequest:
      type: object
      additionalProperties: false
      required: [unix_ms]
      properties:
        unix_ms:
          type: integer
          format: int64
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
    RefreshExtractorOutcome:
      type: string
      enum: [applied-and-event-recorded, applied-but-event-recording-failed]
    RefreshExtractorResponse:
      type: object
      additionalProperties: false
      required: [extractor_id, outcome, last_refreshed_unix_ms, record_count]
      properties:
        extractor_id:
          $ref: "#/components/schemas/ExtractorId"
          x-oyatie-data-class: INTERNAL_ONLY
        outcome:
          $ref: "#/components/schemas/RefreshExtractorOutcome"
          x-oyatie-data-class: INTERNAL_ONLY
        last_refreshed_unix_ms:
          type: integer
          format: int64
          x-oyatie-data-class: INTERNAL_ONLY
        record_count:
          type: integer
          format: int64
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
    CedarDenyResponse:
      type: object
      additionalProperties: false
      required: [error, principal_role, resource]
      properties:
        error:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
        principal_role:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
        resource:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_fragment_denied_by:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
  responses:
    Unauthorized:
      description: Cedar denied (no principal context)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
    Forbidden:
      description: Cedar denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
