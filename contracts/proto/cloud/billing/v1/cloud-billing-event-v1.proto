// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package cloud.billing.v1;

message CloudBillingMeterUnit {
  string kind = 1;
  uint64 quantity_microunits = 2;
}

message CloudBillingEventIngest {
  string id = 1;
  string tenant_id = 2;
  string resource_id = 3;
  string region = 4;
  string metering_tag = 5;
  string kind = 6;
  repeated CloudBillingMeterUnit units = 7;
  string rate_card_ref = 8;
  uint64 occurred_at_epoch_seconds = 9;
  string idempotency_key = 10;
  string data_class = 11;
}
