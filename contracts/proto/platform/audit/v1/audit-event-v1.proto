// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package platform.audit.v1;

message AuditEventEd25519Signature {
  string key_id = 1;
  string public_key_hex = 2;
  string signature_hex = 3;
}

message AuditEvent {
  string id = 1;
  string tenant_id = 2;
  string surface = 3;
  string plane = 4;
  string purpose = 5;
  repeated string data_classes_touched = 6;
  string decision = 7;
  string idempotency_key = 8;
  uint64 emitted_at_epoch_seconds = 9;
  string tenant_shard = 10;
  uint64 sequence = 11;
  string previous_hash = 12;
  string hash = 13;
  string merkle_root = 14;
  AuditEventEd25519Signature ed25519_signature = 15;
}
