// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package platform.metering.v1;

message MeteringMeterUnit {
  string kind = 1;
  uint64 quantity_microunits = 2;
}

message MeteringEventIngest {
  string id = 1;
  string tenant_id = 2;
  string capability_id = 3;
  string plane = 4;
  repeated MeteringMeterUnit units = 5;
  string source_axis = 6;
  uint64 recorded_at_epoch_seconds = 7;
  string idempotency_key = 8;
  string data_class = 9;
}
