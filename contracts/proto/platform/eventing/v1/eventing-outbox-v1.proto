// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package platform.eventing.v1;

message EventingOutboxPublish {
  string tenant_id = 1;
  string target_topic = 2;
  string idempotency_key = 3;
  string payload_ref = 4;
  string payload_schema = 5;
  repeated string data_classes_touched = 6;
  repeated string regulatory_packs_consumed = 7;
}
