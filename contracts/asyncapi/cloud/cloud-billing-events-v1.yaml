asyncapi: 3.1.0
info:
  title: Oyatie Cloud Billing Events
  version: 1.0.0
  description: CloudEvents 1.0 envelope with Protobuf payload for Cloud billing event ingest.
defaultContentType: application/cloudevents+protobuf
channels:
  cloudBillingEvents:
    address: oya.cloud.billing
    messages:
      cloudBillingEventIngest:
        $ref: '#/components/messages/CloudBillingEventIngest'
operations:
  ingestCloudBillingEvent:
    action: send
    channel:
      $ref: '#/channels/cloudBillingEvents'
    messages:
      - $ref: '#/channels/cloudBillingEvents/messages/cloudBillingEventIngest'
components:
  messages:
    CloudBillingEventIngest:
      name: cloud.billing.event.ingest.v1
      title: Cloud billing event ingest
      contentType: application/cloudevents+protobuf
      headers:
        type: object
        additionalProperties: false
        required: [specversion, id, source, type, subject, time, datacontenttype]
        properties:
          specversion:
            const: '1.0'
          id:
            type: string
          source:
            const: oyatie://cloud/billing
          type:
            const: cloud.billing.event.ingest.v1
          subject:
            type: string
            description: tenant/{tenant_id}/resource/{resource_id}
          time:
            type: string
            format: date-time
          datacontenttype:
            const: application/protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema:
          $ref: '../proto/cloud/billing/v1/cloud-billing-event-v1.proto#/cloud.billing.v1.CloudBillingEventIngest'
