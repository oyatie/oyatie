asyncapi: 3.1.0
info:
  title: Oyatie Platform Metering Events
  version: 1.0.0
  description: CloudEvents 1.0 envelope with Protobuf payload for platform metering event ingest.
defaultContentType: application/cloudevents+protobuf
channels:
  platformMeteringEvents:
    address: oya.platform.metering
    messages:
      meteringEventIngest:
        $ref: '#/components/messages/MeteringEventIngest'
operations:
  ingestMeteringEvent:
    action: send
    channel:
      $ref: '#/channels/platformMeteringEvents'
    messages:
      - $ref: '#/channels/platformMeteringEvents/messages/meteringEventIngest'
components:
  messages:
    MeteringEventIngest:
      name: metering.event.ingest.v1
      title: Platform metering event ingest
      contentType: application/cloudevents+protobuf
      headers:
        type: object
        additionalProperties: false
        required: [specversion, id, source, type, subject, time, datacontenttype]
        properties:
          specversion:
            const: '1.0'
          id:
            type: string
          source:
            const: oyatie://platform/metering
          type:
            const: metering.event.ingest.v1
          subject:
            type: string
            description: tenant/{tenant_id}/capability/{capability_id}
          time:
            type: string
            format: date-time
          datacontenttype:
            const: application/protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema:
          $ref: '../../proto/platform/metering/v1/metering-event-v1.proto#/platform.metering.v1.MeteringEventIngest'
