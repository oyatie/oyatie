asyncapi: 3.0.0
info:
  title: Oyatie Platform Eventing Outbox
  version: 1.0.0
  description: CloudEvents 1.0 envelope with Protobuf payload for the platform eventing outbox publish boundary.
defaultContentType: application/cloudevents+protobuf
channels:
  platformEventingOutbox:
    address: oya.platform.eventing
    messages:
      eventingOutboxPublish:
        $ref: '#/components/messages/EventingOutboxPublish'
operations:
  publishEventingOutbox:
    action: send
    channel:
      $ref: '#/channels/platformEventingOutbox'
    messages:
      - $ref: '#/channels/platformEventingOutbox/messages/eventingOutboxPublish'
components:
  messages:
    EventingOutboxPublish:
      name: eventing.outbox.publish.v1
      title: Platform eventing outbox publish
      contentType: application/cloudevents+protobuf
      headers:
        type: object
        additionalProperties: false
        required: [specversion, id, source, type, subject, time, datacontenttype]
        properties:
          specversion:
            const: '1.0'
          id:
            type: string
          source:
            const: oyatie://platform/eventing
          type:
            const: eventing.outbox.publish.v1
          subject:
            type: string
            description: tenant/{tenant_id}/topic/{target_topic}
          time:
            type: string
            format: date-time
          datacontenttype:
            const: application/protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema:
          $ref: '../proto/platform/eventing/v1/eventing-outbox-v1.proto#/platform.eventing.v1.EventingOutboxPublish'
