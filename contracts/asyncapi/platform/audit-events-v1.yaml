asyncapi: 3.1.0
info:
  title: Oyatie Platform Audit Events
  version: 1.0.0
  description: CloudEvents 1.0 envelope with Protobuf payload for platform audit-chain event emission, including hash-chain, Merkle-root, and Ed25519 proof material.
defaultContentType: application/cloudevents+protobuf
channels:
  platformAuditEvents:
    address: oya.platform.audit
    messages:
      auditEventEmit:
        $ref: '#/components/messages/AuditEventEmit'
operations:
  emitAuditEvent:
    action: send
    channel:
      $ref: '#/channels/platformAuditEvents'
    messages:
      - $ref: '#/channels/platformAuditEvents/messages/auditEventEmit'
components:
  messages:
    AuditEventEmit:
      name: audit.event.emit.v1
      title: Platform audit-chain event emission
      contentType: application/cloudevents+protobuf
      headers:
        type: object
        additionalProperties: false
        required: [specversion, id, source, type, subject, time, datacontenttype]
        properties:
          specversion:
            const: '1.0'
          id:
            type: string
          source:
            const: oyatie://platform/audit-chain
          type:
            const: audit.event.emit.v1
          subject:
            type: string
            description: tenant/{tenant_id}/surface/{surface}
          time:
            type: string
            format: date-time
          datacontenttype:
            const: application/protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema:
          $ref: '../../proto/platform/audit/v1/audit-event-v1.proto#/platform.audit.v1.AuditEvent'
