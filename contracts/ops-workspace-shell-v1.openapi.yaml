# PURPOSE: OpenAPI 3.2 contract for the ops workspace shell BC per
# ralplan-ops-portal v7 §6(a). Surfaces from every ops µservice mount into
# this shell as SURFACE_CATALOG entries (Live | ReservedComingSoon | Retired).
# Consumer of ops-workspace-shell-kernel types (SurfaceCatalogPort).
# Cedar-gated by ops-internal-public.cedar (M02-P20) initially; tenant-tier
# overlays add ops-tenant-private.cedar + ops-internal-sre.cedar at Wave 5.
# Per ADR-0067 §5 perf authority: SSR p99 ≤500ms / SSE p99 ≤2s.
# Per markdown-retirement-policy: this YAML is canonical source; rustdoc/
# generated HTML view is downstream projection.
openapi: 3.2.0
info:
  title: Ops Workspace Shell
  version: 1.0.0
  description: |
    Mounts every ops microservice surface (docs-portal, dashboards, tenant-mgmt,
    capacity, on-call, ...) into a single workspace shell with SURFACE_CATALOG
    state-machine + Cedar visibility gating.

    Purpose: declared per agentic-dev directive 2026-05-12 — this artifact
    answers "why does this exist" via this description block.

    Registered in `/registry/artifact-capabilities-registry.json` per
    ADR-0069 v3.0.0. Validator: `oya gate validate active-artifact-contract`.
  contact:
    name: council-foundry
  license:
    name: Apache-2.0
servers:
  - url: https://ops.oyatie.com
    description: Production ops portal (planned; foundation-prerequisite-gated)
  - url: http://localhost:8080
    description: Local dev composition root
tags:
  - name: surface-catalog
    description: SurfaceCatalogPort operations (register / query / state-flip)
  - name: health
    description: Per-cell health
paths:
  /workspace:
    get:
      tags: [surface-catalog]
      summary: List Live workspace surfaces visible to the principal
      operationId: listLiveSurfaces
      x-cedar-fragments: [ops-internal-public]
      responses:
        "200":
          description: Live surfaces this principal can see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/api/v1/surfaces:
    get:
      tags: [surface-catalog]
      summary: Full surface catalog (admin-only)
      operationId: listAllSurfaces
      x-cedar-fragments: [ops-internal-public, ops-internal-admin]
      parameters:
        - in: query
          name: state
          required: false
          schema:
            $ref: "#/components/schemas/SurfaceState"
          x-oyatie-data-class: INTERNAL_ONLY
        - in: query
          name: visibility_tier
          required: false
          schema:
            $ref: "#/components/schemas/VisibilityTier"
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        "200":
          description: All surfaces matching the filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspace/api/v1/health:
    get:
      tags: [health]
      summary: Per-cell shell health
      operationId: shellHealth
      x-cedar-fragments: [ops-internal-public]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    SurfaceState:
      type: string
      enum: [reserved-coming-soon, live, retired]
      description: Surface lifecycle state per ops-workspace-shell-kernel
    VisibilityTier:
      type: string
      enum: [public, tenant-public, tenant-private, internal-public, internal-private, system-only]
      description: Cedar 6-tier visibility per ralplan-ops-portal v7 §6(d)
    SurfaceId:
      type: string
      description: Stable surface identifier (e.g., "docs-portal")
      pattern: "^[a-z][a-z0-9-]*$"
    Surface:
      type: object
      additionalProperties: false
      required: [id, canonical_route, visibility_tier, state, owning_bc_id]
      properties:
        id:
          $ref: "#/components/schemas/SurfaceId"
          x-oyatie-data-class: INTERNAL_ONLY
        canonical_route:
          type: string
          pattern: "^/workspace(/.+)?$"
          x-oyatie-data-class: INTERNAL_ONLY
        visibility_tier:
          $ref: "#/components/schemas/VisibilityTier"
          x-oyatie-data-class: INTERNAL_ONLY
        state:
          $ref: "#/components/schemas/SurfaceState"
          x-oyatie-data-class: INTERNAL_ONLY
        owning_bc_id:
          type: string
          description: Bounded-context id from /registry/bounded-contexts.json (e.g., "ops/docs-portal")
          pattern: "^[a-z][a-z0-9-]*/[a-z][a-z0-9-]*$"
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_fragments:
          type: array
          items: { type: string }
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: [string, "null"]
          x-oyatie-data-class: INTERNAL_ONLY
        retired_redirects_to:
          oneOf:
            - $ref: "#/components/schemas/SurfaceId"
            - type: "null"
          x-oyatie-data-class: INTERNAL_ONLY
    SurfaceListResponse:
      type: object
      additionalProperties: false
      required: [surfaces, count]
      properties:
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/Surface"
          x-oyatie-data-class: INTERNAL_ONLY
        count:
          type: integer
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, surface_count, version]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          x-oyatie-data-class: INTERNAL_ONLY
        surface_count:
          type: integer
          minimum: 0
          x-oyatie-data-class: INTERNAL_ONLY
        version:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
        cell_id:
          type: string
          x-oyatie-data-class: INTERNAL_ONLY
    CedarDenyResponse:
      type: object
      additionalProperties: false
      required: [error, policy_id]
      properties:
        error:
          type: string
          description: Human-readable Cedar deny reason
          x-oyatie-data-class: INTERNAL_ONLY
        policy_id:
          type: string
          description: Cedar policy identifier that denied the request
          x-oyatie-data-class: INTERNAL_ONLY
        principal:
          type: [string, "null"]
          description: Principal that was denied (may be omitted for unauthenticated requests)
          x-oyatie-data-class: INTERNAL_ONLY
  responses:
    Unauthorized:
      description: Cedar denied (no principal context)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
    Forbidden:
      description: Cedar denied (principal lacks role/visibility)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
  # Cedar deny response shape (shared with every ops BC).
  # Pulled into per-route response sets via $ref.
  # Future iteration: extract to /specs/openapi-shared-components.yaml
  # and consume via $ref so duplication is removed across all BC contracts
  # (DRY enforcement at OpenAPI level per architect-r1 amendment #7).
