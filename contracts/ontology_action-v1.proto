// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";
package oyatie.ontology.action.v1;
message ActionInvocationRequest { string tenant_id = 1; string principal_id = 2; string action_type_id = 3; string entity_id = 4; string idempotency_key = 5; AutonomyTier autonomy_tier = 6; }
message ActionInvocationReceipt { string decision_id = 1; string tenant_id = 2; string principal_id = 3; string action_type_id = 4; string entity_id = 5; string idempotency_key = 6; string audit_event_type = 7; uint64 occurred_at_epoch_seconds = 8; }
enum AutonomyTier { AUTONOMY_TIER_UNSPECIFIED = 0; AUTONOMY_TIER_T0_SUGGEST = 1; AUTONOMY_TIER_T1_ASSIST = 2; AUTONOMY_TIER_T2_EXECUTE_WITH_APPROVAL = 3; AUTONOMY_TIER_T3_AUTONOMOUS = 4; }
