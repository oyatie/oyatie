openapi: 3.2.0
info:
  title: Oyatie Platform DSR API
  version: 1.0.0
  description: Tenant-scoped DSR cascade execution contract with proof-of-erasure completion evidence.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/dsr/{dsr_id}:execute:
    post:
      operationId: executeDsrCascade
      summary: Execute a tenant-scoped DSR cascade across data-class-touching stores.
      security:
        - bearerAuth: []
      parameters:
        - name: dsr_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDsrCascadeExecuteRequest'
      responses:
        '202':
          description: DSR cascade completed or completed with lawful blocks and is ready for audit/trust-portal publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDsrCascadeExecuteSuccessResponse'
        '400':
          description: Request shape, DSR scope, target store, proof, acknowledgement, or data-class label is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDsrApiErrorResponse'
        '403':
          description: Tenant or authorization evidence denied DSR cascade execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDsrApiErrorResponse'
        '409':
          description: DSR cascade completion already exists for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDsrApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDsrApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    PlatformDsrCascadeTargetRequest:
      type: object
      required:
        - dispatch_id
        - dispatch_idempotency_key
        - ack_id
        - ack_status
        - axis
        - store_kind
        - store_id
        - region
        - cell_id
        - record_ref
        - data_class
        - processed_at_epoch_seconds
      properties:
        dispatch_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        dispatch_idempotency_key:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ack_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ack_status:
          type: string
          enum:
            - completed
            - permanent_block
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ack_reason:
          type: string
          nullable: true
          enum:
            - lawful_retention
            - subject_identity_unverified
            - store_unavailable
            - unsupported_action
            - residency_conflict
            - integrity_check_failed
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        axis:
          type: string
          enum:
            - saas
            - workspace
            - vertical
            - foundry
            - cloud
            - search
            - ads
            - analytics
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        store_kind:
          type: string
          enum:
            - tenant_table
            - workspace_object
            - vertical_record
            - foundry_memory
            - cloud_resource
            - search_index
            - ads_attribution
            - analytics_warehouse
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        store_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        record_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          enum:
            - PUBLIC
            - INTERNAL_ONLY
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PHI
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        proof_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        proof_method:
          type: string
          nullable: true
          enum:
            - kms_shred
            - record_delete
            - index_rebuild
            - cold_storage_purge
            - correction_applied
            - export_produced
            - restrict_applied
            - objection_applied
            - automated_decision_opt_out_applied
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_hash:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        witness_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        signer_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        signature_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        rekor_log_index:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
        processed_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrCascadeExecuteRequest:
      type: object
      required:
        - dsr_id
        - tenant_id
        - region
        - subject_ref
        - action
        - sla_tier
        - data_classes
        - received_at_epoch_seconds
        - deadline_epoch_seconds
        - completion_id
        - aggregate_proof_hash
        - signer_ref
        - signature_ref
        - rekor_log_index
        - completed_at_epoch_seconds
        - targets
      properties:
        dsr_id:
          type: string
          minLength: 1
          description: Must match the `{dsr_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        action:
          type: string
          enum:
            - erase
            - correct
            - export
            - restrict
            - object_to_processing
            - automated_decision_opt_out
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        sla_tier:
          type: string
          enum:
            - preview
            - stable
            - ga
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        received_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        deadline_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        completion_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        aggregate_proof_hash:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        signer_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        signature_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        rekor_log_index:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        completed_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        targets:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDsrCascadeTargetRequest'
          x-oyatie-rust-type: Vec<PlatformDsrCascadeTargetRequest>
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrCascadeExecuteSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/PlatformDsrCompletionRecord'
          x-oyatie-rust-type: PlatformDsrCompletionRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/PlatformDsrCascadeMetadata'
          x-oyatie-rust-type: PlatformDsrCascadeMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrCascadeMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          enum:
            - dsr.cascade.execute
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrCompletionRecord:
      type: object
      required:
        - dsr_id
        - tenant_id
        - subject_ref
        - action
        - completion_id
        - completion_status
        - sla_status
        - dispatch_ids
        - ack_ids
        - proof_ids
        - aggregate_proof_hash
        - signer_ref
        - signature_ref
        - rekor_log_index
        - completed_at_epoch_seconds
        - schema_version
        - store_count
      properties:
        dsr_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        action:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        completion_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        completion_status:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        sla_status:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        dispatch_ids:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        ack_ids:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        proof_ids:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        aggregate_proof_hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        signer_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        signature_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        rekor_log_index:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        completed_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        store_count:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/PlatformDsrApiErrorBody'
          x-oyatie-rust-type: PlatformDsrApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDsrApiErrorDetail'
          x-oyatie-rust-type: Vec<PlatformDsrApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    PlatformDsrApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
