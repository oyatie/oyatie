openapi: 3.2.0
info:
  title: Oyatie Platform Identity User API
  version: 1.0.0
  description: Cross-axis platform identity user upsert contract with per-tenant primary-identifier uniqueness and per-region IdP binding.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/tenants/{tenant_id}/identity/users/{user_id}:upsert:
    post:
      operationId: upsertPlatformIdentityUser
      summary: Upsert a tenant-scoped identity user with a regional identity-provider binding.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Authenticated bearer-token tenant; must match the path tenant.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityUserUpsertRequest'
      responses:
        '200':
          description: User profile created, updated, or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertSuccessResponse'
        '400':
          description: Request shape, path/body binding, IdP binding, or identity kernel invariant is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertApiErrorResponse'
        '403':
          description: Tenant, principal, or authorization evidence denied identity user upsert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertApiErrorResponse'
        '409':
          description: Primary identifier is already bound to another user in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUserUpsertApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    IdentityUserRoleRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityUserUpsertRequest:
      type: object
      required:
        - tenant_id
        - user_id
        - primary_identifier
        - display_name
        - roles
        - region_pack
        - identity_provider_id
        - external_subject
      properties:
        tenant_id:
          type: string
          description: Must match the `{tenant_id}` path parameter and authenticated tenant header.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        user_id:
          type: string
          description: Must match the `{user_id}` path parameter and use the usr_ identity shape.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        primary_identifier:
          type: string
          minLength: 1
          description: Per-tenant unique identifier, usually email or IdP-issued canonical login.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        display_name:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        roles:
          type: array
          items:
            $ref: '#/components/schemas/IdentityUserRoleRef'
          x-oyatie-rust-type: Vec<IdentityUserRoleRef>
          x-oyatie-data-class: INTERNAL_ONLY
        region_pack:
          type: string
          pattern: '^pack-[a-z0-9-]+$'
          description: Regional pack used to route this user's IdP binding.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        identity_provider_id:
          type: string
          pattern: '^idp_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        external_subject:
          type: string
          minLength: 1
          description: Provider-issued subject URI or subject key.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
    IdentityUserUpsertSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/IdentityUserRecord'
          x-oyatie-rust-type: IdentityUserRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/IdentityUserUpsertMetadata'
          x-oyatie-rust-type: IdentityUserUpsertMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityUserUpsertMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - principal_id
        - result
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        result:
          type: string
          enum:
            - created
            - updated
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityUserRecord:
      type: object
      required:
        - tenant_id
        - user_id
        - primary_identifier
        - display_name
        - roles
        - region_pack
        - identity_provider_id
        - external_subject
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        user_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        primary_identifier:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        display_name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        roles:
          type: array
          items:
            $ref: '#/components/schemas/IdentityUserRoleRef'
          x-oyatie-rust-type: Vec<IdentityUserRoleRef>
          x-oyatie-data-class: INTERNAL_ONLY
        region_pack:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        identity_provider_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        external_subject:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    IdentityUserUpsertApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/IdentityUserUpsertApiErrorBody'
          x-oyatie-rust-type: IdentityUserUpsertApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityUserUpsertApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/IdentityUserUpsertApiErrorDetail'
          x-oyatie-rust-type: Vec<IdentityUserUpsertApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityUserUpsertApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
