openapi: 3.2.0
info:
  title: Platform Delivery Fabric Observability API
  version: 1.0.0
  description: API-native long-step observation contract for delivery-fabric runs. Adapter status is recorded as evidence data only and cannot approve promotions by itself.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/delivery-fabric/runs/{run_id}/steps/{step_index}/observations:
    post:
      operationId: recordDeliveryStepObservation
      summary: Record a tenant-scoped delivery step observation without granting adapter authority.
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: step_index
          in: path
          required: true
          schema:
            type: integer
            format: uint32
            minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Tenant resolved from the authenticated principal. Implementations must not trust a body tenant_id override.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepObservationRecordRequest'
      responses:
        '201':
          description: Observation accepted or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationResponse'
        '400':
          description: Request shape, stale window, step binding, or metadata reference is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
        '403':
          description: Principal is not authorized to observe this delivery-fabric run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
        '409':
          description: Observation conflicts with the current run or step generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
    get:
      operationId: listDeliveryStepObservations
      summary: List API-native observations for one delivery-fabric step.
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: step_index
          in: path
          required: true
          schema:
            type: integer
            format: uint32
            minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Tenant resolved from the authenticated principal. It is the read-scope authority.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        '200':
          description: Observations visible to the authenticated tenant principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationListResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
        '403':
          description: Principal is not authorized to read this delivery-fabric run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepObservationErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    StepExecutionStatus:
      type: string
      enum:
        - pending
        - leased
        - running
        - succeeded
        - failed
        - retrying
        - timed-out
        - cancelled
      x-oyatie-rust-type: StepExecutionStatus
      x-oyatie-data-class: PUBLIC
    StepObservationKind:
      type: string
      enum:
        - lease-granted
        - started
        - heartbeat
        - awaiting-external-signal
        - long-running
        - completed
        - failed
        - timed-out
        - cancelled
      x-oyatie-rust-type: StepObservationKind
      x-oyatie-data-class: PUBLIC
    StepObservationSeverity:
      type: string
      enum:
        - info
        - warning
        - degraded
        - critical
      description: Degraded and critical observations block product/hyperscaler promotion until resolved or superseded by fresh evidence.
      x-oyatie-rust-type: StepObservationSeverity
      x-oyatie-data-class: PUBLIC
    MetadataRef:
      type: string
      minLength: 1
      pattern: '^[^\s:]+:[^\s]+$'
      description: Reference to an independently inspectable artifact, condition, adapter status, policy decision, or evidence row. Raw payloads, secrets, prompts, and logs are forbidden here.
      x-oyatie-rust-type: String
      x-oyatie-data-class: INTERNAL_ONLY
    StepObservationRecordRequest:
      type: object
      required:
        - step_id
        - attempt
        - observed_at_epoch_seconds
        - stale_after_epoch_seconds
        - status
        - kind
        - severity
        - condition_ref
        - evidence_refs
      properties:
        step_id:
          $ref: '#/components/schemas/MetadataRef'
        attempt:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        observed_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        stale_after_epoch_seconds:
          type: integer
          format: uint64
          minimum: 1
          description: Must be greater than observed_at_epoch_seconds.
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        status:
          $ref: '#/components/schemas/StepExecutionStatus'
        kind:
          $ref: '#/components/schemas/StepObservationKind'
        severity:
          $ref: '#/components/schemas/StepObservationSeverity'
        condition_ref:
          $ref: '#/components/schemas/MetadataRef'
        adapter_status_ref:
          anyOf:
            - $ref: '#/components/schemas/MetadataRef'
            - type: 'null'
          description: Optional bridge status reference. It is evidence data only and cannot approve a promotion without first-party policy/evidence decisions.
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MetadataRef'
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
    StepObservationRecord:
      allOf:
        - $ref: '#/components/schemas/StepObservationRecordRequest'
        - type: object
          required:
            - resource_id
            - tenant_id
            - cell_id
            - region
            - data_class
            - policy_domain
            - owner_ref
            - generation
            - observed_generation
            - status_condition_refs
            - audit_chain_ref
            - run_id
            - step_index
            - created_at_epoch_seconds
            - updated_at_epoch_seconds
            - blocks_promotion
          properties:
            resource_id:
              $ref: '#/components/schemas/MetadataRef'
            tenant_id:
              type: string
              minLength: 1
              description: Tenant from the authenticated principal.
              x-oyatie-rust-type: String
              x-oyatie-data-class: INTERNAL_ONLY
            cell_id:
              $ref: '#/components/schemas/MetadataRef'
            region:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: INTERNAL_ONLY
            data_class:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: INTERNAL_ONLY
            policy_domain:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: INTERNAL_ONLY
            owner_ref:
              $ref: '#/components/schemas/MetadataRef'
            generation:
              type: integer
              format: uint64
              minimum: 1
              x-oyatie-rust-type: u64
              x-oyatie-data-class: INTERNAL_ONLY
            observed_generation:
              type: integer
              format: uint64
              minimum: 0
              description: Must be less than or equal to generation.
              x-oyatie-rust-type: u64
              x-oyatie-data-class: INTERNAL_ONLY
            status_condition_refs:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/MetadataRef'
              x-oyatie-rust-type: Vec<String>
              x-oyatie-data-class: INTERNAL_ONLY
            audit_chain_ref:
              $ref: '#/components/schemas/MetadataRef'
            run_id:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: INTERNAL_ONLY
            step_index:
              type: integer
              format: uint32
              minimum: 0
              x-oyatie-rust-type: u32
              x-oyatie-data-class: INTERNAL_ONLY
            created_at_epoch_seconds:
              type: integer
              format: uint64
              minimum: 0
              x-oyatie-rust-type: u64
              x-oyatie-data-class: INTERNAL_ONLY
            updated_at_epoch_seconds:
              type: integer
              format: uint64
              minimum: 0
              description: Must be greater than or equal to created_at_epoch_seconds.
              x-oyatie-rust-type: u64
              x-oyatie-data-class: INTERNAL_ONLY
            blocks_promotion:
              type: boolean
              description: True when severity is degraded/critical or the observation is stale while the step is non-terminal.
              x-oyatie-rust-type: bool
              x-oyatie-data-class: PUBLIC
    StepObservationResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/StepObservationRecord'
          x-oyatie-rust-type: StepObservationRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/StepObservationResponseMetadata'
          x-oyatie-rust-type: StepObservationResponseMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    StepObservationListResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StepObservationRecord'
          x-oyatie-rust-type: Vec<StepObservationRecord>
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/StepObservationResponseMetadata'
          x-oyatie-rust-type: StepObservationResponseMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    StepObservationResponseMetadata:
      type: object
      required:
        - request_id
        - policy_decision_ref
        - audit_chain_ref
      properties:
        request_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        policy_decision_ref:
          $ref: '#/components/schemas/MetadataRef'
        audit_chain_ref:
          $ref: '#/components/schemas/MetadataRef'
    StepObservationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - evidence_ref
          properties:
            code:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: PUBLIC
            message:
              type: string
              minLength: 1
              x-oyatie-rust-type: String
              x-oyatie-data-class: PUBLIC
            evidence_ref:
              $ref: '#/components/schemas/MetadataRef'
