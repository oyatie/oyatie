openapi: 3.2.0
info:
  title: Oyatie Platform Tenant API
  version: 1.0.0
  description: Cross-axis platform tenant creation contract with immutable residency binding inputs.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/tenants/{tenant_id}:
    post:
      operationId: createPlatformTenant
      summary: Create a globally unique tenant with an initial home region, residency class, and regulatory pack set.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Operator tenant from the authenticated platform principal; not the tenant being created.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, residency label, or tenant kernel invariant is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateApiErrorResponse'
        '403':
          description: Operator tenant, principal, or authorization evidence denied tenant creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateApiErrorResponse'
        '409':
          description: Tenant id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreateApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    TenantRegulatoryPackRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    TenantCreateRequest:
      type: object
      required:
        - tenant_id
        - legal_name
        - home_region
        - residency_class
        - regulatory_packs
      properties:
        tenant_id:
          type: string
          description: Must match the `{tenant_id}` path parameter and must be globally unique.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        legal_name:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        home_region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        regulatory_packs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TenantRegulatoryPackRef'
          x-oyatie-rust-type: Vec<TenantRegulatoryPackRef>
          x-oyatie-data-class: INTERNAL_ONLY
    TenantCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/TenantRecord'
          x-oyatie-rust-type: TenantRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/TenantCreateMetadata'
          x-oyatie-rust-type: TenantCreateMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    TenantCreateMetadata:
      type: object
      required:
        - request_id
        - operator_tenant_id
        - principal_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        operator_tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    TenantRecord:
      type: object
      required:
        - tenant_id
        - legal_name
        - home_region
        - residency_class
        - regulatory_packs
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        legal_name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        home_region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        regulatory_packs:
          type: array
          items:
            $ref: '#/components/schemas/TenantRegulatoryPackRef'
          x-oyatie-rust-type: Vec<TenantRegulatoryPackRef>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    TenantCreateApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/TenantCreateApiErrorBody'
          x-oyatie-rust-type: TenantCreateApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    TenantCreateApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/TenantCreateApiErrorDetail'
          x-oyatie-rust-type: Vec<TenantCreateApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    TenantCreateApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
