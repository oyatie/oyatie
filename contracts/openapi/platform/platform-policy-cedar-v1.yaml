openapi: 3.2.0
info:
  title: Oyatie Platform Cedar Policy API
  version: 1.0.0
  description: Cross-axis platform Cedar policy publish contract with semver versions, tenant or global scope, and supersession chain metadata.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/cedar/policies/{policy_id}/versions/{version}:publish:
    post:
      operationId: publishCedarPolicy
      summary: Publish a versioned Cedar authorization policy for a tenant or global scope.
      security:
        - bearerAuth: []
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^pol_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Authenticated operator tenant from the bearer token; tenant-scoped policies declare their target in the request body scope.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CedarPolicyPublishRequest'
      responses:
        '201':
          description: Cedar policy version published or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishSuccessResponse'
        '400':
          description: Request shape, path/body binding, scope, effect, semver, or policy kernel invariant is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishApiErrorResponse'
        '403':
          description: Tenant, principal, or authorization evidence denied Cedar policy publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishApiErrorResponse'
        '409':
          description: Policy id and version already exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CedarPolicyPublishApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CedarPolicyScopeRef:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - global
            - tenant
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          nullable: true
          pattern: '^ten_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyRequiredAttribute:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyRuleRef:
      type: object
      required:
        - effect
        - principal_role
        - action
        - resource_prefix
      properties:
        effect:
          type: string
          enum:
            - allow
            - deny
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_role:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        action:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        resource_prefix:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        required_attribute:
          $ref: '#/components/schemas/CedarPolicyRequiredAttribute'
          nullable: true
          x-oyatie-rust-type: Option<CedarPolicyRequiredAttribute>
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyPublishRequest:
      type: object
      required:
        - policy_id
        - version
        - scope
        - rules
      properties:
        policy_id:
          type: string
          description: Must match the `{policy_id}` path parameter and use the pol_ policy id shape.
          pattern: '^pol_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        version:
          type: string
          description: Must match the `{version}` path parameter and use x.y.z semver.
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        scope:
          $ref: '#/components/schemas/CedarPolicyScopeRef'
          x-oyatie-rust-type: CedarPolicyScopeRef
          x-oyatie-data-class: INTERNAL_ONLY
        supersedes:
          type: string
          nullable: true
          description: Previous semver version superseded by this publication, when applicable.
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CedarPolicyRuleRef'
          x-oyatie-rust-type: Vec<CedarPolicyRuleRef>
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyPublishSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CedarPolicyRecord'
          x-oyatie-rust-type: CedarPolicyRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CedarPolicyPublishMetadata'
          x-oyatie-rust-type: CedarPolicyPublishMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyPublishMetadata:
      type: object
      required:
        - request_id
        - operator_tenant_id
        - principal_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        operator_tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyRecord:
      type: object
      required:
        - policy_id
        - version
        - scope
        - rules
        - schema_version
      properties:
        policy_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        scope:
          $ref: '#/components/schemas/CedarPolicyScopeRef'
          x-oyatie-rust-type: CedarPolicyScopeRef
          x-oyatie-data-class: INTERNAL_ONLY
        supersedes:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CedarPolicyRuleRef'
          x-oyatie-rust-type: Vec<CedarPolicyRuleRef>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CedarPolicyPublishApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CedarPolicyPublishApiErrorBody'
          x-oyatie-rust-type: CedarPolicyPublishApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyPublishApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CedarPolicyPublishApiErrorDetail'
          x-oyatie-rust-type: Vec<CedarPolicyPublishApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CedarPolicyPublishApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
