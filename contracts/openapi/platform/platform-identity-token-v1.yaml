openapi: 3.2.0
info:
  title: Oyatie Platform Identity Token API
  version: 1.0.0
  description: Cross-axis platform STS token issuance contract for purpose-bound short-lived credentials.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/identity/sts/token:
    post:
      operationId: issuePlatformIdentityToken
      summary: Issue a purpose-bound short-lived STS credential for the authenticated platform principal.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTokenIssueRequest'
      responses:
        '200':
          description: STS credential issued or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenIssueSuccessResponse'
        '400':
          description: Request shape, purpose, credential kind, scope, or identity kernel value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenIssueApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenIssueApiErrorResponse'
        '403':
          description: Tenant, authenticated-principal, or authorization evidence denied token issuance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenIssueApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTokenIssueApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    IdentityScopeRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenIssueRequest:
      type: object
      required:
        - tenant_id
        - subject_id
        - subject_kind
        - credential_kind
        - purpose
        - ttl_seconds
        - scopes
        - issued_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          description: Must match the authenticated tenant header and bearer-token tenant.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_id:
          type: string
          description: Must match the authenticated principal id.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_kind:
          type: string
          enum:
            - human
            - service
          description: Must match the authenticated principal kind.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        owning_capability_id:
          type: string
          nullable: true
          description: Required for service principals and must match authenticated principal ownership when present.
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        credential_kind:
          type: string
          enum:
            - sts
            - long_lived_api_key
          description: Only sts succeeds; long_lived_api_key is represented so policy denial is explicit.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          description: PascalCase purpose label from the privacy boundary registry.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ttl_seconds:
          type: integer
          format: uint64
          minimum: 1
          maximum: 3600
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdentityScopeRef'
          x-oyatie-rust-type: Vec<IdentityScopeRef>
          x-oyatie-data-class: INTERNAL_ONLY
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenIssueSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/IdentityTokenRecord'
          x-oyatie-rust-type: IdentityTokenRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/IdentityTokenIssueMetadata'
          x-oyatie-rust-type: IdentityTokenIssueMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenIssueMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - principal_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenRecord:
      type: object
      required:
        - tenant_id
        - subject_id
        - subject_kind
        - credential_kind
        - purpose
        - scopes
        - issued_at_epoch_seconds
        - expires_at_epoch_seconds
        - token_fingerprint
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_kind:
          type: string
          enum:
            - human
            - service
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        owning_capability_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        credential_kind:
          type: string
          enum:
            - sts
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/IdentityScopeRef'
          x-oyatie-rust-type: Vec<IdentityScopeRef>
          x-oyatie-data-class: INTERNAL_ONLY
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        expires_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        token_fingerprint:
          type: string
          pattern: '^sts1:[0-9a-f]{16}$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    IdentityTokenIssueApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/IdentityTokenIssueApiErrorBody'
          x-oyatie-rust-type: IdentityTokenIssueApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenIssueApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/IdentityTokenIssueApiErrorDetail'
          x-oyatie-rust-type: Vec<IdentityTokenIssueApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    IdentityTokenIssueApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
