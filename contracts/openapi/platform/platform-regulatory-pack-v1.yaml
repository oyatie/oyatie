openapi: 3.2.0
info:
  title: Oyatie Platform Regulatory Pack Binding API
  version: 1.0.0
  description: Cross-axis tenant regulatory pack and immutable residency binding contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/tenants/{tenant_id}/regulatory-packs:bind:
    post:
      operationId: bindRegulatoryPack
      summary: Bind a tenant to one or more regional regulatory packs and an immutable residency class.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Tenant being bound; must match the authenticated principal tenant and path tenant.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegulatoryPackBindRequest'
      responses:
        '201':
          description: Regulatory pack residency binding created or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindSuccessResponse'
        '400':
          description: Request shape, path/body binding, pack metadata, or residency invariant is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindApiErrorResponse'
        '403':
          description: Principal or authorization evidence denied regulatory pack binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindApiErrorResponse'
        '409':
          description: Tenant already has an immutable regulatory pack residency binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPackBindApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    RegulatoryPackControlRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindingPackRef:
      type: object
      required:
        - pack_id
        - region
        - residency_class
        - controls
      properties:
        pack_id:
          type: string
          minLength: 1
          description: Regional pack id, using the pack-* namespace.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        controls:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RegulatoryPackControlRef'
          x-oyatie-rust-type: Vec<RegulatoryPackControlRef>
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindRequest:
      type: object
      required:
        - tenant_id
        - primary_pack_id
        - home_region
        - cell_group_ref
        - residency_class
        - evidence_ref
        - bound_at_epoch_seconds
        - pack_refs
      properties:
        tenant_id:
          type: string
          description: Must match the `{tenant_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        primary_pack_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        home_region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_group_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        bound_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        pack_refs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RegulatoryPackBindingPackRef'
          x-oyatie-rust-type: Vec<RegulatoryPackBindingPackRef>
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/RegulatoryPackBindingRecord'
          x-oyatie-rust-type: RegulatoryPackBindingRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/RegulatoryPackBindMetadata'
          x-oyatie-rust-type: RegulatoryPackBindMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - principal_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindingRecord:
      type: object
      required:
        - tenant_id
        - primary_pack_id
        - home_region
        - cell_group_ref
        - residency_class
        - evidence_ref
        - bound_at_epoch_seconds
        - pack_refs
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        primary_pack_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        home_region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_group_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        bound_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        pack_refs:
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryPackBindingPackRef'
          x-oyatie-rust-type: Vec<RegulatoryPackBindingPackRef>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    RegulatoryPackBindApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/RegulatoryPackBindApiErrorBody'
          x-oyatie-rust-type: RegulatoryPackBindApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/RegulatoryPackBindApiErrorDetail'
          x-oyatie-rust-type: Vec<RegulatoryPackBindApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    RegulatoryPackBindApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
