openapi: 3.2.0
info:
  title: Oyatie Platform Object Graph Entity API
  version: 1.0.0
  description: Cross-axis Object Graph entity upsert contract with tenant row isolation, property tiers, data-class labels, and mutation event evidence.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/platform/tenants/{tenant_id}/object-graph/entities/{entity_id}:upsert:
    post:
      operationId: upsertObjectGraphEntity
      summary: Upsert a tenant-scoped Object Graph entity with tiered, data-classed properties.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^ent_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Authenticated bearer-token tenant; must match the path and body tenant.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectGraphEntityUpsertRequest'
      responses:
        '200':
          description: Object Graph entity created, updated, or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphEntityUpsertSuccessResponse'
        '400':
          description: Request shape, path/body binding, property tier, data class, or Object Graph kernel invariant is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorResponse'
        '403':
          description: Tenant, principal, or authorization evidence denied Object Graph entity upsert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    ObjectGraphEntityPropertyRef:
      type: object
      required:
        - name
        - value
        - tier
        - data_class
      properties:
        name:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value:
          type: string
          description: Serialized property value; the adjacent data_class carries the privacy classification for this value.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tier:
          type: string
          enum:
            - scalar
            - vector
            - timeseries
            - geo
            - ciphertext
            - struct
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          description: Privacy-program data-class label for the property value.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityUpsertRequest:
      type: object
      required:
        - tenant_id
        - entity_id
        - entity_type
        - property_refs
      properties:
        tenant_id:
          type: string
          description: Must match the `{tenant_id}` path parameter and authenticated tenant header.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        entity_id:
          type: string
          description: Must match the `{entity_id}` path parameter and use the ent_ entity shape.
          pattern: '^ent_[A-Za-z0-9_]+$'
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        entity_type:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        property_refs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ObjectGraphEntityPropertyRef'
          x-oyatie-rust-type: Vec<ObjectGraphEntityPropertyRef>
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityUpsertSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/ObjectGraphEntityRecord'
          x-oyatie-rust-type: ObjectGraphEntityRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/ObjectGraphEntityUpsertMetadata'
          x-oyatie-rust-type: ObjectGraphEntityUpsertMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityUpsertMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - principal_id
        - result
        - event_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        result:
          type: string
          enum:
            - created
            - updated
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        event_id:
          type: string
          description: Internal mutation-event evidence id emitted for the entity upsert.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityRecord:
      type: object
      required:
        - tenant_id
        - entity_id
        - entity_type
        - property_refs
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        entity_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        entity_type:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        property_refs:
          type: array
          items:
            $ref: '#/components/schemas/ObjectGraphEntityPropertyRef'
          x-oyatie-rust-type: Vec<ObjectGraphEntityPropertyRef>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    ObjectGraphEntityUpsertApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorBody'
          x-oyatie-rust-type: ObjectGraphEntityUpsertApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityUpsertApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/ObjectGraphEntityUpsertApiErrorDetail'
          x-oyatie-rust-type: Vec<ObjectGraphEntityUpsertApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    ObjectGraphEntityUpsertApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
