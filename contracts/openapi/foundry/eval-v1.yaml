openapi: 3.2.0
info:
  title: Oyatie Foundry Eval API
  version: 1.0.0
  description: Tenant-scoped eval run contract for per-capability golden sets, adversarial cohorts, and linguistic cohorts.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/capabilities/{capability_id}/eval-runs:
    post:
      operationId: runFoundryEval
      summary: Record a signed passing Foundry eval run for a capability.
      security:
        - bearerAuth: []
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundryEvalRunRequest'
      responses:
        '201':
          description: Eval set and eval run were accepted and recorded as passing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryEvalRunSuccessResponse'
        '400':
          description: Request shape, path/body capability binding, or eval set fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryEvalRunApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryEvalRunApiErrorResponse'
        '403':
          description: Tenant/principal authorization evidence does not grant the eval-run surface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryEvalRunApiErrorResponse'
        '422':
          description: Eval cohorts, signatures, thresholds, version binding, or idempotency fingerprint are semantically invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryEvalRunApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    FoundryEvalCaseRequest:
      type: object
      required:
        - case_id
        - locale
        - input_ref
        - expected_ref
      properties:
        case_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        locale:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        input_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        expected_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        adversarial_kind:
          type: string
          enum:
            - PromptInjection
            - DataClassViolation
            - AutonomyBypass
            - ToolExfiltration
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        deterministic_seed:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunRequest:
      type: object
      required:
        - tenant_id
        - capability_id
        - eval_set_version
        - metric
        - min_pass_rate_percent
        - min_p95_score_percent
        - signed_eval_set
        - cases
        - pass_rate_percent
        - p95_score_percent
        - adversarial_passed
        - linguistic_passed
        - signed_run
        - run_started_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          description: Must match the `{capability_id}` path parameter and use the `cap.` namespace.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        eval_set_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        metric:
          type: string
          enum:
            - ExactMatch
            - F1
            - Bleu
            - Rouge
            - HumanJudged
            - Composite
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        min_pass_rate_percent:
          type: integer
          format: uint8
          minimum: 1
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: INTERNAL_ONLY
        min_p95_score_percent:
          type: integer
          format: uint8
          minimum: 1
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: INTERNAL_ONLY
        signed_eval_set:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        cases:
          type: array
          items:
            $ref: '#/components/schemas/FoundryEvalCaseRequest'
          x-oyatie-rust-type: Vec<FoundryEvalCaseRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        pass_rate_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        p95_score_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        adversarial_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        linguistic_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        signed_run:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        run_started_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/FoundryEvalRunRecord'
          x-oyatie-rust-type: FoundryEvalRunRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/FoundryEvalRunMetadata'
          x-oyatie-rust-type: FoundryEvalRunMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunRecord:
      type: object
      required:
        - tenant_id
        - capability_id
        - eval_set_version
        - metric
        - pass_rate_percent
        - p95_score_percent
        - adversarial_passed
        - linguistic_passed
        - passed
        - signed_eval_set
        - signed_run
        - case_count
        - run_started_at_epoch_seconds
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        eval_set_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        metric:
          type: string
          enum:
            - ExactMatch
            - F1
            - Bleu
            - Rouge
            - HumanJudged
            - Composite
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        pass_rate_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        p95_score_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        adversarial_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        linguistic_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        signed_eval_set:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        signed_run:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        case_count:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        run_started_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunMetadata:
      type: object
      required:
        - request_id
        - idempotency_key
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        idempotency_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/FoundryEvalRunApiErrorBody'
          x-oyatie-rust-type: FoundryEvalRunApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/FoundryEvalRunApiErrorDetail'
          x-oyatie-rust-type: Vec<FoundryEvalRunApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryEvalRunApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
