openapi: 3.2.0
info:
  title: Oyatie Foundry Registry API
  version: 1.0.0
  description: Tenant-scoped capability publishing contract for Foundry registry records, MCP schemas, cost ceilings, and eval-gated publish readiness.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/foundry/capabilities/{capability_id}:publish:
    post:
      operationId: publishFoundryCapability
      summary: Publish a Foundry capability after schema, cost, provider, and eval gates pass.
      security:
        - bearerAuth: []
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundryCapabilityPublishRequest'
      responses:
        '201':
          description: Capability record was published after eval and schema gates passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishSuccessResponse'
        '400':
          description: Request shape, path/body binding, schema, provider, cost, data class, or tier input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorResponse'
        '403':
          description: Tenant/principal authorization evidence does not grant the capability-publish surface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorResponse'
        '409':
          description: Capability id has already been published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorResponse'
        '422':
          description: Eval gate, signatures, thresholds, cohorts, version binding, or idempotency fingerprint are semantically invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    FoundryCapabilityDescriptionRequest:
      type: object
      required:
        - agent_readable
        - human_readable
      properties:
        agent_readable:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        human_readable:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    FoundryCapabilityProviderRequest:
      type: object
      required:
        - preferred
        - fallback
      properties:
        preferred:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        fallback:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityCostProfileRequest:
      type: object
      required:
        - per_invocation_limit_micros
        - per_tenant_monthly_limit_micros
      properties:
        per_invocation_limit_micros:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        per_tenant_monthly_limit_micros:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityEvalCaseRequest:
      type: object
      required:
        - case_id
        - locale
        - input_ref
        - expected_ref
      properties:
        case_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        locale:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        input_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        expected_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        adversarial_kind:
          type: string
          enum:
            - PromptInjection
            - DataClassViolation
            - AutonomyBypass
            - ToolExfiltration
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        deterministic_seed:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishRequest:
      type: object
      required:
        - tenant_id
        - capability_id
        - namespace
        - version
        - description
        - provider
        - autonomy_tier_required
        - data_classes_touched
        - evidence_emission_topic
        - cost_profile
        - input_schema_json
        - output_schema_json
        - eval_set_version
        - eval_metric
        - min_pass_rate_percent
        - min_p95_score_percent
        - signed_eval_set
        - eval_cases
        - eval_pass_rate_percent
        - eval_p95_score_percent
        - eval_adversarial_passed
        - eval_linguistic_passed
        - signed_eval_run
        - owner_team
        - catalog_record_path
        - docs_path
        - published_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          description: Must match the `{capability_id}` path parameter and use the `cap.` namespace.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        namespace:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        description:
          $ref: '#/components/schemas/FoundryCapabilityDescriptionRequest'
          x-oyatie-rust-type: FoundryCapabilityDescriptionRequest
          x-oyatie-data-class: PUBLIC
        provider:
          $ref: '#/components/schemas/FoundryCapabilityProviderRequest'
          x-oyatie-rust-type: FoundryCapabilityProviderRequest
          x-oyatie-data-class: INTERNAL_ONLY
        autonomy_tier_required:
          type: string
          enum:
            - T1
            - T2
            - T3
            - T4
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes_touched:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_emission_topic:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cost_profile:
          $ref: '#/components/schemas/FoundryCapabilityCostProfileRequest'
          x-oyatie-rust-type: FoundryCapabilityCostProfileRequest
          x-oyatie-data-class: INTERNAL_ONLY
        input_schema_json:
          type: string
          description: JSON Schema object serialized as canonical JSON for runtime parity with the Rust MCP contract.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        output_schema_json:
          type: string
          description: JSON Schema object serialized as canonical JSON for runtime parity with the Rust MCP contract.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        eval_set_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        eval_metric:
          type: string
          enum:
            - ExactMatch
            - F1
            - Bleu
            - Rouge
            - HumanJudged
            - Composite
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        min_pass_rate_percent:
          type: integer
          format: uint8
          minimum: 1
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: INTERNAL_ONLY
        min_p95_score_percent:
          type: integer
          format: uint8
          minimum: 1
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: INTERNAL_ONLY
        signed_eval_set:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        eval_cases:
          type: array
          items:
            $ref: '#/components/schemas/FoundryCapabilityEvalCaseRequest'
          x-oyatie-rust-type: Vec<FoundryCapabilityEvalCaseRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        eval_pass_rate_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        eval_p95_score_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        eval_adversarial_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        eval_linguistic_passed:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        signed_eval_run:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        owner_team:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        catalog_record_path:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        docs_path:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        published_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/FoundryCapabilityPublishRecord'
          x-oyatie-rust-type: FoundryCapabilityPublishRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/FoundryCapabilityPublishMetadata'
          x-oyatie-rust-type: FoundryCapabilityPublishMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishRecord:
      type: object
      required:
        - tenant_id
        - capability_id
        - namespace
        - version
        - owner_team
        - autonomy_tier_required
        - data_classes_touched
        - provider_preference
        - evidence_emission_topic
        - eval_set_version
        - eval_pass_rate_percent
        - eval_p95_score_percent
        - eval_case_count
        - published_at_epoch_seconds
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        namespace:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        owner_team:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        autonomy_tier_required:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes_touched:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        provider_preference:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_emission_topic:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        eval_set_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        eval_pass_rate_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        eval_p95_score_percent:
          type: integer
          format: uint8
          minimum: 0
          maximum: 100
          x-oyatie-rust-type: u8
          x-oyatie-data-class: BEHAVIORAL_TENANT_PRODUCT
        eval_case_count:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        published_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishMetadata:
      type: object
      required:
        - request_id
        - idempotency_key
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        idempotency_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorBody'
          x-oyatie-rust-type: FoundryCapabilityPublishApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/FoundryCapabilityPublishApiErrorDetail'
          x-oyatie-rust-type: Vec<FoundryCapabilityPublishApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryCapabilityPublishApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
