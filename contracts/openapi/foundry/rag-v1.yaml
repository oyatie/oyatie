openapi: 3.2.0
info:
  title: Oyatie Foundry RAG API
  version: 1.0.0
  description: Tenant-scoped retrieval-augmented-generation citation contract with purpose-bound consent and privacy-program data-class enforcement.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/foundry/rag/{namespace}:retrieve:
    post:
      operationId: retrieveFoundryRag
      summary: Retrieve tenant-scoped citations for Foundry grounding.
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundryRagRetrieveRequest'
      responses:
        '200':
          description: Tenant-scoped citations were retrieved and consent/data-class gates were enforced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryRagRetrieveSuccessResponse'
        '400':
          description: Request shape, path namespace, tenant binding, query, or top-k value is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryRagRetrieveApiErrorResponse'
        '401':
          description: Principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryRagRetrieveApiErrorResponse'
        '403':
          description: Tenant boundary, authorization evidence, or purpose-bound consent denied retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryRagRetrieveApiErrorResponse'
        '422':
          description: Data-use purpose, privacy-program data class, hard-deny rule, consent receipt, or idempotency fingerprint is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryRagRetrieveApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    FoundryRagConsentReceiptRequest:
      type: object
      required:
        - receipt_id
        - purpose
        - data_class
        - subject_id
        - issued_at_epoch_seconds
      properties:
        receipt_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          enum:
            - SearchIndex
            - SearchIndexPrivate
            - SearchIndexPublic
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          enum:
            - INTERNAL_ONLY
            - PHI
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - PUBLIC
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveRequest:
      type: object
      required:
        - tenant_id
        - namespace
        - capability_id
        - query
        - top_k
        - data_use_purpose
        - allowed_data_classes
        - consent_receipts
        - search_index_id
        - index_tenant_id
        - index_epoch_seconds
        - retrieved_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        namespace:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        query:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: SEARCH_QUERY
        top_k:
          type: integer
          format: uint32
          minimum: 1
          maximum: 50
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        data_use_purpose:
          type: string
          enum:
            - SearchIndex
            - SearchIndexPrivate
            - SearchIndexPublic
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        allowed_data_classes:
          type: array
          minItems: 1
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        consent_receipts:
          type: array
          items:
            $ref: '#/components/schemas/FoundryRagConsentReceiptRequest'
          x-oyatie-rust-type: Vec<FoundryRagConsentReceiptRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        search_index_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        index_tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        index_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        retrieved_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/FoundryRagRetrieveRecord'
          x-oyatie-rust-type: FoundryRagRetrieveRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/FoundryRagRetrieveMetadata'
          x-oyatie-rust-type: FoundryRagRetrieveMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveRecord:
      type: object
      required:
        - tenant_id
        - namespace
        - capability_id
        - search_index_id
        - query_hash
        - data_use_purpose
        - data_classes
        - citations
        - retrieved_at_epoch_seconds
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        namespace:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        search_index_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        query_hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: SEARCH_QUERY
        data_use_purpose:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        citations:
          type: array
          items:
            $ref: '#/components/schemas/FoundryRagCitationRecord'
          x-oyatie-rust-type: Vec<FoundryRagCitationRecord>
          x-oyatie-data-class: INTERNAL_ONLY
        retrieved_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagCitationRecord:
      type: object
      required:
        - document_id
        - chunk_id
        - tenant_id
        - namespace
        - title
        - uri
        - excerpt
        - data_class
        - score_millis
        - indexed_at_epoch_seconds
      properties:
        document_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        chunk_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        namespace:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        title:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        uri:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        excerpt:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        consent_receipt_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        score_millis:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        indexed_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveMetadata:
      type: object
      required:
        - request_id
        - idempotency_key
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        idempotency_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/FoundryRagRetrieveApiErrorBody'
          x-oyatie-rust-type: FoundryRagRetrieveApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/FoundryRagRetrieveApiErrorDetail'
          x-oyatie-rust-type: Vec<FoundryRagRetrieveApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryRagRetrieveApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
