openapi: 3.2.0
info:
  title: Oyatie Foundry Policy API
  version: 1.0.0
  description: Tenant-scoped autonomy-ceiling policy publish contract with Cedar policy references and replayable decision evidence.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/foundry/policies/autonomy-ceilings/{policy_id}:publish:
    post:
      operationId: publishFoundryPolicyAutonomyCeiling
      summary: Publish a Cedar-backed tenant/capability autonomy ceiling policy.
      security:
        - bearerAuth: []
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundryPolicyAutonomyCeilingPublishRequest'
      responses:
        '201':
          description: Autonomy ceiling policy was published and the effective policy decision was recorded for replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryPolicyAutonomyCeilingPublishSuccessResponse'
        '400':
          description: Request shape, autonomy tier, capability action, subject class, Cedar reference, or data-class label is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryPolicyApiErrorResponse'
        '403':
          description: Tenant or authorization evidence denied Foundry autonomy policy publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryPolicyApiErrorResponse'
        '409':
          description: Autonomy policy already exists for the tenant and policy id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryPolicyApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundryPolicyApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    FoundryPolicyAutonomyCeilingPublishRequest:
      type: object
      required:
        - policy_id
        - tenant_id
        - capability_id
        - policy_version
        - tenant_configured_ceiling
        - principal_ceiling
        - capability_required_tier
        - capability_action
        - data_classes
        - regulatory_packs
        - subject_class
        - cedar_policy_refs
        - evidence_event_hash
        - published_at_epoch_seconds
      properties:
        policy_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        policy_version:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_configured_ceiling:
          type: string
          enum:
            - t1_view_only
            - t2_advisory
            - t3_execute_with_approval
            - t4_auto_execute
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_ceiling:
          type: string
          enum:
            - t1_view_only
            - t2_advisory
            - t3_execute_with_approval
            - t4_auto_execute
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_required_tier:
          type: string
          enum:
            - t1_view_only
            - t2_advisory
            - t3_execute_with_approval
            - t4_auto_execute
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_action:
          type: string
          enum:
            - other
            - ads_bid
            - ads_budget_adjust
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        regulatory_packs:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        subject_class:
          type: string
          enum:
            - adult
            - authority
            - elderly
            - vulnerable
            - minor_under13
            - minor_under14
            - minor_under16
            - minor_under19
            - minor_unknown
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_policy_refs:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_event_hash:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        published_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryPolicyAutonomyCeilingPublishSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/FoundryPolicyAutonomyCeilingRecord'
          x-oyatie-rust-type: FoundryPolicyAutonomyCeilingRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/FoundryPolicyAutonomyMetadata'
          x-oyatie-rust-type: FoundryPolicyAutonomyMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryPolicyAutonomyMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryPolicyAutonomyCeilingRecord:
      type: object
      required:
        - policy_id
        - tenant_id
        - capability_id
        - policy_version
        - capability_action
        - data_classes
        - regulatory_packs
        - subject_class
        - configured_ceiling
        - principal_ceiling
        - capability_required_tier
        - agentic_ads_cap
        - vertical_pack_cap
        - subject_class_cap
        - denial_threshold
        - effective_ceiling
        - verdict
        - lowering_cap_source
        - lowering_cap_reason
        - cedar_policy_refs
        - evidence_event_hash
        - published_at_epoch_seconds
        - schema_version
      properties:
        policy_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        policy_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_action:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        regulatory_packs:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        subject_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        configured_ceiling:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        principal_ceiling:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        capability_required_tier:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        agentic_ads_cap:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        vertical_pack_cap:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subject_class_cap:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        denial_threshold:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        effective_ceiling:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        verdict:
          type: string
          enum:
            - allow
            - deny
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        blocking_cap_source:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        blocking_cap_reason:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        lowering_cap_source:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        lowering_cap_reason:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_policy_refs:
          type: array
          items:
            type: string
          x-oyatie-rust-type: Vec<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_event_hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        published_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    FoundryPolicyApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/FoundryPolicyApiErrorBody'
          x-oyatie-rust-type: FoundryPolicyApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryPolicyApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/FoundryPolicyApiErrorDetail'
          x-oyatie-rust-type: Vec<FoundryPolicyApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    FoundryPolicyApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
