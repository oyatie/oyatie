openapi: 3.2.0
info:
  title: Oyatie Cloud Region API
  version: 1.0.0
  description: Authenticated Cloud region and availability-zone listing contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/regions:
    get:
      operationId: listCloudRegions
      summary: List provider-facing Cloud regions and their public regional-pack metadata.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        '200':
          description: Region catalog returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionListSuccessResponse'
        '400':
          description: Request headers or region value contracts are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
        '403':
          description: Tenant, principal, or authorization decision denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
        '404':
          description: Referenced Cloud Region resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
  /v1/cloud/regions/{region_code}/azs:
    get:
      operationId: listCloudAzs
      summary: List availability zones for a single Cloud region.
      security:
        - bearerAuth: []
      parameters:
        - name: region_code
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        '200':
          description: Availability-zone catalog returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAzListSuccessResponse'
        '400':
          description: Request headers, path parameter, or region value contracts are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
        '403':
          description: Tenant, principal, or authorization decision denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
        '404':
          description: Cloud Region resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudRegionApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudRegionListSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionRecord'
          x-oyatie-rust-type: Vec<CloudRegionRecord>
          x-oyatie-data-class: PUBLIC
        metadata:
          $ref: '#/components/schemas/CloudRegionApiMetadata'
          x-oyatie-rust-type: CloudRegionApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudAzListSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CloudAzRecord'
          x-oyatie-rust-type: Vec<CloudAzRecord>
          x-oyatie-data-class: PUBLIC
        metadata:
          $ref: '#/components/schemas/CloudRegionApiMetadata'
          x-oyatie-rust-type: CloudRegionApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudRegionApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudRegionRecord:
      type: object
      required:
        - code
        - display_name
        - regulatory_packs
        - azs
        - state
        - provider_facing
        - residency_strictness
        - created_at_epoch_seconds
        - schema_version
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        display_name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        regulatory_packs:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionRegulatoryPackRef'
          x-oyatie-rust-type: Vec<CloudRegionRegulatoryPackRef>
          x-oyatie-data-class: PUBLIC
        azs:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionAzRef'
          x-oyatie-rust-type: Vec<CloudRegionAzRef>
          x-oyatie-data-class: PUBLIC
        state:
          type: string
          enum:
            - planned
            - preview
            - ga
            - retiring
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        provider_facing:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        residency_strictness:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: PUBLIC
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudRegionRegulatoryPackRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    CloudRegionAzRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    CloudRegionPowerZoneRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    CloudRegionCellRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    CloudAzRecord:
      type: object
      required:
        - code
        - region_code
        - power_zones
        - cells
        - state
        - created_at_epoch_seconds
        - schema_version
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        region_code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        power_zones:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionPowerZoneRef'
          x-oyatie-rust-type: Vec<CloudRegionPowerZoneRef>
          x-oyatie-data-class: PUBLIC
        cells:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionCellRef'
          x-oyatie-rust-type: Vec<CloudRegionCellRef>
          x-oyatie-data-class: PUBLIC
        state:
          type: string
          enum:
            - planned
            - active
            - dr_only
            - retiring
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: PUBLIC
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudRegionApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudRegionApiErrorBody'
          x-oyatie-rust-type: CloudRegionApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudRegionApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudRegionApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudRegionApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudRegionApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
