openapi: 3.2.0
info:
  title: Oyatie Cloud FinOps Report API
  version: 1.0.0
  description: Tenant-scoped Cloud FinOps report generation contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/finops/reports/{report_id}:
    post:
      operationId: generateCloudFinopsReport
      summary: Generate a tenant-scoped Cloud FinOps cost report.
      security:
        - bearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudFinopsReportGenerateRequest'
      responses:
        '201':
          description: FinOps report generated and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsReportGenerateSuccessResponse'
        '400':
          description: Request shape, period, axis, data class, pricing, or report contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsApiErrorResponse'
        '403':
          description: Tenant, authorization, or resource scope policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsApiErrorResponse'
        '409':
          description: Report generation conflicts with an existing immutable report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsApiErrorResponse'
        '422':
          description: Idempotency key drift or report inputs cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudFinopsApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudFinopsReportGenerateRequest:
      type: object
      required:
        - id
        - tenant_id
        - region
        - period
        - axes
        - anomaly_policy
        - minimum_gross_margin_bps
        - data_class
      properties:
        id:
          type: string
          description: Must match the `{report_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        period:
          $ref: '#/components/schemas/CloudFinopsPeriodRequest'
          x-oyatie-rust-type: CloudFinopsPeriodRequest
          x-oyatie-data-class: INTERNAL_ONLY
        baseline_period:
          $ref: '#/components/schemas/CloudFinopsPeriodRequest'
          nullable: true
          x-oyatie-rust-type: Option<CloudFinopsPeriodRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        axes:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsAxisRef'
          x-oyatie-rust-type: Vec<CloudFinopsAxisRef>
          x-oyatie-data-class: INTERNAL_ONLY
        anomaly_policy:
          $ref: '#/components/schemas/CloudFinopsReportAnomalyPolicyRequest'
          x-oyatie-rust-type: CloudFinopsReportAnomalyPolicyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        minimum_gross_margin_bps:
          type: integer
          format: uint16
          minimum: 0
          maximum: 10000
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsPeriodRequest:
      type: object
      required:
        - start_epoch_seconds
        - end_epoch_seconds
      properties:
        start_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        end_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsAxisRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          enum:
            - saas
            - foundry
            - cloud
            - search
            - ads
            - marketplace
            - vertical
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsReportAnomalyPolicyRequest:
      type: object
      required:
        - spend_growth_threshold_bps
        - min_absolute_delta_minor_units
      properties:
        spend_growth_threshold_bps:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
        min_absolute_delta_minor_units:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: FINANCIAL_KR_신용정보
    CloudFinopsReportGenerateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudFinopsReportRecord'
          x-oyatie-rust-type: CloudFinopsReportRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        metadata:
          $ref: '#/components/schemas/CloudFinopsReportMetadata'
          x-oyatie-rust-type: CloudFinopsReportMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsReportMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - region
        - axis_count
        - resource_count
        - anomaly_count
        - recommendation_count
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        axis_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        resource_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        anomaly_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        recommendation_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsMoneyRecord:
      type: object
      required:
        - currency
        - minor_units
      properties:
        currency:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        minor_units:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: FINANCIAL_KR_신용정보
    CloudFinopsReportRecord:
      type: object
      required:
        - id
        - tenant_id
        - region
        - period_start_epoch_seconds
        - period_end_epoch_seconds
        - axes
        - axis_costs
        - resource_costs
        - anomalies
        - recommendations
        - total_cost
        - total_cost_of_revenue
        - gross_margin_bps
        - minimum_gross_margin_bps
        - data_class
        - schema_version
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        period_start_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        period_end_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        axes:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsAxisRef'
          x-oyatie-rust-type: Vec<CloudFinopsAxisRef>
          x-oyatie-data-class: INTERNAL_ONLY
        axis_costs:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsAxisCostRecord'
          x-oyatie-rust-type: Vec<CloudFinopsAxisCostRecord>
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        resource_costs:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsResourceCostRecord'
          x-oyatie-rust-type: Vec<CloudFinopsResourceCostRecord>
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsCostAnomalyRecord'
          x-oyatie-rust-type: Vec<CloudFinopsCostAnomalyRecord>
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsRecommendationRecord'
          x-oyatie-rust-type: Vec<CloudFinopsRecommendationRecord>
          x-oyatie-data-class: INTERNAL_ONLY
        total_cost:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        total_cost_of_revenue:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        gross_margin_bps:
          type: integer
          format: uint16
          minimum: 0
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
        minimum_gross_margin_bps:
          type: integer
          format: uint16
          minimum: 0
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudFinopsAxisCostRecord:
      type: object
      required:
        - axis
        - actual_cost
        - cost_of_revenue
        - gross_margin_bps
      properties:
        axis:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        actual_cost:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        cost_of_revenue:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        gross_margin_bps:
          type: integer
          format: uint16
          minimum: 0
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
        budget:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          nullable: true
          x-oyatie-rust-type: Option<CloudFinopsMoneyRecord>
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        budget_utilization_bps:
          type: integer
          format: uint16
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u16>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsResourceCostRecord:
      type: object
      required:
        - resource_id
        - axis
        - actual_cost
        - cost_of_revenue
        - gross_margin_bps
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        axis:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        actual_cost:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        cost_of_revenue:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        gross_margin_bps:
          type: integer
          format: uint16
          minimum: 0
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsCostAnomalyRecord:
      type: object
      required:
        - kind
        - axis
        - actual_cost
        - threshold_bps
      properties:
        kind:
          type: string
          enum:
            - spend_spike
            - budget_soft_limit
            - budget_hard_limit
            - margin_below_target
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        axis:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        resource_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        actual_cost:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          x-oyatie-rust-type: CloudFinopsMoneyRecord
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        baseline_cost:
          $ref: '#/components/schemas/CloudFinopsMoneyRecord'
          nullable: true
          x-oyatie-rust-type: Option<CloudFinopsMoneyRecord>
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        threshold_bps:
          type: integer
          format: uint16
          minimum: 0
          x-oyatie-rust-type: u16
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsRecommendationRecord:
      type: object
      required:
        - id
        - kind
        - axis
        - evidence_anomaly
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kind:
          type: string
          enum:
            - investigate_spend_spike
            - purchase_commitment
            - downsize_resource
            - review_rate_card
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        axis:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        resource_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        evidence_anomaly:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudFinopsApiErrorBody'
          x-oyatie-rust-type: CloudFinopsApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudFinopsApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudFinopsApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudFinopsApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
