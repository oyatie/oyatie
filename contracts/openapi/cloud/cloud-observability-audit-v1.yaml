openapi: 3.2.0
info:
  title: Oyatie Cloud Observability Audit API
  version: 1.0.0
  description: Tenant-scoped CloudTrail-class audit read projection for Cloud Observability.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/observability/audit-records:read:
    query:
      operationId: readCloudObservabilityAudit
      summary: Read tenant-scoped Cloud control-plane audit records with cursor pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudObservabilityAuditReadRequest'
      responses:
        '200':
          description: Audit read page returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudObservabilityAuditReadSuccessResponse'
        '400':
          description: Request shape, scope, topic, window, or filter contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudObservabilityApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudObservabilityApiErrorResponse'
        '403':
          description: Tenant, authorization, or resource filter policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudObservabilityApiErrorResponse'
        '422':
          description: Cursor or audit-chain completeness state cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudObservabilityApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudObservabilityAuditReadRequest:
      type: object
      required:
        - tenant_id
        - region
        - scope
        - start_epoch_seconds
        - end_epoch_seconds
        - topics
        - require_complete_chain
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PUBLIC
        scope:
          type: string
          enum:
            - control_plane_mutations
            - all_tenant_audit
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        start_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        end_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        topics:
          type: array
          items:
            $ref: '#/components/schemas/CloudObservabilityAuditReadTopicRef'
          x-oyatie-rust-type: Vec<CloudObservabilityAuditReadTopicRef>
          x-oyatie-data-class: INTERNAL_ONLY
        actor:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        resource_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        cursor:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        page_size:
          type: integer
          format: uint16
          minimum: 1
          maximum: 10000
          nullable: true
          x-oyatie-rust-type: Option<u16>
          x-oyatie-data-class: INTERNAL_ONLY
        require_complete_chain:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityAuditReadTopicRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          enum:
            - oya.audit.cloud_resource_created
            - oya.audit.cloud_resource_terminated
            - oya.audit.cloud_iam_assume
            - oya.audit.cloud_iam_policy
            - oya.audit.cloud_region_register
            - oya.audit.cloud_kms_use
            - oya.audit.cloud_replication
            - oya.audit.cloud_flow_anomaly
            - oya.audit.cloud_invoice
            - oya.audit.cloud_interconnect
            - oya.audit.cloud_cell_rebalanced
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityAuditReadSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CloudObservabilityAuditRecord'
          x-oyatie-rust-type: Vec<CloudObservabilityAuditRecord>
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudObservabilityAuditReadMetadata'
          x-oyatie-rust-type: CloudObservabilityAuditReadMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityAuditReadMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - region
        - record_count
        - chain_complete
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        record_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        next_cursor:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        chain_complete:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: INTERNAL_ONLY
        high_watermark_sequence:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityAuditRecord:
      type: object
      required:
        - id
        - tenant_id
        - region
        - topic
        - operation
        - record_class
        - actor
        - occurred_at_epoch_seconds
        - chain_sequence
        - previous_hash
        - hash
        - payload_hash
        - idempotency_key
        - decision
        - purpose
        - plane
        - data_classes_referenced
        - signed_export_uri
        - audit_marker
        - schema_version
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PUBLIC
        topic:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        operation:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        record_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        source_resource_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        actor:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        iam_role:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        occurred_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        chain_sequence:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        previous_hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        payload_hash:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        idempotency_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        decision:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        plane:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_classes_referenced:
          type: array
          items:
            $ref: '#/components/schemas/CloudObservabilityDataClassRef'
          x-oyatie-rust-type: Vec<CloudObservabilityDataClassRef>
          x-oyatie-data-class: INTERNAL_ONLY
        signed_export_uri:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        audit_marker:
          type: string
          enum:
            - AUDIT
            - SECRET
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudObservabilityDataClassRef:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudObservabilityApiErrorBody'
          x-oyatie-rust-type: CloudObservabilityApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudObservabilityApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudObservabilityApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudObservabilityApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
