openapi: 3.2.0
info:
  title: Oyatie Cloud Cell Binding API
  version: 1.0.0
  description: Tenant-scoped Cloud cell-routing assignment contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/cells/bindings/{tenant_id}:
    post:
      operationId: bindCloudCell
      summary: Bind a tenant to an immutable compatible Cloud cell route.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudCellBindRequest'
      responses:
        '201':
          description: Tenant cell binding created or replayed from the same idempotency fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellBindSuccessResponse'
        '400':
          description: Request headers, body labels, or cell-routing values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
        '403':
          description: Tenant, authorization, residency, or cell policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
        '404':
          description: Referenced region, availability zone, or cell was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
        '409':
          description: Tenant already has an immutable cell binding or catalog identity conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
        '422':
          description: Idempotency key drift or no active compatible cell can process the binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudCellApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudCellBindRequest:
      type: object
      required:
        - tenant_id
        - home_region_code
        - residency_class
      properties:
        tenant_id:
          type: string
          description: Must match the `{tenant_id}` path parameter and authenticated tenant header.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        home_region_code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        required_density:
          type: string
          nullable: true
          enum:
            - shared
            - dedicated
            - sovereign
            - air_gapped
            - foundry_runtime
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellBindSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudCellBindingRecord'
          x-oyatie-rust-type: CloudCellBindingRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudCellApiMetadata'
          x-oyatie-rust-type: CloudCellApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellApiMetadata:
      type: object
      required:
        - request_id
        - tenant_id
        - region
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellBindingRecord:
      type: object
      required:
        - tenant_id
        - region
        - residency_class
        - az
        - cell_id
        - tier
        - hsm_partition_ref
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        residency_class:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tier:
          type: string
          enum:
            - shared
            - pooled
            - dedicated
            - sovereign_air_gapped
            - foundry_runtime
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        hsm_partition_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudCellApiErrorBody'
          x-oyatie-rust-type: CloudCellApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudCellApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudCellApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudCellApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
