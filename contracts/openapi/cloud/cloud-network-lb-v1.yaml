openapi: 3.2.0
info:
  title: Oyatie Cloud Network Load Balancer API
  version: 1.0.0
  description: Tenant-scoped Cloud Network load balancer create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/network/load-balancers/{load_balancer_id}:
    post:
      operationId: createCloudNetworkLoadBalancer
      summary: Create a tenant-scoped Cloud Network load balancer.
      security:
        - bearerAuth: []
      parameters:
        - name: load_balancer_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudNetworkLbCreateRequest'
      responses:
        '201':
          description: Load balancer accepted for creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or load-balancer value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
        '403':
          description: Tenant, authorization, VPC, or network policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
        '404':
          description: Referenced Cloud Network resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
        '409':
          description: Load balancer creation conflicts with an existing network resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkLbApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudNetworkLbCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - vpc_id
        - region
        - kind
        - listeners
        - target_groups
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{load_balancer_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        vpc_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kind:
          type: string
          enum:
            - l4_tcp
            - l4_udp
            - l7_http
            - l7_grpc
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        listeners:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkLbListenerCreateRequest'
          x-oyatie-rust-type: Vec<CloudNetworkLbListenerCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        target_groups:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkLbTargetGroupCreateRequest'
          x-oyatie-rust-type: Vec<CloudNetworkLbTargetGroupCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        mtls:
          $ref: '#/components/schemas/CloudNetworkLbMtlsConfigCreateRequest'
          nullable: true
          x-oyatie-rust-type: Option<CloudNetworkLbMtlsConfigCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        waf_policy:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbListenerCreateRequest:
      type: object
      required:
        - port
        - target_group_id
      properties:
        port:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
          x-oyatie-rust-type: u16
          x-oyatie-data-class: PUBLIC
        target_group_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tls_certificate:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbTargetGroupCreateRequest:
      type: object
      required:
        - id
        - subnet_ids
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subnet_ids:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkLbSubnetRef'
          x-oyatie-rust-type: Vec<CloudNetworkLbSubnetRef>
          x-oyatie-data-class: INTERNAL_ONLY
        health_check_path:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbSubnetRef:
      type: object
      required:
        - subnet_id
      properties:
        subnet_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbMtlsConfigCreateRequest:
      type: object
      required:
        - ca_bundle_ref
        - client_policy
      properties:
        ca_bundle_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        client_policy:
          type: string
          enum:
            - require_verified_client_cert
            - forward_verified_identity
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
    CloudNetworkLbCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudNetworkLbRecord'
          x-oyatie-rust-type: CloudNetworkLbRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudNetworkLbApiMetadata'
          x-oyatie-rust-type: CloudNetworkLbApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - vpc_id
        - region
        - kind
        - listener_count
        - target_group_count
        - mtls_enabled
        - data_class
        - state
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        vpc_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kind:
          type: string
          enum:
            - l4_tcp
            - l4_udp
            - l7_http
            - l7_grpc
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        listener_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        target_group_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        mtls_enabled:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        waf_policy:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        state:
          type: string
          enum:
            - creating
            - active
            - draining
            - deleting
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudNetworkLbApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudNetworkLbApiErrorBody'
          x-oyatie-rust-type: CloudNetworkLbApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkLbApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudNetworkLbApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkLbApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
