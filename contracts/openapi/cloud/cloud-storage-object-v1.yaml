openapi: 3.2.0
info:
  title: Oyatie Cloud Storage Object API
  version: 1.0.0
  description: Tenant-scoped Cloud Storage object metadata PUT and GET contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/storage/object/buckets/{bucket_id}/objects/{object_key}:
    put:
      operationId: putCloudStorageObject
      summary: Put object metadata and KMS shred binding for a tenant bucket object.
      security:
        - bearerAuth: []
      parameters:
        - name: bucket_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: object_key
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudStorageObjectPutRequest'
      responses:
        '201':
          description: Object metadata accepted and KMS shred binding recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectPutSuccessResponse'
        '400':
          description: Request shape, path/body binding, object key, or KMS binding is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '403':
          description: Tenant, authorization, bucket policy, KMS, residency, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '404':
          description: Bucket required for object PUT was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '409':
          description: Object key conflicts with existing object metadata in the bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
    get:
      operationId: getCloudStorageObject
      summary: Get tenant-scoped object metadata and KMS shred binding.
      security:
        - bearerAuth: []
      parameters:
        - name: bucket_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: object_key
          in: path
          required: true
          schema:
            type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        '200':
          description: Object metadata returned for the authorized tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectGetSuccessResponse'
        '400':
          description: Request shape or object key is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '403':
          description: Tenant or authorization policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
        '404':
          description: Object metadata was not found in the requested bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageObjectApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudStorageObjectPutRequest:
      type: object
      required:
        - bucket_id
        - tenant_id
        - key
        - size_bytes
        - etag
        - data_class
        - encryption
        - stored_at_epoch_seconds
      properties:
        bucket_id:
          type: string
          description: Must match the `{bucket_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key:
          type: string
          description: Must match the `{object_key}` path parameter after URL decoding.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        size_bytes:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        etag:
          type: string
          minLength: 32
          maxLength: 32
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        encryption:
          $ref: '#/components/schemas/CloudStorageObjectEncryptionBindingRequest'
          x-oyatie-rust-type: CloudStorageObjectEncryptionBindingRequest
          x-oyatie-data-class: INTERNAL_ONLY
        stored_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        last_accessed_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectEncryptionBindingRequest:
      type: object
      required:
        - kms_key
        - kms_key_version
        - material_ref
        - ciphertext_ref
        - kms_encrypt_event_id
        - purpose
      properties:
        kms_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_key_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        material_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ciphertext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_encrypt_event_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          enum:
            - cloud_object_storage
            - cloud_block_storage
            - cloud_file_storage
            - cloud_archive_storage
            - workspace_drive_object
            - workspace_recording
            - secret_provider
            - cross_region_replication
            - database_backup
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        shred_proof_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectPutSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudStorageObjectRecord'
          x-oyatie-rust-type: CloudStorageObjectRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudStorageObjectMetadata'
          x-oyatie-rust-type: CloudStorageObjectMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectGetSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudStorageObjectRecord'
          x-oyatie-rust-type: CloudStorageObjectRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudStorageObjectMetadata'
          x-oyatie-rust-type: CloudStorageObjectMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectRecord:
      type: object
      required:
        - bucket_id
        - tenant_id
        - key
        - size_bytes
        - etag
        - data_class
        - encryption
        - stored_at_epoch_seconds
        - schema_version
      properties:
        bucket_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        size_bytes:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        etag:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        encryption:
          $ref: '#/components/schemas/CloudStorageObjectEncryptionBindingRecord'
          x-oyatie-rust-type: CloudStorageObjectEncryptionBindingRecord
          x-oyatie-data-class: INTERNAL_ONLY
        stored_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        last_accessed_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudStorageObjectEncryptionBindingRecord:
      type: object
      required:
        - kms_key
        - kms_key_version
        - material_ref
        - ciphertext_ref
        - kms_encrypt_event_id
        - purpose
      properties:
        kms_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_key_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        material_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ciphertext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_encrypt_event_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          enum:
            - cloud_object_storage
            - cloud_block_storage
            - cloud_file_storage
            - cloud_archive_storage
            - workspace_drive_object
            - workspace_recording
            - secret_provider
            - cross_region_replication
            - database_backup
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        shred_proof_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudStorageObjectApiErrorBody'
          x-oyatie-rust-type: CloudStorageObjectApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudStorageObjectApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudStorageObjectApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageObjectApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
