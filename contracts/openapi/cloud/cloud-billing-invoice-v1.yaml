openapi: 3.2.0
info:
  title: Oyatie Cloud Billing Invoice API
  version: 1.0.0
  description: Tenant-scoped Cloud Billing invoice generation contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/billing/invoices/{invoice_id}:
    post:
      operationId: generateCloudBillingInvoice
      summary: Generate a tenant-scoped Cloud Billing tax invoice.
      security:
        - bearerAuth: []
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBillingInvoiceGenerateRequest'
      responses:
        '201':
          description: Invoice accepted and issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingInvoiceGenerateSuccessResponse'
        '400':
          description: Request shape, tax format, invoice totals, or billing value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingTaxApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingTaxApiErrorResponse'
        '403':
          description: Tenant, authorization, account state, or billing policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingTaxApiErrorResponse'
        '409':
          description: Invoice generation conflicts with an existing immutable invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingTaxApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudBillingTaxApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudBillingInvoiceGenerateRequest:
      type: object
      required:
        - id
        - account
        - tenant_id
        - regional_pack
        - period
        - line_items
        - subtotal
        - tax
        - total
        - tax_invoice_format
        - tax_registration_id
        - issued_at_epoch_seconds
        - due_at_epoch_seconds
        - data_class
      properties:
        id:
          type: string
          description: Must match the `{invoice_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        account:
          $ref: '#/components/schemas/CloudBillingAccountSnapshotRequest'
          x-oyatie-rust-type: CloudBillingAccountSnapshotRequest
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        regional_pack:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        period:
          $ref: '#/components/schemas/CloudBillingPeriodRequest'
          x-oyatie-rust-type: CloudBillingPeriodRequest
          x-oyatie-data-class: INTERNAL_ONLY
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/CloudBillingInvoiceLineItemCreateRequest'
          x-oyatie-rust-type: Vec<CloudBillingInvoiceLineItemCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        subtotal:
          $ref: '#/components/schemas/CloudBillingMoneyRequest'
          x-oyatie-rust-type: CloudBillingMoneyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        tax:
          $ref: '#/components/schemas/CloudBillingMoneyRequest'
          x-oyatie-rust-type: CloudBillingMoneyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        total:
          $ref: '#/components/schemas/CloudBillingMoneyRequest'
          x-oyatie-rust-type: CloudBillingMoneyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        tax_invoice_format:
          type: string
          enum:
            - kr_electronic_tax_invoice
            - jp_qualified_invoice
            - eu_country_e_invoice
            - in_gst
            - br_nfe
            - ksa_fatoora
            - uae_vat
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tax_registration_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        due_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingAccountSnapshotRequest:
      type: object
      required:
        - id
        - tenant_id
        - region
        - regional_pack
        - payment_method
        - credit_balance
        - state
        - data_class
        - created_at_epoch_seconds
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        regional_pack:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        payment_method:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        credit_balance:
          $ref: '#/components/schemas/CloudBillingMoneyRequest'
          x-oyatie-rust-type: CloudBillingMoneyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        state:
          type: string
          enum:
            - active
            - suspended
            - delinquent
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingMoneyRequest:
      type: object
      required:
        - currency
        - minor_units
      properties:
        currency:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        minor_units:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingPeriodRequest:
      type: object
      required:
        - start_epoch_seconds
        - end_epoch_seconds
      properties:
        start_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        end_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingInvoiceLineItemCreateRequest:
      type: object
      required:
        - id
        - resource_id
        - description
        - units
        - subtotal
        - data_class
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        description:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        units:
          type: array
          items:
            $ref: '#/components/schemas/CloudBillingTaxMeterUnitRequest'
          x-oyatie-rust-type: Vec<CloudBillingTaxMeterUnitRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        subtotal:
          $ref: '#/components/schemas/CloudBillingMoneyRequest'
          x-oyatie-rust-type: CloudBillingMoneyRequest
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingTaxMeterUnitRequest:
      type: object
      required:
        - kind
        - quantity_microunits
      properties:
        kind:
          type: string
          enum:
            - request
            - byte_in
            - byte_out
            - millisecond
            - gpu_second
            - llm_token
            - resource_second
            - storage_gb_second
            - egress_gb
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        quantity_microunits:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingInvoiceGenerateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudBillingInvoiceRecord'
          x-oyatie-rust-type: CloudBillingInvoiceRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudBillingTaxApiMetadata'
          x-oyatie-rust-type: CloudBillingTaxApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingTaxApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingInvoiceRecord:
      type: object
      required:
        - id
        - billing_account_id
        - tenant_id
        - regional_pack
        - period_start_epoch_seconds
        - period_end_epoch_seconds
        - line_item_count
        - currency
        - subtotal_minor_units
        - tax_minor_units
        - total_minor_units
        - tax_invoice_format
        - tax_registration_id
        - state
        - issued_at_epoch_seconds
        - due_at_epoch_seconds
        - data_class
        - schema_version
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        billing_account_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        regional_pack:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        period_start_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        period_end_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        line_item_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        currency:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subtotal_minor_units:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        tax_minor_units:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        total_minor_units:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        tax_invoice_format:
          type: string
          enum:
            - kr_electronic_tax_invoice
            - jp_qualified_invoice
            - eu_country_e_invoice
            - in_gst
            - br_nfe
            - ksa_fatoora
            - uae_vat
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tax_registration_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: FINANCIAL_KR_신용정보
        state:
          type: string
          enum:
            - issued
            - paid
            - overdue
            - void
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        due_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudBillingTaxApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudBillingTaxApiErrorBody'
          x-oyatie-rust-type: CloudBillingTaxApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingTaxApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudBillingTaxApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudBillingTaxApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudBillingTaxApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
