openapi: 3.2.0
info:
  title: Oyatie Cloud KMS API
  version: 1.0.0
  description: Tenant-scoped Cloud KMS encrypt and decrypt authorization receipt contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/kms/keys/{key_id}/encrypt:
    post:
      operationId: authorizeCloudKmsEncrypt
      summary: Authorize an encrypt operation and record a KMS use receipt.
      security:
        - bearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Oyatie-Version
          in: header
          required: true
          description: Public Cloud KMS API version date carrier per ADR-0342.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            enum:
              - '2026-05-21'
              - '2026-02-21'
              - '2025-11-21'
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudKmsEncryptRequest'
      responses:
        '200':
          description: Encrypt operation authorized and receipt recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsCryptoSuccessResponse'
        '400':
          description: Request shape, path/body binding, or KMS value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '403':
          description: Tenant, actor, authorization, key state, usage, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '404':
          description: KMS key was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '409':
          description: KMS use event conflicts with an existing receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
  /v1/cloud/kms/keys/{key_id}/decrypt:
    post:
      operationId: authorizeCloudKmsDecrypt
      summary: Authorize a decrypt operation and record a KMS use receipt.
      security:
        - bearerAuth: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Oyatie-Version
          in: header
          required: true
          description: Public Cloud KMS API version date carrier per ADR-0342.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            enum:
              - '2026-05-21'
              - '2026-02-21'
              - '2025-11-21'
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudKmsDecryptRequest'
      responses:
        '200':
          description: Decrypt operation authorized and receipt recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsCryptoSuccessResponse'
        '400':
          description: Request shape, path/body binding, or KMS value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '403':
          description: Tenant, actor, authorization, key state, usage, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '404':
          description: KMS key was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '409':
          description: KMS use event conflicts with an existing receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKmsApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudKmsEncryptRequest:
      type: object
      required:
        - event_id
        - key_id
        - tenant_id
        - plaintext_ref
        - ciphertext_ref
        - data_class
        - purpose
        - actor
        - aad_fingerprint
        - requested_at_epoch_seconds
      properties:
        event_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key_id:
          type: string
          description: Must match the `{key_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        plaintext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ciphertext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          enum:
            - cloud_object_storage
            - cloud_block_storage
            - cloud_file_storage
            - cloud_archive_storage
            - workspace_drive_object
            - workspace_recording
            - secret_provider
            - cross_region_replication
            - database_backup
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        actor:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        aad_fingerprint:
          type: string
          minLength: 64
          maxLength: 64
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        requested_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsDecryptRequest:
      type: object
      required:
        - event_id
        - key_id
        - tenant_id
        - ciphertext_ref
        - data_class
        - purpose
        - actor
        - requested_at_epoch_seconds
      properties:
        event_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key_id:
          type: string
          description: Must match the `{key_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        ciphertext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          enum:
            - cloud_object_storage
            - cloud_block_storage
            - cloud_file_storage
            - cloud_archive_storage
            - workspace_drive_object
            - workspace_recording
            - secret_provider
            - cross_region_replication
            - database_backup
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        actor:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        requested_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsCryptoSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudKmsUseReceiptRecord'
          x-oyatie-rust-type: CloudKmsUseReceiptRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudKmsApiResponseMetadata'
          x-oyatie-rust-type: CloudKmsApiResponseMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsUseReceiptRecord:
      type: object
      required:
        - event_id
        - key_id
        - tenant_id
        - operation
        - ciphertext_ref
        - data_class
        - purpose
        - actor
        - key_version
        - hsm_partition_ref
        - occurred_at_epoch_seconds
        - schema_version
      properties:
        event_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        operation:
          type: string
          enum:
            - encrypt
            - decrypt
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        material_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        ciphertext_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        purpose:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        actor:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        hsm_partition_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        occurred_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudKmsApiResponseMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudKmsApiErrorBody'
          x-oyatie-rust-type: CloudKmsApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudKmsApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudKmsApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudKmsApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
