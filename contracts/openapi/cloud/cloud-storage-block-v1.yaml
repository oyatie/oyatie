openapi: 3.2.0
info:
  title: Oyatie Cloud Storage Block API
  version: 1.0.0
  description: Tenant-scoped Cloud Storage block volume create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/storage/block/volumes/{volume_id}:
    post:
      operationId: createCloudStorageBlockVolume
      summary: Create a tenant-scoped Cloud Storage block volume.
      security:
        - bearerAuth: []
      parameters:
        - name: volume_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudStorageBlockVolumeCreateRequest'
      responses:
        '201':
          description: Block volume accepted for creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockVolumeCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or storage value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockApiErrorResponse'
        '403':
          description: Tenant, authorization, residency, region, cell, KMS, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockApiErrorResponse'
        '404':
          description: Referenced Cloud Storage resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockApiErrorResponse'
        '409':
          description: Block volume creation conflicts with an existing storage resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudStorageBlockApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudStorageBlockVolumeCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - name
        - region
        - az
        - cell_id
        - residency
        - tier
        - size_gib
        - performance
        - encryption
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{volume_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tier:
          type: string
          enum:
            - general_purpose_ssd
            - provisioned_iops_ssd
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        size_gib:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        performance:
          $ref: '#/components/schemas/CloudStorageBlockVolumePerformance'
          x-oyatie-rust-type: CloudStorageBlockVolumePerformance
          x-oyatie-data-class: PUBLIC
        encryption:
          type: string
          enum:
            - sse
            - sse_kms
            - byok
            - hyok
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kms_key:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageBlockVolumePerformance:
      type: object
      required:
        - iops
        - throughput_mbps
      properties:
        iops:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: PUBLIC
        throughput_mbps:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: PUBLIC
    CloudStorageBlockVolumeCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudStorageBlockVolumeRecord'
          x-oyatie-rust-type: CloudStorageBlockVolumeRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudStorageBlockApiMetadata'
          x-oyatie-rust-type: CloudStorageBlockApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageBlockApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageBlockVolumeRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - name
        - region
        - az
        - cell_id
        - residency
        - tier
        - size_gib
        - performance
        - encryption
        - data_class
        - state
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tier:
          type: string
          enum:
            - general_purpose_ssd
            - provisioned_iops_ssd
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        size_gib:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        performance:
          $ref: '#/components/schemas/CloudStorageBlockVolumePerformance'
          x-oyatie-rust-type: CloudStorageBlockVolumePerformance
          x-oyatie-data-class: PUBLIC
        encryption:
          type: string
          enum:
            - sse
            - sse_kms
            - byok
            - hyok
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kms_key:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        state:
          type: string
          enum:
            - creating
            - available
            - attached
            - deleting
            - error
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudStorageBlockApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudStorageBlockApiErrorBody'
          x-oyatie-rust-type: CloudStorageBlockApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageBlockApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudStorageBlockApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudStorageBlockApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudStorageBlockApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
