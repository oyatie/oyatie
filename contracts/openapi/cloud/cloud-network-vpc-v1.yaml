openapi: 3.2.0
info:
  title: Oyatie Cloud Network VPC API
  version: 1.0.0
  description: Tenant-scoped Cloud Network VPC create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/network/vpcs/{vpc_id}:
    post:
      operationId: createCloudNetworkVpc
      summary: Create a tenant-scoped Cloud Network VPC.
      security:
        - bearerAuth: []
      parameters:
        - name: vpc_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudNetworkVpcCreateRequest'
      responses:
        '201':
          description: VPC accepted for creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or network value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
        '403':
          description: Tenant, authorization, residency, region, or network policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
        '404':
          description: Referenced Cloud Network resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
        '409':
          description: VPC creation conflicts with an existing network resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkVpcApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudNetworkVpcCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - cidr_v4
        - cidr_v6
        - flow_logs_enabled
        - route_table
        - security_groups
        - residency
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{vpc_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cidr_v4:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cidr_v6:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flow_logs_enabled:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        route_table:
          $ref: '#/components/schemas/CloudNetworkVpcRouteTableCreateRequest'
          x-oyatie-rust-type: CloudNetworkVpcRouteTableCreateRequest
          x-oyatie-data-class: INTERNAL_ONLY
        security_groups:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkVpcSecurityGroupCreateRequest'
          x-oyatie-rust-type: Vec<CloudNetworkVpcSecurityGroupCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcRouteTableCreateRequest:
      type: object
      required:
        - id
        - routes
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkVpcRouteCreateRequest'
          x-oyatie-rust-type: Vec<CloudNetworkVpcRouteCreateRequest>
          x-oyatie-data-class: PUBLIC
    CloudNetworkVpcRouteCreateRequest:
      type: object
      required:
        - destination
        - next_hop
      properties:
        destination:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        next_hop:
          type: string
          enum:
            - local
            - internet_gateway
            - nat_gateway
            - vpc_peering
            - transit_gateway
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        target_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcSecurityGroupCreateRequest:
      type: object
      required:
        - id
        - rules
      properties:
        id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkVpcSecurityRuleCreateRequest'
          x-oyatie-rust-type: Vec<CloudNetworkVpcSecurityRuleCreateRequest>
          x-oyatie-data-class: PUBLIC
    CloudNetworkVpcSecurityRuleCreateRequest:
      type: object
      required:
        - direction
        - protocol
        - cidr
        - description
      properties:
        direction:
          type: string
          enum:
            - ingress
            - egress
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        protocol:
          type: string
          enum:
            - tcp
            - udp
            - icmp
            - any
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        port_start:
          type: integer
          format: uint16
          nullable: true
          minimum: 1
          maximum: 65535
          x-oyatie-rust-type: Option<u16>
          x-oyatie-data-class: PUBLIC
        port_end:
          type: integer
          format: uint16
          nullable: true
          minimum: 1
          maximum: 65535
          x-oyatie-rust-type: Option<u16>
          x-oyatie-data-class: PUBLIC
        cidr:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        description:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudNetworkVpcRecord'
          x-oyatie-rust-type: CloudNetworkVpcRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudNetworkVpcApiMetadata'
          x-oyatie-rust-type: CloudNetworkVpcApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - cidr_v4
        - cidr_v6
        - flow_logs_enabled
        - route_count
        - security_group_count
        - residency
        - data_class
        - state
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cidr_v4:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cidr_v6:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flow_logs_enabled:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        route_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        security_group_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        state:
          type: string
          enum:
            - creating
            - active
            - suspended
            - deleting
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudNetworkVpcApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudNetworkVpcApiErrorBody'
          x-oyatie-rust-type: CloudNetworkVpcApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkVpcApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudNetworkVpcApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkVpcApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
