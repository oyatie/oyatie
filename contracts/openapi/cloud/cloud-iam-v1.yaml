openapi: 3.2.0
info:
  title: Oyatie Cloud IAM API
  version: 1.0.0
  description: Tenant-scoped Cloud IAM role creation and STS token issuance contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/iam/roles/{role_id}:
    post:
      operationId: createCloudIamRole
      summary: Create a tenant-scoped Cloud IAM role with a Cedar policy binding.
      security:
        - bearerAuth: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudIamRoleCreateRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamRoleCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or Cloud IAM value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '403':
          description: Tenant or IAM policy binding denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '409':
          description: Role or referenced IAM resource conflicts with an existing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
  /v1/cloud/iam/sts/token:
    post:
      operationId: issueCloudIamStsToken
      summary: Issue a short-lived STS token for an assumable Cloud IAM role.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudIamStsTokenRequest'
      responses:
        '200':
          description: STS token issued and represented by a non-secret fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamStsTokenSuccessResponse'
        '400':
          description: Request shape or Cloud IAM value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '403':
          description: Tenant, principal, MFA, external-id, or trust policy denied token issuance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '409':
          description: STS session identifier conflicts with an existing session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudIamApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudIamPrincipalRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamScopeRef:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamRoleCreateRequest:
      type: object
      required:
        - tenant_id
        - role_id
        - region
        - name
        - cedar_policy_id
        - cedar_policy_version
        - assumable_by
        - max_session_duration_sec
        - data_class
        - created_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        role_id:
          type: string
          description: Must match the `{role_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cedar_policy_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_policy_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        assumable_by:
          type: array
          items:
            $ref: '#/components/schemas/CloudIamPrincipalRef'
          x-oyatie-rust-type: Vec<CloudIamPrincipalRef>
          x-oyatie-data-class: INTERNAL_ONLY
        max_session_duration_sec:
          type: integer
          format: uint32
          minimum: 1
          maximum: 3600
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamStsTokenRequest:
      type: object
      required:
        - tenant_id
        - session_id
        - role_id
        - assumed_by
        - requested_duration_sec
        - scopes
        - issued_at_epoch_seconds
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        session_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        role_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        assumed_by:
          type: string
          description: Must match the authenticated Cloud IAM API principal.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        external_id:
          type: string
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        requested_duration_sec:
          type: integer
          format: uint32
          minimum: 1
          maximum: 3600
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CloudIamScopeRef'
          x-oyatie-rust-type: Vec<CloudIamScopeRef>
          x-oyatie-data-class: INTERNAL_ONLY
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamRoleCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudIamRoleRecord'
          x-oyatie-rust-type: CloudIamRoleRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudIamApiResponseMetadata'
          x-oyatie-rust-type: CloudIamApiResponseMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamStsTokenSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudIamStsSessionRecord'
          x-oyatie-rust-type: CloudIamStsSessionRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudIamApiResponseMetadata'
          x-oyatie-rust-type: CloudIamApiResponseMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamApiResponseMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamRoleRecord:
      type: object
      required:
        - tenant_id
        - role_id
        - region
        - name
        - cedar_policy_id
        - cedar_policy_version
        - assumable_by
        - max_session_duration_sec
        - data_class
        - created_at_epoch_seconds
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        role_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cedar_policy_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cedar_policy_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        assumable_by:
          type: array
          items:
            $ref: '#/components/schemas/CloudIamPrincipalRef'
          x-oyatie-rust-type: Vec<CloudIamPrincipalRef>
          x-oyatie-data-class: INTERNAL_ONLY
        max_session_duration_sec:
          type: integer
          format: uint32
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudIamStsSessionRecord:
      type: object
      required:
        - tenant_id
        - session_id
        - role_id
        - assumed_by
        - issued_at_epoch_seconds
        - expires_at_epoch_seconds
        - scopes
        - token_fingerprint
        - data_class
        - schema_version
      properties:
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        session_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        role_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        assumed_by:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        external_id:
          type: string
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        issued_at_epoch_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        expires_at_epoch_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CloudIamScopeRef'
          x-oyatie-rust-type: Vec<CloudIamScopeRef>
          x-oyatie-data-class: INTERNAL_ONLY
        token_fingerprint:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        schema_version:
          type: integer
          format: uint32
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudIamApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudIamApiErrorBody'
          x-oyatie-rust-type: CloudIamApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudIamApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudIamApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudIamApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
