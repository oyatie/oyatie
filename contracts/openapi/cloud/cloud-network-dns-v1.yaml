openapi: 3.2.0
info:
  title: Oyatie Cloud Network DNS API
  version: 1.0.0
  description: Tenant-scoped Cloud Network DNS zone create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/network/dns/zones/{zone_id}:
    post:
      operationId: createCloudNetworkDnsZone
      summary: Create a tenant-scoped Cloud Network DNS zone.
      security:
        - bearerAuth: []
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudNetworkDnsZoneCreateRequest'
      responses:
        '201':
          description: DNS zone accepted for creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsZoneCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or DNS value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
        '401':
          description: Authenticated principal evidence is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
        '403':
          description: Tenant, authorization, VPC binding, or network policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
        '404':
          description: Referenced Cloud Network resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
        '409':
          description: DNS zone creation conflicts with an existing network resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudNetworkDnsApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudNetworkDnsZoneCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - name
        - kind
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{zone_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kind:
          type: string
          enum:
            - public
            - private
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vpc_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        dnssec_key_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkDnsZoneCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudNetworkDnsZoneRecord'
          x-oyatie-rust-type: CloudNetworkDnsZoneRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudNetworkDnsApiMetadata'
          x-oyatie-rust-type: CloudNetworkDnsApiMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkDnsApiMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkDnsZoneRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - name
        - kind
        - data_class
        - state
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        name:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        kind:
          type: string
          enum:
            - public
            - private
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vpc_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        dnssec_key_ref:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        state:
          type: string
          enum:
            - creating
            - active
            - suspended
            - deleting
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudNetworkDnsApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudNetworkDnsApiErrorBody'
          x-oyatie-rust-type: CloudNetworkDnsApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkDnsApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudNetworkDnsApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudNetworkDnsApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudNetworkDnsApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
