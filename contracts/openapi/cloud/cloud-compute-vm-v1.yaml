openapi: 3.2.0
info:
  title: Oyatie Cloud Compute VM API
  version: 1.0.0
  description: Tenant-scoped Cloud Compute virtual-machine create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/compute/vms/{instance_id}:
    post:
      operationId: createCloudComputeVm
      summary: Create a tenant-scoped Cloud Compute VM record for provision orchestration.
      security:
        - bearerAuth: []
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudComputeVmCreateRequest'
      responses:
        '201':
          description: VM create record accepted for provision orchestration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or compute value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
        '401':
          description: Authentication evidence is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
        '403':
          description: Tenant, authorization, residency, region, quota, network, IAM, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
        '404':
          description: Referenced Cloud Compute resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
        '409':
          description: VM create conflicts with an existing compute resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeVmApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudComputeVmCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - az
        - cell_id
        - flavor
        - image
        - vpc_id
        - subnet_id
        - security_groups
        - quota
        - residency
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{instance_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flavor:
          $ref: '#/components/schemas/CloudComputeVmFlavorSpec'
          x-oyatie-rust-type: CloudComputeVmFlavorSpec
          x-oyatie-data-class: PUBLIC
        image:
          type: string
          description: Digest-pinned OCI or QCOW2 image reference.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        key_pair:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        vpc_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        subnet_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        security_groups:
          type: array
          items:
            $ref: '#/components/schemas/CloudComputeVmSecurityGroupRef'
          x-oyatie-rust-type: Vec<CloudComputeVmSecurityGroupRef>
          x-oyatie-data-class: INTERNAL_ONLY
        iam_role:
          $ref: '#/components/schemas/CloudComputeVmIamRoleRef'
          nullable: true
          x-oyatie-rust-type: Option<CloudComputeVmIamRoleRef>
          x-oyatie-data-class: INTERNAL_ONLY
        user_data_uri:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        quota:
          $ref: '#/components/schemas/CloudComputeVmQuotaEnvelope'
          x-oyatie-rust-type: CloudComputeVmQuotaEnvelope
          x-oyatie-data-class: INTERNAL_ONLY
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmFlavorSpec:
      type: object
      required:
        - class
        - vcpu
        - memory_gb
        - gpu_count
        - local_ssd_gb
      properties:
        class:
          type: string
          enum:
            - general_purpose
            - compute_optimized
            - memory_optimized
            - gpu
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vcpu:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        memory_gb:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        gpu_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        local_ssd_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudComputeVmQuotaEnvelope:
      type: object
      required:
        - vcpu_limit
        - memory_gb_limit
        - gpu_limit
        - local_ssd_gb_limit
        - current_vcpu
        - current_memory_gb
        - current_gpu
        - current_local_ssd_gb
      properties:
        vcpu_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        memory_gb_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        gpu_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        local_ssd_gb_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_vcpu:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_memory_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_gpu:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_local_ssd_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmSecurityGroupRef:
      type: object
      required:
        - value
        - tenant_id
        - region
        - vpc_id
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vpc_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmIamRoleRef:
      type: object
      required:
        - value
        - tenant_id
        - region
        - vpc_id
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vpc_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudComputeVmRecord'
          x-oyatie-rust-type: CloudComputeVmRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudComputeVmMetadata'
          x-oyatie-rust-type: CloudComputeVmMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - az
        - cell_id
        - flavor
        - image_kind
        - residency
        - state
        - data_class
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flavor:
          $ref: '#/components/schemas/CloudComputeVmFlavorSpec'
          x-oyatie-rust-type: CloudComputeVmFlavorSpec
          x-oyatie-data-class: PUBLIC
        image_kind:
          type: string
          enum:
            - oci
            - qcow2
            - function_bundle
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        state:
          type: string
          enum:
            - pending
            - running
            - stopping
            - stopped
            - terminated
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudComputeVmApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudComputeVmApiErrorBody'
          x-oyatie-rust-type: CloudComputeVmApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudComputeVmApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudComputeVmApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeVmApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
