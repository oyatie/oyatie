openapi: 3.2.0
info:
  title: Oyatie Cloud Compute Functions API
  version: 1.0.0
  description: Tenant-scoped Cloud Compute function invocation contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/compute/functions/{function_id}/invocations:
    post:
      operationId: invokeCloudComputeFunction
      summary: Invoke a tenant-scoped Cloud Compute function and return an invocation receipt.
      security:
        - bearerAuth: []
      parameters:
        - name: function_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudComputeFunctionsInvokeRequest'
      responses:
        '202':
          description: Function invocation accepted and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsInvokeSuccessResponse'
        '400':
          description: Request shape, path/body binding, or compute value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
        '401':
          description: Authentication evidence is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
        '403':
          description: Tenant, authorization, region, or payload data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
        '404':
          description: Referenced Cloud Compute function was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
        '409':
          description: Function invocation conflicts with an existing invocation or function lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeFunctionsApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudComputeFunctionsInvokeRequest:
      type: object
      required:
        - invocation_id
        - tenant_id
        - function_id
        - region
        - payload_data_class
        - requested_at_epoch_seconds
      properties:
        invocation_id:
          type: string
          description: Tenant-generated invocation id with the fninv_ prefix.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        function_id:
          type: string
          description: Must match the `{function_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        payload_data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        requested_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeFunctionsInvokeSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudComputeFunctionsInvocationReceipt'
          x-oyatie-rust-type: CloudComputeFunctionsInvocationReceipt
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudComputeFunctionsMetadata'
          x-oyatie-rust-type: CloudComputeFunctionsMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeFunctionsMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeFunctionsInvocationReceipt:
      type: object
      required:
        - invocation_id
        - tenant_id
        - function_id
        - region
        - payload_data_class
        - cold_start_budget_ms
        - accepted_at_epoch_seconds
        - schema_version
      properties:
        invocation_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        function_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        payload_data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cold_start_budget_ms:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        accepted_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudComputeFunctionsApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudComputeFunctionsApiErrorBody'
          x-oyatie-rust-type: CloudComputeFunctionsApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeFunctionsApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudComputeFunctionsApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudComputeFunctionsApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeFunctionsApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
