openapi: 3.2.0
info:
  title: Oyatie Cloud Compute Kubernetes API
  version: 1.0.0
  description: Tenant-scoped Cloud Compute Kubernetes cluster create contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/cloud/compute/k8s/clusters/{cluster_id}:
    post:
      operationId: createCloudComputeK8sCluster
      summary: Create a tenant-scoped managed Kubernetes cluster record for provision orchestration.
      security:
        - bearerAuth: []
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudComputeK8sClusterCreateRequest'
      responses:
        '201':
          description: Kubernetes cluster create record accepted for provision orchestration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sClusterCreateSuccessResponse'
        '400':
          description: Request shape, path/body binding, or compute value contract is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
        '401':
          description: Authentication evidence is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
        '403':
          description: Tenant, authorization, residency, region, quota, network, or data-class policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
        '404':
          description: Referenced Cloud Compute resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
        '409':
          description: Kubernetes cluster create conflicts with an existing compute resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudComputeK8sApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    CloudComputeK8sClusterCreateRequest:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - flavor
        - control_plane_version
        - control_plane_private
        - node_pools
        - quota
        - residency
        - data_class
        - created_at_epoch_seconds
      properties:
        resource_id:
          type: string
          description: Must match the `{cluster_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flavor:
          type: string
          enum:
            - standard
            - high_availability
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        control_plane_version:
          type: string
          description: Canonical Kubernetes control-plane version such as v1.30.1.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        control_plane_private:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        node_pools:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CloudComputeK8sNodePoolCreateRequest'
          x-oyatie-rust-type: Vec<CloudComputeK8sNodePoolCreateRequest>
          x-oyatie-data-class: INTERNAL_ONLY
        quota:
          $ref: '#/components/schemas/CloudComputeK8sQuotaEnvelope'
          x-oyatie-rust-type: CloudComputeK8sQuotaEnvelope
          x-oyatie-data-class: INTERNAL_ONLY
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sNodePoolCreateRequest:
      type: object
      required:
        - id
        - az
        - cell_id
        - subnet_id
        - security_groups
        - flavor
        - min_nodes
        - max_nodes
        - autoscaling_enabled
      properties:
        id:
          type: string
          description: Node-pool id with the np_ prefix.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        az:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        subnet_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        security_groups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CloudComputeK8sSecurityGroupRef'
          x-oyatie-rust-type: Vec<CloudComputeK8sSecurityGroupRef>
          x-oyatie-data-class: INTERNAL_ONLY
        flavor:
          $ref: '#/components/schemas/CloudComputeK8sNodePoolFlavorSpec'
          x-oyatie-rust-type: CloudComputeK8sNodePoolFlavorSpec
          x-oyatie-data-class: PUBLIC
        min_nodes:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        max_nodes:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        autoscaling_enabled:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
    CloudComputeK8sSecurityGroupRef:
      type: object
      required:
        - value
        - tenant_id
        - region
        - subnet_id
      properties:
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        subnet_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sNodePoolFlavorSpec:
      type: object
      required:
        - class
        - vcpu
        - memory_gb
        - gpu_count
        - local_ssd_gb
      properties:
        class:
          type: string
          enum:
            - general_purpose
            - compute_optimized
            - memory_optimized
            - gpu
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        vcpu:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        memory_gb:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        gpu_count:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        local_ssd_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudComputeK8sQuotaEnvelope:
      type: object
      required:
        - vcpu_limit
        - memory_gb_limit
        - gpu_limit
        - local_ssd_gb_limit
        - current_vcpu
        - current_memory_gb
        - current_gpu
        - current_local_ssd_gb
      properties:
        vcpu_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        memory_gb_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        gpu_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        local_ssd_gb_limit:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_vcpu:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_memory_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_gpu:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
        current_local_ssd_gb:
          type: integer
          format: uint32
          minimum: 0
          x-oyatie-rust-type: u32
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sClusterCreateSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/CloudComputeK8sClusterRecord'
          x-oyatie-rust-type: CloudComputeK8sClusterRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/CloudComputeK8sMetadata'
          x-oyatie-rust-type: CloudComputeK8sMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sMetadata:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sClusterRecord:
      type: object
      required:
        - resource_id
        - tenant_id
        - region
        - flavor
        - control_plane_version
        - control_plane_private
        - node_pool_count
        - residency
        - state
        - data_class
        - created_at_epoch_seconds
        - schema_version
      properties:
        resource_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        flavor:
          type: string
          enum:
            - standard
            - high_availability
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        control_plane_version:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        control_plane_private:
          type: boolean
          x-oyatie-rust-type: bool
          x-oyatie-data-class: PUBLIC
        node_pool_count:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
        residency:
          type: string
          enum:
            - strict_kr
            - kr_with_us_failover
            - global
            - per_pack
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        state:
          type: string
          enum:
            - creating
            - ready
            - reconciling
            - draining
            - deleted
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PUBLIC
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    CloudComputeK8sApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/CloudComputeK8sApiErrorBody'
          x-oyatie-rust-type: CloudComputeK8sApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/CloudComputeK8sApiErrorDetail'
          x-oyatie-rust-type: Vec<CloudComputeK8sApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          minimum: 0
          nullable: true
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    CloudComputeK8sApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
