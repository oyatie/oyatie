openapi: 3.2.0
info:
  title: Oyatie Workspace Meet API
  version: 1.0.0
  description: Tenant-scoped Workspace Meet session-start contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/workspace/meet/sessions/{session_id}:start:
    post:
      operationId: startWorkspaceMeetSession
      summary: Start a tenant-scoped Workspace Meet session on a regional SFU pool.
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMeetSessionStartRequest'
      responses:
        '201':
          description: Meet session metadata accepted and bound to the regional SFU pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMeetSessionStartSuccessResponse'
        '400':
          description: Request shape, session id, participant shape, data class, or SFU placement is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMeetApiErrorResponse'
        '403':
          description: Tenant, authorization, or host-participant policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMeetApiErrorResponse'
        '409':
          description: Session metadata already exists for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMeetApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMeetApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    WorkspaceMeetParticipantRequest:
      type: object
      required:
        - actor_ref
        - role
        - connection_state
      properties:
        actor_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        display_name:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        role:
          type: string
          enum:
            - host
            - co_host
            - presenter
            - attendee
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        connection_state:
          type: string
          enum:
            - invited
            - joined
            - left
            - removed
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        joined_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
        left_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetSessionStartRequest:
      type: object
      required:
        - session_id
        - tenant_id
        - region
        - cell_id
        - sfu_pool_id
        - data_class
        - started_at_epoch_seconds
        - participants
        - recording_consent
      properties:
        session_id:
          type: string
          minLength: 1
          description: Must match the `{session_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        sfu_pool_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          enum:
            - PUBLIC
            - INTERNAL_ONLY
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PHI
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        started_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkspaceMeetParticipantRequest'
          x-oyatie-rust-type: Vec<WorkspaceMeetParticipantRequest>
          x-oyatie-data-class: PII_IDENTIFYING
        recording_consent:
          type: string
          enum:
            - not_requested
            - participant_opt_in
            - tenant_policy_default_on
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        transcript_session_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        summary_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetSessionStartSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceMeetSessionRecord'
          x-oyatie-rust-type: WorkspaceMeetSessionRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/WorkspaceMeetSessionMetadata'
          x-oyatie-rust-type: WorkspaceMeetSessionMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetSessionMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          enum:
            - workspace.meet.session.start
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetParticipantRecord:
      type: object
      required:
        - actor_ref
        - role
        - connection_state
      properties:
        actor_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        display_name:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        role:
          type: string
          enum:
            - host
            - co_host
            - presenter
            - attendee
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        connection_state:
          type: string
          enum:
            - invited
            - joined
            - left
            - removed
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        joined_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
        left_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetSessionRecord:
      type: object
      required:
        - session_id
        - tenant_id
        - region
        - cell_id
        - sfu_pool_id
        - data_class
        - started_at_epoch_seconds
        - participants
        - recording_consent
        - schema_version
      properties:
        session_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        cell_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        sfu_pool_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        started_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        ended_at_epoch_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
        participants:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMeetParticipantRecord'
          x-oyatie-rust-type: Vec<WorkspaceMeetParticipantRecord>
          x-oyatie-data-class: PII_IDENTIFYING
        recording_consent:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        transcript_session_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        summary_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    WorkspaceMeetApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/WorkspaceMeetApiErrorBody'
          x-oyatie-rust-type: WorkspaceMeetApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMeetApiErrorDetail'
          x-oyatie-rust-type: Vec<WorkspaceMeetApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceMeetApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
