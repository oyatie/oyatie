openapi: 3.2.0
info:
  title: Oyatie Workspace Forms API
  version: 1.0.0
  description: Tenant-scoped Workspace Forms submission-ingest contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/workspace/forms/{form_id}/submissions/{submission_id}:ingest:
    post:
      operationId: ingestWorkspaceFormsSubmission
      summary: Ingest a tenant-scoped Workspace Forms submission into Object Graph routing.
      security:
        - bearerAuth: []
      parameters:
        - name: form_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFormsSubmissionIngestRequest'
      responses:
        '202':
          description: Forms submission accepted for Object Graph-routed ingestion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsSubmissionIngestSuccessResponse'
        '400':
          description: Request shape, form/submission binding, answer kind, schema conformance, or data class is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsApiErrorResponse'
        '403':
          description: Tenant, authorization, or submitter-principal policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsApiErrorResponse'
        '404':
          description: Form schema metadata was not found for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsApiErrorResponse'
        '409':
          description: Submission metadata already exists for the tenant form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFormsApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    WorkspaceFormsAnswerRequest:
      type: object
      required:
        - field_id
        - value_kind
        - value
      properties:
        field_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value_kind:
          type: string
          enum:
            - short_text
            - long_text
            - number
            - boolean
            - single_choice
            - multi_choice
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
    WorkspaceFormsSubmissionIngestRequest:
      type: object
      required:
        - submission_id
        - form_id
        - tenant_id
        - submitter_ref
        - answers
        - data_class
        - submitted_at_epoch_seconds
      properties:
        submission_id:
          type: string
          minLength: 1
          description: Must match the `{submission_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        form_id:
          type: string
          minLength: 1
          description: Must match the `{form_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        submitter_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        answers:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFormsAnswerRequest'
          x-oyatie-rust-type: Vec<WorkspaceFormsAnswerRequest>
          x-oyatie-data-class: PII_IDENTIFYING
        data_class:
          type: string
          enum:
            - PUBLIC
            - INTERNAL_ONLY
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PHI
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        submitted_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceFormsSubmissionIngestSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceFormsSubmissionRecord'
          x-oyatie-rust-type: WorkspaceFormsSubmissionRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/WorkspaceFormsSubmissionMetadata'
          x-oyatie-rust-type: WorkspaceFormsSubmissionMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceFormsSubmissionMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          enum:
            - workspace.forms.submission.ingest
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceFormsAnswerRecord:
      type: object
      required:
        - field_id
        - value_kind
        - value
      properties:
        field_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value_kind:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        value:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
    WorkspaceFormsSubmissionRecord:
      type: object
      required:
        - submission_id
        - form_id
        - tenant_id
        - submitter_ref
        - answers
        - data_class
        - submitted_at_epoch_seconds
        - object_graph_route_id
        - schema_version
      properties:
        submission_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        form_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        submitter_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        answers:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFormsAnswerRecord'
          x-oyatie-rust-type: Vec<WorkspaceFormsAnswerRecord>
          x-oyatie-data-class: PII_IDENTIFYING
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        submitted_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        object_graph_route_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    WorkspaceFormsApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/WorkspaceFormsApiErrorBody'
          x-oyatie-rust-type: WorkspaceFormsApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceFormsApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFormsApiErrorDetail'
          x-oyatie-rust-type: Vec<WorkspaceFormsApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceFormsApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
