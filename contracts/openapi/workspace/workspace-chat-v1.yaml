openapi: 3.2.0
info:
  title: Oyatie Workspace Chat API
  version: 1.0.0
  description: Tenant-scoped Workspace Chat message-send contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/workspace/chat/channels/{channel_id}/messages/{message_id}:send:
    post:
      operationId: sendWorkspaceChatMessage
      summary: Send a tenant-scoped Workspace Chat message into an existing channel.
      security:
        - bearerAuth: []
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceChatMessageSendRequest'
      responses:
        '201':
          description: Chat message accepted for channel-local fan-out and storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatMessageSendSuccessResponse'
        '400':
          description: Request shape, channel/message binding, sender kind, attachment, data class, or thread shape is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatApiErrorResponse'
        '403':
          description: Tenant, authorization, or sender channel-membership policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatApiErrorResponse'
        '404':
          description: Channel metadata or requested parent message was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatApiErrorResponse'
        '409':
          description: Message metadata already exists for the tenant channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    WorkspaceChatAttachmentRequest:
      type: object
      required:
        - attachment_id
        - storage_key
        - mime_type
        - byte_len
      properties:
        attachment_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        storage_key:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        mime_type:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        byte_len:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatMessageSendRequest:
      type: object
      required:
        - message_id
        - channel_id
        - tenant_id
        - sender_ref
        - sender_kind
        - attachments
        - data_class
        - created_at_epoch_seconds
      properties:
        message_id:
          type: string
          minLength: 1
          description: Must match the `{message_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        channel_id:
          type: string
          minLength: 1
          description: Must match the `{channel_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        thread_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        parent_message_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        sender_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        sender_kind:
          type: string
          enum:
            - human
            - bot
            - system
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        body:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PII_IDENTIFYING
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceChatAttachmentRequest'
          x-oyatie-rust-type: Vec<WorkspaceChatAttachmentRequest>
          x-oyatie-data-class: PII_IDENTIFYING
        data_class:
          type: string
          enum:
            - PUBLIC
            - INTERNAL_ONLY
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PHI
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatMessageSendSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceChatMessageRecord'
          x-oyatie-rust-type: WorkspaceChatMessageRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/WorkspaceChatMessageMetadata'
          x-oyatie-rust-type: WorkspaceChatMessageMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatMessageMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          enum:
            - workspace.chat.message.send
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatAttachmentRecord:
      type: object
      required:
        - attachment_id
        - storage_key
        - mime_type
        - byte_len
      properties:
        attachment_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        storage_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        mime_type:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        byte_len:
          type: integer
          format: uint64
          minimum: 1
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatMessageRecord:
      type: object
      required:
        - message_id
        - channel_id
        - tenant_id
        - sender_ref
        - sender_kind
        - attachments
        - data_class
        - created_at_epoch_seconds
        - schema_version
      properties:
        message_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        channel_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        thread_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        parent_message_id:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        sender_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        sender_kind:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        body:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: PII_IDENTIFYING
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceChatAttachmentRecord'
          x-oyatie-rust-type: Vec<WorkspaceChatAttachmentRecord>
          x-oyatie-data-class: PII_IDENTIFYING
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    WorkspaceChatApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/WorkspaceChatApiErrorBody'
          x-oyatie-rust-type: WorkspaceChatApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceChatApiErrorDetail'
          x-oyatie-rust-type: Vec<WorkspaceChatApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceChatApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
