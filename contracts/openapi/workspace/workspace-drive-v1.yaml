openapi: 3.2.0
info:
  title: Oyatie Workspace Drive API
  version: 1.0.0
  description: Tenant-scoped Workspace Drive object metadata PUT and GET contract.
servers:
  - url: https://api.oyatie.com
paths:
  /v1/workspace/drive/objects/{object_id}:
    put:
      operationId: putWorkspaceDriveObject
      summary: Put Workspace Drive object metadata, KMS-shred binding, and ACL grants.
      security:
        - bearerAuth: []
      parameters:
        - name: object_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDriveObjectPutRequest'
      responses:
        '201':
          description: Drive object metadata accepted and indexed for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveObjectPutSuccessResponse'
        '400':
          description: Request shape, object id, path, data class, role, or KMS binding is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
        '403':
          description: Tenant, authorization, or per-object ACL policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
        '409':
          description: Object metadata already exists for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
        '422':
          description: Idempotency key was already used with a different request fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
    get:
      operationId: getWorkspaceDriveObject
      summary: Get tenant-scoped Workspace Drive object metadata when the ACL grants view access.
      security:
        - bearerAuth: []
      parameters:
        - name: object_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
      responses:
        '200':
          description: Drive object metadata returned for an authorized principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveObjectGetSuccessResponse'
        '400':
          description: Request shape or object id is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
        '403':
          description: Tenant, authorization, or per-object ACL policy denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
        '404':
          description: Object metadata was not found for the requested tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDriveApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: STS
  schemas:
    WorkspaceDrivePermissionGrantRequest:
      type: object
      required:
        - subject_ref
        - role
        - granted_at_epoch_seconds
      properties:
        subject_ref:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        role:
          type: string
          enum:
            - viewer
            - commenter
            - editor
            - owner
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        granted_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveObjectPutRequest:
      type: object
      required:
        - object_id
        - folder_id
        - path
        - tenant_id
        - region
        - data_class
        - object_storage_key
        - size_bytes
        - mime_type
        - kms_shred_key_id
        - permissions
        - created_at_epoch_seconds
      properties:
        object_id:
          type: string
          minLength: 1
          description: Must match the `{object_id}` path parameter.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        folder_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        path:
          type: string
          minLength: 1
          description: Tenant-private Drive path stored in the encrypted body, never as URL path/query PII.
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        tenant_id:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          enum:
            - PUBLIC
            - INTERNAL_ONLY
            - PII_IDENTIFYING
            - PII_QUASI_IDENTIFIER
            - PHI
            - PCI
            - FINANCIAL_KR_신용정보
            - BEHAVIORAL_TENANT_PRODUCT
            - BEHAVIORAL_ADS
            - DECLARED_PREFERENCE
            - SEARCH_QUERY
            - SENSITIVE_PIPA_ART23
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        object_storage_key:
          type: string
          minLength: 1
          description: Cloud object-storage key backing the Drive object bytes.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        size_bytes:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        mime_type:
          type: string
          minLength: 1
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_shred_key_id:
          type: string
          minLength: 1
          description: Per-record KMS shred key binding for tenant erasure and DSR cascade.
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkspaceDrivePermissionGrantRequest'
          x-oyatie-rust-type: Vec<WorkspaceDrivePermissionGrantRequest>
          x-oyatie-data-class: PII_IDENTIFYING
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveObjectPutSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceDriveObjectRecord'
          x-oyatie-rust-type: WorkspaceDriveObjectRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/WorkspaceDriveObjectMetadata'
          x-oyatie-rust-type: WorkspaceDriveObjectMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveObjectGetSuccessResponse:
      type: object
      required:
        - data
        - metadata
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceDriveObjectRecord'
          x-oyatie-rust-type: WorkspaceDriveObjectRecord
          x-oyatie-data-class: INTERNAL_ONLY
        metadata:
          $ref: '#/components/schemas/WorkspaceDriveObjectMetadata'
          x-oyatie-rust-type: WorkspaceDriveObjectMetadata
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveObjectMetadata:
      type: object
      required:
        - request_id
        - surface
        - openapi_contract
      properties:
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        surface:
          type: string
          enum:
            - workspace.drive.put
            - workspace.drive.get
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        openapi_contract:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDrivePermissionGrantRecord:
      type: object
      required:
        - subject_ref
        - role
        - granted_at_epoch_seconds
      properties:
        subject_ref:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_IDENTIFYING
        role:
          type: string
          enum:
            - viewer
            - commenter
            - editor
            - owner
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        granted_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveObjectRecord:
      type: object
      required:
        - object_id
        - folder_id
        - path
        - tenant_id
        - region
        - data_class
        - object_storage_key
        - size_bytes
        - mime_type
        - kms_shred_key_id
        - permissions
        - created_at_epoch_seconds
        - schema_version
      properties:
        object_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        folder_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        path:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: PII_QUASI_IDENTIFIER
        tenant_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        region:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        data_class:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        object_storage_key:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        size_bytes:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        mime_type:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        kms_shred_key_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDrivePermissionGrantRecord'
          x-oyatie-rust-type: Vec<WorkspaceDrivePermissionGrantRecord>
          x-oyatie-data-class: PII_IDENTIFYING
        created_at_epoch_seconds:
          type: integer
          format: uint64
          minimum: 0
          x-oyatie-rust-type: u64
          x-oyatie-data-class: INTERNAL_ONLY
        schema_version:
          type: integer
          format: uint32
          minimum: 1
          x-oyatie-rust-type: u32
          x-oyatie-data-class: PUBLIC
    WorkspaceDriveApiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/WorkspaceDriveApiErrorBody'
          x-oyatie-rust-type: WorkspaceDriveApiErrorBody
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveApiErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        message_localized:
          type: string
          nullable: true
          x-oyatie-rust-type: Option<String>
          x-oyatie-data-class: INTERNAL_ONLY
        request_id:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        details:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceDriveApiErrorDetail'
          x-oyatie-rust-type: Vec<WorkspaceDriveApiErrorDetail>
          x-oyatie-data-class: INTERNAL_ONLY
        retry_after_seconds:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          x-oyatie-rust-type: Option<u64>
          x-oyatie-data-class: INTERNAL_ONLY
    WorkspaceDriveApiErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
        issue:
          type: string
          x-oyatie-rust-type: String
          x-oyatie-data-class: INTERNAL_ONLY
