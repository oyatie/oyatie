# PURPOSE: OpenAPI 3.2 contract for the ops docs-portal BC per
# ralplan-docs-portal v7 + ADR-0066 (live code-introspection docs portal).
# Consumer of oya-ops-docs-portal-kernel types (ManifestPort + LiveFeedPort +
# ExtractorClass hot/warm/cold).
# Cedar-gated initially by ops-internal-public.cedar (M02-P20); tenant-tier
# overlay adds ops-tenant-public.cedar + ops-manifest-tenant-filter.cedar +
# ops-live-feed-scope.cedar at Wave 5.
# Per ADR-0067 §5: SSR p99 ≤500ms, SSE p99 ≤2s, 10k concurrent SSE.
# Per markdown-retirement-policy: this YAML is canonical source.
openapi: 3.2.0
info:
  title: Ops Docs Portal
  version: 0.1.0
  description: |
    Per-tenant manifest + SSE live-feed surface for ops.oyatie.com/workspace/docs.
    Streams ADR/runbook/glossary/dead-code/link-broken events as they happen.
    Extractor freshness: Hot ≤500ms / Warm ≤2s / Cold ≤10min.

    Registered in `.omc/registries/artifact-capabilities-registry.json` per
    ADR-0069 v3.0.0.
  contact:
    name: council-foundry
  license:
    name: Apache-2.0
servers:
  - url: https://ops.oyatie.com
    description: Production (planned; foundation-prerequisite-gated)
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: manifest
    description: ManifestPort read-side projection
  - name: live-feed
    description: LiveFeedPort SSE stream
  - name: extractor
    description: Extractor lifecycle ops
paths:
  /workspace/docs/manifest:
    get:
      tags: [manifest]
      summary: Read the current docs portal manifest
      operationId: getManifest
      x-cedar-fragments: [ops-internal-public, ops-tenant-public, ops-manifest-tenant-filter]
      parameters:
        - in: query
          name: tenant
          required: false
          schema: { type: string }
          description: Tenant id hash (SHA-256). Cedar enforces principal.tenant_id == tenant.
        - in: query
          name: class
          required: false
          schema:
            $ref: "#/components/schemas/ExtractorClass"
        - in: query
          name: include_stale
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Manifest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestSnapshot"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/docs/live:
    get:
      tags: [live-feed]
      summary: SSE stream of live docs portal events
      operationId: subscribeLiveFeed
      x-cedar-fragments: [ops-internal-public, ops-live-feed-scope]
      parameters:
        - in: query
          name: tenant
          required: false
          schema: { type: string }
        - in: query
          name: since
          required: false
          schema:
            type: integer
            format: int64
            description: Unix timestamp ms; replay events emitted after this point
      responses:
        "200":
          description: text/event-stream of LiveFeedEvent records
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/LiveFeedEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/docs/api/v1/extractors/{extractor_id}/refresh:
    post:
      tags: [extractor]
      summary: Trigger extractor refresh (internal-sre+)
      operationId: refreshExtractor
      x-cedar-fragments: [ops-internal-public, ops-internal-sre]
      parameters:
        - in: path
          name: extractor_id
          required: true
          schema:
            $ref: "#/components/schemas/ExtractorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshExtractorRequest"
      responses:
        "202":
          description: Refresh accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshExtractorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Stale-timestamp conflict (monotonic invariant violated)
components:
  schemas:
    ExtractorClass:
      type: string
      enum: [hot, warm, cold]
      description: Per ADR-0066 §5 SLA budgets (Hot ≤500ms / Warm ≤2s / Cold ≤10min)
    ExtractorId:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
    ExtractorRecord:
      type: object
      additionalProperties: false
      required: [id, class, source_path, last_refreshed_unix_ms, manifest_record_count]
      properties:
        id:
          $ref: "#/components/schemas/ExtractorId"
        class:
          $ref: "#/components/schemas/ExtractorClass"
        source_path:
          type: string
        last_refreshed_unix_ms:
          type: integer
          format: int64
          minimum: 0
        manifest_record_count:
          type: integer
          format: int64
          minimum: 0
        is_stale:
          type: boolean
          description: Computed; true if (now - last_refreshed) > class.sla_budget_ms
    ManifestSnapshot:
      type: object
      additionalProperties: false
      required: [records, freshness_unix_ms, stale_record_count]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ExtractorRecord"
        freshness_unix_ms:
          type: integer
          format: int64
        stale_record_count:
          type: integer
          minimum: 0
    LiveFeedEventKind:
      type: string
      enum: [extractor-refreshed, manifest-row-changed, dead-code-detected, link-broken]
    LiveFeedEvent:
      type: object
      additionalProperties: false
      required: [kind, emitted_at_unix_ms, payload_hash]
      properties:
        kind:
          $ref: "#/components/schemas/LiveFeedEventKind"
        extractor_id:
          oneOf:
            - $ref: "#/components/schemas/ExtractorId"
            - type: "null"
        tenant_scope:
          type: [string, "null"]
          description: SHA-256 hash of tenant id; never raw
        emitted_at_unix_ms:
          type: integer
          format: int64
          minimum: 0
        payload_hash:
          type: string
          description: SHA-256 of normalized event payload
    RefreshExtractorRequest:
      type: object
      additionalProperties: false
      required: [unix_ms]
      properties:
        unix_ms:
          type: integer
          format: int64
          minimum: 0
        force:
          type: boolean
          default: false
    RefreshExtractorResponse:
      type: object
      additionalProperties: false
      required: [extractor_id, refreshed]
      properties:
        extractor_id:
          $ref: "#/components/schemas/ExtractorId"
        refreshed:
          type: boolean
        last_refreshed_unix_ms:
          type: integer
          format: int64
        record_count:
          type: integer
          format: int64
          minimum: 0
    CedarDenyResponse:
      type: object
      additionalProperties: false
      required: [error, principal_role, resource]
      properties:
        error:
          type: string
        principal_role:
          type: string
        resource:
          type: string
        cedar_fragment_denied_by:
          type: string
  responses:
    Unauthorized:
      description: Cedar denied (no principal context)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
    Forbidden:
      description: Cedar denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CedarDenyResponse"
