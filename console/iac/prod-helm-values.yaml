# ops-dashboard-control-center — Helm chart values (prod)
# IaC engine: OpenTofu (per manifest.json iac.engine)
# Binding ADRs: ADR-0248, ADR-0254
---
global:
  cell_tier: "tier-1"
  region: "us-east-1"
  microservice: "ops-dashboard-control-center"
  owner_team: "ops-sre-reliability"
  image_registry: "registry.oyatie.com"

image:
  repository: ops-dashboard-control-center
  tag: "0.1.0"
  pullPolicy: Always

replicaCount: 3

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 200
  targetCPUUtilizationPercentage: 70
  customMetrics:
    - name: oya_ops_control_center_command_queue_depth
      targetAverageValue: "50"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  name: ops-dashboard-control-center
  annotations:
    spiffe_svid: "spiffe://oyatie.dev/ns/ops-dashboard/sa/ops-dashboard-control-center"

service:
  type: ClusterIP
  ports:
    http3: 8443
    grpc: 9090
    metrics: 9091

openbao:
  agentEnabled: true
  role: "ops-dashboard-control-center"
  tlsMinVersion: "tls13"

cedar:
  sidecarEnabled: true
  image: "registry.oyatie.com/cedar-eval-sidecar:4.2.0"
  policyBundlePath: "/etc/cedar/policy-bundle"
  evaluationMode: "library_first"

monitoring:
  serviceMonitor:
    enabled: true
    namespace: "observability"
    interval: "15s"
    path: "/metrics"
    port: "metrics"

lts_pins:
  argocd: "2.12"
  cilium: "1.16"
  grafana: "12.0.0"
  k8s: "1.30"
  openbao: "2.0"
  rust: "1.83"
