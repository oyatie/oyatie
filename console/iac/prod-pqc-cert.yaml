# ops-dashboard-control-center — PQC (Post-Quantum Cryptography) certificate config
# Per ADR-0253: X25519MLKEM768 KEM hybrid (IANA 0x11ec) + ed25519+ml_dsa_65 signatures.
# Non-PQ clients fall through to X25519/P-256 without breakage.
# PQC keys rotated ≥90d with 30d overlap per compliance.md §key-rotation-cadence.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ops-dashboard-pqc-cert
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0253"
    pqc_kem: "X25519MLKEM768"
    pqc_iana_codepoint: "0x11ec"
    pqc_sig: "ed25519+ml_dsa_65"
    rotation_cadence_days: "90"
    overlap_days: "30"
spec:
  secretName: ops-dashboard-pqc-tls
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  issuerRef:
    name: oyatie-rooted-ca-issuer
    kind: ClusterIssuer
  commonName: ops-dashboard.oyatie.com
  dnsNames:
    - ops-dashboard.oyatie.com
    - ops-dashboard.internal.oyatie.com
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: Ed25519
    # PQC hybrid: ml_dsa_65 co-signed via sigstore/Fulcio supply-chain
    rotationPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-dashboard-pqc-config
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0253"
data:
  # KEM negotiation preference order
  kem_preference: "X25519MLKEM768,X25519,P-256"
  # PQC hybrid enabled where client negotiates
  pqc_hybrid_enabled: "true"
  # Classical fallback for non-PQ clients (never refuse session)
  classical_fallback_enabled: "true"
  classical_kem_fallback: "X25519,P-256"
  # Signature algorithm
  sig_algorithm: "ed25519+ml_dsa_65"
  sig_classical_fallback: "ed25519"
  # IANA codepoint for X25519MLKEM768
  pqc_kem_codepoint: "0x11ec"
