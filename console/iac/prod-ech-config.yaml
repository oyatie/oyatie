# ops-dashboard-control-center — ECH (Encrypted Client Hello) ingress config
# Per ADR-0253: ECH enabled on all Tier-1 cell ingress endpoints.
# RFC 9460 + draft-ietf-tls-esni-22; HTTPS RR with ech= published in DNS.
# ECH keys rotated ≥90d per compliance.md §key-rotation-cadence.
# ECH-disabled clients fall through to standard TLS 1.3 without breakage.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-dashboard-ech-config
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0253"
    rotation_cadence_days: "90"
    last_rotated: "2026-05-20"
    next_rotation_due: "2026-08-18"
data:
  ech_enabled: "true"
  ech_mode: "grease_on_no_ech"
  # ECH config-id served at ingress; rotated via key-rotation runbook
  ech_config_id: "${openbao:secret/oyatie/pki/ops-dashboard/ech-config-id}"
  # HTTPS RR published via ADR-0273 DKIM/SPF/DMARC toolchain
  https_rr_target: "ops-dashboard.oyatie.com"
  https_rr_ech_param: "${openbao:secret/oyatie/pki/ops-dashboard/ech-public-param}"
  # Graceful degradation: ECH-incapable clients fall through to TLS 1.3
  ech_fallback_mode: "tls_13_fallback"
  # TLS profile per ADR-0253
  tls_min_version: "1.3"
  tls_cipher_suites: "TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256"
  hsts_max_age: "63072000"
  hsts_include_subdomains: "true"
  hsts_preload: "true"
  certificate_transparency_required: "true"
  ocsp_stapling: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-dashboard-ech-keys
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0253,ADR-0296"
type: Opaque
# Actual key material injected by OpenBao agent sidecar at pod startup
# Path: ${openbao:secret/oyatie/pki/ops-dashboard/ech-private-key}
stringData:
  placeholder: "injected-by-openbao-agent"
