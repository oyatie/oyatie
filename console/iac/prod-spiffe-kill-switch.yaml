# ops-dashboard-control-center — SPIFFE workload identity + kill-switch config
# Per ADR-0295: SPIFFE/SPIRE attestation for bootstrap-tier-1 classification.
# Kill-switch: SPIFFE cert revocation via CRL + OCSP; rotation TTL 24h.
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: ops-dashboard-control-center
  annotations:
    binding_adr: "ADR-0295"
    kill_switch_enabled: "true"
    rotation_ttl_hours: "24"
spec:
  spiffeIDTemplate: "spiffe://oyatie.dev/ns/ops-dashboard/sa/ops-dashboard-control-center"
  podSelector:
    matchLabels:
      app: ops-dashboard-control-center
  namespaceSelector:
    matchNames:
      - ops-dashboard
  workloadSelectorTemplates:
    - "k8s:ns:ops-dashboard"
    - "k8s:sa:ops-dashboard-control-center"
  ttl: 24h
  # Kill-switch: revoke via CRL + OCSP stapling on cert compromise
  # Procedure: kubectl delete clusterspiffeid ops-dashboard-control-center
  # All pods immediately lose SVID; Cedar mTLS calls fail-closed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-kill-switch-config
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0295"
data:
  # Kill-switch procedure documented in compliance.md §bootstrap-trust-chain
  kill_switch_procedure: |
    1. kubectl delete clusterspiffeid ops-dashboard-control-center -n ops-dashboard
    2. All pods lose SVID immediately; mTLS calls fail-closed (Cedar DENY on no SVID)
    3. Alert: #ops-security-incidents
    4. Re-issue: kubectl apply -f iac/prod-spiffe-kill-switch.yaml after root cause resolved
    5. Audit event: SpiffeKillSwitchTriggered emitted per ADR-0263
  rotation_ttl: "24h"
  crl_distribution_point: "https://pki.internal.oyatie.com/crl/ops-dashboard.crl"
  ocsp_responder: "https://pki.internal.oyatie.com/ocsp/ops-dashboard"
