# ops-dashboard-control-center — Kubernetes Deployment manifest
# IaC engine: OpenTofu (per manifest.json iac.engine)
# Cell tier: Tier 1 control-plane (per ARCHITECTURE.md §cell-eligibility)
# Binding ADRs: ADR-0248 (cellular arch), ADR-0254 (K8s + Cloud Hypervisor + Kata)
# ADR-0295 (SPIFFE workload identity), ADR-0296 (credential sidecar)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard-control-center
  namespace: ops-dashboard
  labels:
    app: ops-dashboard-control-center
    version: "0.1.0"
    cell_tier: "tier-1"
    microservice: ops-dashboard-control-center
    owner_team: ops-sre-reliability
  annotations:
    binding_adr: "ADR-0248,ADR-0254,ADR-0295,ADR-0296"
    audit_chain_required: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ops-dashboard-control-center
  template:
    metadata:
      labels:
        app: ops-dashboard-control-center
        version: "0.1.0"
        cell_tier: "tier-1"
        spiffe_required: "true"
      annotations:
        # OpenBao agent injector — credential sidecar per ADR-0296
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-tls: "secret/oyatie/pki/ops-dashboard/tls-cert"
        vault.hashicorp.com/role: "ops-dashboard-control-center"
        # Kata Containers runtime per ADR-0254
        io.katacontainers.config.hypervisor.default_memory: "512"
    spec:
      runtimeClassName: kata-qemu
      serviceAccountName: ops-dashboard-control-center
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops-dashboard-control-center
          image: registry.oyatie.com/ops-dashboard-control-center:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http3
              containerPort: 8443
              protocol: UDP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: PLATFORM_OWNER_SLUG
              valueFrom:
                configMapKeyRef:
                  name: platform-owner-config
                  key: slug
            - name: CELL_TIER
              value: "tier-1"
            - name: AUDIT_CHAIN_SEAL_REQUIRED
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /ops/v1/health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ops/v1/health/ready
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: cedar-sidecar
          image: registry.oyatie.com/cedar-eval-sidecar:4.2.0
          ports:
            - name: cedar-grpc
              containerPort: 9092
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-certs
          secret:
            secretName: ops-dashboard-tls
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ops-dashboard-control-center
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ops-dashboard-control-center
              topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ops-dashboard-control-center-pdb
  namespace: ops-dashboard
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ops-dashboard-control-center
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ops-dashboard-control-center-hpa
  namespace: ops-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ops-dashboard-control-center
  minReplicas: 3
  maxReplicas: 200
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_ops_control_center_command_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
