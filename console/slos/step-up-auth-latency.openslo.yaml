# Canonical-base: specs/openslo/canonical-envelope-schema.json
# Authoring authority: ADR-0130 agentic SLO-gated promotion
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-step-up-auth-latency
  displayName: "ops-dashboard: step-up auth challenge completion latency P99 ≤8s"
  labels:
    microservice: ops-dashboard-control-center
    bounded_context: auth
    sli_class: latency
    tier: internal-product
    plane: control
    owner_team: ops-sre-reliability
    pack_scope: all
spec:
  service: ops-dashboard-control-center
  description: |
    Step-up auth challenge-to-completion latency. The 8s P99 target for
    TOTP/passkey class covers human interaction time (present challenge,
    operator responds on FIDO2 device). Hardware-key class (1h window)
    has stricter P99 ≤5s expectation but TOTP adds ~3s human latency.
    Per docs/standards/step-up-auth-classes.md.
  indicator:
    metadata:
      name: ops-step-up-auth-challenge-completion-p99
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum(rate(oya_ops_control_center_step_up_auth_duration_seconds_bucket[5m])) by (le, step_up_class)
              )
        threshold: 8.0
        op: lte
  objectives:
    - target: 0.99
      displayName: "P99 step-up auth completion ≤8s on 99% of challenges"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
