# Canonical-base: specs/openslo/canonical-envelope-schema.json
# Authoring authority: ADR-0130 agentic SLO-gated promotion
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-admin-action-audit-seal-completeness
  displayName: "ops-dashboard: admin action audit seal completeness 100%"
  labels:
    microservice: ops-dashboard-control-center
    bounded_context: policy-audit-evidence
    sli_class: correctness
    tier: internal-product
    plane: control
    owner_team: ops-sre-reliability
    pack_scope: all
spec:
  service: ops-dashboard-control-center
  description: |
    Every admin action MUST produce a Merkle-sealed audit event per ADR-0263
    and ADR-0028. Target is 1.0 (100%) — any unsealed action is a SEV1.
    This SLO gates promotion and is monitored continuously.
    An audit seal failure means the action completed without a verifiable
    audit trail — a SOC 2 CC6.2 control failure.
  indicator:
    metadata:
      name: ops-audit-seal-completeness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_ops_control_center_operator_action_total{sealed="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_ops_control_center_operator_action_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% of admin actions are audit-sealed"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
