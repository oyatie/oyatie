apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-incident-ack-latency
spec:
  service: ops-dashboard-control-center
  objective:
    target: "0.99"
  indicator:
    ratioMetric:
      good:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_ops_control_center_incident_ack_seconds_bucket[5m])) by (le))'
      total:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_requests_total[5m]))'
