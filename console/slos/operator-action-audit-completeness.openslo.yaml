apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-operator-action-audit-completeness
spec:
  service: ops-dashboard-control-center
  objective:
    target: "1.0"
  indicator:
    ratioMetric:
      good:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_operator_action_total{sealed="true"}[5m])) / sum(rate(oya_ops_control_center_operator_action_total[5m]))'
      total:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_requests_total[5m]))'
