[package]
name = "console-workspace-shell-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
console-workspace-shell-kernel = { path = "../../ports/workspace-shell-kernel" }
console-workspace-shell-usecase = { path = "../../core/workspace-shell-usecase" }
console-workspace-shell-adapter = { path = "../../adapters/workspace-shell-adapter" }
console-workspace-shell-rest = { path = "../workspace-shell-rest" }
http-router-kernel = { path = "../../../base/http-router-kernel" }
http-middleware-kernel = { path = "../../../base/http-middleware-kernel" }
http-runtime-hyper-adapter = { path = "../../../base/http-runtime-hyper-adapter" }
tokio.workspace = true
# bytes removed per ADR-0092: kernel body is Vec<u8>; only the hyper adapter
# needs bytes, and this runtime consumes the adapter's already-converted types.


[lib]
name = "console_workspace_shell_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "console-workspace-shell"
path = "src/main.rs"

[lints]
workspace = true
