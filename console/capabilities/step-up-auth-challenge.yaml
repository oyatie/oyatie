# ops-dashboard-control-center capability: step-up-auth-challenge
# v2 capability-record schema
# Binding ADR: ADR-0243 (Cedar universal gate), docs/standards/step-up-auth-classes.md
name: step-up-auth-challenge
availability: "paid tenant_class always-on; demo_trial cap-bounded"
risk_class: limited
description: |
  Issues a step-up authentication challenge to an operator before a T2 or T3 mutation.
  Challenge types: TOTP code, WebAuthn passkey re-auth, FIDO2 hardware key.
  Returns a time-bounded step-up token (4h for T2, 1h for T3) stored in OpenBao.
  All challenge outcomes (issued, completed, failed) are audit-emitted per ADR-0263.
  Emergency-services bypass: EMERGENCY_SERVICES audience skips challenge per §3.2.3.
cedar_fragments:
  - policy/cedar/step-up-auth-required.cedar
audit_events:
  - StepUpAuthChallengeIssued
  - StepUpAuthCompleted
  - StepUpAuthFailed
slo_ref: slos/step-up-auth-latency.openslo.yaml
step_up_classes:
  - STEP_UP_TOTP_OR_PASSKEY
  - STEP_UP_HARDWARE_KEY
  - STEP_UP_HARDWARE_KEY_QUORUM_2
session_ttl_by_class:
  STEP_UP_TOTP_OR_PASSKEY: 14400s
  STEP_UP_HARDWARE_KEY: 3600s
  STEP_UP_HARDWARE_KEY_QUORUM_2: 1800s
emergency_services_bypass: true
wcag_compliance: WCAG_2_2_AA
a11y_alternatives:
  - audio_challenge_for_visual_impairment
  - extended_timeout_for_assistive_tech
  - keyboard_only_navigation
