[package]
name = "shared-resource-provider-contract-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# The uniform resource-provider contract-test harness (contract-lock seed):
# every FD-001 service runs these generic conformance checks against its
# resource handlers — idempotent PUT, no duplicate create under client-UUID
# idempotency keys (AIP-155 / AWS client tokens), read-after-write equality,
# stable cursor pagination (AIP-158), and AIP-151-shaped operation resources
# for async mutations. Pure trait + generic test fns, NO IO; the in-crate
# reference provider in tests/ is the fixture that proves the harness itself.

[lib]
name = "shared_resource_provider_contract_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# The library is async via bare Pin<Box<dyn Future>> (core only — no new lib
# deps). The in-crate reference-provider integration test drives the async
# conformance harness, so it needs a runtime to `.await` under `#[tokio::test]`.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
