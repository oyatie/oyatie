[package]
name = "oya-json-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Std-only kernel JSON value-kind classifier + minimal top-level-object
# parser. Reusable across the workspace (initially: oya-check-dependency-seam
# CONV-1 substring-grep replacement; future: A-family adherence checks +
# any tooling that needs JSON structural inspection without serde_json).
#
# Per ADR-0056 BNF v4.1: oya-<microservice=json>-<layer=kernel>.
# Std-only: no transitive deps (kernel layer rule).
# Originated by user directive 2026-05-15: "shouldn't we make a reusable
# json parser?" — extracted from oya-check-dependency-seam/src/lib.rs after
# CONV-1 of TG2 11-facet debate synthesis.

[lib]
name = "oya_json_kernel"
path = "src/lib.rs"

[lints]
workspace = true
