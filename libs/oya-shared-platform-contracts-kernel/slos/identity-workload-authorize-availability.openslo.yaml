# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Contract-lock seed (FD-001 Lane C): authored with the contracts kernel so the
# identity workload service lane inherits a locked SLO surface; per ADR-0130 the
# service cannot promote past dev without slos/*.openslo.yaml, and this skeleton
# relocates to the service's own slos/ dir when that lane lands.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-identity-workload-authorize-availability
  displayName: "identity workload authorize availability"
  labels:
    microservice: identity
    bounded_context: workload
    tier: control-plane
    plane: control
spec:
  service: oya-identity-workload
  description: "Availability of the workload-identity authorize surface (the FD-001 PEP entrypoint). Failed availability here fails closed: callers receive deny, so the error budget bounds spurious denials of legitimate workload traffic."
  indicator:
    metadata:
      name: oya-identity-workload-authorize-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_identity_workload_authorize_requests_total{code!~"5.."}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_identity_workload_authorize_requests_total[5m]))'
  objectives:
    - displayName: "99.9% of authorize requests complete without server error over rolling 30d"
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
