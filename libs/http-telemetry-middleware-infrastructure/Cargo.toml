[package]
name = "http-telemetry-middleware-infrastructure"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
# Std-only middleware per ADR-0092: no hyper-family deps. Consumes kernel
# types (HttpRequest/HttpResponse with Vec<u8> body) only.
http-middleware-kernel = { path = "../http-middleware-kernel" }

[dev-dependencies]
http-router-kernel = { path = "../http-router-kernel" }


[lib]
name = "http_telemetry_middleware_infrastructure"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
