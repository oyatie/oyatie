[package]
name = "oya-crate-registrar-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "crate-registrar"
kind = "shared"
layer = "app"
purpose = "The I/O/adapter half of register_crate (ADR-0568, G011 slice 2): three thin WRITERS that APPLY the kernel's new typed Edits to the born-accounting SSOTs — capability-mapping upsert into the closed capability-registry.json (canonical-JSON byte-stable), the ADR `## Governed surfaces` verbatim-path appender (idempotent, sorted, brace-glob-free — the #66 resolve_justifications format), and the schema-driven catalog-yaml renderer (slo/plane human-required). Each is a pure compute-then-tiny-apply with idempotent re-apply (byte-identical no-op)."

[lib]
name = "oya_crate_registrar_app"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-crate-registrar-kernel = { path = "../oya-crate-registrar-kernel" }
oya-workspace-members-kernel = { path = "../oya-workspace-members-kernel" }
serde = { workspace = true }
# preserve_order is LOAD-BEARING, not a preference: this crate rewrites the hand-authored
# governance/capability-registry.json, and canonical-json-policy.json pins sort_keys:false. Without the
# feature, serde_json's default BTreeMap backing sorts every object on PARSE and the authored order
# is gone before serialization. reindeer already unions it ON for third-party//:serde_json, so this
# makes the cargo path agree with the buck2 path rather than diverge from it.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
