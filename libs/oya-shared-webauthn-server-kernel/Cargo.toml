[package]
name = "oya-shared-webauthn-server-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "WebAuthn Level-3 relying-party kernel: trait + reference impl handling register/authenticate ceremonies. Authority: ADR-0188. Wraps webauthn-rs v0.5+ at the adapter boundary; kernel exposes a vendor-neutral trait for Phase-2 in-house swap."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "oya_shared_webauthn_server_kernel"
path = "src/lib.rs"
doctest = false

[[test]]
name = "webauthn_server_kernel"
path = "tests/webauthn_server_kernel.rs"

[lints]
workspace = true
