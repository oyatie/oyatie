[package]
name = "oya-http-tenant-middleware-infrastructure"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
# Std-only middleware per ADR-0092: no hyper-family deps. Consumes kernel
# types (HttpRequest/HttpResponse with Vec<u8> body) only.
oya-http-middleware-kernel = { path = "../oya-http-middleware-kernel" }
# ADR-0095: TenantSlug grammar lives in oya-tenancy-kernel. The middleware
# is a thin extractor; the kernel owns the validation rules.
oya-tenancy-kernel = { path = "../../cloud/tenancy/crates/oya-tenancy-kernel" }

[dev-dependencies]
oya-http-router-kernel = { path = "../oya-http-router-kernel" }


[lib]
name = "oya_http_tenant_middleware_infrastructure"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
