[package]
name = "oya-shared-pdp-adapter-cedar"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Embedded cedar-policy PDP adapter (G004 / ADR-0536 D-2): implements the oya-shared-pdp-kernel PolicyDecisionPoint port over the formally-verified upstream cedar-policy engine — in-process evaluation (no network hop), strict bundle validation before load, (request-fingerprint, policy-version) decision cache with zookie freshness refusal, atomic bundle swap for sub-60s revocation, and one audit record per decision. Terminal engine per ADR-0536 D-2; retires the hand-rolled oya-policy-cedar evaluator."

[dependencies]
cedar-policy = { workspace = true }
oya-audit-chain-domain = { path = "../../oya/audit-chain/crates/oya-audit-chain-domain" }
oya-audit-chain-file-adapter = { path = "../../oya/audit-chain/crates/oya-audit-chain-file-adapter" }
oya-data-boundary-kernel = { path = "../oya-data-boundary-kernel" }
oya-shared-pdp-kernel = { path = "../oya-shared-pdp-kernel" }
oya-shared-platform-contracts-kernel = { path = "../oya-shared-platform-contracts-kernel" }
oya-shared-ulid-id-kernel = { path = "../oya-shared-ulid-id-kernel" }
serde_json = { workspace = true }

[lib]
name = "oya_shared_pdp_adapter_cedar"
path = "src/lib.rs"
doctest = false

[[test]]
name = "cedar_pdp_conformance"
path = "tests/cedar_pdp_conformance.rs"

[lints]
workspace = true
