[package]
name = "ci-config-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# The ci CONFORMANCE-FLOOR config kernel (OYA-CI-CONFORMANCE-FLOOR-PLAN §3.3).
# Pure, I/O-free parse + CLOSED-schema validation of the portable ci policy
# (naming / vocab / manifest / reachability / justification / owners / enforcement /
# ttl / unit_class / gates incl. per-gate input_kind) into typed structs. The BUNDLED
# DEFAULT reproduces oyatie's CURRENT hardcoded policy byte-for-byte, so the producer
# can read the config defaulting to today's values with zero behaviour change. The
# closed schema (serde `deny_unknown_fields`) mirrors the existing strict
# `Policy::from_strs`. Owned by GATE-2 cloud-ci-total-accounting.

[lib]
name = "ci_config_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
