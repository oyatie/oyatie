# Pure planner kernel for the universal generated-artifact lifecycle engine (ADR-0597 — E1).
# ZERO I/O, ZERO clock, ZERO net, ZERO subprocess, ZERO git. serde_json + std-collections only.
# All impurity is confined to oya-ci-materializer-app (the thin executor).
# authoring_adrs: ADR-0597
# depends_on_adrs: ADR-0596, ADR-0595, ADR-0551, ADR-0552, ADR-0523

[package]
name = "oya-ci-materializer-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "oya_ci_materializer_kernel"
path = "src/lib.rs"
doctest = false

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[lints]
workspace = true
