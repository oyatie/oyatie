[package]
name = "shared-audit-event-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR-0536 D-16 canonical audit emission contract (G008 lane): one audit
# crate emits CloudEvents-enveloped, AuditLog-shaped payloads from HTTP
# middleware — services cannot choose whether to emit. Asymmetric defaults
# are STRUCTURAL: the admin/management stream is always-on with no kill
# switch representable in the type system; data-plane events are
# policy-opt-in. The signed digest chain (CloudTrail digest-file lineage)
# is modeled as pure ports here; the aws-lc-rs adapter lives in
# shared-audit-digest-adapter-awslc per ADR-0506 canonical crypto.
# Precedent: AWS CloudTrail (management events always on; digest-file
# integrity chain); GCP Cloud Audit Logs (Admin Activity stream cannot be
# disabled; AuditLog payload shape); CloudEvents 1.0 (CNCF envelope).

[lib]
name = "shared_audit_event_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
