[package]
name = "oya-http-wide-event-middleware-infrastructure"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR-0536 D-6 (G008 lane): one structured wide event per unit of work is
# the canonical telemetry primitive (Meta/Honeycomb lineage), emitted by
# tower middleware so axum/tonic services cannot skip instrumentation.
# RED metrics are DERIVED from the same request outcome through the
# oya-shared-hyperscaler-metrics-kernel canonical counter families —
# never a second bespoke taxonomy. Cardinality caps are enforced at
# ingestion (Google Monarch survival property): route labels are static
# templates, extra dimensions are bounded and truncation is recorded on
# the event itself. Deliberately axum-free: route templates arrive via a
# RouteTemplate request extension so the layer works for any tower stack.

[lib]
name = "oya_http_wide_event_middleware_infrastructure"
path = "src/lib.rs"
doctest = false

[dependencies]
http = { version = "1", default-features = false, features = ["std"] }
tower = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
oya-http-middleware-kernel = { path = "../oya-http-middleware-kernel" }
oya-shared-hyperscaler-metrics-kernel = { path = "../oya-shared-hyperscaler-metrics-kernel" }
oya-tenancy-kernel = { path = "../../cloud/tenancy/crates/oya-tenancy-kernel" }

[dev-dependencies]
oya-http-router-kernel = { path = "../oya-http-router-kernel" }

[lints]
workspace = true
