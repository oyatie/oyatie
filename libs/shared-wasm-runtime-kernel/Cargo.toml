[package]
name = "shared-wasm-runtime-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ADR-0200 canonical WASM runtime substrate. Trait surface every
# µservice integrates to host WASI Preview 2 Component-Model
# bytecode through Wasmtime via a single approved sandbox class.
# Live `wasmtime` integration lives behind the `wasmtime-real`
# feature flag (parent wires it); the default build is dep-free
# so the trait is callable from any layer.

[dependencies]

[lib]
name = "shared_wasm_runtime_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
