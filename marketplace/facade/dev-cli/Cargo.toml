[[bin]]
name = "oya"
path = "src/main.rs"

# Test fixture binary: integration tests in tests/doc_cli.rs invoke this
# as the `--cargo` executable to emulate cargo's behavior under control
# of FAKE_CARGO_* env vars. Replaces the prior fake-cargo.sh shell-script
# fixture per the no-shell-scripts canonical posture.
[[bin]]
name = "fake-cargo"
path = "src/bin/fake-cargo.rs"
test = false
doctest = false

# Test fixture binary for `oya verify --ci-required` integration tests.
# The test symlinks/copies it as `cargo`, `oya`, and `git` inside a
# temporary PATH fixture so no shell-script fixture is needed.
[[bin]]
name = "fake-verify-command"
path = "src/bin/fake-verify-command.rs"
test = false
doctest = false

[lints]
workspace = true
