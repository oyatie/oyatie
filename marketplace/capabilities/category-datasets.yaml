schema_version: 2
name: category-datasets
microservice: marketplace
category: datasets
risk_class: high
description: Marketplace category surface for dataset listings (signed-URL dataset distribution with provenance) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0308   # EU AI Act for training-grade datasets
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-datasets.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - dataset_class: [tabular, image, audio, video, text-corpus, embeddings, time-series, geospatial, graph]
    - data_format: [parquet, csv, jsonl, arrow, hdf5, tfrecord, webdataset]
    - size_band: [under-1gb, 1-100gb, 100gb-1tb, 1tb-100tb, over-100tb]
    - sensitivity_class: [public, business, pii, phi, financial, sovereign-restricted]
    - provenance_class: [first-party-collected, licensed, public-domain, synthetic, scraped, mixed]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id
    - tenant_id
    - title
    - description
    - dataset_class
    - data_format
    - size_band
    - sensitivity_class
    - provenance_class
    - schema_signature              # BLAKE3 of dataset schema definition
    - sample_artifact_signature     # signed sample (first 1MB) for preview
    - datasheet_ref                 # FK to datasheet µservice (Gebru-style datasheet)
    - sbom_ref                      # data lineage as SBOM
    - revenue_share_rate_basis_points  # default 2000 (20%)
    - tenant_class_required
    - kyc_artifact_ref
    - license_ref                   # usage rights
  optional_fields:
    - dpia_ref                      # required when sensitivity_class in {pii, phi}
    - retention_policy_ref
    - jurisdiction_pinning          # required when sensitivity_class == sovereign-restricted
review_process:
  reviewer_role: marketplace_reviewer_datasets
  required_checks:
    - cedar_policy_compile_check
    - datasheet_presence
    - provenance_attestation
    - sensitivity_classification_review
    - dpia_review                   # when sensitivity_class in {pii, phi}
    - sanctions_screen_pass
    - sbom_presence
    - sample_artifact_signature_verify
  automated: false
  manual_review_required_above_basis_points: 5000
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based             # per-GB-downloaded / per-query
  - tiered
  - private_offer
  - contract
revenue_share_rate_basis_points_default: 2000
entitlement_delivery:
  type: dataset_signed_url_grant_with_sbom_evidence
  delivery_envelope: contracts/listing-datasets-v1.yaml#DatasetEntitlement
  binding_µservice: data-exchange
sla_tier: contractual
compliance_requirements:
  required_packs: []
  conditional_packs:
    - if_sensitivity_class_pii: [GDPR, DPDPA, CCPA]
    - if_sensitivity_class_phi: [HIPAA]
    - if_sensitivity_class_financial: [PCI, SOX]
    - if_sensitivity_class_sovereign_restricted: [CSAP, IL5, FedRAMP-High]
    - if_used_for_eu_ai_training: [EU-AI-Act-training-data]
counterpart_reference:
  aws_marketplace: "Data Exchange"
  appexchange: "Lightning Data"
  atlassian_marketplace: "(no direct counterpart)"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 1
    max_listings: 1
    max_pending_transactions: 0
    payouts_enabled: false
    size_band_max: under-1gb
    sensitivity_class_max: public
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
observability:
  metric: oya_marketplace_category_datasets_listing_total
  trace: marketplace.category-datasets.listing
  audit_event: MarketplaceCategoryDatasetsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
