schema_version: 2
name: category-workflows
microservice: marketplace
category: workflows
risk_class: moderate
description: Marketplace category surface for workflow listings (n8n-class visual workflows + flow actions) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-workflows.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - workflow_class: [agentic, business-process, devops, healthcare, supply-chain, delivery]
    - trigger_type: [http, schedule, event-bus, webhook, agent-tool-call]
    - step_count_band: [1-5, 6-20, 21-100, 100+]
    - external_connectors: [stripe, salesforce, slack, jira, hubspot, github, gmail, sheets]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id
    - tenant_id
    - title
    - description
    - workflow_class
    - trigger_type
    - workflow_definition_signature  # ed25519 over BLAKE3 of workflow JSON
    - required_connectors_manifest   # FK connect µservice
    - revenue_share_rate_basis_points  # default 1500 (15%)
    - tenant_class_required
    - sbom_ref                       # SBOM of all referenced steps/scripts
  optional_fields:
    - template_variables_schema
    - example_inputs_ref
    - kyc_artifact_ref
review_process:
  reviewer_role: marketplace_reviewer_workflows
  required_checks:
    - cedar_policy_compile_check
    - workflow_definition_validation  # workflow-engine.validate
    - connector_permission_review
    - sanctions_screen_pass
    - automated_test_run               # workflow-engine.dry-run with mock data
  automated: true
  manual_review_required_above_basis_points: 3000
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based
  - private_offer
revenue_share_rate_basis_points_default: 1500
entitlement_delivery:
  type: workflow_engine_template_import
  delivery_envelope: contracts/listing-workflows-v1.yaml#WorkflowEntitlement
  binding_µservice: workflow-engine
sla_tier: contractual
compliance_requirements:
  required_packs: []
  conditional_packs:
    - if_workflow_class_healthcare: [HIPAA]
    - if_workflow_class_supply_chain: [DPP, ESPR]
    - if_eu_distribution: [GDPR]
counterpart_reference:
  aws_marketplace: "(no direct counterpart)"
  appexchange: "Flow Action / Flow Template"
  atlassian_marketplace: "Forge Function / module"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 5
    max_listings: 5
    max_pending_transactions: 0
    payouts_enabled: false
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
observability:
  metric: marketplace_category_workflows_listing_total
  trace: marketplace.category-workflows.listing
  audit_event: MarketplaceCategoryWorkflowsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
