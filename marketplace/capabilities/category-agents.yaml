schema_version: 2
name: category-agents
microservice: marketplace
category: agents
risk_class: high
description: Marketplace category surface for agent listings (autonomous AI agents + agent templates) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0308   # EU AI Act adoption
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-agents.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - agent_class: [task-runner, advisor, autonomous-loop, multi-agent-orchestrator, browser-driver]
    - tool_access_class: [read-only, sandboxed, full-tool, code-exec, network-write]
    - autonomy_level: [supervised, semi-autonomous, fully-autonomous]
    - eu_ai_act_risk_class: [minimal, limited, high, unacceptable]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id
    - tenant_id
    - title
    - description
    - agent_class
    - tool_access_class
    - autonomy_level
    - eu_ai_act_risk_class           # forbidden if 'unacceptable'
    - system_prompt_signature        # BLAKE3 of system prompt (auditable)
    - tool_manifest_signature
    - revenue_share_rate_basis_points  # default 2000 (20%)
    - tenant_class_required
    - kyc_artifact_ref
    - safety_card_ref                # FK to safety-card µservice
  optional_fields:
    - capability_card_ref
    - dpia_ref
    - human_oversight_attestation_ref  # required when eu_ai_act_risk_class == high
review_process:
  reviewer_role: marketplace_reviewer_agents
  required_checks:
    - cedar_policy_compile_check
    - eu_ai_act_classification_check  # ADR-0308
    - tool_manifest_diff_review
    - red_team_pass_evidence
    - safety_card_presence
    - sanctions_screen_pass
  automated: false
  manual_review_required_above_basis_points: 4000
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based            # per-invocation / per-token
  - tiered
  - private_offer
revenue_share_rate_basis_points_default: 2000
entitlement_delivery:
  type: intelligence_µservice_agent_registration
  delivery_envelope: contracts/listing-agents-v1.yaml#AgentEntitlement
  binding_µservice: intelligence
sla_tier: contractual
compliance_requirements:
  required_packs: []
  conditional_packs:
    - if_eu_ai_act_risk_class_high: [EU-AI-Act-high-risk]
    - if_processes_pii: [GDPR, DPDPA]
    - if_agent_class_autonomous_loop_and_eu: [EU-AI-Act-high-risk]
counterpart_reference:
  aws_marketplace: "Bedrock AgentCore Marketplace"
  appexchange: "Einstein Bot Templates"
  atlassian_marketplace: "(no direct counterpart)"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 2
    max_listings: 3
    max_pending_transactions: 0
    payouts_enabled: false
    autonomy_level_max: supervised
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
    autonomy_level_max: fully-autonomous
observability:
  metric: marketplace_category_agents_listing_total
  trace: marketplace.category-agents.listing
  audit_event: MarketplaceCategoryAgentsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
  - eu_ai_act_classification
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
