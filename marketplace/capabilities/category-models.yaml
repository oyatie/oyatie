schema_version: 2
name: category-models
microservice: marketplace
category: models
risk_class: high
description: Marketplace category surface for ML/LLM model listings (model registry + signed artifacts) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0308   # EU AI Act
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-models.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - model_class: [llm, vlm, embedding, asr, tts, vision, tabular, time-series, recsys]
    - model_format: [gguf, safetensors, onnx, tensorrt, openvino, mlx, coreml]
    - model_size_band: [tiny-under-1b, small-1b-7b, mid-7b-30b, large-30b-200b, frontier-200b+]
    - training_data_provenance: [public-cc, licensed, synthetic, mixed, undisclosed]
    - eu_ai_act_risk_class: [minimal, limited, high, unacceptable, gpai-systemic-risk]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id
    - tenant_id
    - title
    - description
    - model_class
    - model_format
    - model_size_band
    - training_data_provenance
    - eu_ai_act_risk_class
    - artifact_signature             # cosign over model artifact digest
    - model_card_ref                 # FK to model-card µservice
    - evals_ref                      # FK to evals (MMLU, GSM8K, etc.)
    - sbom_ref
    - revenue_share_rate_basis_points  # default 2500 (25%) — higher due to infra burden
    - tenant_class_required
    - kyc_artifact_ref
    - license_ref                    # license terms for downstream use
  optional_fields:
    - fine_tune_lineage_ref          # parent model FK if fine-tune
    - quantization_method
    - data_governance_ref            # required when eu_ai_act_risk_class in {high, gpai-systemic-risk}
review_process:
  reviewer_role: marketplace_reviewer_models
  required_checks:
    - cedar_policy_compile_check
    - eu_ai_act_classification_check
    - model_card_presence
    - evals_presence
    - artifact_signature_verify
    - training_data_provenance_attestation
    - sanctions_screen_pass
    - sbom_presence
  automated: false
  manual_review_required_above_basis_points: 5000
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based              # per-token / per-inference
  - tiered
  - private_offer
  - contract
revenue_share_rate_basis_points_default: 2500
entitlement_delivery:
  type: model_registry_signed_artifact_fetch
  delivery_envelope: contracts/listing-models-v1.yaml#ModelEntitlement
  binding_µservice: model-registry  # gated by EU AI Act pack per ADR-0308
sla_tier: contractual
compliance_requirements:
  required_packs: []
  conditional_packs:
    - if_eu_ai_act_risk_class_high: [EU-AI-Act-high-risk]
    - if_eu_ai_act_risk_class_gpai_systemic: [EU-AI-Act-gpai-systemic]
    - if_eu_distribution: [EU-AI-Act-foundation-model]
counterpart_reference:
  aws_marketplace: "SageMaker model package + Bedrock Marketplace"
  appexchange: "(no direct counterpart)"
  atlassian_marketplace: "(no direct counterpart)"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 1
    max_listings: 1
    max_pending_transactions: 0
    payouts_enabled: false
    model_size_band_max: small-1b-7b
    eu_ai_act_risk_class_max: limited
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
observability:
  metric: oya_marketplace_category_models_listing_total
  trace: marketplace.category-models.listing
  audit_event: MarketplaceCategoryModelsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
  - eu_ai_act_classification
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
