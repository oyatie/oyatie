# Marketplace category-workflows listing surface — extends DealSetCommand envelope (ADR-0249 KS#11)
openapi: 3.2.0
info:
  title: Marketplace Workflows Category API
  version: 1.0.0
  description: Per-ADR-0249 workflow-category listing surface for n8n-class visual workflows + Forge functions.
paths:
  /marketplace/categories/workflows/listings:
    post:
      operationId: WorkflowListingPublish
      x-cedar-action: marketplace.category-workflows.listing.publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowListingPublishCommand'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
  /marketplace/categories/workflows/listings/{listing_id}/entitlement:
    post:
      operationId: WorkflowEntitlementImport
      x-cedar-action: marketplace.category-workflows.entitlement.import
      parameters:
        - name: listing_id
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: Workflow template imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEntitlement'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: marketplace
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  schemas:
    WorkflowListingPublishCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, audit_chain_ref, tenant_class,
                 revenue_share_cohort_id, title, description, workflow_class, trigger_type,
                 workflow_definition_signature, required_connectors_manifest, sbom_ref,
                 revenue_share_rate_basis_points, pricing_model]
      properties:
        tenant_id: { type: string, format: ulid }
        sub_scope_path: { type: string }
        principal_id: { type: string }
        audit_chain_ref: { type: string }
        tenant_class: { type: string, enum: [paid, demo_trial] }
        revenue_share_cohort_id: { type: string }
        title: { type: string, minLength: 4, maxLength: 128 }
        description: { type: string, maxLength: 65535 }
        workflow_class: { type: string, enum: [agentic, business-process, devops, healthcare, supply-chain, delivery] }
        trigger_type: { type: string, enum: [http, schedule, event-bus, webhook, agent-tool-call] }
        workflow_definition_signature: { type: string }
        required_connectors_manifest: { type: string }
        sbom_ref: { type: string }
        revenue_share_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        pricing_model: { type: string, enum: [free, one_time, subscription, usage_based, private_offer] }
        template_variables_schema: { type: string }
        example_inputs_ref: { type: string }
        kyc_artifact_ref: { type: string }
    WorkflowEntitlement:
      type: object
      required: [listing_id, workflow_engine_template_ref, signature, audit_chain_seal_id]
      properties:
        listing_id: { type: string, format: ulid }
        workflow_engine_template_ref: { type: string }
        signature: { type: string }
        audit_chain_seal_id: { type: string }
    DealSetReceipt:
      type: object
      properties:
        listing_id: { type: string }
        decision: { type: string }
        evidence_ref: { type: string }
        state: { type: string }
