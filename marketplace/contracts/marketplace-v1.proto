// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.marketplace.v1;

option java_multiple_files = true;
option java_package = "dev.oyatie.marketplace.v1";
option go_package = "oyatie.dev/marketplace/v1;marketplacev1";

// Naming justifications: BNF v4 service.action.resource grammar and 13-layer-enum conformance are declared in PRD.md.
service DealSetService {
  rpc SubmitDealSet(DealSetCommand) returns (DealSetReceipt);
  rpc GetDealSetEvidence(DealSetEvidenceRequest) returns (DealSetEvidence);
}

message DealSetCommand {
  string tenant_id = 1;
  string sub_scope_path = 2;
  string principal_id = 3;
  string idempotency_key = 4;
  string action = 5;
  string resource_json = 6;
}

message DealSetReceipt {
  bool accepted = 1;
  string state = 2;
  string audit_chain_ref = 3;
}

message DealSetEvidenceRequest {
  string tenant_id = 1;
  string audit_chain_ref = 2;
}

message DealSetEvidence {
  string tenant_id = 1;
  string sub_scope_path = 2;
  string audit_chain_ref = 3;
  string event_name = 4;
  string payload_digest = 5;
}
