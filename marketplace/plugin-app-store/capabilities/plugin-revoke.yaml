# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:plugin-app-store:plugin-revoke:v1
name: plugin-revoke
namespace: plugin-app-store
display_name: Plugin Revoke (T3 — emergency platform-admin)
description: |
