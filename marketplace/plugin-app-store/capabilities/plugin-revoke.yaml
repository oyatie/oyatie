eval_set:
  canonical_inputs_path: microservices/plugin-app-store/capabilities/eval/plugin-revoke-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: structured-output-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
