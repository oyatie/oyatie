# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:plugin-app-store:plugin-install:v1
name: plugin-install
namespace: plugin-app-store
display_name: Plugin Install (T2 — human-approved)
description: |
  T2 capability: install a plugin into tenant context after explicit tenant-operator permission grant; materializes per-installation Cedar policy + rate-limit bucket; emits audit-chain seal.
owner_team: axis-ecosystem + council-security
maturity: incubating
created_at: 2026-05-18
related_adrs: [ADR-0007, ADR-0022, ADR-0131, ADR-0213]
related_specs: [/specs/microservices/plugin-app-store.json]
related_artifacts:
  - microservices/plugin-app-store/PRD.md
  - marketplace/plugin-app-store/policy/

autonomy_tier: T2

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: plugin_id
    type: string
    required: true
  - name: version
    type: string
    required: true
  - name: granted_capabilities
    type: array
    required: true

outputs:
  - name: installation
    type: object

data_classes_touched:
  - INTERNAL_ONLY

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-financial
  - pack-us-public-sector

risk_class: limited

evidence_topic: oya.plugin-app-store.capability.plugin_install.emitted

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001

cedar_policy_fragments:
  - marketplace/plugin-app-store/policy/tenant-scope.cedar

eval_set:
  canonical_inputs_path: microservices/plugin-app-store/capabilities/eval/plugin-install-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: structured-output-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
