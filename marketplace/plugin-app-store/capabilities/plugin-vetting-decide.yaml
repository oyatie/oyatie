# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:plugin-app-store:plugin-vetting-decide:v1
name: plugin-vetting-decide
namespace: plugin-app-store
display_name: Plugin Vetting Decision (T2 — human-approved)
description: |
  T2 capability: vetting reviewer approves/rejects a submitted plugin version on synthesized auto-vetting report.
owner_team: axis-ecosystem + council-security
maturity: incubating
created_at: 2026-05-18
related_adrs: [ADR-0007, ADR-0022, ADR-0131, ADR-0213]
related_specs: [/specs/microservices/plugin-app-store.json]
related_artifacts:
  - microservices/plugin-app-store/PRD.md
  - marketplace/plugin-app-store/policy/

autonomy_tier: T2

inputs:
  - name: submission_id
    type: string
    required: true
  - name: decision
    type: enum:approve|reject
    required: true
  - name: rejection_reason
    type: object
    required: true

outputs:
  - name: decision_recorded
    type: boolean

data_classes_touched:
  - INTERNAL_ONLY

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-financial
  - pack-us-public-sector

risk_class: high

evidence_topic: oya.plugin-app-store.capability.plugin_vetting_decide.emitted

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001

cedar_policy_fragments:
  - marketplace/plugin-app-store/policy/tenant-scope.cedar

eval_set:
  canonical_inputs_path: microservices/plugin-app-store/capabilities/eval/plugin-vetting-decide-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: structured-output-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
