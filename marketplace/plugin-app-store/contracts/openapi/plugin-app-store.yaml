# Canonical-base: specs/contracts/openapi-3-2-canonical-envelope.yaml (SWEEP-I Slice 3 per ADR-0064)
# Version: OpenAPI 3.2.0 — current latest per spec.openapis.org as of 2026-05-18.
openapi: 3.2.0
info:
  title: Oyatie Plugin/App Store API
  version: 1.0.0
  description: |
    Public + internal REST surface for the plugin-app-store µservice.
    Tenant-facing browse + install; admin-facing vetting + revoke; submission flow consumed by developer-sdk.
  contact:
    name: axis-ecosystem
    email: axis-ecosystem@oyatie.com
  license:
    name: oyatie-proprietary
servers:
  - url: https://api.oyatie.com/v1
    description: Production
  - url: https://dev-api.oyatie.com/v1
    description: Dev
tags:
  - name: plugin-catalog
  - name: plugin-install
  - name: plugin-lifecycle
  - name: vetting-pipeline
  - name: per-plugin-permissions
  - name: subscription-billing
  - name: audit-stream
paths:
  /plugins:
    get:
      tags: [plugin-catalog]
      operationId: listPlugins
      summary: List published plugins
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page of plugins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPage'
  /plugins/search:
    get:
      tags: [plugin-catalog]
      operationId: searchPlugins
      summary: Full-text search published plugins
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSearchResults'
  /plugins/{pluginId}:
    parameters:
      - name: pluginId
        in: path
        required: true
        schema: { type: string, format: ulid }
    get:
      tags: [plugin-catalog]
      operationId: getPlugin
      responses:
        '200':
          description: Plugin detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '404':
          description: Not found
  /installations:
    get:
      tags: [plugin-install]
      operationId: listInstallations
      security: [{ EcosystemBearer: [] }]
      responses:
        '200':
          description: Tenant-scoped installations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Installation' }
    post:
      tags: [plugin-install]
      operationId: installPlugin
      security: [{ EcosystemBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallRequest' }
      responses:
        '201':
          description: Installation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Installation' }
        '400':
          description: Capability mismatch / invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Tenant policy denial
  /installations/{installationId}:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, format: ulid }
    delete:
      tags: [plugin-install]
      operationId: uninstallPlugin
      security: [{ EcosystemBearer: [] }]
      responses:
        '204':
          description: Uninstalled
  /installations/{installationId}/audit-stream:
    parameters:
      - name: installationId
        in: path
        required: true
        schema: { type: string, format: ulid }
    get:
      tags: [audit-stream]
      operationId: streamPluginAudit
      summary: Stream per-plugin audit events (SSE)
      security: [{ EcosystemBearer: [] }]
      responses:
        '200':
          description: SSE stream of audit events
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/PluginActionEvent' }
  /submissions:
    post:
      tags: [vetting-pipeline]
      operationId: submitPluginVersion
      summary: Submit a new plugin version for vetting (called by developer-sdk on behalf of developer)
      security: [{ DeveloperBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '202':
          description: Submission accepted; vetting in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /submissions/{submissionId}/status:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: string, format: ulid }
    get:
      tags: [vetting-pipeline]
      operationId: streamSubmissionStatus
      summary: Stream vetting pipeline status (SSE)
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Per-stage status stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/VettingStageEvent' }
  /admin/vetting-queue:
    get:
      tags: [vetting-pipeline]
      operationId: listVettingQueue
      security: [{ AdminBearer: [] }]
      responses:
        '200':
          description: Vetting queue snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Submission' }
  /admin/plugins/{pluginId}/revoke:
    parameters:
      - name: pluginId
        in: path
        required: true
        schema: { type: string, format: ulid }
    post:
      tags: [plugin-lifecycle]
      operationId: revokePlugin
      summary: Platform-admin kill-switch (revokes all installations across tenants)
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '202':
          description: Revocation in progress; propagation ≤ 30s p99
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: plugin-app-store
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    EcosystemBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DeveloperBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plugin:
      type: object
      required: [id, slug, display_name, current_version, declared_capabilities, vetting_badge, pricing_model, publisher_id]
      properties:
        id: { type: string, format: ulid }
        slug: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        display_name: { type: string }
        description: { type: string }
        current_version: { type: string, pattern: '^\\d+\\.\\d+\\.\\d+$' }
        declared_capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        declared_data_classes:
          type: array
          items: { type: string }
        trust_verdict:
          type: string
          enum: [reviewed, verified, attested, pack_bound]
        vetted_at: { type: string, format: date-time }
        pricing_model:
          type: string
          enum: [free, one_time, recurring]
        price_usd: { type: number, format: decimal }
        publisher_id: { type: string, format: ulid }
        install_count: { type: integer }
        rating_avg: { type: number, minimum: 0, maximum: 5 }
        rating_count: { type: integer }
    PluginPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Plugin' }
        next_cursor: { type: string, nullable: true }
    PluginSearchResults:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/Plugin' }
        total: { type: integer }
    Capability:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope: { type: string, enum: [read, write, admin] }
        data_classes:
          type: array
          items: { type: string }
        rate_limit_override: { type: integer, nullable: true }
    Installation:
      type: object
      required: [id, tenant_id, plugin_id, version, granted_capabilities, status, installed_at]
      properties:
        id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        version: { type: string }
        granted_capabilities:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, suspended, uninstalled, revoked]
        installed_at: { type: string, format: date-time }
        config:
          type: object
          additionalProperties: true
    InstallRequest:
      type: object
      required: [plugin_id, version, granted_capabilities]
      properties:
        plugin_id: { type: string, format: ulid }
        version: { type: string }
        granted_capabilities:
          type: array
          items: { type: string }
        config:
          type: object
          additionalProperties: true
    Submission:
      type: object
      required: [id, plugin_id, version, state, submitted_at]
      properties:
        id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        version: { type: string }
        state:
          type: string
          enum: [submitted, vetting, approved, rejected, withdrawn]
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: object, nullable: true }
    SubmitRequest:
      type: object
      required: [plugin_id, version, manifest_url, artifact_url, signature_url]
      properties:
        plugin_id: { type: string, format: ulid }
        version: { type: string, pattern: '^\\d+\\.\\d+\\.\\d+$' }
        manifest_url: { type: string, format: uri }
        artifact_url: { type: string, format: uri }
        signature_url: { type: string, format: uri }
    VettingStageEvent:
      type: object
      required: [submission_id, stage, status, occurred_at]
      properties:
        submission_id: { type: string, format: ulid }
        stage:
          type: string
          enum: [signature_verification, vulnerability_scan, sandbox_isolation_validation, capability_scope_validation, data_use_boundary_check, accessibility_conformance, ai_act_classification, performance_budget]
        status:
          type: string
          enum: [pending, running, passed, failed]
        rejection_reason: { type: object, nullable: true }
        occurred_at: { type: string, format: date-time }
    PluginActionEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, action, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        action: { type: string }
        data_classes_touched:
          type: array
          items: { type: string }
        occurred_at: { type: string, format: date-time }
