# Canonical-base: specs/contracts/openapi-3-2-canonical-envelope.yaml (SWEEP-I Slice 3 per ADR-0064)
# Version: OpenAPI 3.2.0 — current latest per spec.openapis.org as of 2026-05-18.
openapi: 3.2.0
info:
  title: Oyatie Developer SDK API
  version: 1.0.0
  description: |
    REST surface for third-party developers: onboarding + signing-key issuance + plugin submission +
    sandbox + payout + tax-form. Stripe-Connect-parity developer-facing surface.
servers:
  - url: https://developer-api.oyatie.com/v1
    description: Production
tags:
  - name: developer-onboarding
  - name: signing-key-issuance
  - name: api-contracts-registry
  - name: sdk-codegen
  - name: sandbox-provisioner
  - name: dev-portal
  - name: payout
  - name: tax-form
paths:
  /developers:
    post:
      tags: [developer-onboarding]
      operationId: signupDeveloper
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeveloperSignupRequest' }
      responses:
        '201':
          description: Developer created (pending KYC)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Developer' }
  /developers/{developerId}/kyc/id-document:
    parameters:
      - { name: developerId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      tags: [developer-onboarding]
      operationId: submitIdDocument
      security: [{ DeveloperBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_type, document_image]
              properties:
                document_type: { type: string, enum: [passport, drivers_license, national_id] }
                document_image: { type: string, format: binary }
      responses:
        '202':
          description: ID document received; verification in progress
  /developers/{developerId}/kyc/liveness:
    parameters:
      - { name: developerId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      tags: [developer-onboarding]
      operationId: submitLivenessProof
      security: [{ DeveloperBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [liveness_video]
              properties:
                liveness_video: { type: string, format: binary }
      responses:
        '202':
          description: Liveness proof received
  /developers/{developerId}/bank-account:
    parameters:
      - { name: developerId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      tags: [developer-onboarding]
      operationId: addBankAccount
      security: [{ DeveloperBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountRequest' }
      responses:
        '202':
          description: Micro-payment verification initiated
  /developers/{developerId}/signing-keys:
    parameters:
      - { name: developerId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      tags: [signing-key-issuance]
      operationId: issueSigningKey
      security: [{ DeveloperBearer: [] }]
      responses:
        '201':
          description: Signing key issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKey' }
    get:
      tags: [signing-key-issuance]
      operationId: listSigningKeys
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Active + rotated keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SigningKey' }
  /developers/{developerId}/signing-keys/{keyId}:
    parameters:
      - { name: developerId, in: path, required: true, schema: { type: string, format: ulid } }
      - { name: keyId, in: path, required: true, schema: { type: string, format: ulid } }
    delete:
      tags: [signing-key-issuance]
      operationId: revokeSigningKey
      security: [{ DeveloperBearer: [] }]
      responses:
        '204':
          description: Revoked
  /sandbox:
    post:
      tags: [sandbox-provisioner]
      operationId: provisionSandbox
      security: [{ DeveloperBearer: [] }]
      responses:
        '201':
          description: Sandbox tenant provisioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTenant' }
  /sandbox/reset:
    post:
      tags: [sandbox-provisioner]
      operationId: resetSandbox
      security: [{ DeveloperBearer: [] }]
      responses:
        '202':
          description: Reset initiated; complete ≤ 30s p99
  /sdk/families:
    get:
      tags: [sdk-codegen]
      operationId: listSdkFamilies
      responses:
        '200':
          description: Available SDK families + versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SdkFamily' }
  /sdk/families/{family}/{version}/download:
    parameters:
      - { name: family, in: path, required: true, schema: { type: string, enum: [ts, rust, swift, kotlin, csharp, python] } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      tags: [sdk-codegen]
      operationId: downloadSdk
      responses:
        '200':
          description: SDK package tarball
          content:
            application/gzip:
              schema: { type: string, format: binary }
  /payout/balance:
    get:
      tags: [payout]
      operationId: getPayoutBalance
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Pending + cleared balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBalance' }
  /payout/ledger:
    get:
      tags: [payout]
      operationId: streamPayoutLedger
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Streaming ledger entries (NDJSON)
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/PayoutLedgerEntry' }
            application/jsonl:
              schema: { $ref: '#/components/schemas/PayoutLedgerEntry' }
  /tax-forms/{year}:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer } }
    get:
      tags: [tax-form]
      operationId: downloadTaxForm
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Tax form PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /submissions:
    post:
      tags: [dev-portal]
      operationId: submitPluginVersion
      summary: Submit a plugin version (proxied to plugin-app-store)
      security: [{ DeveloperBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '202':
          description: Submission accepted
  /submissions/{submissionId}/status:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      tags: [dev-portal]
      operationId: streamSubmissionStatus
      security: [{ DeveloperBearer: [] }]
      responses:
        '200':
          description: Vetting stage stream (SSE)
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/VettingStageEvent' }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: developer-sdk
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    DeveloperBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Developer:
      type: object
      required: [id, email, legal_name, kyc_state, created_at]
      properties:
        id: { type: string, format: ulid }
        email: { type: string, format: email }
        legal_name: { type: string }
        company_name: { type: string }
        country: { type: string }
        regulatory_pack: { type: string }
        kyc_state: { type: string, enum: [pending, id_collecting, liveness_checking, sanctions_screening, approved, rejected] }
        created_at: { type: string, format: date-time }
    DeveloperSignupRequest:
      type: object
      required: [email, legal_name, country]
      properties:
        email: { type: string, format: email }
        legal_name: { type: string }
        company_name: { type: string }
        country: { type: string }
        regulatory_pack: { type: string }
    BankAccountRequest:
      type: object
      required: [rail, account_holder_name]
      properties:
        rail: { type: string, enum: [ach, sepa, kftc, fedwire] }
        account_holder_name: { type: string }
        routing_number: { type: string }
        account_number: { type: string }
        iban: { type: string }
        bic: { type: string }
        kftc_bank_code: { type: string }
    SigningKey:
      type: object
      required: [id, public_key, created_at, expires_at, status]
      properties:
        id: { type: string, format: ulid }
        public_key: { type: string }
        algorithm: { type: string, default: ed25519 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, rotated, revoked] }
    SandboxTenant:
      type: object
      required: [id, developer_id, status, provisioned_at]
      properties:
        id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        status: { type: string, enum: [provisioning, ready, resetting] }
        provisioned_at: { type: string, format: date-time }
        endpoint: { type: string, format: uri }
    SdkFamily:
      type: object
      required: [family, latest_version, available_versions]
      properties:
        family: { type: string, enum: [ts, rust, swift, kotlin, csharp, python] }
        latest_version: { type: string }
        available_versions:
          type: array
          items: { type: string }
        download_base_url: { type: string, format: uri }
    PayoutBalance:
      type: object
      required: [pending_minor_units, cleared_minor_units, currency]
      properties:
        pending_minor_units: { type: string }
        cleared_minor_units: { type: string }
        currency: { type: string }
    PayoutLedgerEntry:
      type: object
      required: [id, developer_id, amount_minor_units, currency, kind, occurred_at]
      properties:
        id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        amount_minor_units: { type: string }
        currency: { type: string }
        kind: { type: string, enum: [revenue_share, payout_settled, payout_deferred, payout_failed, adjustment] }
        occurred_at: { type: string, format: date-time }
    SubmitRequest:
      type: object
      required: [plugin_id, version, manifest_url, artifact_url, signature_url]
      properties:
        plugin_id: { type: string, format: ulid }
        version: { type: string }
        manifest_url: { type: string, format: uri }
        artifact_url: { type: string, format: uri }
        signature_url: { type: string, format: uri }
    VettingStageEvent:
      type: object
      required: [submission_id, stage, status, occurred_at]
      properties:
        submission_id: { type: string, format: ulid }
        stage: { type: string }
        status: { type: string }
        rejection_reason: { type: object, nullable: true }
        occurred_at: { type: string, format: date-time }
