# Canonical-base: specs/contracts/asyncapi-3-1-canonical-envelope.yaml (SWEEP-I Slice 3 per ADR-0064)
# Version: AsyncAPI 3.1.0 — released 2026-01-31.
asyncapi: 3.1.0
info:
  title: Oyatie Developer SDK Events
  version: 1.0.0
servers:
  workflow-engine-event-bus:
    host: workflow-engine.oyatie.internal:9092
    protocol: kafka
channels:
  developer-onboarding-events:
    address: oya.developer-sdk.onboarding
    messages:
      developerOnboarded: { $ref: '#/components/messages/DeveloperOnboarded' }
      developerKycPassed: { $ref: '#/components/messages/DeveloperKycPassed' }
      developerKycRejected: { $ref: '#/components/messages/DeveloperKycRejected' }
  signing-key-events:
    address: oya.developer-sdk.signing-key
    messages:
      signingKeyIssued: { $ref: '#/components/messages/SigningKeyIssued' }
      signingKeyRevoked: { $ref: '#/components/messages/SigningKeyRevoked' }
  sandbox-events:
    address: oya.developer-sdk.sandbox
    messages:
      sandboxProvisioned: { $ref: '#/components/messages/SandboxProvisioned' }
      sandboxReset: { $ref: '#/components/messages/SandboxReset' }
  codegen-events:
    address: oya.developer-sdk.codegen
    messages:
      sdkCodegenEmitted: { $ref: '#/components/messages/SdkCodegenEmitted' }
  payout-events:
    address: oya.developer-sdk.payout
    messages:
      payoutSettled: { $ref: '#/components/messages/PayoutSettled' }
      payoutDeferred: { $ref: '#/components/messages/PayoutDeferred' }
  tax-form-events:
    address: oya.developer-sdk.tax-form
    messages:
      taxFormEmitted: { $ref: '#/components/messages/TaxFormEmitted' }
operations:
  emitDeveloperOnboarding:
    action: send
    channel: { $ref: '#/channels/developer-onboarding-events' }
  emitSigningKey:
    action: send
    channel: { $ref: '#/channels/signing-key-events' }
  emitSandbox:
    action: send
    channel: { $ref: '#/channels/sandbox-events' }
  emitCodegen:
    action: send
    channel: { $ref: '#/channels/codegen-events' }
  emitPayout:
    action: send
    channel: { $ref: '#/channels/payout-events' }
  emitTaxForm:
    action: send
    channel: { $ref: '#/channels/tax-form-events' }
components:
  messages:
    DeveloperOnboarded:
      payload: { $ref: '#/components/schemas/DeveloperEvent' }
    DeveloperKycPassed:
      payload: { $ref: '#/components/schemas/DeveloperEvent' }
    DeveloperKycRejected:
      payload: { $ref: '#/components/schemas/DeveloperKycRejectedEvent' }
    SigningKeyIssued:
      payload: { $ref: '#/components/schemas/SigningKeyEvent' }
    SigningKeyRevoked:
      payload: { $ref: '#/components/schemas/SigningKeyEvent' }
    SandboxProvisioned:
      payload: { $ref: '#/components/schemas/SandboxEvent' }
    SandboxReset:
      payload: { $ref: '#/components/schemas/SandboxEvent' }
    SdkCodegenEmitted:
      payload: { $ref: '#/components/schemas/SdkCodegenEvent' }
    PayoutSettled:
      payload: { $ref: '#/components/schemas/PayoutEvent' }
    PayoutDeferred:
      payload: { $ref: '#/components/schemas/PayoutEvent' }
    TaxFormEmitted:
      payload: { $ref: '#/components/schemas/TaxFormEvent' }
  schemas:
    DeveloperEvent:
      type: object
      required: [event_id, developer_id, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        occurred_at: { type: string, format: date-time }
    DeveloperKycRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/DeveloperEvent'
        - type: object
          required: [rejection_reason]
          properties:
            rejection_reason: { type: string }
    SigningKeyEvent:
      type: object
      required: [event_id, developer_id, key_id, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        key_id: { type: string, format: ulid }
        public_key: { type: string }
        occurred_at: { type: string, format: date-time }
    SandboxEvent:
      type: object
      required: [event_id, developer_id, sandbox_tenant_id, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        sandbox_tenant_id: { type: string, format: ulid }
        occurred_at: { type: string, format: date-time }
    SdkCodegenEvent:
      type: object
      required: [event_id, family, version, openapi_version, asyncapi_version, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        family: { type: string, enum: [ts, rust, swift, kotlin, csharp, python] }
        version: { type: string }
        openapi_version: { type: string, default: "3.2.0" }
        asyncapi_version: { type: string, default: "3.1.0" }
        occurred_at: { type: string, format: date-time }
    PayoutEvent:
      type: object
      required: [event_id, developer_id, amount_minor_units, currency, rail, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        amount_minor_units: { type: string }
        currency: { type: string }
        rail: { type: string, enum: [ach, sepa, kftc, fedwire] }
        occurred_at: { type: string, format: date-time }
    TaxFormEvent:
      type: object
      required: [event_id, developer_id, form_kind, tax_year, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        developer_id: { type: string, format: ulid }
        form_kind: { type: string, enum: [1099_misc_us, vat_moss_eu, vat_kr] }
        tax_year: { type: integer }
        occurred_at: { type: string, format: date-time }
