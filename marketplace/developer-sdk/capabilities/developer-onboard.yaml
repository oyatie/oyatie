# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:developer-sdk:developer-onboard:v1
name: developer-onboard
namespace: developer-sdk
display_name: Developer Onboard (T2 — explicit developer consent)
description: |
  T2 capability: third-party developer signs up; KYC + AML + bank-account verification; issued signing keys + sandbox tenant.
owner_team: axis-ecosystem + council-security
maturity: incubating
created_at: 2026-05-18
related_adrs: [ADR-0007, ADR-0022, ADR-0131, ADR-0213]
related_specs: [/specs/microservices/developer-sdk.json]
related_artifacts:
  - microservices/developer-sdk/PRD.md
  - marketplace/developer-sdk/policy/

autonomy_tier: T2

inputs:
  - name: email
    type: string
    required: true
  - name: legal_name
    type: string
    required: true
  - name: country
    type: string
    required: true

outputs:
  - name: developer_id
    type: string

data_classes_touched:
  - PII_IDENTIFYING
  - PII_FINANCIAL

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-financial
  - pack-us-public-sector

risk_class: limited

evidence_topic: oya.developer-sdk.capability.developer_onboard.emitted

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001

cedar_policy_fragments:
  - microservices/developer-sdk/policy/tenant-scope.cedar

eval_set:
  canonical_inputs_path: microservices/developer-sdk/capabilities/eval/developer-onboard-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: structured-output-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
