# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:developer-sdk:developer-payout-settle:v1
name: developer-payout-settle
namespace: developer-sdk
display_name: Developer Payout Settle (T3 — financial; dual-signature > $10k)
description: |
  T3 capability: daily payout batch settling per-developer revenue-share balance to bank account via ACH/SEPA/KFTC/FedWire.
owner_team: axis-ecosystem + council-security
maturity: incubating
created_at: 2026-05-18
related_adrs: [ADR-0007, ADR-0022, ADR-0131, ADR-0213]
related_specs: [/specs/microservices/developer-sdk.json]
related_artifacts:
  - microservices/developer-sdk/PRD.md
  - marketplace/developer-sdk/policy/

autonomy_tier: T3

inputs:
  - name: developer_id
    type: string
    required: true
  - name: amount_minor_units
    type: string
    required: true
  - name: rail
    type: enum:ach|sepa|kftc|fedwire
    required: true

outputs:
  - name: settlement_id
    type: string

data_classes_touched:
  - PII_FINANCIAL
  - AUDIT_RECORD

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-financial
  - pack-us-public-sector

risk_class: high

evidence_topic: oya.developer-sdk.capability.developer_payout_settle.emitted

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001

cedar_policy_fragments:
  - microservices/developer-sdk/policy/tenant-scope.cedar

eval_set:
  canonical_inputs_path: microservices/developer-sdk/capabilities/eval/developer-payout-settle-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: structured-output-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
