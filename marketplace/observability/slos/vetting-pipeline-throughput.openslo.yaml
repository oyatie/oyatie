# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: plugin-app-store-vetting-pipeline-throughput
  displayName: "plugin-app-store-vetting-pipeline-throughput"
  labels:
    microservice: plugin-app-store
    bounded_context: vetting-pipeline
    tier: external-facing
    plane: data
spec:
  service: plugin-app-store-vetting-pipeline-throughput
  description: |
    95% of submissions decided within 1h window
  indicator:
    metadata:
      name: plugin-app-store-vetting-pipeline-throughput-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(plugin_app_store_vetting_decision_total{outcome=~"approved|rejected"}[1h])) / sum(rate(plugin_app_store_vetting_submitted_total[1h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(plugin_app_store_vetting_decision_total{outcome=~"approved|rejected"}[1h])) / sum(rate(plugin_app_store_vetting_submitted_total[1h]))'
  objectives:
    - target: 0.95
      displayName: "0.95 target"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-vetting-pipeline-throughput-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-vetting-pipeline-throughput-slow-burn-6h
      spec:
        description: Slow-burn 6h burn-rate 6x → ticket (Sev-3)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-tickle
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 30m
