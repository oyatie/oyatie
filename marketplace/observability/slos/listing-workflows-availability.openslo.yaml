apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-listing-workflows-availability
  displayName: Marketplace Workflow Listing Availability
  labels:
    service: marketplace
    category: workflows
    adr: ADR-0249
spec:
  description: Workflow listing publish + entitlement-import availability per tenant_class
  service: marketplace
  indicator:
    metadata:
      name: marketplace-listing-workflows-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_workflows_listing_success_total{tenant_class=~"paid|demo_trial"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_workflows_listing_total{tenant_class=~"paid|demo_trial"}[5m]))
  objectives:
    - displayName: Paid tenants (contractual)
      target: 0.9995
      tenant_class_filter: paid
    - displayName: Demo trial (best-effort)
      target: 0.99
      tenant_class_filter: demo_trial
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.listing-workflows-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
