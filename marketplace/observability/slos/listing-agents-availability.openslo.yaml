apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-listing-agents-availability
  displayName: Marketplace Agent Listing Availability
  labels:
    service: marketplace
    category: agents
    adr: ADR-0249
    eu_ai_act_aware: "true"
spec:
  description: Agent listing publish + entitlement-register availability per tenant_class with EU AI Act risk classification
  service: marketplace
  indicator:
    metadata:
      name: marketplace-listing-agents-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_agents_listing_success_total{tenant_class="paid"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_agents_listing_total{tenant_class="paid"}[5m]))
  objectives:
    - displayName: Paid tenants (contractual)
      target: 0.9995
      tenant_class_filter: paid
    - displayName: Demo trial supervised-only
      target: 0.99
      tenant_class_filter: demo_trial
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.listing-agents-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
