apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-listing-apps-availability
  displayName: Marketplace App Listing Availability
  labels:
    service: marketplace
    category: apps
    adr: ADR-0249
spec:
  description: App listing publish + entitlement-provision availability per tenant_class
  service: marketplace
  indicator:
    metadata:
      name: marketplace-listing-apps-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_apps_listing_success_total{tenant_class="paid"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_apps_listing_total{tenant_class="paid"}[5m]))
  objectives:
    - displayName: Paid tenants (contractual)
      target: 0.9995
      tenant_class_filter: paid
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.listing-apps-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
