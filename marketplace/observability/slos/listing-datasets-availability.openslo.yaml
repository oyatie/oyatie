apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-listing-datasets-availability
  displayName: Marketplace Dataset Listing Availability
  labels:
    service: marketplace
    category: datasets
    adr: ADR-0249
spec:
  description: Dataset listing publish + entitlement-grant availability per tenant_class with sensitivity-class gates
  service: marketplace
  indicator:
    metadata:
      name: marketplace-listing-datasets-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_datasets_listing_success_total{tenant_class="paid"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_category_datasets_listing_total{tenant_class="paid"}[5m]))
  objectives:
    - displayName: Paid tenants (contractual)
      target: 0.9995
      tenant_class_filter: paid
    - displayName: Demo trial public-only
      target: 0.99
      tenant_class_filter: demo_trial
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.listing-datasets-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
