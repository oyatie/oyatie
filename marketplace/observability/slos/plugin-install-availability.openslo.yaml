# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: plugin-app-store-plugin-install-availability
  displayName: "plugin-app-store-plugin-install-availability"
  labels:
    microservice: plugin-app-store
    bounded_context: plugin-install
    tier: external-facing
    plane: data
spec:
  service: plugin-app-store-plugin-install-availability
  description: |
    99.95% successful installs
  indicator:
    metadata:
      name: plugin-app-store-plugin-install-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(plugin_app_store_install_outcome_total{outcome="installed"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(plugin_app_store_install_outcome_total{outcome="installed"}[5m]))'
  objectives:
    - target: 0.9995
      displayName: "0.9995 target"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-plugin-install-availability-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-plugin-install-availability-slow-burn-6h
      spec:
        description: Slow-burn 6h burn-rate 6x → ticket (Sev-3)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-tickle
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 30m
