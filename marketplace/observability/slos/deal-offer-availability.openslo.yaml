apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-deal-offer-availability
  displayName: Marketplace Deal Offer Availability
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for deal-offer-availability using route=/marketplace/deal-sets
  service: marketplace
  indicator:
    metadata:
      name: marketplace-deal-offer-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_deal_accept_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_deal_accept_total[5m]))
  objectives:
    - displayName: Deal Offer Availability
      target: 0.9995
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.deal-offer-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
