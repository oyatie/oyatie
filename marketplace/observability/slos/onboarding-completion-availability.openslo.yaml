# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: developer-sdk-onboarding-completion-availability
  displayName: "developer-sdk-onboarding-completion-availability"
  labels:
    microservice: developer-sdk
    bounded_context: developer-onboarding
    tier: external-facing
    plane: data
spec:
  service: developer-sdk-onboarding-completion-availability
  description: |
    99.5% onboarding completion
  indicator:
    metadata:
      name: developer-sdk-onboarding-completion-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(developer_sdk_onboarding_total{outcome="completed"}[1h])) / sum(rate(developer_sdk_onboarding_total{outcome=~"completed|failed|abandoned"}[1h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(developer_sdk_onboarding_total{outcome="completed"}[1h])) / sum(rate(developer_sdk_onboarding_total{outcome=~"completed|failed|abandoned"}[1h]))'
  objectives:
    - target: 0.995
      displayName: "0.995 target"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: developer-sdk-onboarding-completion-availability-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
    - kind: AlertPolicy
      metadata:
        name: developer-sdk-onboarding-completion-availability-slow-burn-6h
      spec:
        description: Slow-burn 6h burn-rate 6x → ticket (Sev-3)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-tickle
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 30m
