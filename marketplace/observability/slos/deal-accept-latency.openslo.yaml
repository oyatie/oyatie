apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-deal-accept-latency
  displayName: Marketplace Deal Accept Latency
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for deal-accept-latency using route=/marketplace/deal-sets/accept
  service: marketplace
  indicator:
    metadata:
      name: marketplace-deal-accept-latency-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_escrow_reserve_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_escrow_reserve_total[5m]))
  objectives:
    - displayName: Deal Accept Latency
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.deal-accept-latency"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
