apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-revenue-share-clawback-accuracy
  displayName: Marketplace Revenue Share Clawback Accuracy
  labels:
    service: marketplace
    adr: ADR-0329
spec:
  description: Compensating ledger entries must net-to-zero against original accruals (IP-034)
  service: marketplace
  indicator:
    metadata:
      name: marketplace-revenue-share-clawback-accuracy-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_revenue_share_clawback_nets_to_zero_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_revenue_share_clawback_total[5m]))
  objectives:
    - displayName: Clawback Accuracy
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.revenue-share-clawback-accuracy"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
