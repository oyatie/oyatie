apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-settlement-replay-fidelity
  displayName: Marketplace Settlement Replay Fidelity
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for settlement-replay-fidelity using worker=settlement-replay
  service: marketplace
  indicator:
    metadata:
      name: marketplace-settlement-replay-fidelity-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_revenue_share_accrue_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_revenue_share_accrue_total[5m]))
  objectives:
    - displayName: Settlement Replay Fidelity
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.settlement-replay-fidelity"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
