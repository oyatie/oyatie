# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: plugin-app-store-subscription-billing-correctness
  displayName: "plugin-app-store-subscription-billing-correctness"
  labels:
    microservice: plugin-app-store
    bounded_context: subscription-billing
    tier: external-facing
    plane: data
spec:
  service: plugin-app-store-subscription-billing-correctness
  description: |
    100% byte-equal billing aggregation
  indicator:
    metadata:
      name: plugin-app-store-subscription-billing-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: '1 - (sum(rate(plugin_app_store_billing_aggregation_mismatch_total[24h])) / sum(rate(plugin_app_store_billing_aggregation_total[24h])))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: '1 - (sum(rate(plugin_app_store_billing_aggregation_mismatch_total[24h])) / sum(rate(plugin_app_store_billing_aggregation_total[24h])))'
  objectives:
    - target: 1.0
      displayName: "1.0 target"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-subscription-billing-correctness-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
    - kind: AlertPolicy
      metadata:
        name: plugin-app-store-subscription-billing-correctness-slow-burn-6h
      spec:
        description: Slow-burn 6h burn-rate 6x → ticket (Sev-3)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-tickle
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 30m
