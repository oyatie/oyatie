apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-escrow-reserve-availability
  displayName: Marketplace Escrow Reserve Availability
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for escrow-reserve-availability using route=/marketplace/escrow/holds
  service: marketplace
  indicator:
    metadata:
      name: marketplace-escrow-reserve-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_escrow_release_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_escrow_release_total[5m]))
  objectives:
    - displayName: Escrow Reserve Availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.escrow-reserve-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
