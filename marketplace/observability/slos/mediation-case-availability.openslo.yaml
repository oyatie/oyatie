apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketplace-mediation-case-availability
  displayName: Marketplace Mediation Case Availability
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for mediation-case-availability using route=/marketplace/disputes
  service: marketplace
  indicator:
    metadata:
      name: marketplace-mediation-case-availability-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_deal_offer_create_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(marketplace_deal_offer_create_total[5m]))
  objectives:
    - displayName: Mediation Case Availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.mediation-case-availability"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, cli, rest, grpc, worker, sdk, api"
