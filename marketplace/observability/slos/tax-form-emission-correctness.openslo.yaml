# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: developer-sdk-tax-form-emission-correctness
  displayName: "developer-sdk-tax-form-emission-correctness"
  labels:
    microservice: developer-sdk
    bounded_context: tax-form
    tier: external-facing
    plane: data
spec:
  service: developer-sdk-tax-form-emission-correctness
  description: |
    100% byte-equal tax-form emission
  indicator:
    metadata:
      name: developer-sdk-tax-form-emission-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: '1 - (sum(rate(developer_sdk_tax_form_emission_mismatch_total[7d])) / sum(rate(developer_sdk_tax_form_emission_total[7d])))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: '1 - (sum(rate(developer_sdk_tax_form_emission_mismatch_total[7d])) / sum(rate(developer_sdk_tax_form_emission_total[7d])))'
  objectives:
    - target: 1.0
      displayName: "1.0 target"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: developer-sdk-tax-form-emission-correctness-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
    - kind: AlertPolicy
      metadata:
        name: developer-sdk-tax-form-emission-correctness-slow-burn-6h
      spec:
        description: Slow-burn 6h burn-rate 6x → ticket (Sev-3)
        notificationTargets:
          - target: grafana-oncall:axis-ecosystem-tickle
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 30m
