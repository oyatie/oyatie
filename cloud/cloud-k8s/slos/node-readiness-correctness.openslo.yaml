# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cloud-k8s-node-readiness-correctness
  displayName: "cloud-k8s: node readiness correctness 99.9%"
  labels:
    microservice: cloud-k8s
    bounded_context: node-lifecycle
    sli_class: correctness
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-k8s + ops-platform
    pack_scope: all
spec:
  service: cloud-k8s
  description: |
    Node-readiness correctness SLO. A node is "good" when kubelet reports
    NodeReady=True AND all critical DaemonSets (cilium-agent, node-exporter,
    fluent-bit) are Running. Per ADR-0121 node-lifecycle stack.
  indicator:
    metadata:
      name: cloud-k8s-node-ready-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(kube_node_status_condition{condition="Ready",status="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(kube_node_status_condition{condition="Ready"}[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling node readiness ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
