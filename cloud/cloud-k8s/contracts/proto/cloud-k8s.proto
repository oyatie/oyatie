// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// oya-cloud-k8s — gRPC contract
// Internal-only service RPC projection; contracts/openapi/cloud-k8s.yaml remains the public client contract.
// Per ADR-0121 + ADR-0131.

syntax = "proto3";

package oya.cloud_k8s.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: ClusterBootstrap
// =========================================================================
//
// Authn: SPIFFE mTLS workload identity with TLS 1.3; user-token authentication belongs to REST/OpenAPI.
// Authz: Cedar policy evaluation server-side; same fragments as REST.

service ClusterBootstrap {
  rpc GetCluster(GetClusterRequest) returns (Cluster);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc BootstrapCluster(BootstrapClusterRequest) returns (BootstrapClusterResponse);
  rpc UpgradeCluster(UpgradeClusterRequest) returns (UpgradeClusterResponse);
  rpc SnapshotEtcd(SnapshotEtcdRequest) returns (SnapshotEtcdResponse);
  rpc GetBootstrapEvidence(GetBootstrapEvidenceRequest) returns (BootstrapEvidence);
  rpc StreamClusterEvents(StreamClusterEventsRequest) returns (stream ClusterEvent);
}

// =========================================================================
// Service: NodeLifecycle
// =========================================================================

service NodeLifecycle {
  rpc GetNode(GetNodeRequest) returns (Node);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc StreamNodeEvents(StreamNodeEventsRequest) returns (stream NodeEvent);
}

// =========================================================================
// Service: NetworkPolicyControl
// =========================================================================

service NetworkPolicyControl {
  rpc ListNetworkPolicies(ListNetworkPoliciesRequest) returns (ListNetworkPoliciesResponse);
  rpc ApplyNetworkPolicy(ApplyNetworkPolicyRequest) returns (ApplyNetworkPolicyResponse);
  rpc ApplyAuthorizationPolicy(ApplyAuthorizationPolicyRequest) returns (ApplyAuthorizationPolicyResponse);
  rpc StreamPolicyEvents(StreamPolicyEventsRequest) returns (stream PolicyEvent);
}

// =========================================================================
// Common types
// =========================================================================

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

enum ClusterStatus {
  CLUSTER_STATUS_UNSPECIFIED = 0;
  CLUSTER_STATUS_BOOTSTRAPPING = 1;
  CLUSTER_STATUS_READY = 2;
  CLUSTER_STATUS_UPGRADING = 3;
  CLUSTER_STATUS_DEGRADED = 4;
  CLUSTER_STATUS_FAILED = 5;
}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_CONTROL_PLANE = 1;
  NODE_ROLE_WORKER = 2;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_PENDING = 1;
  NODE_STATUS_READY = 2;
  NODE_STATUS_CORDONED = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_NOT_READY = 5;
  NODE_STATUS_REMOVED = 6;
}

enum PolicyKind {
  POLICY_KIND_UNSPECIFIED = 0;
  POLICY_KIND_NETWORK_POLICY = 1;
  POLICY_KIND_AUTHORIZATION_POLICY = 2;
}

message Cluster {
  string cluster_id = 1;
  Pack pack = 2;
  string region = 3;
  string version = 4;
  uint32 control_plane_node_count = 5;
  uint32 worker_node_count = 6;
  ClusterStatus status = 7;
  google.protobuf.Timestamp bootstrapped_at = 8;
}

message Node {
  string node_id = 1;
  string cluster_id = 2;
  NodeRole role = 3;
  string az = 4;
  string kernel_version = 5;
  string containerd_version = 6;
  string kubelet_version = 7;
  NodeStatus status = 8;
  google.protobuf.Timestamp joined_at = 9;
}

message BootstrapEvidence {
  string cluster_id = 1;
  string kubeadm_version = 2;
  string evidence_sha = 3;
  string signature = 4;
  google.protobuf.Timestamp bootstrapped_at = 5;
}

message NetworkPolicy {
  string namespace = 1;
  string name = 2;
  bytes spec_yaml = 3;
  PolicyKind kind = 4;
}

message ClusterEvent {
  string cluster_id = 1;
  string event_kind = 2;
  google.protobuf.Timestamp ts = 3;
  bytes payload = 4;
  string signature = 5;
}

message NodeEvent {
  string cluster_id = 1;
  string node_id = 2;
  string event_kind = 3;
  google.protobuf.Timestamp ts = 4;
  bytes payload = 5;
  string signature = 6;
}

message PolicyEvent {
  string cluster_id = 1;
  string namespace = 2;
  string policy_name = 3;
  string event_kind = 4;
  google.protobuf.Timestamp ts = 5;
  string signature = 6;
}

// =========================================================================
// Request / response messages
// =========================================================================

message GetClusterRequest { string cluster_id = 1; }
message ListClustersRequest { Pack pack = 1; }
message ListClustersResponse { repeated Cluster clusters = 1; }

message BootstrapClusterRequest {
  Pack pack = 1;
  string region = 2;
  string kubeadm_version = 3;
  string approver = 4;  // 2-person rule
  string reason = 5;
}
message BootstrapClusterResponse {
  string changeset_id = 1;
  google.protobuf.Timestamp estimated_completion = 2;
}

message UpgradeClusterRequest {
  string cluster_id = 1;
  string target_version = 2;
  string approver = 3;
  string reason = 4;
}
message UpgradeClusterResponse {
  string changeset_id = 1;
  google.protobuf.Timestamp estimated_completion = 2;
}

message SnapshotEtcdRequest { string cluster_id = 1; }
message SnapshotEtcdResponse { string snapshot_id = 1; }

message GetBootstrapEvidenceRequest { string cluster_id = 1; }
message StreamClusterEventsRequest {
  string cluster_id = 1;
  google.protobuf.Timestamp since = 2;
}

message GetNodeRequest {
  string cluster_id = 1;
  string node_id = 2;
}
message ListNodesRequest { string cluster_id = 1; }
message ListNodesResponse { repeated Node nodes = 1; }

message AddNodeRequest {
  string cluster_id = 1;
  string node_id = 2;
  NodeRole role = 3;
  string az = 4;
}
message AddNodeResponse {
  string changeset_id = 1;
  google.protobuf.Timestamp estimated_completion = 2;
}

message CordonNodeRequest {
  string cluster_id = 1;
  string node_id = 2;
  string reason = 3;
}
message CordonNodeResponse { string changeset_id = 1; }

message DrainNodeRequest {
  string cluster_id = 1;
  string node_id = 2;
}
message DrainNodeResponse { string changeset_id = 1; }

message RemoveNodeRequest {
  string cluster_id = 1;
  string node_id = 2;
}
message RemoveNodeResponse { string changeset_id = 1; }

message StreamNodeEventsRequest {
  string cluster_id = 1;
  google.protobuf.Timestamp since = 2;
}

message ListNetworkPoliciesRequest {
  string cluster_id = 1;
  string namespace = 2;
}
message ListNetworkPoliciesResponse {
  repeated NetworkPolicy policies = 1;
}

message ApplyNetworkPolicyRequest {
  string cluster_id = 1;
  NetworkPolicy policy = 2;
  string derived_from_cedar_sha = 3;
}
message ApplyNetworkPolicyResponse {
  string changeset_id = 1;
}

message ApplyAuthorizationPolicyRequest {
  string cluster_id = 1;
  NetworkPolicy policy = 2;  // re-uses spec_yaml shape
  string derived_from_cedar_sha = 3;
}
message ApplyAuthorizationPolicyResponse {
  string changeset_id = 1;
}

message StreamPolicyEventsRequest {
  string cluster_id = 1;
  string namespace = 2;
  google.protobuf.Timestamp since = 3;
}
