# Canonical StorageClass: oya-valkey-hot
# Per ADR-0161. NVMe-class block storage for Valkey primary instances backing
# rate-limit (ADR-0157), session cache, queue state. Sub-millisecond IOPS.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oya-valkey-hot
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "hot"
    oyatie.io/kind: "valkey"
provisioner: PACK_OVERLAY_REQUIRED
parameters:
  PACK_OVERLAY_REQUIRED: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
