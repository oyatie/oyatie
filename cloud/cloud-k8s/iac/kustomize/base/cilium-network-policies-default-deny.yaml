apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-k8s-system-default-deny
  namespace: cloud-k8s-system
  labels:
    app.kubernetes.io/part-of: oya-cloud-k8s
    oyatie/microservice: cloud-k8s
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-k8s-system-allow-substrate-egress
  namespace: cloud-k8s-system
  labels:
    app.kubernetes.io/part-of: oya-cloud-k8s
    oyatie/microservice: cloud-k8s
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-secrets
      ports:
        - {port: 8200, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {port: 4317, protocol: TCP}
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: audit-chain
      ports:
        - {port: 9000, protocol: TCP}
