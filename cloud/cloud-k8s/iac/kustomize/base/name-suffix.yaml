nameReference:
  - kind: Secret
    version: v1
    fieldSpecs:
      - group: external-secrets.io
        version: v1
        kind: ExternalSecret
        path: spec/target/name
  - kind: ClusterSecretStore
    group: external-secrets.io
    version: v1
    fieldSpecs:
      - group: external-secrets.io
        version: v1
        kind: ExternalSecret
        path: spec/secretStoreRef/name
