apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloud-k8s-require-restricted-runtime
  labels:
    app.kubernetes.io/part-of: oya-cloud-k8s
    oyatie/microservice: cloud-k8s
    oyatie.io/admission-adapter: kyverno
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-runtime-default-seccomp
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["cloud-k8s-system"]
      validate:
        message: "cloud-k8s pods must use RuntimeDefault seccomp."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
    - name: require-non-root-cloud-k8s-pods
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["cloud-k8s-system"]
      validate:
        message: "cloud-k8s pods must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: require-explicit-service-account-token-policy
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["cloud-k8s-system"]
      validate:
        message: "cloud-k8s pods must explicitly declare automountServiceAccountToken."
        pattern:
          spec:
            automountServiceAccountToken: "?*"
