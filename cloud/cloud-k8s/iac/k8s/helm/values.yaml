microservice:
  id: cloud-k8s
  cargoPackage: oya-cloud-k8s
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-k8s

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-k8s
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-cloud-k8s-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
