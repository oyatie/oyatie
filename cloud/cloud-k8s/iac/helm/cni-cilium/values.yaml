# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
cilium:
  image:
    tag: "1.16.0"  # LTS pin per docs/standards/cloud-k8s-stack.md
  ipam:
    mode: kubernetes
  kubeProxyReplacement: strict  # Cilium replaces kube-proxy entirely
  bpf:
    masquerade: true
    hostLegacyRouting: false  # eBPF host routing
    monitorAggregation: medium
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: false  # tenant-facing Hubble UI gated via Cedar; not auto-on
    tls:
      enabled: true
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - port-distribution
        - icmp
        - http
  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: false  # leave per-pod traffic enc to Istio mTLS; node-encryption optional
  loadBalancer:
    mode: dsr  # direct server return for performance
    algorithm: maglev
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  operator:
    replicas: 2  # HA per capacity-model.md
    rollOutPods: true
  # NetworkPolicy enforcement kernel-layer (eBPF); per policy/cluster-isolation.md CI-03
  policyEnforcementMode: default
  # Default-deny NetworkPolicy installed per tenant namespace by network-policy BC usecase
  rollOutCiliumPods: true
  preflight:
    enabled: false  # set true during version upgrade
  customLabels:
    oyatie/microservice: cloud-k8s
    oyatie/bc: network-policy
