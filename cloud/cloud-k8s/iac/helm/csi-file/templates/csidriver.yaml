apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.driver.name | quote }}
  labels:
    {{- include "oyaCsi.labels" . | nindent 4 }}
spec:
  attachRequired: {{ .Values.driver.attachRequired }}
  podInfoOnMount: {{ .Values.driver.podInfoOnMount }}
  fsGroupPolicy: {{ .Values.driver.fsGroupPolicy | quote }}
  volumeLifecycleModes:
    {{- toYaml .Values.driver.volumeLifecycleModes | nindent 4 }}
  storageCapacity: {{ .Values.driver.storageCapacity }}
