[package]
name = "oya-cloud-iam-pdp-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Runnable cloud-iam policy-decision-point service (ADR-0559, G004 slice 1): composes the shared embedded Cedar PDP (libs/oya-shared-pdp-adapter-cedar) behind gRPC + REST authorization-decision endpoints with health/readiness, fail-closed boot (policy-load failure = boot refusal), structured decision-audit emission behind the kernel DecisionAuditSink port, and deny-by-default on every surface. API-only service: no CLI, declarative policy bundles are the management surface (cli_surface_policy)."
build = "build.rs"

[dependencies]
oya-cloud-iam-pdp-kernel = { path = "../oya-cloud-iam-pdp-kernel" }
oya-cloud-iam-pdp-bundle-file-adapter = { path = "../oya-cloud-iam-pdp-bundle-file-adapter" }
oya-shared-pdp-kernel = { path = "../../../../libs/oya-shared-pdp-kernel" }
oya-shared-pdp-adapter-cedar = { path = "../../../../libs/oya-shared-pdp-adapter-cedar" }
oya-shared-platform-contracts-kernel = { path = "../../../../libs/oya-shared-platform-contracts-kernel" }
oya-shared-ulid-id-kernel = { path = "../../../../libs/oya-shared-ulid-id-kernel" }

# Workload X.509-SVID caller authentication (G002 slice-1; ADR-0561): the mTLS
# PEP extracts a verified peer SVID and binds the caller's tenant from the SVID
# path (fail-closed), so the PDP no longer trusts a caller-body tenant_id. The
# SVID kernel owns the cell-rooted SpiffeId + bind_caller_tenant gate; the
# trustd adapter owns issuance/verification over the trustd CA.
oya-identity-workload-domain = { path = "../../../../oya/identity/crates/oya-identity-workload-domain" }
oya-identity-workload-svid-kernel = { path = "../../../../oya/identity/crates/oya-identity-workload-svid-kernel" }
oya-identity-workload-svid-trustd-adapter = { path = "../../../../oya/identity/crates/oya-identity-workload-svid-trustd-adapter" }
oya-cloud-os-trustd-domain = { path = "../../../../cloud/cloud-os/crates/oya-cloud-os-trustd-domain" }

# Delivered-cert-mount parsing (G002 slice-1b-iii-a; ADR-0561): MtlsContext::from_path
# parses the kubernetes.io/tls Secret PEM (tls.crt/tls.key/ca.crt) and extracts each
# CA's REAL SubjectPublicKeyInfo DER for the trust bundle. verify-aws backend (aws-lc-rs,
# NO ring — ADR-0506); matches the workspace x509-parser pin.
x509-parser = { workspace = true }

# ADR-0506 blessed crypto: entropy source for production ULID decision ids.
aws-lc-rs = "1.17.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# gRPC delivery surface — tonic 0.14 server-side (client stubs generated too,
# for the in-repo E2E suite and later PEP-pointing slices).
prost.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost.workspace = true

# mTLS transport (G002 slice-1b-ii; ADR-0561, ADR-0506): a rustls ServerConfig
# requires + verifies a client cert on both listeners, deferring leaf trust to
# the SVID verifier (custom ClientCertVerifier), so the PEP runs on a verified
# peer SVID. aws-lc-rs ONLY — NO ring (default-features off; aws-lc-rs+tls12+
# logging). tokio-rustls wraps accepted TCP for both surfaces; hyper-util drives
# the REST accept loop (axum 0.8 has no built-in rustls serve helper); tower
# layers the per-connection peer-leaf Extension onto the axum router.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-core = { version = "0.3", default-features = false }
async-stream = "0.3"

[build-dependencies]
# Proto codegen — mirrors the oya-identity-workload-rest build.rs pattern.
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# E2E: drive the live REST socket with reqwest and the live gRPC socket with
# the generated tonic client. Dev-only — NOT library dependencies.
reqwest = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { version = "0.1", default-features = false }
# Production-path closure E2E (slice-1b-iii): serialize real CA/leaf DER into the
# operator-shaped kubernetes.io/tls PEM mount the production boot parses. Dev-only.
base64 = { version = "0.22", default-features = false, features = ["std"] }

[lib]
name = "oya_cloud_iam_pdp_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-iam-pdp-app"
path = "src/main.rs"

[lints]
workspace = true
