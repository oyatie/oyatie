[package]
name = "oya-cloud-iam-pdp-bundle-file-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "File-backed PolicyBundleStore adapter for the cloud-iam PDP service (ADR-0559, G004 slice 1): loads a declarative policy-bundle JSON document from a mounted path (ConfigMap transport in K8s) with closed-schema parsing and fail-closed errors. Transitional transport — the policy-bundle CRD + operator distribution fabric replaces this adapter behind the same kernel port (ADR-0550 adapters are deliberately throwaway)."

[dependencies]
oya-cloud-iam-pdp-kernel = { path = "../oya-cloud-iam-pdp-kernel" }
oya-shared-pdp-kernel = { path = "../../../../libs/oya-shared-pdp-kernel" }
oya-shared-platform-contracts-kernel = { path = "../../../../libs/oya-shared-platform-contracts-kernel" }
serde_json = { workspace = true }

[lib]
name = "oya_cloud_iam_pdp_bundle_file_adapter"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
