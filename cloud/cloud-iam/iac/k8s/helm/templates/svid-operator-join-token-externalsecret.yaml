{{- if .Values.svidOperator.enabled }}
{{- if .Values.svidOperator.joinToken.externalSecret.enabled }}
# Declarative provisioning contract for the operator-internal cluster join token
# (GH #980). The join token gates SVID issuance and the operator binary
# fail-closes without OYA_SVID_OPERATOR_JOIN_TOKEN. This ExternalSecret replaces
# the prior undocumented "pre-provisioned by hand" assumption: the token is now
# sourced as IaC from OpenBao via the External Secrets Operator (ADR-0043),
# using the dedicated openbao-cloud-iam-svid-operator ClusterSecretStore so
# cloud-iam join-token reads do not reuse the CI-scoped OpenBao role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.svidOperator.joinToken.secretName | quote }}
  namespace: {{ .Values.svidOperator.watchedNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0043: openbao-sref
  annotations:
    oyatie.com/non-claim: "operator-internal cluster join token; gates SVID issuance only"
spec:
  refreshInterval: {{ .Values.svidOperator.joinToken.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.svidOperator.joinToken.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.svidOperator.joinToken.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ .Values.svidOperator.joinToken.secretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: {{ .Values.svidOperator.joinToken.secretKey | quote }}
      remoteRef:
        key: {{ .Values.svidOperator.joinToken.externalSecret.openbaoPath | quote }}
        property: {{ .Values.svidOperator.joinToken.externalSecret.openbaoProperty | quote }}
{{- end }}
{{- end }}
