microservice:
  id: cloud-iam
  cargoPackage: oya-cloud-iam-app
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-iam

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-iam
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-cloud-iam-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# G002 slice-1b-iii-c (ADR-0561, ADR-0510): the in-cluster SVID-delivery operator
# that PRODUCES + rotates the oya-cloud-iam-pdp-svid Secret the PDP mTLS PEP boots
# from. Roots issuance on the trustd EcdsaP256 CA via the unchanged SigningBackend
# seam (cloud-kms per-cell sealing-root swap deferred, ADR-0561 D4/D5).
svidOperator:
  enabled: true
  name: oya-cloud-iam-pdp-svid-operator
  cargoPackage: oya-cloud-iam-pdp-svid-operator
  replicaCount: 1
  # The namespace the projected oya-cloud-iam-pdp-svid Secret is written into.
  watchedNamespace: cloud-iam
  # The cell id forming the platform SVID authority
  # (spiffe://oyatie.cell-<id>/platform/cloud-iam-pdp). Release/cell automation
  # must inject the real cell id; the empty default fail-closes the binary on boot.
  cellId: ""
  ttlSecs: 3600
  rotationWindowSecs: 600
  image:
    registry: registry.oyatie.dev
    repository: oya-cloud-iam-pdp-svid-operator
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
    cosign:
      required: true
      policy: ADR-0181
  serviceAccount:
    name: oya-cloud-iam-pdp-svid-operator
    automountToken: true
    nonClaim: "operator writes only the oya-cloud-iam-pdp-svid Secret in its namespace and emits reconcile events"
  # The cluster join token gating SVID issuance (operator-internal). The binary
  # fail-closes if it is empty. GH #980: the chart now ships a declarative
  # provisioning contract instead of silently assuming a hand-provisioned Secret.
  # The deployment preflight (svid-operator-deployment.yaml) FAILS the render
  # unless exactly one provisioning path is selected: either externalSecret
  # (ESO->OpenBao, default below) or preProvisioned=true (explicit, audited
  # acknowledgement that the Secret is supplied out-of-band).
  joinToken:
    secretName: oya-cloud-iam-pdp-svid-operator-join-token
    secretKey: join-token
    # Set true ONLY to acknowledge the join-token Secret is provisioned by another
    # owned mechanism; this opts OUT of the ESO ExternalSecret below. Leaving both
    # this false AND externalSecret.enabled false fail-closes the render.
    preProvisioned: false
    # Preferred path: provision the join token from OpenBao via the External
    # Secrets Operator, using a dedicated OpenBao role/store for the cloud-iam join-token prefix.
    externalSecret:
      enabled: true
      refreshInterval: 1h
      secretStoreRef:
        name: openbao-cloud-iam-svid-operator
        kind: ClusterSecretStore
      # OpenBao KV path + property the join token is read from (KV v2 under the
      # `secret` mount; path convention mirrors cloud-k8s/.../openbao-secret-references.yaml).
      openbaoPath: cloud-iam/pdp-svid-operator/join-token
      openbaoProperty: join-token
  pdb:
    # Single-replica operator: maxUnavailable lets node drains proceed (the pod
    # reschedules) instead of wedging on minAvailable==replicaCount.
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
