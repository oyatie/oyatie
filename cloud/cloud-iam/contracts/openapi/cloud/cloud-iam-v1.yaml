openapi: 3.2.0
info:
  title: cloud-iam
  version: "1.0.0"
  summary: Cloud IAM control-plane contract for federation, roles, and STS.
  description: >-
    Service-local OpenAPI contract for the Rust-backed Cloud IAM API boundary in
    iam/ports/cloud-api. The contract exposes tenant-scoped identity provider
    lifecycle operations, role creation, and short-lived STS issuance. The
    public wire surface accepts caller identity credentials only through
    bearerAuth; the ingress adapter owns Cedar/PDP decision evidence and strips
    any caller-supplied internal authorization headers before reaching the
    Rust boundary.
  contact:
    name: axis-cloud-iam
  license:
    name: Inherited from oyatie root
servers:
  - url: https://{tenant}.cloud-iam.oyatie.com/v1
    variables:
      tenant:
        default: tenant-id
        description: Tenant subdomain per ADR-0244.
security:
  - bearerAuth: []
paths:
  /identity-providers:
    get:
      operationId: listCloudIamIdentityProviders
      summary: List tenant identity providers.
      x-oyatie-surface: cloud.iam.identity_provider.list
      x-oyatie-authorization:
        required_surface: cloud.iam.identity_provider.list
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      responses:
        '200':
          description: Identity providers visible to the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderListResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /identity-providers/{identity_provider_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityProviderId'
    post:
      operationId: createCloudIamIdentityProvider
      summary: Register a tenant SAML or OIDC identity provider.
      x-oyatie-surface: cloud.iam.identity_provider.create
      x-oyatie-authorization:
        required_surface: cloud.iam.identity_provider.create
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderCreateRequest'
      responses:
        '201': {$ref: '#/components/responses/IdentityProvider'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    put:
      operationId: updateCloudIamIdentityProvider
      summary: Replace tenant identity provider metadata.
      x-oyatie-surface: cloud.iam.identity_provider.update
      x-oyatie-authorization:
        required_surface: cloud.iam.identity_provider.update
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderUpdateRequest'
      responses:
        '200': {$ref: '#/components/responses/IdentityProvider'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    delete:
      operationId: deleteCloudIamIdentityProvider
      summary: Delete a tenant identity provider.
      x-oyatie-surface: cloud.iam.identity_provider.delete
      x-oyatie-authorization:
        required_surface: cloud.iam.identity_provider.delete
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      responses:
        '200': {$ref: '#/components/responses/IdentityProvider'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    post:
      operationId: createCloudIamRole
      summary: Create a Cedar-bound IAM role for a tenant.
      x-oyatie-surface: cloud.iam.role.create
      x-oyatie-authorization:
        required_surface: cloud.iam.role.create
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201': {$ref: '#/components/responses/Role'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /sts/tokens:
    post:
      operationId: issueCloudIamStsToken
      summary: Issue a short-lived STS token for a trusted principal.
      x-oyatie-surface: cloud.iam.sts.token
      x-oyatie-authorization:
        required_surface: cloud.iam.sts.token
        authority: ingress_pdp_cedar_decision
        default_decision: deny
        tenant_scope: tenant_account_project_boundary
        cross_tenant_access: forbidden
        caller_supplied_authorization_headers: forbidden
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BoundaryCellId'
        - $ref: '#/components/parameters/BoundaryRegionId'
        - $ref: '#/components/parameters/OyatieVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StsTokenRequest'
      responses:
        '200': {$ref: '#/components/responses/StsSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Ingress-authenticated caller credential. Cedar/PDP decision evidence is
        server-owned context and is not accepted from public request headers.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/TenantId'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
    BoundaryCellId:
      name: X-Boundary-Cell-Id
      in: header
      required: true
      schema: {type: string, pattern: '^cell-[a-z0-9-]+$'}
    BoundaryRegionId:
      name: X-Boundary-Region-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    OyatieVersion:
      name: Oyatie-Version
      in: header
      required: true
      schema:
        type: string
        enum: ["2026-05-21", "2026-02-21", "2025-11-21"]
    IdentityProviderId:
      name: identity_provider_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdentityProviderId'}
    RoleId:
      name: role_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RoleId'}
  responses:
    IdentityProvider:
      description: Identity provider record.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityProviderResponse'}
    Role:
      description: IAM role record.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RoleResponse'}
    StsSession:
      description: Short-lived STS session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StsSessionResponse'}
    BadRequest:
      description: Boundary validation or kernel validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Cedar decision denied the requested surface or tenant scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Requested IAM resource already exists or conflicts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnprocessableEntity:
      description: Idempotency key was reused with a different request fingerprint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    TenantId:
      type: string
      pattern: '^ten_[A-Za-z0-9_:-]+$'
    IdentityProviderId:
      type: string
      pattern: '^idp_[A-Za-z0-9_:-]+$'
    RoleId:
      type: string
      pattern: '^role_[A-Za-z0-9_:-]+$'
    PrincipalRef:
      type: object
      required: [value]
      properties:
        value: {type: string, minLength: 1}
    ScopeRef:
      type: object
      required: [value]
      properties:
        value: {type: string, pattern: '^cloud\\..+$'}
    IdentityProviderKind:
      type: string
      enum: [saml, oidc]
    IdentityProviderCreateRequest:
      type: object
      x-oyatie-server-owned-fields:
        - created_at_epoch_seconds
      required:
        - tenant_id
        - identity_provider_id
        - region_pack
        - kind
        - issuer_uri
        - audience
        - verification_material_ref
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_provider_id: {$ref: '#/components/schemas/IdentityProviderId'}
        region_pack: {type: string, pattern: '^oya-pack-.+$'}
        kind: {$ref: '#/components/schemas/IdentityProviderKind'}
        issuer_uri: {type: string, format: uri}
        audience: {type: string, minLength: 1}
        verification_material_ref:
          type: string
          pattern: '^(cert|jwks)/.+$'
    IdentityProviderUpdateRequest:
      type: object
      required:
        - tenant_id
        - identity_provider_id
        - region_pack
        - kind
        - issuer_uri
        - audience
        - verification_material_ref
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_provider_id: {$ref: '#/components/schemas/IdentityProviderId'}
        region_pack: {type: string, pattern: '^oya-pack-.+$'}
        kind: {$ref: '#/components/schemas/IdentityProviderKind'}
        issuer_uri: {type: string, format: uri}
        audience: {type: string, minLength: 1}
        verification_material_ref:
          type: string
          pattern: '^(cert|jwks)/.+$'
    IdentityProviderRecord:
      allOf:
        - $ref: '#/components/schemas/IdentityProviderUpdateRequest'
        - type: object
          required: [created_at_epoch_seconds, schema_version]
          properties:
            created_at_epoch_seconds: {type: integer, minimum: 1}
            schema_version: {type: integer, enum: [1]}
    RoleCreateRequest:
      type: object
      x-oyatie-server-owned-fields:
        - created_at_epoch_seconds
      required:
        - tenant_id
        - role_id
        - region
        - name
        - cedar_policy_id
        - cedar_policy_version
        - assumable_by
        - max_session_duration_sec
        - data_class
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        role_id: {$ref: '#/components/schemas/RoleId'}
        region: {type: string, minLength: 1}
        name: {type: string, pattern: '^[a-z0-9-]+$'}
        cedar_policy_id: {type: string, pattern: '^pol_[A-Za-z0-9_:-]+$'}
        cedar_policy_version: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'}
        assumable_by:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PrincipalRef'}
        max_session_duration_sec: {type: integer, minimum: 1, maximum: 3600}
        data_class: {type: string, enum: [PUBLIC]}
    RoleRecord:
      allOf:
        - $ref: '#/components/schemas/RoleCreateRequest'
        - type: object
          required: [created_at_epoch_seconds, schema_version]
          properties:
            created_at_epoch_seconds: {type: integer, minimum: 1}
            schema_version: {type: integer, enum: [1]}
    StsTokenRequest:
      type: object
      x-oyatie-server-owned-fields:
        - issued_at_epoch_seconds
      required:
        - tenant_id
        - session_id
        - role_id
        - assumed_by
        - requested_duration_sec
        - scopes
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        session_id: {type: string, pattern: '^sts_[A-Za-z0-9_:-]+$'}
        role_id: {$ref: '#/components/schemas/RoleId'}
        assumed_by: {type: string, minLength: 1}
        external_id: {type: string, minLength: 1, nullable: true}
        requested_duration_sec: {type: integer, minimum: 1, maximum: 3600}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/ScopeRef'}
    StsSessionRecord:
      allOf:
        - $ref: '#/components/schemas/StsTokenRequest'
        - type: object
          required: [issued_at_epoch_seconds, expires_at_epoch_seconds, token_fingerprint, data_class, schema_version]
          properties:
            issued_at_epoch_seconds: {type: integer, minimum: 1}
            expires_at_epoch_seconds: {type: integer, minimum: 1}
            token_fingerprint: {type: string, pattern: '^sts1:.+$'}
            data_class: {type: string, enum: [PUBLIC]}
            schema_version: {type: integer, enum: [1]}
    ResponseMetadata:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 1}
    IdentityProviderResponse:
      type: object
      required: [data, metadata]
      properties:
        data: {$ref: '#/components/schemas/IdentityProviderRecord'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    IdentityProviderListResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/IdentityProviderRecord'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    RoleResponse:
      type: object
      required: [data, metadata]
      properties:
        data: {$ref: '#/components/schemas/RoleRecord'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    StsSessionResponse:
      type: object
      required: [data, metadata]
      properties:
        data: {$ref: '#/components/schemas/StsSessionRecord'}
        metadata: {$ref: '#/components/schemas/ResponseMetadata'}
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field: {type: string}
        issue: {type: string}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: {type: string, minLength: 1}
            message: {type: string, minLength: 1}
            message_localized: {type: string, nullable: true}
            request_id: {type: string, minLength: 1}
            details:
              type: array
              items: {$ref: '#/components/schemas/ErrorDetail'}
            retry_after_seconds: {type: integer, minimum: 0, nullable: true}
  x-oyatie-sharding-automation-event-surface:
    microservice: cloud-iam
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI contract plus sharding_automation event-surface metadata.
    wire_shape: >-
      Identity provider, role, and STS operations are concrete wire surfaces;
      sharding_automation remains extension-only metadata for governance review.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Historical local-mirror verifier semantics are migration input only;
          protected-branch authority lives in cloud-ci/oya-ci required contexts.
      ADR-0347:
        purpose: Preserve governance lane vocabulary cohesion during migration.
      ADR-0348:
        purpose: Require autosharding, auto-rebalance, and dynamic sharding to
          honor residency, reversibility, and audit-chain emission.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
      ADR-0349:
        purpose: >-
          Jenkins is bridge history; cloud-ci/oya-ci owns destination merge
          admission and ArgoCD remains a CD bridge/reference adapter where
          separately authorized.
    consumer_guidance:
      generators: Ignore x-oyatie-* extensions for SDK and server wire generation.
      governance: Use x-oyatie-* extensions as doctrine metadata for review.
