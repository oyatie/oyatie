apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kmskeyrings.kms.oyatie.com
  labels:
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0510: transient-kms-operator-kube-adapter
spec:
  group: kms.oyatie.com
  scope: Namespaced
  names:
    plural: kmskeyrings
    singular: kmskeyring
    kind: KmsKeyRing
    shortNames:
      - kmskr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenantId
                - region
                - cellId
                - hsmPartitionRef
                - origin
                - usage
                - hsmValidation
                - residency
                - dataClass
                - rotationPolicy
              properties:
                tenantId:
                  type: string
                  pattern: "^ten_[a-z0-9_]+$"
                region:
                  type: string
                cellId:
                  type: string
                hsmPartitionRef:
                  type: string
                origin:
                  type: string
                  enum: ["OyatieManaged", "Byok", "Hyok"]
                usage:
                  type: string
                  enum: ["EncryptDecrypt", "SignVerify"]
                hsmValidation:
                  type: string
                  enum: ["PackEnhancedFips1403Level3", "Fips1403Level3", "Cryptrec", "CommonCriteriaEal4", "PciHsm"]
                residency:
                  type: string
                  enum: ["StrictHomeRegion", "HomeWithRecoveryFailover", "Global"]
                dataClass:
                  type: string
                  enum: ["Public", "InternalOnly", "PiiIdentifying", "Phi", "Pci", "Secret", "Audit"]
                rotationPolicy:
                  type: object
                  required:
                    - rotateAfterSeconds
                    - decryptOnlyGraceSeconds
                  properties:
                    rotateAfterSeconds:
                      type: integer
                      minimum: 1
                    decryptOnlyGraceSeconds:
                      type: integer
                      minimum: 0
            status:
              type: object
              required:
                - health
                - versions
              properties:
                health:
                  type: object
                  required:
                    - state
                  properties:
                    state:
                      type: string
                      enum: ["Healthy", "Ambiguous", "Compromised"]
                    reason:
                      type: string
                versions:
                  type: array
                  items:
                    type: object
                    required:
                      - version
                      - state
                      - createdAtEpochSeconds
                      - activatedAtEpochSeconds
                    properties:
                      version:
                        type: integer
                        minimum: 1
                      state:
                        type: string
                        enum: ["Pending", "Active", "DecryptOnly", "Quarantined", "Destroyed"]
                      createdAtEpochSeconds:
                        type: integer
                        minimum: 0
                      activatedAtEpochSeconds:
                        type: integer
                        minimum: 0
                      decryptOnlySinceEpochSeconds:
                        type: integer
                        minimum: 0
