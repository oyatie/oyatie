apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kmssealingroots.kms.oyatie.com
  labels:
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0510: transient-kms-operator-kube-adapter
spec:
  group: kms.oyatie.com
  scope: Namespaced
  names:
    plural: kmssealingroots
    singular: kmssealingroot
    kind: KmsSealingRoot
    shortNames:
      - kmssr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - tenantId
                - region
                - cellId
                - rootRef
                - activeVersion
                - rotateAfterSeconds
              properties:
                tenantId:
                  type: string
                  pattern: "^ten_[a-z0-9_]+$"
                region:
                  type: string
                cellId:
                  type: string
                rootRef:
                  type: string
                activeVersion:
                  type: integer
                  minimum: 1
                rotateAfterSeconds:
                  type: integer
                  minimum: 1
            status:
              type: object
              required:
                - health
                - observedVersion
              properties:
                observedVersion:
                  type: integer
                  minimum: 1
                health:
                  type: object
                  required:
                    - state
                  properties:
                    state:
                      type: string
                      enum: ["Healthy", "Ambiguous", "Compromised"]
                    reason:
                      type: string
