microservice:
  id: cloud-kms
  cargoPackage: oya-cloud-kms-api
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-kms

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-kms
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

operator:
  enabled: true
  name: oya-cloud-kms-operator
  cargoPackage: oya-cloud-kms-operator-app
  replicaCount: 1
  watchedNamespace: cloud-kms
  image:
    registry: registry.oyatie.dev
    repository: oya-cloud-kms-operator
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
    cosign:
      required: true
      policy: ADR-0181
  serviceAccount:
    name: oya-cloud-kms-operator
    automountToken: true
    nonClaim: "operator watches only kms.oyatie.com CRDs and emits reconcile events"
  mtls:
    secretName: oya-cloud-kms-operator-mtls
    mountPath: /var/run/oyatie/mtls
  state:
    claimName: oya-cloud-kms-operator-state
    mountPath: /var/lib/oya-cloud-kms-operator
    fileName: state.json
    storageClassName: ""
    size: 1Gi
  pdb:
    # Single-replica operator: maxUnavailable lets node drains proceed (the pod
    # reschedules) instead of wedging on minAvailable==replicaCount (review #686 F3).
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-cloud-kms-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
