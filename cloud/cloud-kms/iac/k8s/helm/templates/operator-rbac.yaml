{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.operator.serviceAccount.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.operator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0510: transient-kms-operator-kube-adapter
  annotations:
    oyatie.com/non-claim: {{ .Values.operator.serviceAccount.nonClaim | quote }}
automountServiceAccountToken: {{ .Values.operator.serviceAccount.automountToken }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.operator.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.operator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
rules:
  - apiGroups: ["kms.oyatie.com"]
    resources: ["kmskeyrings", "kmssealingroots"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["kms.oyatie.com"]
    resources: ["kmskeyrings/status", "kmssealingroots/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.operator.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.operator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.serviceAccount.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.operator.name | quote }}
{{- end }}
