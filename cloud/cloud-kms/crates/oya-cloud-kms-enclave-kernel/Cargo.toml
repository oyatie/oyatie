[package]
name = "oya-cloud-kms-enclave-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Crypto-enclave kernel for oya-kms: mlock+zeroize one-way-door key material, wrapped-KEK tokens, decrypt-only key-version rotation, bounded-TTL DEK cache for static stability (ADR-0536 D-8, story G002)."

[dependencies]
# aws-lc-rs: canonical Phase-1 crypto backend (ADR-0506); AES-256-GCM AEAD via
# RandomizedNonceKey (nonce reuse impossible by construction) + CSPRNG fill.
aws-lc-rs = { workspace = true }
# libc: mlock/munlock so key-material pages never reach swap (ADR-0536 D-8
# crypto-boundary requirement; AWS KMS enclave precedent).
libc = "0.2"
oya-cloud-kms-domain = { path = "../oya-cloud-kms-domain" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[lib]
name = "oya_cloud_kms_enclave_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
