[package]
name = "oya-cloud-kms-operator-k8s-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Transient kube-rs adapter for the Cloud KMS operator. ADR-0510-marked:
# kube-rs/k8s-openapi are isolated here until the owned cloud-k8s port cutover.

[lib]
name = "oya_cloud_kms_operator_k8s_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-kms-operator-kernel = { path = "../oya-cloud-kms-operator-kernel" }
oya-cloud-kms-domain = { path = "../oya-cloud-kms-domain" }
oya-data-boundary-kernel = { path = "../../../../libs/oya-data-boundary-kernel" }
network-residency = { path = "../../../../network/core/residency" }
futures = "0.3"
kube = { workspace = true }
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tracing = { workspace = true }

[lints]
workspace = true
