[package]
name = "oya-cloud-kms-adapter-openbao"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_cloud_kms_adapter_openbao"
path = "src/lib.rs"
doctest = false

[dependencies]
# base64: decodes OpenBao transit export material in root_custody (already
# a vendored workspace dependency; standard alphabet, strict decode).
base64 = "0.21"
oya-cloud-kms-domain = { path = "../oya-cloud-kms-domain" }
oya-cloud-kms-enclave-kernel = { path = "../oya-cloud-kms-enclave-kernel" }
zeroize = "1.8"

[dev-dependencies]
oya-data-boundary-kernel = { path = "../../../../libs/oya-data-boundary-kernel" }

[lints]
workspace = true
