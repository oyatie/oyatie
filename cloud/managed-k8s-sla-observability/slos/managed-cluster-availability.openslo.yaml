apiVersion: openslo/v1
kind: SLO
metadata:
  name: managed-k8s-cluster-availability
  annotations:
    oyatie.com/source-authority: cloud/managed-k8s-sla-observability/slos/managed-cluster-availability.openslo.yaml
    oyatie.com/claim-ceiling: target-only; not measured production SLO evidence until live ingestion review lands
spec:
  service: managed-k8s-sla-observability
  indicator:
    metadata:
      name: managed-k8s-cluster-status-availability
    spec:
      ratioMetric:
        good:
          metricSource:
            type: internal-dto
            spec:
              query: healthy_status_samples
        total:
          metricSource:
            type: internal-dto
            spec:
              query: total_status_samples
  objectives:
    - displayName: 99.9% control-plane availability
      target: 0.999
