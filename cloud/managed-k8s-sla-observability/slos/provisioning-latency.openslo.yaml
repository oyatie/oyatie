apiVersion: openslo/v1
kind: SLO
metadata:
  name: managed-k8s-provisioning-latency
  annotations:
    oyatie.com/source-authority: cloud/managed-k8s-sla-observability/slos/provisioning-latency.openslo.yaml
    oyatie.com/claim-ceiling: target-only; not measured production SLO evidence until live ingestion review lands
spec:
  service: managed-k8s-sla-observability
  indicator:
    metadata:
      name: managed-k8s-provisioning-latency-ms
    spec:
      thresholdMetric:
        metricSource:
          type: internal-dto
          spec:
            query: provisioning_latency_millis
  objectives:
    - displayName: control-plane provisioning completes within 10 minutes
      op: lte
      target: 600000
