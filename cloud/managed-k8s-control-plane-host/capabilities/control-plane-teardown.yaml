# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:managed-k8s-control-plane-host:control-plane-teardown:v1
name: control-plane-teardown
namespace: managed-k8s-control-plane-host
display_name: Tear down a tenant control plane (drain then delete)
description: |
  Drain and delete a tenant control plane (active -> draining -> deleted).
  Idempotent: tearing down an already-deleted/unknown control plane is a no-op
  success. For the hosted tier this removes the Kamaji TenantControlPlane + its
  per-tenant datastore; for the dedicated tier it decommissions the Talos spoke
  reference.

  live adapter foundation maturity: hosted teardown is idempotent for absent
  resources, refuses foreign objects without Oyatie ownership labels, and uses
  kube-rs DynamicObject delete; dedicated teardown retires the opaque reference.
owner_team: council-architecture + ops-platform
maturity: preview
created_at: 2026-05-27
related_adrs: [ADR-0376, ADR-0375, ADR-0083, ADR-0105]
related_artifacts:
  - cloud/managed-k8s-control-plane-host/PRD.md
  - cloud/managed-k8s-control-plane-host/cedar/policies.cedar
  - cloud/managed-k8s-control-plane-host/runbooks/control-plane-provision-teardown.md
autonomy_tier: T3
# T3 = irreversible deletion of standing control-plane infrastructure (+ the
# tenant datastore on the hosted tier); Cedar-gated to platform/control-plane-operator;
# audit-chain seal on every teardown.
risk_class: high
inputs:
  - name: tenant_id
    type: string
    required: true
  - name: cluster_name
    type: string
    required: true
  - name: tier
    type: enum
    values: [hosted_kamaji, dedicated_talos_spoke]
    required: true
  - name: handle
    type: string
    required: true
outputs:
  - name: teardown_accepted
    type: boolean
audit_chain_seal_events:
  - oya.managed-k8s.control-plane.torn-down
