# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:managed-k8s-control-plane-host:control-plane-provision:v1
name: control-plane-provision
namespace: managed-k8s-control-plane-host
display_name: Provision a tenant control plane (hosted or dedicated tier)
description: |
  Provision a tenant Kubernetes control plane under the ADR-0376 two-tier model:
  HOSTED (Kamaji TenantControlPlane in the management cluster) or DEDICATED
  (Talos spoke). Validates the cluster ref + tier + datastore class, then drives
  the kernel status state machine (requested -> datastore_bound|media_formed ->
  provisioning -> endpoint_ready -> active).

  live adapter foundation maturity: hosted tier creates the pinned Kamaji
  TenantControlPlane DynamicObject; dedicated tier records an opaque Talos/CAPI
  reference; sandbox/live execution proof remains a separate explicit artifact.
owner_team: council-architecture + ops-platform
maturity: preview
created_at: 2026-05-27
related_adrs: [ADR-0376, ADR-0375, ADR-0148, ADR-0083, ADR-0105]
related_artifacts:
  - cloud/managed-k8s-control-plane-host/PRD.md
  - cloud/managed-k8s-control-plane-host/contracts/openapi.yaml
  - cloud/managed-k8s-control-plane-host/cedar/policies.cedar
autonomy_tier: T3
# T3 = creates standing control-plane infrastructure in the management cluster
# (tenant-impacting, costed); Cedar-gated to platform/control-plane-operator only;
# audit-chain seal on every provision decision.
risk_class: high
inputs:
  - name: tenant_id
    type: string
    required: true
  - name: cluster_name
    type: string
    required: true
  - name: tier
    type: enum
    values: [hosted_kamaji, dedicated_talos_spoke]
    required: false
    default: hosted_kamaji
  - name: datastore_class
    type: enum
    values: [etcd_per_tenant, pooled_relational]
    required: false
    default: etcd_per_tenant
outputs:
  - name: control_plane_ref
    type: object
    schema:
      tenant_id: string
      cluster_name: string
      tier: enum (hosted_kamaji | dedicated_talos_spoke)
      handle: string
audit_chain_seal_events:
  - oya.managed-k8s.control-plane.tier-selected
  - oya.managed-k8s.control-plane.datastore-bound
  - oya.managed-k8s.control-plane.provisioned
