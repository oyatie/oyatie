# Canonical-base: specs/openslo/canonical-envelope-schema.json
apiVersion: openslo/v1
kind: SLO
metadata:
  name: control-plane-host-availability
  displayName: "managed-k8s-control-plane-host — admin/status API availability"
  labels:
    microservice: managed-k8s-control-plane-host
    sli: availability
    data_classes: INTERNAL_ONLY
spec:
  service: managed-k8s-control-plane-host
  description: |
    Availability of the admin/status API (non-5xx responses). This is a
    control-plane management surface, not a tenant-workload data path. non_claim:
    design target for the deployed service; the lane ships the composition root +
    in-memory-backed acceptance suite, so this metric is populated once the
    service is deployed against a management cluster.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="oya-managed-k8s-control-plane-host",status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="oya-managed-k8s-control-plane-host"}[5m]))
  objectives:
    - displayName: "99.9% non-5xx over rolling 30d"
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
