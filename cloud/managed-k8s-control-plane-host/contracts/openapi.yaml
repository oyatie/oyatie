openapi: 3.2.0
info:
  title: Managed-Kubernetes Control-Plane Host — Admin API
  version: 0.1.0
  description: >-
    Admin/status surface for the managed-Kubernetes control-plane-host concern
    (ADR-0376). Provision/observe/teardown tenant control planes across the
    hosted (Kamaji TenantControlPlane) and dedicated (Talos spoke) tiers. This is
    a CONTROL-PLANE admin API consumed by oya-managed-k8s-cluster-lifecycle and
    operators — never a tenant-workload data path. live adapter foundation:
    hosted Kamaji uses kube-rs DynamicObject create/read/delete; dedicated Talos
    records an opaque CAPI reference. Real sandbox/live cluster proof remains a
    separate approval artifact.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Loopback (dev/bring-up via the in-memory adapter)
paths:
  /admin/control-planes:
    post:
      operationId: provisionControlPlane
      summary: Provision a tenant control plane (hosted or dedicated tier).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionBody'
      responses:
        '201':
          description: Provision accepted; returns the control-plane handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlaneRefResponse'
        '400':
          description: Malformed cluster ref, or unknown tier/datastore_class (fail-closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Principal is not authorized to provision (Cedar default-deny for tenants).
        '501':
          description: Adapter explicitly deferred this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/control-planes/status:
    post:
      operationId: getControlPlaneStatus
      summary: Read the lifecycle status of a tenant control plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPlaneRefBody'
      responses:
        '200':
          description: Current status report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: No control plane known for the supplied handle.
        '501':
          description: Adapter explicitly deferred this operation.
  /admin/control-planes/teardown:
    post:
      operationId: teardownControlPlane
      summary: Drain and delete a tenant control plane (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPlaneRefBody'
      responses:
        '204':
          description: Teardown accepted (idempotent; already-deleted is a no-op success).
        '404':
          description: No control plane known for the supplied handle.
        '501':
          description: Adapter explicitly deferred this operation.
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe.
      responses:
        '200':
          description: Service is live.
          content:
            text/plain:
              schema:
                type: string
                example: ok
components:
  schemas:
    ControlPlaneTier:
      type: string
      enum: [hosted_kamaji, dedicated_talos_spoke]
      description: Placement tier (ADR-0376). Default is hosted_kamaji.
    DatastoreClass:
      type: string
      enum: [etcd_per_tenant, pooled_relational]
      description: Hosted-tier datastore class (advisory for the dedicated tier).
    ControlPlaneStatus:
      type: string
      enum:
        - requested
        - datastore_bound
        - media_formed
        - provisioning
        - endpoint_ready
        - active
        - draining
        - deleted
        - failed
    ProvisionBody:
      type: object
      required: [tenant_id, cluster_name]
      properties:
        tenant_id:
          type: string
          description: Tenant that owns the cluster (tenant-zero is an ordinary value).
        cluster_name:
          type: string
        tier:
          $ref: '#/components/schemas/ControlPlaneTier'
        datastore_class:
          $ref: '#/components/schemas/DatastoreClass'
    ControlPlaneRefBody:
      type: object
      required: [tenant_id, cluster_name, tier, handle]
      properties:
        tenant_id:
          type: string
        cluster_name:
          type: string
        tier:
          $ref: '#/components/schemas/ControlPlaneTier'
        handle:
          type: string
          description: Adapter-issued opaque handle returned by provision.
    ControlPlaneRefResponse:
      type: object
      required: [tenant_id, cluster_name, tier, handle]
      properties:
        tenant_id:
          type: string
        cluster_name:
          type: string
        tier:
          $ref: '#/components/schemas/ControlPlaneTier'
        handle:
          type: string
    StatusResponse:
      type: object
      required: [status, tier]
      properties:
        status:
          $ref: '#/components/schemas/ControlPlaneStatus'
        tier:
          $ref: '#/components/schemas/ControlPlaneTier'
        endpoint:
          type: string
          nullable: true
          description: API-server endpoint once endpoint_ready or later.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, detail]
          properties:
            kind:
              type: string
              enum: [invalid_cluster_ref, not_found, illegal_transition, backend_error, unimplemented]
            detail:
              type: string
