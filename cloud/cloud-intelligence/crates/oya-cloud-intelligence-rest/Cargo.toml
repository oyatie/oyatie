[package]
name = "oya-cloud-intelligence-rest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# OAuth subscription-pool REST adapter (ADR-0384 Path B, Stage-6 GREEN).
# Owns:
#   D2 — axum reverse-proxy router
#   D3 — Anthropic provider adapter + async OAuth refresh (reqwest async, Item 1)
#         + upstream OAuth singleflight (Item 2)
#   D6 — EventSink fan-out to ClickHouse + Valkey Stream (trait mock here)
#   D8 — OpenBao envelope-encrypted refresh-token storage (trait mock here)
#
# Codex provider adapter is deferred to a follow-up PR (see TODO in lib.rs).

[lib]
name = "oya_cloud_intelligence_rest"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-intelligence-kernel = { path = "../oya-cloud-intelligence-kernel" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes.workspace = true
# axum + reqwest not yet in workspace deps — pinned directly here per ADR-0090
# blessed-allowlist. Add to workspace in a follow-up consolidation PR.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# blocking feature removed (Item 1: migrated to async reqwest::Client).
# stream feature added (Stage-7: SSE passthrough via bytes_stream()).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { workspace = true, features = ["sync"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
oya-cloud-intelligence-kernel = { path = "../oya-cloud-intelligence-kernel" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
httpmock = "0.7"
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1"
bytes.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[lints]
workspace = true
