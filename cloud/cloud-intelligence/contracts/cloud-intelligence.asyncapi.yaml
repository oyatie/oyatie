asyncapi: 3.1.0
info:
  title: Oyatie Cloud Intelligence Event Streams
  version: 1.0.0
  description: |
    AsyncAPI 3.1 contract for the cloud-intelligence µservice telemetry streams.

    Design + research grounding: microservices/cloud-intelligence/PRD.md §4.6 and
    microservices/cloud-intelligence/design/hyperscaler-best-practice-brief.md (brief §3 Async/events,
    brief §9 Audit evidence). Telemetry is modeled as structured per-invocation records, after
    the AWS Bedrock model-invocation log shape.

    TWO channels, deliberately separated (brief §3 "Adopt" — separate low-PII metering from
    access-controlled audit):
      - llm.usage.v1  — lightweight, low-PII metering for FinOps/showback. MAY be sampled.
      - llm.audit.v1  — the immutable, access-controlled invocation record. 100% emission,
        hash-chained into evidence/audit-chain.jsonl, alert-if-disabled.

    SHARED ENVELOPE (brief §3): every message carries correlationId (= the request id /
    X-Request-Id from the REST surface), tenant, timestamp, and schemaVersion. Every schema is
    versioned (`schemaVersion`) and gated in CI.

    BODY-SPILL NOTE (brief §3, §9, §7): prompt and completion bodies are NEVER embedded in these
    events by default (default-OFF). With per-tenant opt-in, full bodies spill to a
    residency-pinned object-storage bucket (Bedrock >100KB externalization pattern) and are
    referenced ONLY by URI (prompt_uri / completion_uri). A redaction pass runs before
    persistence; tokens/keys are never persisted.
servers:
  pulsar-cell:
    host: pulsar.observability.svc.cluster.local:6650
    protocol: pulsar+ssl
    description: Cell-local Pulsar broker (per ADR-0186)
defaultContentType: application/json; charset=utf-8
channels:
  llm.usage.v1:
    address: persistent://public/default/oya.llm.usage.v1
    description: |
      Per-invocation metering for FinOps/showback. Low-PII (token counts + cost dims, no prompt
      bodies). MAY be sampled (brief §9 — metering may sample; audit may not).
    messages:
      usageRecord:
        $ref: '#/components/messages/UsageRecord'
  llm.audit.v1:
    address: persistent://public/default/oya.llm.audit.v1
    description: |
      Immutable per-invocation audit record (Bedrock ModelInvocationLog shape). 100% emission,
      access-controlled, hash-chained into evidence/audit-chain.jsonl, alert-if-disabled
      (brief §9). Read access is gated behind a distinct authority + SIEM forward (brief §7).
    messages:
      auditRecord:
        $ref: '#/components/messages/AuditRecord'

  llm.parity.v1:
    address: persistent://public/default/oya.llm.parity.v1
    description: Capability parity baseline/report snapshots for XPROXY and future reference baselines.
    messages:
      paritySnapshot:
        $ref: '#/components/messages/CapabilityParitySnapshot'
  llm.drift.v1:
    address: persistent://public/default/oya.llm.drift.v1
    description: Drift probe outcomes for pinned baselines, provider wire profiles, and compatibility canaries.
    messages:
      driftProbeResult:
        $ref: '#/components/messages/DriftProbeResult'
  llm.compatibility.v1:
    address: persistent://public/default/oya.llm.compatibility.v1
    description: Client/tool compatibility canary outcomes emitted by workers.
    messages:
      compatibilityCanaryResult:
        $ref: '#/components/messages/CompatibilityCanaryResult'
  llm.circuit_breaker.v1:
    address: persistent://public/default/oya.llm.circuit_breaker.v1
    description: GatewayCircuitBreaker open/resume/cooldown events with Retry-After semantics.
    messages:
      circuitBreakerEvent:
        $ref: '#/components/messages/CircuitBreakerEvent'
  llm.guardrail.v1:
    address: persistent://public/default/oya.llm.guardrail.v1
    description: Redacted guardrail signals emitted when platform policy blocks, quarantines, or recommends tenant action.
    messages:
      guardrailSignal:
        $ref: '#/components/messages/GuardrailSignal'
  llm.safety_review.v1:
    address: persistent://public/default/oya.llm.safety_review.v1
    description: Secondary internal-review requests and outcomes for critical blocks before manual escalation.
    messages:
      secondaryReviewRequest:
        $ref: '#/components/messages/SecondaryReviewRequest'
  llm.evidence.v1:
    address: persistent://public/default/oya.llm.evidence.v1
    description: Evidence-retention events carrying redacted metadata and sealed handle references only.
    messages:
      evidenceRetentionEvent:
        $ref: '#/components/messages/EvidenceRetentionEvent'
  llm.agent_runtime.v1:
    address: persistent://public/default/oya.llm.agent_runtime.v1
    description: Redacted cloud-intelligence agent runtime and workflow status events emitted by controllers.
    messages:
      agentWorkflowStatus:
        $ref: '#/components/messages/AgentWorkflowStatusEvent'
  llm.agent_schedule.v1:
    address: persistent://public/default/oya.llm.agent_schedule.v1
    description: Controller-owned agent schedule status events with resource refs and sealed evidence handles only.
    messages:
      agentScheduleStatus:
        $ref: '#/components/messages/AgentScheduleStatusEvent'
  llm.parity_canary.v1:
    address: persistent://public/default/oya.llm.parity_canary.v1
    description: Scheduled parity and drift canary status events with Retry-After hints and redacted evidence refs.
    messages:
      parityCanaryStatus:
        $ref: '#/components/messages/ParityCanaryStatusEvent'
operations:
  publishUsage:
    action: send
    channel:
      $ref: '#/channels/llm.usage.v1'
    summary: Gateway emits a metering record per invocation (sampleable).
    messages:
      - $ref: '#/channels/llm.usage.v1/messages/usageRecord'
  publishAudit:
    action: send
    channel:
      $ref: '#/channels/llm.audit.v1'
    summary: Gateway emits an immutable audit record per invocation (100%).
    messages:
      - $ref: '#/channels/llm.audit.v1/messages/auditRecord'

  publishParitySnapshot:
    action: send
    channel:
      $ref: '#/channels/llm.parity.v1'
    summary: Parity worker emits a capability parity snapshot/report.
    messages:
      - $ref: '#/channels/llm.parity.v1/messages/paritySnapshot'
  publishDriftProbeResult:
    action: send
    channel:
      $ref: '#/channels/llm.drift.v1'
    summary: Drift worker emits a pinned-baseline or wire-profile probe result.
    messages:
      - $ref: '#/channels/llm.drift.v1/messages/driftProbeResult'
  publishCompatibilityCanaryResult:
    action: send
    channel:
      $ref: '#/channels/llm.compatibility.v1'
    summary: Compatibility worker emits a client/tool canary result.
    messages:
      - $ref: '#/channels/llm.compatibility.v1/messages/compatibilityCanaryResult'
  publishCircuitBreakerEvent:
    action: send
    channel:
      $ref: '#/channels/llm.circuit_breaker.v1'
    summary: Gateway or controller emits circuit-breaker state changes.
    messages:
      - $ref: '#/channels/llm.circuit_breaker.v1/messages/circuitBreakerEvent'
  publishGuardrailSignal:
    action: send
    channel:
      $ref: '#/channels/llm.guardrail.v1'
    summary: Guardrail worker emits redacted safety signal.
    messages:
      - $ref: '#/channels/llm.guardrail.v1/messages/guardrailSignal'
  publishSecondaryReviewRequest:
    action: send
    channel:
      $ref: '#/channels/llm.safety_review.v1'
    summary: Safety controller emits mandatory secondary-review request for critical block.
    messages:
      - $ref: '#/channels/llm.safety_review.v1/messages/secondaryReviewRequest'
  publishEvidenceRetentionEvent:
    action: send
    channel:
      $ref: '#/channels/llm.evidence.v1'
    summary: Evidence controller emits sealed-handle retention event.
    messages:
      - $ref: '#/channels/llm.evidence.v1/messages/evidenceRetentionEvent'
  publishAgentWorkflowStatus:
    action: send
    channel:
      $ref: '#/channels/llm.agent_runtime.v1'
    summary: Agent runtime controller emits redacted workflow status.
    messages:
      - $ref: '#/channels/llm.agent_runtime.v1/messages/agentWorkflowStatus'
  publishAgentScheduleStatus:
    action: send
    channel:
      $ref: '#/channels/llm.agent_schedule.v1'
    summary: Agent scheduler emits redacted schedule status.
    messages:
      - $ref: '#/channels/llm.agent_schedule.v1/messages/agentScheduleStatus'
  publishParityCanaryStatus:
    action: send
    channel:
      $ref: '#/channels/llm.parity_canary.v1'
    summary: Drift/parity worker emits redacted canary status.
    messages:
      - $ref: '#/channels/llm.parity_canary.v1/messages/parityCanaryStatus'
components:
  messageTraits:
    GatewayEnvelope:
      headers:
        type: object
        required: [correlationId, tenant, timestamp, schemaVersion]
        properties:
          correlationId:
            type: string
            format: uuid
            description: Request id (X-Request-Id from the REST surface). Ties usage↔audit↔OTel trace.
          tenant:
            type: string
            description: Tenant id resolved from the ingress bearer token (the isolation unit, brief §6).
          timestamp:
            type: string
            format: date-time
          schemaVersion:
            type: string
            description: Semantic schema version of the message body; gated in CI (brief §3).
            const: '1'
  messages:
    UsageRecord:
      name: UsageRecord
      title: LLM usage / metering record
      summary: Low-PII per-invocation metering for FinOps showback.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/UsagePayload'
    AuditRecord:
      name: AuditRecord
      title: LLM invocation audit record (Bedrock-shaped, immutable)
      summary: Immutable per-invocation record hash-chained into the audit chain.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/AuditPayload'

    CapabilityParitySnapshot:
      name: CapabilityParitySnapshot
      title: XPROXY capability parity snapshot
      summary: Machine-readable parity report status for all tracked capabilities.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/CapabilityParityPayload'
    DriftProbeResult:
      name: DriftProbeResult
      title: Drift probe result
      summary: Outcome from provider wire/profile or pinned-baseline drift worker.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/DriftProbePayload'
    CompatibilityCanaryResult:
      name: CompatibilityCanaryResult
      title: Compatibility canary result
      summary: Client/tool compatibility matrix canary result.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/CompatibilityCanaryPayload'
    CircuitBreakerEvent:
      name: CircuitBreakerEvent
      title: Gateway circuit breaker event
      summary: Circuit-breaker open, cooldown, or resume transition.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/CircuitBreakerPayload'

    GuardrailSignal:
      name: GuardrailSignal
      title: Redacted guardrail signal
      summary: Platform safety signal for automatic enforcement and tenant policy recommendation.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/GuardrailSignalPayload'
    SecondaryReviewRequest:
      name: SecondaryReviewRequest
      title: Mandatory secondary internal review request
      summary: Secondary review enrichment for a critical block before manual escalation.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/SecondaryReviewPayload'
    EvidenceRetentionEvent:
      name: EvidenceRetentionEvent
      title: Evidence retention event
      summary: Sealed encrypted evidence handle lifecycle event with redacted metadata.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/EvidenceRetentionPayload'
    AgentWorkflowStatusEvent:
      name: AgentWorkflowStatusEvent
      title: Agent workflow status event
      summary: Redacted status for an internal coding-agent workflow composed from cloud-intelligence resources.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/AgentWorkflowStatusPayload'
    AgentScheduleStatusEvent:
      name: AgentScheduleStatusEvent
      title: Agent schedule status event
      summary: Redacted controller-owned schedule status for tenant agent workflows.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/AgentScheduleStatusPayload'
    ParityCanaryStatusEvent:
      name: ParityCanaryStatusEvent
      title: Parity canary status event
      summary: Redacted status for scheduled parity and drift canaries.
      traits:
        - $ref: '#/components/messageTraits/GatewayEnvelope'
      payload:
        $ref: '#/components/schemas/ParityCanaryStatusPayload'
  schemas:
    AgentWorkflowStatusPayload:
      type: object
      required: [schema_version, workflow_ref, runtime_profile_ref, generation_adapters, routing_advisor_scope, policy_engine_port, evidence_visibility, requires_secondary_review_for_critical_blocks, raw_payload_included]
      properties:
        schema_version: { type: string, const: '1' }
        workflow_ref: { type: string }
        runtime_profile_ref: { type: string }
        delegation_policy_ref: { type: string }
        generation_adapters:
          type: array
          items: { type: string, enum: [claude, codex, gemini] }
        routing_advisor_scope: { type: string, const: routing-decision-only }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        requires_secondary_review_for_critical_blocks: { type: boolean, const: true }
        raw_payload_included: { type: boolean, const: false }
    AgentScheduleStatusPayload:
      type: object
      required: [schema_version, schedule_ref, state, controller_owner, policy_engine_port, evidence_visibility, raw_payload_included]
      properties:
        schema_version: { type: string, const: '1' }
        schedule_ref: { type: string }
        state: { type: string, enum: [queued, running, passed, failed, blocked] }
        next_run_window: { type: string, nullable: true }
        controller_owner: { type: string }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        raw_payload_included: { type: boolean, const: false }
    ParityCanaryStatusPayload:
      type: object
      required: [schema_version, artifact_family, capability_namespace, plan_ref, state, evidence_visibility, raw_payload_included]
      properties:
        schema_version: { type: string, const: '1' }
        artifact_family: { type: string, const: external-proxy-reference }
        capability_namespace: { type: string, const: XPROXY }
        plan_ref: { type: string }
        state: { type: string, enum: [passed, failed, running, inconclusive] }
        retry_after_seconds: { type: integer, nullable: true }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        raw_payload_included: { type: boolean, const: false }
    UsagePayload:
      type: object
      description: |
        Metering dims (brief §8 — per-invocation metric with tenant, ingress-token, provider,
        model). Token counts are the ACTUAL returned counts (incl. streamed usage chunk), the
        billing basis — not the admission estimate.
      required: [schema_version, request_id, tenant_id, provider, model_id, operation, input_token_count, output_token_count, status]
      properties:
        schema_version: { type: string, const: '1' }
        request_id: { type: string, format: uuid }
        tenant_id: { type: string }
        ingress_token_ref: { type: string, description: Hash-only reference to the ingress proxy-key (never the raw token). }
        provider: { type: string, enum: [openai, anthropic, gemini] }
        model_id: { type: string }
        operation: { type: string, enum: [chat.completions, embeddings] }
        input_token_count: { type: integer, format: int64 }
        output_token_count: { type: integer, format: int64 }
        status: { type: string, enum: [ok, error, rate_limited, key_exhausted, provider_unavailable, budget_exceeded, client_cancelled] }
        cost_usd_minor_units:
          type: integer
          format: int64
          description: Cost in USD minor units using per-tenant unit cost (brief §8 — custom per-tenant unit costs for dogfood/negotiated rates).
        latency_ms: { type: integer, format: int64 }
        ttft_ms: { type: integer, format: int64, description: Time-to-first-token for streamed requests; null for non-stream. }
        sampled: { type: boolean, description: True if this metering record was emitted under sampling (audit is never sampled). }
    AuditPayload:
      type: object
      description: |
        Bedrock ModelInvocationLog-shaped immutable record (brief §9 "Adopt"). Hash-chained into
        evidence/audit-chain.jsonl. Bodies are referenced by URI only when per-tenant opt-in is
        set (body-spill); otherwise prompt_uri/completion_uri are absent (default-OFF, brief §7).
      required:
        - schema_version
        - timestamp
        - tenant_id
        - request_id
        - provider
        - model_id
        - operation
        - status
        - residency_region
      properties:
        schema_version: { type: string, const: '1' }
        timestamp: { type: string, format: date-time }
        tenant_id: { type: string }
        request_id: { type: string, format: uuid }
        provider: { type: string, enum: [openai, anthropic, gemini] }
        model_id: { type: string }
        operation: { type: string, enum: [chat.completions, embeddings] }
        ingress_token_ref: { type: string, description: Hash-only reference to the ingress proxy-key (brief §9). }
        key_pool_member_ref: { type: string, description: Hash-only KeyFingerprint of the pooled provider key used (never the raw key, brief §9). }
        input_token_count: { type: integer, format: int64 }
        output_token_count: { type: integer, format: int64 }
        status: { type: string, enum: [ok, error, rate_limited, key_exhausted, provider_unavailable, budget_exceeded, client_cancelled] }
        latency_ms: { type: integer, format: int64 }
        ttft_ms: { type: integer, format: int64 }
        cost_usd_minor_units: { type: integer, format: int64 }
        residency_region:
          type: string
          description: Tenant residency region; the bucket/region the body-spill (if any) is pinned to (brief §7).
        retry_after_seconds:
          type: integer
          nullable: true
          description: Retry-After applied/echoed on rate-limit or exhaustion (brief §10).
        prompt_uri:
          type: string
          format: uri
          nullable: true
          description: |
            Object-storage URI of the redacted prompt body. Present ONLY when the tenant has
            opted into body logging (default-OFF). Residency-pinned bucket (brief §7).
        completion_uri:
          type: string
          format: uri
          nullable: true
          description: Object-storage URI of the redacted completion body. Opt-in only; residency-pinned (brief §7, §9).
        audit_chain_prev_hash:
          type: string
          description: Hash of the previous audit-chain entry (tamper-evident hash chain into evidence/audit-chain.jsonl, brief §9).

    CapabilityParityPayload:
      type: object
      required: [schema_version, artifact_family, capability_namespace, total, statuses]
      properties:
        schema_version: { type: string, const: '1' }
        artifact_family: { type: string, const: external-proxy-reference }
        capability_namespace: { type: string, const: XPROXY }
        total: { type: integer, const: 50 }
        statuses:
          type: object
          additionalProperties: { type: integer }
        report_uri: { type: string, nullable: true }
    DriftProbePayload:
      type: object
      required: [schema_version, probe_id, status, baseline_commit]
      properties:
        schema_version: { type: string, const: '1' }
        probe_id: { type: string }
        status: { type: string, enum: [passed, failed, inconclusive] }
        baseline_commit: { type: string }
        delta_uri: { type: string, nullable: true }
    CompatibilityCanaryPayload:
      type: object
      required: [schema_version, client_profile, status]
      properties:
        schema_version: { type: string, const: '1' }
        client_profile: { type: string }
        tool_profile: { type: string, nullable: true }
        status: { type: string, enum: [supported, inferred, blocked, failed] }
        evidence_uri: { type: string, nullable: true }
    CircuitBreakerPayload:
      type: object
      required: [schema_version, scope, state]
      properties:
        schema_version: { type: string, const: '1' }
        scope: { type: string }
        state: { type: string, enum: [closed, open, cooldown, resumed] }
        retry_after_seconds: { type: integer, nullable: true }
        reason: { type: string, nullable: true }
    GuardrailSignalPayload:
      type: object
      required: [schema_version, signal_id, category, data_class, action, manual_review_required]
      properties:
        schema_version: { type: string, const: '1' }
        signal_id: { type: string }
        category: { type: string }
        data_class: { type: string }
        action: { type: string, enum: [allow, redact, tokenize, block_quarantine] }
        secondary_agentic_review_required: { type: boolean }
        manual_review_required: { type: boolean }
        tenant_policy_recommendation: { type: string, nullable: true }
    SecondaryReviewPayload:
      type: object
      required: [schema_version, review_id, signal_id, status, raw_payload_included]
      properties:
        schema_version: { type: string, const: '1' }
        review_id: { type: string }
        signal_id: { type: string }
        status: { type: string, enum: [requested, unsafe, inconclusive, safe] }
        raw_payload_included: { type: boolean, const: false }
        redacted_evidence_ref: { type: string }
    EvidenceRetentionPayload:
      type: object
      required: [schema_version, evidence_id, data_class, encrypted_handle_ref, ttl_seconds, raw_access_requires_audited_break_glass]
      properties:
        schema_version: { type: string, const: '1' }
        evidence_id: { type: string }
        data_class: { type: string }
        encrypted_handle_ref: { type: string }
        ttl_seconds: { type: integer, format: int64 }
        raw_access_requires_audited_break_glass: { type: boolean, const: true }
