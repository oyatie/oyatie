// Oyatie Cloud Intelligence service — admin/internal gRPC contract.
//
// Design + research grounding: microservices/cloud-intelligence/PRD.md §4 and
// microservices/cloud-intelligence/design/hyperscaler-best-practice-brief.md.
// This is the ADMIN/INTERNAL control-plane surface (the data plane is the
// OpenAI-compatible REST surface in cloud-intelligence.openapi.yaml). It mirrors the
// admin operations in the OpenAPI `admin` tag: pool status, key refresh, status, accounts, analytics, and circuit-breaker resume.
//
// Authority: ADR-0090 (hyper backbone), ADR-0105 (layered kernel/rest),
// ADR-0145 inter-µservice communication, ADR-0373 (key-pool resilience).
//
// The field shapes mirror the IMPLEMENTED pure kernel
// (crates/oya-cloud-intelligence-kernel/src/lib.rs): ProviderChannel enum, the
// active/blacklisted KeyState with a cooldown-until timestamp, KeyPool::active_count,
// and the hash-only KeyFingerprint. No raw key material is ever carried on the wire
// (brief §5 — keys appear only as fingerprints).

syntax = "proto3";

package oyatie.cloud_intelligence.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/oyatie/cloud-intelligence-sdk-go/v1;cloudintelligence";
option java_multiple_files = true;
option java_package = "co.oyatie.cloud_intelligence.v1";

// Control-plane service — admin realm only. Authorization is enforced by the
// adminBearer realm (constant-time token) + owned-policy-engine-port decisions.
service LlmGatewayAdmin {
  // Report key-pool health across all provider channels.
  rpc PoolStatus(PoolStatusRequest) returns (PoolStatusResponse);

  // Force an out-of-band key-pool refresh from owned-secret-provider-port for one provider.
  // Idempotent. Never reads keys from disk/env (brief §5, §7).
  rpc KeyRefresh(KeyRefreshRequest) returns (KeyRefreshResponse);

  // Report gateway, route-controller, model-inventory, credential-worker, and policy readiness.
  rpc GatewayStatus(GatewayStatusRequest) returns (GatewayStatusResponse);

  // Return redacted provider account/seat status for tenant operations views.
  rpc AccountStatus(AccountStatusRequest) returns (AccountStatusResponse);

  // Return aggregated analytics for cloud dashboard/admin API surfaces.
  rpc AnalyticsSummary(AnalyticsSummaryRequest) returns (AnalyticsSummaryResponse);

  // Resume a circuit breaker or budget guard after policy-authorized operator action.
  rpc ResumeCircuitBreaker(ResumeCircuitBreakerRequest) returns (ResumeCircuitBreakerResponse);
}

// === Common ===

message RequestMeta {
  string x_request_id = 1;     // uuid; trace correlation + audit envelope correlationId
  string idempotency_key = 2;  // uuid; required on mutations (KeyRefresh)
  string client_user_agent = 3;
}

// Upstream provider dialect a pool serves. Mirrors the kernel ProviderChannel enum.
enum ProviderChannel {
  PROVIDER_CHANNEL_UNSPECIFIED = 0;
  PROVIDER_CHANNEL_OPENAI = 1;     // Authorization: Bearer <key>
  PROVIDER_CHANNEL_ANTHROPIC = 2;  // x-api-key + anthropic-version
  PROVIDER_CHANNEL_GEMINI = 3;     // x-goog-api-key
}

// Lifecycle state of a single pooled key. Mirrors the kernel KeyState
// (Active | Blacklisted { cooldown_until_millis }).
enum KeyLifecycleState {
  KEY_LIFECYCLE_STATE_UNSPECIFIED = 0;
  KEY_LIFECYCLE_STATE_ACTIVE = 1;       // eligible for selection
  KEY_LIFECYCLE_STATE_BLACKLISTED = 2;  // in cooldown until cooldown_until
}

message Error {
  // One of: invalid_request_error, authentication_error, permission_error,
  //         not_found_error, gateway_key_exhausted, gateway_provider_unavailable, api_error
  string type = 1;
  string message = 2;
  string request_id = 3;
}

// === PoolStatus ===

message PoolStatusRequest {
  RequestMeta meta = 1;
  // Optional filter; empty = all channels.
  repeated ProviderChannel channels = 2;
}

// Hash-only view of one pooled key. NEVER carries raw key material — only the
// kernel KeyFingerprint (a non-reversible hash) and lifecycle state (brief §5).
message PooledKeyStatus {
  string key_fingerprint = 1;          // hash-only; safe to log/return
  KeyLifecycleState state = 2;
  uint32 failure_count = 3;            // consecutive failures since last success/restore
  google.protobuf.Timestamp cooldown_until = 4; // set only when BLACKLISTED
}

message PoolStatus {
  ProviderChannel channel = 1;
  uint32 total_keys = 2;
  uint32 active_keys = 3;        // KeyPool::active_count at evaluation time
  uint32 blacklisted_keys = 4;
  // Soonest cooldown-restore across blacklisted keys; unset if none blacklisted.
  // The gateway returns this as Retry-After on a 503 gateway_key_exhausted (brief §10).
  google.protobuf.Timestamp soonest_restore = 5;
  repeated PooledKeyStatus keys = 6;
}

message PoolStatusResponse {
  repeated PoolStatus pools = 1;
  Error error = 2; // unset on success
}

// === KeyRefresh ===

message KeyRefreshRequest {
  RequestMeta meta = 1;
  // Which provider pool to refresh from owned-secret-provider-port.
  ProviderChannel channel = 2;
}

message KeyRefreshResponse {
  ProviderChannel channel = 1;
  uint32 keys_loaded = 2;
  google.protobuf.Timestamp refreshed_at = 3;
  string source = 4; // always "owned-secret-provider-port" (brief §5, §7 — never disk/env)
  Error error = 5;   // unset on success
}

// === GatewayStatus ===

message GatewayStatusRequest {
  RequestMeta meta = 1;
}

message GatewayStatusResponse {
  string status = 1; // ok | degraded | unavailable
  bool route_controller_ready = 2;
  bool model_inventory_ready = 3;
  bool credential_worker_ready = 4; // owned-secret-provider-port reachability + lease readiness
  bool policy_engine_ready = 5;     // owned-policy-engine-port decision readiness
  Error error = 6;                  // unset on success
}

// === AccountStatus ===

message AccountStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;          // empty = caller-authorized tenant set
  ProviderChannel channel = 3;   // unspecified = all channels
}

message AccountStatusItem {
  string tenant_id = 1;
  ProviderChannel channel = 2;
  string seat_id = 3;
  string state = 4; // authorized | active | cooldown | blacklisted
  google.protobuf.Timestamp cooldown_until = 5;
  double headroom_percent = 6;
}

message AccountStatusResponse {
  repeated AccountStatusItem accounts = 1;
  Error error = 2; // unset on success
}

// === AnalyticsSummary ===

message AnalyticsSummaryRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;   // empty = caller-authorized tenant set
  string window = 3;      // e.g. PT5M, PT1H, P1D
}

message AnalyticsSummaryResponse {
  string window = 1;
  uint64 request_count = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  double rate_limit_utilization_percent = 5;
  Error error = 6; // unset on success
}

// === ResumeCircuitBreaker ===

message ResumeCircuitBreakerRequest {
  RequestMeta meta = 1;
  string scope = 2;  // tenant/provider/model or GatewayCircuitBreaker resource name
  string reason = 3;
}

message ResumeCircuitBreakerResponse {
  string scope = 1;
  string status = 2; // resumed | unchanged
  google.protobuf.Timestamp resumed_at = 3;
  Error error = 4; // unset on success
}
