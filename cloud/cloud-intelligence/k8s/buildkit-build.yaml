# BuildKit Job that builds the cloud-intelligence image (per ADR-0381 D1).
# Context: the full git repo (workspace root) — the binary depends on workspace
# siblings. context-sub-path is empty (we want the root); the Dockerfile is at
# microservices/cloud-intelligence/Dockerfile, referenced via --opt filename=...
#
# Cache backend: SeaweedFS-on-Talos (ADR-0381 D4) on the shared
# oya-ci-buildkit-cache bucket. Cell-pinned (soft) to oya.cell/ci.
#
# Re-run: delete + re-apply (or bump the image tag in --output).
apiVersion: batch/v1
kind: Job
metadata:
  name: cloud-intelligence-image-build
  namespace: oya-ci
  labels:
    oya.adr/decided-by: ADR-0381-D1
    oya.microservice: cloud-intelligence
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/ci
                    operator: In
                    values: ["true"]
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      volumes:
        - name: cosign-key
          secret:
            secretName: cosign-key
            items:
              - key: cosign-key
                path: cosign-key
      containers:
        - name: buildctl
          image: moby/buildkit:v0.31.2-rootless
          workingDir: /workspace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              CONTEXT_URL="https://${GIT_USERNAME}:${GIT_PASSWORD}@github.com/jason931225/oyatie.git#refs/heads/dev"
              CACHE_PARAMS="type=s3,region=oya-local,bucket=oya-ci-buildkit-cache,endpoint_url=http://seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333,access_key_id=oya-ci-anon,secret_access_key=oya-ci-anon,use_path_style=true"
              buildctl --addr "tcp://buildkitd.oya-ci.svc.cluster.local:1234" \
                build \
                --frontend dockerfile.v0 \
                --opt "context=${CONTEXT_URL}" \
                --opt "filename=microservices/cloud-intelligence/Dockerfile" \
                --output "type=image,name=registry.oya-registry.svc.cluster.local:5000/cloud-intelligence:dev,push=true,registry.insecure=true" \
                --import-cache "${CACHE_PARAMS}" \
                --export-cache "${CACHE_PARAMS},mode=max" \
                --metadata-file=/tmp/buildkit-meta.json
              # Sign by digest, not tag — tag can be re-pointed after signing,
              # which would silently break the verification chain.
              DIGEST=$(jq -r '."containerimage.digest"' /tmp/buildkit-meta.json)
              # cosign is not present in moby/buildkit; download a pinned release.
              # cosign v3.1.2 linux/amd64 SHA256, taken from the upstream
              # cosign_checksums.txt for the v3.1.2 release AND independently
              # recomputed from the downloaded asset (both agree):
              #   f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
              #
              # Two-major bump from v2.4.1 (2024-10-03, ~22 months stale).
              #
              # WHAT A VERIFIER OF THESE SIGNATURES NEEDS — both conditions:
              #   1. cosign v3+. A v2 client cannot discover a v3 signature at
              #      all. Verified against a local registry with no egress:
              #      v2.4.1 and v2.5.0 both exit 10 "no signatures found" on a
              #      v3-signed image; v3.1.2 exits 0. (v3 writing its new bundle
              #      format is the likely mechanism, but what was PROVEN is the
              #      effect: the tag is written and a v2 client cannot read it.)
              #   2. `--insecure-ignore-tlog`. REQUIRED, not one option among
              #      several: signing below passes --tlog-upload=false, so no
              #      Rekor entry is ever written and NO amount of egress can
              #      produce one. `verify` requires an entry by default
              #      (--insecure-ignore-tlog defaults to false), so a v3 verifier
              #      WITHOUT this flag exits 1. Stating only "use v3+" would send
              #      someone straight into that failure.
              #
              # If the verifier ALSO has no egress, test one more thing before
              # relying on it: cosign 3.0.2 was reported to reach the sigstore
              # TUF CDN even for --key verification (sigstore/cosign#4550, whose
              # repro uses this exact sign invocation), which fails closed with
              # no egress. That issue is CLOSED by PR #4613 and has NOT been
              # re-verified against the v3.1.2 pinned here — so treat it as a
              # thing to check, not a known defect. The offline recipe, if it
              # does bite: --trusted-root <staged trusted_root.json> --offline=true.
              #
              # Security properties deliberately given up, so this is a decision
              # and not an accident: no transparency-log entry, so these
              # signatures cannot be publicly verified, and no signed timestamp,
              # so a signature cannot be bound to a point in time if this key is
              # later rotated or compromised. A defensible trade for in-cluster
              # signing with no egress. Only the tlog is a change from v2: the
              # v2 invocation passed no --timestamp-server-url (`cosign sign
              # --key oya-ci/cosign-key`, commit 33134e055) and trusted
              # timestamping is opt-in, so v2 produced no signed timestamp
              # either. --use-signing-config=false dropping the TSA path is the
              # likely mechanism for v3, not a verified one.
              #
              # `oya/intelligence/iac/helm/eval/baseline-store/values.yaml` pins
              # cosign v2.5.0 for a sidecar literally named cosignVerifier, and
              # configures rekorPublicLog/rekorMirror. It was NOT established to
              # verify these images; if it ever does, it fails FIRST at (1) —
              # exit 10, it cannot discover the signature at all — and would
              # then fail at (2) after a v3 bump, its rekor config having no
              # entry to find. Tracked F-SEC-COSIGN-VERIFIER-SKEW.
              #
              # v3 defaults to fetching a signing config from the sigstore TUF
              # repo, so `sign` fails closed without egress. The two flags below
              # restore offline keyed signing and must be given TOGETHER —
              # `--tlog-upload=false` alone is rejected as "not supported with
              # --signing-config or --use-signing-config". `--tlog-upload` is
              # DEPRECATED (not removed); the durable replacement is a
              # `--signing-config` file carrying no transparency-log service.
              # `--key` and `--yes` both still exist in v3.1.2.
              curl -fsSL -o /tmp/cosign \
                https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
              echo "f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf  /tmp/cosign" | sha256sum -c -
              chmod +x /tmp/cosign
              /tmp/cosign sign --use-signing-config=false --tlog-upload=false \
                --key oya-ci/cosign-key \
                "registry.oya-registry.svc.cluster.local:5000/cloud-intelligence@${DIGEST}"
          env:
            - name: GIT_USERNAME
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: username } }
            - name: GIT_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: token } }
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosign-key
                  key: password
                  optional: true
          volumeMounts:
            - name: cosign-key
              mountPath: /workspace/oya-ci
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "4Gi" }
