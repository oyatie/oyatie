# cloud-intelligence K8s deployment manifest — Namespace + ConfigMap +
# external secret-provider projection + Deployment + Service.
#
# Implementation status: kernel + rest adapter + app are 100%-Rust-implemented
# (crates/oya-cloud-intelligence-{kernel,rest,app}; ~5,600 LOC + 30 tests). This file
# wires the binary into the cluster.
#
# Reads (per crates/oya-cloud-intelligence-rest/src/main.rs):
#   - $GATEWAY_CONFIG — path to a ConfigMap-mounted JSON file (NO secrets).
#   - Secret-provider adapter credentials are projected by cloud-secrets/cloud-kms;
#     cloud-intelligence receives only opaque handles plus realm tokens.
#   - $ADMIN_TOKEN + $INGRESS_PROXY_KEYS — auth tokens from the same Secret.
#
# Provider API keys (OpenAI/Anthropic/Gemini) live behind owned cloud-secrets/
# cloud-kms handles (`secret-ref://` / `kms-ref://`) and are loaded through the
# secret-provider adapter at startup + on a periodic refresh.
#
# Cell affinity (ADR-0381 D2 preview; soft preference so single-node still
# schedules): tenant cell (this is a tenant-tier workload, not foundation/ci/
# storage).
---
apiVersion: v1
kind: Namespace
metadata:
  name: oya-cloud-intelligence
  labels:
    oya.io/cell: tenant
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Declarative non-secret config. Fill these in from your actual deployment;
# this is the wire-shape the rest adapter reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-intelligence-config
  namespace: oya-cloud-intelligence
data:
  config.json: |
    {
      "listen_addr": "0.0.0.0:8080",
      "secret_provider": {
        "port": "owned-secret-provider-port",
        "adapter": "cluster-secret-provider",
        "handle_scheme": ["secret-ref://", "kms-ref://"]
      },
      "key_refresh_secs": 300,
      "groups": [
        {
          "name": "openai",
          "channel": "openai",
          "upstream_base_url": "https://api.openai.com",
          "secret_handle": "secret-ref://cloud-intelligence/openai"
        },
        {
          "name": "anthropic",
          "channel": "anthropic",
          "upstream_base_url": "https://api.anthropic.com",
          "secret_handle": "secret-ref://cloud-intelligence/anthropic",
          "anthropic_version": "2023-06-01"
        },
        {
          "name": "gemini",
          "channel": "gemini",
          "upstream_base_url": "https://generativelanguage.googleapis.com",
          "secret_handle": "secret-ref://cloud-intelligence/gemini"
        }
      ]
    }
---
# ExternalSecret (per ADR-0043) projects adapter bootstrap tokens from the
# owned cloud-secrets/cloud-kms substrate into a k8s Secret named
# cloud-intelligence-secrets. Opaque handles are canonical; secret values never
# appear in this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloud-intelligence-secrets
  namespace: oya-cloud-intelligence
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: cloud-secrets-adapter
    kind: ClusterSecretStore
  target:
    name: cloud-intelligence-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-provider-token
      remoteRef:
        key: oya/cloud-intelligence/secret-provider-token
    - secretKey: admin-token
      remoteRef:
        key: oya/cloud-intelligence/admin-token
    - secretKey: ingress-proxy-keys
      remoteRef:
        key: oya/cloud-intelligence/ingress-proxy-keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-intelligence
  namespace: oya-cloud-intelligence
  labels:
    app: cloud-intelligence
    oya.microservice: cloud-intelligence
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-intelligence
  template:
    metadata:
      labels:
        app: cloud-intelligence
    spec:
      # ADR-0381 D2 soft cell affinity: prefer tenant pool when it exists.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/tenant
                    operator: In
                    values: ["true"]
      containers:
        - name: cloud-intelligence
          # Image is built via BuildKit (per ADR-0381 D1); operator runs the
          # build Job at microservices/cloud-intelligence/k8s/buildkit-build.yaml
          # (deferred until operator authorization — see microservices/llm-
          # gateway/k8s/BUILDKIT-JOB-TEMPLATE.md). Before first deploy, the
          # image must exist in the in-cluster registry.
          image: registry.oya-registry.svc.cluster.local:5000/cloud-intelligence:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GATEWAY_CONFIG
              value: "/etc/cloud-intelligence/config.json"
            - name: SECRET_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-intelligence-secrets
                  key: secret-provider-token
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-intelligence-secrets
                  key: admin-token
            - name: INGRESS_PROXY_KEYS
              valueFrom:
                secretKeyRef:
                  name: cloud-intelligence-secrets
                  key: ingress-proxy-keys
          volumeMounts:
            - name: config
              mountPath: /etc/cloud-intelligence
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532   # distroless:nonroot
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: cloud-intelligence-config
            items:
              - key: config.json
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-intelligence
  namespace: oya-cloud-intelligence
  labels:
    app: cloud-intelligence
spec:
  selector:
    app: cloud-intelligence
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-intelligence
  namespace: oya-cloud-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-intelligence
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
