apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-invoice-generation-time
  displayName: Cloud-billing invoice generation time
  labels:
    microservice: cloud-billing
    bounded_context: invoice-worker
    keystone_adr: ADR-0330
    quality_bar: industry-leader-uniform
spec:
  description: |
    Time from period close to invoice issuance per tenant. The unified industry-
    leader bar (Stripe Billing's posted invoicing SLO) is p99 ≤ 4 hours.
    Deployment-context overlays may add +1 hour for on-prem and colo where
    ERP-export round-trip applies.

    tenant_class does NOT stratify this number per ADR-0330 §B.9 quality-bar
    parity rule. demo_trial best-effort; paid contractual; both target same p99.
  service: cloud-billing
  indicator:
    metadata:
      name: invoice-generation-time
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_invoice_generation_seconds_bucket{le="14400"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_invoice_generation_seconds_count[5m]))
  objectives:
    - displayName: Invoice generated within 4 hours of period close
      target: 0.99
    - displayName: Invoice generated within 1 hour of period close
      target: 0.90
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-invoice-generation-pager
    - cloud-billing-invoice-generation-backpressure
