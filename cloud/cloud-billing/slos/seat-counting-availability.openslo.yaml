apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-seat-counting-availability
  displayName: Cloud-billing per-seat counting availability
  labels:
    microservice: cloud-billing
    bounded_context: seat-counter
    keystone_adr: ADR-0330
    billing_component: per_seat
spec:
  description: |
    Availability of the per_seat counter integration with cloud-iam. Monthly
    close reads active seat counts from cloud-iam; this SLO tracks the
    success rate of that read path.
  service: cloud-billing
  indicator:
    metadata:
      name: seat-counting-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_seat_count_read_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_seat_count_read_total[5m]))
  objectives:
    - displayName: Seat count read availability
      target: 0.9995
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-seat-counter-availability-pager
