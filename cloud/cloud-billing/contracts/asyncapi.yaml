asyncapi: 3.1.0
info:
  title: cloud-billing event surface
  version: "1.0.0"
  description: |
    cloud-billing event surface for inter-µservice consumption.

    Per ADR-0145 inter-µservice communication reform: direct gRPC + 3 invariants.
    The events listed here are emitted on the gRPC substrate; this AsyncAPI
    document is the canonical schema source for the event payloads.

    Per ADR-0263 every event seals into the audit-chain.
    Per ADR-0263 event class naming convention is lowercase dotted snake-case.
defaultContentType: application/json
servers:
  cloud-billing-event-bus:
    host: cloud-billing.internal.oyatie.com:50051
    protocol: grpc
    description: gRPC event substrate
channels:
  cloud_billing.usage.recorded:
    address: cloud_billing.usage.recorded
    description: Per-event ingest seal
    messages:
      UsageRecorded:
        $ref: "#/components/messages/UsageRecorded"
  cloud_billing.invoice.issued:
    address: cloud_billing.invoice.issued
    description: Per-invoice issuance seal
    messages:
      InvoiceIssued:
        $ref: "#/components/messages/InvoiceIssued"
  cloud_billing.invoice.voided:
    address: cloud_billing.invoice.voided
    description: Per-invoice void seal
    messages:
      InvoiceVoided:
        $ref: "#/components/messages/InvoiceVoided"
  cloud_billing.credit_memo.issued:
    address: cloud_billing.credit_memo.issued
    description: Per-credit-memo seal
    messages:
      CreditMemoIssued:
        $ref: "#/components/messages/CreditMemoIssued"
  cloud_billing.reservation.purchased:
    address: cloud_billing.reservation.purchased
    description: Per-reservation purchase seal
    messages:
      ReservationPurchased:
        $ref: "#/components/messages/ReservationPurchased"
  cloud_billing.reservation.converted:
    address: cloud_billing.reservation.converted
    description: Per-reservation conversion seal
    messages:
      ReservationConverted:
        $ref: "#/components/messages/ReservationConverted"
  cloud_billing.settlement.computed:
    address: cloud_billing.settlement.computed
    description: Monthly settlement statement seal
    messages:
      SettlementComputed:
        $ref: "#/components/messages/SettlementComputed"
  cloud_billing.settlement.payout_initiated:
    address: cloud_billing.settlement.payout_initiated
    description: Payout direction seal
    messages:
      PayoutInitiated:
        $ref: "#/components/messages/PayoutInitiated"
  cloud_billing.settlement.invoice_issued:
    address: cloud_billing.settlement.invoice_issued
    description: Collect direction seal
    messages:
      SettlementInvoiceIssued:
        $ref: "#/components/messages/SettlementInvoiceIssued"
  cloud_billing.settlement.clawback_netted:
    address: cloud_billing.settlement.clawback_netted
    description: Clawback netting seal
    messages:
      ClawbackNetted:
        $ref: "#/components/messages/ClawbackNetted"
  cloud_billing.tenant_class.transitioned:
    address: cloud_billing.tenant_class.transitioned
    description: demo_trial → paid conversion seal
    messages:
      TenantClassTransitioned:
        $ref: "#/components/messages/TenantClassTransitioned"
  cloud_billing.billing_components.mutated:
    address: cloud_billing.billing_components.mutated
    description: Composability mutation seal
    messages:
      BillingComponentsMutated:
        $ref: "#/components/messages/BillingComponentsMutated"
  cloud_billing.cap_breach.warning_emitted:
    address: cloud_billing.cap_breach.warning_emitted
    description: 80% cap threshold seal
    messages:
      CapBreachWarning:
        $ref: "#/components/messages/CapBreachWarning"
  cloud_billing.cap_breach.emitted:
    address: cloud_billing.cap_breach.emitted
    description: 100% cap-breach seal
    messages:
      CapBreachEmitted:
        $ref: "#/components/messages/CapBreachEmitted"
  cloud_billing.grace_window.expired:
    address: cloud_billing.grace_window.expired
    description: Grace expiry without conversion seal
    messages:
      GraceWindowExpired:
        $ref: "#/components/messages/GraceWindowExpired"
  cloud_billing.fx_lock.captured:
    address: cloud_billing.fx_lock.captured
    description: FX lock provenance seal
    messages:
      FxLockCaptured:
        $ref: "#/components/messages/FxLockCaptured"
  cloud_billing.focus_export.completed:
    address: cloud_billing.focus_export.completed
    description: FOCUS 1.1 export seal
    messages:
      FocusExportCompleted:
        $ref: "#/components/messages/FocusExportCompleted"
  cloud_billing.erp_export.completed:
    address: cloud_billing.erp_export.completed
    description: ERP export seal
    messages:
      ErpExportCompleted:
        $ref: "#/components/messages/ErpExportCompleted"
  cloud_billing.subscription.lifecycle_event:
    address: cloud_billing.subscription.lifecycle_event
    description: Subscription lifecycle seal
    messages:
      SubscriptionLifecycleEvent:
        $ref: "#/components/messages/SubscriptionLifecycleEvent"
operations:
  publishUsageRecorded:
    action: send
    channel: { $ref: "#/channels/cloud_billing.usage.recorded" }
  publishInvoiceIssued:
    action: send
    channel: { $ref: "#/channels/cloud_billing.invoice.issued" }
  publishTenantClassTransitioned:
    action: send
    channel: { $ref: "#/channels/cloud_billing.tenant_class.transitioned" }
  publishBillingComponentsMutated:
    action: send
    channel: { $ref: "#/channels/cloud_billing.billing_components.mutated" }
  publishCapBreachWarning:
    action: send
    channel: { $ref: "#/channels/cloud_billing.cap_breach.warning_emitted" }
  publishCapBreachEmitted:
    action: send
    channel: { $ref: "#/channels/cloud_billing.cap_breach.emitted" }
  publishGraceWindowExpired:
    action: send
    channel: { $ref: "#/channels/cloud_billing.grace_window.expired" }
  publishSettlementComputed:
    action: send
    channel: { $ref: "#/channels/cloud_billing.settlement.computed" }
  publishPayoutInitiated:
    action: send
    channel: { $ref: "#/channels/cloud_billing.settlement.payout_initiated" }
  publishFxLockCaptured:
    action: send
    channel: { $ref: "#/channels/cloud_billing.fx_lock.captured" }
  publishSubscriptionLifecycle:
    action: send
    channel: { $ref: "#/channels/cloud_billing.subscription.lifecycle_event" }
components:
  messages:
    UsageRecorded:
      name: UsageRecorded
      payload:
        type: object
        required: [event_id, tenant_id, tenant_class, billing_components, resource_id, region, metering_tag, kind, units, rate_card_ref, occurred_at, idempotency_key, audit_chain_hash]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          billing_components: { type: array, items: { type: string } }
          resource_id: { type: string }
          region: { type: string }
          metering_tag: { type: string }
          kind: { type: string }
          units: { type: array }
          rate_card_ref: { type: string }
          occurred_at: { type: string, format: date-time }
          idempotency_key: { type: string }
          audit_chain_hash: { type: string, format: byte }
          schema_version: { type: integer }
    InvoiceIssued:
      name: InvoiceIssued
      payload:
        type: object
        required: [invoice_id, tenant_id, total, period_start, period_end, issued_at, audit_chain_hash]
        properties:
          invoice_id: { type: string }
          tenant_id: { type: string }
          billing_components_snapshot: { type: array, items: { type: string } }
          period_start: { type: string, format: date-time }
          period_end: { type: string, format: date-time }
          subtotal_currency: { type: string }
          subtotal_minor_units: { type: integer, format: int64 }
          tax_currency: { type: string }
          tax_minor_units: { type: integer, format: int64 }
          total_currency: { type: string }
          total_minor_units: { type: integer, format: int64 }
          tax_invoice_format: { type: string }
          tax_registration_id: { type: string }
          issued_at: { type: string, format: date-time }
          due_at: { type: string, format: date-time }
          pdf_object_ref: { type: string }
          audit_chain_hash: { type: string, format: byte }
          signature: { type: string, format: byte }
    InvoiceVoided:
      name: InvoiceVoided
      payload:
        type: object
        required: [invoice_id, tenant_id, voided_at, reason, audit_chain_hash]
        properties:
          invoice_id: { type: string }
          tenant_id: { type: string }
          voided_at: { type: string, format: date-time }
          reason: { type: string }
          credit_memo_id: { type: string, nullable: true }
          audit_chain_hash: { type: string, format: byte }
    CreditMemoIssued:
      name: CreditMemoIssued
      payload:
        type: object
        required: [credit_memo_id, tenant_id, amount, reason, issued_at, audit_chain_hash]
        properties:
          credit_memo_id: { type: string }
          tenant_id: { type: string }
          amount_currency: { type: string }
          amount_minor_units: { type: integer, format: int64 }
          reason: { type: string }
          original_invoice_id: { type: string, nullable: true }
          issued_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    ReservationPurchased:
      name: ReservationPurchased
      payload:
        type: object
        properties:
          reservation_id: { type: string }
          tenant_id: { type: string }
          workload_kind: { type: string }
          region: { type: string }
          commitment_units: { type: integer, format: int64 }
          commitment_period_start: { type: string, format: date-time }
          commitment_period_end: { type: string, format: date-time }
          commitment_currency: { type: string }
          commitment_minor_units: { type: integer, format: int64 }
          discount_pct: { type: number }
          purchased_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    ReservationConverted:
      name: ReservationConverted
      payload:
        type: object
        properties:
          reservation_id: { type: string }
          tenant_id: { type: string }
          converted_at: { type: string, format: date-time }
          previous_state: { type: string }
          new_state: { type: string }
          audit_chain_hash: { type: string, format: byte }
    SettlementComputed:
      name: SettlementComputed
      payload:
        type: object
        properties:
          statement_id: { type: string }
          tenant_id: { type: string }
          contract_id: { type: string }
          settlement_window_start: { type: string, format: date-time }
          settlement_window_end: { type: string, format: date-time }
          direction: { type: string, enum: [oyatie_pays, oyatie_collects] }
          gross_currency: { type: string }
          gross_minor_units: { type: integer, format: int64 }
          commission_rate: { type: number }
          commission_minor_units: { type: integer, format: int64 }
          fx_adjustment_minor: { type: integer, format: int64 }
          clawback_minor: { type: integer, format: int64 }
          net_currency: { type: string }
          net_minor_units: { type: integer, format: int64 }
          audit_chain_hash: { type: string, format: byte }
    PayoutInitiated:
      name: PayoutInitiated
      payload:
        type: object
        properties:
          statement_id: { type: string }
          tenant_id: { type: string }
          payment_method_ref: { type: string }
          amount_currency: { type: string }
          amount_minor_units: { type: integer, format: int64 }
          initiated_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    SettlementInvoiceIssued:
      name: SettlementInvoiceIssued
      payload:
        type: object
        properties:
          statement_id: { type: string }
          tenant_id: { type: string }
          invoice_id: { type: string }
          amount_currency: { type: string }
          amount_minor_units: { type: integer, format: int64 }
          issued_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    ClawbackNetted:
      name: ClawbackNetted
      payload:
        type: object
        properties:
          reversal_id: { type: string }
          original_event_id: { type: string }
          settlement_statement_id: { type: string }
          reversal_currency: { type: string }
          reversal_minor_units: { type: integer, format: int64 }
          reversal_reason: { type: string }
          reversed_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    TenantClassTransitioned:
      name: TenantClassTransitioned
      payload:
        type: object
        required: [tenant_id, from_class, to_class, transitioned_at, audit_chain_hash]
        properties:
          tenant_id: { type: string }
          from_class: { type: string, enum: [demo_trial, paid] }
          to_class: { type: string, enum: [demo_trial, paid] }
          contract_id: { type: string, nullable: true }
          initial_billing_components: { type: array, items: { type: string } }
          deployment_context: { type: string }
          transitioned_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    BillingComponentsMutated:
      name: BillingComponentsMutated
      payload:
        type: object
        required: [tenant_id, op, component, from_set, to_set, contract_amendment_id, mutated_at, audit_chain_hash]
        properties:
          tenant_id: { type: string }
          op: { type: string, enum: [add, remove] }
          component: { type: string, enum: [revenue_share, per_seat, per_usage] }
          from_set: { type: array, items: { type: string } }
          to_set: { type: array, items: { type: string } }
          contract_amendment_id: { type: string }
          settlement_event_ids: { type: array, items: { type: string }, description: "settlement events triggered by mutation, when removing a component" }
          mutated_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    CapBreachWarning:
      name: CapBreachWarning
      payload:
        type: object
        properties:
          tenant_id: { type: string }
          cap_kind: { type: string }
          current_value: { type: integer, format: int64 }
          ceiling_value: { type: integer, format: int64 }
          threshold_pct: { type: number, default: 80 }
          warned_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    CapBreachEmitted:
      name: CapBreachEmitted
      payload:
        type: object
        properties:
          tenant_id: { type: string }
          cap_kind: { type: string }
          current_value: { type: integer, format: int64 }
          ceiling_value: { type: integer, format: int64 }
          breached_at: { type: string, format: date-time }
          grace_window_expires_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    GraceWindowExpired:
      name: GraceWindowExpired
      payload:
        type: object
        properties:
          tenant_id: { type: string }
          grace_window_started_at: { type: string, format: date-time }
          expired_at: { type: string, format: date-time }
          suspension_kind: { type: string, default: "read-only-during-retention" }
          retention_expires_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    FxLockCaptured:
      name: FxLockCaptured
      payload:
        type: object
        properties:
          lock_id: { type: string }
          base_currency: { type: string }
          quote_currency: { type: string }
          rate: { type: number }
          feed_source: { type: string }
          feed_fetched_at: { type: string, format: date-time }
          feed_value_hash: { type: string, format: byte }
          audit_chain_hash: { type: string, format: byte }
    FocusExportCompleted:
      name: FocusExportCompleted
      payload:
        type: object
        properties:
          job_id: { type: string }
          tenant_id: { type: string }
          period_start: { type: string, format: date-time }
          period_end: { type: string, format: date-time }
          object_ref: { type: string }
          completed_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    ErpExportCompleted:
      name: ErpExportCompleted
      payload:
        type: object
        properties:
          job_id: { type: string }
          tenant_id: { type: string }
          connector_kind: { type: string }
          period_start: { type: string, format: date-time }
          period_end: { type: string, format: date-time }
          completed_at: { type: string, format: date-time }
          audit_chain_hash: { type: string, format: byte }
    SubscriptionLifecycleEvent:
      name: SubscriptionLifecycleEvent
      payload:
        type: object
        properties:
          event_id: { type: string }
          subscription_id: { type: string }
          tenant_id: { type: string }
          event_kind: { type: string, enum: [created, plan_changed, paused, resumed, canceled] }
          occurred_at: { type: string, format: date-time }
          payload: { type: object }
          audit_chain_hash: { type: string, format: byte }
