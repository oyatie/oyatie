# US-Government regional pack sovereign cloud overlay (ADR-0179).
# Awaiting regulator sign-off per registry/sovereign-cloud/per-pack-overlay-status.tsv.
authored: 2026-05-18
authority: ADR-0179
schema: /specs/sovereign-cloud-overlays.json

pack_id: us-government

primary_provider:
  id: aws-gov
  regions:
    - us-gov-west-1
    - us-gov-east-1
  certifications:
    - FedRAMP-High
    - DoD-IL5
    - ITAR
    - CJIS
    - HIPAA-BAA
    - SOC-2-TYPE-2
  contract_id: AWS-GOV-2026-001
  sla_minimum_availability: 99.99
  data_residency_guarantee: us-only-cleared-personnel-only
  notes: |
    AWS GovCloud (US-West + US-East). Primary US-Gov sovereign substrate
    operated by US-citizen personnel under FedRAMP-High authorization.

secondary_provider:
  id: azure-government
  regions:
    - usgovvirginia
    - usgovarizona
  certifications:
    - FedRAMP-High
    - DoD-IL5
    - ITAR
    - CJIS
    - HIPAA-BAA
  contract_id: AZURE-GOV-2026-001
  sla_minimum_availability: 99.99
  data_residency_guarantee: us-only-cleared-personnel-only
  notes: |
    Azure Government regions. Used for DR + secondary substrate per
    ADR-0180 T1+T2 tier.

sovereign_data_classes:
  - CUI                          # Controlled Unclassified Information
  - ITAR_CONTROLLED              # ITAR-controlled technical data
  - CJIS_RECORD                  # Criminal Justice Information Services
  - PHI_HIPAA                    # Protected Health Information per HIPAA
  - FED_AGENCY_INTERNAL          # Federal agency internal records
  - DOD_IL4_DATA                 # DoD Impact Level 4 data
  - DOD_IL5_DATA                 # DoD Impact Level 5 data

non_sovereign_data_class_fallbacks:
  - provider: aws
    regions:
      - us-east-1
      - us-west-2
    data_classes:
      - PUBLIC
      - ANONYMIZED

prohibited_egress:
  - data_class: CUI
    to_provider: '*non-fedramp-high*'
  - data_class: ITAR_CONTROLLED
    to_provider: '*non-fedramp-high*'
  - data_class: CJIS_RECORD
    to_provider: '*non-fedramp-high*'
  - data_class: PHI_HIPAA
    to_provider: '*non-hipaa-baa*'
  - data_class: FED_AGENCY_INTERNAL
    to_provider: '*non-fedramp-high*'
  - data_class: DOD_IL4_DATA
    to_provider: '*non-fedramp-high*'
  - data_class: DOD_IL5_DATA
    to_provider: '*non-il5*'

audit_cadence: quarterly
regulator_pack_evidence_cadence: quarterly

regulator_engagement_calendar:
  - regulator: GSA FedRAMP PMO
    cadence: quarterly
  - regulator: DoD DISA (IL5)
    cadence: quarterly
  - regulator: State Dept (ITAR)
    cadence: semi-annual
  - regulator: HHS OCR (HIPAA)
    cadence: annual
  - regulator: FBI CJIS
    cadence: annual

sustainability:
  primary_provider_pue: 1.21
  secondary_provider_pue: 1.18
  carbon_intensity_g_co2_per_kwh: 386  # US-Gov regions weighted avg 2025
