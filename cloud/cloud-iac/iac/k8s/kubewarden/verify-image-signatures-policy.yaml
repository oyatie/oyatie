apiVersion: policies.kubewarden.io/v1
kind: ClusterAdmissionPolicy
metadata:
  name: oya-verify-signed-images
  labels:
    app.kubernetes.io/name: oya-verify-signed-images
    app.kubernetes.io/part-of: oya-cloud-iac
    oyatie.com/admission-default: kubewarden
    oyatie.com/kyverno-adapter-parity: first-class
  annotations:
    oyatie.com/change-id: CS-CLOUD-IAC-KUBEWARDEN-ADMISSION-POLICY-GATE-001
    oyatie.com/non-claim: no-cosign-call-no-kubernetes-api-no-admission-execution
spec:
  module: registry://ghcr.io/kubewarden/policies/verify-image-signatures:v0.3.0
  policyServer: oya-kubewarden-default
  mutating: true
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
  settings:
    modifyImagesWithDigest: true
    signatures:
      - image: ghcr.io/oyatie/*
        githubActions:
          owner: jason931225
          repo: oyatie
          issuer: https://token.actions.githubusercontent.com
          rekor: https://rekor.sigstore.dev
