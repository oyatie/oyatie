# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
helm-controller:
  image:
    registry: ghcr.io
    repository: fluxcd/helm-controller
    tag: "v1.0.1"  # LTS pin
  # capacity-model.md XS tier: 2 replicas HA min
  replicaCount: 2
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "1", memory: "2Gi"}
  serviceMonitor:
    enabled: true
  args:
    - --concurrent=10
    - --kube-api-qps=100
    - --kube-api-burst=200
    - --log-level=info
  serviceAccount:
    create: true
    name: helm-controller
  rbac:
    create: true
    namespaceScoped: true  # per iac-isolation.md ISO-02
