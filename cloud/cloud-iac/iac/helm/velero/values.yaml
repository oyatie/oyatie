# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
#
# Velero values per ADR-0197 backup canonical.
# Verified versions (2026-05-18):
#   - Velero 1.18.0 — Apache 2.0 — https://github.com/velero-io/velero/releases
#   - velero-plugin-for-aws 1.14.0 (S3-compatible; targets SeaweedFS)
velero:
  image:
    repository: velero/velero
    tag: "v1.18.0"

  # ---- plugins ----
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.0
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # ---- backup storage location: SeaweedFS S3 (per ADR-0196) ----
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: oya-velero-backup-shared-prod
        config:
          region: oya-on-prem
          # SeaweedFS S3 endpoint (per ADR-0196)
          s3Url: http://oya-cloud-iac-seaweedfs-s3.cloud-iac.svc.cluster.local:8333
          s3ForcePathStyle: "true"
          # Server-side encryption via age (per ADR-0197 §Encryption)
          # Velero-level encryption is delegated to the age-encryption sidecar;
          # bucket-level KMS handled by SeaweedFS (KMS key ref via OpenBao)
          kmsKeyId: openbao://secret/cloud-iac/velero/kms-key-ref
        credential:
          name: velero-credentials
          key: cloud
    volumeSnapshotLocation:
      - name: default
        provider: aws
        config:
          region: oya-on-prem
    # Use the kopia (filesystem backup) uploader — modern replacement for restic in Velero
    uploaderType: kopia
    # Default backup TTL — regulatory packs override
    defaultBackupTTL: "720h"  # 30 days; retention policy lives in Schedule CRDs
    defaultVolumesToFsBackup: true
    features: EnableCSI

  # ---- secret (S3 credentials sourced from OpenBao) ----
  credentials:
    useSecret: true
    existingSecret: velero-openbao-s3
    # The OpenBao operator projects this secret with format:
    #   cloud = [default]\naws_access_key_id=...\naws_secret_access_key=...

  # ---- schedules: app / batch / regulatory tiers per ADR-0197 ----
  schedules:
    # App tier: RPO ≤ 15 min, RTO ≤ 1 h
    app-tier-hourly:
      disabled: false
      schedule: "0 * * * *"
      template:
        ttl: "168h"  # 7 days hourly
        includedNamespaces:
          - "*-app-*"
        labelSelector:
          matchLabels:
            oya.io/backup-tier: app
        storageLocation: default
        volumeSnapshotLocations:
          - default
    app-tier-daily:
      disabled: false
      schedule: "0 2 * * *"
      template:
        ttl: "720h"  # 30 days daily
        includedNamespaces:
          - "*-app-*"
        labelSelector:
          matchLabels:
            oya.io/backup-tier: app
        storageLocation: default
    # Batch tier: RPO ≤ 1 h, RTO ≤ 4 h
    batch-tier-daily:
      disabled: false
      schedule: "0 3 * * *"
      template:
        ttl: "720h"
        includedNamespaces:
          - "*-batch-*"
        labelSelector:
          matchLabels:
            oya.io/backup-tier: batch
        storageLocation: default
    # Regulatory tier: full retention per ADR-0162 + ADR-0240-sovereign + regional-pack
    regulatory-tier-daily:
      disabled: false
      schedule: "0 4 * * *"
      template:
        ttl: "61320h"  # 7 years daily (default; pack overlay overrides)
        includedNamespaces:
          - "*-regulatory-*"
          - "audit-chain"
        labelSelector:
          matchLabels:
            oya.io/backup-tier: regulatory
        storageLocation: default

  # ---- deploy node-agent DaemonSet for filesystem PV backup ----
  deployNodeAgent: true
  nodeAgent:
    resources:
      requests: {cpu: "500m", memory: "512Mi"}
      limits:   {cpu: "2",    memory: "2Gi"}

  # ---- service monitor ----
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ---- canonical labels ----
microservice: cloud-iac
boundedContext: backup
tier: M
plane: control
partOf: oya-cloud-iac

# ---- cost-attribution labels per ADR-0199 ----
costAttribution:
  costCenter: "infra-backup"
  workloadClass: "batch"

# ---- canonical helm library ----
oya-helpers:
  enabled: true
