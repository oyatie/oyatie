apiVersion: v2
name: flagger
description: |
  Flagger 1.x progressive-delivery controller chart (ADR-0160).
  Canary / blue-green / A/B-mirroring controller integrated with Istio mesh (ADR-0148),
  ArgoCD (ADR-0121), and SLO-gated promotion (ADR-0139). Per-cell deployment.
type: application
version: 1.0.0
appVersion: "1.36.0"
kubeVersion: ">=1.27.0"
keywords:
  - progressive-delivery
  - canary
  - blue-green
  - flagger
  - slo-gated
  - flux
home: https://fluxcd.io/flagger/
sources:
  - https://github.com/fluxcd/flagger
maintainers:
  - name: axis-cloud-k8s
    email: axis-cloud-k8s@oyatie.internal
icon: https://fluxcd.io/img/flagger-logo.png
annotations:
  oyatie.adr: "ADR-0160"
  oyatie.related-adrs: "ADR-0114, ADR-0121, ADR-0139, ADR-0148"
  oyatie.layer: "Layer-1-substrate"
  oyatie.scope: "per-cell"
  artifacthub.io/category: "delivery"
dependencies:
  - name: kube-prometheus-stack
    version: ">=55.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
    tags:
      - observability
