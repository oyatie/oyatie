# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-kr residency + retention + replicas.
# Per policy/data-residency.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/postgresql/primary/persistence/size
        value: "200Gi"   # pack-kr M01 launch — moderate baseline
    target:
      kind: HelmRelease
      name: postgres

  - patch: |-
      - op: replace
        path: /spec/values/citus/coordinator/extendedConfiguration
        value: |
          shared_preload_libraries = 'citus,pg_stat_statements'
          row_security = on
          force_row_level_security = on
          citus.shard_count = 32                # XS tier
          citus.shard_replication_factor = 2
    target:
      kind: HelmRelease
      name: citus

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=KR
      - OCI_KMS_ENDPOINT=https://kms.ap-seoul-1.oraclecloud.com
      - OPENBAO_URL=https://openbao.pack-kr.oyatie.dev
      - PATRONI_DCS_HOSTS=etcd-0.etcd.tenancy.svc:2379,etcd-1.etcd.tenancy.svc:2379,etcd-2.etcd.tenancy.svc:2379
      - LEGAL_SLA_RETENTION_YEARS=5  # KR commercial code + pack-kr regulatory minimum
