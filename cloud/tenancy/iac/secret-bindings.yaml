# tenancy µservice — Secret bindings per ADR-0296 + ADR-0255 §D-4 (provider-credential BYOK)
apiVersion: oyatie.io/secrets/v1
kind: SecretBindings
metadata:
  name: tenancy-bindings
  microservice: tenancy
spec:
  bindings:
    - name: rls-jwt-signing-key
      openbao_path: "secret/{tenant_id}/tenancy/rls-jwt-signing-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/tenancy/isolation-policy-emitter
    - name: kyb-kyc-encryption-key
      openbao_path: "secret/{tenant_id}/tenancy/kyb-kyc-encryption-key"
      kind: aes-256-gcm
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/tenancy/kyb-kyc-verifier
    - name: dr-coord-key
      openbao_path: "secret/{tenant_id}/tenancy/dr-coord-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/tenancy/lifecycle-controller
        - spiffe://oyatie/tenancy/cell-assignment-controller
  provider_credential_mode: tenant_byok
  encryption_credential_mode: tenant_byok
