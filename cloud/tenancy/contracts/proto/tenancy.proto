// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-tenancy — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/tenancy.yaml.
// Per Bominal ADR-0018 + ADR-0139 + ADR-0131.

syntax = "proto3";

package oya.tenancy.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =========================================================================
// Service: TenantLifecycle
// =========================================================================
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata key "x-tenant-id" = "tenant:<hashed-id>" must
//          match the JWT claim for tenant-scoped operations.

service TenantLifecycle {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc SuspendTenant(SuspendTenantRequest) returns (Tenant);
  rpc ResumeTenant(ResumeTenantRequest) returns (Tenant);
  rpc DeleteTenant(DeleteTenantRequest) returns (DsrRequest);
  rpc StreamTenantLifecycleEvents(StreamTenantLifecycleEventsRequest) returns (stream TenantLifecycleEvent);
}

// =========================================================================
// Service: IsolationPolicy
// =========================================================================

service IsolationPolicy {
  rpc IssueJwt(IssueJwtRequest) returns (IssuedJwt);
  rpc VerifyJwt(VerifyJwtRequest) returns (JwtVerification);
  rpc ListRlsPolicies(ListRlsPoliciesRequest) returns (ListRlsPoliciesResponse);
  rpc GetJwtPublicKeyFingerprints(google.protobuf.Empty) returns (JwtFingerprintList);
}

// =========================================================================
// Service: CellAssignment
// =========================================================================

service CellAssignment {
  rpc GetCellAssignment(GetCellAssignmentRequest) returns (CellAssignment);
  rpc ListCellHealth(ListCellHealthRequest) returns (ListCellHealthResponse);
}

// =========================================================================
// Service: DsrCascade
// =========================================================================

service DsrCascade {
  rpc SubmitDsrRequest(SubmitDsrRequestRequest) returns (DsrRequest);
  rpc GetDsrRequest(GetDsrRequestRequest) returns (DsrRequest);
  rpc GetProofOfErasure(GetProofOfErasureRequest) returns (ProofOfErasure);
  rpc StreamDsrEvents(StreamDsrEventsRequest) returns (stream DsrCascadeEvent);
}

// =========================================================================
// Common types
// =========================================================================

enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_CREATED = 1;
  TENANT_STATUS_ACTIVATED = 2;
  TENANT_STATUS_SUSPENDED = 3;
  TENANT_STATUS_DELETION_REQUESTED = 4;
  TENANT_STATUS_DELETED = 5;
}

enum JurisdictionCode {
  JURISDICTION_CODE_UNSPECIFIED = 0;
  JURISDICTION_CODE_KR = 1;
  JURISDICTION_CODE_EU = 2;
  JURISDICTION_CODE_US = 3;
  JURISDICTION_CODE_US_HC = 4;
  JURISDICTION_CODE_JP = 5;
  JURISDICTION_CODE_SG = 6;
  JURISDICTION_CODE_AU = 7;
  JURISDICTION_CODE_IN = 8;
  JURISDICTION_CODE_BR = 9;
  JURISDICTION_CODE_AE = 10;
  JURISDICTION_CODE_KSA = 11;
}

enum PlanTier {
  PLAN_TIER_UNSPECIFIED = 0;
  PLAN_TIER_TRIAL = 1;
  PLAN_TIER_PRODUCTION = 2;
  PLAN_TIER_SANDBOX = 3;
  PLAN_TIER_INTERNAL = 4;
}

enum DsrRequestType {
  DSR_REQUEST_TYPE_UNSPECIFIED = 0;
  DSR_REQUEST_TYPE_RIGHT_TO_ERASURE = 1;
  DSR_REQUEST_TYPE_RIGHT_TO_RECTIFICATION = 2;
  DSR_REQUEST_TYPE_RIGHT_TO_ACCESS = 3;
  DSR_REQUEST_TYPE_RIGHT_TO_PORTABILITY = 4;
  DSR_REQUEST_TYPE_RIGHT_TO_RESTRICTION = 5;
}

enum DsrStatus {
  DSR_STATUS_UNSPECIFIED = 0;
  DSR_STATUS_SUBMITTED = 1;
  DSR_STATUS_IN_PROGRESS = 2;
  DSR_STATUS_COMPLETED = 3;
  DSR_STATUS_ABORTED = 4;
}

message Tenant {
  string tenant_id = 1;
  TenantStatus status = 2;
  JurisdictionCode jurisdiction_code = 3;
  string pack = 4;
  PlanTier plan_tier = 5;
  string cell_id = 6;
  int64 shard_key = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp activated_at = 9;
  google.protobuf.Timestamp suspended_at = 10;
  google.protobuf.Timestamp deletion_requested_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

message DsrRequest {
  string dsr_id = 1;
  string tenant_id = 2;
  DsrRequestType request_type = 3;
  google.protobuf.Timestamp requested_at = 4;
  Requester requester = 5;
  DsrStatus status = 6;
  google.protobuf.Timestamp legal_sla_deadline = 7;
  int32 receipts_expected = 8;
  int32 receipts_received = 9;
  string proof_of_erasure_id = 10;
}

message Requester {
  string principal = 1;
  string principal_type = 2;  // tenant_operator | platform_operator | dpo | regulator
}

message ErasureReceipt {
  string microservice = 1;
  string tenant_id = 2;
  string dsr_id = 3;
  repeated string data_classes_erased = 4;
  repeated ResidualDataBasis residual_data_basis = 5;
  google.protobuf.Timestamp signed_at = 6;
  string signature = 7;
}

message ResidualDataBasis {
  string basis = 1;  // legal_hold | statutory_retention | technical_dependency
  string reference = 2;
}

message ProofOfErasure {
  string dsr_id = 1;
  string merkle_root = 2;
  google.protobuf.Timestamp sealed_at = 3;
  int32 microservices_count = 4;
  repeated ErasureReceipt receipts = 5;
  string signature = 6;
}

message CellAssignment {
  string tenant_id = 1;
  string cell_id = 2;
  int64 shard_key = 3;
  string pack = 4;
  string cell_health = 5;   // healthy | degraded | unhealthy
  double load_pct = 6;
}

message RlsPolicy {
  string table = 1;
  string policy_name = 2;
  string predicate = 3;
  bool force_rls = 4;
  string data_class = 5;
  string owner_microservice = 6;
  google.protobuf.Timestamp installed_at = 7;
}

message IssuedJwt {
  string jwt = 1;
  string kid = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message JwtVerification {
  bool valid = 1;
  string tenant_id = 2;
  string pack = 3;
  google.protobuf.Timestamp expires_at = 4;
  string verifier_fingerprint = 5;
}

message JwtFingerprintList {
  repeated JwtFingerprint fingerprints = 1;
}

message JwtFingerprint {
  string kid = 1;
  string fingerprint = 2;
  string pack = 3;
  string environment = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool revoked = 7;
}

message TenantLifecycleEvent {
  string event_type = 1;  // TenantCreated | TenantActivated | TenantSuspended | TenantResumed | TenantDeletionRequested | TenantDeletionCompleted
  Tenant tenant = 2;
  google.protobuf.Timestamp event_at = 3;
}

message DsrCascadeEvent {
  string event_type = 1;  // DsrSubmitted | ReceiptReceived | DsrCompleted
  string dsr_id = 2;
  string microservice = 3;
  google.protobuf.Timestamp event_at = 4;
}

// =========================================================================
// Request / response
// =========================================================================

message CreateTenantRequest {
  JurisdictionCode jurisdiction_code = 1;
  PlanTier plan_tier = 2;
  bool consent_to_dpa = 3;
  bool child_data_attested = 4;
  bool phi_baa_signed = 5;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message ListTenantsRequest {
  JurisdictionCode jurisdiction_code = 1;
  TenantStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

message SuspendTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message ResumeTenantRequest {
  string tenant_id = 1;
}

message DeleteTenantRequest {
  string tenant_id = 1;
  string operator_attestation = 2;
  string secondary_signer = 3;  // 2-person rule
}

message StreamTenantLifecycleEventsRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp since = 2;
}

message IssueJwtRequest {
  string tenant_id = 1;
  string principal_type = 2;  // tenant_operator | customer_application | platform_operator
}

message VerifyJwtRequest {
  string jwt = 1;
}

message ListRlsPoliciesRequest {
  string tenant_id = 1;
  string table = 2;
}

message ListRlsPoliciesResponse {
  repeated RlsPolicy policies = 1;
}

message GetCellAssignmentRequest {
  string tenant_id = 1;
}

message ListCellHealthRequest {
  string pack = 1;
}

message ListCellHealthResponse {
  repeated CellAssignment cells = 1;
}

message SubmitDsrRequestRequest {
  string tenant_id = 1;
  DsrRequestType request_type = 2;
  Requester requester = 3;
}

message GetDsrRequestRequest {
  string dsr_id = 1;
}

message GetProofOfErasureRequest {
  string dsr_id = 1;
}

message StreamDsrEventsRequest {
  string dsr_id = 1;
}
