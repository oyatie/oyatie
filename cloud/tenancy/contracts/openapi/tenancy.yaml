openapi: 3.2.0
info:
  title: oya-tenancy
  version: 1.0.0
  summary: REST API for the tenancy µservice — tenant lifecycle CRUD, isolation-policy query, DSR submission, cell-assignment read
  description: |
    Tenant-operator-facing and platform-operator-facing REST surface for the tenancy
    substrate. All endpoints require OIDC + Cedar policy authorization
    (per `microservices/tenancy/policy/*.cedar`) and most are tenant-scoped via
    the JWT `tenant_id` claim.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries the principal's tenant_id claim. Tenant-scoped reads MUST
    match own tenant; platform-operator paths require JIT elevation via OpenBao.
  contact:
    name: axis-tenancy
    url: https://oyatie.com/teams/axis-tenancy
  license:
    name: Internal

servers:
  - url: https://tenancy-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: tenancy
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    TenantIdParam:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/rls-isolation.md`
    DsrIdParam:
      in: path
      name: dsr_id
      required: true
      schema:
        type: string
        pattern: '^dsr-[A-Z0-9]{26}$'
      description: ULID DSR request id
    EnvironmentTierParam:
      in: path
      name: tier
      required: true
      schema: {$ref: '#/components/schemas/EnvironmentTier'}
      description: 'ADR-0163 tenant environment tier: test, staging, or prod.'
    ProdDestructiveAckHeader:
      in: header
      name: x-oya-prod-destructive-ack
      required: false
      schema:
        type: string
        enum: ['true']
      description: >-
        Required only for prod-tier destructive operations. The API boundary maps this
        header to Cedar context `prod_destructive_acknowledged: true` and audit-chain
        seal metadata; non-prod requests MUST NOT use it to bypass tier isolation.
  schemas:
    Tenant:
      type: object
      required: [tenant_id, status, jurisdiction_code, plan_tier, created_at, cell_id]
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        status:
          type: string
          enum: [Created, Activated, Suspended, DeletionRequested, Deleted]
        jurisdiction_code:
          type: string
          enum: [KR, EU, US, US-HC, JP, SG, AU, IN, BR, AE, KSA]
        pack:
          type: string
          enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
        plan_tier:
          type: string
          enum: [trial, production, sandbox, internal]
        cell_id: {type: string, format: uuid}
        shard_key: {type: integer}
        created_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time, nullable: true}
        suspended_at: {type: string, format: date-time, nullable: true}
        deletion_requested_at: {type: string, format: date-time, nullable: true}
        deleted_at: {type: string, format: date-time, nullable: true}
    CreateTenantRequest:
      type: object
      required: [jurisdiction_code, plan_tier]
      properties:
        jurisdiction_code: {type: string, enum: [KR, EU, US, US-HC, JP, SG, AU, IN, BR, AE, KSA]}
        plan_tier: {type: string, enum: [trial, production, sandbox, internal]}
        operator_attestation:
          type: object
          properties:
            consent_to_dpa: {type: boolean}
            child_data_attested: {type: boolean}
            phi_baa_signed: {type: boolean, nullable: true}
    DsrRequest:
      type: object
      required: [dsr_id, tenant_id, requested_at, requester, request_type, status]
      properties:
        dsr_id: {type: string, pattern: '^dsr-[A-Z0-9]{26}$'}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        request_type:
          type: string
          enum: [right_to_erasure, right_to_rectification, right_to_access, right_to_portability, right_to_restriction]
        requested_at: {type: string, format: date-time}
        requester:
          type: object
          properties:
            principal: {type: string}
            principal_type: {type: string, enum: [tenant_operator, platform_operator, dpo, regulator]}
        status:
          type: string
          enum: [Submitted, InProgress, Completed, Aborted]
        legal_sla_deadline: {type: string, format: date-time}
        receipts_expected: {type: integer}
        receipts_received: {type: integer}
        proof_of_erasure_id: {type: string, nullable: true}
    ErasureReceipt:
      type: object
      required: [microservice, tenant_id, data_classes_erased, signed_at, signature]
      properties:
        microservice: {type: string}
        tenant_id: {type: string}
        data_classes_erased:
          type: array
          items: {type: string}
        residual_data_basis:
          type: array
          items:
            type: object
            properties:
              basis: {type: string, enum: [legal_hold, statutory_retention, technical_dependency]}
              reference: {type: string}
        signed_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 signature by emitting µservice SPIFFE identity}
    ProofOfErasure:
      type: object
      required: [dsr_id, merkle_root, sealed_at, microservices_count, signature]
      properties:
        dsr_id: {type: string}
        merkle_root: {type: string}
        sealed_at: {type: string, format: date-time}
        microservices_count: {type: integer}
        receipts:
          type: array
          items: {$ref: '#/components/schemas/ErasureReceipt'}
        signature: {type: string}
    CellAssignment:
      type: object
      required: [tenant_id, cell_id, shard_key, pack]
      properties:
        tenant_id: {type: string}
        cell_id: {type: string, format: uuid}
        shard_key: {type: integer}
        pack: {type: string}
        cell_health: {type: string, enum: [healthy, degraded, unhealthy]}
        load_pct: {type: number, minimum: 0, maximum: 100}
    RlsPolicy:
      type: object
      required: [table, predicate, force_rls, installed_at]
      properties:
        table: {type: string}
        policy_name: {type: string}
        predicate: {type: string}
        force_rls: {type: boolean}
        data_class: {type: string}
        owner_microservice: {type: string}
        installed_at: {type: string, format: date-time}
    PackRegistry:
      type: object
      properties:
        packs:
          type: array
          items:
            type: object
            properties:
              pack: {type: string}
              primary_region: {type: string}
              dr_region: {type: string, nullable: true}
              activated: {type: boolean}
              supported_jurisdictions: {type: array, items: {type: string}}
    EnvironmentTier:
      type: string
      enum: [test, staging, prod]
      description: ADR-0163 per-tenant environment tier; distinct from commercial plan_tier.
    ApiKeyKind:
      type: string
      enum: [server, public]
    ApiKeyIssueRequest:
      type: object
      required: [tenant_id, environment_tier, key_kind]
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        environment_tier: {$ref: '#/components/schemas/EnvironmentTier'}
        key_kind: {$ref: '#/components/schemas/ApiKeyKind'}
        label: {type: string, maxLength: 120}
      description: >-
        Readiness contract for POST /v1/tenancy/api-keys. Issuance is Cedar-gated:
        test requires tenant developer or higher, staging requires tenant maintainer
        or higher, and prod/live keys require tenant admin only. The response prefix
        MUST match the requested environment_tier and key_kind.
    ApiKeyIssueResponse:
      type: object
      required: [api_key_id, tenant_id, environment_tier, key_kind, prefix, created_at]
      properties:
        api_key_id: {type: string, pattern: '^ak_[A-Za-z0-9_\-]{16,64}$'}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        environment_tier: {$ref: '#/components/schemas/EnvironmentTier'}
        key_kind: {$ref: '#/components/schemas/ApiKeyKind'}
        prefix:
          type: string
          enum: [sk_test_, pk_test_, sk_stage_, pk_stage_, sk_live_, pk_live_]
        secret_once:
          type: string
          nullable: true
          description: Present only at creation time for server keys; never persisted or logged.
        created_at: {type: string, format: date-time}
    OutboundMode:
      type: string
      enum: [intercept, test_recipients, live]
    OutboundConfig:
      type: object
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/OutboundMode'}
        test_recipient_allowlist:
          type: array
          items: {type: string, format: email}
        intercept_sink: {type: string}
      description: >-
        test mode intercepts/logs outbound effects, staging delivers only to configured
        test recipients, and prod uses live delivery. Prod outbound mode is not mutable
        through the readiness PATCH contract.
    TenantEnvironment:
      type: object
      required: [tenant_id, environment_tier, retention, outbound_config, server_key_prefix, public_key_prefix, audit_chain_tag, destructive_op_acknowledgment_required]
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        environment_tier: {$ref: '#/components/schemas/EnvironmentTier'}
        retention: {type: string}
        outbound_config: {$ref: '#/components/schemas/OutboundConfig'}
        server_key_prefix: {type: string, enum: [sk_test_, sk_stage_, sk_live_]}
        public_key_prefix: {type: string, enum: [pk_test_, pk_stage_, pk_live_]}
        audit_chain_tag: {type: string, enum: [env_tier=test, env_tier=staging, env_tier=prod]}
        destructive_op_acknowledgment_required: {type: boolean}
    TenantEnvironmentList:
      type: object
      required: [tenant_id, environments]
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        environments:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/TenantEnvironment'}
    OutboundConfigUpdateRequest:
      type: object
      required: [outbound_config]
      properties:
        outbound_config: {$ref: '#/components/schemas/OutboundConfig'}
      description: >-
        Readiness contract for PATCH /v1/tenancy/tenants/{tenant_id}/environments/{tier}/outbound-config.
        Only test and staging tiers are patchable; prod live outbound config remains immutable
        and requires a separate reviewed change-control lane.
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}

security:
  - OIDC: []

paths:
  /api-keys:
    post:
      summary: Issue a tenant environment-tier API key
      operationId: issueTenantApiKey
      x-oyatie-route-alias: POST /v1/tenancy/api-keys
      description: >-
        Contract-only readiness surface for ADR-0163 API-key issuance. The service
        validates the requested environment_tier, maps the returned prefix to the
        tier/key_kind pair, and requires Cedar approval for the tier-specific role gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyIssueRequest'}
      responses:
        '201':
          description: API key issued; server-key secret is shown only once when applicable.
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyIssueResponse'}}}
        '400': {description: invalid tier/key-kind/prefix request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: OIDC missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Cedar denied issuer role for requested environment tier, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /tenants/{tenant_id}/environments:
    get:
      summary: List a tenant's test/staging/prod environment configuration
      operationId: listTenantEnvironments
      x-oyatie-route-alias: GET /v1/tenancy/tenants/{tenant_id}/environments
      description: >-
        Tenant DPO/operator self-service view of ADR-0163 tier configuration. This is
        read-only and does not create environments, copy data, route production traffic,
        or provision cells.
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Three environment-tier records for the tenant.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantEnvironmentList'}}}
        '401': {description: OIDC missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Cedar denied tenant-environment read, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: tenant not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /tenants/{tenant_id}/environments/{tier}/outbound-config:
    patch:
      summary: Update non-prod outbound effect configuration for a tenant environment tier
      operationId: updateTenantEnvironmentOutboundConfig
      x-oyatie-route-alias: PATCH /v1/tenancy/tenants/{tenant_id}/environments/{tier}/outbound-config
      description: >-
        Admin-only contract for test/staging outbound configuration. `test` remains
        intercept/log-only, `staging` may deliver to tenant-configured QA recipients,
        and `prod` live outbound delivery is intentionally not mutable through this
        endpoint.
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
        - $ref: '#/components/parameters/EnvironmentTierParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutboundConfigUpdateRequest'}
      responses:
        '200':
          description: Updated outbound configuration.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantEnvironment'}}}
        '400': {description: invalid outbound mode for environment tier, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: OIDC missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Cedar denied outbound-config mutation, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: prod live outbound config is immutable through this endpoint, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /tenants:
    post:
      summary: Create a new tenant (platform-operator only; 2-person rule)
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTenantRequest'}
      responses:
        '201':
          description: Created
          content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}
        '401': {description: 'OIDC missing or invalid', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Cedar policy denied (tenant operator cannot create)}
        '422': {description: invalid input (e.g., child_data_attested missing for pack-in)}

    get:
      summary: List tenants (platform-operator only; tenant-operator gets own only)
      operationId: listTenants
      parameters:
        - in: query
          name: jurisdiction_code
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string}
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Tenant'}

  /tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    get:
      summary: Read a tenant's lifecycle metadata
      operationId: getTenant
      responses:
        '200':
          description: Tenant
          content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}
        '404': {description: not found}

    delete:
      summary: Delete a tenant (platform-operator + 2-person rule; triggers DSR cascade)
      operationId: deleteTenant
      parameters:
        - $ref: '#/components/parameters/ProdDestructiveAckHeader'
      responses:
        '202':
          description: Deletion initiated; DSR cascade kicked off
          content: {application/json: {schema: {$ref: '#/components/schemas/DsrRequest'}}}
        '403': {description: 2-person rule not satisfied}

  /tenants/{tenant_id}/suspend:
    post:
      summary: Suspend a tenant (non-destructive)
      operationId: suspendTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Suspended
          content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}

  /tenants/{tenant_id}/resume:
    post:
      summary: Resume a suspended tenant
      operationId: resumeTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Resumed
          content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}

  /tenants/{tenant_id}/cell-assignment:
    get:
      summary: Read a tenant's cell assignment
      operationId: getCellAssignment
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: Cell assignment
          content: {application/json: {schema: {$ref: '#/components/schemas/CellAssignment'}}}

  /tenants/{tenant_id}/rls-policies:
    get:
      summary: Read the RLS policy registry applicable to a tenant
      operationId: listRlsPolicies
      parameters:
        - $ref: '#/components/parameters/TenantIdParam'
      responses:
        '200':
          description: RLS policies
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RlsPolicy'}

  /dsr-requests:
    post:
      summary: Submit a DSR request (tenant operator or platform-operator+DPO)
      operationId: submitDsrRequest
      parameters:
        - $ref: '#/components/parameters/ProdDestructiveAckHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, request_type]
              properties:
                tenant_id: {type: string}
                request_type:
                  type: string
                  enum: [right_to_erasure, right_to_rectification, right_to_access, right_to_portability, right_to_restriction]
                requester:
                  type: object
                  properties:
                    principal: {type: string}
                    principal_type: {type: string}
      responses:
        '202':
          description: Request accepted; cascade initiated
          content: {application/json: {schema: {$ref: '#/components/schemas/DsrRequest'}}}

  /dsr-requests/{dsr_id}:
    get:
      summary: Read a DSR request status + receipt aggregation state
      operationId: getDsrRequest
      parameters:
        - $ref: '#/components/parameters/DsrIdParam'
      responses:
        '200':
          description: DSR
          content: {application/json: {schema: {$ref: '#/components/schemas/DsrRequest'}}}

  /dsr-requests/{dsr_id}/proof-of-erasure:
    get:
      summary: Read the proof-of-erasure certificate (regulator-disclosable)
      operationId: getProofOfErasure
      parameters:
        - $ref: '#/components/parameters/DsrIdParam'
      responses:
        '200':
          description: Proof
          content: {application/json: {schema: {$ref: '#/components/schemas/ProofOfErasure'}}}
        '404': {description: not yet sealed}

  /packs:
    get:
      summary: Read the active-pack registry
      operationId: getPackRegistry
      security: []
      responses:
        '200':
          description: Pack registry
          content: {application/json: {schema: {$ref: '#/components/schemas/PackRegistry'}}}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres + Citus reachable; RLS validator green)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
