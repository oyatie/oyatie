# Sample Talos machine configuration (legacy v1alpha1 single-document form).
#
# This mirrors the canonical Talos `v1alpha1.Config` layout and is parseable by
# the operating-system `talos-machine-config` crate: its decoder splits on `---`, reads
# the `version:` / `kind:` header, and extracts simple `key: value` scalars such
# as `machine.type` and `network.hostname`. The hostname below is the field the
# boot harness asserts on.
version: v1alpha1
debug: false
persist: true
machine:
  # Node role: controlplane | init | worker. Maps to MachineType.
  type: controlplane
  # Join token (machine.token).
  token: 3lhvr1.example0token0value00
  ca:
    # PEM machine CA certificate (machine.ca.crt). Sample placeholder.
    crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS1FWEFNUExFLS0tLS1FTkQt
  certSANs:
    - talos-rust-node-1
    - 10.0.0.10
  install:
    # Target block device; must be an absolute /dev path.
    disk: /dev/vda
    image: ghcr.io/siderolabs/installer:v1.9.0
    wipe: false
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.32.0
    clusterDNS:
      - 10.96.0.10
  network:
    # The hostname asserted by the boot harness.
    hostname: talos-rust-node-1
    interfaces:
      - interface: eth0
        # Static IPv4 for QEMU user-net: the guest IP handed out by SLIRP is
        # 10.0.2.15/24, so this is the realistic address the booted node assigns
        # to eth0 via rtnetlink (RTM_NEWADDR) during the network boot phase.
        dhcp: false
        addresses:
          - 10.0.2.15/24
cluster:
  id: operating-system-talos-rust
  clusterName: operating-system-rust
  controlPlane:
    endpoint: https://10.0.0.10:6443
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
