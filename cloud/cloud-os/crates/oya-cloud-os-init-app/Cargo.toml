[package]
name = "oya-cloud-os-init-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "A real Linux PID 1 (init) for the operating-system Talos-in-Rust port: mounts the core virtual filesystems, parses a Talos machine config, sets the hostname, reaps children, and powers the machine off."

[lib]
name = "oya_cloud_os_init_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "init"
path = "src/main.rs"

[[bin]]
name = "svc"
path = "src/svc.rs"

[dependencies]
libc = "0.2"
oya-cloud-os-block-domain = { path = "../oya-cloud-os-block-domain" }
oya-cloud-os-controllers-domain = { path = "../oya-cloud-os-controllers-domain" }
oya-cloud-os-cosi-domain = { path = "../oya-cloud-os-cosi-domain" }
oya-cloud-os-kernel = { path = "../oya-cloud-os-kernel" }
oya-cloud-os-machine-config-domain = { path = "../oya-cloud-os-machine-config-domain" }
oya-cloud-os-machined-domain = { path = "../oya-cloud-os-machined-domain" }
oya-cloud-os-network-domain = { path = "../oya-cloud-os-network-domain" }
oya-cloud-os-platform-domain = { path = "../oya-cloud-os-platform-domain" }
oya-cloud-os-runtime-cri-domain = { path = "../oya-cloud-os-runtime-cri-domain" }

[lints]
workspace = true
