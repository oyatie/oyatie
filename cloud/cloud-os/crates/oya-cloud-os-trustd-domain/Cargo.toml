[package]
name = "oya-cloud-os-trustd-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust port of the Talos trustd subsystem: cluster CA, PKI, certificate issuance/signing, the SecurityService API, join-token verification, and node cert rotation."

[lib]
name = "oya_cloud_os_trustd_domain"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-os-kernel = { path = "../oya-cloud-os-kernel" }
# Real X.509 crypto (G002 slice-1b-i; ADR-0561 D5 promotion, ADR-0506 aws-lc-rs).
# rcgen mints real ECDSA-P256 keypairs + real ASN.1 DER certificates; x509-parser
# parses + verifies them; aws-lc-rs verifies a raw ECDSA signature over the TBS
# bytes in EcdsaP256Signer::verify. ALL on the aws-lc-rs backend with NO ring:
# rcgen default-features pull ring so they are disabled at the workspace seam and
# x509-parser uses verify-aws (NOT the ring-backed `verify`).
aws-lc-rs = { workspace = true }
rcgen = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }

[lints]
workspace = true
