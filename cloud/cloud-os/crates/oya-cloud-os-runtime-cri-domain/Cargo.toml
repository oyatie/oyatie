version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Model of Talos container runtime integration: containerd client, CRI plugin, image pull/unpack, OCI spec, and the system-services container runner used by machined."

[lib]
name = "oya_cloud_os_runtime_cri_domain"
