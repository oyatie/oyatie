[package]
name = "oya-cloud-os-secrets-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Cluster secrets, PKI bundles, and certificate rotation for the operating-system Talos port."

[lib]
name = "oya_cloud_os_secrets_domain"
path = "src/lib.rs"
doctest = false

[features]
# NON-DEFAULT, and it must stay that way. The whole crate sits behind this
# feature (see the crate-root `cfg` in src/lib.rs): it models Talos PKI rather
# than implementing it, so off-feature there is nothing to link and nothing to
# misuse. Test-only consumers turn it on explicitly.
modeled-crypto = []

[dependencies]
os-kernel = { path = "../../../../os/core/kernel" }

[lints]
workspace = true
