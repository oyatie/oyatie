[package]
name = "oya-cloud-os-difftest-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Differential validation of the operating-system Rust port against Go oracle TSV vectors."

[lib]
name = "oya_cloud_os_difftest_app"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-os-controllers-domain = { path = "../oya-cloud-os-controllers-domain" }
oya-cloud-os-init-app = { path = "../oya-cloud-os-init-app" }
oya-cloud-os-kernel = { path = "../oya-cloud-os-kernel" }
oya-cloud-os-kubernetes-domain = { path = "../oya-cloud-os-kubernetes-domain" }
oya-cloud-os-machine-config-domain = { path = "../oya-cloud-os-machine-config-domain" }
oya-cloud-os-network-domain = { path = "../oya-cloud-os-network-domain" }
oya-cloud-os-platform-domain = { path = "../oya-cloud-os-platform-domain" }
oya-cloud-os-runtime-cri-domain = { path = "../oya-cloud-os-runtime-cri-domain" }
oya-cloud-os-secrets-domain = { path = "../oya-cloud-os-secrets-domain" }

[lints]
workspace = true
