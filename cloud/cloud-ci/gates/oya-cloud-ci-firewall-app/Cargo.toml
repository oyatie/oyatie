[package]
name = "oya-cloud-ci-firewall-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-firewall (PHASE-0-FIREWALL-PLAN go-live readiness ratchet; register #20).
# The single required status check that layers the BASELINE as the second predicate on
# top of the four born-blocking gates: born-blocking proves the gate detects the live
# exhibit; the baseline converts "detects everything" into "blocks only NEW debt".
#
# It is NOT an `oya` CLI (the retired oya gate/oya gen authority). The pure predicates
# (compare-mode + ratchet-invariant) live in the lib so they are fixture-drivable; the
# live runner that regenerates the faces + byte-diffs the committed baseline is the
# integration test gate.

[lib]
name = "oya_cloud_ci_firewall_app"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
