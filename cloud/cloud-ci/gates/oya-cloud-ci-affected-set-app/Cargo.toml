[package]
name = "oya-cloud-ci-affected-set-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Binding workspace-coverage lane (ADR-0554): derives the buck2 affected-target set from the merge-base diff and builds+tests it, with fail-closed escalation to full-workspace on any derivation uncertainty."

# cloud-ci-affected-set (ADR-0554, FRIC-1781310000): the Rust successor of the transitional
# infra/ci/buck2-affected-gate.sh. The kernel (lib) is a NEUTRAL pure decision engine — diff
# entries + per-file owner results + policy DATA -> {Affected|Full|Refuse|NoGraphTargets};
# all repo facts (escape-trigger path classes, universe, cell roots) live in
# affected-set-policy.json. The binary is the composition root that talks to git + buck2.

[lib]
name = "oya_cloud_ci_affected_set_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-affected-set"
path = "src/main.rs"

# ADR-0554 round-3: build-health ratchet — blocks FULL-tier build REGRESSIONS vs the merge-base
# while grandfathering pre-existing build debt (no flag-day requirement).
[[bin]]
name = "oya-cloud-ci-build-health"
path = "src/bin/oya-cloud-ci-build-health.rs"

[[bin]]
name = "oya-cloud-ci-step-telemetry"
path = "src/bin/oya-cloud-ci-step-telemetry.rs"

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
