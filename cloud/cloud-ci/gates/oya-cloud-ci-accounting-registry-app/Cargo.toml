[package]
name = "oya-cloud-ci-accounting-registry-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# The buck2 rust_binary producer of accounting-registry.generated.json + the 3
# companion generated faces (PHASE-0-FIREWALL-PLAN §5.1; D-DOCTRINE total-accounting).
# Register #20: this is a Rust gate binary, NOT an `oya` CLI subcommand. Carve-outs
# (vendor/generated/ephemeral/...) live as DATA in unit-class-policy.json + ttl-policy.json,
# never as scanner code. Owned by GATE-2 cloud-ci-total-accounting.

[lib]
name = "oya_cloud_ci_accounting_registry_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-accounting-registry-app"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The oya-ci config kernel (OYA-CI-CONFORMANCE-FLOOR-PLAN §3.3): the producer reads the
# policy (naming/vocab/manifest/roots/sources/gates) from the config instead of hardcoded
# consts, defaulting to the bundled default (== today's values) for byte-for-byte parity.
oya-ci-config-kernel = { path = "../../../../libs/oya-ci-config" }
# The producer's fifth face (gate-baseline.generated.json) runs each gate's pure
# evaluate_keyed over the live faces to capture TODAY's accepted-violation KEYS. The
# gate libs depend only on serde_json, so there is no cycle (the gate↔producer coupling
# is via cargo-run/buck2 build-graph for the OTHER faces, not a lib dependency).
oya-cloud-ci-total-accounting-app = { path = "../oya-cloud-ci-total-accounting-app" }
oya-cloud-ci-cross-artifact-agreement-app = { path = "../oya-cloud-ci-cross-artifact-agreement-app" }
oya-cloud-ci-staleness-reaper-app = { path = "../oya-cloud-ci-staleness-reaper-app" }
oya-cloud-ci-automation-ratchet-app = { path = "../oya-cloud-ci-automation-ratchet-app" }
# cloud-ci-bnf-layer-suffix (§2.5#4 floor gate S1): the producer enumerates oya-* crate names
# (the I/O) and the gate's pure evaluate_keyed reuses oya-governance-predictable-naming-kernel
# (still no cycle: the naming kernel does not depend on the producer).
oya-cloud-ci-bnf-layer-suffix-app = { path = "../oya-cloud-ci-bnf-layer-suffix-app" }
# cloud-ci-manifest-hygiene (§2.5#7 floor gate S2): the producer parses each oya-* Cargo.toml
# into per-crate hygiene flags (the I/O); the gate's pure evaluate_keyed is a flag→Finding policy.
oya-cloud-ci-manifest-hygiene-app = { path = "../oya-cloud-ci-manifest-hygiene-app" }
# cloud-ci-cargo-prefix (ADR-0017 floor gate S3): the producer enumerates the oya-* workspace
# members + package names (the I/O); the gate's pure evaluate_keyed reuses validate_cargo_prefix.
oya-cloud-ci-cargo-prefix-app = { path = "../oya-cloud-ci-cargo-prefix-app" }
# cloud-ci-slo-coverage: the producer expands the config-declared catalog globs into
# {crate_id,slo} rows; the gate reuses the existing oya-check-slo-coverage kernel.
oya-cloud-ci-slo-coverage-app = { path = "../oya-cloud-ci-slo-coverage-app" }
# cloud-ci-license-policy: the producer resolves workspace members and emits package-license rows;
# the gate reuses the existing oya-check-license-policy kernel.
oya-cloud-ci-license-policy-app = { path = "../oya-cloud-ci-license-policy-app" }
# cloud-ci-zero-static-secrets: the producer scans the tracked corpus for credential-shaped
# candidate lines and feeds policy DATA + redacted row facts to the pure evaluator.
oya-cloud-ci-zero-static-secrets-app = { path = "../oya-cloud-ci-zero-static-secrets-app" }
# cloud-ci-load-balancer-inventory: classifies tenant-facing LoadBalancer inventory as
# api-gateway HTTP/gRPC edge, authorized ADR-0182 non-HTTP protocol edge, or fail-closed debt.
oya-cloud-ci-load-balancer-inventory-app = { path = "../oya-cloud-ci-load-balancer-inventory-app" }
# Region/env-tier gate packet faces consume prerequisite readiness surfaces and stay pure.
oya-cloud-ci-multi-region-disposition-app = { path = "../oya-cloud-ci-multi-region-disposition-app" }
oya-cloud-ci-sovereign-tenant-pin-app = { path = "../oya-cloud-ci-sovereign-tenant-pin-app" }
oya-cloud-ci-tenant-environment-tier-app = { path = "../oya-cloud-ci-tenant-environment-tier-app" }
# cloud-ci-workspace-glob-coverage (ADR-0538): the producer emits raw member-entry rows and
# concrete crate-dir coverage rows; the gate is pure policy over those booleans.
oya-cloud-ci-workspace-glob-coverage-app = { path = "../oya-cloud-ci-workspace-glob-coverage-app" }
# cloud-ci-target-parity (ADR-0540): the producer emits per-workspace-member BUCK/test-code
# parity rows; the gate is pure policy over those booleans.
oya-cloud-ci-target-parity-app = { path = "../oya-cloud-ci-target-parity-app" }
# cloud-ci-enforcement-liveness (FRIC-012 / G011): the producer emits tracked project-hook
# wiring rows; the gate is pure policy over hook liveness and mirror drift.
oya-cloud-ci-enforcement-liveness-app = { path = "../oya-cloud-ci-enforcement-liveness-app" }
# The fifth gate (cloud-ci-brand-residue) is the forbidden-vocab shrink-only ratchet. Its
# census + carve-out DATA + stem catalog are the SSOT in oya-check-brand-residue; the binary
# runs it over the live corpus and the lib freezes the per-(stem,file) keys into the baseline.
oya-check-brand-residue = { path = "../../../../libs/oya-check-brand-residue" }
# Canonical glob-aware workspace-member resolver (FRIC-1781069288 / ADR-0538): the
# reachability pass resolves `cargo-members` here instead of textually parsing the now-
# globbed members array.
oya-workspace-members-kernel = { path = "../../../../libs/oya-workspace-members-kernel" }

[lints]
workspace = true
