[package]
name = "oya-cloud-ci-accounting-registry-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# The buck2 rust_binary producer of accounting-registry.generated.json + the 3
# companion generated faces (PHASE-0-FIREWALL-PLAN §5.1; D-DOCTRINE total-accounting).
# Register #20: this is a Rust gate binary, NOT an `oya` CLI subcommand. Carve-outs
# (vendor/generated/ephemeral/...) live as DATA in unit-class-policy.json + ttl-policy.json,
# never as scanner code. Owned by GATE-2 cloud-ci-total-accounting.

[lib]
name = "oya_cloud_ci_accounting_registry_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-accounting-registry-app"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The producer's fifth face (gate-baseline.generated.json) runs each gate's pure
# evaluate_keyed over the live faces to capture TODAY's accepted-violation KEYS. The
# gate libs depend only on serde_json, so there is no cycle (the gate↔producer coupling
# is via cargo-run/buck2 build-graph for the OTHER faces, not a lib dependency).
oya-cloud-ci-total-accounting-app = { path = "../oya-cloud-ci-total-accounting-app" }
oya-cloud-ci-cross-artifact-agreement-app = { path = "../oya-cloud-ci-cross-artifact-agreement-app" }
oya-cloud-ci-staleness-reaper-app = { path = "../oya-cloud-ci-staleness-reaper-app" }
oya-cloud-ci-automation-ratchet-app = { path = "../oya-cloud-ci-automation-ratchet-app" }

[lints]
workspace = true
