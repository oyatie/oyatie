[package]
name = "oya-cloud-ci-substrate-dependency-dag-acyclicity-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI acyclicity gate for the canonical substrate-of-substrate dependency DAG (ADR-0280 §D-3): Tarjan SCC (no cycles) + forbidden-edge honouring + Kahn topo-sort == bootstrap_order + §D-1 schema completeness, over specs/substrate-dependency-dag.json."

# cloud-ci-substrate-dependency-dag-acyclicity (ADR-0280 §D-3, amended by ADR-0520 + ADR-0562):
# the principal enforcement surface of the substrate-of-substrate dependency doctrine. Pure graph
# engine (Tarjan + Kahn); the only repo-specific is the spec path DAG_PATH. Born pack-shaped: runs
# on any DAG document of the §D-1 schema. Bootstrap order is DERIVED by querying the DAG (Kahn topo
# -sort), never hard-coded.

[lib]
name = "oya_cloud_ci_substrate_dependency_dag_acyclicity_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-substrate-dependency-dag-acyclicity"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[[test]]
name = "acyclicity"
path = "tests/acyclicity.rs"

[lints]
workspace = true
