[package]
name = "oya-cloud-ci-dependency-automation-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate enforcing ADR-0535 dependency automation: repo-owned oya-deps.toml closed-schema policy, no Renovate/Dependabot config, and Rust pin alignment across root toolchain, workspace MSRV, container builder, and Buck2 toolchain notes."

[lib]
name = "oya_cloud_ci_dependency_automation_app"
path = "src/lib.rs"
doctest = false

[dependencies]
toml = { workspace = true }

[lints]
workspace = true
