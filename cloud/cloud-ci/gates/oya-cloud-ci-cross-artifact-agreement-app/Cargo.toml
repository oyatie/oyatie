[package]
name = "oya-cloud-ci-cross-artifact-agreement-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GATE-1 cloud-ci-cross-artifact-agreement (PHASE-0-FIREWALL-PLAN §5.2; amends ADR-0365).
# Pure evaluator over the cross-artifact corpus (ADR front-matter × spec × masterplan ×
# roadmap × reciprocal supersession × the generated faces); emits {verdict, violations}.
# The integration test globs specs/fixtures/cross-artifact-agreement/tc-*.json and asserts
# report.violations against each fixture's expected_violations. The born-blocking self-test
# runs the producer's decision-crosswalk face over the live corpus. G-INTEGRITY track: no
# buck2 build-graph dep.

[lib]
name = "oya_cloud_ci_cross_artifact_agreement_app"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
