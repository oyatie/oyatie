[package]
name = "oya-cloud-ci-register-crate-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Register-crate orchestrator: wires the pure crate-registrar kernel plan to the on-disk writers + the cloud-ci producer registration bridges (G011 born-accounting slice 3b, ADR-0568)."

# G011 born-accounting slice 3b (ADR-0568): the ORCHESTRATOR half of register_crate. It lives under
# cloud/cloud-ci/gates/ (NOT libs/) on purpose — it depends SAME-LAYER on the cloud-ci producer
# (fix_owners/fix_reachability/allocate_next_adr_id) and DOWNWARD on the libs/ kernel + writers; a
# libs/ crate may not depend on cloud/cloud-ci/gates/ (forbidden layer inversion, ADR-0131/0512).

[lib]
name = "oya_cloud_ci_register_crate_app"
path = "src/lib.rs"
doctest = false

[dependencies]
# DOWNWARD on the libs/ kernel (the pure plan) + writers (the on-disk SSOT edits).
oya-crate-registrar-kernel = { path = "../../../../libs/oya-crate-registrar-kernel" }
oya-crate-registrar-app = { path = "../../../../libs/oya-crate-registrar-app" }
# The oya-ci config kernel: the producer bridges + the loaders read paths (owners file name,
# reachability registry, ADR corpus dir) from the bundled-default config (byte-for-byte today).
oya-ci-config-kernel = { path = "../../../../libs/oya-ci-config" }
# SAME-LAYER on the cloud-ci producer: fix_owners / fix_reachability / allocate_next_adr_id /
# resolve_owners / load_reachability_registry / adr_id_from_filename.
oya-cloud-ci-accounting-registry-app = { path = "../oya-cloud-ci-accounting-registry-app" }
# SAME-LAYER on the membership-lint gate: REUSE its parse_mapping/homes_for/glob_match so the
# orchestrator's "is this crate already capability-mapped?" check is the SAME logic the gate
# enforces — never a divergent reimplementation that double-maps a crate the gate then RED-flags.
oya-cloud-ci-capability-membership-app = { path = "../oya-cloud-ci-capability-membership-app" }
# SAME-LAYER on the slice-3d self-validation subset gates: drive each gate's pure `evaluate_keyed`
# over the POST-settle faces so the just-registered crate is validated against the SAME gate logic CI
# runs (cycle-free — these lib crates dep only serde_json / a downward libs/ crate, never back here).
oya-cloud-ci-total-accounting-app = { path = "../oya-cloud-ci-total-accounting-app" }
oya-cloud-ci-slo-coverage-app = { path = "../oya-cloud-ci-slo-coverage-app" }
oya-cloud-ci-catalog-liveness-app = { path = "../oya-cloud-ci-catalog-liveness-app" }
serde_json = { workspace = true }

[lints]
workspace = true
