[package]
name = "oya-cloud-ci-cargo-prefix-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-cargo-prefix (ADR-0017; §2.5-adjacent, MIG-PREREQ floor gate S3). A pure evaluator
# that REUSES the existing cargo-prefix fitness policy in
# oya-intelligence-cargo-prefix-domain::validate_cargo_prefix
# (CLI-GOVERNANCE-TO-FIREWALL-MIGRATION-PLAN Principle 1, shape b — reuse, not re-derive). The
# producer (oya-cloud-ci-accounting-registry-app) enumerates the first-party oya-* workspace
# members + their package names (the I/O) and feeds them as rows; this gate runs
# validate_cargo_prefix per crate (surface-all) and emits a Finding per crate whose member-path
# crate-id or package name does not begin with the required prefix (or disagree). The required
# prefix is sourced from the oya-ci config `[naming].required_prefix` (default `oya-`) — never
# hardcoded. baseline-block-on-new freezes today's debt and blocks only NEW non-conformant crates.

[lib]
name = "oya_cloud_ci_cargo_prefix_app"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
oya-intelligence-cargo-prefix-domain = { path = "../../../../oya/intelligence/crates/oya-intelligence-cargo-prefix-domain" }
# The required prefix is sourced from the oya-ci config `[naming]` section
# (OYA-CI-CONFORMANCE-FLOOR-PLAN §3.3); the bundled default reproduces today's `oya-` (byte-parity).
oya-ci-config-kernel = { path = "../../../../libs/oya-ci-config" }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
