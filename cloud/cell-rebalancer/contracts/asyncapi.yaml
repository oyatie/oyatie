
asyncapi: 3.1.0
info:
  title: Oyatie Cell Rebalancer Events
  version: 2026-05-21
  description: AsyncAPI events for tenant migration across cells per ADR-0276 D-2.
servers:
  production:
    host: events.oyatie.com
    protocol: kafka-secure
    pathname: /v/2026-05-21/cell-rebalancer
channels:
  cell-rebalancer.rebalance-job.queued:
    address: cell-rebalancer.rebalance-job.queued
    messages:
      RebalanceJobQueued:
        $ref: '#/components/messages/RebalanceJobQueued'
  cell-rebalancer.rebalance-job.state-changed:
    address: cell-rebalancer.rebalance-job.state-changed
    messages:
      RebalanceJobStateChanged:
        $ref: '#/components/messages/RebalanceJobStateChanged'
  cell-rebalancer.tenant-migration.state-changed:
    address: cell-rebalancer.tenant-migration.state-changed
    messages:
      TenantMigrationStateChanged:
        $ref: '#/components/messages/TenantMigrationStateChanged'
  cell-rebalancer.audit-emitted:
    address: cell-rebalancer.audit-emitted
    messages:
      AuditEmitted:
        $ref: '#/components/messages/AuditEmitted'
  cell-rebalancer.migration-refused:
    address: cell-rebalancer.migration-refused
    messages:
      MigrationRefused:
        $ref: '#/components/messages/MigrationRefused'
operations:
  publishRebalanceJobQueued:
    action: send
    channel: { $ref: '#/channels/cell-rebalancer.rebalance-job.queued' }
  publishRebalanceJobStateChanged:
    action: send
    channel: { $ref: '#/channels/cell-rebalancer.rebalance-job.state-changed' }
  publishTenantMigrationStateChanged:
    action: send
    channel: { $ref: '#/channels/cell-rebalancer.tenant-migration.state-changed' }
  publishAuditEmitted:
    action: send
    channel: { $ref: '#/channels/cell-rebalancer.audit-emitted' }
  publishMigrationRefused:
    action: send
    channel: { $ref: '#/channels/cell-rebalancer.migration-refused' }
components:
  messages:
    RebalanceJobQueued:
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload: { $ref: '#/components/schemas/RebalanceJobEvent' }
    RebalanceJobStateChanged:
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload: { $ref: '#/components/schemas/RebalanceJobEvent' }
    TenantMigrationStateChanged:
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload: { $ref: '#/components/schemas/TenantMigrationEvent' }
    AuditEmitted:
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload: { $ref: '#/components/schemas/AuditEmissionEvent' }
    MigrationRefused:
      headers: { $ref: '#/components/schemas/EventHeaders' }
      payload: { $ref: '#/components/schemas/MigrationRefusedEvent' }
  schemas:
    EventHeaders:
      type: object
      required: [oyatie-version, traceparent, hlc-timestamp]
      properties:
        oyatie-version: { type: string, format: date }
        traceparent: { type: string }
        hlc-timestamp: { type: string }
    RebalanceJobEvent:
      type: object
      required: [job_id, trigger, state, tenant_count, audit_chain_id]
      properties:
        job_id: { type: string }
        trigger: { type: string }
        state: { type: string }
        tenant_count: { type: integer }
        source_cell_ids: { type: array, items: { type: string } }
        target_cell_ids: { type: array, items: { type: string } }
        audit_chain_id: { type: string }
    TenantMigrationEvent:
      type: object
      required: [job_id, migration_id, tenant_id, state, source_cell_id, target_cell_id, audit_chain_id]
      properties:
        job_id: { type: string }
        migration_id: { type: string }
        tenant_id: { type: string }
        state: { type: string }
        source_cell_id: { type: string }
        target_cell_id: { type: string }
        audit_chain_id: { type: string }
    AuditEmissionEvent:
      type: object
      required: [event_type, microservice, audit_chain_id, audit_chain_seal]
      properties:
        event_type: { type: string }
        microservice: { type: string, const: cell-rebalancer }
        audit_chain_id: { type: string }
        audit_chain_seal: { type: string }
    MigrationRefusedEvent:
      type: object
      required: [job_id, reason_code, cedar_decision_id, residency_result, compliance_pack_result]
      properties:
        job_id: { type: string }
        tenant_id: { type: string }
        reason_code: { type: string }
        cedar_decision_id: { type: string }
        residency_result: { type: string }
        compliance_pack_result: { type: string }
