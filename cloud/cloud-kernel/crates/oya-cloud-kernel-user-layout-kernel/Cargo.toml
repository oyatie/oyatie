[package]
name = "oya-cloud-kernel-user-layout-kernel"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Arch-neutral, pure, host-testable EL0 user-layout math (initial-stack/auxv builder, VMSAv8 descriptor builders, range checks, frame-pool bookkeeping, TLS variant-I layout, timer-sleep math). Single source of truth shared by every arch Frame backend."

[package.metadata.oya]
microservice = "cloud-kernel"
bounded_context = "cloud-kernel"
kind = "shared"
layer = "kernel"
owner_team = "axis-cloud-platform"
purpose = "Cutover-stable, arch-neutral EL0 user-layout math shared by every kuberos Frame backend."
adr_anchors = ["ADR-0512", "ADR-0520", "ADR-0536", "ADR-0562", "ADR-0547"]
design_non_claim = "scaffold_only_no_module_build_boot_artifact_or_runtime_readiness_claim"

# Zero external dependencies on purpose: this crate is the pure, hardware-
# independent layout math that the arch Frame backends (aarch64 today, x86_64 /
# riscv64 later) all consume. Keeping it dependency-free lets the out-of-
# workspace host harness `include!` the same source and unit-test it with the
# normal libtest harness (see crates/arch-aarch64/tests-host/).
[dependencies]

[lints]
workspace = true
