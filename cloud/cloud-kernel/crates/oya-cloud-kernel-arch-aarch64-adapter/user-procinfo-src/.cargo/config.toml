# Standalone cargo config for the aarch64 EL0 user-smpdemo program (P4·SMP·S4a).
# This crate lives INSIDE the repo tree, so build it via build.sh (which copies
# it OUTSIDE the repo first) to avoid merging the kernel's root .cargo config.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "target-cpu=cortex-a72",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-static",
]
