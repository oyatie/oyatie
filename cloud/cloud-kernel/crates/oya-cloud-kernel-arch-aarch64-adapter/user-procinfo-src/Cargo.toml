# user-procinfo: an aarch64 EL0 program that proves the WAVE 1 libc-init /
# process-info syscalls (uname, umask, getrusage, times, clock_getres, prctl)
# return REAL results (never -ENOSYS). The aarch64 analogue of
# ../arch-x86_64/user-procinfo-src. Built standalone (NOT a workspace member)
# so the kernel workspace `.cargo/config.toml` does not leak in.
#
# Build it standalone with the wrapper:
#   crates/arch-aarch64/user-procinfo-src/build.sh
# Output: out/user-procinfo.elf (a static, non-PIE ELF64, EM_AARCH64, ET_EXEC).
[workspace]

[package]
name = "user-procinfo"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "EL0 WAVE1 conformance probe: uname/umask/getrusage/times/clock_getres/prctl via raw aarch64 syscalls."

[[bin]]
name = "user-procinfo"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
