# Out-of-workspace host test harness for the *pure* EL0 user-layout math.
#
# This crate is deliberately EXCLUDED from the root workspace (see the root
# Cargo.toml `[workspace] exclude`) so it does NOT inherit the kernel's
# `.cargo/config.toml` (which forces a bare-metal target + `build-std`). It is a
# plain `std` host crate: it `include!`s `../../user_layout/src/layout.rs` — the
# single source of truth shared by every arch Frame backend — and runs that
# file's `#[cfg(test)]` unit tests with the normal libtest harness.
#
#   Run with:  cargo test --manifest-path crates/arch-aarch64/tests-host/Cargo.toml
#
# Keeping the layout/allocator/stack math in a dependency-free module lets us
# verify it on the host even though the surrounding `arch-aarch64` crate cannot
# be unit-tested in place (its `build-std` config collides with libtest's
# precompiled `core`).
[package]
name = "arch-aarch64-layout-tests"
version = "0.0.1"
edition = "2021"
publish = false

# Make this its own (empty) workspace root so it never inherits the kernel's
# bare-metal `.cargo/config.toml` (build-std) — it builds for the host with the
# normal libtest harness.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
