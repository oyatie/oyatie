# Override the kernel's bare-metal cargo config (which the parent directory tree
# would otherwise impose) so this harness builds for the HOST with a normal
# `std` libtest binary.
#
# Cargo merges `.cargo/config.toml` files up the directory tree; child keys
# override parent keys. We clear `build.target` (back to the host default) and
# empty the `build-std` lists so libtest's precompiled `core`/`std` are used
# instead of a from-source rebuild.

[build]
# Use the host target (cancels the parent's bare-metal target). This file lives
# next to the host where it runs (Apple Silicon); CI on another host should run
# the harness with an explicit `--target <host>` if this differs.
target = "aarch64-apple-darwin"

[unstable]
build-std = []
build-std-features = []
