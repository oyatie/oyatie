[package]
name = "oya-cloud-kernel-arch-aarch64-adapter"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "aarch64 Frame backend: boot, MMU, traps, console. The only place unsafe lives for ARM."

[package.metadata.oya]
microservice = "cloud-kernel"
bounded_context = "cloud-kernel"
kind = "shared"
layer = "adapter"
owner_team = "axis-cloud-platform"
purpose = "aarch64 kuberos Frame backend adapter: boot, MMU, traps, console, and Talos-compatibility verification images."
adr_anchors = ["ADR-0512", "ADR-0520", "ADR-0536", "ADR-0562", "ADR-0378", "ADR-0382"]
design_non_claim = "scaffold_only_no_module_build_boot_artifact_or_runtime_readiness_claim"

[features]
# Verification-only: switch the embedded USER_ELF (include_bytes!) to the
# signal-demo program (out/user-signal.elf) instead of the default user-spawn
# image. The default build (no feature) keeps the golden image untouched.
signal-demo = []
# Verification-only: switch the embedded USER_ELF to the clock-demo program
# (out/user-clock.elf) instead of the default user-spawn image. The default
# build (no feature) keeps the golden image untouched. See P3_TIMEKEEPING_SPEC.
clock-demo = []
# Milestone-2 Slice-0: switch the embedded USER_ELF to the REAL, unmodified
# **talos-init** PID1 binary cross-built for aarch64-unknown-linux-musl as a
# static non-PIE ET_EXEC (out/talos-init.elf) — the talos-machined 7-phase boot
# sequencer. Captures where the real init first aborts (expected: the phase-1
# mount(2) ENOSYS). The default build (no feature) keeps the golden image
# untouched. See MILESTONE_2_PLAN.md Slice 0.
talos-init = []
# Verification-only: the parity-floor capstone. Switch the embedded USER_ELF to
# the no_std **PID1 init supervisor** (out/user-init.elf) AND swap the `execve`
# target (EXEC_ELF) to the REAL talos-svc musl binary (out/svc.elf) so PID1's
# cloned child becomes the real svc worker. The default build (no feature) keeps
# the golden image untouched. See P3_PARITY_FLOOR_PLAN Slice C.
init-demo = []
# P4·SMP·S4a verification-only: the cross-CPU scheduling demo. The BSP spawns
# N > cpu_count workers round-robin across the online CPUs; the kernel logs a
# non-golden-shape `sched: pid P -> cpu K` line when each worker first runs on a
# CPU. Under `-smp 4` workers appear on multiple distinct cpu_index. The default
# build (no feature) keeps the golden image untouched. Switches the embedded
# USER_ELF to the no_std fan-out supervisor (out/user-smpdemo.elf).
smp-sched-demo = []

[dependencies]
hal = { workspace = true }
# The loom/Miri-verified concurrency substrate. Used for the timekeeper base:
# a single `ksync::SeqLock` publishes the two tick-varying words
# `(counter_at_base, mono_ns_base)` at init; `clock_gettime` reads a consistent
# snapshot lock-free. Zero new unsafe in this crate (the SeqLock is itself
# unsafe-free; its proofs are inherited).
ksync = { package = "oya-cloud-kernel-ksync-kernel", path = "../oya-cloud-kernel-ksync-kernel" }
# Pure, arch-neutral EL0 user-layout math (initial-stack/auxv builder, VMSAv8
# descriptor builders, range checks, frame-pool bookkeeping, TLS variant-I,
# timer-sleep math). Extracted into its own crate so x86_64/riscv64 can share
# the single source of truth; re-exported below via `pub use`. Zero deps and
# `no_std`, so it builds for both the host and the bare-metal aarch64 target.
user_layout = { workspace = true }
# The in-RAM VFS and the netlink wire codec: independent kernel subsystems with
# no layout relationship, so they are their own crates alongside `user_layout`.
# Same shape: zero deps, `no_std`, re-exported below via `pub use`.
vfs = { workspace = true }
netlink = { workspace = true }

# Vetted no_std hardware crates (see ALLOWED_CRATES.md). They are gated to the
# aarch64 target so building this crate for the host (e.g. `cargo check` from
# macOS, or doc builds) does not try to compile ARM-only register code.
# Declared but not yet exercised by the minimal boot path; pulled in as the
# Frame grows.
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { workspace = true }
tock-registers = { workspace = true }
# Global heap allocator over the Frame's static RAM region. Vetted in
# ALLOWED_CRATES.md; only the Frame installs the #[global_allocator].
linked_list_allocator = { workspace = true }

[lints]
workspace = true
