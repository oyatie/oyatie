[package]
name = "oya-cloud-kernel-app"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "kernel: the safe kernel binary. Links exactly one arch Frame backend."

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hal = { workspace = true }
frame = { workspace = true }

# Verification-only feature: switch the embedded EL0/ring-3 image to the
# `signal-demo` program (installs a SIGUSR1 handler, raises it, then exercises
# the VFS fd paths). It forwards to whichever arch backend is linked via the
# `?/` weak-dep syntax — the `?` makes each forward a *no-op* when that backend
# is not in the dependency graph, so the single feature line is valid whether we
# build aarch64 or x86_64. The DEFAULT build (no feature) keeps the existing
# image, so the golden trace is untouched. See P3_SIGNALS_SPEC.md §7.2.
#
# The arch backends are declared `optional` purely so the `?/` syntax is legal;
# each is then unconditionally re-enabled per-target via its own marker feature
# in `default`, so a normal build always links exactly the right backend (it
# supplies `_start` + the panic handler).
[features]
default = ["_arch"]
# `_arch` resolves, per target, to whichever backend dependency exists. Cargo
# silently drops a `dep:` reference whose target-gated dependency is absent, so
# this enables arch-aarch64 on aarch64 and arch-x86_64 on x86_64.
_arch = ["dep:arch-aarch64", "dep:arch-x86_64"]
signal-demo = ["arch-aarch64?/signal-demo", "arch-x86_64?/signal-demo"]
# Verification-only feature: switch the embedded EL0/ring-3 image to the
# `clock-demo` program (proves real timekeeping + the clock syscalls advance).
# Same `?/` weak-forwarding as signal-demo; the DEFAULT build (no feature) keeps
# the user-spawn image so the golden trace is untouched. See P3_TIMEKEEPING_SPEC.
clock-demo = ["arch-aarch64?/clock-demo", "arch-x86_64?/clock-demo"]
# Verification-only feature: switch the embedded ring-3 image to the REAL
# talos-svc Rust-std/musl binary cross-built for x86_64 (out/svc-x86_64.elf).
# Same `?/` weak-forwarding; only arch-x86_64 defines `svc-demo` (there is no
# aarch64 forward — aarch64 already runs the svc via its own bring-up path). The
# DEFAULT build (no feature) keeps the user-spawn image so the golden trace is
# untouched. See P3_PARITY_FLOOR_PLAN.md Slice A/B.
svc-demo = ["arch-x86_64?/svc-demo"]
# Milestone-2 Slice-0 verification feature: switch the embedded ring-3 image to
# the REAL, unmodified **talos-init** PID1 (the talos-machined 7-phase boot
# sequencer), cross-built for x86_64/aarch64-unknown-linux-musl as a static
# non-PIE ET_EXEC (out/talos-init-x86_64.elf / out/talos-init.elf). Both arch
# backends define `talos-init`, so this `?/` weak-forward enables the right one
# per target. The DEFAULT build (no feature) keeps the user-spawn image so the
# golden trace is untouched. See MILESTONE_2_PLAN.md Slice 0.
talos-init = ["arch-aarch64?/talos-init", "arch-x86_64?/talos-init"]
# Verification-only feature: the Milestone-1 "parity floor" capstone. Switches
# the embedded ring-3 image to the no_std **PID1 init supervisor**
# (out/user-init.elf on aarch64, out/user-init-x86_64.elf on x86_64) AND swaps
# the `execve` target to the REAL talos-svc musl binary (out/svc.elf on aarch64,
# out/svc-x86_64.elf on x86_64) so the cloned child becomes the real svc worker.
# PID1 installs SIGCHLD/SIGTERM handlers, clones+execve's the svc, and reaps it
# via signal-driven wait4(WNOHANG). Same `?/` weak-forwarding as the other demos;
# both arch backends define `init-demo`. The DEFAULT build (no feature) keeps the
# user-spawn image so the golden trace is untouched. See P3_PARITY_FLOOR_PLAN.md
# Slice C.
init-demo = ["arch-aarch64?/init-demo", "arch-x86_64?/init-demo"]
# Verification-only feature: the x86_64 arch_prctl FS-base-per-process fix proof.
# Switches the embedded ring-3 image to a no_std PID1 that clones TWO concurrent
# musl TLS workers (each sets a distinct `%fs` base, the scheduler interleaves
# them via 10 ms preemption). With the fix each reads ITS OWN TLS and PID1 reaps
# both -> OK. Only arch-x86_64 defines `fsbase-demo` (this is the x86_64-only
# bug); the same demo cross-checks on aarch64 via `?/` (aarch64 already passes
# through tpidr — no arch-aarch64 forward is needed, but the kernel feature name
# is shared so the build line is uniform). The DEFAULT build (no feature) keeps
# the user-spawn image so the golden trace is untouched.
fsbase-demo = ["arch-x86_64?/fsbase-demo"]
# Falsifiability toggle (paired with `fsbase-demo`): compiles the FS-base restore
# in `process::switch_to` OUT, reproducing the original bug so the WITHOUT-fix run
# corrupts/crashes (one worker reads the other's TLS). NEVER part of `default`.
fsbase-demo-nofix = ["arch-x86_64?/fsbase-demo-nofix"]
# P4·SMP·S4a verification-only: the cross-CPU scheduling demo. The BSP spawns
# N > cpu_count workers round-robin across the online CPUs; the kernel logs
# `sched: pid P -> cpu K` (non-golden-shape) when each worker first runs on a CPU.
# Under `-smp 4` workers appear on multiple distinct cpu_index, proving APs run
# processes. Both arch backends define `smp-sched-demo`; the DEFAULT build keeps
# the golden serial untouched. See P4_SMP_S4_PLAN.md S4a.
smp-sched-demo = ["arch-aarch64?/smp-sched-demo", "arch-x86_64?/smp-sched-demo"]

# Each build links exactly one arch backend. The backend supplies the `_start`
# entry symbol and the `#[panic_handler]` for the freestanding binary, so the
# kernel crate itself does not (and must not) define a second one. Declared
# `optional` so the `?/` feature-forwarding above is legal; re-enabled via the
# `_arch` default feature so they are always present per target.
[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { workspace = true, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { workspace = true, optional = true }

[lints]
workspace = true
