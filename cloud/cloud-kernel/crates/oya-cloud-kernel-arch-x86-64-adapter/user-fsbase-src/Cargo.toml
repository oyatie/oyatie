# user-fsbase-x86_64: a no_std/no_main ring-3 PID1 supervisor that proves the
# x86_64 arch_prctl FS-base-per-process fix. It clones TWO worker children that
# each `execve` the std/musl TLS worker (fsbase-worker-x86_64). Two concurrent
# musl processes each set a DISTINCT `%fs` base; the kernel's 10 ms timer
# preemption interleaves them, so the per-process FS-base save/restore in
# `process::switch_to` is what keeps each worker reading ITS OWN TLS. PID1 reaps
# both and exits 0.
#
# This is NOT a workspace member (it links at the user base 0x40_0000 with its
# own linker script and issues raw `syscall`, so it is outside the kernel TCB).
# Built standalone (see build.sh) so the kernel workspace's `.cargo/config.toml`
# (which injects the kernel x86_64 PVH linker script into every build) does not
# leak in.
#
# Build it standalone with the isolating wrapper:
#   crates/arch-x86_64/user-fsbase-src/build.sh
# Output: out/user-fsbase-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

# Empty `[workspace]` table: detaches this manifest from the parent kernel
# workspace (it sits inside the repo tree, so cargo would otherwise merge it).
[workspace]

[package]
name = "user-fsbase-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 PID1 fsbase supervisor: clones TWO musl TLS workers, reaps both, via raw x86_64 syscalls."

[[bin]]
name = "user-fsbase-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
