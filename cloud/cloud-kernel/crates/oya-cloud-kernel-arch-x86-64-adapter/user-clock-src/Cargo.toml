# user-clock-x86_64: the ring-3 program that proves real timekeeping + the clock
# syscalls (P3 slice 3, Tier 1) advance. The x86_64 analogue of
# ../../../kernel-usermode-tests/clock (aarch64).
#
# NOT a workspace member; built standalone (see build.sh) so the kernel
# workspace's `.cargo/config.toml` does not leak in.
#   crates/arch-x86_64/user-clock-src/build.sh
# Output: out/user-clock-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

[workspace]

[package]
name = "user-clock-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 timekeeping demo: clock_gettime/nanosleep prove time advances via raw x86_64 syscalls."

[[bin]]
name = "user-clock-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
