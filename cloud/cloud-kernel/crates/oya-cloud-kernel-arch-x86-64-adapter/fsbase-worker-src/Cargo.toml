# fsbase-worker-x86_64: a real Rust std/musl worker that proves the x86_64
# arch_prctl FS-base-per-process fix. Two copies run concurrently (PID1 clones
# two children that each execve this image); each sets its own `%fs` base via
# musl's arch_prctl(ARCH_SET_FS) startup and stores its pid in `%fs:`-relative
# TLS, re-reading it across scheduler preemptions. Built INSIDE Docker
# (rust:alpine, --platform linux/amd64) to a fully-static x86_64 musl ELF, the
# same recipe that produces out/svc-x86_64.elf. See build.sh.
#
# This is NOT a workspace member — it is a `std` musl binary built standalone
# with its own toolchain inside Docker, outside the kernel `no_std` workspace.

# Empty `[workspace]` table detaches this manifest from any parent workspace.
[workspace]

[package]
name = "fsbase-worker-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "std/musl TLS worker: stores its pid in thread-local storage and re-checks it across preemptions, proving per-process %fs base restore."

[[bin]]
name = "fsbase-worker-x86_64"
path = "src/main.rs"
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
