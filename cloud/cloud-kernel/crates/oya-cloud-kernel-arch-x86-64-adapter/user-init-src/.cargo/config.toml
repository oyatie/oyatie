# Standalone cargo config for the user-init-x86_64 ring-3 program.
#
# This crate is NOT a workspace member, so building from this directory uses
# THIS config (not the kernel's). We build-std because there is no precompiled
# core for x86_64-unknown-none, but we link with the *user* linker script (user
# base 0x40_0000), not the kernel's PVH script.

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-static",
]
