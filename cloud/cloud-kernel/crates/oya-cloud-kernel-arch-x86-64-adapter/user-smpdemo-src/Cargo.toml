# user-smpdemo-x86_64: a ring-3 user program that fans out N > cpu_count worker
# processes to PROVE cross-CPU scheduling under `-smp` (P4·SMP·S4a). The x86_64
# analogue of the aarch64 user-smpdemo. Built standalone (NOT a workspace member)
# so the kernel workspace `.cargo/config.toml` does not leak in.
#
# Build it standalone with the wrapper:
#   crates/arch-x86_64/user-smpdemo-src/build.sh
# Output: out/user-smpdemo-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

# Empty `[workspace]` table: detaches this manifest from the parent kernel
# workspace (it sits inside the repo tree, so cargo would otherwise merge it).
[workspace]

[package]
name = "user-smpdemo-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 cross-CPU scheduling demo: fork N>cpu_count workers, wait4 all, via raw x86_64 syscalls."

[[bin]]
name = "user-smpdemo-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
