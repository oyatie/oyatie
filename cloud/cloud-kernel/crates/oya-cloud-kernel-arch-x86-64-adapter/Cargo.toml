[package]
name = "oya-cloud-kernel-arch-x86-64-adapter"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "x86_64 Frame backend: PVH boot, long-mode trampoline, GDT/IDT, 16550 UART, PIC/PIT timer. The only place unsafe lives for x86."

[package.metadata.oya]
microservice = "cloud-kernel"
bounded_context = "cloud-kernel"
kind = "shared"
layer = "adapter"
owner_team = "axis-cloud-platform"
purpose = "x86_64 kuberos Frame backend adapter: PVH boot, long-mode trampoline, GDT/IDT, UART/PIC/PIT, and Talos-compatibility verification images."
adr_anchors = ["ADR-0512", "ADR-0520", "ADR-0536", "ADR-0562", "ADR-0378", "ADR-0382"]
design_non_claim = "scaffold_only_no_module_build_boot_artifact_or_runtime_readiness_claim"

[features]
# Verification-only: switch the embedded USER_ELF (include_bytes!) to the
# signal-demo program (out/user-signal-x86_64.elf) instead of the default
# user-spawn image. The default build (no feature) keeps the golden untouched.
signal-demo = []
# Verification-only: switch the embedded USER_ELF to the clock-demo program
# (out/user-clock-x86_64.elf) instead of the default user-spawn image. The
# default build (no feature) keeps the golden untouched. See P3_TIMEKEEPING_SPEC.
clock-demo = []
# Verification-only: switch the embedded USER_ELF to the REAL talos-svc binary
# cross-built for x86_64-unknown-linux-musl (out/svc-x86_64.elf) — the same
# unmodified Rust-std/musl workload that runs on aarch64 (out/svc.elf). Proves
# the x86_64 syscall surface hosts musl C-runtime startup to a clean exit. The
# default build (no feature) keeps the golden untouched. See P3_PARITY_FLOOR_PLAN.
svc-demo = []
# Milestone-2 Slice-0: switch the embedded USER_ELF to the REAL, unmodified
# **talos-init** PID1 binary cross-built for x86_64-unknown-linux-musl as a
# static non-PIE ET_EXEC (out/talos-init-x86_64.elf) — the talos-machined
# 7-phase boot sequencer. Captures where the real init first aborts (expected:
# the phase-1 mount(2) ENOSYS). The default build (no feature) keeps the golden
# untouched. See MILESTONE_2_PLAN.md Slice 0.
talos-init = []
# Verification-only: the parity-floor capstone. Switch the embedded USER_ELF to
# the no_std **PID1 init supervisor** (out/user-init-x86_64.elf) AND swap the
# `execve` target (EXEC_ELF) to the REAL talos-svc musl binary
# (out/svc-x86_64.elf) so PID1's cloned child becomes the real svc worker. The
# default build (no feature) keeps the golden untouched. See P3_PARITY_FLOOR_PLAN
# Slice C.
init-demo = []
# Verification-only: the FS-base-per-process fix proof. Switch the embedded
# USER_ELF to the no_std **PID1 fsbase supervisor** (out/user-fsbase-x86_64.elf)
# which clones TWO worker children, AND swap the `execve` target (EXEC_ELF) to a
# real std/musl TLS worker (out/fsbase-worker-x86_64.elf) that sets a `__thread`
# variable to its own pid and re-reads it across several clock_nanosleep yields.
# Two concurrent musl processes set DISTINCT `%fs` bases; the 10 ms timer
# preemption interleaves them. With the fix each reads ITS OWN TLS; PID1 reaps
# both -> OK. The default build (no feature) keeps the golden untouched. See
# THE FIX-PROOF GATE in the task brief.
fsbase-demo = []
# Falsifiability toggle: compile the FS-base restore in `process::switch_to` OUT,
# reproducing the ORIGINAL bug. Built together with `fsbase-demo` it makes the
# two concurrent musl workers clobber each other's `%fs` base after a preemption
# -> one reads the other's TLS -> visible corruption/crash. Proves the demo
# actually exercises the fix. NEVER part of `default`.
fsbase-demo-nofix = []
# P4·SMP·S4a verification-only: enable the cross-CPU scheduling demo. The BSP
# spawns N > cpu_count worker processes round-robin across the online CPUs; the
# kernel logs a NON-golden-shape `sched: pid P -> cpu K` line the first time each
# worker runs on a CPU. Under `-smp 4` those lines show workers on MULTIPLE
# distinct cpu_index (0,1,2,3), proving the APs actually run processes. The
# DEFAULT build (no feature) keeps the golden serial byte-identical. Switches the
# embedded USER_ELF to the no_std fan-out supervisor (out/user-smpdemo-x86_64.elf).
smp-sched-demo = []

[dependencies]
hal = { workspace = true }
# The loom/Miri-verified concurrency substrate. Used for the timekeeper base: a
# single `ksync::SeqLock` publishes the two tick-varying words
# `(counter_at_base, mono_ns_base)` at init; `clock_gettime` reads a consistent
# snapshot lock-free. The SeqLock is itself unsafe-free; the only new unsafe in
# this crate is the `rdtsc` read in `timekeeping.rs`.
ksync = { package = "kernel-ksync-kernel", path = "../../../../kernel/core/ksync-kernel" }
# Arch-neutral, pure, host-testable EL0/ring-3 user-layout math: the Linux/SysV
# initial-stack + auxv builder, user-pointer range checks, TLS variant-I math.
# The single source of truth shared with arch-aarch64; the x86_64 ELF loader +
# ring-3 stack builder in `user.rs` reuse `build_stack_image`/`user_range_ok`.
user_layout = { workspace = true }

# Vetted no_std hardware crates (see ALLOWED_CRATES.md), gated to the x86_64
# target so a host `cargo check` of this crate never compiles x86-only code.
[target.'cfg(target_arch = "x86_64")'.dependencies]
# `abi_x86_interrupt` gates the `HandlerFuncType` impls so IDT entries accept
# our `extern "x86-interrupt"` handlers.
x86_64 = { workspace = true, features = ["abi_x86_interrupt"] }
uart_16550 = { workspace = true }
pic8259 = { workspace = true }
spin = { workspace = true }
# Global heap allocator over the Frame's static RAM region. Only the Frame
# installs the #[global_allocator].
linked_list_allocator = { workspace = true }

[lints]
workspace = true
