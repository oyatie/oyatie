# user-signal-x86_64: the ring-3 program that exercises the operating-system real POSIX
# signal-delivery slice (and the VFS fd paths) end to end. The x86_64 analogue
# of ../../../kernel-usermode-tests/signal (aarch64).
#
# NOT a workspace member; built standalone (see build.sh) so the kernel
# workspace's `.cargo/config.toml` does not leak in.
#   crates/arch-x86_64/user-signal-src/build.sh
# Output: out/user-signal-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

[workspace]

[package]
name = "user-signal-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 signal-delivery demo: rt_sigaction/tgkill/handler/rt_sigreturn + VFS fds via raw x86_64 syscalls."

[[bin]]
name = "user-signal-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
