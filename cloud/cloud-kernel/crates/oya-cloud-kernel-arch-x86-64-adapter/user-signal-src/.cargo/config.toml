# Standalone cargo config for the user-signal-x86_64 ring-3 program (NOT a
# workspace member). Build-std for core; link with the user linker script at the
# user base 0x40_0000.

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-static",
]
