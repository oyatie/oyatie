# user-procinfo-x86_64: the ring-3 program that proves the WAVE 1 libc-init /
# process-info syscalls (uname, umask, getrusage, times, clock_getres, prctl)
# return REAL results (never -ENOSYS) on x86_64. The conformance sibling of
# ../user-clock-src.
#
# NOT a workspace member; built standalone (see build.sh) so the kernel
# workspace's `.cargo/config.toml` does not leak in.
#   crates/arch-x86_64/user-procinfo-src/build.sh
# Output: out/user-procinfo-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

[workspace]

[package]
name = "user-procinfo-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 WAVE1 conformance probe: uname/umask/getrusage/times/clock_getres/prctl via raw x86_64 syscalls."

[[bin]]
name = "user-procinfo-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
