# user-exec-x86_64: the tiny ring-3 program that user-spawn's child `execve()`s
# into, demonstrating the kernel replaces a process image while keeping the pid.
# It prints its pid/ppid and `exit(7)`s. The x86_64 analogue of
# ../../../kernel-usermode-tests/exec (aarch64).
#
# NOT a workspace member; built standalone (see build.sh) so the kernel
# workspace's `.cargo/config.toml` does not leak in.
#   crates/arch-x86_64/user-exec-src/build.sh
# Output: out/user-exec-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

[workspace]

[package]
name = "user-exec-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 execve target: prints pid/ppid then exit(7) via raw x86_64 syscalls."

[[bin]]
name = "user-exec-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
