# Standalone cargo config for the user-hello-x86_64 ring-3 program.
#
# This crate is NOT a workspace member, so building from this directory uses
# THIS config (not the kernel's). We still build-std because there is no
# precompiled core for x86_64-unknown-none, but we link with the *user* linker
# script (user base 0x40_0000), not the kernel's PVH script.

[unstable]
# No precompiled core for x86_64-unknown-none; compile it from source. We only
# need `core` (no alloc, no heap) plus compiler-builtins' mem intrinsics for any
# memcpy/memset the codegen emits.
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # Link at the fixed user base with our user linker script.
    "-C", "link-arg=-Tuser.ld",
    # Static, non-PIE: the loader maps PT_LOAD at the recorded vaddrs verbatim.
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-static",
]
