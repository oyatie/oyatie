# user-hello-x86_64: a tiny freestanding ring-3 user program for kernel.
#
# This is NOT a workspace member (it is not listed in the root Cargo.toml). It
# is built standalone so the kernel workspace's `.cargo/config.toml` (which
# injects the *kernel* x86_64 linker script + PVH flags into every build) does
# not leak into this user binary. A user program must link at the user base
# 0x40_0000 with its own script (user.ld) and may use `unsafe` for the raw
# `syscall` instruction — it is user space, not part of the kernel TCB.
#
# Build it standalone from this directory:
#   cargo build --release   # target pinned in .cargo/config.toml
# then copy target/x86_64-unknown-none/release/user-hello-x86_64 to
#   ../../../out/user-x86_64.elf

# Empty `[workspace]` table: detaches this manifest from the parent kernel
# workspace (it sits inside the repo tree, so cargo would otherwise try to merge
# it). The kernel workspace also lists this dir in its `[workspace] exclude`.
[workspace]

[package]
name = "user-hello-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Freestanding ring-3 user-space hello: raw Linux x86_64 syscalls (syscall)."

[[bin]]
name = "user-hello-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

# A user program is freestanding too: no unwinder, abort on panic, small.
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
