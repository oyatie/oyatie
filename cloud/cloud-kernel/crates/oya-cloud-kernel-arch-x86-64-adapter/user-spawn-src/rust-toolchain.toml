# Match the kernel toolchain: `-Z build-std` (nightly-only) to cross-
# compile `core` for the bare-metal x86_64 target, plus `rust-src` for the
# sources and `llvm-tools` for objcopy/readelf-style inspection.
[toolchain]
channel = "nightly-2026-02-28"
components = ["rust-src", "rustfmt", "clippy", "llvm-tools"]
targets = [
    "x86_64-unknown-none",
]
