# user-spawn-x86_64: a ring-3 user program that exercises the operating-system process
# model end to end via raw Linux/x86_64 syscalls (`syscall`).
#
# This is NOT a workspace member (it links at the user base 0x40_0000 with its
# own linker script and issues raw `syscall`, so it is outside the kernel TCB).
# It is built standalone so the kernel workspace's `.cargo/config.toml` (which
# injects the *kernel* x86_64 linker script + PVH flags into every build) does
# not leak in. The x86_64 analogue of ../../../kernel-usermode-tests/spawn (aarch64).
#
# Build it standalone with the wrapper that isolates it from the parent config:
#   crates/arch-x86_64/user-spawn-src/build.sh
# Output: out/user-spawn-x86_64.elf (static, non-PIE ELF64, EM_X86_64, ET_EXEC).

# Empty `[workspace]` table: detaches this manifest from the parent kernel
# workspace (it sits inside the repo tree, so cargo would otherwise merge it).
[workspace]

[package]
name = "user-spawn-x86_64"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
description = "Ring-3 process-model demo: clone()/wait4()/execve()/exit via raw x86_64 syscalls."

[[bin]]
name = "user-spawn-x86_64"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
