# Kernels need `-Z build-std` (cross-compiling core/alloc for a bare-metal
# target) which is a nightly-only feature. We pin an exact nightly so the
# build is reproducible across machines and over time.
[toolchain]
channel = "nightly-2026-02-28"
components = ["rust-src", "rustfmt", "clippy", "llvm-tools"]
targets = [
    "aarch64-unknown-none-softfloat",
    "x86_64-unknown-none",
]
