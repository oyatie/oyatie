# Build-std: there are no precompiled core/alloc for our bare-metal targets,
# so Cargo must compile them from source (requires the `rust-src` component,
# pinned in rust-toolchain.toml). compiler-builtins/mem gives us the
# memcpy/memset/etc symbols the compiler emits but that have no libc to supply.
[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# Default build target so a bare `cargo build -p kernel` is unambiguous on this
# host. Override on the CLI with `--target x86_64-unknown-none` for x86.
[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# Use our linker script to place the image at the QEMU `virt` load address.
rustflags = [
    "-C", "link-arg=-Tcrates/oya-cloud-kernel-arch-aarch64-adapter/linker.ld",
    "-C", "target-cpu=cortex-a72",
    # Inert-safe CFI hardening: emit BTI landing pads (`bti`) and return-address
    # PAC sign/auth (`pac-ret`). On cortex-a72 (ARMv8.0, no FEAT_BTI / FEAT_PAuth)
    # these lower to NOP-space hint instructions, so they cost nothing and cannot
    # fault here, but the codegen path is exercised so it is ready on real v8.5 HW.
    "-Z", "branch-protection=bti,pac-ret",
]

[target.x86_64-unknown-none]
# Use our PVH linker script (places the image at 2 MiB, emits the PHYS32_ENTRY
# note, and keeps the boot trampoline + page tables in the right sections).
# `relocation-model=static` + `-no-pie` so the boot trampoline's 32-bit absolute
# relocations (R_X86_64_32 against `_start`, page tables, stack) resolve to
# fixed low addresses instead of requiring PIC. The image is linked at 2 MiB
# (< 2 GiB), so the small code model with absolute addressing is correct.
rustflags = [
    "-C", "link-arg=-Tcrates/oya-cloud-kernel-arch-x86-64-adapter/linker.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-no-pie",
    # Inert-safe CFI hardening: CET indirect-branch tracking — emit an ENDBR64 at
    # every indirect-branch target. On a CPU without CET-IBT enabled (our qemu64
    # core does not turn IBT on) ENDBR64 decodes as a NOP, so it cannot fault
    # here, but the codegen path is exercised and the image is IBT-ready.
    "-Z", "cf-protection=branch",
]
