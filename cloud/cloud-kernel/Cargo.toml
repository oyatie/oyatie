# cloud-kernel — the kuberos framekernel (HANDOFF §4 founder-authoritative destination;
# imported from consolidate/kernel-snapshot-2026-06-08 stack/kernel, G12 LANE-1).
#
# This is a NESTED cargo workspace, intentionally NOT a member of the repo-root
# workspace: every crate here is bare-metal no_std (nightly `-Z build-std`,
# aarch64-unknown-none-softfloat / x86_64-unknown-none targets, custom linker
# scripts via .cargo/config.toml) and cannot build with the host toolchain the
# root workspace uses. Build from this directory (rust-toolchain.toml pins the
# nightly): `cargo build` (aarch64 default) / `cargo build --target x86_64-unknown-none`.
[workspace]
resolver = "2"
members = [
    "crates/oya-cloud-kernel-app",
    "crates/oya-cloud-kernel-arch-aarch64-adapter",
    "crates/oya-cloud-kernel-arch-x86-64-adapter",
    "crates/oya-cloud-kernel-frame-kernel",
    "crates/oya-cloud-kernel-ksync-kernel",
    "crates/oya-cloud-kernel-user-layout-kernel",
]
# The host test harness for the pure EL0 user-layout math is intentionally NOT a
# workspace member: it is a plain `std` crate that must build with libtest's
# precompiled `core`, so it cannot inherit this workspace's `.cargo/config.toml`
# (bare-metal target + `build-std`). Run it explicitly:
#   cargo test --manifest-path crates/oya-cloud-kernel-arch-aarch64-adapter/tests-host/Cargo.toml
exclude = [
    "crates/oya-cloud-kernel-arch-aarch64-adapter/tests-host",
    # The freestanding x86_64 ring-3 user programs embedded into the kernel via
    # include_bytes!. They must link at the user base 0x40_0000 with their own
    # user.ld (not the kernel's PVH script) and use `unsafe` for the raw
    # `syscall` instruction, so they are built standalone and kept out of the
    # workspace. The produced ELFs are tracked under out/ as required build
    # inputs (see .gitignore).
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-src",
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-spawn-src",
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-exec-src",
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-signal-src",
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-clock-src",
    "crates/oya-cloud-kernel-arch-x86-64-adapter/user-smpdemo-src",
    "crates/oya-cloud-kernel-arch-aarch64-adapter/user-smpdemo-src",
]

# The aarch64 EL0 user programs (hello/spawn/exec/signal/clock/init) are NOT in
# this tree: their sources are preserved on the consolidate/kernel-snapshot
# branch under stack/kernel-usermode-tests/ (destination pending in the G12
# consolidation map). The default-build embedded images are tracked under out/
# as required build inputs, like out/user-hello.elf always was.

# Shared metadata for all workspace crates.
[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["kernel contributors"]
repository = "https://github.com/jason931225/oyatie"

# Shared lint policy for all workspace crates ([lints] workspace = true).
# `loom` is a custom cfg set via RUSTFLAGS for the concurrency-model-check build
# of the ksync primitives; tell rustc it is expected so the production/Miri
# build does not warn on every `#[cfg(loom)]`.
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
# Internal crates (path deps within the workspace). The dependency KEYS keep the
# kernel's original short crate handles (hal/frame/arch-*/user_layout) so the
# source tree's `use` paths are untouched by the monorepo rename; `package = `
# maps each handle onto its conformant package name.
# `hal` is homed at kernel/ports/hal-kernel (ADR-0562) and so belongs to kernel/'s own nested
# workspace; a cross-workspace path dep still builds here under this workspace's .cargo/config.toml.
hal = { package = "kernel-hal-kernel", path = "../../kernel/ports/hal-kernel" }
frame = { package = "oya-cloud-kernel-frame-kernel", path = "crates/oya-cloud-kernel-frame-kernel" }
arch-aarch64 = { package = "oya-cloud-kernel-arch-aarch64-adapter", path = "crates/oya-cloud-kernel-arch-aarch64-adapter" }
arch-x86_64 = { package = "oya-cloud-kernel-arch-x86-64-adapter", path = "crates/oya-cloud-kernel-arch-x86-64-adapter" }
# Arch-neutral, pure, host-testable EL0 user-layout math (stack/auxv builder,
# descriptor builders, range checks, frame-pool bookkeeping, TLS variant-I,
# timer-sleep math). Single source of truth shared by every arch Frame backend.
user_layout = { package = "oya-cloud-kernel-user-layout-kernel", path = "crates/oya-cloud-kernel-user-layout-kernel" }

# Vetted external no_std crates (vetting policy preserved on the snapshot branch
# as stack/kernel/ALLOWED_CRATES.md pending its machine-readable migration).
# Nothing here may pull in `std`.
aarch64-cpu = "9.4"
# Pinned to 0.8 to match the version `aarch64-cpu` 9.4 re-exports its register
# interface traits from, so MMIO drivers and system-register access share one
# `tock_registers` (otherwise the `Readable`/`Writeable` traits do not unify).
tock-registers = "0.8"
# `use_spin` provides `LockedHeap`, a `#[global_allocator]`-ready wrapper that
# guards the heap with a spinlock (no `std`).
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
x86_64 = { version = "0.15", default-features = false }
# 16550-compatible UART driver for the x86_64 serial console (port 0x3F8).
uart_16550 = "0.3"
# Driver for the legacy 8259 PIC pair (master/slave) on x86_64.
pic8259 = "0.11"
# `Once`/`Mutex` for one-time global init of GDT/IDT/console on x86_64.
spin = { version = "0.9", default-features = false, features = ["once", "spin_mutex", "lazy"] }

# A kernel must be small and predictable. Optimize for size and abort on panic
# (no unwinding machinery in a freestanding binary).
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
