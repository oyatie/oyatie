# CN-PIPL-2021 Regulator References
# binding_adr: ADR-0251
# regulation: PIPL Article 57 (breach notification to CAC and MIIT)
# version: "1.0.0"
#
# This file defines the authoritative contact channels for the two primary
# regulators governing PIPL compliance: CAC (Cyberspace Administration of China)
# and MIIT (Ministry of Industry and Information Technology).
# Used by: wf-breach-notification-cn-pipl-72h, DSAR escalation, regulator evidence submission.

regulators:
  - regulator_id: CAC
    full_name_en: "Cyberspace Administration of China"
    full_name_zh: "国家互联网信息办公室"
    abbreviation: CAC
    statutory_authority:
      - "PIPL — primary supervisory and enforcement authority (PIPL Articles 60–65)"
      - "Cybersecurity Law of the PRC — primary enforcement (Article 49)"
      - "Data Security Law of the PRC — primary enforcement (Article 36)"
      - "CAC Measures on Security Assessment for Cross-Border Data Transfer (2022)"
      - "CAC Standard Contract Measures for Cross-Border Transfer (2023)"
      - "CAC Regulations on the Protection of Minors in Cyberspace (2024)"
    website: "https://www.cac.gov.cn"
    incident_reporting_portal: "https://www.cac.gov.cn/incident-reporting"
    incident_reporting_notes: >
      For PIPL Article 57 breach notifications: submit via the incident reporting portal.
      Portal requires: incident type, awareness timestamp, affected data classes,
      estimated subject count, suspected cause, emergency response measures taken,
      contact person name/role/phone. Maximum 72 hours from awareness per PIPL Article 57.
      Portal submission generates a confirmation number — retain this number in the audit chain.
    cross_border_assessment_portal: "https://cbdt.cac.gov.cn"
    cross_border_assessment_notes: >
      CAC security assessment for cross-border data transfer per PIPL Article 38(1)
      and CAC Measures on Security Assessment for Cross-Border Data Transfer (2022).
      Mandatory for CIIOs, processors transferring sensitive PI of ≥10,000 subjects/year,
      or processors transferring general PI of ≥1,000,000 total/≥100,000 per year.
      Assessment validity: 2 years; renewal required within 60 days before expiry.
    standard_contract_filing_notes: >
      Standard contractual clauses (Pathway 3 under PIPL Article 38) must be filed with
      the provincial-level CAC office (省级网信办) in the jurisdiction of the data exporter.
      Filing deadline: 10 business days after contract execution.
      Provincial CAC offices: see https://www.cac.gov.cn/local-offices for full list.
    provincial_offices:
      - name: "Beijing Municipal Cyberspace Administration"
        name_zh: "北京市互联网信息办公室"
        website: "https://www.bjca.gov.cn"
      - name: "Shanghai Municipal Cyberspace Administration"
        name_zh: "上海市互联网信息办公室"
        website: "https://www.sca.gov.cn"
      - name: "Guangdong Provincial Cyberspace Administration"
        name_zh: "广东省互联网信息办公室"
        website: "https://www.gdca.gov.cn"
    emergency_contact: "12377 (national internet reporting hotline)"
    language_requirement: "Submissions must be in Simplified Chinese (普通话/简体中文)"

  - regulator_id: MIIT
    full_name_en: "Ministry of Industry and Information Technology"
    full_name_zh: "工业和信息化部"
    abbreviation: MIIT
    statutory_authority:
      - "Cybersecurity Law of the PRC — network operators regulatory oversight (Articles 21–28)"
      - "Data Security Law of the PRC — industrial data governance"
      - "MIIT Regulations on the Management of Mobile Internet Applications (App规定)"
      - "MIIT Rules on Protection of User Personal Information by Telecom and Internet Service Providers (2013, amended)"
      - "MIIT Notice on Further Improving the Protection of Mobile Internet User Rights (2022)"
    website: "https://www.miit.gov.cn"
    incident_reporting_portal: "https://www.miit.gov.cn/incident-reporting"
    incident_reporting_notes: >
      MIIT incident notification is secondary to CAC for PIPL-specific breaches.
      MIIT requires notification for breaches affecting telecom or internet service
      infrastructure. Coordinate with CAC primary notification first; notify MIIT
      in parallel if the breach affects any network operator or App operator obligations.
    app_compliance_portal: "https://app.miit.gov.cn"
    app_compliance_notes: >
      MIIT oversees App compliance under the App Personal Information Collection
      Rules (2021) and the Special Rectification Actions. Violations reported at
      the App compliance portal. Annual self-assessment reports filed by December 31.
    language_requirement: "Submissions must be in Simplified Chinese (普通话/简体中文)"

  - regulator_id: SAMR
    full_name_en: "State Administration for Market Regulation"
    full_name_zh: "国家市场监督管理总局"
    abbreviation: SAMR
    statutory_authority:
      - "Anti-monopoly enforcement — data sharing mandates in merger review"
      - "Consumer rights protection under the Consumer Rights Protection Law"
      - "Online transaction platform oversight (relevant for marketplace features)"
    website: "https://www.samr.gov.cn"
    notes: >
      SAMR is the tertiary regulator relevant for CN-PIPL-2021 pack. Primarily relevant
      for tenants operating marketplace, e-commerce, or financial platform features in China.
      Not the primary breach notification recipient — escalate to CAC first.
    language_requirement: "Submissions must be in Simplified Chinese"

certification_bodies:
  - body_id: CCRC
    full_name_en: "China Cybersecurity Review Technology and Certification Center"
    full_name_zh: "中国网络安全审查技术与认证中心"
    abbreviation: CCRC
    role: >
      CAC-accredited certification institution for Personal Information Protection
      Certification (PIPL Article 38(2) Pathway 2). Issues PI protection certifications
      valid for 3 years. Primary certification body for cross-border transfer compliance.
    website: "https://www.ccrc.org.cn"
    certification_product: "个人信息保护认证 (Personal Information Protection Certification)"
    notes: >
      CCRC is the only CAC-accredited body (as of 2024) that issues PI protection
      certifications recognized under PIPL Article 38 Pathway 2. Certification scope
      covers: data controller/processor practices, cross-border transfer mechanisms,
      technical and organizational measures. Duration: typically 6–12 months assessment.
    language_requirement: "Certification process conducted in Simplified Chinese"

hyperscaler_references:
  - vendor: "AWS China (Sinnet/NWCD)"
    operator: "Beijing Sinnet Technology Co., Ltd. (北京光环新网科技股份有限公司) — Beijing region; NWCD (宁夏西云数据科技有限公司) — Ningxia region"
    pipl_compliance_approach: >
      AWS China operates as two separate legal entities (Sinnet for cn-north-1/cn-north-4,
      NWCD for cn-northwest-1) under ICP licenses. Data plane is physically isolated in
      mainland China. AWS Artifact China provides compliance reports. CAC security assessments
      completed for cross-border workloads. BYOK via AWS KMS China region (CN endpoints only).
    relevant_services: "AWS KMS China, AWS CloudTrail China, Amazon S3 China"
    docs: "https://www.amazonaws.cn/en/compliance/"

  - vendor: "Alibaba Cloud (阿里云)"
    operator: "Alibaba Cloud Intelligence Group"
    pipl_compliance_approach: >
      Alibaba Cloud's Data Security Center (数据安全中心 DSC) provides automated
      PI classification, consent management integration, and PIPL-compliant data
      processing agreements. Mainland-China regions (cn-hangzhou, cn-beijing, cn-shanghai,
      cn-shenzhen, cn-zhangjiakou) are physically and logically isolated from international
      regions. KMS (密钥管理服务) supports customer-managed keys (BYOK equivalent) with
      HSM backing. PIPL compliance toolkit published at: https://www.alibabacloud.com/pipl
    relevant_services: "Alibaba Cloud DSC, KMS, MaxCompute (data governance), PAI (ML with PI controls)"
    docs: "https://www.alibabacloud.com/trust-center/pipl"

  - vendor: "Tencent Cloud (腾讯云)"
    operator: "Tencent Cloud Computing (Beijing) Co., Ltd."
    pipl_compliance_approach: >
      Tencent Cloud's compliance center covers PIPL, Cybersecurity Law, and Data Security
      Law. Data residency enforced in mainland-China regions (ap-beijing, ap-shanghai,
      ap-guangzhou, ap-chengdu). Key Management Service (KMS) provides BYOK. Personal
      information management portal (个人信息管理中心) implements 15-business-day DSAR
      response SLA matching PIPL Article 45. Minors cyberspace regulations (2024) enforced
      via real-name authentication and parental consent workflows.
    relevant_services: "Tencent Cloud KMS, COS (Object Storage) with PI classification, TDSQL"
    docs: "https://www.tencentcloud.com/document/product/1078"

  - vendor: "Microsoft Azure China (21Vianet)"
    operator: "21Vianet Group, Inc. (世纪互联集团)"
    pipl_compliance_approach: >
      Azure China (operated by 21Vianet) is a physically separate instance from global Azure.
      Datacenters in China North (Beijing/Hebei) and China East (Shanghai). Azure Key Vault
      China supports customer-managed keys. Microsoft Purview Compliance Manager China
      edition provides PIPL assessment templates and evidence collection. CAC security
      assessment completed for cross-border workloads. Data residency commitments in
      21Vianet's data processing addendum explicitly bind all data to mainland China.
    relevant_services: "Azure Key Vault China, Microsoft Purview Compliance Manager China, Azure Monitor China"
    docs: "https://docs.azure.cn/zh-cn/articles/azure-operations-guide/others/aog-others-howto-understand-pipl"
