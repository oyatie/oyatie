# CN-PIPL-2021 Breach Notification Workflow
# workflow_id: wf-breach-notification-cn-pipl-72h
# binding_adr: ADR-0251 §D-8
# regulation: PIPL Article 57 — upon occurrence of personal information leakage, tampering,
#             or loss, the personal information processor shall immediately initiate emergency
#             response measures; notify the competent CAC authority and affected individuals
#             without undue delay; maximum 72 hours from awareness to notification.
#
# Hyperscaler precedent:
#   Alibaba Cloud's security incident response SLA for PIPL-covered Chinese-resident data
#   commits to a 72-hour notification to CAC. AWS China (Sinnet/NWCD) follows the same
#   cadence under its ICP-licensed operations agreement.
#
# Upstream law: Cybersecurity Law Article 42; Data Security Law Article 29.

workflow_id: wf-breach-notification-cn-pipl-72h
version: "1.0.0"
pack_id: CN-PIPL-2021
description: >
  Durable Workflow Engine workflow for PIPL Article 57 breach notification.
  Implements the 72-hour maximum cadence for notifying the Cyberspace Administration
  of China (CAC) and affected data subjects. Emits BreachNotificationStep audit events
  at every stage per ADR-0251 §D-8.

triggers:
  - event_class: SecurityIncidentConfirmed
    condition: "incident.data_classes intersects ['PI_CN_PIPL', 'PI_CN_SENSITIVE']"
  - event_class: ManualBreachReport
    condition: "report.pack_scope contains 'CN-PIPL-2021'"

sla:
  awareness_to_cac_notification_max_hours: 72
  awareness_to_subject_notification_max: "without_undue_delay"
  post_mortem_deadline_days: 30
  regulation_reference: "PIPL Article 57"

stages:
  - stage_id: detect
    name: "Detect and Classify"
    deadline_from_trigger_hours: 1
    steps:
      - step: "Confirm breach vs false positive via oyatie.security.incident-response principal"
      - step: "Classify: does incident involve PI_CN_PIPL or PI_CN_SENSITIVE data?"
      - step: "Identify affected tenant(s) and cell(s)"
      - step: "Record detection timestamp — this is the 'awareness' T=0 for all SLA deadlines"
    audit_event_class: CnPiplBreachDetect
    on_failure: "Escalate to CISO + DPO immediately; do not advance pipeline"

  - stage_id: triage
    name: "Triage and Preliminary Scope"
    deadline_from_trigger_hours: 4
    steps:
      - step: "Enumerate affected data classes (PI_CN_PIPL, PI_CN_SENSITIVE, or both)"
      - step: "Estimate number of affected data subjects (preliminary count)"
      - step: "Determine if cross-border data egress occurred (PIPL Article 40 localization check)"
      - step: "Notify internal stakeholders: CISO, DPO, Legal, CN operations lead"
      - step: "Open incident record in audit chain with class CnPiplBreachTriage"
    audit_event_class: CnPiplBreachTriage
    on_failure: "Halt processing; escalate to incident commander"

  - stage_id: early_response
    name: "Initiate Emergency Response Measures"
    deadline_from_trigger_hours: 6
    steps:
      - step: "Activate emergency response measures per PIPL Article 57(1)"
      - step: "Isolate affected systems if active exfiltration is suspected"
      - step: "Preserve forensic evidence (Merkle-sealed audit chain snapshot)"
      - step: "Assess whether CAC notification threshold is met (any confirmed breach of PI_CN_PIPL triggers notification)"
    audit_event_class: CnPiplBreachEmergencyResponse
    on_failure: "Escalate immediately; log all actions regardless"

  - stage_id: cac_notification
    name: "CAC Notification (≤72h from awareness)"
    deadline_from_trigger_hours: 72
    regulator: CAC
    notification_endpoint: "https://www.cac.gov.cn/incident-reporting"
    required_fields:
      - incident_type
      - awareness_timestamp
      - affected_data_classes
      - affected_subject_count_estimate
      - affected_regions_in_china
      - suspected_cause
      - cross_border_egress_occurred
      - emergency_response_measures_taken
      - contact_person_name_and_role
      - contact_person_phone
    template_ref: "packs/cn-pipl/templates/cac-notification.md.tmpl"
    steps:
      - step: "Populate CAC notification template with all required_fields"
      - step: "Obtain sign-off from DPO and CN operations lead"
      - step: "Submit to CAC via cac.gov.cn incident reporting portal"
      - step: "Retain CAC submission confirmation number in audit chain"
      - step: "If CAC portal unavailable, submit via MIIT backup channel (see regulator-references.yaml)"
    audit_event_class: CnPiplBreachCacNotification
    sla_deadline_check: "T+72h from awareness_timestamp"
    on_sla_breach: "Log SLA_BREACH event; notify CISO + external CN legal counsel immediately"
    on_failure: "Retry with exponential backoff; escalate after 3 failures"

  - stage_id: subject_notification
    name: "Subject Notification (without undue delay)"
    deadline_guidance: "Immediately after CAC notification; no artificial delay"
    steps:
      - step: "Enumerate affected data subjects via DSAR cascade engine (ADR-0242 §D-4)"
      - step: "For each affected subject: send notification via preferred channel (in-app + email + SMS if available)"
      - step: "Notification content: what happened, what data was affected, what the controller is doing, how subjects can protect themselves, contact channel for follow-up questions"
      - step: "For subjects whose contact information is unavailable: public notice via platform homepage"
      - step: "Log all subject notification delivery receipts to audit chain"
    notification_template_ref: "packs/cn-pipl/templates/subject-notification.md.tmpl"
    audit_event_class: CnPiplBreachSubjectNotification
    on_failure: "Log delivery failures; attempt alternative channels; document for CAC follow-up"

  - stage_id: remediation
    name: "Remediation Tracking"
    deadline_from_trigger_days: 14
    steps:
      - step: "Track each remediation action to completion in audit chain"
      - step: "Patch affected systems; rotate compromised keys (BYOK rotation per ADR-0251 §D-10)"
      - step: "Re-run cell certification coherence check (oya gate validate cell-certification-coherence)"
      - step: "Verify data localization compliance post-incident (no residual CN data in non-CN cells)"
    audit_event_class: CnPiplBreachRemediation
    on_failure: "Escalate; do not close incident until all steps complete"

  - stage_id: post_mortem
    name: "Post-Mortem and Final Report"
    deadline_from_trigger_days: 30
    steps:
      - step: "Complete multispectrum-reviewed post-mortem"
      - step: "Root cause analysis: how did the breach occur?"
      - step: "Full impact assessment: total subjects affected; data classes exposed; duration"
      - step: "Lessons learned and recurrence prevention measures"
      - step: "File final supplementary report with CAC if required (complex incidents)"
      - step: "Publish internal post-mortem to DPO + CISO + CN legal + executive team"
      - step: "Seal post-mortem in audit chain as CnPiplBreachPostMortem event"
    audit_event_class: CnPiplBreachPostMortem
    regulation_reference: "PIPL Article 57; ADR-0251 §D-8 step 7 (post-mortem)"
    on_failure: "Do not close incident until post-mortem is sealed in audit chain"

post_workflow:
  incident_closure_requires:
    - cac_notification_confirmed: true
    - subject_notification_confirmed: true
    - remediation_completed: true
    - post_mortem_sealed: true
  audit_event_class_on_close: CnPiplBreachClosed
  retention_of_incident_record: "P5Y"
  retention_rationale: "PIPL Article 19; regulatory guidance recommends retaining breach records for the duration of the statutory limitation period"
