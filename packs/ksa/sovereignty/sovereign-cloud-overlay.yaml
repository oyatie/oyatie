# KSA regional pack sovereign cloud overlay (ADR-0179).
# Awaiting regulator sign-off per registry/sovereign-cloud/per-pack-overlay-status.tsv.
authored: 2026-05-18
authority: ADR-0179
schema: /specs/sovereign-cloud-overlays.json

pack_id: ksa

primary_provider:
  id: stc-cloud
  regions:
    - ksa-riyadh-1
    - ksa-jeddah-1
  certifications:
    - NDMO-2023
    - SDAIA-CCC-V1
    - ISO-27001
    - ISO-27017
    - SAMA-CSF
  contract_id: STC-CLOUD-2026-001
  sla_minimum_availability: 99.9
  data_residency_guarantee: ksa-only
  notes: |
    STC Cloud's NDMO-certified substrate. Primary KSA sovereign substrate
    per SDAIA Cloud Computing Compliance V1.

secondary_provider:
  id: mobily-cloud
  regions:
    - ksa-jeddah-2
  certifications:
    - NDMO-2023
    - SDAIA-CCC-V1
  contract_id: MOBILY-CLOUD-2026-001
  sla_minimum_availability: 99.5
  data_residency_guarantee: ksa-only
  notes: |
    Mobily Cloud's NDMO-certified DR substrate. Used for active-passive
    cross-region replication per ADR-0180 T2 tier for KSA-bound data.

sovereign_data_classes:
  - PII_KSA                      # personal data per KSA PDPL
  - GOV_DATA_KSA                 # data classified under KSA Govt-Internal
  - FINANCIAL_KSA                # SAMA-supervised financial-sector data
  - HEALTH_RECORD_KSA            # health data per MOH classification
  - HAJJ_PILGRIM_KSA             # pilgrim data per MoHU classification

non_sovereign_data_class_fallbacks:
  - provider: aws
    regions:
      - me-south-1               # AWS Bahrain
    data_classes:
      - PUBLIC
      - ANONYMIZED
      - SHARED_LEARNING

prohibited_egress:
  - data_class: PII_KSA
    to_provider: '*non-ksa*'
  - data_class: GOV_DATA_KSA
    to_provider: '*non-ksa*'
  - data_class: FINANCIAL_KSA
    to_provider: '*non-ksa*'
  - data_class: HEALTH_RECORD_KSA
    to_provider: '*non-ksa*'
  - data_class: HAJJ_PILGRIM_KSA
    to_provider: '*non-ksa*'

audit_cadence: quarterly
regulator_pack_evidence_cadence: quarterly

regulator_engagement_calendar:
  - regulator: NDMO (National Data Management Office)
    cadence: quarterly
  - regulator: SDAIA (Cloud Computing)
    cadence: quarterly
  - regulator: SAMA (Financial)
    cadence: quarterly
  - regulator: MOH (Health)
    cadence: semi-annual

sustainability:
  primary_provider_pue: 1.42     # higher KSA ambient temperature
  secondary_provider_pue: 1.51
  carbon_intensity_g_co2_per_kwh: 745  # KSA grid 2025 avg
