[package]
name = "k8s-control-plane-host-adapter-capi"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "kube-rs adapter implementing the ControlPlaneProvisioning port (ADR-0376) against the management cluster's Cluster API control-plane providers: hosted-tier Kamaji TenantControlPlane (controlplane.cluster.x-k8s.io) + the dedicated Talos control-plane reference. The LIVE CRD reconciliation is HONEST-DEFERRED — every port method returns ProvisioningError::Unimplemented(KamajiProviderLiveIntegration) (tracked at registry/placeholder-debt/adr-follow-ups.yaml#kamaji-provider-live-integration); NO fake success. kube-rs/k8s-openapi are isolated to THIS crate per ADR-0092 + ADR-0376."

# Adapter layer (ADR-0105). The ONLY crate in the workspace that depends on
# kube-rs / k8s-openapi (ADR-0092 adapter-only seam; ADR-0376 isolation). The
# live Kamaji/Talos CRD reconciliation is honest-deferred, so kube-rs is
# referenced for its Client + dynamic GroupVersionKind API surface and the
# adapter returns a typed Unimplemented before any reconcile.
[dependencies]
k8s-control-plane-host-kernel = { path = "../../core/control-plane-host-kernel" }
k8s-control-plane-host-api = { path = "../../ports/control-plane-host-api" }
kube = { workspace = true }
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lib]
name = "k8s_control_plane_host_adapter_capi"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
