[package]
name = "k8s-control-plane-host-api"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "The ControlPlaneProvisioning port trait + DTOs for the managed-Kubernetes control-plane-host concern (ADR-0376). This is the SHARED, transport-neutral port the sibling k8s-cluster-lifecycle-api and k8s-sla-observability-api microservices will consume to provision/observe/teardown hosted (Kamaji) and dedicated (Talos-spoke) tenant control planes. Path-dep inward on the kernel only; no kube-rs, no HTTP, no async runtime (the port is async-trait-free — it returns boxed futures like the intelligence provider-pool transport port)."

# API/port layer (ADR-0105). Owns the ControlPlaneProvisioning seam + DTOs.
# Path-dep inward on the kernel for the tier/status/datastore value types.
# serde for DTO (de)serialization across the eventual REST/gRPC projection.
[dependencies]
k8s-control-plane-host-kernel = { path = "../../core/control-plane-host-kernel" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "k8s_control_plane_host_api"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
