asyncapi: 3.1.0
info:
  title: oya-cloud-k8s — cluster events
  version: 1.0.0
  summary: Cluster lifecycle + policy + node events emitted by cloud-k8s workers
  description: |
    Cross-µservice Workflow events emitted by cloud-k8s BCs. Per ADR-0121 + ADR-0131.

    Consumers:
    - `cell` µservice (tenant cell-scheduling decisions)
    - `observability` µservice (cluster SLI + audit log forwarding)
    - `audit-chain` µservice (Ed25519 seal of every event per Bominal ADR-0028)
    - `workflow-engine` µservice (downstream policy re-eval)
    - `cloud-iac` µservice (IaC drift detection)
    - `grafana-oncall` (paging on degraded / failed states)
  contact:
    name: axis-cloud

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.cloud-k8s.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus consumed by sibling µservices.
  audit-chain-stream:
    host: audit-chain.svc.cluster.local
    protocol: grpc
    description: Direct stream to audit-chain µservice for Ed25519 seal.

channels:
  cluster-bootstrapped:
    address: workflow-events/cloud-k8s.cluster.bootstrapped
    messages:
      ClusterBootstrappedMessage:
        $ref: '#/components/messages/ClusterBootstrapped'
    description: kubeadm init completed; cluster usable

  node-joined:
    address: workflow-events/cloud-k8s.node.joined
    messages:
      NodeJoinedMessage:
        $ref: '#/components/messages/NodeJoined'
    description: kubeadm join completed; Node Ready

  node-failed:
    address: workflow-events/cloud-k8s.node.failed
    messages:
      NodeFailedMessage:
        $ref: '#/components/messages/NodeFailed'
    description: Node NotReady > 5min OR attestation failed

  node-drained:
    address: workflow-events/cloud-k8s.node.drained
    messages:
      NodeDrainedMessage:
        $ref: '#/components/messages/NodeDrained'
    description: Node successfully drained; ready for removal/repair

  network-policy-applied:
    address: workflow-events/cloud-k8s.network-policy.applied
    messages:
      NetworkPolicyAppliedMessage:
        $ref: '#/components/messages/NetworkPolicyApplied'
    description: NetworkPolicy / AuthorizationPolicy CR write succeeded

  istio-policy-changed:
    address: workflow-events/cloud-k8s.istio-policy.changed
    messages:
      IstioPolicyChangedMessage:
        $ref: '#/components/messages/IstioPolicyChanged'
    description: IstioOperator / MeshConfig / Telemetry CR mutation

  kubeadm-upgraded:
    address: workflow-events/cloud-k8s.kubeadm.upgraded
    messages:
      KubeadmUpgradedMessage:
        $ref: '#/components/messages/KubeadmUpgraded'
    description: Cluster minor-version upgrade completed

  iac-resource-planned:
    address: workflow-events/cloud-iac.resource.planned
    messages:
      IacResourcePlannedMessage:
        $ref: '#/components/messages/IacResourcePlanned'
    description: cloud-iac OpenTofu plan accepted — cloud-k8s consumes to pre-stage join token

  tenant-onboarded:
    address: workflow-events/tenancy.tenant.onboarded
    messages:
      TenantOnboardedMessage:
        $ref: '#/components/messages/TenantOnboarded'
    description: tenancy emits a new tenant; cloud-k8s derives default namespace policy

operations:
  emitClusterBootstrapped:
    action: send
    channel: {$ref: '#/channels/cluster-bootstrapped'}
  emitNodeJoined:
    action: send
    channel: {$ref: '#/channels/node-joined'}
  emitNodeFailed:
    action: send
    channel: {$ref: '#/channels/node-failed'}
  emitNodeDrained:
    action: send
    channel: {$ref: '#/channels/node-drained'}
  emitNetworkPolicyApplied:
    action: send
    channel: {$ref: '#/channels/network-policy-applied'}
  emitIstioPolicyChanged:
    action: send
    channel: {$ref: '#/channels/istio-policy-changed'}
  emitKubeadmUpgraded:
    action: send
    channel: {$ref: '#/channels/kubeadm-upgraded'}
  consumeIacResourcePlanned:
    action: receive
    channel: {$ref: '#/channels/iac-resource-planned'}
  consumeTenantOnboarded:
    action: receive
    channel: {$ref: '#/channels/tenant-onboarded'}

components:
  messages:
    ClusterBootstrapped:
      name: ClusterBootstrapped
      contentType: application/json
      summary: kubeadm init + first node Ready
      payload:
        $ref: '#/components/schemas/ClusterBootstrappedPayload'
    NodeJoined:
      name: NodeJoined
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NodeJoinedPayload'
    NodeFailed:
      name: NodeFailed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NodeFailedPayload'
    NodeDrained:
      name: NodeDrained
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NodeDrainedPayload'
    NetworkPolicyApplied:
      name: NetworkPolicyApplied
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NetworkPolicyAppliedPayload'
    IstioPolicyChanged:
      name: IstioPolicyChanged
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IstioPolicyChangedPayload'
    KubeadmUpgraded:
      name: KubeadmUpgraded
      contentType: application/json
      payload:
        $ref: '#/components/schemas/KubeadmUpgradedPayload'
    IacResourcePlanned:
      name: IacResourcePlanned
      contentType: application/json
      payload:
        type: object
        properties:
          pack: {type: string}
          plan_sha: {type: string}
          resources: {type: array, items: {type: object}}
    TenantOnboarded:
      name: TenantOnboarded
      contentType: application/json
      payload:
        type: object
        properties:
          tenant_id_hashed: {type: string}
          pack: {type: string}
          tenant_scope: {type: string, enum: [trial, production, sandbox, internal]}

  schemas:
    ClusterBootstrappedPayload:
      type: object
      required: [cluster_id, pack, region, kubeadm_version, evidence_sha, signature, bootstrapped_at]
      properties:
        cluster_id: {type: string}
        pack: {type: string}
        region: {type: string}
        kubeadm_version: {type: string}
        evidence_sha: {type: string}
        signature: {type: string, description: Ed25519}
        bootstrapped_at: {type: string, format: date-time}
        trigger_event_id: {type: string, description: ULID; the IacResourcePlanned event that triggered}

    NodeJoinedPayload:
      type: object
      required: [cluster_id, node_id, role, kernel_version, containerd_version, kubelet_version, joined_at]
      properties:
        cluster_id: {type: string}
        node_id: {type: string}
        role: {type: string, enum: [control-plane, worker]}
        az: {type: string, nullable: true}
        kernel_version: {type: string}
        containerd_version: {type: string}
        kubelet_version: {type: string}
        attestation_evidence: {type: string, description: TPM quote / sw attestation; optional per hardware}
        joined_at: {type: string, format: date-time}
        signature: {type: string}

    NodeFailedPayload:
      type: object
      required: [cluster_id, node_id, reason, detected_at]
      properties:
        cluster_id: {type: string}
        node_id: {type: string}
        reason:
          type: string
          enum: [not_ready_timeout, attestation_failed, kubelet_crashloop, hardware, kernel_panic, network_partition, manual_quarantine]
        last_known_state: {type: string}
        detected_at: {type: string, format: date-time}
        signature: {type: string}

    NodeDrainedPayload:
      type: object
      required: [cluster_id, node_id, drain_outcome, drained_at]
      properties:
        cluster_id: {type: string}
        node_id: {type: string}
        drain_outcome: {type: string, enum: [completed, pdb_violation_forced, timed_out]}
        pods_evicted: {type: integer}
        drained_at: {type: string, format: date-time}
        signature: {type: string}

    NetworkPolicyAppliedPayload:
      type: object
      required: [cluster_id, namespace, policy_name, policy_kind, applied_at, derived_from_cedar_sha]
      properties:
        cluster_id: {type: string}
        namespace: {type: string}
        policy_name: {type: string}
        policy_kind: {type: string, enum: [NetworkPolicy, AuthorizationPolicy]}
        spec_sha: {type: string}
        derived_from_cedar_sha: {type: string, description: SHA of the originating Cedar fragment}
        applied_at: {type: string, format: date-time}
        signature: {type: string}

    IstioPolicyChangedPayload:
      type: object
      required: [cluster_id, change_kind, target, change_sha, changed_at]
      properties:
        cluster_id: {type: string}
        change_kind: {type: string, enum: [IstioOperator, MeshConfig, Telemetry, PeerAuthentication, RequestAuthentication]}
        target: {type: string, description: CR name or scope}
        prior_revision: {type: string, nullable: true}
        new_revision: {type: string}
        change_sha: {type: string}
        changed_at: {type: string, format: date-time}
        signature: {type: string}

    KubeadmUpgradedPayload:
      type: object
      required: [cluster_id, from_version, to_version, outcome, completed_at]
      properties:
        cluster_id: {type: string}
        from_version: {type: string}
        to_version: {type: string}
        pre_snapshot_sha: {type: string}
        post_snapshot_sha: {type: string}
        outcome: {type: string, enum: [success, rolled_back]}
        completed_at: {type: string, format: date-time}
        executor: {type: string, description: SPIFFE SVID of agent / operator}
        approver: {type: string, description: SPIFFE / OIDC subject of 2nd person for T3 autonomy}
        signature: {type: string}
