openapi: 3.2.0
info:
  title: oya-cloud-k8s
  version: 1.0.0
  summary: REST API for cloud-k8s — cluster + node + policy mutators, mediated by `kubernetes-api-proxy`
  description: |
    Operator + Foundry-agent + CI surface for on-prem Kubernetes cluster lifecycle.
    Per ADR-0121 + ADR-0131. All endpoints require OIDC + Cedar policy authorization
    (per `k8s/policy/*.cedar`); every call audit-chain-emits per
    Bominal ADR-0028.

    Cross-cutting authentication: OIDC bearer `Authorization: Bearer <jwt>`. The JWT
    carries the principal's identity claim (SPIFFE SVID for service principals;
    OIDC subject for operators; auditor JIT claim for external auditors).

    NOTE: This is the cluster-mutation REST surface owned by cloud-k8s. The
    kubernetes-api-proxy also forwards generic kubectl traffic transparently to
    kube-apiserver — that surface follows upstream Kubernetes OpenAPI conventions
    and is documented separately at `contracts/openapi/kubernetes-api-proxy.yaml`
    (not included in this document).
  contact:
    name: axis-cloud
    url: https://oyatie.com/teams/axis-cloud
  license:
    name: Internal
servers:
  - url: https://cloud-k8s-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cloud-k8s
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    PackPath:
      in: path
      name: pack
      required: true
      schema:
        type: string
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
    ClusterId:
      in: path
      name: cluster_id
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    NodeId:
      in: path
      name: node_id
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-.]*$'
    NamespaceName:
      in: path
      name: namespace
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
  schemas:
    Cluster:
      type: object
      required: [cluster_id, pack, region, version, status]
      properties:
        cluster_id: {type: string}
        pack: {type: string}
        region: {type: string, example: "ap-seoul-1"}
        version: {type: string, example: "v1.35.0"}
        control_plane_node_count: {type: integer, minimum: 1}
        worker_node_count: {type: integer, minimum: 0}
        status: {type: string, enum: [bootstrapping, ready, upgrading, degraded, failed]}
        bootstrapped_at: {type: string, format: date-time, nullable: true}
    Node:
      type: object
      required: [node_id, cluster_id, role, status]
      properties:
        node_id: {type: string}
        cluster_id: {type: string}
        role: {type: string, enum: [control-plane, worker]}
        az: {type: string, nullable: true}
        kernel_version: {type: string}
        containerd_version: {type: string}
        kubelet_version: {type: string}
        status: {type: string, enum: [pending, ready, cordoned, draining, not-ready, removed]}
        joined_at: {type: string, format: date-time, nullable: true}
    NetworkPolicy:
      type: object
      required: [namespace, name, spec]
      properties:
        namespace: {type: string}
        name: {type: string}
        spec:
          type: object
          description: Kubernetes NetworkPolicy spec (derived from Cedar fragment)
    AuthorizationPolicy:
      type: object
      required: [namespace, name, spec]
      properties:
        namespace: {type: string}
        name: {type: string}
        spec:
          type: object
          description: Istio AuthorizationPolicy spec (derived from Cedar fragment)
    BootstrapEvidence:
      type: object
      required: [cluster_id, kubeadm_version, evidence_sha, signature]
      properties:
        cluster_id: {type: string}
        kubeadm_version: {type: string}
        evidence_sha: {type: string, description: SHA-256 of the kubeadm init output + initial component versions}
        signature: {type: string, description: Ed25519 signature by slo-engine-worker SPIFFE identity}
        bootstrapped_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /clusters:
    get:
      summary: List clusters in this pack
      operationId: listClusters
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Cluster'}
        '401': {description: OIDC missing}
        '403': {description: Cedar policy denied}

  /clusters/{cluster_id}:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    get:
      summary: Read cluster state
      operationId: getCluster
      responses:
        '200':
          description: Cluster
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cluster'}
        '404': {description: Not found}

  /clusters/{cluster_id}/bootstrap:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    post:
      summary: Bootstrap a new cluster via kubeadm init (Foundry capability)
      operationId: bootstrapCluster
      description: |
        Invokes cloud-k8s.cluster.bootstrap capability. Requires autonomy tier T3
        (2-person rule). Audit-chain-emits per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack, region, kubeadm_version]
              properties:
                pack: {type: string}
                region: {type: string}
                kubeadm_version: {type: string, example: "v1.35.0"}
                approver: {type: string, description: 2nd person SPIFFE for 2-person rule}
                reason: {type: string}
      responses:
        '202':
          description: Bootstrap initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeset_id: {type: string}
                  estimated_completion: {type: string, format: date-time}

  /clusters/{cluster_id}/upgrade:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    post:
      summary: Initiate kubeadm minor-version upgrade
      operationId: upgradeCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version, approver, reason]
              properties:
                target_version: {type: string, example: "v1.36.0"}
                approver: {type: string}
                reason: {type: string}
      responses:
        '202': {description: Upgrade initiated}

  /clusters/{cluster_id}/etcd/snapshot:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    post:
      summary: Trigger immediate etcd snapshot
      operationId: snapshotEtcd
      responses:
        '202': {description: Snapshot queued}

  /clusters/{cluster_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    get:
      summary: List nodes in cluster
      operationId: listNodes
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Node'}
    post:
      summary: Add a worker node (kubeadm join)
      operationId: addNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, role]
              properties:
                node_id: {type: string}
                role: {type: string, enum: [worker]}
                az: {type: string, nullable: true}
      responses:
        '202': {description: Join initiated}

  /clusters/{cluster_id}/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NodeId'
    get:
      summary: Read node state
      operationId: getNode
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}

  /clusters/{cluster_id}/nodes/{node_id}/cordon:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NodeId'
    post:
      summary: Cordon a node
      operationId: cordonNode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '202': {description: Cordoned}

  /clusters/{cluster_id}/nodes/{node_id}/drain:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NodeId'
    post:
      summary: Drain a node (PDB-aware)
      operationId: drainNode
      responses:
        '202': {description: Drain initiated}

  /clusters/{cluster_id}/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NodeId'
    delete:
      summary: Remove a node (kubeadm reset)
      operationId: removeNode
      responses:
        '202': {description: Remove initiated}

  /clusters/{cluster_id}/namespaces/{namespace}/network-policies:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NamespaceName'
    get:
      summary: List NetworkPolicies in a namespace
      operationId: listNetworkPolicies
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NetworkPolicy'}
    post:
      summary: Apply NetworkPolicy (derived from Cedar fragment)
      operationId: applyNetworkPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkPolicy'}
      responses:
        '202': {description: Apply initiated}

  /clusters/{cluster_id}/namespaces/{namespace}/authorization-policies:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
      - $ref: '#/components/parameters/NamespaceName'
    get:
      summary: List Istio AuthorizationPolicies in a namespace
      operationId: listAuthorizationPolicies
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuthorizationPolicy'}
    post:
      summary: Apply AuthorizationPolicy
      operationId: applyAuthorizationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationPolicy'}
      responses:
        '202': {description: Apply initiated}

  /clusters/{cluster_id}/evidence:
    parameters:
      - $ref: '#/components/parameters/ClusterId'
    get:
      summary: Read cluster bootstrap evidence (signed)
      operationId: getBootstrapEvidence
      responses:
        '200':
          description: Evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapEvidence'}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (kube-apiserver reachable + Cedar evaluator current)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
