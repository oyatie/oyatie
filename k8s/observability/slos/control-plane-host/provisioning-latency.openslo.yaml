# Canonical-base: specs/openslo/canonical-envelope-schema.json
apiVersion: openslo/v1
kind: SLO
metadata:
  name: control-plane-provisioning-latency
  displayName: "managed-k8s-control-plane-host — provisioning latency"
  labels:
    microservice: managed-k8s-control-plane-host
    sli: latency
    data_classes: INTERNAL_ONLY
spec:
  service: managed-k8s-control-plane-host
  description: |
    Time from a provision request to control-plane endpoint_ready. The hosted
    (Kamaji) tier targets seconds-scale density; the dedicated (Talos) tier is
    minutes-scale (full spoke bring-up). non_claim: this SLO is the design target
    for the live-integration follow-on; the in-memory adapter provisions
    synchronously, so the metric is populated only once the live CAPI reconcile
    lands (kamaji-provider-live-integration).
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(k8s_control_plane_provision_duration_seconds_bucket{le="120"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(k8s_control_plane_provision_duration_seconds_count[5m]))
  objectives:
    - displayName: "95% of provisions reach endpoint_ready within budget over 30d"
      target: 0.95
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
