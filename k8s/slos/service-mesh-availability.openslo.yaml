# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-k8s-service-mesh-availability
  displayName: "cloud-k8s: service mesh (Istio) availability 99.95%"
  labels:
    microservice: cloud-k8s
    bounded_context: service-mesh-control-plane
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-k8s + ops-network
    pack_scope: all
spec:
  service: cloud-k8s
  description: |
    Service-mesh (Istio) availability SLO. A request is "good" when the
    istiod control-plane is reachable AND the per-pod Envoy sidecar is
    in HEALTHY state with up-to-date xDS config. Per ADR-0121 Istio + Envoy.
  indicator:
    metadata:
      name: cloud-k8s-istio-mesh-healthy-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(pilot_xds_pushes{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(pilot_xds_pushes[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling Istio mesh availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
