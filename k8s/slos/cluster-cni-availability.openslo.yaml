# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-k8s-cluster-cni-availability
  displayName: "cloud-k8s: cluster CNI (Cilium) availability 99.95%"
  labels:
    microservice: cloud-k8s
    bounded_context: network-policy
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-cloud-k8s + ops-network
    pack_scope: all
spec:
  service: cloud-k8s
  description: |
    CNI (Cilium) availability SLO. A pod-to-pod packet is "good" when the
    Cilium eBPF datapath delivers the packet AND the cilium-agent reports
    healthy on the source node. Drop-by-network-policy is NOT a failure.
    Per ADR-0121 Cilium-as-CNI.
  indicator:
    metadata:
      name: cloud-k8s-cni-healthy-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cilium_agent_up{result="healthy"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cilium_agent_up[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling CNI availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
