# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-k8s-pod-scheduling-latency
  displayName: "cloud-k8s: pod scheduling latency p95 ≤ 5s"
  labels:
    microservice: cloud-k8s
    bounded_context: cluster-bootstrap
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-k8s
    pack_scope: all
spec:
  service: cloud-k8s
  description: |
    Pod scheduling latency p95 SLO. A pod is "good" when the time from
    Pod admission (PodPending → PodScheduled) is ≤ 5s p95. Per kube-
    scheduler upstream SLO + ADR-0121 cluster-readiness target.
  indicator:
    metadata:
      name: cloud-k8s-pod-scheduling-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(scheduler_pod_scheduling_duration_seconds_bucket{le="5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(scheduler_pod_scheduling_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 5s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
