# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-k8s-cis-benchmark-conformance
  displayName: "cloud-k8s: CIS Kubernetes v1.10 restricted conformance (100%)"
  labels:
    microservice: cloud-k8s
    bounded_context: cluster-bootstrap
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-cloud-k8s + council-security
    pack_scope: all
    compliance: [CIS-K8s-v1.10-Restricted, SOC2-CC6, ISO27001-A12.6]
spec:
  service: cloud-k8s
  description: |
    CIS Kubernetes benchmark v1.10 restricted-profile conformance SLO. A
    cluster is "good" when every Restricted-profile control passes its
    nightly kube-bench scan. Per ADR-0121 cluster-hardening requirement
    + threat-model T-K8s-01..T-K8s-12. Target = 100% (any miss is Sev-2).
  indicator:
    metadata:
      name: cloud-k8s-cis-conformance-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_k8s_cis_check_total{result="pass"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_k8s_cis_check_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% CIS Restricted conformance (any miss = Sev-2)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
