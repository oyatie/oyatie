# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
# Authoring authority: ADR-0130 agentic SLO-gated promotion + ADR-0121 on-prem k8s substrate.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cloud-k8s-cluster-api-availability
  displayName: "cloud-k8s: cluster API-server availability 99.95%"
  labels:
    microservice: cloud-k8s
    bounded_context: cluster-bootstrap
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-k8s
    pack_scope: all
spec:
  service: cloud-k8s
  description: |
    Cluster API-server availability SLO. A request is "good" when the
    kube-apiserver returns 2xx/3xx/4xx (NOT 5xx + NOT 502/503/504) within
    the API server's deadline. Excludes tenant-cause 4xx per Google SRE
    Workbook convention. Per ADR-0121 on-prem k8s control-plane.
  indicator:
    metadata:
      name: cloud-k8s-apiserver-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(apiserver_request_total{code!~"5..|502|503|504"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(apiserver_request_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling kube-apiserver availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
