// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

// Managed-Kubernetes control-plane-host gRPC contract (ADR-0376).
//
// The inter-service projection of the ControlPlaneProvisioning port the sibling
// managed-k8s-cluster-lifecycle + managed-k8s-sla-observability
// microservices consume. design-spec maturity: the gRPC server lands with the
// live-integration follow-on; the message/service shape is contracted here so
// consumers can generate clients against a stable surface.
package oya.managed_k8s.control_plane_host.v1;

// Placement tier (ADR-0376). HOSTED_KAMAJI is the product default.
enum ControlPlaneTier {
  CONTROL_PLANE_TIER_UNSPECIFIED = 0;
  CONTROL_PLANE_TIER_HOSTED_KAMAJI = 1;
  CONTROL_PLANE_TIER_DEDICATED_TALOS_SPOKE = 2;
}

// Hosted-tier datastore class (advisory for the dedicated tier).
enum DatastoreClass {
  DATASTORE_CLASS_UNSPECIFIED = 0;
  DATASTORE_CLASS_ETCD_PER_TENANT = 1;
  DATASTORE_CLASS_POOLED_RELATIONAL = 2;
}

// Lifecycle status (kernel state machine).
enum ControlPlaneStatus {
  CONTROL_PLANE_STATUS_UNSPECIFIED = 0;
  CONTROL_PLANE_STATUS_REQUESTED = 1;
  CONTROL_PLANE_STATUS_DATASTORE_BOUND = 2;
  CONTROL_PLANE_STATUS_MEDIA_FORMED = 3;
  CONTROL_PLANE_STATUS_PROVISIONING = 4;
  CONTROL_PLANE_STATUS_ENDPOINT_READY = 5;
  CONTROL_PLANE_STATUS_ACTIVE = 6;
  CONTROL_PLANE_STATUS_DRAINING = 7;
  CONTROL_PLANE_STATUS_DELETED = 8;
  CONTROL_PLANE_STATUS_FAILED = 9;
}

// Tenant-scoped reference to the cluster whose control plane is managed.
message ClusterRef {
  string tenant_id = 1;
  string cluster_name = 2;
}

message ProvisionRequest {
  ClusterRef cluster_ref = 1;
  ControlPlaneTier tier = 2;
  DatastoreClass datastore_class = 3;
}

// Adapter-issued opaque handle to a provisioned control plane.
message ControlPlaneRef {
  ClusterRef cluster_ref = 1;
  ControlPlaneTier tier = 2;
  string handle = 3;
}

message StatusRequest {
  ControlPlaneRef control_plane_ref = 1;
}

message StatusReport {
  ControlPlaneRef control_plane_ref = 1;
  ControlPlaneStatus status = 2;
  // API-server endpoint once endpoint_ready or later; empty otherwise.
  string endpoint = 3;
}

message TeardownRequest {
  ControlPlaneRef control_plane_ref = 1;
}

message TeardownResponse {}

// The shared provisioning service (the gRPC projection of the port).
service ControlPlaneProvisioning {
  rpc Provision(ProvisionRequest) returns (ControlPlaneRef);
  rpc GetStatus(StatusRequest) returns (StatusReport);
  rpc Teardown(TeardownRequest) returns (TeardownResponse);
}
