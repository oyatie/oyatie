# Canonical StorageClass: s3-warm
# Per ADR-0161. S3-compatible object storage, standard tier.
#
# Note: S3-compatible access is via S3 API (not filesystem mount). This
# StorageClass exists for CSI-mounted S3 filesystems (s3fs / mountpoint-s3
# CSI). Most µservices access via the AWS SDK + per-pack endpoint config.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s3-warm
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "warm"
    oyatie.io/kind: "s3"
provisioner: PACK_OVERLAY_REQUIRED
parameters:
  PACK_OVERLAY_REQUIRED: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
