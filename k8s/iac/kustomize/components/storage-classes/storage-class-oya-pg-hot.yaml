# Canonical StorageClass: pg-hot
# Per ADR-0161. NVMe-class block storage for PostgreSQL primary / Valkey primary /
# audit-chain leaf storage. Sub-millisecond IOPS expected; expensive.
#
# This file is the canonical SKELETON. Per-pack overlays in
# ../pack-{name}/storage-class-pg-hot.patch.yaml MUST patch:
#   - `provisioner` — concrete CSI driver name
#   - `parameters` — pack-specific (sku, encrypted, kmsKeyId, fsType, etc.)
#
# Per-pack overlay binds CSI driver per the ADR-0161 matrix:
#   pack-aws-us       → ebs.csi.aws.com         (io2)
#   pack-gcp-us       → pd.csi.storage.gke.io   (pd-extreme)
#   pack-azure-us     → disk.csi.azure.com      (Premium_LRS v2)
#   pack-kr-nhn       → block.csi.nhncloud.com  (NVMe SKU)
#   pack-kr-naver     → block.csi.ncloud.com    (NVMe SKU)
#   pack-eu-hetzner   → csi.hetzner.cloud       (NVMe local)
#   pack-onprem-ceph  → rook-ceph.rbd.csi.ceph.com (NVMe pool)
#   pack-ksa-stc      → block.csi.stccloud.sa   (NVMe SKU)
#   pack-uae-g42      → block.csi.g42.ae        (NVMe SKU)
#   pack-jp-sakura    → block.csi.sakura.ad.jp  (NVMe SKU)

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pg-hot
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "hot"
    oyatie.io/kind: "pg"
  annotations:
    oyatie.io/description: |
      Canonical name for PostgreSQL primary block storage, NVMe-class.
      Per-pack overlay binds concrete CSI driver and SKU.
    oyatie.io/reclaim-policy-rationale: "Retain protects against accidental PVC delete on hot data"
provisioner: PACK_OVERLAY_REQUIRED  # patched by pack overlay
parameters:
  PACK_OVERLAY_REQUIRED: "true"     # patched by pack overlay
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
