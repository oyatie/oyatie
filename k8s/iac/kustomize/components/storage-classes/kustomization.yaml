apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Canonical StorageClass catalog per ADR-0161.
#
# Workload µservice Helm charts reference canonical names below.
# Per-pack overlays in ../pack-{name}/storage-classes.yaml bind canonical names
# to concrete CSI drivers (per-pack CSI matrix in ADR-0161).
#
# Canonical names (oya-<kind>-<tier>):
#   pg-hot     — PostgreSQL block storage, NVMe-class, sub-ms IOPS
#   pg-warm    — PostgreSQL block storage, SSD-class
#   pg-cold    — PostgreSQL block storage, HDD/archive-class
#   valkey-hot — Valkey block storage, NVMe-class
#   s3-warm    — S3-compatible object storage, standard tier
#   s3-cold    — S3-compatible object storage, archive tier
#   object-warm — alias for s3-warm in non-S3 contexts
#   object-cold — alias for s3-cold in non-S3 contexts
#
# Each per-pack overlay MUST populate ALL canonical names. CI lane
# `oya gate validate storage-class-canonical` enforces.
#
# Per ADR-0043 + ADR-0161, each binding MUST declare `encrypted: true`
# and `kmsKeyId` referencing the pack KMS / HSM handle.
#
# Per ADR-0161, `hot` tier defaults to `ReclaimPolicy: Retain` (no auto-delete).
# `cold` tier permits `Delete` for ephemeral backups.

resources:
  - storage-class-pg-hot.yaml
  - storage-class-pg-warm.yaml
  - storage-class-pg-cold.yaml
  - storage-class-valkey-hot.yaml
  - storage-class-s3-warm.yaml
  - storage-class-s3-cold.yaml

commonLabels:
  oyatie.io/adr: "ADR-0161"
  oyatie.io/layer: "Layer-1-substrate"
  oyatie.io/canonical-storage-class: "true"

commonAnnotations:
  oyatie.io/canonical-base: |
    Per ADR-0161, every µservice Helm chart references canonical
    StorageClass names only. Per-pack overlays at
    iac/kustomize/components/pack-{name}/storage-classes.yaml bind
    canonical names to concrete CSI drivers per the ADR-0161 matrix.
  oyatie.io/csi-spec-minimum: "v1.8"
  oyatie.io/volume-snapshot-support: "required"
  oyatie.io/encryption-at-rest: "required-per-ADR-0043"
