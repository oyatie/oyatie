# Canonical StorageClass: pg-warm
# Per ADR-0161. SSD-class block storage for PostgreSQL warm replicas, observability
# long-term metrics storage. Single-digit-ms IOPS; moderate cost.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pg-warm
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "warm"
    oyatie.io/kind: "pg"
provisioner: PACK_OVERLAY_REQUIRED
parameters:
  PACK_OVERLAY_REQUIRED: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
