# Canonical StorageClass: pg-cold
# Per ADR-0161. HDD-class or archive-class storage for backups, archived
# audit-chain seals, cold tenant exports. Tens-of-ms latency; cheap.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pg-cold
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "cold"
    oyatie.io/kind: "pg"
provisioner: PACK_OVERLAY_REQUIRED
parameters:
  PACK_OVERLAY_REQUIRED: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
