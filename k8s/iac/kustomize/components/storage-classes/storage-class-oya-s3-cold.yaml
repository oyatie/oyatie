# Canonical StorageClass: s3-cold
# Per ADR-0161. S3-compatible object storage, archive tier (S3 Glacier Instant
# Retrieval / GCS Coldline / Azure Archive class). For long-term audit-chain
# anchors, tenant exports, backups.

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s3-cold
  labels:
    oyatie.io/canonical: "true"
    oyatie.io/adr: "ADR-0161"
    oyatie.io/tier: "cold"
    oyatie.io/kind: "s3"
provisioner: PACK_OVERLAY_REQUIRED
parameters:
  PACK_OVERLAY_REQUIRED: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
