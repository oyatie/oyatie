apiVersion: v1
kind: Namespace
metadata:
  name: cloud-k8s-system
  labels:
    app.kubernetes.io/name: cloud-k8s
    app.kubernetes.io/part-of: cloud-k8s
    oyatie/microservice: cloud-k8s
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    oyatie.io/ssot: registry-stores-masterplan-handoff
    oyatie.io/runtime-posture: cloud-native
