apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-k8s-csi-block-volume-credentials
  namespace: cloud-k8s-system
  labels:
    app.kubernetes.io/part-of: oya-cloud-k8s
    oyatie/microservice: cloud-k8s
    oyatie.io/secret-consumer: csi-block-volume
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cloud-k8s-csi
    kind: ClusterSecretStore
  target:
    name: cloud-k8s-csi-block-volume-credentials
    creationPolicy: Owner
  data:
    - secretKey: endpoint
      remoteRef: {key: cloud-k8s/csi/block-volume, property: endpoint}
    - secretKey: tenant_id
      remoteRef: {key: cloud-k8s/csi/block-volume, property: tenant_id}
    - secretKey: key_id
      remoteRef: {key: cloud-k8s/csi/block-volume, property: key_id}
---
