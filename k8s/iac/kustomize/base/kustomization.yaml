# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the cloud-k8s cluster substrate, applied identically per-pack
# with overlays for residency region, OpenBao secret-reference URIs, replica scaling tier.
# Per ADR-0121 Layer-A + multi-region.md DR posture.

namespace: cloud-k8s-system

helmGlobals:
  chartHome: ../../helm

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - kyverno-cluster-policies.yaml
  - cilium-network-policies-default-deny.yaml
  - istio-peerauth-strict.yaml

helmCharts:
  - name: cni-cilium
    valuesFile: ../../helm/cni-cilium/values.yaml
    releaseName: cilium
    namespace: cilium-system
  - name: istio-base
    valuesFile: ../../helm/istio-base/values.yaml
    releaseName: istio-base
    namespace: istio-system
  - name: istiod
    valuesFile: ../../helm/istiod/values.yaml
    releaseName: istiod
    namespace: istio-system
  - name: envoy-gateway
    valuesFile: ../../helm/envoy-gateway/values.yaml
    releaseName: envoy-gateway
    namespace: istio-system
  - name: csi-block-volume
    valuesFile: ../../helm/csi-block-volume/values.yaml
    releaseName: csi-block-volume
    namespace: kube-system
  - name: csi-object
    valuesFile: ../../helm/csi-object/values.yaml
    releaseName: csi-object
    namespace: kube-system
  - name: csi-file
    valuesFile: ../../helm/csi-file/values.yaml
    releaseName: csi-file
    namespace: kube-system

components:
  - ../components/storage-classes

commonLabels:
  app.kubernetes.io/part-of: cloud-k8s
  oyatie/microservice: cloud-k8s

configurations:
  - name-suffix.yaml
