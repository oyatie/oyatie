driver:
  name: file.csi.oyatie.com
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: File
  storageCapacity: true
  volumeLifecycleModes: [Persistent]
backend:
  kind: file-storage
credentialsSecret:
  name: cloud-k8s-csi-file-credentials
controller:
  replicas: 2
  image:
    repository: ghcr.io/oyatie/cloud-k8s-csi-file
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
metrics:
  port: 9090
networkPolicy:
  enabled: true
