apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oyaCsi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oyaCsi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oyaCsi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "oyaCsi.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oyaCsi.fullname" . }}-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: csi-controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - "--driver-name={{ .Values.driver.name }}"
            - "--credentials-secret={{ .Values.credentialsSecret.name }}"
            - "--metrics-listen-address=:{{ .Values.metrics.port }}"
          env:
            - name: CSI_BACKEND
              value: {{ .Values.backend.kind | quote }}
            - name: CSI_CREDENTIALS_SECRET
              value: {{ .Values.credentialsSecret.name | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
