driver:
  name: block.csi.oyatie.com
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
  storageCapacity: true
  volumeLifecycleModes: [Persistent]
backend:
  kind: block-volume
credentialsSecret:
  name: cloud-k8s-csi-block-volume-credentials
controller:
  replicas: 2
  image:
    repository: ghcr.io/oyatie/oya-cloud-k8s-csi-block-volume
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
metrics:
  port: 9090
networkPolicy:
  enabled: true
