driver:
  name: object.csi.oyatie.com
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: File
  storageCapacity: true
  volumeLifecycleModes: [Persistent, Ephemeral]
backend:
  kind: seaweedfs-object
credentialsSecret:
  name: cloud-k8s-csi-object-credentials
controller:
  replicas: 2
  image:
    repository: ghcr.io/oyatie/oya-cloud-k8s-csi-object
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
metrics:
  port: 9090
networkPolicy:
  enabled: true
