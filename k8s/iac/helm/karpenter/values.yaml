# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
#
# Karpenter values per ADR-0198 node-autoscaling canonical.
# Verified versions (2026-05-18):
#   - Karpenter 1.11.1 — Apache 2.0 — kubernetes-sigs project (graduated CNCF)
#     https://github.com/kubernetes-sigs/karpenter/releases
karpenter:
  controller:
    image:
      repository: public.ecr.aws/karpenter/controller
      tag: "1.11.1"
    resources:
      requests: {cpu: "1",  memory: "1Gi"}
      limits:   {cpu: "2",  memory: "2Gi"}
    replicas: 2  # HA controller
    metrics:
      port: 8000
      serviceMonitor:
        enabled: true
  # ---- settings ----
  settings:
    clusterName: "${CLUSTER_NAME}"
    interruptionQueue: "${INTERRUPTION_QUEUE_NAME}"
    featureGates:
      drift: true   # detect drift between node spec and NodePool template
      spotToSpotConsolidation: true
  # ---- service account (IRSA / workload-identity) ----
  serviceAccount:
    create: true
    name: karpenter
    annotations:
      eks.amazonaws.com/role-arn: "${KARPENTER_IAM_ROLE_ARN}"
  # ---- webhook ----
  webhook:
    enabled: true
    port: 8443

# ---- NodePool CRDs per workload class (per ADR-0198) ----
nodePools:
  # ---- app-tier: general-purpose, on-demand bias ----
  app:
    enabled: true
    weight: 100
    template:
      spec:
        requirements:
          - key: karpenter.k8s.aws/instance-category
            operator: In
            values: ["c", "m", "r"]
          - key: karpenter.k8s.aws/instance-generation
            operator: Gt
            values: ["5"]
          - key: kubernetes.io/arch
            operator: In
            values: ["amd64", "arm64"]
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["on-demand", "spot"]  # on-demand bias via weight
        taints: []
        nodeClassRef:
          group: karpenter.k8s.aws
          kind: EC2NodeClass
          name: app-tier
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 30s
      budgets:
        - nodes: "10%"
        - nodes: "5"
          schedule: "@hourly"
          duration: 10m
    limits:
      cpu: "10000"
      memory: "10000Gi"
    labels:
      oya.io/workload-class: "app"

  # ---- batch-tier: compute-optimized + heavy spot ----
  batch:
    enabled: true
    weight: 90
    template:
      spec:
        requirements:
          - key: karpenter.k8s.aws/instance-category
            operator: In
            values: ["c", "m"]
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["spot"]  # batch is spot-first
          - key: karpenter.k8s.aws/instance-cpu
            operator: Gt
            values: ["3"]
        taints:
          - key: oya.io/batch-only
            value: "true"
            effect: NoSchedule
        nodeClassRef:
          group: karpenter.k8s.aws
          kind: EC2NodeClass
          name: batch-tier
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 60s
      budgets:
        - nodes: "20%"
    limits:
      cpu: "20000"
      memory: "20000Gi"
    labels:
      oya.io/workload-class: "batch"

  # ---- gpu-tier: GPU on-demand only ----
  gpu:
    enabled: true
    weight: 100
    template:
      spec:
        requirements:
          - key: karpenter.k8s.aws/instance-family
            operator: In
            values: ["g5", "g6", "p4d", "p5"]
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["on-demand"]
        taints:
          - key: nvidia.com/gpu
            value: "true"
            effect: NoSchedule
        nodeClassRef:
          group: karpenter.k8s.aws
          kind: EC2NodeClass
          name: gpu-tier
    disruption:
      consolidationPolicy: WhenEmpty  # never consolidate-underutilized for GPU
      consolidateAfter: 5m
      budgets:
        - nodes: "0"
          schedule: "* 8-20 * * 1-5"  # block disruption during business hours
          duration: 12h
    limits:
      cpu: "2000"
      memory: "2000Gi"
      "nvidia.com/gpu": "256"
    labels:
      oya.io/workload-class: "gpu"

  # ---- regulatory-tier: sovereign-region-pinned ----
  regulatory:
    enabled: true
    weight: 110  # highest priority; preempt other tiers
    template:
      spec:
        requirements:
          - key: topology.kubernetes.io/region
            operator: In
            values: ["${REGULATORY_REGION}"]  # per-pack overlay: kr-central, eu-frankfurt, etc.
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["on-demand"]  # regulatory workloads do not run on spot
          - key: karpenter.k8s.aws/instance-category
            operator: In
            values: ["c", "m", "r"]
        taints:
          - key: oya.io/regulatory-only
            value: "true"
            effect: NoSchedule
        nodeClassRef:
          group: karpenter.k8s.aws
          kind: EC2NodeClass
          name: regulatory-tier
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 5m
      budgets:
        - nodes: "0"
          schedule: "@daily"
          duration: 1h
    limits:
      cpu: "5000"
      memory: "5000Gi"
    labels:
      oya.io/workload-class: "regulatory"

# ---- canonical labels ----
microservice: cloud-k8s
boundedContext: node-autoscaling
tier: M
plane: control
partOf: cloud-k8s

# ---- cost-attribution labels per ADR-0199 ----
costAttribution:
  costCenter: "infra-compute"
  workloadClass: "app"

# ---- canonical helm library ----
helpers:
  enabled: true
