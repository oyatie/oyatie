# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
gateway:
  name: istio-ingressgateway
  namespace: istio-system
  autoscaling:
    enabled: true
    minReplicas: 2       # per capacity-model.md
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  service:
    type: LoadBalancer
    ports:
      - name: https
        port: 443
        targetPort: 8443
        protocol: TCP
  env:
    PILOT_HTTP10: "0"  # HTTP/1.0 disabled
  # TLS 1.3 only per threat-model T-S-03 + IP-010 LEAN check oya-check-envoy-tls-13-only
  podDisruptionBudget:
    minAvailable: 1
  # Rate-limit + WAF applied at ingress; per runbook ingress-ddos-throttle
  customLabels:
    oyatie/microservice: cloud-k8s
    oyatie/bc: ingress-controller
