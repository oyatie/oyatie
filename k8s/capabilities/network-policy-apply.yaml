# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-k8s:network-policy-apply:v1
name: network-policy-apply
namespace: cloud-k8s
display_name: Apply NetworkPolicy / AuthorizationPolicy (Cedar-derived)
description: |
  Apply Kubernetes NetworkPolicy (L3/L4; Cilium eBPF enforcement) + Istio
  AuthorizationPolicy (L7) to a tenant namespace. Both derive from a single
  Cedar fragment (signed by tenant operator at PR time per branch-protection).

  Per-namespace default-deny posture applies; this capability adds explicit
  allow rules. Symmetric apply: NetworkPolicy + AuthorizationPolicy ALWAYS
  applied together (atomic CR write); LEAN check
  `oya-check-cedar-derived-policy-paired` validates pairing.

  Idempotent: re-applying same Cedar fragment is a no-op.

owner_team: axis-cloud + ops-security
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0121, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_artifacts:
  - microservices/cloud-k8s/contracts/openapi/cloud-k8s.yaml
  - microservices/cloud-k8s/policy/cluster-isolation.md (CI-03, CI-04, CI-06)
  - microservices/cloud-k8s/policy/tenant-scope.cedar

autonomy_tier: T2
# T2 = state-mutating; scoped to tenant namespace; single-person approval +
# audit-chain emit. T3 not required because per-namespace default-deny + git PR
# of the Cedar fragment provide upstream review.

inputs:
  - name: cluster_id
    type: string
    required: true
  - name: namespace
    type: string
    required: true
    description: tenant-<hashed-id> namespace; must match Cedar fragment's tenant scope
  - name: cedar_fragment_sha
    type: string
    required: true
    description: SHA-256 of the Cedar fragment in git that this apply derives from
  - name: network_policy_spec
    type: object
    required: true
  - name: authorization_policy_spec
    type: object
    required: true
    description: Must be paired with network_policy_spec (per LEAN check)
  - name: reason
    type: string
    required: true

outputs:
  - name: changeset_id
    type: string
  - name: applied_at
    type: timestamp
  - name: derived_from_cedar_sha
    type: string
  - name: network_policy_resource_version
    type: string
  - name: authorization_policy_resource_version
    type: string
  - name: signature
    type: string

data_classes_touched:
  - INTERNAL_ONLY      # policy text
  - BEHAVIORAL_TENANT_PRODUCT  # peer-selector includes tenant labels
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud-k8s.network-policy.applied

cost_profile:
  type: per-apply
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - Two CR writes (NetworkPolicy + AuthorizationPolicy)
    - Cilium xfer to all node agents
    - Istio xDS push to all sidecars in namespace

cedar_policy_fragments:
  - microservices/cloud-k8s/policy/cluster-isolation.md (CI-06 cross-namespace allowance must be Cedar-explicit)

eval_set:
  reference_inputs_path: microservices/cloud-k8s/capabilities/eval/network-policy-apply-reference.jsonl
  pass_threshold: 0.99
  eval_metric: policy-propagated-within-30s-p99 + cross-tenant-isolation-maintained
  cadence: per-release

sla:
  policy_propagation_p99_seconds: 30

sunset:
  status: none
  notes: ""
