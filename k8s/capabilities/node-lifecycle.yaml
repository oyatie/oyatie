# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-k8s:node-lifecycle:v1
name: node-lifecycle
namespace: cloud-k8s
display_name: Node lifecycle (add / cordon / drain / remove)
description: |
  Add a worker node (kubeadm join), cordon to mark unschedulable, drain
  (PDB-aware eviction), or remove from cluster (kubeadm reset). All operations
  idempotent + audit-chain-emitting + Cedar-policy-gated.

  Operations:
    - add:    join a fresh node to the cluster via short-TTL kubeadm join token
    - cordon: mark Unschedulable; emit NodeCordoned audit event
    - drain:  evict pods respecting PodDisruptionBudgets; emit NodeDrained
    - remove: kubeadm reset on the node + cluster-side member removal

  Cordon + drain are reversible. Remove is destructive.

owner_team: axis-cloud + ops-sre-reliability
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0121, ADR-0131]
related_artifacts:
  - k8s/contracts/openapi/cloud-k8s.yaml
  - k8s/runbooks/node-cordon-and-drain.md

autonomy_tier: T2
# T2 = state-mutating, scoped impact (single node); single-person approval +
# audit-chain emit. T3 (2-person) only for remove of a control-plane node.

inputs:
  - name: cluster_id
    type: string
    required: true
  - name: node_id
    type: string
    required: true
  - name: operation
    type: enum
    values: [add, cordon, drain, remove]
    required: true
  - name: role
    type: enum
    values: [control-plane, worker]
    required: false
    description: required when operation=add
  - name: az
    type: string
    required: false
  - name: reason
    type: string
    required: true
  - name: approver
    type: string
    required: false
    description: SPIFFE of 2nd person when operation=remove + role=control-plane

outputs:
  - name: changeset_id
    type: string
  - name: outcome
    type: enum
    values: [completed, pdb_violation, timed_out, partial]
  - name: pods_evicted
    type: integer
    description: present when operation=drain
  - name: signature
    type: string

data_classes_touched:
  - INTERNAL_ONLY
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud-k8s.node.lifecycle

cost_profile:
  type: per-operation
  estimated_cost_usd_per_call: 0.05
  cost_drivers:
    - Single API call to kube-apiserver via api-proxy
    - For drain: O(pods) eviction calls

cedar_policy_fragments:
  - k8s/policy/cluster-isolation.md (CI-07 mediation)

eval_set:
  reference_inputs_path: microservices/cloud-k8s/capabilities/eval/node-lifecycle-reference.jsonl
  pass_threshold: 0.99
  eval_metric: node-join-within-5min-p99 + drain-respects-pdb
  cadence: per-release

sla:
  node_join_p99_seconds: 300
  node_drain_p99_seconds: 300

sunset:
  status: none
  notes: ""
