openapi: 3.1.0
info:
  title: Managed K8s Cluster Lifecycle API
  version: 0.1.0
security:
  - TenantPrincipalHeader: []
paths:
  /clusters:
    post:
      operationId: createManagedK8sCluster
      summary: Admit and provision a tenant managed-Kubernetes cluster
      description: Gateway-internal only. Requires a trusted upstream gateway to strip caller-supplied `x-oya-tenant-id` and inject the authenticated tenant id; this service checks that header against `tenant_id` before quota/provisioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
            examples:
              hostedDefault:
                value:
                  tenant_id: ten_zero
                  cluster_name: dogfood-a
      responses:
        '201':
          description: Cluster admitted and control-plane provisioning invoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCreateResponse'
        '400':
          description: Malformed request or unknown tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing tenant principal header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Tenant principal mismatch or quota denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Quota unavailable / fail-closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: Control-plane provisioning failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: clusterLifecycleHealthz
      security: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    TenantPrincipalHeader:
      type: apiKey
      in: header
      name: x-oya-tenant-id
      description: Gateway-injected tenant principal. This is not a public self-asserted credential; upstream must strip client-supplied values and inject the authenticated tenant id.
  schemas:
    ClusterCreateRequest:
      type: object
      required: [tenant_id, cluster_name]
      properties:
        tenant_id:
          type: string
          minLength: 1
        cluster_name:
          type: string
          minLength: 1
        desired_tier:
          type: string
          enum: [hosted, dedicated, hosted_kamaji, dedicated_talos_spoke]
          default: hosted
        nodes:
          type: integer
          minimum: 1
          default: 3
        vcpu:
          type: integer
          minimum: 1
          default: 8
        ram_gib:
          type: integer
          minimum: 1
          default: 32
    ClusterCreateResponse:
      type: object
      required: [tenant_id, cluster_name, desired_tier, control_plane_tier, control_plane_handle]
      properties:
        tenant_id: { type: string }
        cluster_name: { type: string }
        desired_tier: { type: string }
        control_plane_tier: { type: string }
        control_plane_handle: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, detail]
          properties:
            kind: { type: string }
            detail: { type: string }
