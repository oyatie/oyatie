[package]
name = "k8s-control-plane-host-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Composition root for the managed-Kubernetes control-plane-host concern (ADR-0376). Wires the ControlPlaneProvisioning port (kernel + api) to a chosen adapter (in-memory fake for dev/test; the kube-rs CAPI adapter when a management kubeconfig is configured), exposes an axum admin/status API, and ships a fail-closed [[bin]] main that reads the mgmt-kubeconfig path from env (typed error if absent). Mirrors the intelligence-app composition pattern (ports + in-memory + production adapter + build_state/build_router/serve/run + BootError; ADR-0083 Tier-3 panic-free)."

# Composition / app layer (ADR-0105). Path-deps inward on the kernel + api +
# both adapters. Adds the same axum + tokio + tracing + serde backbone the
# intelligence app declares (blessed runtime crates). kube-rs stays isolated to
# the -adapter-capi crate; this app references it transitively only.
[dependencies]
k8s-control-plane-host-kernel = { path = "../../core/control-plane-host-kernel" }
k8s-control-plane-host-api = { path = "../../ports/control-plane-host-api" }
k8s-control-plane-host-adapter-capi = { path = "../../adapters/control-plane-host-adapter-capi" }
k8s-control-plane-host-adapter-inmemory = { path = "../../adapters/control-plane-host-adapter-inmemory" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# io-util enables AsyncReadExt/AsyncWriteExt for the acceptance suite's raw-socket
# loopback HTTP client (no extra HTTP-client dev-dep).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "io-util"] }

[lib]
name = "k8s_control_plane_host_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "k8s-control-plane-host"
path = "src/main.rs"

[lints]
workspace = true
