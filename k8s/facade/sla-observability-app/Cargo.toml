[package]
name = "k8s-sla-observability-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Composition/application service for managed-Kubernetes SLA observability. Reads the control-plane-host status port, ingests snapshots, and returns deterministic golden-signal DTOs without live Prometheus/Kubernetes coupling."

[dependencies]
k8s-sla-observability-kernel = { path = "../../core/sla-observability-kernel" }
k8s-sla-observability-api = { path = "../../ports/sla-observability-api" }
k8s-sla-observability-adapter-inmemory = { path = "../../adapters/sla-observability-adapter-inmemory" }
k8s-control-plane-host-api = { path = "../../ports/control-plane-host-api" }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
k8s-control-plane-host-adapter-inmemory = { path = "../../adapters/control-plane-host-adapter-inmemory" }

[lib]
name = "k8s_sla_observability_app"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
