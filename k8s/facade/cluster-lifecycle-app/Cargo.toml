[package]
name = "k8s-cluster-lifecycle-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Composition root for managed-Kubernetes cluster lifecycle admission: validates cluster create requests, checks tenant quota, then calls the control-plane-host provisioning port."

[dependencies]
k8s-cluster-lifecycle-kernel = { path = "../../core/cluster-lifecycle-kernel" }
k8s-cluster-lifecycle-api = { path = "../../ports/cluster-lifecycle-api" }
k8s-tenant-quota-kernel = { path = "../../core/tenant-quota-kernel" }
k8s-tenant-quota-adapter-inmemory = { path = "../../adapters/tenant-quota-adapter-inmemory" }
k8s-control-plane-host-adapter-inmemory = { path = "../../adapters/control-plane-host-adapter-inmemory" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.4", default-features = false, features = ["util"] }
http-body-util = { workspace = true }

[lib]
name = "k8s_cluster_lifecycle_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "k8s-cluster-lifecycle"
path = "src/main.rs"

[lints]
workspace = true
