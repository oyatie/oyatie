[package]
name = "k8s-control-plane-host-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Pure kernel for the managed-Kubernetes control-plane-host concern (ADR-0376 hosted-Kamaji + dedicated-Talos-spoke tiers). Owns the ControlPlaneTier enum, the provisioning status state machine, and the DatastoreClass taxonomy as abstract value types. NO CRD-field knowledge, NO I/O, NO async — std + serde only, per ADR-0083 Tier-3 panic-free + ADR-0092 dependency-seam (serde is the sole blessed dep)."

# PURE kernel layer (ADR-0105 Layer 1 / ADR-0083 Tier-3): no I/O, no HTTP, no
# async runtime, no kube-rs. Mirrors the std+serde discipline of the other
# kernel crates. The control-plane tier/status/datastore value types live here
# so they can be unit-tested exhaustively and reused by the api port + both
# adapters without leaking any CRD/transport detail inward.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "k8s_control_plane_host_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
