[package]
name = "ci-scan-root-derivation-adapters"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "adapter"
purpose = "Derive the set of repository roots a CI gate must scan from governance/capability-registry.json instead of a hand-enumerated per-gate list."

# ci/adapters: registry-derived scan-root resolution for the ci/facade gate fleet.
#
# WHY THIS CRATE EXISTS. The root Cargo.toml used to enumerate workspace members one glob per
# capability, and its own comment records what that cost: "the array was a mutex again, one level
# up, which is why every reorg move serialized on this file (68 of 68 movers)". It was replaced by
# four SHAPE globs that describe ADR-0562's layout instead of enumerating its instances, so a
# conforming capability is a member BY CONSTRUCTION.
#
# The gates never followed. Each gate policy still hand-enumerates the directory names it scans, and
# those lists have drifted from the tree: measured on embedded-asset-hermeticity, 18 of the 24
# REGISTERED capabilities were absent from its scan_roots and 3 declared roots were dead. A dangling
# embedded asset planted in comms/ left the gate GREEN. This crate is the gate-level equivalent of
# the workspace's shape globs: the roots are DERIVED from the closed capability registry, so a
# capability that materializes is scanned with zero edit to any gate.

[lib]
name = "ci_scan_root_derivation_adapters"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
