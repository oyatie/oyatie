[package]
name = "ci-controller-github-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GitHub commit-status poster adapter for the oya-ci controller (the
# `oya-ci-required` producer). Implements kernel::CommitStatusPoster via reqwest
# blocking HTTP. Posts to the GitHub Statuses API: POST /repos/<owner>/<repo>/statuses/<sha>.
# HTTP shape lifted from the proven oya-ci-webhook-gateway-github-adapter (ADR-0387 D5).
# Forge-of-record = GitHub (D2/D-FORGE).

[lib]
name = "ci_controller_github_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-controller-kernel = { path = "../kernel" }
reqwest = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# default-features=false drops the optional `cookies` feature (basic-cookies /
# lalrpop codegen, no buck2 fixup). Tests use only the generic header/path/body
# matchers, never httpmock's cookie matcher. Keeps reindeer feature-unification
# from re-enabling `cookies` for the vendored httpmock target.
httpmock = { version = "0.7", default-features = false }
serde_json = { workspace = true }

[lints]
workspace = true
