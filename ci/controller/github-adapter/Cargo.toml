[package]
name = "ci-controller-github-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GitHub commit-status poster adapter for the oya-ci controller (the
# `oya-ci-required` producer). Implements kernel::CommitStatusPoster via reqwest
# blocking HTTP. Posts to the GitHub Statuses API: POST /repos/<owner>/<repo>/statuses/<sha>.
# HTTP shape lifted from the proven oya-ci-webhook-gateway-github-adapter (ADR-0387 D5).
# Forge-of-record = GitHub (D2/D-FORGE).

[lib]
name = "ci_controller_github_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
ci-controller-kernel = { path = "../kernel" }
reqwest = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# First-party scripted HTTP test server. Replaces `httpmock`, which ADR-0709 D-6
# Rule 2 fails on what it DRAGS IN (async-std, hyper 0.14, http 0.2, winapi 0.3.9,
# syn 1.0.109) rather than on the crate itself.
scripted-http-server = { path = "../../../intelligence/testing/scripted-http-server" }
serde_json = { workspace = true }

[lints]
workspace = true
