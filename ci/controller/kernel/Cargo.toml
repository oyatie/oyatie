[package]
name = "ci-controller-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# oya-ci controller kernel — pure-domain state machine for Phase-1 bespoke-Prow
# (oya-ci-bespoke-prow design). No I/O, no async, no kube, no tokio.
# Owns: GateRun, GateOutcome, CommitState, JobObservation, map_job_to_status.
# ADR-0387 (ci-gate substrate); see docs/ideas/oya-ci-bespoke-prow.md Phase 1.

[lib]
name = "ci_controller_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
