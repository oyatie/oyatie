[package]
name = "ci-path-resolver-ports"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ci/ports: the PURE move-aware path-resolution contract (no I/O). Defines the logical
# PathId identities of the self-referential CI gates' movable self-locations, the compiled
# CURRENT-canonical seed table (never read from a candidate-tree data file — the
# candidate-repointable anchor is the removed guard), and the two ports the adapter needs
# (MoveBijection over the de-committed move-manifest, FrozenRefSource over the git merge-base
# seam). The concrete git/manifest implementations live in ci/adapters/path-resolver.

[lib]
name = "ci_path_resolver_ports"
path = "src/lib.rs"
doctest = false

