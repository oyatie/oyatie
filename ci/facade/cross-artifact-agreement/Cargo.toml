[package]
name = "ci-cross-artifact-agreement"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GATE-1 cloud-ci-cross-artifact-agreement (PHASE-0-FIREWALL-PLAN §5.2; amends ADR-0365).
# Pure evaluator over the cross-artifact corpus (ADR front-matter × spec × masterplan ×
# roadmap × reciprocal supersession × the generated faces); emits {verdict, violations}.
# The integration test globs specs/fixtures/cross-artifact-agreement/tc-*.json and asserts
# report.violations against each fixture's expected_violations. The born-blocking self-test
# runs the producer's decision-crosswalk face over the live corpus. G-INTEGRITY track: no
# buck2 build-graph dep.

[lib]
name = "ci_cross_artifact_agreement"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The ADR-index producer kernel (pure, std-only): gate-coverage check 3/3 invokes
# the SAME library code the `oya doc adr-index` step uses to re-render the
# generated projections, instead of shelling out.
oya-check-adr-index = { path = "../../../libs/oya-check-adr-index" }
oya-governance-adr-shape-kernel = { path = "../../../libs/oya-governance-adr-shape-kernel" }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }
tempfile = { workspace = true }
oya-check-adr-index = { path = "../../../libs/oya-check-adr-index" }
oya-governance-adr-shape-kernel = { path = "../../../libs/oya-governance-adr-shape-kernel" }

[lints]
workspace = true
