[package]
name = "ci-build-cache-policy"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Policy-as-data buck2 cache wiring for the NativeLink CAS warm substrate (ADR-0560): resolves {bypass, warm-ro, warm-rw}, controls one child daemon through private mode-0600 .buckconfig.local, proves canary builds cold, byte-compares cold vs warm digest manifests, and reports structured cache-hit telemetry."

# cloud-ci-cache-wiring (ADR-0560, consuming ADR-0556): NEUTRAL engine — the
# classification lives in /specs/cache-warmth-policy.json (single source), the
# canary-licensed kill-switch in /specs/cache-warm-license.json, and the opt-in
# overlays under infra/ci/buckconfig/. Fail-closed: unknown class -> bypass,
# unlicensed -> bypass, canary -> bypass unconditionally, warm emission without a
# keyed mTLS identity -> hard error. Converts FRIC-1781450000 (0%-cache-hit cold
# CI; lineage FRIC-1781071664 -> FRIC-1781070457-buck2-no-shared-cache).

[lib]
name = "ci_build_cache_policy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-cache-wiring"
path = "src/main.rs"

[dependencies]
prost = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }

[lints]
workspace = true
