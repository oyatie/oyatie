[package]
name = "ci-affected-target-set"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Binding workspace-coverage lane (ADR-0554) plus ADR-0711 hub-exclusivity and anti-drift-drift-grep evaluators: derives the buck2 affected-target set from the merge-base diff (fail-closed full escalation); REFUSEs multi-owned hubs at #hubs.paths; REFUSEs ADR-0711/PORTABLE prose dual-truth enumerations outside #anti_drift.prose_must_cite_not_enumerate."

# cloud-ci-affected-set (ADR-0554, FRIC-1781310000): the Rust successor that RETIRED the
# transitional infra/ci/buck2-affected-gate.sh shell driver (removed ADR-0554 round-6). The
# kernel (lib) is a NEUTRAL pure decision engine — diff
# entries + per-file owner results + policy DATA -> {Affected|Full|Refuse|NoGraphTargets};
# all repo facts (escape-trigger path classes, universe, cell roots) live in
# affected-set-policy.json. The binary is the composition root that talks to git + buck2.

[lib]
name = "ci_affected_target_set"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-affected-set"
path = "src/main.rs"

# ADR-0554 round-3: build-health ratchet — blocks FULL-tier build REGRESSIONS vs the merge-base
# while grandfathering pre-existing build debt (no flag-day requirement).
[[bin]]
name = "oya-cloud-ci-build-health"
path = "src/bin/oya-cloud-ci-build-health.rs"

[[bin]]
name = "oya-cloud-ci-step-telemetry"
path = "src/bin/oya-cloud-ci-step-telemetry.rs"

[[test]]
name = "hub_exclusivity"
path = "tests/hub_exclusivity.rs"

[[test]]
name = "anti_drift_drift_grep"
path = "tests/anti_drift_drift_grep.rs"

[dependencies]
serde_json = { workspace = true }
# Owned GitHub REST adapter for the trusted-baseline consumer. `gh` is NOT installed on the owned
# arm64 runner image (probed against the live digest-pinned image), so the subprocess this replaces
# failed with os error 2 on every FULL-tier run and silently paid the cold merge-base rebuild.
reqwest = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
