[package]
name = "ci-crate-catalog-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI crate-catalog coverage gate. Catalog YAML is optional census metadata; membership is the Cargo workspace plus the closed capability registry. A missing registry/catalog/<package-name>.yaml is not born-blocking. Extra YAML is ignored here; unmarked stale rows are catalog-liveness. The evaluator still fails closed on an implausibly small crate corpus so a broken collector cannot present as green."

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "ci_crate_catalog_coverage"
path = "src/lib.rs"
doctest = false

[[test]]
name = "crate_catalog_coverage"
path = "tests/crate_catalog_coverage.rs"

[lints]
workspace = true
