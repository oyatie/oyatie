[package]
name = "ci-crate-catalog-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI crate-catalog coverage gate. Asserts every live first-party crate carries a registry/catalog/<package-name>.yaml row. The catalog is keyed by FILENAME, so a moved crate strands its row under the old package name and a content search never finds it — the coupled edit no codemod authors. Born-blocking against a FROZEN shrink-only baseline of today's uncatalogued crates; a NEW or MOVED crate fails unless its row lands in the same change. Complements the existing catalog->crate checks (a row whose crate is gone) by closing the reverse direction."

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "ci_crate_catalog_coverage"
path = "src/lib.rs"
doctest = false

[[test]]
name = "crate_catalog_coverage"
path = "tests/crate_catalog_coverage.rs"

[lints]
workspace = true
