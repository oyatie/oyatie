[package]
name = "ci-crypto-backend-policy"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING the ADR-0506 zero-ring invariant: the forbidden crypto backend(s) (ring) are never ACTIVATED in the workspace's feature-resolved dependency graph, mandating aws-lc-rs as the single backend."

# cloud-ci-crypto-backend-purity (ADR-0506): self-contained, policy-driven gate. A pure
# evaluate_keyed(policy, observed) asserts that no forbidden crypto backend is ACTIVATED in the
# feature-resolved graph. The observed signal is the `cargo tree -i <crate> --target all`
# activation view (NOT the Cargo.lock / cargo-metadata superset, which retains the documented
# unactivated optional-dep ring phantom — see ADR-0506). R0 pack-shaped: all repo-specifics
# (forbidden + mandated crate lists, gate_id) live in crypto-backend-purity-policy.json.

[lib]
name = "ci_crypto_backend_policy"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
oya-buck-syntax-kernel = { path = "../../../libs/oya-buck-syntax-kernel" }

[lints]
workspace = true
