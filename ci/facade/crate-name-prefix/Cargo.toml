[package]
name = "ci-crate-name-prefix"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-cargo-prefix (ADR-0017; §2.5-adjacent, MIG-PREREQ floor gate S3). A pure evaluator
# that REUSES the existing cargo-prefix fitness policy in
# oya-intelligence-cargo-prefix-domain::validate_cargo_prefix
# (CLI-GOVERNANCE-TO-FIREWALL-MIGRATION-PLAN Principle 1, shape b — reuse, not re-derive). The
# producer (oya-cloud-ci-accounting-registry-app) enumerates every tracked first-party workspace
# member candidate + package name (the I/O) and feeds them as rows; this gate runs
# validate_cargo_prefix per crate (surface-all) and emits a Finding per crate whose member-path
# crate-id or package name does not begin with the required prefix (or disagree). The required
# prefix is sourced from the oya-ci config `[naming].required_prefix` (default `oya-`) — never
# hardcoded. baseline-block-on-new freezes today's debt and blocks only NEW non-conformant crates.

[lib]
name = "ci_crate_name_prefix"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
intelligence-cargo-prefix-domain = { path = "../../../intelligence/core/cargo-prefix-domain" }
oya-ci-config-kernel = { path = "../../../libs/oya-ci-config" }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
ci-scm-facts-snapshot = { path = "../scm-facts-snapshot" }
oya-workspace-members-kernel = { path = "../../../libs/oya-workspace-members-kernel" }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
