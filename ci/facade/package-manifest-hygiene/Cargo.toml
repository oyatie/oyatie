[package]
name = "ci-package-manifest-hygiene"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-manifest-hygiene (§2.5#7; MIG-PREREQ floor gate S2). A pure evaluator over the
# per-crate manifest-hygiene flags the producer (oya-cloud-ci-accounting-registry-app) extracts
# from each first-party oya-* Cargo.toml: version/rust-version inherit the workspace, publish is
# false, a license is declared, [lints] inherits the workspace, and (when a [lib] is present)
# doctest is false. NET-NEW predicate (no pure crate owned the full §2.5#7 field-set —
# CLI-GOVERNANCE-TO-FIREWALL-MIGRATION-PLAN §2 item 2). Emits one Finding per (crate, missing
# field); baseline-block-on-new freezes today's debt and blocks only NEW non-conformant crates.

[lib]
name = "ci_package_manifest_hygiene"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# The shared independent corpus census the born-blocking self-test re-derives the oya-* crate set
# with (ci/adapters/corpus-census). It owns the oya-workspace-members-kernel + oya-ci-config-kernel
# edges this crate used to declare directly for exactly that purpose; both are dead here now that
# the census is no longer inlined in tests/manifest_hygiene.rs.
ci-corpus-census-adapters = { path = "../../adapters/corpus-census" }
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
