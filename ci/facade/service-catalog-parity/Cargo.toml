[package]
name = "ci-service-catalog-parity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-catalog-liveness: portable conformance gate. Catalog YAML is optional census
# metadata. A record is RED iff it names no live workspace crate AND carries no explicit
# non-live marker. A live crate without a row is not a finding. The producer owns
# registry/catalog I/O and in-process live-crate-id resolution.

[lib]
name = "ci_service_catalog_parity"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
