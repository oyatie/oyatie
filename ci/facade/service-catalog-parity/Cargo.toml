[package]
name = "ci-service-catalog-parity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-catalog-liveness: portable conformance gate enforcing the founder
# "live-OR-explicitly-marked" catalog policy. The producer owns registry/catalog I/O and the
# in-process live-crate-id resolution; it emits {"rows":[{"crate_id","source_path","is_live",
# "marker"}]}; this gate keeps the evaluator pure and hermetic (no cargo metadata / buck2
# shell-out). A catalog record is RED iff it names no live workspace crate AND carries no
# explicit non-live marker.

[lib]
name = "ci_service_catalog_parity"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
