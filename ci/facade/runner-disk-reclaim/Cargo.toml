[package]
name = "ci-runner-disk-reclaim"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "FRIC-017 productization (ADR-0548 pipeline-as-product): data-driven Rust-first CI-runner disk preflight. Reads runner-disk-reclaim-policy.json, best-effort removes a runner profile's vendor preinstall dirs BEFORE the buck-out warm restore, logs structured disk-before/after, and asserts the post-reclaim free-disk floor — emitting a distinct INFRA-RED signal/exit so a downstream disk-exhaustion is attributable to INFRA not CODE. Retires the two duplicated inline `sudo rm -rf` blocks in .github/workflows/oya-ci-required.yml."

# cloud-ci-runner-disk-reclaim (FRIC-017, pipeline-glue(b)): NEUTRAL engine — the
# runner-profile classification (reclaim_dirs + min_free_gib_after) lives in
# runner-disk-reclaim-policy.json (single source). The engine is pure + fs-injected
# (DiskOps trait) so the reclaim plan + policy parse + threshold/INFRA-RED logic are
# unit-tested against a temp dir, never the real system dirs. Best-effort per dir (old
# `|| true`); fail-loud only on a free-disk stat failure.

[lib]
name = "ci_runner_disk_reclaim"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-runner-disk-reclaim"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
