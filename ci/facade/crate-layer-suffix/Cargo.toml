[package]
name = "ci-crate-layer-suffix"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-bnf-layer-suffix (§2.5#4; MIG-PREREQ floor gate S1). A pure evaluator that
# REUSES the existing layer-suffix policy in oya-governance-predictable-naming-kernel::check()
# (CLI-GOVERNANCE-TO-FIREWALL-MIGRATION-PLAN §2 item 1; Principle-1 shape (a)). The producer
# (oya-cloud-ci-accounting-registry-app) enumerates first-party oya-* crate names (the I/O) and
# feeds them as rows; this gate resolves the declared role carve-out-aware (oya-check-* /
# *-adapter-<backend> / doctrinal are exempt) and runs check(), emitting a Finding per crate
# whose trailing dash-segment is not one of the 12 canonical ADR-0056 layer values. The
# integration test globs specs/fixtures/bnf-layer-suffix/tc-*.json + a born-blocking self-test
# asserts the gate fires on the live corpus. G-INTEGRITY track: no buck2 build-graph dep.

[lib]
name = "ci_crate_layer_suffix"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
check-predictable-naming-kernel = { path = "../../../governance/check/predictable-naming-kernel" }
oya-ci-config-kernel = { path = "../../../libs/oya-ci-config" }

[dev-dependencies]
# The shared independent corpus census the born-blocking self-test re-derives the oya-* crate set
# with (ci/adapters/corpus-census). It owns the oya-workspace-members-kernel edge this crate used
# to declare directly for exactly that purpose; that edge is dead here now that the census is no
# longer inlined in tests/bnf_layer_suffix.rs.
ci-corpus-census-adapters = { path = "../../adapters/corpus-census" }
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
