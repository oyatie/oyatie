[package]
name = "ci-supply-chain-audit"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING supply-chain advisory hygiene: matches the policy-declared, symlink-rejecting workspace lockfile corpus against a VENDORED, content-addressed RustSec advisory snapshot and blocks any locked crate affected by an un-ignored security (SCA-VULN) or unmaintained (SCA-UNMAINTAINED) advisory. Owned pure-Rust replacement for the reverted #974 shell cargo-audit/deny — hermetic (serde_json+toml+semver only, no recursive walk/rustsec/git2/libgit2/shell/network/clock), born-blocking, with lockfile and mirror floors failing closed against narrowed or vacuously-green input."

# cloud-ci-supply-chain-audit: self-contained, policy-driven gate. A pure evaluate_keyed(policy,
# observed) matches configured Cargo.lock versions against the vendored advisory mirror via semver.
# The observed signal reads only policy.lockfile_corpus and
# advisory-mirror/{advisories.json,mirror-manifest.json}; no filesystem walk/shell/network/clock.
# R1 pack-shaped: corpus, min_lockfiles, mirror_dir, unmaintained policy, advisory floor, and ignores
# all live in supply-chain-audit-policy.json. Legacy lockfile_path remains supported.

[lib]
name = "ci_supply_chain_audit"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-advisory-mirror-kernel = { path = "../../../libs/oya-advisory-mirror-kernel" }
semver = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
