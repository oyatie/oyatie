[package]
name = "ci-supply-chain-audit"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING supply-chain advisory hygiene: matches EVERY declared Cargo.lock in the repository against a VENDORED, content-addressed RustSec advisory snapshot and blocks any locked crate affected by an un-ignored security (SCA-VULN) or unmaintained (SCA-UNMAINTAINED) advisory. Owned pure-Rust replacement for the reverted #974 shell cargo-audit/deny — hermetic (serde_json+toml+semver only, no rustsec/git2/libgit2, no shell/network/clock), born-blocking, with mirror integrity (content_hash+count+floor) failing closed against a truncated/vacuously-green snapshot and a DERIVED lockfile-coverage assertion (walk the tree, assert set equality with policy.lockfile_paths) failing closed against an unscanned workspace."

# cloud-ci-supply-chain-audit: self-contained, policy-driven gate. A pure evaluate_keyed(policy,
# observed) matches Cargo.lock versions against the vendored advisory mirror via semver. The observed
# signal is a read-only parse of every declared Cargo.lock, a read-only walk of the tree deriving the
# ACTUAL lockfile corpus, and advisory-mirror/{advisories.json,mirror-manifest.json} (NO
# shell/network/clock). R0 pack-shaped: lockfile_paths, mirror_dir, unmaintained_policy,
# min_advisories floor, and the time-boxed ignore[] all live in supply-chain-audit-policy.json.

[lib]
name = "ci_supply_chain_audit"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-advisory-mirror-kernel = { path = "../../../libs/oya-advisory-mirror-kernel" }
semver = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
