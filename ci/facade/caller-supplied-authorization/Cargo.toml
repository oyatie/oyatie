[package]
name = "ci-caller-supplied-authorization"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING that no use-case / request-handler trusts a CALLER-SUPPLIED authorization decision as the authz verdict (the #1 systemic antipattern found at 30+ trust boundaries, sibling of issue #770 / AUTH-005). The antipattern: a fn reads an authorization-decision blob FROM the request DTO (an `*Authorization` struct with decision_id/tenant_id/principal_id/allowed_surfaces, or `x-authorization-*` headers) and 'validates' it ONLY by self-comparison/equality/membership against the same request, WITHOUT calling a server-side cloud-iam Cedar PDP decide()/ensure_authorized() port. This is default-ALLOW-on-forged-input: any caller forges the blob and authorizes itself. The gate makes a NEW instance IMPOSSIBLE to ship while frozen-baselining the existing debt (shrink-only). The fixed pattern (GREEN) verifies a principal from an unforgeable credential + calls a PDP decide() port + fails closed (iam/ports/policy-cedar-api/src/authz.rs)."

# cloud-ci-dto-authz-trust (sibling of cloud-ci-authz-coverage / issue #770): self-contained,
# policy-driven gate. A pure evaluate_keyed(policy, observed) asserts that no NEW function trusts a
# caller-supplied authorization decision in place of a server-side PDP decision. The observed signal
# is a read-only walk of the candidate tree's Rust source extracting every fn that reads an
# authorization-decision DTO field and self-validates it, plus whether the fn body calls a PDP
# decision port (NO shell/network/VCS/clock/rand). R0 pack-shaped: all repo-specifics (the
# authorization-DTO type-suffix + decision-field signatures, the PDP decision-port idents, scan
# roots/excludes, the frozen baseline of known instances, the liveness floor) live in
# dto-authz-trust-policy.json.

[lib]
name = "ci_caller_supplied_authorization"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
