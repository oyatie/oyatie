# GATE-4 cloud-ci-automation-ratchet (PHASE-0-FIREWALL-PLAN §5.2; register #20). HARDENS the
# existing seed (specs/phase0-automation-matrix.json + specs/fixtures/phase0-automation-ratchet/).
# Pure evaluator over the matrix rows; emits {verdict, violations}. The gate that polices the
# OTHER gates: enforceable/automatable must be a WIRED buck2 gate target, never an oya CLI call,
# never an unwired advisory surface that claims to enforce. The integration test globs
# specs/fixtures/phase0-automation-ratchet/tc-*.json and asserts report.violations against each
# fixture's expected_violations. The born-blocking self-test runs the producer's
# enforcement-inventory face over the live corpus. G-INTEGRITY track: no buck2 build-graph dep.

[lib]
name = "ci_automation_coverage"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

