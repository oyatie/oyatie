[package]
name = "ci-module-membership"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-capability-membership (Phase-0 capability-first reorg; ADR-0562 §6). The MEMBERSHIP lint
# — the anti-junk-drawer authority. The closed-registry enforcement that makes a capability-first
# tree mechanically safe: every crate maps to EXACTLY ONE registered capability (or a meta dir),
# no top-level dir exists outside the closed set, and base/ admission is gated (>=3 capability
# consumers AND strictly below all of them in the ADR-0280 DAG). Born ADVISORY against the registry's
# frozen unmapped baseline (enforce NO REGRESSION: no NEW unmapped crate, no NEW top-level dir); the
# baseline burns DOWN as the strangler homes crates and the lint flips to BLOCKING at baseline 0.
# Born pack-shaped: the closed capability set + per-crate mappings + frozen baseline are DATA in
# governance/capability-registry.json; the gate identity + scan roots + closed top-level set are DATA in
# capability-membership-policy.json. The Rust kernel hardcodes no oyatie path nor capability slug.
# ADR-0083 Tier-3: production code carries no unwrap/expect/panic.

[lib]
name = "ci_module_membership"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
