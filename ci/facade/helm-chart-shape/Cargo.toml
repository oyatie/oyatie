[package]
name = "ci-helm-chart-shape"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "helm-chart-shape"
kind = "ci-gate"
layer = "facade"
purpose = "Hermetic shape gate over Helm chart directories. Helm renders EVERY file under templates/, so a non-manifest file there is parsed as a Kubernetes manifest and breaks the chart — which is how a BUCK file came to sit in intelligence/iac/k8s/helm/templates/ undetected. Pure Rust with no helm binary and no shell, so it runs inside the required cargo test job rather than adding inline-shell debt to workflow YAML."

[lib]
name = "ci_helm_chart_shape"
path = "src/lib.rs"
doctest = false

[dev-dependencies]

[lints]
workspace = true
