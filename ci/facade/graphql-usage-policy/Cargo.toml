[package]
name = "ci-graphql-usage-policy"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING the ADR-0565 zero-GraphQL doctrine: no GraphQL execution/parse library (in any member Cargo.toml) and no .graphql/.gql/.sdl schema file may enter the candidate tree without referencing an authorizing (reversing) ADR. The canonical owned API surface is REST + gRPC + AsyncAPI + realtime."

# cloud-ci-no-graphql-without-adr (ADR-0565): self-contained, policy-driven gate. A pure
# evaluate_keyed(policy, observed) asserts the candidate tree carries no forbidden GraphQL library
# nor schema file (absent an authorizing ADR reference). The observed signal is a hermetic,
# read-only fs scan of the CANDIDATE tree (member Cargo.toml manifests via
# oya-workspace-members-kernel + a .graphql/.gql/.sdl file walk), NOT a frozen merge-base (which
# would be the PR/push baseline-asymmetry false-green). R0 pack-shaped: all repo-specifics
# (forbidden_crates, schema_extensions, forbidding_adr, excluded_dirs) live in
# no-graphql-without-adr-policy.json.

[lib]
name = "ci_graphql_usage_policy"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
workspace-members-kernel = { path = "../../../base/workspace-members-kernel" }

[lints]
workspace = true
