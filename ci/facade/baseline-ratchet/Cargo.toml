[package]
name = "ci-baseline-ratchet"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-firewall (PHASE-0-FIREWALL-PLAN go-live readiness ratchet; register #20).
# The single required status check that layers the BASELINE as the second predicate on
# top of the four born-blocking gates: born-blocking proves the gate detects the live
# exhibit; the baseline converts "detects everything" into "blocks only NEW debt".
#
# It is NOT an `oya` CLI (the retired oya gate/oya gen authority). The pure predicates
# (compare-mode + ratchet-invariant) live in the lib so they are fixture-drivable; the
# live runner that regenerates the faces + byte-diffs the committed baseline is the
# integration test gate.

[lib]
name = "ci_baseline_ratchet"
path = "src/lib.rs"
doctest = false

# Automation-default surface (founder directive 2026-06-12): the inert-door fixer derives
# and applies the mechanical retirement of sign-off entries that exempt nothing
# (FRIC-1781280001); the firewall gate's inert-door RED is the enforcement backstop and
# prints exactly this command.
[[bin]]
name = "oya-cloud-ci-firewall-signoff-fixer"
path = "src/main.rs"

# Typed terminal-state adapter: reads the run/jobs/annotations JSON from the Actions REST API and
# hands it to the pure `run_terminal_state` kernel. Not a `gh` wrapper — `gh` is absent from the
# owned runner image.
[[bin]]
name = "oya-cloud-ci-run-terminal-state"
path = "src/bin/oya-cloud-ci-run-terminal-state.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
