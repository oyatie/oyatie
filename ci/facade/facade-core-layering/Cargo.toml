[package]
name = "ci-facade-core-layering"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING ADR-0562's central layering rule: a `facade` crate reaches its own capability's `core` only through `ports`. The rule has been stated since ADR-0562 was accepted and gated by nothing, so 35 facade packages violate it today. This freezes those 35 (shrink-only) and makes a NEW one impossible to ship. Detection statically parses BUCK, not Cargo.toml — intelligence/facade/worker carries the edge in BUCK with zero Cargo path-deps, so a manifest scan is blind to it. Baseline keys are cargo package names, not paths or buck2 target labels, so a future capability move cannot invalidate the baseline and make the repair look like laundering."

[lib]
name = "ci_facade_core_layering"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
