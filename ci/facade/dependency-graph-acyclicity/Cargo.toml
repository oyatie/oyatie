[package]
name = "ci-dependency-graph-acyclicity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI acyclicity gate for the policy-declared substrate-of-substrate dependency DAG (ADR-0280 §D-3): Tarjan SCC (no cycles) + forbidden-edge honouring + Kahn topo-sort == bootstrap_order + §D-1 schema completeness."

# cloud-ci-substrate-dependency-dag-acyclicity (ADR-0280 §D-3, amended by ADR-0520 + ADR-0562):
# the principal enforcement surface of the substrate-of-substrate dependency doctrine. Pure graph
# engine (Tarjan + Kahn); repo-specific adoption points live in substrate-dependency-dag-policy.json.
# Born pack-shaped: runs on any DAG document of the §D-1 schema. Bootstrap order is DERIVED by
# querying the DAG (Kahn topo-sort), never hard-coded.

[lib]
name = "ci_dependency_graph_acyclicity"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-substrate-dependency-dag-acyclicity"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[[test]]
name = "acyclicity"
path = "tests/acyclicity.rs"

[lints]
workspace = true
