[package]
name = "ci-dependency-graph-acyclicity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Oyatie cloud-ci authority gate for the face-aware substrate graph v2 (ADR-0280 §D-3, ADR-0635): exact doctrine/unit/schema bindings, request-graph acyclicity, forbidden-edge honouring, valid dependency-first bootstrap order, and exact derived failure closure."

# cloud-ci-substrate-dependency-dag-acyclicity (ADR-0280 §D-3, amended by ADR-0520, ADR-0562,
# and ADR-0635): the principal enforcement surface of Oyatie's substrate-of-substrate dependency
# doctrine. The policy selects the live documents; the Rust validator deliberately binds their exact
# authority tuples, schema digest, graph kinds, and doctrine ADRs. Bootstrap order is hand-authored
# but must be a complete, dependency-first topological order of the declared bootstrap graph.

[lib]
name = "ci_dependency_graph_acyclicity"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-substrate-dependency-dag-acyclicity"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[[test]]
name = "acyclicity"
path = "tests/acyclicity.rs"

[lints]
workspace = true
