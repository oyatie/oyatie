[package]
name = "ci-artifact-inventory-registry"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# The buck2 rust_binary producer of accounting-registry.generated.json + the 3
# companion generated faces (PHASE-0-FIREWALL-PLAN §5.1; D-DOCTRINE total-accounting).
# Register #20: this is a Rust gate binary, NOT an `oya` CLI subcommand. Carve-outs
# (vendor/generated/ephemeral/...) live as DATA in the bundled oya-ci-config unit-class
# + ttl tables (`Policy::from_config`), never as scanner code. Owned by GATE-2
# cloud-ci-total-accounting.

[lib]
name = "ci_artifact_inventory_registry"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-accounting-registry-app"
path = "src/main.rs"

# Cargo-only test-resource adapter. This is not a production or admission CLI: it supplies the
# same emitter -> declared snapshot -> producer ordering that the required workflow materializer
# owns when `cargo test --workspace` is run without workflow pre-steps.
[[bin]]
name = "oya-cloud-ci-cargo-test-producer-adapter"
path = "src/bin/oya-cloud-ci-cargo-test-producer-adapter.rs"

[dependencies]
oya-reorg-codemod-app = { path = "../../../tools/oya-reorg-codemod-app" }
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde = { workspace = true }
serde_json = { workspace = true }
oya-ci-config-kernel = { path = "../../../libs/oya-ci-config" }
ci-artifact-accountability = { path = "../artifact-accountability" }
ci-cross-artifact-agreement = { path = "../cross-artifact-agreement" }
ci-stale-artifact-detection = { path = "../stale-artifact-detection" }
ci-automation-coverage = { path = "../automation-coverage" }
ci-crate-layer-suffix = { path = "../crate-layer-suffix" }
ci-package-manifest-hygiene = { path = "../package-manifest-hygiene" }
ci-crate-name-prefix = { path = "../crate-name-prefix" }
ci-slo-coverage = { path = "../slo-coverage" }
ci-license-policy = { path = "../license-policy" }
ci-service-catalog-parity = { path = "../service-catalog-parity" }
ci-workspace-member-coverage = { path = "../workspace-member-coverage" }
ci-build-target-parity = { path = "../build-target-parity" }
ci-hook-wiring = { path = "../hook-wiring" }
check-brand-residue = { path = "../../../governance/check/brand-residue" }
oya-workspace-members-kernel = { path = "../../../libs/oya-workspace-members-kernel" }

[lints]
workspace = true
