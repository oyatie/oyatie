[package]
name = "ci-build-target-parity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ensuring every workspace member with Rust test code has a Buck rust_test target."

# cloud-ci-target-parity (ADR-0540): pure policy over producer-emitted workspace-member rows.
# The producer owns filesystem and workspace-member I/O; this gate rejects missing BUCK files
# and members whose Rust test code is not compiled by a rust_test target.

[lib]
name = "ci_build_target_parity"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }

[lints]
workspace = true
