[package]
name = "ci-contract-slice-conformance"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Paved-road owned-Rust/Buck2 cloud-ci gate that replaces scripts/tests/*_check.py
# contract-slice validators. It deliberately does not extend the retired local
# gate CLI authority; protected merge authority stays cloud-ci via oya-ci-required.

[lib]
name = "ci_contract_slice_conformance"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-materialize-contract-slice-policy"
path = "src/bin/oya-cloud-ci-materialize-contract-slice-policy.rs"

[dependencies]
serde_json = { workspace = true }
regex = { workspace = true }

[lints]
workspace = true
