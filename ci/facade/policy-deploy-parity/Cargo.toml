[package]
name = "ci-policy-deploy-parity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ENFORCING deployed-vs-authored Cedar policy parity (GH #16; ADR-0608). Every <cap>/iac/k8s/helm/templates/cedar.yaml ConfigMap embeds the Cedar policy the in-cluster PDP loads at runtime; this gate refuses (CHECK-A) any deployed permit whose head leaves the action unconstrained (the action-agnostic blanket grant) or whose bare resource has no resource/scope predicate, and (CHECK-B) any deployed permit absent from the capability's authored <cap>/{policy,cedar}/*.cedar set, failing closed when a deployed ConfigMap has no resolvable authored policy. The GH #16 byte-identical blanket ConfigMaps are grandfathered in a documented, time-boxed, shrink-only baseline so the gate is born-blocking against regressions while the blanket-disarm follow-up shrinks it to empty. Owned pure-Rust, hermetic (serde_json only, no shell/network/clock/VCS), R0 pack-shaped (all repo-specifics live in cedar-deploy-parity-policy.json)."

# cloud-ci-cedar-deploy-parity (GH #16 / ADR-0608): a pure, policy-driven gate. The collector is the
# only I/O — a hermetic, read-only fs walk for deployed Cedar ConfigMaps + each capability's authored
# .cedar. The pure evaluate_keyed(policy, observed) flags action-agnostic permits or bare-resource
# permits with no resource/scope predicate (CHECK-A) and deployed-not-subset-of-authored grants
# (CHECK-B), fail-closed on malformed / missing-authored / empty-scan. Pack-shaped: scan suffix,
# cedar-deploy-parity-policy.json, nothing oyatie-specific is hardcoded in Rust.

[lib]
name = "ci_policy_deploy_parity"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
