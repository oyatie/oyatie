[package]
name = "ci-generated-artifact-freshness"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI freshness gate for Cargo.lock member parity and generated face byte parity."

[lib]
name = "ci_generated_artifact_freshness"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-freshness-app"
path = "src/main.rs"

[[bin]]
name = "oya-cloud-ci-face-settle"
path = "src/bin/oya-cloud-ci-face-settle.rs"

[[bin]]
name = "oya-cloud-ci-materialize-generated-faces"
path = "src/bin/oya-cloud-ci-materialize-generated-faces.rs"

[dependencies]
ci-cross-artifact-agreement = { path = "../cross-artifact-agreement" }
ci-planning-projection = { path = "../planning-projection" }
oya-workspace-members-kernel = { path = "../../../libs/oya-workspace-members-kernel" }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
