[package]
name = "ci-slo-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-slo-coverage: portable conformance gate for catalog SLO declarations. The producer
# owns registry/catalog I/O and emits {"rows":[{"crate_id","slo"}]}; this gate reuses the
# existing oya-check-slo-coverage kernel and keeps the evaluator pure and hermetic.

[lib]
name = "ci_slo_coverage"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
check-slo-coverage = { path = "../../../governance/check/slo-coverage" }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
