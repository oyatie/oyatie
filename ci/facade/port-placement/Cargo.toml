[package]
name = "ci-port-placement"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate ensuring storage/repository/port traits are DEFINED in core/ports/kernel crates, not in adapter crates (the #116 ports-in-adapter clean-arch defect class)."

# cloud-ci-port-placement (ADR-0570): self-contained, policy-driven meta-gate. A pure
# collect_port_traits(root, policy) enumerates workspace members in forbidden layer dirs and scans
# their src for `pub trait` definitions; evaluate_keyed applies the port-name suffix heuristic and
# subtracts the frozen baseline (born-advisory + enforce-no-regression). R0 pack-shaped: all
# repo-specifics live in port-placement-policy.json + port-placement-baseline.json.

[lib]
name = "ci_port_placement"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
oya-workspace-members-kernel = { path = "../../../libs/oya-workspace-members-kernel" }

[lints]
workspace = true
