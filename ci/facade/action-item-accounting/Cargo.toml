[package]
name = "ci-action-item-accounting"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI FixupTask v2 durable registry-admission gate plus removable transitional predecessor-ledger adapter."

# ADR-0621: the durable module binds candidate registry bytes to protected SCM facts and has no
# predecessor-corpus dependency. The removable legacy adapter retains ADR-0544 accounting only
# until qualified-human migration population and cutover are independently authorized.

[lib]
name = "ci_action_item_accounting"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
