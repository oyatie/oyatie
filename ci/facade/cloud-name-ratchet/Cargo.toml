[package]
name = "ci-cloud-name-ratchet"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-name-ratchet"
kind = "ci-gate"
layer = "facade"
purpose = "Shrink-only ratchet over the deprecated `cloud-` NAME prefix (directories, Cargo package names, Helm chart names). Owns its own frozen baseline as committed JSON — deliberately NOT a new code in the controller-owned firewall face, so introducing it needs no founder-signed baseline admission. Name-anchored rather than a prose stem: a bare `cloud` substring occurs in 4,418 files, most of it legitimate (`cloud-native`, `cloud-provider`), which would be an un-shrinkable baseline rather than a ratchet."

[lib]
name = "ci_cloud_name_ratchet"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-ci-cloud-name-baseline"
path = "src/bin/oya-ci-cloud-name-baseline.rs"

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# The rename-relabel kernel, shared with the firewall ratchet rather than reimplemented:
# two copies of "did this key move or is it new debt?" would drift apart silently.
ci-baseline-ratchet = { path = "../baseline-ratchet" }

[lints]
workspace = true
