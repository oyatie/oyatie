[package]
name = "ci-repo-root-hygiene"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-root-workspace-hygiene (ADR-0600). A pure, UNIVERSAL, HERMETIC allowlist gate that
# makes committed repo-root scratch structurally impossible. The legitimate root surface lives in
# DATA (root-workspace-hygiene-policy.json): every TRACKED file at the repo ROOT must match an
# allowlist rule, and every tracked top-level directory must be a permitted capability/meta home.
# Complements the existing cloud-ci-total-accounting `scratch_artifact` DENYLIST (known scratch
# shapes) with default-DENY coverage of ANY unrecognized root file. NET-NEW predicate: no pure
# crate owned an allowlist-posture root-hygiene check. Emits one Finding per offending path with a
# concrete relocate/`git rm` auto-fix remediation.

[lib]
name = "ci_repo_root_hygiene"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-ports = { path = "../../ports/path-resolver" }
ci-scm-facts-snapshot = { path = "../scm-facts-snapshot" }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
