[package]
name = "ci-corpus-index-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Corpus index coverage ratchet (ADR-0541 Corpus Liveness Graph). Turns "everything in the code
# graph and the build graph" into a measured, shrink-only invariant: a buck2 package that owns YAML
# is INDEXED iff it declares a corpus-yaml-facts extraction target. Born-advisory over today's
# debt, blocking on a NEW uncovered package. The kernel is pure; the live walk is in tests/.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "ci_corpus_index_coverage"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
