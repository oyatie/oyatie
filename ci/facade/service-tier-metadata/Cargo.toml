[package]
name = "ci-service-tier-metadata"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# cloud-ci-tier-field-coverage (Phase-0 capability-first reorg; ADR-0562/0536/0245). The
# born-blocking per-service tier-metadata coverage gate. Asserts that EVERY service manifest.json
# under the governed service roots (cloud/ + oya/) carries the mandatory dependency-class triple —
# `tier` (∈ tier_enum), `tier_subtype` (∈ tier_subtype_enum), `dr_tier` (∈ {T0..T3}) — that
# substrates additionally carry `substrate_dag_position`, that `tier` is NOT type-overloaded with a
# DR/reliability class or a deployment-mode value, and that `tier`/`dr_tier` stay DISTINCT fields.
# Born pack-shaped: the enums + governed roots are DATA in tier-field-coverage-policy.json sourced
# verbatim from specs/platform-architecture.json microservice_taxonomy; the Rust kernel hardcodes no
# enum value. ADR-0083 Tier-3: production code carries no unwrap/expect/panic.

[lib]
name = "ci_service_tier_metadata"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
