[package]
name = "ci-canonical-json"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI determinism gate enforcing that every tracked *.json under governed roots equals its canonical re-serialization (stable key order, fixed indent, explicit ensure_ascii); ships a one-command fixer."

# cloud-ci-canonical-json (ADR-0546): pure canonical-form policy over the governed JSON corpus. The
# crate owns the read-only filesystem walk; the pure canonicalizer (a self-contained lexer -> CST ->
# formatter, NOT serde_json::to_string_pretty) and the pure evaluator reject non-canonical bytes.
# Born pack-shaped: governed roots, canonical-form params, and exclusions live in
# canonical-json-policy.json. Converts FRIC-1781130000 (escaped<->literal serialization churn).

[lib]
name = "ci_canonical_json"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-cloud-ci-canonical-json"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
