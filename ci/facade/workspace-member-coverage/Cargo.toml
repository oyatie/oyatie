[package]
name = "ci-workspace-member-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "cloud-ci"
kind = "shared"
layer = "app"
purpose = "Cloud CI gate evaluating globbed root workspace member coverage from the accounting-registry producer face."

# cloud-ci-workspace-glob-coverage (ADR-0538): pure policy over producer-emitted workspace
# manifest rows. The producer owns filesystem/TOML I/O; this gate only rejects non-glob
# workspace member entries and first-party crate dirs that no workspace glob covers.

[lib]
name = "ci_workspace_member_coverage"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }

[lints]
workspace = true
