[package]
name = "ci-stale-artifact-detection"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GATE-3 cloud-ci-staleness-reaper (PHASE-0-FIREWALL-PLAN §5.2; pillar-G sinker++).
# Pure evaluator over the registry rows + ttl-policy budgets; REPORTS (never reaps)
# over-budget AND unreachable artifacts as ARCHIVE candidates. Auto-archive is
# report -> git mv -> _archive/, never rm. The integration test globs
# specs/fixtures/staleness-reaper/tc-*.json and asserts report.violations against each
# fixture's expected_violations. The born-blocking self-test ages the live registry via
# git commit dates. G-INTEGRITY track: no buck2 build-graph dep.

[lib]
name = "ci_stale_artifact_detection"
path = "src/lib.rs"
doctest = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
ci-path-resolver-adapters = { path = "../../adapters/path-resolver" }
serde_json = { workspace = true }

[lints]
workspace = true
