[package]
name = "ci-dep-freshness"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
bounded_context = "dep-freshness"
kind = "ci-gate"
layer = "facade"
purpose = "Hermetic ADVISORY gate over the committed dependency-freshness mirror (oyatie-gr1n). Reports crates whose newest stable release predates the oya-deps.toml [freshness] window. Reads only committed data — the mirror, its manifest and the policy — with no network and no clock: the as-of date is the mirror's own snapshot_date, so the gate is deterministic and buck2-cacheable. Advisory by contract, because staleness is TIME-driven and a blocking form would red the required context on unrelated PRs."

[lib]
name = "ci_dep_freshness"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-ci-dep-freshness-report"
path = "src/main.rs"

[dependencies]
oya-dep-freshness-kernel = { path = "../../../libs/oya-dep-freshness-kernel" }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
