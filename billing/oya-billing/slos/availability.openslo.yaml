apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-billing-availability
  displayName: "oya-billing: service availability 99.95%"
  labels:
    microservice: oya-billing
    bounded_context: billing-substrate
    sli_class: availability
    owner_team: council-billing
    severity: critical
spec:
  service: oya-billing
  description: |
    End-to-end availability of the oya-billing HTTP surface (subscription,
    plan, and invoice endpoints). Target 99.95% over 30 days (≤ 21.9 min/mo
    unplanned downtime) per ADR-0478 tenant-service SLO floor.

    non_claim: Prometheus metric names are placeholders pending D3 implementation.
  indicator:
    metadata: { name: oya-billing-availability }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_billing_http_requests_total{http_status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_billing_http_requests_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "99.95% availability over 30d (≤ 21.9 min/mo)"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: oya-canonical-burn-rate-multi-window }]
