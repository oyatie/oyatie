{
  "openapi": "3.2.0",
  "info": {
    "title": "Accounting Journal API",
    "version": "0.1.0",
    "summary": "Accounting journal, payroll posting, and KR VAT workflow contracts.",
    "description": "Preview contract surface aligned to transport-neutral Rust DTO crates. This artifact defines wire shape for later runtime adapters; it does not claim a deployed endpoint.",
    "x-oyatie-contract-status": "preview-not-deployed",
    "x-oyatie-non-claims": [
      "no deployed HTTP runtime",
      "no authentication enforcement runtime",
      "no storage adapter",
      "no Workflow dispatch execution",
      "no statutory filing transport",
      "no cloud service integration claim"
    ],
    "x-source-standard": "OpenAPI Specification 3.2.0, official spec.openapis.org rendering checked 2026-05-23"
  },
  "servers": [
    {
      "url": "https://api.oyatie.example/accounting/v1",
      "description": "Preview tenant-scoped URL shape for future adapters; not deployed by this changeset."
    }
  ],
  "paths": {
    "/accounting/v1/journals": {
      "post": {
        "operationId": "postAccountingJournal",
        "summary": "Create a journal-post command envelope.",
        "x-oyatie-app-function": "accounting_journal_app::post_journal_with_audit",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/JournalPostRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Accepted for future runtime execution.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountingAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/accounting/v1/payroll-postings": {
      "post": {
        "operationId": "recordAccountingPayrollPosting",
        "summary": "Record payroll posting evidence metadata.",
        "x-oyatie-app-function": "accounting_journal_app::record_payroll_posting",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PayrollPostingRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Accepted for future runtime execution.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountingAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/accounting/v1/vat-workflow-plans": {
      "post": {
        "operationId": "planAccountingVatWorkflow",
        "summary": "Plan KR VAT Workflow dispatch metadata.",
        "x-oyatie-app-function": "accounting_journal_app::plan_vat_workflow",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VatDeadlineRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "VAT workflow plan.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VatWorkflowPlanResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "tenantBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "ApiErrorEnvelope": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "VALIDATION_ERROR",
                  "DOMAIN_ERROR",
                  "AUTH_REQUIRED",
                  "FORBIDDEN"
                ]
              },
              "message": {
                "type": "string"
              },
              "details": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          }
        }
      },
      "AccountingAccepted": {
        "type": "object",
        "required": [
          "accepted",
          "auditTopic",
          "idempotencyKey",
          "schemaVersion"
        ],
        "properties": {
          "accepted": {
            "type": "boolean"
          },
          "auditTopic": {
            "type": "string"
          },
          "idempotencyKey": {
            "type": "string"
          },
          "schemaVersion": {
            "type": "integer",
            "minimum": 1
          },
          "service": {
            "type": "string",
            "const": "accounting"
          }
        }
      },
      "JournalPostRequest": {
        "type": "object",
        "required": [
          "journalId",
          "tenantId",
          "legalEntityId",
          "period",
          "periodState",
          "sourceDocuments",
          "approvalEvidenceRef",
          "lines"
        ],
        "properties": {
          "journalId": {
            "type": "string",
            "pattern": "^jrn_[A-Za-z0-9_-]+$"
          },
          "tenantId": {
            "type": "string",
            "pattern": "^ten_[A-Za-z0-9_-]+$"
          },
          "legalEntityId": {
            "type": "string",
            "pattern": "^le_[A-Za-z0-9_-]+$"
          },
          "period": {
            "type": "string",
            "pattern": "^[0-9]{4}-[0-9]{2}$"
          },
          "periodState": {
            "type": "string",
            "enum": [
              "OPEN",
              "SOFT_CLOSED",
              "CLOSED"
            ]
          },
          "sourceDocuments": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string",
              "pattern": "^src/.+"
            }
          },
          "approvalEvidenceRef": {
            "type": "string",
            "pattern": "^audit/.+"
          },
          "lines": {
            "type": "array",
            "minItems": 2,
            "items": {
              "$ref": "#/components/schemas/JournalLineRequest"
            }
          }
        }
      },
      "PayrollPostingRequest": {
        "type": "object",
        "required": [
          "journalId",
          "tenantId",
          "legalEntityId",
          "period",
          "sourcePayrollDigest",
          "wageLedgerRefs",
          "approvalEvidenceRef",
          "reversalPathRef",
          "lines"
        ],
        "properties": {
          "journalId": {
            "type": "string",
            "pattern": "^jrn_[A-Za-z0-9_-]+$"
          },
          "tenantId": {
            "type": "string",
            "pattern": "^ten_[A-Za-z0-9_-]+$"
          },
          "legalEntityId": {
            "type": "string",
            "pattern": "^le_[A-Za-z0-9_-]+$"
          },
          "period": {
            "type": "string",
            "pattern": "^[0-9]{4}-[0-9]{2}$"
          },
          "sourcePayrollDigest": {
            "type": "string",
            "pattern": "^sha256:[A-Fa-f0-9]{64}$",
            "x-data-class": "FINANCIAL"
          },
          "wageLedgerRefs": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string",
              "pattern": "^audit/.+"
            }
          },
          "approvalEvidenceRef": {
            "type": "string",
            "pattern": "^audit/.+"
          },
          "reversalPathRef": {
            "type": "string",
            "pattern": "^audit/.+"
          },
          "lines": {
            "type": "array",
            "minItems": 2,
            "items": {
              "$ref": "#/components/schemas/JournalLineRequest"
            }
          }
        }
      },
      "VatDeadlineRequest": {
        "type": "object",
        "required": [
          "returnId",
          "tenantId",
          "legalEntityId",
          "jurisdiction",
          "period",
          "deadlineEpochSeconds",
          "nowEpochSeconds",
          "workflowRef",
          "hometaxExportHash",
          "evidenceRef"
        ],
        "properties": {
          "returnId": {
            "type": "string",
            "pattern": "^vat_[A-Za-z0-9_-]+$"
          },
          "tenantId": {
            "type": "string",
            "pattern": "^ten_[A-Za-z0-9_-]+$"
          },
          "legalEntityId": {
            "type": "string",
            "pattern": "^le_[A-Za-z0-9_-]+$"
          },
          "jurisdiction": {
            "type": "string",
            "enum": [
              "KOREA",
              "UNITED_STATES",
              "EUROPEAN_UNION"
            ]
          },
          "period": {
            "type": "string",
            "pattern": "^[0-9]{4}-[0-9]{2}$"
          },
          "deadlineEpochSeconds": {
            "type": "integer",
            "minimum": 1
          },
          "nowEpochSeconds": {
            "type": "integer",
            "minimum": 1
          },
          "workflowRef": {
            "type": "string",
            "pattern": "^workflow/.+"
          },
          "hometaxExportHash": {
            "type": "string",
            "pattern": "^sha256:[A-Fa-f0-9]{64}$",
            "x-data-class": "FINANCIAL"
          },
          "evidenceRef": {
            "type": "string",
            "pattern": "^audit/.+"
          }
        }
      },
      "JournalLineRequest": {
        "type": "object",
        "required": [
          "accountCode",
          "debitMinor",
          "creditMinor"
        ],
        "properties": {
          "accountCode": {
            "type": "string"
          },
          "debitMinor": {
            "type": "integer",
            "minimum": 0,
            "x-data-class": "FINANCIAL"
          },
          "creditMinor": {
            "type": "integer",
            "minimum": 0,
            "x-data-class": "FINANCIAL"
          }
        }
      },
      "VatWorkflowPlanResponse": {
        "type": "object",
        "required": [
          "opened",
          "schemaVersion"
        ],
        "properties": {
          "opened": {
            "type": "boolean"
          },
          "workflowRef": {
            "type": [
              "string",
              "null"
            ]
          },
          "requiredSteps": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "schemaVersion": {
            "type": "integer",
            "minimum": 1
          }
        }
      }
    },
    "responses": {
      "ValidationError": {
        "description": "Consistent validation error envelope.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ApiErrorEnvelope"
            }
          }
        }
      }
    }
  },
  "security": [
    {
      "tenantBearer": []
    }
  ],
  "x-oyatie-data-boundary": {
    "tenantScoped": true,
    "auditEvidenceRequired": true,
    "runtimeEmission": "future-adapter-slice"
  }
}
