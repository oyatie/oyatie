# EU pack overlay — GDPR + EU residency.
# Authority: ADR-0199 + EU regulatory pack + ADR-0008 data-use-boundary.
costAttribution:
  regulatoryPack: eu

image:
  registry: eu-registry.oya.internal

env:
  OYATIE_FINOPS_PORTAL_REGION: eu-central-1
  OYATIE_FINOPS_PORTAL_LOCALE_DEFAULT: en-EU
  OYATIE_FINOPS_PORTAL_CURRENCY_DEFAULT: eur

features:
  gdprArticle30: true

nodeSelector:
  topology.kubernetes.io/region: eu-central-1

# EU residency: deny egress to non-EU endpoints; tightened allow-list.
networkPolicy:
  egressAllowList:
    - audit-chain-eu
    - tenancy-eu
    - opencost-eu
    - mimir-query-eu
