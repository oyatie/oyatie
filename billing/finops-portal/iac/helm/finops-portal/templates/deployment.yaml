apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oya.fullname" . }}
  labels:
    {{- include "oya.labels" . | nindent 4 }}
    {{- include "oya.tenantCostLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "oya.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oya.selectorLabels" . | nindent 8 }}
        {{- include "oya.tenantCostLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "oya.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: finops-portal
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            - containerPort: {{ .Values.service.metricsPort }}
              name: metrics
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: OYATIE_FINOPS_PORTAL_COST_CENTER
              value: {{ .Values.costAttribution.costCenter | quote }}
            - name: OYATIE_FINOPS_PORTAL_WORKLOAD_CLASS
              value: {{ .Values.costAttribution.workloadClass | quote }}
            - name: OYATIE_FINOPS_PORTAL_REGULATORY_PACK
              value: {{ .Values.costAttribution.regulatoryPack | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
