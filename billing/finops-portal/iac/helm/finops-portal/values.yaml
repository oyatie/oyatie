# Canonical default values for finops-portal.
# Authority: ADR-0064 canonical helm-helpers + ADR-0199 cost-attribution.
# Per-pack overlays at values-kr.yaml, values-eu.yaml, values-us-healthcare.yaml.

microservice: finops-portal
boundedContext: tenant-billing-presentation

image:
  registry: ghcr.io
  repository: oyatie/finops-portal
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Cost-attribution labels — consumed by oya.tenantCostLabels helper.
# Per ADR-0199 D-2: every workload manifest MUST carry the canonical
# cost-attribution label triple.
costAttribution:
  costCenter: infra-finops-portal
  workloadClass: app
  regulatoryPack: generic

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

# SLO bindings (referenced by alertmanager / SLO promotion gate).
slo:
  tenantInvoiceRenderLatencyTarget: 0.95   # p95 ≤ 2s
  focusExportAvailabilityTarget: 0.999
  regulatorEmitAvailabilityTarget: 1.0
  drilldownQueryLatencyP99Target: 0.99
  anomalyExplanationLatencyP95Target: 0.95

# Env hints for the app crate (IP-006).
env:
  RUST_LOG: info
  OTEL_TRACES_EXPORTER: otlp
  OYATIE_FINOPS_PORTAL_LISTEN: "0.0.0.0:8080"

# Probes
livenessProbe:
  path: /live
  port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  path: /ready
  port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# Network policy
networkPolicy:
  enabled: true
  egressAllowList:
    - audit-chain
    - tenancy
    - opencost
    - mimir-query

# HPA
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

# Per-pack toggles
features:
  phiRedaction: false   # set true on us-healthcare overlay
  pipaEmitTags: false   # set true on kr overlay
  gdprArticle30: false  # set true on eu overlay
