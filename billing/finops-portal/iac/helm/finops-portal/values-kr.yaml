# KR pack overlay — PIPA compliance toggles + KR region pin.
# Authority: ADR-0199 + KR regulatory pack.
costAttribution:
  regulatoryPack: kr

image:
  registry: kr-registry.oya.internal

env:
  OYA_FINOPS_PORTAL_REGION: kr-1
  OYA_FINOPS_PORTAL_LOCALE_DEFAULT: ko-KR
  OYA_FINOPS_PORTAL_CURRENCY_DEFAULT: krw

features:
  pipaEmitTags: true

# KR residency: pin nodeAffinity to kr-* zones.
nodeSelector:
  topology.kubernetes.io/region: kr-1

slo:
  # KR pack tightens render-latency for the local browser experience.
  tenantInvoiceRenderLatencyTarget: 0.97
