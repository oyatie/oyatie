# US-healthcare pack overlay — HIPAA + PHI redaction.
# Authority: ADR-0199 + US-healthcare regulatory pack + ADR-0162.
costAttribution:
  regulatoryPack: us-healthcare

image:
  registry: us-hc-registry.oya.internal

env:
  OYATIE_FINOPS_PORTAL_REGION: us-east-1
  OYATIE_FINOPS_PORTAL_LOCALE_DEFAULT: en-US
  OYATIE_FINOPS_PORTAL_CURRENCY_DEFAULT: usd
  OYATIE_FINOPS_PORTAL_PHI_REDACTION: "true"

features:
  phiRedaction: true

nodeSelector:
  topology.kubernetes.io/region: us-east-1

# HIPAA: encrypted at rest + in transit; pin to compliant storage class.
storageClass: encrypted-hipaa

# Tightened replica count for stricter availability.
replicaCount: 4

slo:
  # US-healthcare tightens render-latency for clinical-grade UX.
  tenantInvoiceRenderLatencyTarget: 0.99
  regulatorEmitAvailabilityTarget: 1.0
