apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finops-portal-default-deny
  namespace: finops-portal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finops-portal-allow-substrate
  namespace: finops-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finops-portal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oyatie.io/substrate-tier: "true"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: UDP, port: 443 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: audit-chain } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cloud-secrets } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tenancy } }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: UDP, port: 443 }
