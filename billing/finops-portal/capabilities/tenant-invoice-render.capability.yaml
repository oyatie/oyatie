# Capability declaration — tenant-invoice-render
# Authored 2026-05-18.
# Authority: ADR-0083 capability declaration discipline + EU AI Act
# Article 6 risk classification.
schema_version: "1.0"
capability:
  id: tenant-invoice-render
  microservice: finops-portal
  bounded_context: tenant-billing-presentation
  description: |
    Renders a tenant's monthly invoice as HTML or PDF. Pure
    presentation; no automated decisioning.
  surface:
    public_api: true
    internal_api: true
  inputs:
    - tenant_id
    - period
    - locale
  outputs:
    - rendered_html
    - rendered_pdf_bytes
  risk_class:
    risk_class: limited
    rationale: |
      The capability assembles human-prepared cost data into a
      presentation artifact (HTML / PDF). It does not perform
      automated decision-making affecting tenant rights or
      financial obligations. The invoice values themselves
      originate from OpenCost + ADR-0174 chargeback formula
      (deterministic algorithm with audit-chain seal); the
      rendering is a thin presentation layer.

      Per EU AI Act Article 6 + Annex III, "limited risk"
      applies because the system does not autonomously affect
      access to services or financial obligations beyond what
      the human-authored cost-allocation policy already
      specifies.
    human_in_loop: true
    transparency_requirement: |
      Each invoice carries a footer linking to the
      cost-allocation policies that produced it (per IP-009).
      A separate "How was this computed?" link drives to the
      drill-down dashboard so the tenant can trace each line.
    contestability: |
      Tenants can open a dispute via customer-success; resolved
      via credit-ledger append (IP-013) which is auditable.
  pii_classification:
    - tenant_name (low — already known)
    - cost_center_breakdown (low — internal classification)
    - dollar_amounts (medium — business-confidential)
  rate_limit:
    per_tenant_per_minute: 60
    per_tenant_per_hour: 1000
  slo_bindings:
    - slos/tenant-invoice-render-latency.openslo.yaml
    - slos/tenant-invoice-pdf-render-availability.openslo.yaml
  audit_chain_events:
    - TenantInvoiceFinalized
    - TenantInvoiceRendered
  retired: false
