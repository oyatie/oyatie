# OpenSLO v1alpha — tenant invoice PDF render availability
# Per ADR-0130 self-SLO promotion.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-tenant-invoice-pdf-render-availability
  displayName: "finops-portal — tenant invoice PDF render availability"
  labels:
    microservice: finops-portal
    bounded_context: tenant-billing-presentation
    plane: data
    sli_kind: availability
spec:
  description: |
    The /v1/tenants/{id}/invoices/{period}.pdf endpoint MUST succeed
    for at least 99.5 % of requests over a 28d rolling window.
    The 0.5 % error budget covers PDF-renderer transient failures
    + downstream upstream (postgres / mimir) blips.
  service: finops-portal
  indicator:
    metadata:
      name: tenant-invoice-pdf-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_invoice_pdf_total{outcome="success"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_invoice_pdf_total[5m]
                ))
  objectives:
    - displayName: "99.5 % success (28d window)"
      target: 0.995
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-invoice-pdf-burn-rate
