# OpenSLO v1alpha — FOCUS 1.3 export availability
# Per ADR-0130 + ADR-0199 D-4.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-focus-export-availability
  displayName: "finops-portal — FOCUS 1.3 export availability"
  labels:
    microservice: finops-portal
    bounded_context: focus-export
    plane: data
    sli_kind: availability
spec:
  description: |
    The FOCUS export pipeline (translate + Parquet write + signed-URL
    issue) MUST succeed for at least 99.9 % of requests over a 28d
    rolling window. Failures on this surface block tenants from
    feeding their own finance pipelines.
  service: finops-portal
  indicator:
    metadata:
      name: focus-export-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_focus_export_total{outcome="success"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_focus_export_total[5m]
                ))
  objectives:
    - displayName: "99.9 % success (28d window)"
      target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-focus-export-burn-rate
