apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-cap-breach-detection-latency
  displayName: Cloud-billing demo_trial cap-breach detection latency
  labels:
    microservice: cloud-billing
    bounded_context: cap-breach-monitor
    keystone_adr: ADR-0330
    tenant_class: demo_trial
spec:
  description: |
    Time from actual cap breach (100% threshold reached) to cap-breach event
    emission + principal.cap_breached claim flip. Target p99 ≤ 5 minutes
    (matches the cap-breach-monitor polling cadence).

    AWS Free Tier Alerts equivalent. Lower-latency detection requires push-based
    metering from the contributing µservice; current default is poll-based.
  service: cloud-billing
  indicator:
    metadata:
      name: cap-breach-detection-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_cap_breach_detection_seconds_bucket{le="300"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_cap_breach_detection_seconds_count[5m]))
  objectives:
    - displayName: Detect cap breach within 5 minutes
      target: 0.99
    - displayName: Token refresh after breach within 30 seconds
      target: 0.999
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-cap-breach-monitor-pager
