apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-usage-aggregation-time
  displayName: Cloud-billing usage aggregation time
  labels:
    microservice: cloud-billing
    bounded_context: meter-aggregator
    keystone_adr: ADR-0330
spec:
  description: |
    Time from usage event ingest to availability in the meter-aggregate hourly
    bucket. Target p99 ≤ 60 seconds end-to-end so finops-portal shows
    near-real-time usage to tenants.
  service: cloud-billing
  indicator:
    metadata:
      name: usage-aggregation-time
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_meter_aggregate_lag_seconds_bucket{le="60"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_meter_aggregate_lag_seconds_count[5m]))
  objectives:
    - displayName: Aggregation within 60s
      target: 0.99
    - displayName: Aggregation within 30s
      target: 0.95
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-meter-aggregator-lag-pager
