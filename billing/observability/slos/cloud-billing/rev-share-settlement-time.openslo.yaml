apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-rev-share-settlement-time
  displayName: Cloud-billing revenue-share monthly settlement time
  labels:
    microservice: cloud-billing
    bounded_context: settlement-engine
    keystone_adr: ADR-0330
    billing_component: revenue_share
spec:
  description: |
    Time from settlement-window-end to settlement-statement-computed per
    tenant. Target p99 ≤ 6 hours per cell. Includes FX lock fetch, clawback
    netting, tax-withholding computation via cloud-billing-tax, and PDF
    generation via document-generation.
  service: cloud-billing
  indicator:
    metadata:
      name: rev-share-settlement-time
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_settlement_computation_seconds_bucket{le="21600"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_settlement_computation_seconds_count[5m]))
  objectives:
    - displayName: Settlement statement computed within 6 hours
      target: 0.99
    - displayName: Settlement statement computed within 3 hours
      target: 0.90
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-settlement-engine-pager
    - cloud-billing-settlement-engine-clawback-storm
