// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// cloud-billing gRPC contract (proto3)
//
// Per ADR-0145 inter-µservice communication reform: direct gRPC + 3 invariants.
// Internal sibling-service gRPC uses HTTP/2 with mTLS/TLS 1.3; public clients use REST/OpenAPI.
// Per ADR-0243 every state-mutation method is Cedar-gated.
// Per ADR-0263 every state-mutation produces an audit-chain seal hash returned in response.
// Per ADR-0330 tenant_class is the keystone enum; billing_components is the composable subset.

syntax = "proto3";

package oya.cloud_billing.v1;

option go_package = ""; // Go not authorized per Rust-strict directive; left blank.
option java_package = ""; // Java not authorized; left blank.

// ============================================================================
// Enums
// ============================================================================

enum TenantClass {
  TENANT_CLASS_UNSPECIFIED = 0;
  TENANT_CLASS_DEMO_TRIAL = 1;
  TENANT_CLASS_PAID = 2;
}

enum BillingComponent {
  BILLING_COMPONENT_UNSPECIFIED = 0;
  BILLING_COMPONENT_REVENUE_SHARE = 1;
  BILLING_COMPONENT_PER_SEAT = 2;
  BILLING_COMPONENT_PER_USAGE = 3;
}

enum DeploymentContext {
  DEPLOYMENT_CONTEXT_UNSPECIFIED = 0;
  DEPLOYMENT_CONTEXT_OYATIE_PUBLIC_CLOUD = 1;
  DEPLOYMENT_CONTEXT_GUEST_ON_AWS = 2;
  DEPLOYMENT_CONTEXT_GUEST_ON_OCI = 3;
  DEPLOYMENT_CONTEXT_ON_PREM = 4;
  DEPLOYMENT_CONTEXT_COLO = 5;
  DEPLOYMENT_CONTEXT_OYATIE_AS_CLOUD_PROVIDER = 6;
}

enum CloudBillingEventKind {
  CLOUD_BILLING_EVENT_KIND_UNSPECIFIED = 0;
  CLOUD_BILLING_EVENT_KIND_RESOURCE_CREATED = 1;
  CLOUD_BILLING_EVENT_KIND_RESOURCE_TERMINATED = 2;
  CLOUD_BILLING_EVENT_KIND_USAGE = 3;
  CLOUD_BILLING_EVENT_KIND_RESERVATION = 4;
  CLOUD_BILLING_EVENT_KIND_COMMITMENT = 5;
  CLOUD_BILLING_EVENT_KIND_CREDIT = 6;
  CLOUD_BILLING_EVENT_KIND_REVENUE_SHARE = 7;
  CLOUD_BILLING_EVENT_KIND_REVENUE_SHARE_REVERSAL = 8;
  CLOUD_BILLING_EVENT_KIND_SEAT_COUNT = 9;
  CLOUD_BILLING_EVENT_KIND_SUBSCRIPTION = 10;
}

enum InvoiceState {
  INVOICE_STATE_UNSPECIFIED = 0;
  INVOICE_STATE_ISSUED = 1;
  INVOICE_STATE_PAID = 2;
  INVOICE_STATE_OVERDUE = 3;
  INVOICE_STATE_VOID = 4;
}

enum SettlementDirection {
  SETTLEMENT_DIRECTION_UNSPECIFIED = 0;
  SETTLEMENT_DIRECTION_OYATIE_PAYS = 1;
  SETTLEMENT_DIRECTION_OYATIE_COLLECTS = 2;
}

enum SettlementState {
  SETTLEMENT_STATE_UNSPECIFIED = 0;
  SETTLEMENT_STATE_COMPUTED = 1;
  SETTLEMENT_STATE_PAYOUT_INITIATED = 2;
  SETTLEMENT_STATE_SETTLED = 3;
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_CREATED = 1;
  SUBSCRIPTION_STATE_ACTIVE = 2;
  SUBSCRIPTION_STATE_PAST_DUE = 3;
  SUBSCRIPTION_STATE_PAUSED = 4;
  SUBSCRIPTION_STATE_CANCELED = 5;
}

enum TaxInvoiceFormat {
  TAX_INVOICE_FORMAT_UNSPECIFIED = 0;
  TAX_INVOICE_FORMAT_ELECTRONIC_TAX_INVOICE = 1;
  TAX_INVOICE_FORMAT_QUALIFIED_TAX_INVOICE = 2;
  TAX_INVOICE_FORMAT_COUNTRY_E_INVOICE = 3;
  TAX_INVOICE_FORMAT_GST_TAX_INVOICE = 4;
  TAX_INVOICE_FORMAT_FISCAL_DOCUMENT_INVOICE = 5;
  TAX_INVOICE_FORMAT_CLEARANCE_QR_INVOICE = 6;
  TAX_INVOICE_FORMAT_VAT_REGISTRATION_INVOICE = 7;
}

// ============================================================================
// Common message types
// ============================================================================

message Money {
  string currency = 1;            // 3-letter ASCII uppercase (ISO 4217 + 'OYC')
  int64 minor_units = 2;
}

message BillingPeriod {
  int64 start_epoch_seconds = 1;
  int64 end_epoch_seconds = 2;
}

message MeterUnit {
  string kind = 1;
  int64 quantity = 2;
}

message AuditChainHeader {
  bytes audit_chain_hash = 1;
  string event_class = 2;          // lowercase dotted snake-case per ADR-0263
  int64 sealed_at_epoch_seconds = 3;
}

// ============================================================================
// Tenant-class API
// ============================================================================

message GetTenantClassRequest {
  string tenant_id = 1;
}

message GetTenantClassResponse {
  string tenant_id = 1;
  TenantClass tenant_class = 2;
  repeated BillingComponent billing_components = 3;
  bool cap_breached = 4;
  int64 trial_expires_at_epoch_seconds = 5;
  int64 grace_window_expires_at_epoch_seconds = 6;
  DeploymentContext deployment_context = 7;
  repeated string compliance_packs = 8;
  int64 tenant_class_changed_at_epoch_seconds = 9;
}

message ConvertTenantToPaidRequest {
  string tenant_id = 1;
  string contract_id = 2;
  repeated BillingComponent billing_components = 3;
  bool retain_trial_usage = 4;
  DeploymentContext deployment_context = 5;
}

message ConvertTenantToPaidResponse {
  string tenant_id = 1;
  TenantClass new_tenant_class = 2;
  repeated BillingComponent billing_components = 3;
  AuditChainHeader audit = 4;
}

message MutateBillingComponentsRequest {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_ADD = 1;
    OP_REMOVE = 2;
  }
  string tenant_id = 1;
  Op op = 2;
  BillingComponent component = 3;
  string contract_amendment_id = 4;
}

message MutateBillingComponentsResponse {
  string tenant_id = 1;
  repeated BillingComponent billing_components = 2;
  repeated string settlement_event_ids = 3;
  AuditChainHeader audit = 4;
}

// ============================================================================
// Billing account API
// ============================================================================

message BillingAccount {
  string id = 1;
  string tenant_id = 2;
  TenantClass tenant_class = 3;
  repeated BillingComponent billing_components = 4;
  string region = 5;
  string regional_pack = 6;
  string payment_method = 7;
  Money credit_balance = 8;
  string state = 9;
  int64 created_at_epoch_seconds = 10;
  uint32 schema_version = 11;
}

message CreateBillingAccountRequest {
  string id = 1;
  string tenant_id = 2;
  string region = 3;
  string regional_pack = 4;
  string payment_method = 5;
  Money credit_balance = 6;
  string state = 7;
  int64 created_at_epoch_seconds = 8;
}

message CreateBillingAccountResponse {
  BillingAccount account = 1;
  AuditChainHeader audit = 2;
}

message GetBillingAccountRequest {
  string billing_account_id = 1;
}

message GetBillingAccountResponse {
  BillingAccount account = 1;
}

// ============================================================================
// Usage event API
// ============================================================================

message CloudBillingEventCreate {
  string id = 1;
  string tenant_id = 2;
  string resource_id = 3;
  string region = 4;
  string metering_tag = 5;
  CloudBillingEventKind kind = 6;
  repeated MeterUnit units = 7;
  string rate_card_ref = 8;
  int64 occurred_at_epoch_seconds = 9;
  string idempotency_key = 10;
}

message EmitUsageEventRequest {
  CloudBillingEventCreate event = 1;
}

message EmitUsageEventResponse {
  string event_id = 1;
  bool idempotent_replay = 2;
  AuditChainHeader audit = 3;
}

message GetUsageEventRequest {
  string event_id = 1;
}

message GetUsageEventResponse {
  string event_id = 1;
  string tenant_id = 2;
  TenantClass tenant_class = 3;
  string resource_id = 4;
  string region = 5;
  string metering_tag = 6;
  CloudBillingEventKind kind = 7;
  repeated MeterUnit units = 8;
  string rate_card_ref = 9;
  int64 occurred_at_epoch_seconds = 10;
  string idempotency_key = 11;
  AuditChainHeader audit = 12;
}

// ============================================================================
// Invoice API
// ============================================================================

message InvoiceLineItemCreate {
  string id = 1;
  string resource_id = 2;
  string description = 3;
  BillingComponent billing_component = 4;
  repeated MeterUnit units = 5;
  Money subtotal = 6;
}

message InvoiceLineItem {
  string id = 1;
  string resource_id = 2;
  string description = 3;
  BillingComponent billing_component = 4;
  repeated MeterUnit units = 5;
  Money subtotal = 6;
}

message IssueInvoiceRequest {
  string id = 1;
  string billing_account_id = 2;
  string tenant_id = 3;
  string regional_pack = 4;
  BillingPeriod period = 5;
  repeated InvoiceLineItemCreate line_items = 6;
  Money subtotal = 7;
  Money tax = 8;
  Money total = 9;
  TaxInvoiceFormat tax_invoice_format = 10;
  string tax_registration_id = 11;
  int64 issued_at_epoch_seconds = 12;
  int64 due_at_epoch_seconds = 13;
}

message Invoice {
  string invoice_id = 1;
  string billing_account_id = 2;
  string tenant_id = 3;
  string regional_pack = 4;
  BillingPeriod period = 5;
  repeated InvoiceLineItem line_items = 6;
  Money subtotal = 7;
  Money tax = 8;
  Money total = 9;
  TaxInvoiceFormat tax_invoice_format = 10;
  string tax_registration_id = 11;
  InvoiceState state = 12;
  int64 issued_at_epoch_seconds = 13;
  int64 due_at_epoch_seconds = 14;
  string pdf_object_ref = 15;
  bytes signature = 16;
  AuditChainHeader audit = 17;
}

message IssueInvoiceResponse {
  Invoice invoice = 1;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message VoidInvoiceRequest {
  string invoice_id = 1;
  string reason = 2;
}

message VoidInvoiceResponse {
  Invoice invoice = 1;
  AuditChainHeader audit = 2;
}

// ============================================================================
// Credit memo API
// ============================================================================

message IssueCreditMemoRequest {
  string tenant_id = 1;
  Money amount = 2;
  string reason = 3;
  string original_invoice_id = 4;
}

message IssueCreditMemoResponse {
  string credit_memo_id = 1;
  AuditChainHeader audit = 2;
}

// ============================================================================
// Reservation API
// ============================================================================

message PurchaseReservationRequest {
  string tenant_id = 1;
  string workload_kind = 2;
  string region = 3;
  int64 commitment_units = 4;
  int64 commitment_period_start_epoch_seconds = 5;
  int64 commitment_period_end_epoch_seconds = 6;
  Money commitment_amount = 7;
  double discount_pct = 8;
}

message Reservation {
  string reservation_id = 1;
  string tenant_id = 2;
  string workload_kind = 3;
  string region = 4;
  int64 commitment_units = 5;
  int64 commitment_period_start_epoch_seconds = 6;
  int64 commitment_period_end_epoch_seconds = 7;
  Money commitment_amount = 8;
  double discount_pct = 9;
  string state = 10;
  int64 purchased_at_epoch_seconds = 11;
  AuditChainHeader audit = 12;
}

message PurchaseReservationResponse {
  Reservation reservation = 1;
}

message ConvertReservationRequest {
  string reservation_id = 1;
}

message ConvertReservationResponse {
  Reservation reservation = 1;
  AuditChainHeader audit = 2;
}

// ============================================================================
// Settlement API
// ============================================================================

message ComputeSettlementRequest {
  string tenant_id = 1;
  int64 window_start_epoch_seconds = 2;
  int64 window_end_epoch_seconds = 3;
}

message SettlementStatement {
  string statement_id = 1;
  string tenant_id = 2;
  string contract_id = 3;
  int64 settlement_window_start_epoch_seconds = 4;
  int64 settlement_window_end_epoch_seconds = 5;
  SettlementDirection direction = 6;
  Money gross_amount = 7;
  double commission_rate = 8;
  Money commission_amount = 9;
  Money fx_adjustment = 10;
  Money clawback_amount = 11;
  Money net_amount = 12;
  string payout_method_ref = 13;
  SettlementState state = 14;
  AuditChainHeader audit = 15;
}

message ComputeSettlementResponse {
  SettlementStatement statement = 1;
}

message InitiatePayoutRequest {
  string statement_id = 1;
}

message InitiatePayoutResponse {
  string statement_id = 1;
  string payment_handle = 2;
  AuditChainHeader audit = 3;
}

// ============================================================================
// Subscription API
// ============================================================================

message CreateSubscriptionRequest {
  string tenant_id = 1;
  string plan_ref = 2;
  repeated BillingComponent billing_components = 3;
  int64 current_period_start_epoch_seconds = 4;
  int64 current_period_end_epoch_seconds = 5;
  string proration_behavior = 6;
}

message Subscription {
  string subscription_id = 1;
  string tenant_id = 2;
  string plan_ref = 3;
  repeated BillingComponent billing_components = 4;
  SubscriptionState state = 5;
  int64 started_at_epoch_seconds = 6;
  int64 current_period_start_epoch_seconds = 7;
  int64 current_period_end_epoch_seconds = 8;
  int64 paused_at_epoch_seconds = 9;
  int64 canceled_at_epoch_seconds = 10;
  bool cancel_at_period_end = 11;
  string proration_behavior = 12;
  AuditChainHeader audit = 13;
}

message CreateSubscriptionResponse {
  Subscription subscription = 1;
}

message GetSubscriptionRequest {
  string subscription_id = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1;
}

message ModifySubscriptionRequest {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_CHANGE_PLAN = 1;
    OP_PAUSE = 2;
    OP_RESUME = 3;
    OP_CANCEL = 4;
  }
  string subscription_id = 1;
  Op op = 2;
  string new_plan_ref = 3;
  bool cancel_at_period_end = 4;
  string proration_behavior = 5;
}

message ModifySubscriptionResponse {
  Subscription subscription = 1;
  AuditChainHeader audit = 2;
}

// ============================================================================
// Meter aggregate API
// ============================================================================

message ReadMeterAggregateRequest {
  string tenant_id = 1;
  string meter_unit = 2;
  int64 from_epoch_seconds = 3;
  int64 to_epoch_seconds = 4;
  string granularity = 5;
}

message MeterAggregateBucket {
  int64 bucket_start_epoch_seconds = 1;
  string meter_unit = 2;
  string pricing_dimension = 3;
  int64 total_units = 4;
  Money estimated_cost = 5;
}

message ReadMeterAggregateResponse {
  string tenant_id = 1;
  string granularity = 2;
  repeated MeterAggregateBucket buckets = 3;
}

// ============================================================================
// Seat count API
// ============================================================================

message GetSeatCountRequest {
  string tenant_id = 1;
}

message GetSeatCountResponse {
  string tenant_id = 1;
  int64 snapshot_at_epoch_seconds = 2;
  int32 active_seat_count = 3;
  int32 over_seat_count = 4;
  int64 grace_window_ends_at_epoch_seconds = 5;
  string invoice_id = 6;
}

// ============================================================================
// FX lock API
// ============================================================================

message GetFxLockRequest {
  string base_currency = 1;
  string quote_currency = 2;
  string date = 3;            // YYYY-MM-DD
}

message GetFxLockResponse {
  string lock_id = 1;
  string base_currency = 2;
  string quote_currency = 3;
  double rate = 4;
  string feed_source = 5;
  int64 feed_fetched_at_epoch_seconds = 6;
  bytes feed_value_hash = 7;
  int64 locked_at_epoch_seconds = 8;
  AuditChainHeader audit = 9;
}

// ============================================================================
// Dunning API
// ============================================================================

message GetDunningStatusRequest {
  string invoice_id = 1;
}

message GetDunningStatusResponse {
  string invoice_id = 1;
  string state = 2;
  int32 retry_count = 3;
  int64 next_retry_at_epoch_seconds = 4;
  int64 last_attempt_at_epoch_seconds = 5;
  string last_attempt_result = 6;
}

message RetryDunningRequest {
  string invoice_id = 1;
}

message RetryDunningResponse {
  string invoice_id = 1;
  bool retry_initiated = 2;
  AuditChainHeader audit = 3;
}

// ============================================================================
// FOCUS / ERP export API
// ============================================================================

message TriggerFocusExportRequest {
  string tenant_id = 1;
  int64 period_start_epoch_seconds = 2;
  int64 period_end_epoch_seconds = 3;
  string destination_object_ref = 4;
}

message TriggerFocusExportResponse {
  string job_id = 1;
  string state = 2;
}

message TriggerErpExportRequest {
  string tenant_id = 1;
  int64 period_start_epoch_seconds = 2;
  int64 period_end_epoch_seconds = 3;
  string connector_kind = 4;
}

message TriggerErpExportResponse {
  string job_id = 1;
  string state = 2;
}

// ============================================================================
// Service definitions
// ============================================================================

service TenantClassApi {
  // Cedar: cap.cloud.billing.read_tenant_class
  rpc GetTenantClass(GetTenantClassRequest) returns (GetTenantClassResponse);
  // Cedar: cap.cloud.billing.convert_tenant
  rpc ConvertTenantToPaid(ConvertTenantToPaidRequest) returns (ConvertTenantToPaidResponse);
  // Cedar: cap.cloud.billing.mutate_billing_components
  rpc MutateBillingComponents(MutateBillingComponentsRequest) returns (MutateBillingComponentsResponse);
}

service BillingAccountApi {
  rpc CreateBillingAccount(CreateBillingAccountRequest) returns (CreateBillingAccountResponse);
  rpc GetBillingAccount(GetBillingAccountRequest) returns (GetBillingAccountResponse);
}

service MeteringApi {
  // Cedar: cap.cloud.billing.emit_usage_event
  rpc EmitUsageEvent(EmitUsageEventRequest) returns (EmitUsageEventResponse);
  rpc GetUsageEvent(GetUsageEventRequest) returns (GetUsageEventResponse);
  rpc ReadMeterAggregate(ReadMeterAggregateRequest) returns (ReadMeterAggregateResponse);
}

service InvoiceApi {
  // Cedar: cap.cloud.billing.issue_invoice
  rpc IssueInvoice(IssueInvoiceRequest) returns (IssueInvoiceResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  // Cedar: cap.cloud.billing.void_invoice
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse);
  // Cedar: cap.cloud.billing.issue_credit_memo
  rpc IssueCreditMemo(IssueCreditMemoRequest) returns (IssueCreditMemoResponse);
}

service ReservationApi {
  // Cedar: cap.cloud.billing.purchase_reservation
  rpc PurchaseReservation(PurchaseReservationRequest) returns (PurchaseReservationResponse);
  // Cedar: cap.cloud.billing.convert_reservation
  rpc ConvertReservation(ConvertReservationRequest) returns (ConvertReservationResponse);
}

service SettlementApi {
  // Cedar: cap.cloud.billing.compute_settlement
  rpc ComputeSettlement(ComputeSettlementRequest) returns (ComputeSettlementResponse);
  // Cedar: cap.cloud.billing.initiate_payout
  rpc InitiatePayout(InitiatePayoutRequest) returns (InitiatePayoutResponse);
}

service SubscriptionApi {
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // Cedar: cap.cloud.billing.modify_subscription
  rpc ModifySubscription(ModifySubscriptionRequest) returns (ModifySubscriptionResponse);
}

service SeatCountApi {
  rpc GetSeatCount(GetSeatCountRequest) returns (GetSeatCountResponse);
}

service FxLockApi {
  rpc GetFxLock(GetFxLockRequest) returns (GetFxLockResponse);
}

service DunningApi {
  rpc GetDunningStatus(GetDunningStatusRequest) returns (GetDunningStatusResponse);
  rpc RetryDunning(RetryDunningRequest) returns (RetryDunningResponse);
}

service ExportApi {
  rpc TriggerFocusExport(TriggerFocusExportRequest) returns (TriggerFocusExportResponse);
  rpc TriggerErpExport(TriggerErpExportRequest) returns (TriggerErpExportResponse);
}
