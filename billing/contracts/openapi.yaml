openapi: 3.2.0
info:
  title: cloud-billing
  description: |
    cloud-billing is the canonical source-of-truth for tenant_class lifecycle,
    billing_components composition, metering ledger, multi-currency invoice ledger,
    rate-card lifecycle, reservation lifecycle, credit memo issuance, FX lock
    provenance, revenue-share settlement, per-seat counting, per-usage aggregation,
    FOCUS 1.1 export, ERP export, dunning policy, subscription primitive, and
    proration engine.

    Per ADR-0330 this surface is the keystone for tenant_class ∈ {demo_trial, paid}
    and billing_components ⊆ {revenue_share, per_seat, per_usage}.
    Per ADR-0145 the REST surface coexists with the inter-µservice gRPC surface
    and AsyncAPI event surface; per ADR-0253 the REST surface defaults to HTTP/3
    + QUIC with HTTPS/2 fallback. Every state-mutation action is Cedar-gated
    per ADR-0243.
  version: "1.0.0"
  contact:
    name: axis-cloud-billing + council-finance
  license:
    name: Inherited from oyatie root
servers:
  - url: https://{tenant}.cloud-billing.oyatie.com/v1
    variables:
      tenant:
        default: tenant-id
        description: Tenant subdomain (ADR-0244)
security:
  - bearerAuth: []
tags:
  - name: tenant-class
    description: Tenant class read + mutation (demo_trial → paid)
  - name: billing-components
    description: Billing components subset mutation
  - name: billing-account
    description: Billing account lifecycle
  - name: cloud-billing-event
    description: Usage event emission + query
  - name: invoice
    description: Invoice generation + issuance + void + query
  - name: credit-memo
    description: Credit memo issuance + query
  - name: rate-card
    description: Rate card versioning
  - name: reservation
    description: Reservation purchase + conversion
  - name: settlement
    description: Revenue-share settlement
  - name: subscription
    description: Subscription primitive (Stripe + Recurly parity)
  - name: meter-aggregate
    description: Per-meter usage rollups
  - name: seat-count
    description: Per-seat counting snapshots
  - name: fx-lock
    description: FX lock provenance
  - name: dunning
    description: Failed-payment retry policy
  - name: focus-export
    description: FOCUS 1.1 columnar export
  - name: erp-export
    description: ERP export (SAP, NetSuite, Oracle EBS)
  - name: anomaly
    description: Cost anomaly detection
paths:
  /tenant-class/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string }
    get:
      tags: [tenant-class]
      summary: Read tenant_class + billing_components for a tenant
      operationId: getTenantClass
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantClassResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tenant-class/{tenant_id}/convert:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string }
    post:
      tags: [tenant-class]
      summary: Convert demo_trial → paid atomically
      operationId: convertTenantToPaid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversionRequest" }
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantClassResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /billing-components/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string }
    patch:
      tags: [billing-components]
      summary: Mutate billing_components subset (add or remove)
      operationId: mutateBillingComponents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingComponentsMutation" }
      responses:
        "200":
          description: Mutated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantClassResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Cannot mutate components for demo_trial tenant or settlement pending
  /billing-account:
    post:
      tags: [billing-account]
      summary: Create a billing account
      operationId: createBillingAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingAccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /billing-account/{billing_account_id}:
    parameters:
      - in: path
        name: billing_account_id
        required: true
        schema: { type: string }
    get:
      tags: [billing-account]
      summary: Read a billing account
      operationId: getBillingAccount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cloud-billing-event:
    post:
      tags: [cloud-billing-event]
      summary: Emit a usage event
      operationId: emitUsageEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudBillingEventCreate" }
      responses:
        "201":
          description: Emitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudBillingEvent" }
        "200":
          description: Idempotent replay (same idempotency_key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudBillingEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cloud-billing-event/{event_id}:
    parameters:
      - in: path
        name: event_id
        required: true
        schema: { type: string }
    get:
      tags: [cloud-billing-event]
      summary: Read a usage event
      operationId: getUsageEvent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudBillingEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invoice:
    post:
      tags: [invoice]
      summary: Issue an invoice
      operationId: issueInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceGenerate" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409":
          description: Duplicate invoice id
  /invoice/{invoice_id}:
    parameters:
      - in: path
        name: invoice_id
        required: true
        schema: { type: string }
    get:
      tags: [invoice]
      summary: Read an invoice
      operationId: getInvoice
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invoice/{invoice_id}/void:
    parameters:
      - in: path
        name: invoice_id
        required: true
        schema: { type: string }
    post:
      tags: [invoice]
      summary: Void an invoice
      operationId: voidInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidRequest" }
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /credit-memo:
    post:
      tags: [credit-memo]
      summary: Issue a credit memo
      operationId: issueCreditMemo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditMemoIssue" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditMemo" }
  /rate-card:
    post:
      tags: [rate-card]
      summary: Create or version a rate card
      operationId: createRateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateCardCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateCard" }
  /reservation:
    post:
      tags: [reservation]
      summary: Purchase a reservation
      operationId: purchaseReservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationPurchase" }
      responses:
        "201":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
  /reservation/{reservation_id}/convert:
    parameters:
      - in: path
        name: reservation_id
        required: true
        schema: { type: string }
    post:
      tags: [reservation]
      summary: Convert a reservation
      operationId: convertReservation
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
  /settlement:
    post:
      tags: [settlement]
      summary: Compute monthly revenue-share settlement
      operationId: computeSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementCompute" }
      responses:
        "201":
          description: Computed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementStatement" }
  /settlement/{statement_id}:
    parameters:
      - in: path
        name: statement_id
        required: true
        schema: { type: string }
    get:
      tags: [settlement]
      summary: Read a settlement statement
      operationId: getSettlement
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementStatement" }
  /settlement/{statement_id}/payout:
    parameters:
      - in: path
        name: statement_id
        required: true
        schema: { type: string }
    post:
      tags: [settlement]
      summary: Initiate payout for a settlement statement
      operationId: initiatePayout
      responses:
        "202":
          description: Payout initiated
  /subscription:
    post:
      tags: [subscription]
      summary: Create a subscription
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
  /subscription/{subscription_id}:
    parameters:
      - in: path
        name: subscription_id
        required: true
        schema: { type: string }
    get:
      tags: [subscription]
      summary: Read a subscription
      operationId: getSubscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
    patch:
      tags: [subscription]
      summary: Modify a subscription (plan change, pause, resume, cancel)
      operationId: modifySubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionModify" }
      responses:
        "200":
          description: Modified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
  /meter-aggregate:
    get:
      tags: [meter-aggregate]
      summary: Read per-tenant per-meter usage rollups
      operationId: readMeterAggregate
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: { type: string }
        - in: query
          name: meter_unit
          required: false
          schema: { type: string }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: granularity
          required: false
          schema: { type: string, enum: [hour, day, week, month] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeterAggregateResponse" }
  /seat-count/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string }
    get:
      tags: [seat-count]
      summary: Read latest seat-count snapshot
      operationId: getSeatCount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatCountSnapshot" }
  /fx-lock:
    get:
      tags: [fx-lock]
      summary: Read FX lock for a (base, quote, date)
      operationId: getFxLock
      parameters:
        - in: query
          name: base
          required: true
          schema: { type: string }
        - in: query
          name: quote
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxLock" }
  /dunning/{invoice_id}:
    parameters:
      - in: path
        name: invoice_id
        required: true
        schema: { type: string }
    get:
      tags: [dunning]
      summary: Read dunning status for an invoice
      operationId: getDunningStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DunningStatus" }
  /dunning/{invoice_id}/retry:
    parameters:
      - in: path
        name: invoice_id
        required: true
        schema: { type: string }
    post:
      tags: [dunning]
      summary: Force-retry dunning attempt
      operationId: retryDunning
      responses:
        "202":
          description: Retry initiated
  /focus-export:
    post:
      tags: [focus-export]
      summary: Trigger FOCUS 1.1 export
      operationId: triggerFocusExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusExportRequest" }
      responses:
        "202":
          description: Export triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusExportJob" }
  /erp-export:
    post:
      tags: [erp-export]
      summary: Trigger ERP export
      operationId: triggerErpExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ErpExportRequest" }
      responses:
        "202":
          description: Export triggered
  /anomaly/{tenant_id}:
    parameters:
      - in: path
        name: tenant_id
        required: true
        schema: { type: string }
    get:
      tags: [anomaly]
      summary: Read recent cost anomalies for a tenant
      operationId: readAnomalies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnomalyList" }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cloud-billing
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: oyatie-principal-token
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden (Cedar default-deny)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    TenantClass:
      type: string
      enum: [demo_trial, paid]
    BillingComponent:
      type: string
      enum: [revenue_share, per_seat, per_usage]
    BillingComponentSet:
      type: array
      uniqueItems: true
      maxItems: 3
      items: { $ref: "#/components/schemas/BillingComponent" }
    TenantClassResponse:
      type: object
      required: [tenant_id, tenant_class, billing_components, cap_breached]
      properties:
        tenant_id: { type: string }
        tenant_class: { $ref: "#/components/schemas/TenantClass" }
        billing_components: { $ref: "#/components/schemas/BillingComponentSet" }
        cap_breached: { type: boolean }
        trial_expires_at: { type: string, format: date-time, nullable: true }
        grace_window_expires_at: { type: string, format: date-time, nullable: true }
        deployment_context:
          type: string
          enum: [oyatie-public-cloud, guest-on-aws, guest-on-oci, on-prem, colo, oyatie-as-cloud-provider]
        compliance_packs:
          type: array
          items: { type: string }
        tenant_class_changed_at: { type: string, format: date-time }
    ConversionRequest:
      type: object
      required: [contract_id, billing_components]
      properties:
        contract_id: { type: string }
        billing_components: { $ref: "#/components/schemas/BillingComponentSet" }
        retain_trial_usage: { type: boolean, default: true }
        deployment_context:
          type: string
          enum: [oyatie-public-cloud, guest-on-aws, guest-on-oci, on-prem, colo, oyatie-as-cloud-provider]
    BillingComponentsMutation:
      type: object
      required: [op, component, contract_amendment_id]
      properties:
        op: { type: string, enum: [add, remove] }
        component: { $ref: "#/components/schemas/BillingComponent" }
        contract_amendment_id: { type: string }
    BillingAccountCreate:
      type: object
      required: [id, tenant_id, region, regional_pack, payment_method, credit_balance, state, created_at_epoch_seconds]
      properties:
        id: { type: string, description: "'ba_*' prefix" }
        tenant_id: { type: string, description: "'ten_*' or 'demo_*' prefix" }
        region: { type: string }
        regional_pack: { type: string, description: "'oya-pack-*' prefix" }
        payment_method: { type: string, description: "'pm_*' prefix" }
        credit_balance: { $ref: "#/components/schemas/Money" }
        state: { type: string, enum: [Active, Suspended, Delinquent] }
        data_class: { type: string, default: Financial }
        created_at_epoch_seconds: { type: integer, format: int64 }
    BillingAccount:
      type: object
      required: [id, tenant_id, tenant_class, billing_components, region, regional_pack, payment_method, credit_balance, state]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        tenant_class: { $ref: "#/components/schemas/TenantClass" }
        billing_components: { $ref: "#/components/schemas/BillingComponentSet" }
        region: { type: string }
        regional_pack: { type: string }
        payment_method: { type: string }
        credit_balance: { $ref: "#/components/schemas/Money" }
        state: { type: string }
        created_at_epoch_seconds: { type: integer }
        schema_version: { type: integer }
    Money:
      type: object
      required: [currency, minor_units]
      properties:
        currency:
          type: string
          description: "3-letter ASCII uppercase; ISO 4217 + Oyatie internal 'OYC'"
          pattern: "^[A-Z]{3}$"
        minor_units:
          type: integer
          format: int64
          minimum: 0
    CloudBillingEventCreate:
      type: object
      required: [id, tenant_id, resource_id, region, metering_tag, kind, units, rate_card_ref, occurred_at_epoch_seconds, idempotency_key]
      properties:
        id: { type: string, description: "'cbill_*' prefix" }
        tenant_id: { type: string }
        resource_id:
          type: string
          description: "'oya:cloud:<region>:<tenant>:<kind>:<id>' shape"
        region: { type: string }
        metering_tag:
          type: string
          description: "'oya:metering:<tenant>:<kind>' shape"
        kind:
          type: string
          enum: [ResourceCreated, ResourceTerminated, Usage, Reservation, Commitment, Credit, RevenueShare, RevenueShareReversal, SeatCount, Subscription]
        units:
          type: array
          items: { $ref: "#/components/schemas/MeterUnit" }
        rate_card_ref: { type: string, description: "'rate/*' prefix" }
        occurred_at_epoch_seconds: { type: integer, format: int64 }
        idempotency_key: { type: string }
        data_class: { type: string, default: Public }
    CloudBillingEvent:
      allOf:
        - $ref: "#/components/schemas/CloudBillingEventCreate"
        - type: object
          properties:
            audit_chain_hash: { type: string, format: byte }
            schema_version: { type: integer }
    MeterUnit:
      type: object
      required: [kind, quantity]
      properties:
        kind: { type: string }
        quantity: { type: integer, format: int64 }
    InvoiceGenerate:
      type: object
      required: [id, billing_account_id, tenant_id, regional_pack, period, line_items, subtotal, tax, total, tax_invoice_format, tax_registration_id, issued_at_epoch_seconds, due_at_epoch_seconds]
      properties:
        id: { type: string }
