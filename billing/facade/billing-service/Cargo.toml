[package]
name = "billing-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "billing-service"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
data-boundary-kernel = { path = "../../../data/core/data-boundary-kernel" }
billing-domain = { path = "../../core/billing" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
billing-metering = { path = "../../core/metering" }

