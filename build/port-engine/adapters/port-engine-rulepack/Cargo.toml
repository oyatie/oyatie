[package]
name = "port-engine-rulepack"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Neutral RulePack loader for the owned deterministic port engine (ADR-0637 D1).
# Slice 10 fixture-gated + Slice 11 RuleConstruction for transform. Hermetic v0 mirror.
# No Cargo.lock absorb this tip.

[dependencies]
port-engine-api = { path = "../../ports/port-engine-api" }
port-engine-hash = { path = "../port-engine-hash" }
port-engine-transform = { path = "../../core/port-engine-transform" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
port-engine-kernel = { path = "../../core/port-engine-kernel" }

[lib]
name = "port_engine_rulepack"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
