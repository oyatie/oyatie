[package]
name = "port-engine-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Driver facade for the owned deterministic port engine: plan, render, verify, delta, receipt.
# W0-B Slice 12 — receipt hardening + render/verify/delta. No Cargo.lock absorb.

[[bin]]
name = "port-engine-app"
path = "src/main.rs"

[dependencies]
port-engine-api = { path = "../../ports/port-engine-api" }
port-engine-kernel = { path = "../../core/port-engine-kernel" }
port-engine-rust-ir = { path = "../../core/port-engine-rust-ir" }
port-engine-source-pin = { path = "../../adapters/port-engine-source-pin" }
port-engine-frontend-go = { path = "../../adapters/port-engine-frontend-go" }
port-engine-hash = { path = "../../adapters/port-engine-hash" }
port-engine-rulepack = { path = "../../adapters/port-engine-rulepack" }
port-engine-snapshot = { path = "../../adapters/port-engine-snapshot" }
port-engine-identity = { path = "../../adapters/port-engine-identity" }
port-engine-toolchain = { path = "../../adapters/port-engine-toolchain" }
port-engine-transform = { path = "../../core/port-engine-transform" }

[lib]
name = "port_engine_app"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
