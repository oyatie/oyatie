apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nativelink-cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nativelink-cache
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/nativelink: {{ include (print $.Template.BasePath "/nativelink-config.yaml") . | sha256sum }}
        checksum/gateway: {{ include (print $.Template.BasePath "/envoy-config.yaml") . | sha256sum }}
        cache.oyatie.dev/certificate-revision: {{ required "certificateRevision is required for explicit TLS rollout" .Values.certificateRevision | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: {{ required "nodeHostname requires verified placement" .Values.nodeHostname | quote }}
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nativelink
          image: ghcr.io/tracemachina/nativelink@sha256:5c2e6eca51c6d3ac40b94f703e08a243fd036cc136cc858a99040ca90fa57d61
          args: [/config/config.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 750m, memory: 3Gi}
          ports:
            - {name: health, containerPort: 50052}
          startupProbe:
            httpGet: {path: /status, port: health}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /status, port: health}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: health}
            periodSeconds: 30
          volumeMounts:
            - {name: cache, mountPath: /cache}
            - {name: nativelink-config, mountPath: /config, readOnly: true}
        - name: gateway
          image: envoyproxy/envoy@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
          command: [/usr/local/bin/envoy]
          args: [-c, /config/envoy.yaml, --concurrency, "1", --disable-hot-restart, --drain-time-s, "30", --log-level, warn]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
          ports:
            - {name: grpcs, containerPort: 8443}
          readinessProbe:
            tcpSocket: {port: grpcs}
            periodSeconds: 5
          volumeMounts:
            - {name: gateway-config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ required "existingClaim requires a verified cache-only volume" .Values.existingClaim | quote }}
        - name: nativelink-config
          configMap: {name: {{ .Release.Name }}-nativelink}
        - name: gateway-config
          configMap: {name: {{ .Release.Name }}-gateway}
        - name: tls
          secret:
            secretName: {{ required "existingTlsSecret is required" .Values.existingTlsSecret | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
