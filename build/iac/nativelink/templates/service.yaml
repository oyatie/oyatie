apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nativelink-cache
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpcs
      port: 443
      targetPort: grpcs
      protocol: TCP
      appProtocol: kubernetes.io/h2
