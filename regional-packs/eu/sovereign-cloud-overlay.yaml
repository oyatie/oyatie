# EU regional pack sovereign cloud overlay (ADR-0179).
# Awaiting regulator sign-off per registry/sovereign-cloud/per-pack-overlay-status.tsv.
authored: 2026-05-18
authority: ADR-0179
schema: /specs/sovereign-cloud-overlays.json

pack_id: eu

primary_provider:
  id: ovh
  regions:
    - eu-west-paris
    - eu-west-roubaix
    - eu-central-frankfurt
  certifications:
    - GAIA-X-LEVEL-2
    - ISO-27001
    - ISO-27017
    - ISO-27018
    - SecNumCloud
    - HDS-2023      # Hébergeur de Données de Santé (FR health)
  contract_id: OVH-CLOUD-2026-001
  sla_minimum_availability: 99.95
  data_residency_guarantee: eu-only-no-extraterritorial-cloud-act
  notes: |
    OVH SecNumCloud-certified substrate exempt from US CLOUD Act extraterritorial
    reach. Primary EU sovereign substrate per GAIA-X catalogue.
    PUE ~1.09 (Roubaix water-cooled DC).

secondary_provider:
  id: aws
  regions:
    - eu-central-1
    - eu-west-1
  certifications:
    - ISO-27001
    - SOC-2-TYPE-2
    - C5-2020       # Cloud Computing Compliance Catalogue (BSI Germany)
  contract_id: AWS-EU-2026-001
  sla_minimum_availability: 99.99
  data_residency_guarantee: eu-only
  notes: |
    AWS eu-central-1 and eu-west-1 substrate. Used for non-sovereign-tagged
    data classes only. EU-sovereign-tagged data NOT permitted on this
    substrate due to US CLOUD Act extraterritorial concerns.

sovereign_data_classes:
  - PII_EU                       # personal data per GDPR scope
  - HEALTH_RECORD_EU             # health data per GDPR Art. 9
  - SPECIAL_CATEGORY_EU          # special category per GDPR Art. 9
  - EMPLOYMENT_EU                # employment data per Work Council Directive
  - JUDICIAL_EU                  # judicial data per GDPR Art. 10
  - GAIA_X_BOUND                 # data participating in GAIA-X federated services

non_sovereign_data_class_fallbacks:
  - provider: aws
    regions:
      - eu-central-1
      - eu-west-1
    data_classes:
      - PUBLIC
      - ANONYMIZED
      - INTERNAL_ONLY
      - SHARED_LEARNING
  - provider: azure
    regions:
      - germanywestcentral
      - westeurope
    data_classes:
      - PUBLIC
      - ANONYMIZED

prohibited_egress:
  - data_class: PII_EU
    to_provider: aws            # extraterritorial CLOUD Act risk
  - data_class: PII_EU
    to_provider: gcp
  - data_class: PII_EU
    to_provider: azure
  - data_class: HEALTH_RECORD_EU
    to_provider: '*non-eu*'
  - data_class: SPECIAL_CATEGORY_EU
    to_provider: '*non-eu*'
  - data_class: EMPLOYMENT_EU
    to_provider: '*non-eu*'
  - data_class: JUDICIAL_EU
    to_provider: '*non-eu*'
  - data_class: GAIA_X_BOUND
    to_provider: '*non-gaia-x-catalogue*'

audit_cadence: quarterly
regulator_pack_evidence_cadence: quarterly

regulator_engagement_calendar:
  - regulator: EDPB (GDPR coordination)
    cadence: annual
  - regulator: CNIL (FR DPA)
    cadence: quarterly
  - regulator: BfDI (DE DPA)
    cadence: quarterly
  - regulator: AEPD (ES DPA)
    cadence: quarterly
  - regulator: GAIA-X Catalogue
    cadence: semi-annual
  - regulator: ENISA (EUCS)
    cadence: annual
  - regulator: EU-AI-Office (per ADR-0144 EU AI Act)
    cadence: annual

sustainability:
  primary_provider_pue: 1.09
  secondary_provider_pue: 1.18
  carbon_intensity_g_co2_per_kwh: 295  # EU avg 2025
