# KR regional pack sovereign cloud overlay (ADR-0179).
# Awaiting regulator sign-off per registry/sovereign-cloud/per-pack-overlay-status.tsv.
authored: 2026-05-18
authority: ADR-0179
schema: /specs/sovereign-cloud-overlays.json

pack_id: kr

primary_provider:
  id: naver-cloud
  regions:
    - kr-seoul
    - kr-busan
  certifications:
    - CSAP-1.0
    - K-ISMS-P-2024
    - ISO-27001
    - ISO-27017
    - ISO-27018
  contract_id: NAVER-CLOUD-2026-001
  sla_minimum_availability: 99.95
  data_residency_guarantee: domestic-kr-only
  notes: |
    Naver Cloud's CSAP-certified compute + storage + managed-db substrate
    in Chuncheon + Sejong DCs. PUE ~1.18 (Chuncheon). Primary substrate
    for KR-PII + KR-Health-Tier1 + KR-Gov data classes.

secondary_provider:
  id: kt-cloud
  regions:
    - kr-seoul-dr
  certifications:
    - CSAP-1.0
    - K-ISMS-P-2024
  contract_id: KT-CLOUD-2026-001
  sla_minimum_availability: 99.9
  data_residency_guarantee: domestic-kr-only
  notes: |
    KT Cloud's CSAP-certified DR substrate. Used for active-passive
    cross-region replication per ADR-0180 T2 tier for KR-bound data.

sovereign_data_classes:
  - PII_KR                       # personal data of KR-resident natural persons
  - HEALTH_RECORD_KR_TIER1       # tier-1 health records per KR Personal Health Information Act
  - HEALTH_RECORD_KR_TIER2       # tier-2 health records
  - GOV_DATA_KR                  # data classified under KR-Gov-Internal
  - FINANCIAL_KR                 # KR financial-sector data (per FSC oversight)
  - K_FOOD_TRACE_KR              # food traceability data (per MFDS)

non_sovereign_data_class_fallbacks:
  - provider: aws
    regions:
      - ap-northeast-2
    data_classes:
      - PUBLIC
      - ANONYMIZED
      - INTERNAL_ONLY
      - SHARED_LEARNING
  - provider: gcp
    regions:
      - asia-northeast3
    data_classes:
      - PUBLIC
      - ANONYMIZED

prohibited_egress:
  - data_class: PII_KR
    to_provider: aws
  - data_class: PII_KR
    to_provider: gcp
  - data_class: PII_KR
    to_provider: azure
  - data_class: HEALTH_RECORD_KR_TIER1
    to_provider: '*non-kr*'
  - data_class: HEALTH_RECORD_KR_TIER2
    to_provider: '*non-kr*'
  - data_class: GOV_DATA_KR
    to_provider: '*non-kr*'
  - data_class: FINANCIAL_KR
    to_provider: '*non-kr*'
  - data_class: K_FOOD_TRACE_KR
    to_provider: '*non-kr*'

audit_cadence: quarterly
regulator_pack_evidence_cadence: quarterly

regulator_engagement_calendar:
  - regulator: KISA (CSAP)
    cadence: annual-audit-plus-quarterly-evidence-packet
  - regulator: MFDS (Health Tier 1+2)
    cadence: semi-annual
  - regulator: FSC (Financial)
    cadence: quarterly
  - regulator: MSIT (general)
    cadence: annual

morphology_pack_dependency:
  korean_tokenization_required: true
  # Per ADR-0048 (Korean morphology) the search + ontology µservices use
  # the canonical KR morphology pipeline when handling KR-tagged data.

sustainability:
  primary_provider_pue: 1.18    # Naver Chuncheon DC reported PUE
  secondary_provider_pue: 1.32   # KT Seoul DR DC reported PUE
  carbon_intensity_g_co2_per_kwh: 459  # KR national grid 2025 avg
