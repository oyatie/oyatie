[package]
name = "policy-decision-service-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "PDP service kernel (ADR-0559, G004 slice 1): the pure ports of the policy-decision-point service — the PolicyBundleStore port (policy-store backend seam, destination = signed content-addressed bundle distribution per ADR-0536 D-2), the DecisionAuditSink port (one attributable record per decision, same shape as identity's audit seam), and the twelve-factor service configuration parser. Zero transient-tech dependencies (ADR-0547/ADR-0550 kernel purity)."

[dependencies]
shared-pdp-kernel = { package = "policy-pdp-kernel", path = "../pdp-kernel" }
shared-platform-contracts-kernel = { path = "../../../iam/core/platform-contracts-kernel" }

[lib]
doctest = false

[lints]
workspace = true
