[package]
name = "policy-pdp-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Embedded-PDP port kernel: the vendor-neutral PolicyDecisionPoint trait over the locked PDP contract, policy-bundle and entity-slice value types, the runtime guard with its deadline, panic capture and fail-closed circuit, and the fingerprint-keyed decision cache. Engine-free; a Cedar engine lives behind an adapter."

