[package]
name = "policy-cedar-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Cedar-shaped authorization policy kernel and the Zanzibar relationship-tuple vocabulary. Pure value types: versioned policy records, role + attribute evaluation, authoring-time lint, version diffing, obligation annotations, and the ReBAC tuple/userset/consistency-token surface with its tuple-store port. No network, storage, or runtime side effects."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
