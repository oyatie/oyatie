# oya-ci.toml — oyatie's EXPLICIT oya-ci CONFORMANCE-FLOOR config (OYA-CI-CONFORMANCE-FLOOR-PLAN Stage 2).
#
# This file reproduces oyatie's CURRENT policy byte-for-byte: the producer
# (oya-cloud-ci-accounting-registry-app) loads it via oya-ci-config-kernel's CLOSED-schema
# loader (unknown keys are an error), falling back to the compiled-in bundled default when
# the file is absent. Authoring it here makes the policy DATA (doc-as-data doctrine): a repo
# adopts oya-ci by dropping its own oya-ci.toml. The schema reference + every default lives in
# docs/oya-ci/ (Stage D).
#
# The ttl + unit_class + gate-disposition tables stay as the crate's bundled JSON DATA (the
# `[ttl]` / `[unit_class]` sections below are intentionally empty = "use the bundled table");
# author an inline_json override only to diverge from the bundled tables.
#
# DE-BRAND PROFILE (ADR-0532 amends ADR-0017; ADR-0533; ADR-0562 §9): `profile` selects the
# bundled section defaults. `oyatie` is the first-party self-host profile — today's values
# VERBATIM, ZERO behaviour change (the safety property). A neutral adopter sets `profile =
# 'neutral'` (policy-free, zero oyatie literals) and authors only their own policy. `oyatie` is
# the default, so this key is byte-identical to omitting it (it is skipped from the canonical
# serialization that feeds the provenance digest).
profile = 'oyatie'

[repo]
root_markers = ["specs/root-hub-pointers.json"]
path_excludes = ["third-party/"]

[naming]
required_prefix = "oya-"
allowed_roles = ["kernel", "domain", "usecase", "app", "adapter", "infrastructure", "cli", "rest", "grpc", "worker", "sdk", "api"]
check_family_prefix = "oya-check-"
backend_suffixes = ["fake", "inmemory", "aws", "oci", "gcp", "azure", "postgres", "redis", "sqlite"]
doctrinal_carve_outs = ["oya-tooling-agent-read", "oya-ci-gate-contract"]

[[vocab.forbidden_stems]]
