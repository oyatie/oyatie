input_kind = "producer-face"
face = "bnf_layer_suffix"

[[gates.enabled]]
id = "cloud-ci-manifest-hygiene"
input_kind = "producer-face"
face = "manifest_hygiene"

[[gates.enabled]]
id = "cloud-ci-cargo-prefix"
input_kind = "producer-face"
face = "cargo_prefix"

[[gates.enabled]]
id = "cloud-ci-slo-coverage"
input_kind = "producer-face"
face = "slo_coverage"

[[gates.enabled]]
id = "cloud-ci-license-policy"
input_kind = "producer-face"
face = "license_policy"

[[gates.enabled]]
id = "cloud-ci-catalog-liveness"
input_kind = "producer-face"
face = "catalog_liveness"

[[gates.enabled]]
id = "cloud-ci-workspace-glob-coverage"
input_kind = "producer-face"
