[manifest]
required_flags = ["version_workspace", "rust_version_workspace", "publish_false", "license", "lints_workspace", "lib_doctest_false"]

[reachability]
masterplan = "specs/masterplan.json"
root_hub = "specs/root-hub-pointers.json"
doc_catalog = "docs/DOC-CATALOG.md"
registry = "specs/reachability-registry.json"

[justification]
adr_dir = "docs/decisions"
roadmap = "specs/master-plan-sequencing.json"

[owners]
file_name = "OWNERS"
# ADR-0555 hardening (FRIC-1781400000): max tracked paths one OWNERS file may cover via
# nearest-ancestor resolution (the file itself counts). Excess coverage stays UNOWNED with
# the split-the-registration remediation, so a single bulk OWNERS cannot neuter a tree's
# unowned accounting. Measured live corpus 2026-06-12: max legitimate coverage 886
# (registry/catalog/OWNERS) of 18,400 tracked paths; 2000 gives >2x growth headroom.
max_paths_per_owners_file = 2000

[enforcement]
governance_crate_substr = "oya-governance"
governance_lanes = ["docs/governance-lanes/diataxis-doc-class.md", "docs/governance-lanes/prd-axis-coverage.md"]

# Gate input contracts are DATA so public oya-ci adopters can point gates at their own repo
# shapes without forking the engine. This default mirrors Oyatie's catalog row source.
[slo_coverage]
catalog_record_globs = ["registry/catalog/*.yaml"]

# cloud-ci-catalog-liveness (PR-C3): the founder live-OR-explicitly-marked policy. Same portable
# catalog input contract as [slo_coverage] (born pack-shaped, policy-as-data — no hardcoded oyatie
# paths in the gate logic). The producer expands these globs, resolves the LIVE workspace crate-id
# universe IN-PROCESS (no shell-out), and parses the explicit non-live marker per record.
[catalog_liveness]
catalog_record_globs = ["registry/catalog/*.yaml"]

[ttl]

[unit_class]

# This list is the accounting-registry/firewall baseline gate set, not the full
# `.github/workflows/oya-ci-required.yml` job matrix. Standalone workflow gates
# keep their own policy files. The gate-registration meta-test asserts convergence:
# every ID here has bundled disposition DATA, and every configured gate has required
# workflow authority via the homogeneous matrix, freshness job, or firewall producer path.
[[gates.enabled]]
id = "cloud-ci-total-accounting"
input_kind = "producer-face"
face = "total_accounting"

[[gates.enabled]]
id = "cloud-ci-cross-artifact-agreement"
input_kind = "producer-face"
face = "cross_artifact"

[[gates.enabled]]
