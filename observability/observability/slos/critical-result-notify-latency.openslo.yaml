apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-critical-result-notify-latency
  displayName: Critical result notification latency
  labels:
    microservice: diagnostics
    bounded_context: critical-result
    tier: tier-0
    regulatory: clia + cap + joint-commission + eu-mdr
spec:
  description: |
    Critical lab/pathology result notification latency. Target p99 <= 60
    seconds. This SLO is a regulatory bound and must remain green during all
    cell shuffle-shard operations and messenger outages (which trigger the
    bypass fallback channel per critical-result-routing.cedar).
  service: diagnostics
  indicator:
    metadata:
      name: critical-result-notify-latency
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_critical_result_notify_latency_seconds_bucket[5m])))
  objectives:
    - displayName: Notify latency p99 <= 60s
      target: 60
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
