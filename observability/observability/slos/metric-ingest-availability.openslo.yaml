# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
# Authoring authority: ADR-0130 agentic SLO-gated promotion (self-monitoring — observability monitors itself).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-metric-ingest-availability
  displayName: "observability: metric ingest (Mimir) availability 99.95%"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-observability
    pack_scope: all
spec:
  service: observability
  description: |
    Metric ingest availability SLO. A remote_write request is "good" when
    Mimir distributor returns 2xx within deadline. Every µservice in oyatie
    emits Prometheus metrics to this surface — self-monitoring blind spot
    closed by this SLO. Per ADR-0130 self-monitoring requirement.
  indicator:
    metadata:
      name: observability-mimir-distributor-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cortex_distributor_requests_total{status_code=~"2.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cortex_distributor_requests_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling metric-ingest availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
