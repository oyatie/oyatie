# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-alerting-fanout-latency
  displayName: "observability: alerting fanout latency p99 ≤ 30s (alert-to-page)"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-observability + ops-incident-response
    pack_scope: all
spec:
  service: observability
  description: |
    Alerting fanout latency p99 SLO. An alert is "good" when the time from
    alert-firing (Alertmanager fires) to notification delivery (PagerDuty /
    Slack / email page) is ≤ 30s p99. Required for incident MTTR. Per
    PRD §"Performance Targets" + threat-model T-OBS-04 stale-alert risk.
  indicator:
    metadata:
      name: observability-alert-fanout-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(alertmanager_notification_latency_seconds_bucket{le="30"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(alertmanager_notification_latency_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 30s for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
