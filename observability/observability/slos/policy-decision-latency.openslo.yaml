apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-policy-decision-latency
  displayName: Cedar policy decision latency
  labels:
    microservice: diagnostics
    binding_adr: ADR-0243
    tier: tier-0
spec:
  description: |
    Cedar policy decision latency on the default-deny hot path. Target p99 ≤ 28 ms.
  service: diagnostics
  indicator:
    metadata:
      name: policy-decision-latency
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_cedar_decision_seconds_bucket[5m])))
  objectives:
    - displayName: p99 ≤ 28ms
      target: 0.028
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
