apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-reference-range-lookup-latency
  displayName: Reference range lookup latency
  labels:
    microservice: diagnostics
    bounded_context: reference-range
    tier: tier-0
spec:
  description: |
    Reference range lookup latency keyed by (loinc, age, sex, condition_modifier).
    Target p99 ≤ 12 ms. Backed by an in-memory per-cell cache.
  service: diagnostics
  indicator:
    metadata:
      name: reference-range-lookup-latency
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_reference_range_lookup_seconds_bucket[5m])))
  objectives:
    - displayName: p99 ≤ 12ms
      target: 0.012
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
