apiVersion: openslo/v1
kind: SLO
metadata:
  name: tail-sample-fidelity
  displayName: Tail-sample fidelity (errors + slow + new-endpoint preserved)
  labels:
    microservice: observability
spec:
  service: observability
  budgetingMethod: Occurrences
  description: |
    Per ADR-0210, error traces + slow traces + new-endpoint traces MUST be 100% preserved.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(observability_trace_sampled_total{policy_kind=~"status_code_error|latency_p99|new_endpoint_warmup|audit_event|slo_burn"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(observability_trace_eligible_total{policy_kind=~"status_code_error|latency_p99|new_endpoint_warmup|audit_event|slo_burn"}[5m]))
  objectives:
    - displayName: 100% preservation of must-sample policy hits
      target: 1.0
