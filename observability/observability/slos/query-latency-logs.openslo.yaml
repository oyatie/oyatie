# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-query-latency-logs
  displayName: "observability: Loki query latency p95 ≤ 500ms"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: latency
    tier: internal-substrate
    plane: data
    owner_team: axis-observability
    pack_scope: all
spec:
  service: observability
  description: |
    Loki log-query latency p95 SLO. A LogQL query against Loki querier is
    "good" when its response time is ≤ 500ms p95 for a standard tail-window
    (per-tenant, 1h range, single stream). Per PRD §"Performance Targets"
    log-tail UX target.
  indicator:
    metadata:
      name: observability-loki-query-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(loki_request_duration_seconds_bucket{route=~"/loki/api/v1/query.*",le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(loki_request_duration_seconds_count{route=~"/loki/api/v1/query.*"}[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 500ms for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
