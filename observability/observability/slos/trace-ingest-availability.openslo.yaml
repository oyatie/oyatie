# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-trace-ingest-availability
  displayName: "observability: trace ingest (Tempo) availability 99.9%"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-observability
    pack_scope: all
spec:
  service: observability
  description: |
    Trace ingest availability SLO. A span batch push to Tempo distributor
    is "good" when it returns 2xx within deadline. Per ADR-0130 self-
    monitoring + Tempo upstream availability target.
  indicator:
    metadata:
      name: observability-tempo-distributor-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tempo_distributor_spans_received_total[5m])) - sum(rate(tempo_distributor_spans_refused_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(tempo_distributor_spans_received_total[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling trace-ingest availability ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
