apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-pathology-sign-out-to-delivery
  displayName: Pathology sign-out-to-delivery latency
  labels:
    microservice: diagnostics
    bounded_context: pathology-case + result-delivery
    tier: tier-0
spec:
  description: |
    Latency from pathologist sign-out to FHIR DiagnosticReport-pathology
    delivery outbox enqueue. Target p99 ≤ 5 seconds.
  service: diagnostics
  indicator:
    metadata:
      name: pathology-sign-out-to-delivery
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_pathology_sign_out_to_delivery_seconds_bucket[5m])))
  objectives:
    - displayName: p99 ≤ 5s
      target: 5
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
