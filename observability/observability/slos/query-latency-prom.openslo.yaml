# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-query-latency-prom
  displayName: "observability: Prometheus query latency p95 ≤ 200ms"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: latency
    tier: internal-substrate
    plane: data
    owner_team: axis-observability
    pack_scope: all
spec:
  service: observability
  description: |
    Prometheus query latency p95 SLO. A query against Mimir querier is
    "good" when its response time is ≤ 200ms p95 for a standard
    instant-query (single-metric range over 5min). Per PRD §"Performance
    Targets" interactive-dashboard requirement.
  indicator:
    metadata:
      name: observability-prom-query-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cortex_querier_request_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cortex_querier_request_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 200ms for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
