apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-hl7v2-ingest-success
  displayName: Diagnostics HL7v2 ingest success rate and throughput
  labels:
    microservice: diagnostics
    bounded_context: lab-result
    tier: tier-0
    leadership_claim: preserved-from-healthcare-integration-audit
spec:
  description: |
    HL7v2 ingest success rate and sustained throughput. The HL7v2 listener is
    owned by healthcare-integration per ADR-0245 substrate-vs-product layering;
    diagnostics consumes parsed messages. This SLO measures end-to-end ingest
    success (parsed → lab-result.post applied → audit emitted) and preserves
    the 102,800 messages/sec leadership claim.
  service: diagnostics
  indicator:
    metadata:
      name: hl7v2-ingest-success
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(diagnostics_hl7v2_ingest_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(diagnostics_hl7v2_ingest_total[5m]))
  objectives:
    - displayName: Ingest success rate p99
      target: 0.999
    - displayName: Sustained throughput floor (aggregate)
      target: 102800
      op: gte
  timeWindows:
    - duration: 30d
      isRolling: true
