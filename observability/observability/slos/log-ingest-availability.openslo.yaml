# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-log-ingest-availability
  displayName: "observability: log ingest (Loki) availability 99.95%"
  labels:
    microservice: observability
    bounded_context: slo-engine
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-observability
    pack_scope: all
spec:
  service: observability
  description: |
    Log ingest availability SLO. A push to Loki distributor is "good" when
    it returns 2xx within deadline. Per ADR-0130 self-monitoring + Loki
    upstream availability target.
  indicator:
    metadata:
      name: observability-loki-distributor-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(loki_distributor_requests_total{status_code=~"2.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(loki_distributor_requests_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling log-ingest availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
