apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-clickhouse-slo
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: observability
    oyatie.adr: "0139,0186,0193"
spec:
  groups:
    - name: clickhouse.slo.query-latency.4-window
      interval: 30s
      rules:
        - alert: ClickHouseQueryLatencyBurnRate_FastBurn
          expr: |
            histogram_quantile(0.99, sum(rate(ClickHouseProfileEvents_QueryTimeMicroseconds_bucket[5m])) by (le)) > 500000
          for: 2m
          labels:
            severity: page
            slo_window: 5m
          annotations:
            summary: "ClickHouse query p99 > 500ms — tenant-dashboard SLO at risk"
            runbook: "microservices/observability/runbooks/clickhouse.md#query-latency"

    - name: clickhouse.ingest.health
      interval: 30s
      rules:
        - alert: ClickHouseIngestBacklog
          expr: ClickHouseMetrics_PartsDelayInsert > 100
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "ClickHouse part-merge backlog (>100 parts queued)"
        - alert: ClickHouseReplicationLag
          expr: ClickHouseAsyncMetrics_ReplicasMaxAbsoluteDelay > 60
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "ClickHouse replication lag > 60s"

    - name: clickhouse.keeper.quorum
      interval: 30s
      rules:
        - alert: ClickHouseKeeperLeaderLost
          expr: absent(clickhouse_keeper_is_leader == 1)
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "ClickHouse Keeper has no leader; cluster coordination degraded"
