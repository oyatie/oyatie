apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: observability-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: observability
    oya.adr: "0186,0193"
spec:
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: observability-clickhouse
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
