# ClickHouse Keeper template — 3-replica Raft quorum.
# Referenced via useTemplates in the values.yaml ClickHouseInstallation CR.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallationTemplate
metadata:
  name: clickhouse-keeper-template
  namespace: {{ .Release.Namespace }}
  labels:
    oyatie.adr: "0193"
spec:
  configuration:
    settings:
      keeper_server/tcp_port: "9181"
      keeper_server/server_id: "1"
      keeper_server/log_storage_path: "/var/lib/clickhouse-keeper/coordination/log"
      keeper_server/snapshot_storage_path: "/var/lib/clickhouse-keeper/coordination/snapshots"
      keeper_server/coordination_settings/operation_timeout_ms: "10000"
      keeper_server/coordination_settings/session_timeout_ms: "30000"
      keeper_server/coordination_settings/raft_logs_level: "information"
    clusters:
      - name: clickhouse-keeper
        layout:
          shardsCount: 1
          replicasCount: 3
  templates:
    podTemplates:
      - name: clickhouse-keeper-pod
        spec:
          containers:
            - name: clickhouse-keeper
              image: "clickhouse/clickhouse-keeper:26.3.10.60-lts"
              ports:
                - name: keeper
                  containerPort: 9181
                - name: raft
                  containerPort: 9234
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1000m"
                  memory: "2Gi"
    volumeClaimTemplates:
      - name: clickhouse-keeper-data
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: csi-fast
          resources:
            requests:
              storage: 20Gi
