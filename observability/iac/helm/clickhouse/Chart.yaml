# Canonical-base: microservices/governance/iac/helm/_oya-helpers
apiVersion: v2
name: observability-clickhouse
description: |
  ClickHouse 26.3 LTS OLAP analytics warehouse per ADR-0193.
  Distributed cluster via ClickHouse Keeper (Raft consensus; replaces
  ZooKeeper). 3 shards × 2 replicas = 6 server nodes; 3 Keeper nodes.
  Serves tenant-facing analytics dashboards, telemetry rollups,
  audit-log query, and billing rollups.
type: application
version: 0.1.0
appVersion: "26.3.10.60"  # ADR-0193; verified LTS as of 2026-05-18
home: https://clickhouse.com/
sources:
  - https://github.com/ClickHouse/ClickHouse
keywords:
  - olap
  - columnar
  - materialized-view
  - clickhouse-keeper
  - apache-2-0
maintainers:
  - name: axis-observability
    email: axis-observability@oyatie.com
annotations:
  oya.adr/0193: olap-analytics-warehouse-clickhouse
  oya.adr/0195: stream-processing-tier
  oya.adr/0184: storage-tier-layering
  oya.layout: per-microservice-flat-layout-adr-0131
dependencies:
  # Bitnami's altinity/clickhouse-operator chart is the canonical upstream;
  # we consume via operator + ClickHouseInstallation CR.
  - name: clickhouse-operator
    version: "~0.24.0"
    repository: https://docs.altinity.com/clickhouse-operator/
    condition: clickhouse-operator.enabled
