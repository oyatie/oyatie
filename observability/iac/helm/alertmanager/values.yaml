# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
alertmanager:
  image:
    tag: "v0.28.0"
  replicaCount: 3  # consensus cluster
  config:
    route:
      group_by: ['microservice', 'severity', 'cluster']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'grafana-oncall'
      routes:
        - matchers: [severity="critical"]
          receiver: 'grafana-oncall-page'
        - matchers: [severity="warning"]
          receiver: 'grafana-oncall-ticket'
    receivers:
      - name: 'grafana-oncall'
        webhook_configs:
          - url: 'http://oya-observability-oncall.observability.svc:8080/integrations/v1/alertmanager/webhook/'
            send_resolved: true
            http_config:
              authorization:
                type: HMAC-SHA256
                credentials: "${openbao:secret/observability/oncall/webhook-hmac}"
      - name: 'grafana-oncall-page'
        webhook_configs:
          - url: 'http://oya-observability-oncall.observability.svc:8080/integrations/v1/alertmanager/webhook/?priority=page'
      - name: 'grafana-oncall-ticket'
        webhook_configs:
          - url: 'http://oya-observability-oncall.observability.svc:8080/integrations/v1/alertmanager/webhook/?priority=ticket'
    inhibit_rules:
      - source_matchers: [severity="critical", cluster_outage="true"]
        target_matchers: [severity!="critical"]
        equal: [cluster]
