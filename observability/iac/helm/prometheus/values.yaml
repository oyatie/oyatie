# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
prometheus:
  image:
    tag: "v3.2.0"
  server:
    retention: 15d  # short retention; long-term goes to Mimir
    persistentVolume:
      enabled: true
      size: 50Gi
    remoteWrite:
      - url: http://observability-mimir.observability.svc:9009/api/v1/push
        headers:
          X-Scope-OrgID: self
        write_relabel_configs:
          - source_labels: [__name__]
            regex: '(up|prometheus_.*|cortex_.*|mimir_.*)'
            action: keep
  alertmanager:
    enabled: false  # use the standalone alertmanager chart
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
