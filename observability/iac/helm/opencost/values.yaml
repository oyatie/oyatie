# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
#
# OpenCost values per ADR-0199 FinOps canonical.
# Verified versions (2026-05-18):
#   - OpenCost 1.110.0 — Apache 2.0 — CNCF incubating
#     https://www.cncf.io/projects/opencost/
#   - FOCUS 1.3 schema (ratified 2025-12-05) — https://focus.finops.org/focus-specification/
opencost:
  image:
    registry: ghcr.io
    repository: opencost/opencost
    tag: "1.110.0"

  # ---- prometheus integration (per ADR-0186 stage 2) ----
  prometheus:
    internal:
      enabled: false  # use cluster Mimir via Prometheus federation
    external:
      enabled: true
      url: "http://observability-mimir.observability.svc.cluster.local:9009/prometheus"
      headers:
        X-Scope-OrgID: self  # tenant header per multi-tenant Mimir

  # ---- canonical tenant cost labels (per ADR-0199) ----
  exporter:
    extraEnv:
      # Aggregation keys — these labels MUST be present on every workload per
      # ADR-0199 mandatory tenant labels. The check
      # `check-tenant-cost-labels-coverage` enforces label presence in
      # rendered helm output.
      CLUSTER_ID: "${CLUSTER_NAME}"
      EMIT_KSM_V1_METRICS: "false"
      EMIT_KSM_V1_METRICS_ONLY: "false"
      # Per-tenant attribution dimensions
      OPENCOST_AGGREGATION_KEYS: "tenant-id,cost-center,workload-class,regulatory-pack"
    # Configmap declaring custom-pricing overrides (per region, per-pack)
    customPricing:
      enabled: true
      configmapName: opencost-custom-pricing
      provider: "custom"  # on-prem; per-pack overlay supplies hyperscaler rates

  # ---- FOCUS 1.3 export (per ADR-0199) ----
  # Cost data export to SeaweedFS in FOCUS 1.3 schema for downstream consumption
  # by tenant billing portal + regulator-evidence emit (ADR-0174).
  cloudIntegrationSecret: opencost-cloud-integration
  cloudCost:
    enabled: true
    refreshRateHours: 6
    queryWindowDays: 7

  # ---- ui ----
  ui:
    enabled: true
    image:
      registry: ghcr.io
      repository: opencost/opencost-ui
      tag: "1.110.0"
    resources:
      requests: {cpu: "100m", memory: "256Mi"}
      limits:   {cpu: "500m", memory: "1Gi"}

  # ---- resources ----
  resources:
    requests: {cpu: "200m", memory: "512Mi"}
    limits:   {cpu: "1",    memory: "2Gi"}

  # ---- service monitor ----
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

# ---- cost anomaly alerts (per ADR-0174 + ADR-0199) ----
# Burn-rate-style alert: per-tenant rolling-7d-avg vs current spend
alertRules:
  enabled: true
  rules:
    - alert: TenantCostAnomalySpike
      # 1.5x rolling 7d avg over a 1h window
      expr: |
        sum by (tenant_id) (rate(opencost_tenant_cost_dollars_total[1h]))
          > 1.5 * avg_over_time(
              sum by (tenant_id) (rate(opencost_tenant_cost_dollars_total[1h]))[7d:1h]
            )
      for: 30m
      labels:
        severity: warning
        signal: cost-spike
      annotations:
        summary: "Tenant {{ $labels.tenant_id }} cost > 1.5x 7d baseline"
        runbook: "docs/runbooks/finops-cost-spike.md"
    - alert: TenantBudgetHeadroomLow
      # < 10% monthly budget remaining
      expr: |
        opencost_tenant_budget_remaining_ratio < 0.10
      for: 1h
      labels:
        severity: warning
        signal: budget-headroom
      annotations:
        summary: "Tenant {{ $labels.tenant_id }} budget < 10% remaining"
        runbook: "docs/runbooks/finops-budget-headroom.md"

# ---- canonical labels ----
microservice: observability
boundedContext: finops
tier: S
plane: analytics
partOf: observability

# ---- cost-attribution labels per ADR-0199 (self-attribution!) ----
costAttribution:
  costCenter: "infra-observability"
  workloadClass: "app"

# ---- canonical helm library ----
helpers:
  enabled: true
