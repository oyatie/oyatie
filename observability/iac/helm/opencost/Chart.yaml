# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: observability-opencost
description: |
  OpenCost (CNCF incubating; OSS preference over Kubecost commercial) per
  ADR-0199 FinOps cost-attribution. Aggregates per-tenant cost via mandatory
  labels (`oyatie.io/tenant-id`, `oyatie.io/cost-center`, `oyatie.io/workload-class`,
  `oyatie.io/regulatory-pack`) federated through Prometheus. FOCUS 1.3 schema
  normalization for cloud bills + cluster costs.
type: application
version: 0.1.0
appVersion: "1.110.0"  # OpenCost stable per docs/standards/finops-cost-attribution-canonical.md (verified 2026-05-18)
maintainers:
  - name: axis-observability
    email: axis-observability@oyatie.com
dependencies:
  - name: opencost
    version: "^1.110.0"
    repository: https://opencost.github.io/opencost-helm-chart
