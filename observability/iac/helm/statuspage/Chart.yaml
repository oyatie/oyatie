# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
# Skeleton authored 2026-05-18 per ADR-0168 (public status page).
# Renders the public status surface at status.oyatie.dev (and per-pack
# subdomains status.kr.oyatie.dev / status.eu.oyatie.dev) auto-derived from
# ADR-0139 SLO state, with incident narrative pushed from the
# incident-response µservice.
apiVersion: v2
name: observability-statuspage
description: Public status page per ADR-0168; auto-derived from ADR-0139 SLO state + incident-response push; cell-isolated per ADR-0009
type: application
version: 0.1.0
appVersion: "0.1.0"
maintainers:
  - name: ops-sre-reliability
dependencies:
  # Status-page projector reads SLO state via Mimir remote-read API per
  # ADR-0139 IP-003; subscribes to incident + maintenance events via
  # the ADR-0005 outbox-pattern event backbone.
  - name: postgresql
    version: "^15.0.0"
    repository: https://charts.bitnami.com/bitnami
    alias: statuspage-readside-postgres
