# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
# Skeleton values authored 2026-05-18 per ADR-0168.
# Full values tracked under registry/placeholder-debt/adr-follow-ups.yaml
# #adr-0168-statuspage-helm-impl.

statuspage:
  domain: "status.oyatie.dev"
  perPackSubdomains:
    - "status.kr.oyatie.dev"
    - "status.eu.oyatie.dev"
  cellAffinity: "cell-statuspage"  # per ADR-0009 cell isolation
  replicas: 3                       # HA at 99.99% per ADR-0168 §"Operational"
  sloSource:
    mimirRemoteReadUrl: "http://observability-mimir.observability.svc:9009/prometheus"
    pollIntervalSeconds: 15
  incidentSource:
    eventStream: "incident.timeline.updated"  # via ADR-0005 outbox
  maintenanceSource:
    eventStream: "maintenance.window.scheduled"  # via ADR-0005 outbox
  subscribers:
    email:
      enabled: true
      smtpUpstream: "mail-outbound.mail.svc:587"
    webhook:
      enabled: true
      deliveryKernel: "shared-webhook-delivery-kernel"  # per ADR-0169
    rss:
      enabled: true
  cdn:
    edgeCache:
      enabled: true
      ttlSeconds: 30  # matches ADR-0168 §"Performance budgets" 30s page-reflect
statuspage-readside-postgres:
  primary:
    persistence:
      enabled: true
      size: 20Gi
    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 1GB
