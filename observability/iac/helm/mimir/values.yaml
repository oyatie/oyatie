# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
mimir-distributed:
  image:
    tag: "3.3.0"  # LTS pin
  mimir:
    structuredConfig:
      multitenancy_enabled: true  # MANDATORY per policy/tenant-isolation.md TI-01
      limits:
        # per-tenant limits per /specs/agentic-slo-gated-promotion.json §mimir_multi_tenancy
        max_global_series_per_user: 1000000  # production tier; trial=100k, sandbox=50k, internal=10M
        ingestion_rate: 100000
        max_global_exemplars_per_user: 100000
        cardinality_analysis_enabled: true
      blocks_storage:
        backend: s3
        s3:
          endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
          bucket_name: "${OCI_MIMIR_BUCKET}"
          access_key_id: "${openbao:secret/observability/mimir/s3-access-key}"
          secret_access_key: "${openbao:secret/observability/mimir/s3-secret-key}"
      ruler:
        enable_api: true
        rule_path: /etc/mimir/rules
      compactor:
        compaction_concurrency: 1
        compaction_interval: 30m
      ingester:
        ring:
          replication_factor: 3  # per multi-region.md DR posture
      distributor:
        ring:
          kvstore:
            store: memberlist
  # Replica counts per capacity-model.md XS tier:
  distributor:
    replicas: 4
  ingester:
    replicas: 12
  querier:
    replicas: 4
  query_frontend:
    replicas: 2
  store_gateway:
    replicas: 2
  compactor:
    replicas: 2
  ruler:
    replicas: 2
