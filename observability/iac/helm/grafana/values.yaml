# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
grafana:
  image:
    tag: "12.0.0"
  replicas: 2  # HA
  persistence:
    enabled: true
    size: 10Gi
  admin:
    existingSecret: "openbao://secret/observability/grafana/admin"
  database:
    type: postgres
    host: "oya-observability-grafana-postgres"
    name: grafana
    user: "${openbao:secret/observability/grafana/postgres-user}"
    password: "${openbao:secret/observability/grafana/postgres-password}"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          url: http://oya-observability-mimir.observability.svc:9009/prometheus
          jsonData:
            httpHeaderName1: 'X-Scope-OrgID'
          secureJsonData:
            httpHeaderValue1: '${TENANT}'  # set per Grafana org per RBAC
        - name: Loki
          type: loki
          url: http://oya-observability-loki.observability.svc:3100
        - name: Tempo
          type: tempo
          url: http://oya-observability-tempo.observability.svc:3200
        - name: Pyroscope
          type: phlare
          url: http://oya-observability-pyroscope.observability.svc:4040
  dashboardsProvider:
    enabled: true
  dashboardsConfigMaps:
    - configMapName: oya-observability-dashboards  # bundles observability/dashboards/*.json
  # SSO + RBAC declared via OpenTofu; UI editing forbidden
  grafana.ini:
    security:
      disable_initial_admin_creation: false
    users:
      allow_sign_up: false
      allow_org_create: false
    auth.generic_oauth:
      enabled: true
