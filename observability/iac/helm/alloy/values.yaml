# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
alloy:
  image:
    repository: grafana/alloy
    tag: "1.6.0"  # LTS per docs/standards/observability-slo.md
  deploymentMode: "DaemonSet"  # one collector per node
  alloy:
    configMap:
      content: |
        // Receive OTLP from every workload µservice per microservices/observability/threat-model.md Trust Boundary 3
        otelcol.receiver.otlp "default" {
          grpc { endpoint = "0.0.0.0:4317" }
          http { endpoint = "0.0.0.0:4318" }
          output {
            metrics = [otelcol.exporter.prometheus.mimir.input]
            logs    = [otelcol.exporter.loki.loki.input]
            traces  = [otelcol.exporter.otlp.tempo.input]
          }
        }
        // Per-tenant X-Scope-OrgID header enforcement per policy/tenant-isolation.md TI-02
        otelcol.processor.attributes "tenant_scope" {
          action {
            key    = "X-Scope-OrgID"
            from_attribute = "service.tenant_id_hashed"
            action = "upsert"
          }
        }
        otelcol.exporter.prometheus "mimir" {
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://observability-mimir.observability.svc:9009/api/v1/push"
            headers = { "X-Scope-OrgID" = env("OYATIE_TENANT") }
          }
        }
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi" }
  serviceMonitor:
    enabled: true
