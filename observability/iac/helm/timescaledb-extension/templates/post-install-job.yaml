apiVersion: batch/v1
kind: Job
metadata:
  name: timescaledb-extension-install-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    oya.adr: "0194"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: install-timescaledb
          image: "postgres:18.4-alpine"
          env:
            - name: PGHOST
              value: "{{ .Values.postgresHost }}"
            - name: PGPORT
              value: "{{ .Values.postgresPort }}"
            - name: PGDATABASE
              value: "{{ .Values.postgresDatabase }}"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresUserSecret }}"
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.postgresUserSecret }}"
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              psql -v ON_ERROR_STOP=1 <<'EOF'
              CREATE EXTENSION IF NOT EXISTS timescaledb VERSION '{{ .Values.extensionVersion }}';
              {{- range .Values.hypertables }}
              SELECT create_hypertable(
                '{{ .name }}',
                '{{ .timeColumn }}',
                {{- if .spaceColumn }}
                partitioning_column => '{{ .spaceColumn }}',
                number_partitions => 4,
                {{- end }}
                chunk_time_interval => INTERVAL
                  {{- if eq .cardinalityClass "low" }}    '7 days'
                  {{- else if eq .cardinalityClass "medium" }} '1 day'
                  {{- else if eq .cardinalityClass "high" }}   '6 hours'
                  {{- else if eq .cardinalityClass "very_high" }} '1 hour'
                  {{- else }}                              '1 day'
                  {{- end }},
                if_not_exists => TRUE
              );
              {{- end }}
              EOF
