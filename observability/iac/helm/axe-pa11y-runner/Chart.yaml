# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (per ADR-0064)
apiVersion: v2
name: observability-axe-pa11y-runner
description: WCAG 2.2 AA / AAA accessibility CI runner per ADR-0207. Runs axe-core + pa11y as a Kubernetes Job consuming each PR's preview deployment URL; emits axe-core JSON report into the audit-chain ledger; fails CI on AA criterion violations.
type: application
version: 0.1.0
appVersion: "4.10.0"  # axe-core 4.10.x line; pa11y 8.x line
maintainers:
  - name: axis-frontend
  - name: axis-observability
