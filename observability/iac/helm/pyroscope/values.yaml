# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
pyroscope:
  image:
    tag: "1.12.0"
  pyroscope:
    structuredConfig:
      auth_enabled: true  # multi-tenancy
      storage:
        backend: s3
        s3:
          endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
          bucket_name: "${OCI_PYROSCOPE_BUCKET}"
  retention:
    profiles_retention: 336h  # 14d hot per data-residency.md
  replicas: 2
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1", memory: "2Gi" }
