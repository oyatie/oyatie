# Canonical-base: microservices/governance/iac/helm/_oya-helpers (per ADR-0064)
# OTel Collector Tail Sampling tier per ADR-0210.

opentelemetry-collector:
  mode: deployment
  replicaCount: 3                  # HPA-managed; min 3 for tail-sample buffer redundancy
  image:
    repository: otel/opentelemetry-collector-contrib  # contrib distribution includes tailsamplingprocessor
    tag: "0.108.0"

  resources:
    requests:
      cpu: 500m
      memory: 512Mi                # decision-wait buffer headroom
    limits:
      cpu: 2000m
      memory: 1Gi                  # 256Mi processor budget + headroom

  # Horizontal-Pod-Autoscaler on memory pressure (tail-sample buffer growth signal).
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 24
    targetMemoryUtilizationPercentage: 70

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 32
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Tail Sampling Processor — closed policy set per ADR-0210.
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 2000
        policies:
          # 1) Always sample error traces.
          - name: errors-100pct
            type: status_code
            status_code: { status_codes: [ERROR] }
          # 2) Always sample slow traces (p99 SLO threshold; per-µservice overrideable).
          - name: latency-p99
            type: latency
            latency: { threshold_ms: 500 }
          # 3) Always sample traces touching active SLO burn window (per ADR-0139).
          - name: slo-burn
            type: string_attribute
            string_attribute:
              key: oya.slo.burn_window_active
              values: ["true"]
              enabled_regex_matching: false
              invert_match: false
          # 4) Always sample audit-event traces (EVT-* per ADR-0145).
          - name: audit-event
            type: string_attribute
            string_attribute:
              key: oya.audit.event_id_prefix
              values: ["EVT-"]
              enabled_regex_matching: true
              invert_match: false
          # 5) New-endpoint warm-up — sampled at 100% for 30 days post-launch.
          #    Per-µservice manifest declares new_endpoints; CD writes them here.
          - name: new-endpoint-warmup
            type: string_attribute
            string_attribute:
              key: oya.endpoint.in_warmup_window
              values: ["true"]
              enabled_regex_matching: false
              invert_match: false
          # 6) Random baseline — 1% of remaining traffic.
          - name: random-baseline
            type: probabilistic
            probabilistic: { sampling_percentage: 1.0 }

      # Batch before export to keep Tempo write-amp low.
      batch:
        timeout: 5s
        send_batch_size: 1000

      # Resource enrichment — cell-id + tenant-id + SPIFFE-ID per ADR-0186 Stage 1.
      resource:
        attributes:
          - key: oya.cell.id
            from_attribute: cell.id
            action: insert
          - key: oya.tenant.id
            from_attribute: tenant.id
            action: insert

    exporters:
      # Tempo gateway (per ADR-0186 Stage 2 trace storage).
      otlp/tempo:
        endpoint: oya-observability-tempo-distributor.observability.svc:4317
        tls: { insecure: true }   # in-cluster; mTLS handled by service mesh (per ADR-0148)

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [tail_sampling, resource, batch]
          exporters: [otlp/tempo]

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
