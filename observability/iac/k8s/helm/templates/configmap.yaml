apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" .Values.microservice.id | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    oyatie.com/adr-0181: signed-image-promotion-required
    oyatie.com/adr-0349: argocd-managed
data:
  microservice: {{ .Values.microservice.id | quote }}
  cargo_package: {{ .Values.microservice.cargoPackage | quote }}
  environment: {{ .Values.config.environment | quote }}
  audit_chain_enabled: {{ .Values.config.auditChainEnabled | quote }}
  image_signature_policy: {{ .Values.config.imagePromotionPolicy | quote }}
  cosign_required: {{ .Values.image.cosign.required | quote }}
