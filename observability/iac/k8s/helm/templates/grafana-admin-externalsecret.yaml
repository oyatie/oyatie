{{- if .Values.externalSecrets.grafanaAdmin.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.grafanaAdmin.targetName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    oyatie.com/secret-source: openbao
    oyatie.com/adr-0043: secret-material-never-in-git
spec:
  refreshInterval: {{ .Values.externalSecrets.grafanaAdmin.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.grafanaAdmin.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.grafanaAdmin.secretStoreRef.kind | quote }}
  target:
    name: {{ .Values.externalSecrets.grafanaAdmin.targetName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.grafana.admin.userKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.grafanaAdmin.remoteKey | quote }}
        property: {{ .Values.externalSecrets.grafanaAdmin.userProperty | quote }}
    - secretKey: {{ .Values.grafana.admin.passwordKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.grafanaAdmin.remoteKey | quote }}
        property: {{ .Values.externalSecrets.grafanaAdmin.passwordProperty | quote }}
{{- end }}
