apiVersion: v2
name: oya-observability
description: Oyatie observability ArgoCD/dev-cell umbrella chart; production fails closed until storage and tenant policy are overridden.
type: application
version: 0.1.0
appVersion: "0.1.0"
annotations:
  oyatie.com/adr-0181: signed-image-promotion-required
  oyatie.com/adr-0254: kubernetes-everywhere
  oyatie.com/adr-0349: argocd-application-source
  oyatie.com/adr-0186: "keeps Grafana Loki/Tempo/Mimir/Grafana stack under AGPL-3 self-hosted"
  oyatie.com/adr-0383: "reconciles supersession of ADR-0042; AGPL-3 stack allowed when self-hosted"
  oyatie.com/license-class: "mixed-internal+agpl3-self-hosted"
  oyatie.com/deployment-surface: "dev-cell-umbrella; production guarded by templates/production-guard.yaml"
  oyatie.com/component-values-root: "observability/iac/helm"
  oyatie.com/dependency-resolution: "Chart.lock pinned; mirror before air-gap promotion"
dependencies:
  - name: loki
    version: 7.0.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
    # NOTE: loki 7.x is monolithic SingleBinary. mimir/tempo are distributed.
    # Intentional for single-node observability; promote to loki-distributed
    # when storage specialty pool (ADR-0381 D2) lands.
  - name: tempo-distributed
    alias: tempo
    version: 1.61.2
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: mimir-distributed
    alias: mimir
    version: 6.0.6
    repository: https://grafana.github.io/helm-charts
    condition: mimir.enabled
  - name: grafana
    version: 10.5.14
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
