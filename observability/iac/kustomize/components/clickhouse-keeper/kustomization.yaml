# Reusable ClickHouse Keeper Kustomize component per ADR-0193 §"Cluster shape".
# 3-node Raft quorum; consumed by both the observability-owned ClickHouse
# cluster and any tenant-facing analytics cluster.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - statefulset.yaml
  - service.yaml
  - configmap.yaml
  - pdb.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: clickhouse-keeper
      app.kubernetes.io/part-of: observability-clickhouse
      oyatie.adr: "0193"
