openapi: 3.2.0
info:
  title: oya-observability-slo-engine
  version: 1.0.0
  summary: REST API for the observability µservice's SLO engine — manifest CRUD, eligibility queries, release-pointer reads, on-demand burn-rate evaluation
  description: |
    Tenant-facing and operator-facing REST surface for the SLO engine. All endpoints
    require OIDC + Cedar policy authorization (per `observability/policy/*.cedar`)
    and are tenant-scoped via the X-Scope-OrgID header convention from
    `/specs/agentic-slo-gated-promotion.json` §`mimir_multi_tenancy`.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT
    carries the principal's tenant_id claim. The X-Scope-OrgID header MUST match the
    claim; mismatch returns 401.
  contact:
    name: axis-observability
    url: https://oyatie.com/teams/axis-observability
  license:
    name: Internal
servers:
  - url: https://slo-engine-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: observability
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-canonical-no-gha-residue
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/tenant-isolation.md`
    Microservice:
      in: path
      name: microservice
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    Environment:
      in: path
      name: environment
      required: true
      schema:
        type: string
        enum: [staging, production]
    Sha:
      in: path
      name: sha
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
  schemas:
    SloTarget:
      type: object
      required: [microservice, sli, target, window, error_budget]
      properties:
        microservice: {type: string}
        sli: {type: string, enum: [availability, latency, correctness, freshness]}
        target: {type: number, minimum: 0.9, maximum: 1.0}
        window: {type: string, example: "rolling 30d"}
        error_budget: {type: number}
    EligibilityVerdict:
      type: object
      required: [microservice, source_sha, target_env, verdict, evaluated_at]
      properties:
        microservice: {type: string}
        source_sha: {type: string}
        target_env: {type: string, enum: [staging, production]}
        verdict: {type: string, enum: [eligible, held, rejected, rollback]}
        evaluated_at: {type: string, format: date-time}
        evaluator_version: {type: string}
        burn_rate_snapshot:
          type: object
          properties:
            fast_burn_1h: {type: number}
            slow_burn_6h: {type: number}
            ticket_burn_3d: {type: number}
            budget_remaining_pct: {type: number}
    ReleasePointer:
      type: object
      required: [microservice, environment, current_sha]
      properties:
        microservice: {type: string}
        environment: {type: string}
        current_sha: {type: string}
        prior_sha: {type: string, nullable: true}
        advanced_at: {type: string, format: date-time}
    OpenSloManifest:
      type: object
      description: OpenSLO v1.0 manifest (subset of fields most commonly used)
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [openslo/v1]}
        kind: {type: string, enum: [SLO]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string}
            displayName: {type: string}
            labels:
              type: object
              additionalProperties: {type: string}
        spec:
          type: object
          required: [service, indicator, objectives]
          properties:
            service: {type: string}
            indicator:
              type: object
              properties:
                metadata:
                  type: object
                spec:
                  type: object
            objectives:
              type: array
              items:
                type: object
            timeWindow:
              type: array
              items:
                type: object
            budgetingMethod: {type: string, enum: [Occurrences, Timeslices]}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /microservices/{microservice}/eligibility/{environment}/{sha}:
    get:
      summary: Read the latest eligibility verdict for a (microservice, target_env, sha) tuple
      operationId: getEligibilityVerdict
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Sha'
      responses:
        '200':
          description: Verdict found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EligibilityVerdict'}
        '401':
          description: OIDC missing or X-Scope-OrgID mismatch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cedar policy denied
        '404':
          description: No verdict yet (no evaluation cycle has run)

  /microservices/{microservice}/slos:
    get:
      summary: List OpenSLO manifests for a microservice
      operationId: listOpenSloManifests
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Microservice'
      responses:
        '200':
          description: List of manifests
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OpenSloManifest'}

  /microservices/{microservice}/slos/{sli}:
    get:
      summary: Read one OpenSLO manifest by SLI name
      operationId: getOpenSloManifest
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Microservice'
        - in: path
          name: sli
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenSloManifest'}

  /microservices/{microservice}/release-pointers/{environment}:
    get:
      summary: Read the current release pointer for a (microservice, environment) tuple
      operationId: getReleasePointer
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Pointer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleasePointer'}

  /microservices/{microservice}/burn-rate/{environment}/{sli}:
    get:
      summary: Read current burn-rate values (fast 1h, slow 6h, ticket 3d, budget)
      operationId: getBurnRate
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/Environment'
        - in: path
          name: sli
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Burn-rate snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  fast_burn_1h: {type: number}
                  slow_burn_6h: {type: number}
                  ticket_burn_3d: {type: number}
                  budget_remaining_pct: {type: number}

  /validate-openslo:
    post:
      summary: Schema-validate an OpenSLO manifest (public, anonymous; see public-read.cedar)
      operationId: validateOpenSloSchema
      security: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {$ref: '#/components/schemas/OpenSloManifest'}
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
        '422':
          description: Invalid; per-line errors returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        line: {type: integer}
                        column: {type: integer}
                        message: {type: string}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: alive

  /ready:
    get:
      summary: Readiness probe (Mimir reachable + recording rules current)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
