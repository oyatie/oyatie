asyncapi: 3.0.0
info:
  title: Oyatie Diagnostics Events
  version: 2026.05.21-reconciled
  description: Lab and pathology diagnostics events. Imaging-owned events are defined by the imaging microservice.
defaultContentType: application/json
channels:
  diagnostics.lab-order.accepted:
    address: diagnostics.lab-order.accepted
    messages:
      LabOrderAccepted:
        $ref: "#/components/messages/LabOrderAccepted"
  diagnostics.lab-result.released:
    address: diagnostics.lab-result.released
    messages:
      LabResultReleased:
        $ref: "#/components/messages/LabResultReleased"
  diagnostics.lab-result.corrected:
    address: diagnostics.lab-result.corrected
    messages:
      LabResultCorrected:
        $ref: "#/components/messages/LabResultCorrected"
  diagnostics.pathology-case.signed-out:
    address: diagnostics.pathology-case.signed-out
    messages:
      PathologyCaseSignedOut:
        $ref: "#/components/messages/PathologyCaseSignedOut"
  diagnostics.critical-result.notified:
    address: diagnostics.critical-result.notified
    messages:
      CriticalResultNotified:
        $ref: "#/components/messages/CriticalResultNotified"
  diagnostics.critical-result.acknowledged:
    address: diagnostics.critical-result.acknowledged
    messages:
      CriticalResultAcknowledged:
        $ref: "#/components/messages/CriticalResultAcknowledged"
  diagnostics.reflex-test.triggered:
    address: diagnostics.reflex-test.triggered
    messages:
      ReflexTestTriggered:
        $ref: "#/components/messages/ReflexTestTriggered"
  diagnostics.quality-control.failed:
    address: diagnostics.quality-control.failed
    messages:
      QualityControlFailed:
        $ref: "#/components/messages/QualityControlFailed"
  diagnostics.lab-result.image-correlation-requested:
    address: diagnostics.lab-result.image-correlation-requested
    messages:
      ImageCorrelationRequested:
        $ref: "#/components/messages/ImageCorrelationRequested"
operations:
  publishLabOrderAccepted:
    action: send
    channel:
      $ref: "#/channels/diagnostics.lab-order.accepted"
  publishLabResultReleased:
    action: send
    channel:
      $ref: "#/channels/diagnostics.lab-result.released"
  publishLabResultCorrected:
    action: send
    channel:
      $ref: "#/channels/diagnostics.lab-result.corrected"
  publishPathologyCaseSignedOut:
    action: send
    channel:
      $ref: "#/channels/diagnostics.pathology-case.signed-out"
  publishCriticalResultNotified:
    action: send
    channel:
      $ref: "#/channels/diagnostics.critical-result.notified"
  publishCriticalResultAcknowledged:
    action: send
    channel:
      $ref: "#/channels/diagnostics.critical-result.acknowledged"
  publishReflexTestTriggered:
    action: send
    channel:
      $ref: "#/channels/diagnostics.reflex-test.triggered"
  publishQualityControlFailed:
    action: send
    channel:
      $ref: "#/channels/diagnostics.quality-control.failed"
  publishImageCorrelationRequested:
    action: send
    channel:
      $ref: "#/channels/diagnostics.lab-result.image-correlation-requested"
components:
  messages:
    LabOrderAccepted:
      payload:
        $ref: "#/components/schemas/LabOrderEvent"
    LabResultReleased:
      payload:
        $ref: "#/components/schemas/LabResultEvent"
    LabResultCorrected:
      payload:
        $ref: "#/components/schemas/LabResultEvent"
    PathologyCaseSignedOut:
      payload:
        $ref: "#/components/schemas/PathologyCaseEvent"
    CriticalResultNotified:
      payload:
        $ref: "#/components/schemas/CriticalResultEvent"
    CriticalResultAcknowledged:
      payload:
        $ref: "#/components/schemas/CriticalResultEvent"
    ReflexTestTriggered:
      payload:
        $ref: "#/components/schemas/ReflexTestEvent"
    QualityControlFailed:
      payload:
        $ref: "#/components/schemas/QualityControlEvent"
    ImageCorrelationRequested:
      payload:
        $ref: "#/components/schemas/ImageCorrelationRequestEvent"
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, tenantId, occurredAt, aggregateId]
      properties:
        eventId:
          type: string
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        aggregateId:
          type: string
        patientId:
          type: string
    LabOrderEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [orderCode, priority]
          properties:
            orderCode:
              type: string
            priority:
              type: string
    LabResultEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [observationCode, reportId]
          properties:
            observationCode:
              type: string
            reportId:
              type: string
            abnormalFlag:
              type: string
    PathologyCaseEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [caseId, pathologistId]
          properties:
            caseId:
              type: string
            pathologistId:
              type: string
    CriticalResultEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [ticketId, severity]
          properties:
            ticketId:
              type: string
            severity:
              type: string
    ReflexTestEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [triggeringResultId, followUpOrderCode]
          properties:
            triggeringResultId:
              type: string
            followUpOrderCode:
              type: string
    QualityControlEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [instrumentId, ruleId]
          properties:
            instrumentId:
              type: string
            ruleId:
              type: string
    ImageCorrelationRequestEvent:
      allOf:
        - $ref: "#/components/schemas/EventEnvelope"
        - type: object
          required: [reportId, reason]
          properties:
            reportId:
              type: string
            reason:
              type: string
              enum: [clinical-correlation, result-context, follow-up]
            targetService:
              type: string
              const: imaging
