// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.diagnostics.v1;

option go_package = "github.com/oyatie/oyatie/microservices/diagnostics/contracts/proto;diagnosticspb";

service LabOrderService {
  rpc CreateLabOrder(CreateLabOrderRequest) returns (LabOrderResponse);
  rpc GetLabOrder(GetLabOrderRequest) returns (LabOrderResponse);
}

service LabResultService {
  rpc RecordLabResult(RecordLabResultRequest) returns (LabResultResponse);
  rpc ReleaseLabResult(ReleaseLabResultRequest) returns (LabResultResponse);
}

service PathologyCaseService {
  rpc CreatePathologyCase(CreatePathologyCaseRequest) returns (PathologyCaseResponse);
  rpc SignOutPathologyCase(SignOutPathologyCaseRequest) returns (PathologyCaseResponse);
}

service CriticalResultService {
  rpc AcknowledgeCriticalResult(AcknowledgeCriticalResultRequest) returns (CriticalResultResponse);
}

service ReferenceRangeService {
  rpc ResolveReferenceRange(ResolveReferenceRangeRequest) returns (ReferenceRangeResponse);
}

service ReflexTestService {
  rpc EvaluateReflexRule(EvaluateReflexRuleRequest) returns (ReflexRuleResponse);
}

service SpecimenService {
  rpc RegisterSpecimen(RegisterSpecimenRequest) returns (SpecimenResponse);
}

service ResultDeliveryService {
  rpc HandoffResult(HandoffResultRequest) returns (HandoffResultResponse);
}

message TenantContext {
  string tenant_id = 1;
  string patient_id = 2;
  string correlation_id = 3;
}

message CreateLabOrderRequest {
  TenantContext context = 1;
  string ordered_code = 2;
  string ordering_provider_id = 3;
  string priority = 4;
  string specimen_id = 5;
}

message GetLabOrderRequest {
  TenantContext context = 1;
  string lab_order_id = 2;
}

message LabOrderResponse {
  string lab_order_id = 1;
  string status = 2;
}

message RecordLabResultRequest {
  TenantContext context = 1;
  string lab_order_id = 2;
  string observation_code = 3;
  string value = 4;
  string unit = 5;
  string abnormal_flag = 6;
}

message ReleaseLabResultRequest {
  TenantContext context = 1;
  string lab_result_id = 2;
  string authorized_by = 3;
}

message LabResultResponse {
  string lab_result_id = 1;
  string report_id = 2;
  string status = 3;
}

message CreatePathologyCaseRequest {
  TenantContext context = 1;
  string specimen_id = 2;
  string case_type = 3;
  string clinical_history = 4;
}

message SignOutPathologyCaseRequest {
  TenantContext context = 1;
  string pathology_case_id = 2;
  string pathologist_id = 3;
  string signature_hash = 4;
  string final_diagnosis = 5;
}

message PathologyCaseResponse {
  string pathology_case_id = 1;
  string status = 2;
  string report_id = 3;
}

message AcknowledgeCriticalResultRequest {
  TenantContext context = 1;
  string ticket_id = 2;
  string acknowledged_by = 3;
  string communication_method = 4;
}

message CriticalResultResponse {
  string ticket_id = 1;
  string status = 2;
}

message ResolveReferenceRangeRequest {
  TenantContext context = 1;
  string code = 2;
  string method = 3;
  string unit = 4;
}

message ReferenceRangeResponse {
  string code = 1;
  double low = 2;
  double high = 3;
  string unit = 4;
  string interpretation = 5;
}

message EvaluateReflexRuleRequest {
  TenantContext context = 1;
  string triggering_result_id = 2;
}

message ReflexRuleResponse {
  bool triggered = 1;
  string follow_up_order_code = 2;
  string rule_trace_id = 3;
}

message RegisterSpecimenRequest {
  TenantContext context = 1;
  string specimen_type = 2;
  string collected_at = 3;
  string collector_id = 4;
}

message SpecimenResponse {
  string specimen_id = 1;
  string status = 2;
}

message HandoffResultRequest {
  TenantContext context = 1;
  string report_id = 2;
  string destination = 3;
}

message HandoffResultResponse {
  string delivery_id = 1;
  string status = 2;
}
