[package]
name = "shared-hyperscaler-metrics-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Pure trait kernel (port-in-kernel per ADR-0056). No external deps; an
# adapter crate (shared-hyperscaler-metrics-adapter-prometheus) wires
# this to the prometheus client library. Per ADR-0064 canonical-base-and-
# localization-packs: this kernel is the canonical base every µservice
# integrates against to satisfy
# oya/observability/contracts/metric-naming-convention.md.

[dependencies]

[lib]
name = "shared_hyperscaler_metrics_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
