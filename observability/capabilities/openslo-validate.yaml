# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:observability:openslo-validate:v1
name: openslo-validate
namespace: observability
display_name: Validate OpenSLO Manifest Schema
description: |
  Schema-validate an OpenSLO v1.0 YAML manifest. Returns conformance status + per-line errors.
  Anonymous-allowed (no tenant scope required) because validation does not read or write tenant data.
  The endpoint does NOT persist submissions and does NOT confirm whether the SLI is reachable
  in the caller's tenant (per `policy/public-read.cedar`).

owner_team: axis-observability
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0139, ADR-0131]
related_specs: [/specs/agentic-slo-gated-promotion.json]
related_artifacts:
  - microservices/observability/contracts/openapi/slo-engine.yaml /validate-openslo path
  - microservices/observability/policy/public-read.cedar

autonomy_tier: T0
# T0 = pure validation; no state read, no state write; no tenant data touched.

inputs:
  - name: manifest_yaml
    type: bytes
    encoding: utf-8
    max_size_bytes: 1048576
    required: true

outputs:
  - name: valid
    type: boolean
  - name: errors
    type: array
    item_schema:
      line: integer
      column: integer
      message: string

data_classes_touched: []
# Anonymous endpoint; no class touched.

regulatory_packs_consumed: []
# Universal validation; no per-pack overlay.

evidence_topic: oya.observability.openslo.validate
# Validations are themselves audit-emitted to detect probing patterns.

cost_profile:
  type: per-call
  estimated_cost_usd_per_call: 0.000001
  cost_drivers:
    - YAML parse + schema-conformance check (sub-millisecond)
    - Rate-limited at WAF (10 req/s per IP)

cedar_policy_fragments:
  - microservices/observability/policy/public-read.cedar

eval_set:
  reference_inputs_path: microservices/observability/capabilities/eval/openslo-validate-reference.jsonl
  pass_threshold: 1.0
  eval_metric: validator-conformance-against-OpenSLO-v1-reference-suite
  cadence: per-release
  reference: OpenSLO v1.0 schema spec — github.com/OpenSLO/OpenSLO

sunset:
  status: none
  notes: ""
