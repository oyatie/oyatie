# Korea Localization Pack — canonical manifest (ADR-0064 §4)
# This file is the source of truth for KR pack scope, status, and pack-coverage CI.
# `docs/localization-packs/kr.md` (overview) and `docs/localization-packs/INDEX.md`
# (catalog) MUST stay consistent with this manifest; `lean-a5-doc-coverage` enforces.

pack:
  code: kr
  name: "Korea"
  status: planned                       # planned | active | maintained | retired (ADR-0064 §5)
  foundational: true                    # pack #1 — the canonical reference pack
  promotion_blockers:                   # what must ship before status flips to `active`
    - kr/corpus.lock signed
    - ≥1 µservice has overlay crate + overlay PRD + regulatory ADR shipped
    - acceptance evidence for at least one µservice signed
    - 1 paying KR tenant lives on at least one pack-covered µservice
  languages: [ko, en]
  region_codes: [KR]
  date: 2026-05-13
  owners:
    architecture: council-architecture
    gtm: gtm-customer-success-kr
    engineering: axis-foundry
  lead_milestones: [M01, M02, M03, M04, M05, M06, M07]

# µservice scope — every µservice the KR pack covers
# material_scope: true  → pack overlay PRD MUST exist (per ADR-0063 §2 / §5)
# material_scope: false → canonical PRD suffices; no pack overlay PRD required
microservices_in_scope:

  # Workforce cluster (M03 lead)
  - { microservice: hr,                  material_scope: true,  lead_milestone: M03 }
  - { microservice: payroll,             material_scope: true,  lead_milestone: M03 }
  - { microservice: accounting,          material_scope: true,  lead_milestone: M03 }
  - { microservice: ats,                 material_scope: true,  lead_milestone: M08 }
  - { microservice: grc,                 material_scope: true,  lead_milestone: M08 }
  - { microservice: performance,         material_scope: false, lead_milestone: M08 }
  - { microservice: workforce-analytics, material_scope: false, lead_milestone: M08 }

  # Healthcare cluster (M04 lead)
  - { microservice: medical,             material_scope: true,  lead_milestone: M04 }
  - { microservice: pharmacy,            material_scope: true,  lead_milestone: M04 }
  - { microservice: patient,             material_scope: true,  lead_milestone: M04 }
  - { microservice: emergency,           material_scope: true,  lead_milestone: M04 }
  - { microservice: clinical,            material_scope: true,  lead_milestone: M04 }
  - { microservice: healthcare-portal,   material_scope: true,  lead_milestone: M04 }

  # Connect cluster (M03 Pro / M05 Personal)
  - { microservice: connect,             material_scope: true,  lead_milestone: M03 }
  - { microservice: community,           material_scope: false, lead_milestone: M05 }

  # FinTech cluster (M06 lead)
  - { microservice: payments,            material_scope: true,  lead_milestone: M06 }
  - { microservice: insurance,           material_scope: true,  lead_milestone: M06 }
  - { microservice: finance-quant,       material_scope: false, lead_milestone: M06 }
  - { microservice: settlement,          material_scope: true,  lead_milestone: M06 }

  # Industrial cluster (M07 lead)
  - { microservice: manufacturing,       material_scope: true,  lead_milestone: M07 }
  - { microservice: logistics,           material_scope: true,  lead_milestone: M07 }
  - { microservice: facility-ops,        material_scope: false, lead_milestone: M07 }
  - { microservice: procurement,         material_scope: false, lead_milestone: M07 }
  - { microservice: security,            material_scope: false, lead_milestone: M07 }

  # Hospitality cluster (H4 backlog)
  - { microservice: hospitality,         material_scope: true,  lead_milestone: M12+ }
  - { microservice: dining,              material_scope: false, lead_milestone: M12+ }
  - { microservice: cellar,              material_scope: false, lead_milestone: M12+ }

