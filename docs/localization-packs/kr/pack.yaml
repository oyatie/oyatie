  - { id: emr-crosswalk-ubicare,   regimes: [유비케어 EMR],                    surface: "medical adapter",                  milestone: M04, authority: "유비케어" }
  - { id: emr-crosswalk-bitcomputer, regimes: [비트컴퓨터 EMR],                surface: "medical adapter",                  milestone: M04, authority: "비트컴퓨터" }
  - { id: 119-emergency,           regimes: [119 응급의료],                    surface: "emergency adapter",                milestone: M04, authority: "소방청" }
  - { id: pipa-b2c,                regimes: [개인정보보호법 (B2C)],            surface: "Cedar + audit chain",              milestone: M05, authority: "개인정보보호위원회" }
  - { id: efl-registration,        regimes: [전자금융업 등록],                 surface: "payments + FSS",                   milestone: M06, authority: "금융위원회 / FSS" }
