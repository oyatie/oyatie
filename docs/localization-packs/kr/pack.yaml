# Acceptance milestones — when each milestone consumes this pack
acceptance_milestones: [M03, M04, M05, M06, M07]

# Signed regulatory corpus (per Bominal ADR-0190 inheritance)
corpus_lock: "kr/corpus.lock"           # docs/localization-packs/kr/corpus.lock (TBD; signed quarterly)

# Maintenance cadence
maintenance:
  corpus_refresh: quarterly
  statutory_rate_review: monthly         # NPS / NHIS / 고용 / 산재 / 소득세 간이세액표
  recall_handling: as-issued             # KFDA / HIRA DUR list updates push via outbox

# Evidence bundle directory (per ADR-0063 §2)
evidence_dir: "kr/evidence/"             # one .md per µservice in scope when material_scope=true
