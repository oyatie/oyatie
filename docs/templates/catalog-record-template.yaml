# Catalog record per ADR-0015 flat-crates target.
# Lives at `registry/catalog/<crate-name>.yaml`. Validated by `oya catalog validate`.
name: oyatie-<context>-<role>          # MUST match Cargo package name
role: kernel | domain | app | api | worker | adapter | runtime
context: platform | saas | workspace | vertical | foundry | cloud | search | ads | analytics
plane: control | data | analytics    # per ADR-0017
slo: preview-control-plane | preview-data-plane | preview-analytics-plane | preview-audit-chain-emission
contracts_consumed:
  - <contract-id>                    # per machine-readable/contracts.json
contracts_exposed:
  - <contract-id>
regulatory_packs_consumed:
  - pack-kr | pack-jp | pack-us | pack-eu | pack-in | pack-br | pack-ksa | pack-ae | pack-au | pack-sg
lifecycle:
  state: incubating | preview | stable | deprecated | retired
  preview_since: 2026-MM-DD
  stable_since: null
  deprecated_since: null
traceability:
  github_issue: <#NNNN>
  source_adrs:
    - ADR-####
allowed_dependency_edges:
  # Per ADR-0015 dep direction: kernel←domain←app←api/worker/adapter←runtime
  - kernel
  - domain
data_classes_owned:
  - PHI | PII_IDENTIFYING | PII_QUASI_IDENTIFIER | PCI | FINANCIAL_KR_신용정보 | BEHAVIORAL_TENANT_PRODUCT | DECLARED_PREFERENCE | SEARCH_QUERY | PUBLIC | SENSITIVE_PIPA_ART23 | INTERNAL_ONLY | BEHAVIORAL_ADS
operational_classes_owned:
  - AUDIT | SECRET
autonomy_tier_required: T1 | T2 | T3 | T4   # per ADR-0022
