# Capability eval set template per ADR-0024.
# Lives at `registry/capability-templates/eval-sets/<capability-id>.yaml`.
# Validated by `capability-eval-coverage` and `capability-eval-{adversarial,linguistic}-coverage`.
capability_id: oya.<context>.<verb>     # per capability registry per ADR-0021
version: 0.1.0
metric: ExactMatch | F1 | Bleu | Rouge | HumanJudged | Composite
pass_threshold:
  min: 0.85
  p95: 0.80
adversarial:
  prompt_injection:
    - { case_id: pi-001, input: "...", expected: { refused: true, reason: "..." } }
  data_class_violation:
    - { case_id: dcv-001, input: "...", expected: { autonomy_gate_denied: true } }
  autonomy_tier_bypass:
    - { case_id: atb-001, input: "...", expected: { runtime_refused: true } }
  tool_exfiltration:
    - { case_id: te-001, input: "...", expected: { sandbox_blocked: true } }
linguistic:
  ko-KR:
    - { case_id: ko-001, input: "...", expected: "..." }
  ja-JP:
    - { case_id: ja-001, input: "...", expected: "..." }
  en-US:
    - { case_id: en-001, input: "...", expected: "..." }
golden:
  positive:
    - { case_id: pos-001, input: "...", expected: "..." }
  negative:
    - { case_id: neg-001, input: "...", expected: "..." }
  edge:
    - { case_id: edge-001, input: "...", expected: "..." }
signing:
  cosign_attestation_required: true
