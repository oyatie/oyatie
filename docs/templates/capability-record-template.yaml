#
# Capability record template — copy to registry/capability-templates/<id>.yaml
# Validates against schema at registry/quality/capability-record.schema.json
# CI gate: capability-schema-validator (must pass before publish)

id: <namespace>.<verb>          # e.g. workflow.agent.invoke; mail.compose.draft
namespace: <axis>.<surface>     # e.g. saas.workflow; workspace.mail
version: 0.1.0                  # semver; bump per ADR-0037 deprecation telemetry

description:
  agent_readable: One-paragraph agent-facing instruction describing when to invoke this capability, required inputs, returned outputs, and side effects.
  human_readable: One-paragraph human-facing docs summary for capability portals, review, support, and customer-facing explanations.

provider:
  preferred: claude-api          # day-1 routing per Foundry router
  fallback:                      # ordered failover list
    - openai-api
    - gemini-api
    - claude-subscription
    - openai-subscription
    - gemini-subscription
    - internal-<model-id>    # post W-AI-Model-Substrate

autonomy_tier_required: T2       # T1 (recommend) | T2 (flag+freeze) | T3 (execute-with-approval) | T4 (auto-execute)

data_classes_touched:            # per PRIVACY-PROGRAM §2.2.1
  - PII_QUASI_IDENTIFIER
  - BEHAVIORAL_TENANT_PRODUCT

regulatory_packs_consumed:       # per COMPLIANCE-MATRIX
  - pack-kr.PIPA
  - global.GDPR

evidence_emission_topic: oya.foundry.capability.invoked  # ADR-0003 audit-chain

cost_profile:
  input_token_cost_class: low | med | high
  output_token_cost_class: low | med | high
  per_invocation_budget_usd: 0.05  # hard ceiling; per-tenant overridable
  monthly_budget_usd: 100          # per-tenant default; admin-tunable

input_schema:                    # JSON Schema for inputs
  type: object
  properties: {}
  required: []

output_schema:                   # JSON Schema for outputs
  type: object
  properties: {}
  required: []

side_effects:
  reads_tenant_data: false
  writes_tenant_data: false
  reads_external: false
  writes_external: false
  emits_events: []
  invokes_other_capabilities: []

eval_set: capabilities/<id>/eval/golden.yaml  # required; per-capability golden tasks

sunset_policy:
  deprecation_announce: 12_months_before
  end_of_life_after_announce: 6_months
  migration_target: <new-capability-id-or-null>

owner_team: <team-id>
catalog_record_path: registry/catalog/<crate-id>.yaml
docs_path: docs.oyatie.com/capabilities/<id>/

audit:
  last_review: YYYY-MM-DD
  reviewer: <reviewer-team-id>
