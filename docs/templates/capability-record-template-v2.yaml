# ====================================================================
# RECONCILE-WITH-SIBLINGS (added 2026-05-16 by PRs-12-18 multispectrum review):
# Three capability-record-template files exist with overlapping content +
# conflicting status fields:
#   - templates/capability-record-template.yaml      [root, Status: pending approval]
#   - docs/templates/capability-record-template-v2.yaml  [THIS FILE, Status: Accepted]
#   - docs/templates/capability-record-template.yaml     [DEPRECATED v1]
# Canonical home is ambiguous. Filed as F-CAPABILITY-V1V2-CANONICAL-CLARIFY
# in registry/fixuptasks.jsonl. Until resolved, treat this
# file (Accepted, breaking-schema v2 with metadata.* nesting) as the
# functional canonical for NEW capability records.
# ====================================================================
# yaml-language-server: $schema=../../registry/quality/capability-record.schema.json
# ---
# Canonical Foundry capability record. Lives under registry/capability-templates/<id>.yaml.
# Validates against registry/quality/capability-record.schema.json. Enforced by:
#   - governance-capability-publish lane (publish gate)
#   - capability-schema-validator (CI; must pass before publish)
# Status: Accepted. Date: 2026-05-12.
# Supersedes: docs/templates/capability-record-template.yaml (preserves existing schema; adds T1-T4 autonomy enum,
#   data-class allowlist, eval-set ref, audit-chain topic, Cosign signing slot per Master Plan §2 principle 6 +
#   .omc/scratch/hyperscaler-best-practices-2026-05-12.md §Domain 4 supply chain).
# Owner: axis-foundry.
# header_note: Supersedes prior docs/templates/capability-record-template.yaml once reviewed.
# adrs_cited: ADR-0052 (inventory/audit), ADR-0053 (sanctioned primitives), ADR-0054 (scaffold-claim).
# ---

apiVersion: foundry.oyatie.dev/v1
kind: CapabilityRecord
metadata:
  id: <namespace>.<verb>                  # e.g. workflow.agent.invoke
  namespace: <axis>.<surface>             # e.g. saas.workflow
  version: 0.1.0                          # semver; bump per ADR-0037
  owner_team: <team-id>                   # per docs/teams/
  status: proposed | preview | stable | deprecated
  purpose: |
    One paragraph: what this capability does, when it MUST be invoked, what it returns.

description:
  agent_readable: |
    One paragraph agent-facing instruction. When to invoke. Required inputs. Returned
    outputs. Side effects.
  human_readable: |
    One paragraph human-facing summary. For capability portals, customer-facing docs,
    support and review.

provider:
  preferred: claude-api                   # day-1 routing per Foundry router
  fallback:                               # ordered failover
    - openai-api
    - gemini-api
    - claude-subscription
    - openai-subscription
    - gemini-subscription
    - internal-<model-id>             # post W-AI-Model-Substrate

autonomy:
  tier_required: T2                       # T1 (recommend) | T2 (flag+freeze) | T3 (execute-with-approval) | T4 (auto-execute)
  cedar_policy_ref: policies/foundry/<id>.cedar   # MUST exist when tier >= T2; governance-autonomy-ceiling enforces
  runtime_gate_ref: crates/intelligence-runtime-autonomy/src/lib.rs::AutonomyGate

data_class:
  allowlist:                              # explicit per docs/PRIVACY-PROGRAM.md §2.2.1; default-deny
    - PII_QUASI_IDENTIFIER
    - BEHAVIORAL_TENANT_PRODUCT
  blocklist:
    - PHI
    - PAYMENT_CARD_PAN
    - GOVERNMENT_ISSUED_ID

regulatory_packs_consumed:
  - pack-kr.PIPA
  - global.GDPR
  - global.HIPAA                          # only if PHI in allowlist (mutually exclusive with default blocklist)

evidence:
  audit_chain:
    emission_topic: oya.foundry.capability.invoked   # ADR-0003; inventory via ADR-0052
    fields: [capability_id, version, tenant_id, autonomy_tier, data_classes_used, provider_used, latency_ms, outcome]
  evaluation:
    eval_set_ref: capabilities/<id>/eval/golden.yaml
    adversarial_set_ref: capabilities/<id>/eval/adversarial.yaml
    linguistic_set_ref: capabilities/<id>/eval/linguistic.yaml
    min_pass_rate: 0.95                   # gate for publish

cost_profile:
  input_token_cost_class: low             # low | med | high
  output_token_cost_class: low
  per_invocation_budget_usd: 0.05
  monthly_budget_usd: 100                 # per-tenant default; admin-tunable

input_schema:
  $ref: capabilities/<id>/schema/input.schema.json    # JSON Schema; published artifact

output_schema:
  $ref: capabilities/<id>/schema/output.schema.json   # JSON Schema; published artifact

side_effects:
  reads_tenant_data: false
  writes_tenant_data: false
  reads_external: false
  writes_external: false
  emits_events: []
  invokes_other_capabilities: []

supply_chain:
  cosign_signed: true                     # SLSA L2 minimum; governance-supply-chain enforces
  cosign_signing_key_ref: keyless-oidc:github-actions-fulcio
  cosign_certificate_identity: https://github.com/oyatie/oyatie/.github/workflows/release.yaml@refs/heads/main
  rekor_log_index: <to-be-filled-at-publish>
  sbom_artifact_ref: capabilities/<id>/sbom.cdx.json  # CycloneDX or SPDX
  slsa_provenance_level: 2                # 1 | 2 | 3

sunset_policy:
  deprecation_announce_lead: 12_months
  end_of_life_after_announce: 6_months
  migration_target: <new-capability-id-or-null>

ownership:
  catalog_record_path: registry/catalog/oya-<context>-<role>.yaml
  docs_path: docs.oyatie.com/capabilities/<id>/
  raci_ref: docs/RACI-OWNERSHIP.md#capability-publish

audit:
  last_review: YYYY-MM-DD
  reviewer_team: <reviewer-team-id>
  pending_review_items: []
