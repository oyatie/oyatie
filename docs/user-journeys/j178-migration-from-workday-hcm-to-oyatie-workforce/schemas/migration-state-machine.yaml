---
doc_class: User-Journey-Migration-State-Machine
journey_id: j178-migration-from-workday-hcm-to-oyatie-workforce
date: 2026-05-20
authority_tier: 2

machine:
  id: j178-vendor-migration
  name: j178-migration-from-workday-hcm-to-oyatie-workforce
  incumbent: Workday HCM
  target: Oyatie workforce
  initial_state: planned
  terminal_states:
    - oyatie_active
    - rolled_back

states:
  - id: planned
    description: Migration scope, source objects, ADRs, and rollback plan are approved.
    transitions:
      - to: source_extracting
        when: claim_accepted_and_credentials_bound
        audit_event: EVT-J178-PLANNED-001
  - id: source_extracting
    description: Workday EIB extract with signed integration-system-user handoff.
    transitions:
      - to: extract_verified
        when: row_counts_and_hashes_match_manifest
        audit_event: EVT-J178-EXTRACT-002
  - id: extract_verified
    description: Source objects are complete and immutable for migration purposes.
    transitions:
      - to: mapping_applied
        when: all_required_field_mappings_signed
        audit_event: EVT-J178-MAPPING-003
  - id: mapping_applied
    description: Field map is loaded into the migration controller.
    transitions:
      - to: projection_loaded
        when: oyatie.workforce.worker_position_projection_v1_load_complete
        audit_event: EVT-J178-PROJECTION-004
  - id: projection_loaded
    description: Oyatie projection is populated and visible to replacement surfaces.
    transitions:
      - to: parallel_running
        when: replacement_surfaces_pass_smoke_tests
        audit_event: EVT-J178-PARALLEL-005
  - id: parallel_running
    description: two-pay-period payroll and benefits parallel run with employee self-service freeze windows.
    transitions:
      - to: go_no_go_ready
        when: p0_delta_count_zero_and_p1_deltas_owned
        audit_event: EVT-J178-GONOGO-006
      - to: rolled_back
        when: p0_delta_unresolved_or_rollback_ordered
        audit_event: EVT-J178-ROLLBACK-007
  - id: go_no_go_ready
    description: Executive go/no-go card is complete.
    transitions:
      - to: incumbent_read_only
        when: executive_approval_and_rollback_rehearsal_passed
        audit_event: EVT-J178-FREEZE-008
  - id: incumbent_read_only
    description: Incumbent writes are frozen and Oyatie receives new writes.
    transitions:
      - to: oyatie_active
        when: first_live_business_cycle_passes
        audit_event: EVT-J178-ACTIVE-009
  - id: oyatie_active
    description: Oyatie is active and incumbent is retained as read-only archive.
    is_terminal: true
  - id: rolled_back
    description: Incumbent resumes write authority and Oyatie batch is quarantined or compensated.
    is_terminal: true

invariants:
  - FLSA 29 CFR Part 516 payroll records retained for at least 3 years
  - ERISA Section 107 benefit records retained for at least 6 years
  - EEOC 29 CFR Part 1602 personnel records retained for at least 1 year and ADEA payroll records for 3 years
  - Form I-9 retention rule: 3 years after hire or 1 year after termination, whichever is later
  - GDPR Article 5(1)(e) storage limitation and Article 88 employment processing safeguards
  - Korean Labor Standards Act Article 42 employee roster and wage ledger retention
  - Every event includes tenant_id, source_system, source_hash, projection_name, cedar_decision_id, and rollback_plan_id.
  - No inline vendor credential appears in logs, schemas, events, or dashboard payloads.
