asyncapi: 3.1.0
info:
  title: j99 Cross-jurisdiction multi-pack conflict resolution events
  version: 1.0.0
  description: ADR-0263 event stream for j99-cross-jurisdiction-multi-pack-conflict-resolution.
x-oyatie:
  journey_id: j99
  binding_adrs:
    - ADR-0251-compliance-pack-cell-certification-levels
    - ADR-0242-oyatie-is-a-tenant-doctrine
    - ADR-0243-cedar-as-universal-gate
    - ADR-0244-tenant-as-universal-scoping-primitive
    - ADR-0248-amazon-shape-cellular-architecture
    - ADR-0263-observability-emission-contract
    - ADR-0131-per-microservice-flat-layout
    - ADR-0105-thirteen-layer-canonical-enum
  pack_overlays:
    - EU-GDPR
    - US-CCPA
    - KR-PIPA
    - AU-PRIVACY-ACT
channels:
  journeys/j99/pack-overlay-events:
    address: journeys/j99/pack-overlay-events
    messages:
      PackOverlayDecision:
        $ref: "#/components/messages/PackOverlayDecision"
operations:
  publishJ99PackOverlayDecision:
    action: send
    channel: { $ref: '#/channels/journeys/j99/pack-overlay-events' }
components:
  messages:
    PackOverlayDecision:
      payload:
        type: object
        required: [journey_id, tenant_id, pack_id, article_ref, cedar_decision, audit_event_class]
        properties:
          journey_id: { type: string, const: j99 }
          tenant_id: { type: string }
          pack_id: { type: string }
          article_ref: { type: string }
          cedar_decision: { type: string, enum: [permit, forbid, abstain] }
          audit_event_class: { type: string }
          evidence_hash: { type: string }
