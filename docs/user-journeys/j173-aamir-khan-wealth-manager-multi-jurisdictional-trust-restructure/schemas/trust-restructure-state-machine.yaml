---
doc_class: User-Journey-State-Machine
journey_id: j173-aamir-khan-wealth-manager-multi-jurisdictional-trust-restructure
date: 2026-05-20
authority_tier: 2

machine:
  id: client-family-amht-restructure-2027
  name: multi-jurisdictional-trust-restructure-lifecycle
  description: 9-state engagement lifecycle for multi-jurisdictional HNW trust restructure under OECD CRS + FATCA + MiFID II + DIFC Trust Law + UK Trustee Act + SG Trust Companies Act + Cayman STAR + AML5.
  initial_state: structuring
  terminal_states:
    - settlement_complete
    - archive

states:
  - id: structuring
    description: Engagement letter executed; tax-scenario ML compute; pack manifest activation.
    on_entry:
      - emit_event: EVT-J173-COCKPIT-OPENED-Δ000
      - emit_event: EVT-J173-PACK-MANIFEST-008 (preliminary)
      - emit_event: EVT-J173-TAX-SCENARIO-COMPUTED-Δ001b
    transitions:
      - to: drafting
        when: tax_scenario_recommendations_accepted
        cedar_permit: wealth_manager + STEP_TEP

  - id: drafting
    description: 6 documents drafted by their owner firms.
    on_entry:
      - emit_event: EVT-J173-CLM-WORKFLOW-OPENED-001
      - emit_event: EVT-J173-STEP-CHANNEL-OPENED-Δ001
    transitions:
      - to: counsel_cross_review
        when: all_documents_first_drafts_complete
        cedar_permit: counsel_per_owner_firm

  - id: counsel_cross_review
    description: 4-round counsel cross-review across 3 firms with redlines + comments.
    on_entry:
      - emit_event: EVT-J173-CLM-DOC-REDLINE-Δ{x} (per redline)
      - emit_event: EVT-J173-COUNSEL-CROSS-REVIEW-002 (composite at round close)
    transitions:
      - to: cgt_clearance
        when: all_documents_final_counsel_review_complete
        cedar_permit: counsel + cross_jurisdiction_bar
      - to: family_review
        when: cgt_clearance_already_in_place
        cedar_permit: counsel

  - id: cgt_clearance
    description: HMRC CGT clearance application + grant (Mishcon driving).
    on_entry:
      - emit_event: EVT-J173-HMRC-CGT-CLEARANCE-APPLIED-Δ006a
      - emit_event: EVT-J173-CGT-CLEARANCE-006
      - emit_event: EVT-J173-CRS-REISSUED-Δ004a
      - emit_event: EVT-J173-FATCA-FORM-REISSUED-Δ004b
    transitions:
      - to: family_review
        when: hmrc_clearance_granted + crs_reissued + fatca_reissued
        cedar_permit: wealth_manager + compliance

  - id: family_review
    description: Family principals receive 6 documents + counsel opinions + CGT clearance for 72h review.
    on_entry:
      - emit_event: EVT-J173-FAMILY-REVIEW-REQUESTED-Δ002b
    transitions:
      - to: family_sign
        when: all_family_principals_complete_review
        cedar_permit: family_principals + KYC

  - id: family_sign
    description: 4 family principals sign 6 documents asynchronously (Saira from Dubai, Khalid from London, Aisha from Edinburgh, Yusuf from Geneva).
    on_entry:
      - emit_event: EVT-J173-FAMILY-SIGN-003-{principal} (per principal)
      - emit_event: EVT-J173-FAMILY-SIGN-003 (composite)
    transitions:
      - to: consolidation_transfer
        when: all_4_signing_principals_complete
        cedar_permit: clm_engagement + all_signatures_complete

  - id: consolidation_transfer
    description: $42M consolidation via 3 SWIFT MT103 legs with sanctions + AML screening.
    on_entry:
      - emit_event: EVT-J173-SANCTIONS-SCREEN-CLEAN-Δ005a
      - emit_event: EVT-J173-AML-SCREEN-CLEAN-Δ005b
      - emit_event: EVT-J173-MT103-LEG{1..3}-Δ005{c..e}
      - emit_event: EVT-J173-CONSOLIDATION-TRANSFER-005
      - emit_event: EVT-J173-CONSOLIDATION-RECONCILED-Δ005f
    transitions:
      - to: attestation
        when: reconciliation_ok
        cedar_permit: wealth_manager + payments

  - id: attestation
    description: Per-document Merkle anchor + jurisdiction-aware WORM + DTAA optimization attestation.
    on_entry:
      - emit_event: EVT-J173-MERKLE-DOC-{n}-Δ009{a..f}
      - emit_event: EVT-J173-MERKLE-PER-DOCUMENT-009
      - emit_event: EVT-J173-WORM-JURISDICTION-AWARE-010
      - emit_event: EVT-J173-DTAA-OPTIMIZATION-007
    transitions:
      - to: settlement_complete
        when: all_attestations_emitted
        cedar_permit: wealth_manager + audit_chain + drive

  - id: settlement_complete
    description: Engagement complete; all attestations + WORM in place; STEP-privileged channel preserved.
    on_entry:
      - emit_event: EVT-J173-SETTLEMENT-COMPLETE-Δ010
      - emit_event: EVT-J173-PACK-MANIFEST-008 (final)
      - emit_event: EVT-J173-CEDAR-DENY-COVERAGE-011
    is_terminal: true

  - id: archive
    description: Long-term archive state; 12y WORM retention (longest applicable per UK Limitation Act 1980).
    note: Reached after settlement_complete + retention period unlock.
    is_terminal: true

transitions_invariants:
  - step_privileged_channel_must_be_tetrad_4_members_only
  - cross_jurisdiction_bar_attestation_required_for_counsel_redlines
  - kyc_required_for_every_family_signature
  - mifid_ii_suitability_required_for_uk_domicile_family_principals
  - sanctions_screening_clean_required_before_payment_initiation
  - aml_screening_pass_required_before_payment_initiation
  - merkle_anchor_proof_class_must_be_inclusion_proof_only_without_payload
  - jurisdiction_worm_cell_must_match_document_applicable_jurisdiction
  - per_jurisdiction_retention_must_meet_minimum_uk_12y_uae_8y_sg_7y_ky_6y
  - pack_manifest_cross_validation_required_before_settlement_complete

retention:
  uk_documents_retention_years: 12 (UK Limitation Act 1980)
  uae_documents_retention_years: 8 (DIFC Trust Law 5/2018 §22)
  sg_documents_retention_years: 7 (Singapore Trust Companies Act 2005)
  ky_documents_retention_years: 6 (Cayman Trust Law)
  step_privileged_channel_retention_years: 12 (longest applicable)

tax_authority_compulsion_paths:
  - id: HMRC
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: UK_court_order + counsel_review
  - id: IRS_FATCA
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: US_court_order + counsel_review
  - id: OECD_CRS_competent_authority
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: competent_authority_order
  - id: DFSA_DIFC
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: DFSA_order
  - id: MAS_Singapore
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: SG_court_order
  - id: CIMA_Cayman
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: KY_court_order

audit_events:
  - id: EVT-J173-COCKPIT-OPENED-Δ000
    state: structuring
  - id: EVT-J173-PACK-MANIFEST-008
    state: structuring + settlement_complete
  - id: EVT-J173-TAX-SCENARIO-COMPUTED-Δ001b
    state: structuring
  - id: EVT-J173-CLM-WORKFLOW-OPENED-001
    state: drafting
  - id: EVT-J173-STEP-CHANNEL-OPENED-Δ001
    state: drafting
  - id: EVT-J173-COUNSEL-CROSS-REVIEW-002
    state: counsel_cross_review
  - id: EVT-J173-HMRC-CGT-CLEARANCE-APPLIED-Δ006a
    state: cgt_clearance
  - id: EVT-J173-CGT-CLEARANCE-006
    state: cgt_clearance
  - id: EVT-J173-CRS-REISSUED-Δ004a
    state: cgt_clearance
  - id: EVT-J173-FATCA-FORM-REISSUED-Δ004b
    state: cgt_clearance
  - id: EVT-J173-FAMILY-REVIEW-REQUESTED-Δ002b
    state: family_review
  - id: EVT-J173-FAMILY-SIGN-003
    state: family_sign
  - id: EVT-J173-SANCTIONS-SCREEN-CLEAN-Δ005a
    state: consolidation_transfer
  - id: EVT-J173-AML-SCREEN-CLEAN-Δ005b
    state: consolidation_transfer
  - id: EVT-J173-CONSOLIDATION-TRANSFER-005
    state: consolidation_transfer
  - id: EVT-J173-MERKLE-PER-DOCUMENT-009
    state: attestation
  - id: EVT-J173-WORM-JURISDICTION-AWARE-010
    state: attestation
  - id: EVT-J173-DTAA-OPTIMIZATION-007
    state: attestation
  - id: EVT-J173-SETTLEMENT-COMPLETE-Δ010
    state: settlement_complete
  - id: EVT-J173-CEDAR-DENY-COVERAGE-011
    state: settlement_complete
