// j173 — Multi-jurisdictional trust restructure proto3 message definitions
// ADR-0243 + ADR-0244 + ADR-0245 + ADR-0247 + ADR-0251 + ADR-0252 + ADR-0253 + ADR-0263

syntax = "proto3";

package oyatie.user_journeys.j173.v1;

import "google/protobuf/timestamp.proto";

// ============================================================
// Enums
// ============================================================

enum EngagementState {
  ENGAGEMENT_STATE_UNSPECIFIED = 0;
  STRUCTURING = 1;
  DRAFTING = 2;
  COUNSEL_CROSS_REVIEW = 3;
  FAMILY_REVIEW = 4;
  FAMILY_SIGN = 5;
  CGT_CLEARANCE = 6;
  CONSOLIDATION_TRANSFER = 7;
  SETTLEMENT_COMPLETE = 8;
  ARCHIVE = 9;
}

enum Jurisdiction {
  JURISDICTION_UNSPECIFIED = 0;
  UK = 1;
  UAE = 2;
  UAE_DIFC = 3;
  SG = 4;
  KY = 5;
  CH = 6;  // Geneva (Yusuf signs from)
  US = 7;  // FATCA-only path
}

enum DocumentState {
  DOCUMENT_STATE_UNSPECIFIED = 0;
  DRAFTING = 1;
  COUNSEL_CROSS_REVIEW_R1 = 2;
  COUNSEL_CROSS_REVIEW_R2 = 3;
  COUNSEL_CROSS_REVIEW_R3 = 4;
  FINAL_COUNSEL_REVIEW = 5;
  FAMILY_REVIEW = 6;
  FAMILY_SIGN = 7;
  EXECUTED = 8;
  ANCHORED = 9;
  WORM_SEALED = 10;
}

enum PayloadClass {
  PAYLOAD_CLASS_UNSPECIFIED = 0;
  COUNSEL_CLARIFICATION = 1;
  TAX_POSITION_DRAFTING = 2;
  CROSS_REFERENCE_RECONCILIATION = 3;
  FAMILY_PRINCIPAL_PROXY_QUESTION = 4;
  HMRC_CLEARANCE_DRAFTING = 5;
}

enum TaxAuthorityCompulsionPath {
  TAX_AUTHORITY_COMPULSION_PATH_UNSPECIFIED = 0;
  HMRC = 1;
  IRS_FATCA = 2;
  OECD_CRS_COMPETENT_AUTHORITY = 3;
  DFSA_DIFC = 4;
  MAS_SINGAPORE = 5;
  CIMA_CAYMAN = 6;
}

enum ProofClass {
  PROOF_CLASS_UNSPECIFIED = 0;
  INCLUSION_PROOF_ONLY_WITHOUT_PAYLOAD = 1;
  PAYLOAD_DISCLOSURE_WITH_COURT_ORDER = 2;
}

enum SanctionsList {
  SANCTIONS_LIST_UNSPECIFIED = 0;
  OFAC_SDN = 1;
  UK_HMT_CONSOLIDATED = 2;
  EU_CONSOLIDATED = 3;
  UN_CONSOLIDATED = 4;
  UAE_LOCAL = 5;
  CIMA_KY_SANCTIONS = 6;
}

enum AMLFramework {
  AML_FRAMEWORK_UNSPECIFIED = 0;
  AMLD5 = 1;
  UK_MLR_2017 = 2;
  UAE_FDL_20_2018 = 3;
  MAS_NOTICE_626 = 4;
  KY_MLR = 5;
}

// ============================================================
// Common types
// ============================================================

message PrincipalRef {
  string principal_id = 1;
  string tenant_id = 2;
  string tenant_class = 3;
}

message TrustDocument {
  string doc_id = 1;
  string title = 2;
  Jurisdiction jurisdiction = 3;
  string owner_firm_principal = 4;
  repeated string cross_review_firm_principals = 5;
  repeated string applicable_packs = 6;
  DocumentState state = 7;
  string content_sha256 = 8;
}

message CounselFirmAssignment {
  string firm_tenant_id = 1;
  string lead_principal = 2;
  string supporting_principal = 3;
  repeated Jurisdiction bar_attestation_jurisdictions = 4;
}

message FamilyPrincipalRef {
  string principal_id = 1;
  string domicile_class = 2;  // "uk_domicile" | "uae_residence" | "ch_residence" | etc.
  Jurisdiction kyc_jurisdiction = 3;
  bool mifid_ii_required = 4;
  bool signing_party = 5;
}

// ============================================================
// CLM workflow
// ============================================================

message OpenCLMWorkflowRequest {
  string engagement_id = 1;
  repeated TrustDocument documents = 2;
  repeated CounselFirmAssignment counsel_assignments = 3;
  repeated FamilyPrincipalRef family_signing_parties = 4;
  string workflow_class = 5;
  google.protobuf.Timestamp opened_at = 6;
}

message RedlineSubmitRequest {
  string doc_id = 1;
  string redline_id = 2;
  string section = 3;
  bytes redline_text_b64 = 4;
  PrincipalRef redline_source_principal = 5;
  bool step_privileged_class = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message CrossCounselCommentRequest {
  string doc_id = 1;
  string comment_id = 2;
  Jurisdiction perspective_jurisdiction = 3;
  PrincipalRef commenter_principal = 4;
  bytes comment_text_b64 = 5;
  bool step_privileged_class = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

// ============================================================
// STEP-privileged channel
// ============================================================

message OpenSTEPPrivilegedChannelRequest {
  string channel_id = 1;
  string engagement_id = 2;
  string channel_class = 3;
  repeated PrincipalRef permitted_principals = 4;
  string retention_class = 5;
  string cell_primary = 6;
  string mls_group_id = 7;
  string metadata_visibility = 8;
}

message SendSTEPPrivilegedMessageRequest {
  string channel_id = 1;
  PrincipalRef sender_principal = 2;
  PayloadClass payload_class = 3;
  bytes mls_encrypted_payload = 4;
  google.protobuf.Timestamp sent_at = 5;
}

// ============================================================
// Tax-scenario intelligence
// ============================================================

message TaxScenarioComputeRequest {
  string engagement_id = 1;
  string scenario_class = 2;
  string model_id = 3;
  TaxScenarioInputs inputs = 4;
}

message TaxScenarioInputs {
  int64 uk_pilot_trust_2019_baseline_market_value_gbp = 1;
  int64 uk_pilot_trust_2027_disposal_value_gbp = 2;
  double uk_trustee_cgt_rate_2027 = 3;
  bool ddt_holdover_relief_applicable = 4;
  repeated string dtaa_paths_to_evaluate = 5;
}

message TaxScenarioResult {
  string scenario_id = 1;
  int64 effective_uk_cgt_after_holdover_gbp = 2;
  repeated DTAAPath dtaa_paths_evaluated = 3;
  double confidence_score = 4;
  string model_provenance = 5;
  repeated string recommendations = 6;
}

message DTAAPath {
  string treaty = 1;
  string applied_to = 2;
  string treaty_benefit = 3;
  int64 effective_tax_position_gbp = 4;
  repeated string evidence_anchor_ids = 5;
}

// ============================================================
// HMRC CGT clearance
// ============================================================

message HMRCCGTClearanceApplyRequest {
  string application_id = 1;
  PrincipalRef applicant_firm_principal = 2;
  string trust_in_scope = 3;
  int64 disposal_value_gbp = 4;
  string tcga_section_basis = 5;
  string holdover_relief_claim = 6;
  bool expedited_request = 7;
  string expedited_reason = 8;
  google.protobuf.Timestamp submitted_at = 9;
}

message HMRCCGTClearanceGrantResponse {
  string application_id = 1;
  string decision = 2;
  repeated string conditions = 3;
  PrincipalRef granting_ccm_principal = 4;
  google.protobuf.Timestamp granted_at = 5;
}

// ============================================================
// CRS + FATCA reissuance
// ============================================================

message CRSEntityClassification {
  string legal_name = 1;
  Jurisdiction jurisdiction_of_trust = 2;
  string crs_status = 3;
  repeated Jurisdiction reportable_jurisdictions = 4;
  string giin_pending = 5;
}

message CRSReissueRequest {
  string engagement_id = 1;
  repeated CRSEntityClassification new_entities = 2;
}

message FATCAFormReissueRequest {
  string engagement_id = 1;
  repeated string new_entities = 2;
  string iga_classification = 3;
  repeated string annex_ii_path = 4;
  bool us_person_beneficial_owner_identified = 5;
}

// ============================================================
// Family signing
// ============================================================

message FamilyReviewRequest {
  string engagement_id = 1;
  repeated PrincipalRef review_recipients = 2;
  repeated string documents = 3;
  string explanatory_memo_url = 4;
  repeated string counsel_opinions_urls = 5;
  string cgt_clearance_url = 6;
  bool mifid_ii_suitability_acknowledgment_required_for_uk_principals = 7;
  uint32 review_window_hours = 8;
}

message FamilySignatureRequest {
  string doc_id = 1;
  PrincipalRef signing_principal = 2;
  string kyc_attestation_id = 3;
  string kyc_method = 4;
  string signature_method = 5;
  string mifid_ii_suitability_acknowledgment_id = 6;
  google.protobuf.Timestamp signed_at = 7;
  string hlc_timestamp = 8;
  string language_of_acknowledgment = 9;
}

// ============================================================
// Sanctions + AML screening
// ============================================================

message SanctionsScreenRequest {
  string screening_id = 1;
  repeated SanctionsList lists = 2;
  repeated string principals_to_screen = 3;
}

message SanctionsScreenResult {
  string screening_id = 1;
  uint32 total_hits = 2;
  uint32 fuzzy_matches_within_threshold = 3;
  bool manual_review_required = 4;
  string status = 5;
}

message AMLScreenRequest {
  string screening_id = 1;
  repeated AMLFramework frameworks = 2;
  string source_of_funds_verification_class = 3;
  bool beneficial_ownership_documented = 4;
  repeated string pep_principals = 5;
  bool pep_risk_assessment_attached = 6;
  string high_risk_jurisdiction_exposure = 7;
}

// ============================================================
// SWIFT MT103
// ============================================================

message SwiftMT103DispatchRequest {
  string message_id = 1;
  string sender_bic = 2;
  string receiver_bic = 3;
  string field_20_transaction_reference = 4;
  string field_32a_value_currency_amount = 5;
  string field_50_ordering_customer = 6;
  string field_59_beneficiary_customer = 7;
  string field_70_remittance_information = 8;
  string cover_mt202_via = 9;
  google.protobuf.Timestamp dispatched_at = 10;
}

message ConsolidationTransferReconciliation {
  string engagement_id = 1;
  int64 expected_total_usd = 2;
  int64 actual_arrived_usd = 3;
  int64 discrepancy_usd = 4;
  string discrepancy_explanation = 5;
  string reconciliation_state = 6;
  string destination_account = 7;
  google.protobuf.Timestamp reconciled_at = 8;
}

// ============================================================
// Merkle anchor
// ============================================================

message TaxPositionAnchorRequest {
  string anchor_id = 1;
  string engagement_id = 2;
  string doc_id = 3;
  Jurisdiction jurisdiction = 4;
  bytes merkle_root = 5;
  repeated TaxAuthorityCompulsionPath compulsion_paths = 6;
  ProofClass proof_class = 7;
  string external_transparency_log_batch = 8;
  google.protobuf.Timestamp emitted_at = 9;
}

// ============================================================
// Jurisdiction-aware WORM
// ============================================================

message JurisdictionWORMWriteRequest {
  string engagement_id = 1;
  string doc_id = 2;
  Jurisdiction jurisdiction = 3;
  string worm_cell = 4;
  uint32 retention_years_minimum = 5;
  string retention_basis_id = 6;
  string seal_class = 7;
  bool indelible_storage_attestation = 8;
  string merkle_anchor_id = 9;
}

// ============================================================
// DTAA attestation
// ============================================================

message DTAAAttestation {
  string engagement_id = 1;
  repeated DTAAPath dtaa_attestations = 2;
  google.protobuf.Timestamp asserted_at = 3;
}

// ============================================================
// Pack manifest
// ============================================================

message PackManifestAssertion {
  string engagement_id = 1;
  repeated string active_packs = 2;
  string cross_validation_state = 3;
  string pack_manifest_signature = 4;
  google.protobuf.Timestamp asserted_at = 5;
}

// ============================================================
// Cedar deny coverage
// ============================================================

message CedarDenyCoverageReport {
  string engagement_id = 1;
  uint32 denied_step_privileged_enumeration = 2;
  uint32 denied_sign_without_kyc = 3;
  uint32 denied_consolidation_pre_sanctions = 4;
  uint32 total_denied = 5;
  uint32 observability_redaction_pct = 6;
}

// ============================================================
// Audit event envelope
// ============================================================

message AuditEvent {
  string event_id = 1;
  string event_class = 2;
  string engagement_id = 3;
  PrincipalRef actor_principal = 4;
  Jurisdiction jurisdiction = 5;
  bool cross_jurisdiction_call = 6;
  string cedar_permit_id = 7;
  google.protobuf.Timestamp emitted_at = 8;
}
