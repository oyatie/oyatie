// j160 — Tomáš Horák cleaning-co cross-tenant bid + onboard RPC messages
// proto3; package versioned per ADR-0244 tenant scoping
// Diacritic + multi-script preservation: ALL string fields are UTF-8 NFC; no transliteration.
// Cross-tenant audit dual-seal mandatory under ADR-0263.

syntax = "proto3";

package oya.journeys.j160.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // UTF-8 NFC; e.g. tomas.horak@uklid-horak-sro-plzen-cz
  string home_tenant = 2;
  string acting_tenant = 3;
  enum TenantClass {
    BUSINESS_TENANT = 0;
    CLIENT_TENANT = 1;
    STATE_TENANT = 2;
    COMMUNITY_TENANT = 3;
  }
  TenantClass tenant_class = 4;
  string passkey_assertion_b64 = 5;
  repeated string roles_in_acting_tenant = 6;
  string cz_business_ic = 7;          // Czech business IČ, 8 digits
  bool business_register_verified_via_ARES = 8;
  bool cz_vat_id_active = 9;
  repeated string active_certifications = 10;  // ISSA-CIMS-2024, ISO-9001, ČSN-262-2006 etc.
  repeated string completed_trainings = 11;
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;                    // e.g. eu-prague-primary
  string trace_id = 3;
  string locale = 4;                  // cs-CZ primary
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  repeated string sealing_tenants = 6;
  bool truetime_class = 7;
  uint32 truetime_uncertainty_ms = 8;
}

message DiacriticPolicy {
  string unicode_normalization = 1;   // MUST be "NFC"
  bool diacritics_preserved = 2;      // MUST be true
  bool czech_diacritics_strict = 3;
  bool vietnamese_tones_preserved = 4;
  bool slovak_diacritics_strict = 5;
  bool cyrillic_native_or_transliterated = 6;  // user-choice; both stored
  bool transliterate_to_ascii = 7;    // forbidden unless explicit consent
}

// ---------- §1 Marketplace bid ----------

message BidRequest {
  string bid_id = 1;
  string issuing_tenant = 2;
  string title_cs = 3;                // UTF-8 NFC Czech
  string title_en = 4;
  string service_class = 5;
  message SiteAreaM2Breakdown {
    uint32 production = 1;
    uint32 warehouse = 2;
    uint32 admin = 3;
    uint32 common = 4;
  }
  SiteAreaM2Breakdown site_area_m2_breakdown = 6;
  message ContractWindow {
    string start_date = 1;
    string end_date = 2;
    uint32 months = 3;
  }
  ContractWindow contract_window = 7;
  uint64 max_annual_excl_vat_czk = 8;
  uint32 csn_en_13549_min_grade = 9;
  bool iso_9001_required = 10;
  google.protobuf.Timestamp bid_deadline = 11;
  DiacriticPolicy diacritic_policy = 12;
}

message BidSubmitRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string bid_id = 3;
  uint64 bid_total_excl_vat_czk = 4;
  uint64 bid_total_with_vat_czk = 5;
  double vat_rate_pct = 6;
  uint32 bid_window_months = 7;
  string line_items_ref = 8;
  repeated string attachments = 9;
  bytes narrative_cover_letter_b64 = 10;
  bool ares_business_register_verified = 11;
  string cz_vat_id = 12;
  google.protobuf.Timestamp submitted_at = 13;
  DiacriticPolicy diacritic_policy = 14;
}

message BidSubmitResponse {
  string bid_submission_id = 1;
  string status = 2;                  // submitted | accepted_after_evaluation | rejected_post_evaluation
  AuditAnchor audit = 3;
}

// ---------- §2 Award + workflow advance ----------

message AwardNotificationRequest {
  Principal principal = 1;
  string bid_id = 2;
  string award_decision = 3;          // accepted | rejected
  string awarding_tenant = 4;
  string awarded_tenant = 5;
  google.protobuf.Timestamp decided_at = 6;
}

message WorkflowTransitionRequest {
  string instance_id = 1;
  string from_state = 2;
  string to_state = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  repeated string evidence_links = 5;
  Principal initiating_principal = 6;
}

// ---------- §3 Contract ----------

message ContractDraftRevisionRequest {
  Principal principal = 1;
  string contract_id = 2;
  uint32 revision_number = 3;
  bytes draft_content_b64 = 4;
  string change_summary_cs = 5;
}

message QesSignDualTenantRequest {
  string contract_id = 1;
  message Signatory {
    Principal principal = 1;
    string qes_provider = 2;          // I.CA | SecuSign | PostSignum
    string qes_certificate_serial = 3;
    google.protobuf.Timestamp signed_at = 4;
    bool eidas_qualified = 5;
  }
  repeated Signatory signatories = 2;
  uint32 truetime_uncertainty_ms = 3;
  uint64 contract_value_excl_vat_czk = 4;
  uint32 contract_months = 5;
}

// ---------- §4 Datová schránka ----------

message DatovaSchrankaNotificationRequest {
  string ic_owner = 1;
  string ic_counterparty = 2;
  string notification_class = 3;      // contract_execution_metadata | invoice_metadata | etc.
  string contract_hash_sha256 = 4;
  uint64 contract_value_czk = 5;
  google.protobuf.Timestamp notified_at = 6;
}

// ---------- §5 Crew hiring + employment ----------

message CrewSelectionRequest {
  Principal principal = 1;
  string contract_id = 2;
  repeated string selected_employee_ids = 3;
  repeated string internal_rotation_employee_ids = 4;
  repeated string new_hire_offer_ids = 5;
}

message OsszRegistrationRequest {
  string employer_ic = 1;
  message Employee {
    string legal_name_strict_form_nfc = 1;
    string birth_date = 2;
    string rodne_cislo = 3;
    string residence_address_cz = 4;
    string permanent_residence_status = 5;
    string contract_class = 6;
    string start_date = 7;
  }
  Employee employee = 2;
  DiacriticPolicy diacritic_policy = 3;
  bool within_8_day_window = 4;
}

message ZpRegistrationRequest {
  string employer_ic = 1;
  string employee_legal_name_strict_form_nfc = 2;
  string rodne_cislo = 3;
  enum ZpClass {
    VZP = 0;
    OZP = 1;
    ZPMV = 2;
    VOZP = 3;
    RBP = 4;
    ZP_MA = 5;
    CPZP = 6;
  }
  ZpClass zp_class = 4;
  string start_date = 5;
}

message FuTaxRegistrationRequest {
  string employer_ic = 1;
  string employee_legal_name_strict_form_nfc = 2;
  string rodne_cislo = 3;
  string tax_office_local_id = 4;
  string start_date = 5;
}

// ---------- §6 Training ----------

message TrainingEnrollmentRequest {
  string course_id = 1;
  repeated string enrolled_principals = 2;
  google.protobuf.Timestamp delivery_window_start = 3;
  google.protobuf.Timestamp delivery_window_end = 4;
  uint32 delivery_hours = 5;
  bool assessment_required = 6;
  string instructor = 7;
}

message TrainingCompletionEvent {
  string course_id = 1;
  string completing_principal = 2;
  google.protobuf.Timestamp completed_at = 3;
  uint32 assessment_score_pct = 4;
  string cert_id_issued = 5;
}

// ---------- §7 Biometric badge cross-tenant ----------

message BiometricBadgeEnrollRequest {
  Principal principal = 1;
  string principal_tenant = 2;
  string target_client_tenant = 3;
  string target_client_access_system = 4;
  string contract_id = 5;
  string biometric_template_hash_sha256 = 6;
  enum BiometricClass {
    FINGERPRINT_MINUTIAE_ISO_19794_2 = 0;
    FACE_TEMPLATE_ISO_19794_5 = 1;
    PALM_VEIN_ISO_19794_8 = 2;
  }
  BiometricClass biometric_class = 7;
  google.protobuf.Timestamp enrolled_at = 8;
  bool auto_revoke_on_contract_end = 9;
  repeated string scope_site_ids = 10;
}

message BiometricGateScanRequest {
  string principal_subject_id = 1;
  string target_client_access_system = 2;
  google.protobuf.Timestamp scanned_at = 3;
  bool match_result = 4;
  string scan_evidence_id = 5;
}

// ---------- §8 First shift ----------

message FirstShiftCompleteEvent {
  string contract_id = 1;
  google.protobuf.Timestamp shift_start = 2;
  google.protobuf.Timestamp shift_end = 3;
  string shift_supervisor = 4;
  uint32 incidents_count = 5;
  repeated string csn_en_13549_visual_check_zones_passing = 6;
  string ten_t_amr_pad_uptake_evidence_photo_id = 7;
}

// ---------- §9 Community participation ----------

message CommunityPostRequest {
  Principal principal = 1;
  string principal_tenant_origin = 2;
  string community_tenant = 3;
  string group_id = 4;
  enum PostType {
    QUESTION = 0;
    REPLY = 1;
    ANNOUNCEMENT = 2;
    POLL = 3;
  }
  PostType post_type = 5;
  bytes post_body_ciphertext_b64 = 6;
  uint64 mls_epoch_at_post = 7;
  google.protobuf.Timestamp posted_at = 8;
  repeated string tags = 9;
}
