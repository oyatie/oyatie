# j160 — Bid-and-onboard state machine
# 9 states + 12 valid transitions + 8 forbidden transitions + Cedar guards.
# Driven by workflow-engine. State machine instance is per-contract.

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: bid-and-onboard-cleaning-cross-tenant-v1
  workflow_template: wkfl-bid-and-onboard-cleaning-v1
  adr_refs:
    - ADR-0249  # multi-category marketplace
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0252  # HLC + TrueTime for QES signing fence
  regulator_anchors:
    - CZ-OZ-262-2006-zakonik-prace
    - CZ-110-2019-Sb
    - EU-GDPR
    - CSN-EN-ISO-9001-2015
    - CSN-EN-13549-2001
    - ISSA-CIMS-2024

spec:
  # ============================================
  # §1 States (9)
  # ============================================
  states:
    - name: bid_prep
      description: "Vendor reading bid request; assembling cost + cert + crew composition"
      is_initial: true
      is_terminal: false
      cedar_action_required: marketplace.bid_request_read
      audit_class_on_enter: EVT-J160-STATE-BID-PREP-200

    - name: bid_submitted
      description: "Bid submitted to issuing tenant via marketplace cross-tenant API"
      is_initial: false
      is_terminal: false
      cedar_action_required: marketplace.bid_submit
      audit_class_on_enter: EVT-J160-STATE-BID-SUBMITTED-201

    - name: bid_evaluated
      description: "Issuing tenant has scored the bid against criteria"
      is_initial: false
      is_terminal: false
      cedar_action_required: marketplace.bid_evaluate
      audit_class_on_enter: EVT-J160-STATE-BID-EVALUATED-202

    - name: award_received
      description: "Award decision communicated cross-tenant; vendor has been informed"
      is_initial: false
      is_terminal: false
      cedar_action_required: marketplace.award_issue
      audit_class_on_enter: EVT-J160-STATE-AWARD-RECEIVED-203

    - name: contract_in_negotiation
      description: "Contract drafts iterating between parties; terms being finalized"
      is_initial: false
      is_terminal: false
      cedar_action_required: contract.draft_revision
      audit_class_on_enter: EVT-J160-STATE-CONTRACT-NEGOTIATING-204

    - name: contract_signed
      description: "QES dual-tenant signature complete under TrueTime fence"
      is_initial: false
      is_terminal: false
      cedar_action_required: contract.qes_sign_dual_tenant
      audit_class_on_enter: EVT-J160-STATE-CONTRACT-SIGNED-205

    - name: crew_hiring
      description: "Hiring + internal-rotation selection for the dedicated crew"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.crew_select
      audit_class_on_enter: EVT-J160-STATE-CREW-HIRING-206

    - name: crew_onboarding
      description: "Crew completing training, Czech state-system registrations, biometric badges"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.crew_onboard
      audit_class_on_enter: EVT-J160-STATE-CREW-ONBOARDING-207

    - name: contract_live
      description: "Contract executing; first shift complete"
      is_initial: false
      is_terminal: true
      cedar_action_required: workflow.contract_go_live
      audit_class_on_enter: EVT-J160-STATE-CONTRACT-LIVE-208

  # ============================================
  # §2 Valid transitions (12)
  # ============================================
  transitions:
    - from: bid_prep
      to: bid_submitted
      label: "vendor submits bid"
      preconditions:
        - all_required_attachments_present: true
        - ares_business_register_verified: true
        - cz_vat_id_active: true
        - csn_en_iso_9001_cert_unexpired: true
        - issa_cims_2024_cert_unexpired: true
        - bid_window_open: true
      audit_class: EVT-J160-TRANSITION-200-TO-201

    - from: bid_submitted
      to: bid_evaluated
      label: "issuing tenant scores the bid"
      preconditions:
        - bid_window_closed: true
        - evaluating_principal_authorized: true
      audit_class: EVT-J160-TRANSITION-201-TO-202

    - from: bid_evaluated
      to: award_received
      label: "issuing tenant communicates award decision"
      preconditions:
        - award_decision: "accepted"
        - cross_tenant_messenger_post_sent: true
      audit_class: EVT-J160-TRANSITION-202-TO-203

    - from: award_received
      to: contract_in_negotiation
      label: "begin contract drafting"
      preconditions:
        - both_parties_acknowledge: true
      audit_class: EVT-J160-TRANSITION-203-TO-204

    - from: contract_in_negotiation
      to: contract_signed
      label: "QES dual-tenant signature under TrueTime fence"
      preconditions:
        - qes_signatures_count: 2
        - party_tenants_signed_count: 2
        - truetime_uncertainty_ms_within_10: true
        - datova_schranka_notification_scheduled: true
      audit_class: EVT-J160-TRANSITION-204-TO-205

    - from: contract_signed
      to: crew_hiring
      label: "open hiring for dedicated crew"
      preconditions:
        - hiring_positions_published: true
        - contract_value_excl_vat_czk_positive: true
      audit_class: EVT-J160-TRANSITION-205-TO-206

    - from: crew_hiring
      to: crew_onboarding
      label: "all required hires + internal rotations selected"
      preconditions:
        - dedicated_crew_count_assigned: 5
        - all_hires_have_work_permits_or_eu_citizenship: true
      audit_class: EVT-J160-TRANSITION-206-TO-207

    - from: crew_onboarding
      to: contract_live
      label: "all crew onboarded; biometric badges enrolled; first shift ready"
      preconditions:
        - csn_262_training_complete_all_crew: true
        - gdpr_training_complete_all_crew: true
        - equipment_training_complete_all_crew: true
        - polycraft_induction_complete_all_crew: true
        - biometric_badges_enrolled_all_crew: true
        - ossz_registrations_complete: true
        - zp_registrations_complete: true
        - fu_tax_registrations_complete: true
        - first_shift_scheduled: true
      audit_class: EVT-J160-TRANSITION-207-TO-208

    # Defensive: re-open negotiation if a deal-breaker emerges
    - from: contract_in_negotiation
      to: contract_in_negotiation
      label: "additional draft iteration"
      preconditions:
        - revision_within_negotiation_window: true
      audit_class: EVT-J160-TRANSITION-204-TO-204-REVISION

    # Defensive: alternate hire if a candidate withdraws
    - from: crew_hiring
      to: crew_hiring
      label: "alternate hire after withdrawal"
      preconditions:
        - original_hire_withdrew: true
        - alternate_candidate_available: true
      audit_class: EVT-J160-TRANSITION-206-TO-206-ALTERNATE

    # Defensive: re-train if assessment fails
    - from: crew_onboarding
      to: crew_onboarding
      label: "retry training after failed assessment"
      preconditions:
        - assessment_failure_retry_within_limit: true
      audit_class: EVT-J160-TRANSITION-207-TO-207-RETRAIN

    # Defensive: extend onboarding (rare)
    - from: crew_onboarding
      to: crew_onboarding
      label: "extend onboarding window (contract-go-live deferred ≤7 days)"
      preconditions:
        - both_parties_agree_extension: true
        - max_extension_days: 7
      audit_class: EVT-J160-TRANSITION-207-TO-207-EXTEND

  # ============================================
  # §3 Forbidden transitions (8)
  # ============================================
  forbidden_transitions:
    - from: bid_prep
      to: bid_evaluated
      forbid_rule_id: forbid-skip-submit
      audit_class: EVT-J160-INVALID-TRANSITION-300

    - from: bid_prep
      to: award_received
      forbid_rule_id: forbid-skip-evaluation
      audit_class: EVT-J160-INVALID-TRANSITION-301

    - from: bid_submitted
      to: award_received
      forbid_rule_id: forbid-skip-eval-direct-to-award
      audit_class: EVT-J160-INVALID-TRANSITION-302

    - from: award_received
      to: contract_signed
      forbid_rule_id: forbid-skip-negotiation
      audit_class: EVT-J160-INVALID-TRANSITION-303
      reason: "must iterate contract drafts before signing"

    - from: contract_in_negotiation
      to: crew_hiring
      forbid_rule_id: forbid-skip-signing
      audit_class: EVT-J160-INVALID-TRANSITION-304
      reason: "must sign contract before hiring"

    - from: contract_signed
      to: crew_onboarding
      forbid_rule_id: forbid-skip-hiring
      audit_class: EVT-J160-INVALID-TRANSITION-305
      reason: "must hire before onboarding"

    - from: contract_signed
      to: contract_live
      forbid_rule_id: forbid-skip-all-crew-prep
      audit_class: EVT-J160-INVALID-TRANSITION-306

    - from: crew_hiring
      to: contract_live
      forbid_rule_id: forbid-skip-onboarding
      audit_class: EVT-J160-INVALID-TRANSITION-307

  # ============================================
  # §4 Cedar guards
  # ============================================
  cedar_guards:
    - guard_id: guard-bid-submit-cert-active
      description: "Bid submit requires ISSA-CIMS + ISO-9001 certs unexpired"
      applies_to_transitions:
        - bid_prep → bid_submitted
      context_required:
        principal_has_certification_unexpired_ISSA_CIMS_2024: true
        principal_has_certification_unexpired_CSN_EN_ISO_9001_2015: true

    - guard_id: guard-bid-window-open
      description: "Bid submit only during open window"
      applies_to_transitions:
        - bid_prep → bid_submitted
      context_required:
        bid_window_open: true

    - guard_id: guard-qes-truetime-fence
      description: "Contract sign under TrueTime fence ≤10 ms"
      applies_to_transitions:
        - contract_in_negotiation → contract_signed
      context_required:
        truetime_uncertainty_ms_within_10: true

    - guard_id: guard-biometric-training-prereqs
      description: "Biometric badge enrollment requires ČSN-262 + GDPR + induction training complete"
      applies_to_transitions:
        - crew_onboarding (sub-step)
      context_required:
        has_completed_training_csn_262_2006_safety: true
        has_completed_training_gdpr_data_handling: true
        has_completed_training_polycraft_induction: true

    - guard_id: guard-diacritic-strict-mode
      description: "All persisted name fields must be UTF-8 NFC; multi-script preserved (CZ/SK/VI/UK/Cyrillic)"
      applies_globally: true
      context_required:
        unicode_normalization: NFC
        diacritics_preserved: true

    - guard_id: guard-czech-cell-residency
      description: "Czech-tenant data resides in eu-prague-primary (with eu-frankfurt DR + eu-vienna read replica)"
      applies_globally: true
      context_required:
        target_cell_in: [eu-prague-primary, eu-frankfurt-secondary, eu-vienna-tertiary]

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants_per_seal_event:
      - uklid-horak-sro-plzen-cz
      - polycraft-bohemia-as-plzen-cz
    retention_years: 10  # Czech business retention rule for contracts
    merkle_anchor: per-transition
    csn_compatible: true
    eidas_qualified: true
    gdpr_compatible: true

  # ============================================
  # §6 Per-state SLA window
  # ============================================
  per_state_sla_hours:
    bid_prep: 72  # 3 calendar days from bid open to submit
    bid_submitted: 240  # 10 days for evaluation
    bid_evaluated: 24
    award_received: 24
    contract_in_negotiation: 264  # 11 days
    contract_signed: 72
    crew_hiring: 408  # 17 days
    crew_onboarding: 504  # 21 days
