// j174 — BHI Treasury EOD proto3 message definitions
// ADR-0243 + ADR-0244 + ADR-0248 + ADR-0251 + ADR-0252 + ADR-0253 + ADR-0254 + ADR-0263

syntax = "proto3";

package oyatie.user_journeys.j174.v1;

import "google/protobuf/timestamp.proto";

// ============================================================
// Enums
// ============================================================

enum EODState {
  EOD_STATE_UNSPECIFIED = 0;
  INTRADAY = 1;
  ASIA_CUT = 2;
  SG_CUT = 3;
  EUROPE_CUT = 4;
  LONDON_CUT = 5;
  AMERICAS_CUT = 6;
  STOCKHOLM_NIGHT_CUT = 7;
  EOD_POSTED = 8;
  ARCHIVE = 9;
}

enum CutWindow {
  CUT_WINDOW_UNSPECIFIED = 0;
  ASIA_CUT_W = 1;
  SG_CUT_W = 2;
  EUROPE_CUT_W = 3;
  LONDON_CUT_W = 4;
  US_CUT_W = 5;
  STOCKHOLM_NIGHT_CUT_W = 6;
}

enum SwiftStatementType {
  SWIFT_STATEMENT_TYPE_UNSPECIFIED = 0;
  MT940_EOD = 1;
  MT942_INTRADAY = 2;
  ISO_20022_CAMT_053 = 3;
  ISO_20022_CAMT_052 = 4;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  SEK = 1;
  EUR = 2;
  USD = 3;
  GBP = 4;
  NOK = 5;
  DKK = 6;
  CHF = 7;
  JPY = 8;
  CNY = 9;
  KRW = 10;
  BRL = 11;
  AUD = 12;
}

enum Entity {
  ENTITY_UNSPECIFIED = 0;
  BHI_PARENT_SE = 1;
  BHI_MANUFACTURING_DE = 2;
  BHI_USA_INC = 3;
  BHI_UK_LTD = 4;
  BHI_ASIA_PTE_SG = 5;
  BHI_JAPAN_KK = 6;
  BHI_KOREA = 7;
  BHI_BRASIL_LTDA = 8;
}

enum BankTenant {
  BANK_TENANT_UNSPECIFIED = 0;
  NORDEA = 1;
  HANDELSBANKEN = 2;
  JPMORGAN = 3;
  HSBC = 4;
  MIZUHO = 5;
  SMBC = 6;
  BRADESCO = 7;
  DNB = 8;
}

enum FXHedgeCategory {
  FX_HEDGE_CATEGORY_UNSPECIFIED = 0;
  SEK_EUR = 1;
  SEK_USD = 2;
  SEK_GBP = 3;
  SEK_JPY = 4;
  SEK_OTHER = 5;
}

enum ProofClass {
  PROOF_CLASS_UNSPECIFIED = 0;
  INCLUSION_PROOF = 1;
}

// ============================================================
// Common types
// ============================================================

message PrincipalRef {
  string principal_id = 1;
  string tenant_id = 2;
  string tenant_class = 3;
}

message BankAccount {
  string account_identifier = 1;
  BankTenant bank_tenant = 2;
  Entity owning_entity = 3;
  Currency currency = 4;
  string bic = 5;
}

// ============================================================
// SWIFT statement ingestion
// ============================================================

message SwiftMT940IngestRequest {
  string mt940_message_id = 1;
  string sender_bic = 2;
  string receiver_bic = 3;
  string account_identifier = 4;
  SwiftStatementType statement_type = 5;
  Currency opening_balance_currency = 6;
  double opening_balance_amount = 7;
  string opening_balance_basis = 8;
  Currency closing_balance_currency = 9;
  double closing_balance_amount = 10;
  string closing_balance_basis = 11;
  uint32 booked_movements_count = 12;
  double intraday_turnover_amount = 13;
  google.protobuf.Timestamp dispatched_at = 14;
  google.protobuf.Timestamp received_at = 15;
  uint32 ingestion_latency_seconds = 16;
}

message SwiftMT942IngestRequest {
  string mt942_message_id = 1;
  string sender_bic = 2;
  string receiver_bic = 3;
  string account_identifier = 4;
  Currency intraday_balance_currency = 5;
  double intraday_balance_amount = 6;
  uint32 booked_movements_since_last_report = 7;
  string intraday_window_start = 8;
  string intraday_window_end = 9;
  google.protobuf.Timestamp dispatched_at = 10;
}

message MT940CompositeRollup {
  CutWindow cut_window = 1;
  google.protobuf.Timestamp cut_window_open_t = 2;
  google.protobuf.Timestamp cut_window_close_t = 3;
  uint32 total_mt940_received = 4;
  uint32 total_mt940_ingested = 5;
  uint32 ingestion_p95_latency_seconds = 6;
  double total_intraday_turnover_eur_equivalent = 7;
  double total_eod_balance_eur_equivalent = 8;
  uint32 parse_errors = 9;
  double mt942_vs_mt940_reconciliation_discrepancy_eur = 10;
}

// ============================================================
// Cash position
// ============================================================

message FXRateSnapshot {
  google.protobuf.Timestamp snapshot_t = 1;
  string primary_source = 2;
  string backup_source = 3;
  map<string, double> per_currency_pair_mid = 4;  // "SEK_EUR" → 0.0884
  double spread_tolerance_pct = 5;
}

message CashPositionComputeRequest {
  string eod_session_id = 1;
  CutWindow cut_window = 2;
  string fx_rate_source_primary = 3;
  string fx_rate_source_backup = 4;
  google.protobuf.Timestamp fx_rate_snapshot_t = 5;
  double fx_rate_spread_tolerance_pct = 6;
  Currency reference_currency = 7;
  bool include_intraday_mt942 = 8;
}

message CashPositionComputeResponse {
  string compute_id = 1;
  map<string, double> per_entity_position_eur = 2;
  map<string, double> per_currency_position_eur = 3;
  double group_position_interim_eur = 4;
  double projected_eod_group_eur = 5;
  double projected_eod_overnight_usd = 6;
  google.protobuf.Timestamp computed_at = 7;
  string hlc_compute_timestamp = 8;
}

// ============================================================
// FX hedge book delta-hedging
// ============================================================

message FXDeltaHedgeComputeRequest {
  string eod_session_id = 1;
  google.protobuf.Timestamp hedge_book_snapshot_t = 2;
  repeated FXHedgeCategory categories_to_evaluate = 3;
  double rebalance_trigger_threshold_pct = 4;
}

message PerCategoryHedge {
  FXHedgeCategory category = 1;
  uint32 forwards_count = 2;
  uint32 swaps_count = 3;
  double notional_sek = 4;
  double delta_pct_today = 5;
}

message FXDeltaHedgeComputeResponse {
  string fx_delta_id = 1;
  repeated PerCategoryHedge per_category = 2;
  double max_delta_pct_today = 3;
  bool rebalance_triggered = 4;
  double hedge_book_pnl_today_sek = 5;
  double underlying_gain_today_sek = 6;
  double net_today_sek = 7;
  double hedge_book_pnl_ytd_sek = 8;
}

// ============================================================
// Intercompany netting
// ============================================================

message IntercompanyNettingRequest {
  string eod_session_id = 1;
  repeated Entity entities = 2;
  Currency reference_currency = 3;
  string netting_period = 4;
  string in_house_bank_id = 5;
}

message PerPairPosition {
  Entity entity_a = 1;
  Entity entity_b = 2;
  double net_eur = 3;
}

message IntercompanyNettingResponse {
  string netting_id = 1;
  uint32 matrix_dimension = 2;
  repeated PerPairPosition pairs = 3;
  map<string, double> net_per_entity_eur = 4;
  double total_netted_volume_eur = 5;
  string settlement_method = 6;
  google.protobuf.Timestamp settlement_t = 7;
  string hlc_settlement_timestamp = 8;
}

// ============================================================
// Cash sweep
// ============================================================

message MMFAllocation {
  string vehicle_name = 1;
  string vehicle_issuer = 2;
  double amount_usd = 3;
  double yield_1d_pct = 4;
}

message OvernightDepositAllocation {
  string bank_principal = 1;
  double amount_usd = 2;
  double yield_1d_pct = 3;
}

message CashSweepPrepareRequest {
  string eod_session_id = 1;
  double target_overnight_amount_usd = 2;
  repeated MMFAllocation mmf_allocations = 3;
  repeated OvernightDepositAllocation overnight_deposit_allocations = 4;
}

message CashSweepCoSignRequest {
  string sweep_id = 1;
  PrincipalRef co_signer_principal = 2;
  string co_signer_role_assertion = 3;
  string approval_decision = 4;
  google.protobuf.Timestamp co_signed_at = 5;
}

message CashSweepExecuteResponse {
  string sweep_id = 1;
  google.protobuf.Timestamp executed_at = 2;
  string hlc_sweep_timestamp = 3;
  bool sanctions_destination_clean = 4;
  double actual_overnight_position_usd = 5;
}

// ============================================================
// LCR
// ============================================================

message LCRComputeRequest {
  string eod_session_id = 1;
  Currency reference_currency = 2;
  google.protobuf.Timestamp compute_t = 3;
  bool include_30d_outflow_projection = 4;
  bool include_inflow_cap_75pct = 5;
}

message LCRComputeResponse {
  string lcr_id = 1;
  double hqla_level_1_eur = 2;
  double hqla_level_2a_eur = 3;
  double hqla_level_2b_eur = 4;
  double hqla_total_eur = 5;
  double outflow_30d_retail_eur = 6;
  double outflow_30d_wholesale_eur = 7;
  double outflow_30d_secured_eur = 8;
  double outflow_30d_derivative_eur = 9;
  double inflow_30d_eur = 10;
  double net_outflow_30d_eur = 11;
  double lcr_ratio = 12;
  bool ratio_threshold_met = 13;
}

// ============================================================
// Per-account Merkle anchor
// ============================================================

message EODAccountAnchorRequest {
  string anchor_id = 1;
  string eod_session_id = 2;
  string account_identifier = 3;
  BankTenant bank_tenant = 4;
  Entity entity = 5;
  Currency currency = 6;
  double closing_balance_amount = 7;
  bytes merkle_root = 8;
  string external_transparency_log_batch = 9;
  ProofClass proof_class = 10;
  bool ifrs_9_attestation = 11;
  bool ias_21_fx_translation_attestation = 12;
  google.protobuf.Timestamp emitted_at = 13;
}

// ============================================================
// Cut-off ordering attestation
// ============================================================

message CutOffOrderingRecord {
  CutWindow cut = 1;
  google.protobuf.Timestamp closed_at = 2;
  uint32 ordering_seq = 3;
}

message CutOffOrderingAttestation {
  string eod_session_id = 1;
  repeated CutOffOrderingRecord cut_off_ordering = 2;
  bool ordering_preserved = 3;
}

// ============================================================
// Pack manifest + observability
// ============================================================

message PackManifestAssertion {
  string eod_session_id = 1;
  repeated string active_packs = 2;
  string cross_validation_state = 3;
  string pack_manifest_signature = 4;
  google.protobuf.Timestamp asserted_at = 5;
}

message ObservabilitySLOReport {
  string eod_session_id = 1;
  uint32 mt940_ingestion_p95_seconds = 2;
  uint32 cash_position_compute_p95_seconds = 3;
  uint32 fx_delta_hedge_compute_p95_seconds = 4;
  uint32 intercompany_netting_compute_p95_seconds = 5;
  uint32 lcr_compute_p95_seconds = 6;
  bool per_region_latency_targets_met = 7;
  string overall_status = 8;
}

// ============================================================
// Cedar deny coverage
// ============================================================

message CedarDenyCoverageReport {
  string eod_session_id = 1;
  uint32 denied_sweep_without_treasurer_cosign = 2;
  uint32 denied_bank_statement_metadata_read = 3;
  uint32 total_denied = 4;
  uint32 observability_redaction_pct = 5;
}

// ============================================================
// EOD posted state transition
// ============================================================

message EODPostedRequest {
  string eod_session_id = 1;
  EODState state_transition_from = 2;
  EODState state_transition_to = 3;
  double group_position_final_eur = 4;
  double overnight_position_actual_usd = 5;
  double lcr_ratio = 6;
  uint32 merkle_anchors_emitted = 7;
  google.protobuf.Timestamp posted_at = 8;
}

// ============================================================
// Audit event envelope
// ============================================================

message AuditEvent {
  string event_id = 1;
  string event_class = 2;
  string eod_session_id = 3;
  PrincipalRef actor_principal = 4;
  CutWindow cut_window = 5;
  string cedar_permit_id = 6;
  google.protobuf.Timestamp emitted_at = 7;
}
