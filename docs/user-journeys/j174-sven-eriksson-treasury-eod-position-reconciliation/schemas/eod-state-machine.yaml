---
doc_class: User-Journey-State-Machine
journey_id: j174-sven-eriksson-treasury-eod-position-reconciliation
date: 2026-05-20
authority_tier: 2

machine:
  id: eod-bhi-2027-05-20
  name: bhi-treasury-eod-lifecycle
  description: 8-state EOD lifecycle for BHI multinational treasury EOD reconciliation across 47 bank accounts + 12 currencies under IFRS-9 + IAS-21 + Basel-III LCR + EMIR + Dodd-Frank + MiFID II + ISO 20022 MX + IBOR transition.
  initial_state: intraday
  terminal_states:
    - eod_posted
    - archive

states:
  - id: intraday
    description: Intraday MT942 ingestion at 15-minute cadence; treasury cockpit open; pre-cut interim positions.
    on_entry:
      - emit_event: EVT-J174-COCKPIT-OPENED-Δ000
      - intraday_mt942_polling_start_15min_cadence
    transitions:
      - to: asia_cut
        when: asia_cut_window_opens
        cedar_permit: treasury_ops_mgr

  - id: asia_cut
    description: Tokyo + SG MT940 EOD statements ingested (11:00 CEST equivalent).
    on_entry:
      - emit_event: EVT-J174-MT940-INGESTION-Δ001b-tokyo (per-account)
      - emit_event: EVT-J174-MT940-INGESTION-Δ001b-sg (per-account)
      - emit_event: EVT-J174-MT940-INGESTION-001-asia (composite)
    transitions:
      - to: europe_cut
        when: europe_cut_window_opens
        cedar_permit: treasury_ops_mgr

  - id: europe_cut
    description: Nordea + Handelsbanken + Frankfurt MT940 EOD statements ingested (15:00–15:18 CEST).
    on_entry:
      - emit_event: EVT-J174-MT940-INGESTION-Δ001b-eu (per-account)
      - emit_event: EVT-J174-MT940-INGESTION-001-eu (composite)
      - emit_event: EVT-J174-CASH-POSITION-COMPUTED-002 (interim post-EU)
    transitions:
      - to: london_cut
        when: london_cut_window_opens
        cedar_permit: treasury_ops_mgr

  - id: london_cut
    description: JPMorgan UK MT940 + London-pertinent statements (18:00 CEST = 17:00 BST).
    on_entry:
      - emit_event: EVT-J174-MT940-INGESTION-Δ001b-london
      - emit_event: EVT-J174-MT940-INGESTION-001-london
      - emit_event: EVT-J174-FX-DELTA-HEDGE-003
      - emit_event: EVT-J174-INTERCOMPANY-NETTING-004
    transitions:
      - to: us_cut
        when: us_cut_window_opens
        cedar_permit: treasury_ops_mgr

  - id: us_cut
    description: JPMorgan US + HSBC US MT940 (23:00 CEST = 17:00 EST).
    on_entry:
      - emit_event: EVT-J174-MT940-INGESTION-Δ001b-us
      - emit_event: EVT-J174-MT940-INGESTION-001-us
      - emit_event: EVT-J174-CASH-POSITION-COMPUTED-002 (final)
      - emit_event: EVT-J174-CASH-SWEEP-PREPARED-Δ005-prep
    transitions:
      - to: cash_sweep_co_sign
        when: cash_sweep_prepared
        cedar_permit: treasury_ops_mgr

  - id: cash_sweep_co_sign
    description: Group Treasurer co-sign for cash sweep; sweep execution.
    on_entry:
      - emit_event: EVT-J174-CASH-SWEEP-CO-SIGN-Δ005a
      - emit_event: EVT-J174-CASH-SWEEP-005
    transitions:
      - to: stockholm_night_cut
        when: cash_sweep_executed
        cedar_permit: treasury_ops_mgr + group_treasurer_co_sign

  - id: stockholm_night_cut
    description: Final SEK overnight + remaining CEE MT940 (23:30 CEST); LCR + Merkle attestation.
    on_entry:
      - emit_event: EVT-J174-MT940-INGESTION-001-stockholm-night
      - emit_event: EVT-J174-LCR-COMPUTED-006
      - emit_event: EVT-J174-MERKLE-EOD-007 (47 anchors)
      - emit_event: EVT-J174-CUT-OFF-ORDERING-008
      - emit_event: EVT-J174-PACK-MANIFEST-009
      - emit_event: EVT-J174-OBSERVABILITY-SLO-010
      - emit_event: EVT-J174-CEDAR-DENY-COVERAGE-011
    transitions:
      - to: eod_posted
        when: all_attestations_emitted_and_lcr_pass
        cedar_permit: treasury_ops_mgr

  - id: eod_posted
    description: EOD posted; per-account Merkle anchors sealed; LCR ≥ 1.0; cash sweep settled.
    on_entry:
      - emit_event: EVT-J174-EOD-POSTED-Δ010
    is_terminal: true

  - id: archive
    description: Long-term EOD archive; 6-year SEC 17a-4-equivalent retention + IFRS-9 + IAS-21 audit retention.
    note: Reached after eod_posted + retention period unlock.
    is_terminal: true

transitions_invariants:
  - cut_off_ordering_monotonic_utc_required
  - mt942_vs_mt940_reconciliation_zero_discrepancy_required
  - per_account_merkle_anchor_required_47_accounts
  - cash_sweep_co_sign_required_for_amount_above_ceiling
  - sanctions_screening_clean_required_before_sweep_execute
  - lcr_threshold_ratio_must_be_ge_1
  - ifrs_9_ias_21_attestation_required_per_anchor
  - rebalance_trigger_threshold_0.5_pct_required
  - hlc_timestamp_required_on_settlement_and_sweep
  - 8_pack_manifest_cross_validation_required_before_eod_posted

retention:
  eod_record_retention_years_min: 6 (IFRS-9 + IAS-21 + audit best practice; longer than statutory minimum)
  retention_cell: eu-stockholm-tier-1-worm-treasury-attest
  external_transparency_log_batch_cadence: daily-end-of-day

cut_off_ordering:
  - id: asia_cut
    open_utc: 2027-05-20T09:00:00Z  # 11:00 CEST
  - id: sg_cut
    open_utc: 2027-05-20T09:00:00Z  # 11:00 CEST (same window as Tokyo)
  - id: europe_cut
    open_utc: 2027-05-20T13:00:00Z  # 15:00 CEST
  - id: london_cut
    open_utc: 2027-05-20T16:00:00Z  # 18:00 CEST = 17:00 BST
  - id: us_cut
    open_utc: 2027-05-20T21:00:00Z  # 23:00 CEST = 17:00 EST
  - id: stockholm_night_cut
    open_utc: 2027-05-20T21:30:00Z  # 23:30 CEST

audit_events:
  - id: EVT-J174-COCKPIT-OPENED-Δ000
    state: intraday
  - id: EVT-J174-INTRADAY-MT942-ROLLUP-Δ001a
    state: intraday (rolling)
  - id: EVT-J174-MT940-INGESTION-001
    state: per cut window
  - id: EVT-J174-CASH-POSITION-COMPUTED-002
    state: europe_cut + us_cut
  - id: EVT-J174-FX-DELTA-HEDGE-003
    state: london_cut
  - id: EVT-J174-INTERCOMPANY-NETTING-004
    state: london_cut
  - id: EVT-J174-CASH-SWEEP-PREPARED-Δ005-prep
    state: us_cut
  - id: EVT-J174-CASH-SWEEP-CO-SIGN-Δ005a
    state: cash_sweep_co_sign
  - id: EVT-J174-CASH-SWEEP-005
    state: cash_sweep_co_sign
  - id: EVT-J174-LCR-COMPUTED-006
    state: stockholm_night_cut
  - id: EVT-J174-MERKLE-EOD-007
    state: stockholm_night_cut (47 emissions)
  - id: EVT-J174-CUT-OFF-ORDERING-008
    state: stockholm_night_cut
  - id: EVT-J174-PACK-MANIFEST-009
    state: stockholm_night_cut
  - id: EVT-J174-OBSERVABILITY-SLO-010
    state: stockholm_night_cut
  - id: EVT-J174-CEDAR-DENY-COVERAGE-011
    state: stockholm_night_cut
  - id: EVT-J174-EOD-POSTED-Δ010
    state: eod_posted
