---
# j169 — ASEAN-6 launch state machine (9 states + 1 archived)

state_machine_id: j169-asean-6-launch
authority_tier: 2

states:
  - id: readiness_review
    description: Pre-launch readiness checklist + MD sign-offs in progress
    entry_actions: [render_dashboard, mds_signoff_workflow]
    exit_conditions: [all_522_checklist_items_green, all_6_md_signoffs_collected]

  - id: content_localization_complete
    description: 7-language localization corpus completed with AI-transparency attestation
    entry_actions: [run_nllb_200_batch, human_editor_review, attestation_seal]

  - id: ambassadors_kickoff
    description: 12 ambassadors onboarded + credentialed
    entry_actions: [issue_credentials, attribution_url_provisioning]

  - id: cohort_split_finalized
    description: 18 cohort rule-bundles signed (3 cohorts × 6 countries)
    entry_actions: [research_ethics_review, cohort_rule_publish]

  - id: soft_publish
    description: Pre-launch ambassador content seeding
    entry_actions: [distribute_content_briefs, ambassador_pre_launch_posts]

  - id: go_no_go
    description: 8-of-8 Cedar quorum vote (CEO + CMO + 6 MDs)
    entry_actions: [open_quorum_modal]
    exit_actions: [seal_permit_or_deny]

  - id: live
    description: Per-country launch flag flips at 08:00 local time
    entry_actions: [schedule_per_country_flag_flips, monitor_first_signups]

  - id: day_7_retrospective
    description: Day-7 cumulative analytics + cohort analysis + ambassador attribution
    entry_actions: [generate_day_7_report, run_cohort_significance_tests]
    exit_actions: [seal_retrospective]

  - id: archived
    description: Launch closed; compliance attestations submitted to auditors
    terminal: true
    entry_actions: [submit_to_pwc_sg, submit_to_sentinel_asia, submit_to_dekra]

transitions:
  - from: readiness_review
    to: content_localization_complete
    trigger: all_md_signoffs_collected + checklist_green
    audit_class: EVT-J169-READINESS-COMPLETE-001

  - from: content_localization_complete
    to: ambassadors_kickoff
    trigger: localization_qa_passed
    cedar_policy: intelligence.localize_content_batch
    audit_class: EVT-J169-LOCALIZATION-QA-COMPLETE-002

  - from: ambassadors_kickoff
    to: cohort_split_finalized
    trigger: all_12_ambassadors_credentialed
    cedar_policy: community.ambassador_credential_issue
    audit_class: EVT-J169-AMBASSADORS-CONFIRMED-003

  - from: cohort_split_finalized
    to: soft_publish
    trigger: all_18_rule_bundles_signed
    cedar_policy: marketing-automation.cohort_rules_set
    audit_class: EVT-J169-COHORT-SPLITS-SIGNED-004

  - from: soft_publish
    to: go_no_go
    trigger: pre_launch_window_T_minus_24h_reached

  - from: go_no_go
    to: live
    trigger: 8_of_8_PERMIT_quorum
    cedar_policy: marketing-automation.country_launch_approve
    audit_class: EVT-J169-GO-LIVE-PERMIT-005

  - from: live
    to: day_7_retrospective
    trigger: day_7_clock_reached
    audit_class: EVT-J169-DAY-7-RETROSPECTIVE-COMPLETE-008

  - from: day_7_retrospective
    to: archived
    trigger: all_compliance_attestations_submitted
    audit_class: EVT-J169-COMPLIANCE-ATTESTATIONS-011

rollback_edges:
  - from: go_no_go
    to: readiness_review
    trigger: deny_vote_or_blocked_quorum

  - from: live
    to: go_no_go
    trigger: launch_emergency_halt
    cedar_policy: governance.cohort_rollback
    window_minutes: 240

invariants:
  - every_state_transition_dual_seals
  - locale_pack_auto_activates_per_country_residency
  - ai_content_transparency_disclosure_present_on_every_ai_localized_string
  - 8_of_8_quorum_required_for_go_no_go (not majority)
  - per_country_cell_residency_enforced
