syntax = "proto3";

package oya.journey.j169.launch.v1;

option go_package = "github.com/oyatie/oya/journey/j169/launch/v1;launchv1";

import "google/protobuf/timestamp.proto";

// j169 — proto3 messages for Veritem Health Asia ASEAN-6 launch.
// All string fields UTF-8 NFC. 7 launch languages preserved with full diacritic + tone-mark fidelity.

// =====================================================================
// LAUNCH + COUNTRY
// =====================================================================

enum CountryCode {
  COUNTRY_CODE_UNSPECIFIED = 0;
  SG = 1;
  ID = 2;
  TH = 3;
  VN = 4;
  PH = 5;
  MY = 6;
}

enum LanguageTag {
  LANGUAGE_TAG_UNSPECIFIED = 0;
  EN_SG = 1;
  ID_ID = 2;
  MS_MY = 3;
  TH_TH = 4;
  VI_VN = 5;
  TL_PH = 6;
  ZH_HANT_SG = 7;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  SGD = 1;
  IDR = 2;
  THB = 3;
  VND = 4;
  PHP = 5;
  MYR = 6;
}

message Launch {
  string launch_id = 1;                            // asean-6-2026-06-15
  string scheduled_local_time = 2;                 // "08:00 local-time per country"
  repeated CountryLaunchConfig per_country = 3;
  string audit_seal = 4;
}

message CountryLaunchConfig {
  CountryCode country_code = 1;
  string country_sub_tenant = 2;
  string cell_id = 3;                              // apac-sg-cell-tier-1-primary
  string md_principal = 4;
  google.protobuf.Timestamp md_signoff_at = 5;
  string md_signoff_local_iana = 6;
  repeated LanguageTag languages_in_scope = 7;
  Currency currency = 8;
  repeated string regulatory_pack_overlay = 9;     // SG-PDPA-2012, etc.
  PricingTier pricing = 10;
}

message PricingTier {
  double monthly_local_currency = 1;
  double quarterly_local_currency = 2;
  double annual_local_currency = 3;
}

// =====================================================================
// LOCALIZATION
// =====================================================================

enum TransparencyAttestation {
  TRANSPARENCY_ATTESTATION_UNSPECIFIED = 0;
  AI_TRANSLATED_THEN_HUMAN_EDITED = 1;
  AI_TRANSLATED_HUMAN_REVIEWED_NO_EDIT = 2;
  HUMAN_AUTHORED_ONLY = 3;
  AI_TRANSLATED_NO_HUMAN_REVIEW = 4;  // forbidden for publish — Cedar policy blocks
}

message LocalizedString {
  string key = 1;
  string source_text = 2;
  LanguageTag source_lang = 3;
  string translated_text = 4;
  LanguageTag target_lang = 5;
  string ai_source_model = 6;                      // nllb-200-distilled-1.3B
  string ai_raw_translation = 7;
  string human_editor_principal = 8;
  uint32 edit_diff_token_count = 9;
  repeated string cultural_overlay_applied = 10;
  TransparencyAttestation attestation = 11;
  bool ai_content_transparency_disclosure_present = 12;
  string disclosure_text_in_target_lang = 13;     // "Teks ini diterjemahkan dengan bantuan AI..."
  string audit_seal = 14;
}

message LocalizationBatch {
  string batch_id = 1;
  LanguageTag source_language = 2;
  repeated LanguageTag target_languages = 3;
  repeated LocalizedString strings = 4;
  string merkle_root = 5;
  string audit_seal = 6;
}

// =====================================================================
// AMBASSADOR
// =====================================================================

enum AmbassadorTier {
  AMBASSADOR_TIER_UNSPECIFIED = 0;
  TIER_1 = 1;
  TIER_2 = 2;
  TIER_3 = 3;
}

message Ambassador {
  string ambassador_id = 1;
  string principal = 2;                            // tania.putri@ambassador-1-sub-tenant
  string display_name = 3;                         // "Tania Putri Wibowo"
  CountryCode country_code = 4;
  AmbassadorTier tier = 5;
  double retainer_local_currency_per_month = 6;
  double per_signup_commission_local_currency = 7;
  string attribution_tracking_url = 8;
  repeated LanguageTag content_languages = 9;
  repeated SocialChannel social_channels = 10;
  bool ndab_signed = 11;
  bool consent_gdpr_equivalent_signed = 12;
  google.protobuf.Timestamp credential_issued_at = 13;
  string audit_seal = 14;
}

message SocialChannel {
  string platform = 1;                             // instagram | tiktok | youtube | facebook | twitter
  string handle = 2;
  uint64 follower_count = 3;
}

// =====================================================================
// COHORT SPLIT
// =====================================================================

enum CohortLabel {
  COHORT_LABEL_UNSPECIFIED = 0;
  CONTROL = 1;
  TREATMENT_A = 2;
  TREATMENT_B = 3;
}

message Cohort {
  CohortLabel label = 1;
  double percentage = 2;
  string onboarding_flow = 3;
}

message CohortRules {
  string rule_bundle_id = 1;
  CountryCode country_code = 2;
  repeated Cohort cohorts = 3;
  string signer_md = 4;
  string signer_cmo = 5;
  string signer_compliance = 6;
  bool research_ethics_review_passed = 7;
  string research_ethics_reviewer_principal = 8;
  google.protobuf.Timestamp effective_at_utc = 9;
  string audit_seal = 10;
}

// =====================================================================
// GO/NO-GO VOTE
// =====================================================================

enum VoteDecision {
  VOTE_DECISION_UNSPECIFIED = 0;
  PERMIT = 1;
  DENY = 2;
  ABSTAIN = 3;
}

message GoNoGoVote {
  string vote_id = 1;
  string launch_id = 2;
  string voter_principal = 3;
  string voter_role = 4;                           // cmo, ceo, md_sg, etc.
  VoteDecision decision = 5;
  string rationale_local_lang = 6;
  bytes voter_passkey_attestation = 7;
  google.protobuf.Timestamp voted_at = 8;
  double truetime_uncertainty_ms = 9;
}

message GoNoGoOutcome {
  string launch_id = 1;
  VoteDecision quorum_decision = 2;
  uint32 quorum_collected = 3;
  uint32 quorum_required = 4;
  repeated GoNoGoVote votes = 5;
  string audit_seal = 6;
  repeated string dual_seal_tenants = 7;
}

// =====================================================================
// PER-COUNTRY FLAG FLIP
// =====================================================================

message PerCountryLaunchFlag {
  string flag_id = 1;
  CountryCode country_code = 2;
  bool value = 3;
  google.protobuf.Timestamp effective_at_utc = 4;
  string effective_at_local_iana = 5;
  string rationale = 6;
  google.protobuf.Timestamp applied_at_utc = 7;
  google.protobuf.Timestamp first_signup_at_utc = 8;
  string audit_seal = 9;
}

// =====================================================================
// PAYMENT PROCESSOR
// =====================================================================

message PaymentProcessor {
  string processor_id = 1;                         // gopay-id
  CountryCode country_code = 2;
  Currency currency = 3;
  string veritem_merchant_id = 4;
  string callback_url = 5;
  string compliance_attestation = 6;
  bool active = 7;
  string audit_seal = 8;
}

// =====================================================================
// DAY-7 REPORT
// =====================================================================

message Day7Report {
  string launch_id = 1;
  uint32 day_7_total_signups = 2;
  uint32 target_signups = 3;
  double beat_pct = 4;
  repeated PerCountrySignups per_country = 5;
  map<string, CohortLabel> cohort_winners = 6;     // country_code → winning cohort
  double ambassador_attribution_pct = 7;
  repeated AmbassadorContribution top_ambassadors = 8;
  string audit_seal = 9;
  string merkle_root = 10;
}

message PerCountrySignups {
  CountryCode country_code = 1;
  uint32 signups = 2;
  uint32 target = 3;
}

message AmbassadorContribution {
  string ambassador_id = 1;
  string display_name = 2;
  CountryCode country_code = 3;
  uint32 attributed_signups = 4;
  double pct_of_total = 5;
}

// =====================================================================
// CROSS-BORDER ATTESTATION
// =====================================================================

message CrossBorderAttestation {
  string attestation_id = 1;
  string scope = 2;
  uint32 transfer_records_count = 3;
  repeated CountryCode countries_involved = 4;
  bool asean_privacy_framework_attestation = 5;
  double per_country_consent_obtained_pct = 6;
  string merkle_root = 7;
  repeated AuditorSubmission auditor_submissions = 8;
  string audit_seal = 9;
}

message AuditorSubmission {
  string auditor_tenant = 1;
  repeated string evidence_packs = 2;
  google.protobuf.Timestamp acknowledgement_expected_at = 3;
}
