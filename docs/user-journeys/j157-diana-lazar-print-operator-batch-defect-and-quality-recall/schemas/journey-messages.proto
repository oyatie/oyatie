// j157 — Diana Lazăr quality + recall RPC messages
// proto3, package versioned per ADR-0244 tenant scoping
// Diacritic preservation: ALL string fields are UTF-8 NFC; no normalization.
// Cross-tenant audit dual-seal mandatory under ADR-0263.

syntax = "proto3";

package oya.journeys.j157.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // UTF-8 NFC; e.g. diana.lazăr@tipografia-lazar-petrescu-ro
  string home_tenant = 2;
  string acting_tenant = 3;
  repeated string active_certifications = 4;
  string role_in_acting_tenant = 5;
  string passkey_assertion_b64 = 6;
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;                   // e.g. eu-bucharest-primary
  string trace_id = 3;
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  bool truetime_class = 6;
}

message DiacriticPolicy {
  string unicode_normalization = 1;  // MUST be "NFC"
  bool diacritics_preserved = 2;     // MUST be true for legal/regulatory writes
  string locale_render = 3;          // e.g. ro-RO, en-GB, hu-HU
}

// ---------- §1 Quality alert + line stop ----------

message QualityTelemetryReading {
  TenantContext tenant_ctx = 1;
  string press_id = 2;
  string batch_id = 3;
  uint64 sheet_index = 4;
  google.protobuf.Timestamp captured_at = 5;
  double delta_e_2000 = 6;
  double registration_shift_mm_x = 7;
  double registration_shift_mm_y = 8;
  string color_channel_breaching = 9;
  enum FograClass {
    IN_TOLERANCE = 0;
    MARGINAL = 1;
    OUT_OF_TOLERANCE = 2;
  }
  FograClass fogra_pso_class = 10;
}

message LineStopRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string batch_id = 3;
  google.protobuf.Timestamp stop_initiated_at = 4;
  string stop_reason = 5;            // UTF-8 NFC
  enum AuthorityBasis {
    FOGRA_PSO_OPERATOR_LEVEL_2 = 0;
    FOGRA_PSO_OPERATOR_LEVEL_1_WITH_MANAGER_ESCALATION = 1;
  }
  AuthorityBasis authority_basis = 6;
  message EvidenceSnapshot {
    double delta_e_at_stop = 1;
    uint64 sheet_index_at_stop = 2;
    string press_camera_frame_id = 3;
  }
  EvidenceSnapshot evidence = 7;
}

message LineStopResponse {
  string line_stop_id = 1;
  google.protobuf.Timestamp press_halt_command_sent_at = 2;
  google.protobuf.Timestamp press_halt_confirmed_at = 3;
  uint32 sheets_in_transit_quarantined = 4;
  uint32 good_sheets_count = 5;
  uint32 remaining_planned = 6;
  AuditAnchor audit = 7;
}

// ---------- §2 Defect classification ----------

message DefectClassifyRequest {
  string defect_id = 1;
  TenantContext tenant_ctx = 2;
  string batch_id = 3;
  enum Category {
    COLOR_DRIFT = 0;
    REGISTRATION_SHIFT = 1;
    REGISTRATION_SHIFT_LEGAL_TEXT_CLIPPING = 2;
    INK_DENSITY = 3;
    SUBSTRATE_DEFECT = 4;
    BINDING_DEFECT = 5;
    OTHER = 6;
  }
  Category category = 4;
  enum Iso9001Severity {
    MINOR = 0;
    MAJOR = 1;
    CRITICAL = 2;
  }
  Iso9001Severity iso_9001_severity = 5;
  string fogra_pso_class = 6;
  message TelemetrySnapshot {
    double delta_e_at_first_breach = 1;
    double registration_shift_mm_y = 2;
    double registration_shift_mm_x = 3;
    uint32 affected_sheet_range_start = 4;
    uint32 affected_sheet_range_end = 5;
    uint32 affected_sheet_count = 6;
  }
  TelemetrySnapshot telemetry = 7;
  message LegalTextClipping {
    string expected_text = 1;         // UTF-8 NFC diacritic-preserved
    string rendered_text = 2;
    double clip_height_mm = 3;
    enum RegulatoryClass {
      NON_REGULATORY = 0;
      ANMDMR_APPROVED_TEXT_DEVIATION = 1;
      EMA_PIL_DEVIATION = 2;
      FDA_LABEL_DEVIATION = 3;
    }
    RegulatoryClass regulatory_class = 4;
  }
  LegalTextClipping legal_text_clipping = 8;
  DiacriticPolicy diacritic_policy = 9;
}

// ---------- §3 Recall workflow ----------

message RecallCreateRequest {
  string workflow_template_id = 1;
  TenantContext tenant_ctx = 2;
  string customer_tenant = 3;
  string batch_id = 4;
  string line_stop_id = 5;
  enum State {
    STOP_CALLED = 0;
    QUARANTINE = 1;
    DEFECT_ROOT_CAUSE = 2;
    CUSTOMER_NOTIFY = 3;
    RECALL_EXECUTE = 4;
    CLOSURE_POST_MORTEM = 5;
  }
  State initial_state = 6;
  enum RegulatorTemplate {
    NONE = 0;
    ANMDMR = 1;
    EMA = 2;
    FDA = 3;
  }
  RegulatorTemplate regulator_template_required = 7;
  enum RegulatorStatus {
    NOT_REQUIRED = 0;
    PREPARED_HOLD = 1;
    SENT = 2;
  }
  RegulatorStatus regulator_template_status = 8;
}

message RecallTransitionRequest {
  string recall_id = 1;
  RecallCreateRequest.State from_state = 2;
  RecallCreateRequest.State to_state = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  repeated string evidence_links = 5;
  Principal initiating_principal = 6;
}

// ---------- §4 Tasks ----------

message TasksMaterializeRequest {
  string recall_id = 1;
  TenantContext tenant_ctx = 2;
  string task_template_set = 3;
  repeated string task_ids = 4;
}

message TaskCompleteRequest {
  string task_id = 1;
  string completed_by = 2;
  google.protobuf.Timestamp completed_at = 3;
  message Evidence {
    repeated string photo_ids = 1;
    uint32 samples_count = 2;
    string tamper_seal_id = 3;
    string courier = 4;
    string tracking_number = 5;
    string destination_address = 6;
    google.protobuf.Timestamp estimated_delivery = 7;
    uint32 sheet_count = 8;
  }
  Evidence evidence = 4;
}

// ---------- §5 Root cause + CAPA ----------

message RootCauseConfirmRequest {
  string defect_id = 1;
  enum Category {
    MECHANICAL_WEAR = 0;
    MECHANICAL_WEAR_DAMPENER_ROLLER_CYLINDER = 1;
    OPERATOR_ERROR = 2;
    SUBSTRATE_LOT_VARIABILITY = 3;
    INK_LOT_VARIABILITY = 4;
    ENVIRONMENTAL = 5;
    SOFTWARE_DRIFT = 6;
    OTHER = 7;
  }
  Category root_cause_category = 2;
  string root_cause_specific = 3;
  string root_cause_evidence_inspection_id = 4;
  google.protobuf.Timestamp confirmed_at = 5;
  string confirmed_by = 6;
  string endorsed_by = 7;
}

message CapaFileRequest {
  string capa_id = 1;
  string defect_link = 2;
  repeated string correction = 3;
  repeated string corrective_action = 4;
  repeated string preventive_action = 5;
  google.protobuf.Timestamp filed_at = 6;
  string filed_by = 7;
  string endorsed_by = 8;
  bool endorsed_section_1 = 9;
  bool endorsed_section_2 = 10;
  bool endorsed_section_3 = 11;
  DiacriticPolicy diacritic_policy = 12;
}

// ---------- §6 Cross-tenant customer notification ----------

message RecallMessagePost {
  Principal principal = 1;
  string group_id = 2;
  google.protobuf.Timestamp post_at = 3;
  uint64 mls_epoch_at_post = 4;
  bytes ciphertext = 5;
  string structured_payload_hash_sha256 = 6;
  enum NotificationClass {
    CUSTOMER_RECALL_INITIATE = 0;
    CUSTOMER_RECALL_UPDATE = 1;
    CUSTOMER_RECALL_CLOSE = 2;
    REGULATOR_RECALL_INITIATE = 3;
  }
  NotificationClass notification_class = 7;
  uint32 sla_response_within_hours = 8;
  DiacriticPolicy diacritic_policy = 9;
}

// ---------- §7 Shift handoff ----------

message ShiftHandoffRequest {
  string from_principal = 1;
  string to_principal = 2;
  string shift_outgoing = 3;
  string shift_incoming = 4;
  google.protobuf.Timestamp handoff_at = 5;
  repeated string active_recalls = 6;
  repeated string scheduled_runs_starting = 7;
  string handoff_notes_ref = 8;
  string incoming_passkey_assertion_b64 = 9;
  string incoming_face_id_assertion_b64 = 10;
}
