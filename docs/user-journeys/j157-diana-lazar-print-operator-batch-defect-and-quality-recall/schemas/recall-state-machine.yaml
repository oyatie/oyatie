# j157 — Recall workflow state machine
# 6 states + 8 valid transitions + Cedar guards + per-state audit class.
# Driven by the workflow-engine µservice. Skip transitions are forbidden;
# Cedar FORBID-5 in cedar-policy.cedar dual-seals deny audits for invalid skips.
#
# State machine version: v2 (matches ISO-9001 §10.2 + EU-GPSR Art 33 recall lifecycle)

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: recall-pharma-PIL-cross-tenant-v2
  workflow_template: wkfl-recall-pharma-PIL-cross-tenant-v2
  adr_refs:
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0252  # HLC + TrueTime for CAPA fence
  regulator_anchors:
    - ISO-9001-§10.2-Nonconformity-Corrective-Action
    - EU-GPSR-2023-988-Article-33-Recall
    - RO-OUG-21-2021-Consumer-Recall

spec:
  # ============================================
  # §1 States
  # ============================================
  states:
    - name: stop_called
      description: "Line stopped by operator; recall workflow created"
      is_initial: true
      is_terminal: false
      cedar_action_required: workflow.recall_initiate
      audit_class_on_enter: EVT-J157-RECALL-STATE-STOP-CALLED-100
      required_context:
        line_stop_id: present
        defect_id: present

    - name: quarantine
      description: "All affected sheets segregated; manual count confirmed; retrospective sampling underway"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J157-RECALL-STATE-QUARANTINE-101
      required_context:
        sheets_segregated_count: present
        sampling_plan_chosen: present

    - name: defect_root_cause
      description: "Root cause investigation in progress; plant-maintenance inspection linked"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J157-RECALL-STATE-DEFECT-ROOT-CAUSE-102
      required_context:
        inspection_id: present
        root_cause_confirmed: present

    - name: customer_notify
      description: "Customer notified; awaiting customer confirmation + scope agreement"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J157-RECALL-STATE-CUSTOMER-NOTIFY-103
      required_context:
        customer_notification_event: present
        customer_response_sla_clock_started: present

    - name: recall_execute
      description: "Recall actions in execution: corrections, sample shipments, re-run scheduled"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J157-RECALL-STATE-RECALL-EXECUTE-104
      required_context:
        customer_confirmed_scope: true
        capa_filed: true

    - name: closure_post_mortem
      description: "All recall actions complete; post-mortem documented; audit chain sealed"
      is_initial: false
      is_terminal: true
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J157-RECALL-STATE-CLOSURE-105
      required_context:
        all_tasks_complete: true
        post_mortem_filed: true

  # ============================================
  # §2 Valid transitions (8)
  # ============================================
  transitions:
    - from: stop_called
      to: quarantine
      label: "complete quarantine + manual count"
      preconditions:
        - tasks_completed:
            - task-j157-001-line-stop
            - task-j157-002-in-transit-quarantine
            - task-j157-003-count-clean-sheets
            - task-j157-004-segregate-suspect-sheets
        - manual_count_confirmed: true
      audit_class: EVT-J157-RECALL-TRANSITION-100-TO-101

    - from: quarantine
      to: defect_root_cause
      label: "begin root cause investigation"
      preconditions:
        - tasks_completed:
            - task-j157-005-retrospective-sample-aql-0.4
            - task-j157-006-photo-defects
        - sample_results_recorded: true
      audit_class: EVT-J157-RECALL-TRANSITION-101-TO-102

    - from: defect_root_cause
      to: customer_notify
      label: "root cause sufficient to notify customer (need not be fully confirmed)"
      preconditions:
        - defect_classified: true
        - root_cause_hypothesis_recorded: true
      audit_class: EVT-J157-RECALL-TRANSITION-102-TO-103

    - from: customer_notify
      to: recall_execute
      label: "customer confirmed scope; CAPA filed; proceed with execution"
      preconditions:
        - customer_confirmation_received: true
        - capa_filed: true
        - tasks_completed:
            - task-j157-008-customer-notification
            - task-j157-011-capa-correction-corrective-preventive
      audit_class: EVT-J157-RECALL-TRANSITION-103-TO-104

    - from: recall_execute
      to: closure_post_mortem
      label: "all execution actions complete; close recall + post-mortem"
      preconditions:
        - tasks_completed:
            - task-j157-007-ship-samples-customer-qa
            - task-j157-009-mechanical-inspection-dampener-cylinder
            - task-j157-012-customer-recall-execute-do-not-ship
            - task-j157-014-closure-post-mortem
        - root_cause_confirmed: true
        - capa_endorsed_managing_director: true
      audit_class: EVT-J157-RECALL-TRANSITION-104-TO-105

    # Defensive: emergency re-open from closure (rare; manager override required)
    - from: closure_post_mortem
      to: recall_execute
      label: "re-open closed recall (new evidence)"
      preconditions:
        - manager_override_signature: required
        - new_evidence_link: present
      audit_class: EVT-J157-RECALL-REOPEN-EMERGENCY-106

    # Customer-confirmation timeout escalation path
    - from: customer_notify
      to: customer_notify
      label: "customer SLA breached; escalate to alternate contact (idempotent)"
      preconditions:
        - sla_response_time_hours_exceeded: true
      audit_class: EVT-J157-RECALL-SLA-BREACH-ESCALATE-107

    # Regulator-escalation path (only when customer-side authority grants)
    - from: recall_execute
      to: recall_execute
      label: "escalate to ANMDMR regulator (customer-authorized only)"
      preconditions:
        - customer_authority_explicit_grant: true
        - regulator_template_status_target: "sent"
      audit_class: EVT-J157-RECALL-REGULATOR-ESCALATE-108

  # ============================================
  # §3 Forbidden transitions (Cedar dual-seal deny)
  # ============================================
  forbidden_transitions:
    - from: stop_called
      to: customer_notify
      forbid_rule_id: forbid-recall-skip-1
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: stop_called
      to: recall_execute
      forbid_rule_id: forbid-recall-skip-2
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: stop_called
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-3
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: quarantine
      to: recall_execute
      forbid_rule_id: forbid-recall-skip-4
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: quarantine
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-5
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: defect_root_cause
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-6
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

    - from: customer_notify
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-7
      audit_class: EVT-J157-WORKFLOW-INVALID-TRANSITION-012f

  # ============================================
  # §4 Cedar guards (per transition)
  # ============================================
  cedar_guards:
    - guard_id: guard-operator-active-shift
      description: "Transitions initiated by operator must be on active shift"
      applies_to_principal_roles:
        - press_operator_day_shift
        - press_operator_night_shift
      context_required:
        shift_active: true

    - guard_id: guard-managing-director-endorsement
      description: "CAPA endorsement requires managing_director role"
      applies_to_transitions:
        - customer_notify → recall_execute
      context_required:
        capa_endorsed_managing_director: true

    - guard_id: guard-customer-confirmation
      description: "Cross-tenant confirmation from customer required before recall_execute"
      applies_to_transitions:
        - customer_notify → recall_execute
      context_required:
        customer_confirmation_received: true

    - guard_id: guard-diacritic-policy
      description: "All persisted text fields must be UTF-8 NFC with diacritics preserved"
      context_required:
        unicode_normalization: NFC
        diacritics_preserved: true

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants:
      - tipografia-lazar-petrescu-ro
      - antibiotice-sa-ro
    retention_years: 15  # pharma recall retention per ANMDMR
    merkle_anchor: per-transition
    iso_9001_compatible: true
