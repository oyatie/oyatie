// j171 — Ombudsperson privileged cross-tenant mediation proto3 message definitions
// Bundle id: journey-messages-j171
// ADR-0246 (MLS E2EE) + ADR-0263 (observability emission contract) + ADR-0244 (cross-tenant scoping) + ADR-0253 (HTTP/3 QUIC transport)

syntax = "proto3";

package oyatie.user_journeys.j171.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================
// Enums
// ============================================================

enum PrivilegeClass {
  PRIVILEGE_CLASS_UNSPECIFIED = 0;
  OMBUDSPERSON_PRIVILEGED = 1;
  OMBUDSPERSON_PRIVILEGED_DYAD = 2;
  COMMUNITY_PUBLIC = 3;
  CONFIDENTIAL_EXECUTIVE = 4;
  OMBUDSPERSON_SUPERVISED = 5;
}

enum PayloadClass {
  PAYLOAD_CLASS_UNSPECIFIED = 0;
  OMBUDSPERSON_CLARIFICATION_QUESTION = 1;
  OMBUDSPERSON_MEDIATION_OPTION = 2;
  OMBUDSPERSON_RESOLUTION_PROPOSAL = 3;
  COMPLAINANT_NARRATIVE = 4;
  COMPLAINANT_EVIDENCE_ATTACHMENT = 5;
  COMPLAINANT_DECISION_INTENT = 6;
  OMBUDSPERSON_RECOMMENDATION_NO_IDENTITY = 7;
  SYSTEM_META_MESSAGE = 8;
}

enum ChannelClass {
  CHANNEL_CLASS_UNSPECIFIED = 0;
  OMBUDSPERSON_PRIVILEGED_DYAD = 1;
  CONFIDENTIAL_EXECUTIVE = 2;
  SUPERVISED_APOLOGY_DRAFT = 3;
  COMMUNITY_PUBLIC = 4;
}

enum RetentionClass {
  RETENTION_CLASS_UNSPECIFIED = 0;
  OMBUDSPERSON_PRIVILEGED_7Y = 1;
  OMBUDSPERSON_PRIVILEGED_25Y_IF_MINOR = 2;
  COMMUNITY_PUBLIC_2Y = 3;
}

enum ItemClass {
  ITEM_CLASS_UNSPECIFIED = 0;
  WHATSAPP_SCREENSHOT = 1;
  CONTEMPORANEOUS_NOTE = 2;
  RECONSTRUCTION = 3;
  RESPONDENT_NOTIFICATION_ACKNOWLEDGMENT = 4;
  WRITTEN_APOLOGY = 5;
  OMBUDS_RECOMMENDATION = 6;
}

enum CaseState {
  CASE_STATE_UNSPECIFIED = 0;
  INTAKE_RECEIVED = 1;
  TRIAGE = 2;
  PRIVILEGED_CHANNEL_OPEN = 3;
  EVIDENCE_COLLECTED = 4;
  MEDIATION = 5;
  RESOLUTION = 6;
  ARCHIVE = 7;
  ESCALATION_TO_GOVERNANCE = 8;
}

enum RegulatorClass {
  REGULATOR_CLASS_UNSPECIFIED = 0;
  EU_WD_ARTICLE_22 = 1;
  SOX_806_SUBPOENA = 2;
  KR_ACRC_ARTICLE_13_DEMAND = 3;
  SG_COURT_ORDER = 4;
}

enum ProofClass {
  PROOF_CLASS_UNSPECIFIED = 0;
  INCLUSION_PROOF_ONLY_WITHOUT_PAYLOAD = 1;
  PAYLOAD_DISCLOSURE_WITH_COURT_ORDER = 2;
}

// ============================================================
// Common types
// ============================================================

message PrincipalRef {
  string principal_id = 1;  // e.g. "felix.tan@halberd-mercer-holdings-corporate-sg"
  string tenant_id = 2;     // e.g. "halberd-mercer-holdings-corporate-sg"
  string tenant_class = 3;  // "personal" | "corporate" | "subsidiary"
}

message AttachmentRef {
  string filename = 1;
  uint64 size_bytes = 2;
  string content_sha256 = 3;
  string mime_type = 4;
}

message Text {
  string text_b64 = 1;        // base64 UTF-8 NFC byte-exact
  string lang_primary = 2;     // BCP-47, e.g. "zh-Hant", "en-SG"
  string lang_secondary = 3;
}

message CrossTenantPrincipalMapping {
  PrincipalRef personal_principal = 1;
  string employer_tenant_id = 2;
  string employer_record_id = 3;
  string ombuds_office_tenant_id = 4;
  PrivilegeClass privilege_class = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ============================================================
// Community appeal handoff (§1)
// ============================================================

message CommunityPostRemoveRequest {
  string tenant_id = 1;
  string channel_id = 2;
  string post_id = 3;
  string removal_reason_code = 4;
  PrincipalRef moderator_principal = 5;
  google.protobuf.Timestamp removal_time = 6;
}

message CommunityAppealInitiateRequest {
  PrincipalRef appealing_principal = 1;
  string appealed_post_id = 2;
  bool appeal_path_community_moderator_review = 3;
  bool appeal_path_ombudsperson_office_handoff = 4;
  Text narrative_text = 5;
  repeated AttachmentRef attachments = 6;
  google.protobuf.Timestamp initiated_at = 7;
}

message CreateOmbudsCaseRequest {
  string complainant_personal_tenant_id = 1;
  PrincipalRef complainant_personal_principal = 2;
  string complainant_employer_tenant_id = 3;
  string complainant_employer_record_id = 4;
  string ombuds_office_tenant_id = 5;
  Text narrative_text = 6;
  repeated AttachmentRef attachments = 7;
  string source_community_post_id = 8;
  PrivilegeClass privilege_class = 9;
  google.protobuf.Timestamp received_at = 10;
}

// ============================================================
// Ombuds intake (§2)
// ============================================================

message OmbudsIntakeQueueRequest {
  PrincipalRef principal = 1;
  string role_assertion = 2;
  string title_attestation_id = 3;
  string passkey_assertion_token = 4;
  string yubikey_attestation = 5;
}

message OmbudsCaseSummary {
  string case_id = 1;
  CaseState state = 2;
  string class_label = 3;
  string priority_tier = 4;
  PrivilegeClass privilege_class = 5;
  google.protobuf.Timestamp intake_time = 6;
}

message OmbudsIntakeQueueResponse {
  repeated OmbudsCaseSummary cases = 1;
}

message OmbudsCaseOpenRequest {
  string case_id = 1;
  PrincipalRef principal = 2;
  PrivilegeClass privilege_class_assertion = 3;
}

// ============================================================
// Privileged channel (§3)
// ============================================================

message OpenPrivilegedChannelRequest {
  string case_id = 1;
  ChannelClass channel_class = 2;
  repeated PrincipalRef permitted_principals = 3;
  RetentionClass retention_class = 4;
  string cell_primary = 5;
  string cell_mirror = 6;
  string metadata_visibility = 7;  // "redacted" | "visible"
  string mls_group_id = 8;
  uint64 mls_epoch = 9;
  bool mandatory_reporter_exception_armed = 10;
  google.protobuf.Timestamp opened_at = 11;
}

message SendPrivilegedMessageRequest {
  string channel_id = 1;
  PrincipalRef sender_principal = 2;
  PayloadClass payload_class = 3;
  bytes mls_encrypted_payload = 4;
  Text text_preview_redacted = 5;  // optional preview text for audit-side metadata only; NEVER includes actual content payload
  google.protobuf.Timestamp sent_at = 6;
}

message PrivilegedMessageReceipt {
  string message_id = 1;
  string channel_id = 2;
  string audit_event_id = 3;
  uint64 mls_epoch = 4;
  google.protobuf.Timestamp received_at = 5;
}

// ============================================================
// WORM evidence (§4)
// ============================================================

message CreatePrivilegedWORMRoomRequest {
  string room_id = 1;
  PrivilegeClass privilege_class = 2;
  RetentionClass retention_class = 3;
  string retention_basis_id = 4;
  string cell_primary = 5;
  string cell_mirror = 6;
  string worm_seal_class = 7;
  repeated PrincipalRef write_principals = 8;
  repeated PrincipalRef read_principals = 9;
  bool regulator_compulsion_path_enabled = 10;
  string e2ee_at_rest_algo = 11;
  string key_derivation = 12;
}

message WORMWriteRequest {
  string room_id = 1;
  string item_id = 2;
  string filename = 3;
  bytes content = 4;            // ChaCha20-Poly1305 encrypted
  string content_sha256 = 5;     // post-decrypt
  string content_mime_type = 6;
  uint64 content_size_bytes = 7;
  PrincipalRef author_principal = 8;
  ItemClass item_class = 9;
  google.protobuf.Timestamp authored_at = 10;
  google.protobuf.Timestamp uploaded_at = 11;
  bool privileged_content_tag = 12;
}

message WORMWriteResponse {
  string item_id = 1;
  string merkle_leaf_id = 2;
  string seal_state = 3;  // "sealed" after write completes
  google.protobuf.Timestamp sealed_at = 4;
}

// ============================================================
// Merkle anchor (§4.3)
// ============================================================

message EmitPrivilegedAnchorRequest {
  string anchor_id = 1;
  string case_id = 2;
  uint32 leaf_count = 3;
  bytes merkle_root = 4;
  string privilege_content_tag = 5;
  string external_transparency_log_batch = 6;
  ProofClass proof_class = 7;
  repeated RegulatorClass compulsion_paths = 8;
  google.protobuf.Timestamp emitted_at = 9;
}

message InclusionProofRequest {
  string anchor_id = 1;
  string regulator_compulsion_order_id = 2;
  RegulatorClass regulator_class = 3;
  bool corporate_counsel_review_present = 4;
}

message InclusionProofResponse {
  string anchor_id = 1;
  bytes proof_bytes = 2;
  ProofClass proof_class = 3;  // always INCLUSION_PROOF_ONLY_WITHOUT_PAYLOAD by default
  google.protobuf.Timestamp emitted_at = 4;
}

// ============================================================
// Mediation outcome (§7)
// ============================================================

message MediationOutcomeRecordRequest {
  string outcome_id = 1;
  string case_id = 2;
  string outcome_class = 3;  // "ombudsperson_mediated_resolution"
  repeated string elements = 4;
  bool anti_retaliation_protection_active = 5;
  uint32 audit_chain_anchor_count = 6;
  string external_transparency_log_final_batch = 7;
  google.protobuf.Timestamp recorded_at = 8;
}

// ============================================================
// Transfer activation (§7.3)
// ============================================================

message TransferActivateRequest {
  string transfer_id = 1;
  string employee_record = 2;
  string from_team = 3;
  string to_team = 4;
  bool salary_preserved = 5;
  bool seniority_preserved = 6;
  bool bonus_eligibility_preserved = 7;
  uint32 one_time_allowance_sgd = 8;
  string effective_date = 9;
  bool anti_retaliation_protection_active = 10;
  uint32 retaliation_monitoring_duration_months = 11;
  string transfer_authority_path = 12;
}

// ============================================================
// Case archive (§8)
// ============================================================

message CaseArchiveRequest {
  string case_id = 1;
  CaseState final_state = 2;
  string close_reason_code = 3;
  double total_duration_days = 4;
  string respondent_action_class = 5;
  string complainant_action_class = 6;
  RetentionClass retention_class = 7;
  string retention_end_date = 8;
  bool anti_retaliation_monitoring_active = 9;
  string regulator_compulsion_state = 10;
  string mandatory_reporter_exception_state = 11;
  string community_appeal_handoff_state = 12;
  google.protobuf.Timestamp closed_at = 13;
}

// ============================================================
// Cedar deny coverage (§9)
// ============================================================

message DenyAttempt {
  PrincipalRef principal = 1;
  uint32 count = 2;
  google.protobuf.Timestamp first = 3;
}

message CedarDenyCoverageReport {
  string case_id = 1;
  repeated DenyAttempt denied_enumeration_attempts = 2;
  uint32 denied_payload_class_attempts = 3;
  string mandatory_reporter_exception_state = 4;
  string regulator_compulsion_state = 5;
  uint32 observability_redaction_pct = 6;
}

// ============================================================
// Pack manifest (§10.1)
// ============================================================

message PackManifestAssertion {
  string case_id = 1;
  repeated string active_packs = 2;
  string cross_validation_state = 3;
  string pack_manifest_signature = 4;
  google.protobuf.Timestamp asserted_at = 5;
}

// ============================================================
// Mandatory-reporter exception (§11)
// ============================================================

message MandatoryReporterEvaluateRequest {
  string case_id = 1;
  bool child_safety_flag = 2;
  bool criminal_threat_flag = 3;
  bool imminent_harm_flag = 4;
  bool secondary_ombudsperson_concurrence_present = 5;
}

message MandatoryReporterEvaluateResponse {
  string case_id = 1;
  string evaluation_result = 2;  // "not_triggered" | "triggered_with_concurrence" | "triggered_pending_concurrence"
  string deny_test_row_id = 3;
  google.protobuf.Timestamp evaluated_at = 4;
}

// ============================================================
// Observability redaction (§10.2)
// ============================================================

message RedactionVerification {
  string case_id = 1;
  uint64 metrics_emissions_total = 2;
  uint64 redacted_metrics_emissions = 3;
  double redaction_pct = 4;
  uint32 payload_class_leakage_count = 5;
  string metric_taxonomy_redaction_rule_version = 6;
  google.protobuf.Timestamp verified_at = 7;
}

// ============================================================
// Audit event envelope
// ============================================================

message AuditEvent {
  string event_id = 1;
  string event_class = 2;  // e.g. "EVT-J171-PRIVILEGED-CHANNEL-OPENED-003"
  string case_id = 3;
  PrincipalRef actor_principal = 4;
  PrivilegeClass privilege_class = 5;
  bool cross_tenant_call = 6;
  string cedar_permit_id = 7;
  string redaction_state = 8;
  google.protobuf.Timestamp emitted_at = 9;
}
