---
doc_class: User-Journey-State-Machine
journey_id: j171-felix-tan-ombudsperson-cross-tenant-mediation-with-privilege
date: 2026-05-20
authority_tier: 2

machine:
  id: ombuds-case-Δ47
  name: ombudsperson-mediated-harassment-case-lifecycle
  description: 7-state lifecycle for ombudsperson-privileged cross-tenant mediation under EU-WD + SOX-806 + KR-ACRC + IOA Standards + SG Workplace Fairness Act.
  initial_state: intake_received
  terminal_states:
    - archive
    - escalation_to_governance

states:
  - id: intake_received
    description: Case received via community-appeal handoff and/or complainant self-intake.
    on_entry:
      - emit_event: EVT-J171-COMPLAINANT-INTAKE-INITIATED-Δ000
      - cross_tenant_principal_mapping_create
    transitions:
      - to: triage
        when: ombudsperson_principal_opens_case
        cedar_permit: ombudsperson_certified_ioa + case_assignment

  - id: triage
    description: Ombudsperson reviews narrative, attachments, priority tier, mandatory-reporter exception flags.
    on_entry:
      - emit_event: EVT-J171-INTAKE-INITIATED-002
      - mandatory_reporter_exception_evaluate (deny-test row)
    transitions:
      - to: privileged_channel_open
        when: complainant_consent_to_privileged_channel
        cedar_permit: ombudsperson + complainant_consent
      - to: archive
        when: complainant_withdraws_at_triage
        cedar_permit: ombudsperson + complainant_consent_withdrawal
      - to: escalation_to_governance
        when: mandatory_reporter_exception_triggered_with_concurrence
        cedar_permit: ombudsperson + secondary_ombudsperson_concurrence

  - id: privileged_channel_open
    description: MLS E2EE dyad channel established between ombudsperson and complainant.
    on_entry:
      - emit_event: EVT-J171-PRIVILEGED-CHANNEL-OPENED-003
      - mls_group_create epoch=0
    transitions:
      - to: evidence_collected
        when: first_evidence_upload_complete
        cedar_permit: write_principals_in_allowlist

  - id: evidence_collected
    description: Evidence items written to WORM drive room; Merkle anchor emitted with privileged-content tag.
    on_entry:
      - emit_event: EVT-J171-EVIDENCE-ROOM-CREATED-Δ004a
      - emit_event: EVT-J171-EVIDENCE-WORM-WRITTEN-004
      - emit_event: EVT-J171-MERKLE-PRIVILEGED-ANCHOR-005
    transitions:
      - to: mediation
        when: complainant_outcome_preference_recorded
        cedar_permit: ombudsperson + payload_class_complainant_decision_intent
      - to: escalation_to_governance
        when: complainant_elects_formal_investigation
        cedar_permit: ombudsperson + complainant_explicit_consent

  - id: mediation
    description: Ombudsperson + complainant negotiate mediation options; ombuds office transmits recommendation to CEO + ARC chair; respondent notified.
    on_entry:
      - emit_event: EVT-J171-MEDIATION-OPTIONS-006
    transitions:
      - to: resolution
        when: complainant_accepts_mediation_outcome
        cedar_permit: complainant.mediation_outcome_confirm
      - to: archive
        when: complainant_withdraws_at_mediation
        cedar_permit: complainant + withdrawal_consent
      - to: escalation_to_governance
        when: complainant_escalates_during_mediation
        cedar_permit: complainant.escalation_consent

  - id: resolution
    description: Mediation outcome enacted — written reprimand + reassignment + apology + transfer support + coaching + file entry.
    on_entry:
      - emit_event: EVT-J171-RESPONDENT-NOTIFIED-Δ006b
      - emit_event: EVT-J171-APOLOGY-DRAFT-Δ006d
      - emit_event: EVT-J171-APOLOGY-DELIVERED-Δ006e
      - emit_event: EVT-J171-TRANSFER-ACTIVATED-Δ006f
      - emit_event: EVT-J171-MEDIATION-OUTCOME-007
    transitions:
      - to: archive
        when: outcome_elements_complete_and_complainant_confirms_close
        cedar_permit: ombudsperson + case_owner

  - id: archive
    description: Case archived; WORM evidence retained 7 years; anti-retaliation monitoring active 24 months; community-appeal handoff resolved redacted.
    on_entry:
      - emit_event: EVT-J171-CASE-ARCHIVED-Δ007
      - emit_event: EVT-J171-FINAL-ANCHOR-Δ007a
      - emit_event: EVT-J171-COMMUNITY-APPEAL-RESOLVED-REDACTED-Δ007b
      - emit_event: EVT-J171-CEDAR-DENY-COVERAGE-008
      - emit_event: EVT-J171-PACK-MANIFEST-009
      - emit_event: EVT-J171-MANDATORY-REPORTER-NOT-TRIGGERED-010
      - emit_event: EVT-J171-OBSERVABILITY-REDACTED-011
    is_terminal: true

  - id: escalation_to_governance
    description: Case escalated to formal investigation; privilege scope narrows; investigation Cedar bundle activates.
    on_entry:
      - emit_event: EVT-J171-ESCALATION-GATE-INVOKED
      - governance_investigation_cedar_bundle_activate
    is_terminal: true
    note: Not invoked in the j171 happy path; deny-test exercise only.

transitions_invariants:
  - all_transitions_require_cedar_permit
  - cross_tenant_calls_require_privilege_class_validation
  - WORM_sealed_items_immutable_after_seal
  - merkle_anchor_proof_class_must_be_inclusion_proof_only_without_payload_unless_court_order
  - mandatory_reporter_exception_requires_secondary_ombudsperson_concurrence
  - escalation_to_governance_requires_complainant_explicit_consent_OR_mandatory_reporter_exception
  - archive_state_is_terminal_with_7y_retention
  - observability_emissions_must_be_redacted_per_ADR-0263

retention:
  privileged_evidence_retention_class: ombudsperson_privileged_7y
  retention_basis: halberd-mercer-ombuds-office-records-retention-rule-2024-v3
  retention_cell_primary: eu-frankfurt-tier-1-privileged-worm
  retention_cell_mirror: sg-singapore-tier-2-corporate
  anti_retaliation_monitoring_duration_months: 24
  statute_of_limitations_complainant_reopen_months: 24
  external_transparency_log_batch_cadence: daily-1800-SGT

regulator_compulsion_paths:
  - id: EU_WD_Article_22
    description: EU Whistleblower Directive 2019/1937 Article 22 — regulator compulsion exception
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: specific_court_order + complainant_consent_OR_court_override
  - id: SOX_806_subpoena
    description: US Sarbanes-Oxley §806 subpoena
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: specific_court_order
  - id: KR_ACRC_Article_13_demand
    description: KR Anti-Corruption Act Article 13 demand
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: specific_court_order
  - id: SG_Court_Order
    description: Singapore court order
    proof_default: inclusion_proof_only_without_payload
    payload_disclosure_requires: specific_court_order

audit_events:
  - id: EVT-J171-COMPLAINANT-INTAKE-INITIATED-Δ000
    state: intake_received
    privilege_class: ombudsperson_privileged
  - id: EVT-J171-COMMUNITY-APPEAL-HANDOFF-001
    state: intake_received
    privilege_class: ombudsperson_privileged
  - id: EVT-J171-INTAKE-INITIATED-002
    state: triage
    privilege_class: ombudsperson_privileged
  - id: EVT-J171-PRIVILEGED-CHANNEL-OPENED-003
    state: privileged_channel_open
    privilege_class: ombudsperson_privileged_dyad
  - id: EVT-J171-EVIDENCE-WORM-WRITTEN-004
    state: evidence_collected
    privilege_class: ombudsperson_privileged
  - id: EVT-J171-MERKLE-PRIVILEGED-ANCHOR-005
    state: evidence_collected
    privilege_class: privileged-content-tag
  - id: EVT-J171-MEDIATION-OPTIONS-006
    state: mediation
    privilege_class: ombudsperson_privileged
  - id: EVT-J171-MEDIATION-OUTCOME-007
    state: resolution
    privilege_class: governance-record
  - id: EVT-J171-CEDAR-DENY-COVERAGE-008
    state: archive
    privilege_class: enforcement-report
  - id: EVT-J171-PACK-MANIFEST-009
    state: archive
    privilege_class: governance-record
  - id: EVT-J171-MANDATORY-REPORTER-NOT-TRIGGERED-010
    state: archive
    privilege_class: deny-test
  - id: EVT-J171-OBSERVABILITY-REDACTED-011
    state: archive
    privilege_class: redaction-attestation
