# -------------------------------------------------------------
# Compliance bindings
# -------------------------------------------------------------

compliance:
  gdpr_lawful_basis_per_lead:
    - art_6_1_f_legitimate_interest_b2b
    - art_6_1_a_consent_for_natural_persons
  joint_controllership: gdpr_art_26
  dpa_attestation: att-dpa-glacpl-mfg-q1-2026-1230
  data_residency_primary: eu-amsterdam-secondary
  retention_after_archive_years: 7
  audit_event_class_on_settlement: EVT-J154-PAYMENTS-ATTRIBUTION-SETTLEMENT-014
  audit_event_replication_tenants:
    - partnerlift_nl
    - glacier_erp_de
    - glacier-partnerlift-q1-2027-mfg-de-nl-be

# -------------------------------------------------------------
# Anti-fraud controls
# -------------------------------------------------------------

anti_fraud:
  - rule: same_email_routed_within_24h_dedupe
    action: keep_earliest_lead_id_shared
  - rule: per_company_domain_quota_per_month
    quota: 12
    action: flag_for_human_review
  - rule: linkedin_lead_gen_form_must_have_valid_company_urn
    action: reject_lead_with_audit
  - rule: minimum_form_dwell_time_seconds
    threshold: 4
    action: hold_for_review_if_dwell_below_threshold

# -------------------------------------------------------------
# Failure semantics
# -------------------------------------------------------------

failure_handling:
  hubspot_5xx:
    retry: exponential_backoff
    max_attempts: 5
    on_max_attempts: hold_in_quarantine_emit_audit
  salesforce_5xx:
    retry: exponential_backoff
    max_attempts: 5
    on_max_attempts: hold_in_quarantine_emit_audit
  one_crm_success_other_failure:
    behavior: continue_partial_seal_with_remediation_task
    audit_event_class: EVT-J154-CRM-LEAD-PARTIAL-ROUTE-NNN
  attribution_math_overflow:
    behavior: refuse_settlement_escalate_to_treasury_oncall
    audit_event_class: EVT-J154-PAYMENTS-SETTLEMENT-MATH-FAIL-NNN
