# j154 — Attribution rule for Glacier-PartnerLift Q1-2027 manufacturing campaign
# File: attr-rule-glacpl-60-40
#
# Authority: docs/user-journeys/j154-tomas-pieter-channel-partner-co-marketing-launch/handshake.md §5.1
# Bound to: ADR-0314 marketplace as universal deal settlement
# Contract reference: PartnerLift x Glacier ERP co-marketing master agreement, signed 2026-12-15
#
# Lifecycle: takes effect with the campaign launch (2027-01-12 09:00 CET) and
# settles at the Q1 attribution timer fire (2027-03-31 23:59 CET). After
# settlement, the rule is sealed read-only for the 7-year retention window.

rule_id: attr-rule-glacpl-60-40
version: 1.0.0
status: active
applied_to_campaign: camp-glacpl-mfg-q1-2027
applied_to_shared_tenant: glacier-partnerlift-q1-2027-mfg-de-nl-be
contract_attestation_id: att-contract-glacpl-master-2026-12-15
dpa_attestation_id: att-dpa-glacpl-mfg-q1-2026-1230
currency: EUR
escrow_id: esc-glacpl-mfg-q1-2027
escrow_amount_minor_units: 18000000   # €180,000.00

# -------------------------------------------------------------
# Per-source rules
# -------------------------------------------------------------
# Each rule names:
#   - source: the lead-origin classifier produced by marketing-automation
#   - source_share: the share credited to the partner whose channel sourced the lead
#   - partner_share: the share credited to the partner counterparty
#   - route_to: the CRM destinations (always both, per §5 of handshake)
#   - notes: rationale tied to the master agreement clauses

rules:
  - source: mfg.glacier-erp.de.email_form_submit
    source_partner: glacier_erp_de
    partner_partner: partnerlift_nl
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      Glacier's branded email asset sourced the lead. Glacier gets 60%
      because they own the sender domain and the asset content. PartnerLift
      receives 40% per the master agreement §4.2 "channel partner backbone
      credit" — the partner is rewarded for the cross-border distribution
      lift even when the asset is vendor-branded.

  - source: mfg.partnerlift.nl.email_form_submit
    source_partner: partnerlift_nl
    partner_partner: glacier_erp_de
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      PartnerLift's branded asset; symmetric treatment to Glacier-sourced.

  - source: joint.glacier-partnerlift.eu.lp_form_fill
    source_partner: shared
    partner_partner: shared
    source_share: 0.50
    partner_share: 0.50
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      Joint landing page; both partners contributed equally to copy +
      tracking. Master agreement §4.4 "split-credit pool" — equal share.

  - source: linkedin.lead_gen_form.glacier_funded
    source_partner: glacier_erp_de
    partner_partner: partnerlift_nl
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      LinkedIn Lead Gen Form on a Glacier-funded ad. Funding partner gets
      60%; the partner-of-record on the LinkedIn page is also Glacier;
      PartnerLift's 40% reflects the joint pipeline credit.

  - source: linkedin.lead_gen_form.partnerlift_funded
    source_partner: partnerlift_nl
    partner_partner: glacier_erp_de
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      Symmetric to Glacier-funded LinkedIn.

  - source: google_display.gdn_campaign_glacier_funded
    source_partner: glacier_erp_de
    partner_partner: partnerlift_nl
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      Google Display campaign banner→LP path; Glacier-funded.

  - source: google_display.gdn_campaign_partnerlift_funded
    source_partner: partnerlift_nl
    partner_partner: glacier_erp_de
    source_share: 0.60
    partner_share: 0.40
    route_to:
      - "hubspot://partnerlift_nl"
      - "salesforce://glacier_erp_de"
    notes: |
      Symmetric.

# -------------------------------------------------------------
# Q1 escrow settlement formula
# -------------------------------------------------------------
# Inputs:
#   leads_converted_glacier_sourced: count of leads sourced from Glacier
#     channels (mfg.glacier-erp.de.email_form_submit, linkedin.lead_gen_form.glacier_funded,
#     google_display.gdn_campaign_glacier_funded) that closed-won in Q1
#   leads_converted_partnerlift_sourced: count of leads sourced from
#     PartnerLift channels that closed-won in Q1
#   leads_converted_joint_pool: count of leads sourced from
#     joint.glacier-partnerlift.eu.lp_form_fill that closed-won in Q1
#   revenue_attributed_minor_units: total ARR signed in Q1 attributed
#     to the campaign (per joint analytics projection)

settlement:
  function: f_settle_v3_co_marketing_60_40_with_split_credit_pool
  spec: |
    let glacier_credit_to_partnerlift = leads_converted_glacier_sourced * 0.40
    let partnerlift_credit_to_glacier  = leads_converted_partnerlift_sourced * 0.60
    let joint_credit_to_each           = leads_converted_joint_pool * 0.50

    # Compute per-lead avg ACV (deterministic, audited):
    let total_converted = leads_converted_glacier_sourced
                       + leads_converted_partnerlift_sourced
                       + leads_converted_joint_pool
    let avg_acv_minor   = revenue_attributed_minor_units / total_converted

    # Compute credit-balanced cash flows:
    let glacier_owes_partnerlift_minor =
        (glacier_credit_to_partnerlift * avg_acv_minor) * 0.05    # 5% credit-cash conversion
    let partnerlift_owes_glacier_minor =
        (partnerlift_credit_to_glacier * avg_acv_minor) * 0.05

    let net_flow_to_partnerlift_minor =
        glacier_owes_partnerlift_minor - partnerlift_owes_glacier_minor

    # Apply to escrow (€90,000 each):
    let escrow_share_minor = 9_000_000
    let to_glacier_minor    = escrow_share_minor + (partnerlift_owes_glacier_minor)
                                                 - (glacier_owes_partnerlift_minor)
    let to_partnerlift_minor= escrow_share_minor + (glacier_owes_partnerlift_minor)
                                                 - (partnerlift_owes_glacier_minor)

    # Both fixed in minor units (cents); rounded to whole-cent banker's
    # rounding. Sum must equal 18_000_000.

  rounding: bankers_to_minor_units
  sum_invariant_minor_units: 18000000

