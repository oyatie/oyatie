syntax = "proto3";

package oya.journey.j154.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// j154 — Channel-partner co-marketing trinity messages.
// Authority: docs/user-journeys/j154-tomas-pieter-channel-partner-co-marketing-launch/handshake.md
// Bound to: ADR-0244 tenant scoping; ADR-0273 sender-domain alignment;
//           ADR-0272 cookie consent; ADR-0263 audit emission contract;
//           ADR-0311 dual-tenant identity boundary;
//           ADR-0314 marketplace settlement.

// ============================================================
// §1 Tenancy: shared co-marketing tenant lifecycle
// ============================================================

message SharedTenantProvisionRequest {
  string requested_tenant_id = 1;
  TenantClass tenant_class = 2;
  repeated JointController joint_controllers = 3;
  string data_residency_primary = 4;
  repeated string data_residency_replicas = 5;
  LifecyclePlan lifecycle_plan = 6;
  bool co_sign_required = 7;
  repeated string pack_overlays_requested = 8;
  string requesting_principal = 9;
  string requesting_tenant_id = 10;
}

enum TenantClass {
  TENANT_CLASS_UNSPECIFIED = 0;
  TENANT_CLASS_SHARED_CO_MARKETING_PAIR = 1;
  TENANT_CLASS_SHARED_CO_MARKETING_TRIO = 2;
  TENANT_CLASS_SHARED_CO_MARKETING_CONSORTIUM = 3;
}

message JointController {
  string tenant_id = 1;
  JointControllerRole role = 2;
  string sponsor_principal = 3;
}

enum JointControllerRole {
  JOINT_CONTROLLER_ROLE_UNSPECIFIED = 0;
  JOINT_CONTROLLER_ROLE_PARTNERLIFT = 1;
  JOINT_CONTROLLER_ROLE_GLACIER = 2;
  JOINT_CONTROLLER_ROLE_THIRD = 3;
}

message LifecyclePlan {
  google.protobuf.Timestamp active_until = 1;
  google.protobuf.Timestamp wind_down_at = 2;
  google.protobuf.Timestamp archive_at = 3;
  uint32 retention_after_archive_years = 4;
}

message SharedTenantProvisioned {
  string tenant_id = 1;
  TenantState tenant_state = 2;
  string cedar_bundle_id = 3;
  repeated string joint_controllers_active = 4;
  string kms_root_key_id = 5;
  repeated string audit_streams_primed = 6;
  google.protobuf.Timestamp provisioned_at = 7;
}

enum TenantState {
  TENANT_STATE_UNSPECIFIED = 0;
  TENANT_STATE_PENDING_CO_SIGN = 1;
  TENANT_STATE_PROVISIONED = 2;
  TENANT_STATE_ACTIVE = 3;
  TENANT_STATE_WINDING_DOWN = 4;
  TENANT_STATE_ARCHIVED = 5;
}

// ============================================================
// §2 Connect: tri-party DPA attestation
// ============================================================

message DpaTriPartyAttestation {
  string attestation_id = 1;
  string provisioning_id = 2;
  string dpa_pdf_sha256_hex = 3;
  repeated DpaSignatory signatories = 4;
  DpaClass dpa_class = 5;
  google.protobuf.Timestamp stored_at = 6;
  google.protobuf.Timestamp retention_until = 7;
  repeated string stored_in_audit_trails = 8;
}

message DpaSignatory {
  string principal = 1;
  SignatoryRole role = 2;
  SigningMethod signing_method = 3;
  bool verified = 4;
  string signing_cert_chain_root = 5;
  google.protobuf.Timestamp signed_at = 6;
}

enum SignatoryRole {
  SIGNATORY_ROLE_UNSPECIFIED = 0;
  SIGNATORY_ROLE_CONTROLLER_PARTNERLIFT_CMO = 1;
  SIGNATORY_ROLE_CONTROLLER_GLACIER_CMO = 2;
  SIGNATORY_ROLE_SHARED_CONTROLLER_COUNSEL = 3;
  SIGNATORY_ROLE_DPO_OBSERVER = 4;
}

enum SigningMethod {
  SIGNING_METHOD_UNSPECIFIED = 0;
  SIGNING_METHOD_ADOBE_AES_EU = 1;
  SIGNING_METHOD_DOCUSIGN_QES_EIDAS = 2;
  SIGNING_METHOD_OYA_PASSKEY_NATIVE = 3;
}

enum DpaClass {
  DPA_CLASS_UNSPECIFIED = 0;
  DPA_CLASS_GDPR_ART_28_PROCESSOR = 1;
  DPA_CLASS_GDPR_ART_26_JOINT_CONTROLLERS = 2;
}

// ============================================================
// §3 Comms-email: sender-domain alignment
// ============================================================

message SenderDomainRegistration {
  string sender_domain_id = 1;
  string domain = 2;
  string owner_tenant = 3;
  repeated string use_in_shared_tenants = 4;
  ReputationClass reputation_class = 5;
  uint32 daily_send_budget_planned = 6;
  uint32 warmup_curve_days = 7;
  string dkim_selector = 8;
  string spf_include = 9;
  string dmarc_policy_target = 10;
  bool dkim_aligned = 11;
  bool spf_aligned = 12;
  bool dmarc_published = 13;
  double reputation_score = 14;
  uint32 daily_send_budget_active = 15;
}

enum ReputationClass {
  REPUTATION_CLASS_UNSPECIFIED = 0;
  REPUTATION_CLASS_MARKETING_B2B_MID_MARKET = 1;
  REPUTATION_CLASS_MARKETING_B2B_ENTERPRISE = 2;
  REPUTATION_CLASS_TRANSACTIONAL = 3;
  REPUTATION_CLASS_NOTIFICATION = 4;
}

// ============================================================
// §4 Marketing-automation: campaign + lead routing
// ============================================================

message CampaignLaunchRequest {
  string campaign_id = 1;
  google.protobuf.Timestamp scheduled_launch_at = 2;
  repeated string sequences_in_scope = 3;
  repeated string linkedin_ads_in_scope = 4;
  repeated string google_display_in_scope = 5;
  string launching_principal = 6;
  repeated string approval_chain_present = 7;
  bool deliverability_pre_check_passed = 8;
  string dpa_attestation_id = 9;
  string cedar_bundle_id = 10;
}

message LeadRoutedEvent {
  string lead_id_shared = 1;
  string email_sha256 = 2;
  bytes email_pii_encrypted_blob = 3;
  string company_domain = 4;
  string company_size_band = 5;
  string country = 6;
  string source_url = 7;
  string form_id = 8;
  ConsentSnapshot consent = 9;
  CoMarketingAttribution co_marketing_attribution = 10;
  repeated RouteOutcome route_outcomes = 11;
  google.protobuf.Timestamp captured_at = 12;
}

message ConsentSnapshot {
  bool marketing_email_optin = 1;
  ConsentMethod marketing_email_optin_method = 2;
  google.protobuf.Timestamp marketing_email_optin_at = 3;
  bool tracking_cookies_optin = 4;
  bool personalization_optin = 5;
  bool advertising_optin = 6;
  string consent_record_id = 7;
}

enum ConsentMethod {
  CONSENT_METHOD_UNSPECIFIED = 0;
  CONSENT_METHOD_SINGLE_OPTIN = 1;
  CONSENT_METHOD_DOUBLE_OPTIN_PENDING = 2;
  CONSENT_METHOD_DOUBLE_OPTIN_CONFIRMED = 3;
  CONSENT_METHOD_LEGITIMATE_INTEREST_B2B = 4;
}

message CoMarketingAttribution {
  string rule_id = 1;
  string source_partner = 2;
  string partner_partner = 3;
  double source_share = 4;
  double partner_share = 5;
}

message RouteOutcome {
  RouteTarget target = 1;
  uint32 status_code = 2;
  string external_id = 3;
  google.protobuf.Timestamp completed_at = 4;
}

enum RouteTarget {
  ROUTE_TARGET_UNSPECIFIED = 0;
  ROUTE_TARGET_HUBSPOT_PARTNERLIFT = 1;
  ROUTE_TARGET_SALESFORCE_GLACIER = 2;
  ROUTE_TARGET_OYA_SHARED_LEAD_POOL = 3;
}

// ============================================================
// §5 Compliance: DSA transparency log
// ============================================================

message DsaImpressionRecord {
  string campaign_id = 1;
  string ad_id = 2;
  Platform platform = 3;
  string targeting_criteria_hash = 4;
  string targeting_criteria_plain = 5;
  string advertiser_legal_name_partnerlift = 6;
  string advertiser_legal_name_glacier = 7;
  string advertiser_paid_for_by = 8;
  google.protobuf.Timestamp impression_at = 9;
  string country_eu = 10;
  string tenant_id = 11;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_LINKEDIN_ADS = 1;
  PLATFORM_GOOGLE_DISPLAY = 2;
  PLATFORM_META_ADS = 3;
}

// ============================================================
// §6 Payments: escrow + Q1 settlement
// ============================================================

message EscrowSetup {
  string escrow_id = 1;
  string tenant_id = 2;
  string purpose = 3;
  string currency = 4;
  uint64 amount_minor_units = 5;
  repeated EscrowContribution contributions = 6;
  string release_rule_ref = 7;
  google.protobuf.Timestamp released_at_target = 8;
  SettlementPartitionMethod settlement_partition_method = 9;
  EscrowState state = 10;
  string kms_partition_key = 11;
}

message EscrowContribution {
  string contributor_tenant = 1;
  uint64 amount_minor_units = 2;
  google.protobuf.Timestamp sepa_credit_at = 3;
}

enum SettlementPartitionMethod {
  SETTLEMENT_PARTITION_UNSPECIFIED = 0;
  SETTLEMENT_PARTITION_ATTRIBUTION_WEIGHTED_PER_LEAD_PER_REVENUE = 1;
  SETTLEMENT_PARTITION_FLAT_50_50 = 2;
  SETTLEMENT_PARTITION_FLAT_60_40 = 3;
}

enum EscrowState {
  ESCROW_STATE_UNSPECIFIED = 0;
  ESCROW_STATE_FUNDING = 1;
  ESCROW_STATE_FUNDED = 2;
  ESCROW_STATE_SETTLING = 3;
  ESCROW_STATE_SETTLED = 4;
}

message AttributionSettlement {
  string escrow_id = 1;
  string settlement_id = 2;
  google.protobuf.Timestamp settlement_at = 3;
  uint64 revenue_attributed_minor_units = 4;
  string currency = 5;
  repeated DisbursementTransfer transfers = 6;
  string audit_event_class = 7;
}

message DisbursementTransfer {
  string to_tenant = 1;
  uint64 amount_minor_units = 2;
  string reason = 3;
  string sepa_pacs008_message_id = 4;
}

// ============================================================
// §7 Audit-chain: seal contract (ADR-0263 trinity replication)
// ============================================================

message AuditSealRequest {
  string event_class = 1;       // EVT-J154-...
  string tenant_id = 2;
  string journey_id = 3;        // j154
  string trace_id = 4;
  string subject_principal = 5;
  string resource_ref = 6;
  google.protobuf.Timestamp occurred_at = 7;
  google.protobuf.Struct payload = 8;
  string emitting_microservice = 9;
  repeated string trinity_replication_tenants = 10;
}

message AuditSealResponse {
  string audit_event_id = 1;
  string merkle_proof = 2;
  google.protobuf.Timestamp sealed_at = 3;
}
