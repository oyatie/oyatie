// j161 — Soyeon Kim school cafeteria allergen recall RPC messages
// proto3; package versioned per ADR-0244 tenant scoping
// Hangul + multi-script preservation: ALL string fields are UTF-8 NFC; no Romanization in legal fields.
// Cross-tenant audit dual-seal mandatory under ADR-0263.

syntax = "proto3";

package oya.journeys.j161.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // UTF-8 NFC; e.g. soyeon.kim@seonhwa-cho-yuseong-daejeon-kr
  string home_tenant = 2;
  string acting_tenant = 3;
  enum TenantClass {
    SCHOOL_TENANT = 0;
    REGULATOR_TENANT = 1;
    DISTRICT_OFFICE_TENANT = 2;
    SUPPLIER_TENANT = 3;
    HOSPITAL_TENANT = 4;
    COMMUNITY_TENANT = 5;
    PARENT_PERSONAL_TENANT = 6;
  }
  TenantClass tenant_class = 4;
  string passkey_assertion_b64 = 5;
  repeated string roles_in_acting_tenant = 6;
  repeated string active_certifications = 7;
  string locale = 8;                  // ko-KR primary
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;                    // ap-seoul-primary
  string trace_id = 3;
  string locale = 4;
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  repeated string sealing_tenants = 6;
  bool truetime_class = 7;
}

message DiacriticPolicy {
  string unicode_normalization = 1;   // MUST be "NFC"
  bool diacritics_preserved = 2;      // MUST be true
  bool hangul_canonical = 3;
  bool vietnamese_tones_preserved = 4;
  bool chinese_simplified_canonical = 5;
  bool mongolian_cyrillic_canonical = 6;
  bool romanize_to_ascii = 7;         // forbidden in legal fields unless explicit consent
  bool user_explicit_consent_to_romanize = 8;
}

// ---------- §1 Allergen alert + food-service halt ----------

message AllergicReactionAlert {
  TenantContext tenant_ctx = 1;
  string student_id = 2;
  string student_class = 3;
  google.protobuf.Timestamp reported_at = 4;
  string reporting_principal = 5;     // boarding teacher / nurse
  repeated string symptoms_observed = 6;
  bool epi_administered = 7;
  bool ems_called = 8;
  string suspected_trigger = 9;
}

message FoodServiceHaltRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string menu_date = 3;
  string menu_id = 4;
  google.protobuf.Timestamp halt_initiated_at = 5;
  string halt_reason = 6;             // UTF-8 NFC
  enum AuthorityBasis {
    KR_SCHOOL_NUTRITIONIST_2011 = 0;
    KR_NUTRITIONIST_LICENSE_2002 = 1;
    KR_FSA_ARTICLE_44 = 2;
    PRINCIPAL_GATED_FALLBACK = 3;
  }
  AuthorityBasis authority_basis = 7;
  string alert_reference = 8;
  uint32 students_affected_known = 9;
  uint32 students_potentially_affected = 10;
}

message FoodServiceHaltResponse {
  string halt_id = 1;
  google.protobuf.Timestamp halt_command_sent_at = 2;
  google.protobuf.Timestamp halt_confirmed_at = 3;
  uint32 trays_recovered_pending = 4;
  repeated string next_seatings_cancelled = 5;
  AuditAnchor audit = 6;
}

// ---------- §2 Ingredient trace ----------

message IngredientTraceRequest {
  string menu_id = 1;
  string trace_class = 2;             // all_dishes_all_ingredients_with_supplier_lots
  bool cross_reference_allergen_bulletins = 3;
  repeated string cross_reference_targets = 4;
}

message IngredientTraceResponse {
  message DishIngredient {
    string dish_id = 1;
    string ingredient_name = 2;
    string supplier_tenant = 3;
    string supplier_lot = 4;
    bool allergen_bulletin_flagged = 5;
    string bulletin_reference = 6;
    string allergen_class = 7;
  }
  repeated DishIngredient items = 1;
  string suspect_lot = 2;
  repeated string affected_dishes = 3;
  uint32 affected_student_count_estimate = 4;
}

message ConfirmSuspectIngredientRequest {
  string recall_id = 1;
  string suspect_ingredient = 2;
  string suspect_supplier = 3;
  string suspect_lot = 4;
  string supplier_bulletin_ref = 5;
  string school_receiving_log_ref = 6;
  google.protobuf.Timestamp confirmed_at = 7;
}

// ---------- §3 Per-family broadcast ----------

message BroadcastPerFamilyPrivacyPreservingRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  enum BroadcastClass {
    SCHOOL_MEAL_ALLERGEN_RECALL_URGENT = 0;
    SCHOOL_MEAL_ALLERGEN_UPDATE = 1;
    SCHOOL_SAFETY_NOTICE = 2;
  }
  BroadcastClass broadcast_class = 3;
  uint32 audience_count = 4;
  bytes school_side_header_text_b64 = 5;
  bytes school_side_footer_text_b64 = 6;
  string per_family_personalization_template_id = 7;
  uint32 kakaotalk_crossover_enabled_families_count = 8;
  bool vi_zh_mn_translations_attached = 9;
  google.protobuf.Timestamp broadcast_at = 10;
  string pipa_consent_basis = 11;
  repeated string co_signers = 12;
}

message BroadcastResponse {
  string broadcast_id = 1;
  uint32 families_delivered_count = 2;
  uint32 families_kakaotalk_crossover_delivered_count = 3;
  uint32 cross_family_leakage_count = 4;  // MUST be 0
  uint32 delivery_latency_p99_seconds = 5;
  AuditAnchor audit = 6;
}

// ---------- §4 KakaoTalk crossover ----------

message KakaoTalkBridgeRequest {
  string family_personal_tenant = 1;
  bool family_kakaotalk_crossover_opted_in = 2;
  string broadcast_class = 3;
  string kr_pipa_consent_basis = 4;
  google.protobuf.Timestamp bridge_at = 5;
}

// ---------- §5 Regulator notifications ----------

message KrMfdsNotificationRequest {
  Principal principal = 1;
  string regulator_tenant = 2;
  string incident_class = 3;
  repeated string kr_fsa_article_ref = 4;   // ["44", "86"]
  string suspected_ingredient = 5;
  uint32 students_confirmed_affected = 6;
  uint32 students_under_investigation = 7;
  string recall_action_taken = 8;
  repeated string audit_chain_ref = 9;
  uint32 sla_clock_hours = 10;
  google.protobuf.Timestamp notified_at = 11;
}

message KrDeemNotificationRequest {
  Principal principal = 1;
  string regulator_tenant = 2;
  string incident_class = 3;
  repeated string kr_school_meals_act_ref = 4;  // ["17", "19"]
  uint32 sla_clock_hours = 5;
  google.protobuf.Timestamp notified_at = 6;
  google.protobuf.Timestamp follow_up_call_scheduled = 7;
}

// ---------- §6 Supplier escalation ----------

message SupplierEscalationThreadCreate {
  Principal principal = 1;
  string group_id_hint = 2;
  repeated string participants = 3;
  repeated string tenant_set = 4;
  string retention_policy = 5;
  repeated string locale_set = 6;
}

message SupplierEscalationPost {
  Principal principal = 1;
  string group_id = 2;
  google.protobuf.Timestamp post_at = 3;
  uint64 mls_epoch_at_post = 4;
  bytes ciphertext_b64 = 5;
  string structured_payload_hash_sha256 = 6;
  string escalation_class = 7;
  uint32 sla_response_within_hours = 8;
}

// ---------- §7 Hospital cross-tenant share ----------

message HospitalCrossTenantShareRequest {
  string source_tenant = 1;
  string target_tenant = 2;
  string share_class = 3;
  string patient_external_ref_principal = 4;
  string pipa_consent_basis = 5;
  message StatusSummary {
    string arrival_status = 1;
    string vital_signs_status = 2;
    string ward_status = 3;
    string alert_status = 4;
  }
  StatusSummary status_summary = 6;
  google.protobuf.Timestamp shared_at = 7;
}

// ---------- §8 Incident report co-sign ----------

message IncidentReportCoSignRequest {
  string incident_report_id = 1;
  string co_signing_principal = 2;
  google.protobuf.Timestamp co_signed_at = 3;
  string passkey_assertion_b64 = 4;
  DiacriticPolicy diacritic_policy = 5;
}

// ---------- §9 CAPA filing ----------

message CapaFileRequest {
  string capa_id = 1;
  string defect_link = 2;
  repeated string correction = 3;
  repeated string corrective_action = 4;
  repeated string preventive_action = 5;
  google.protobuf.Timestamp filed_at = 6;
  string filed_by = 7;
  string endorsed_by = 8;
  DiacriticPolicy diacritic_policy = 9;
}

// ---------- §10 Recall state machine ----------

message RecallStateTransition {
  string recall_id = 1;
  enum State {
    SERVICE_HALTED = 0;
    QUARANTINE_COMPLETE = 1;
    INGREDIENT_TRACED = 2;
    PARENT_NOTIFIED = 3;
    REGULATOR_NOTIFIED = 4;
    ROOT_CAUSE_CONFIRMED = 5;
    CLOSURE_POST_MORTEM = 6;
  }
  State from_state = 2;
  State to_state = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  repeated string evidence_links = 5;
}

// ---------- §11 Community participation ----------

message CommunityPostRequest {
  Principal principal = 1;
  string principal_tenant_origin = 2;
  string community_tenant = 3;
  string group_id = 4;
  enum PostType {
    QUESTION = 0;
    REPLY = 1;
    INCIDENT_RETROSPECTIVE = 2;
    ANNOUNCEMENT = 3;
    POLL = 4;
  }
  PostType post_type = 5;
  bytes post_body_ciphertext_b64 = 6;
  uint64 mls_epoch_at_post = 7;
  google.protobuf.Timestamp posted_at = 8;
  repeated string tags = 9;
  bool anonymize_school_name_option = 10;
}
