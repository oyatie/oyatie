# j161 — School-meal allergen recall state machine
# 7 states + 8 valid transitions + Cedar guards + per-state audit class.
# Driven by workflow-engine. Skip transitions are forbidden;
# Cedar FORBID-8 in cedar-policy.cedar dual-seals deny audits for invalid skips.
#
# State machine version: v1 (matches ISO 22000:2018 §8.9 + KR-SchoolMealsAct + KR-FSA Article 44/86 lifecycle)

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: recall-school-meal-allergen-cross-tenant-v1
  workflow_template: wkfl-recall-school-meal-allergen-v1
  adr_refs:
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0252  # HLC + TrueTime for CAPA fence
    - ADR-0251  # compliance pack primitive
    - ADR-0311  # dual-tenant boundary
  regulator_anchors:
    - KR-FSA-Act-No-14476-Article-44-operator-halt-authority
    - KR-FSA-Act-No-14476-Article-86-regulator-notification-24h
    - KR-SchoolMealsAct-Article-17-incident-report
    - KR-SchoolMealsAct-Article-19-recall-protocols
    - KR-PIPA-2020-Article-15-lawful-basis
    - KR-PIPA-2020-Article-29-sensitive-info-handling
    - ISO-22000-2018-§8.9-food-safety-incident-management
    - HACCP-CCP-3-allergen-control

spec:
  # ============================================
  # §1 States (7)
  # ============================================
  states:
    - name: service_halted
      description: "Food service halted by operator; recall workflow created"
      is_initial: true
      is_terminal: false
      cedar_action_required: workflow.recall_initiate
      audit_class_on_enter: EVT-J161-STATE-SERVICE-HALTED-200
      required_context:
        halt_id: present
        alert_reference: present

    - name: quarantine_complete
      description: "All served + unserved trays segregated; subsequent seatings cancelled"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-QUARANTINE-201
      required_context:
        trays_recovered_count: present
        seatings_cancelled_count: present

    - name: ingredient_traced
      description: "Suspect ingredient lot confirmed; affected dishes identified"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-INGREDIENT-TRACED-202
      required_context:
        suspect_lot: present
        affected_dishes: present

    - name: parent_notified
      description: "All 805 families notified via per-family privacy-preserving broadcast"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-PARENT-NOTIFIED-203
      required_context:
        broadcast_id: present
        per_family_privacy_attestation: true

    - name: regulator_notified
      description: "KR-MFDS + KR-DEEM both notified within their SLAs"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-REGULATOR-NOTIFIED-204
      required_context:
        mfds_notification_event: present
        deem_notification_event: present

    - name: root_cause_confirmed
      description: "Root cause confirmed via ingredient trace + supplier acknowledgment + (where applicable) hospital diagnosis"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-ROOT-CAUSE-205
      required_context:
        root_cause_confirmed: true
        supplier_acknowledgment: true

    - name: closure_post_mortem
      description: "All recall actions complete; post-mortem documented; audit chain sealed"
      is_initial: false
      is_terminal: true
      cedar_action_required: workflow.recall_transition
      audit_class_on_enter: EVT-J161-STATE-CLOSURE-206
      required_context:
        capa_filed: true
        post_mortem_completed: true
        supplier_switch_initiated: true

  # ============================================
  # §2 Valid transitions (8)
  # ============================================
  transitions:
    - from: service_halted
      to: quarantine_complete
      label: "all trays recovered + subsequent seatings cancelled"
      preconditions:
        - tasks_completed:
            - task-j161-001-food-service-halt
            - task-j161-002-in-progress-tray-recovery
            - task-j161-003-second-seating-cancelled
            - task-j161-004-third-seating-cancelled
            - task-j161-005-segregate-served-and-unserved
        - manual_count_confirmed: true
      audit_class: EVT-J161-TRANSITION-200-TO-201

    - from: quarantine_complete
      to: ingredient_traced
      label: "ingredient trace + suspect lot confirmation"
      preconditions:
        - tasks_completed:
            - task-j161-006-ingredient-trace
            - task-j161-007-peanut-or-cross-contact-identify
            - task-j161-008-supplier-lot-confirm
        - suspect_lot_confirmed: true
      audit_class: EVT-J161-TRANSITION-201-TO-202

    - from: ingredient_traced
      to: parent_notified
      label: "805 parents notified via per-family broadcast"
      preconditions:
        - tasks_completed:
            - task-j161-012-805-parent-notification
        - per_family_privacy_attestation_zero_leakage: true
        - kakaotalk_crossover_opt_in_honored: true
      audit_class: EVT-J161-TRANSITION-202-TO-203

    - from: parent_notified
      to: regulator_notified
      label: "MFDS + DEEM notified within SLAs"
      preconditions:
        - tasks_completed:
            - task-j161-013-mfds-notify
            - task-j161-014-deem-notify
        - mfds_within_24h: true
        - deem_within_4h: true
      audit_class: EVT-J161-TRANSITION-203-TO-204

    - from: regulator_notified
      to: root_cause_confirmed
      label: "root cause confirmed via supplier ack + hospital diagnosis"
      preconditions:
        - tasks_completed:
            - task-j161-015-supplier-escalation
            - task-j161-016-hospital-follow-up
            - task-j161-017-root-cause-confirm
        - supplier_acknowledgment: true
        - hospital_diagnosis_aligned: true
      audit_class: EVT-J161-TRANSITION-204-TO-205

    - from: root_cause_confirmed
      to: closure_post_mortem
      label: "CAPA filed + supplier switch initiated + closure meeting held"
      preconditions:
        - tasks_completed:
            - task-j161-018-capa-plan
            - task-j161-019-closure-post-mortem
        - capa_filed: true
        - vp_co_sign_complete: true
        - supplier_switch_to_cj_foodville_initiated: true
        - dem_closure_meeting_held: true
      audit_class: EVT-J161-TRANSITION-205-TO-206

    # Defensive: re-open closed recall if new evidence emerges
    - from: closure_post_mortem
      to: root_cause_confirmed
      label: "re-open closed recall (rare; principal override required)"
      preconditions:
        - principal_override_signature: required
        - new_evidence_link: present
      audit_class: EVT-J161-RECALL-REOPEN-EMERGENCY-207

    # Parent broadcast retry (rare; per-family delivery failure)
    - from: parent_notified
      to: parent_notified
      label: "broadcast retry for sub-set of families with delivery failure"
      preconditions:
        - retry_target_families_count_positive: true
        - retry_within_2h_window: true
      audit_class: EVT-J161-PARENT-BROADCAST-RETRY-208

  # ============================================
  # §3 Forbidden transitions (Cedar dual-seal deny)
  # ============================================
  forbidden_transitions:
    - from: service_halted
      to: parent_notified
      forbid_rule_id: forbid-recall-skip-1
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-300

    - from: service_halted
      to: regulator_notified
      forbid_rule_id: forbid-recall-skip-2
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-301

    - from: service_halted
      to: root_cause_confirmed
      forbid_rule_id: forbid-recall-skip-3
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-302

    - from: service_halted
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-4
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-303

    - from: quarantine_complete
      to: regulator_notified
      forbid_rule_id: forbid-recall-skip-5
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-304

    - from: quarantine_complete
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-6
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-305

    - from: ingredient_traced
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-7
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-306

    - from: parent_notified
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-8
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-307

    - from: regulator_notified
      to: closure_post_mortem
      forbid_rule_id: forbid-recall-skip-9
      audit_class: EVT-J161-WORKFLOW-INVALID-TRANSITION-308

  # ============================================
  # §4 Cedar guards (per transition)
  # ============================================
  cedar_guards:
    - guard_id: guard-school-nutritionist-cert-active
      description: "Operator transitions initiated by school nutritionist require active certs"
      applies_to_principal_roles:
        - school_nutritionist_manager
      context_required:
        kr_nutritionist_license_2002_unexpired: true
        kr_school_nutritionist_2011_unexpired: true
        iso_22000_2018_competency_unexpired: true

    - guard_id: guard-pipa-consent-basis-broadcast
      description: "Parent broadcast requires PIPA Article 15 lawful-safety basis"
      applies_to_transitions:
        - ingredient_traced → parent_notified
      context_required:
        kr_pipa_consent_basis: kr_pipa_2020_article_15_lawful_safety_basis

    - guard_id: guard-per-family-privacy-zero-leakage
      description: "Parent broadcast must attest 0 cross-family leakage"
      applies_to_transitions:
        - ingredient_traced → parent_notified
      context_required:
        cross_family_leakage_count: 0

    - guard_id: guard-mfds-within-24h
      description: "MFDS notification must be within 24h of detection"
      applies_to_transitions:
        - parent_notified → regulator_notified
      context_required:
        mfds_sla_clock_hours: <=24

    - guard_id: guard-deem-within-4h
      description: "DEEM notification must be within 4h of detection"
      applies_to_transitions:
        - parent_notified → regulator_notified
      context_required:
        deem_sla_clock_hours: <=4

    - guard_id: guard-vp-co-sign
      description: "Closure requires vice-principal co-sign of incident report"
      applies_to_transitions:
        - root_cause_confirmed → closure_post_mortem
      context_required:
        vp_co_sign_complete: true

    - guard_id: guard-supplier-switch-initiated
      description: "Closure requires supplier switch initiation (CJ Foodville)"
      applies_to_transitions:
        - root_cause_confirmed → closure_post_mortem
      context_required:
        supplier_switch_to_cj_foodville_initiated: true

    - guard_id: guard-hangul-strict-mode
      description: "All persisted text fields must be UTF-8 NFC with Hangul preserved"
      applies_globally: true
      context_required:
        unicode_normalization: NFC
        diacritics_preserved: true
        hangul_canonical: true

    - guard_id: guard-kr-cell-residency
      description: "All recall-related data must reside in ap-seoul-primary or KR-residency cell"
      applies_globally: true
      context_required:
        target_cell_in: [ap-seoul-primary, ap-busan-secondary]

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants_per_seal_event:
      - seonhwa-cho-yuseong-daejeon-kr
      - kr-mfds-regulator-tenant
      - kr-daejeon-deem-education-office-tenant
      - daewon-food-processing-ansan-kr
      - cnuh-pediatric-er-tenant
    retention_years: 5  # KR-FSA + ISO 22000 retention
    merkle_anchor: per-transition
    iso_22000_compatible: true
    kr_school_meals_act_compatible: true
    kr_pipa_compatible: true

  # ============================================
  # §6 Per-state SLA window
  # ============================================
  per_state_sla:
    service_halted: 0  # immediate
    quarantine_complete: 0.083  # 5 minutes from halt
    ingredient_traced: 0.5  # 30 minutes from halt
    parent_notified: 0.75  # 45 minutes from halt
    regulator_notified: 4  # DEEM in 4 hours; MFDS within 24 hours but typically much faster
    root_cause_confirmed: 24
    closure_post_mortem: 240  # 10 days; in this story actual closure at 8 days
