// j152 — Ahmad Hassan construction-site incident proto3 messages.
// Field tags are stable across the journey's minor versions; never reuse.
// Major-version bump required to retire any field.

syntax = "proto3";

package network.oya.journey.j152.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ----------------------------------------------------------------------------
// Identity step-up
// ----------------------------------------------------------------------------

message StepUpRequest {
  string principal = 1;
  string intent = 2;
  string tenant_id = 3;
  DeviceAttestation device_attestation = 4;
}

message DeviceAttestation {
  string device_id = 1;
  bytes secure_element_attestation = 2;
  string biometric_match_class = 3;
}

message StepUpResponse {
  string stepup_token = 1;
  uint32 valid_for_seconds = 2;
  google.protobuf.Timestamp issued_at = 3;
  repeated string principal_role_projection = 4;
}

// ----------------------------------------------------------------------------
// Messenger broadcast
// ----------------------------------------------------------------------------

message StopWorkBroadcastRequest {
  string channel_id = 1;
  Urgency urgency = 2;
  repeated string languages = 3;
  map<string, string> bodies = 4;  // language -> body text
  repeated string fanout_targets = 5;
  string incident_link = 6;
  bool require_ack = 7;
  uint32 ack_timeout_seconds = 8;
}

enum Urgency {
  URGENCY_UNSPECIFIED = 0;
  NORMAL = 1;
  HIGH = 2;
  STOP_WORK = 3;
  LIFE_SAFETY = 4;
}

message StopWorkBroadcastResponse {
  string broadcast_id = 1;
  uint32 expected_recipients = 2;
  uint32 expected_ack_count = 3;
}

message StopWorkAckEvent {
  string broadcast_id = 1;
  string device_id = 2;
  string principal = 3;
  google.protobuf.Timestamp acked_at = 4;
  uint32 delivery_latency_ms = 5;
  string rendered_language = 6;
}

// ----------------------------------------------------------------------------
// Incident
// ----------------------------------------------------------------------------

message IncidentCreateRequest {
  google.protobuf.Timestamp occurred_at = 1;
  string deck = 2;
  string grid = 3;
  repeated string affected_workers = 4;
  IncidentClass incident_class = 5;
  string narrative_en = 6;
  string narrative_ar = 7;
  string narrative_es = 8;
  bool auto_attach_telemetry = 9;
  repeated string auto_attach_camera = 10;
  uint32 telemetry_window_seconds = 11;
  uint32 camera_window_seconds = 12;
  string stop_work_broadcast_id = 13;
  string idempotency_key = 14;
}

enum IncidentClass {
  INCIDENT_CLASS_UNSPECIFIED = 0;
  NEAR_MISS = 1;
  FIRST_AID = 2;
  RECORDABLE = 3;
  SERIOUS = 4;
  ESCALATE_TO_911 = 5;
  FATALITY = 6;
}

message IncidentCreateResponse {
  string incident_id = 1;
  string status = 2;
  repeated SideEffect side_effects_scheduled = 3;
  string audit_event_id = 4;
}

message SideEffect {
  string step = 1;
  string ref = 2;
}

// ----------------------------------------------------------------------------
// Medical bypass projection (drive)
// ----------------------------------------------------------------------------

message ProjectMedicalExcerptRequest {
  string worker_id = 1;
  repeated string fields = 2;
  string decision_id = 3;
  string incident_id = 4;
  uint32 ttl_minutes = 5;
}

message ProjectMedicalExcerptResponse {
  bytes encrypted_projection = 1;
  string ks_key_id = 2;
  uint32 fields_returned = 3;
  google.protobuf.Timestamp ttl_expires_at = 4;
}

// ----------------------------------------------------------------------------
// Drive evidence
// ----------------------------------------------------------------------------

message AttachEvidenceRequest {
  string incident_id = 1;
  string source_topic = 2;
  google.protobuf.Timestamp window_center = 3;
  uint32 window_pre_seconds = 4;
  uint32 window_post_seconds = 5;
  EvidenceFormat format = 6;
  string chain_of_custody_intent = 7;
}

enum EvidenceFormat {
  EVIDENCE_FORMAT_UNSPECIFIED = 0;
  CSV = 1;
  AVRO = 2;
  PARQUET = 3;
  H265 = 4;
  WAV = 5;
}

message AttachEvidenceResponse {
  string evidence_id = 1;
  string sha256_hex = 2;
  uint64 bytes = 3;
  string drive_path = 4;
  string audit_event_id = 5;
}

// ----------------------------------------------------------------------------
// Audit-chain seal
// ----------------------------------------------------------------------------

message AuditSealRequest {
  string event_class = 1;
  string tenant_id = 2;
  string journey_id = 3;
  string trace_id = 4;
  string subject_principal = 5;
  string resource_ref = 6;
  google.protobuf.Timestamp occurred_at = 7;
  google.protobuf.Struct payload = 8;
  string emitting_microservice = 9;
}

message AuditSealResponse {
  string audit_event_id = 1;
  string merkle_proof = 2;
  google.protobuf.Timestamp sealed_at = 3;
}
