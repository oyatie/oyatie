asyncapi: "3.1.0"
info:
  title: Crane Load-Pin Telemetry Stream (j152)
  version: 1.0.0-j152
  description: >
    AsyncAPI 3.1.0 contract for the crane.load_pin.sensor_v1 topic used by
    journey j152 (Ahmad Hassan construction-site incident). Each sample is
    50Hz from a Liebherr load-pin sensor. The 90-second window centered on
    an incident-create instant is auto-attached to the incident record.

defaultContentType: application/avro

servers:
  oya-edge-mqtt-us-west-2-oakland:
    host: edge-mqtt.us-west-2-oakland.oya.network
    protocol: mqtts
    description: Edge MQTT broker at the Oakland edge cell

channels:
  crane.load_pin.sensor_v1:
    description: >
      One message per 20ms (50Hz). Partition key is the load-pin sensor ID.
      Retention is a 90-second ring buffer at the edge; only the windows
      attached to an incident record are persisted to drive (cold storage,
      7-year retention under ISO-45001).
    address: crane/load_pin/sensor_v1
    messages:
      sample:
        $ref: "#/components/messages/CraneLoadPinSample"
    parameters:
      sensor_id:
        description: The crane load-pin sensor identifier
        location: $message.payload#/sensor_id

operations:
  publishLoadPinSample:
    action: send
    channel:
      $ref: "#/channels/crane.load_pin.sensor_v1"
    summary: Crane controller publishes a load-pin sample every 20ms
    bindings:
      mqtt:
        qos: 1
        retain: false

  subscribeForIncident:
    action: receive
    channel:
      $ref: "#/channels/crane.load_pin.sensor_v1"
    summary: incident-management subscribes only during an active incident
    bindings:
      mqtt:
        qos: 1

components:
  messages:
    CraneLoadPinSample:
      name: CraneLoadPinSample
      title: Crane load-pin sample
      contentType: application/avro
      payload:
        $ref: "#/components/schemas/CraneLoadPinSampleAvro"
      bindings:
        mqtt:
          topic: crane/load_pin/sensor_v1/{sensor_id}
  schemas:
    CraneLoadPinSampleAvro:
      type: record
      name: CraneLoadPinSample
      namespace: network.oya.crane.telemetry.v1
      fields:
        - name: sensor_id
          type: string
          doc: "Format: crane-{manufacturer}-{model}-S{position}-loadpin (e.g., crane-LB-280-S01-loadpin)"
        - name: site_id
          type: string
        - name: tenant_id
          type: string
        - name: occurred_at
          type:
            type: long
            logicalType: timestamp-micros
        - name: load_newtons
          type: float
          doc: "Instantaneous load in newtons; nominal range 0 - 120000 N"
        - name: angle_degrees
          type: float
          doc: "Boom angle from horizontal, degrees, 0 - 90"
        - name: boom_extension_m
          type: float
        - name: anomaly_flags
          type:
            type: array
            items: string
          doc: "Enum: NONE, OVERLOAD, RAPID_DECREASE, SLING_SHEAR_SUSPECTED, SENSOR_FAULT"
        - name: span_trace_id
          type:
            - "null"
            - string
          default: null
          doc: "If a lift span is open, this carries its trace id; null otherwise"

  messageTraits:
    tenantScoped:
      headers:
        type: object
        required:
          - tenant_id
        properties:
          tenant_id:
            type: string
            description: ADR-0244 tenant scoping invariant
          trace_id:
            type: string

  securitySchemes:
    mqttsClientCertificate:
      type: X509
      description: Crane controller mutual-TLS with cell-pinned CA

defaultContentType: application/avro

x-oya-journey: j152
x-oya-adr-anchors:
  - ADR-0244-tenant-as-universal-scoping-primitive
  - ADR-0263-observability-emission-contract
  - ADR-0253-network-topology-edge-service-mesh
