---
# j152 — workplace-integration field mapping: incident-management → Paycom EIR
# Paycom Employee Injury Report (EIR) endpoint accepts the fields below.
# Mapping rules are applied in the workplace-integration µservice's
# transformer before POST to https://api.paycom.com/v2/employee-injury-reports.
#
# Cardinality is 1:1 unless otherwise stated. Every non-null source field MUST
# produce a value at the target. Missing mandatory target fields fail the sync.

doc_class: workplace-integration-mapping
journey_id: j152-ahmad-hassan-construction-site-incident-bilingual
source_system: oya.incident-management
target_system: paycom.employee-injury-reports.v2
authority_tier: 2
date: 2026-05-20
adr_anchors:
  - ADR-0244-tenant-as-universal-scoping-primitive
  - ADR-0263-observability-emission-contract
  - ADR-0317-role-based-projection-unified-ux-shell

mappings:
  - source_field: tenant_id
    target_field: ClientID
    transform: lookup
    lookup_table: tenant_to_paycom_client
    mandatory: true
    notes: "ADR-0244 invariant. Paycom multi-tenancy is mapped from oya tenant_id"

  - source_field: incident_id
    target_field: ExternalReferenceID
    transform: direct
    mandatory: true
    notes: "Paycom stores this as a string; INC-... prefix preserved"

  - source_field: affected_workers[0]
    target_field: EmployeeID
    transform: federation_lookup
    lookup_table: oya_user_to_paycom_employee
    mandatory: true
    notes: "Single-worker incidents only at this revision; multi-worker is a future enhancement"

  - source_field: occurred_at
    target_field: IncidentDateTime
    transform: iso8601_to_paycom_datetime
    timezone_target: "America/Los_Angeles"
    mandatory: true

  - source_field: site_id
    target_field: WorkLocationCode
    transform: direct
    mandatory: true

  - source_field: incident_class
    target_field: InjurySeverity
    transform: enum_map
    enum_map:
      near_miss: NEAR_MISS
      first_aid: FIRST_AID_ONLY
      recordable: RECORDABLE_OSHA
      serious: SERIOUS_OSHA_RECORDABLE
      escalate_to_911: ESCALATED_911
      fatality: FATALITY
    mandatory: true

  - source_field: narrative_en
    target_field: IncidentDescription
    transform: direct
    mandatory: true
    max_length: 4000
    notes: "Paycom enforces 4000-char limit on the primary description"

  - source_field: narrative_ar
    target_field: IncidentDescriptionAlt
    transform: direct
    max_length: 4000
    notes: "Per EEOC overlay; if absent, the field is empty but the sync still proceeds"

  - source_field: transport_log.destination_facility
    target_field: TreatmentFacility
    transform: direct
    notes: "Set only after AMR ePCR bridge fires; nullable on initial sync"

  - source_field: oshe_recordable_provisional
    target_field: RecordableFlag
    transform: bool_to_enum
    bool_map:
      true: PROVISIONAL_PENDING_REVIEW
      false: NOT_RECORDABLE
    mandatory: true

  - source_field: workers_comp_claim_class_provisional
    target_field: WorkersCompClaimFlag
    transform: enum_map
    enum_map:
      indemnity: INDEMNITY
      medical_only: MEDICAL_ONLY
      pending_review: PENDING_REVIEW
    default: PENDING_REVIEW

  - source_field: deck
    target_field: WorkAreaSubCode
    transform: prefix
    prefix: "DECK-"

  - source_field: grid
    target_field: WorkAreaSubCode2
    transform: direct
    mandatory: false

idempotency:
  key_field: ExternalReferenceID
  on_collision: update_in_place
  notes: "If Paycom already has the EIR with this incident_id, update fields; do not create a duplicate"

retry_policy:
  retry_on_status: [502, 503, 504]
  max_attempts: 5
  base_backoff_seconds: 2
  jitter_pct: 20
  max_total_wait_seconds: 300
  escalate_after_max: notify_hse_officer

observability:
  audit_event_class_success: EVT-J152-WORKPLACE-PAYCOM-WRITE
  audit_event_class_retry: EVT-J152-WORKPLACE-PAYCOM-RETRY
  audit_event_class_lookup_fail: EVT-J152-WORKPLACE-PAYCOM-LOOKUP-FAIL
  audit_event_class_tenant_mismatch: EVT-J152-CEDAR-DENY-PAYCOM-TENANT-MISMATCH
  span_name: workplace-integration.paycom.write_eir

negative_cases:
  - case: "Paycom returns 404 for EmployeeID"
    action: emit_lookup_fail; surface manual-entry path to HSE officer
  - case: "Paycom returns 422 (validation)"
    action: emit_validation_fail with field-level error; do not retry
  - case: "Source tenant_id ≠ Paycom client tenant mapping"
    action: Cedar deny upstream; never reach Paycom

x-oya-journey: j152
x-oya-pack-overlay:
  - us-osha
  - us-eeoc-language-access
  - iso-45001
