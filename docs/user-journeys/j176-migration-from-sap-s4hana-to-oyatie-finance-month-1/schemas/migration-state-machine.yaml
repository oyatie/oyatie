---
doc_class: User-Journey-Migration-State-Machine
journey_id: j176-migration-from-sap-s4hana-to-oyatie-finance-month-1
date: 2026-05-20
authority_tier: 2

machine:
  id: j176-vendor-migration
  name: j176-migration-from-sap-s4hana-to-oyatie-finance-month-1
  incumbent: SAP S/4HANA Finance
  target: Oyatie finance
  initial_state: planned
  terminal_states:
    - oyatie_active
    - rolled_back

states:
  - id: planned
    description: Migration scope, source objects, ADRs, and rollback plan are approved.
    transitions:
      - to: source_extracting
        when: claim_accepted_and_credentials_bound
        audit_event: EVT-J176-PLANNED-001
  - id: source_extracting
    description: ODP replication plus signed table export from S/4HANA client 100.
    transitions:
      - to: extract_verified
        when: row_counts_and_hashes_match_manifest
        audit_event: EVT-J176-EXTRACT-002
  - id: extract_verified
    description: Source objects are complete and immutable for migration purposes.
    transitions:
      - to: mapping_applied
        when: all_required_field_mappings_signed
        audit_event: EVT-J176-MAPPING-003
  - id: mapping_applied
    description: Field map is loaded into the migration controller.
    transitions:
      - to: projection_loaded
        when: oyatie.finance.universal_journal_projection_v1_load_complete
        audit_event: EVT-J176-PROJECTION-004
  - id: projection_loaded
    description: Oyatie projection is populated and visible to replacement surfaces.
    transitions:
      - to: parallel_running
        when: replacement_surfaces_pass_smoke_tests
        audit_event: EVT-J176-PARALLEL-005
  - id: parallel_running
    description: four-week shadow close, daily trial balance delta, and hard go/no-go before first Oyatie-led month-end close.
    transitions:
      - to: go_no_go_ready
        when: p0_delta_count_zero_and_p1_deltas_owned
        audit_event: EVT-J176-GONOGO-006
      - to: rolled_back
        when: p0_delta_unresolved_or_rollback_ordered
        audit_event: EVT-J176-ROLLBACK-007
  - id: go_no_go_ready
    description: Executive go/no-go card is complete.
    transitions:
      - to: incumbent_read_only
        when: executive_approval_and_rollback_rehearsal_passed
        audit_event: EVT-J176-FREEZE-008
  - id: incumbent_read_only
    description: Incumbent writes are frozen and Oyatie receives new writes.
    transitions:
      - to: oyatie_active
        when: first_live_business_cycle_passes
        audit_event: EVT-J176-ACTIVE-009
  - id: oyatie_active
    description: Oyatie is active and incumbent is retained as read-only archive.
    is_terminal: true
  - id: rolled_back
    description: Incumbent resumes write authority and Oyatie batch is quarantined or compensated.
    is_terminal: true

invariants:
  - SOX Section 404 internal control over financial reporting
  - SEC Exchange Act Rule 13a-15 disclosure controls and procedures
  - IRS Revenue Procedure 98-25 electronic accounting records
  - EU VAT Directive 2006/112/EC invoice and VAT evidence
  - GDPR Article 30 records of processing for finance-personal-data fields
  - Every event includes tenant_id, source_system, source_hash, projection_name, cedar_decision_id, and rollback_plan_id.
  - No inline vendor credential appears in logs, schemas, events, or dashboard payloads.
