syntax = "proto3";

package oya.journey.j168.ops_review.v1;

option go_package = "github.com/oyatie/oya/journey/j168/ops_review/v1;opsreviewv1";

import "google/protobuf/timestamp.proto";

// j168 — proto3 messages for COO Akira Watanabe Q4 ops review + SEV-2 debrief + Q1-2027 capex.
// All string fields UTF-8 NFC. Japanese kanji + Spanish diacritics preserved.

// =====================================================================
// QUARTERLY SNAPSHOT
// =====================================================================

message QuarterlySnapshot {
  string quarter = 1;                                // Q4-2026
  google.protobuf.Timestamp generated_at_utc = 2;
  string generated_at_local_iana = 3;                // e.g., "2026-05-12T09:00:00+09:00"
  string tenant = 4;
  repeated CellMetrics cells = 5;
  string audit_seal = 6;
  string merkle_root = 7;
  bool sealed = 8;
}

message CellMetrics {
  string cell_id = 1;                                // apac-tokyo-cell-tier-1-primary
  repeated string azs = 2;                           // ["apac-tokyo-az-a", ...]
  Metrics metrics = 3;
}

message Metrics {
  double p99_latency_ms = 1;
  double throughput_req_per_sec = 2;
  double error_budget_burn_rate = 3;
  double capacity_util_pct = 4;
  double headcount_per_az = 5;
  double nps = 6;
  double on_call_burnout_score = 7;
  IncidentCounts incidents = 8;
}

message IncidentCounts {
  uint32 sev_1 = 1;
  uint32 sev_2 = 2;
  uint32 sev_3 = 3;
}

// =====================================================================
// INCIDENT DEBRIEF
// =====================================================================

enum DebriefState {
  DEBRIEF_STATE_UNSPECIFIED = 0;
  SCHEDULED = 1;
  IN_PROGRESS = 2;
  ROOT_CAUSE_IDENTIFIED = 3;
  CORRECTIVE_ACTIONS_DEFINED = 4;
  CORRECTIVE_ACTIONS_FUNDED = 5;
  CORRECTIVE_ACTIONS_IMPLEMENTED = 6;
  ARCHIVED = 7;
}

message IncidentDebrief {
  string debrief_id = 1;
  string incident_id = 2;
  DebriefState state = 3;
  string facilitator_principal = 4;
  google.protobuf.Timestamp scheduled_at_utc = 5;
  string scheduled_at_local_iana = 6;
  repeated string attendees = 7;
  string framework = 8;                              // "5-whys"
  repeated string regulatory_anchors = 9;
  uint32 incident_timeline_record_count = 10;
  string root_cause = 11;
  string secondary_root_cause = 12;
  string audit_seal = 13;
}

message FiveWhysStep {
  string debrief_id = 1;
  uint32 step = 2;                                   // 1..5
  string question_ja_JP = 3;
  string question_en_US = 4;
  string answer_ja_JP = 5;
  string answer_en_US = 6;
  string answer_es_MX = 7;
  repeated string evidence_audit_seals = 8;
  google.protobuf.Timestamp submitted_at = 9;
  string submitted_by_principal = 10;
}

// =====================================================================
// CORRECTIVE ACTIONS
// =====================================================================

enum CorrectiveActionState {
  CORRECTIVE_ACTION_STATE_UNSPECIFIED = 0;
  DRAFT_PENDING_CAPEX_APPROVAL = 1;
  FUNDED = 2;
  IN_PROGRESS = 3;
  COMPLETED = 4;
  VERIFIED = 5;
  CLOSED = 6;
}

message CorrectiveActionItem {
  string item_id = 1;
  string linked_debrief = 2;
  string title = 3;
  string description = 4;
  string owner_team = 5;
  string owner_principal = 6;
  double estimated_eng_hours = 7;
  string target_completion_date = 8;                  // YYYY-MM-DD
  repeated string dependencies = 9;
  CorrectiveActionState state = 10;
  string audit_seal = 11;
}

message CorrectiveActionsBulk {
  string bulk_id = 1;
  string linked_debrief = 2;
  repeated CorrectiveActionItem items = 3;
  uint32 total_items = 4;
  double total_eng_hours = 5;
  double blended_rate_mxn_per_hour = 6;
  double capex_estimate_mxn = 7;
  string audit_seal = 8;
}

// =====================================================================
// CUSTOMER ATTESTATION
// =====================================================================

message CustomerAttestation {
  string attestation_id = 1;
  string source_tenant = 2;
  string target_tenant = 3;                          // komatsu-ltd-jp-tenant
  string target_principal = 4;
  string attestation_type = 5;                       // sev2_root_cause_and_corrective_action
  string incident_id = 6;
  string debrief_id = 7;
  string evidence_bundle_merkle_root = 8;
  double service_credit_mxn = 9;
  google.protobuf.Timestamp in_person_meeting_held_at = 10;
  string in_person_meeting_location = 11;
  bool customer_signed = 12;
  string customer_signer = 13;
  string customer_signature_qes_provider = 14;
  string content_locale = 15;
  bool mls_encryption_active = 16;
  string audit_seal = 17;
  repeated string dual_seal_tenants = 18;
}

// =====================================================================
// CAPEX LINE ITEM
// =====================================================================

enum CapexLineItemState {
  CAPEX_LINE_STATE_UNSPECIFIED = 0;
  DRAFT = 1;
  CRA_SIGNED = 2;
  VOTING_OPEN = 3;
  PERMIT_QUORUM_REACHED = 4;
  DENY_QUORUM_REACHED = 5;
  REVISED_REQUIRED = 6;
  APPROVED = 7;
}

message CapexLineItem {
  string line_item_id = 1;
  string change_record_id = 2;                       // CHG-OKR-Q1-2027-CAPEX-2026-05-18
  string title = 3;
  string description = 4;
  double amount_mxn = 5;
  string okr_cycle = 6;                              // Q1-2027
  string linked_incident = 7;
  CapexLineItemState state = 8;
  repeated CapexLineItemVote votes = 9;
  string audit_seal = 10;
}

message CapexLineItemVote {
  string vote_id = 1;
  string voter_principal = 2;                        // akira.watanabe@...
  string voter_role = 3;                             // coo, ceo, cto, cfo, board_ops_chair
  string decision = 4;                               // PERMIT | DENY | ABSTAIN
  string rationale_es_MX = 5;
  string rationale_en_US = 6;
  string voter_passkey_attestation = 7;
  google.protobuf.Timestamp voted_at = 8;
  double truetime_uncertainty_ms = 9;
}

// =====================================================================
// MERKLE ATTESTATION
// =====================================================================

message MerkleAttestation {
  string attestation_id = 1;
  string scope = 2;
  string merkle_root = 3;
  repeated string scope_includes = 4;
  repeated MerkleSigner signers = 5;
  string audit_seal = 6;
  repeated string dual_seal_tenants = 7;
}

message MerkleSigner {
  string principal = 1;
  string qes_provider = 2;
}

// =====================================================================
// QUARTERLY REPORT
// =====================================================================

message QuarterlyReport {
  string report_id = 1;
  string quarter = 2;
  string tenant = 3;
  string merkle_root = 4;
  repeated string scope = 5;
  repeated AuditorSubmission submissions = 6;
  string signer = 7;
  string signer_qes_provider = 8;
  string audit_seal = 9;
}

message AuditorSubmission {
  string auditor_tenant = 1;
  repeated string evidence_packs = 2;
  google.protobuf.Timestamp acknowledgement_expected_at = 3;
  google.protobuf.Timestamp acknowledged_at = 4;
}
