---
# j168 — Incident debrief state machine (8 states)
# Implements ITIL-v4-IM + NIST-800-61-rev3 + ISO-27035 lifecycle.

state_machine_id: j168-incident-debrief
authority_tier: 2

states:
  - id: incident_closed
    description: SEV incident reaches closed state; debrief is the next step
    entry_actions: [auto_schedule_debrief_within_30_days]

  - id: debrief_scheduled
    description: Debrief facilitator + attendees confirmed; meeting on calendar
    entry_actions: [send_calendar_invites, pre_populate_incident_timeline]
    exit_actions: [seal_debrief_open]

  - id: debrief_in_progress
    description: 5-Whys analysis underway; steps 1..5 being filled
    entry_actions: [open_5_whys_form]
    progress_required: 5_whys_steps_complete

  - id: root_cause_identified
    description: 5-Whys complete; root cause + secondary root cause attached
    entry_actions: [seal_root_cause_identified]
    next_action: define_corrective_actions

  - id: corrective_actions_defined
    description: 87+ corrective actions materialized in tasks µservice
    entry_actions: [bulk_materialize_actions, compute_capex_estimate]
    exit_actions: [seal_corrective_actions_drafted]

  - id: corrective_actions_funded
    description: Capex Cedar approval granted; actions transition to funded
    entry_actions: [transition_actions_to_funded, notify_engineering_teams]
    exit_actions: [seal_capex_linked]

  - id: corrective_actions_implemented
    description: Engineering work completed; verification + close-out
    entry_actions: [start_verification_workflow]
    exit_conditions: [all_actions_verified]

  - id: debrief_archived
    description: Full lifecycle complete; archive to long-term audit-chain
    terminal: true
    entry_actions: [generate_final_post_mortem, submit_to_auditors]

transitions:
  - from: incident_closed
    to: debrief_scheduled
    trigger: facilitator_assigned + attendees_confirmed
    cedar_policy: incident.debrief_open
    audit_class: EVT-J168-DEBRIEF-OPEN-002

  - from: debrief_scheduled
    to: debrief_in_progress
    trigger: scheduled_time_reached + facilitator_in_room

  - from: debrief_in_progress
    to: root_cause_identified
    trigger: 5_whys_steps_5_complete
    cedar_policy: incident.five_whys_step_submit (×5)
    audit_class: EVT-J168-ROOT-CAUSE-IDENTIFIED-003

  - from: root_cause_identified
    to: corrective_actions_defined
    trigger: actions_bulk_materialized
    cedar_policy: tasks.corrective_actions_bulk_create
    audit_class: EVT-J168-CORRECTIVE-ACTIONS-DRAFTED-003a

  - from: corrective_actions_defined
    to: corrective_actions_funded
    trigger: capex_cedar_permit_granted
    cedar_policy: governance.capex_line_item_approve
    audit_class: EVT-J168-CORRECTIVE-ACTIONS-FUNDED-007b

  - from: corrective_actions_funded
    to: corrective_actions_implemented
    trigger: all_engineering_work_complete + verified
    audit_class: EVT-J168-CORRECTIVE-ACTIONS-IMPLEMENTED-012

  - from: corrective_actions_implemented
    to: debrief_archived
    trigger: post_mortem_generated + submitted_to_auditors
    audit_class: EVT-J168-DEBRIEF-ARCHIVED-013

invariants:
  - every_transition_dual_seals_in_aurelia_tenant_and_governance_substrate
  - every_cedar_permit_uses_truetime_fence_le_10ms
  - cannot_skip_states_forward
  - debrief_archived_is_terminal
  - if_corrective_actions_capex_denied: state_returns_to_corrective_actions_defined with revised_required flag
  - if_root_cause_disputed_by_customer: re_open_debrief_in_progress with second_facilitator
