---
# j170 — Emissions report state machine (9 states + 1 archived)

state_machine_id: j170-emissions-report
authority_tier: 2

states:
  - id: prep
    description: FY workflow initialized; 247 tasks materialized; carry-forward items captured
    entry_actions: [materialize_247_tasks, link_carry_forward_items]

  - id: scope_1_2_ingest
    description: 7 plants × 12 months × N meters reading ingest; structured-extract of utility bills
    entry_actions: [start_plant_lead_standups, open_structured_extract_pipeline]

  - id: scope_3_outreach
    description: 412 suppliers contacted; Band A/B/C segmentation + cross-tenant requests
    entry_actions: [segment_suppliers, initiate_cross_tenant_requests]

  - id: scope_3_ingest
    description: Band A activity-data + Band B partial + Band C spend-based ingest
    entry_actions: [open_supplier_submission_window, run_band_c_spend_based_estimation]

  - id: reconciliation
    description: Internal reconciliation + per-supplier data quality check
    entry_actions: [run_yoy_delta, compute_sbti_alignment, generate_per_category_trend]

  - id: assurance_review
    description: E&Y 3-day on-site Merkle attestation replay
    entry_actions: [open_replay_session, schedule_3_day_engagement]
    exit_actions: [seal_assurance_opinion]

  - id: multi_framework_compose
    description: Single Merkle root composes into 4 framework variants
    entry_actions: [compose_cdp_2026, compose_sec_10k_climate, compose_esrs_e1_german, compose_ifrs_s2]

  - id: quorum_signoff
    description: 4-of-4 Cedar quorum (CSO + CFO + GC + Audit-Committee Chair)
    entry_actions: [open_quorum_modal]
    exit_actions: [seal_filing_permit]

  - id: filed
    description: All 4 framework filings submitted to authorities
    entry_actions: [submit_to_sec_edgar, submit_to_cdp, submit_to_bundesanzeiger, publish_ifrs_s2_to_ir]

  - id: archived
    description: Filings archived; SBTi re-validation submitted; FY closed
    terminal: true

transitions:
  - from: prep
    to: scope_1_2_ingest
    trigger: tasks_materialized + plant_leads_briefed
    cedar_policy: compliance.emissions_report_init
    audit_class: EVT-J170-WORKFLOW-INIT-001

  - from: scope_1_2_ingest
    to: scope_3_outreach
    trigger: all_4800_readings_ingested + fas_comsco_variance_lt_0_5pct
    audit_class: EVT-J170-SCOPE-1-COMPLETE-002 + EVT-J170-SCOPE-2-COMPLETE-003

  - from: scope_3_outreach
    to: scope_3_ingest
    trigger: all_412_suppliers_contacted + band_a_50_committed
    cedar_policy: connect.cross_tenant_data_request_initiate
    audit_class: EVT-J170-SCOPE-3-OUTREACH-COMPLETE-004

  - from: scope_3_ingest
    to: reconciliation
    trigger: all_band_a_submitted + band_b_partial_submitted + band_c_modeled
    cedar_policy: connect.supplier_data_submit
    audit_class: EVT-J170-SCOPE-3-INGEST-COMPLETE-005

  - from: reconciliation
    to: assurance_review
    trigger: yoy_delta_computed + sbti_alignment_computed + per_category_trend_generated

  - from: assurance_review
    to: multi_framework_compose
    trigger: assurance_opinion_passed_with_0_material_findings
    cedar_policy: audit-chain.assurance_replay_read
    audit_class: EVT-J170-ASSURANCE-PASSED-007

  - from: multi_framework_compose
    to: quorum_signoff
    trigger: all_4_framework_variants_composed
    cedar_policy: compliance.multi_framework_compose
    audit_class: EVT-J170-MULTI-FRAMEWORK-COMPOSED-008

  - from: quorum_signoff
    to: filed
    trigger: 4_of_4_PERMIT_quorum
    cedar_policy: governance.emissions_report_filing_permit_vote
    audit_class: EVT-J170-FILING-PERMIT-009

  - from: filed
    to: archived
    trigger: all_4_filings_acknowledged + sbti_revalidation_submitted
    audit_class: EVT-J170-FILINGS-COMPLETE-010

invariants:
  - every_state_transition_dual_seals
  - every_supplier_submission_dual_seals_in_supplier_and_mfi_tenants
  - merkle_root_byte_identical_across_4_framework_variants
  - 4_of_4_quorum_required_for_filing_permit (not majority)
  - assurance_opinion_must_have_0_material_findings_before_quorum
  - sbti_alignment_must_be_on_track_for_1_5C_before_quorum
  - archived_is_terminal
