syntax = "proto3";

package oya.journey.j170.emissions.v1;

option go_package = "github.com/oyatie/oya/journey/j170/emissions/v1;emissionsv1";

import "google/protobuf/timestamp.proto";

// j170 — proto3 messages for MFI annual emissions report.
// All string fields UTF-8 NFC. International supplier names + diacritics preserved.

// =====================================================================
// EMISSIONS REPORT + WORKFLOW
// =====================================================================

enum EmissionsReportState {
  EMISSIONS_REPORT_STATE_UNSPECIFIED = 0;
  PREP = 1;
  SCOPE_1_2_INGEST = 2;
  SCOPE_3_OUTREACH = 3;
  SCOPE_3_INGEST = 4;
  RECONCILIATION = 5;
  ASSURANCE_REVIEW = 6;
  MULTI_FRAMEWORK_COMPOSE = 7;
  QUORUM_SIGNOFF = 8;
  FILED = 9;
  ARCHIVED = 10;
}

enum ScopeCategory {
  SCOPE_CATEGORY_UNSPECIFIED = 0;
  SCOPE_1 = 1;
  SCOPE_2_LOCATION = 2;
  SCOPE_2_MARKET = 3;
  SCOPE_3_CAT_1_PURCHASED_GOODS = 4;
  SCOPE_3_CAT_2_CAPITAL_GOODS = 5;
  SCOPE_3_CAT_3_FUEL_ENERGY = 6;
  SCOPE_3_CAT_4_UPSTREAM_TRANSPORT = 7;
  SCOPE_3_CAT_5_WASTE = 8;
  SCOPE_3_CAT_6_BUSINESS_TRAVEL = 9;
  SCOPE_3_CAT_7_EMPLOYEE_COMMUTING = 10;
  SCOPE_3_CAT_8_UPSTREAM_LEASED = 11;
  SCOPE_3_CAT_9_DOWNSTREAM_TRANSPORT = 12;
  SCOPE_3_CAT_10_PROCESSING = 13;
  SCOPE_3_CAT_11_USE_OF_SOLD_PRODUCTS = 14;
  SCOPE_3_CAT_12_END_OF_LIFE = 15;
  SCOPE_3_CAT_13_DOWNSTREAM_LEASED = 16;
  SCOPE_3_CAT_14_FRANCHISES = 17;
  SCOPE_3_CAT_15_INVESTMENTS = 18;
}

message EmissionsReport {
  string report_id = 1;
  string fiscal_year = 2;                            // FY2026
  string tenant = 3;
  EmissionsReportState state = 4;
  repeated string frameworks_in_scope = 5;
  google.protobuf.Timestamp init_at = 6;
  google.protobuf.Timestamp filed_at = 7;
  string single_source_merkle_root = 8;
  double total_emissions_tCO2e = 9;
  double yoy_delta_pct = 10;
  string audit_seal = 11;
}

// =====================================================================
// SUPPLIER DATA
// =====================================================================

enum SupplierBand {
  SUPPLIER_BAND_UNSPECIFIED = 0;
  BAND_A = 1;   // top 50 by spend, full activity-data
  BAND_B = 2;   // 51-200, partial activity-data + spend hybrid
  BAND_C = 3;   // 201-412, spend-based only
}

enum DataQualityTier {
  DATA_QUALITY_TIER_UNSPECIFIED = 0;
  TIER_1_MEASURED = 1;
  TIER_2_PRIMARY_ESTIMATED = 2;
  TIER_3_SECONDARY_INDUSTRY_AVG = 3;
  TIER_4_SPEND_BASED = 4;
}

message Supplier {
  string supplier_tenant = 1;                        // cleveland-cliffs-inc-supplier-tenant
  string supplier_entity_name = 2;
  SupplierBand band = 3;
  double fy_spend_usd = 4;
  string nda_reference = 5;
  bool nda_active = 6;
  string data_submitter_principal = 7;
  string ontology_node_id = 8;                       // ont://Oyatie::SupplyChainPartner/cleveland-cliffs-inc
}

message SupplierEmissionsSubmission {
  string submission_id = 1;
  string supplier_tenant = 2;
  string recipient_tenant = 3;                       // marlboro-forge-industries-inc-cleveland-oh-us
  ScopeCategory scope_category = 4;
  string data_schema = 5;
  ActivityData activity_data = 6;
  DataQualityTier data_quality_tier = 7;
  string boundary_methodology = 8;
  bool nda_signed = 9;
  google.protobuf.Timestamp submitted_at = 10;
  bytes data_submitter_passkey_attestation = 11;
  string audit_seal = 12;
  repeated string dual_seal_tenants = 13;
  string merkle_root_for_submission = 14;
  double truetime_uncertainty_ms = 15;
}

message ActivityData {
  repeated ProductLine product_lines = 1;
  string supplier_entity_name = 2;
  string data_year = 3;
}

message ProductLine {
  string product = 1;                                // iron-ore-pellets
  double tonnes_shipped = 2;
  string production_facility = 3;
  double production_emissions_per_tonne_tCO2e = 4;
  string production_process = 5;                     // natural-gas-DRI
  double h2_dri_pilot_pct = 6;
  DataQualityTier data_quality_tier = 7;
  string boundary_methodology = 8;
}

// =====================================================================
// ONTOLOGY MAPPING
// =====================================================================

message OntologyMapping {
  string supplier_entity_name = 1;
  string supplier_tenant = 2;
  string ontology_node_id = 3;
  string ontology_node_type = 4;                     // Oyatie::SupplyChainPartner
  EmissionsAttributionTags attribution_tags = 5;
  string audit_seal = 6;
}

message EmissionsAttributionTags {
  ScopeCategory scope_category = 1;
  string fy = 2;
  double tonnes_aggregate_tCO2e_attributed = 3;
  DataQualityTier data_quality_tier = 4;
  string boundary_methodology = 5;
  string customer_tenant = 6;                        // for multi-customer suppliers
}

// =====================================================================
// SCOPE 1+2 READINGS
// =====================================================================

message ScopeOneReading {
  string reading_id = 1;                             // cleveland-natural-gas-meter-7847-2026-04-15
  string plant = 2;
  string meter_id = 3;
  string fuel_type = 4;                              // natural-gas, propane, diesel, coal
  double value = 5;
  string unit = 6;                                   // therms, kWh, gallons, tonnes
  google.protobuf.Timestamp reading_period_start = 7;
  google.protobuf.Timestamp reading_period_end = 8;
  string submitter_principal = 9;
  google.protobuf.Timestamp submitted_at = 10;
  string calibration_last_done = 11;
  double fas_comsco_variance_pct = 12;
  string audit_seal = 13;
}

message ScopeTwoReading {
  string reading_id = 1;
  string plant = 2;
  string utility_provider = 3;
  double kwh_consumption = 4;
  double demand_kw = 5;
  double amount_usd = 6;
  double location_based_emission_factor_kgCO2_per_kwh = 7;
  double market_based_emission_factor_kgCO2_per_kwh = 8;
  double location_based_emissions_tCO2e = 9;
  double market_based_emissions_tCO2e = 10;
  string ppa_contract_reference = 11;
  google.protobuf.Timestamp billing_period_start = 12;
  google.protobuf.Timestamp billing_period_end = 13;
  string audit_seal = 14;
}

// =====================================================================
// MULTI-FRAMEWORK COMPOSITION
// =====================================================================

enum Framework {
  FRAMEWORK_UNSPECIFIED = 0;
  GHG_PROTOCOL_CORPORATE_STANDARD = 1;
  ISO_14064_1 = 2;
  CDP_2026 = 3;
  SEC_CLIMATE_DISCLOSURE = 4;
  EU_CSRD_ESRS_E1 = 5;
  ISSB_IFRS_S2 = 6;
  SBTI_NET_ZERO = 7;
}

message FrameworkVariant {
  Framework framework = 1;
  string report_artifact_id = 2;
  string filing_authority_tenant = 3;
  string format = 4;                                 // structured JSON, XBRL, text, etc.
  string language = 5;                               // en-US, de-DE, etc.
  string single_source_merkle_root_reference = 6;
  string audit_seal = 7;
}

// =====================================================================
// FILING + QUORUM
// =====================================================================

enum VoteDecision {
  VOTE_DECISION_UNSPECIFIED = 0;
  PERMIT = 1;
  DENY = 2;
  ABSTAIN = 3;
}

message FilingPermitVote {
  string vote_id = 1;
  string report_id = 2;
  string voter_principal = 3;
  string voter_role = 4;                             // cso, cfo, gc, audit_committee_chair
  VoteDecision decision = 5;
  string rationale_en_US = 6;
  bytes voter_passkey_attestation = 7;
  google.protobuf.Timestamp voted_at = 8;
  double truetime_uncertainty_ms = 9;
}

message FilingPermit {
  string permit_id = 1;
  string report_id = 2;
  repeated FilingPermitVote votes = 3;
  VoteDecision quorum_decision = 4;
  uint32 quorum_count_collected = 5;
  uint32 quorum_required = 6;
  string audit_seal = 7;
  repeated string dual_seal_tenants = 8;
}

message AuthorityFilingSubmission {
  string submission_id = 1;
  Framework framework = 2;
  string target_authority_tenant = 3;                // sec-edgar-filing-submission-tenant
  string report_artifact_id = 4;
  string merkle_root = 5;
  string signer = 6;
  string signer_qes_provider = 7;
  google.protobuf.Timestamp submitted_at = 8;
  google.protobuf.Timestamp authority_acknowledged_at = 9;
  string authority_receipt_id = 10;
  string audit_seal = 11;
}

// =====================================================================
// ASSURANCE REPLAY
// =====================================================================

message AssuranceReplay {
  string engagement_id = 1;
  string assurance_partner = 2;                      // sarah.halloran-park@ernst-and-young-cleveland-assurance-tenant
  repeated string replay_scope = 3;
  repeated string engagement_dates = 4;
  uint32 readings_sampled = 5;
  uint32 readings_total = 6;
  uint32 material_findings = 7;
  uint32 immaterial_observations = 8;
  string final_opinion = 9;                          // "passed"
  string audit_seal = 10;
}

// =====================================================================
// SBTI ALIGNMENT
// =====================================================================

message SBTiAlignment {
  string baseline_year = 1;
  double baseline_tCO2e = 2;
  string target_year = 3;
  double target_tCO2e = 4;
  double target_reduction_pct = 5;
  string current_fy = 6;
  double current_tCO2e = 7;
  double cumulative_reduction_pct = 8;
  bool on_track_for_1_5C = 9;
  string audit_seal = 10;
}
