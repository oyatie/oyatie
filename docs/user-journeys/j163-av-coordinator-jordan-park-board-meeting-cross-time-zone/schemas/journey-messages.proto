// j163 — Hartwell-Renshaw cross-time-zone board meeting messages
// proto3 — UTF-8 NFC byte-exact for Hangul + Kanji + diacritics + Igbo-hyphenated
// ADR-0244 tenant scoping; ADR-0263 audit; ADR-0253 HTTP/3 + QUIC transport

syntax = "proto3";

package oyatie.user_journey.j163;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================
// Common
// ============================================================

message TenantContext {
  string tenant_id = 1;  // "hartwell-renshaw-asset-mgmt-llc"
  string operating_principal = 2;
  string role_in_tenant = 3;
  google.protobuf.Timestamp observed_at = 4;
  string region_code = 5;
}

message ParticipantRef {
  string principal = 1;
  string display_name_utf8_nfc = 2;
  string display_name_legal_kanji = 3;     // for JP participants
  string display_name_legal_hangul = 4;    // for KR participants
  string display_name_romanized = 5;
  string region_code = 6;
  string time_zone_iana = 7;
  string sfu_cell_id = 8;
  ParticipantRole role = 9;
}

enum ParticipantRole {
  PARTICIPANT_ROLE_UNSPECIFIED = 0;
  CHAIR = 1;
  CEO = 2;
  COO = 3;
  GENERAL_COUNSEL = 4;
  REGIONAL_VP = 5;
  REGIONAL_CONTROLLER = 6;
  INDEPENDENT_DIRECTOR = 7;
  EXECUTIVE_ASSISTANT = 8;
  AV_COORDINATOR = 9;
}

// ============================================================
// Pre-flight
// ============================================================

message PreFlightInitiateRequest {
  TenantContext context = 1;
  string meeting_id = 2;
  string meeting_class = 3;  // "board_of_directors"
  google.protobuf.Timestamp scheduled_start = 4;
  google.protobuf.Timestamp scheduled_end = 5;
  repeated string expected_sfu_cells = 6;
  repeated string expected_recording_cells = 7;
}

message PreFlightInitiateResponse {
  string preflight_id = 1;
  google.protobuf.Timestamp initiated_at = 2;
  string audit_event_id = 3;  // EVT-J163-PREFLIGHT-INITIATE-000
}

message CellWarmBatchRequest {
  repeated CellWarmSpec cells = 1;
  string binding_class = 2;
}

message CellWarmSpec {
  string cell_id = 1;
  string warm_target = 2;  // "ready"
  int32 deadline_seconds = 3;
}

message CellWarmBatchResponse {
  repeated CellWarmResult results = 1;
}

message CellWarmResult {
  string cell_id = 1;
  string state = 2;
  int32 elapsed_seconds = 3;
  string warn = 4;  // "slow_warm" if applicable
}

message LanguagePreFlightRequest {
  repeated string languages = 1;  // "en-US", "ja-JP", "de-DE", "pt-BR", "ko-KR"
  string asr_model_id = 2;        // "whisper-large-v3@openai-mit-fork-2025-08"
  string mt_model_id = 3;         // "nllb-200-distilled-1.3B@meta-cc-by-nc-4.0-2024-11"
  string canary_utterance = 4;
  map<string, double> expected_bleu_floors = 5;  // pair -> BLEU floor
}

message LanguagePreFlightResponse {
  repeated PerLanguageResult per_language_results = 1;
  repeated PerPairResult per_pair_results = 2;
}

message PerLanguageResult {
  string lang = 1;
  bool asr_warm = 2;
  bool canary_ok = 3;
  double wer_baseline = 4;
}

message PerPairResult {
  string pair = 1;
  double bleu = 2;
  bool warm = 3;
  bool canary_ok = 4;
}

// ============================================================
// Consent matrix
// ============================================================

message SEC17a4fConsentRequest {
  string meeting_id = 1;
  string participant_principal = 2;
  string jurisdiction = 3;  // "US"
  string rule_id = 4;        // "SEC-17a-4(f)"
  int32 retention_years = 5;  // 7
  bool worm_required = 6;
  bool indexed_search_required = 7;
  string supervisor_designated = 8;
  bytes passkey_assertion_b64 = 9;
  google.protobuf.Timestamp consented_at = 10;
}

message GDPRConsentRequest {
  string meeting_id = 1;
  string participant_principal = 2;
  string lawful_basis = 3;  // "article_6_1_a_consent"
  Article7Conditions article_7 = 4;
  bool cross_border_us_eu_scc_bound = 5;
  bool article_17_redaction_subject_to_sec_17a_4f_override = 6;
  string controller = 7;
  string dpo = 8;
  google.protobuf.Timestamp consented_at = 9;
}

message Article7Conditions {
  bool informed = 1;
  bool specific = 2;
  bool unambiguous = 3;
  bool withdrawable_for_future_meetings = 4;
}

message EUAIActArticle50Request {
  string meeting_id = 1;
  string participant_principal = 2;
  string jurisdiction = 3;  // "EU-DE"
  repeated DeclaredModel declared_models = 4;
  google.protobuf.Timestamp modal_displayed_at = 5;
  google.protobuf.Timestamp acknowledged_at = 6;
  bytes passkey_assertion_b64 = 7;
}

message DeclaredModel {
  string model_id = 1;     // "whisper-large-v3@openai-mit-fork-2025-08"
  string provider = 2;
  string use = 3;
  string risk_class = 4;   // "limited_risk"
  string article_50_declaration = 5;  // "this is a generative AI system"
}

message CrossBorderConsentRequest {
  string meeting_id = 1;
  string participant_principal = 2;
  string participant_legal_name_kanji = 3;
  string participant_legal_name_hangul = 4;
  string participant_legal_name_romanized = 5;
  repeated string applicable_jurisdictions = 6;
  JPAPPIArticle24 jp_appi_article_24 = 7;
  KRPIPAArticle28 kr_pipa_article_28 = 8;
  LGPDArticle33 lgpd_article_33 = 9;
  PDPASection17 pdpa_section_17 = 10;
  NDPASection26 ndpa_section_26 = 11;
  google.protobuf.Timestamp consented_at = 12;
}

message JPAPPIArticle24 {
  string cross_border_transfer_destination = 1;
  bool scc_or_equivalent_safeguards = 2;
  bool data_subject_informed = 3;
}

message KRPIPAArticle28 {
  string cross_border_transfer_destination = 1;
  bool explicit_prior_consent = 2;
  repeated string personal_information_categories_disclosed = 3;
}

message LGPDArticle33 {
  string destination = 1;
  string safeguards = 2;
}

message PDPASection17 {
  string destination = 1;
  bool consent_explicit = 2;
}

message NDPASection26 {
  string destination = 1;
  bool consent_explicit = 2;
}

// ============================================================
// Recording envelope
// ============================================================

message RecordingEnvelopeOpenRequest {
  string meeting_id = 1;
  string tenant_id = 2;
  string primary_storage_cell = 3;
  repeated string mirror_storage_cells = 4;
  RetentionPolicy retention_policy = 5;
  EncryptionPolicy encryption = 6;
  CaptioningPipeline captioning_pipeline = 7;
  google.protobuf.Timestamp opened_at_nominal = 8;
  google.protobuf.Timestamp opened_at_actual = 9;
  int32 hlc_offset_ms = 10;
}

message RetentionPolicy {
  string rule_id = 1;  // "SEC-17a-4(f)"
  int32 years = 2;     // 7
  bool worm = 3;
  bool indexed_search = 4;
  string supervisor = 5;
}

message EncryptionPolicy {
  string alg = 1;  // "AES-256-GCM-SIV"
  string primary_kms_root = 2;
  string mirror_kms_root = 3;
}

message CaptioningPipeline {
  string asr_model = 1;
  string mt_model = 2;
  repeated string languages = 3;
}

message RecordingEnvelopeCloseRequest {
  string meeting_id = 1;
  google.protobuf.Duration duration = 2;
  int64 total_bytes_primary = 3;
  int64 total_bytes_mirror = 4;
  ExecSessionSegment exec_session_segment = 5;
  CaptioningSummary captioning_summary = 6;
  bool worm_lock_engaged = 7;
  google.protobuf.Timestamp worm_until = 8;
  google.protobuf.Timestamp closed_at = 9;
}

message ExecSessionSegment {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  google.protobuf.Duration duration = 3;
  string unlock_policy = 4;  // "chair_plus_gc_plus_board_vote_of_3"
}

message CaptioningSummary {
  repeated string languages = 1;
  map<string, double> max_drift_score_per_lang = 2;
}

// ============================================================
// Executive session
// ============================================================

message ExecSessionEngageRequest {
  string meeting_id = 1;
  string chair_authorized_by = 2;
  bytes chair_passkey_assertion_b64 = 3;
  repeated string participants_locked_in = 4;
  repeated string participants_locked_out = 5;
  bool av_coordinator_audio_path_muted = 6;
  bool asr_pipeline_suspended = 7;
  string recording_segment_class = 8;  // "executive_session_segment"
  google.protobuf.Timestamp engaged_at = 9;
}

message ExecSessionReleaseRequest {
  string meeting_id = 1;
  string released_by = 2;
  bytes passkey_assertion_b64 = 3;
  bool vote_quorum_reached = 4;
  int32 vote_quorum_count = 5;
  repeated string resolutions_emitted = 6;
  google.protobuf.Timestamp released_at = 7;
}

// ============================================================
// Captioning live stream
// ============================================================

message CaptionStreamFrame {
  string meeting_id = 1;
  string speaker_principal = 2;
  string language = 3;
  string utf8_nfc_text = 4;   // Hangul/Kanji/diacritic preserved byte-exact
  google.protobuf.Timestamp captured_at = 5;
  double word_error_rate_rolling = 6;
  double bleu_rolling = 7;
  google.protobuf.Duration end_to_end_latency = 8;
  double drift_score_rolling = 9;
}

message CaptionFallbackEvent {
  string meeting_id = 1;
  string degraded_language = 2;
  string fallback_language = 3;
  double sustained_drift_score = 4;
  google.protobuf.Duration sustained_duration = 5;
  string banner_recipient = 6;
  google.protobuf.Timestamp engaged_at = 7;
}

// ============================================================
// Minutes archival + Merkle anchor
// ============================================================

message DriveWriteRequest {
  string drive_room = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  string signed_by = 6;
  string signature_alg = 7;
  string counsel_review = 8;
  bool worm = 9;
  google.protobuf.Timestamp worm_until = 10;
}

message MerkleAnchorRequest {
  string meeting_id = 1;
  repeated BundleComponent bundle_components = 2;
  string merkle_root = 3;
  repeated string anchor_targets = 4;
}

message BundleComponent {
  string role = 1;
  string sha256 = 2;
}

// ============================================================
// Audit events
// ============================================================

message AuditEvent {
  string event_id = 1;          // EVT-J163-*
  TenantContext context = 2;
  string event_class = 3;
  bytes payload_canonical_cbor = 4;
  bool dual_seal = 5;
  string dual_seal_partner = 6;  // "meet-cross-region-evidence-spine"
}

// ============================================================
// Forbid / deny events
// ============================================================

message CedarDenyEvent {
  string event_id = 1;  // EVT-J163-CEDAR-DENY-*
  string principal = 2;
  string action = 3;
  string resource = 4;
  string forbid_rule_id = 5;
  string reason = 6;
  google.protobuf.Timestamp observed_at = 7;
}
