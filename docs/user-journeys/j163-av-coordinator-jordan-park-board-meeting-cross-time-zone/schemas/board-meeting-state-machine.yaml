# j163 — Hartwell-Renshaw board meeting state machine
# 8-state lifecycle for board-mode meeting
# Each transition: Cedar permit + audit class + SLA + invariant
# ADR-0244 + ADR-0263 + ADR-0251 + ADR-0255

state_machine:
  name: hartwell_renshaw_board_meeting_q1_2027
  meeting_id: hartwell-renshaw-2027-q1-board
  tenant_id: hartwell-renshaw-asset-mgmt-llc
  initial_state: pre_flight
  terminal_states:
    - archived
  states:

    - name: pre_flight
      description: Operator runs SFU cell warm + language pipeline warm + boardroom mic validation
      sla_max_duration: 1h30m
      entry_audit: EVT-J163-PREFLIGHT-INITIATE-000
      exit_audit: EVT-J163-PREFLIGHT-COMPLETE-001
      cedar_permits_required:
        - meet.pre_flight_initiate
        - meet.pre_flight_validate
        - cell.warm_batch
        - intelligence.preflight
      invariants:
        - all_expected_cells_reach_ready_within_90s
        - all_expected_languages_canary_ok
        - all_boardroom_mics_validated
      transitions:
        - to: consent_collection
          on: meet.pre_flight_close
          guard: all_cells_ready AND all_languages_ready AND all_mics_validated

    - name: consent_collection
      description: All 9 participants give per-jurisdiction recording consent
      sla_max_duration: 40m
      entry_audit: EVT-J163-CONSENT-COLLECTION-START
      exit_audit: EVT-J163-CONSENT-MATRIX-COMPLETE-002
      cedar_permits_required:
        - compliance.consent_sec_17a_4f
        - compliance.consent_gdpr
        - compliance.consent_kr_pipa_cross_border
        - compliance.consent_jp_appi_cross_border
        - compliance.consent_lgpd
        - compliance.consent_pdpa_sg
        - compliance.consent_ndpa_ng
        - compliance.transparency_eu_ai_act_article_50
      invariants:
        - all_eu_participants_acknowledged_article_50
        - all_participants_consented_for_their_jurisdiction
        - jurisdiction_count_at_least_7
        - cross_border_evidence_pointers_populated
      transitions:
        - to: recording_open
          on: meet.consent_matrix_close
          guard: consent_matrix_complete AND article_50_acknowledged_by_all_eu

    - name: recording_open
      description: Recording envelope open; meeting in opening business segment
      sla_max_duration: 4h00m
      entry_audit: EVT-J163-RECORDING-ENVELOPE-OPEN-004
      exit_audit: EVT-J163-RECORDING-ENVELOPE-CLOSED-008
      cedar_permits_required:
        - recordings.start_envelope
        - intelligence.captioning_stream_start
      invariants:
        - hlc_offset_within_tolerance_250ms
        - primary_kms_root_engaged
        - mirror_kms_root_engaged
        - worm_lock_active
        - caption_drift_per_language_within_8_percent
        - sfu_jitter_per_participant_within_40ms
      transitions:
        - to: executive_session
          on: meet.executive_session_engage
          guard: chair_authorized AND chair_passkey_present
        - to: closing
          on: meet.closing_business_start
          guard: opening_business_complete

    - name: executive_session
      description: Locked-down board-only segment; AV coordinator + EA locked out
      sla_max_duration: 1h00m
      entry_audit: EVT-J163-EXEC-SESSION-LOCKED-006
      exit_audit: EVT-J163-EXEC-SESSION-RELEASED-007
      cedar_permits_required:
        - meet.executive_session_engage
        - meet.executive_session_participant
      cedar_forbids_active:
        - meet.audio_path_subscribe (for av_coordinator + executive_assistant)
        - intelligence.asr_subscribe (for av_coordinator + executive_assistant)
      invariants:
        - av_coordinator_audio_path_muted
        - asr_pipeline_suspended
        - recording_segment_tagged_executive_session_segment
        - unlock_policy_chair_plus_gc_plus_board_vote_of_3
        - theresa_locked_out
      transitions:
        - to: recording_open
          on: meet.executive_session_release
          guard: chair_passkey_present AND vote_quorum_reached

    - name: closing
      description: Closing remarks + vote ratification; recording still open
      sla_max_duration: 30m
      entry_audit: EVT-J163-CLOSING-BUSINESS-START
      exit_audit: EVT-J163-CLOSING-BUSINESS-COMPLETE
      cedar_permits_required:
        - meet.closing_business
      invariants:
        - all_resolutions_emitted
        - chair_present
      transitions:
        - to: archival
          on: recordings.close_envelope
          guard: closing_business_complete AND chair_authorized_close

    - name: archival
      description: Minutes drafting + counsel review + chair signature + drive WORM archive
      sla_max_duration: 1h00m
      entry_audit: EVT-J163-RECORDING-ENVELOPE-CLOSED-008
      exit_audit: EVT-J163-MINUTES-DRIVE-WRITE-009a
      cedar_permits_required:
        - governance.counsel_review
        - governance.minutes_sign
        - drive.write_room
        - drive.engage_worm_lock
      invariants:
        - minutes_drafted_by_ea
        - counsel_review_complete
        - chair_signature_present_passkey_plus_fido2
        - no_exec_session_substance_in_minutes
        - eu_ai_act_50_declaration_referenced_in_minutes
        - drive_worm_lock_engaged
        - retention_until_7_years_after_close
      transitions:
        - to: merkle_anchor
          on: governance.merkle_anchor_request
          guard: minutes_archive_final

    - name: merkle_anchor
      description: Governance computes Merkle root + anchors to audit-chain spine + external transparency log
      sla_max_duration: 15m
      entry_audit: EVT-J163-MERKLE-ANCHOR-START
      exit_audit: EVT-J163-MINUTES-MERKLE-ANCHORED-009
      cedar_permits_required:
        - governance.merkle_compute
        - governance.merkle_anchor_audit_chain_spine
        - governance.merkle_anchor_external_transparency_log
      invariants:
        - bundle_includes_6_components
        - merkle_root_deterministic
        - audit_chain_spine_anchor_present
        - external_transparency_log_anchor_present
        - cross_border_evidence_anchored
      transitions:
        - to: archived
          on: governance.archive_seal
          guard: merkle_anchor_complete

    - name: archived
      description: Terminal; recording WORM-locked + minutes WORM-archived + Merkle-anchored
      entry_audit: EVT-J163-ARCHIVED
      invariants:
        - worm_until_2034_04_07
        - merkle_root_externally_verifiable
        - exec_session_segment_unlock_policy_preserved
      transitions: []

  # ============================================================
  # Failure transitions
  # ============================================================

  failure_transitions:

    - from: pre_flight
      to: pre_flight_aborted
      on: cell_warm_failure OR language_canary_failure
      audit: EVT-J163-PREFLIGHT-ABORTED
      remediation: surface_diagnostic + reschedule_or_retry

    - from: consent_collection
      to: meeting_cancelled
      on: any_participant_refuses_consent OR friedrich_declines_article_50
      audit: EVT-J163-MEETING-CANCELLED-CONSENT
      remediation: surface_participant + cancel_meeting + log_reason

    - from: recording_open
      to: recording_degraded
      on: cross_region_mirror_lag_exceeds_30s OR primary_kms_root_failure
      audit: EVT-J163-RECORDING-DEGRADED
      remediation: switch_to_secondary_kms + flag_mirror_degraded + continue_on_primary

    - from: executive_session
      to: executive_session_aborted
      on: chair_loses_passkey OR quorum_fails
      audit: EVT-J163-EXEC-SESSION-ABORTED
      remediation: surface_to_chair + release_via_GC + audit

    - from: archival
      to: archival_pending_remediation
      on: counsel_review_finds_exec_session_substance_leaked
      audit: EVT-J163-MINUTES-COUNSEL-REJECTED
      remediation: theresa_redrafts + friedrich_re_reviews + chair_re_signs

  # ============================================================
  # SLA summary
  # ============================================================

  sla_summary:
    pre_flight_max: 1h30m
    consent_collection_max: 40m
    recording_open_max: 4h00m
    executive_session_max: 1h00m
    closing_max: 30m
    archival_max: 1h00m
    merkle_anchor_max: 15m
    total_journey_max: 5h00m_wall_clock

  # ============================================================
  # Cedar deny coverage
  # ============================================================

  cedar_deny_coverage:
    - non_av_coordinator_attempts_envelope_close: EVT-J163-CEDAR-DENY-NON-OPERATOR-CLOSE-Δ001
    - av_coordinator_attempts_exec_session_audio_subscribe: EVT-J163-CEDAR-DENY-OPERATOR-EXEC-LISTEN-Δ002
    - external_party_queries_exec_session_segment_without_unlock: EVT-J163-CEDAR-DENY-EXTERNAL-EXEC-Δ003
    - kms_export_key_material_for_board_recording: EVT-J163-CEDAR-DENY-KMS-EXPORT-Δ004
    - theresa_attempts_audio_path_subscribe_during_exec: EVT-J163-CEDAR-DENY-EA-EXEC-LISTEN-Δ005
