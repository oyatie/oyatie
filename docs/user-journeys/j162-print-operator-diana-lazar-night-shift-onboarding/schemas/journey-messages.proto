// j162 — Diana Lazăr night-shift solo onboarding RPC messages
// proto3; package versioned per ADR-0244 tenant scoping
// Diacritic preservation: ALL string fields are UTF-8 NFC; no Romanization in legal fields.
// Cross-tenant audit dual-seal mandatory under ADR-0263.
// Cross-journey persona continuity from j157 verified via cross-journey-link context.

syntax = "proto3";

package oya.journeys.j162.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // UTF-8 NFC; e.g. diana.lazăr@tipografia-lazar-petrescu-ro
  string persona_uuid = 2;           // shared across j157 + j162
  string home_tenant = 3;
  string acting_tenant = 4;
  enum TenantClass {
    BUSINESS_TENANT = 0;
    PERSONAL_TENANT = 1;
    CONSULTING_TENANT = 2;
    COOPERATIVE_TENANT = 3;
    STATE_TENANT = 4;
    SCHOOL_TENANT = 5;
  }
  TenantClass tenant_class = 5;
  string passkey_assertion_b64 = 6;
  repeated string roles_in_acting_tenant = 7;
  repeated string active_certifications = 8;
  repeated string active_competencies = 9;
  bool dead_man_protocol_enrolled = 10;
  string workplace_integration_provisioned = 11;  // night-shift | day-shift | none
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;                   // eu-bucharest-primary
  string trace_id = 3;
  string locale = 4;
  string tenant_country = 5;
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  repeated string sealing_tenants = 6;
  bool truetime_class = 7;
  uint32 truetime_uncertainty_ms = 8;
}

message DiacriticPolicy {
  string unicode_normalization = 1;
  bool diacritics_preserved = 2;
  bool romanian_diacritics_strict = 3;
  bool hungarian_diacritics_strict = 4;
  bool romanize_to_ascii = 5;
  bool user_explicit_consent_to_romanize = 6;
}

// ---------- §1 Competency assessment + unlock ----------

message AssessmentSessionCreate {
  string candidate_principal = 1;
  string proctor_principal = 2;
  string observer_principal = 3;
  string competency_class = 4;
  uint32 scenarios_count = 5;
  uint32 pass_threshold_per_scenario_pct = 6;
  repeated string qualitative_signoff_required_from = 7;
  google.protobuf.Timestamp started_at = 8;
}

message AssessmentScenarioScore {
  string session_id = 1;
  uint32 scenario_index = 2;
  string scenario_name = 3;
  uint32 score_pct = 4;
  repeated string evidence_links = 5;
}

message AssessmentSessionComplete {
  string session_id = 1;
  bool all_scenarios_passed_85_plus = 2;
  string proctor_signoff_principal = 3;
  google.protobuf.Timestamp proctor_signoff_at = 4;
  string hse_observer_signoff_principal = 5;
  google.protobuf.Timestamp hse_observer_signoff_at = 6;
  string qualitative_remarks_ro = 7;     // Romanian UTF-8 NFC
}

message CompetencyUnlockRequest {
  string principal = 1;
  string competency_id = 2;
  google.protobuf.Timestamp valid_from = 3;
  google.protobuf.Timestamp valid_through = 4;
  string unlocked_via_session = 5;
  repeated string prereq_competencies_verified = 6;
  string cross_journey_continuity_ref = 7;
}

message CertChainReadRequest {
  string persona_uuid = 1;
  string read_purpose = 2;               // prerequisite_verification
  string requesting_tenant = 3;
}

// ---------- §2 Workplace-integration provisioning ----------

message WorkplaceIntegrationProvisionRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string shift_class = 3;
  google.protobuf.Timestamp shift_schedule_start = 4;
  google.protobuf.Timestamp shift_schedule_end = 5;
  string geofence_id = 6;
  string badge_id = 7;
  repeated string badge_added_roles = 8;
  repeated string badge_added_scopes = 9;
  bool payroll_differential_enabled = 10;
  double base_rate_ron_per_hour = 11;
  double night_rate_ron_per_hour = 12;
  uint32 differential_pct = 13;
}

// ---------- §3 Securitas cross-tenant scope ----------

message SecuritasCooperativeRosterAdd {
  string cooperative_business_ic = 1;
  string added_principal_subject_id = 2;
  string added_principal_biometric_template_hash = 3;
  repeated string alarm_zones_in_scope = 4;
  bool auto_revoke_on_competency_expiry = 5;
}

message SecuritasAlarmDearmRequest {
  string principal = 1;
  string alarm_zone = 2;
  string biometric_method = 3;
  double biometric_match_score = 4;
  message DearmContext {
    bool shift_scheduled_for_now = 1;
    bool competency_unexpired = 2;
    string workplace_integration_provisioned = 3;
  }
  DearmContext context = 5;
  google.protobuf.Timestamp dearmed_at = 6;
}

// ---------- §4 Identity + lone-worker dead-man ----------

message BiometricLowLightReconfigureRequest {
  string principal = 1;
  string mode = 2;                       // low_light_4_captures
  string fallback_method = 3;            // pin_6_digit
  google.protobuf.Timestamp captured_at = 4;
}

message LoneWorkerDeadManEnrollRequest {
  string principal = 1;
  uint32 checkin_interval_hours = 2;
  uint32 checkin_response_window_seconds = 3;
  string checkin_method = 4;
  message EscalationContact {
    uint32 order = 1;
    string contact_principal = 2;
    string method = 3;
  }
  repeated EscalationContact escalation_chain = 5;
  bool personal_tenant_consent_capture_required = 6;
  message FamilyEmergencyRoute {
    string contact_tenant = 1;
    string contact_label = 2;
  }
  repeated FamilyEmergencyRoute family_emergency_route = 7;
  google.protobuf.Timestamp enrolled_at = 8;
}

message PersonalTenantCrossTenantConsentRequest {
  string consenting_tenant = 1;
  string consenting_principal = 2;
  string consent_class = 3;
  string source_tenant = 4;
  string source_principal_subject_id = 5;
  string consent_scope = 6;
  string gdpr_consent_basis = 7;
  google.protobuf.Timestamp consented_at = 8;
}

message DeadManCheckinRequest {
  string principal = 1;
  string shift_id = 2;
  google.protobuf.Timestamp checkin_at = 3;
  uint32 response_window_seconds_remaining = 4;
  string biometric_method = 5;
  double biometric_match_score = 6;
}

// ---------- §5 Shift lifecycle ----------

message ShiftClockInRequest {
  string shift_id = 1;
  string principal = 2;
  string geofence_id = 3;
  bool geofence_match = 4;
  string biometric_method = 5;
  double biometric_match_score = 6;
  google.protobuf.Timestamp clock_in_at = 7;
}

message ShiftHandoffRequest {
  string from_principal = 1;
  string to_principal = 2;
  string shift_outgoing = 3;
  string shift_incoming = 4;
  google.protobuf.Timestamp handoff_at = 5;
  repeated string active_jobs = 6;
  repeated string events_during_shift = 7;
  uint32 good_sheets = 8;
  uint32 voided_sheets = 9;
  string incoming_passkey_assertion_b64 = 10;
  string incoming_face_id_assertion_b64 = 11;
}

message FirstNightShiftCompleteEvent {
  string shift_id = 1;
  string operator_principal = 2;
  string shift_class = 3;                // night_shift_solo_first
  double duration_actual_hours = 4;
  uint32 incidents_count = 5;
  uint32 dead_man_checkins_completed = 6;
  uint32 dead_man_checkins_missed = 7;
  double delta_e_max_observed = 8;
  double delta_e_mean = 9;
  google.protobuf.Timestamp completed_at = 10;
}

// ---------- §6 Payroll ----------

message NightShiftDifferentialRecord {
  string principal = 1;
  string pay_period = 2;
  double night_shift_hours = 3;
  double base_rate_ron = 4;
  uint32 differential_pct = 5;
  double night_rate_ron = 6;
  double differential_amount_ron = 7;
  double gross_for_night_shift_ron = 8;
  string ro_codul_muncii_article_ref = 9;
  string ro_anaf_reporting_class = 10;
}

message AnafPayrollNightPremiumReport {
  string employer_ic = 1;
  string employee_legal_name_strict_form_nfc = 2;
  double premium_amount_ron = 3;
  string pay_period = 4;
  google.protobuf.Timestamp reported_at = 5;
}

// ---------- §7 Cross-journey continuity ----------

message CrossJourneyContinuityRef {
  string source_journey_id = 1;          // j157
  string target_journey_id = 2;          // j162
  repeated string source_sealed_event_refs = 3;
  string persona_uuid = 4;
  bool prerequisite_chain_valid = 5;
  google.protobuf.Timestamp verified_at = 6;
}
