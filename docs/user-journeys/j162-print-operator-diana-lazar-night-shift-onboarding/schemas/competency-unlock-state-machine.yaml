# j162 — Competency-unlock state machine
# 6 states + 6 valid transitions + Cedar guards + per-state audit class.
# Driven by learning-management µservice. Skip transitions are forbidden;
# Cedar FORBID rules dual-seal deny audits for invalid skips.

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: competency-unlock-night-shift-solo-v1
  workflow_template: wkfl-competency-unlock-night-shift-solo-v1
  adr_refs:
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0252  # HLC + TrueTime for competency unlock
    - ADR-0311  # personal-vs-work boundary (Diana's personal escalation tenant)
  regulator_anchors:
    - RO-Codul-Muncii-Law-53-2003-§Title-III-Chapter-II-night-work-training
    - RO-Codul-Muncii-Law-53-2003-§126-night-shift-premium
    - ISO-45001-2018-§6.1.2-OHS-risk-assessment
    - ISO-45001-2018-§8.1.2-eliminating-and-reducing-risks
    - FOGRA-PSO-2024-operator-authority-schedules
    - CSN-EN-1837-industrial-print-room-low-light-protocol
    - EU-GDPR-Articles-6-7-consent

spec:
  # ============================================
  # §1 States (6)
  # ============================================
  states:
    - name: prereq_pending
      description: "Candidate's prerequisite cert chain being verified (cross-journey read from j157)"
      is_initial: true
      is_terminal: false
      cedar_action_required: learning_management.competency_link_read
      audit_class_on_enter: EVT-J162-STATE-PREREQ-PENDING-200
      required_context:
        candidate_principal: present
        target_competency_id: present

    - name: training_in_progress
      description: "Candidate enrolled in training modules (8h + 4h + 4h = 16h)"
      is_initial: false
      is_terminal: false
      cedar_action_required: learning_management.training_enrollment
      audit_class_on_enter: EVT-J162-STATE-TRAINING-201
      required_context:
        modules_enrolled: present
        delivery_window_started: present

    - name: supervised_shifts_logged
      description: "Candidate has logged 8 supervised shifts under proctor"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.supervised_shift_log
      audit_class_on_enter: EVT-J162-STATE-SUPERVISED-LOGGED-202
      required_context:
        supervised_shifts_count: present
        proctor_signoff_per_shift_count: present

    - name: final_assessment_scheduled
      description: "14-scenario final assessment scheduled with proctor + HSE observer"
      is_initial: false
      is_terminal: false
      cedar_action_required: learning_management.assessment_session_create
      audit_class_on_enter: EVT-J162-STATE-ASSESSMENT-SCHEDULED-203
      required_context:
        proctor_principal: present
        hse_observer_principal: present
        scheduled_at: present

    - name: final_assessment_passed
      description: "All 14 scenarios scored ≥85%; both qualitative sign-offs received"
      is_initial: false
      is_terminal: false
      cedar_action_required: learning_management.assessment_session_complete
      audit_class_on_enter: EVT-J162-STATE-ASSESSMENT-PASSED-204
      required_context:
        all_scenarios_passed_85_plus: true
        proctor_signoff: true
        hse_observer_signoff: true

    - name: night_shift_solo_authorized
      description: "Competency unlocked; Cedar permits solo night-shift operation"
      is_initial: false
      is_terminal: true
      cedar_action_required: learning_management.competency_unlock_night_shift_solo
      audit_class_on_enter: EVT-J162-STATE-AUTHORIZED-205
      required_context:
        competency_id: night-shift-solo-authorization-2027
        valid_from: present
        valid_through: present
        workplace_integration_to_be_provisioned: true

  # ============================================
  # §2 Valid transitions (6)
  # ============================================
  transitions:
    - from: prereq_pending
      to: training_in_progress
      label: "prereqs verified; training enrolment"
      preconditions:
        - cross_journey_continuity_verified: true
        - prereq_certs_unexpired:
            - FOGRA-PSO-Operator-Level-2
            - ISO-12647-2-Trained
        - candidate_is_employed_in_employer_tenant: true
      audit_class: EVT-J162-TRANSITION-200-TO-201

    - from: training_in_progress
      to: supervised_shifts_logged
      label: "16h training complete; supervised shifts begin"
      preconditions:
        - all_3_modules_completed: true
        - module_assessment_scores_each_70_plus: true
      audit_class: EVT-J162-TRANSITION-201-TO-202

    - from: supervised_shifts_logged
      to: final_assessment_scheduled
      label: "8 supervised shifts logged; assessment scheduled"
      preconditions:
        - supervised_shifts_count: 8
        - per_shift_proctor_signoff_count: 8
      audit_class: EVT-J162-TRANSITION-202-TO-203

    - from: final_assessment_scheduled
      to: final_assessment_passed
      label: "14 scenarios scored; sign-offs received"
      preconditions:
        - all_scenarios_passed_85_plus: true
        - proctor_signoff: true
        - hse_observer_signoff: true
      audit_class: EVT-J162-TRANSITION-203-TO-204

    - from: final_assessment_passed
      to: night_shift_solo_authorized
      label: "competency unlocked"
      preconditions:
        - truetime_uncertainty_ms_within_50: true
      audit_class: EVT-J162-TRANSITION-204-TO-205

    # Defensive: retry assessment after failure
    - from: final_assessment_scheduled
      to: training_in_progress
      label: "assessment failed; back to additional training"
      preconditions:
        - assessment_failure_recorded: true
        - retry_within_limit: true
      audit_class: EVT-J162-TRANSITION-203-TO-201-RETRY

  # ============================================
  # §3 Forbidden transitions
  # ============================================
  forbidden_transitions:
    - from: prereq_pending
      to: final_assessment_scheduled
      forbid_rule_id: forbid-skip-training-and-shifts
      audit_class: EVT-J162-INVALID-TRANSITION-300

    - from: prereq_pending
      to: night_shift_solo_authorized
      forbid_rule_id: forbid-skip-entirely
      audit_class: EVT-J162-INVALID-TRANSITION-301

    - from: training_in_progress
      to: night_shift_solo_authorized
      forbid_rule_id: forbid-skip-supervision-and-assessment
      audit_class: EVT-J162-INVALID-TRANSITION-302

    - from: supervised_shifts_logged
      to: night_shift_solo_authorized
      forbid_rule_id: forbid-skip-final-assessment
      audit_class: EVT-J162-INVALID-TRANSITION-303
      reason: "final assessment is mandatory regardless of supervised shift count"

  # ============================================
  # §4 Cedar guards (per transition)
  # ============================================
  cedar_guards:
    - guard_id: guard-cross-journey-prereq-verified
      description: "Prereq read from j157 cert chain must succeed before training starts"
      applies_to_transitions:
        - prereq_pending → training_in_progress
      context_required:
        cross_journey_continuity_verified: true
        same_persona_uuid: true

    - guard_id: guard-training-modules-complete
      description: "All 3 modules complete with module assessment ≥70%"
      applies_to_transitions:
        - training_in_progress → supervised_shifts_logged
      context_required:
        all_3_modules_completed: true
        module_assessment_scores_each_70_plus: true

    - guard_id: guard-final-assessment-pass-thresholds
      description: "Final assessment 14 scenarios + 2 sign-offs"
      applies_to_transitions:
        - final_assessment_scheduled → final_assessment_passed
      context_required:
        all_scenarios_passed_85_plus: true
        proctor_signoff: true
        hse_observer_signoff: true

    - guard_id: guard-truetime-fence-on-unlock
      description: "Competency unlock fires under TrueTime fence ≤50ms"
      applies_to_transitions:
        - final_assessment_passed → night_shift_solo_authorized
      context_required:
        truetime_uncertainty_ms: <=50

    - guard_id: guard-diacritic-strict-mode
      description: "All persisted fields UTF-8 NFC with Romanian + Hungarian diacritics preserved"
      applies_globally: true
      context_required:
        unicode_normalization: NFC
        diacritics_preserved: true

    - guard_id: guard-ro-cell-residency
      description: "Romanian-tenant data resides in eu-bucharest-primary"
      applies_globally: true
      context_required:
        target_cell_in: [eu-bucharest-primary, eu-frankfurt-secondary, eu-amsterdam-readonly-replica]

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants_per_seal_event:
      - tipografia-lazar-petrescu-ro
      - adriana-stanciu-consulting-ro (for HSE-observer signoff events)
    retention_years: 5  # FOGRA-PSO + ISO-45001 retention
    merkle_anchor: per-transition
    iso_45001_compatible: true
    ro_codul_muncii_compatible: true

  # ============================================
  # §6 Per-state SLA window
  # ============================================
  per_state_sla:
    prereq_pending: 1  # 1 day to verify j157 cert chain
    training_in_progress: 14  # 2 weeks for 16h training distributed across days
    supervised_shifts_logged: 28  # 4 weeks for 8 shifts
    final_assessment_scheduled: 3  # ≤3 days from supervised-logs-complete to assessment
    final_assessment_passed: 1  # assessment + unlock same-day
    night_shift_solo_authorized: 365  # 1-year validity

  # ============================================
  # §7 Per-competency configuration
  # ============================================
  per_competency:
    night-shift-solo-authorization-2027:
      training_hours_required: 16
      supervised_shifts_required: 8
      assessment_scenarios: 14
      pass_threshold_pct: 85
      proctor_principal_role_required: night_shift_senior_operator
      hse_observer_principal_tenant_class_required: consulting_tenant
      validity_period_months: 12
      truetime_fence_ms: 50
