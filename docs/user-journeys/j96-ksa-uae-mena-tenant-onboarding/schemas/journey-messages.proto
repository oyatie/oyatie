syntax = "proto3";
package oyatie.userjourney.j96;

// proto3 contract for j96-ksa-uae-mena-tenant-onboarding; generated for locale-pack-overlay-final.
message PackOverlayAction {
  string journey_id = 1;
  string tenant_id = 2;
  string principal_id = 3;
  repeated string pack_ids = 4;
  repeated string article_refs = 5;
  string cell_certification_level = 6;
  string idempotency_key = 7;
}

message PackOverlayDecision {
  string journey_id = 1;
  string tenant_id = 2;
  string pack_id = 3;
  string article_ref = 4;
  string cedar_decision = 5;
  string audit_event_class = 6;
  string evidence_hash = 7;
}

service JourneyPackOverlay {
  rpc Execute(PackOverlayAction) returns (PackOverlayDecision);
}
