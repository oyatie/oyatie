# j158 — Cell rebalance state machine
# 5 states + 4 valid transitions + Cedar guards + per-state audit class.
# Driven by the workflow-engine µservice. Skip transitions are forbidden;
# Cedar FORBID-6 in cedar-policy.cedar dual-seals deny audits for invalid skips.
#
# This state machine is INTERNAL to the employer tenant. It is invoked when an
# external causal signal (e.g. consumer-creator viral spike) or an internal
# capacity-planning event determines that capacity rebalance is needed.
# The personal-tenant side never participates in this state machine; it provides
# only the causal signal under the creator-employer disclosure permit.

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: cell-rebalance-employer-tenant-v3
  workflow_template: wkfl-cell-rebalance-employer-tenant-v3
  adr_refs:
    - ADR-0244  # tenant scoping
    - ADR-0248  # cellular architecture
    - ADR-0263  # audit emission contract
    - ADR-0252  # HLC default + TrueTime for KR-LSA fence
    - ADR-0311  # dual-tenant identity boundary (motivating context)

spec:
  # ============================================
  # §1 States
  # ============================================
  states:
    - name: capacity_signal_detected
      description: "Capacity signal (external or internal) detected; workflow created; no rebalance proposed yet"
      is_initial: true
      is_terminal: false
      cedar_action_required: workflow.cell_rebalance_transition
      audit_class_on_enter: EVT-J158-REBALANCE-STATE-DETECTED-100
      required_context:
        primary_cell_utilization_pct: present
        signal_origin: present

    - name: rebalance_proposed
      description: "Logistics coordinator proposed a rebalance plan; awaiting owner co-sign"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.cell_rebalance_propose
      audit_class_on_enter: EVT-J158-REBALANCE-STATE-PROPOSED-101
      required_context:
        burst_cells_proposed: present
        expected_burst_window_hours: present
        cost_estimate_krw: present

    - name: cross_cell_grant_negotiated
      description: "Owner co-signed; capacity-pool grants issued; burst cells warm-starting"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.cell_rebalance_transition
      audit_class_on_enter: EVT-J158-REBALANCE-STATE-GRANT-NEGOTIATED-102
      required_context:
        owner_co_sign_complete: true
        burst_cells_warm_start_initiated: true

    - name: traffic_shift
      description: "Traffic gradually shifting across cells per ramp strategy"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.cell_traffic_shift
      audit_class_on_enter: EVT-J158-REBALANCE-STATE-TRAFFIC-SHIFT-103
      required_context:
        all_burst_cells_ready: true
        rollback_threshold_set: true

    - name: post_rebalance_validation
      description: "Traffic shift complete; metrics validated; boundary invariants checked"
      is_initial: false
      is_terminal: true
      cedar_action_required: workflow.cell_rebalance_post_validate
      audit_class_on_enter: EVT-J158-REBALANCE-STATE-POST-VALIDATION-104
      required_context:
        target_distribution_reached: true
        latency_within_sla: true
        kr_lsa_evaluator_green: true
        boundary_invariants_pass: true

  # ============================================
  # §2 Valid transitions (4 forward)
  # ============================================
  transitions:
    - from: capacity_signal_detected
      to: rebalance_proposed
      label: "logistics coordinator proposes rebalance"
      preconditions:
        - principal_role_in_tenant: logistics_coordinator
        - primary_cell_utilization_pct_threshold: ">= 75"
      audit_class: EVT-J158-REBALANCE-TRANSITION-100-TO-101

    - from: rebalance_proposed
      to: cross_cell_grant_negotiated
      label: "owner co-signs proposal"
      preconditions:
        - owner_passkey_assertion_present: true
        - owner_face_id_assertion_present: true
      audit_class: EVT-J158-REBALANCE-TRANSITION-101-TO-102

    - from: cross_cell_grant_negotiated
      to: traffic_shift
      label: "burst cells ready; begin traffic shift"
      preconditions:
        - all_burst_cells_ready: true
        - rollback_threshold_set: true
      audit_class: EVT-J158-REBALANCE-TRANSITION-102-TO-103

    - from: traffic_shift
      to: post_rebalance_validation
      label: "traffic shift complete; validation begins"
      preconditions:
        - target_distribution_reached_within_tolerance_pct_1: true
        - latency_p95_within_sla_throughout_shift: true
        - error_rate_within_threshold_throughout_shift: true
      audit_class: EVT-J158-REBALANCE-TRANSITION-103-TO-104

    # Defensive: rollback path (rare)
    - from: traffic_shift
      to: rebalance_proposed
      label: "rollback triggered; revert to proposed state for re-plan"
      preconditions:
        - rollback_threshold_breached: true
      audit_class: EVT-J158-REBALANCE-ROLLBACK-105

    # Defensive: cancel from proposed
    - from: rebalance_proposed
      to: capacity_signal_detected
      label: "owner declined or proposal withdrawn"
      preconditions:
        - decline_or_withdraw: true
      audit_class: EVT-J158-REBALANCE-CANCELLED-106

  # ============================================
  # §3 Forbidden transitions (Cedar dual-seal deny)
  # ============================================
  forbidden_transitions:
    - from: capacity_signal_detected
      to: cross_cell_grant_negotiated
      forbid_rule_id: forbid-rebalance-skip-1
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

    - from: capacity_signal_detected
      to: traffic_shift
      forbid_rule_id: forbid-rebalance-skip-2
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

    - from: capacity_signal_detected
      to: post_rebalance_validation
      forbid_rule_id: forbid-rebalance-skip-3
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

    - from: rebalance_proposed
      to: traffic_shift
      forbid_rule_id: forbid-rebalance-skip-4
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

    - from: rebalance_proposed
      to: post_rebalance_validation
      forbid_rule_id: forbid-rebalance-skip-5
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

    - from: cross_cell_grant_negotiated
      to: post_rebalance_validation
      forbid_rule_id: forbid-rebalance-skip-6
      audit_class: EVT-J158-WORKFLOW-INVALID-TRANSITION-008d

  # ============================================
  # §4 Cedar guards (per transition)
  # ============================================
  cedar_guards:
    - guard_id: guard-logistics-coordinator-role
      description: "Transitions initiated by logistics_coordinator require active shift"
      applies_to_transitions:
        - capacity_signal_detected → rebalance_proposed
      context_required:
        shift_active: true
        principal_role: logistics_coordinator

    - guard_id: guard-owner-two-factor-cosign
      description: "Owner co-sign requires passkey + face_id"
      applies_to_transitions:
        - rebalance_proposed → cross_cell_grant_negotiated
      context_required:
        owner_passkey_assertion_present: true
        owner_face_id_assertion_present: true

    - guard_id: guard-kr-lsa-evaluator-passing
      description: "Post-validation requires KR-LSA evaluator green or yellow only (no red)"
      applies_to_transitions:
        - traffic_shift → post_rebalance_validation
      context_required:
        kr_lsa_evaluator_red_count: 0

    - guard_id: guard-boundary-invariant-passing
      description: "Post-validation requires dual-tenant boundary invariants verified"
      applies_to_transitions:
        - traffic_shift → post_rebalance_validation
      context_required:
        employer_to_personal_probe_denied: true
        personal_to_employer_probe_without_permit_denied: true

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: false  # this workflow is employer-tenant-internal
    tenants:
      - sungkyul-sangsa-print-co-kr
    retention_years: 3
    merkle_anchor: per-transition
    iso_9001_compatible: true
