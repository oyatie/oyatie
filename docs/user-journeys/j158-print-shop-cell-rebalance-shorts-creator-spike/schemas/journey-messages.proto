// j158 — Hae-Won Kim cell-rebalance + disclosure-signal RPC messages
// proto3, package versioned per ADR-0244 tenant scoping
// Hangul + Hanja preservation: ALL string fields are UTF-8 NFC; no normalization.
// Cross-tenant audit dual-seal mandatory under ADR-0263.

syntax = "proto3";

package oya.journeys.j158.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // UTF-8 NFC; e.g. haewon.kim@personal-haewon-kim-kr
  string home_tenant = 2;
  string acting_tenant = 3;
  string role_in_acting_tenant = 4;
  string passkey_assertion_b64 = 5;
  string face_id_assertion_b64 = 6;
  string device_id = 7;
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;
  string trace_id = 3;
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  bool truetime_class = 6;
}

message UnicodePolicy {
  string normalization = 1;          // MUST be "NFC"
  bool hangul_preserved = 2;
  bool hanja_preserved = 3;
  string locale_render = 4;          // e.g. ko-KR, en-US
}

// ---------- §1 Personal-tenant autoscale ----------

message AutoscaleSignal {
  TenantContext tenant_ctx = 1;
  string cell_id = 2;
  string creator_handle = 3;
  google.protobuf.Timestamp captured_at = 4;
  uint32 metric_window_seconds = 5;
  uint64 request_rate_qps_p95 = 6;
  uint64 request_rate_baseline_qps = 7;
  double scale_factor = 8;
  enum TriggerClass {
    UNKNOWN = 0;
    VIRAL_CONTENT_SPIKE = 1;
    SCHEDULED_LIVE_EVENT = 2;
    BOT_TRAFFIC_DETECTED = 3;
    PAID_PROMOTION_LAUNCH = 4;
  }
  TriggerClass trigger_class = 9;
  string linked_content_id = 10;
}

message AutoscaleEngageRequest {
  string cell_id = 1;
  string tenant_id = 2;
  uint32 target_replicas = 3;
  uint32 target_replicas_baseline = 4;
  google.protobuf.Timestamp engaged_at = 5;
  string trigger_event_id = 6;
}

// ---------- §2 Creator-employer disclosure signal ----------

message DisclosureRecord {
  string disclosure_id = 1;
  string subject_principal = 2;
  string employer_tenant = 3;
  string employer_signer = 4;
  string subject_signer = 5;
  google.protobuf.Timestamp signed_at = 6;
  string scope = 7;
  bool active = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message DisclosureSignalRequest {
  string from_principal = 1;
  string from_tenant = 2;
  string to_tenant = 3;
  repeated string to_principals = 4;
  string disclosure_record_id = 5;
  enum PayloadClass {
    CREATOR_SPIKE_INFO_ONLY = 0;
    CREATOR_PAUSE_INFO_ONLY = 1;
    CREATOR_MILESTONE_INFO_ONLY = 2;
  }
  PayloadClass payload_class = 6;
  uint32 payload_size_bytes = 7;
  bytes payload_ciphertext = 8;
  message StructuredAssertions {
    bool no_audience_pii = 1;
    bool no_revenue_figures = 2;
    bool no_audience_demographics = 3;
    bool spike_coarse_grain_only = 4;
    bool self_initiated_by_subject = 5;
  }
  StructuredAssertions structured_assertions = 9;
  google.protobuf.Timestamp sent_at = 10;
  UnicodePolicy unicode_policy = 11;
}

message DisclosureSignalResponse {
  string signal_id = 1;
  repeated string delivered_to_tenants = 2;
  AuditAnchor source_audit = 3;
  AuditAnchor destination_audit = 4;
}

// ---------- §3 Cell-rebalance workflow ----------

message CellRebalanceCreateRequest {
  string workflow_template_id = 1;
  TenantContext tenant_ctx = 2;
  string primary_cell = 3;
  repeated string burst_cells_candidate = 4;
  string secondary_cell = 5;
  message Reason {
    enum Class {
      EXTERNAL_CAUSAL_SIGNAL_CONSUMER_CREATOR_SPIKE = 0;
      SCHEDULED_CAPACITY_PLANNING = 1;
      INCIDENT_RESPONSE = 2;
      REGULATORY_AUDIT = 3;
    }
    Class class = 1;
    string signal_origin = 2;
  }
  Reason rebalance_reason = 6;
  uint32 expected_burst_window_hours = 7;
  double expected_scale_factor = 8;
  enum State {
    CAPACITY_SIGNAL_DETECTED = 0;
    REBALANCE_PROPOSED = 1;
    CROSS_CELL_GRANT_NEGOTIATED = 2;
    TRAFFIC_SHIFT = 3;
    POST_REBALANCE_VALIDATION = 4;
  }
  State initial_state = 9;
}

message CellRebalanceTransitionRequest {
  string rebalance_id = 1;
  CellRebalanceCreateRequest.State from_state = 2;
  CellRebalanceCreateRequest.State to_state = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  Principal initiated_by = 5;
  message ProposalPayload {
    repeated string burst_cells_to_warm = 1;
    uint32 reserved_capacity_pool_units_to_consume = 2;
    uint32 estimated_warm_time_minutes_per_cell = 3;
    uint32 estimated_burst_window_hours = 4;
    string daily_reassessment_time_kst = 5;
  }
  ProposalPayload proposal_payload = 6;
}

message CellRebalanceCoSignRequest {
  string rebalance_id = 1;
  Principal principal = 2;
  enum Role {
    OWNER = 0;
    MANAGING_DIRECTOR = 1;
    VP_OPERATIONS = 2;
  }
  Role role = 3;
  google.protobuf.Timestamp signed_at = 4;
  string attestation = 5;
}

message TrafficShiftRequest {
  string rebalance_id = 1;
  google.protobuf.Timestamp started_at = 2;
  message Distribution {
    string cell_id = 1;
    double fraction = 2;             // 0.0–1.0
  }
  repeated Distribution target_distribution = 3;
  enum RampStrategy {
    GRADUAL_10_MIN_OVER_90_MIN = 0;
    STEP_30_MIN = 1;
    IMMEDIATE_FAILOVER = 2;
  }
  RampStrategy ramp_strategy = 4;
  message RollbackThreshold {
    double latency_p95_ms_max = 1;
    double error_rate_max_pct = 2;
  }
  RollbackThreshold rollback_threshold = 5;
}

message TrafficShiftIncrement {
  string rebalance_id = 1;
  uint32 increment_index = 2;
  google.protobuf.Timestamp increment_time = 3;
  repeated TrafficShiftRequest.Distribution current_distribution = 4;
  repeated TrafficShiftRequest.Distribution target_distribution = 5;
}

message PostValidateRequest {
  string rebalance_id = 1;
  google.protobuf.Timestamp validation_window_start = 2;
  google.protobuf.Timestamp validation_window_end = 3;
  message Metrics {
    double primary_cell_latency_p95_ms = 1;
    double burst_1_cell_latency_p95_ms = 2;
    double burst_2_cell_latency_p95_ms = 3;
    double order_intake_routing_success_pct = 4;
    uint32 queued_orphan_messages = 5;
    bool audit_chain_coherent = 6;
    bool kr_lsa_evaluator_green = 7;
  }
  Metrics metrics = 4;
  message BoundaryInvariantCheck {
    bool employer_to_personal_probe_attempted = 1;
    bool employer_to_personal_probe_denied = 2;
    bool personal_to_employer_probe_without_permit_attempted = 3;
    bool personal_to_employer_probe_without_permit_denied = 4;
  }
  BoundaryInvariantCheck boundary_invariant_check = 5;
}

// ---------- §4 KR-LSA evaluation ----------

message KrLsaEvaluateRequest {
  TenantContext tenant_ctx = 1;
  google.protobuf.Timestamp eval_window_start = 2;
  google.protobuf.Timestamp eval_window_end = 3;
  message StaffProjection {
    string principal = 1;
    double projected_hours = 2;
  }
  repeated StaffProjection staff_projections = 4;
}

message KrLsaEvaluateResponse {
  message Result {
    string principal = 1;
    double projected_hours = 2;
    enum Verdict {
      GREEN = 0;
      GREEN_MONITOR = 1;
      YELLOW_REDISTRIBUTE = 2;
      RED_OVERCAP = 3;
    }
    Verdict verdict = 3;
    string recommendation = 4;
  }
  repeated Result results = 1;
  AuditAnchor audit = 2;
}
