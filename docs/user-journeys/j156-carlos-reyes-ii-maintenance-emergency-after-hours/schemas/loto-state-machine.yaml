# j156 — Lockout/Tagout state machine
# 29 CFR 1910.147 — Control of Hazardous Energy (Lockout/Tagout)
# This state machine is enforced by the workflow-engine µservice + Cedar policy FORBID-4.
# Direct skip transitions to `energized_normal` are forbidden — Cedar evaluates and dual-seals deny.
#
# Each transition requires:
#   - permit_id active and co-signed
#   - principal has required certifications
#   - photo evidence captured
#   - audit dual-sealed in both Cascade and MeridianStack tenants
#
# State machine version: v3 (matches OSHA 1910.147 + NFPA-70E 2024)

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: loto-1910.147-cross-tenant-v3
  permit_template: wkfl-permit-to-work-hvac-cross-tenant-v3
  adr_refs:
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0250  # build-ahead-of-certification
  regulator_anchors:
    - 29-CFR-1910.147        # LOTO
    - 29-CFR-1910.333        # electrical safety
    - NFPA-70E-2024          # arc-flash boundary

spec:
  # ============================================
  # §1 States
  # ============================================
  states:
    - name: lockout_pending
      description: "Permit co-signed; tech approaching equipment; no isolation yet"
      is_initial: true
      is_terminal: false
      cedar_action_required: workflow.loto_transition

    - name: disconnect_open
      description: "Electrical disconnect switch turned to OFF position; energy source isolated"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_transition

    - name: personal_lock_applied
      description: "Tech applies personal red Master Lock with etched name; tag applied"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_lock

    - name: tested_voltage_absent
      description: "Voltage absence verified with calibrated meter across all phases"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_transition

    - name: locked_isolated_verified
      description: "LOTO ceremony complete; work may now proceed safely"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_lock

    - name: work_in_progress
      description: "Tech actively performing work under LOTO"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_transition

    - name: personal_lock_removed
      description: "Tech removes personal lock and tag; work complete"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_release

    - name: disconnect_closed
      description: "Disconnect switch returned to ON position"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.loto_transition

    - name: energized_normal
      description: "Equipment re-energized; LOTO closed"
      is_initial: false
      is_terminal: true
      cedar_action_required: workflow.loto_transition

  # ============================================
  # §2 Transitions (14 valid)
  # ============================================
  transitions:
    - from: lockout_pending
      to: disconnect_open
      label: "open the disconnect"
      evidence_required:
        - photo: "disconnect-switch-off-position"
      audit_class: EVT-J156-LOTO-DISCONNECT-OPEN-004c

    - from: disconnect_open
      to: personal_lock_applied
      label: "apply personal lock + tag"
      evidence_required:
        - photo: "personal-lock-on-disconnect"
        - photo: "danger-tag-on-disconnect"
      audit_class: EVT-J156-LOTO-LOCK-APPLIED-004d

    - from: personal_lock_applied
      to: tested_voltage_absent
      label: "verify zero voltage with calibrated meter"
      evidence_required:
        - photo: "voltage-tested-meter-face"
        - instrument_reading: "phase_a"
        - instrument_reading: "phase_b"
        - instrument_reading: "phase_c"
      cedar_extra_context:
        - instrument_calibration_current: true
        - all_phases_zero: true
      audit_class: EVT-J156-LOTO-VOLTAGE-TESTED-004e

    - from: tested_voltage_absent
      to: locked_isolated_verified
      label: "confirm LOTO ceremony complete"
      evidence_required:
        - joint_observer_attestation: "host_noc_controller"
      audit_class: EVT-J156-LOTO-LOCKED-004

    - from: locked_isolated_verified
      to: work_in_progress
      label: "begin work under LOTO"
      audit_class: EVT-J156-LOTO-WORK-START-014

    - from: work_in_progress
      to: work_in_progress
      label: "intermediate work checkpoint (idempotent)"
      audit_class: EVT-J156-LOTO-WORK-CHECKPOINT-014a

    - from: work_in_progress
      to: personal_lock_removed
      label: "work complete; remove personal lock"
      pre_condition:
        - all_tasks_in_scope_completed: true
        - post_leak_test_pass: true
      evidence_required:
        - photo: "personal-lock-removed-disconnect"
      audit_class: EVT-J156-LOTO-LOCK-REMOVED-015

    - from: personal_lock_removed
      to: disconnect_closed
      label: "close the disconnect"
      evidence_required:
        - photo: "disconnect-switch-on-position"
      audit_class: EVT-J156-LOTO-DISCONNECT-CLOSED-016

    - from: disconnect_closed
      to: energized_normal
      label: "verify normal operation post-energization"
      evidence_required:
        - photo: "equipment-running-thermal-image-flir"
        - telemetry_stable_for_seconds: 120
      audit_class: EVT-J156-LOTO-ENERGIZED-NORMAL-017

    # Defensive transitions — emergency abort path
    - from: work_in_progress
      to: locked_isolated_verified
      label: "emergency pause work"
      evidence_required:
        - free_text_reason: "min 32 chars"
      audit_class: EVT-J156-LOTO-EMERGENCY-PAUSE-022

    - from: locked_isolated_verified
      to: personal_lock_removed
      label: "abort work without completion (rare)"
      pre_condition:
        - manager_override_signature: required
      audit_class: EVT-J156-LOTO-ABORT-WITHOUT-COMPLETION-023

  # ============================================
  # §3 Forbidden transitions (Cedar dual-seal deny)
  # ============================================
  forbidden_transitions:
    - from: lockout_pending
      to: energized_normal
      forbid_rule_id: forbid-loto-skip-1
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

    - from: disconnect_open
      to: energized_normal
      forbid_rule_id: forbid-loto-skip-2
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

    - from: tested_voltage_absent
      to: energized_normal
      forbid_rule_id: forbid-loto-skip-3
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

    - from: locked_isolated_verified
      to: energized_normal
      forbid_rule_id: forbid-loto-skip-4
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

    - from: work_in_progress
      to: disconnect_closed
      forbid_rule_id: forbid-loto-skip-personal-lock-removal
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

    - from: work_in_progress
      to: energized_normal
      forbid_rule_id: forbid-loto-skip-personal-lock-removal-and-disconnect-close
      audit_class: EVT-J156-LOTO-INVALID-TRANSITION-009c

  # ============================================
  # §4 Cedar guards (applied at every transition)
  # ============================================
  cedar_guards:
    - guard_id: guard-permit-active
      description: "Permit must be in co_signed_active state at transition time"
      context_required:
        permit_status: co_signed_active

    - guard_id: guard-cert-unexpired
      description: "Principal NFPA-70E-Cat-2 + EPA-608 must be unexpired"
      context_required:
        principal.certifications_unexpired:
          - NFPA-70E-CAT-2
          - EPA-608-Universal

    - guard_id: guard-photo-evidence
      description: "Each transition's required photos must be uploaded before state advances"
      context_required:
        photo_evidence_complete: true

    - guard_id: guard-joint-observer-on-critical
      description: "Voltage-test transition requires host_noc_controller as joint observer"
      applies_to_transitions:
        - personal_lock_applied → tested_voltage_absent
        - tested_voltage_absent → locked_isolated_verified
      context_required:
        joint_observer_role: host_noc_controller

  # ============================================
  # §5 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants:
      - cascade-fm-services-llc-us
      - meridianstack-hosting-co-us
    retention_years: 7  # 1910.147 standard recordkeeping
    merkle_anchor: per-transition
