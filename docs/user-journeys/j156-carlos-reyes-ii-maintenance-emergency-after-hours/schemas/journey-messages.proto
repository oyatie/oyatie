// j156 — Carlos Reyes II maintenance emergency RPC messages
// proto3, package versioned per ADR-0244 tenant scoping + ADR-0311 cross-tenant grant boundary
// Cross-tenant audit dual-seal mandatory under ADR-0263.

syntax = "proto3";

package oya.journeys.j156.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;             // e.g. carlos.reyes-ii@cascade-fm-services-llc-us
  string home_tenant = 2;
  string acting_tenant = 3;          // resolves to host tenant when cross-grant active
  string cross_grant_id = 4;
  repeated string active_certifications = 5;
  string passkey_assertion_b64 = 6;
  string device_id = 7;
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;
  string trace_id = 3;
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  bool triple_seal_complete = 6;
}

message Photo {
  string photo_id = 1;               // e.g. photo-2026-10-17-053218-7b-pump-rebuild-pre.heic
  string sha256 = 2;
  google.protobuf.Timestamp captured_at = 3;
  double gps_lat = 4;
  double gps_lon = 5;
  double gps_accuracy_m = 6;
  string device_id = 7;
}

// ---------- §1 Incident management ----------

message IncidentP1Page {
  string incident_id = 1;            // e.g. incident-dc-phx-3-2026-10-17-0247-7b-chl-overtemp
  TenantContext tenant_ctx = 2;
  string severity = 3;
  string incident_class = 4;
  google.protobuf.Timestamp detected_at = 5;
  google.protobuf.Timestamp auto_shed_eta = 6;
  message MetricsSnapshot {
    double delta_t_inlet_outlet_f = 1;
    double delta_t_cap_f = 2;
    double rack_intake_f_p95 = 3;
    uint32 racks_affected = 4;
  }
  MetricsSnapshot metrics = 7;
  string escalation_tree_id = 8;
  string vendor_contract_id = 9;
}

message IncidentAckRequest {
  Principal principal = 1;
  string incident_id = 2;
  google.protobuf.Timestamp acknowledged_at = 3;
  enum AckMethod { PASSKEY_LATENT_PRINT = 0; PASSKEY_FACE_ID = 1; PASSKEY_PIN = 2; }
  AckMethod method = 4;
  string device_id = 5;
  google.protobuf.Timestamp eta_to_site = 6;
}

message IncidentAckResponse {
  string ack_id = 1;
  uint32 auto_shed_ttl_seconds_at_ack = 2;
  bool cross_tenant_grant_provisional = 3;
  bool manager_co_ack_required = 4;
  AuditAnchor audit = 5;
}

// ---------- §2 Cross-tenant grant ----------

message CrossGrantIssueRequest {
  string grantor_tenant = 1;
  string grantee_principal = 2;
  message Scope {
    string facility = 1;
    string zone = 2;
    repeated string equipment_ids = 3;
    repeated string actions = 4;
  }
  Scope scope = 3;
  google.protobuf.Timestamp valid_from = 4;
  google.protobuf.Timestamp valid_until = 5;
  string reason_link = 6;
  string vendor_contract_id = 7;
}

message CrossGrantIssueResponse {
  string cross_grant_id = 1;
  bool active = 2;
  google.protobuf.Timestamp deactivates_at = 3;
  bool auto_revoke_on_incident_close = 4;
  AuditAnchor audit = 5;
}

message CrossGrantExpirationEvent {
  string cross_grant_id = 1;
  google.protobuf.Timestamp expired_at = 2;
  enum Reason { SCHEDULED_VALIDITY_END = 0; INCIDENT_CLOSED_AUTO = 1; MANAGER_REVOKE = 2; }
  Reason reason = 3;
  AuditAnchor audit = 4;
}

// ---------- §3 Permit-to-work ----------

message PermitCreateRequest {
  string workflow_template_id = 1;
  TenantContext tenant_ctx = 2;
  string host_tenant = 3;
  message Scope {
    string facility = 1;
    string zone = 2;
    repeated string equipment_ids = 3;
    repeated string ppe_required = 4;
    repeated string certifications_required = 5;
    bool loto_required = 6;
    string refrigerant_in_scope = 7;
  }
  Scope permit_scope = 4;
  google.protobuf.Timestamp valid_from = 5;
  google.protobuf.Timestamp valid_until = 6;
  message CoSigner {
    string role = 1;                 // cascade_manager / host_noc_controller / host_facility_manager
    string principal = 2;
  }
  repeated CoSigner co_signers = 7;
}

message PermitSignRequest {
  Principal principal = 1;
  string permit_id = 2;
  string role = 3;
  google.protobuf.Timestamp signed_at = 4;
  string passkey_assertion_b64 = 5;
  string attestation = 6;
}

// ---------- §4 LOTO state machine ----------

message LotoTransitionRequest {
  string permit_id = 1;
  enum State {
    LOCKOUT_PENDING = 0;
    DISCONNECT_OPEN = 1;
    PERSONAL_LOCK_APPLIED = 2;
    TESTED_VOLTAGE_ABSENT = 3;
    LOCKED_ISOLATED_VERIFIED = 4;
    WORK_IN_PROGRESS = 5;
    PERSONAL_LOCK_REMOVED = 6;
    DISCONNECT_CLOSED = 7;
    ENERGIZED_NORMAL = 8;
  }
  State from_state = 2;
  State to_state = 3;
  google.protobuf.Timestamp transitioned_at = 4;
  message Evidence {
    Photo photo = 1;
    string instrument = 2;            // e.g. Fluke T6-1000
    string phase_a = 3;
    string phase_b = 4;
    string phase_c = 5;
    string joint_observer = 6;
  }
  Evidence evidence = 5;
}

// ---------- §5 Tasks ----------

message TasksMaterializeRequest {
  string permit_id = 1;
  TenantContext tenant_ctx = 2;
  string host_tenant = 3;
  string task_template_set = 4;
  repeated string task_ids = 5;
}

message TaskCompleteRequest {
  string task_id = 1;
  string completed_by = 2;
  google.protobuf.Timestamp completed_at = 3;
  message Evidence {
    repeated Photo photos = 1;
    message PartConsumed {
      string part_id = 1;
      uint32 qty = 2;
      string vendor = 3;
    }
    repeated PartConsumed parts_consumed = 2;
    string torque_spec = 3;
    double pressure_decay_psi = 4;
    double delta_weight_lb = 5;       // for refrigerant recovery
  }
  Evidence evidence = 4;
  double gps_lat = 5;
  double gps_lon = 6;
  double gps_accuracy_m = 7;
}

// ---------- §6 EPA-608 disclosure ----------

message EpaDisclosureCreateRequest {
  string workflow_template_id = 1;
  TenantContext tenant_ctx = 2;
  string host_tenant = 3;
  string incident_link = 4;
  string refrigerant = 5;
  double release_estimate_lb = 6;
  string cylinder_of_origin = 7;
  google.protobuf.Timestamp release_first_observed_at = 8;
  string release_cause = 9;
}

message EpaEgrtSubmitRequest {
  string disclosure_workflow_id = 1;
  bytes form_payload = 2;
  message Signature {
    enum Role {
      TECHNICIAN_EPA_608 = 0;
      CASCADE_TENANT_ATTESTATION = 1;
      MERIDIANSTACK_SITE_ATTESTATION = 2;
    }
    Role role = 1;
    string signer_principal = 2;
    string passkey_assertion_b64 = 3;
  }
  repeated Signature signatures = 3;
}

message EpaEgrtSubmitResponse {
  string egrt_receipt_id = 1;
  google.protobuf.Timestamp receipt_at = 2;
  string regulator_anchor = 3;       // 40-CFR-82-F
  AuditAnchor audit = 4;
}

// ---------- §7 Messenger MLS group ----------

message MessengerGroupCreateRequest {
  string group_id_hint = 1;
  message Participant {
    string principal = 1;
  }
  repeated Participant participants = 2;
  repeated string tenant_set = 3;
  string retention_policy = 4;
}

message MessengerGroupCreateResponse {
  string group_id = 1;
  uint64 mls_epoch = 2;
  AuditAnchor audit = 3;
}

// ---------- §8 HIPAA daily roll-up ----------

message HipaaDailyRollupArtifact {
  string facility_id = 1;
  google.protobuf.Timestamp window_start = 2;
  google.protobuf.Timestamp window_end = 3;
  uint32 total_events = 4;
  string merkle_root_b64 = 5;
  message ClassBreakdown {
    string event_class = 1;
    uint32 count = 2;
  }
  repeated ClassBreakdown breakdown = 6;
  AuditAnchor audit = 7;
}
