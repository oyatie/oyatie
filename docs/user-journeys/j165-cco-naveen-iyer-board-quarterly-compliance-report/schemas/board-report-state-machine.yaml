# j165 — Tessellate Q1-2027 board compliance report state machine
# 4-state lifecycle for quarterly board compliance report
# Each transition: Cedar permit + audit class + SLA + invariant
# ADR-0244 + ADR-0263 + ADR-0251 + ADR-0250

state_machine:
  name: tessellate_q1_2027_board_compliance_report
  report_id: q1-2027-quarterly
  tenant_id: tessellate-health-ai-inc
  initial_state: not_started
  terminal_states:
    - board_presentation
    - archived
  states:

    - name: not_started
      description: Pre-workflow placeholder; expecting CCO initiation
      sla_max_duration: indefinite
      transitions:
        - to: draft
          on: governance.board_report_workflow_initiate
          guard: cco_principal_and_passkey

    - name: draft
      description: CCO authors the report; cross-pack evidence pull + per-pack Merkle + LLM-assist exec summary + SEC 8-K eval + super-Merkle
      sla_max_duration: 5 business days
      entry_audit: EVT-J165-WORKFLOW-INITIATED-000
      exit_audit: EVT-J165-TRANSITION-DRAFT-TO-COUNSEL-006
      cedar_permits_required:
        - compliance.cross_pack_evidence_pull
        - compliance.report_draft
        - intelligence.executive_summary_assist
        - governance.merkle_per_pack_compute
        - governance.merkle_super_root_compute
        - compliance.sec_8k_trigger_evaluate
      invariants:
        - all_8_packs_evidence_pulled
        - per_pack_merkle_computed_for_each_of_8
        - super_merkle_root_deterministic
        - sec_8k_trigger_evaluation_complete
        - exec_summary_drafted_with_human_finalization
        - twelve_sections_drafted
        - llm_provenance_metadata_preserved
        - eu_ai_act_article_50_declaration_present
      transitions:
        - to: counsel_review
          on: workflow_engine.transition_propose
          guard: cco_signoff_and_super_merkle_present_and_12_sections

    - name: counsel_review
      description: General Counsel reviews; redlines; CCO resolves
      sla_max_duration: 2 business days
      entry_audit: EVT-J165-TRANSITION-DRAFT-TO-COUNSEL-006
      exit_audit: EVT-J165-TRANSITION-COUNSEL-TO-AC-008
      cedar_permits_required:
        - governance.counsel_review
        - governance.counsel_redline_submit
      cedar_forbids_active:
        - workflow_engine.transition_audit_committee_to_board (until counsel review present)
      invariants:
        - cco_signoff_present
        - counsel_passkey_asserted
        - redlines_documented_with_section_pointer
      transitions:
        - to: audit_committee_sign_off
          on: workflow_engine.transition_counsel_to_audit_committee
          guard: counsel_review_present_and_redlines_resolved

    - name: audit_committee_sign_off
      description: Audit committee members review + sign-off; ≥ 3 of 5 quorum required
      sla_max_duration: 2 business days
      entry_audit: EVT-J165-TRANSITION-COUNSEL-TO-AC-008
      exit_audit: EVT-J165-TRANSITION-AC-TO-BOARD-010
      cedar_permits_required:
        - governance.audit_committee_signoff
      invariants:
        - counsel_review_present
        - quorum_threshold_3_of_5
        - each_signoff_passkey_asserted
        - chair_role_validated
        - independent_role_validated
      quorum_policy:
        threshold: 3
        committee_size: 5
        members:
          - jasmine.wells-okafor (chair)
          - tunde.akinwale (independent)
          - lisa.cheng-halsey (independent)
          - marcus.lin (NED)
          - patricia.hwong (independent)
        sufficient_set_examples:
          - chair + 2 independents (the typical pattern)
          - chair + 1 independent + 1 NED
          - 3 independents (chair-absent but valid)
      transitions:
        - to: board_presentation
          on: workflow_engine.transition_audit_committee_to_board
          guard: quorum_reached_and_chair_authorized

    - name: board_presentation
      description: Final report archived to drive WORM + super-Merkle anchored externally + pre-read distributed to board
      sla_max_duration: 24h post-AC-quorum
      entry_audit: EVT-J165-TRANSITION-AC-TO-BOARD-010
      exit_audit: EVT-J165-REPORT-ARCHIVED-011
      cedar_permits_required:
        - drive.write_room
        - drive.engage_worm_lock
        - audit-chain.external_transparency_log_anchor
        - drive.distribute_pre_read
      invariants:
        - drive_worm_engaged
        - retention_authority_SEC_pre_IPO_adapted
        - retention_until_2034_04_11
        - super_merkle_root_externally_anchored
        - external_transparency_log_batch_id_present
        - regional_evidence_preserved_per_jurisdiction
        - pre_read_distributed_to_8_board_members
      transitions: []

  # ============================================================
  # Failure transitions
  # ============================================================

  failure_transitions:

    - from: draft
      to: draft (retry)
      on: cross_region_pull_timeout_on_one_pack
      remediation: surface_diagnostic + continue_with_remaining + cco_acknowledgment_required

    - from: draft
      to: draft (no-LLM-fallback)
      on: llm_unavailable
      remediation: fall_back_to_template + naveen_drafts_manually + provenance_records_no_llm_used

    - from: counsel_review
      to: draft (counsel-rejected)
      on: counsel_declines_to_sign
      remediation: cco_and_counsel_discuss + redraft + workflow_restarts_at_draft

    - from: audit_committee_sign_off
      to: board_presentation_blocked
      on: quorum_cannot_be_reached
      remediation: chair_escalates + reschedule_with_board_chair

    - from: board_presentation
      to: external_anchor_pending_remediation
      on: external_transparency_log_unavailable
      remediation: archive_locally + flag_pending_external_anchor + retry_batch

  # ============================================================
  # SLA summary
  # ============================================================

  sla_summary:
    draft_max: 5 business days
    counsel_review_max: 2 business days
    audit_committee_signoff_max: 2 business days
    board_presentation_max: 24h post-AC-quorum
    total_journey_max_wall_clock: 6 business days

  # ============================================================
  # Cedar deny coverage
  # ============================================================

  cedar_deny_coverage:
    - non_cco_attempts_workflow_initiation: EVT-J165-CEDAR-DENY-NON-CCO-INIT-Δ001
    - ac_signoff_without_counsel_review: EVT-J165-CEDAR-DENY-AC-WITHOUT-COUNSEL-Δ002
    - board_transition_without_quorum: EVT-J165-CEDAR-DENY-BOARD-NO-QUORUM-Δ003
    - cross_region_evidence_material_transfer: EVT-J165-CEDAR-DENY-EVIDENCE-CROSS-REGION-Δ004
    - modification_of_worm_locked_artifact: EVT-J165-CEDAR-DENY-WORM-MODIFY-Δ005

  # ============================================================
  # SEC 8-K trigger evaluation policy
  # ============================================================

  sec_8k_trigger_policy:
    evaluation_mode_pre_ipo: shadow
    evaluation_mode_post_ipo: enforcement
    items_evaluated:
      - 1.01-material-definitive-agreement
      - 1.02-termination-material-definitive-agreement
      - 2.02-results-of-operations
      - 2.04-triggering-events-financial-obligation
      - 4.02-non-reliance-on-financial-statements
      - 5.02-departure-directors-officers
      - 8.01-other-events
    transition_to_enforcement_on: s_1_effectiveness

  # ============================================================
  # Regional data residency invariants
  # ============================================================

  regional_data_residency:
    us_east:
      packs: [soc2, hipaa, pci-dss, sec-pre-ipo]
      evidence_count: 281
      cell: us-east-boston-tier-1-compliance
    eu_frankfurt:
      packs: [gdpr, eu-ai-act]
      evidence_count: 135
      cell: eu-frankfurt-evidence-mirror
    kr_seoul:
      packs: [kr-pipa, csap]
      evidence_count: 80
      cell: kr-seoul-evidence-mirror
    only_hashes_crossable: true
    material_data_residency_enforced_by: Cedar forbid rule cross_region_evidence_material_transfer

  # ============================================================
  # Merkle determinism contract
  # ============================================================

  merkle_determinism_contract:
    per_pack_root_ordering: evidence_artifact_sha256_ascending
    super_merkle_root_ordering: pack_id_ascending
    hash_function: SHA-256
    tree_construction: rfc-6962-style
    determinism_required: byte_equal_across_independent_runs
