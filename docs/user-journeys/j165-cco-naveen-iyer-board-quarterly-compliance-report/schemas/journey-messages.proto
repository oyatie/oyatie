// j165 — Tessellate Q1-2027 board compliance report messages
// proto3 — Devanagari + Tamil + Hangul + German diacritics preserved UTF-8 NFC byte-exact
// ADR-0244 + ADR-0263 + ADR-0251 + ADR-0250 + ADR-0253

syntax = "proto3";

package oyatie.user_journey.j165;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================
// Common
// ============================================================

message TenantContext {
  string tenant_id = 1;
  string operating_principal = 2;
  string role_in_tenant = 3;
  google.protobuf.Timestamp observed_at = 4;
}

// ============================================================
// Workflow
// ============================================================

message WorkflowInitiateRequest {
  TenantContext context = 1;
  string report_id = 2;
  string report_class = 3;
  google.protobuf.Timestamp scheduled_board_meeting = 4;
  google.protobuf.Timestamp pre_read_deadline = 5;
  string cco_principal = 6;
  repeated string active_packs = 7;
  google.protobuf.Timestamp initiated_at = 8;
}

message WorkflowTransitionRequest {
  string report_id = 1;
  string from_state = 2;
  string to_state = 3;
  string actor_principal = 4;
  TransitionGuardContext guard_context = 5;
  google.protobuf.Timestamp transitioned_at = 6;
}

message TransitionGuardContext {
  bool cco_signoff_present = 1;
  bool counsel_review_present = 2;
  bool audit_committee_quorum_reached = 3;
  int32 audit_committee_quorum_count = 4;
  bool passkey_assertion_present = 5;
  bool super_merkle_root_present = 6;
  bool twelve_sections_complete = 7;
  bool redlines_resolved = 8;
}

// ============================================================
// Cross-pack evidence
// ============================================================

message CrossPackEvidencePullRequest {
  string tenant_id = 1;
  string report_id = 2;
  repeated PackQuerySpec active_packs = 3;
  string quarter = 4;
  string fanout_strategy = 5;
}

message PackQuerySpec {
  string pack_id = 1;
  string evidence_cell = 2;
}

message CrossPackEvidencePullResponse {
  repeated PerPackResult per_pack_results = 1;
  int32 total_evidence_count = 2;
  int32 total_findings = 3;
  int32 total_open_risks = 4;
}

message PerPackResult {
  string pack_id = 1;
  int32 evidence_count = 2;
  int32 findings = 3;
  int32 open_risks = 4;
  repeated Finding findings_detail = 5;
  repeated OpenRisk open_risks_detail = 6;
}

message Finding {
  string finding_id = 1;
  string severity = 2;  // "P1", "P2", "P3"
  string subject = 3;
  string remediation_status = 4;  // "in_progress", "completed", "deferred"
}

message OpenRisk {
  string risk_id = 1;
  string description_utf8_nfc = 2;
  string remediation_owner = 3;
  string target = 4;
  string material_to_disclose = 5;  // "yes", "partial", "no"
}

// ============================================================
// Per-pack + super Merkle
// ============================================================

message PerPackMerkleComputeBatchRequest {
  string tenant_id = 1;
  string report_id = 2;
  repeated PackMerkleSpec packs_to_compute = 3;
}

message PackMerkleSpec {
  string pack_id = 1;
  int32 evidence_count = 2;
}

message PerPackMerkleComputeBatchResponse {
  repeated PerPackMerkleResult per_pack_roots = 1;
}

message PerPackMerkleResult {
  string pack_id = 1;
  string merkle_root = 2;  // "0x..."
}

message SuperMerkleComputeRequest {
  string tenant_id = 1;
  string report_id = 2;
  string ordering = 3;  // "pack_id_ascending"
  repeated string input_roots = 4;
}

message SuperMerkleComputeResponse {
  string super_merkle_root = 1;
  google.protobuf.Timestamp computed_at = 2;
}

// ============================================================
// LLM-assisted exec summary
// ============================================================

message ExecSummaryAssistRequest {
  string tenant_id = 1;
  string report_id = 2;
  string model_id = 3;  // "sonnet-compliance-tuned-v3@oyatie-2027-03"
  string prompt_template = 4;
  ExecSummaryInputContext input_context = 5;
  ExecSummaryConstraints constraints = 6;
}

message ExecSummaryInputContext {
  string pack_findings_summary_json = 1;
  string open_risks_summary_json = 2;
  string prior_quarter_summary_reference = 3;
}

message ExecSummaryConstraints {
  int32 max_output_pages = 1;  // 4
  string tone = 2;
  bool human_finalization_required = 3;
}

message ExecSummaryAssistResponse {
  string draft_text_utf8_nfc = 1;
  LLMProvenance llm_provenance = 2;
}

message LLMProvenance {
  string model = 1;
  string invocation_id = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  double latency_seconds = 5;
  bool eu_ai_act_article_50_declaration_present = 6;
  string license = 7;
}

// ============================================================
// SEC trigger evaluation
// ============================================================

message SEC8KTriggerEvaluateRequest {
  string tenant_id = 1;
  string report_id = 2;
  string quarter = 3;
  repeated string items_to_evaluate = 4;
  string filing_obligation_status = 5;
}

message SEC8KTriggerEvaluateResponse {
  repeated string triggers_fired = 1;
  int32 triggers_evaluated = 2;
  string obligation_status = 3;
  string post_ipo_estimated_effective = 4;
  string note = 5;
}

// ============================================================
// Counsel review
// ============================================================

message CounselReviewSubmitRequest {
  string report_id = 1;
  string reviewer_principal = 2;
  int32 redline_count = 3;
  repeated Redline redlines = 4;
  int32 review_duration_minutes = 5;
  google.protobuf.Timestamp completed_at = 6;
  bool passkey_assertion_present = 7;
}

message Redline {
  int32 section = 1;
  string subject = 2;
}

// ============================================================
// Audit committee
// ============================================================

message AuditCommitteeSignoffRequest {
  string report_id = 1;
  repeated AuditCommitteeSignoff signoffs = 2;
  int32 quorum_threshold = 3;
  int32 quorum_count = 4;
  bool quorum_reached = 5;
}

message AuditCommitteeSignoff {
  string principal = 1;
  string role = 2;
  google.protobuf.Timestamp signed_at = 3;
}

// ============================================================
// Drive WORM archive
// ============================================================

message DriveWormArchiveRequest {
  string drive_room = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  bool worm = 6;
  google.protobuf.Timestamp worm_until = 7;
  string retention_authority = 8;
  string signed_by = 9;
  string counsel_review = 10;
  repeated string ac_signoff_principals = 11;
  string super_merkle_root = 12;
}

// ============================================================
// External transparency log anchor
// ============================================================

message ExternalTransparencyAnchorRequest {
  string report_id = 1;
  string super_merkle_root = 2;
  string external_batch_id = 3;
  google.protobuf.Timestamp anchored_at = 4;
}

// ============================================================
// Pre-read distribution
// ============================================================

message PreReadDistributeRequest {
  string drive_room = 1;
  repeated string distribute_to = 2;
  google.protobuf.Timestamp pre_read_open_at = 3;
  google.protobuf.Timestamp pre_read_close_at = 4;
}

// ============================================================
// Audit events
// ============================================================

message AuditEvent {
  string event_id = 1;  // "EVT-J165-*"
  TenantContext context = 2;
  string event_class = 3;
  bytes payload_canonical_cbor = 4;
  bool dual_seal = 5;
  string dual_seal_partner = 6;
}

message CedarDenyEvent {
  string event_id = 1;
  string principal = 2;
  string action = 3;
  string resource = 4;
  string forbid_rule_id = 5;
  string reason = 6;
  google.protobuf.Timestamp observed_at = 7;
}
