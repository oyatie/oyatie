---
doc_class: schedule-c-category-map
journey_id: j153-devon-williams-hvac-side-business-tax-end-of-year
date: 2026-05-20
authority_tier: 2
adr_anchors:
  - ADR-0244-tenant-as-universal-scoping-primitive
  - ADR-0263-observability-emission-contract
irs_source_of_truth: "IRS Schedule-C (Form 1040), 2026 instructions"

# Maps oya internal transaction-types to IRS Schedule-C line numbers.
# Bookie copilot uses this as the labeled training signal.
# Confidence floor for auto-apply is 0.85; below that, manual review.

mappings:
  - schedule_c_line: 1
    canonical_name: "Gross receipts/sales"
    source_kinds: ["payments.deposit", "payments.invoice_paid"]
    rails: ["stripe_connect", "venmo_gns", "zelle", "ach_direct", "cash_recorded"]
    aggregation: sum_gross_cents
    notes: "Includes ALL business income before fees; fees are NOT subtracted here"

  - schedule_c_line: 2
    canonical_name: "Returns and allowances"
    source_kinds: ["payments.refund_issued", "payments.credit_memo"]
    aggregation: sum_cents
    notes: "Refunds Devon issued to customers"

  - schedule_c_line: 4
    canonical_name: "Cost of goods sold (Part III)"
    source_kinds: ["receipt.installed_parts", "receipt.materials_resold"]
    vendor_hints: ["AutoZone", "Home Depot — copper line set", "Lowe's HVAC parts"]
    aggregation: sum_cents
    notes: "Tangible parts installed in customer jobs; tracked separately because COGS is on Part III"

  - schedule_c_line: 8
    canonical_name: "Advertising"
    source_kinds: ["receipt.advertising"]
    vendor_hints: ["Yelp Business", "oya marketplace listing fee", "Nextdoor business boost"]
    aggregation: sum_cents

  - schedule_c_line: 9
    canonical_name: "Car and truck expenses (not mileage)"
    source_kinds: ["receipt.tolls", "receipt.parking", "receipt.actual_expense_fuel"]
    aggregation: sum_cents
    mutual_exclusion_rule: "If Devon uses the standard mileage method, this line includes ONLY tolls + parking. Actual fuel + maintenance is excluded."
    standard_mileage_dollars_separately_on: "Form 4562 Part V + Schedule-C line 9 narrative"
    notes: "Standard mileage rate 54.5¢/mi for 2026 (per IRS Pub 463)"

  - schedule_c_line: 10
    canonical_name: "Commissions and fees"
    source_kinds: ["marketplace.commission", "payments.fee"]
    vendor_hints: ["oya marketplace 8% commission"]
    aggregation: sum_cents

  - schedule_c_line: 11
    canonical_name: "Contract labor"
    source_kinds: ["payments.contractor_paid"]
    triggers_1099_nec_threshold: 600
    notes: "If Devon paid any contractor >$600, he must issue a 1099-NEC by Jan 31"

  - schedule_c_line: 13
    canonical_name: "Depreciation and Section 179"
    source_kinds: ["receipt.major_tool", "receipt.equipment"]
    vendor_hints: ["Snap-On Tools", "Milwaukee Tool", "Fluke meter"]
    aggregation: depreciation_compute
    section_179_threshold_cents: 250000
    notes: "Section 179 elections recorded on Form 4562; tools <$2,500 may go on line 22 instead"

  - schedule_c_line: 14
    canonical_name: "Employee benefit programs"
    source_kinds: ["benefit.health_insurance_premium_employee"]
    aggregation: sum_cents
    notes: "Not applicable to sole-proprietor without employees; Devon has none"

  - schedule_c_line: 15
    canonical_name: "Insurance (other than health)"
    source_kinds: ["receipt.business_insurance"]
    vendor_hints: ["Hiscox", "Next Insurance", "State Farm commercial"]
    aggregation: sum_cents

  - schedule_c_line: 16
    canonical_name: "Interest"
    source_kinds: ["payments.business_loan_interest"]
    aggregation: sum_cents

  - schedule_c_line: 17
    canonical_name: "Legal and professional services"
    source_kinds: ["receipt.legal_fees", "receipt.accounting_fees"]
    aggregation: sum_cents

  - schedule_c_line: 18
    canonical_name: "Office expense"
    source_kinds: ["receipt.office_supplies"]
    aggregation: sum_cents

  - schedule_c_line: 19
    canonical_name: "Pension and profit-sharing plans"
    source_kinds: ["benefit.solo_401k_contribution"]
    aggregation: sum_cents

  - schedule_c_line: 20
    canonical_name: "Rent or lease (other business property)"
    source_kinds: ["receipt.business_property_rent"]
    aggregation: sum_cents

  - schedule_c_line: 21
    canonical_name: "Repairs and maintenance"
    source_kinds: ["receipt.vehicle_maintenance"]
    aggregation: sum_cents
    notes: "Vehicle maintenance only if NOT using standard mileage method"

  - schedule_c_line: 22
    canonical_name: "Supplies"
    source_kinds: ["receipt.consumables"]
    vendor_hints: ["AutoZone refrigerant", "Home Depot HVAC tape", "Grainger fittings"]
    aggregation: sum_cents
    notes: "Most small parts and consumables go here"

  - schedule_c_line: 23
    canonical_name: "Taxes and licenses"
    source_kinds: ["receipt.business_license", "receipt.sellers_permit", "receipt.local_tax"]
    vendor_hints: ["CA-CDTFA", "Hayward business license"]
    aggregation: sum_cents

  - schedule_c_line: 24
    canonical_name: "Travel and meals"
    source_kinds: ["receipt.business_travel", "receipt.business_meal"]
    sub_lines:
      - 24a_travel: 100_pct
      - 24b_meals: 50_pct
    aggregation: per_sub_line

  - schedule_c_line: 25
    canonical_name: "Utilities"
    source_kinds: ["receipt.business_utilities"]
    aggregation: sum_cents

  - schedule_c_line: 26
    canonical_name: "Wages"
    source_kinds: ["payments.w2_wages_paid"]
    aggregation: sum_cents
    notes: "Not applicable to Devon; no employees"

  - schedule_c_line: 27a
    canonical_name: "Other expenses"
    source_kinds: ["receipt.phone_business_pct", "receipt.cloud_subscription_business_pct"]
    aggregation: sum_with_business_use_pct
    business_use_pct_default: 65
    notes: "Phone bill × business use %; cloud subscriptions × business use %"

confidence_floor:
  auto_apply_threshold: 0.85
  below_floor_action: queue_for_human_review

ambiguity_rules:
  - rule: "If vendor is Home Depot, default to line 22 (Supplies) unless lumber/garden items are detected, then queue for review (likely personal)"
  - rule: "If vendor is a gas station and amount > $80, default to actual-expense method line 9; mark for review (likely standard-mileage user)"
  - rule: "If vendor is a restaurant, default to line 24b (50% meal deduction); manual review for client-meal vs personal"
  - rule: "If vendor is unrecognized, queue for human review regardless of confidence"

x-oya-journey: j153
x-oya-pack-overlay:
  - us-irs-schedule-c
  - us-form-1099-k
  - us-ca-cdtfa
