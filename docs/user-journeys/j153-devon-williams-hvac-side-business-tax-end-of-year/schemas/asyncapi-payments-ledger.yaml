asyncapi: "3.1.0"
info:
  title: Payments Ledger Stream — j153
  version: 1.0.0-j153
  description: >
    AsyncAPI 3.1.0 for the payments.ledger.transactions_v1 topic used by
    journey j153 (Devon Williams HVAC side-business tax reconciliation).
    Per-tenant partitioning enforces ADR-0244 tenant-scoping invariant.

defaultContentType: application/avro

servers:
  oya-kafka-us-west-2-finops:
    host: kafka.us-west-2-finops.oya.network:9093
    protocol: kafka-secure
    description: Per-cell Kafka for the us-west-2-finops-cell

channels:
  payments.ledger.transactions_v1:
    description: >
      Canonical immutable ledger event for every payment transaction across
      every rail. Partition key is tenant_id to guarantee single-partition
      ordering per tenant. Rail field distinguishes Stripe Connect, Venmo,
      Zelle, ACH direct, etc.
    address: payments/ledger/transactions_v1
    messages:
      transaction:
        $ref: "#/components/messages/PaymentLedgerTransaction"
    parameters:
      tenant_id:
        description: ADR-0244 tenant scoping (partition key)
        location: $message.payload#/tenant_id

operations:
  publishTransaction:
    action: send
    channel:
      $ref: "#/channels/payments.ledger.transactions_v1"
    summary: Payments-rail adapter publishes a canonical ledger event
    bindings:
      kafka:
        groupId: payments-ledger-producer
        clientId: payments-rail-adapter-{rail}

  subscribeFromFinops:
    action: receive
    channel:
      $ref: "#/channels/payments.ledger.transactions_v1"
    summary: finops-portal subscribes per tenant
    bindings:
      kafka:
        groupId: finops-portal-consumer-{tenant_id}

components:
  messages:
    PaymentLedgerTransaction:
      name: PaymentLedgerTransaction
      title: Canonical payment ledger event
      contentType: application/avro
      payload:
        $ref: "#/components/schemas/PaymentLedgerTransactionAvro"
      headers:
        type: object
        required:
          - tenant_id
          - journey_id
        properties:
          tenant_id:
            type: string
          journey_id:
            type: string

  schemas:
    PaymentLedgerTransactionAvro:
      type: record
      name: PaymentLedgerTransaction
      namespace: network.oya.payments.ledger.v1
      fields:
        - name: transaction_id
          type: string
          doc: "Globally unique. Format: txn-{rail}-{yyyy}-{mm}-{dd}-{short_uuid}"
        - name: tenant_id
          type: string
          doc: "ADR-0244 scoping invariant"
        - name: rail
          type:
            type: enum
            name: PaymentRail
            symbols: [STRIPE_CONNECT, VENMO_GNS, VENMO_F2F, ZELLE, ACH_DIRECT, CASH_RECORDED, CASHAPP, PAYPAL]
        - name: direction
          type:
            type: enum
            name: Direction
            symbols: [INBOUND, OUTBOUND]
        - name: kind
          type:
            type: enum
            name: TransactionKind
            symbols:
              - DEPOSIT
              - INVOICE_PAID
              - REFUND_ISSUED
              - CREDIT_MEMO
              - FEE
              - PAYOUT
              - CHARGEBACK
              - DISPUTE
        - name: gross_cents
          type: long
        - name: fee_cents
          type: long
        - name: net_cents
          type: long
        - name: currency
          type: string
          default: "USD"
        - name: occurred_at
          type:
            type: long
            logicalType: timestamp-micros
        - name: customer_ref
          type:
            - "null"
            - string
          default: null
          doc: "Customer ID if a side-business customer record exists; null for one-off cash"
        - name: customer_display_name
          type:
            - "null"
            - string
          default: null
          doc: "Display name as the rail provided it; not necessarily PII-clean"
        - name: job_tasks_id
          type:
            - "null"
            - string
          default: null
          doc: "Link to tasks µservice job ID"
        - name: rail_native_id
          type: string
          doc: "The rail's own ID: Stripe deposit ID, Venmo txn ID, etc."
        - name: schedule_c_line_provisional
          type:
            - "null"
            - int
          default: null
          doc: "Bookie's auto-categorization suggestion (Schedule-C line number)"
        - name: schedule_c_line_final
          type:
            - "null"
            - int
          default: null
          doc: "Devon's confirmed Schedule-C line; null until user confirms or year-end runs"
        - name: deduplicate_against_txn_ids
          type:
            type: array
            items: string
          default: []
          doc: "If this txn was identified as a duplicate of others, the other IDs go here"
        - name: tax_year
          type: int
        - name: trace_id
          type: string
        - name: span_id
          type: string

  securitySchemes:
    kafkaMutualTls:
      type: X509
      description: Producer + consumer mutual-TLS with the cell-pinned Kafka CA

x-oya-journey: j153
x-oya-adr-anchors:
  - ADR-0244-tenant-as-universal-scoping-primitive
  - ADR-0263-observability-emission-contract
  - ADR-0311-dual-tenant-identity-personal-vs-work-boundary
  - ADR-0255-byok-everywhere-credentials

x-oya-partition-strategy:
  partition_key: tenant_id
  partition_count: 64
  rationale: "Per-tenant single-partition ordering. 64 partitions accommodates ~10k tenants per cell before rebalance."

x-oya-retention:
  hot: "30 days at the cell"
  warm: "1 year compressed in object storage"
  cold: "7 years in drive (IRS retention period)"
