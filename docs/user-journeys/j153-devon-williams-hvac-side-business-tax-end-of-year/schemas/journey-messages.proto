// j152 sibling — j153 proto3 messages
// All cent fields are signed int64 to allow negatives (refunds).

syntax = "proto3";

package network.oya.journey.j153.v1;

import "google/protobuf/timestamp.proto";

// ----------------------------------------------------------------------------
// Tenant switch
// ----------------------------------------------------------------------------

message TenantSwitchRequest {
  string principal = 1;
  string from_tenant = 2;
  string to_tenant = 3;
  string intent = 4;
  bool step_up_required = 5;
}

message TenantSwitchResponse {
  string switch_token = 1;
  uint32 valid_for_seconds = 2;
  string active_role = 3;
  string role_projection_view = 4;
}

// ----------------------------------------------------------------------------
// Stripe batch reconcile
// ----------------------------------------------------------------------------

message StripeBatchReconcileRequest {
  string tenant_id = 1;
  string rail = 2;                       // "stripe_connect"
  repeated string deposit_ids = 3;
  uint32 deposit_count = 4;
  int64 expected_gross_cents = 5;
  uint32 tax_year = 6;
  string stepup_token = 7;
}

message StripeBatchReconcileResponse {
  string batch_id = 1;
  uint32 reconciled_count = 2;
  repeated Discrepancy discrepancies = 3;
  string audit_event_id = 4;
}

message Discrepancy {
  string deposit_id = 1;
  string kind = 2;                       // "amount_mismatch" | "missing" | "duplicate"
  int64 delta_cents = 3;
}

// ----------------------------------------------------------------------------
// Venmo import
// ----------------------------------------------------------------------------

message VenmoImportRequest {
  string tenant_id = 1;
  uint32 tax_year = 2;
  string auth_mode = 3;                  // "platform_default" | "byok"
  repeated string deduplicate_against_rails = 4;
  int64 min_threshold_cents = 5;
  bool side_business_flag_required = 6;
}

message VenmoImportResponse {
  string import_job_id = 1;
  uint32 expected_transaction_count = 2;
  int64 expected_gross_cents = 3;
  uint32 duplicate_count_detected = 4;
  uint32 manual_link_required_count = 5;
}

// ----------------------------------------------------------------------------
// Receipt categorize batch
// ----------------------------------------------------------------------------

message ReceiptCategorizeBatchRequest {
  string tenant_id = 1;
  uint32 tax_year = 2;
  repeated string receipt_ids = 3;
  uint32 receipt_count = 4;
  string copilot_id = 5;                 // "bookie-schedule-c-v3.2"
  float min_confidence_for_auto_apply = 6;
}

message ReceiptCategorizeBatchResponse {
  uint32 auto_categorized_count = 1;
  uint32 queued_for_review_count = 2;
  string review_queue_url = 3;
}

// ----------------------------------------------------------------------------
// Year-end reconcile
// ----------------------------------------------------------------------------

message YearEndReconcileRequest {
  string tenant_id = 1;
  uint32 tax_year = 2;
  repeated string rails_included = 3;
  bool include_mileage = 4;
  bool include_cdtfa_draft = 5;
  bool produce_pdf = 6;
  bool produce_json = 7;
}

message YearEndReconcileResponse {
  string schedule_c_id = 1;
  ScheduleCLines lines = 2;
  MileageSummary mileage = 3;
  Form1099KSummary form_1099k_summary = 4;
  string pdf_url = 5;
  string audit_event_id = 6;
}

message ScheduleCLines {
  int64 line_1_gross = 1;
  int64 line_2_returns = 2;
  int64 line_4_cogs = 4;
  int64 line_7_gross_income = 7;
  int64 line_8_advertising = 8;
  int64 line_9_car_truck = 9;
  int64 line_10_commissions_fees = 10;
  int64 line_13_depreciation = 13;
  int64 line_22_supplies = 22;
  int64 line_23_taxes_licenses = 23;
  int64 line_27a_other = 27;
  int64 line_28_total_expenses = 28;
  int64 line_29_tentative_profit = 29;
  int64 line_30_home_office = 30;
  int64 line_31_net_profit = 31;
}

message MileageSummary {
  uint32 trip_count = 1;
  uint32 miles = 2;
  float rate_cents_per_mile = 3;
  int64 deductible_cents = 4;
}

message Form1099KSummary {
  int64 threshold_cents = 1;
  int64 stripe_connect_gross_cents = 2;
  int64 venmo_gross_cents = 3;
  int64 zelle_gross_cents = 4;
  repeated string expected_1099_k_issuers = 5;
}

// ----------------------------------------------------------------------------
// tax-preparer share
// ----------------------------------------------------------------------------

message TaxPreparerShareRequest {
  string tenant_id = 1;
  string preparer_id = 2;
  uint32 tax_year = 3;
  repeated string share_scope_fields = 4;
  repeated string share_scope_exclusions = 5;
  google.protobuf.Timestamp ttl_until = 6;
  string watermark_text = 7;
}

message TaxPreparerShareResponse {
  string share_id = 1;
  string share_link_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  string audit_event_id = 4;
}

// ----------------------------------------------------------------------------
// Workflow-studio publish
// ----------------------------------------------------------------------------

message WorkflowStudioPublishRequest {
  string tenant_id = 1;
  string name = 2;
  WorkflowTrigger trigger = 3;
  repeated WorkflowStep steps = 4;
  string compile_target = 5;
}

message WorkflowTrigger {
  string type = 1;                       // "cron" | "event"
  string expr = 2;                       // cron string
  string timezone = 3;
}

message WorkflowStep {
  string step = 1;
  map<string, string> args = 2;
}

message WorkflowStudioPublishResponse {
  string flow_id = 1;
  string compiled_dag_id = 2;
  google.protobuf.Timestamp scheduled_next_run = 3;
  string audit_event_id = 4;
}
