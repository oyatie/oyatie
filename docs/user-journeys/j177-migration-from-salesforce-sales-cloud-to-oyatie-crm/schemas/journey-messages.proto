syntax = "proto3";

package oyatie.userjourney.j177;

message VendorMigrationCommand {
  string journey_id = 1;
  string tenant_id = 2;
  string source_system = 3;
  string incumbent_system = 4;
  string target_system = 5;
  string phase = 6;
  string idempotency_key = 7;
  string requested_by = 8;
  bool rollback_rehearsal_required = 9;
}

message VendorExtractBatch {
  string journey_id = 1;
  string tenant_id = 2;
  string source_system = 3;
  string object_name = 4;
  uint64 source_row_count = 5;
  string source_hash = 6;
  string extracted_at = 7;
  repeated string named_fields = 8;
  string vendor_api = 9;
}

message FieldMapping {
  string source_field = 1;
  string target_field = 2;
  string transform_rule = 3;
  string evidence_rule = 4;
  bool material_to_go_no_go = 5;
}

message ParallelRunDelta {
  string journey_id = 1;
  string phase = 2;
  string object_name = 3;
  string field_name = 4;
  string source_value = 5;
  string target_value = 6;
  string severity = 7;
  string owner_microservice = 8;
  string audit_event_id = 9;
}

message CutoverDecision {
  string journey_id = 1;
  string decided_by = 2;
  string decision = 3;
  string reason = 4;
  string rollback_plan_id = 5;
  string audit_event_id = 6;
}

message MigrationEvent {
  string journey_id = 1;
  string tenant_id = 2;
  string phase = 3;
  string microservice = 4;
  string event_class = 5;
  string cedar_decision_id = 6;
  string evidence_hash = 7;
  string emitted_at = 8;
}

service VendorMigrationJourney {
  rpc StartMigration(VendorMigrationCommand) returns (MigrationEvent);
  rpc RegisterExtract(VendorExtractBatch) returns (MigrationEvent);
  rpc ApplyFieldMapping(FieldMapping) returns (MigrationEvent);
  rpc RecordParallelDelta(ParallelRunDelta) returns (MigrationEvent);
  rpc DecideCutover(CutoverDecision) returns (MigrationEvent);
}
