---
doc_class: User-Journey-Migration-State-Machine
journey_id: j177-migration-from-salesforce-sales-cloud-to-oyatie-crm
date: 2026-05-20
authority_tier: 2

machine:
  id: j177-vendor-migration
  name: j177-migration-from-salesforce-sales-cloud-to-oyatie-crm
  incumbent: Salesforce Sales Cloud
  target: Oyatie CRM
  initial_state: planned
  terminal_states:
    - oyatie_active
    - rolled_back

states:
  - id: planned
    description: Migration scope, source objects, ADRs, and rollback plan are approved.
    transitions:
      - to: source_extracting
        when: claim_accepted_and_credentials_bound
        audit_event: EVT-J177-PLANNED-001
  - id: source_extracting
    description: Salesforce Bulk API 2.0 query jobs with signed CSV payloads.
    transitions:
      - to: extract_verified
        when: row_counts_and_hashes_match_manifest
        audit_event: EVT-J177-EXTRACT-002
  - id: extract_verified
    description: Source objects are complete and immutable for migration purposes.
    transitions:
      - to: mapping_applied
        when: all_required_field_mappings_signed
        audit_event: EVT-J177-MAPPING-003
  - id: mapping_applied
    description: Field map is loaded into the migration controller.
    transitions:
      - to: projection_loaded
        when: oyatie.crm.pipeline_projection_v1_load_complete
        audit_event: EVT-J177-PROJECTION-004
  - id: projection_loaded
    description: Oyatie projection is populated and visible to replacement surfaces.
    transitions:
      - to: parallel_running
        when: replacement_surfaces_pass_smoke_tests
        audit_event: EVT-J177-PARALLEL-005
  - id: parallel_running
    description: 10-business-day Salesforce/Oyatie parallel-run window with owner, stage, amount, and close-date deltas.
    transitions:
      - to: go_no_go_ready
        when: p0_delta_count_zero_and_p1_deltas_owned
        audit_event: EVT-J177-GONOGO-006
      - to: rolled_back
        when: p0_delta_unresolved_or_rollback_ordered
        audit_event: EVT-J177-ROLLBACK-007
  - id: go_no_go_ready
    description: Executive go/no-go card is complete.
    transitions:
      - to: incumbent_read_only
        when: executive_approval_and_rollback_rehearsal_passed
        audit_event: EVT-J177-FREEZE-008
  - id: incumbent_read_only
    description: Incumbent writes are frozen and Oyatie receives new writes.
    transitions:
      - to: oyatie_active
        when: first_live_business_cycle_passes
        audit_event: EVT-J177-ACTIVE-009
  - id: oyatie_active
    description: Oyatie is active and incumbent is retained as read-only archive.
    is_terminal: true
  - id: rolled_back
    description: Incumbent resumes write authority and Oyatie batch is quarantined or compensated.
    is_terminal: true

invariants:
  - GDPR Articles 6, 15, 17, and 20 for CRM personal data
  - California CPRA Civil Code 1798.100 and 1798.105 customer data rights
  - CAN-SPAM Act 15 USC 7704 commercial email suppression preservation
  - SOX Section 404 controls over bookings and forecast evidence
  - SOC 2 CC6.1 and CC8.1 access and change-control evidence
  - Every event includes tenant_id, source_system, source_hash, projection_name, cedar_decision_id, and rollback_plan_id.
  - No inline vendor credential appears in logs, schemas, events, or dashboard payloads.
