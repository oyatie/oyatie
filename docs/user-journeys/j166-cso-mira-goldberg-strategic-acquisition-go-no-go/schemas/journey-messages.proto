// j166 — Skylark + MRT acquisition messages
// proto3 — Hebrew + German + Hangul + diacritics preserved UTF-8 NFC byte-exact
// ADR-0244 + ADR-0263 + ADR-0251 + ADR-0253 + ADR-0255

syntax = "proto3";

package oyatie.user_journey.j166;

import "google/protobuf/timestamp.proto";

// ============================================================
// Common
// ============================================================

message TenantContext {
  string tenant_id = 1;
  string operating_principal = 2;
  google.protobuf.Timestamp observed_at = 3;
}

// ============================================================
// M&A workspace
// ============================================================

message WorkspaceOpenRequest {
  string tenant_id = 1;
  string deal_id = 2;
  string target_tenant_id = 3;
  string deal_class = 4;
  int64 working_price_usd = 5;
  PriceRange price_range = 6;
  DealStructure structure = 7;
  int64 earnout_usd = 8;
  google.protobuf.Timestamp board_decision_target = 9;
  string cso_principal = 10;
  google.protobuf.Timestamp opened_at = 11;
}

message PriceRange {
  int64 low_usd = 1;
  int64 high_usd = 2;
}

message DealStructure {
  double cash_pct = 1;
  double stock_pct = 2;
}

// ============================================================
// Cross-tenant NDA channel
// ============================================================

message CrossTenantSendRequest {
  string channel_id = 1;
  string from_tenant = 2;
  string from_principal = 3;
  string to_tenant = 4;
  repeated string to_principals = 5;
  string nda_record_id = 6;
  string payload_class = 7;
  string document_id = 8;
  string filename_utf8_nfc = 9;
  int64 size_bytes = 10;
  bytes e2ee_envelope_b64 = 11;
  google.protobuf.Timestamp sent_at = 12;
}

message NDAPayloadValidation {
  string document_id = 1;
  string payload_class = 2;
  string nda_record_id = 3;
  PIIScanResult pii_scan = 4;
  FinancialValueScanResult financial_value_scan = 5;
  int64 payload_size_bytes = 6;
  bool payload_size_within_nda_envelope = 7;
  bool e2ee_envelope_intact = 8;
  bool sender_authorization_valid = 9;
}

message PIIScanResult {
  int32 pii_count = 1;
  repeated string categories_checked = 2;
}

message FinancialValueScanResult {
  int32 value_count = 1;
}

// ============================================================
// Financial M&A model
// ============================================================

message MAModelComputeRequest {
  string tenant_id = 1;
  string deal_id = 2;
  string model_template = 3;
  TargetInputs target_inputs = 4;
  AcquirerInputs acquirer_inputs = 5;
  DealTermInputs deal_terms = 6;
}

message TargetInputs {
  int64 arr_usd = 1;
  double arr_growth_yoy = 2;
  double gross_margin = 3;
  int32 customer_count = 4;
  int64 avg_arr_per_customer_usd = 5;
  int64 cac_ltm_usd = 6;
  double ltv_cac_ratio = 7;
  double net_dollar_retention = 8;
  double gross_dollar_retention = 9;
  double customer_concentration_top10_pct = 10;
}

message AcquirerInputs {
  int64 arr_usd = 1;
  int32 customer_count = 2;
  double net_dollar_retention = 3;
}

message DealTermInputs {
  int64 price_low_usd = 1;
  int64 price_working_usd = 2;
  int64 price_high_usd = 3;
  double structure_cash_pct = 4;
  double structure_stock_pct = 5;
  int64 earnout_usd = 6;
  int64 integration_cost_assumption_usd = 7;
}

message MAModelComputeResponse {
  repeated MAScenario scenarios = 1;
}

message MAScenario {
  int64 price_usd = 1;
  double revenue_multiple_arr = 2;
  int32 ntm_accretive_months = 3;
  double year_3_irr = 4;
  double year_5_irr = 5;
  int64 year_3_cumulative_cash_usd = 6;
  int64 year_5_cumulative_cash_usd = 7;
  double dilution_to_acquirer_stock_pct = 8;
}

// ============================================================
// ML scenario modeling
// ============================================================

message MLScenarioRequest {
  string tenant_id = 1;
  string deal_id = 2;
  repeated MLModelSpec ml_models = 3;
  bool deterministic_seed_provided = 4;
  string deterministic_seed = 5;
}

message MLModelSpec {
  string model_id = 1;
  int32 iterations = 2;
  repeated string scenarios = 3;
  int32 horizon_years = 4;
  double integration_complexity_score = 5;
}

message MLScenarioResponse {
  MonteCarloResults monte_carlo_results = 1;
  repeated CohortChurnYear cohort_churn_5_year_forecast = 2;
  IntegrationCostForecast integration_cost_forecast = 3;
  MLProvenance llm_provenance = 4;
}

message MonteCarloResults {
  ScenarioPoint recession_p10 = 1;
  ScenarioPoint neutral_p50 = 2;
  ScenarioPoint tailwind_p90 = 3;
  ScenarioPoint expected_probability_weighted = 4;
}

message ScenarioPoint {
  int64 arr_year_5_usd = 1;
  double irr_year_5 = 2;
  double neg_cf_year_3_plus_prob = 3;
}

message CohortChurnYear {
  int32 year = 1;
  double gross_churn = 2;
  double net_dollar_retention = 3;
}

message IntegrationCostForecast {
  int64 point_estimate_usd = 1;
  int64 ci_95_lower_usd = 2;
  int64 ci_95_upper_usd = 3;
  repeated string primary_drivers = 4;
}

message MLProvenance {
  int32 models_invoked = 1;
  int32 total_inference_seconds = 2;
  bool eu_ai_act_article_50_declaration_present = 3;
}

// ============================================================
// Pack cross-check
// ============================================================

message PackManifestCrossCheckRequest {
  string acquirer_tenant_id = 1;
  string target_tenant_id = 2;
  repeated string acquirer_active_packs = 3;
  repeated string target_active_packs = 4;
  bool evaluate_blockers = 5;
}

message PackManifestCrossCheckResponse {
  PackOverlapAnalysis overlap_analysis = 1;
  repeated PackBlocker blockers_identified = 2;
  repeated PackConsideration open_considerations = 3;
  double compatibility_score = 4;
}

message PackOverlapAnalysis {
  repeated string common = 1;
  repeated string acquirer_only = 2;
  repeated string target_only = 3;
}

message PackBlocker {
  string blocker_id = 1;
  string description = 2;
  int64 remediation_cost_usd = 3;
  string remediation_owner = 4;
  int32 remediation_timeline_months = 5;
}

message PackConsideration {
  string consideration_id = 1;
  string description = 2;
  string classification = 3;
}

// ============================================================
// Merger filings
// ============================================================

message MergerFilingsRequest {
  string deal_id = 1;
  int64 deal_size_usd = 2;
  string acquirer_tenant_id = 3;
  string target_tenant_id = 4;
  int64 acquirer_turnover_usd = 5;
  int64 target_turnover_usd = 6;
  repeated string jurisdictions_to_evaluate = 7;
}

message MergerFilingsResponse {
  repeated FilingResult filings = 1;
  int32 estimated_clearance_window_days = 2;
}

message FilingResult {
  string jurisdiction = 1;
  string filing_status = 2;        // "required" | "voluntary_recommended" | "not_required"
  int64 filing_fee_usd = 3;
  int32 waiting_period_days = 4;
  string recommended_counsel = 5;
}

// ============================================================
// Counsel review
// ============================================================

message CounselReviewRequest {
  string deal_id = 1;
  string reviewer_principal = 2;
  int32 redline_count = 3;
  repeated Redline redlines = 4;
  string deal_term_clarification_requested = 5;
  int32 review_duration_minutes = 6;
  google.protobuf.Timestamp completed_at = 7;
  bool passkey_assertion_present = 8;
}

message Redline {
  string redline_id = 1;
  string subject = 2;
}

// ============================================================
// CFO signoff + committee endorsement
// ============================================================

message CFOSignoffRequest {
  string deal_id = 1;
  string cfo_principal = 2;
  bool financial_model_review_complete = 3;
  bool ml_scenario_acknowledgment = 4;
  repeated string concerns_documented = 5;
  google.protobuf.Timestamp signoff_at = 6;
}

message CommitteeEndorsementRequest {
  string deal_id = 1;
  CommitteeEndorsement strategy_committee = 2;
  CommitteeEndorsement audit_committee = 3;
}

message CommitteeEndorsement {
  string chair = 1;
  repeated CommitteeVote votes = 2;
  int32 endorsement_count = 3;
  int32 committee_size = 4;
  bool endorsed = 5;
}

message CommitteeVote {
  string principal = 1;
  string vote = 2;  // "endorse" | "reservation" | "object"
  string note = 3;
}

// ============================================================
// Board vote
// ============================================================

message BoardVoteRequest {
  string deal_id = 1;
  google.protobuf.Timestamp meeting_at = 2;
  repeated BoardMemberVote votes = 3;
  int32 yes_count = 4;
  int32 no_count = 5;
  int32 abstain_count = 6;
  int32 total_votes = 7;
  int32 majority_threshold = 8;
  string result = 9;  // "GO" | "NO_GO"
  google.protobuf.Timestamp voted_at = 10;
}

message BoardMemberVote {
  string principal = 1;
  string role = 2;
  string vote = 3;  // "yes" | "no" | "abstain"
  bool passkey_asserted = 4;
}

// ============================================================
// Decision record + Merkle
// ============================================================

message DecisionRecordRequest {
  string deal_id = 1;
  repeated BundleComponent bundle_components = 2;
  string super_merkle_root = 3;
  repeated string anchor_targets = 4;
}

message BundleComponent {
  string role = 1;
  string sha256 = 2;
}

// ============================================================
// Audit
// ============================================================

message AuditEvent {
  string event_id = 1;  // "EVT-J166-*"
  TenantContext context = 2;
  string event_class = 3;
  bytes payload_canonical_cbor = 4;
}

message CedarDenyEvent {
  string event_id = 1;
  string principal = 2;
  string action = 3;
  string resource = 4;
  string forbid_rule_id = 5;
  string reason = 6;
  google.protobuf.Timestamp observed_at = 7;
}
