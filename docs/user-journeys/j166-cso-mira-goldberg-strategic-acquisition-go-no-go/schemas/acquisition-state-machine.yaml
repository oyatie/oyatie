# j166 — Skylark + MRT acquisition state machine
# 6-state lifecycle for strategic acquisition go/no-go
# Each transition: Cedar permit + audit class + SLA + invariant
# ADR-0244 + ADR-0263 + ADR-0251 + ADR-0245 + ADR-0252 + ADR-0253 + ADR-0255

state_machine:
  name: skylark_mrt_acquisition_q2_2027
  deal_id: mrt-acquisition-2027-q2
  acquirer_tenant_id: skylark-logistics-solutions-inc
  target_tenant_id: mendelsohn-routing-technologies-inc-de
  initial_state: due_diligence
  terminal_states:
    - decision_recorded_go
    - decision_recorded_no_go
  states:

    - name: due_diligence
      description: Cross-tenant NDA channel active; documents exchanged; preliminary analysis
      sla_max_duration: indefinite (until board target -2 weeks)
      entry_audit: EVT-J166-WORKSPACE-OPEN-000
      cedar_permits_required:
        - governance.m_and_a_workspace_open
        - connect.cross_tenant_nda_channel_send
        - connect.cross_tenant_nda_channel_receive
      invariants:
        - nda_active_throughout
        - cross_tenant_payload_class_in_whitelist
        - cross_tenant_pii_scan_zero_hits
        - cross_tenant_e2ee_envelope_intact
      transitions:
        - to: financial_model
          on: financial_planning.m_a_model_compute
          guard: cso_passkey_present

    - name: financial_model
      description: M&A model computed at 3 price points; CFO sign-off pending
      sla_max_duration: 5 business days
      entry_audit: EVT-J166-M-A-MODEL-COMPUTED-003
      cedar_permits_required:
        - financial_planning.m_a_model_compute
        - governance.cfo_signoff_m_and_a
      invariants:
        - three_price_points_computed
        - irr_at_each_price_computed
        - threshold_evaluation_completed
      transitions:
        - to: ml_scenarios
          on: intelligence.scenario_modeling
          guard: financial_model_complete

    - name: ml_scenarios
      description: ML Monte-Carlo + cohort churn + integration cost forecast
      sla_max_duration: 2 business days
      entry_audit: EVT-J166-ML-SCENARIOS-004
      cedar_permits_required:
        - intelligence.scenario_modeling
      invariants:
        - eu_ai_act_article_50_declaration_present
        - ml_model_provenance_declared
        - deterministic_seed_provided
        - monte_carlo_10k_iterations
        - cohort_churn_5_year_horizon
        - integration_cost_95_ci_present
        - reproducibility_invariant_byte_equal
      transitions:
        - to: counsel_review
          on: compliance.pack_manifest_cross_check
          guard: ml_scenarios_complete AND pack_cross_check_complete AND merger_filings_complete

    - name: counsel_review
      description: General Counsel reviews + redlines + deal-term clarification
      sla_max_duration: 2 business days
      entry_audit: EVT-J166-COUNSEL-REVIEW-007
      cedar_permits_required:
        - governance.counsel_review_m_and_a
        - governance.counsel_redline_submit
      invariants:
        - counsel_passkey_asserted
        - redlines_documented_with_subject
      transitions:
        - to: committee_endorsement
          on: governance.committee_endorsement_submit
          guard: counsel_review_complete AND cfo_signoff_present

    - name: committee_endorsement
      description: Strategy committee + Audit committee endorse
      sla_max_duration: 2 business days
      entry_audit: EVT-J166-COMMITTEE-ENDORSEMENT-009
      cedar_permits_required:
        - governance.committee_endorsement_submit
      invariants:
        - strategy_committee_endorsement_threshold_4_of_5
        - audit_committee_endorsement_threshold_3_of_5
        - each_endorser_passkey_asserted
        - reservations_documented
      transitions:
        - to: board_resolution
          on: governance.acquisition_go_no_go_vote
          guard: both_committees_endorsed

    - name: board_resolution
      description: Board convenes + go/no-go vote
      sla_max_duration: 1 business day
      entry_audit: EVT-J166-BOARD-VOTE-010
      cedar_permits_required:
        - governance.acquisition_go_no_go_vote
      cedar_guard_chain:
        - audit_committee_endorsement_present
        - strategy_committee_endorsement_present
        - counsel_review_present
        - financial_model_signoff_cfo_present
        - ml_scenarios_provenance_preserved
        - pack_manifest_cross_check_no_blocker
        - merger_filings_path_clear
        - each_board_member_passkey_asserted
      invariants:
        - 9_board_members_voted
        - majority_threshold_5_of_9
        - each_vote_passkey_asserted
        - result_GO_or_NO_GO_recorded
      transitions:
        - to: decision_recorded_go
          on: audit-chain.m_a_decision_anchor
          guard: result_GO AND super_merkle_root_present
        - to: decision_recorded_no_go
          on: audit-chain.m_a_decision_anchor
          guard: result_NO_GO AND super_merkle_root_present

    - name: decision_recorded_go
      description: Terminal GO; bundle archived to drive WORM; super-Merkle externally anchored
      entry_audit: EVT-J166-DECISION-RECORDED-011
      invariants:
        - drive_worm_engaged
        - retention_until_2034_05_25
        - super_merkle_root_externally_anchored
        - nda_bound_diligence_docs_excluded_from_bundle
        - signing_target_set
      transitions: []

    - name: decision_recorded_no_go
      description: Terminal NO-GO; decision archived; return-or-destroy obligation activated
      entry_audit: EVT-J166-DECISION-RECORDED-011-no-go
      invariants:
        - drive_worm_engaged
        - return_or_destroy_obligation_activated
        - mrt_evidence_30_60_day_destruction_scheduled
      transitions: []

  # ============================================================
  # Failure transitions
  # ============================================================

  failure_transitions:

    - from: due_diligence
      to: due_diligence (paused)
      on: nda_expired_or_terminated
      remediation: pause_channel + require_nda_renewal_or_terminate_deal

    - from: due_diligence
      to: due_diligence (retry)
      on: cross_tenant_payload_pii_detected
      remediation: deny + surface_to_sender_for_re_submission

    - from: ml_scenarios
      to: ml_scenarios (retry)
      on: ml_reproducibility_failure
      remediation: investigate_model_determinism + recompute + block_advancement_until_passed

    - from: counsel_review
      to: financial_model
      on: counsel_declines_to_sign
      remediation: redraft + re-submit_model_with_counsel_redlines_resolved

    - from: committee_endorsement
      to: board_resolution_blocked
      on: committee_threshold_not_reached
      remediation: escalate + chair_judgement + reschedule

    - from: board_resolution
      to: decision_recorded_no_go
      on: majority_threshold_not_reached
      audit: EVT-J166-BOARD-VOTE-NO-GO

  # ============================================================
  # SLA summary
  # ============================================================

  sla_summary:
    due_diligence_max: indefinite (until board target -2 weeks)
    financial_model_max: 5 business days
    ml_scenarios_max: 2 business days
    counsel_review_max: 2 business days
    committee_endorsement_max: 2 business days
    board_resolution_max: 1 business day
    total_journey_max: 9 business days

  # ============================================================
  # Cedar deny coverage
  # ============================================================

  cedar_deny_coverage:
    - diligence_response_with_pii: EVT-J166-CEDAR-DENY-NDA-PAYLOAD-PII-Δ010
    - non_nda_bound_cross_tenant_flow: EVT-J166-CEDAR-DENY-NON-NDA-FLOW-Δ011
    - board_vote_without_cfo_signoff: EVT-J166-CEDAR-DENY-VOTE-NO-CFO-Δ012
    - non_board_member_attempts_vote: EVT-J166-CEDAR-DENY-NON-BOARD-VOTE-Δ013
    - nda_channel_after_expiry: EVT-J166-CEDAR-DENY-NDA-EXPIRED-Δ014
    - nda_bound_doc_included_in_bundle: EVT-J166-CEDAR-DENY-NDA-DOC-IN-BUNDLE-Δ015
    - cross_region_evidence_material_transfer: EVT-J166-CEDAR-DENY-EVIDENCE-CROSS-REGION-Δ016

  # ============================================================
  # Cross-tenant NDA channel discipline
  # ============================================================

  nda_channel_discipline:
    channel_id: cross-tenant-channel-skylark-mrt-2027-q2
    nda_record_id: nda-skylark-mrt-2027-03-08
    nda_expires: 2027-12-31
    return_or_destroy_obligation_days_post_terminate: 30
    allowed_payload_classes:
      - diligence_request
      - diligence_response_anonymized
      - diligence_response_named
      - valuation_clarification
      - regulatory_filing_input
      - executive_meeting_logistics
    payload_max_size_bytes: 52428800  # 50 MB
    e2ee_required: true
    pii_scan_required: true
    financial_value_scan_required: true (except payload_class=valuation_clarification)
    sender_authorization_required: true

  # ============================================================
  # ML reproducibility contract
  # ============================================================

  ml_reproducibility_contract:
    deterministic_seed_required: true
    byte_equal_across_runs_required: true
    monte_carlo_iterations_min: 10000
    cohort_churn_horizon_years_min: 5
    integration_cost_ci_required: 95_percent
    eu_ai_act_article_50_declaration_required: true
