syntax = "proto3";

package oya.journey.j167.cutover.v1;

option go_package = "github.com/oyatie/oya/journey/j167/cutover/v1;cutoverv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// j167 — proto3 messages for Aurelia Platform v3.x → v4.0 cutover.
// All string fields are UTF-8 NFC-normalized. Spanish + English diacritics preserved.

// =====================================================================
// CHANGE RECORD
// =====================================================================

enum CutoverState {
  CUTOVER_STATE_UNSPECIFIED = 0;
  PRE_REVIEW = 1;
  COHORT_A_INITIATING = 2;
  COHORT_A_STABLE = 3;
  COHORT_B_INITIATING = 4;
  COHORT_B_STABLE = 5;
  COHORT_C_INITIATING = 6;
  COHORT_C_STABLE = 7;
  COHORT_D_INITIATING = 8;
  COHORT_D_STABLE = 9;
  STABILIZATION = 10;
  V3_SUNSET_COMPLETE = 11;
  CLOSED = 12;
}

message ChangeRecord {
  string change_id = 1;                              // CHG-V4-CUTOVER-2026-10-20
  string title = 2;                                  // "Cutover Aurelia Platform v3.x → v4.0"
  CutoverState state = 3;
  string tenant = 4;                                 // aurelia-robotics-internacional-sa-de-cv-mx
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp closed_at = 6;
  string cra_signature_principal = 7;                // yamilet.solis@...
  repeated QuorumVote cab_signoff_quorum = 8;
  string merkle_root_hash = 9;                       // sha384-...
  string audit_seal = 10;
}

// =====================================================================
// QUORUM VOTE
// =====================================================================

enum VoteDecision {
  VOTE_DECISION_UNSPECIFIED = 0;
  PERMIT = 1;
  DENY = 2;
  ABSTAIN = 3;
  NO_ROLLBACK = 4;
  ROLLBACK_NOW = 5;
  ROLLBACK_AFTER_HOTFIX = 6;
}

message QuorumVote {
  string vote_id = 1;
  string voter_principal = 2;                        // diego.vargas@...
  VoteDecision decision = 3;
  google.protobuf.Timestamp voted_at = 4;
  string rationale_es_MX = 5;                        // Spanish rationale (diacritic-preserving)
  string rationale_en_US = 6;                        // English rationale
  bytes voter_passkey_attestation = 7;               // WebAuthn assertion
  string voter_face_id_template_hash = 8;            // (optional, iOS-only)
  double truetime_uncertainty_ms = 9;                // TrueTime fence at vote time
}

// =====================================================================
// COHORT GATE
// =====================================================================

enum CohortLabel {
  COHORT_LABEL_UNSPECIFIED = 0;
  COHORT_A = 1;  // 1% canary
  COHORT_B = 2;  // 10%
  COHORT_C = 3;  // 50%
  COHORT_D = 4;  // 100%
}

message CohortGate {
  string gate_id = 1;
  CohortLabel target_cohort = 2;
  double traffic_percentage = 3;
  repeated string cell_scope = 4;                    // [aws-cdmx-cell-tier-1-primary, ...]
  uint32 quorum_required = 5;                        // typically 4
  uint32 quorum_count_collected = 6;
  bool previous_cohort_slo_green = 7;
  bool cra_document_signed = 8;
  google.protobuf.Timestamp opens_at = 9;
  google.protobuf.Timestamp closes_at = 10;
  string audit_seal = 11;
  repeated string dual_seal_tenants = 12;
}

// =====================================================================
// TERRAFORM APPLY
// =====================================================================

enum CellApplyStatus {
  CELL_APPLY_STATUS_UNSPECIFIED = 0;
  QUEUED = 1;
  APPLYING = 2;
  APPLIED = 3;
  FAILED = 4;
}

enum ApplyStrategy {
  APPLY_STRATEGY_UNSPECIFIED = 0;
  PARALLEL = 1;
  SERIAL_WITH_CHECKPOINT = 2;
  BLUE_GREEN = 3;
}

message TerraformApply {
  string apply_id = 1;
  string module = 2;                                 // aurelia-platform-v4
  string version = 3;                                // 4.0.0
  repeated string targets = 4;
  ApplyStrategy strategy = 5;
  uint32 checkpoint_interval_seconds = 6;
  bool rollback_on_failure = 7;
  string triggered_by_change_record = 8;
  string triggered_by_cohort_permit_seal = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp estimated_complete_at = 11;
  map<string, CellApplyState> per_cell_state = 12;
  string audit_seal = 13;
}

message CellApplyState {
  CellApplyStatus state = 1;
  double progress_pct = 2;
  string last_resource = 3;
  string error_code = 4;                             // e.g., AWS_API_ERROR_THROTTLE
  google.protobuf.Timestamp completed_at = 5;
}

// =====================================================================
// FEATURE FLAG RULE
// =====================================================================

enum TrafficSplitType {
  TRAFFIC_SPLIT_TYPE_UNSPECIFIED = 0;
  PERCENTAGE = 1;
  EXPLICIT_LIST = 2;
  HASH_BUCKETED = 3;
}

message TrafficSplitRule {
  string rule_id = 1;
  string flag_id = 2;                                // aurelia-fleet-coordinator-version
  bool active = 3;
  string target_version = 4;                         // 4.0.0
  string fallback_version = 5;                       // 3.x
  TrafficSplitType split_type = 6;
  double percentage = 7;
  repeated string cell_scope = 8;
  google.protobuf.Timestamp effective_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  string rationale = 11;
  string audit_seal = 12;
}

message TenantOverride {
  string flag_id = 1;
  string tenant_id = 2;                              // cotrijal-coop-rs-br
  string pinned_version = 3;                         // 3.x
  google.protobuf.Timestamp expires_at = 4;
  string hotfix_ticket_id = 5;
  string approver_principal = 6;
  string audit_seal = 7;
}

// =====================================================================
// SLO BURN RATE + ALARM
// =====================================================================

enum SeverityLevel {
  SEVERITY_LEVEL_UNSPECIFIED = 0;
  SEV_1 = 1;
  SEV_2 = 2;
  SEV_3 = 3;
  SEV_4 = 4;
  CANARY_SPIKE_CANDIDATE = 5;
}

message SLOBurnRate {
  string slo_id = 1;
  string cell = 2;
  uint32 window_minutes = 3;
  double baseline_p99_ms = 4;
  double current_p99_ms = 5;
  double delta_pct = 6;
  double threshold_p99_ms = 7;
  bool regression_detected = 8;
  google.protobuf.Timestamp first_breach_at = 9;
  uint32 sustained_minutes = 10;
  double error_budget_burn_rate = 11;
  string audit_seal = 12;
}

message Alarm {
  string alarm_id = 1;
  SeverityLevel severity = 2;
  string slo_id = 3;
  string cell = 4;
  google.protobuf.Timestamp triggered_at = 5;
  repeated string paged_principals = 6;
  string war_room_channel = 7;                       // #cutover-v4-warroom
  string audit_seal = 8;
}

// =====================================================================
// INCIDENT + ROLLBACK
// =====================================================================

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INVESTIGATING = 1;
  MITIGATING = 2;
  MONITORING = 3;
  RECOVERING = 4;
  RESOLVED = 5;
  POST_MORTEM_PENDING = 6;
  CLOSED = 7;
}

message Incident {
  string incident_id = 1;
  SeverityLevel severity = 2;
  IncidentStatus status = 3;
  string root_cause = 4;
  google.protobuf.Timestamp opened_at = 5;
  google.protobuf.Timestamp resolved_at = 6;
  repeated QuorumVote rollback_decision_votes = 7;
  string final_rollback_decision = 8;                // "NO_ROLLBACK"
  string post_mortem_url = 9;
  string audit_seal = 10;
}

// =====================================================================
// SUNSET + ATTESTATION
// =====================================================================

message SunsetEvent {
  string change_record_id = 1;
  string flag_id = 2;                                // v3_api_enabled
  bool new_value = 3;
  google.protobuf.Timestamp effective_at = 4;
  repeated LegacyShutdownTrigger shutdowns = 5;
  string merkle_root = 6;
  string audit_seal = 7;
}

message LegacyShutdownTrigger {
  string system_name = 1;                            // aurelia-fleetsync-v3-daemon
  google.protobuf.Timestamp shutdown_at = 2;
  bool graceful = 3;
}

message AttestationSubmission {
  string attestation_id = 1;
  string attestation_type = 2;                       // iso-27001-a-12-1-2 | soc2-cc8-1 | eu-ai-act-art-17-notification | mx-nom-151
  string change_record_id = 3;
  string evidence_merkle_root = 4;
  string signer_principal = 5;                       // diego.vargas@...
  string qes_provider = 6;                           // sat-mx-FIEL
  google.protobuf.Timestamp signed_at = 7;
  string target_auditor_tenant = 8;                  // pwc-mexico-soc2-auditor-tenant
  string audit_seal = 9;
}

// =====================================================================
// CROSS-TENANT MESSAGES (MLS-encrypted per RFC 9420)
// =====================================================================

message CustomerSitRep {
  string sitrep_id = 1;
  string sender_principal = 2;
  string target_customer_tenant = 3;
  string incident_id = 4;
  string subject = 5;
  string body_locale = 6;                            // en-US | es-MX | pt-BR
  string body_text = 7;
  google.protobuf.Timestamp sent_at = 8;
  bytes mls_ciphertext = 9;
  string audit_seal = 10;
}
