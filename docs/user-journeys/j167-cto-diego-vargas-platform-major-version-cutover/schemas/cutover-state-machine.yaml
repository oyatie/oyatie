---
# j167 — Cutover state machine (11 states + 1 closed)
# Implements ADR-0110 (changeset state machine) and ADR-0111 (rollback edges).

state_machine_id: j167-cutover-v4
authority_tier: 2
substrate: governance-changeset

states:
  - id: pre_review
    description: Change record created; CRA + CAB sign-off in progress
    entry_actions: [publish_readiness_checklist, notify_quorum_members]
    exit_actions: [seal_pre_review_complete]

  - id: cohort_a_initiating
    description: Cohort A permit granted; Terraform apply + flag flip in progress
    entry_actions: [trigger_terraform_apply_cohort_a, schedule_feature_flag_flip_cohort_a]
    exit_actions: [seal_cohort_a_live]

  - id: cohort_a_stable
    description: Cohort A 1% live for ≥ 24 hours with green SLO
    entry_actions: [start_24h_stability_clock]
    exit_conditions: [slo_green_24h_sustained]

  - id: cohort_b_initiating
    description: Cohort B permit granted; 10% rollout to 12 cells
    entry_actions: [trigger_terraform_apply_cohort_b, schedule_feature_flag_flip_cohort_b]
    exit_actions: [seal_cohort_b_live]

  - id: cohort_b_stable
    description: Cohort B 10% live for ≥ 48 hours with green SLO
    entry_actions: [start_48h_stability_clock]

  - id: cohort_c_initiating
    description: Cohort C permit granted; 50% rollout to 24 cells
    entry_actions: [trigger_terraform_apply_cohort_c, schedule_feature_flag_flip_cohort_c]
    exit_actions: [seal_cohort_c_live]

  - id: cohort_c_stable
    description: Cohort C 50% live for ≥ 96 hours with green SLO
    entry_actions: [start_96h_stability_clock]

  - id: cohort_d_initiating
    description: Cohort D permit granted; 100% rollout to all 47 cells
    entry_actions: [trigger_terraform_apply_cohort_d, schedule_feature_flag_flip_cohort_d]
    exit_actions: [seal_cohort_d_live]

  - id: cohort_d_stable
    description: Cohort D 100% live for ≥ 72 hours with green SLO; v3 residual ≤ 0.5%
    entry_actions: [start_72h_stability_clock, drain_v3_residual_customers]

  - id: stabilization
    description: Final stabilization period; v3 residual drops to < 0.1%
    entry_actions: [outreach_to_remaining_v3_customers]
    exit_conditions: [v3_residual_lt_0_1_pct, cohort_d_stable_72h_sustained]

  - id: v3_sunset_complete
    description: v3.x hard sunset complete; legacy systems shutdown
    entry_actions: [flip_v3_api_enabled_false, shutdown_aurelia_fleetsync_v3, shutdown_aurelia_gatewaybridge_v3, shutdown_aurelia_contractadapter_v3, compute_change_record_merkle_root]
    exit_actions: [trigger_compliance_attestations, close_change_record]

  - id: closed
    description: Change record archived; all attestations submitted; post-mortem published
    terminal: true

transitions:
  - from: pre_review
    to: cohort_a_initiating
    trigger: cohort_a_permit_quorum_reached
    cedar_policy: governance.cohort_transition_vote
    audit_class: EVT-J167-COHORT-A-PERMIT-002

  - from: cohort_a_initiating
    to: cohort_a_stable
    trigger: cohort_a_24h_stable
    cedar_policy: (none; auto-transition on timer)
    audit_class: EVT-J167-COHORT-A-STABLE-003e

  - from: cohort_a_stable
    to: cohort_b_initiating
    trigger: cohort_b_permit_quorum_reached
    cedar_policy: governance.cohort_transition_vote
    audit_class: EVT-J167-COHORT-B-PERMIT-006

  - from: cohort_b_initiating
    to: cohort_b_stable
    trigger: cohort_b_48h_stable
    audit_class: EVT-J167-COHORT-B-STABLE-006a

  - from: cohort_b_stable
    to: cohort_c_initiating
    trigger: cohort_c_permit_quorum_reached
    cedar_policy: governance.cohort_transition_vote
    audit_class: EVT-J167-COHORT-C-PERMIT-007

  - from: cohort_c_initiating
    to: cohort_c_stable
    trigger: cohort_c_96h_stable
    audit_class: EVT-J167-COHORT-C-STABLE-007a

  - from: cohort_c_stable
    to: cohort_d_initiating
    trigger: cohort_d_permit_quorum_reached
    cedar_policy: governance.cohort_transition_vote
    audit_class: EVT-J167-COHORT-D-PERMIT-009

  - from: cohort_d_initiating
    to: cohort_d_stable
    trigger: cohort_d_72h_stable
    audit_class: EVT-J167-COHORT-D-STABLE-009a

  - from: cohort_d_stable
    to: stabilization
    trigger: v3_residual_lt_0_5_pct
    audit_class: EVT-J167-STABILIZATION-START-009b

  - from: stabilization
    to: v3_sunset_complete
    trigger: scheduled_sunset_time_reached + cedar_permit_sunset
    cedar_policy: feature-flags.sunset_legacy_version
    audit_class: EVT-J167-V3-SUNSET-010

  - from: v3_sunset_complete
    to: closed
    trigger: all_attestations_acknowledged
    audit_class: EVT-J167-CHANGE-RECORD-CLOSED-013

rollback_edges:
  - from: cohort_a_initiating
    to: pre_review
    trigger: cohort_a_rollback_quorum_3_of_4
    cedar_policy: governance.cohort_rollback
    window_minutes: 240

  - from: cohort_a_stable
    to: pre_review
    trigger: post_a_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_b_initiating
    to: cohort_a_stable
    trigger: cohort_b_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_b_stable
    to: cohort_a_stable
    trigger: post_b_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_c_initiating
    to: cohort_b_stable
    trigger: cohort_c_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_c_stable
    to: cohort_b_stable
    trigger: post_c_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_d_initiating
    to: cohort_c_stable
    trigger: cohort_d_rollback_quorum_3_of_4
    window_minutes: 240

  - from: cohort_d_stable
    to: cohort_c_stable
    trigger: post_d_rollback_quorum_3_of_4
    window_minutes: 240

  - from: stabilization
    to: cohort_d_stable
    trigger: stabilization_rollback_quorum_3_of_4
    window_minutes: 240

invariants:
  - every_state_transition_dual_seals_in_two_tenants
  - every_cedar_permit_uses_truetime_fence_le_10ms
  - rollback_edges_locked_after_4h_window
  - no_skip_states_forward (e.g., cannot skip from cohort_a_stable to cohort_c_initiating without going through cohort_b)
  - no_skip_states_backward_except_via_rollback_edge
  - closed_is_terminal_no_outgoing_edges
