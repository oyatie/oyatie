// j159 — Saanvi Mehta dual-tenant MBA application RPC messages
// proto3, package versioned per ADR-0244 tenant scoping
// Diacritic + Devanagari preservation: ALL string fields are UTF-8 NFC; no transliteration.
// Cross-tenant audit dual-seal mandatory under ADR-0263.
// Personal-vs-work boundary keystone: ADR-0311.

syntax = "proto3";

package oya.journeys.j159.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common ----------

message Principal {
  string subject_id = 1;          // UTF-8 NFC; e.g. saanvi.mehta.personal:saanvi
  string home_tenant = 2;
  string acting_tenant = 3;
  enum TenantClass {
    PERSONAL_TENANT = 0;
    WORK_TENANT = 1;
    COMMUNITY_TENANT = 2;
    ADMISSIONS_TENANT = 3;
    HR_TENANT = 4;
  }
  TenantClass tenant_class = 4;
  string passkey_assertion_b64 = 5;
  repeated string roles_in_acting_tenant = 6;
  bool is_authentic_dual_tenant_match = 7; // true only when principal is the same human across both tenants
}

message TenantContext {
  string tenant_id = 1;
  string cell = 2;                // e.g. ap-mumbai-primary
  string trace_id = 3;
  string locale = 4;              // e.g. en-IN, hi-IN, mr-IN
}

message AuditAnchor {
  string event_class = 1;
  google.protobuf.Timestamp hlc_ts = 2;
  uint64 hlc_logical = 3;
  string merkle_leaf_b64 = 4;
  bool dual_seal_complete = 5;
  repeated string sealing_tenants = 6;
}

message DiacriticPolicy {
  string unicode_normalization = 1;  // MUST be "NFC"
  bool diacritics_preserved = 2;     // MUST be true
  bool devanagari_canonical = 3;     // true when Devanagari composition preserved
  bool transliterate_to_ascii = 4;   // forbidden unless user_explicit_consent_to_transliterate
  bool user_explicit_consent_to_transliterate = 5;
}

// ---------- §1 Essay finalize ----------

message NotesDocumentFinalizeRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string doc_id = 3;
  uint32 word_count = 4;
  uint32 word_count_max = 5;
  DiacriticPolicy diacritic_policy = 6;
  google.protobuf.Timestamp finalized_at = 7;
  string destination_drive_path = 8;
}

message NotesDocumentFinalizeResponse {
  string doc_version_id = 1;
  string drive_path_resolved = 2;
  AuditAnchor audit = 3;
}

// ---------- §2 Capability grant + accept + revoke ----------

message CapabilityGrantRequest {
  Principal granting_principal = 1;
  string granting_tenant = 2;
  string grantee_principal_id = 3;
  string grantee_tenant = 4;
  enum CapabilityClass {
    SPOUSAL_READ_ONLY_FOLDER = 0;
    RECOMMENDATION_LETTER_WRITE_ONCE = 1;
    ADMISSIONS_APPLICATION_ACK = 2;
  }
  CapabilityClass capability_class = 5;
  string scope_drive_path = 6;
  repeated string scope_actions = 7;
  repeated string scope_actions_forbidden = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp auto_revoke_at = 10;
  string relationship_basis = 11;
}

message CapabilityGrantResponse {
  string capability_id = 1;
  bool dual_sealed = 2;
  AuditAnchor audit = 3;
}

message CapabilityAcceptRequest {
  Principal accepting_principal = 1;
  string target_tenant = 2;
  string target_slot_id = 3;
  string capability_id = 4;
  string accept_basis = 5;
  google.protobuf.Timestamp accepted_at = 6;
}

message CapabilityRevokeRequest {
  Principal revoking_principal = 1;
  string capability_id = 2;
  google.protobuf.Timestamp revoked_at = 3;
  string reason = 4;
}

// ---------- §3 Recommender letter slot ----------

message RecommendationLetterSlotAppendRequest {
  Principal principal = 1;
  string principal_tenant = 2;
  string target_tenant = 3;
  string slot_id = 4;
  string capability_id = 5;
  bytes draft_text_b64 = 6;
  bool is_final_submit = 7;
  uint32 revision_number = 8;
  DiacriticPolicy diacritic_policy = 9;
}

message RecommendationLetterSlotFinalSubmitRequest {
  Principal principal = 1;
  string slot_id = 2;
  string capability_id = 3;
  bytes final_text_b64 = 4;
  bool is_final_submit = 5;
  google.protobuf.Timestamp submitted_at = 6;
  string passkey_assertion_b64 = 7;
}

// ---------- §4 Personal-tenant payment ----------

message Money {
  string currency = 1;            // ISO 4217
  int64 minor_units = 2;
}

message PaymentAuthorizeRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  Money amount = 3;
  string settlement_currency = 4;
  string merchant = 5;
  string credential_id = 6;
  enum CredentialClass {
    PERSONAL_CARD_BYOK = 0;
    CORPORATE_CARD = 1;
    PERSONAL_UPI = 2;
    PERSONAL_BANK_ACH = 3;
  }
  CredentialClass credential_class = 7;
  string credential_tenant = 8;
  message PaymentContext {
    bool personal_tenant_payment = 1;
    bool corporate_card_routing_attempted = 2;
    string user_explicit_residency_override = 3;
  }
  PaymentContext payment_context = 9;
  google.protobuf.Timestamp initiated_at = 10;
}

message PaymentAuthorizeResponse {
  string auth_id = 1;
  enum AuthStatus {
    AUTHORIZED = 0;
    AUTH_3DS_REQUIRED = 1;
    AUTH_FAILED = 2;
    AUTH_FORBIDDEN_BY_CEDAR = 3;
    AUTH_SETTLED_T_PLUS_1 = 4;
  }
  AuthStatus status = 2;
  string three_ds_method = 3;     // e.g. sms_otp_hdfc
  google.protobuf.Timestamp settlement_date = 4;
  AuditAnchor audit = 5;
}

message PaymentAuthorize3DSConfirmRequest {
  string auth_id = 1;
  string otp = 2;                 // 6-digit numeric for HDFC SMS
  google.protobuf.Timestamp confirmed_at = 3;
}

// ---------- §5 Community participation ----------

message CommunityPostRequest {
  Principal principal = 1;
  string principal_tenant_origin = 2;
  string community_tenant = 3;
  string group_id = 4;
  enum PostType {
    QUESTION = 0;
    REPLY = 1;
    ANNOUNCEMENT = 2;
    POLL = 3;
  }
  PostType post_type = 5;
  bytes post_body_ciphertext_b64 = 6;
  uint64 mls_epoch_at_post = 7;
  google.protobuf.Timestamp posted_at = 8;
  repeated string tags = 9;
}

// ---------- §6 GMAT score-send ----------

message GmatScoreSendRequest {
  Principal principal = 1;
  string credential_class = 2;    // gmat_focus_score_official
  string test_date = 3;           // YYYY-MM-DD
  uint32 score_total = 4;         // e.g. 745
  message ScoreBreakdown {
    uint32 quant = 1;
    uint32 verbal = 2;
    uint32 data_insights = 3;
  }
  ScoreBreakdown score_breakdown = 5;
  repeated string send_to_schools = 6;
  double send_fee_paid_to_gmac = 7;
  google.protobuf.Timestamp sent_at = 8;
  DiacriticPolicy diacritic_policy = 9;
  string passport_ascii_name = 10;  // ICAO 9303 exception for GMAT
}

// ---------- §7 MBA application submit ----------

message MbaApplicationSubmitRequest {
  string instance_id = 1;
  enum School {
    WHARTON = 0;
    STANFORD_GSB = 1;
    HBS = 2;
    CHICAGO_BOOTH = 3;
    INSEAD_SG_FR = 4;
  }
  School school = 2;
  google.protobuf.Timestamp submitted_at = 3;
  string essay_doc_ref = 4;
  repeated string recommender_final_refs = 5;
  string gmat_score_send_ref = 6;
  string fee_payment_ref = 7;
  repeated string transcripts_ref = 8;
  DiacriticPolicy diacritic_policy = 9;
}

// ---------- §8 HR audit sweep (negative path) ----------

message HrSweepWalkRequest {
  Principal principal = 1;        // hr-systems@stripe-corporate-us
  string sweep_id = 2;
  string target_tenant = 3;
  repeated string target_user_set = 4;
  string sweep_scope = 5;         // work_tenant_drive_only
  google.protobuf.Timestamp executed_at = 6;
}

message HrSweepWalkResponse {
  uint32 documents_walked = 1;
  uint32 anomalies_detected = 2;
  uint32 mba_references_found = 3;
  uint32 wharton_references_found = 4;
  uint32 personal_tenant_references_found = 5;
  string result = 6;              // clean | anomalies_detected
  AuditAnchor audit = 7;
}

message DiscoveryWalkAllPrincipalArtifactsRequest {
  Principal principal = 1;
  string target_principal_human = 2;
  string scope = 3;               // all_tenants_this_human_is_in
  google.protobuf.Timestamp executed_at = 4;
}

message DiscoveryWalkResponse {
  repeated string discoverable_tenants = 1;
  repeated string non_discoverable_tenants_redacted_class = 2;
  string error = 3;               // personal_tenant_boundary_enforced
  string doctrine_anchor = 4;     // ADR-0311
  AuditAnchor audit = 5;
}

// ---------- §9 Calibration day clean-boundary attestation ----------

message PersonalTenantZeroActivityAttestation {
  string attestation_class = 1;   // personal_tenant_zero_activity_during_work_calibration
  string principal_human = 2;
  string personal_tenant = 3;
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end = 5;
  uint32 activity_events_in_window = 6;
  bool work_tenant_calibration_meeting_concurrent = 7;
  string work_tenant_id = 8;
  AuditAnchor audit = 9;
}

// ---------- §10 Cross-tenant ack ----------

message CrossTenantAckRequest {
  string from_tenant = 1;         // e.g. wharton-mba-admissions-us
  string to_tenant = 2;           // saanvi.mehta.personal
  string ack_class = 3;           // application_submission_received
  string application_id = 4;
  google.protobuf.Timestamp ack_at = 5;
}
