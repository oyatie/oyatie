# j159 — MBA application state machine
# 7-state per-school application lifecycle + 9 valid transitions + Cedar guards.
# Driven by workflow-engine. Each school instance runs its own state machine instance;
# all 5 (Wharton/Stanford/HBS/Booth/INSEAD) progress in parallel for Saanvi.

apiVersion: oya.workflow/v1
kind: StateMachine
metadata:
  name: mba-application-dual-tenant-v1
  workflow_template: wkfl-mba-application-r2-2027-v1
  adr_refs:
    - ADR-0311  # personal-vs-work boundary
    - ADR-0244  # tenant scoping
    - ADR-0263  # audit dual-seal
    - ADR-0252  # HLC + TrueTime for fee-payment fence
    - ADR-0255  # provider-credential BYOK credentials for payment routing, §D-4
  regulator_anchors:
    - AACSB-Standard-9-degree-applicant-records-retention
    - GMAC-GMAT-Focus-score-send-protocol
    - US-FERPA-recommendation-letter-confidentiality
    - EU-GDPR-data-subject-rights
    - IN-DPDP-2023-data-fiduciary
    - UK-DPA-2018

spec:
  # ============================================
  # §1 States (7)
  # ============================================
  states:
    - name: essay_drafting
      description: "Applicant is drafting essays; not yet finalized"
      is_initial: true
      is_terminal: false
      cedar_action_required: notes.document_draft
      audit_class_on_enter: EVT-J159-APP-STATE-ESSAY-DRAFTING-200
      required_context:
        word_count_so_far: present
        target_word_count_max: present

    - name: recommender_invited
      description: "Essays in late draft; recommender invitations sent via Wharton/Stanford/HBS/Booth/INSEAD portals"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recommender_invite_send
      audit_class_on_enter: EVT-J159-APP-STATE-RECOMMENDER-INVITED-201
      required_context:
        primary_recommender_invited: true
        supplementary_recommender_invited: true

    - name: recommender_letter_received
      description: "All recommenders have final-submitted their letters to slot"
      is_initial: false
      is_terminal: false
      cedar_action_required: workflow.recommender_complete_check
      audit_class_on_enter: EVT-J159-APP-STATE-RECOMMENDER-RECEIVED-202
      required_context:
        primary_recommender_final_received: true
        supplementary_recommender_final_received: true

    - name: fee_paid
      description: "Application fee paid via personal-tenant provider-credential BYOK credential (ADR-0255 §D-4)"
      is_initial: false
      is_terminal: false
      cedar_action_required: payments.authorize
      audit_class_on_enter: EVT-J159-APP-STATE-FEE-PAID-203
      required_context:
        fee_amount: present
        credential_class: "personal_card_BYOK"
        credential_tenant: "saanvi.mehta.personal"

    - name: submitted
      description: "Application submitted to school portal; awaiting cross-tenant ack"
      is_initial: false
      is_terminal: false
      cedar_action_required: admissions.application_submit
      audit_class_on_enter: EVT-J159-APP-STATE-SUBMITTED-204
      required_context:
        all_required_artifacts_present: true
        gmat_score_sent: true

    - name: ack_received
      description: "School's admissions tenant has dual-sealed cross-tenant ack"
      is_initial: false
      is_terminal: true  # journey-scope terminal; decision_received is out-of-scope
      cedar_action_required: admissions.cross_tenant_ack
      audit_class_on_enter: EVT-J159-APP-STATE-ACK-RECEIVED-205
      required_context:
        ack_dual_sealed: true

    - name: decision_received
      description: "Decision (admit / waitlist / deny) returned by school (OUT OF SCOPE for j159; tracked for completeness)"
      is_initial: false
      is_terminal: true
      cedar_action_required: admissions.decision_emit
      audit_class_on_enter: EVT-J159-APP-STATE-DECISION-OUT-OF-SCOPE-206
      required_context:
        decision_class: present  # admit | waitlist | deny | hold

  # ============================================
  # §2 Valid transitions (9)
  # ============================================
  transitions:
    - from: essay_drafting
      to: recommender_invited
      label: "essays late-draft → invite recommenders"
      preconditions:
        - essays_word_count_per_school_within_limit: true
        - recommender_targets_named: true
      audit_class: EVT-J159-APP-TRANSITION-200-TO-201

    - from: recommender_invited
      to: recommender_letter_received
      label: "all recommenders final-submit"
      preconditions:
        - primary_recommender_final_received: true
        - supplementary_recommender_final_received: true
      audit_class: EVT-J159-APP-TRANSITION-201-TO-202

    - from: recommender_letter_received
      to: fee_paid
      label: "applicant pays fee with personal-tenant provider-credential BYOK (ADR-0255 §D-4)"
      preconditions:
        - payment_credential_class: "personal_card_BYOK"
        - payment_credential_tenant_matches_principal_tenant: true
        - three_ds_confirmed: true
      audit_class: EVT-J159-APP-TRANSITION-202-TO-203

    - from: fee_paid
      to: submitted
      label: "applicant submits application to school"
      preconditions:
        - all_required_refs_present:
            - essay_doc_ref
            - recommender_final_refs (2 minimum)
            - gmat_score_send_ref
            - fee_payment_ref
            - transcripts_ref
      audit_class: EVT-J159-APP-TRANSITION-203-TO-204

    - from: submitted
      to: ack_received
      label: "school dual-seals cross-tenant ack"
      preconditions:
        - ack_dual_sealed: true
        - ack_within_24h: true
      audit_class: EVT-J159-APP-TRANSITION-204-TO-205

    # Optional return-to-drafting if user discovers an error pre-submit
    - from: recommender_letter_received
      to: essay_drafting
      label: "applicant pulls back to revise (rare; warning emitted)"
      preconditions:
        - applicant_explicit_intent: true
        - within_revise_window: true
      audit_class: EVT-J159-APP-TRANSITION-202-TO-200-REVISE

    # Recommender withdrawal handling
    - from: recommender_invited
      to: recommender_invited
      label: "alternate recommender invited after withdrawal (idempotent)"
      preconditions:
        - original_recommender_revoked: true
        - alternate_recommender_invited: true
      audit_class: EVT-J159-APP-TRANSITION-201-TO-201-ALTERNATE

    # Fee-payment failure (e.g. 3DS timeout)
    - from: fee_paid
      to: recommender_letter_received
      label: "fee payment failed; revert and retry"
      preconditions:
        - payment_authorization_failed: true
      audit_class: EVT-J159-APP-TRANSITION-203-TO-202-PAYMENT-FAIL

    # Future decision (out of journey scope)
    - from: ack_received
      to: decision_received
      label: "decision received from school (out of j159 scope)"
      preconditions:
        - decision_received_at: present
        - decision_class: present
      audit_class: EVT-J159-APP-TRANSITION-205-TO-206-DECISION

  # ============================================
  # §3 Forbidden transitions
  # ============================================
  forbidden_transitions:
    - from: essay_drafting
      to: submitted
      forbid_rule_id: forbid-skip-essay-to-submit
      audit_class: EVT-J159-APP-INVALID-TRANSITION-300
      reason: "must complete recommender + fee_paid before submit"

    - from: essay_drafting
      to: ack_received
      forbid_rule_id: forbid-skip-essay-to-ack
      audit_class: EVT-J159-APP-INVALID-TRANSITION-301

    - from: recommender_invited
      to: submitted
      forbid_rule_id: forbid-skip-recommender-to-submit
      audit_class: EVT-J159-APP-INVALID-TRANSITION-302
      reason: "must receive recommender letters AND pay fee before submit"

    - from: recommender_invited
      to: fee_paid
      forbid_rule_id: forbid-skip-recommender-to-fee
      audit_class: EVT-J159-APP-INVALID-TRANSITION-303
      reason: "must receive recommender letters before fee_paid"

    - from: recommender_letter_received
      to: submitted
      forbid_rule_id: forbid-skip-fee
      audit_class: EVT-J159-APP-INVALID-TRANSITION-304
      reason: "must pay fee before submit"

  # ============================================
  # §4 Cedar guards
  # ============================================
  cedar_guards:
    - guard_id: guard-personal-tenant-payment-only
      description: "fee_paid state requires personal_card_BYOK credential class with credential_tenant == principal_tenant"
      applies_to_transitions:
        - recommender_letter_received → fee_paid
      context_required:
        credential_class: "personal_card_BYOK"
        credential_tenant_matches_principal_tenant: true

    - guard_id: guard-cross-tenant-recommender-capability-valid
      description: "recommender_letter_received state requires non-revoked cross-tenant capability for each final-submit"
      applies_to_transitions:
        - recommender_invited → recommender_letter_received
      context_required:
        all_recommender_capabilities_active: true
        all_recommender_capabilities_not_revoked: true

    - guard_id: guard-cross-tenant-ack-dual-sealed
      description: "ack_received requires dual-seal on both applicant tenant and admissions tenant"
      applies_to_transitions:
        - submitted → ack_received
      context_required:
        ack_dual_sealed: true

    - guard_id: guard-diacritic-policy
      description: "All persisted fields must be UTF-8 NFC; Devanagari NFC where applicable"
      applies_globally: true
      context_required:
        unicode_normalization: NFC
        diacritics_preserved: true
        transliterate_to_ascii_unless_consented: forbidden

    - guard_id: guard-personal-tenant-cell-residency
      description: "All personal-tenant artifacts must reside in ap-mumbai-primary unless user-overridden"
      applies_globally: true
      context_required:
        cell: ap-mumbai-primary

  # ============================================
  # §5 Per-school instance configuration
  # ============================================
  per_school_instances:
    - school: wharton
      tenant: wharton-mba-admissions-us
      cell_residency: us-east-virginia-secondary
      deadline_r2: 2027-01-05T23:59:59-05:00
      fee_usd: 275
      recommender_slots_required: 2
      essay_word_count_total: 1300
      decision_window: 2027-03-26

    - school: stanford_gsb
      tenant: stanford-gsb-admissions-us
      cell_residency: us-east-virginia-secondary
      deadline_r2: 2027-01-06T23:59:59-05:00
      fee_usd: 275
      recommender_slots_required: 2
      essay_word_count_total: 1150
      decision_window: 2027-04-02

    - school: hbs
      tenant: hbs-admissions-us
      cell_residency: us-east-virginia-secondary
      deadline_r2: 2027-01-04T23:59:59-05:00
      fee_usd: 250
      recommender_slots_required: 2
      essay_word_count_total: 900
      decision_window: 2027-03-25

    - school: chicago_booth
      tenant: chicago-booth-admissions-us
      cell_residency: us-east-virginia-secondary
      deadline_r2: 2027-01-05T23:59:59-06:00  # Central time
      fee_usd: 275
      recommender_slots_required: 2
      essay_word_count_total: 1000
      decision_window: 2027-03-25

    - school: insead_sg_fr
      tenant: insead-singapore-fontainebleau
      cell_residency_multi:
        - sg-singapore-secondary
        - eu-paris-tertiary
      deadline_r2: 2027-01-12T23:59:59+01:00
      fee_usd: 250
      recommender_slots_required: 2
      essay_word_count_total: 1200
      decision_window: 2027-03-19

  # ============================================
  # §6 Audit policy
  # ============================================
  audit_policy:
    dual_seal_required: true
    tenants_per_seal_event:
      - saanvi.mehta.personal
      - <school admissions tenant>
    retention_years: 15  # AACSB Standard 9
    merkle_anchor: per-transition
    aacsb_compatible: true
    ferpa_compatible: true
    gdpr_compatible: true
    dpdp_compatible: true
