// j172 — Helios Industries AGM proto3 message definitions
// ADR-0243 + ADR-0244 + ADR-0251 + ADR-0252 + ADR-0253 + ADR-0254 + ADR-0263

syntax = "proto3";

package oyatie.user_journeys.j172.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================
// Enums
// ============================================================

enum AGMState {
  AGM_STATE_UNSPECIFIED = 0;
  PRE_MEETING = 1;
  NOTICE_PERIOD = 2;
  MEETING_OPEN = 3;
  PRESENTATIONS = 4;
  VOTING_OPEN = 5;
  Q_AND_A = 6;
  TALLY_CERTIFICATION = 7;
  POST_MEETING_FILINGS = 8;
  ARCHIVE = 9;
}

enum ShareClass {
  SHARE_CLASS_UNSPECIFIED = 0;
  COMMON_A = 1;
  COMMON_B_FOUNDER = 2;
}

enum ProposalType {
  PROPOSAL_TYPE_UNSPECIFIED = 0;
  DIVIDEND_DECLARATION = 1;
  DIRECTOR_REELECTION = 2;
  DIRECTOR_NEW_ELECTION = 3;
  AUDITOR_RATIFICATION = 4;
  SHAREHOLDER_PROPOSAL = 5;
}

enum LanguageCode {
  LANGUAGE_CODE_UNSPECIFIED = 0;
  EN_US = 1;
  EN_UK = 2;
  ZH_HANS = 3;
  KO_KR = 4;
  JA_JP = 5;
}

enum InterpretationMode {
  INTERPRETATION_MODE_UNSPECIFIED = 0;
  AUTO_ONLY = 1;
  SIMULTANEOUS = 2;
  CONSECUTIVE = 3;
}

enum ProofClass {
  PROOF_CLASS_UNSPECIFIED = 0;
  INCLUSION_PROOF = 1;
}

enum ArtifactClass {
  ARTIFACT_CLASS_UNSPECIFIED = 0;
  RECORDING = 1;
  SLIDE_DECK = 2;
  TRANSCRIPT = 3;
  PREPARED_REMARKS = 4;
  VOTE_TALLY_RECORD = 5;
  DUAL_SIGN_ATTESTATION = 6;
  MERKLE_ANCHOR_BUNDLE = 7;
}

enum ShareholderClass {
  SHAREHOLDER_CLASS_UNSPECIFIED = 0;
  INSTITUTIONAL = 1;
  RETAIL_DIRECT_REGISTERED = 2;
  RETAIL_BENEFICIAL_VIA_BROKER = 3;
  PROXY_ADVISOR = 4;
  PRESS = 5;
}

// ============================================================
// Common types
// ============================================================

message PrincipalRef {
  string principal_id = 1;
  string tenant_id = 2;
  string tenant_class = 3;  // "primary" | "registrar" | "inspector" | "interpreter" | "broker" | "shareholder" | "proxy_advisor" | "press"
}

message AGMSessionRef {
  string agm_session_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp open_utc = 3;
}

// ============================================================
// Language stream
// ============================================================

message LanguageStream {
  LanguageCode language_code = 1;
  string interpreter_principal = 2;
  string interpreter_credential_id = 3;
  InterpretationMode interpretation_mode = 4;
  string target_region_cell = 5;
  uint32 target_latency_ms = 6;
  string closed_caption_path = 7;
}

message CaptionVerificationRollup {
  string agm_session_id = 1;
  uint32 verification_window_minute = 2;
  map<string, double> per_language_wer = 3;
  double target_wer = 4;
  string status = 5;
  google.protobuf.Timestamp emitted_at = 6;
}

// ============================================================
// Livestream
// ============================================================

message OpenLivestreamRequest {
  string agm_session_id = 1;
  repeated LanguageStream language_streams = 2;
  RegFDGateConfig reg_fd_gate = 3;
  string recording_worm_cell = 4;
  string recording_seal_class = 5;
  google.protobuf.Timestamp opened_at_utc = 6;
}

message CloseLivestreamRequest {
  string agm_session_id = 1;
  google.protobuf.Timestamp closed_at_utc = 2;
  uint32 peak_concurrent_viewers = 3;
  double duration_minutes = 4;
}

// ============================================================
// Reg FD gate
// ============================================================

message RegFDGateConfig {
  bool armed = 1;
  uint32 window_ms = 2;
  repeated string release_paths = 3;
}

message RegFDGateFireRequest {
  string material_info_id = 1;
  string material_info_class = 2;
  bytes sealed_material_envelope = 3;
  string sealed_envelope_release_token = 4;
  google.protobuf.Timestamp target_disclosure_utc = 5;
  uint32 window_tolerance_ms = 6;
  repeated string release_paths = 7;
  bool interpreter_cues_all_received = 8;
  bool auto_detector_armed = 9;
}

message RegFDGateFireResponse {
  string material_info_id = 1;
  google.protobuf.Timestamp actual_fire_utc = 2;
  uint32 actual_window_ms = 3;
  map<string, google.protobuf.Timestamp> per_path_fire_t = 4;
  string status = 5;
  string audit_event_id = 6;
}

// ============================================================
// Voting + tally
// ============================================================

message OpenVotingRequest {
  string agm_session_id = 1;
  string proposal_id = 2;
  ProposalType proposal_type = 3;
  repeated ShareClass share_classes = 4;
  google.protobuf.Timestamp voting_open_utc = 5;
  google.protobuf.Timestamp voting_close_utc = 6;
  bool rolling_tally_enabled = 7;
  bool dual_sign_required = 8;
}

message RollingTallyEnvelope {
  string proposal_id = 1;
  ShareClass share_class = 2;
  uint64 votes_pre_recorded_proxy = 3;
  uint64 votes_live_during_meeting = 4;
  uint64 total_votes = 5;
  uint64 in_favor = 6;
  uint64 against = 7;
  uint64 abstain = 8;
  google.protobuf.Timestamp tally_t = 9;
  string merkle_root = 10;
}

message DualSignCertifyRequest {
  string proposal_id = 1;
  ShareClass share_class = 2;
  uint64 final_in_favor = 3;
  uint64 final_against = 4;
  uint64 final_abstain = 5;
  uint64 final_total = 6;
  string computershare_sign_principal = 7;
  google.protobuf.Timestamp computershare_sign_t = 8;
  string carl_hagberg_sign_principal = 9;
  google.protobuf.Timestamp carl_hagberg_sign_t = 10;
  string merkle_root_per_share_class = 11;
}

// ============================================================
// Merkle anchor
// ============================================================

message EmitAGMAnchorRequest {
  string anchor_id = 1;
  string agm_session_id = 2;
  string proposal_id = 3;
  ShareClass share_class = 4;
  bytes merkle_root = 5;
  string external_transparency_log_batch = 6;
  ProofClass proof_class = 7;
  google.protobuf.Timestamp emitted_at = 8;
}

// ============================================================
// Q&A queue
// ============================================================

message SubmitQuestionRequest {
  string agm_session_id = 1;
  PrincipalRef shareholder_principal = 2;
  ShareholderClass shareholder_class = 3;
  string question_text_b64 = 4;
  LanguageCode question_language = 5;
  string question_topic_hint = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message OmbudsFilterReviewRequest {
  string question_id = 1;
  string civility_filter_result = 2;
  string reg_fd_filter_result = 3;
  string promotion_decision = 4;
  PrincipalRef reviewer_principal = 5;
  google.protobuf.Timestamp reviewed_at = 6;
}

message PromoteToPrimaryQueueRequest {
  string question_id = 1;
  string agm_session_id = 2;
  google.protobuf.Timestamp promoted_at = 3;
  string topic_tag = 4;
  PrincipalRef suggested_respondent = 5;
}

// ============================================================
// Shareholder authentication
// ============================================================

message DirectRegisteredAuthRequest {
  string shareholder_id = 1;
  string agm_session_id = 2;
  string computershare_proxyview_sso_token = 3;
  string auth_method = 4;
}

message StreetNameAuthRequest {
  string shareholder_id = 1;
  string broker_tenant = 2;
  string broker_control_number = 3;
  string agm_session_id = 4;
  string broker_sso_token = 5;
  string auth_method = 6;
}

message InstitutionalAuthRequest {
  PrincipalRef institutional_principal = 1;
  repeated InstitutionalHolding institutional_holdings_records = 2;
  string computershare_proxyview_token = 3;
  string agm_session_id = 4;
}

message InstitutionalHolding {
  ShareClass share_class = 1;
  uint64 share_count = 2;
}

// ============================================================
// SEC 17a-4(f) WORM seal
// ============================================================

message SEC17a4fSealRequest {
  string agm_session_id = 1;
  string worm_cell = 2;
  string seal_class = 3;
  uint32 retention_years_minimum = 4;
  bool indelible_storage_attestation = 5;
  string time_stamp_authority_id = 6;
  bool audit_trail_attached = 7;
  repeated ArtifactSealRequest artifacts = 8;
}

message ArtifactSealRequest {
  string artifact_id = 1;
  string filename = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
  string mime_type = 5;
  ArtifactClass artifact_class = 6;
  LanguageCode language_code = 7;
}

// ============================================================
// SEC Form 8-K filing
// ============================================================

message SECForm8KFileRequest {
  string filing_id = 1;
  string filer_cik = 2;
  string filing_type = 3;
  repeated string items = 4;
  google.protobuf.Timestamp filing_date_target_utc = 5;
  google.protobuf.Timestamp filed_at_utc = 6;
  string signing_principal = 7;
  string signing_capacity = 8;
}

// ============================================================
// Cedar deny coverage + observability + pack manifest
// ============================================================

message CedarDenyCoverageReport {
  string agm_session_id = 1;
  uint32 denied_enumeration_attempts_on_board_channel = 2;
  uint32 denied_single_language_caption_disable_attempts = 3;
  uint32 denied_pre_eps_release_material_disclosure = 4;
  uint32 denied_partial_share_class_tally_disclose = 5;
  uint32 total_denied_actions = 6;
}

message PerEdgeLatency {
  uint32 target_ms = 1;
  uint32 actual_ms = 2;
  string status = 3;
}

message LatencyReport {
  string agm_session_id = 1;
  map<string, PerEdgeLatency> per_edge_latency = 2;
  string overall_status = 3;
}

message PackManifestAssertion {
  string agm_session_id = 1;
  repeated string active_packs = 2;
  string cross_validation_state = 3;
  string pack_manifest_signature = 4;
  google.protobuf.Timestamp asserted_at = 5;
}

// ============================================================
// Audit event envelope
// ============================================================

message AuditEvent {
  string event_id = 1;
  string event_class = 2;
  string agm_session_id = 3;
  PrincipalRef actor_principal = 4;
  ShareClass share_class = 5;
  bool cross_tenant_call = 6;
  string cedar_permit_id = 7;
  google.protobuf.Timestamp emitted_at = 8;
}
