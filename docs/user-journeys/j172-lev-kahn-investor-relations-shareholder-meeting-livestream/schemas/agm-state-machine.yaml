---
doc_class: User-Journey-State-Machine
journey_id: j172-lev-kahn-investor-relations-shareholder-meeting-livestream
date: 2026-05-20
authority_tier: 2

machine:
  id: agm-helios-2027-fy2026
  name: helios-agm-lifecycle
  description: 8-state AGM lifecycle for the NYSE-listed Helios Industries FY2026 AGM under SEC Reg FD + SEC 17a-4(f) WORM + NYSE LCM + Delaware GCL.
  initial_state: pre_meeting
  terminal_states:
    - archive

states:
  - id: pre_meeting
    description: IR command console open; dry-run; language stream activation; shareholder authentication wave.
    on_entry:
      - emit_event: EVT-J172-AGM-COMMAND-CONSOLE-OPENED-Δ000
      - reg_fd_gate_arm
      - language_streams_initialize
    transitions:
      - to: notice_period
        when: language_streams_all_active_and_authentication_wave_open
        cedar_permit: ir_director + cfo_co_sign

  - id: notice_period
    description: Shareholder authentication wave; ~12,400 shareholders authenticate over ~90 minutes.
    on_entry:
      - emit_event: EVT-J172-LANGUAGE-STREAM-ADDED-jaJP-Δ001a (if late-add)
      - emit_event: EVT-J172-DRY-RUN-PASSED-Δ001b
    transitions:
      - to: meeting_open
        when: agm_open_utc_reached
        cedar_permit: ir_director

  - id: meeting_open
    description: Livestream opens; CEO opening remarks; recording armed.
    on_entry:
      - emit_event: EVT-J172-LIVESTREAM-OPENED-001
      - emit_event: EVT-J172-SHAREHOLDERS-AUTHENTICATED-002 (rolling)
      - recording_chain_of_custody_arm
    transitions:
      - to: presentations
        when: opening_remarks_complete
        cedar_permit: ir_director

  - id: presentations
    description: CFO presents Q1 results; EPS preliminary disclosure via Reg FD simultaneous-disclosure gate.
    on_entry:
      - emit_event: EVT-J172-CAPTIONS-VERIFIED-003 (rolling)
      - reg_fd_gate_fire_eps
      - emit_event: EVT-J172-REG-FD-SIMULTANEOUS-DISCLOSURE-006
    transitions:
      - to: voting_open
        when: gc_secretary_calls_voting
        cedar_permit: gc_secretary

  - id: voting_open
    description: Per-proposal voting; rolling tally streams; per-share-class Merkle anchor emission.
    on_entry:
      - emit_event: EVT-J172-VOTING-OPENED-Δ005a (per proposal)
      - rolling_tally_stream_start
    transitions:
      - to: q_and_a
        when: all_proposals_voting_closed
        cedar_permit: gc_secretary
      - to: voting_open
        when: next_proposal_open
        loop: true

  - id: q_and_a
    description: Q&A session; community-filtered retail stream; ombudsperson civility + Reg FD filter; Q&A queue management.
    on_entry:
      - emit_event: EVT-J172-Q-AND-A-SUBMITTED-Δ004a (per question)
      - emit_event: EVT-J172-COMMUNITY-RETAIL-FILTER-Δ004a (per retail question)
      - emit_event: EVT-J172-Q-AND-A-ROLLUP-004 (composite at close)
    transitions:
      - to: tally_certification
        when: q_and_a_window_close_or_meeting_close
        cedar_permit: ir_director

  - id: tally_certification
    description: Dual-sign certification (Computershare + Carl Hagberg) per proposal per share class.
    on_entry:
      - emit_event: EVT-J172-VOTE-TALLY-005 (per share class per proposal)
      - emit_event: EVT-J172-MERKLE-ANCHORS-007 (12 anchors)
      - emit_event: EVT-J172-FINAL-CERTIFICATION-Δ005f
    transitions:
      - to: post_meeting_filings
        when: final_certification_complete
        cedar_permit: gc + computershare + carl_hagberg

  - id: post_meeting_filings
    description: SEC Form 8-K filing + SEC 17a-4(f) WORM seal + transcript distribution.
    on_entry:
      - emit_event: EVT-J172-LIVESTREAM-CLOSED-Δ001c
      - emit_event: EVT-J172-SEC-17A-4F-WORM-SEALED-008
      - emit_event: EVT-J172-SEC-FORM-8K-FILED-Δ008a
      - emit_event: EVT-J172-CEDAR-DENY-COVERAGE-009
      - emit_event: EVT-J172-LATENCY-TARGETS-MET-010
      - emit_event: EVT-J172-PACK-MANIFEST-011
    transitions:
      - to: archive
        when: all_filings_complete_and_worm_sealed
        cedar_permit: ir_director + gc_secretary

  - id: archive
    description: AGM archived; WORM seal preserved 6 years; written-only Q&A responses distributed.
    is_terminal: true

transitions_invariants:
  - reg_fd_gate_must_fire_within_200ms_or_not_at_all
  - per_share_class_tally_never_aggregated_obscuring_founder_class
  - dual_sign_required_for_certification (computershare + carl_hagberg)
  - merkle_anchor_emit_required_before_certification
  - worm_seal_required_post_meeting_close
  - cedar_deny_logged_with_redacted_metadata
  - language_streams_preserve_utf8_nfc_byte_exact

retention:
  recording_retention_class: sec_17a_4f_6y_minimum_indelible_time_stamped_audit_trail
  retention_cell: us-east-tier-1-worm-sec-17a-4f
  per_language_recording_count: 5
  transcript_per_language_count: 5
  slide_deck_per_language_count: 5
  vote_tally_record_count: 2 (per share class)
  merkle_anchor_bundle_count: 1 (12 anchors)
  dual_sign_attestation_count: 1
  total_artifacts: 24

reg_fd_gate:
  window_ms_target: 200
  release_paths_required:
    - press_release_wire_dow_jones
    - press_release_wire_reuters
    - sec_form_8k_filing_queue
    - helios_ir_page_publish
    - language_stream_en_US_caption
    - language_stream_en_UK_caption
    - language_stream_zh_Hans_caption
    - language_stream_ko_KR_caption
    - language_stream_ja_JP_caption
  arming_required: true
  forbidden_state: fire_with_actual_window_ms_above_200

audit_events:
  - id: EVT-J172-AGM-COMMAND-CONSOLE-OPENED-Δ000
    state: pre_meeting
  - id: EVT-J172-LANGUAGE-STREAM-ADDED-jaJP-Δ001a
    state: notice_period
  - id: EVT-J172-DRY-RUN-PASSED-Δ001b
    state: notice_period
  - id: EVT-J172-LIVESTREAM-OPENED-001
    state: meeting_open
  - id: EVT-J172-SHAREHOLDERS-AUTHENTICATED-002
    state: notice_period_through_meeting_open
  - id: EVT-J172-CAPTIONS-VERIFIED-003
    state: meeting_open_through_q_and_a
  - id: EVT-J172-REG-FD-SIMULTANEOUS-DISCLOSURE-006
    state: presentations
  - id: EVT-J172-VOTING-OPENED-Δ005a
    state: voting_open
  - id: EVT-J172-VOTE-TALLY-005
    state: tally_certification
  - id: EVT-J172-MERKLE-ANCHORS-007
    state: tally_certification
  - id: EVT-J172-Q-AND-A-ROLLUP-004
    state: q_and_a
  - id: EVT-J172-COMMUNITY-RETAIL-FILTER-Δ004a
    state: q_and_a
  - id: EVT-J172-FINAL-CERTIFICATION-Δ005f
    state: tally_certification
  - id: EVT-J172-LIVESTREAM-CLOSED-Δ001c
    state: post_meeting_filings
  - id: EVT-J172-SEC-17A-4F-WORM-SEALED-008
    state: post_meeting_filings
  - id: EVT-J172-SEC-FORM-8K-FILED-Δ008a
    state: post_meeting_filings
  - id: EVT-J172-CEDAR-DENY-COVERAGE-009
    state: post_meeting_filings
  - id: EVT-J172-LATENCY-TARGETS-MET-010
    state: post_meeting_filings
  - id: EVT-J172-PACK-MANIFEST-011
    state: post_meeting_filings
