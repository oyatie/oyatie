// j155 — Stefan Kovács dual-role journey messages
// proto3, package versioned per ADR-0244 tenant scoping + ADR-0311 dual-tenant identity
// Every RPC carries a `tenant_context` and a `acting_tenant`; the Cedar gate uses both.

syntax = "proto3";

package oya.journeys.j155.v1;

import "google/protobuf/timestamp.proto";

// ---------- Common types ----------

message Principal {
  string subject_id = 1;                  // e.g. stefan.kovacs@personal-id.oya
  string acting_tenant = 2;               // active-tenant at RPC time
  repeated string role_in_acting_tenant = 3;
  string passkey_assertion_b64 = 4;       // WebAuthn assertion (sigCount sealed)
  string device_id = 5;                   // e.g. pixel-8a-stefan-personal-93a7c
}

message TenantContext {
  string tenant_id = 1;                   // resource owner tenant
  string cell = 2;                        // e.g. eu-frankfurt-primary
  string trace_id = 3;
}

message AuditAnchor {
  string event_class = 1;                 // EVT-J155-...
  google.protobuf.Timestamp hlc_ts = 2;
  bool truetime_class = 3;
  uint64 hlc_logical = 4;
  string merkle_leaf_b64 = 5;
}

// ---------- §1 Calendar — shift attendance ----------

message ConfirmShiftRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string shift_id = 3;
  enum ConfirmMethod { NFC_TAP_KIOSK = 0; MANUAL_PIN = 1; MANAGER_OVERRIDE = 2; }
  ConfirmMethod method = 4;
  string kiosk_id = 5;
  google.protobuf.Timestamp scheduled_start = 6;
  google.protobuf.Timestamp actual_arrival = 7;
}

message ConfirmShiftResponse {
  string shift_confirmation_id = 1;
  enum Status { CONFIRMED = 0; MANAGER_REQUIRED = 1; BLOCKED_WTD = 2; }
  Status status = 2;
  double weekly_hours_running_avg = 3;
  double wtd_weekly_cap_remaining = 4;
  google.protobuf.Timestamp next_eligible_clock_out_at = 5;
  AuditAnchor audit = 6;
}

// ---------- §2 Messenger — swap-offer + decline ----------

message SwapOfferMessage {
  Principal from_principal = 1;
  Principal to_principal = 2;
  TenantContext tenant_ctx = 3;
  string shift_id = 4;
  string reason_code = 5;
  uint64 mls_epoch = 6;
  string ciphertext_b64 = 7;
}

message SwapDeclineMessage {
  Principal from_principal = 1;
  Principal to_principal = 2;
  TenantContext tenant_ctx = 3;
  string reply_ciphertext_b64 = 4;
  uint64 mls_epoch_after = 5;
  bool dlp_exam_leak_negative = 6;       // server-side DLP must verify no BME vocabulary
}

// ---------- §3 Identity — tenant switch ----------

message TenantSwitchRequest {
  Principal principal = 1;
  string from_tenant = 2;
  string to_tenant = 3;
  string webauthn_assertion_b64 = 4;
  uint32 explicit_hold_ms = 5;            // must be ≥1800 ms
}

message TenantSwitchResponse {
  string new_acting_tenant = 1;
  repeated string new_roles = 2;
  AuditAnchor audit_personal = 3;         // sealed in personal tenant
  AuditAnchor audit_destination_redacted = 4;
}

// ---------- §4 LMS — read notes ----------

message LmsReadNotesRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string course_code = 3;                 // e.g. VIK-AUT-VIIIAB1015
  string module_id = 4;                   // e.g. lecture-12
}

message LmsReadNotesResponse {
  string pdf_url_signed = 1;              // short-lived; expires in 5 min
  string video_manifest_url = 2;
  uint32 page_count = 3;
  AuditAnchor audit = 4;
}

// ---------- §5 Payments — tuition payroll-bridge ----------

message BridgeProposeRequest {
  Principal initiating_principal = 1;
  TenantContext bme_tenant_ctx = 2;
  string employee_id = 3;                 // OSZK employee id
  string deduction_amount = 4;            // HUF as base-10 string
  string currency = 5;
  string destination_installment_id = 6;
  string pay_period = 7;                  // YYYY-MM
}

message BridgeConsentRequest {
  Principal personal_principal = 1;
  TenantContext personal_tenant_ctx = 2;
  string bridge_id = 3;
  enum Decision { GRANT = 0; REVOKE = 1; }
  Decision decision = 4;
  enum Method { PRE_AUTHORIZED = 0; ONE_TIME_INLINE = 1; PASSKEY_CONFIRM = 2; }
  Method method = 5;
}

message BridgeCommitRequest {
  string bridge_id = 1;
  message TrueTimeWindow {
    google.protobuf.Timestamp earliest = 1;
    google.protobuf.Timestamp latest = 2;
    uint32 uncertainty_ms = 3;            // must be ≤10
  }
  TrueTimeWindow window = 2;
  repeated string tenant_set = 3;         // exactly 3 entries
}

message BridgeCommitResponse {
  repeated AuditAnchor audits = 1;        // one per tenant — total 3
  bool atomic_committed = 2;
}

// ---------- §6 Community — MLS post ----------

message CommunityPostRequest {
  Principal principal = 1;
  TenantContext tenant_ctx = 2;
  string channel_id = 3;                  // e.g. os-finals-2026
  uint64 mls_epoch = 4;
  string ciphertext_b64 = 5;
}

message CommunityPostResponse {
  string post_id = 1;
  uint64 mls_epoch_after = 2;
  AuditAnchor audit = 3;
}

// ---------- §7 Observability — sleep-grade emit ----------

message SleepGradeEmitRequest {
  Principal personal_principal = 1;       // source of consent
  TenantContext personal_tenant_ctx = 2;
  message SleepWindow {
    google.protobuf.Timestamp start = 1;
    google.protobuf.Timestamp end = 2;
    uint32 wake_count = 3;
    uint32 deep_sleep_minutes = 4;
    uint32 rem_minutes = 5;
    double avg_hr_bpm = 6;
  }
  SleepWindow window = 3;
  string cohort_id = 4;                   // e.g. cohort-bme-vik-sleep-grade-2026-fall-n-127
}

message SleepGradeEmitResponse {
  string cohort_pseudonym = 1;            // e.g. cohort-pseudo-bodv75-fall26
  AuditAnchor personal_audit = 2;
  AuditAnchor cohort_audit = 3;
}

// ---------- §8 Cedar deny — cross-tenant probe ----------

message CrossTenantProbeAudit {
  Principal probing_principal = 1;
  string source_tenant = 2;
  string target_tenant = 3;
  string attempted_action = 4;
  string forbid_rule_id = 5;
  AuditAnchor source_audit = 6;
  AuditAnchor target_audit = 7;           // dual-seal invariant
}

// ---------- §9 Art-15 export ----------

message Art15ExportRequest {
  Principal requesting_principal = 1;
  TenantContext personal_tenant_ctx = 2;
  string format = 3;                      // "zip_per_tenant" canonical
}

message Art15ExportResponse {
  string export_id = 1;
  repeated string per_tenant_export_uris = 2;  // signed URLs
  string aggregate_manifest_uri = 3;
  string qtsa_signature_b64 = 4;
  google.protobuf.Timestamp delivery_eta = 5;  // ≤ GDPR statutory 30 days
}
