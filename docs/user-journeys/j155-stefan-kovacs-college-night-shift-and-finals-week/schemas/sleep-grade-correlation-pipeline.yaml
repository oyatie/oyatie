# j155 — sleep-grade correlation observability pipeline
# Source tenant: personal-stefan-kovacs-hu (consent owner)
# Egress tenant: bme-research-cohort-2026-sleep-grade-fall (cohort-only)
# OSZK has NO visibility (FORBID-3 in cedar-policy.cedar)
#
# This pipeline is invoked once per uploaded sleep window from Stefan's Pixel 8a.
# It MUST strip identifiers, apply pseudonym mapping, and emit only to the cohort tenant.
# A pseudonym → real-subject reverse map exists ONLY in the personal-tenant secrets vault;
# BME and OSZK never see it. Reverse-lookup gated by Cedar permit `analytics.pseudonym_reverse`.

apiVersion: oya.observability/v1
kind: AnonymizationPipeline
metadata:
  name: sleep-grade-correlation-stefan-bodv75
  pipeline_id: pipe-sleep-grade-stefan-bodv75-2026-fall
  source_tenant: personal-stefan-kovacs-hu
  egress_tenant_allowlist:
    - bme-research-cohort-2026-sleep-grade-fall
  adr_refs:
    - ADR-0263  # observability emission contract
    - ADR-0244  # tenant scoping
    - ADR-0311  # dual-tenant identity boundary
  regulator_anchors:
    - EU-GDPR-Art-89-research-safeguards
    - EU-GDPR-Art-6.1.a-consent
    - EU-GDPR-Art-9.2.j-research-special-category

spec:
  # ============================================
  # §1 Input schema (from Pixel 8a sleep tracker)
  # ============================================
  input:
    schema:
      type: object
      required: [subject_id, device_id, sleep_window]
      properties:
        subject_id:
          type: string
          example: "stefan.kovacs@personal-id.oya"
          classification: identifier
        device_id:
          type: string
          example: "pixel-8a-stefan-personal-93a7c"
          classification: quasi_identifier
        sleep_window:
          type: object
          required: [start, end, wake_count, deep_sleep_minutes, rem_minutes]
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            wake_count: {type: integer}
            deep_sleep_minutes: {type: integer}
            rem_minutes: {type: integer}
            avg_hr_bpm: {type: number}
            ambient_temp_c: {type: number}

  # ============================================
  # §2 Identifier-stripping transform (mandatory)
  # ============================================
  transforms:
    - id: t1_strip_subject
      action: drop_field
      target: subject_id
      reason: "EU-GDPR Art 9 research safeguard — subject id never leaves personal tenant"

    - id: t2_strip_device
      action: drop_field
      target: device_id
      reason: "device id is a quasi-identifier; cohort row must not be re-identifiable"

    - id: t3_pseudonymize
      action: hmac_substitute
      target: _row_pseudonym
      hmac:
        key_ref: vault://personal-stefan-kovacs-hu/secrets/pseudonym-key-cohort-fall-2026
        algorithm: HMAC-SHA-256
        truncate_to_chars: 22
      output_prefix: "cohort-pseudo-"
      output_example: "cohort-pseudo-bodv75-fall26"

    - id: t4_bin_temporal
      action: bin
      target: sleep_window.start
      strategy: round_to_15min
      reason: "reduces re-identification risk while preserving cohort temporal correlation"

    - id: t5_clamp_numerics
      action: clamp
      targets:
        - field: sleep_window.avg_hr_bpm
          min: 30
          max: 180
        - field: sleep_window.ambient_temp_c
          min: 14.0
          max: 28.0

  # ============================================
  # §3 Cedar gate (must pass before egress)
  # ============================================
  egress_gate:
    cedar_action: analytics.cohort_emit
    required_context:
      pseudonymized: true
      identifier_columns_stripped: true
      cohort_consent_active: true
      source_tenant: personal-stefan-kovacs-hu
    deny_handling:
      circuit: open_fail_closed
      audit_class: EVT-J155-COHORT-EGRESS-DENY-020

  # ============================================
  # §4 Egress sink
  # ============================================
  egress:
    sink_kind: kafka
    sink_topic: cohort.bme.sleep-grade.fall-2026.v1
    sink_tenant: bme-research-cohort-2026-sleep-grade-fall
    schema_registry_subject: cohort-sleep-grade-fall-2026-v1
    delivery_semantics: at_least_once
    backpressure:
      max_in_flight: 64
      retry_max: 5
      retry_backoff_ms: [200, 600, 1800, 5400, 16200]
    audit_class: EVT-J155-OBSERVABILITY-SLEEP-GRADE-EMIT-008

  # ============================================
  # §5 Audit + reverse-map record
  # ============================================
  audit:
    seal_in_source_tenant:
      tenant: personal-stefan-kovacs-hu
      event_class: EVT-J155-OBSERVABILITY-SLEEP-GRADE-EMIT-008-source
      retention_years: 6
    seal_in_egress_tenant:
      tenant: bme-research-cohort-2026-sleep-grade-fall
      event_class: EVT-J155-OBSERVABILITY-SLEEP-GRADE-EMIT-008-egress
      retention_years: 10  # research retention
    reverse_map_record:
      stored_in: personal-stefan-kovacs-hu
      vault_path: vault://personal-stefan-kovacs-hu/secrets/pseudonym-reverse-map/cohort-fall-2026
      access_policy: cedar://analytics.pseudonym_reverse
      access_principals_allowed:
        - stefan.kovacs@personal-id.oya  # Art 15 reverse-lookup right
        - oya.system.dpo-personal-stefan  # DPO incident handling

  # ============================================
  # §6 Subject-rights endpoints (Art 15, Art 17)
  # ============================================
  subject_rights:
    art15_export:
      endpoint: /v1/tenants/personal-stefan-kovacs-hu/dpo/sleep-grade/export
      latency_sla: 30_days
      includes_reverse_map_for_subject_own_rows: true
    art17_erasure:
      endpoint: /v1/tenants/personal-stefan-kovacs-hu/dpo/sleep-grade/erase
      cascade_to_cohort: true
      cohort_erasure_strategy: tombstone_pseudonym_row
      cohort_erasure_audit: EVT-J155-COHORT-ERASURE-CASCADE-021

  # ============================================
  # §7 Per-cell deployment
  # ============================================
  deployment:
    cells:
      - name: eu-amsterdam-secondary
        role: primary
      - name: eu-frankfurt-primary
        role: secondary_dr
      - name: eu-paris-readonly-replica
        role: read_replica_dr
    resource_class: anonymization-class-l1
    horizontal_scale:
      min_replicas: 2
      max_replicas: 12
      cpu_target_pct: 60
