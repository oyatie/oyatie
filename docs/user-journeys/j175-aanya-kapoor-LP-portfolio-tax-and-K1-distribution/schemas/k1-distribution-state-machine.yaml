---
doc_class: User-Journey-State-Machine
journey_id: j175-aanya-kapoor-LP-portfolio-tax-and-K1-distribution
date: 2026-05-20
authority_tier: 2

machine:
  id: lp-reconciliation-aanya-fy2026
  name: lp-k1-distribution-lifecycle
  description: 9-state K-1 reconciliation lifecycle for HNW LP investor across 4 venture/PE funds under IRS Schedule K-1 + Section 199A + Section 1411 NIIT + state apportionment + Form 1116 FTC + AMT.
  initial_state: k1_arrived
  terminal_states:
    - archived

states:
  - id: k1_arrived
    description: K-1 PDFs arrive from 4 fund GPs (a16z + Sequoia + KKR + Insight) between April 14 and May 12.
    on_entry:
      - emit_event: EVT-J175-LP-COCKPIT-OPENED-Δ000
    transitions:
      - to: ingested
        when: all_4_k1s_received
        cedar_permit: lp_personal + accredited

  - id: ingested
    description: K-1 PDFs parsed; Schedule K-1 + K-3 line items extracted.
    on_entry:
      - emit_event: EVT-J175-K1-INGESTED-Δ001a-{fund} (per fund)
      - emit_event: EVT-J175-K1-INGESTED-001 (composite)
    transitions:
      - to: capital_account_reconciled
        when: all_4_k1s_parsed
        cedar_permit: lp_personal + finops_portal

  - id: capital_account_reconciled
    description: Per-fund LP capital account reconciled with GP capital account statements.
    on_entry:
      - emit_event: EVT-J175-CAPITAL-ACCOUNT-RECONCILED-002
    transitions:
      - to: tax_character_categorized
        when: all_4_funds_reconcile_clean
        cedar_permit: lp_personal + finops_portal

  - id: tax_character_categorized
    description: Tax character categorized across 7 types; Section 199A + Section 1411 NIIT computed.
    on_entry:
      - emit_event: EVT-J175-TAX-CHARACTER-003
      - emit_event: EVT-J175-SECTION-199A-COMPUTED-004
      - emit_event: EVT-J175-SECTION-1411-NIIT-005
    transitions:
      - to: state_apportioned
        when: tax_character_complete
        cedar_permit: lp_personal + compliance

  - id: state_apportioned
    description: 8-state apportionment computed using Schedule K-3 source rules.
    on_entry:
      - emit_event: EVT-J175-STATE-APPORTIONMENT-006
    transitions:
      - to: foreign_tax_credit_computed
        when: state_apportionment_complete
        cedar_permit: lp_personal + compliance

  - id: foreign_tax_credit_computed
    description: Form 1116 FTC computed across 6 jurisdictions; AMT projection complete.
    on_entry:
      - emit_event: EVT-J175-FOREIGN-TAX-CREDIT-007
      - emit_event: EVT-J175-AMT-COMPUTED-008
    transitions:
      - to: estimated_tax_paid
        when: ftc_amt_complete
        cedar_permit: lp_personal + compliance

  - id: estimated_tax_paid
    description: Q2 quarterly estimated tax paid to IRS + 4 state revenue depts; Q3 + Q4 scheduled.
    on_entry:
      - emit_event: EVT-J175-ESTIMATED-TAX-IRS-Δ009a
      - emit_event: EVT-J175-ESTIMATED-TAX-STATE-Δ009-{state} (per state)
      - emit_event: EVT-J175-ESTIMATED-TAX-PAID-009 (composite)
    transitions:
      - to: gp_lp_clarifications_resolved
        when: all_payments_acked
        cedar_permit: lp_personal + payments

  - id: gp_lp_clarifications_resolved
    description: 4 GP-LP communication dialogues resolved (2 substantive + 2 informational).
    on_entry:
      - emit_event: EVT-J175-GP-LP-CLARIFICATION-Δ010-{fund}-Δ{n} (per dialogue)
      - emit_event: EVT-J175-GP-LP-CLARIFICATIONS-010 (composite)
    transitions:
      - to: archived
        when: all_dialogues_resolved + worm_archival_complete
        cedar_permit: lp_personal + drive + connect

  - id: archived
    description: 16 artifacts WORM-archived (4 K-1s + 4 cap acct stmts + 4 alloc schedules + 4 FTC footnotes); CPA package delivered; pack manifest asserted.
    on_entry:
      - emit_event: EVT-J175-WORM-ARCHIVED-011
      - emit_event: EVT-J175-CPA-PACKAGE-SENT-Δ012a
      - emit_event: EVT-J175-PACK-MANIFEST-Δ012b
    is_terminal: true

transitions_invariants:
  - all_4_k1s_required_before_reconciliation
  - per_fund_capital_account_must_reconcile_with_gp_statement
  - tax_character_aggregate_must_match_per_k1_line_items
  - state_apportionment_matrix_must_sum_to_total_income
  - ftc_basket_passive_creditable_capped_per_form_1116
  - amt_owed_min_0
  - section_199a_phaseout_respected_for_high_w2_mfj
  - section_1411_niit_base_min_of_nii_and_magi_minus_threshold
  - estimated_tax_safe_harbor_required_for_no_penalty
  - worm_artifacts_immutable_post_seal
  - cpa_package_read_only_for_cpa_tenant
  - gp_lp_channel_e2ee_only_permitted_principals

retention:
  k1_worm_retention_years_min: 7 (IRS records retention rule § 6501(e))
  retention_cell: us-west-tier-1-worm-irs-retention
  seal_class: irs-aligned-worm-class-1
  indelible_storage: true
  time_stamp_authority: rfc-3161-tsa-2027

audit_events:
  - id: EVT-J175-LP-COCKPIT-OPENED-Δ000
    state: k1_arrived
  - id: EVT-J175-K1-INGESTED-001
    state: ingested
  - id: EVT-J175-CAPITAL-ACCOUNT-RECONCILED-002
    state: capital_account_reconciled
  - id: EVT-J175-TAX-CHARACTER-003
    state: tax_character_categorized
  - id: EVT-J175-SECTION-199A-COMPUTED-004
    state: tax_character_categorized
  - id: EVT-J175-SECTION-1411-NIIT-005
    state: tax_character_categorized
  - id: EVT-J175-STATE-APPORTIONMENT-006
    state: state_apportioned
  - id: EVT-J175-FOREIGN-TAX-CREDIT-007
    state: foreign_tax_credit_computed
  - id: EVT-J175-AMT-COMPUTED-008
    state: foreign_tax_credit_computed
  - id: EVT-J175-ESTIMATED-TAX-PAID-009
    state: estimated_tax_paid
  - id: EVT-J175-GP-LP-CLARIFICATIONS-010
    state: gp_lp_clarifications_resolved
  - id: EVT-J175-WORM-ARCHIVED-011
    state: archived
  - id: EVT-J175-CPA-PACKAGE-SENT-Δ012a
    state: archived
  - id: EVT-J175-PACK-MANIFEST-Δ012b
    state: archived
