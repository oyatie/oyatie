// j175 — LP K-1 reconciliation proto3 message definitions
// ADR-0243 + ADR-0244 + ADR-0245 + ADR-0247 + ADR-0251 + ADR-0252 + ADR-0253 + ADR-0263

syntax = "proto3";

package oyatie.user_journeys.j175.v1;

import "google/protobuf/timestamp.proto";

// ============================================================
// Enums
// ============================================================

enum LPSessionState {
  LP_SESSION_STATE_UNSPECIFIED = 0;
  K1_ARRIVED = 1;
  INGESTED = 2;
  CAPITAL_ACCOUNT_RECONCILED = 3;
  TAX_CHARACTER_CATEGORIZED = 4;
  STATE_APPORTIONED = 5;
  FOREIGN_TAX_CREDIT_COMPUTED = 6;
  ESTIMATED_TAX_PAID = 7;
  ARCHIVED = 8;
}

enum FundGP {
  FUND_GP_UNSPECIFIED = 0;
  A16Z_FUND_VII = 1;
  SEQUOIA_US_GROWTH_IX = 2;
  KKR_ASIAN_FUND_V = 3;
  INSIGHT_VENTURE_XII = 4;
}

enum USState {
  US_STATE_UNSPECIFIED = 0;
  CA = 1;
  NY = 2;
  MA = 3;
  TX = 4;
  WA = 5;
  CO = 6;
  TN = 7;
  FL = 8;
}

enum ForeignJurisdiction {
  FOREIGN_JURISDICTION_UNSPECIFIED = 0;
  CANADA = 1;
  UNITED_KINGDOM = 2;
  SINGAPORE = 3;
  INDIA = 4;
  INDONESIA = 5;
  HONG_KONG = 6;
}

enum TaxCharacter {
  TAX_CHARACTER_UNSPECIFIED = 0;
  ORDINARY_INCOME = 1;
  LTCG = 2;
  STCG = 3;
  QUALIFIED_DIVIDENDS = 4;
  INTEREST_INCOME = 5;
  SECTION_199A_QBI = 6;
  FOREIGN_SOURCE_INCOME = 7;
}

enum PayloadClass {
  PAYLOAD_CLASS_UNSPECIFIED = 0;
  K1_CLARIFICATION_QUESTION = 1;
  K1_CLARIFICATION_ANSWER = 2;
  CAPITAL_CALL_NOTICE = 3;
  DISTRIBUTION_NOTICE = 4;
  PARTNER_ALLOCATION_CLARIFICATION = 5;
  ANNUAL_MEETING_LOGISTICS = 6;
}

enum ArtifactClass {
  ARTIFACT_CLASS_UNSPECIFIED = 0;
  K1_PDF = 1;
  CAPITAL_ACCOUNT_STATEMENT = 2;
  PARTNER_ALLOCATION_SCHEDULE = 3;
  FOREIGN_TAX_CREDIT_FOOTNOTE = 4;
}

enum ProofClass {
  PROOF_CLASS_UNSPECIFIED = 0;
  INCLUSION_PROOF = 1;
}

// ============================================================
// Common types
// ============================================================

message PrincipalRef {
  string principal_id = 1;
  string tenant_id = 2;
  string tenant_class = 3;
}

// ============================================================
// K-1 ingestion
// ============================================================

message K1IngestRequest {
  string lp_principal = 1;
  FundGP fund_gp = 2;
  string fund_name = 3;
  string fund_vintage = 4;
  string filename = 5;
  bytes pdf_content = 6;
  string content_sha256 = 7;
  string tax_year = 8;
  string filing_form = 9;
  bool schedule_k_3_attached = 10;
}

message K1LineItems {
  FundGP fund_gp = 1;
  double box_1_ordinary_income = 2;
  double box_4a_capital_gain_lt = 3;
  double box_4b_capital_gain_st = 4;
  double box_5_interest = 5;
  double box_6a_ordinary_dividends = 6;
  double box_6b_qualified_dividends = 7;
  double box_16a_section_199a = 8;
  double box_16o_foreign_tax_paid = 9;
  map<string, double> foreign_tax_paid_by_country = 10;
  double box_20_other = 11;
}

// ============================================================
// Capital account
// ============================================================

message CapitalAccountReconciliation {
  FundGP fund_gp = 1;
  double opening_capital_account = 2;
  double contributions = 3;
  double distributions = 4;
  double ordinary_income_allocated = 5;
  double capital_gain_allocated_lt = 6;
  double capital_gain_allocated_st = 7;
  double section_199a_allocated = 8;
  double foreign_source_income_allocated = 9;
  double closing_capital_account = 10;
  string gp_capital_account_statement_id = 11;
  bool reconciles_with_gp_statement = 12;
}

message LPCapitalAccountReconcileRequest {
  string lp_session_id = 1;
  repeated CapitalAccountReconciliation fund_capital_accounts = 2;
  double aggregate_lp_capital_eod = 3;
  double total_committed = 4;
  double uncalled_remaining = 5;
}

// ============================================================
// Tax-character categorization
// ============================================================

message TaxCharacterCategorizeRequest {
  string lp_session_id = 1;
  repeated K1LineItems per_fund = 2;
}

message TaxCharacterCategorizeResponse {
  string compute_id = 1;
  map<string, double> per_character_aggregate_usd = 2;  // {"ordinary_income": 146744, ...}
  double grand_total_usd = 3;
  google.protobuf.Timestamp computed_at = 4;
}

// ============================================================
// Section 199A
// ============================================================

message Section199AComputeRequest {
  double qbi_aggregate = 1;
  double w2_income = 2;
  double taxable_income_projected = 3;
  string filing_status = 4;
}

message Section199AComputeResponse {
  double qbi_aggregate = 1;
  double gross_199a_at_20pct = 2;
  string phaseout_state = 3;
  double effective_199a_deduction_after_phaseout = 4;
}

// ============================================================
// Section 1411 NIIT
// ============================================================

message Section1411NIITComputeRequest {
  double net_investment_income = 1;
  double magi = 2;
  double magi_threshold = 3;
}

message Section1411NIITComputeResponse {
  double niit_base = 1;
  double niit_rate = 2;
  double niit_owed = 3;
}

// ============================================================
// State apportionment
// ============================================================

message PerFundStateBreakdown {
  FundGP fund_gp = 1;
  map<string, double> state_source_percentages = 2;
  double total_k1_income = 3;
  map<string, double> foreign_source_percentages = 4;
}

message StateApportionmentRequest {
  string lp_session_id = 1;
  USState residence_state = 2;
  repeated PerFundStateBreakdown per_fund = 3;
}

message StateApportionmentResponse {
  map<string, double> per_state_aanya_income_usd = 1;
  double ca_projected_tax_usd = 2;
  double out_of_state_credit_aggregate_usd = 3;
  double net_ca_tax_after_credit_usd = 4;
}

// ============================================================
// Foreign tax credit
// ============================================================

message ForeignTaxPaidEntry {
  ForeignJurisdiction jurisdiction = 1;
  double amount_usd = 2;
  FundGP fund_gp = 3;
}

message Form1116FTCComputeRequest {
  string lp_session_id = 1;
  repeated ForeignTaxPaidEntry foreign_taxes_paid = 2;
}

message Form1116FTCComputeResponse {
  double ftc_basket_passive = 1;
  double ftc_basket_general = 2;
  double ftc_creditable_this_year = 3;
  double ftc_carryforward_to_next_year = 4;
}

// ============================================================
// AMT
// ============================================================

message AMTComputeRequest {
  double amti = 1;
  double amt_exemption_mfj = 2;
  double phaseout_completion = 3;
  double regular_tax = 4;
}

message AMTComputeResponse {
  double amti_minus_exemption = 1;
  double amt_tentative = 2;
  double amt_owed = 3;
  bool amt_zone = 4;
}

// ============================================================
// Quarterly estimated tax payment
// ============================================================

message IRSDirectPayDispatchRequest {
  string tax_year = 1;
  string quarter = 2;
  double amount_usd = 3;
  string payment_method = 4;
  string irs_direct_pay_account_id = 5;
  string filer_ssn_last4 = 6;
  google.protobuf.Timestamp payment_at = 7;
}

message StateRevenueDispatchRequest {
  string tax_year = 1;
  string quarter = 2;
  USState state = 3;
  string state_revenue_dept = 4;
  double amount_usd = 5;
  string payment_method = 6;
  google.protobuf.Timestamp payment_at = 7;
}

// ============================================================
// GP-LP channel
// ============================================================

message GPLPChannelOpenRequest {
  string channel_id = 1;
  FundGP fund_gp = 2;
  repeated PrincipalRef permitted_principals = 3;
  string channel_class = 4;
  string mls_group_id = 5;
}

message GPLPMessageRequest {
  string channel_id = 1;
  PrincipalRef sender_principal = 2;
  PayloadClass payload_class = 3;
  bytes mls_encrypted_payload = 4;
  google.protobuf.Timestamp sent_at = 5;
}

// ============================================================
// WORM archival
// ============================================================

message K1WORMArchiveRequest {
  string lp_session_id = 1;
  string worm_cell = 2;
  string seal_class = 3;
  uint32 retention_years_minimum = 4;
  bool indelible_storage_attestation = 5;
  string time_stamp_authority_id = 6;
  repeated ArtifactSeal artifacts = 7;
}

message ArtifactSeal {
  string artifact_id = 1;
  string filename = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
  string mime_type = 5;
  ArtifactClass artifact_class = 6;
  FundGP fund_gp = 7;
}

// ============================================================
// Pack manifest + audit
// ============================================================

message PackManifestAssertion {
  string lp_session_id = 1;
  repeated string active_packs = 2;
  string cross_validation_state = 3;
  string pack_manifest_signature = 4;
  google.protobuf.Timestamp asserted_at = 5;
}

message AuditEvent {
  string event_id = 1;
  string event_class = 2;
  string lp_session_id = 3;
  PrincipalRef actor_principal = 4;
  FundGP fund_gp = 5;
  bool cross_tenant_call = 6;
  string cedar_permit_id = 7;
  google.protobuf.Timestamp emitted_at = 8;
}
