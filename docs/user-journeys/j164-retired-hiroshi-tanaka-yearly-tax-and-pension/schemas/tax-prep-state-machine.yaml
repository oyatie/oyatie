# j164 — Hiroshi Tanaka annual tax-prep state machine
# 7-state lifecycle for annual tax-prep workflow
# Each transition: Cedar permit + audit class + SLA + invariant
# ADR-0244 + ADR-0263 + ADR-0251 + ADR-0311

state_machine:
  name: hiroshi_tanaka_annual_tax_prep_fy2026
  workflow_id: annual-tax-prep-fy2026
  tenant_id: personal-hiroshi-tanaka-jp
  initial_state: workflow_open
  terminal_states:
    - submitted
  states:

    - name: workflow_open
      description: Tax-prep workflow card visible; awaiting first user action
      sla_max_duration: 1h
      entry_audit: EVT-J164-WORKFLOW-OPEN-001
      cedar_permits_required:
        - workflow_studio.tax_prep_open
      invariants:
        - talkback_active
        - high_contrast_theme_active
        - large_text_minimum_18pt
        - voice_navigation_active
        - haptic_feedback_active
      accessibility_assertions:
        - talkback_announcement_within_600ms
        - haptic_confirm_pulse_fired
      transitions:
        - to: receipt_collection
          on: workflow_studio.voice_command (intent=next_step)
          guard: voice_confidence >= 0.92

    - name: receipt_collection
      description: User captures receipts via camera; OCR runs; receipts archived to drive WORM
      sla_max_duration: 2h
      entry_audit: EVT-J164-RECEIPT-COLLECTION-START
      exit_audit: EVT-J164-RECEIPTS-COLLECTED-002
      cedar_permits_required:
        - intelligence.ocr_receipt
        - drive.write_worm_locked
      invariants:
        - each_receipt_ocr_confidence_>=_0.95
        - drive_worm_7_year_retention
        - kanji_byte_exact_preservation
        - no_failure_language_on_retry
      patient_retry_pattern:
        timeout_seconds: 30
        retry_message: "もう一度どうぞ"
        no_blame_language: true
      transitions:
        - to: pension_reconciliation
          on: workflow_studio.step_close
          guard: at_least_1_receipt_collected

    - name: pension_reconciliation
      description: JPS pension feed query + bank cross-check; requires My-Number Card NFC
      sla_max_duration: 30m
      entry_audit: EVT-J164-PENSION-RECONCILIATION-START
      exit_audit: EVT-J164-PENSION-RECONCILED-003
      cedar_permits_required:
        - identity.my_number_read (purpose=pension_reconciliation)
        - payments.pension_reconcile_read
        - payments.bank_cross_check
      invariants:
        - my_number_purpose_declared_pension_reconciliation
        - my_number_nfc_assertion_present
        - per_purpose_count_today_<=_4
        - bank_feed_cross_check_match_12_of_12
      transitions:
        - to: tax_payment_reconciliation
          on: workflow_studio.step_close
          guard: pension_reconciled

    - name: tax_payment_reconciliation
      description: Estimated quarterly + national health insurance + long-term care
      sla_max_duration: 30m
      entry_audit: EVT-J164-TAX-PAYMENT-RECONCILIATION-START
      exit_audit: EVT-J164-TAX-PAYMENTS-RECONCILED-004
      cedar_permits_required:
        - payments.tax_payment_history_read
      invariants:
        - all_quarterly_payments_verified
        - national_health_insurance_verified
        - long_term_care_insurance_verified
      transitions:
        - to: form_drafting
          on: workflow_studio.step_close
          guard: tax_payments_reconciled
        - to: workflow_paused
          on: workflow_studio.voice_command (intent=pause)

    - name: workflow_paused
      description: User on break; state durably persisted
      sla_max_duration: 12h
      entry_audit: EVT-J164-WORKFLOW-PAUSE-Δ005a
      exit_audit: EVT-J164-WORKFLOW-RESUME-Δ005b
      invariants:
        - state_durably_persisted_to_cell
        - resume_restores_exact_step
      transitions:
        - to: tax_payment_reconciliation
          on: workflow_studio.voice_command (intent=resume)
          guard: tenant_owner_principal

    - name: form_drafting
      description: Year-over-year compare + form draft computation
      sla_max_duration: 1h
      entry_audit: EVT-J164-FORM-DRAFTING-START
      exit_audit: EVT-J164-FORM-DRAFTED-006
      cedar_permits_required:
        - workflow_studio.year_over_year_compare
        - compliance.tax_form_draft
      invariants:
        - year_over_year_panel_rendered
        - public_pension_deduction_correctly_applied
        - medical_deduction_floor_100k_correctly_applied
        - reconstruction_special_tax_2_1_percent
      math_correctness_assertions:
        - income_total: 2207200
        - deductions_total: 638400
        - taxable_income: 1568800
        - income_tax: 37400
        - reconstruction_special: 785
        - refund: 73765
      transitions:
        - to: form_review
          on: workflow_studio.step_close

    - name: form_review
      description: User reviews each section; voice confirmations + in-context help available
      sla_max_duration: 1h
      entry_audit: EVT-J164-FORM-REVIEW-START
      exit_audit: EVT-J164-FORM-REVIEW-006a
      cedar_permits_required:
        - compliance.tax_form_review
        - workflow_studio.in_context_help_invoke
      invariants:
        - section_confirmations_count_>=_5
        - in_context_help_available
        - voice_command_confirmation_supported
      transitions:
        - to: etax_submission
          on: workflow_studio.step_advance
          guard: form_review_complete

    - name: etax_submission
      description: My-Number tap (etax_submission purpose) + face-ID passkey + e-Tax channel open
      sla_max_duration: 30m
      entry_audit: EVT-J164-ETAX-SUBMISSION-START
      exit_audit: EVT-J164-ETAX-SUBMITTED-009
      cedar_permits_required:
        - identity.my_number_read (purpose=etax_submission)
        - identity.passkey_assert
        - compliance.tax_form_submit_etax
      invariants:
        - my_number_purpose_declared_etax_submission
        - passkey_assertion_present
        - form_review_complete_referenced
        - year_over_year_comparison_reviewed_referenced
        - signature_algorithm_JPKI_RSA_2048_with_passkey_counter_sign
        - submission_size_3_2_mb_plus_17_receipts
        - round_trip_<=_60s
      transitions:
        - to: submitted
          on: compliance.tax_form_submit_etax_ack_received
          guard: nta_receipt_number_issued

    - name: submitted
      description: Terminal; receipt archived to drive WORM + diary entry optional
      entry_audit: EVT-J164-ETAX-RECEIPT-ARCHIVED-009a
      invariants:
        - etax_receipt_pdf_archived_to_drive_worm
        - worm_until_2034_02_27
        - my_number_daily_summary_written
        - bleed_detected_false
      optional_continuations:
        - notes_diary_write (for late-life record keeping)
      transitions: []

  # ============================================================
  # Failure transitions
  # ============================================================

  failure_transitions:

    - from: receipt_collection
      to: receipt_collection
      on: ocr_confidence_below_0_85
      remediation: ask_user_to_confirm_via_voice_then_proceed_if_confirmed
      no_audit_required: true

    - from: pension_reconciliation
      to: pension_reconciliation
      on: nfc_failure_attempt_1_or_2
      remediation: surface_calm_retry_message_30s_timeout
      audit: EVT-J164-MY-NUMBER-NFC-RETRY-Δ006a_or_b

    - from: any_state
      to: my_number_ceiling_reached
      on: per_purpose_count_today > 4
      audit: EVT-J164-CEDAR-DENY-MY-NUMBER-CEILING-Δ013
      remediation: surface_calm_message_today_ceiling_reached_retry_tomorrow

    - from: etax_submission
      to: etax_submission_retry
      on: etax_endpoint_timeout
      remediation: save_draft_locally_retry_with_backoff_never_lose_form_state

  # ============================================================
  # SLA summary
  # ============================================================

  sla_summary:
    workflow_open_max: 1h
    receipt_collection_max: 2h
    pension_reconciliation_max: 30m
    tax_payment_reconciliation_max: 30m
    form_drafting_max: 1h
    form_review_max: 1h
    etax_submission_max: 30m
    total_journey_max: 6h_wall_clock

  # ============================================================
  # Cedar deny coverage
  # ============================================================

  cedar_deny_coverage:
    - external_party_reads_tax_drive_without_succession: EVT-J164-CEDAR-DENY-DAUGHTER-Δ010
    - my_number_access_without_declared_purpose: EVT-J164-CEDAR-DENY-MY-NUMBER-NO-PURPOSE-Δ011
    - etax_submission_without_form_review_complete: EVT-J164-CEDAR-DENY-ETAX-NOT-REVIEWED-Δ012
    - my_number_daily_ceiling_exceeded: EVT-J164-CEDAR-DENY-MY-NUMBER-CEILING-Δ013
    - my_number_export_cross_tenant: EVT-J164-CEDAR-DENY-MY-NUMBER-EXPORT-Δ014

  # ============================================================
  # Accessibility invariants (mandatory throughout)
  # ============================================================

  accessibility_invariants:
    - talkback_coverage_100_percent
    - voice_command_confidence_>=_0.92
    - high_contrast_theme_active
    - large_text_>=_18pt_body_24pt_icon_label
    - haptic_feedback_per_action
    - no_red_only_error_indication
    - 30s_timeouts_throughout
    - no_failure_blame_language
    - "30s_nfc_retry_with_もう一度どうぞ_message"
    - "kanji_hiragana_katakana_byte_exact_preservation"
