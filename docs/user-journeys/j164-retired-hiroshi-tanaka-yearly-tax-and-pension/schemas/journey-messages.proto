// j164 — Hiroshi Tanaka retiree tax-prep messages
// proto3 — Japanese full-width + Kanji + Hiragana + Katakana preserved UTF-8 NFC byte-exact
// ADR-0244 tenant scoping; ADR-0263 audit; ADR-0253 HTTP/3 + QUIC; ADR-0311 personal-tenant

syntax = "proto3";

package oyatie.user_journey.j164;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================
// Common context
// ============================================================

message TenantContext {
  string tenant_id = 1;
  string operating_principal = 2;
  google.protobuf.Timestamp observed_at = 3;
  AccessibilityContext accessibility = 4;
  DeviceContext device = 5;
}

message AccessibilityContext {
  bool talkback_active = 1;
  string talkback_voice = 2;     // "female-voice-2"
  double talkback_speech_rate = 3; // 0.85
  bool high_contrast_theme_active = 4;
  HighContrastPalette high_contrast_palette = 5;
  bool large_text_active = 6;
  int32 large_text_minimum_pt = 7;  // 18
  bool voice_navigation_active = 8;
  bool haptic_feedback_active = 9;
  bool accessibility_substrate_certified = 10;
  string accessibility_substrate_class = 11;  // "jis-x-8341-3"
}

message HighContrastPalette {
  string background = 1;  // "#0A0A0A"
  string foreground = 2;  // "#F0F0F0"
  string accent = 3;       // "#FFD700"
}

message DeviceContext {
  string device_class = 1;
  string device_model = 2;
  double screen_inches = 3;
  int32 screen_brightness = 4;
  int32 color_temperature_kelvin = 5;
}

// ============================================================
// Workflow studio
// ============================================================

message WorkflowOpenRequest {
  TenantContext context = 1;
  string workflow_id = 2;
  string workflow_template = 3;
  string fiscal_year = 4;
  string fiscal_year_japanese_era = 5;
  google.protobuf.Timestamp opened_at = 6;
}

message WorkflowVoiceCommand {
  string workflow_id = 1;
  string voice_transcript_utf8_nfc = 2;   // "進む", "戻る", "確認", "詳しく", "休憩", "続ける"
  string voice_transcript_romanized = 3;
  double voice_confidence = 4;
  string voice_intent_resolved = 5;      // "next_step", "previous_step", "confirm", "detail", "pause", "resume"
  google.protobuf.Timestamp command_received_at = 6;
}

message WorkflowStepCloseRequest {
  string workflow_id = 1;
  string step_id = 2;
  map<string, double> step_metrics = 3;
  google.protobuf.Timestamp closed_at = 4;
}

message YearOverYearCompareRequest {
  string tenant_id = 1;
  string fiscal_year_current = 2;
  string fiscal_year_prior = 3;
  repeated string compare_sections = 4;
}

message YearOverYearCompareResponse {
  repeated CompareSection sections = 1;
}

message CompareSection {
  string section_name = 1;
  repeated CompareRow rows = 2;
}

message CompareRow {
  string label_utf8_nfc = 1;
  int64 prior_amount_jpy = 2;
  int64 current_amount_jpy = 3;
  int64 delta_jpy = 4;
  string delta_class = 5;     // "first_appearance", "increase", "decrease", "no_change"
  string talkback_delta_phrase = 6;  // "プラス2万円", "差額なし"
  bool highlight_gold_underline = 7;
}

// ============================================================
// Receipt OCR
// ============================================================

message ReceiptOcrRequest {
  string tenant_id = 1;
  bytes image_jpeg = 2;
  int64 image_size_bytes = 3;
  string ocr_class = 4;  // "japanese_medical_receipt"
  repeated string expected_fields = 5;
  google.protobuf.Timestamp captured_at = 6;
}

message ReceiptOcrResponse {
  ReceiptOcrResult result = 1;
}

message ReceiptOcrResult {
  string payee_name_utf8_nfc = 1;       // "倉敷中央病院 眼科"
  string payee_name_romanized = 2;
  string date_iso = 3;                  // "2026-01-18"
  string date_japanese_era = 4;          // "reiwa-8-01-18"
  int64 amount_jpy = 5;
  string category_inferred = 6;          // "medical_outpatient"
  map<string, double> confidence_per_field = 7;
}

// ============================================================
// My-Number identity
// ============================================================

message MyNumberCardNfcAuthRequest {
  string tenant_id = 1;
  string subject_principal = 2;
  string purpose_scope = 3;              // MUST be in declared whitelist
  bool purpose_declared_in_audit = 4;
  double nfc_signal_dbm = 5;
  int32 nfc_read_duration_ms = 6;
  bool nfc_read_complete = 7;
  string failure_reason = 8;             // for retry telemetry
  string user_message_class = 9;         // "calm_retry_no_blame"
}

message MyNumberCardNfcAuthResponse {
  string state = 1;                       // "success", "retry_requested", "ceiling_reached"
  int32 timeout_seconds_remaining = 2;
  string card_certificate_serial = 3;     // "JPKI-****-7842"
  bool card_validity_ok = 4;
  google.protobuf.Timestamp authenticated_at = 5;
  int32 per_purpose_count_today = 6;
  int32 daily_ceiling = 7;
}

message MyNumberAccessLogSummary {
  string tenant_id = 1;
  string subject_principal = 2;
  string date_iso = 3;
  repeated MyNumberAccessLogEntry accesses = 4;
  int32 access_count = 5;
  int32 daily_ceiling = 6;
  bool bleed_detected = 7;
}

message MyNumberAccessLogEntry {
  string purpose_scope = 1;
  google.protobuf.Timestamp accessed_at = 2;
  string audit_event_id = 3;
}

// ============================================================
// Pension reconciliation
// ============================================================

message PensionReconcileRequest {
  string tenant_id = 1;
  string principal = 2;
  string fiscal_year = 3;
  string pension_authority = 4;          // "jp-jps-nippon-nenkin-kiko"
  string my_number_token_short_lived = 5;
  string scope = 6;
  google.protobuf.Timestamp scope_expires_at = 7;
}

message PensionReconcileResponse {
  string subject_pension_record_id_anonymized = 1;
  repeated MonthlyDeposit monthly_deposits = 2;
  int64 annual_total_jpy = 3;
  int64 withholding_tax_jpy = 4;
}

message MonthlyDeposit {
  string month = 1;               // "2026-01"
  int64 amount_jpy = 2;
  string deposit_date_iso = 3;
}

// ============================================================
// Tax form drafting + submission
// ============================================================

message TaxFormDraftRequest {
  string tenant_id = 1;
  string principal = 2;
  string form_class = 3;              // "kakutei_shinkoku_b"
  string fiscal_year = 4;
  IncomeSummary income = 5;
  DeductionsSummary deductions = 6;
  WithholdingSummary withholding = 7;
  google.protobuf.Timestamp compute_at = 8;
}

message IncomeSummary {
  int64 public_pension_jpy = 1;
  int64 miscellaneous_income_jpy = 2;
  int64 interest_income_jpy = 3;
}

message DeductionsSummary {
  int64 social_insurance_premium_jpy = 1;
  int64 medical_expense_jpy_eligible = 2;
  int64 basic_deduction_jpy = 3;
}

message WithholdingSummary {
  int64 pension_withholding_jpy = 1;
  int64 estimated_tax_paid_jpy = 2;
}

message TaxFormDraftResponse {
  string form_draft_id = 1;
  int64 income_total_jpy = 2;
  int64 deductions_total_jpy = 3;
  int64 taxable_income_jpy = 4;
  int64 income_tax_jpy = 5;
  int64 reconstruction_special_tax_jpy = 6;
  int64 total_tax_jpy = 7;
  int64 withholding_total_jpy = 8;
  int64 refund_jpy = 9;
}

message ETaxSubmitRequest {
  string tenant_id = 1;
  string form_draft_id = 2;
  string etax_endpoint = 3;
  string channel_cell = 4;
  string signature_alg = 5;           // "JPKI-RSA-2048-with-passkey-counter-sign"
  repeated ETaxAttachment attachments = 6;
  google.protobuf.Timestamp submitted_at = 7;
}

message ETaxAttachment {
  string role = 1;
  int64 size_bytes = 2;
  int32 count = 3;
}

message ETaxAcknowledgment {
  string receipt_number = 1;          // "20270227-1414-008-T-7842965"
  google.protobuf.Timestamp received_at = 2;
  string filer_name_utf8_nfc = 3;     // "田中 浩"
  string filer_my_number_short = 4;
  string form_class = 5;
  string fiscal_year = 6;
  int64 refund_jpy = 7;
  string refund_expected_at_iso = 8;
}

// ============================================================
// Notes (diary)
// ============================================================

message NotesVoiceDictateRequest {
  string tenant_id = 1;
  string principal = 2;
  string notebook_id = 3;             // "late-life-record-keeping"
  string voice_transcript_utf8_nfc = 4;
  double voice_confidence = 5;
  bool succession_ready_tag = 6;
  string series_continuation = 7;     // "annual-letter-to-sachiko"
  google.protobuf.Timestamp dictated_at = 8;
}

// ============================================================
// Drive WORM
// ============================================================

message DriveWormWriteRequest {
  string drive_room = 1;
  string filename_utf8_nfc = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  bool worm = 6;
  google.protobuf.Timestamp worm_until = 7;
  string retention_authority = 8;     // "JP-Income-Tax-Act-148"
}

// ============================================================
// Audit
// ============================================================

message AuditEvent {
  string event_id = 1;                // "EVT-J164-*"
  TenantContext context = 2;
  string event_class = 3;
  bytes payload_canonical_cbor = 4;
}

message CedarDenyEvent {
  string event_id = 1;                // "EVT-J164-CEDAR-DENY-*"
  string principal = 2;
  string action = 3;
  string resource = 4;
  string forbid_rule_id = 5;
  string reason = 6;
  google.protobuf.Timestamp observed_at = 7;
}
