---
doc_class: User-Journey-Migration-State-Machine
journey_id: j180-migration-from-atlassian-jira-confluence-to-oyatie-workspace
date: 2026-05-20
authority_tier: 2

machine:
  id: j180-vendor-migration
  name: j180-migration-from-atlassian-jira-confluence-to-oyatie-workspace
  incumbent: Atlassian Jira Software plus Confluence
  target: Oyatie workspace
  initial_state: planned
  terminal_states:
    - oyatie_active
    - rolled_back

states:
  - id: planned
    description: Migration scope, source objects, ADRs, and rollback plan are approved.
    transitions:
      - to: source_extracting
        when: claim_accepted_and_credentials_bound
        audit_event: EVT-J180-PLANNED-001
  - id: source_extracting
    description: Jira Cloud REST export plus Confluence space export with attachment manifest.
    transitions:
      - to: extract_verified
        when: row_counts_and_hashes_match_manifest
        audit_event: EVT-J180-EXTRACT-002
  - id: extract_verified
    description: Source objects are complete and immutable for migration purposes.
    transitions:
      - to: mapping_applied
        when: all_required_field_mappings_signed
        audit_event: EVT-J180-MAPPING-003
  - id: mapping_applied
    description: Field map is loaded into the migration controller.
    transitions:
      - to: projection_loaded
        when: oyatie.workspace.delivery_graph_projection_v1_load_complete
        audit_event: EVT-J180-PROJECTION-004
  - id: projection_loaded
    description: Oyatie projection is populated and visible to replacement surfaces.
    transitions:
      - to: parallel_running
        when: replacement_surfaces_pass_smoke_tests
        audit_event: EVT-J180-PARALLEL-005
  - id: parallel_running
    description: one-sprint parallel-run with frozen workflow-scheme changes and Confluence read-only mirror.
    transitions:
      - to: go_no_go_ready
        when: p0_delta_count_zero_and_p1_deltas_owned
        audit_event: EVT-J180-GONOGO-006
      - to: rolled_back
        when: p0_delta_unresolved_or_rollback_ordered
        audit_event: EVT-J180-ROLLBACK-007
  - id: go_no_go_ready
    description: Executive go/no-go card is complete.
    transitions:
      - to: incumbent_read_only
        when: executive_approval_and_rollback_rehearsal_passed
        audit_event: EVT-J180-FREEZE-008
  - id: incumbent_read_only
    description: Incumbent writes are frozen and Oyatie receives new writes.
    transitions:
      - to: oyatie_active
        when: first_live_business_cycle_passes
        audit_event: EVT-J180-ACTIVE-009
  - id: oyatie_active
    description: Oyatie is active and incumbent is retained as read-only archive.
    is_terminal: true
  - id: rolled_back
    description: Incumbent resumes write authority and Oyatie batch is quarantined or compensated.
    is_terminal: true

invariants:
  - SOX Section 404 software change-control evidence for release approvals
  - SOC 2 CC8.1 change management and CC6.6 access-control evidence
  - GDPR Articles 30 and 32 for employee and customer data in work items and pages
  - SEC Rule 17a-4(f) WORM retention for regulated engineering communications where enabled
  - ISO/IEC 27001 Annex A 5.37 documented operating procedures and A 8.15 logging
  - Every event includes tenant_id, source_system, source_hash, projection_name, cedar_decision_id, and rollback_plan_id.
  - No inline vendor credential appears in logs, schemas, events, or dashboard payloads.
