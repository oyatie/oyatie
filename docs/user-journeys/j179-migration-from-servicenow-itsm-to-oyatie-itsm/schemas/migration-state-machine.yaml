---
doc_class: User-Journey-Migration-State-Machine
journey_id: j179-migration-from-servicenow-itsm-to-oyatie-itsm
date: 2026-05-20
authority_tier: 2

machine:
  id: j179-vendor-migration
  name: j179-migration-from-servicenow-itsm-to-oyatie-itsm
  incumbent: ServiceNow ITSM
  target: Oyatie ITSM
  initial_state: planned
  terminal_states:
    - oyatie_active
    - rolled_back

states:
  - id: planned
    description: Migration scope, source objects, ADRs, and rollback plan are approved.
    transitions:
      - to: source_extracting
        when: claim_accepted_and_credentials_bound
        audit_event: EVT-J179-PLANNED-001
  - id: source_extracting
    description: ServiceNow Table API export plus attachment and journal-field replay.
    transitions:
      - to: extract_verified
        when: row_counts_and_hashes_match_manifest
        audit_event: EVT-J179-EXTRACT-002
  - id: extract_verified
    description: Source objects are complete and immutable for migration purposes.
    transitions:
      - to: mapping_applied
        when: all_required_field_mappings_signed
        audit_event: EVT-J179-MAPPING-003
  - id: mapping_applied
    description: Field map is loaded into the migration controller.
    transitions:
      - to: projection_loaded
        when: oyatie.itsm.service_graph_projection_v1_load_complete
        audit_event: EVT-J179-PROJECTION-004
  - id: projection_loaded
    description: Oyatie projection is populated and visible to replacement surfaces.
    transitions:
      - to: parallel_running
        when: replacement_surfaces_pass_smoke_tests
        audit_event: EVT-J179-PARALLEL-005
  - id: parallel_running
    description: 14-day ITSM parallel-run window with incident SLA, change calendar, problem RCA, and CMDB drift checks.
    transitions:
      - to: go_no_go_ready
        when: p0_delta_count_zero_and_p1_deltas_owned
        audit_event: EVT-J179-GONOGO-006
      - to: rolled_back
        when: p0_delta_unresolved_or_rollback_ordered
        audit_event: EVT-J179-ROLLBACK-007
  - id: go_no_go_ready
    description: Executive go/no-go card is complete.
    transitions:
      - to: incumbent_read_only
        when: executive_approval_and_rollback_rehearsal_passed
        audit_event: EVT-J179-FREEZE-008
  - id: incumbent_read_only
    description: Incumbent writes are frozen and Oyatie receives new writes.
    transitions:
      - to: oyatie_active
        when: first_live_business_cycle_passes
        audit_event: EVT-J179-ACTIVE-009
  - id: oyatie_active
    description: Oyatie is active and incumbent is retained as read-only archive.
    is_terminal: true
  - id: rolled_back
    description: Incumbent resumes write authority and Oyatie batch is quarantined or compensated.
    is_terminal: true

invariants:
  - SOX Section 404 IT general controls for production change approval
  - NYDFS 23 NYCRR 500 incident response and audit trail obligations
  - GDPR Articles 32 and 33 security processing and breach notification evidence
  - ISO/IEC 20000-1 service management control evidence
  - NIST SP 800-53 CM-3, IR-4, and AU-12 control families
  - Every event includes tenant_id, source_system, source_hash, projection_name, cedar_decision_id, and rollback_plan_id.
  - No inline vendor credential appears in logs, schemas, events, or dashboard payloads.
