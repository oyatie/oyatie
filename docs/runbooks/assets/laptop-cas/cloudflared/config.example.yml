# Cloudflare Tunnel example for laptop CAS lab.
# BAN: do not expose :50051/:50052 without Access and/or mTLS end-to-end.
# TUNNEL_TOKEN / credentials JSON are founder secrets — never commit.
#
# Install: brew install cloudflare/cloudflare/cloudflared
# Create tunnel (founder): cloudflared tunnel create oyatie-cas-lab
# Route DNS: cloudflared tunnel route dns oyatie-cas-lab cas-writer.lab.oyatie.dev
#            cloudflared tunnel route dns oyatie-cas-lab cas-reader.lab.oyatie.dev
# Run: cloudflared tunnel --config ~/oyatie-cas/cloudflared/config.yml run
#
# Prefer Cloudflare Access (Service Auth / mTLS) in front of these hostnames.
# NativeLink still requires client certs — Access is belt; mTLS is suspenders.

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /Users/REPLACE/oyatie-cas/cloudflared/credentials.json

ingress:
  # Writer — trusted CI / local Buck2 with writer client cert only
  - hostname: cas-writer.lab.oyatie.dev
    service: https://127.0.0.1:50051
    originRequest:
      noTLSVerify: true # lab self-signed server leaf; replace with public CA later
      http2Origin: true
  # Reader — canary warm-probe / read-only identities
  - hostname: cas-reader.lab.oyatie.dev
    service: https://127.0.0.1:50052
    originRequest:
      noTLSVerify: true
      http2Origin: true
  - service: http_status:404
