# EXAMPLE ONLY — do not enable as merge-required.
# Absorbed onto integ/ci (.github/workflows/) only after a quiet window on #1646.
# Targets laptop CAS via Cloudflare Tunnel hostnames; fleet warm_reads_licensed stays false.
name: cache-integrity-canary-lab

on:
  workflow_dispatch:
    inputs:
      prelicense_probe:
        description: Explicit manual warm proof against laptop CAS (still does not flip license)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cache-integrity-canary-lab
  cancel-in-progress: false

jobs:
  cold-lab:
    name: cold from-empty + lab endpoint probe (non-authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      - name: Note lab endpoint (secrets required for mTLS)
        run: |
          set -euo pipefail
          echo "OYA_CAS_LAB_READER=${OYA_CAS_LAB_READER:-grpcs://cas-reader.lab.oyatie.dev}"
          echo "warm_reads_licensed must remain false until GREEN + reviewed license edit"
          echo "This job is OUTSIDE oya-ci-required — observation≠APPROVE"
        env:
          OYA_CAS_LAB_READER: ${{ vars.OYA_CAS_LAB_READER }}
      # Full cold build + warm-probe steps reuse cache-integrity-canary.yml once
      # lab reader secrets and tunnel are live. Scaffold stops at documentation + dispatch shell.
