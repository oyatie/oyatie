# Oyatie laptop CAS lab — NativeLink cache-only (ADR-0560 posture).
# Host: macOS arm64 always-on. Persist under ~/oyatie-cas/data (not iCloud).
# BAN anonymous gRPC: writer :50051 and reader :50052 require mTLS client certs.
#
# Start:
#   cd ~/oyatie-cas && docker compose up -d
# Health (plaintext ops only):
#   curl -sf http://127.0.0.1:50061/status || true
#
# Image digest pinned to the same v1.6.2 used by storage/adapters/nativelink.

name: oyatie-cas-lab

services:
  nativelink-cas:
    image: ghcr.io/tracemachina/nativelink:v1.6.2@sha256:6750ab337eb1835ebe8452ddb76786641a80e23de71d8a5e630469399219b6ea
    container_name: oyatie-nativelink-cas
    restart: unless-stopped
    # Image ENTRYPOINT is the nativelink binary (no shell). Pass config only —
    # same as storage/adapters/nativelink/nativelink-cas.k8s.yaml args.
    command: ["/config/cas.json"]
    ports:
      - "50051:50051" # writer (mTLS)
      - "50052:50052" # reader (mTLS, AC read_only)
      - "50061:50061" # ops/health (bind localhost-only in production tunnel posture)
    volumes:
      - ./config/cas.json:/config/cas.json:ro
      - ./tls:/tls:ro
      - ./data/cas-content:/data/cas-content
      - ./data/cas-tmp:/data/cas-tmp
      - ./data/ac-content:/data/ac-content
      - ./data/ac-tmp:/data/ac-tmp
      - cas-fast-cache:/cache
    environment:
      - RUST_LOG=info
    # Desktop posture: give the cache real headroom
    # Note: image has no shell/curl — do not use in-container healthcheck.
    # Host probe: curl -sf http://127.0.0.1:50061/status  OR  ./canary/probe-lab-endpoint.sh
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Optional local S3-compatible backend for a later store switch (not wired into
  # cas.json yet — filesystem first). Start with: docker compose --profile minio up -d
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: oyatie-cas-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: oyatiecas
      MINIO_ROOT_PASSWORD: change-me-lab-only
    volumes:
      - minio-data:/data

volumes:
  cas-fast-cache:
  minio-data:
