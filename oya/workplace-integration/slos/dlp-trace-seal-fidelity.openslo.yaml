apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workplace-integration-dlp-trace-seal-fidelity
  displayName: Workplace Integration Dlp Trace Seal Fidelity
  labels:
    service: workplace-integration
    adr: ADR-0320
spec:
  description: Workplace Integration SLO for dlp-trace-seal-fidelity using route=/workplace/dlp-traces
  service: workplace-integration
  indicator:
    metadata:
      name: oya-workplace-integration-dlp-trace-seal-fidelity-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_esign_initiate_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_esign_initiate_total[5m]))
  objectives:
    - displayName: Dlp Trace Seal Fidelity
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "workplace-integration.slo.dlp-trace-seal-fidelity"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
