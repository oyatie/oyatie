# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (Wave 15-ZF-15 per ADR-0346, ADR-0347, ADR-0348, ADR-0349)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: workplace-integration-autosharding-hot-split-latency
  displayName: "workplace-integration autosharding HOT-SPLIT p99 latency"
  labels:
    microservice: workplace-integration
    doctrine_wave: wave-15-zf-15
    adr_0346: historical-bridge-superseded-by-d-cicd-authority
    adr_0347: central-governance-current-truth
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: historical-substrate-context-subordinate-to-d-cicd-authority
    automation_mode: dynamic_sharding
    automation_event: hot_split
    enforced_by: D-GOVERNANCE-CENTRAL
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_purpose: "Historical bridge only; live merge authority is branch-protected oya-ci-required and local output is transition evidence."
    adr_0347_enforced_by: "D-GOVERNANCE-CENTRAL"
    adr_0348_enforced_by: "D-GOVERNANCE-CENTRAL; D-CICD-AUTHORITY"
    adr_0349_enforced_by: "D-CICD-AUTHORITY; D-CLOUD-NATIVE; D-GOVERNANCE-CENTRAL"
spec:
  description: "ADR-0348 makes DYNAMIC SHARDING split hot shards when shard p99 latency exceeds SLO or utilization exceeds 80%; this SLO bounds workplace-integration hot-split latency and requires audit-chain emission under ADR-0348, governance lane vocabulary under ADR-0347, cloud CI authority under D-CICD-AUTHORITY, and subordinate delivery context under ADR-0349."
  indicator:
    metadata:
      name: workplace-integration-autosharding-hot-split-latency-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_hot_split_duration_seconds_bucket{microservice="workplace-integration",automation_event="hot_split"}[5m])) by (le))'
  objectives:
    - displayName: "99% of HOT-SPLIT events complete within 300s over 30d"
      target: 0.99
      op: lte
      value: 300
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: workplace-integration-autosharding-rebalance-migration-time
  displayName: "workplace-integration AUTO-REBALANCE migration p99 duration"
  labels:
    microservice: workplace-integration
    doctrine_wave: wave-15-zf-15
    adr_0346: historical-bridge-superseded-by-d-cicd-authority
    adr_0347: central-governance-current-truth
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: historical-substrate-context-subordinate-to-d-cicd-authority
    automation_mode: auto_rebalance
    automation_event: tenant_migration
    enforced_by: D-GOVERNANCE-CENTRAL
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_enforced_by: "D-CICD-AUTHORITY; D-CLOUD-NATIVE"
    adr_0347_enforced_by: "D-GOVERNANCE-CENTRAL"
    adr_0348_enforced_by: "D-GOVERNANCE-CENTRAL; D-CICD-AUTHORITY"
    adr_0349_purpose: "Historical substrate context only; oya-ci-required is the live CI authority until owned oya-ci cutover."
spec:
  description: "ADR-0348 makes AUTO-REBALANCE migrate tenants from hot cells to cooler cells while honoring residency and compliance packs; this SLO bounds workplace-integration rebalance migration time and requires observable, reversible, audit-chain-emitting automation with central governance evidence and branch-protected `oya-ci-required` acceptance."
  indicator:
    metadata:
      name: workplace-integration-autosharding-rebalance-migration-time-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_rebalance_migration_duration_seconds_bucket{microservice="workplace-integration",automation_event="tenant_migration"}[5m])) by (le, migration_distance))'
  objectives:
    - displayName: "99% of intra-region AUTO-REBALANCE migrations complete within 600s over 30d"
      target: 0.99
      op: lte
      value: 600
    - displayName: "99% of cross-region AUTO-REBALANCE migrations complete within 3600s over 30d"
      target: 0.99
      op: lte
      value: 3600
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
