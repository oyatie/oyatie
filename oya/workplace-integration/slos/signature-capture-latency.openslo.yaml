apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workplace-integration-signature-capture-latency
  displayName: Workplace Integration Signature Capture Latency
  labels:
    service: workplace-integration
    adr: ADR-0320
spec:
  description: Workplace Integration SLO for signature-capture-latency using route=/workplace/esign/sessions/sign
  service: workplace-integration
  indicator:
    metadata:
      name: oya-workplace-integration-signature-capture-latency-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_offer_generate_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_workplace_integration_offer_generate_total[5m]))
  objectives:
    - displayName: Signature Capture Latency
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "workplace-integration.slo.signature-capture-latency"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
