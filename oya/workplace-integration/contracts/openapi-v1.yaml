components:
  x-oyatie-sharding-automation-event-surface:
    microservice: workplace-integration
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Current SSOT replacement: branch-protected oya-ci-required is the live cloud CI merge authority; local command output is transition evidence only.
        enforced_by:
          - D-CICD-AUTHORITY
          - D-CLOUD-NATIVE
          - D-GOVERNANCE-CENTRAL
      ADR-0347:
        purpose: >-
          Current SSOT replacement: central governance vocabulary supersedes scattered lane naming in active authority surfaces.
        enforced_by:
          - D-GOVERNANCE-CENTRAL
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - D-GOVERNANCE-CENTRAL
          - D-CICD-AUTHORITY
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Current SSOT replacement: one canonical oya-ci-required authority remains live until the owned oya-ci cutover; delivery substrates are subordinate and not parallel merge authorities.
        enforced_by:
          - D-CICD-AUTHORITY
          - D-CLOUD-NATIVE
          - D-GOVERNANCE-CENTRAL
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  schemas:
    WorkplaceAgreementCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, idempotency_key, action, resource]
      properties:
        tenant_id:
          type: string
          pattern: '^tenant_[a-z0-9_]+$'
          examples: [tenant_acme]
        sub_scope_path:
          type: string
          examples: [workplace.hr.offers]
        principal_id:
          type: string
          examples: [principal_01h]
        idempotency_key:
          type: string
          examples: [idem_01h_marketplace]
        action:
          type: string
          examples: [workplace-integration.WorkplaceAgreement.mutate]
        resource:
          type: object
          additionalProperties: true
    WorkplaceAgreementReceipt:
      type: object
      required: [accepted, audit_chain_ref, state]
      properties:
        accepted:
          type: boolean
        audit_chain_ref:
          type: string
        state:
          type: string
          enum: [accepted, denied, deferred, replay_required, compensated]
