openapi: 3.2.0
info:
  title: Workplace Integration API
  version: 1.0.0
  summary: Tenant-scoped WorkplaceAgreement API for workplace agreement, e-sign, roster, and regulated workforce integration substrate
  x-related-adrs:
    - ADR-0105
    - ADR-0131
    - ADR-0243
    - ADR-0244
    - ADR-0263
    - ADR-0319
    - ADR-0320
  x-naming-justifications:
    bnf_v4: "service.action.resource grammar uses workplace-integration.WorkplaceAgreement.<action>"
    layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.oyatie.example/workplace-integration/v1
    description: Production tenant-scoped endpoint
paths:
  /workplace/esign/sessions:
    post:
      operationId: workplace_integration__workplace_esign_sessions_post
      summary: initiate evidence-bound e-sign sessions
      tags: [workplace-integration]
      x-cedar-action: workplace-integration.WorkplaceAgreement.mutate
      x-audit-event: WorkplaceESignSessionCreated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkplaceAgreementCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkplaceAgreementReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /workplace/esign/sessions/{session_id}/sign:
    post:
      operationId: workplace_integration__workplace_esign_sessions_session_id_sign_post
      summary: record signer intent and signature proof
      tags: [workplace-integration]
      x-cedar-action: workplace-integration.WorkplaceAgreement.mutate
