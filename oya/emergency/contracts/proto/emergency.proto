// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

// Emergency Department Information System (ED-IS) gRPC contract.
// Authority: ADR-0332 (in flight) | ADR-0145 (direct gRPC + 3 invariants) |
//            ADR-0632 (internal-only gRPC over HTTP/2).
//
// Owner: emergency-medicine-platform-engineer
// Stability: v0-draft (not yet stable; subject to ADR-controlled change).

package oyatie.emergency.v0;

option go_package = "github.com/oyatie/microservices/emergency/contracts/protogen;emergencyv0";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =====================================================================
// EnvelopeMetadata — accompanies every request/response/event.
// =====================================================================
message EnvelopeMetadata {
  string tenant_id = 1;
  string cell_id = 2;
  string trace_id = 3;
  string correlation_id = 4;
  string causation_id = 5;
  string actor_id = 6;
  string idempotency_key = 7;
}

// =====================================================================
// Tracking Board — stream-friendly RPC for dashboard fanout.
// =====================================================================
service TrackingBoard {
  // Subscribe to live board diffs for a zone (or all zones).
  rpc BoardSubscribe (BoardSubscribeRequest) returns (stream BoardEvent);
  // Charge-nurse swaps bed assignment.
  rpc BedReassign (BedReassignRequest) returns (BedReassignResponse);
  // Mark bed status (cleaning / out-of-service / available).
  rpc BedStatusUpdate (BedStatusUpdateRequest) returns (BedStatusUpdateResponse);
}

message BoardSubscribeRequest {
  EnvelopeMetadata metadata = 1;
  string facility_id = 2;
  repeated string zones = 3;
}

message BoardEvent {
  EnvelopeMetadata metadata = 1;
  google.protobuf.Timestamp captured_at = 2;
  oneof kind {
    BoardCell cell_update = 3;
    BoardZoneSnapshot zone_snapshot = 4;
    BoardFullSnapshot full_snapshot = 5;
  }
}

message BoardCell {
  string bed_id = 1;
  string zone_id = 2;
  BoardCellState state = 3;
  string patient_placeholder_name = 4;
  int32 acuity = 5;
  int32 elapsed_minutes = 6;
  repeated string pending_tasks = 7;
  repeated IsolationFlag isolation = 8;
  bool boarding = 9;
}

enum BoardCellState {
  BOARD_CELL_STATE_UNSPECIFIED = 0;
  BOARD_CELL_STATE_EMPTY = 1;
  BOARD_CELL_STATE_AWAITING_ROOM = 2;
  BOARD_CELL_STATE_ROOMED = 3;
  BOARD_CELL_STATE_IN_EVALUATION = 4;
  BOARD_CELL_STATE_AWAITING_RESULT = 5;
  BOARD_CELL_STATE_AWAITING_DISPOSITION = 6;
  BOARD_CELL_STATE_BOARDING = 7;
  BOARD_CELL_STATE_CLEANING = 8;
  BOARD_CELL_STATE_OUT_OF_SERVICE = 9;
}

enum IsolationFlag {
  ISOLATION_FLAG_UNSPECIFIED = 0;
  ISOLATION_FLAG_AIRBORNE = 1;
  ISOLATION_FLAG_CONTACT = 2;
  ISOLATION_FLAG_DROPLET = 3;
  ISOLATION_FLAG_BEHAVIORAL_SAFE = 4;
}

message BoardZoneSnapshot {
  string zone_id = 1;
  repeated BoardCell cells = 2;
}

message BoardFullSnapshot {
  repeated BoardZoneSnapshot zones = 1;
}

message BedReassignRequest {
  EnvelopeMetadata metadata = 1;
  string encounter_id = 2;
  string prior_bed_id = 3;
  string new_bed_id = 4;
}

message BedReassignResponse {
  bool success = 1;
  string decision_id = 2;
}

message BedStatusUpdateRequest {
  EnvelopeMetadata metadata = 1;
  string bed_id = 2;
  BoardCellState new_state = 3;
  string reason = 4;
}

message BedStatusUpdateResponse {
  bool success = 1;
}

// =====================================================================
// Metrics — subscribe to door-to-X and LWBS / boarding telemetry.
// =====================================================================
service Metrics {
  rpc MetricsSubscribe (MetricsSubscribeRequest) returns (stream MetricsSnapshot);
}

message MetricsSubscribeRequest {
  EnvelopeMetadata metadata = 1;
  string facility_id = 2;
  int32 publish_interval_seconds = 3;
}

message MetricsSnapshot {
  EnvelopeMetadata metadata = 1;
  google.protobuf.Timestamp captured_at = 2;
  double door_to_doctor_median_minutes = 3;
  double door_to_doctor_p95_minutes = 4;
  double door_to_ct_median_minutes = 5;
  double door_to_needle_median_minutes = 6;
  double door_to_balloon_median_minutes = 7;
  double door_to_disposition_median_minutes = 8;
  double ed_los_p95_minutes = 9;
  double lwbs_rate_percent = 10;
  int32 boarding_4h_count = 11;
  int32 boarding_24h_count = 12;
}

// =====================================================================
// MCI — Mass-casualty incident coordination.
// =====================================================================
service Mci {
  rpc MciActivate (MciActivateRequest) returns (MciActivateResponse);
  rpc MciDeactivate (MciDeactivateRequest) returns (MciDeactivateResponse);
  rpc MciTriageWrite (MciTriageWriteRequest) returns (MciTriageWriteResponse);
  rpc MciPatientReconcile (MciPatientReconcileRequest) returns (MciPatientReconcileResponse);
}

message MciActivateRequest {
  EnvelopeMetadata metadata = 1;
  string facility_id = 2;
  string incident_name = 3;
  TriageMode triage_mode = 4;
  bool drill_mode = 5;
}

message MciActivateResponse {
  string incident_id = 1;
  google.protobuf.Timestamp activated_at = 2;
}

enum TriageMode {
  TRIAGE_MODE_UNSPECIFIED = 0;
  TRIAGE_MODE_START = 1;
  TRIAGE_MODE_SALT = 2;
}

message MciDeactivateRequest {
  EnvelopeMetadata metadata = 1;
  string incident_id = 2;
  bool after_action_report_flag = 3;
}

message MciDeactivateResponse {
  google.protobuf.Timestamp deactivated_at = 1;
}

message MciTriageWriteRequest {
  EnvelopeMetadata metadata = 1;
  string incident_id = 2;
  string tag_number = 3;
  oneof category {
    StartCategory start_category = 4;
    SaltCategory salt_category = 5;
  }
  string field_note = 6;
}

enum StartCategory {
  START_CATEGORY_UNSPECIFIED = 0;
  START_CATEGORY_IMMEDIATE = 1;
  START_CATEGORY_DELAYED = 2;
  START_CATEGORY_MINOR = 3;
  START_CATEGORY_EXPECTANT = 4;
  START_CATEGORY_DECEASED = 5;
}

enum SaltCategory {
  SALT_CATEGORY_UNSPECIFIED = 0;
  SALT_CATEGORY_IMMEDIATE = 1;
  SALT_CATEGORY_EXPECTANT = 2;
  SALT_CATEGORY_DELAYED = 3;
  SALT_CATEGORY_MINIMAL = 4;
  SALT_CATEGORY_DEAD = 5;
}

message MciTriageWriteResponse {
  string mci_patient_id = 1;
}

message MciPatientReconcileRequest {
  EnvelopeMetadata metadata = 1;
  string mci_patient_id = 2;
  string canonical_patient_id = 3;
}

message MciPatientReconcileResponse {
  bool success = 1;
  string encounter_id = 2;
}

// =====================================================================
// Protocol — Trauma / Stroke / STEMI / Sepsis activation.
// =====================================================================
service Protocol {
  rpc ProtocolActivate (ProtocolActivateRequest) returns (ProtocolActivation);
  rpc ProtocolDeactivate (ProtocolDeactivateRequest) returns (google.protobuf.Empty);
}

message ProtocolActivateRequest {
  EnvelopeMetadata metadata = 1;
  string encounter_id = 2;
  ProtocolType protocol_type = 3;
  string attesting_actor_id = 4;
  string reason = 5;
}

enum ProtocolType {
  PROTOCOL_TYPE_UNSPECIFIED = 0;
  PROTOCOL_TYPE_TRAUMA = 1;
  PROTOCOL_TYPE_STROKE = 2;
  PROTOCOL_TYPE_STEMI = 3;
  PROTOCOL_TYPE_SEPSIS = 4;
  PROTOCOL_TYPE_MTP = 5;
  PROTOCOL_TYPE_LOCAL = 6;
}

message ProtocolActivation {
  EnvelopeMetadata metadata = 1;
  string activation_id = 2;
  ProtocolType protocol_type = 3;
  google.protobuf.Timestamp activated_at = 4;
  map<string, int32> target_windows_minutes = 5;
}

message ProtocolDeactivateRequest {
  EnvelopeMetadata metadata = 1;
  string activation_id = 2;
  string reason = 3;
  bool false_alert = 4;
}

// =====================================================================
// Disposition — Admit / Transfer / Discharge / AMA / Expired.
// =====================================================================
service Disposition {
  rpc DispositionSet (DispositionSetRequest) returns (DispositionSetResponse);
}

message DispositionSetRequest {
  EnvelopeMetadata metadata = 1;
  string encounter_id = 2;
  DispositionOutcome outcome = 3;
  string admit_destination = 4;
  string transfer_facility = 5;
  string ama_form_ref = 6;
  string expired_cause = 7;
  string attesting_actor_id = 8;
}

enum DispositionOutcome {
  DISPOSITION_OUTCOME_UNSPECIFIED = 0;
  DISPOSITION_OUTCOME_ADMIT = 1;
  DISPOSITION_OUTCOME_TRANSFER = 2;
  DISPOSITION_OUTCOME_DISCHARGE = 3;
  DISPOSITION_OUTCOME_AMA = 4;
  DISPOSITION_OUTCOME_EXPIRED = 5;
}

message DispositionSetResponse {
  string disposition_id = 1;
  google.protobuf.Timestamp set_at = 2;
  bool boarding_opened = 3;
}
