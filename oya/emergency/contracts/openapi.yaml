openapi: 3.1.0
info:
  title: Emergency Department Information System (ED-IS) API
  version: 0.1.0
  description: |
    FHIR R4B-anchored REST surface for the Emergency Department Information
    System µservice. Defines ED-shaped Encounter / EpisodeOfCare / Observation /
    CarePlan / Patient ops plus ED-specific FHIR Operations ($ed-triage,
    $ed-disposition, $ed-protocol-activate, $ed-mci-activate).
  contact:
    name: emergency-medicine-platform-engineer
  license:
    name: Apache-2.0
servers:
  - url: https://ed.{tenant}.{cell}.oyatie.cloud/fhir
    description: ED-IS FHIR surface (per tenant per cell)
    variables:
      tenant:
        default: example-hospital
      cell:
        default: cell-tier2-us-east-1a
tags:
  - name: Encounter
  - name: EpisodeOfCare
  - name: Observation
  - name: CarePlan
  - name: Patient
  - name: EDOperation
  - name: TrackingBoard
  - name: EMSHandoff
  - name: MCI
  - name: Metrics
paths:
  /Encounter:
    post:
      tags: [Encounter]
      summary: Create ED encounter
      description: Creates a FHIR R4B Encounter with class=EMER for an ED arrival.
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Encounter'
      responses:
        '201':
          description: Encounter created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /Encounter/{id}:
    get:
      tags: [Encounter]
      summary: Read ED encounter
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: Encounter found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '404': { $ref: '#/components/responses/NotFound' }
  /Encounter/{id}/$ed-triage:
    post:
      tags: [EDOperation]
      summary: Persist a TriageEncounter and project FHIR Observation(acuity)
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageInput'
      responses:
        '200':
          description: Triage complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResult'
        '409':
          description: Acuity drift requires re-triage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
  /Encounter/{id}/$ed-disposition:
    post:
      tags: [EDOperation]
      summary: Finalize disposition
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositionInput'
      responses:
        '200':
          description: Disposition set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositionResult'
  /Encounter/{id}/$ed-protocol-activate:
    post:
      tags: [EDOperation]
      summary: Activate a clinical protocol (Trauma/Stroke/STEMI/Sepsis/local)
      parameters:
        - $ref: '#/components/parameters/EncounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolActivateInput'
      responses:
        '201':
          description: Protocol activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolActivation'
  /MCI/$activate:
    post:
      tags: [MCI]
      summary: Activate Mass-Casualty Incident mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MciActivateInput'
      responses:
        '201':
          description: MCI mode active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MciActivation'
  /MCI/$deactivate:
    post:
      tags: [MCI]
      summary: Deactivate MCI mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MciDeactivateInput'
      responses:
        '200':
          description: MCI mode closed
  /EpisodeOfCare:
    post:
      tags: [EpisodeOfCare]
      summary: Open ED episode
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/EpisodeOfCare'
      responses:
        '201':
          description: EpisodeOfCare opened
  /Observation:
    post:
      tags: [Observation]
      summary: Record triage observation (LOINC-coded acuity, vitals)
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Observation'
      responses:
        '201':
          description: Observation recorded
  /CarePlan:
    post:
      tags: [CarePlan]
      summary: Open a protocol checklist as a FHIR CarePlan
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/CarePlan'
      responses:
        '201':
          description: CarePlan opened
  /Patient:
    post:
      tags: [Patient]
      summary: Quick-reg / pre-arrival / walk-in patient registration
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '201':
          description: Patient registered
  /ed/board:
    get:
      tags: [TrackingBoard]
      summary: Current tracking board snapshot
      parameters:
        - in: query
          name: zone
          schema: { type: string, enum: [adult-main, adult-fast-track, peds, behavioral, resus, hall] }
      responses:
        '200':
          description: Tracking board snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BoardEventStream'
  /ed/metrics:
    get:
      tags: [Metrics]
      summary: Current metrics snapshot (door-to-X, LWBS, boarding)
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSnapshot'
  /ed/handoff:
    post:
      tags: [EMSHandoff]
      summary: EMS prehospital report ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmsHandoffInput'
      responses:
        '201':
          description: Handoff record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmsHandoff'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: emergency
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    EncounterId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Forbidden:
      description: Forbidden by Cedar policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
  schemas:
    Encounter:
      type: object
      required: [resourceType, status, class, subject]
      properties:
        resourceType: { type: string, const: Encounter }
        id: { type: string, format: uuid }
        status: { type: string, enum: [planned, arrived, triaged, in-progress, onleave, finished, cancelled] }
        class:
          type: object
          properties:
            system: { type: string }
            code: { type: string, enum: [EMER] }
        subject:
          $ref: '#/components/schemas/Reference'
        priority:
          type: object
          properties:
            coding:
              type: array
              items:
                $ref: '#/components/schemas/Coding'
        period:
          $ref: '#/components/schemas/Period'
        tenantId: { type: string }
        cellId: { type: string }
    EpisodeOfCare:
      type: object
      required: [resourceType, status, patient]
      properties:
        resourceType: { type: string, const: EpisodeOfCare }
        id: { type: string }
        status: { type: string, enum: [planned, waitlist, active, onhold, finished, cancelled] }
        patient: { $ref: '#/components/schemas/Reference' }
    Observation:
      type: object
      required: [resourceType, status, code, subject]
      properties:
        resourceType: { type: string, const: Observation }
        id: { type: string }
        status: { type: string, enum: [registered, preliminary, final, amended] }
        code:
          $ref: '#/components/schemas/CodeableConcept'
        subject: { $ref: '#/components/schemas/Reference' }
        valueQuantity:
          $ref: '#/components/schemas/Quantity'
        component:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/CodeableConcept' }
              valueQuantity: { $ref: '#/components/schemas/Quantity' }
    CarePlan:
      type: object
      required: [resourceType, status, intent, subject]
      properties:
        resourceType: { type: string, const: CarePlan }
        id: { type: string }
        status: { type: string, enum: [draft, active, on-hold, revoked, completed, entered-in-error, unknown] }
        intent: { type: string, enum: [proposal, plan, order, option] }
        subject: { $ref: '#/components/schemas/Reference' }
        activity:
          type: array
          items:
            type: object
            properties:
              detail:
                type: object
                properties:
                  description: { type: string }
                  scheduledTiming: { type: object }
                  status: { type: string }
    Patient:
      type: object
      required: [resourceType]
      properties:
        resourceType: { type: string, const: Patient }
        id: { type: string }
        name:
          type: array
          items:
            type: object
            properties:
              use: { type: string }
              text: { type: string }
              family: { type: string }
              given: { type: array, items: { type: string } }
        gender: { type: string, enum: [male, female, other, unknown] }
        birthDate: { type: string, format: date }
        identifier:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              value: { type: string }
        ambulanceArrival: { type: boolean, description: ED-IS extension }
        quickRegPlaceholder: { type: string, description: 'e.g., Trauma-7-Doe' }
    TriageInput:
      type: object
      required: [acuity, vitals, chiefComplaint]
      properties:
        acuity: { type: integer, minimum: 1, maximum: 5, description: ESI level }
        vitals:
          type: object
          properties:
            hr: { type: integer }
            rr: { type: integer }
            sbp: { type: integer }
            dbp: { type: integer }
            spo2: { type: integer }
            temperatureC: { type: number }
            painScore: { type: integer, minimum: 0, maximum: 10 }
        chiefComplaint: { type: string }
        pewsOverride: { type: boolean }
        reassessment: { type: boolean, default: false }
    TriageResult:
      type: object
      properties:
        triageEncounterId: { type: string, format: uuid }
        sequence: { type: integer }
        acuity: { type: integer }
        roomRecommendation: { type: string, nullable: true }
        completedAt: { type: string, format: date-time }
    DispositionInput:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [admit, transfer, discharge, ama, expired] }
        admitDestination: { type: string, nullable: true }
        transferFacility: { type: string, nullable: true }
        amaForm: { type: string, format: uuid, nullable: true }
        expiredCause: { type: string, nullable: true }
        attestation:
          type: object
          properties:
            actorId: { type: string }
            signature: { type: string }
    DispositionResult:
      type: object
      properties:
        dispositionId: { type: string, format: uuid }
        outcome: { type: string }
        setAt: { type: string, format: date-time }
        boardingOpened: { type: boolean }
    ProtocolActivateInput:
      type: object
      required: [protocolType]
      properties:
        protocolType: { type: string, enum: [trauma, stroke, stemi, sepsis, mtp, local] }
        reason: { type: string }
        attestingActorId: { type: string }
    ProtocolActivation:
      type: object
      properties:
        activationId: { type: string, format: uuid }
        protocolType: { type: string }
        activatedAt: { type: string, format: date-time }
        targetWindowsMinutes:
          type: object
          additionalProperties:
            type: integer
    MciActivateInput:
      type: object
      required: [incidentName, facilityId]
      properties:
        incidentName: { type: string }
        facilityId: { type: string }
        triageMode: { type: string, enum: [start, salt] }
        drillMode: { type: boolean, default: false }
        attestingActorId: { type: string }
    MciActivation:
      type: object
      properties:
        incidentId: { type: string, format: uuid }
        activatedAt: { type: string, format: date-time }
        triageMode: { type: string }
        drillMode: { type: boolean }
    MciDeactivateInput:
      type: object
      required: [incidentId, afterActionReportFlag]
      properties:
        incidentId: { type: string, format: uuid }
        afterActionReportFlag: { type: boolean }
        closingActorId: { type: string }
    BoardSnapshot:
      type: object
      properties:
        capturedAt: { type: string, format: date-time }
        zones:
          type: array
          items:
            $ref: '#/components/schemas/BoardZone'
    BoardZone:
      type: object
      properties:
        zoneId: { type: string }
        cells:
          type: array
          items:
            $ref: '#/components/schemas/BoardCell'
    BoardCell:
      type: object
      properties:
        bedId: { type: string }
        state: { type: string, enum: [empty, awaiting-room, roomed, in-evaluation, awaiting-result, awaiting-disposition, boarding, cleaning, out-of-service] }
        patientPlaceholderName: { type: string, nullable: true }
        acuity: { type: integer, nullable: true }
        elapsedMinutes: { type: integer, nullable: true }
        pendingTasks: { type: array, items: { type: string } }
        isolation: { type: array, items: { type: string, enum: [airborne, contact, droplet, behavioral-safe] } }
    BoardEventStream:
      type: string
      description: SSE stream of board diffs
    MetricsSnapshot:
      type: object
      properties:
        capturedAt: { type: string, format: date-time }
        doorToDoctorMedianMinutes: { type: number }
        doorToDoctorP95Minutes: { type: number }
        doorToCtMedianMinutes: { type: number }
        doorToNeedleMedianMinutes: { type: number }
        doorToBalloonMedianMinutes: { type: number }
        doorToDispositionMedianMinutes: { type: number }
        edLengthOfStayP95Minutes: { type: number }
        lwbsRatePercent: { type: number }
        boarding4hCount: { type: integer }
        boarding24hCount: { type: integer }
    EmsHandoffInput:
      type: object
      required: [runNumber, unitId]
      properties:
        runNumber: { type: string }
        unitId: { type: string }
        eta: { type: string, format: date-time }
        mechanismOfInjury: { type: string }
        chiefComplaint: { type: string }
        prehospitalVitals: { type: object }
        fieldInterventions: { type: array, items: { type: string } }
        nemsisPayloadRef: { type: string, nullable: true }
    EmsHandoff:
      type: object
      properties:
        handoffId: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        runNumber: { type: string }
        unitId: { type: string }
    Reference:
      type: object
      properties:
        reference: { type: string }
        display: { type: string }
    Coding:
      type: object
      properties:
        system: { type: string }
        code: { type: string }
        display: { type: string }
    CodeableConcept:
      type: object
      properties:
        coding:
          type: array
          items:
            $ref: '#/components/schemas/Coding'
        text: { type: string }
    Period:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    Quantity:
      type: object
      properties:
        value: { type: number }
        unit: { type: string }
        system: { type: string }
        code: { type: string }
    OperationOutcome:
      type: object
      properties:
        resourceType: { type: string, const: OperationOutcome }
        issue:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [fatal, error, warning, information] }
              code: { type: string }
              diagnostics: { type: string }
