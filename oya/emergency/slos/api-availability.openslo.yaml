apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-api-availability
  displayName: ED-IS API Availability
  labels:
    microservice: emergency
    domain: healthcare.emergency.api
    canonical_adrs: "ADR-0130,ADR-0251,ADR-0332"
spec:
  description: |
    Overall ED-IS API availability target: 99.99% rolling 30-day at the cell.
  service: emergency
  indicator:
    metadata: { name: api-availability }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_emergency_http_requests_total{code!~"5.."}[30d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_emergency_http_requests_total[30d]))
  objectives:
    - displayName: 99.99%
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
