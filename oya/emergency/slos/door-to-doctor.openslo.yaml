apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-door-to-doctor
  displayName: ED Door-to-Doctor
  labels:
    microservice: emergency
    domain: healthcare.emergency
    canonical_adrs: "ADR-0130,ADR-0131,ADR-0251,ADR-0332"
spec:
  description: |
    Time from patient arrival timestamp to the first provider order or
    documentation event. Median ≤ 30 min, p95 ≤ 60 min.
  service: emergency
  indicator:
    metadata:
      name: door-to-doctor-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_door_to_doctor_seconds_bucket{le="1800"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_door_to_doctor_seconds_count[28d]))
  objectives:
    - displayName: median ≤ 30 min
      target: 0.50
      timeSliceTarget: 0.50
    - displayName: p95 ≤ 60 min
      target: 0.95
      timeSliceTarget: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
