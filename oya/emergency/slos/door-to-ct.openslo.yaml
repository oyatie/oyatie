apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-door-to-ct-stroke
  displayName: ED Stroke Door-to-CT
  labels:
    microservice: emergency
    domain: healthcare.emergency.stroke
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from stroke patient arrival to first CT scan complete.
    Target ≤ 25 min per AHA stroke center guidelines.
  service: emergency
  indicator:
    metadata: { name: door-to-ct-stroke }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stroke_door_to_ct_seconds_bucket{le="1500"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stroke_door_to_ct_seconds_count[28d]))
  objectives:
    - displayName: door-to-CT ≤ 25 min
      target: 0.90
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
