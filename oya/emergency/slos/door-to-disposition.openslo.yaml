apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-door-to-disposition
  displayName: ED Door-to-Disposition
  labels:
    microservice: emergency
    domain: healthcare.emergency
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from arrival to disposition close.
    Median ≤ 240 min (4 h).
  service: emergency
  indicator:
    metadata: { name: door-to-disposition }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_door_to_disposition_seconds_bucket{le="14400"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_door_to_disposition_seconds_count[28d]))
  objectives:
    - displayName: median ≤ 240 min
      target: 0.50
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
