apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-door-to-balloon-stemi
  displayName: ED STEMI Door-to-Balloon
  labels:
    microservice: emergency
    domain: healthcare.emergency.stemi
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from STEMI arrival to PCI device deployment.
    Target ≤ 90 min per ACC/AHA STEMI guideline.
  service: emergency
  indicator:
    metadata: { name: door-to-balloon }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stemi_door_to_balloon_seconds_bucket{le="5400"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stemi_door_to_balloon_seconds_count[28d]))
  objectives:
    - displayName: door-to-balloon ≤ 90 min
      target: 0.90
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
