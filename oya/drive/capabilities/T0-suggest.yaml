# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T0-suggest capabilities — drive µservice
#
# Autonomy Tier 0: "suggest only; human accepts/rejects". Drive surfaces here are
# safe-by-construction because their effect is a UI suggestion the user can accept
# or ignore. No autonomous action; no data flow change.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 §"autonomy tiering".
# Per ADR-0140 (retired per ADR-0145) Cedar policy enforcement.
# Per EU AI Act Art. 50 transparency (AI-generated suggestions labelled).

doc_class: AutonomyTierCatalog
microservice: drive
tier: T0
owner_team: axis-drive + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T0-drive-suggest-folder
    name: "Folder-placement suggestion at upload time"
    description: |
      When user uploads a file in compose/upload UI, the assistant suggests the
      best-fit folder based on filename + mime + recent folder activity + tenant
      organisation patterns. User can accept (click) or pick a different folder.
      No file is uploaded into a folder without explicit user choice (default
      folder is shown as a pre-selected option, not as an auto-action).
    surface: upload-ui (REST POST /v1/assist/folder-suggest)
    triggers:
      - user opens upload dialog AND has not yet picked a destination folder
      - user explicitly clicks "Suggest folder"
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING (filename)]
    data_class_emitted: INTERNAL_ONLY (folder id list)
    cross_tenant_consultation:
      allowed: no
    model:
      primary: tenant-default-llm (foundry-runtime managed)
      fallback: rule-based (most-recently-used folder for this mime)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 200
    audit_event: DriveFolderSuggestionShown
    fallback_on_model_failure: silent skip — falls back to heuristic
    risk_classification: minimal-risk
    user_label: "AI suggestion — click to accept"

  - id: T0-drive-suggest-tags
    name: "Tag suggestion based on file content"
    description: |
      After upload, the assistant suggests tags inferred from filename + mime +
      Tika full-text extract. User can accept, edit, or ignore. Tags are
      tenant-scoped metadata; no public surface change.
    surface: file-detail-ui (REST POST /v1/assist/tag-suggest)
    triggers:
      - file uploaded; user opens file detail view
      - tenant has tag-suggestion opt-in (per-user override available)
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PERSONAL_FILE_CONTENT or PROFESSIONAL_FILE_CONTENT, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (suggested tag list)
    model:
      primary: tenant-default-llm
      fallback: filename-token based heuristic
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 300
    audit_event: DriveTagSuggestionShown
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk
    user_label: "AI-suggested tags — pick those you want to keep"

  - id: T0-drive-suggest-cleanup
    name: "Duplicate / stale file cleanup suggestion"
    description: |
      Assistant identifies likely-duplicate files (same content-address; same name
      + size in same folder) AND likely-stale files (not accessed in > 12 mo;
      under per-tenant policy). Surface as suggestion in tenant-portal cleanup
      view; user picks files to act on. No file is deleted/moved without
      explicit user action.
    surface: tenant-portal cleanup view (REST POST /v1/assist/cleanup-suggest)
    triggers:
      - user navigates to cleanup view
      - tenant admin runs periodic cleanup review
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (candidate file list)
    model:
      primary: rule-based (deterministic content-address dedup + access-recency cutoff)
      fallback: n/a
      private_inference: n/a
    latency_budget_p99_ms: 500
    audit_event: DriveCleanupSuggestionShown
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic)
    user_label: "Cleanup candidates — review before acting"

verification:
  - All T0 suggestions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE model invocation.
  - All T0 suggestions emit an audit-chain event (Ed25519-sealed; non-content payload only) on suggestion-shown + suggestion-accepted.
  - All T0 suggestions are labelled per EU AI Act Art. 50 in the UI surface.
  - All T0 suggestions respect dual-context isolation: Personal-context suggestions NEVER consult Professional-context files; Professional-context suggestions NEVER consult Personal-context files. Enforced at `oya-drive-search-index-domain` + `oya-drive-file-store-domain` per PRD AC-07.
  - T0 suggestions do NOT create, modify, or delete files without explicit user action.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 50 transparency.
  - microservices/drive/PRD.md §FR-03 / §FR-15 — adjacent file-organisation surfaces.
  - microservices/drive/policy/dual-context-isolation.md.
  - microservices/calendar/capabilities/T0-suggest.yaml — sibling reference.
