// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oya.drive.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "oyatie.dev/drive/v1;drivev1";

// =====================================================================================
// Drive µservice gRPC contracts.
//
// Per ADR-0135 (unbundle) + ADR-0132 (no-grouping policy) + ADR-0131 (per-µservice
// flat layout). Mirrors the REST surface defined in `contracts/openapi/drive.yaml`.
//
// Authentication: SPIFFE-bound mTLS/TLS 1.3 for this internal-only gRPC contract.
// Public OIDC/API-key authentication belongs to the REST/OpenAPI surface.
// Authorisation: Cedar policies per `policy/*.cedar`.
// Dual-context isolation: Personal vs Professional file types are NOT a shared enum;
// the gRPC service exposes two endpoint families to enforce structural separation.
// =====================================================================================

// ==================== Common ====================

enum FileContext {
  FILE_CONTEXT_UNSPECIFIED = 0;
  FILE_CONTEXT_PERSONAL = 1;
  FILE_CONTEXT_PROFESSIONAL = 2;
}

enum VirusVerdict {
  VIRUS_VERDICT_UNSPECIFIED = 0;
  VIRUS_VERDICT_PENDING = 1;
  VIRUS_VERDICT_CLEAN = 2;
  VIRUS_VERDICT_MALICIOUS = 3;
  VIRUS_VERDICT_QUARANTINED = 4;
}

enum DlpVerdict {
  DLP_VERDICT_UNSPECIFIED = 0;
  DLP_VERDICT_PENDING = 1;
  DLP_VERDICT_CLEAN = 2;
  DLP_VERDICT_FLAGGED = 3;
}

enum ImmutabilityMode {
  IMMUTABILITY_MODE_UNSPECIFIED = 0;
  IMMUTABILITY_MODE_COMPLIANCE = 1;
  IMMUTABILITY_MODE_GOVERNANCE = 2;
}

enum PermissionScope {
  PERMISSION_SCOPE_UNSPECIFIED = 0;
  PERMISSION_SCOPE_READ = 1;
  PERMISSION_SCOPE_COMMENT = 2;
  PERMISSION_SCOPE_EDIT = 3;
  PERMISSION_SCOPE_MANAGE = 4;
}

enum ShareLinkScope {
  SHARE_LINK_SCOPE_UNSPECIFIED = 0;
  SHARE_LINK_SCOPE_READ = 1;
  SHARE_LINK_SCOPE_COMMENT = 2;
  SHARE_LINK_SCOPE_EDIT = 3;
}

message File {
  string file_id = 1;
  string tenant_id = 2;
  FileContext context = 3;
  string name = 4;
  string parent_folder_id = 5;
  int64 size = 6;
  string mime = 7;
  string content_address = 8;
  int64 version = 9;
  string owner_user_id = 10;
  bool e2e_encrypted = 11;
  bool worm_tier_enabled = 12;
  google.protobuf.Timestamp worm_retention_floor = 13;
  bool legal_hold_open = 14;
  bool dlp_flagged = 15;
  VirusVerdict virus_verdict = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message Folder {
  string folder_id = 1;
  string tenant_id = 2;
  FileContext context = 3;
  string name = 4;
  string parent_folder_id = 5;
  string path = 6;
  google.protobuf.Timestamp created_at = 7;
}

// ==================== File Store ====================

service FileStore {
  rpc CreateFile(CreateFileRequest) returns (File);
  rpc GetFile(GetFileRequest) returns (File);
  rpc UpdateFile(UpdateFileRequest) returns (File);
  rpc TrashFile(TrashFileRequest) returns (google.protobuf.Empty);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
}

message CreateFileRequest {
  FileContext context = 1;
  string name = 2;
  string parent_folder_id = 3;
  string mime = 4;
  bool e2e_encrypted = 5;
  bytes content = 6;  // single-shot ≤ 5MiB; larger use Upload service
}

message GetFileRequest { string file_id = 1; }
message UpdateFileRequest { string file_id = 1; File file = 2; int64 expected_version = 3; }
message TrashFileRequest { string file_id = 1; }

message ListFilesRequest {
  FileContext context = 1;
  string parent_folder_id = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ListFilesResponse {
  repeated File files = 1;
  string next_cursor = 2;
}

message FileVersionInfo {
  int64 version = 1;
  string content_address = 2;
  int64 size = 3;
  google.protobuf.Timestamp created_at = 4;
  string created_by = 5;
}

message ListVersionsRequest { string file_id = 1; }
message ListVersionsResponse { repeated FileVersionInfo versions = 1; }

// ==================== Folder Hierarchy ====================

service FolderHierarchy {
  rpc CreateFolder(CreateFolderRequest) returns (Folder);
  rpc GetFolder(GetFolderRequest) returns (Folder);
}

message CreateFolderRequest {
  FileContext context = 1;
  string name = 2;
  string parent_folder_id = 3;
}

message GetFolderRequest { string folder_id = 1; }

// ==================== Upload ====================

service Upload {
  rpc CreateSession(CreateUploadSessionRequest) returns (UploadSession);
  rpc UploadChunk(stream UploadChunkRequest) returns (UploadChunkResponse);
  rpc CompleteSession(CompleteSessionRequest) returns (File);
  rpc AbortSession(AbortSessionRequest) returns (google.protobuf.Empty);
}

message UploadSession {
  string session_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  int32 chunk_size = 3;
  int32 chunks_required = 4;
}

message CreateUploadSessionRequest {
  FileContext context = 1;
  string parent_folder_id = 2;
  string name = 3;
  int64 size = 4;
  string mime = 5;
  int32 chunk_size = 6;
  bool e2e_encrypted = 7;
}

message UploadChunkRequest {
  string session_id = 1;
  int32 chunk_index = 2;
  bytes chunk_bytes = 3;
  string chunk_sha256 = 4;
}

message UploadChunkResponse {
  int64 upload_offset = 1;
  bool chunk_persisted = 2;
}

message CompleteSessionRequest { string session_id = 1; }
message AbortSessionRequest { string session_id = 1; }

// ==================== Download ====================

service Download {
  rpc Get(GetDownloadRequest) returns (stream GetDownloadResponse);
  rpc MintSignedUrl(MintSignedUrlRequest) returns (SignedUrlResponse);
}

message GetDownloadRequest {
  string file_id = 1;
  int64 range_start = 2;
  int64 range_end = 3;  // -1 = unspecified (full file)
}

message GetDownloadResponse {
  bytes bytes = 1;
  int64 offset = 2;
}

message MintSignedUrlRequest {
  string file_id = 1;
  int32 ttl_seconds = 2;
}

message SignedUrlResponse {
  string signed_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// ==================== Sync ====================

service Sync {
  rpc OpenSession(OpenSyncSessionRequest) returns (SyncSession);
  rpc SubmitManifest(SubmitManifestRequest) returns (SyncDelta);
}

message OpenSyncSessionRequest {
  string device_id = 1;
  string root_folder_id = 2;
}

message SyncSession {
  string session_id = 1;
  google.protobuf.Timestamp opened_at = 2;
}

message ChunkRef {
  int64 offset = 1;
  int32 length = 2;
  string hash = 3;  // blake3
}

message SubmitManifestRequest {
  string session_id = 1;
  string file_id = 2;
  repeated ChunkRef chunks = 3;
}

message NeededChunk {
  int64 offset = 1;
  int32 length = 2;
  string upload_url = 3;
}

message SyncDelta {
  repeated NeededChunk needed_chunks = 1;
}

// ==================== Share Link ====================

service ShareLinkService {
  rpc Mint(MintShareLinkRequest) returns (ShareLink);
  rpc Revoke(RevokeShareLinkRequest) returns (google.protobuf.Empty);
}

message MintShareLinkRequest {
  string resource_id = 1;
  string resource_kind = 2;  // "file" | "folder"
  ShareLinkScope scope = 3;
  int32 ttl_seconds = 4;
  int32 view_cap = 5;
  string password = 6;
  bool preview_only = 7;
}

message ShareLink {
  string link_id = 1;
  string signed_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  int32 view_cap_remaining = 4;
  bool password_protected = 5;
  google.protobuf.Timestamp revoked_at = 6;
}

message RevokeShareLinkRequest { string link_id = 1; }

// ==================== Permissions ====================

service Permissions {
  rpc Grant(GrantPermissionRequest) returns (Permission);
  rpc Revoke(RevokePermissionRequest) returns (google.protobuf.Empty);
}

message Permission {
  string permission_id = 1;
  string resource_id = 2;
  string principal_id = 3;
  PermissionScope scope = 4;
  string granted_by = 5;
  google.protobuf.Timestamp granted_at = 6;
}

message GrantPermissionRequest {
  string resource_id = 1;
  string resource_kind = 2;  // "file" | "folder"
  string principal_id = 3;
  string principal_kind = 4;  // "user" | "group"
  PermissionScope scope = 5;
  bool inherit_to_children = 6;
}

message RevokePermissionRequest { string permission_id = 1; }

// ==================== Search ====================

service Search {
  rpc Query(SearchQueryRequest) returns (SearchResponse);
}

message SearchQueryRequest {
  string query = 1;
  FileContext context = 2;
  int32 limit = 3;
}

message SearchHit {
  string file_id = 1;
  string name = 2;
  string path = 3;
  string snippet = 4;
  double score = 5;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

// ==================== Preview ====================

service Preview {
  rpc Render(RenderPreviewRequest) returns (stream RenderPreviewResponse);
}

message RenderPreviewRequest {
  string file_id = 1;
  string kind = 2;  // "thumbnail" | "first-page" | "video-frame"
}

message RenderPreviewResponse {
  bytes png_bytes = 1;
}

// ==================== Scan ====================

service Scan {
  rpc GetVerdict(GetVerdictRequest) returns (ScanVerdictResponse);
}

message GetVerdictRequest { string file_id = 1; }

message ScanVerdictResponse {
  string scan_job_id = 1;
  VirusVerdict virus_verdict = 2;
  DlpVerdict dlp_verdict = 3;
  repeated string dlp_rules_matched = 4;
  google.protobuf.Timestamp scanned_at = 5;
}

// ==================== Immutability ====================

service Immutability {
  rpc ElectWorm(ElectWormRequest) returns (ImmutabilityRecord);
  rpc OpenLegalHold(OpenLegalHoldRequest) returns (LegalHold);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (google.protobuf.Empty);
}

message ImmutabilityRecord {
  string record_id = 1;
  string file_id = 2;
  google.protobuf.Timestamp retention_floor = 3;
  ImmutabilityMode mode = 4;
  string elected_by = 5;
  google.protobuf.Timestamp elected_at = 6;
}

message ElectWormRequest {
  string file_id = 1;
  int64 retention_floor_seconds = 2;
  ImmutabilityMode mode = 3;
  string reason = 4;
}

message LegalHold {
  string hold_id = 1;
  string file_id = 2;
  string opened_by = 3;
  google.protobuf.Timestamp opened_at = 4;
  string reason = 5;
}

message OpenLegalHoldRequest {
  string file_id = 1;
  string opened_by = 2;
  string reason = 3;
  string related_matter_id = 4;
}

message ReleaseLegalHoldRequest {
  string hold_id = 1;
  string two_person_approver_id = 2;
  string release_reason = 3;
}
