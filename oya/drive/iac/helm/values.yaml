# Default values for oya-drive Helm chart.
# Per ADR-0131 (per-µservice flat layout) + ADR-0133 (LTS-pinned versions) +
# ADR-DRIVE-0001 (object-storage), ADR-DRIVE-0002 (CDC), ADR-DRIVE-0003 (share-link),
# ADR-DRIVE-0004 (encryption-at-rest + E2E), ADR-DRIVE-0005 (preview sandbox),
# ADR-DRIVE-0006 (WORM immutability).
#
# Pack-specific overrides live in `iac/kustomize/overlays/pack-<region>/`.
# All secrets via `${openbao:secret/drive/<path>}` SecretReferences.

global:
  microservice: drive
  ltsImageRegistry: registry.oyatie.dev
  tenantId: "${TENANT_ID}"             # injected at deploy time per cell
  packRegion: kr                        # overridden per pack overlay
  observability:
    metricsPort: 9090
    tracingEndpoint: otel-collector.observability.svc.cluster.local:4317

# ---- Per-BC workloads --------------------------------------------------------

fileStore:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-file-store-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}
  port: 9001
  encryption:
    tenantDekRef: "${openbao:secret/drive/{tenant}/dek}"
    fipsModule: openbao-transit         # FIPS 140-3 module
    rotationDays: 90

folderHierarchy:
  replicaCount: 2
  image:
    repository: registry.oyatie.dev/oya-drive-folder-hierarchy-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9002

upload:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-upload-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9003
  maxMultipartFileSizeBytes: 5497558138880   # 5 TiB
  defaultChunkSizeBytes: 8388608             # 8 MiB nominal FastCDC AVG
  fastcdc:
    minBytes: 4194304                        # 4 MiB
    avgBytes: 8388608                        # 8 MiB
    maxBytes: 16777216                       # 16 MiB
    gearTableVersion: 1
  tus:
    enabled: true
    pathPrefix: "/v1/upload"

download:
  replicaCount: 5
  image:
    repository: registry.oyatie.dev/oya-drive-download-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9004
  signedUrl:
    defaultTtlSeconds: 300
    maxTtlSeconds: 86400
  cdn:
    enabled: true
    provider: cloudfront-or-fastly

sync:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-sync-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9005
  lbfs:
    rollingHashWindow: 64
    maxChunksPerManifest: 100000
    sessionTtlDays: 7
  conflictTieBreak: "(timestamp, actor_id)"   # deterministic per ADR-DRIVE-0002

shareLink:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-share-link-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9006
  signing:
    algorithm: ed25519
    signingKeyRef: "${openbao:secret/drive/{tenant}/share-link-signing-key}"
    rotationDays: 30
  password:
    kdf: argon2id                              # RFC 9106
    memoryCostKib: 65536                       # 64 MiB
    timeCost: 3
    parallelism: 4
  maxTtlSeconds: 31536000                      # 1 year

permissions:
  replicaCount: 2
  image:
    repository: registry.oyatie.dev/oya-drive-permissions-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9007

searchIndex:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-search-index-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: 2,    memory: 4Gi}
  port: 9008

preview:
  replicaCount: 3
  image:
    repository: registry.oyatie.dev/oya-drive-preview-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 1,    memory: 1Gi}
    limits:   {cpu: 4,    memory: 4Gi}
  port: 9009
  sandbox:
    runtime: gvisor                            # per ADR-DRIVE-0005
    seccompProfile: restrictive-default
    netnsIsolated: true
    hostFsAccess: none
  timeouts:
    imageSeconds: 5
    pdfSeconds: 30
    officeSeconds: 60
    videoSeconds: 120

dlpVirusScan:
  replicaCount: 5
  image:
    repository: registry.oyatie.dev/oya-drive-dlp-virus-scan-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 1,    memory: 1Gi}
    limits:   {cpu: 4,    memory: 4Gi}
  clamav:
    enabled: true
    signatureRefreshIntervalSeconds: 3600
    signaturePin: false                         # default = follow upstream; pin via runbook
  opswat:
    enabled: false                              # enabled in pack-us-healthcare + pack-eu overlays

immutabilityTier:
  replicaCount: 2
  image:
    repository: registry.oyatie.dev/oya-drive-immutability-tier-app
    tag: "1.0.0"
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9010
  worm:
    objectLockMode: compliance                  # per ADR-DRIVE-0006; AWS S3 Object Lock terminology
    maxRetentionYears: 99
    integrityScanIntervalSeconds: 3600

# ---- Object-store backends (per ADR-DRIVE-0001) ------------------------------

garage:
  enabled: true                                # primary backend for all packs except us-healthcare
  image:
    repository: registry.oyatie.dev/garage
    tag: "1.0.1"                               # LTS pinned
  replication:
    factor: 3
  storage:
    perCellGB: 5242880                          # 5 PiB raw per cell
  resources:
    requests: {cpu: 1, memory: 2Gi}
    limits:   {cpu: 4, memory: 8Gi}

minio:
  enabled: false                                # enabled via pack-us-healthcare overlay
  image:
    repository: registry.oyatie.dev/minio
    tag: "RELEASE.2024-08-17T01-24-54Z"        # LTS pinned
  mode: distributed
  drives: 4

seaweedfs:
  enabled: true                                 # archive tier (cold)
  image:
    repository: registry.oyatie.dev/seaweedfs
    tag: "3.71.0"
  archiveOnlyDays: 365                           # files not accessed in > 365d auto-tier

# ---- Metadata + cache --------------------------------------------------------

cloudnativePg:
  enabled: true
  image:
    repository: registry.oyatie.dev/cloudnative-pg
    tag: "16.4.0"
  rls:
    perTenant: true
  ha:
    syncReplicas: 1
    streamingReplicas: 2
  storage:
    size: 500Gi
  backup:
    s3Ref: "${openbao:secret/drive/{pack}/backup-s3}"

valkeyCluster:
  enabled: true
  image:
    repository: registry.oyatie.dev/valkey-cluster
    tag: "7.4.0"
  clusterMode: true
  evictionPolicy: allkeys-lru
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: 2,    memory: 4Gi}

# ---- Search ------------------------------------------------------------------

meilisearch:
  enabled: true
  image:
    repository: registry.oyatie.dev/meilisearch
    tag: "1.10.3"
  perTenantIndex: true

apacheTika:
  enabled: true
  image:
    repository: registry.oyatie.dev/apache-tika
    tag: "2.9.2"

# ---- Scan --------------------------------------------------------------------

clamav:
  enabled: true
  image:
    repository: registry.oyatie.dev/clamav
    tag: "1.4.1"

opswatMetadefender:
  enabled: false                                # gated by pack overlay
  image:
    repository: registry.oyatie.dev/opswat-metadefender
    tag: "5.10.0"
  apiKeyRef: "${openbao:secret/drive/{pack}/opswat-api-key}"

# ---- Preview-render adjuncts -------------------------------------------------

libreofficeGvisor:
  enabled: true
  image:
    repository: registry.oyatie.dev/libreoffice-gvisor
    tag: "24.8.4"
  gvisor:
    platform: ptrace                           # gVisor platform pinned
    networkPolicy: deny-all

# ---- HPA + PDB + NetworkPolicy + ServiceMonitor + PrometheusRule ------------

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"

networkPolicy:
  enabled: true
  meshOnly: true

serviceMonitor:
  enabled: true
  interval: 30s

prometheusRule:
  enabled: true
