{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-drive-default-deny
  namespace: drive
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-drive-mesh-ingress
  namespace: drive
spec:
  podSelector:
    matchLabels:
      microservice: drive
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              networking.oyatie.dev/mesh-tenant: enabled
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: istio-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-drive-egress
  namespace: drive
spec:
  podSelector:
    matchLabels:
      microservice: drive
  policyTypes: [Egress]
  egress:
    # Postgres
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: cloudnative-pg}}
      ports: [{protocol: TCP, port: 5432}]
    # Valkey
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: valkey-cluster}}
      ports: [{protocol: TCP, port: 6379}]
    # Object stores
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: garage}}
      ports: [{protocol: TCP, port: 3900}]
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: minio}}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: seaweedfs}}
      ports: [{protocol: TCP, port: 8888}]
    # Meilisearch
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: meilisearch}}
      ports: [{protocol: TCP, port: 7700}]
    # Tika
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: apache-tika}}
      ports: [{protocol: TCP, port: 9998}]
    # ClamAV
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: clamav}}
      ports: [{protocol: TCP, port: 3310}]
    # OPSWAT (when enabled)
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: opswat-metadefender}}
      ports: [{protocol: TCP, port: 8008}]
    # OpenBao (KMS)
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
      ports: [{protocol: TCP, port: 8200}]
    # Cross-µservice (mail, messenger, foundry-runtime, audit-chain) via mesh
    - to:
        - namespaceSelector:
            matchLabels:
              networking.oyatie.dev/mesh-microservice: "true"
    # DNS
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}]
---
# Preview worker (gVisor) has stricter egress: no internet; no cross-µservice; only object-store + OpenBao
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-drive-preview-egress-deny-network
  namespace: drive
spec:
  podSelector:
    matchLabels:
      microservice: drive
      bc: preview
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: garage}}
      ports: [{protocol: TCP, port: 3900}]
    - to:
        - namespaceSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
      ports: [{protocol: TCP, port: 8200}]
    # DNS only (no general internet)
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}]
{{- end }}
