{{- range $bc := list "fileStore" "folderHierarchy" "upload" "download" "sync" "shareLink" "permissions" "searchIndex" "preview" "dlpVirusScan" "immutabilityTier" }}
{{- $cfg := index $.Values $bc }}
{{- $kebab := $bc | snakecase | replace "_" "-" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-drive-{{ $kebab }}
  namespace: drive
  labels:
    microservice: drive
    bc: {{ $kebab }}
    pack: {{ $.Values.global.packRegion }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      microservice: drive
      bc: {{ $kebab }}
  template:
    metadata:
      labels:
        microservice: drive
        bc: {{ $kebab }}
        pack: {{ $.Values.global.packRegion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.global.observability.metricsPort }}"
    spec:
      serviceAccountName: oya-drive-{{ $kebab }}
      {{- if eq $bc "preview" }}
      {{- /* Drive preview rendering (Pandoc/LibreOffice/Chromium) = untrusted-content per ADR-0147 */}}
      {{- include "oya.runtimeClassName.untrustedContent" $ | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $cfg.port | default 9000 }}
            - name: metrics
              containerPort: {{ $.Values.global.observability.metricsPort }}
          resources:
            requests:
              cpu: {{ $cfg.resources.requests.cpu | default "250m" }}
              memory: {{ $cfg.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ $cfg.resources.limits.cpu | default "1" }}
              memory: {{ $cfg.resources.limits.memory | default "512Mi" }}
          env:
            - name: PACK_REGION
              value: {{ $.Values.global.packRegion }}
            - name: TENANT_ID
              value: {{ $.Values.global.tenantId | quote }}
            - name: OTLP_ENDPOINT
              value: {{ $.Values.global.observability.tracingEndpoint }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
