# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drive

resources:
  - ../../base

commonAnnotations:
  pack.oyatie.dev/region: pack-kr
  pack.oyatie.dev/residency: ap-seoul-1
  pack.oyatie.dev/compliance: "KR-PIPA, KR-FSS, KR-ISMS-P, 전자문서법"

patchesStrategicMerge:
  - values-pack-kr.yaml
