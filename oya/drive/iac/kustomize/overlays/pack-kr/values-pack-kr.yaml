# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# pack-kr overlay for oya-drive Helm chart.
# Pack-specific values:
# - Residency: ap-seoul-1
# - KR-FSS retention floor: 5y WORM for financial-sector tenants
# - KR-ISMS-P: per-tenant audit-chain
# - 전자문서법: audit-chain Ed25519 integrity required

apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-drive-pack-config
  namespace: drive
data:
  pack-region: "kr"
  residency-primary: "ap-seoul-1"
  residency-secondary: "ap-seoul-2"
  compliance-frameworks: "KR-PIPA,KR-FSS,KR-ISMS-P,Electronic-Document-Act"
  worm-retention-floor-financial-sector-days: "1825"   # KR-FSS 5y
  worm-retention-floor-default-days: "730"             # 2y default
  cross-border-allowed: "false"
  opswat-enabled: "false"                              # ClamAV-only baseline
  garage-region: "ap-seoul-1"
  object-store-primary: "garage"
  object-store-archive: "seaweedfs"
  audit-chain-algorithm: "ed25519-merkle"
  sensitive-data-class: "SENSITIVE_PIPA_ART23"
