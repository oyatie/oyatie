apiVersion: openslo/v1
kind: SLO
metadata:
  name: learning-management-assessment-submit-success
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: learning-management
  description: Assessment submissions accepted once per authorized attempt for course delivery, cohort enrollment, assessment submission, certificate issuance, and learning content operations.
  indicator:
    metadata:
      name: assessment-submit-success
      labels:
        domain_object: LearningCohort
        operator_audience: LEARNING_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_assessment_submit_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_assessment_submit_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Assessment submissions accepted once per authorized attempt
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
