apiVersion: openslo/v1
kind: SLO
metadata:
  name: learning-management-cohort-enrollment-latency
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: learning-management
  description: Cohort enrollment propagation latency for course delivery, cohort enrollment, assessment submission, certificate issuance, and learning content operations.
  indicator:
    metadata:
      name: cohort-enrollment-latency
      labels:
        domain_object: LearningCohort
        operator_audience: LEARNING_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_cohort_enrollment_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_cohort_enrollment_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Cohort enrollment propagation latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
