asyncapi: 3.1.0
info:
  title: Learning Management Local Operational Events
  version: 1.0.0
  description: Events for course delivery, cohort enrollment, assessment submission, certificate issuance, and learning content operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  learning-management.local-ops.v1:
    address: learning-management.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/learning-management.local-ops.v1'
    messages:
      - $ref: '#/channels/learning-management.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/learning-management.local-ops.v1'
    messages:
      - $ref: '#/channels/learning-management.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: LearningManagementDomainEvent
      title: Learning Management domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['course.published', 'cohort.member.enrolled', 'assessment.submitted', 'certificate.issued'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['course_content', 'learner_progress', 'assessment_response', 'cohort_membership', 'certificate_record', 'session_attendance'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: LearningManagementSloBurnEvent
      title: Learning Management SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'learning-management' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'course.published' }
