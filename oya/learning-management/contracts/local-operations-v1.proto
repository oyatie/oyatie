// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.learning_management.local.v1;

message LearningManagementLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message LearningManagementLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message LearningManagementLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message LearningManagementLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message LearningManagementSupportedActions {
  string course_publish_action = 1;
  string cohort_enroll_action = 2;
  string assessment_submit_action = 3;
  string content_deliver_action = 4;
  string certificate_issue_action = 5;
  string session_join_action = 6;
}

service LearningManagementLocalOperationsService {
  rpc CheckLocalPolicy(LearningManagementLocalPolicyCheckRequest) returns (LearningManagementLocalPolicyDecision);
  rpc GetLocalSloState(LearningManagementLocalSloStateRequest) returns (LearningManagementLocalSloState);
}
