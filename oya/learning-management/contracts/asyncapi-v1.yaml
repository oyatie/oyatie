asyncapi: 3.1.0
info:
  title: Learning Management Events
  version: 1.0.0
  description: Tenant-scoped event contract for course enrollment, completion evidence, skills credentials, and regulated training attestations.
defaultContentType: application/json
channels:
  learning-management.events.v1:
    address: learning-management.events.v1
    messages:
      learningManagementActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/learning-management.events.v1'
    messages:
      - $ref: '#/channels/learning-management.events.v1/messages/learningManagementActionAccepted'
components:
  messages:
    ActionAccepted:
      name: LearningManagementActionAccepted
      title: Learning Management action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
