apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learning-management-local-domain-egress
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: content-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oyatie.dev/plane: edge
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.dev/plane: audit-chain
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie.dev/plane: eventing
