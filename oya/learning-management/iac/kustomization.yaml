apiVersion: oyatie.dev/v1
kind: Kustomization
metadata:
  name: learning-management-kustomization
  labels:
    service: learning-management
    binding_adr: ADR-0253-amendment
spec:
  service: learning-management
  tenantScoped: true
  audienceType: LEARNING_ADMIN
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/credential-training-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Workday Learning", "Cornerstone", "Degreed", "LinkedIn Learning", "Udemy Business", "Salesforce Trailhead"]
