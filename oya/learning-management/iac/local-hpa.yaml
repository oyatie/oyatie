apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learning-management-content-api
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learning-management-content-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_learning_management_content_delivery_latency_inflight
        target:
          type: AverageValue
          averageValue: "100"
