apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: learning-management-local-ops
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: learning-management
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_learning_management_content_delivery_latency_good_total
    - oya_learning_management_assessment_submit_success_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-course-publish-approval.cedar
