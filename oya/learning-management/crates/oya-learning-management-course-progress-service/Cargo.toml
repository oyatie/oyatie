[package]
name = "oya-learning-management-course-progress-service"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Rust source scaffold for the Oyatie learning-management microservice."
authors = ["Oyatie Council Architecture"]
repository = "https://github.com/oyatie/oyatie"
keywords = ["oyatie", "learning-management", "microservice"]
categories = ["development-tools"]

[package.metadata.oya]
microservice = "learning-management"
bounded_context = "course-progress"
architecture_layers = "ADR-0105-13-layer-enum-with-ADR-0106-usecase"
contracts = ["openapi-v1", "grpc-v1", "asyncapi-v1"]
scaffold_wave = "Wave-3-K"
scaffold_agent = "codex-rust-src-scaffolds-w2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oya-learning-management-service"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
