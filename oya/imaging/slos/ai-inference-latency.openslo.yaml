apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-ai-inference-latency
  namespace: imaging
  displayName: AI Marketplace Dispatch + Result Round-Trip Latency
  labels:
    microservice: imaging
    bounded_context: AIImageAnalysis
spec:
  description: |
    Round-trip from AI dispatch enqueue to result received from vendor.
    Target p95 < 500ms per FR-AI-002.
  service: imaging
  indicator:
    metadata:
      name: ai-inference-round-trip-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_ai_round_trip_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_ai_round_trip_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 500ms
      target: 0.95
    - displayName: 99% within 2s
      target: 0.99
