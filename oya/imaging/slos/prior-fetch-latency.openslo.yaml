apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-prior-fetch-latency
  namespace: imaging
  displayName: Prior Study Auto-Fetch Latency
  labels:
    microservice: imaging
    bounded_context: PriorComparison
spec:
  description: |
    Time from worklist-open event to all relevant priors streamed to viewer.
    Target p95 < 3s per FR-RAD-012.
  service: imaging
  indicator:
    metadata:
      name: prior-fetch-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_prior_fetch_seconds_bucket{le="3.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_prior_fetch_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 3s
      target: 0.95
    - displayName: 99% within 10s (cross-VNA federated)
      target: 0.99
