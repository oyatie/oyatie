apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-hanging-protocol-apply-latency
  namespace: imaging
  displayName: Hanging Protocol Match + Apply Latency
  labels:
    microservice: imaging
    bounded_context: HangingProtocol
spec:
  description: |
    Time from study-open event to hanging protocol applied + presentation
    state written. Target p95 < 150ms per FR-RAD-004.
  service: imaging
  indicator:
    metadata:
      name: hanging-protocol-apply-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_hanging_protocol_apply_seconds_bucket{le="0.15"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_hanging_protocol_apply_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 150ms
      target: 0.95
    - displayName: 99% within 400ms
      target: 0.99
