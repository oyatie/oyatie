apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-worklist-load-latency
  namespace: imaging
  displayName: Radiologist Worklist Load Latency
  labels:
    microservice: imaging
    bounded_context: RadiologistWorklist
spec:
  description: |
    Time from worklist GET request to fully rendered (up to 5000 items).
    Target p95 < 800ms per FR-RAD-003.
  service: imaging
  indicator:
    metadata:
      name: worklist-load-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_worklist_load_seconds_bucket{le="0.8"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_worklist_load_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 800ms
      target: 0.95
    - displayName: 99% within 2s
      target: 0.99
