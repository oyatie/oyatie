// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// Imaging µservice gRPC contract (proto3)
//
// Authority: split from `diagnostics` per ADR-0132 + user directive 2026-05-21.
// Per ADR-0145: direct gRPC inter-µservice (no Workflow+Ontology adapter).
// Per ADR-0632: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3.
// Per ADR-0243: every RPC is Cedar-gated.
// Per ADR-0244: every RPC carries `tenant_id`.

syntax = "proto3";

package oyatie.imaging.v1;

option go_package = "github.com/oyatie/imaging-proto/v1;imagingv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =====================================================
// Common types
// =====================================================

message TenantContext {
  string tenant_id = 1;
  string cell_id = 2;
  string correlation_id = 3;
  string actor_id = 4;
  string actor_role = 5;
}

message DicomUid {
  string value = 1; // dotted-decimal DICOM UID
}

message StudyKey {
  TenantContext tenant = 1;
  DicomUid study_instance_uid = 2;
}

message SeriesKey {
  TenantContext tenant = 1;
  DicomUid study_instance_uid = 2;
  DicomUid series_instance_uid = 3;
}

message InstanceKey {
  TenantContext tenant = 1;
  DicomUid study_instance_uid = 2;
  DicomUid series_instance_uid = 3;
  DicomUid sop_instance_uid = 4;
}

message CedarDecision {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOW = 1;
    DECISION_DENY = 2;
  }
  Decision decision = 1;
  repeated string determining_policies = 2;
  string reason = 3;
}

message PageRequest {
  uint32 limit = 1;
  string page_token = 2;
}

// =====================================================
// PACS / VNA service
// =====================================================

service PacsService {
  rpc QueryStudies(QueryStudiesRequest) returns (QueryStudiesResponse);
  rpc QuerySeries(QuerySeriesRequest) returns (QuerySeriesResponse);
  rpc QueryInstances(QueryInstancesRequest) returns (QueryInstancesResponse);
  rpc RetrieveInstance(InstanceKey) returns (stream InstanceChunk);
  rpc StoreInstance(stream StoreInstanceChunk) returns (StoreInstanceResponse);
  rpc DeleteStudy(DeleteStudyRequest) returns (DeleteStudyResponse);
}

message QueryStudiesRequest {
  TenantContext tenant = 1;
  string patient_id = 2;
  string study_date_range = 3; // YYYYMMDD or YYYYMMDD-YYYYMMDD
  repeated string modalities_in_study = 4;
  string accession_number = 5;
  PageRequest page = 6;
}

message Study {
  DicomUid study_instance_uid = 1;
  string accession_number = 2;
  string patient_id = 3;
  google.protobuf.Timestamp study_date = 4;
  repeated string modalities_in_study = 5;
  string body_part = 6;
  string study_description = 7;
  string referring_physician = 8;
  uint32 series_count = 9;
  uint32 instance_count = 10;
  uint64 size_bytes = 11;
}

message QueryStudiesResponse {
  repeated Study studies = 1;
  string next_page_token = 2;
}

message QuerySeriesRequest {
  StudyKey study = 1;
  PageRequest page = 2;
}

message Series {
  DicomUid series_instance_uid = 1;
  string modality = 2;
  uint32 series_number = 3;
  string series_description = 4;
  uint32 instance_count = 5;
}

message QuerySeriesResponse {
  repeated Series series = 1;
  string next_page_token = 2;
}

message QueryInstancesRequest {
  SeriesKey series = 1;
  PageRequest page = 2;
}

message Instance {
  DicomUid sop_instance_uid = 1;
  string sop_class_uid = 2;
  string transfer_syntax_uid = 3;
  uint64 size_bytes = 4;
}

message QueryInstancesResponse {
  repeated Instance instances = 1;
  string next_page_token = 2;
}

message InstanceChunk {
  bytes pixel_data = 1;
  uint32 sequence = 2;
  bool is_final = 3;
}

message StoreInstanceChunk {
  oneof payload {
    StoreInstanceHeader header = 1;
    bytes pixel_data = 2;
  }
}

message StoreInstanceHeader {
  TenantContext tenant = 1;
  DicomUid study_instance_uid = 2;
  DicomUid series_instance_uid = 3;
  DicomUid sop_instance_uid = 4;
  string sop_class_uid = 5;
  string transfer_syntax_uid = 6;
}

message StoreInstanceResponse {
  CedarDecision cedar = 1;
  bool stored = 2;
  string retrieve_url = 3;
}

message DeleteStudyRequest {
  StudyKey study = 1;
  string reason = 2; // e.g., GDPR-erasure
  bool cryptographic_shred = 3;
}

message DeleteStudyResponse {
  CedarDecision cedar = 1;
  bool deleted = 2;
  string audit_chain_entry_id = 3;
}

// =====================================================
// Modality Worklist + MPPS service
// =====================================================

service ModalityWorklistService {
  rpc QueryWorklist(QueryWorklistRequest) returns (QueryWorklistResponse);
  rpc CreateMppsInProgress(CreateMppsRequest) returns (Mpps);
  rpc UpdateMppsState(UpdateMppsRequest) returns (Mpps);
}

message QueryWorklistRequest {
  TenantContext tenant = 1;
  string modality = 2;
  string ae_title = 3;
  google.protobuf.Timestamp scheduled_from = 4;
  google.protobuf.Timestamp scheduled_to = 5;
}

message WorklistWorkitem {
  string workitem_uid = 1;
  string scheduled_procedure_step_id = 2;
  string modality = 3;
  google.protobuf.Timestamp scheduled_start = 4;
  string patient_id = 5;
  string accession_number = 6;
  string scheduled_procedure_description = 7;
}

message QueryWorklistResponse {
  repeated WorklistWorkitem items = 1;
}

message CreateMppsRequest {
  TenantContext tenant = 1;
  DicomUid study_instance_uid = 2;
  string ae_title = 3;
  string scheduled_procedure_step_id = 4;
  google.protobuf.Timestamp start_time = 5;
}

message UpdateMppsRequest {
  TenantContext tenant = 1;
  string mpps_uid = 2;
  Mpps.MppsState new_state = 3;
  google.protobuf.Timestamp transition_time = 4;
  repeated string performed_protocol_codes = 5;
}

message Mpps {
  string mpps_uid = 1;
  DicomUid study_instance_uid = 2;
  enum MppsState {
    MPPS_STATE_UNSPECIFIED = 0;
    MPPS_STATE_IN_PROGRESS = 1;
    MPPS_STATE_DISCONTINUED = 2;
    MPPS_STATE_COMPLETED = 3;
  }
  MppsState state = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  repeated string performed_protocol_codes = 6;
}

// =====================================================
// Radiologist Worklist service
// =====================================================

service RadWorklistService {
  rpc GetWorklist(GetRadWorklistRequest) returns (GetRadWorklistResponse);
  rpc OpenWorklistItem(OpenWorklistItemRequest) returns (OpenWorklistItemResponse);
}

message GetRadWorklistRequest {
  TenantContext tenant = 1;
  string priority_filter = 2;
  string modality_filter = 3;
  string body_part_filter = 4;
  string subspecialty_filter = 5;
  PageRequest page = 6;
}

message RadWorklistItem {
  DicomUid study_instance_uid = 1;
  string priority = 2; // STAT | preliminary | routine | addendum
  string modality = 3;
  string body_part = 4;
  string patient_id = 5;
  string accession_number = 6;
  google.protobuf.Timestamp acquisition_time = 7;
  string subspecialty = 8;
  uint32 prior_count = 9;
}

message GetRadWorklistResponse {
  repeated RadWorklistItem items = 1;
  string next_page_token = 2;
  uint32 total = 3;
}

message OpenWorklistItemRequest {
  StudyKey study = 1;
  string radiologist_id = 2;
}

message OpenWorklistItemResponse {
  HangingProtocol hanging_protocol = 1;
  repeated DicomUid prior_studies = 2;
  bool ai_overlays_available = 3;
}

// =====================================================
// Hanging Protocol service
// =====================================================

service HangingProtocolService {
  rpc Match(MatchHangingProtocolRequest) returns (HangingProtocol);
  rpc Apply(ApplyHangingProtocolRequest) returns (ApplyHangingProtocolResponse);
}

message MatchHangingProtocolRequest {
  StudyKey study = 1;
  string radiologist_id = 2;
}

message HangingProtocol {
  string protocol_id = 1;
  uint32 match_tier = 2;
  google.protobuf.Struct layout = 3; // viewports + window/level + series order
  bool prior_comparison = 4;
}

message ApplyHangingProtocolRequest {
  StudyKey study = 1;
  string protocol_id = 2;
  string radiologist_id = 3;
}

message ApplyHangingProtocolResponse {
  bool applied = 1;
  string presentation_state_uid = 2;
}

// =====================================================
// Structured Report service
// =====================================================

service StructuredReportService {
  rpc StartDraft(StartDraftRequest) returns (StructuredReport);
  rpc Save(SaveReportRequest) returns (StructuredReport);
  rpc Sign(SignReportRequest) returns (SignReportResponse);
}

message StartDraftRequest {
  StudyKey study = 1;
  string template_id = 2;
  string radiologist_id = 3;
}

message StructuredReport {
  string id = 1;
  DicomUid study_instance_uid = 2;
  string template_id = 3;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_DRAFT = 1;
    STATUS_PRELIMINARY = 2;
    STATUS_FINAL = 3;
    STATUS_ADDENDUM = 4;
    STATUS_CORRECTED = 5;
  }
  Status status = 4;
  google.protobuf.Struct content = 5;
  repeated CriticalFinding critical_findings = 6;
  string signing_radiologist_id = 7;
  google.protobuf.Timestamp signed_at = 8;
  DicomUid dicom_sr_sop_instance_uid = 9;
  string fhir_diagnostic_report_id = 10;
}

message CriticalFinding {
  string code = 1;
  string criticality = 2; // I | II | III
  string description = 3;
}

message SaveReportRequest {
  string id = 1;
  google.protobuf.Struct content = 2;
  repeated CriticalFinding critical_findings = 3;
}

message SignReportRequest {
  string id = 1;
  string radiologist_id = 2;
}

message SignReportResponse {
  StructuredReport report = 1;
  string fhir_diagnostic_report_id = 2;
  DicomUid dicom_sr_sop_instance_uid = 3;
}

// =====================================================
// AI Marketplace service
// =====================================================

service AiMarketplaceService {
  rpc Dispatch(AiDispatchRequest) returns (AiDispatchResponse);
  rpc GetResult(AiGetResultRequest) returns (AiResult);
  rpc GetVendorHealth(AiGetVendorHealthRequest) returns (AiVendorHealth);
  rpc ListEnabledVendors(AiListEnabledVendorsRequest) returns (AiListEnabledVendorsResponse);
}

message AiDispatchRequest {
  StudyKey study = 1;
  string vendor = 2;
  string model_version = 3;
  string indication = 4;
}

message AiDispatchResponse {
  string dispatch_id = 1;
  string vendor = 2;
  uint32 estimated_completion_ms = 3;
}

message AiGetResultRequest {
  TenantContext tenant = 1;
  string dispatch_id = 2;
}

message AiResult {
  string dispatch_id = 1;
  string vendor = 2;
  google.protobuf.Timestamp completed_at = 3;
  repeated AiFinding findings = 4;
  uint32 round_trip_ms = 5;
}

message AiFinding {
  enum FindingKind {
    FINDING_UNSPECIFIED = 0;
    FINDING_BOUNDING_BOX = 1;
    FINDING_HEAT_MAP = 2;
    FINDING_VOLUMETRIC_ROI = 3;
    FINDING_QUANTIFICATION = 4;
    FINDING_TRIAGE = 5;
  }
  FindingKind kind = 1;
  string label = 2;
  float confidence = 3;
  google.protobuf.Struct geometry = 4;
}

message AiGetVendorHealthRequest {
  TenantContext tenant = 1;
  string vendor = 2;
}

message AiVendorHealth {
  string vendor = 1;
  float uptime = 2;
  uint32 p95_ms = 3;
  uint32 p99_ms = 4;
  float error_rate = 5;
  float ppv_week_over_week_delta_pct = 6;
  repeated FdaCeClearance clearances = 7;
}

message FdaCeClearance {
  string regulator = 1; // FDA | CE | KFDA | PMDA | ANVISA
  string clearance_number = 2;
  repeated string indications = 3;
  repeated string modalities = 4;
  google.protobuf.Timestamp cleared_date = 5;
}

message AiListEnabledVendorsRequest {
  TenantContext tenant = 1;
  string modality = 2;
}

message AiListEnabledVendorsResponse {
  repeated string vendors = 1;
}

// =====================================================
// Critical Result service
// =====================================================

service CriticalResultService {
  rpc StartEscalation(StartEscalationRequest) returns (Escalation);
  rpc Confirm(ConfirmEscalationRequest) returns (Escalation);
}

message StartEscalationRequest {
  TenantContext tenant = 1;
  string report_id = 2;
  string criticality = 3; // I | II | III
}

message Escalation {
  string id = 1;
  string report_id = 2;
  uint32 current_step = 3;
  string current_recipient_role = 4;
  string current_recipient_id = 5;
  google.protobuf.Timestamp next_escalation_at = 6;
  bool closed_loop_completed = 7;
}

message ConfirmEscalationRequest {
  TenantContext tenant = 1;
  string escalation_id = 2;
  string confirming_actor_id = 3;
}

// =====================================================
// Peer Review service
// =====================================================

service PeerReviewService {
  rpc GetQueue(GetPeerReviewQueueRequest) returns (PeerReviewQueueResponse);
  rpc Submit(SubmitPeerReviewRequest) returns (SubmitPeerReviewResponse);
}

message GetPeerReviewQueueRequest {
  TenantContext tenant = 1;
  string reviewer_id = 2;
}

message PeerReviewQueueResponse {
  repeated PeerReviewItem items = 1;
}

message PeerReviewItem {
  string id = 1;
  DicomUid study_instance_uid = 2;
  string sample_type = 3;
}

message SubmitPeerReviewRequest {
  TenantContext tenant = 1;
  string item_id = 2;
  uint32 radpeer_score = 3; // 1 | 2 | 3
  string notes = 4;
}

message SubmitPeerReviewResponse {
  string item_id = 1;
  bool submitted = 2;
}

// =====================================================
// Dose Tracking service
// =====================================================

service DoseTrackingService {
  rpc GetAggregate(GetDoseAggregateRequest) returns (DoseAggregate);
  rpc ExportEuratom(ExportEuratomRequest) returns (ExportEuratomResponse);
  rpc QueryDeviations(QueryDoseDeviationsRequest) returns (QueryDoseDeviationsResponse);
}

message GetDoseAggregateRequest {
  TenantContext tenant = 1;
  string patient_id = 2;
  string modality = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
}

message DoseAggregate {
  string patient_id = 1;
  float total_effective_dose_msv = 2;
  map<string, float> per_modality = 3;
  uint32 per_protocol_deviation_count = 4;
}

message ExportEuratomRequest {
  TenantContext tenant = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message ExportEuratomResponse {
  bytes xml_document = 1;
  string sha256 = 2;
}

message QueryDoseDeviationsRequest {
  TenantContext tenant = 1;
  string protocol_id = 2;
}

message QueryDoseDeviationsResponse {
  repeated DoseDeviation deviations = 1;
}

message DoseDeviation {
  DicomUid study_instance_uid = 1;
  string protocol_id = 2;
  string modality = 3;
  float dlp = 4;
  float target_dlp = 5;
  float deviation_ratio = 6;
  string technologist_id = 7;
  google.protobuf.Timestamp detected_at = 8;
}

// =====================================================
// Mammography Tracking service
// =====================================================

service MammographyTrackingService {
  rpc GetRecallQueue(GetMammographyRecallQueueRequest) returns (GetMammographyRecallQueueResponse);
  rpc GetBiradsAudit(GetBiradsAuditRequest) returns (BiradsAudit);
}

message GetMammographyRecallQueueRequest {
  TenantContext tenant = 1;
}

message GetMammographyRecallQueueResponse {
  repeated MammographyRecall items = 1;
}

message MammographyRecall {
  string patient_id = 1;
  string recall_reason = 2;
  string birads_category = 3;
  google.protobuf.Timestamp recall_date = 4;
  DicomUid screening_study_uid = 5;
}

message GetBiradsAuditRequest {
  TenantContext tenant = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message BiradsAudit {
  float recall_rate = 1;
  float positive_predictive_value = 2;
  float cancer_detection_rate = 3;
  float sensitivity = 4;
  float specificity = 5;
}

// =====================================================
// Patient Portal service
// =====================================================

service PatientPortalService {
  rpc IssueToken(IssuePortalTokenRequest) returns (PatientPortalToken);
  rpc RevokeToken(RevokePortalTokenRequest) returns (RevokePortalTokenResponse);
  rpc GetLaypersonSummary(GetLaypersonSummaryRequest) returns (LaypersonSummary);
}

message IssuePortalTokenRequest {
  TenantContext tenant = 1;
  string patient_id = 2;
  DicomUid study_instance_uid = 3;
  uint32 ttl_seconds = 4;
}

message PatientPortalToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string revocation_id = 3;
}

message RevokePortalTokenRequest {
  TenantContext tenant = 1;
  string revocation_id = 2;
}

message RevokePortalTokenResponse {
  bool revoked = 1;
}

message GetLaypersonSummaryRequest {
  StudyKey study = 1;
}

message LaypersonSummary {
  DicomUid study_instance_uid = 1;
  string plain_language = 2;
  string birads_category_if_applicable = 3;
  google.protobuf.Timestamp generated_at = 4;
}

// =====================================================
// VNA Federation service
// =====================================================

service VnaFederationService {
  rpc PullFromLegacy(PullFromLegacyRequest) returns (PullFromLegacyResponse);
  rpc QueryFederated(QueryFederatedRequest) returns (QueryFederatedResponse);
}

message PullFromLegacyRequest {
  TenantContext tenant = 1;
  string legacy_vendor = 2; // GE-EA | Philips-ISyntax-VNA | Sectra-VNA | Fujifilm-Synapse-VNA | Agfa-Impax-VNA | Merge-VNA
  DicomUid study_instance_uid = 3;
}

message PullFromLegacyResponse {
  bool pulled = 1;
  uint32 instance_count = 2;
  bool checksum_verified = 3;
}

message QueryFederatedRequest {
  TenantContext tenant = 1;
  string patient_id = 2;
  string ihe_profile = 3; // XCA-I | XDS-I.b
}

message QueryFederatedResponse {
  repeated FederatedStudy studies = 1;
}

message FederatedStudy {
  DicomUid study_instance_uid = 1;
  string home_community = 2;
  string modality = 3;
}

// =====================================================
// Modality Admin service
// =====================================================

service ModalityAdminService {
  rpc List(ListModalitiesRequest) returns (ListModalitiesResponse);
  rpc Register(RegisterModalityRequest) returns (Modality);
  rpc Deregister(DeregisterModalityRequest) returns (DeregisterModalityResponse);
}

message Modality {
  string id = 1;
  string modality = 2;
  string ae_title = 3;
  string host = 4;
  uint32 port = 5;
  repeated string accepted_sop_classes = 6;
  repeated string transfer_syntaxes = 7;
  bool dose_emission_enabled = 8;
  string vendor_quirks_profile = 9;
}

message ListModalitiesRequest {
  TenantContext tenant = 1;
}

message ListModalitiesResponse {
  repeated Modality modalities = 1;
}

message RegisterModalityRequest {
  TenantContext tenant = 1;
  Modality modality = 2;
}

message DeregisterModalityRequest {
  TenantContext tenant = 1;
  string modality_id = 2;
}

message DeregisterModalityResponse {
  bool deregistered = 1;
}
