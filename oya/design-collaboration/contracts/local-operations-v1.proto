// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.design_collaboration.local.v1;

message DesignCollaborationLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message DesignCollaborationLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message DesignCollaborationLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message DesignCollaborationLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message DesignCollaborationSupportedActions {
  string design_file_open_action = 1;
  string version_save_action = 2;
  string comment_sync_action = 3;
  string asset_preview_render_action = 4;
  string handoff_export_action = 5;
  string permission_check_action = 6;
}

service DesignCollaborationLocalOperationsService {
  rpc CheckLocalPolicy(DesignCollaborationLocalPolicyCheckRequest) returns (DesignCollaborationLocalPolicyDecision);
  rpc GetLocalSloState(DesignCollaborationLocalSloStateRequest) returns (DesignCollaborationLocalSloState);
}
