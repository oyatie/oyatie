apiVersion: openslo/v1
kind: SLO
metadata:
  name: design-collaboration-availability
  labels:
    service: design-collaboration
    adr: ADR-0139
spec:
  service: design-collaboration
  indicator:
    metadata:
      name: availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_availability_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_availability_total[5m]))
  objectives:
    - displayName: Design Collaboration availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
