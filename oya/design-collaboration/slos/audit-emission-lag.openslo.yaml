apiVersion: openslo/v1
kind: SLO
metadata:
  name: design-collaboration-audit-emission-lag
  labels:
    service: design-collaboration
    adr: ADR-0139
spec:
  service: design-collaboration
  indicator:
    metadata:
      name: audit-emission-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_audit_emission_lag_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_audit_emission_lag_total[5m]))
  objectives:
    - displayName: Design Collaboration audit-emission-lag
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
