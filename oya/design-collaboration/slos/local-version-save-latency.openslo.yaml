apiVersion: openslo/v1
kind: SLO
metadata:
  name: design-collaboration-version-save-latency
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: design-collaboration
  description: Design version save latency for design file loading, version saving, comment synchronization, asset preview, permission checks, and handoff export operations.
  indicator:
    metadata:
      name: version-save-latency
      labels:
        domain_object: DesignFile
        operator_audience: DESIGN_WORKSPACE_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_version_save_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_version_save_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Design version save latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
