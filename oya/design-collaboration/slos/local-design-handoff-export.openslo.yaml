apiVersion: openslo/v1
kind: SLO
metadata:
  name: design-collaboration-design-handoff-export
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: design-collaboration
  description: Design handoff exports completed for design file loading, version saving, comment synchronization, asset preview, permission checks, and handoff export operations.
  indicator:
    metadata:
      name: design-handoff-export
      labels:
        domain_object: DesignFile
        operator_audience: DESIGN_WORKSPACE_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_design_handoff_export_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_design_handoff_export_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Design handoff exports completed
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
