service:
  name: design-collaboration
  suite: local-operational-primitive
  audience: DESIGN_WORKSPACE_ADMIN
workloads:
  file-loader:
    replicas: 3
    sloMetric: oya_design_collaboration_file_load_time
  version-writer:
    replicas: 2
    sloMetric: oya_design_collaboration_version_save_latency
  comment-sync:
    replicas: 2
    sloMetric: oya_design_collaboration_comment_sync_latency
policy:
  directory: policies
  defaultDeny: true
