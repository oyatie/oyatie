apiVersion: oyatie.dev/v1
kind: SecretBindings
metadata:
  name: design-collaboration-secret-bindings
  labels:
    service: design-collaboration
    binding_adr: ADR-0253-amendment
spec:
  service: design-collaboration
  tenantScoped: true
  audienceType: DESIGN_TEAM_MEMBER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/creative-artifact-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Figma", "Adobe Creative Cloud", "Canva", "InVision", "Sketch"]
