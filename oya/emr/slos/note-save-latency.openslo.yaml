apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-note-save-latency
  microservice: emr
  bc: note
spec:
  description: Note autosave (CRDT-delta-flush) latency p99 ≤ 250ms — per US-INP-003 dictation persistence
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell) (rate(emr_note_save_duration_seconds_bucket[1m]))) <= 0.25
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell) (rate(emr_note_save_duration_seconds_count[1m]))
  objectives:
    - target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
