apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-audit-emission-lag
  microservice: emr
spec:
  description: |
    Lag between a state-change event recorded in EMR and the corresponding audit-chain
    Emit gRPC ack received. HIPAA pack default: audit lag p99 ≤ 5 seconds.
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell) (rate(emr_audit_emission_lag_seconds_bucket[1m]))) <= 5
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell) (rate(emr_audit_emission_lag_seconds_count[1m]))
  objectives:
    - target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
