apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-break-glass-review-latency
  microservice: emr
spec:
  description: |
    Compliance SLO: every break-glass invocation triggers a privacy-officer review
    that MUST close within 24 hours (HIPAA §164.530 — administrative procedures).
    Non-compliance causes a P1 incident escalation.
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell) (rate(emr_break_glass_review_within_24h_total[1m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell) (rate(emr_break_glass_invocations_total[1m]))
  objectives:
    - target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
