// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// patient-monitoring gRPC streaming surface
// Per ADR-0632: internal-only gRPC bidi over HTTP/2 with SPIFFE mTLS/TLS 1.3.
// Tenancy + HLC stamping enforced per ADR-0244 + ADR-0252.
// Cedar-gated at boundary per ADR-0243.

syntax = "proto3";

package oya.patient_monitoring.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// -----------------------------------------------------------------------------
// Common envelope
// -----------------------------------------------------------------------------

message Envelope {
  string tenant_id = 1;
  string cell_id = 2;
  string hlc = 3;
  string source = 4;
  string trace_id = 5;
}

message Quality {
  // 0.0..1.0 per channel sample
  double lead_confidence = 1;
  // valid | warning | invalid | unknown
  string quality_indicator = 2;
}

// -----------------------------------------------------------------------------
// VitalSignsService — 1-Hz numeric vitals bidi stream
// -----------------------------------------------------------------------------

service VitalSignsService {
  rpc StreamVitalSigns(stream VitalSignsClientMessage) returns (stream VitalSignsServerMessage);
  rpc GetVitalSignsHistory(VitalSignsHistoryRequest) returns (VitalSignsHistoryResponse);
}

message VitalSignsClientMessage {
  oneof kind {
    VitalSignsSubscribeRequest subscribe = 1;
    VitalSignsAck ack = 2;
    VitalSignsBackpressureSignal backpressure = 3;
  }
}

message VitalSignsServerMessage {
  oneof kind {
    VitalSignsSample sample = 1;
    VitalSignsBatch batch = 2;
    VitalSignsControlEvent control = 3;
  }
}

message VitalSignsSubscribeRequest {
  Envelope envelope = 1;
  string bed_id_or_patient_id = 2;
  repeated string parameter_loinc_filter = 3;
  google.protobuf.Timestamp start_from = 4;
}

message VitalSignsAck {
  string sample_id = 1;
}

message VitalSignsBackpressureSignal {
  // client requests reduced rate
  double max_samples_per_second = 1;
}

message VitalSignsSample {
  Envelope envelope = 1;
  string sample_id = 2;
  string channel_id = 3;
  string parameter_loinc = 4;
  google.protobuf.Timestamp t_device_clock = 5;
  string t_emit_hlc = 6;
  double value = 7;
  string unit_code = 8;
  Quality quality = 9;
  string source_device_id = 10;
  bool replay_flag = 11;
}

message VitalSignsBatch {
  Envelope envelope = 1;
  string batch_id = 2;
  repeated VitalSignsSample samples = 3;
}

message VitalSignsControlEvent {
  Envelope envelope = 1;
  string event_class = 2; // session-started, session-ended, channel-config-changed, etc.
  string detail = 3;
}

message VitalSignsHistoryRequest {
  Envelope envelope = 1;
  string bed_id_or_patient_id = 2;
  repeated string parameter_loinc = 3;
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
  string aggregation = 6; // raw | 1m | 5m | 1h
}

message VitalSignsHistoryResponse {
  repeated VitalSignsSample samples = 1;
}

// -----------------------------------------------------------------------------
// WaveformService — 50-1000 Hz high-frequency waveform bidi stream
// Binary waveform payload referenced via batch_payload_ref or carried inline.
// -----------------------------------------------------------------------------

service WaveformService {
  rpc StreamWaveform(stream WaveformClientMessage) returns (stream WaveformServerMessage);
  rpc RetrieveWaveform(WaveformRetrievalRequest) returns (WaveformRetrievalResponse);
  rpc StartReplay(WaveformReplayRequest) returns (stream WaveformBatch);
}

message WaveformClientMessage {
  oneof kind {
    WaveformSubscribeRequest subscribe = 1;
    WaveformAck ack = 2;
    WaveformBackpressureSignal backpressure = 3;
    WaveformRequestReplay request_replay = 4;
  }
}

message WaveformServerMessage {
  oneof kind {
    WaveformBatch batch = 1;
    WaveformControlEvent control = 2;
  }
}

message WaveformSubscribeRequest {
  Envelope envelope = 1;
  string bed_id = 2;
  repeated string waveform_type_filter = 3; // ecg, pleth, art, cvp, icp, pap, resp, capnogram, eeg, emg
  uint32 max_sample_rate_hz = 4;
}

message WaveformAck {
  string batch_id = 1;
}

message WaveformBackpressureSignal {
  double max_batches_per_second = 1;
}

message WaveformRequestReplay {
  string bed_id = 1;
  string channel_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message WaveformBatch {
  Envelope envelope = 1;
  string batch_id = 2;
  string channel_id = 3;
  string waveform_type = 4;
  uint32 sample_rate_hz = 5;
  uint32 bit_depth = 6;
  string batch_start_hlc = 7;
  uint32 batch_duration_ms = 8;
  // Either an inline binary batch or a reference to an object-storage URI.
  bytes batch_payload_inline = 9;
  string batch_payload_ref = 10;
  bool alarm_episode_flag = 11;
}

message WaveformControlEvent {
  Envelope envelope = 1;
  string event_class = 2;
  string detail = 3;
}

message WaveformRetrievalRequest {
  Envelope envelope = 1;
  string bed_id = 2;
  string channel_id = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  string tier = 6; // hot | warm | cold
}

message WaveformRetrievalResponse {
  repeated WaveformBatch batches = 1;
  uint32 total_batches = 2;
  bool truncated = 3;
}

message WaveformReplayRequest {
  Envelope envelope = 1;
  string bed_id = 2;
  string channel_id = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  double playback_rate = 6; // 1.0 = real-time, 4.0 = 4x speed
}

// -----------------------------------------------------------------------------
// AlarmService — server-streaming with client-driven ack
// -----------------------------------------------------------------------------

service AlarmService {
  rpc StreamAlarms(AlarmSubscribeRequest) returns (stream AlarmEvent);
  rpc AcknowledgeAlarm(AlarmAckRequest) returns (AlarmAckResponse);
  rpc SuppressAlarm(AlarmSuppressRequest) returns (AlarmSuppressResponse);
}

message AlarmSubscribeRequest {
  Envelope envelope = 1;
  string unit_id = 2;
  repeated string bed_ids = 3;
  repeated string severity_filter = 4;
}

message AlarmEvent {
  Envelope envelope = 1;
  string alarm_id = 2;
  string bed_id = 3;
  string rule_id = 4;
  string severity = 5;
  string event_class = 6; // fired | escalated | acked | suppressed | cleared
  string detail = 7;
  string t_event_hlc = 8;
}

message AlarmAckRequest {
  Envelope envelope = 1;
  string alarm_id = 2;
  string clinician_id = 3;
  string device_id = 4;
  string note = 5;
}

message AlarmAckResponse {
  bool accepted = 1;
  string reason_if_denied = 2;
}

message AlarmSuppressRequest {
  Envelope envelope = 1;
  string alarm_id = 2;
  string physician_id = 3;
  string justification = 4;
  uint32 duration_minutes = 5;
}

message AlarmSuppressResponse {
  bool accepted = 1;
  string reason_if_denied = 2;
  string suppression_id = 3;
}

// -----------------------------------------------------------------------------
// CentralStationService — unit-wide subscription
// -----------------------------------------------------------------------------

service CentralStationService {
  rpc SubscribeUnitView(UnitViewSubscribeRequest) returns (stream UnitViewUpdate);
}

message UnitViewSubscribeRequest {
  Envelope envelope = 1;
  string unit_id = 2;
  uint32 max_beds_in_view = 3; // 4, 8, 16, 32
  string client_render_target = 4; // linux-sdl2-kiosk | windows-winui3 | macos-apple-silicon | ios | android
}

message UnitViewUpdate {
  Envelope envelope = 1;
  string unit_id = 2;
  repeated BedSnapshot beds = 3;
  string t_update_hlc = 4;
}

message BedSnapshot {
  string bed_id = 1;
  string label = 2;
  repeated VitalSignsSample latest_vitals = 3;
  string most_critical_recent_alarm_id = 4;
  string most_critical_recent_alarm_severity = 5;
  double deterioration_score_latest = 6;
  string coverage_state = 7;
}

// -----------------------------------------------------------------------------
// DeteriorationService — score retrieval + push
// -----------------------------------------------------------------------------

service DeteriorationService {
  rpc StreamScores(DeteriorationSubscribeRequest) returns (stream DeteriorationScoreEvent);
  rpc GetScores(DeteriorationHistoryRequest) returns (DeteriorationHistoryResponse);
}

message DeteriorationSubscribeRequest {
  Envelope envelope = 1;
  string unit_id = 2;
  repeated string bed_ids = 3;
  string scoring_method = 4;
}

message DeteriorationScoreEvent {
  Envelope envelope = 1;
  string bed_id = 2;
  string scoring_method = 3;
  double score = 4;
  double delta_from_prior = 5;
  string threshold_breached = 6;
  string lineage_id = 7;
  string t_predicted_hlc = 8;
  map<string, double> components = 9;
}

message DeteriorationHistoryRequest {
  Envelope envelope = 1;
  string bed_id = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
}

message DeteriorationHistoryResponse {
  repeated DeteriorationScoreEvent scores = 1;
}

// -----------------------------------------------------------------------------
// SepsisService
// -----------------------------------------------------------------------------

service SepsisService {
  rpc StreamWarnings(SepsisSubscribeRequest) returns (stream SepsisWarningEvent);
}

message SepsisSubscribeRequest {
  Envelope envelope = 1;
  string unit_id = 2;
  repeated string bed_ids = 3;
}

message SepsisWarningEvent {
  Envelope envelope = 1;
  string bed_id = 2;
  double sepsis_score = 3;
  uint32 qsofa = 4;
  uint32 sofa = 5;
  string alert_class = 6; // moderate | high | code-sepsis-suggested
  string lineage_id = 7;
  string t_warn_hlc = 8;
}

// -----------------------------------------------------------------------------
// CodeBlueService
// -----------------------------------------------------------------------------

service CodeBlueService {
  rpc Activate(CodeBlueActivateRequest) returns (CodeBlueActivateResponse);
  rpc StartPlayback(CodeBluePlaybackRequest) returns (stream WaveformBatch);
}

message CodeBlueActivateRequest {
  Envelope envelope = 1;
  string bed_id = 2;
  string activator_id = 3;
  string activation_class = 4; // manual | auto-non-ack | suggested-sepsis | suggested-deterioration
  string type = 5; // code-blue | rapid-response | code-sepsis | code-stroke | code-trauma
  string rationale = 6;
}

message CodeBlueActivateResponse {
  bool accepted = 1;
  string activation_id = 2;
  string reason_if_denied = 3;
}

message CodeBluePlaybackRequest {
  Envelope envelope = 1;
  string activation_id = 2;
  double playback_rate = 3;
}

// -----------------------------------------------------------------------------
// RpmService + WearableService
// -----------------------------------------------------------------------------

service RpmService {
  rpc Enroll(RpmEnrollRequest) returns (RpmEnrollResponse);
  rpc GetDashboard(RpmDashboardRequest) returns (RpmDashboardResponse);
}

message RpmEnrollRequest {
  Envelope envelope = 1;
  string patient_id = 2;
  string program = 3;
  string consent_id = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp planned_end = 6;
}

message RpmEnrollResponse {
  string enrollment_id = 1;
}

message RpmDashboardRequest {
  Envelope envelope = 1;
  string patient_id = 2;
}

message RpmDashboardResponse {
  string patient_id = 1;
  double escalation_score = 2;
  double adherence_score = 3;
}

service WearableService {
  rpc StartSession(WearableStartSessionRequest) returns (WearableStartSessionResponse);
  rpc EndSession(WearableEndSessionRequest) returns (WearableEndSessionResponse);
}

message WearableStartSessionRequest {
  Envelope envelope = 1;
  string patient_id = 2;
  string wearable_class = 3;
  string device_identifier = 4;
  string consent_id = 5;
}

message WearableStartSessionResponse {
  string session_id = 1;
}

message WearableEndSessionRequest {
  Envelope envelope = 1;
  string session_id = 2;
  string reason = 3;
}

message WearableEndSessionResponse {
  bool accepted = 1;
}
