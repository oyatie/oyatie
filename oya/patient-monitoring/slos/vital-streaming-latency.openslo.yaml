# Canonical-base: specs/openslo/canonical-envelope-schema.json
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-vital-streaming-latency
  displayName: "patient-monitoring: vital-signs end-to-end streaming latency p99 ≤ 250 ms"
  labels:
    microservice: patient-monitoring
    bounded_context: vital-signs-stream
    sli_class: latency
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Vital-signs streaming end-to-end latency p99 SLO. A "good" event is a
    numeric vitals sample delivered from device-receipt to subscribed gRPC
    consumer within 250 ms. Critical for clinician safety contract per ADR-0332.
  indicator:
    metadata:
      name: vital-streaming-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_vital_stream_e2e_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_vital_stream_e2e_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 250 ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
