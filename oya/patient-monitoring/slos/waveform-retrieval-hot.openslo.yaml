apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-waveform-retrieval-hot
  displayName: "patient-monitoring: hot-tier waveform retrieval p99 ≤ 2 s"
  labels:
    microservice: patient-monitoring
    bounded_context: waveform-archive
    sli_class: latency
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Hot-tier (0-7 days) waveform retrieval p99 ≤ 2 s. Critical for
    code-blue playback + ICU rounds review.
  indicator:
    metadata:
      name: waveform-retrieval-hot-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_waveform_retrieval_seconds_bucket{tier="hot",le="2.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_waveform_retrieval_seconds_count{tier="hot"}[5m]))
  objectives:
    - target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
