apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-sepsis-inference-latency
  displayName: "patient-monitoring: sepsis ML inference p99 ≤ 200 ms"
  labels:
    microservice: patient-monitoring
    bounded_context: sepsis-early-warning
    sli_class: latency
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Sepsis ML inference latency p99 ≤ 200 ms. A "good" inference is one
    whose end-to-end latency from input snapshot ready to score emitted is
    within 200 ms.
  indicator:
    metadata:
      name: sepsis-inference-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_sepsis_inference_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_sepsis_inference_seconds_count[5m]))
  objectives:
    - target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
