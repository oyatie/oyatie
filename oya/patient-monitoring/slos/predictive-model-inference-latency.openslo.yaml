apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-predictive-model-inference-latency
  displayName: "patient-monitoring: deterioration + sepsis inference p99 ≤ 200 ms"
  labels:
    microservice: patient-monitoring
    bounded_context: deterioration-prediction
    sli_class: latency
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Deterioration + sepsis ML inference latency p99 SLO ≤ 200 ms per bed
    per evaluation. A "good" inference is one whose end-to-end latency
    (feature-build + LightGBM forward + Platt calibrate) is within 200 ms.
  indicator:
    metadata:
      name: predictive-model-inference-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_ml_inference_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_ml_inference_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 200 ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
