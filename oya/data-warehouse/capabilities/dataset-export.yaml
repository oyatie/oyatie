apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-dataset-export
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: dataset
  capability: dataset-export
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0243, ADR-0244, ADR-0314, ADR-0321, ADR-0329, ADR-0331]
  benchmarks: ["BigQuery export", "Snowflake COPY INTO"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        export_bytes_per_month_max: 1073741824  # 1 GiB
    paid:
      allowed: true
      billingComponents:
        - storage_bytes
        - egress_gb
  marketplaceSettlement: DealSet
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-lineage-export-egress.cedar
