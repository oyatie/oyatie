apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-iceberg-metadata-register
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: lake-table
  capability: iceberg-metadata-register
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0329, ADR-0331]
  benchmarks: ["BigLake Iceberg", "Snowflake Iceberg external", "Databricks UniForm"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        tables_max: 5
    paid:
      allowed: true
      billingComponents: []  # catalog operation only; underlying storage accrues separately
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-unity-catalog-class.cedar
  ipBindings: [IP-032, IP-034]
