apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-unity-catalog-namespace-bind
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: governed-share
  capability: unity-catalog-namespace-bind
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0131, ADR-0145, ADR-0243, ADR-0244, ADR-0329, ADR-0331]
  benchmarks: ["Databricks Unity Catalog", "BigQuery Information Schema"]
  namespaceLevels: 3  # catalog.schema.object
  objectKinds:
    [lake_table, semantic_view, share, external_table, materialized_view, vector_index, model_reference]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        catalogs_max: 1
        schemas_per_catalog_max: 5
        objects_per_schema_max: 50
    paid:
      allowed: true
      billingComponents: []  # catalog op; no per-event accrual
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-unity-catalog-class.cedar
  sloBindings:
    - unity-catalog-namespace-resolve-latency.openslo.yaml
  ipBindings: [IP-034]
