apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: data-warehouse-local-ops
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: data-warehouse
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_data_warehouse_freshness_good_total
    - oya_data_warehouse_completeness_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-pipeline-sla-tier-scope.cedar
