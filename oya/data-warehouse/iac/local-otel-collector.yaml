apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: data-warehouse-local-otel
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      attributes/local-domain:
        actions:
          - key: service.name
            value: data-warehouse
            action: upsert
          - key: oyatie.domain_object
            value: WarehouseDataset
            action: upsert
    exporters:
      otlphttp:
        endpoint: http://observability-ingest.observability.svc:4318
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [attributes/local-domain]
          exporters: [otlphttp]
