# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:observability:slo-evaluate:v1
name: slo-evaluate
namespace: observability
display_name: Evaluate SLO Compliance
description: |
  Compute the burn-rate state for a given (microservice, sli, target_env) tuple by querying
  Prometheus/Mimir over multi-window lookback (1h / 6h / 3d / 30d) per Google SRE Workbook
  ch. 5 and return the eligibility verdict (eligible | held | rejected | rollback).

owner_team: axis-observability
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0139, ADR-0131]
related_specs: [/specs/agentic-slo-gated-promotion.json]
related_artifacts:
  - microservices/observability/PRD.md
  - microservices/observability/contracts/openapi/slo-engine.yaml
  - microservices/observability/policy/tenant-scope.cedar

autonomy_tier: T2
# T2 = read-only sensitive data + write to ledger; not a tier-3 destructive op
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: microservice
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: sli
    type: enum
    values: [availability, latency, correctness, freshness]
    required: true
  - name: target_env
    type: enum
    values: [staging, production]
    required: true
  - name: source_sha
    type: string
    pattern: '^[a-f0-9]{40}$'
    required: true

outputs:
  - name: verdict
    type: enum
    values: [eligible, held, rejected, rollback]
  - name: burn_rate_snapshot
    type: object
    schema: BurnRateSnapshot (per asyncapi/eligibility-events.yaml)
  - name: evaluated_at
    type: timestamp
  - name: evaluator_version
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # SLI inputs (request counts, latencies, error rates) flow through this capability;
  # PII / PHI never present at this layer (redacted at OTel SDK by source µservice).
  - AUDIT
  # Verdict emission is itself an audit event.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.observability.eligibility.verdict
# This capability emits to the audit-chain evidence-topic stream per Bominal ADR-0028.

cost_profile:
  type: per-evaluation
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Mimir PromQL query (1h + 6h + 3d + 30d range queries)
    - Recording-rule pre-aggregation (amortized)

cedar_policy_fragments:
  - microservices/observability/policy/tenant-scope.cedar
  - microservices/observability/policy/ci-scope.cedar

eval_set:
  reference_inputs_path: microservices/observability/capabilities/eval/slo-evaluate-reference.jsonl
  pass_threshold: 0.99
  eval_metric: verdict-correctness-against-reference-google-sre-workbook-values
  cadence: per-release
  reference: Google SRE Workbook ch. 5 §"Worked examples — Multiwindow, Multi-Burn-Rate Alerts"

sunset:
  status: none
  notes: ""
