# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Skeleton values authored 2026-05-18 per ADR-0170.
# Full values tracked under registry/placeholder-debt/adr-follow-ups.yaml
# #adr-0170-backstage-helm-impl.

backstage:
  app:
    baseUrl: "https://portal.oya.internal"
  auth:
    providers:
      - oauth2  # via tenancy µservice per ADR-0002 + ADR-0170 §"Deployment shape"
  catalog:
    locations:
      # Discovery of per-µservice manifests per ADR-0170 §"Catalog metadata injection".
      - type: github-discovery
        target: "https://github.com/oyatie/oya/blob/main/microservices/*/manifest.json"
      - type: github-discovery
        target: "https://github.com/oyatie/oya/blob/main/crates/oya-*/Cargo.toml"
      # ADR index per ADR-0170 §"Plugin set v1" adr-plugin.
      - type: url
        target: "https://github.com/oyatie/oya/blob/main/docs/decisions"
  techdocs:
    builder: external                # built in CI per ADR-0170 §"Operational" #4
    publisher: { type: googleGcs }   # or s3 per pack; per ADR-0049 residency
  plugins:
    enabled:
      - catalog
      - techdocs
      - scaffolder        # new-µservice templates per ADR-0131
      - github-actions
      - argo-cd           # ADR-0171
      - grafana           # ADR-0139 SLO embed
      - pagerduty
      - tech-insights     # scorecards
      - cost-insights     # per ADR-0117 cost budgets
      - adr-plugin        # community
backstage-catalog-postgres:
  primary:
    persistence:
      enabled: true
      size: 50Gi
