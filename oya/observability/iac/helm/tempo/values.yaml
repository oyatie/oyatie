# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
tempo-distributed:
  image:
    tag: "3.0.0"
  tempo:
    structuredConfig:
      multitenancy_enabled: true
      storage:
        trace:
          backend: s3
          s3:
            endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
            bucket: "${OCI_TEMPO_BUCKET}"
            access_key: "${openbao:secret/observability/tempo/s3-access-key}"
            secret_key: "${openbao:secret/observability/tempo/s3-secret-key}"
      retention_period: 168h  # 7d hot per data-residency.md
  # Replicas per capacity-model.md XS tier
  distributor:
    replicas: 2
  ingester:
    replicas: 2
  querier:
    replicas: 2
