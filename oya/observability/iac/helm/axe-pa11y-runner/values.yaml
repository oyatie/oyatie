# Canonical-base: microservices/governance/iac/helm/_oya-helpers (per ADR-0064)
# axe-core + pa11y CI runner per ADR-0207.

image:
  repository: oya/axe-pa11y-runner          # in-house image; published via release-musl pipeline (per ADR-0181)
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Per-stack runner mode:
#   - web     → axe-core/playwright + pa11y
#   - swiftui → Apple Accessibility Inspector (out-of-cluster macOS runner; this Job emits the spec)
#   - compose → Android Accessibility Scanner CI (out-of-cluster Android emulator runner)
#   - gtk4    → AT-SPI conformance test (in-cluster)
#   - winui3  → Accessibility Insights for Windows (out-of-cluster Windows runner)
mode: web

# WCAG target.
wcagTarget: aa   # aa | aaa

axeCore:
  rulesetPath: /etc/oya/a11y/axe-config.json         # mounted from clients/a11y/axe-config.json
  rulesetAaaPath: /etc/oya/a11y/axe-aaa-config.json  # mounted when wcagTarget=aaa
  tags:
    - wcag2a
    - wcag2aa
    - wcag22a
    - wcag22aa
  # disableRules: []  # ADR-0207: empty by default; per-µservice override requires written rationale

pa11y:
  standard: WCAG2AA
  timeout: 30000
  wait: 1500

# Target URLs to scan; CD passes preview URLs from the PR build.
targetUrls: []
#   - https://pr-123.preview.workflow-studio.dev.oya
#   - https://pr-123.preview.ops-portal.dev.oya

evidence:
  emit: true
  # Audit-chain seal per ADR-0145; report hash lands in audit chain ledger.
  destinationPath: evidence/a11y/pr-{{ .Values.prNumber }}.json

# Fail behavior — fail PR on any AA criterion violation; warning-only for AAA on AA surfaces.
fail:
  onAaCriterionViolation: true
  onAaaCriterionViolation: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Job runs once per PR; cleanup after 1 hour.
ttlSecondsAfterFinished: 3600
