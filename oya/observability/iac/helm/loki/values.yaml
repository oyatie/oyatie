# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
loki:
  image:
    tag: "3.5.0"
  auth_enabled: true  # MANDATORY multi-tenancy
  loki:
    structuredConfig:
      limits_config:
        ingestion_rate_mb: 10  # per-tenant
        ingestion_burst_size_mb: 20
        max_streams_per_user: 5000
        retention_period: 336h  # 14d hot per data-residency.md retention matrix
      storage_config:
        aws:
          s3: "${openbao:secret/observability/loki/s3-url}"
      schema_config:
        configs:
          - from: 2026-05-17
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
  # Replica counts per capacity-model.md XS tier
  distributor:
    replicas: 4
  ingester:
    replicas: 8
  querier:
    replicas: 4
  indexGateway:
    replicas: 2
