{{- /*
Dev-cell bootstrap Secret for grafana-admin credentials.

Why this exists:
  The ExternalSecret (grafana-admin-externalsecret.yaml) projects credentials
  from OpenBao. On the dev-cell (oya-local) OpenBao starts sealed and there is
  no ClusterSecretStore registered until an operator unseals it and runs
  `bao kv put oya/observability/grafana-admin admin-user=admin admin-password=...`.
  Until that happens the ExternalSecret stays in SecretSyncedError and the
  grafana-admin Secret is never created, causing the Grafana pod to crash with
  CreateContainerConfigError: secret "grafana-admin" not found.

  This template emits a *non-sensitive placeholder* Secret for dev-cell only
  (config.environment != production). It is gated on:
    grafana.devBootstrapSecret.enabled: true   (only set in dev values)

  The ExternalSecret's creationPolicy=Owner means once OpenBao is unsealed and
  the ES syncs successfully, it will adopt and overwrite this Secret with real
  credentials. No manual deletion is required.

  ADR-0043: secret material MUST NOT be in git for production. This template
  is excluded from production render by the environment gate below.
*/ -}}
{{- if and .Values.grafana.enabled .Values.grafana.devBootstrapSecret.enabled -}}
{{- if ne (.Values.config.environment | default "development") "production" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.admin.existingSecret | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/managed-by: Helm
    oyatie.com/secret-class: dev-bootstrap
    oyatie.com/adr-0043: "non-production-bootstrap-only; overwritten by ExternalSecret once OpenBao unsealed"
  annotations:
    oyatie.com/bootstrap-note: >
      Dev-cell placeholder. Real credentials are projected by the grafana-admin
      ExternalSecret once OpenBao is unsealed and the kv path
      oya/observability/grafana-admin is populated. This Secret will be adopted
      and overwritten by the ExternalSecret (creationPolicy=Owner).
type: Opaque
stringData:
  {{ .Values.grafana.admin.userKey }}: {{ .Values.grafana.devBootstrapSecret.adminUser | quote }}
  {{ .Values.grafana.admin.passwordKey }}: {{ .Values.grafana.devBootstrapSecret.adminPassword | quote }}
{{- end -}}
{{- end -}}
