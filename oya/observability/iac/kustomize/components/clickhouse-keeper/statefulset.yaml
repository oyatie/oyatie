apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-keeper
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-keeper
  serviceName: clickhouse-keeper
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-keeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: clickhouse-keeper
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: clickhouse-keeper
          image: "clickhouse/clickhouse-keeper:26.3.10.60-lts"
          imagePullPolicy: IfNotPresent
          ports:
            - name: keeper
              containerPort: 9181
            - name: raft
              containerPort: 9234
            - name: metrics
              containerPort: 9182
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: keeper-data
              mountPath: /var/lib/clickhouse-keeper
            - name: keeper-config
              mountPath: /etc/clickhouse-keeper
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 9181
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9181
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: keeper-config
          configMap:
            name: clickhouse-keeper-config
  volumeClaimTemplates:
    - metadata:
        name: keeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-fast
        resources:
          requests:
            storage: 20Gi
