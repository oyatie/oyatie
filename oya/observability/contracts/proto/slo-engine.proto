// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-observability-slo-engine — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/slo-engine.yaml.
// Per ADR-0139 + ADR-0131.

syntax = "proto3";

package oya.observability.slo_engine.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: SloEngine
// =========================================================================
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata key "x-scope-orgid" = "tenant:<hashed-id>".

service SloEngine {
  // Read the latest eligibility verdict for a (microservice, env, sha) tuple.
  rpc GetEligibilityVerdict(GetEligibilityVerdictRequest)
      returns (EligibilityVerdict);

  // Stream all verdict transitions for a microservice (long-poll / subscribe).
  rpc StreamEligibilityVerdicts(StreamEligibilityVerdictsRequest)
      returns (stream EligibilityVerdict);

  // Read the current release pointer.
  rpc GetReleasePointer(GetReleasePointerRequest)
      returns (ReleasePointer);

  // List OpenSLO manifests for a microservice.
  rpc ListOpenSloManifests(ListOpenSloManifestsRequest)
      returns (ListOpenSloManifestsResponse);

  // Read one OpenSLO manifest.
  rpc GetOpenSloManifest(GetOpenSloManifestRequest)
      returns (OpenSloManifest);

  // Schema-validate an OpenSLO manifest (anonymous-allowed).
  rpc ValidateOpenSloSchema(ValidateOpenSloSchemaRequest)
      returns (ValidateOpenSloSchemaResponse);

  // Read current burn-rate values for a (microservice, env, sli) tuple.
  rpc GetBurnRate(GetBurnRateRequest) returns (BurnRateSnapshot);
}

// =========================================================================
// Common types
// =========================================================================

enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_STAGING = 1;
  ENVIRONMENT_PRODUCTION = 2;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ELIGIBLE = 1;
  VERDICT_HELD = 2;
  VERDICT_REJECTED = 3;
  VERDICT_ROLLBACK = 4;
}

enum SliType {
  SLI_TYPE_UNSPECIFIED = 0;
  SLI_TYPE_AVAILABILITY = 1;
  SLI_TYPE_LATENCY = 2;
  SLI_TYPE_CORRECTNESS = 3;
  SLI_TYPE_FRESHNESS = 4;
}

message BurnRateSnapshot {
  double fast_burn_1h = 1;
  double slow_burn_6h = 2;
  double ticket_burn_3d = 3;
  double budget_remaining_pct = 4;
}

message EligibilityVerdict {
  string microservice = 1;
  string source_sha = 2;
  Environment target_env = 3;
  Verdict verdict = 4;
  google.protobuf.Timestamp evaluated_at = 5;
  string evaluator_version = 6;
  BurnRateSnapshot burn_rate_snapshot = 7;
  string trigger_event_id = 8;
  string openslo_manifest_sha = 9;
  string signature = 10;
}

message ReleasePointer {
  string microservice = 1;
  Environment environment = 2;
  string current_sha = 3;
  string prior_sha = 4;
  google.protobuf.Timestamp advanced_at = 5;
}

message OpenSloManifest {
  string microservice = 1;
  string sli = 2;
  bytes manifest_yaml = 3;
  string manifest_sha = 4;
}

// =========================================================================
// Request / response messages
// =========================================================================

message GetEligibilityVerdictRequest {
  string microservice = 1;
  string source_sha = 2;
  Environment target_env = 3;
}

message StreamEligibilityVerdictsRequest {
  string microservice = 1;
  Environment target_env = 2;
  google.protobuf.Timestamp since = 3;
}

message GetReleasePointerRequest {
  string microservice = 1;
  Environment environment = 2;
}

message ListOpenSloManifestsRequest {
  string microservice = 1;
}

message ListOpenSloManifestsResponse {
  repeated OpenSloManifest manifests = 1;
}

message GetOpenSloManifestRequest {
  string microservice = 1;
  string sli = 2;
}

message ValidateOpenSloSchemaRequest {
  bytes manifest_yaml = 1;
}

message ValidateOpenSloSchemaResponse {
  bool valid = 1;
  repeated SchemaError errors = 2;
}

message SchemaError {
  uint32 line = 1;
  uint32 column = 2;
  string message = 3;
}

message GetBurnRateRequest {
  string microservice = 1;
  Environment environment = 2;
  string sli = 3;
}
