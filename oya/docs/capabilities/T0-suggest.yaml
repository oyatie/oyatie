# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T0-suggest capabilities — docs µservice
#
# Autonomy Tier 0: "suggest only; human accepts/rejects". Docs surfaces here are
# safe-by-construction because their effect is a UI suggestion the user can accept
# or ignore. No autonomous action; no data flow change.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 §"autonomy tiering".
# Per ADR-0140 (retired per ADR-0145) Cedar policy enforcement.
# Per EU AI Act Art. 50 transparency (AI-generated suggestions labelled).
# Per ADR-DOCS-0005 (AI writing-assist scope).

doc_class: AutonomyTierCatalog
microservice: docs
tier: T0
owner_team: axis-docs + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T0-docs-grammar-suggest
    name: "Grammar + spell-check suggestion (inline)"
    description: |
      The user is authoring; the assistant inline-flags grammar / spelling issues
      and offers a corrective edit. The flag is a non-modal squiggle; user
      clicks to accept the proposed edit or ignore.
    surface: editor-ui (REST POST /v1/assist/grammar-suggest)
    triggers:
      - user has typed ≥ 5 words in a block AND idle for ≥ 800ms
      - user explicitly requests "check grammar"
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: INTERNAL_ONLY (grammar suggestion delta only)
    model:
      primary: tenant-default-llm (foundry-runtime managed)
      fallback: rule-based (LanguageTool offline grammar rules)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 200
    audit_event: DocsGrammarSuggestionShown (per-suggestion; minimal payload — block id hash + suggestion type)
    fallback_on_model_failure: silent skip — falls back to rule-based grammar
    risk_classification: minimal-risk (Annex III §3 NOT triggered — grammar-check is not employment/HR decision-making)
    user_label: "AI suggestion — click to accept"  # Art. 50 transparency

  - id: T0-docs-title-suggest
    name: "Document title suggestion (from content)"
    description: |
      Suggest a document title from the first paragraph + initial heading +
      block-tree context. Shown when the user creates an untitled doc and has
      typed some content.
    surface: editor-ui (REST POST /v1/assist/title-suggest)
    triggers:
      - user creates new doc AND has written ≥ 100 words AND title is empty
      - user explicitly requests "suggest title"
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: INTERNAL_ONLY (title text)
    model:
      primary: tenant-default-llm
      fallback: '"Untitled — <timestamp>" template'
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 300
    audit_event: DocsTitleSuggestionShown
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk
    user_label: "AI suggestion — Tab to accept"

  - id: T0-docs-toc-suggest
    name: "Table-of-contents suggestion (from heading structure)"
    description: |
      Suggest a table-of-contents block based on the document's heading
      hierarchy. Shown when the document has ≥ 3 headings.
    surface: editor-ui (REST POST /v1/assist/toc-suggest)
    triggers:
      - user invokes "insert TOC" command AND doc has ≥ 3 headings
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: INTERNAL_ONLY (TOC block content; deterministic from heading structure — LLM optional for ordering hints)
    model:
      primary: rule-based (deterministic heading traversal)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 100
    audit_event: DocsTocSuggestionShown
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic logic; no LLM inference)
    user_label: "AI suggestion — click to accept"

  - id: T0-docs-formatting-suggest
    name: "Block-formatting suggestion (heading / list / callout detection)"
    description: |
      Suggest converting a paragraph block to a structured block (heading,
      list, callout) based on content shape. E.g., a paragraph starting with
      "# " gets a heading suggestion; "- " gets a list suggestion.
    surface: editor-ui (REST POST /v1/assist/formatting-suggest)
    triggers:
      - user types content matching a known Markdown-shape pattern
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: INTERNAL_ONLY
    model:
      primary: rule-based (deterministic CommonMark+GFM pattern matcher)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 50
    audit_event: DocsFormattingSuggestionShown
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic logic)
    user_label: "AI suggestion — Tab to accept"

  - id: T0-docs-link-suggest
    name: "Cross-document link suggestion (mention)"
    description: |
      When the user types `@` or `[[`, suggest matching docs / users / blocks
      from the tenant's accessible scope. Per the user's per-block ACL access.
    surface: editor-ui (REST POST /v1/assist/link-suggest)
    triggers:
      - user types `@` or `[[`
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted: INTERNAL_ONLY (link suggestion list — only items principal already has access to)
    model:
      primary: rule-based (Postgres FTS over accessible doc titles + user directory)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 100
    audit_event: DocsLinkSuggestionShown
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk
    user_label: "AI suggestion — Tab to accept"

verification:
  - All T0 suggestions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE model invocation.
  - All T0 suggestions emit an audit-chain event (Ed25519-sealed; non-content payload only) on suggestion-shown + suggestion-accepted.
  - All T0 suggestions are labelled per EU AI Act Art. 50 in the UI surface.
  - All T0 suggestions respect dual-context isolation: Personal-context suggestions NEVER consult Professional-context data; Professional-context suggestions NEVER consult Personal-context data. Enforced at `oya-docs-document-store-domain` per PRD AC-07.
  - T0 suggestions do NOT create, modify, or delete document state without explicit user action.
  - T0 suggestions respect per-block ACL: link-suggest only returns blocks/docs the principal has read access to.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-DOCS-0005 — AI writing-assist scope (defers to capability-level evaluation).
  - EU AI Act Regulation (EU) 2024/1689 — Art. 50 transparency.
  - microservices/docs/PRD.md FR-14 (grammar + auto-summary).
  - microservices/docs/policy/editor-isolation.md — dual-context enforcement.
  - microservices/calendar/capabilities/T0-suggest.yaml — sibling reference.
  - microservices/workflow-studio/capabilities/T0-suggest.yaml — sibling reference.
