# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T2-auto capabilities — docs µservice
#
# Autonomy Tier 2: "autonomous, irreversible at completion". The system takes
# actions on a recurring or per-event basis WITHOUT per-action user approval,
# under a documented policy boundary. User can revoke the policy at any time;
# future actions stop. Past actions stand.
#
# T2 has the highest scrutiny: explicit Cedar tenant-class admission, full
# audit-chain coverage, EU AI Act limited-risk classification with conformity
# assessment for HR overlays (per ADR-DOCS-0005).
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 + Art. 14 + Annex III §3.

doc_class: AutonomyTierCatalog
microservice: docs
tier: T2
owner_team: axis-docs + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly + annually for AI Act conformity

capabilities:
  - id: T2-docs-auto-translate
    name: "Auto-translate document into target language(s)"
    description: |
      Tenant policy: "automatically maintain a translated mirror of this
      document in target languages X, Y, Z." On every save of the source
      document, the assistant background-translates and updates the mirror
      docs. The user can revoke the policy any time; future translations
      stop. Past translations remain unless the user manually deletes.
    surface: background-worker (oya-docs-document-store-worker — auto-translate sub-worker)
    triggers:
      - source document saved AND auto-translate policy enabled
      - user policy change
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: PERSONAL_DOC_CONTENT / PROFESSIONAL_DOC_CONTENT (translated mirror doc)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: not auto-reverted (translated docs remain; user can manually delete)
      cancel_surface: settings UI + Workflow webhook + REST DELETE /v1/policies/auto-translate
    model:
      primary: tenant-default-llm (translation-tuned)
      fallback: external translation API (DeepL / Google Translate; pack-policy-bound; not used in pack-us-healthcare per BAA)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: "per-doc-save: 10000 (10s background; not user-facing)"
    audit_event:
      - DocsAutoTranslatePolicyEnabled (Ed25519-sealed)
      - DocsAutoTranslateRunCompleted (per-run; Ed25519-sealed; payload — source doc id + target lang + sha256 of translated content)
      - DocsAutoTranslatePolicyDisabled (Ed25519-sealed)
    risk_classification: limited-risk (Annex III §3 may apply for HR-document translation — REFUSED at Cedar layer for pack-eu pending ADR-DOCS-0005 conformity assessment)
    user_label: '"Auto-translated by AI" (Art. 50 on every mirror doc surface)'
    cedar_admission_path: |
      tenant-scope.cedar :: action::DocsT2EnableAutoTranslate admits when
      principal.tenant_class == "paid" && principal.billing_components contains "per_seat" AND user.has_opted_in_to_t2_docs_policies.

  - id: T2-docs-auto-format
    name: "Auto-format style + structure consistency"
    description: |
      Tenant-admin policy: "enforce consistent heading style + list style +
      math notation across all docs in workspace X." The assistant runs a
      nightly format-pass on each doc; non-conforming blocks are auto-rewritten
      to match the style guide. Tenant admin can revoke; future passes stop.
      Past changes preserved in version history (revertable per FR-06).
    surface: background-worker (oya-docs-document-store-worker — auto-format sub-worker)
    triggers:
      - nightly tick (per-tenant timezone-aware)
      - tenant policy "auto-format" enabled
    consent_basis:
      personal_context: not-applicable (workspace-level only)
      professional_context: explicit-on-tenant-admin-opt-in + tenant-class-admission
    data_class_processed: [PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: PROFESSIONAL_DOC_CONTENT (formatted-rewritten content)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: preserved in version history; tenant can manually revert per-doc
      cancel_surface: tenant-admin portal
    model:
      primary: rule-based (deterministic style-guide checker)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: "per-nightly-run: 60000 per workspace (60s; background)"
    audit_event:
      - DocsAutoFormatPolicyEnabled (Ed25519-sealed)
      - DocsAutoFormatRunCompleted (per-run; Ed25519-sealed; payload — workspace id + doc count + change count)
      - DocsAutoFormatBlockRewritten (per-rewrite; Ed25519-sealed; payload — doc id hash + block id + before-sha + after-sha)
    risk_classification: minimal-risk (deterministic logic; no LLM)
    user_label: '"Workspace docs auto-formatted by AI overnight" (per-tenant admin notification)'
    cedar_admission_path: |
      tenant-scope.cedar :: action::DocsT2EnableAutoFormat admits when
      principal.tenant_class == "paid" && principal.billing_components contains "per_seat" && compliance_pack.active == true AND tenant_admin.has_opted_in_to_t2_docs_policies.

  - id: T2-docs-auto-cite
    name: "Auto-cite (background citation insertion)"
    description: |
      Tenant policy: "on every save, search for missing citations in
      research-document workspaces and auto-insert BibTeX entries + reference
      list updates." The assistant queries CrossRef / Semantic Scholar /
      tenant private bibliographic corpus and inserts citations for
      uncited factual claims. User can revoke; past insertions stand
      (revertable per FR-06).
    surface: background-worker (oya-docs-document-store-worker — auto-cite sub-worker)
    triggers:
      - doc save AND auto-cite policy enabled
      - tenant policy change
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [PROFESSIONAL_DOC_CONTENT]
    data_class_emitted:
      - INTERNAL_ONLY (citation key + reference entry)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: preserved in version history; tenant can manually revert
      cancel_surface: settings UI
    model:
      primary: tenant-default-llm + CrossRef API + Semantic Scholar API
      fallback: rule-based heuristic (string-match against tenant private corpus only)
      private_inference: tenant-DEK-wrapped prompt; external citation API calls carry only the searched statement
    latency_budget_p99_ms: "per-save: 4000"
    audit_event:
      - DocsAutoCitePolicyEnabled (Ed25519-sealed)
      - DocsAutoCiteRunCompleted (per-run; Ed25519-sealed; payload — doc id hash + cite count)
      - DocsAutoCiteInserted (per-insertion; Ed25519-sealed; payload — doc id hash + DOI of cited work)
    risk_classification: minimal-risk (citation insertion is not employment-decision)
    user_label: '"Citations auto-inserted by AI" (per-doc admin notification + Art. 50)'
    cedar_admission_path: |
      tenant-scope.cedar :: action::DocsT2EnableAutoCite admits when
      principal.tenant_class == "paid" && principal.billing_components contains "per_seat" AND user.has_opted_in_to_t2_docs_policies.

  - id: T2-docs-auto-summarise-on-publish
    name: "Auto-summary on doc publish (e.g., for knowledge-base index)"
    description: |
      Tenant policy: "on every doc-publish event, generate a 1-paragraph
      summary and post it to the tenant's internal knowledge-base index."
      Useful for org-wide search + onboarding flows. User can revoke;
      past summaries remain.
    surface: background-worker (oya-docs-document-store-worker — auto-summary-on-publish sub-worker)
    triggers:
      - doc publish event AND auto-summary-on-publish policy enabled
    consent_basis:
      personal_context: not-applicable (publish is org-scope)
      professional_context: explicit-on-tenant-admin-opt-in + tenant-class-admission
    data_class_processed: [PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: BEHAVIORAL_TENANT_PRODUCT (summary for KB index)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: preserved in KB index; tenant can manually remove
      cancel_surface: tenant-admin portal
    model:
      primary: tenant-default-llm
      fallback: extract-first-paragraph heuristic
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: "per-publish: 5000"
    audit_event:
      - DocsAutoSummaryOnPublishPolicyEnabled (Ed25519-sealed)
      - DocsAutoSummaryOnPublishCompleted (per-publish; Ed25519-sealed)
    risk_classification: limited-risk (Annex III §3 may apply for HR-document KB — REFUSED at Cedar layer for pack-eu pending ADR-DOCS-0005)
    user_label: "AI-generated KB summary"
    cedar_admission_path: |
      tenant-scope.cedar :: action::DocsT2EnableAutoSummaryOnPublish admits when
      principal.tenant_class == "paid" && principal.billing_components contains "per_seat" && compliance_pack.active == true AND tenant_admin.has_opted_in_to_t2_docs_policies.

verification:
  - All T2 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting AND on each scheduled tick.
  - All T2 actions emit an audit-chain event (Ed25519-sealed) on policy-enabled, on each action, on policy-disabled.
  - All T2 actions are tenant_class-gated: Cedar policy `cedar/t2-tenant-class-gate.cedar` admits T2 only for paid tenant_class with per_seat billing_component (auto-translate + auto-cite) or ≥ enterprise (auto-format + auto-summary-on-publish).
  - T2 actions for HR-context overlays in pack-eu are REFUSED at the Cedar layer pending EU AI Act Annex III §3 conformity assessment per ADR-DOCS-0005.
  - T2 actions respect dual-context isolation: Personal-context T2 actions NEVER touch Professional-context data; Professional-context T2 actions NEVER touch Personal-context data.
  - T2 actions respect per-block ACL: auto-translate / auto-cite / auto-summary read only blocks the policy-author principal has access to.
  - T2 actions emit user-visible labelling per EU AI Act Art. 50 at each affected user/reader.
  - T2 actions are continuously reviewed: annual conformity-assessment cycle for any T2 capability that touches EU AI Act Annex III scope (per ADR-DOCS-0005).
  - T2 external API calls (CrossRef / Semantic Scholar / DeepL / Google Translate) are gated by tenant DPA + pack policy; pack-us-healthcare REFUSES external translation APIs by default (BAA-bound; LLM-only).

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-DOCS-0005 — AI writing-assist EU AI Act bounds.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §3 employment-context.
  - microservices/docs/PRD.md FR-14 (AI writing assist).
  - microservices/docs/policy/editor-isolation.md.
  - microservices/calendar/capabilities/T2-auto.yaml — sibling reference.
  - microservices/mail/capabilities/T2-auto.yaml — sibling reference.
  - CrossRef + Semantic Scholar API.
  - DeepL API; Google Cloud Translation API (pack-policy-bound).
