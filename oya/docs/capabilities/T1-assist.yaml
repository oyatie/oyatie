# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — docs µservice
#
# Autonomy Tier 1: "assist with bounded reversibility". The system takes an
# action, but it is bounded, reversible within a short window, and attributed
# to the agent + user clearly. User can cancel within the reversibility window.
# After the window closes, the action stands.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 transparency + Art. 14 human oversight.
# Per ADR-DOCS-0005 (AI writing-assist bounds; HR-context refused at Cedar layer in pack-eu).

doc_class: AutonomyTierCatalog
microservice: docs
tier: T1
owner_team: axis-docs + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-docs-auto-summary
    name: "Auto-summary of the current document"
    description: |
      User invokes "summarise this document". The assistant generates a 1-3
      paragraph summary and inserts it as a callout block at the top of the
      document. The user can cancel within a 30-second reversibility window;
      after that, the summary stands. User can manually remove anytime.
    surface: editor-ui (REST POST /v1/assist/auto-summary)
    triggers:
      - user explicitly invokes "summarise"
    consent_basis:
      personal_context: explicit-on-invocation
      professional_context: explicit-on-invocation + tenant-policy-admission (Cedar admits T1 for tenant_class)
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: PERSONAL_DOC_CONTENT / PROFESSIONAL_DOC_CONTENT (summary block content)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert block insertion + restore prior block-tree state
      cancel_surface: in-product banner + Workflow webhook
    model:
      primary: tenant-default-llm
      fallback: extract-first-paragraph heuristic
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 3000 (3s for typical doc)
    audit_event: DocsAutoSummaryGenerated (Ed25519-sealed; payload — doc id hash + summary block id + reversibility window expiry)
    fallback_on_model_failure: fall back to T0 grammar-check suggestion mode (suggest only)
    risk_classification: limited-risk (Annex III §3 may apply for HR-context — REFUSED at Cedar layer for pack-eu pending ADR-DOCS-0005 conformity assessment)
    user_label: "AI is summarising this document — cancel within 30s"  # Art. 50 + Art. 14
    cedar_admission_path: |
      ai-act-hr-scope.cedar :: action::DocsT1AutoSummary refuses when
      context.hr_document_workflow == true AND context.context_kind == "employment" AND no conformity-assessment evidence is on file.

  - id: T1-docs-expand-rewrite
    name: "Expand / rewrite selected text"
    description: |
      User selects a passage and invokes "expand" / "rewrite formal" /
      "rewrite concise". The assistant replaces the selection with the
      rewritten text. User can cancel within 30s; after the window the
      rewrite stands. User can manually undo anytime via version history.
    surface: editor-ui (REST POST /v1/assist/expand-rewrite)
    triggers:
      - user selects passage + invokes "expand" / "rewrite" command
    consent_basis:
      personal_context: explicit-on-invocation
      professional_context: explicit-on-invocation + tenant-policy-admission
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: PERSONAL_DOC_CONTENT / PROFESSIONAL_DOC_CONTENT (rewritten passage)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert passage to prior content
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm
      fallback: no fallback (LLM-only)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 2000
    audit_event: DocsExpandRewriteApplied (Ed25519-sealed; payload — doc id hash + block id hash + before-sha + after-sha)
    fallback_on_model_failure: silent abort — original passage preserved
    risk_classification: limited-risk (Annex III §3 may apply for HR-context — REFUSED at Cedar layer for pack-eu pending ADR-DOCS-0005)
    user_label: "AI is rewriting your selection — cancel within 30s"
    cedar_admission_path: |
      ai-act-hr-scope.cedar :: action::DocsT1ExpandRewrite refuses when
      context.hr_document_workflow == true AND context.context_kind == "employment" AND no conformity-assessment evidence is on file.

  - id: T1-docs-citation-suggest
    name: "Citation + reference suggestion (academic)"
    description: |
      User selects a statement and invokes "find citation". The assistant
      searches a tenant-configured citation database (CrossRef / Semantic
      Scholar / tenant private corpus) and inserts a BibTeX citation +
      reference list entry. User can cancel within 30s. The citation +
      reference list update is atomic.
    surface: editor-ui (REST POST /v1/assist/citation-suggest)
    triggers:
      - user explicitly requests "find citation"
    consent_basis:
      personal_context: explicit-on-invocation
      professional_context: explicit-on-invocation + tenant-policy-admission
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted:
      - INTERNAL_ONLY (citation key + reference entry; sourced from public bibliographic database)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert citation insertion + remove reference list entry
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm (for query formulation) + CrossRef API (for retrieval)
      fallback: manual citation entry surface
      private_inference: tenant-DEK-wrapped prompt; CrossRef call carries no document content beyond the searched statement
    latency_budget_p99_ms: 2500
    audit_event: DocsCitationSuggested (Ed25519-sealed; payload — doc id hash + DOI of cited work)
    fallback_on_model_failure: fall back to T0 (manual entry)
    risk_classification: minimal-risk
    user_label: "AI inserted citation — cancel within 30s"

  - id: T1-docs-grammar-bulk-fix
    name: "Bulk grammar fix across document"
    description: |
      User invokes "fix all grammar issues". The assistant applies every
      previously-T0-flagged grammar suggestion as a single atomic edit.
      User can cancel the full batch within 30s; cancellation reverts the
      entire batch (transactional).
    surface: editor-ui (REST POST /v1/assist/grammar-bulk-fix)
    triggers:
      - user explicitly invokes "fix all grammar"
    consent_basis:
      personal_context: explicit-on-invocation
      professional_context: explicit-on-invocation + tenant-policy-admission
    data_class_processed: [PERSONAL_DOC_CONTENT, PROFESSIONAL_DOC_CONTENT]
    data_class_emitted: PERSONAL_DOC_CONTENT / PROFESSIONAL_DOC_CONTENT
    reversibility:
      window_seconds: 30
      action_on_cancel: revert all batch edits atomically
      cancel_surface: in-product banner
    model:
      primary: rule-based (LanguageTool offline) for deterministic fixes; LLM for ambiguous-context fixes
      fallback: no fallback needed
      private_inference: tenant-DEK-wrapped prompt for LLM-assisted edits; no cross-tenant training
    latency_budget_p99_ms: 1500
    audit_event: DocsGrammarBulkFixApplied (Ed25519-sealed; payload — doc id hash + fix count + batch-id)
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk
    user_label: "AI is applying grammar fixes — cancel within 30s"

verification:
  - All T1 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting.
  - All T1 actions emit an audit-chain event (Ed25519-sealed) on action-initiated AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T1 actions are labelled per EU AI Act Art. 50 + offer the Art. 14 human-oversight cancel-within-window control.
  - All T1 actions respect dual-context isolation: Personal-context actions NEVER touch Professional-context data; Professional-context actions NEVER touch Personal-context data.
  - All T1 actions are tenant_class-gated: Cedar policy `cedar/t1-tenant-class-gate.cedar` admits T1 only for paid tenant_class with per_seat billing_component.
  - HR-context overlay (T1 capabilities when used for HR-mail-or-document scope per Annex III §3) is REFUSED at the Cedar layer for pack-eu pending per-tenant conformity assessment evidence on file, per ADR-DOCS-0005.
  - T1 actions respect per-block ACL: auto-summary, expand-rewrite, citation-suggest never read or write private blocks the principal lacks access to.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-DOCS-0005 — AI writing-assist EU AI Act bounds.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §3 employment-context.
  - microservices/docs/PRD.md FR-14 (AI writing assist).
  - microservices/docs/policy/editor-isolation.md.
  - microservices/calendar/capabilities/T1-assist.yaml — sibling reference.
  - microservices/mail/capabilities/T1-assist.yaml — sibling reference.
  - LanguageTool — `languagetool.org`.
  - CrossRef API — `crossref.org/documentation`.
  - Semantic Scholar API — `api.semanticscholar.org`.
