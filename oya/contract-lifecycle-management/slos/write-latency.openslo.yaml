apiVersion: openslo/v1
kind: SLO
metadata:
  name: contract-lifecycle-management-write-latency
  labels:
    service: contract-lifecycle-management
    adr: ADR-0139
spec:
  service: contract-lifecycle-management
  indicator:
    metadata:
      name: write-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contract_lifecycle_management_write_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contract_lifecycle_management_write_latency_total[5m]))
  objectives:
    - displayName: Contract Lifecycle Management write-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
