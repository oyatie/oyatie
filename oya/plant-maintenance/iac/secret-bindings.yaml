apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: oya-plant-maintenance
spec:
  openbaoPaths:
    - secret/{{ tenant_id }}/plant-maintenance/database
    - secret/{{ tenant_id }}/plant-maintenance/signing
  maxTtlSeconds: 60
  auditEventClass: EVT-PLANT_MAINTENANCE-EQUIPMENT_MASTER-SECRET_LEASE
