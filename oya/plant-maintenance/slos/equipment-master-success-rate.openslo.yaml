apiVersion: openslo/v1
kind: SLO
metadata:
  name: equipment-master-success-rate
  labels:
    service: plant-maintenance
    sap_code: "PM"
spec:
  description: "Plant Maintenance equipment-master-success-rate objective; benchmarks SAP PM Plant Maintenance | Oracle Fusion Maintenance | Workday Extend asset-maintenance workflow counterpart | NetSuite Fixed Assets and Field Service counterpart | Microsoft Dynamics 365 Asset Management"
  service: plant-maintenance
  indicator:
    metadata:
      name: equipment-master-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_plant_maintenance_equipment_master_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_plant_maintenance_equipment_master_attempt_total[5m]))"
  objectives:
    - displayName: equipment-master-success-rate
      target: 0.999
