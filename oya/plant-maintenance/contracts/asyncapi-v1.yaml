asyncapi: 3.1.0
info:
  title: Plant Maintenance Events
  version: 1.0.0
  description: AsyncAPI 3.1.0 channels for SAP PM parity events.
  x-oyatie-contract-status: preview-not-deployed
  x-oyatie-non-claims:
    - no deployed broker runtime
    - no producer runtime
    - no consumer runtime
    - no durable persistence
    - no spare-parts inventory mutation
    - no technician dispatch runtime
    - no Workflow execution
    - no runtime audit-chain emission
    - no cloud deployment
  x-oyatie-app-channel-metadata:
    description: >-
      Metadata-only app handler channel names used by the scaffolded AsyncAPI
      adapter fixtures. These entries do not claim a live broker, producer,
      consumer, or runtime audit-chain emitter.
    channels:
      - channel: plant-maintenance.command.accepted.v1
        contract_stub_only: true
      - channel: plant-maintenance.reconciliation.queued.v1
        contract_stub_only: true
      - channel: plant-maintenance.governance.hold-applied.v1
        contract_stub_only: true
      - channel: plant-maintenance.equipment.telemetry-changed.v1
        contract_stub_only: true
      - channel: plant-maintenance.spare-part.changed.v1
        contract_stub_only: true
defaultContentType: application/json
channels:
  plant-maintenance.equipment-master.events.v1:
    address: plant-maintenance.equipment-master.events.v1
    messages:
      EquipmentMasterChanged:
        $ref: "#/components/messages/EquipmentMasterChanged"
  plant-maintenance.maintenance-plan.events.v1:
    address: plant-maintenance.maintenance-plan.events.v1
    messages:
      MaintenancePlanChanged:
        $ref: "#/components/messages/MaintenancePlanChanged"
  plant-maintenance.work-order.events.v1:
    address: plant-maintenance.work-order.events.v1
    messages:
      WorkOrderChanged:
        $ref: "#/components/messages/WorkOrderChanged"
  plant-maintenance.spare-part-reservation.events.v1:
    address: plant-maintenance.spare-part-reservation.events.v1
    messages:
      SparePartReservationChanged:
        $ref: "#/components/messages/SparePartReservationChanged"
  plant-maintenance.technician-dispatch.events.v1:
    address: plant-maintenance.technician-dispatch.events.v1
    messages:
      TechnicianDispatchChanged:
        $ref: "#/components/messages/TechnicianDispatchChanged"
  plant-maintenance.downtime-window.events.v1:
    address: plant-maintenance.downtime-window.events.v1
    messages:
      DowntimeWindowChanged:
        $ref: "#/components/messages/DowntimeWindowChanged"
components:
  messages:
    EquipmentMasterChanged:
      name: EquipmentMasterChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-EQUIPMENT_MASTER-CHANGED
          bounded_context:
            type: string
            const: equipment-master
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    MaintenancePlanChanged:
      name: MaintenancePlanChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-MAINTENANCE_PLAN-CHANGED
          bounded_context:
            type: string
            const: maintenance-plan
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    WorkOrderChanged:
      name: WorkOrderChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-WORK_ORDER-CHANGED
          bounded_context:
            type: string
            const: work-order
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    SparePartReservationChanged:
      name: SparePartReservationChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-SPARE_PART_RESERVATION-CHANGED
          bounded_context:
            type: string
            const: spare-part-reservation
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    TechnicianDispatchChanged:
      name: TechnicianDispatchChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-TECHNICIAN_DISPATCH-CHANGED
          bounded_context:
            type: string
            const: technician-dispatch
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    DowntimeWindowChanged:
      name: DowntimeWindowChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PLANT_MAINTENANCE-DOWNTIME_WINDOW-CHANGED
          bounded_context:
            type: string
            const: downtime-window
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
