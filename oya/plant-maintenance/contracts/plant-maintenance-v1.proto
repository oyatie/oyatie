// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.plant_maintenance.v1;

option java_package = "dev.oyatie.plant_maintenance.v1";

// SAP PM; benchmarks: SAP PM Plant Maintenance | Oracle Fusion Maintenance | Workday Extend asset-maintenance workflow counterpart | NetSuite Fixed Assets and Field Service counterpart | Microsoft Dynamics 365 Asset Management
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.
// Preview app method metadata fixture only: the scaffolded app adapter remains contract_stub_only.
// Non-claims: no deployed gRPC runtime, durable persistence, Workflow execution, runtime audit-chain emission, or cloud deployment.
// x-oyatie-app-method-metadata:
// - method: SubmitCommand; contract_stub_only: true
// - method: Reconcile; contract_stub_only: true
// - method: ApplyGovernanceHold; contract_stub_only: true
// - method: ExportEvidence; contract_stub_only: true

message EquipmentMasterCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message EquipmentMasterResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message MaintenancePlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message MaintenancePlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message WorkOrderCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message WorkOrderResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message SparePartReservationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message SparePartReservationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message TechnicianDispatchCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message TechnicianDispatchResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message DowntimeWindowCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message DowntimeWindowResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service PlantMaintenanceService {
  rpc MutateEquipmentMaster (EquipmentMasterCommand) returns (EquipmentMasterResult);
  rpc MutateMaintenancePlan (MaintenancePlanCommand) returns (MaintenancePlanResult);
  rpc MutateWorkOrder (WorkOrderCommand) returns (WorkOrderResult);
  rpc MutateSparePartReservation (SparePartReservationCommand) returns (SparePartReservationResult);
  rpc MutateTechnicianDispatch (TechnicianDispatchCommand) returns (TechnicianDispatchResult);
  rpc MutateDowntimeWindow (DowntimeWindowCommand) returns (DowntimeWindowResult);
}
