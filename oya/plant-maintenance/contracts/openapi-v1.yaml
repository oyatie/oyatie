openapi: 3.2.0
info:
  title: Plant Maintenance API
  version: 1.0.0
  summary: SAP PM parity API with marketplace settlement boundaries
  description: >-
    Preview metadata-only contract surface aligned to the scaffolded
    plant-maintenance work-order app adapters. This artifact records route
    names for fixture conformance only; it does not claim a deployed endpoint
    or live enterprise asset-management runtime.
  x-oyatie-contract-status: preview-not-deployed
  x-oyatie-non-claims:
    - no deployed HTTP runtime
    - no durable persistence
    - no scheduling engine
    - no technician dispatch runtime
    - no spare-parts inventory mutation
    - no procurement requisition creation
    - no accounting posting
    - no Workflow execution
    - no runtime audit-chain emission
    - no cloud deployment
  x-oyatie-app-route-metadata:
    description: >-
      Fixture-only path names expected by the scaffolded HTTP adapter. These
      are not deployed OpenAPI operations; canonical wire paths remain below.
    paths:
      - path: /v1/plant-maintenance/equipment-masters:register
        contract_stub_only: true
      - path: /v1/plant-maintenance/maintenance-plans:schedule
        contract_stub_only: true
      - path: /v1/plant-maintenance/work-orders:release
        contract_stub_only: true
      - path: /v1/plant-maintenance/spare-parts:reserve
        contract_stub_only: true
      - path: /v1/plant-maintenance/downtime-windows:record
        contract_stub_only: true
servers:
  - url: https://api.oyatie.example/plant-maintenance
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
