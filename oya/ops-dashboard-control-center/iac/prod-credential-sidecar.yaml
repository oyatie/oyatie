# ops-dashboard-control-center — OpenBao credential sidecar config
# Per ADR-0296: every credential isolated in OpenBao sidecar; no long-lived tokens in env.
# Per ADR-0295: SPIFFE workload identity for all µservice-to-µservice calls.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-dashboard-control-center
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0295,ADR-0296"
    spiffe_svid: "spiffe://oyatie.dev/ns/ops-dashboard/sa/ops-dashboard-control-center"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-agent-config
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0296"
data:
  config.hcl: |
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "ops-dashboard-control-center"
          # SPIFFE SVID bound to service account per ADR-0295
          token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        }
      }
      sink "file" {
        config = {
          path = "/home/vault/.vault-token"
          mode = 0600
        }
      }
    }
    vault {
      address = "https://openbao.secrets.svc.cluster.local:8200"
      # TLS 1.3 minimum per ADR-0253
      tls_min_version = "tls13"
      ca_cert = "/etc/tls/ca.crt"
    }
    template {
      source      = "/etc/vault/templates/tls-cert.ctmpl"
      destination = "/etc/tls/tls.crt"
      # Operator session tokens: ≤4h TTL (TOTP/passkey) or ≤1h (hardware key)
      # Rotated automatically by agent before expiry
      command = "kill -HUP $(pidof ops-dashboard-control-center)"
    }
    template {
      source      = "/etc/vault/templates/session-signing-key.ctmpl"
      destination = "/etc/secrets/session-signing-key"
      command = "kill -HUP $(pidof ops-dashboard-control-center)"
    }
    # Audit signing key rotated every 90d
    template {
      source      = "/etc/vault/templates/audit-signing-key.ctmpl"
      destination = "/etc/secrets/audit-signing-key"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-agent-templates
  namespace: ops-dashboard
data:
  tls-cert.ctmpl: |
    {{ with secret "pki/issue/ops-dashboard-control-center" "common_name=ops-dashboard.oyatie.com" "ttl=24h" }}
    {{ .Data.certificate }}
    {{ end }}
  session-signing-key.ctmpl: |
    {{ with secret "secret/oyatie/ops-dashboard/session-signing-key" }}
    {{ .Data.data.key }}
    {{ end }}
  audit-signing-key.ctmpl: |
    {{ with secret "secret/oyatie/ops-dashboard/audit-signing-key" }}
    {{ .Data.data.key }}
    {{ end }}
