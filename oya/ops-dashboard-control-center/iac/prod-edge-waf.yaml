# ops-dashboard-control-center — Edge WAF configuration
# Per ADR-0297 (abuse-defence), ADR-0253 (HTTP/3 + QUIC)
# Internal surface: WAF protects against credential stuffing, internal scraping,
# bot-score-based challenges. EMERGENCY_SERVICES bypass at edge per §3.2.3.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-dashboard-edge-waf-config
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0297,ADR-0253,ADR-0298"
data:
  # HTTP/3 + QUIC default (Alt-Svc header)
  alt_svc_header: 'h3=":443"; ma=86400, h3-29=":443"; ma=86400'
  quic_enabled: "true"
  http2_fallback: "true"
  http1_1_fallback: "true"
  http1_0_forbidden: "true"

  # TLS profile
  tls_min_version: "TLSv1.3"
  cipher_suites: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"

  # Rate limiting per operator (per-employee scope)
  rate_limit_per_operator_per_minute: "1000"
  rate_limit_burst_per_10s: "200"
  rate_limit_emergency_services_multiplier: "10"

  # Bot-score threshold (passive ML scoring; never on default path)
  bot_score_challenge_threshold: "70"
  bot_score_block_threshold: "95"
  # CAPTCHA only when bot-score > threshold; never on default path (UX floor)
  captcha_provider: "cloudflare-turnstile"
  captcha_accessible_alternative: "audio-captcha"

  # EMERGENCY_SERVICES bypass at edge (L0) — LIFE-SAFETY HARD RULE
  emergency_services_bypass_enabled: "true"
  emergency_services_audience_type: "EMERGENCY_SERVICES"
  emergency_services_rate_limit_multiplier: "10"

  # Honeypot routes (internal scraping detection)
  honeypot_routes: "/ops/v1/_internal/honeypot,/ops/v1/_canary/tenant-ids"
  honeypot_alert_channel: "#ops-security-incidents"

  # Geo-impossibility detection
  geo_impossibility_check_enabled: "true"
  geo_impossibility_session_window_hours: "4"

  # IP reputation (internal threat intel + Cloudflare feed)
  ip_reputation_check_enabled: "true"
  ip_reputation_feed: "internal-threat-intel,cloudflare-radar"

  # UEBA integration: forward bot_score + anomaly_score headers to µservice
  ueba_score_header: "X-Oya-Bot-Score"
  ueba_anomaly_header: "X-Oya-Ueba-Anomaly-Score"

  # robots.txt (internal surface — no public crawling)
  robots_txt: |
    User-agent: *
    Disallow: /
    # Internal surface — no public crawling permitted
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-dashboard-ingress
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0253,ADR-0297"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # HTTP/3 via Alt-Svc header
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400';
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
spec:
  tls:
    - hosts:
        - ops-dashboard.oyatie.com
      secretName: ops-dashboard-pqc-tls
  rules:
    - host: ops-dashboard.oyatie.com
      http:
        paths:
          - path: /ops/
            pathType: Prefix
            backend:
              service:
                name: ops-dashboard-control-center
                port:
                  number: 8443
