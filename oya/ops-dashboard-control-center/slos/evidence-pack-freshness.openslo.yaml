apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-evidence-pack-freshness
spec:
  service: ops-dashboard-control-center
  objective:
    target: "0.99"
  indicator:
    ratioMetric:
      good:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_evidence_pack_age_seconds_bucket{le="86400"}[5m]))'
      total:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_requests_total[5m]))'
