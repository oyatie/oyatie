asyncapi: 3.1.0
info:
  title: Ops Dashboard / Control Center Events
  version: 0.1.0
  description: |
    Events emitted by FD-001 Ops Dashboard / Control Center. Events are audit-chain
    sealed and consumed by Workflow, Ontology, Observability, Governance, and KR
    localization runbook adapters.
defaultContentType: application/json
servers:
  workflow-bus:
    host: workflow-bus.oyatie.svc.cluster.local:9092
    protocol: kafka
    description: Workflow event bus with per-pack topics
channels:
  incident-declared:
    address: oyatie.ops-control-center.incident-declared.v1
    messages:
      incidentDeclared:
        $ref: '#/components/messages/IncidentDeclared'
  incident-remediation-approved:
    address: oyatie.ops-control-center.incident-remediation-approved.v1
    messages:
      incidentRemediationApproved:
        $ref: '#/components/messages/IncidentRemediationApproved'
  deployment-approval-recorded:
    address: oyatie.ops-control-center.deployment-approval-recorded.v1
    messages:
      deploymentApprovalRecorded:
        $ref: '#/components/messages/DeploymentApprovalRecorded'
  rollback-decision-recorded:
    address: oyatie.ops-control-center.rollback-decision-recorded.v1
    messages:
      rollbackDecisionRecorded:
        $ref: '#/components/messages/RollbackDecisionRecorded'
  cluster-health-signal-observed:
    address: oyatie.ops-control-center.cluster-health-signal-observed.v1
    messages:
      clusterHealthSignalObserved:
        $ref: '#/components/messages/ClusterHealthSignalObserved'
  evidence-pack-exported:
    address: oyatie.ops-control-center.evidence-pack-exported.v1
    messages:
      evidencePackExported:
        $ref: '#/components/messages/EvidencePackExported'
operations:
  publishIncidentDeclared:
    action: send
    channel: { $ref: '#/channels/incident-declared' }
    summary: Emits incident declaration evidence
  publishIncidentRemediationApproved:
    action: send
    channel: { $ref: '#/channels/incident-remediation-approved' }
    summary: Emits operator-approved remediation evidence
  publishDeploymentApprovalRecorded:
    action: send
    channel: { $ref: '#/channels/deployment-approval-recorded' }
    summary: Emits deployment approval or hold decision
  publishRollbackDecisionRecorded:
    action: send
    channel: { $ref: '#/channels/rollback-decision-recorded' }
    summary: Emits rollback execution decision
  publishClusterHealthSignalObserved:
    action: send
    channel: { $ref: '#/channels/cluster-health-signal-observed' }
    summary: Emits cluster health signal snapshot
  publishEvidencePackExported:
    action: send
    channel: { $ref: '#/channels/evidence-pack-exported' }
    summary: Emits signed evidence pack export receipt
components:
  messages:
    IncidentDeclared:
      name: IncidentDeclared
      title: Incident declared
      contentType: application/json
      payload: { $ref: '#/components/schemas/IncidentDeclared' }
    IncidentRemediationApproved:
      name: IncidentRemediationApproved
      title: Incident remediation approved
      contentType: application/json
      payload: { $ref: '#/components/schemas/OperatorDecisionEvent' }
    DeploymentApprovalRecorded:
      name: DeploymentApprovalRecorded
      title: Deployment approval recorded
      contentType: application/json
      payload: { $ref: '#/components/schemas/OperatorDecisionEvent' }
    RollbackDecisionRecorded:
      name: RollbackDecisionRecorded
      title: Rollback decision recorded
      contentType: application/json
      payload: { $ref: '#/components/schemas/OperatorDecisionEvent' }
    ClusterHealthSignalObserved:
      name: ClusterHealthSignalObserved
      title: Cluster health signal observed
      contentType: application/json
      payload: { $ref: '#/components/schemas/ClusterHealthSignalObserved' }
    EvidencePackExported:
      name: EvidencePackExported
      title: Evidence pack exported
      contentType: application/json
      payload: { $ref: '#/components/schemas/EvidencePackExported' }
  schemas:
    AuditSealRef:
      type: object
      additionalProperties: false
      required: [event_id, merkle_root, signature_ref, sealed_at]
      properties:
        event_id: { type: string, format: uuid }
        merkle_root: { type: string }
        signature_ref: { type: string }
        sealed_at: { type: string, format: date-time }
    IncidentDeclared:
      type: object
      additionalProperties: false
      required: [incident_id, severity, title, declared_by, audit_seal]
      properties:
        incident_id: { type: string, format: uuid }
        severity: { type: string, enum: [SEV1, SEV2, SEV3, SEV4] }
        title: { type: string }
        tenant_id: { type: string }
        declared_by: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    OperatorDecisionEvent:
      type: object
      additionalProperties: false
      required: [decision_id, target_id, decision, decided_by, audit_seal]
      properties:
        decision_id: { type: string, format: uuid }
        target_id: { type: string }
        decision: { type: string, enum: [approve, reject, hold] }
        decided_by: { type: string }
        rationale: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    ClusterHealthSignalObserved:
      type: object
      additionalProperties: false
      required: [cluster_id, health, observed_at, signals, audit_seal]
      properties:
        cluster_id: { type: string }
        health: { type: string, enum: [green, yellow, red] }
        observed_at: { type: string, format: date-time }
        signals:
          type: array
          items: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    EvidencePackExported:
      type: object
      additionalProperties: false
      required: [ticket_id, scope, object_ref, audit_seal]
      properties:
        ticket_id: { type: string, format: uuid }
        scope:
          type: array
          items: { type: string }
        object_ref: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
