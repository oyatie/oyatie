// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.ops_dashboard_control_center.v1;

import "google/protobuf/timestamp.proto";

// gRPC contract for FD-001 Ops Dashboard / Control Center.
// Mutating commands require Cedar authorization, idempotency keys, and audit-chain seals.

service OpsControlCenterQuery {
  rpc ListIncidents (ListIncidentsRequest) returns (ListIncidentsResponse);
  rpc GetDeploymentApproval (GetDeploymentApprovalRequest) returns (DeploymentApproval);
  rpc GetClusterHealth (GetClusterHealthRequest) returns (ClusterHealth);
  rpc GetTenantIsolationPosture (GetTenantIsolationPostureRequest) returns (TenantIsolationPosture);
}

service OpsControlCenterCommand {
  rpc DeclareIncident (DeclareIncidentRequest) returns (Incident);
  rpc RecordIncidentActionDecision (IncidentActionDecisionRequest) returns (OperatorDecision);
  rpc RecordDeploymentApproval (DeploymentApprovalRequest) returns (DeploymentApproval);
  rpc RecordRollbackDecision (RollbackDecisionRequest) returns (RollbackDecision);
  rpc RequestEvidencePackExport (EvidencePackExportRequest) returns (EvidencePackExportTicket);
}

message AuditSealRef {
  string event_id = 1;
  string merkle_root = 2;
  string signature_ref = 3;
  google.protobuf.Timestamp sealed_at = 4;
}

enum IncidentSeverity {
  INCIDENT_SEVERITY_UNSPECIFIED = 0;
  INCIDENT_SEVERITY_SEV1 = 1;
  INCIDENT_SEVERITY_SEV2 = 2;
  INCIDENT_SEVERITY_SEV3 = 3;
  INCIDENT_SEVERITY_SEV4 = 4;
}

enum OperatorDecisionKind {
  OPERATOR_DECISION_KIND_UNSPECIFIED = 0;
  OPERATOR_DECISION_KIND_APPROVE = 1;
  OPERATOR_DECISION_KIND_REJECT = 2;
  OPERATOR_DECISION_KIND_HOLD = 3;
}

message Incident {
  string incident_id = 1;
  IncidentSeverity severity = 2;
  string status = 3;
  string title = 4;
  string tenant_id = 5;
  google.protobuf.Timestamp declared_at = 6;
  AuditSealRef audit_seal = 7;
}

message ListIncidentsRequest {
  IncidentSeverity severity = 1;
  string tenant_id = 2;
  string page_token = 3;
}

message ListIncidentsResponse {
  repeated Incident items = 1;
  string next_page_token = 2;
}

message DeclareIncidentRequest {
  IncidentSeverity severity = 1;
  string title = 2;
  string summary = 3;
  string tenant_id = 4;
  string declared_by = 5;
  string idempotency_key = 6;
}

message IncidentActionDecisionRequest {
  string incident_id = 1;
  string action_id = 2;
  OperatorDecisionKind decision = 3;
  string rationale = 4;
  string decided_by = 5;
  string idempotency_key = 6;
}

message OperatorDecision {
  string decision_id = 1;
  OperatorDecisionKind decision = 2;
  string decided_by = 3;
  AuditSealRef audit_seal = 4;
}

message DeploymentApprovalRequest {
  string deployment_id = 1;
  OperatorDecisionKind decision = 2;
  string decided_by = 3;
  string rationale = 4;
  string freeze_window_ref = 5;
  string idempotency_key = 6;
}

message GetDeploymentApprovalRequest {
  string deployment_id = 1;
}

message DeploymentApproval {
  string deployment_id = 1;
  OperatorDecisionKind decision = 2;
  string decided_by = 3;
  AuditSealRef audit_seal = 4;
}

message RollbackDecisionRequest {
  string deployment_id = 1;
  bool execute = 2;
  string decided_by = 3;
  string rationale = 4;
  string target_revision = 5;
  string idempotency_key = 6;
}

message RollbackDecision {
  string deployment_id = 1;
  bool execute = 2;
  string decided_by = 3;
  AuditSealRef audit_seal = 4;
}

message GetClusterHealthRequest {
  string cluster_id = 1;
}

message ClusterHealth {
  string cluster_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  string health = 3;
  repeated string signals = 4;
}

message GetTenantIsolationPostureRequest {
  string tenant_id = 1;
}

message TenantIsolationPosture {
  string tenant_id = 1;
  string posture = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated string evidence_refs = 4;
}

message EvidencePackExportRequest {
  repeated string scope = 1;
  string requested_by = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end = 4;
  string idempotency_key = 5;
}

message EvidencePackExportTicket {
  string ticket_id = 1;
  google.protobuf.Timestamp expected_ready_at = 2;
  AuditSealRef audit_seal = 3;
}
