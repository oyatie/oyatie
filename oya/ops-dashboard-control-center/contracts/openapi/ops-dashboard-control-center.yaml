openapi: 3.2.0
info:
  title: Ops Dashboard / Control Center API
  version: 0.1.0
  description: |
    FD-001 operational command API for incident response, deployment approval,
    rollback, cluster health, tenant isolation posture, policy/audit review, and
    signed evidence-pack export. All mutating operations require operator identity,
    Cedar authorization, audit-chain sealing, and idempotency keys.
  contact:
    name: ops-sre-reliability
    url: https://github.com/oyatie/oyatie
  license:
    name: MIT
servers:
  - url: https://ops.{pack}.oyatie.com
    description: per-pack operator endpoint
    variables:
      pack:
        default: pack-generic
        enum: [pack-generic, pack-kr, pack-eu, pack-us, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa, pack-us-healthcare]
tags:
  - name: incidents
  - name: deployments
  - name: health
  - name: tenant-posture
  - name: evidence
paths:
  /ops/v1/incidents:
    get:
      tags: [incidents]
      summary: Query active and historical incidents
      operationId: listOpsIncidents
      parameters:
        - in: query
          name: severity
          schema: { $ref: '#/components/schemas/IncidentSeverity' }
        - in: query
          name: tenant_id
          schema: { type: string }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: Incident page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [incidents]
      summary: Declare an incident with audit-chain sealing
      operationId: declareOpsIncident
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeclareIncidentRequest' }
      responses:
        '202':
          description: Incident accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /ops/v1/incidents/{incident_id}/actions:
    post:
      tags: [incidents]
      summary: Approve or reject a remediation action
      operationId: recordIncidentActionDecision
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentActionDecisionRequest' }
      responses:
        '202':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /ops/v1/deployments/{deployment_id}/approval:
    get:
      tags: [deployments]
      summary: Query deployment approval state
      operationId: getDeploymentApprovalState
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '200':
          description: Approval state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/v1/deployments/{deployment_id}/approvals:
    post:
      tags: [deployments]
      summary: Approve, hold, or reject a deployment
      operationId: recordDeploymentApproval
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentApprovalRequest' }
      responses:
        '202':
          description: Approval decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /ops/v1/deployments/{deployment_id}/rollback-decisions:
    post:
      tags: [deployments]
      summary: Record a rollback execution decision
      operationId: recordRollbackDecision
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackDecisionRequest' }
      responses:
        '202':
          description: Rollback decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RollbackDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /ops/v1/clusters/{cluster_id}/health:
    get:
      tags: [health]
      summary: Query cluster, node, mesh, bootstrap, and restore health
      operationId: getClusterHealth
      parameters:
        - in: path
          name: cluster_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cluster health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/v1/tenants/{tenant_id}/isolation-posture:
    get:
      tags: [tenant-posture]
      summary: Query tenant isolation, quota, policy, residency, and SLO posture
      operationId: getTenantIsolationPosture
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tenant posture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantIsolationPosture' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ops/v1/evidence-packs/exports:
    post:
      tags: [evidence]
      summary: Request a signed evidence-pack export
      operationId: requestEvidencePackExport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidencePackExportRequest' }
      responses:
        '202':
          description: Evidence export accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePackExportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: ops-dashboard-control-center
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IncidentId:
      in: path
      name: incident_id
      required: true
      schema: { type: string, format: uuid }
    DeploymentId:
      in: path
      name: deployment_id
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid operator identity
    Forbidden:
      description: Cedar policy denied the requested operator action
    IdempotencyConflict:
      description: Idempotency key already used for a different request body
  schemas:
    IncidentSeverity:
      type: string
      enum: [SEV1, SEV2, SEV3, SEV4]
    OperatorDecisionKind:
      type: string
      enum: [approve, reject, hold]
    AuditSealRef:
      type: object
      required: [event_id, merkle_root, signature_ref]
      additionalProperties: false
      properties:
        event_id: { type: string, format: uuid }
        merkle_root: { type: string }
        signature_ref: { type: string }
        sealed_at: { type: string, format: date-time }
    Incident:
      type: object
      required: [incident_id, severity, status, title, declared_at, audit_seal]
      additionalProperties: false
      properties:
        incident_id: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        status: { type: string, enum: [declared, investigating, mitigated, resolved] }
        title: { type: string }
        tenant_id: { type: string }
        declared_at: { type: string, format: date-time }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    IncidentPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        next_page_token: { type: string }
    DeclareIncidentRequest:
      type: object
      required: [severity, title, summary, declared_by]
      additionalProperties: false
      properties:
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        title: { type: string, minLength: 3 }
        summary: { type: string, minLength: 10 }
        tenant_id: { type: string }
        declared_by: { type: string }
    IncidentActionDecisionRequest:
      type: object
      required: [decision, action_id, rationale, decided_by]
      additionalProperties: false
      properties:
        decision: { $ref: '#/components/schemas/OperatorDecisionKind' }
        action_id: { type: string }
        rationale: { type: string, minLength: 10 }
        decided_by: { type: string }
    OperatorDecision:
      type: object
      required: [decision_id, decision, decided_by, audit_seal]
      additionalProperties: false
      properties:
        decision_id: { type: string, format: uuid }
        decision: { $ref: '#/components/schemas/OperatorDecisionKind' }
        decided_by: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    DeploymentApprovalRequest:
      type: object
      required: [decision, decided_by, rationale]
      additionalProperties: false
      properties:
        decision: { $ref: '#/components/schemas/OperatorDecisionKind' }
        decided_by: { type: string }
        rationale: { type: string, minLength: 10 }
        freeze_window_ref: { type: string }
    DeploymentApproval:
      type: object
      required: [deployment_id, decision, decided_by, audit_seal]
      additionalProperties: false
      properties:
        deployment_id: { type: string }
        decision: { $ref: '#/components/schemas/OperatorDecisionKind' }
        decided_by: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    RollbackDecisionRequest:
      type: object
      required: [execute, decided_by, rationale]
      additionalProperties: false
      properties:
        execute: { type: boolean }
        decided_by: { type: string }
        rationale: { type: string, minLength: 10 }
        target_revision: { type: string }
    RollbackDecision:
      type: object
      required: [deployment_id, execute, decided_by, audit_seal]
      additionalProperties: false
      properties:
        deployment_id: { type: string }
        execute: { type: boolean }
        decided_by: { type: string }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
    ClusterHealth:
      type: object
      required: [cluster_id, observed_at, health, signals]
      additionalProperties: false
      properties:
        cluster_id: { type: string }
        observed_at: { type: string, format: date-time }
        health: { type: string, enum: [green, yellow, red] }
        signals:
          type: array
          items: { type: string }
    TenantIsolationPosture:
      type: object
      required: [tenant_id, posture, observed_at, evidence_refs]
      additionalProperties: false
      properties:
        tenant_id: { type: string }
        posture: { type: string, enum: [pass, warn, fail] }
        observed_at: { type: string, format: date-time }
        evidence_refs:
          type: array
          items: { type: string }
    EvidencePackExportRequest:
      type: object
      required: [scope, requested_by, window_start, window_end]
      additionalProperties: false
      properties:
        scope:
          type: array
          items: { type: string }
        requested_by: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
    EvidencePackExportTicket:
      type: object
      required: [ticket_id, expected_ready_at, audit_seal]
      additionalProperties: false
      properties:
        ticket_id: { type: string, format: uuid }
        expected_ready_at: { type: string, format: date-time }
        audit_seal: { $ref: '#/components/schemas/AuditSealRef' }
