[package]
name = "oya-trust-center-ingest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Trust Center evidence ingestion adapters and publishability policy for TRUSTCENTER-INGEST-001."

[package.metadata.oya]
microservice = "trust"
bounded_context = "trust-center"
layer = "usecase"
owner_team = "council-security"
adr_anchors = ["ADR-0056", "ADR-0168", "TRUSTCENTER-001"]
spec = "specs/trust-center-compliance-evidence-portal.json"
data_classification = "TENANT_TRUST_EVIDENCE, REGULATED_EXPORT_EVIDENCE, OPERATOR_SECURITY_INTERNAL"

[lib]
name = "oya_trust_center_ingest"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-trust-center-api = { path = "../oya-trust-center-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
