openapi: 3.1.0
info:
  title: Oyatie Diagnostics API
  version: 2026.05.21-reconciled
  description: Lab and pathology diagnostics API. Imaging APIs are owned by the imaging microservice.
servers:
  - url: https://api.oyatie.local/diagnostics
tags:
  - name: lab-order
  - name: lab-result
  - name: pathology-case
  - name: critical-result
  - name: reference-range
  - name: reflex-test
  - name: specimen
  - name: result-delivery
  - name: quality-control
paths:
  /lab-order:
    post:
      tags: [lab-order]
      operationId: createLabOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabOrderCreate"
      responses:
        "202":
          description: Lab order accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabOrder"
  /lab-order/{id}:
    get:
      tags: [lab-order]
      operationId: getLabOrder
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Lab order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabOrder"
  /lab-result:
    post:
      tags: [lab-result]
      operationId: recordLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabResultCreate"
      responses:
        "202":
          description: Lab result recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabResult"
  /lab-result/{id}/release:
    post:
      tags: [lab-result]
      operationId: releaseLabResult
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
      responses:
        "202":
          description: Lab result release accepted.
  /pathology-case:
    post:
      tags: [pathology-case]
      operationId: createPathologyCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathologyCaseCreate"
      responses:
        "202":
          description: Pathology case accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathologyCase"
  /pathology-case/{id}/sign-out:
    post:
      tags: [pathology-case]
      operationId: signOutPathologyCase
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOutRequest"
      responses:
        "202":
          description: Pathology sign-out accepted.
  /critical-result/{id}/acknowledge:
    post:
      tags: [critical-result]
      operationId: acknowledgeCriticalResult
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Acknowledgement"
      responses:
        "202":
          description: Critical result acknowledgement recorded.
  /reference-range:
    get:
      tags: [reference-range]
      operationId: resolveReferenceRange
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: patientId
          required: true
          schema:
            type: string
        - in: query
          name: method
          schema:
            type: string
      responses:
        "200":
          description: Reference range resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceRange"
  /reflex-test/evaluate:
    post:
      tags: [reflex-test]
      operationId: evaluateReflexRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflexEvaluationRequest"
      responses:
        "200":
          description: Reflex evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflexEvaluation"
  /specimen:
    post:
      tags: [specimen]
      operationId: registerSpecimen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecimenCreate"
      responses:
        "202":
          description: Specimen registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specimen"
  /result-delivery/{id}/handoff:
    post:
      tags: [result-delivery]
      operationId: handoffResultDelivery
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultDeliveryRequest"
      responses:
        "202":
          description: Result delivery handoff accepted.
  /DiagnosticReport/{id}:
    get:
      tags: [lab-result, pathology-case]
      operationId: getDiagnosticReport
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: FHIR DiagnosticReport projection for lab or pathology.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/FhirDiagnosticReport"
  /Observation/{id}:
    get:
      tags: [lab-result]
      operationId: getObservation
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: FHIR Observation projection for lab result.
          content:
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/FhirObservation"
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: diagnostics
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    TenantScoped:
      type: object
      required: [tenantId, patientId]
      properties:
        tenantId:
          type: string
        patientId:
          type: string
    LabOrderCreate:
      allOf:
        - $ref: "#/components/schemas/TenantScoped"
        - type: object
          required: [orderedCode, orderingProviderId, priority]
          properties:
            orderedCode:
              type: string
            orderingProviderId:
              type: string
            priority:
              type: string
              enum: [routine, urgent, stat]
            specimenId:
              type: string
    LabOrder:
      allOf:
        - $ref: "#/components/schemas/LabOrderCreate"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [accepted, accessioned, cancelled, resulted]
    LabResultCreate:
      allOf:
        - $ref: "#/components/schemas/TenantScoped"
        - type: object
          required: [orderId, observationCode, value, unit]
          properties:
            orderId:
              type: string
            observationCode:
              type: string
            value:
              type: string
            unit:
              type: string
            abnormalFlag:
              type: string
    LabResult:
      allOf:
        - $ref: "#/components/schemas/LabResultCreate"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [draft, verified, released, corrected, cancelled]
    PathologyCaseCreate:
      allOf:
        - $ref: "#/components/schemas/TenantScoped"
        - type: object
          required: [specimenId, caseType]
          properties:
            specimenId:
              type: string
            caseType:
              type: string
              enum: [surgical, cytology, molecular, autopsy, consult]
            clinicalHistory:
              type: string
    PathologyCase:
      allOf:
        - $ref: "#/components/schemas/PathologyCaseCreate"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [accessioned, grossing, diagnosis-draft, signed-out, amended]
    ReleaseRequest:
      type: object
      required: [authorizedBy]
      properties:
        authorizedBy:
          type: string
        comment:
          type: string
    SignOutRequest:
      type: object
      required: [pathologistId, signatureHash]
      properties:
        pathologistId:
          type: string
        signatureHash:
          type: string
        finalDiagnosis:
          type: string
    Acknowledgement:
      type: object
      required: [acknowledgedBy, acknowledgedAt]
      properties:
        acknowledgedBy:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
        communicationMethod:
          type: string
    ReferenceRange:
      type: object
      required: [code, low, high, unit]
      properties:
        code:
          type: string
        low:
          type: number
        high:
          type: number
        unit:
          type: string
        effectiveFrom:
          type: string
          format: date
    ReflexEvaluationRequest:
      type: object
      required: [tenantId, triggeringResultId]
      properties:
        tenantId:
          type: string
        triggeringResultId:
          type: string
    ReflexEvaluation:
      type: object
      required: [triggered]
      properties:
        triggered:
          type: boolean
        followUpOrderCode:
          type: string
        ruleTraceId:
          type: string
    SpecimenCreate:
      allOf:
        - $ref: "#/components/schemas/TenantScoped"
        - type: object
          required: [specimenType, collectedAt]
          properties:
            specimenType:
              type: string
            collectedAt:
              type: string
              format: date-time
            collectorId:
              type: string
    Specimen:
      allOf:
        - $ref: "#/components/schemas/SpecimenCreate"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [collected, received, accessioned, rejected, exhausted]
    ResultDeliveryRequest:
      type: object
      required: [destination, reportId]
      properties:
        destination:
          type: string
          enum: [emr, cloud-billing, care-management, analytics, patient-context]
        reportId:
          type: string
    FhirDiagnosticReport:
      type: object
      description: FHIR R5 DiagnosticReport projection for lab or pathology.
      additionalProperties: true
    FhirObservation:
      type: object
      description: FHIR R5 Observation projection for lab result.
      additionalProperties: true
