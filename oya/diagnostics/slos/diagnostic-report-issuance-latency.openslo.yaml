apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-diagnostic-report-issuance-latency
  displayName: FHIR DiagnosticReport issuance latency
  labels:
    microservice: diagnostics
    bounded_context: result-delivery
    tier: tier-0
spec:
  description: |
    End-to-end FHIR DiagnosticReport issuance latency from result release to
    outbox enqueue. Target p99 ≤ 850 ms.
  service: diagnostics
  indicator:
    metadata:
      name: diagnostic-report-issuance-latency
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_diagnostic_report_issuance_latency_seconds_bucket[5m])))
  objectives:
    - displayName: Issuance latency p99 ≤ 850ms
      target: 0.850
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
