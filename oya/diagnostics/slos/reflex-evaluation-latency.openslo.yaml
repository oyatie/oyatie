apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-reflex-evaluation-latency
  displayName: Reflex rule evaluation latency
  labels:
    microservice: diagnostics
    bounded_context: reflex-test
    tier: tier-0
spec:
  description: |
    Reflex rule predicate evaluation latency. Target p99 ≤ 35 ms. This SLO
    underpins the automated reflex-test chain: when a primary lab result
    is released, reflex rules must evaluate fast enough that the chemistry
    analyzer can chain a reflex order without operator intervention.
  service: diagnostics
  indicator:
    metadata:
      name: reflex-evaluation-latency
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_reflex_evaluation_seconds_bucket[5m])))
  objectives:
    - displayName: p99 ≤ 35ms
      target: 0.035
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
