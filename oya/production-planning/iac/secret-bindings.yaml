apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: oya-production-planning
spec:
  openbaoPaths:
    - secret/{{ tenant_id }}/production-planning/database
    - secret/{{ tenant_id }}/production-planning/signing
  maxTtlSeconds: 60
  auditEventClass: EVT-PRODUCTION_PLANNING-BOM_REVISION-SECRET_LEASE
