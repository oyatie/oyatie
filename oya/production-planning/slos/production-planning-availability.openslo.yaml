apiVersion: openslo/v1
kind: SLO
metadata:
  name: production-planning-availability
  labels:
    service: production-planning
    sap_code: "PP"
spec:
  description: "Production Planning production-planning-availability objective; benchmarks SAP PP Production Planning | Oracle Fusion Cloud Manufacturing | Workday Adaptive Planning production-capacity counterpart | NetSuite Manufacturing WIP and Routings | Microsoft Dynamics 365 Supply Chain Management"
  service: production-planning
  indicator:
    metadata:
      name: production-planning-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"production-planning\",status=~\"2..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"production-planning\"}[5m]))"
  objectives:
    - displayName: production-planning-availability
      target: 0.999
