apiVersion: openslo/v1
kind: SLO
metadata:
  name: production-planning-latency-p99
  labels:
    service: production-planning
    sap_code: "PP"
spec:
  description: "Production Planning production-planning-latency-p99 objective; benchmarks SAP PP Production Planning | Oracle Fusion Cloud Manufacturing | Workday Adaptive Planning production-capacity counterpart | NetSuite Manufacturing WIP and Routings | Microsoft Dynamics 365 Supply Chain Management"
  service: production-planning
  indicator:
    metadata:
      name: production-planning-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"production-planning\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"production-planning\"}[5m]))"
  objectives:
    - displayName: production-planning-latency-p99
      target: 0.99
