apiVersion: openslo/v1
kind: SLO
metadata:
  name: bom-revision-success-rate
  labels:
    service: production-planning
    sap_code: "PP"
spec:
  description: "Production Planning bom-revision-success-rate objective; benchmarks SAP PP Production Planning | Oracle Fusion Cloud Manufacturing | Workday Adaptive Planning production-capacity counterpart | NetSuite Manufacturing WIP and Routings | Microsoft Dynamics 365 Supply Chain Management"
  service: production-planning
  indicator:
    metadata:
      name: bom-revision-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_production_planning_bom_revision_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_production_planning_bom_revision_attempt_total[5m]))"
  objectives:
    - displayName: bom-revision-success-rate
      target: 0.999
