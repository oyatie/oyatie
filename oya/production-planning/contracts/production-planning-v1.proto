// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.production_planning.v1;

option java_package = "dev.oyatie.production_planning.v1";

// SAP PP; benchmarks: SAP PP Production Planning | Oracle Fusion Cloud Manufacturing | Workday Adaptive Planning production-capacity counterpart | NetSuite Manufacturing WIP and Routings | Microsoft Dynamics 365 Supply Chain Management
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.

message BomRevisionCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message BomRevisionResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message MrpRunCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message MrpRunResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message CapacityCalendarCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message CapacityCalendarResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message RoutingStepCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message RoutingStepResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message ProductionOrderCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message ProductionOrderResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message ShopFloorReleaseCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message ShopFloorReleaseResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service ProductionPlanningService {
  rpc MutateBomRevision (BomRevisionCommand) returns (BomRevisionResult);
  rpc MutateMrpRun (MrpRunCommand) returns (MrpRunResult);
  rpc MutateCapacityCalendar (CapacityCalendarCommand) returns (CapacityCalendarResult);
  rpc MutateRoutingStep (RoutingStepCommand) returns (RoutingStepResult);
  rpc MutateProductionOrder (ProductionOrderCommand) returns (ProductionOrderResult);
  rpc MutateShopFloorRelease (ShopFloorReleaseCommand) returns (ShopFloorReleaseResult);
}
