asyncapi: 3.1.0
info:
  title: Production Planning Events
  version: 1.0.0
  description: AsyncAPI 3.1.0 channels for SAP PP parity events.
defaultContentType: application/json
channels:
  production-planning.bom-revision.events.v1:
    address: production-planning.bom-revision.events.v1
    messages:
      BomRevisionChanged:
        $ref: "#/components/messages/BomRevisionChanged"
  production-planning.mrp-run.events.v1:
    address: production-planning.mrp-run.events.v1
    messages:
      MrpRunChanged:
        $ref: "#/components/messages/MrpRunChanged"
  production-planning.capacity-calendar.events.v1:
    address: production-planning.capacity-calendar.events.v1
    messages:
      CapacityCalendarChanged:
        $ref: "#/components/messages/CapacityCalendarChanged"
  production-planning.routing-step.events.v1:
    address: production-planning.routing-step.events.v1
    messages:
      RoutingStepChanged:
        $ref: "#/components/messages/RoutingStepChanged"
  production-planning.production-order.events.v1:
    address: production-planning.production-order.events.v1
    messages:
      ProductionOrderChanged:
        $ref: "#/components/messages/ProductionOrderChanged"
  production-planning.shop-floor-release.events.v1:
    address: production-planning.shop-floor-release.events.v1
    messages:
      ShopFloorReleaseChanged:
        $ref: "#/components/messages/ShopFloorReleaseChanged"
components:
  messages:
    BomRevisionChanged:
      name: BomRevisionChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-BOM_REVISION-CHANGED
          bounded_context:
            type: string
            const: bom-revision
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    MrpRunChanged:
      name: MrpRunChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-MRP_RUN-CHANGED
          bounded_context:
            type: string
            const: mrp-run
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    CapacityCalendarChanged:
      name: CapacityCalendarChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-CAPACITY_CALENDAR-CHANGED
          bounded_context:
            type: string
            const: capacity-calendar
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    RoutingStepChanged:
      name: RoutingStepChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-ROUTING_STEP-CHANGED
          bounded_context:
            type: string
            const: routing-step
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    ProductionOrderChanged:
      name: ProductionOrderChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-PRODUCTION_ORDER-CHANGED
          bounded_context:
            type: string
            const: production-order
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    ShopFloorReleaseChanged:
      name: ShopFloorReleaseChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-PRODUCTION_PLANNING-SHOP_FLOOR_RELEASE-CHANGED
          bounded_context:
            type: string
            const: shop-floor-release
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
