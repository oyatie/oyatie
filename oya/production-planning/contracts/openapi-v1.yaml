openapi: 3.2.0
info:
  title: Production Planning API
  version: 1.0.0
  summary: SAP PP parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/production-planning
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP PP Production Planning"
  - "Oracle Fusion Cloud Manufacturing"
  - "Workday Adaptive Planning production-capacity counterpart"
  - "NetSuite Manufacturing WIP and Routings"
  - "Microsoft Dynamics 365 Supply Chain Management"
paths:
  /v1/production-planning/bom-revision:
    post:
      summary: Create or amend Production Planning bom-revision
      operationId: production_planning_bom_revision_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BomRevisionCommand"
      responses:
        "202":
          description: Accepted with signed audit event
