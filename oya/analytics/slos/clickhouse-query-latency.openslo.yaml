apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-clickhouse-query-latency
  displayName: "Analytics ClickHouse Query Latency"
  labels:
    microservice: analytics
    substrate: clickhouse
    adr: "ADR-0193"
spec:
  service: analytics
  description: |
    99% of ClickHouse queries against tenant-facing dashboard tables
    complete within 500ms p99 over a rolling 30-day SLO window.
  indicator:
    metadata:
      name: clickhouse-query-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  ClickHouseProfileEvents_QueryTimeMicroseconds_bucket{le="500000"}[5m]
                )) by (cluster)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  ClickHouseProfileEvents_QueryTimeMicroseconds_count[5m]
                )) by (cluster)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 < 500ms"
      target: 0.99
  alertPolicies:
    - name: analytics-clickhouse-query-latency-burnrate-fastburn
      kind: AlertPolicy
      spec:
        description: "fast burn — 14.4x in 1h"
        conditions:
          - kind: AlertCondition
            metadata:
              name: fastburn
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 2m
        notificationTargets:
          - target: pagerduty-observability
          - target: opsgenie-observability
    - name: analytics-clickhouse-query-latency-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        description: "medium burn — 6x in 6h"
        conditions:
          - kind: AlertCondition
            metadata:
              name: mediumburn
            spec:
              op: gte
              threshold: 6.0
              lookbackWindow: 6h
              alertAfter: 15m
    - name: analytics-clickhouse-query-latency-burnrate-slowburn
      kind: AlertPolicy
      spec:
        description: "slow burn — 3x in 1d"
        conditions:
          - kind: AlertCondition
            metadata:
              name: slowburn
            spec:
              op: gte
              threshold: 3.0
              lookbackWindow: 1d
              alertAfter: 1h
    - name: analytics-clickhouse-query-latency-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        description: "trickle — 1x in 3d"
        conditions:
          - kind: AlertCondition
            metadata:
              name: trickleburn
            spec:
              op: gte
              threshold: 1.0
              lookbackWindow: 3d
              alertAfter: 6h
