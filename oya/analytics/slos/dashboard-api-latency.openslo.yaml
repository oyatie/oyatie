apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-dashboard-api-latency
  displayName: "Analytics Dashboard API Latency"
  labels:
    microservice: analytics
    surface: dashboard-api
    adr: "ADR-0157,ADR-0193"
spec:
  service: analytics
  description: |
    99% of /v1/dashboards/* responses return within 500ms p99 over 30 days rolling.
  indicator:
    metadata: { name: dashboard-api-latency-p99 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_bucket{
                  service="analytics",route=~"/v1/dashboards/.*",le="0.5"
                }[5m])) by (route)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_count{
                  service="analytics",route=~"/v1/dashboards/.*"
                }[5m])) by (route)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 < 500ms"
      target: 0.99
  alertPolicies:
    - name: analytics-dashboard-api-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-analytics
          - target: opsgenie-analytics
    - name: analytics-dashboard-api-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: analytics-dashboard-api-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: analytics-dashboard-api-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
