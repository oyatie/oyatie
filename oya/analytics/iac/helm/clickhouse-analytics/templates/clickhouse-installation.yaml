apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: clickhouse-server
    oya.microservice: analytics
spec:
  configuration:
    clusters:
      - name: {{ .Values.clusterName }}
        layout:
          shardsCount: {{ .Values.server.shards }}
          replicasCount: {{ .Values.server.replicasPerShard }}
    zookeeper:
      nodes:
        {{- range until (int .Values.keeper.replicas) }}
        - host: chk-{{ $.Values.clusterName }}-keeper-{{ . }}-0.chk-{{ $.Values.clusterName }}-keeper-{{ . }}.{{ $.Values.namespace }}.svc.cluster.local
          port: 9181
        {{- end }}
    users:
      admin/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-admin
            key: password_sha256_hex
    files:
      storage.xml: |
        <storage_configuration>
          <disks>
            <s3_cold>
              <type>s3</type>
              <endpoint>{{ .Values.storage.hotCold.coldEndpoint }}</endpoint>
              <access_key_id from_env="S3_ACCESS_KEY"/>
              <secret_access_key from_env="S3_SECRET_KEY"/>
            </s3_cold>
          </disks>
          <policies>
            <hot_cold>
              <volumes>
                <hot><disk>default</disk></hot>
                <cold><disk>s3_cold</disk></cold>
              </volumes>
            </hot_cold>
          </policies>
        </storage_configuration>
      profiles.xml: |
        <profiles>
          <default>
            <max_server_memory_usage>{{ .Values.clickhouseConfig.maxServerMemoryUsage }}</max_server_memory_usage>
            <max_concurrent_queries>{{ .Values.clickhouseConfig.maxConcurrentQueries }}</max_concurrent_queries>
            <max_execution_time>{{ .Values.clickhouseConfig.maxQueryExecutionTime }}</max_execution_time>
          </default>
        </profiles>
  defaults:
    templates:
      podTemplate: server-template
      dataVolumeClaimTemplate: data-template
  templates:
    podTemplates:
      - name: server-template
        spec:
          nodeSelector:
            {{- toYaml .Values.server.nodeSelector | nindent 12 }}
          containers:
            - name: clickhouse
              image: {{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}
              resources:
                {{- toYaml .Values.server.resources | nindent 16 }}
              envFrom:
                - secretRef:
                    name: clickhouse-s3-cold
          affinity:
            {{- toYaml .Values.server.affinity | nindent 12 }}
    volumeClaimTemplates:
      - name: data-template
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: {{ .Values.server.storage.storageClass }}
          resources:
            requests:
              storage: {{ .Values.server.storage.size }}
