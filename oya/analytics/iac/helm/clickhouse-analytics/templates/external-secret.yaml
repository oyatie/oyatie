apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-admin
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecretStoreRef.kind }}
  target:
    name: clickhouse-admin
    creationPolicy: Owner
  data:
    - secretKey: password_sha256_hex
      remoteRef:
        key: {{ .Values.secrets.admin.path }}
        property: password_sha256_hex
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-s3-cold
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecretStoreRef.kind }}
  target:
    name: clickhouse-s3-cold
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.secrets.s3Cold.path }}
        property: access_key_id
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.s3Cold.path }}
        property: secret_access_key
