# EU pack — cold-tier S3 endpoint substitution.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: analytics-clickhouse-1
  namespace: analytics
spec:
  configuration:
    files:
      storage.xml: |
        <storage_configuration>
          <disks>
            <s3_cold>
              <type>s3</type>
              <endpoint>http://seaweedfs-s3-eu.observability.svc.cluster.local:8333/clickhouse-cold-eu/</endpoint>
              <access_key_id from_env="S3_ACCESS_KEY"/>
              <secret_access_key from_env="S3_SECRET_KEY"/>
            </s3_cold>
          </disks>
          <policies>
            <hot_cold>
              <volumes>
                <hot><disk>default</disk></hot>
                <cold><disk>s3_cold</disk></cold>
              </volumes>
            </hot_cold>
          </policies>
        </storage_configuration>
