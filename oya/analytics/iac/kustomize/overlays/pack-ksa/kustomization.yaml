apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Analytics µservice — pack-ksa (Kingdom of Saudi Arabia) overlay.
# Authority: ADR-0010 regional packs, ADR-0049 residency, ADR-0193.

resources:
  - ../../base

namespace: analytics

patchesStrategicMerge:
  - cold-tier-patch.yaml
  - node-selector-patch.yaml

commonLabels:
  oya.pack: ksa
  oya.residency: StrictKSA
