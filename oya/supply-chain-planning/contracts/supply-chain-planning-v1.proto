syntax = "proto3";

package oya.supply_chain_planning.v1;

option java_package = "dev.oyatie.supply_chain_planning.v1";

// Preview metadata-only contract authority: specs/microservices/supply-chain-planning.json.
// Produced contract family per PRD: enterprise.enterprise_supply_chain_planning.v1.
// Package note: oya.supply_chain_planning.v1 remains the visible repository/gRPC
// wire namespace for this preview inventory. It is a documented namespace alias
// for the PRD produced contract family, not a separate activation claim; a
// package rename requires separate compatibility evidence.
// Non-claims: no deployed gRPC runtime, accepted live write, durable
// persistence, Workflow execution, signed/runtime audit-chain emission, cloud
// deployment, GA readiness, measured SLO/DR readiness, live optimizer,
// scheduler, ATP engine, replenishment runtime, or exhaustive vendor parity.
// PRD AC mapping: MutateDemandPlan -> AC-01/AC-05; MutateSupplyNetworkPlan ->
// AC-02/AC-05; MutateAvailableToPromise -> AC-03/AC-05;
// MutateTransportationPlan -> AC-04 distribution-lane metadata/AC-05;
// MutateReplenishmentPlan and MutatePlanningScenario are reserved preview
// extension envelopes only. Result audit_event_class fields are classifier
// strings, not evidence of signed runtime audit emission.
// Network scaffold route-shape note: the read-only network app currently uses
// five action-style routes and omits the transportation/distribution route;
// this contract card records the mismatch and leaves scaffold fixes to
// t_d2b84fb7.

message DemandPlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message DemandPlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message SupplyNetworkPlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message SupplyNetworkPlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message AvailableToPromiseCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message AvailableToPromiseResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message ReplenishmentPlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message ReplenishmentPlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message TransportationPlanCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message TransportationPlanResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message PlanningScenarioCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message PlanningScenarioResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

// RPC names describe preview command-envelope wire shape only. They are not
// evidence of a deployed server, accepted runtime mutation, or signed audit
// event emission.
service SupplyChainPlanningService {
  rpc MutateDemandPlan (DemandPlanCommand) returns (DemandPlanResult);
  rpc MutateSupplyNetworkPlan (SupplyNetworkPlanCommand) returns (SupplyNetworkPlanResult);
  rpc MutateAvailableToPromise (AvailableToPromiseCommand) returns (AvailableToPromiseResult);
  rpc MutateReplenishmentPlan (ReplenishmentPlanCommand) returns (ReplenishmentPlanResult);
  rpc MutateTransportationPlan (TransportationPlanCommand) returns (TransportationPlanResult);
  rpc MutatePlanningScenario (PlanningScenarioCommand) returns (PlanningScenarioResult);
}
