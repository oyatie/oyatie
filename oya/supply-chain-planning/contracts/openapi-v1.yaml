openapi: 3.2.0
info:
  title: Supply Chain Planning API
  version: 1.0.0
  summary: Preview metadata-only Supply Chain Planning API contract
  description: >-
    Preview-only command metadata contract aligned to the canonical PRD at
    specs/microservices/supply-chain-planning.json. This artifact records REST
    command envelope shapes for contract and fixture review only; it does not
    claim a deployed endpoint, accepted live runtime writes, durable
    persistence, signed/runtime audit emission, Workflow execution, cloud
    deployment, GA readiness, measured SLO/DR readiness, or exhaustive SAP,
    Oracle, Microsoft, Workday, or NetSuite parity.
  x-oyatie-contract-status: preview-not-deployed
  x-oyatie-preview-authority:
    prd_ref: specs/microservices/supply-chain-planning.json
    root_hub_pointer: specs/root-hub-pointers.json#/entry_points/prd_supply_chain_planning
    produced_contract_family: enterprise.enterprise_supply_chain_planning.v1
    proto_package_rationale: >-
      The gRPC proto keeps package oya.supply_chain_planning.v1 as the visible
      repository/wire namespace for this preview inventory. It is a documented
      namespace alias for the PRD produced contract family
      enterprise.enterprise_supply_chain_planning.v1, not a second activation
      claim; any package rename requires separate compatibility evidence.
    non_claims:
      - no deployed HTTP runtime or accepted live write
      - no durable persistence or Workflow execution
      - no signed/runtime audit-chain emission
      - no cloud deployment, GA readiness, measured SLO readiness, or DR readiness
      - no exhaustive vendor parity or live optimizer/scheduler/ATP/replenishment runtime
    prd_ac_alignment:
      AC-01: DemandPlanCommand covers demand-plan metadata and validation evidence only.
      AC-02: SupplyNetworkPlanCommand covers supply-network proposal metadata and shortage evidence only.
      AC-03: AvailableToPromiseCommand covers ATP response metadata only; no order-management or warehouse mutation.
      AC-04: TransportationPlanCommand is retained as the distribution-lane metadata envelope; no carrier booking or transportation execution.
      AC-05: All command envelopes carry tenant, principal, idempotency, compliance, and payload metadata for validation-shape review only.
      preview_extensions: ReplenishmentPlanCommand and PlanningScenarioCommand are reserved manifest bounded-context envelopes, not additional runtime activation claims.
    network_scaffold_route_shape:
      classification: no-action-in-this-contract-card
      rationale: >-
        The read-only network app scaffold currently exposes five action-style
        routes (/demand-plans:publish, /supply-network-plans:reconcile,
        /replenishment-plans:approve, /available-to-promise:reserve, and
        /planning-scenarios:simulate) and omits the transportation/distribution
        route. This contract card records the mismatch and preserves the
        canonical preview contract paths; t_d2b84fb7 owns any scaffold fix.
servers:
