components:
  x-oyatie-sharding-automation-event-surface:
    microservice: supply-chain-planning
    wave: 15-ZF-13
    artifact_type: contracts
    scope: >-
      Provenance-only OpenAPI components metadata for the sharding_automation
      event surface. Retained for historical review context; it is not evidence
      of a live control plane, deployed CI/CD substrate, runtime audit-chain
      emission, or cloud deployment.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Provenance-only legacy local-verifier completeness doctrine. ADR-0515
          supersedes it for live CI/merge authority with the single protected
          oya-ci-required context; local verifier output is bridge feedback only.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Provenance-only cellular topology automation doctrine. This preview
          contract preserves target vocabulary but does not claim live control
          plane automation or runtime audit-chain emission.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: target/provenance vocabulary only; no live placement computation is claimed.
          auto_rebalance: target/provenance vocabulary only; no live tenant migration, observability, reversibility, or audit-chain emission is claimed.
          dynamic_sharding: target/provenance vocabulary only; no atomic shard-count operation or runtime audit emission is claimed.
          manifest_block: sharding_automation declares target vocabulary for future activation review only.
      ADR-0349:
        purpose: >-
          Provenance-only historical Jenkins/Argo CI/CD substrate doctrine.
          ADR-0515 supersedes it for live CI authority; retained references do
          not activate Jenkins, Argo, deployment, or cloud readiness claims.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as provenance metadata for sharding_automation event-surface review only; ADR-0515 controls live CI authority.
  schemas:
    DemandPlanCommand:
      type: object
      description: Preview metadata command envelope for PRD AC-01 and validation-shape AC-05.
      x-prd-acceptance-criteria: [AC-01, AC-05]
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Demand-plan metadata shape including tenant, legal entity, planning area, item, location, forecast/order/adjustment quantities, horizon, effective date, source refs, consensus evidence, state, schema version, and explicit false ML/collaboration/cloud flags.
    SupplyNetworkPlanCommand:
      type: object
      description: Preview metadata command envelope for PRD AC-02 and validation-shape AC-05.
      x-prd-acceptance-criteria: [AC-02, AC-05]
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Supply-network proposal metadata shape including demand-plan reference, source/demand locations, demand and supply quantities, net requirement, rounded planned supply, constrained shortage, feasibility flag, evidence, state, and explicit false production/procurement/inventory/cloud flags.
    AvailableToPromiseCommand:
      type: object
      description: Preview metadata command envelope for PRD AC-03 and validation-shape AC-05.
      x-prd-acceptance-criteria: [AC-03, AC-05]
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Available-to-promise response metadata shape including supply-plan reference, request location, requested/available/promised/backorder quantities, priority, requested ship date, evidence, state, backorder flag, and explicit false order-management/warehouse/cloud flags.
    ReplenishmentPlanCommand:
      type: object
      description: Reserved preview metadata extension envelope; not covered as a runtime by PRD AC-01..AC-04 and not a replenishment execution claim. Validation-shape AC-05 still applies.
      x-prd-acceptance-criteria: [AC-05]
      x-oyatie-preview-extension-only: true
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Reserved replenishment metadata shape for fixture review only; no replenishment runtime, purchase requisition, inventory mutation, or cloud activation is claimed.
    TransportationPlanCommand:
      type: object
      description: Preview metadata command envelope retained for PRD AC-04 distribution-lane planning metadata and validation-shape AC-05; no transportation execution or carrier booking is claimed.
      x-prd-acceptance-criteria: [AC-04, AC-05]
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Distribution-lane planning metadata shape including supply-plan reference, source/destination locations, transfer quantity, lane capacity, remaining capacity, lead time, freight cost, evidence, state, and lane sufficiency flag.
    PlanningScenarioCommand:
      type: object
      description: Reserved preview metadata extension envelope; not a live optimizer, scheduler, or scenario execution claim. Validation-shape AC-05 still applies.
      x-prd-acceptance-criteria: [AC-05]
      x-oyatie-preview-extension-only: true
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
          description: Reserved planning-scenario metadata shape for fixture review only; no optimizer, simulation runtime, Workflow execution, or cloud activation is claimed.
