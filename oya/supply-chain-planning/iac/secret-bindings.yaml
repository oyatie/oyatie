# Claim boundary: target/provenance inventory only; do not apply or bind OpenBao
# secrets from this file until a separate activation card supplies evidence.
apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: oya-supply-chain-planning
  annotations:
    oyatie.com/claim-boundary: target-provenance-only
    oyatie.com/no-runtime-audit-chain-emission: "true"
spec:
  openbaoPaths:
    - secret/{{ tenant_id }}/supply-chain-planning/database
    - secret/{{ tenant_id }}/supply-chain-planning/signing
  maxTtlSeconds: 60
  auditEventClass: EVT-SUPPLY_CHAIN_PLANNING-DEMAND_PLAN-SECRET_LEASE
