{{/* Claim boundary: target/provenance template only; no live Service readiness is claimed. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.microservice.id | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/claim-boundary: {{ .Values.claimBoundary.classification | quote }}
    oyatie.com/adr-0349: argocd-target-provenance
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
