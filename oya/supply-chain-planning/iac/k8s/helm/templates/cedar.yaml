{{/* Claim boundary: target/provenance template only; no live Cedar enforcement is claimed. */}}
{{- if .Values.cedar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cedar.policyConfigMapName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    oyatie.com/claim-boundary: {{ .Values.claimBoundary.classification | quote }}
    oyatie.com/policy-engine: cedar
    oyatie.com/adr-0246: policy-engine-substrate
data:
  policies.cedar: |
    permit(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class == "{{ .Values.microservice.tenantClass }}"
    };

    forbid(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class != "{{ .Values.microservice.tenantClass }}"
    };
{{- end }}
