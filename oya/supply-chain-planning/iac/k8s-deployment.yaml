# Claim boundary: stale target/provenance sample only; do not kubectl apply.
# This file carries no live deployment, readiness, SLO, DR, audit-chain, or GA claim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-supply-chain-planning
  annotations:
    oyatie.com/claim-boundary: stale-target-provenance-only
    oyatie.com/no-live-deployment: "true"
  labels:
    app: oya-supply-chain-planning
    sap-code: "SCM/APO"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oya-supply-chain-planning
  template:
    metadata:
      labels:
        app: oya-supply-chain-planning
    spec:
      containers:
        - name: service
          image: registry.example/oya-supply-chain-planning:0.1.0
          ports:
            - name: h3
              containerPort: 8443
          env:
            - name: OYA_HTTP_DEFAULT
              value: HTTP/3
            - name: OYA_ECH_ENABLED
              value: "true"
            - name: OYA_PQC_HYBRID
              value: X25519MLKEM768
