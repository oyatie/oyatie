apiVersion: openslo/v1
kind: SLO
metadata:
  name: demand-plan-success-rate
  labels:
    service: supply-chain-planning
    sap_code: "SCM/APO"
  annotations:
    inventory_classification: target-provenance
    visible_repo_path: oya/supply-chain-planning/slos/demand-plan-success-rate.openslo.yaml
    authority_ceiling: "Metadata-only preview target; no measured SLO, runtime telemetry, cloud deployment, DR, or GA readiness claim."
spec:
  description: "Target/provenance demand-plan success-rate objective for the metadata-only Supply Chain Planning preview; benchmarks SAP SCM/APO and SAP IBP | Oracle Supply Chain Planning | Workday Adaptive Planning supply-chain scenario counterpart | NetSuite Demand Planning | Microsoft Dynamics 365 Master Planning; not measured runtime SLO evidence."
  service: supply-chain-planning
  indicator:
    metadata:
      name: demand-plan-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_supply_chain_planning_demand_plan_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_supply_chain_planning_demand_plan_attempt_total[5m]))"
  objectives:
    - displayName: demand-plan-success-rate
      target: 0.999
