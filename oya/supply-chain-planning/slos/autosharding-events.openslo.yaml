# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (Wave 15-ZF-15 per ADR-0346, ADR-0347, ADR-0348, ADR-0349)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: supply-chain-planning-autosharding-hot-split-latency
  displayName: "supply-chain-planning autosharding HOT-SPLIT p99 latency"
  labels:
    microservice: supply-chain-planning
    doctrine_wave: wave-15-zf-15
    adr_0346: legacy-local-verifier-provenance
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: legacy-ci-cd-bridge-provenance
    automation_mode: dynamic_sharding
    automation_event: hot_split
    enforced_by: oya-governance-dynamic-sharding-threshold-coverage
  annotations:
    inventory_classification: target-provenance
    visible_repo_path: oya/supply-chain-planning/slos/autosharding-events.openslo.yaml
    authority_ceiling: "Metadata-only preview target; no measured autosharding, audit-chain, SLO, cloud deployment, DR, or GA readiness claim."
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_purpose: "Historical local verifier wording is retained as provenance only; live merge authority is the protected oya-ci-required context."
    adr_0347_enforced_by: "oya-governance-lane-prefix-vocabulary"
    adr_0348_enforced_by: "oya-governance-dynamic-sharding-threshold-coverage; oya-governance-audit-chain-emit-on-automation-events"
    adr_0349_enforced_by: "legacy CI/CD bridge parity lanes; provenance only for this preview inventory"
spec:
  description: "Target/provenance autosharding HOT-SPLIT objective for the metadata-only Supply Chain Planning preview; it records intended thresholds and evidence fields without claiming measured SLO, runtime audit-chain emission, deployment, or CI/CD readiness."
  indicator:
    metadata:
      name: supply-chain-planning-autosharding-hot-split-latency-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_hot_split_duration_seconds_bucket{microservice="supply-chain-planning",automation_event="hot_split"}[5m])) by (le))'
  objectives:
    - displayName: "99% of HOT-SPLIT events complete within 300s over 30d"
      target: 0.99
      op: lte
      value: 300
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: supply-chain-planning-autosharding-rebalance-migration-time
  displayName: "supply-chain-planning AUTO-REBALANCE migration p99 duration"
  labels:
    microservice: supply-chain-planning
    doctrine_wave: wave-15-zf-15
    adr_0346: legacy-local-verifier-provenance
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: legacy-ci-cd-bridge-provenance
    automation_mode: auto_rebalance
    automation_event: tenant_migration
    enforced_by: oya-governance-auto-rebalance-residency-honored
  annotations:
    inventory_classification: target-provenance
    visible_repo_path: oya/supply-chain-planning/slos/autosharding-events.openslo.yaml
    authority_ceiling: "Metadata-only preview target; no measured autosharding, audit-chain, SLO, cloud deployment, DR, or GA readiness claim."
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_enforced_by: "legacy local-verifier provenance lanes only; no merge authority or runtime readiness claim"
    adr_0347_enforced_by: "oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary; oya-governance-rename-inventory-presence"
    adr_0348_enforced_by: "oya-governance-auto-rebalance-residency-honored; oya-governance-audit-chain-emit-on-automation-events; oya-governance-tenant-migration-reversibility"
    adr_0349_purpose: "Legacy CI/CD bridge language is provenance only for this preview inventory; no live deployment readiness is claimed."
spec:
  description: "Target/provenance AUTO-REBALANCE objective for the metadata-only Supply Chain Planning preview; it records intended thresholds and evidence fields without claiming measured SLO, runtime audit-chain emission, deployment, or CI/CD readiness."
  indicator:
    metadata:
      name: supply-chain-planning-autosharding-rebalance-migration-time-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_rebalance_migration_duration_seconds_bucket{microservice="supply-chain-planning",automation_event="tenant_migration"}[5m])) by (le, migration_distance))'
  objectives:
    - displayName: "99% of intra-region AUTO-REBALANCE migrations complete within 600s over 30d"
      target: 0.99
      op: lte
      value: 600
    - displayName: "99% of cross-region AUTO-REBALANCE migrations complete within 3600s over 30d"
      target: 0.99
      op: lte
      value: 3600
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
