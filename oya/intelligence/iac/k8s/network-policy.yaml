# Kubernetes NetworkPolicy for intelligence µservice
# Authority: ADR-0254 + ADR-0248 (Cilium ambient eBPF; default-deny network-policy)
# Per §3.2.6.D prevention layer L1 (network default-deny)
# Owner: ops-security + axis-intelligence

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligence-default-deny
  namespace: intelligence
  annotations:
    adr_ref: "ADR-0254, ADR-0248"
    enforcement_lane: oya-governance-adr-adherence-matrix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow ingress from authenticated callers only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligence-allow-ingress
  namespace: intelligence
spec:
  podSelector:
    matchLabels:
      app: oya-intelligence
  policyTypes:
    - Ingress
  ingress:
    # gRPC from other µservices (SPIFFE-attested via Cilium L7 policy)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: foundry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-shell
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
      ports:
        - protocol: TCP
          port: 50051
    # HTTP/3 + QUIC from edge ingress only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: UDP
          port: 443
    # Metrics scrape from observability
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090

---
# Allow egress to provider APIs + OpenBao + audit substrate only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligence-allow-egress
  namespace: intelligence
spec:
  podSelector:
    matchLabels:
      app: oya-intelligence
  policyTypes:
    - Egress
  egress:
    # OpenBao sidecar (loopback only — Unix domain socket)
    - to:
        - podSelector:
            matchLabels:
              app: oya-intelligence
              container: openbao-sidecar
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Audit substrate
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317  # OTLP gRPC
    # External provider APIs (Anthropic, OpenAI, Google, etc.) via egress gateway
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress-gateway
      ports:
        - protocol: TCP
          port: 443
