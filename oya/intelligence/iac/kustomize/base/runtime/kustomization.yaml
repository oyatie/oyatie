# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the foundry-runtime cluster, applied identically per-pack with
# pack-specific overlays for residency region, retention overrides, OpenBao secret
# references, replica scaling tier. Per ADR-0025 + ADR-0131 + multi-region.md DR posture.

namespace: foundry-runtime

resources:
  - namespace.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-sibling-allowlist.yaml
  - openbao-secret-references.yaml
  - spire-trust-domain.yaml
  - istio-peer-authentication.yaml
  - service-mesh-tenant-headers.yaml

helmCharts:
  - name: oya-intelligence-runtime-pool
    valuesFile: ../../helm/runtime-pool/values.yaml
    releaseName: foundry-runtime-pool
    namespace: foundry-runtime
  - name: oya-intelligence-runtime-redis
    valuesFile: ../../helm/redis/values.yaml
    releaseName: foundry-runtime-redis
    namespace: foundry-runtime
  - name: oya-intelligence-runtime-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: foundry-runtime-postgres
    namespace: foundry-runtime

commonLabels:
  app.kubernetes.io/part-of: oya-intelligence-runtime
  oyatie/microservice: foundry-runtime
