# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the foundry-guardrails µservice, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier, classifier-model artifact
# bucket URIs.
# Per ADR-0131 + ADR-0140 (retired per ADR-0145).

namespace: foundry-guardrails

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - cosign-key-refs.yaml

helmCharts:
  - name: oya-intelligence-guardrails-cedar-engine
    valuesFile: ../../helm/cedar-engine/values.yaml
    releaseName: cedar-engine
    namespace: foundry-guardrails
  - name: oya-intelligence-guardrails-classifier-model-serving
    valuesFile: ../../helm/classifier-model-serving/values.yaml
    releaseName: classifier-model-serving
    namespace: foundry-guardrails
  - name: oya-intelligence-guardrails-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: postgres
    namespace: foundry-guardrails

commonLabels:
  app.kubernetes.io/part-of: oya-intelligence-guardrails
  oyatie/microservice: foundry-guardrails
