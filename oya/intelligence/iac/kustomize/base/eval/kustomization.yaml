# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# foundry-eval base Kustomize manifest
# Composes all four Helm charts via the helm-controller pattern.
# Per ADR-0024 + ADR-0131.
#
# Per-pack overlays under iac/kustomize/overlays/<pack>/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foundry-eval

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicy-default-deny.yaml
  - cedar-policy-configmap.yaml

# Helm release CRDs (assumes flux helm-controller or argo-cd)
helmCharts:
  - name: gpu-runner-pool
    repo: oci://registry.oyatie.com/foundry-eval/charts
    version: 1.0.0
    releaseName: foundry-eval-gpu-runner-pool
    valuesFile: ../../helm/gpu-runner-pool/values.yaml
  - name: postgres
    repo: oci://registry.oyatie.com/foundry-eval/charts
    version: 1.0.0
    releaseName: foundry-eval-postgres
    valuesFile: ../../helm/postgres/values.yaml
  - name: clickhouse
    repo: oci://registry.oyatie.com/foundry-eval/charts
    version: 1.0.0
    releaseName: foundry-eval-clickhouse
    valuesFile: ../../helm/clickhouse/values.yaml
  - name: baseline-store
    repo: oci://registry.oyatie.com/foundry-eval/charts
    version: 1.0.0
    releaseName: foundry-eval-baseline-store
    valuesFile: ../../helm/baseline-store/values.yaml

# Common labels for all resources
commonLabels:
  app.kubernetes.io/part-of: foundry-eval
  app.kubernetes.io/managed-by: kustomize
  oya-pack-id: kr  # overridden per overlay

# Common annotations
commonAnnotations:
  oya-adr: "ADR-0024,ADR-0026,ADR-0131"
  oya-prd: "microservices/intelligence/PRD.md"
