# Per-tenant Milvus collection. Naming pattern: tenant_{tenant_id}__{domain}
# per ADR-0192 §"Multi-tenancy isolation". Overlays patch metadata.name
# + dimension + index_type as per-tenant per-domain.
apiVersion: milvus.io/v1alpha1
kind: MilvusCollection
metadata:
  name: REPLACE_TENANT_DOMAIN  # e.g., tenant_ten_acme__rag_corpus
  annotations:
    oya.adr: "0192"
    oya.tenant: REPLACE_TENANT
    oya.domain: REPLACE_DOMAIN
spec:
  database: REPLACE_DATABASE
  schema:
    autoID: false
    fields:
      - name: source_id
        dataType: VarChar
        isPrimary: true
        typeParams:
          max_length: "256"
      - name: embedding
        dataType: FloatVector
        typeParams:
          dim: "1024"  # ADR-0046 canonical default
      - name: data_class
        dataType: VarChar
        typeParams:
          max_length: "64"
      - name: inserted_at
        dataType: Int64
  index:
    fieldName: embedding
    indexType: HNSW   # ADR-0192 §"Index types" pinned default
    metricType: COSINE
    params:
      M: "16"
      efConstruction: "200"
  shardsNum: 2
