# KR pack overlay for Milvus per ADR-0049 cross-region replication + ADR-0010
# regional pack. Pins region to kr-seoul; primary cell only (StrictKR
# residency forbids US failover).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foundry-kr

resources: []

patches:
  - target:
      kind: MilvusCluster
      name: oya-intelligence-milvus
    patch: |
      - op: replace
        path: /spec/externalS3/region
        value: "kr-seoul"
      - op: replace
        path: /spec/externalS3/host
        value: "seaweedfs-s3-kr.observability-kr.svc.cluster.local"

labels:
  - includeSelectors: true
    pairs:
      oya.pack: "kr"
      oya.adr: "0010,0049,0192"
