# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas.
# Per data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1; no DR pair).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/postgresql-ha/postgresql/persistence/size
        value: "500Gi"  # pack-kr trial-tier (XS) — smaller PV
    target:
      kind: HelmRelease
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/values/postgresql-ha/postgresql/replicaCount
        value: 1  # pack-kr single-region; no DR pair; primary + 1 hot standby intra-AZ
    target:
      kind: HelmRelease
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/values/redis-cluster/cluster/nodes
        value: 6  # 3 shards × 2 replicas (minimum HA; pack-kr trial)
    target:
      kind: HelmRelease
      name: redis
  - patch: |-
      - op: replace
        path: /spec/values/walArchive/retention
        value: "60mo"  # KR-FSS sector guidance: 5y for AUDIT records
    target:
      kind: HelmRelease
      name: postgres

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      # OCI_KMS_KEY_ID is provisioned by `oya-intelligence-supervisor-kustomize-bootstrap` job at first deploy; populated into Kubernetes Secret `oya-intelligence-supervisor-kms` (key: `kms_key_id`) which envFrom-mounts into pods. Per ADR-0043 secrets-management, raw KMS OCID never appears in git-tracked manifests.
      - OCI_KMS_KEY_ID_SOURCE=secretRef:oya-intelligence-supervisor-kms#kms_key_id
      - OPENBAO_ADDR=https://openbao.cloud-secrets.svc.cluster.local:8200
      - SUPERVISOR_REDIS_CLUSTER_ADDRS=redis-cluster-0.foundry-supervisor.svc.cluster.local:6379,redis-cluster-1.foundry-supervisor.svc.cluster.local:6379,redis-cluster-2.foundry-supervisor.svc.cluster.local:6379
      - OCI_FOUNDRY_SUPERVISOR_WAL_BUCKET=oya-intelligence-supervisor-pack-kr-wal
