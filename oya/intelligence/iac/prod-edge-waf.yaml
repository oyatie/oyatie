# Edge WAF configuration for intelligence µservice
# Authority: ADR-0297 (abuse-defence) + documentation-rigor §3.2.3
# Owner: ops-security
# Wires: anti-bot, anti-spoof, anti-scrape per §3.2.3 taxonomy
# UX-floor: legitimate users with no bot signals experience zero added friction

apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligence-edge-waf
  namespace: intelligence
  labels:
    app: oya-intelligence
    component: edge-waf
    managed-by: oya-iac
  annotations:
    adr_ref: ADR-0297
    enforcement_lane: oya-governance-abuse-defence-ux-floor
data:
  # --- Anti-bot controls (§3.2.3) ---

  # Rate limiting: token-bucket + sliding-window per-IP, per-fingerprint, per-tenant, per-route
  rate_limit_enabled: "true"
  rate_limit_dispatch_rps_unauthenticated: "10"
  rate_limit_dispatch_rps_consumer: "60"
  rate_limit_dispatch_rps_developer: "300"
  rate_limit_dispatch_rps_internal_foundry: "3000"
  # Emergency-services: elevated floor per documentation-rigor §3.2.3 LIFE-SAFETY HARD RULE
  rate_limit_dispatch_rps_emergency_services: "10000"
  rate_limit_burst_multiplier: "3"

  # Behavioural fingerprinting (passive only — never alone gates a request)
  fingerprint_ja4_enabled: "true"
  fingerprint_h3_frame_pattern_enabled: "true"
  bot_score_header: "X-Oya-Bot-Score"

  # Bot management ML scoring (Cloudflare Bot Management parity)
  bot_mgmt_enabled: "true"
  bot_mgmt_score_threshold_challenge: "80"
  bot_mgmt_score_threshold_block: "95"
  # Per UX-floor: default-path is challenge-free; challenge only when bot-score crosses threshold
  bot_mgmt_default_path_challenge: "false"
  # Bot-mgmt latency budget: ≤2ms p99 on default path (CI gate)
  bot_mgmt_max_latency_p99_ms: "2"

  # CAPTCHA: hCaptcha + Turnstile; presented only on bot-score threshold; never on default path
  captcha_provider: "hcaptcha+turnstile"
  captcha_on_default_path: "false"
  captcha_a11y_audio_fallback: "true"
  captcha_keyboard_nav: "true"

  # Honeypot routes (no legitimate client should hit these)
  honeypot_routes:
    - "/v0/dispatch"
    - "/internal/debug/dispatch"
    - "/admin/dispatch-raw"

  # --- Anti-spoof controls (§3.2.3) ---

  # Strict TLS per ADR-0253
  tls_profile_ref: intelligence-pqc-tls-profile
  ech_config_ref: intelligence-ech-config

  # Payload anti-spoof: HMAC-signed webhooks; mTLS for machine clients
  webhook_hmac_required: "true"
  webhook_replay_window_seconds: "300"
  machine_client_mtls_required: "true"

  # Caller anti-spoof: SPIFFE workload identity per ADR-0295
  spiffe_verification_enabled: "true"

  # --- Anti-scrape controls (§3.2.3) ---

  # Aggressive rate caps on unauthenticated reads
  scrape_pattern_detection_enabled: "true"
  scrape_sequential_id_threshold: "50"
  scrape_breadth_first_threshold: "100"

  # robots.txt enforcement
  robots_txt_enabled: "true"

  # Content fingerprinting / per-user watermarking for high-value outputs
  content_watermarking_enabled: "true"

  # --- Emergency-services bypass (LIFE-SAFETY HARD RULE) ---
  # audience_type = EMERGENCY_SERVICES bypasses ALL score gates at L3 Cedar
  # per policy/critical-path-emergency-services.cedar; bypass still audit-emitted
  emergency_services_bypass_cedar_policy: "policy/critical-path-emergency-services.cedar"
  emergency_services_bypass_audit_class: "AbuseDefenceEmergencyServiceBypass"

  # --- Friendly-crawler allow-list bypass ---
  friendly_crawler_bypass_enabled: "true"
  friendly_crawler_audience_type: "FRIENDLY_CRAWLER_PARTNER"

  # --- CI gate ---
  ci_lane: "oya-governance-abuse-defence-ux-floor"
