# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-intelligence-milvus
description: |
  Milvus 2.6.x disaggregated vector database per ADR-0192.
  Four-plane shape: Access (proxy) + Coordinator (root/query/data/index)
  + Worker (query/data/index nodes) + Storage (etcd MetaStore + Pulsar
  log broker + SeaweedFS S3-compat object store).
type: application
version: 0.1.0
appVersion: "2.6.15"  # ADR-0192 §"Sizing model"; verified 2026-05-18
home: https://milvus.io/
sources:
  - https://github.com/milvus-io/milvus
keywords:
  - vector-database
  - ann
  - hnsw
  - ivf
  - diskann
  - cnacf-graduated
maintainers:
  - name: axis-foundry
    email: axis-foundry@oyatie.com
annotations:
  # Per ADR-0192 §"In-house roadmap" — this chart is the Phase-0 substrate;
  # Phase-2 oya-vector-store-server lands at a separate chart name.
  oya.adr/0192: vector-database-canonical-milvus
  oya.adr/0184: storage-tier-layering
  oya.layout: per-microservice-flat-layout-adr-0131
dependencies:
  # Upstream Milvus operator chart (zilliztech/milvus-operator). Pinned by
  # major minor; full app version pinned via image tag below in values.yaml.
  - name: milvus-operator
    version: "~1.3.0"
    repository: https://zilliztech.github.io/milvus-operator/
    condition: milvus-operator.enabled
