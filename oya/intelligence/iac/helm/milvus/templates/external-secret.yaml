# Per ADR-0043-secrets-management-openbao-and-hsm-per-cell.
# Resolves the Milvus root password from OpenBao via the
# External Secrets Operator (canonical OpenBao->K8s primitive).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: milvus-root-password
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: oya-intelligence-milvus
    app.kubernetes.io/component: milvus-root-credentials
    oya.adr: "0043,0192"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-cluster
    kind: ClusterSecretStore
  target:
    name: milvus-root-password
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        # Per-cell rotation per the 90-day OpenBao rotation cadence.
        key: secret/foundry/milvus/root-password
        property: password
