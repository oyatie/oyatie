# Canonical-base: microservices/governance/iac/helm/_oya-helpers
apiVersion: v2
name: oya-intelligence-timescaledb-extension
description: |
  Post-install hook that installs the TimescaleDB 2.26.x community-edition
  (Apache-2.0) extension into the foundry µservice's existing Postgres 18.4
  database per ADR-0194. Applies hypertable DDL declared in
  microservices/intelligence/iac/timescaledb/hypertables.sql.

  TSL-fenced: extension installs ONLY Apache-2.0 community functions;
  TSL-only function names (add_retention_policy, add_compression_policy,
  hyperfunctions, tiered storage) are forbidden by the kernel and
  oya-check-license-policy CI lane.
type: application
version: 0.1.0
appVersion: "2.26.4"
home: https://github.com/timescale/timescaledb
sources:
  - https://github.com/timescale/timescaledb
keywords:
  - timescaledb
  - hypertable
  - continuous-aggregate
  - apache-2-0
  - postgres-extension
maintainers:
  - name: axis-foundry
annotations:
  oya.adr/0194: tenant-facing-timeseries-timescaledb
  oya.adr/0184: storage-tier-layering
