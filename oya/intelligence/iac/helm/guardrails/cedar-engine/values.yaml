cedarEngine:
  image:
    registry: docker.io
    repository: oyatie/cedar-engine
    tag: "v4.3.0"           # Cedar v4 LTS pin per docs/standards/lts-versions-verified.md
    pullPolicy: IfNotPresent
  replicas:
    standalone: 2           # batch / cross-tenant evaluator pool; sidecar runs in -rest pods
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  bundle:
    source: configmap
    configMapName: cedar-bundle-${PACK}
    refreshInterval: 30s
  defaultDeny:
    enforced: true          # MANDATORY per policy/guardrail-enforcement.md
  metrics:
    enabled: true
    port: 9100
  serviceAccount:
    create: true
    name: foundry-guardrails-cedar-engine
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  networkPolicy:
    enabled: true
    allowFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: oya-intelligence-guardrails
    denyEgressTo:
      - cidrs: ["0.0.0.0/0"]   # default-deny egress; explicit allows below
    egressAllowList:
      - port: 5432              # Postgres rule-store
      - port: 9100              # metrics scrape (Prom)
  service:
    type: ClusterIP
    port: 8080
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
