postgresql-ha:
  image:
    registry: docker.io
    repository: bitnami/postgresql-repmgr
    tag: "16.4.0-debian-12-r0"    # Postgres 16 LTS pin per docs/standards/lts-versions-verified.md
  global:
    storageClass: oci-bv          # OCI Block Volume
    postgresql:
      database: foundry_guardrails
      username: foundry_guardrails_app
      existingSecret: foundry-guardrails-postgres-secrets   # OpenBao-projected
  postgresql:
    replicaCount: 3              # 1 primary + 2 RR per `capacity-model.md`
    repmgrUsername: repmgr
    repmgrPassword:
      existingSecret: foundry-guardrails-postgres-secrets
      secretKey: repmgr-password
    extendedConfiguration: |
      # MANDATORY per policy/tenant-isolation.md TI-01 (RLS) + TI-02 (typed port) + TI-05 (audit log)
      shared_preload_libraries = 'pgaudit'
      pgaudit.log = 'ddl,write'
      pgaudit.log_catalog = on
      # Row-level security globally enabled
      row_security = on
      # Sync replication for RPO ≤ 1s
      synchronous_commit = on
      synchronous_standby_names = 'ANY 1 (*)'
      # TLS in transit
      ssl = on
      ssl_min_protocol_version = 'TLSv1.3'
    initdbScriptsConfigMap: foundry-guardrails-postgres-init
    persistence:
      enabled: true
      size: 100Gi
      storageClass: oci-bv
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi
  pgpool:
    replicaCount: 2
    adminUsername: admin
    adminPassword:
      existingSecret: foundry-guardrails-postgres-secrets
      secretKey: admin-password
    childMaxConnections: 200
    childLifeTime: 300
    clientIdleLimit: 60
    customUsers:
      usernames: foundry_guardrails_app
      passwords:
        existingSecret: foundry-guardrails-postgres-secrets
        secretKey: app-password
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: foundry-guardrails
  networkPolicy:
    enabled: true
    allowExternal: false
    allowFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: oya-intelligence-guardrails
  backup:
    enabled: true
    schedule: "0 2 * * *"        # daily 2am pack-local
    retention: 35                  # 35 daily backups (~5 weeks)
    s3:
      bucket: "foundry-guardrails-${PACK}-postgres-backups"
      endpoint: "https://objectstorage.${REGION}.oraclecloud.com"
      region: "${REGION}"
      accessKeyId:
        existingSecret: foundry-guardrails-postgres-secrets
        secretKey: s3-access-key
      secretAccessKey:
        existingSecret: foundry-guardrails-postgres-secrets
        secretKey: s3-secret-key
  podDisruptionBudget:
    create: true
    minAvailable: 2
