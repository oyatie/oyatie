apiVersion: v2
name: oya-intelligence-providers-router
description: |
  Helm chart for the foundry-providers µservice composition: provider-router
  (REST + worker + app) and the per-vendor adapter pods. Deployed per-pack
  into a dedicated cell-namespace; mesh-internal mTLS.
type: application
version: 0.1.0
appVersion: "0.1.0"
maintainers:
  - name: axis-foundry
    email: axis-foundry@oyatie.com
  - name: ops-security
    email: ops-security@oyatie.com
keywords:
  - foundry-providers
  - llm-router
  - openbao
  - anthropic
  - openai
  - gemini
home: https://oyatie.com/cloud-intelligence-providers
icon: ""
dependencies: []
annotations:
  oya.adr/references: "ADR-0025, ADR-0026, ADR-0028, ADR-0056, ADR-0105, ADR-0131"
  oya.policy.credential-isolation: "enforced"
  oya.policy.two-person-publish: "required"
