# oya-intelligence-providers-router Helm values
# Per-pack values override in iac/kustomize/overlays/<pack>/.

image:
  repository: registry.oyatie.dev/foundry-providers/router
  tag: ""          # set per-deploy from release-pointer ref
  pullPolicy: IfNotPresent

router-rest:
  replicaCount: 4
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  service:
    type: ClusterIP
    port: 8080
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [oya-intelligence-providers-router-rest]
        topologyKey: kubernetes.io/hostname

router-worker:
  replicaCount: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "3Gi"

router-app:
  replicaCount: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "3Gi"

adapters:
  anthropic-api:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
  anthropic-subscription:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
    enabled: true
    fragile: true
  openai-api:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
  openai-subscription:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
    enabled: true
    fragile: true
  gemini-api:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
  gemini-subscription:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
    enabled: true
    fragile: true
  in-house:
    replicaCount: 2
    resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1500m", memory: "3Gi"}}
    canary:
      cohortRamp: [0.01, 0.10, 0.50, 1.00]   # per ADR-0026 + threat-model.md T-04

openbao:
  agent:
    enabled: true
    image: registry.oyatie.dev/cloud-secrets/openbao-agent:stable
    socketPath: /var/run/openbao/agent.sock
    leaseTtlSeconds: 900     # 15 min per credential-isolation.md CI-INV-04
    cacheEnabled: true

postgres:
  endpoint: "oya-intelligence-providers-postgres.<pack>.svc.cluster.local:5432"
  database: "providers"
  user: "providers_app"
  # password resolved via OpenBao SecretReference; NOT literal here.
  passwordSecretReference: "openbao://<pack>/internal/foundry-providers/postgres-app-password"

redis:
  endpoint: "oya-intelligence-providers-redis.<pack>.svc.cluster.local:6379"
  passwordSecretReference: "openbao://<pack>/internal/foundry-providers/redis-app-password"

mesh:
  istio:
    enabled: true
    mTLSMode: STRICT

residency:
  pack: ""   # set per-deploy overlay

eventEmission:
  nats:
    endpoint: "oya-intelligence-evidence-nats.<pack>.svc.cluster.local:4222"
    subjects:
      providerInvoked: "oya.foundry.providers.invocation"
      routerDecided: "oya.foundry.providers.router-decided"
      credentialResolved: "oya.foundry.providers.credential-resolved"
      credentialRotated: "oya.foundry.providers.credential-rotated"
      credentialRevoked: "oya.foundry.providers.credential-revoked"
      providerHealthChanged: "oya.foundry.providers.provider-health-changed"
      adapterPinned: "oya.foundry.providers.adapter-pinned"
      euAiActDisclosure: "oya.foundry.providers.eu-ai-act-disclosure"

observability:
  otel:
    endpoint: "oya-observability-alloy.<pack>.svc.cluster.local:4317"
  prometheus:
    scrapeInterval: 15s

recordingRules:
  - name: oya:provider:availability:rolling_15m
    expr: |
      avg_over_time(oya_foundry_providers_provider_request_success_ratio[15m])
  - name: oya:provider:p99_latency_ms:rolling_5m
    expr: |
      histogram_quantile(0.99, sum by (vendor, transport, le) (rate(oya_foundry_providers_provider_call_latency_ms_bucket[5m])))
  - name: oya:provider:error_rate:rolling_5m
    expr: |
      sum by (vendor) (rate(oya_foundry_providers_provider_invocations_total{status=~"error|429|5.."}[5m])) /
      sum by (vendor) (rate(oya_foundry_providers_provider_invocations_total[5m]))
