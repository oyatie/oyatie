controller:
  image:
    repository: oyatie/foundry-supervisor-controller
    tag: "1.0.0"  # LTS pin
    pullPolicy: IfNotPresent
  replicas: 3  # HA leader-elected
  podDisruptionBudget:
    minAvailable: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  spiffeIdentity: "spiffe://oyatie/foundry-supervisor/operator"
  openbao:
    address: "${OPENBAO_ADDR}"
    signingKeyPath: "secret/foundry-supervisor/operator/ed25519-signing-key"
  postgres:
    host: "${POSTGRES_HOST}"
    credentialsSecretRef: "openbao://secret/foundry-supervisor/postgres-credentials"
  redis:
    cluster_addrs: "${REDIS_CLUSTER_ADDRS}"
    aclTokenSecretRef: "openbao://secret/foundry-supervisor/redis-acl-token"
  leaderElection:
    enabled: true
    leaseName: "foundry-supervisor-controller-leader"
    leaseDuration: 15s
    renewDeadline: 10s

crds:
  install: true  # creates Agent, AgentDeployment, AutonomyPolicy, KillSwitch CRDs

rbac:
  # Operator ClusterRole scoped to foundry-tenant-* namespaces via label selector
  create: true
  namespacePatterns:
    - "foundry-tenant-*"
  forbiddenNamespaces:
    - default
    - kube-system
    - kube-public
    - kube-node-lease

admissionWebhook:
  enabled: true
  certManager:
    enabled: true
    issuer: "foundry-supervisor-ca-issuer"
  # Refuse CRD mutations not from supervisor SA SPIFFE identity
  policy: oya-intelligence-supervisor-admission-webhook
  failurePolicy: Fail  # default-deny on webhook unavailability

opaGatekeeper:
  enabled: true
  constraintTemplate: "OyaFoundrySupervisorAllowedMutator"
  # ClusterRole-level enforcement: no kubectl manual edit to supervisor CRDs

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - foundry-supervisor
    - observability  # supervisor self-SLO emission
    - foundry-evidence  # audit-chain consumer
  egressTo:
    - postgres
    - redis-cluster
    - openbao

resources:
  rest:
    replicas: 3
    image:
      repository: oyatie/foundry-supervisor-rest
      tag: "1.0.0"  # LTS pin
    podDisruptionBudget:
      minAvailable: 2
  worker:
    replicas: 2
    image:
      repository: oyatie/foundry-supervisor-worker
      tag: "1.0.0"  # LTS pin
  app:
    replicas: 2
    image:
      repository: oyatie/foundry-supervisor-app
      tag: "1.0.0"  # LTS pin
