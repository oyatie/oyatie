# Baseline-output + replay-trace store for foundry-eval
# Per ADR-0024 + threat-model T-T-02, T-T-03 + policy/tenant-isolation.md TI-03

pack: kr
region: ap-seoul-1

minio:
  mode: distributed
  replicas: 4

  image: quay.io/chrislusf/seaweedfs:latest

  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  storage:
    size: "500Gi"
    storageClass: oya-block-ssd

  # Object Lock in Compliance mode (per threat-model T-T-02)
  objectLock:
    enabled: true
    mode: Compliance
    retentionDays: 30

  # SSE-KMS with per-pack KMS keyring
  serverSideEncryption:
    enabled: true
    kmsKeyId: "alias/oya-intelligence-eval-kek-kr"

  # Buckets created via post-install Job
  buckets:
    - name: oya-intelligence-eval-baselines-kr
      versioning: enabled
      objectLock: enabled
      lifecyclePolicies:
        - id: archive-cold-after-90d
          status: enabled
          transitions:
            - days: 90
              storageClass: GLACIER
    - name: oya-intelligence-eval-replay-kr
      versioning: enabled
      objectLock: enabled
      lifecyclePolicies:
        - id: archive-cold-after-30d
          status: enabled
          transitions:
            - days: 30
              storageClass: GLACIER
        - id: expire-after-24mo
          status: enabled
          expiration:
            days: 730

  # Network policy
  networkPolicy:
    enabled: true
    ingressAllowedFrom:
      - eval-runner-worker
      - eval-runner-rest
      - replay-engine-worker
      - baseline-output-store-rest

  # OpenBao integration
  secrets:
    openBaoMountPath: "/var/run/secrets/openbao"

  # Pod security
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true

  # Pod anti-affinity (cross-AZ)
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: minio-foundry-eval
        topologyKey: topology.kubernetes.io/zone

# Cosign verifier sidecar (per eval-set load path)
cosignVerifier:
  enabled: true
  # ⚠ VERIFIER VERSION SKEW — cosign v2 CANNOT verify v3-produced signatures.
  # The buildkit signing jobs (infra/ci-webhook-gateway/buildkit-build.yaml,
  # intelligence/k8s/buildkit-build.yaml) now sign with v3.1.2, whose
  # bundle format a v2 client cannot even discover. Proven against a local
  # registry with no egress: v2.4.1 and v2.5.0 both exit 10 "no signatures
  # found" on a v3-signed image; v3.1.2 exits 0.
  # This sidecar verifies the eval-set load path, which was NOT established to
  # overlap those images — so this is annotated rather than bumped. Bumping also
  # needs a decision on rekor handling, which v3 changes. Tracked as
  # F-SEC-COSIGN-VERIFIER-SKEW.
  image: ghcr.io/sigstore/cosign:v2.5.0
  rekorPublicLog: https://rekor.sigstore.dev
  rekorMirror: https://rekor.oyatie.internal  # fallback per threat-model FM-11

# Per-subject DEK envelope helper
dekEnvelope:
  enabled: true
  kmsKeyringAlias: "alias/oya-intelligence-eval-kek-kr"
  rotationPolicy:
    dekRotationDays: 90
    kekRotationDays: 365
