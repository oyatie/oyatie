postgresql:
  image:
    tag: "16.4.0-debian-12-r0"   # Postgres 16.4 LTS pin
  auth:
    existingSecret: "${openbao:secret/foundry-runtime/postgres/creds}"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: app-password
  architecture: replication
  primary:
    persistence:
      enabled: true
      size: 200Gi
      storageClass: oci-bv
    resources:
      requests: { cpu: "2000m", memory: "4Gi" }
      limits:   { cpu: "4000m", memory: "8Gi" }
    configuration: |
      # Row-level security mandatory per policy/runtime-isolation.md TI-03
      # Each tenant-data table declares: ALTER TABLE x ENABLE ROW LEVEL SECURITY
      # See iac/postgres-schema/004-row-level-security-policies.sql
      # Streaming replication for HA
      max_wal_senders = 16
      wal_level = replica
      archive_mode = on
      archive_command = '/opt/oya/oci-archive.sh "%p" "%f"'
      # TDE via pgcrypto + per-pack KMS keyring
      # Performance per capacity-model.md
      shared_buffers = 2GB
      effective_cache_size = 6GB
      max_connections = 200
      log_statement = 'ddl'           # audit-chain captures DDL changes
      log_connections = on
      log_disconnections = on
  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 200Gi
      storageClass: oci-bv
    resources:
      requests: { cpu: "1000m", memory: "2Gi" }
      limits:   { cpu: "2000m", memory: "4Gi" }
  metrics:
    enabled: true   # Prometheus exporter
