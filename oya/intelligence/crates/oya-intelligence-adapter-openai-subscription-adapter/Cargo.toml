[package]
name = "oya-intelligence-adapter-openai-subscription-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_intelligence_adapter_openai_subscription_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-account-domain = { path = "../../../../intelligence/core/account-domain" }
intelligence-account-kernel = { path = "../../../../intelligence/core/account-kernel" }

# Async runtime + HTTP stack (ADR-0090: hyper preferred; ADR-0506: aws-lc-rs).
tokio = { workspace = true, features = ["sync", "time", "net"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

# Serialization + observability.
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[lints]
workspace = true
