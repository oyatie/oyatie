# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=settings-template; layer=kernel (12-layer-enum L1).
#         Justification: pure-kernel value types for foundry settings template lane
#         (v5 delta, M02-P06). Holds SettingsTemplate, SettingsRenderer trait,
#         HookEvent enum, McpServerRef. No I/O. No per-provider serialization.

[package]
name = "oya-intelligence-settings-template-kernel"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_intelligence_settings_template_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-account-kernel = { path = "../../../../intelligence/core/account-kernel" }
intelligence-account-domain = { path = "../../../../intelligence/core/account-domain" }

[lints]
workspace = true
