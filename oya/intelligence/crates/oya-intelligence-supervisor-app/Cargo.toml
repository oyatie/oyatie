# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=supervisor; layer=app (12-layer-enum L5).
#         Justification: daemon binary — composes supervisor-kernel port traits with
#         jsonl-supervisor-adapter I/O seam; exposes hyper webhook endpoint; owns
#         tick_once call chain and max_in_flight enforcement (M02-P06).

[package]
name = "oya-intelligence-supervisor-app"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[[bin]]
name = "oya-intelligence-supervisor"
path = "src/main.rs"

[lib]
name = "oya_intelligence_supervisor_app"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "heartbeat"
path = "benches/heartbeat.rs"
harness = false

[dependencies]
intelligence-supervisor-kernel = { path = "../../../../intelligence/core/supervisor-kernel" }
oya-intelligence-jsonl-supervisor-adapter = { path = "../oya-intelligence-jsonl-supervisor-adapter" }
oya-intelligence-cli-session-driver = { path = "../oya-intelligence-cli-session-driver" }
oya-intelligence-route-policy-kernel = { path = "../oya-intelligence-route-policy-kernel" }
intelligence-account-domain = { path = "../../../../intelligence/core/account-domain" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
intelligence-settings-template-kernel = { version = "0.1.0", path = "../../../../intelligence/core/settings-template-kernel" }
oya-intelligence-settings-template-adapter = { version = "0.1.0", path = "../oya-intelligence-settings-template-adapter" }
oya-intelligence-autonomy-ceiling-domain = { version = "0.1.0", path = "../oya-intelligence-autonomy-ceiling-domain" }
oya-intelligence-supervisor-security-adapter = { version = "0.1.0", path = "../oya-intelligence-supervisor-security-adapter" }
oya-intelligence-account-adapter-inmemory = { version = "0.1.0", path = "../oya-intelligence-account-adapter-inmemory" }

[lints]
workspace = true
