# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=cli-session; layer=driver (SessionDriver adapter).
#         Justification: the single subprocess-spawning SessionDriver adapter. Replaces
#         oya-intelligence-{claude,codex,gemini}-account-adapter, which differed only in the
#         five values now carried by CliDriverSpec.

[package]
name = "oya-intelligence-cli-session-driver"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_intelligence_cli_session_driver"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-supervisor-kernel = { path = "../../../../intelligence/core/supervisor-kernel" }
tokio = { workspace = true, features = ["process"] }
intelligence-account-domain = { version = "0.1.0", path = "../../../../intelligence/core/account-domain" }

[lints]
workspace = true
