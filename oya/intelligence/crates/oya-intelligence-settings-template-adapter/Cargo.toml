# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=settings-template; layer=adapter (12-layer-enum L4).
#         Justification: per-provider settings renderer — filesystem I/O + per-provider
#         format dialects (Claude/Codex/Gemini). PRE-1 rename applied: NOT -fs suffix
#         (ADR-0056 v4.1 BNF conformance; sibling precedent: oya-intelligence-jsonl-supervisor-adapter).
#         Consumes oya-intelligence-settings-template-kernel value types.

[package]
name = "oya-intelligence-settings-template-adapter"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_intelligence_settings_template_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
blake3 = "1.8.5"
libc = "0.2.186"
intelligence-account-domain = { version = "0.1.0", path = "../../../../intelligence/core/account-domain" }
intelligence-account-kernel = { version = "0.1.0", path = "../../../../intelligence/core/account-kernel" }
intelligence-settings-template-kernel = { path = "../../../../intelligence/core/settings-template-kernel" }

[lints]
workspace = true
