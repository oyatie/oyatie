apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-guardrails-shadow-mode-fp-budget
spec:
  service: intelligence
  indicator:
    metadata:
      name: guardrails-shadow-mode-fp-budget
    spec:
      ratioMetric:
        good:
          metricSource:
            query: sum(rate(oya_intelligence_guardrails_shadow_within_budget_total[5m]))
        total:
          metricSource:
            query: sum(rate(oya_intelligence_guardrails_shadow_total[5m]))
  objectives:
    - target: 0.95
