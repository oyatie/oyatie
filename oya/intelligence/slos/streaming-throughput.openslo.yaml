apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-streaming-throughput
  displayName: "intelligence: streaming throughput p99 ≥ 30 tok/s"
  labels:
    microservice: intelligence
    bounded_context: model-routing
    sli_class: throughput
    tier: substrate
    plane: data
    owner_team: axis-intelligence
    pack_scope: all
spec:
  service: intelligence
  description: |
    Streaming token throughput per dispatch. Per capacity-model.md.
  indicator:
    metadata:
      name: intelligence-streaming-throughput
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_streaming_tokens_per_sec_bucket{le="0.0333"}[5m]))
                # bucket inverted: "le=0.0333" means ≤ 1/30 = 33ms per token = ≥ 30 tok/s
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_streaming_tokens_per_sec_count[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling: 99% of streaming dispatches at ≥ 30 tok/s"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
