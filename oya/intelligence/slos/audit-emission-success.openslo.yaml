apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-audit-emission-success
  displayName: "intelligence: audit-tap emission success ≥ 99.99%"
  labels:
    microservice: intelligence
    bounded_context: audit-tap
    sli_class: correctness
    tier: substrate
    plane: control
    owner_team: axis-intelligence + axis-audit-chain
    pack_scope: all
spec:
  service: intelligence
  description: |
    Audit-tap commit success rate. Per ADR-0263 atomicity invariant: dispatch refuses to return
    without an audit-tap commit. SLO ≥ 99.99% to enforce EU AI Act Art. 12 record-keeping.
  indicator:
    metadata:
      name: intelligence-audit-tap-emit
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_audit_tap_emit_total{status="committed"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_audit_tap_emit_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "30d rolling audit-tap emission success ≥ 99.99%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
