# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-guardrails-policy-eval-latency
  displayName: "foundry-guardrails: policy eval latency p99 ≤ 10ms"
  labels:
    microservice: foundry
    bounded_context: guardrails
    sli_class: latency
    tier: internal-substrate
    plane: data
    owner_team: axis-foundry-guardrails + council-policy
    pack_scope: all
spec:
  service: foundry-guardrails
  description: |
    Guardrails policy eval latency p99 SLO. A guardrail policy eval is
    "good" when the OPA/Rego decision returns in ≤ 10ms p99. Inline with
    every capability dispatch — tight latency keeps guardrail overhead
    negligible.
  indicator:
    metadata:
      name: foundry-guardrails-eval-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_guardrails_eval_duration_seconds_bucket{le="0.01"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_guardrails_eval_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 10ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
