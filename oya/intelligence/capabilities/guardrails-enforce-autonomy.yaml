# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-guardrails:enforce-autonomy:v1
name: enforce-autonomy
namespace: foundry-guardrails
display_name: Enforce Autonomy-Tier Ceiling
description: |
  Compute the effective autonomy ceiling for a (principal, capability, pack, subject_class)
  tuple per ADR-0022, evaluate the requested autonomy level against the ceiling, and refuse the
  invocation if the request exceeds the ceiling. The effective ceiling is the minimum of
  four sources: tenant_configured, capability_min_required, vertical_pack_cap,
  subject_class_cap.

owner_team: axis-foundry-guardrails
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/agent-operating-contract.json]
related_artifacts:
  - microservices/intelligence/contracts/openapi/guardrails.yaml
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_level: T1
# T1 = recommend-only; this capability emits the ceiling but cannot itself raise it.

inputs:
  - name: tenant_id_hashed
    type: string
    required: true
  - name: capability_id
    type: string
    required: true
  - name: requested_autonomy_level
    type: enum
    values: [T0, T1, T2, T3, T4]
    required: true
  - name: pack
    type: enum
    values: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
    required: true
  - name: subject_class
    type: enum
    values: [adult, minor, vulnerable, unknown]
    required: false

outputs:
  - name: verdict
    type: enum
    values: [allow, block]
  - name: effective_ceiling
    type: enum
    values: [T0, T1, T2, T3, T4]
  - name: ceiling_source
    type: enum
    values: [tenant_configured, capability_min_required, vertical_pack_cap, subject_class_cap]
  - name: cedar_policy_ids
    type: array
  - name: evaluated_at
    type: timestamp
  - name: audit_chain_id
    type: string

data_classes_touched:
  - INTERNAL_ONLY
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-guardrails.decision.autonomy

cost_profile:
  type: per-evaluation
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - Cedar evaluation (in-process)
    - audit-chain seal

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/enforce-autonomy-baseline.jsonl
  pass_threshold: 1.0    # this is a pure math + cedar check; 100% determinism required
  eval_metric: ceiling-correctness-against-adr-0022-spec
  cadence: per-release

sunset:
  status: none
  notes: ""
