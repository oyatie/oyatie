# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-supervisor:engage-kill-switch:v1
name: engage-kill-switch
namespace: foundry-supervisor
display_name: Engage Kill-Switch
description: |
  Engage the kill-switch on a (tenant | capability | agent | fleet) scope to halt
  agent invocations within p99 ≤ 1 s. Fleet scope requires 2-person rule (two
  distinct Ed25519 signatures from authorising principals).

owner_team: ops-security + axis-foundry-control-plane
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0139, ADR-0131, ADR-0133, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/foundry-supervisor-control-plane.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/runbooks/kill-switch-engage.md
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_level: T3
# T3 = destructive operation (halts production agents); highest autonomy level; explicit DPA entitlement required

inputs:
  - name: scope
    type: enum
    values: [fleet, tenant, capability, agent]
    required: true
  - name: target
    type: string
    required: true
    description: scope-specific identifier
  - name: reason
    type: enum
    values: [cross_tenant_leak, runaway_cost, safety_breach, breach_response, compliance_demand, autonomy_violation, guardrail_violation, fast_burn_breach, manual_override, post_mortem_remediation]
    required: true
  - name: signatures
    type: array
    items: string
    min_length: 1
    max_length: 3
    required: true
    description: Ed25519 signatures; 2 required for fleet scope

outputs:
  - name: engaged_at
    type: timestamp
  - name: kill_switch_state
    type: object
  - name: propagation_latency_ms
    type: number
    description: end-to-end engage latency (must be p99 ≤ 1 s)

data_classes_touched:
  - AUDIT
  - BEHAVIORAL_TENANT_PRODUCT

regulatory_packs_consumed:
  - oya-pack-kr
  - oya-pack-eu
  - oya-pack-us
  - oya-pack-us-healthcare
  - oya-pack-jp
  - oya-pack-sg
  - oya-pack-au
  - oya-pack-in
  - oya-pack-br
  - oya-pack-ae
  - oya-pack-ksa

evidence_topic: oya.foundry.supervisor.kill_switch.engaged
# Audit-chain seals + emits Sev-1 page on fleet/tenant scope.

cost_profile:
  type: per-engage
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Valkey write + CRD update
    - Ed25519 signature verification
    - Audit-chain emission

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/engage-kill-switch-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: latency-p99-≤-1s + correct-scope-fan-out + signature-count-verification
  cadence: per-release + quarterly chaos drill
  reference: ADR-0133 §"Hyperscaler safety-claim parity (AWS Bedrock Guardrails ~2s p99)"

sunset:
  status: none
  notes: ""
