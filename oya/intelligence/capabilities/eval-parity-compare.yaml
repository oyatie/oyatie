# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-eval:parity-compare:v1
name: parity-compare
namespace: foundry-eval
display_name: Compare Two Eval Runs (Parity Delta)
description: |
  Compute per-cohort delta between two eval-runs against the same capability
  + eval-set version; emit ParityVerdict (route_a_wins | route_b_wins | tie |
  indeterminate); when applicable, additionally emit InHouseCutoverEligible
  per ADR-0026. The substrate of A/B routing-preference gating and in-house
  cutover decisioning.

owner_team: axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0024, ADR-0026, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/asyncapi/eval-events.yaml
  - microservices/intelligence/policy/dp-analysis.md

autonomy_level: T2

inputs:
  - name: capability_id
    type: string
    required: true
  - name: run_id_a
    type: uuid
    required: true
  - name: run_id_b
    type: uuid
    required: true
  - name: cohort_filter
    type: array
    item_type: string
    required: false
    default: all
  - name: in_house_eligibility_check
    type: boolean
    required: false
    default: true

outputs:
  - name: parity_report_id
    type: uuid
  - name: verdict
    type: enum
    values: [route_a_wins, route_b_wins, tie, indeterminate]
  - name: cohort_deltas
    type: object
  - name: in_house_cutover_eligible
    type: boolean
  - name: signature
    type: bytes

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-eval.parity.verdict-emitted

cost_profile:
  type: per-parity-comparison
  estimated_cost_usd_per_call: 0.0005
  cost_drivers:
    - ClickHouse cohort-rollup query (per-cohort delta)
    - Postgres eval-set metadata read
    - Audit-chain emission cost (amortized)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/parity-compare-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: parity-verdict-correctness-against-reference-pairs
  cadence: per-release

sunset:
  status: none
  notes: ""
