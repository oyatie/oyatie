# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-evidence:evidence-pack-build:v1
name: evidence-pack-build
namespace: foundry-evidence
display_name: Build + Emit Evidence Pack
description: |
  Aggregate per-invocation signals from foundry-runtime + foundry-eval +
  foundry-guardrails + foundry-supervisor into a structured EvidencePack,
  compute pack hash, and emit to audit-chain substrate for Merkle sealing.
  Per ADR-0131 Foundry split + Bominal ADR-0003 emission contract.

owner_team: axis-foundry-evidence
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0003, ADR-0024, ADR-0028, ADR-0131, ADR-0133]
related_specs:
  - /specs/foundry-evidence.json
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-evidence.yaml
  - microservices/intelligence/contracts/asyncapi/foundry-evidence-events.yaml
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/evidence-pack-integrity.md

autonomy_level: T2
# T2: writes durable state; emits chain event via audit-chain substrate.

inputs:
  - name: invocation_envelope
    type: object
    schema_ref: oya-intelligence-evidence-capability-invocation-recorder-domain::InvocationEnvelope
    required: true
  - name: spiffe_principal
    type: string
    required: true
    description: SPIFFE-bound foundry-runtime / foundry-guardrails / foundry-supervisor / foundry-eval identity
  - name: late_signal_grace_window_seconds
    type: integer
    required: false
    default: 60
    description: how long pack-builder waits for late-arriving signals before sealing partial

outputs:
  - name: pack_id
    type: string
    format: ulid
  - name: audit_event_id
    type: string
    format: ulid
    nullable: true
    description: present once audit-chain has emitted; null when audit-chain bridge is in backlog
  - name: sealed_at
    type: timestamp
    nullable: true
  - name: partial
    type: boolean
    description: true if assembly window expired before all signals arrived
  - name: missing_sources
    type: array
    items: {type: string}

data_classes_touched:
  - INTERNAL_ONLY
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_PIPA_ART23
  - PHI
  - AUDIT
  - SECRET
  # foundry-evidence handles the full range; payload classes are carried, not interpreted, by this capability.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry_evidence.pack.assembled

cost_profile:
  type: per-pack
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Postgres INSERT (≤ 2 ms)
    - Signal aggregation (≤ 100 ms; bounded by late_signal_grace_window)
    - audit-chain bridge emit (≤ 100 ms p99 per Bominal ADR-0028)
    - Cedar evaluation (≤ 5 ms)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar
  - microservices/intelligence/policy/evidence-pack-integrity.md  # narrative companion

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/evidence-pack-build-baseline.jsonl
  pass_threshold: 0.999
  eval_metric: pack-fidelity-against-reference-signals
  cadence: per-release
  reference: ADR-0024 + ADR-0028 + /specs/foundry-evidence.json reference vectors

sunset:
  status: none
  notes: ""
