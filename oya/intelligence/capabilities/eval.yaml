# Canonical-base: specs/capabilities/canonical-tier-schema.json
id: cap:intelligence:eval:v1
name: eval
namespace: intelligence
display_name: Eval (canonicalen-set + online A/B)
description: |
  Score dispatch output against a canonicalen-set + run online A/B between provider/model variants.
  Per-call eval is sampled; eval-worker runs offline batch eval per release.

owner_team: axis-intelligence
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0255]

autonomy_tier: T1
eu_ai_act_risk_class: minimal

inputs:
  - name: dispatch_outcome
    type: object
    required: true

outputs:
  - name: eval_record
    type: object
    schema: EvalRecord

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - all packs

evidence_topic: intelligence/eval.recorded

cost_profile:
  type: per-evaluation
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - judge-model inference
    - canonicalen-set lookup

cedar_policy_fragments:
  - microservices/intelligence/policy/dispatch-authorization.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/eval-meta-canonicalen.jsonl
  pass_threshold: 0.90
  eval_metric: judge-vs-reference-correlation
  cadence: per-release

sunset:
  status: none
