# Canonical-base: specs/capabilities/canonical-tier-schema.json
id: cap:intelligence:audit-tap:v1
name: audit-tap
namespace: intelligence
display_name: Audit-tap (per-call sealed audit record)
description: |
  Emit per-call audit record (Ed25519-signed; SPIFFE-bound) onto the audit-chain seal stream
  per ADR-0263. Atomicity: dispatch refuses to return without an audit-tap commit.

owner_team: axis-intelligence + axis-audit-chain
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0263, ADR-0255]

autonomy_tier: T2
eu_ai_act_risk_class: minimal

inputs:
  - name: audit_tap_record
    type: object
    required: true

outputs:
  - name: audit_chain_seal_id
    type: string

data_classes_touched:
  - AUDIT

regulatory_packs_consumed:
  - all packs

evidence_topic: intelligence/audit-tap.committed

cost_profile:
  type: per-commit
  estimated_cost_usd_per_call: 0.00005
  cost_drivers:
    - Ed25519 signing
    - audit-chain RPC

cedar_policy_fragments:
  - microservices/intelligence/policy/auditor-scope.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/audit-tap-roundtrip.jsonl
  pass_threshold: 1.0
  eval_metric: roundtrip-verifies-signature
  cadence: per-release + per-commit

sunset:
  status: none
