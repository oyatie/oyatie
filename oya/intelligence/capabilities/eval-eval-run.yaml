# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-eval:eval-run:v1
name: eval-run
namespace: foundry-eval
display_name: Run Capability Eval Set
description: |
  Execute a per-capability eval set against a candidate provider route; emit
  per-cohort pass/fail aggregate; signal eligibility verdict to foundry-runtime
  publish-gate. The substrate of publish-time gating per ADR-0024.

owner_team: axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0024, ADR-0026, ADR-0139, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/eval-runner.yaml
  - microservices/intelligence/contracts/asyncapi/eval-events.yaml
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/synthetic-phi-only.md

autonomy_level: T2
# T2 = read-only sensitive data + write to ledger; not destructive.
# Per ADR-0022 autonomy tiers.

inputs:
  - name: capability_id
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: version
    type: string
    pattern: '^v\\d+(\\.\\d+)?$'
    required: true
  - name: route
    type: object
    schema: ProviderRoute (per openapi/eval-runner.yaml)
    required: true
  - name: cohorts
    type: array
    item_type: enum
    values: [happy-path, adversarial-prompt-injection, adversarial-data-class, adversarial-autonomy-bypass, adversarial-tool-exfil, linguistic-kr, linguistic-jp, linguistic-en, deterministic-seed, replay]
    required: false
    default: all

outputs:
  - name: run_id
    type: uuid
  - name: aggregate
    type: object
    schema: EvalAggregate
  - name: passed
    type: boolean
  - name: eu_ai_act_section_15_accuracy_metric
    type: float
  - name: eu_ai_act_section_17_logging_payload_ref
    type: string
  - name: signature
    type: bytes

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # per-case inputs may carry tenant-derived behaviour;
  # PII / PHI never present (synthetic-PHI-only policy at eval-set authoring;
  # source-µservice redactor + per-subject DEK at replay-trace ingest)
  - AUDIT
  # every run emission is itself an audit event

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-eval.eval-run.completed
# Emits to audit-chain via foundry-evidence per Bominal ADR-0028.

cost_profile:
  type: per-eval-case
  estimated_cost_usd_per_case: 0.002
  cost_drivers:
    - Provider model API token cost (eval-time invocation)
    - GPU pool compute (case dispatch overhead)
    - S3 + ClickHouse write (aggregate persistence)
    - Cosign verify on baseline read (per-case)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/eval-run-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: aggregate-correctness-against-reference-eval-runs
  cadence: per-release
  reference: ADR-0024 §"Publish-time eval gate"

sunset:
  status: none
  notes: ""
