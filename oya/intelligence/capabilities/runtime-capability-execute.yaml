# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-runtime:capability-execute:v1
name: capability-execute
namespace: foundry-runtime
display_name: Execute Capability Invocation
description: |
  Accept a (tenant, capability_id, input, session_id?) tuple; check AutonomyGate against the
  principal's tenant autonomy ceiling; resolve the descriptor from the local registry mirror;
  dispatch through foundry-guardrails (pre-flight safety) → foundry-providers (LLM call) →
  foundry-guardrails (output safety) → session-state persistence → foundry-evidence emission;
  return the invocation lifecycle record.

  This is the headline capability of the foundry-runtime µservice; it is invoked by
  workflow-engine, ops-portal, and tenant SDKs.

owner_team: axis-foundry-runtime
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0024, ADR-0025, ADR-0139, ADR-0131]
related_specs: [/specs/agent-operating-contract.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-runtime.yaml
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/runtime-isolation.md

autonomy_level: T2
# T2 = read-only sensitive data + write to ledger; the runtime itself is T2; capabilities
# it executes carry their own tier per descriptor. Per ADR-0022.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: capability_id
    type: string
    pattern: '^[a-z][a-z0-9:-]*$'
    required: true
  - name: input
    type: object
    required: true
  - name: session_id
    type: string
    required: false
    pattern: '^[0-9A-Z]{26}$'
  - name: autonomy_level_declared
    type: integer
    minimum: 0
    maximum: 4
    required: true
  - name: timeout_seconds
    type: integer
    minimum: 1
    maximum: 300
    default: 60
  - name: idempotency_key
    type: string
    maxLength: 128
    required: false

outputs:
  - name: invocation_id
    type: string
  - name: status
    type: enum
    values: [pending, running, completed, failed, cancelled]
  - name: result
    type: object
  - name: failure_reason
    type: enum
    values: [provider_unreachable, guardrail_block, autonomy_violation, timeout, runtime_drain_lost, descriptor_invalid, internal_error]
  - name: total_duration_ms
    type: integer
  - name: signature
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING       # when input contains user identifiers
  - PII_QUASI_IDENTIFIER
  - AUDIT
  - SENSITIVE_PIPA_ART23  # hashed tenant id

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-runtime.invocation
# Emits to foundry-evidence audit-chain stream per Bominal ADR-0028.

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0005  # runtime overhead only; LLM call cost owned by foundry-providers
  cost_drivers:
    - capability-registry-cache lookup (in-memory; negligible)
    - autonomy gate check (in-memory; negligible)
    - session-state hot read (Valkey; small)
    - sibling mTLS calls (1× providers + 2× guardrails + 1× evidence)
    - lifecycle record write (Postgres)
    - audit-chain seal (foundry-evidence)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/capability-execute-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: dispatch-latency-p99-≤50ms AND autonomy-refusal-correctness AND guardrail-block-correctness
  cadence: per-release
  reference: |
    AWS Bedrock Agent runtime + GCP Vertex AI Agent Builder benchmarks; competitor parity matrix
    in microservices/intelligence/competitor-parity-matrix.md.

sunset:
  status: none
  notes: ""
