asyncapi: 3.1.0
info:
  title: oya-intelligence-evidence — Workflow events
  version: 1.0.0
  summary: |
    Inbound subscriptions from foundry-runtime / foundry-eval / foundry-guardrails /
    foundry-supervisor; outbound emissions for assembled/failed packs and
    regulator-export lifecycle.
  description: |
    Per ADR-0024 (eval-evidence integration), ADR-0028 (audit-chain), ADR-0131
    (Foundry split). All inbound events SPIFFE-signed by publishing µservice.
  contact:
    name: axis-foundry-evidence

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.foundry-evidence.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus

channels:
  # Inbound
  foundry-runtime-invocation-completed:
    address: workflow-events/foundry.runtime.invocation.completed
    messages:
      InvocationCompletedMessage: {$ref: '#/components/messages/InvocationCompleted'}
    description: foundry-runtime announces a capability invocation completed.

  foundry-eval-verdict-published:
    address: workflow-events/foundry.eval.verdict.published
    messages:
      EvalVerdictPublishedMessage: {$ref: '#/components/messages/EvalVerdictPublished'}
    description: foundry-eval publishes a new verdict for an eval-set.

  foundry-guardrails-decision-emitted:
    address: workflow-events/foundry.guardrails.decision.emitted
    messages:
      GuardrailDecisionEmittedMessage: {$ref: '#/components/messages/GuardrailDecisionEmitted'}
    description: foundry-guardrails emits a per-decision event.

  foundry-supervisor-autonomy-decided:
    address: workflow-events/foundry.supervisor.autonomy.decided
    messages:
      AutonomyLevelDecidedMessage: {$ref: '#/components/messages/AutonomyLevelDecided'}
    description: foundry-supervisor announces an autonomy-ceiling decision.

  # Outbound
  foundry-evidence-pack-assembled:
    address: workflow-events/foundry.evidence.pack.assembled
    messages:
      PackAssembledMessage: {$ref: '#/components/messages/PackAssembled'}
    description: foundry-evidence assembled and emitted a pack to audit-chain.

  foundry-evidence-pack-assembly-failed:
    address: workflow-events/foundry.evidence.pack.assembly_failed
    messages:
      PackAssemblyFailedMessage: {$ref: '#/components/messages/PackAssemblyFailed'}
    description: pack assembly failed permanently (after retry budget exhausted).

  foundry-evidence-pack-superseded:
    address: workflow-events/foundry.evidence.pack.superseded
    messages:
      PackSupersededMessage: {$ref: '#/components/messages/PackSuperseded'}
    description: a pack was superseded via the rebuild runbook.

  foundry-evidence-regulator-export-requested:
    address: workflow-events/foundry.evidence.regulator_export.requested
    messages:
      RegulatorExportRequestedMessage: {$ref: '#/components/messages/RegulatorExportRequested'}
    description: a regulator-export request was accepted.

  foundry-evidence-regulator-export-completed:
    address: workflow-events/foundry.evidence.regulator_export.completed
    messages:
      RegulatorExportCompletedMessage: {$ref: '#/components/messages/RegulatorExportCompleted'}
    description: a regulator-export bundle was sealed + delivered.

  foundry-evidence-regulator-export-reissued:
    address: workflow-events/foundry.evidence.regulator_export.reissued
    messages:
      RegulatorExportReissuedMessage: {$ref: '#/components/messages/RegulatorExportReissued'}
    description: a previously-issued bundle was reissued (links via supersedes_bundle_id).

  foundry-evidence-late-signal:
    address: workflow-events/foundry.evidence.late_signal
    messages:
      LateSignalMessage: {$ref: '#/components/messages/LateSignal'}
    description: a signal arrived after pack assembly; honesty surface per EPI-02.

operations:
  receiveInvocationCompleted: {action: receive, channel: {$ref: '#/channels/foundry-runtime-invocation-completed'}}
  receiveEvalVerdictPublished: {action: receive, channel: {$ref: '#/channels/foundry-eval-verdict-published'}}
  receiveGuardrailDecisionEmitted: {action: receive, channel: {$ref: '#/channels/foundry-guardrails-decision-emitted'}}
  receiveAutonomyLevelDecided: {action: receive, channel: {$ref: '#/channels/foundry-supervisor-autonomy-decided'}}
  sendPackAssembled: {action: send, channel: {$ref: '#/channels/foundry-evidence-pack-assembled'}}
  sendPackAssemblyFailed: {action: send, channel: {$ref: '#/channels/foundry-evidence-pack-assembly-failed'}}
  sendPackSuperseded: {action: send, channel: {$ref: '#/channels/foundry-evidence-pack-superseded'}}
  sendRegulatorExportRequested: {action: send, channel: {$ref: '#/channels/foundry-evidence-regulator-export-requested'}}
  sendRegulatorExportCompleted: {action: send, channel: {$ref: '#/channels/foundry-evidence-regulator-export-completed'}}
  sendRegulatorExportReissued: {action: send, channel: {$ref: '#/channels/foundry-evidence-regulator-export-reissued'}}
  sendLateSignal: {action: send, channel: {$ref: '#/channels/foundry-evidence-late-signal'}}

components:
  messages:
    InvocationCompleted: {name: InvocationCompleted, payload: {$ref: '#/components/schemas/InvocationCompletedPayload'}}
    EvalVerdictPublished: {name: EvalVerdictPublished, payload: {$ref: '#/components/schemas/EvalVerdictPublishedPayload'}}
    GuardrailDecisionEmitted: {name: GuardrailDecisionEmitted, payload: {$ref: '#/components/schemas/GuardrailDecisionEmittedPayload'}}
    AutonomyLevelDecided: {name: AutonomyLevelDecided, payload: {$ref: '#/components/schemas/AutonomyLevelDecidedPayload'}}
    PackAssembled: {name: PackAssembled, payload: {$ref: '#/components/schemas/PackAssembledPayload'}}
    PackAssemblyFailed: {name: PackAssemblyFailed, payload: {$ref: '#/components/schemas/PackAssemblyFailedPayload'}}
    PackSuperseded: {name: PackSuperseded, payload: {$ref: '#/components/schemas/PackSupersededPayload'}}
    RegulatorExportRequested: {name: RegulatorExportRequested, payload: {$ref: '#/components/schemas/RegulatorExportRequestedPayload'}}
    RegulatorExportCompleted: {name: RegulatorExportCompleted, payload: {$ref: '#/components/schemas/RegulatorExportCompletedPayload'}}
    RegulatorExportReissued: {name: RegulatorExportReissued, payload: {$ref: '#/components/schemas/RegulatorExportReissuedPayload'}}
    LateSignal: {name: LateSignal, payload: {$ref: '#/components/schemas/LateSignalPayload'}}

  schemas:
    InvocationCompletedPayload:
      type: object
      required: [invocation_id, attempt_no, tenant_id, source_microservice, completed_at, prompt_payload_sha, output_payload_sha, pack]
      properties:
        schema_version: {type: string, enum: ['1.0']}
        invocation_id: {type: string, format: ulid}
        attempt_no: {type: integer}
        tenant_id: {type: string}
        source_microservice: {type: string, enum: [foundry-runtime]}
        completed_at: {type: string, format: date-time}
        prompt_payload_sha: {type: string}
        output_payload_sha: {type: string}
        model_version: {type: string, nullable: true}
        provider: {type: string, nullable: true}
        agent_id: {type: string}
        capability_id: {type: string}
        pack: {type: string}
        request_token_count: {type: integer, nullable: true}
        response_token_count: {type: integer, nullable: true}
        publisher_spiffe_signature: {type: string}

    EvalVerdictPublishedPayload:
      type: object
      required: [eval_set_id, verdict, recorded_at, applicable_to_invocation_id, source_microservice]
      properties:
        schema_version: {type: string}
        eval_set_id: {type: string}
        verdict: {type: string, enum: [pass, fail, advisory]}
        verdict_score: {type: number, nullable: true}
        recorded_at: {type: string, format: date-time}
        applicable_to_invocation_id: {type: string, format: ulid}
        source_microservice: {type: string, enum: [foundry-eval]}
        publisher_spiffe_signature: {type: string}

    GuardrailDecisionEmittedPayload:
      type: object
      required: [invocation_id, guardrail_id, guardrail_version, decision, rationale_hash, decided_at, source_microservice]
      properties:
        schema_version: {type: string}
        invocation_id: {type: string, format: ulid}
        guardrail_id: {type: string}
        guardrail_version: {type: string}
        decision: {type: string, enum: [allow, block, escalate]}
        rationale_hash: {type: string}
        decided_at: {type: string, format: date-time}
        source_microservice: {type: string, enum: [foundry-guardrails]}
        publisher_spiffe_signature: {type: string}

    AutonomyLevelDecidedPayload:
      type: object
      required: [invocation_id, autonomy_level_decision, rationale_hash, decided_at, source_microservice]
      properties:
        schema_version: {type: string}
        invocation_id: {type: string, format: ulid}
        autonomy_level_decision: {type: string, enum: [T0, T1, T2, T3]}
        rationale_hash: {type: string}
        decided_at: {type: string, format: date-time}
        source_microservice: {type: string, enum: [foundry-supervisor]}
        publisher_spiffe_signature: {type: string}

    PackAssembledPayload:
      type: object
      required: [pack_id, invocation_id, tenant_id, audit_event_id, sealed_at, pack, partial, schema_version]
      properties:
        schema_version: {type: string}
        pack_id: {type: string, format: ulid}
        invocation_id: {type: string, format: ulid}
        tenant_id: {type: string}
        pack: {type: string}
        audit_event_id: {type: string, format: ulid}
        sealed_at: {type: string, format: date-time}
        partial: {type: boolean}
        missing_sources: {type: array, items: {type: string}}
        framework_tags: {type: array, items: {type: string}}

    PackAssemblyFailedPayload:
      type: object
      required: [invocation_id, tenant_id, pack, reason, failed_at]
      properties:
        invocation_id: {type: string, format: ulid}
        tenant_id: {type: string}
        pack: {type: string}
        reason: {type: string, enum: [substrate_persistent_unavailable, schema_drift, builder_crash, dead_letter_exhausted]}
        failed_at: {type: string, format: date-time}
        diagnostic_ref: {type: string, nullable: true}

    PackSupersededPayload:
      type: object
      required: [original_pack_id, new_pack_id, superseded_at, justification_hash, requester_principal, approver_principal]
      properties:
        original_pack_id: {type: string, format: ulid}
        new_pack_id: {type: string, format: ulid}
        superseded_at: {type: string, format: date-time}
        justification_hash: {type: string}
        requester_principal: {type: string}
        approver_principal: {type: string}

    RegulatorExportRequestedPayload:
      type: object
      required: [bundle_id, tenant_id, framework, time_range_start, time_range_end, requester_principal, approver_principal, requested_at]
      properties:
        bundle_id: {type: string, format: ulid}
        tenant_id: {type: string}
        framework: {type: string}
        time_range_start: {type: string, format: date-time}
        time_range_end: {type: string, format: date-time}
        requester_principal: {type: string}
        approver_principal: {type: string}
        requested_at: {type: string, format: date-time}
        receiving_bucket_scc_id: {type: string}
        dpa_export_plan_id: {type: string}

    RegulatorExportCompletedPayload:
      type: object
      required: [bundle_id, sealed_at, pack_count, bundle_signature, bundle_merkle_root]
      properties:
        bundle_id: {type: string, format: ulid}
        sealed_at: {type: string, format: date-time}
        pack_count: {type: integer}
        bundle_signature: {type: string}
        bundle_merkle_root: {type: string}
        delivered_at: {type: string, format: date-time, nullable: true}

    RegulatorExportReissuedPayload:
      type: object
      required: [original_bundle_id, reissue_bundle_id, reissued_at, justification_hash, requester_principal, approver_principal]
      properties:
        original_bundle_id: {type: string, format: ulid}
        reissue_bundle_id: {type: string, format: ulid}
        reissued_at: {type: string, format: date-time}
        justification_hash: {type: string}
        requester_principal: {type: string}
        approver_principal: {type: string}

    LateSignalPayload:
      type: object
      required: [pack_id, invocation_id, source_microservice, signal_class, lateness_seconds, observed_at]
      properties:
        pack_id: {type: string, format: ulid}
        invocation_id: {type: string, format: ulid}
        source_microservice: {type: string}
        signal_class: {type: string, enum: [eval-verdict, guardrail-decision, autonomy-ceiling, invocation-completed]}
        lateness_seconds: {type: number}
        observed_at: {type: string, format: date-time}
        materially_significant: {type: boolean}
        superseded_by_late_signal_ref: {type: string, format: ulid, nullable: true}
