asyncapi: 3.1.0
info:
  title: oya-intelligence-supervisor — supervision events
  version: 1.0.0
  summary: Capability deployment, kill-switch, autonomy violation, fleet lifecycle events emitted by the foundry-supervisor control plane
  description: |
    Cross-µservice Workflow events emitted by the foundry-supervisor worker + controller.
    Per `/specs/foundry-supervisor-control-plane.json` §`events`.

    Consumers:
    - `foundry-evidence` (Ed25519 + Merkle seal per Bominal ADR-0028)
    - `observability` (SLO observation + dashboards)
    - `grafana-oncall` (paging on KillSwitchEngaged / AutonomyViolated / DeploymentRolledBack)
    - `application` (workflow-studio UI surface)
    - `foundry-runtime` (kill-switch propagation; consumes KillSwitchEngaged + KillSwitchDisengaged)
  contact:
    name: axis-foundry-control-plane

defaultContentType: application/json

servers:
  redis-streams:
    host: redis-cluster.foundry-supervisor.svc.cluster.local
    protocol: redis
    description: Valkey Streams (Redis wire-compat) substrate; per-tenant scoped consumer groups
  workflow-events-bus:
    host: workflow-events.foundry-supervisor.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus for evidence + observability + application consumers

channels:
  capability-deployed:
    address: workflow-events/supervisor.capability.deployed
    messages:
      CapabilityDeployedMessage:
        $ref: '#/components/messages/CapabilityDeployed'
    description: A capability rollout phase advanced (1 %, 10 %, 50 %, 100 %).

  kill-switch-engaged:
    address: workflow-events/supervisor.kill_switch.engaged
    messages:
      KillSwitchEngagedMessage:
        $ref: '#/components/messages/KillSwitchEngaged'
    description: Kill-switch engaged on a (scope, target) pair.

  kill-switch-disengaged:
    address: workflow-events/supervisor.kill_switch.disengaged
    messages:
      KillSwitchDisengagedMessage:
        $ref: '#/components/messages/KillSwitchDisengaged'
    description: Kill-switch released on a (scope, target) pair.

  autonomy-violated:
    address: workflow-events/supervisor.autonomy.violated
    messages:
      AutonomyViolatedMessage:
        $ref: '#/components/messages/AutonomyViolated'
    description: Runtime invocation refused by autonomy precondition.

  fleet-drained:
    address: workflow-events/supervisor.fleet.drained
    messages:
      FleetDrainedMessage:
        $ref: '#/components/messages/FleetDrained'

  agent-evicted:
    address: workflow-events/supervisor.agent.evicted
    messages:
      AgentEvictedMessage:
        $ref: '#/components/messages/AgentEvicted'

  deployment-rolled-back:
    address: workflow-events/supervisor.deployment.rolled_back
    messages:
      DeploymentRolledBackMessage:
        $ref: '#/components/messages/DeploymentRolledBack'

operations:
  emitCapabilityDeployed:
    action: send
    channel: {$ref: '#/channels/capability-deployed'}
  emitKillSwitchEngaged:
    action: send
    channel: {$ref: '#/channels/kill-switch-engaged'}
  emitKillSwitchDisengaged:
    action: send
    channel: {$ref: '#/channels/kill-switch-disengaged'}
  emitAutonomyViolated:
    action: send
    channel: {$ref: '#/channels/autonomy-violated'}
  emitFleetDrained:
    action: send
    channel: {$ref: '#/channels/fleet-drained'}
  emitAgentEvicted:
    action: send
    channel: {$ref: '#/channels/agent-evicted'}
  emitDeploymentRolledBack:
    action: send
    channel: {$ref: '#/channels/deployment-rolled-back'}

components:
  messages:
    CapabilityDeployed:
      name: CapabilityDeployed
      contentType: application/json
      summary: Rollout phase advanced
      payload: {$ref: '#/components/schemas/CapabilityDeployedPayload'}

    KillSwitchEngaged:
      name: KillSwitchEngaged
      contentType: application/json
      summary: Kill-switch engaged
      payload: {$ref: '#/components/schemas/KillSwitchEngagedPayload'}

    KillSwitchDisengaged:
      name: KillSwitchDisengaged
      contentType: application/json
      summary: Kill-switch released
      payload: {$ref: '#/components/schemas/KillSwitchDisengagedPayload'}

    AutonomyViolated:
      name: AutonomyViolated
      contentType: application/json
      summary: Invocation refused by autonomy precondition
      payload: {$ref: '#/components/schemas/AutonomyViolatedPayload'}

    FleetDrained:
      name: FleetDrained
      contentType: application/json
      summary: Tenant fleet drained
      payload: {$ref: '#/components/schemas/FleetDrainedPayload'}

    AgentEvicted:
      name: AgentEvicted
      contentType: application/json
      summary: Agent worker evicted
      payload: {$ref: '#/components/schemas/AgentEvictedPayload'}

    DeploymentRolledBack:
      name: DeploymentRolledBack
      contentType: application/json
      summary: Deployment rolled back to prior version
      payload: {$ref: '#/components/schemas/DeploymentRolledBackPayload'}

  schemas:
    CapabilityDeployedPayload:
      type: object
      required: [deployment_id, capability_id, tenant, version, rollout_phase, evaluated_at, signature]
      properties:
        deployment_id: {type: string, format: ulid}
        capability_id: {type: string}
        tenant: {type: string, pattern: '^tenant_[a-f0-9]{16}$'}
        version: {type: string}
        prior_version: {type: string, nullable: true}
        rollout_phase: {type: string, enum: [admitted, canary-1pct, canary-10pct, canary-50pct, rolled-out, rolled-back]}
        observability_verdict: {type: string, enum: [eligible, held, rejected, rollback]}
        evaluated_at: {type: string, format: date-time}
        evaluator_version: {type: string}
        signature: {type: string, description: Ed25519 signature by supervisor controller SPIFFE identity}

    KillSwitchEngagedPayload:
      type: object
      required: [scope, target, reason, engaged_at, engaged_by, signatures]
      properties:
        scope: {type: string, enum: [fleet, tenant, capability, agent]}
        target: {type: string}
        reason: {type: string, enum: [cross_tenant_leak, runaway_cost, safety_breach, breach_response, compliance_demand, autonomy_violation, guardrail_violation, fast_burn_breach, manual_override, post_mortem_remediation]}
        engaged_at: {type: string, format: date-time}
        engaged_by: {type: string, description: principal SPIFFE identity or operator email}
        signatures:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string}
          description: Ed25519 signatures (2 for fleet scope, else 1)
        trigger_event_id: {type: string, nullable: true, description: ULID of the originating event}

    KillSwitchDisengagedPayload:
      type: object
      required: [scope, target, reason, disengaged_at, disengaged_by, signatures]
      properties:
        scope: {type: string, enum: [fleet, tenant, capability, agent]}
        target: {type: string}
        reason: {type: string}
        disengaged_at: {type: string, format: date-time}
        disengaged_by: {type: string}
        signatures:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string}

    AutonomyViolatedPayload:
      type: object
      required: [tenant, capability, requested_autonomy_level, allowed_autonomy_level, cedar_reason, refused_at, signature]
      properties:
        tenant: {type: string}
        capability: {type: string}
        requested_autonomy_level: {type: string, enum: [T0, T1, T2, T3]}
        allowed_autonomy_level: {type: string, enum: [T0, T1, T2, T3]}
        cedar_reason: {type: string}
        request_id: {type: string}
        refused_at: {type: string, format: date-time}
        signature: {type: string}

    FleetDrainedPayload:
      type: object
      required: [tenant, drained_count, grace_period_seconds, completed_at, signature]
      properties:
        tenant: {type: string}
        drained_count: {type: integer}
        grace_period_seconds: {type: integer}
        completed_at: {type: string, format: date-time}
        reason: {type: string}
        signature: {type: string}

    AgentEvictedPayload:
      type: object
      required: [agent_id, tenant, capability, reason, evicted_at, signature]
      properties:
        agent_id: {type: string, format: uuid}
        tenant: {type: string}
        capability: {type: string}
        reason: {type: string, enum: [health_check_failure, autonomy_violation, drain_completion, force_drain, kill_switch_engage]}
        evicted_at: {type: string, format: date-time}
        signature: {type: string}

    DeploymentRolledBackPayload:
      type: object
      required: [deployment_id, capability_id, tenant, from_version, to_version, reason, executed_at, signature]
      properties:
        deployment_id: {type: string, format: ulid}
        capability_id: {type: string}
        tenant: {type: string}
        from_version: {type: string}
        to_version: {type: string}
        reason: {type: string, enum: [fast_burn_breach, slow_burn_breach, manual_override, eval_regression, guardrail_violation, post_mortem_remediation]}
        executed_at: {type: string, format: date-time}
        signature: {type: string}
