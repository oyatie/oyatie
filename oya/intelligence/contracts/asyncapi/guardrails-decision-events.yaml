asyncapi: 3.1.0
info:
  title: oya-intelligence-guardrails — decision events
  version: 1.0.0
  summary: GuardrailDecisionEmitted, JailbreakDetected, AutonomyLevelViolation, ContentSafetyRuleFired, RuleStoreMutated, ClassifierModelDeployed, FalsePositiveEscalated events
  description: |
    Cross-µservice Workflow events emitted by foundry-guardrails BCs.
    Per ADR-0131 + ADR-0140 (retired per ADR-0145).

    Consumers:
    - foundry-evidence (decision history persistence; per its own retention policy)
    - audit-chain (Ed25519 seal of every event per Bominal ADR-0028)
    - observability (Mimir metric emission; SLO + burn-rate)
    - grafana-oncall (Sev-1 page on JailbreakDetected + AutonomyLevelViolation)
    - foundry-supervisor (autonomy-ceiling-violation consumer; rule mutation watcher)
    - governance (rule-mutation audit + multispectrum evidence link)
  contact:
    name: axis-foundry-guardrails

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.foundry-guardrails.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus

channels:
  guardrail-decision-emitted:
    address: workflow-events/foundry-guardrails.decision.emitted
    messages:
      GuardrailDecisionEmittedMessage:
        $ref: '#/components/messages/GuardrailDecisionEmitted'
    description: Every allow / block / redact verdict emitted by any BC.

  jailbreak-detected:
    address: workflow-events/foundry-guardrails.jailbreak.detected
    messages:
      JailbreakDetectedMessage:
        $ref: '#/components/messages/JailbreakDetected'
    description: Ensemble verdict ≥ block threshold for jailbreak category.

  autonomy-ceiling-violation:
    address: workflow-events/foundry-guardrails.autonomy.violation
    messages:
      AutonomyLevelViolationMessage:
        $ref: '#/components/messages/AutonomyLevelViolation'
    description: Effective-ceiling refusal.

  content-safety-rule-fired:
    address: workflow-events/foundry-guardrails.content_safety.rule_fired
    messages:
      ContentSafetyRuleFiredMessage:
        $ref: '#/components/messages/ContentSafetyRuleFired'
    description: Rule match above threshold.

  rule-store-mutated:
    address: workflow-events/foundry-guardrails.rule_store.mutated
    messages:
      RuleStoreMutatedMessage:
        $ref: '#/components/messages/RuleStoreMutated'
    description: Rule definition created / modified / sunsetted.

  classifier-model-deployed:
    address: workflow-events/foundry-guardrails.classifier_model.deployed
    messages:
      ClassifierModelDeployedMessage:
        $ref: '#/components/messages/ClassifierModelDeployed'
    description: New classifier-model rolled out (shadow → enforce).

  false-positive-escalated:
    address: workflow-events/foundry-guardrails.false_positive.escalated
    messages:
      FalsePositiveEscalatedMessage:
        $ref: '#/components/messages/FalsePositiveEscalated'
    description: Tenant operator marks a block as false-positive.

operations:
  emitDecision:
    action: send
    channel: {$ref: '#/channels/guardrail-decision-emitted'}
  emitJailbreak:
    action: send
    channel: {$ref: '#/channels/jailbreak-detected'}
  emitAutonomyViolation:
    action: send
    channel: {$ref: '#/channels/autonomy-ceiling-violation'}
  emitContentSafetyFired:
    action: send
    channel: {$ref: '#/channels/content-safety-rule-fired'}
  emitRuleMutation:
    action: send
    channel: {$ref: '#/channels/rule-store-mutated'}
  emitClassifierModelDeployed:
    action: send
    channel: {$ref: '#/channels/classifier-model-deployed'}
  emitFalsePositive:
    action: send
    channel: {$ref: '#/channels/false-positive-escalated'}

components:
  messages:
    GuardrailDecisionEmitted:
      name: GuardrailDecisionEmitted
      contentType: application/json
      summary: Decision verdict emitted by any BC
      payload: {$ref: '#/components/schemas/DecisionPayload'}
    JailbreakDetected:
      name: JailbreakDetected
      contentType: application/json
      payload: {$ref: '#/components/schemas/JailbreakPayload'}
    AutonomyLevelViolation:
      name: AutonomyLevelViolation
      contentType: application/json
      payload: {$ref: '#/components/schemas/AutonomyViolationPayload'}
    ContentSafetyRuleFired:
      name: ContentSafetyRuleFired
      contentType: application/json
      payload: {$ref: '#/components/schemas/RuleFiredPayload'}
    RuleStoreMutated:
      name: RuleStoreMutated
      contentType: application/json
      payload: {$ref: '#/components/schemas/RuleMutationPayload'}
    ClassifierModelDeployed:
      name: ClassifierModelDeployed
      contentType: application/json
      payload: {$ref: '#/components/schemas/ClassifierDeployedPayload'}
    FalsePositiveEscalated:
      name: FalsePositiveEscalated
      contentType: application/json
      payload: {$ref: '#/components/schemas/FpEscalatedPayload'}

  schemas:
    DecisionPayload:
      type: object
      required: [decision_id, invocation_id, tenant_id_hashed, decision_kind, verdict, evaluated_at, signature]
      properties:
        decision_id: {type: string, description: ULID}
        invocation_id: {type: string}
        tenant_id_hashed: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        decision_kind: {type: string, enum: [classify, validate, autonomy]}
        verdict: {type: string, enum: [allow, block, redact]}
        block_reason: {type: string, nullable: true}
        cedar_policy_ids: {type: array, items: {type: string}}
        classifier_model_versions:
          type: object
          additionalProperties: {type: string}
        latency_breakdown:
          type: object
          properties:
            heuristic_ms: {type: number}
            classifier_ms: {type: number}
            llm_judge_ms: {type: number}
            cedar_ms: {type: number}
        evaluated_at: {type: string, format: date-time}
        evidence_hash: {type: string}
        signature: {type: string, description: Ed25519 SPIFFE-emitter signature}

    JailbreakPayload:
      type: object
      required: [incident_id, invocation_id, tenant_id_hashed, severity, evaluated_at]
      properties:
        incident_id: {type: string}
        invocation_id: {type: string}
        tenant_id_hashed: {type: string}
        prompt_hash: {type: string}
        provider_output_hash: {type: string, nullable: true}
        severity: {type: string, enum: [sev_1, sev_2]}
        detector_versions:
          type: object
          additionalProperties: {type: string}
        redaction_diff: {type: object, nullable: true}
        evaluated_at: {type: string, format: date-time}
        signature: {type: string}

    AutonomyViolationPayload:
      type: object
      required: [violation_id, invocation_id, tenant_id_hashed, requested_autonomy_level, effective_ceiling, ceiling_source, evaluated_at]
      properties:
        violation_id: {type: string}
        invocation_id: {type: string}
        tenant_id_hashed: {type: string}
        capability_id: {type: string}
        requested_autonomy_level: {type: string}
        effective_ceiling: {type: string}
        ceiling_source: {type: string}
        evaluated_at: {type: string, format: date-time}
        signature: {type: string}

    RuleFiredPayload:
      type: object
      required: [decision_id, rule_id, category, score, threshold, evaluated_at]
      properties:
        decision_id: {type: string}
        rule_id: {type: string}
        category: {type: string}
        score: {type: number}
        threshold: {type: number}
        evaluated_at: {type: string, format: date-time}

    RuleMutationPayload:
      type: object
      required: [rule_id, version, action, pack, author_spiffe, committed_at]
      properties:
        rule_id: {type: string}
        version: {type: integer}
        action: {type: string, enum: [created, modified, sunsetted]}
        pack: {type: string}
        tenant_id_hashed: {type: string, nullable: true}
        author_spiffe: {type: string}
        commit_sha: {type: string}
        pr_id: {type: string}
        prior_version: {type: integer, nullable: true}
        committed_at: {type: string, format: date-time}
        signature: {type: string}

    ClassifierDeployedPayload:
      type: object
      required: [model_id, version, sha, status, evaluated_at]
      properties:
        model_id: {type: string}
        version: {type: string}
        sha: {type: string}
        cosign_signature_sha: {type: string}
        status: {type: string, enum: [shadow, enforce, sunsetted]}
        prior_version: {type: string, nullable: true}
        shadow_vs_enforce_delta: {type: number, nullable: true}
        evaluated_at: {type: string, format: date-time}

    FpEscalatedPayload:
      type: object
      required: [escalation_id, decision_id, tenant_id_hashed, reason, evaluated_at]
      properties:
        escalation_id: {type: string}
        decision_id: {type: string}
        tenant_id_hashed: {type: string}
        reason: {type: string, minLength: 10}
        budget_remaining: {type: integer}
        evaluated_at: {type: string, format: date-time}
