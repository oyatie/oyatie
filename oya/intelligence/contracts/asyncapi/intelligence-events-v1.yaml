asyncapi: 3.1.0
info:
  title: oya-intelligence — intelligence-events
  version: 1.0.0
  summary: Per-call audit + eval + refusal + routing events emitted by intelligence
  description: |
    Per-call events emitted by `oya-intelligence-audit-tap-worker` per ADR-0263 and ADR-0255.
    Consumers:
    - `audit-chain` µservice (Ed25519 seal + Merkle of every event per Bominal ADR-0028)
    - `finops` µservice (cost-record projection)
    - `eval-worker` (online eval)
    - `grafana-oncall` (incident paging on refusal-floor breaches)
    - `observability/slo-engine-worker` (SLO computation against intelligence SLOs)
  contact:
    name: axis-intelligence

defaultContentType: application/json

servers:
  audit-chain-seal:
    host: audit-chain.intelligence.svc.cluster.local
    protocol: grpc
    description: Direct gRPC to audit-chain (ADR-0145 invariants)
  internal-event-bus:
    host: workflow-events.intelligence.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus consumed by finops + observability

channels:
  dispatch-issued:
    address: intelligence/dispatch.issued
    messages:
      DispatchIssuedMessage:
        $ref: '#/components/messages/DispatchIssued'
    description: A dispatch envelope was admitted (post Cedar dispatch-authorization).

  dispatch-completed:
    address: intelligence/dispatch.completed
    messages:
      DispatchCompletedMessage:
        $ref: '#/components/messages/DispatchCompleted'
    description: A dispatch ran end-to-end (provider returned; output filtered + attributed; audit-tap committed).

  dispatch-refused:
    address: intelligence/dispatch.refused
    messages:
      DispatchRefusedMessage:
        $ref: '#/components/messages/DispatchRefused'
    description: A dispatch was refused by Cedar gate (refusal-baseline / eu-ai-act-high-risk / abuse-defence / byok-gating).

  dispatch-failed:
    address: intelligence/dispatch.failed
    messages:
      DispatchFailedMessage:
        $ref: '#/components/messages/DispatchFailed'
    description: A dispatch failed (provider 5xx; credential-handle expired; timeout).

  routing-decision-emitted:
    address: intelligence/routing.decided
    messages:
      RoutingDecisionMessage:
        $ref: '#/components/messages/RoutingDecisionEmitted'
    description: The model-router chose a provider+model for a dispatch.

  eval-recorded:
    address: intelligence/eval.recorded
    messages:
      EvalRecordedMessage:
        $ref: '#/components/messages/EvalRecorded'
    description: An eval score was emitted for a dispatch.

  prompt-injection-detected:
    address: intelligence/prompt-injection.detected
    messages:
      PromptInjectionDetectedMessage:
        $ref: '#/components/messages/PromptInjectionDetected'
    description: The post-call classifier flagged a jailbreak / prompt-injection success.

  audit-tap-committed:
    address: intelligence/audit-tap.committed
    messages:
      AuditTapCommittedMessage:
        $ref: '#/components/messages/AuditTapCommitted'
    description: An audit-tap record was sealed into audit-chain.

operations:
  emitDispatchIssued:
    action: send
    channel:
      $ref: '#/channels/dispatch-issued'
  emitDispatchCompleted:
    action: send
    channel:
      $ref: '#/channels/dispatch-completed'
  emitDispatchRefused:
    action: send
    channel:
      $ref: '#/channels/dispatch-refused'
  emitDispatchFailed:
    action: send
    channel:
      $ref: '#/channels/dispatch-failed'
  emitRoutingDecision:
    action: send
    channel:
      $ref: '#/channels/routing-decision-emitted'
  emitEvalRecord:
    action: send
    channel:
      $ref: '#/channels/eval-recorded'
  emitPromptInjectionDetected:
    action: send
    channel:
      $ref: '#/channels/prompt-injection-detected'
  emitAuditTapCommitted:
    action: send
    channel:
      $ref: '#/channels/audit-tap-committed'

components:
  messages:
    DispatchIssued:
      name: DispatchIssued
      contentType: application/json
      summary: Dispatch admitted for processing
      payload:
        $ref: '#/components/schemas/DispatchIssuedPayload'
    DispatchCompleted:
      name: DispatchCompleted
      contentType: application/json
      summary: Dispatch completed end-to-end
      payload:
        $ref: '#/components/schemas/DispatchCompletedPayload'
    DispatchRefused:
      name: DispatchRefused
      contentType: application/json
      summary: Dispatch refused by Cedar gate
      payload:
        $ref: '#/components/schemas/DispatchRefusedPayload'
    DispatchFailed:
      name: DispatchFailed
      contentType: application/json
      summary: Dispatch failed (transient or provider error)
      payload:
        $ref: '#/components/schemas/DispatchFailedPayload'
    RoutingDecisionEmitted:
      name: RoutingDecisionEmitted
      contentType: application/json
      summary: Provider+model chosen
      payload:
        $ref: '#/components/schemas/RoutingDecisionPayload'
    EvalRecorded:
      name: EvalRecorded
      contentType: application/json
      summary: Eval score emitted
      payload:
        $ref: '#/components/schemas/EvalRecordedPayload'
    PromptInjectionDetected:
      name: PromptInjectionDetected
      contentType: application/json
      summary: Jailbreak detected post-call
      payload:
        $ref: '#/components/schemas/PromptInjectionDetectedPayload'
    AuditTapCommitted:
      name: AuditTapCommitted
      contentType: application/json
      summary: Audit-tap record sealed
      payload:
        $ref: '#/components/schemas/AuditTapCommittedPayload'

  schemas:
    DispatchIssuedPayload:
      type: object
      required: [envelope_id, tenant_id, audience_tag, purpose, modality, pack, emitted_at]
      properties:
        envelope_id: {type: string}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        audience_tag: {type: string, enum: [consumer, developer, internal-foundry]}
        purpose: {type: string}
        modality: {type: string, enum: [text, image, audio, video, multi]}
        pack: {type: string}
        principal_id: {type: string}
        emitted_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 signature by audit-tap-worker}

    DispatchCompletedPayload:
      type: object
      required: [envelope_id, status, emitted_at, signature]
      properties:
        envelope_id: {type: string}
        status: {type: string, enum: [completed]}
        provider: {type: string}
        model: {type: string}
        prompt_hash: {type: string, description: SHA-256 of canonicalised prompt}
        output_hash: {type: string, description: SHA-256 of canonicalised output}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        total_cost_usd: {type: number}
        latency_first_token_ms: {type: integer}
        streaming_tokens_per_sec: {type: number}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    DispatchRefusedPayload:
      type: object
      required: [envelope_id, status, refusal_reason, gate, emitted_at, signature]
      properties:
        envelope_id: {type: string}
        status: {type: string, enum: [refused]}
        refusal_reason: {type: string}
        gate:
          type: string
          enum:
            - dispatch-authorization
            - refusal-baseline
            - eu-ai-act-high-risk
            - byok-gating
            - abuse-defence
            - provider-routing
        pack_overlay_applied: {type: string, nullable: true}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    DispatchFailedPayload:
      type: object
      required: [envelope_id, status, error_code, emitted_at, signature]
      properties:
        envelope_id: {type: string}
        status: {type: string, enum: [failed]}
        error_code: {type: string}
        provider: {type: string, nullable: true}
        provider_error: {type: object, nullable: true}
        retry_after_seconds: {type: integer, nullable: true}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    RoutingDecisionPayload:
      type: object
      required: [envelope_id, provider, model, emitted_at]
      properties:
        envelope_id: {type: string}
        provider: {type: string}
        model: {type: string}
        region: {type: string}
        provider_credential_kind: {type: string, enum: [tenant_byok, platform_default]}
        fallback_count: {type: integer, default: 0}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    EvalRecordedPayload:
      type: object
      required: [envelope_id, score, method, emitted_at]
      properties:
        envelope_id: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        method: {type: string, enum: [canonicalen_set_match, judge_model_score, classifier_pass]}
        eval_id: {type: string}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    PromptInjectionDetectedPayload:
      type: object
      required: [envelope_id, classifier_id, classifier_score, emitted_at]
      properties:
        envelope_id: {type: string}
        classifier_id: {type: string}
        classifier_score: {type: number}
        injection_kind: {type: string, enum: [direct, indirect, unknown]}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    AuditTapCommittedPayload:
      type: object
      required: [envelope_id, audit_tap_record_id, audit_chain_seal_id, emitted_at]
      properties:
        envelope_id: {type: string}
        audit_tap_record_id: {type: string}
        audit_chain_seal_id: {type: string}
        merkle_proof: {type: string}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}
