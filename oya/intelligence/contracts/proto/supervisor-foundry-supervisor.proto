// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// oya-intelligence-supervisor — gRPC contract
// Internal-only service RPC projection; contracts/openapi/foundry-supervisor.yaml remains the public client contract.
// Per ADR-0131 + /specs/foundry-supervisor-control-plane.json.

syntax = "proto3";

package oya.foundry.supervisor.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: FoundrySupervisor
// =========================================================================
//
// Authn: SPIFFE mTLS workload identity with TLS 1.3; user-token authentication belongs to REST/OpenAPI.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: metadata key "x-scope-orgid" = "tenant_<hashed-id>".
// Two-person rule: fleet-scope KillSwitch.Engage requires both metadata keys
//                  "x-signature-bundle-1" and "x-signature-bundle-2".

service FoundrySupervisor {
  // Capability admit + lifecycle
  rpc AdmitCapability(AdmitCapabilityRequest) returns (AgentDeployment);
  rpc GetCapability(GetCapabilityRequest) returns (CapabilityDefinition);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc RollbackDeployment(RollbackDeploymentRequest) returns (AgentDeployment);

  // Fleet lifecycle
  rpc GetFleetState(GetFleetStateRequest) returns (FleetState);
  rpc DrainFleet(DrainFleetRequest) returns (DrainHandle);
  rpc StreamFleetState(StreamFleetStateRequest) returns (stream FleetState);

  // Kill-switch
  rpc EngageKillSwitch(EngageKillSwitchRequest) returns (KillSwitch);
  rpc DisengageKillSwitch(DisengageKillSwitchRequest) returns (KillSwitch);
  rpc GetKillSwitchState(GetKillSwitchStateRequest) returns (GetKillSwitchStateResponse);
  rpc StreamKillSwitchEvents(StreamKillSwitchEventsRequest) returns (stream KillSwitchEvent);

  // Autonomy precondition (foundry-runtime calling; SPIFFE-restricted)
  rpc EvaluateAutonomyPrecondition(EvaluateAutonomyPreconditionRequest)
      returns (AutonomyDecision);
  rpc ListAutonomyEntitlements(ListAutonomyEntitlementsRequest)
      returns (ListAutonomyEntitlementsResponse);

  // Anonymous validation
  rpc ValidateCapabilitySchema(ValidateCapabilitySchemaRequest)
      returns (ValidateCapabilitySchemaResponse);
}

// =========================================================================
// Common types
// =========================================================================

enum AutonomyLevel {
  AUTONOMY_TIER_UNSPECIFIED = 0;
  AUTONOMY_TIER_T0 = 1;
  AUTONOMY_TIER_T1 = 2;
  AUTONOMY_TIER_T2 = 3;
  AUTONOMY_TIER_T3 = 4;
}

enum RolloutPhase {
  ROLLOUT_PHASE_UNSPECIFIED = 0;
  ROLLOUT_PHASE_ADMITTED = 1;
  ROLLOUT_PHASE_CANARY_1PCT = 2;
  ROLLOUT_PHASE_CANARY_10PCT = 3;
  ROLLOUT_PHASE_CANARY_50PCT = 4;
  ROLLOUT_PHASE_ROLLED_OUT = 5;
  ROLLOUT_PHASE_ROLLED_BACK = 6;
  ROLLOUT_PHASE_HELD = 7;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_PENDING = 1;
  VERDICT_ELIGIBLE = 2;
  VERDICT_HELD = 3;
  VERDICT_REJECTED = 4;
  VERDICT_ROLLBACK = 5;
}

enum KillSwitchScope {
  KILL_SWITCH_SCOPE_UNSPECIFIED = 0;
  KILL_SWITCH_SCOPE_FLEET = 1;
  KILL_SWITCH_SCOPE_TENANT = 2;
  KILL_SWITCH_SCOPE_CAPABILITY = 3;
  KILL_SWITCH_SCOPE_AGENT = 4;
}

enum EngageReason {
  ENGAGE_REASON_UNSPECIFIED = 0;
  ENGAGE_REASON_CROSS_TENANT_LEAK = 1;
  ENGAGE_REASON_RUNAWAY_COST = 2;
  ENGAGE_REASON_SAFETY_BREACH = 3;
  ENGAGE_REASON_BREACH_RESPONSE = 4;
  ENGAGE_REASON_COMPLIANCE_DEMAND = 5;
  ENGAGE_REASON_AUTONOMY_VIOLATION = 6;
  ENGAGE_REASON_GUARDRAIL_VIOLATION = 7;
  ENGAGE_REASON_FAST_BURN_BREACH = 8;
  ENGAGE_REASON_MANUAL_OVERRIDE = 9;
  ENGAGE_REASON_POST_MORTEM_REMEDIATION = 10;
}

enum RollbackReason {
  ROLLBACK_REASON_UNSPECIFIED = 0;
  ROLLBACK_REASON_FAST_BURN_BREACH = 1;
  ROLLBACK_REASON_SLOW_BURN_BREACH = 2;
  ROLLBACK_REASON_MANUAL_OVERRIDE = 3;
  ROLLBACK_REASON_EVAL_REGRESSION = 4;
  ROLLBACK_REASON_GUARDRAIL_VIOLATION = 5;
  ROLLBACK_REASON_POST_MORTEM_REMEDIATION = 6;
}

enum AnnexIiiDomain {
  ANNEX_III_DOMAIN_UNSPECIFIED = 0;
  ANNEX_III_DOMAIN_NONE = 1;
  ANNEX_III_DOMAIN_EMPLOYMENT = 2;
  ANNEX_III_DOMAIN_LAW_ENFORCEMENT = 3;
  ANNEX_III_DOMAIN_MIGRATION = 4;
  ANNEX_III_DOMAIN_JUSTICE = 5;
  ANNEX_III_DOMAIN_BIOMETRIC = 6;
  ANNEX_III_DOMAIN_CRITICAL_INFRASTRUCTURE = 7;
  ANNEX_III_DOMAIN_EDUCATION = 8;
  ANNEX_III_DOMAIN_ESSENTIAL_SERVICES = 9;
}

message CapabilityDefinition {
  string id = 1;
  string version = 2;
  string tenant = 3;
  AutonomyLevel autonomy_level = 4;
  double cost_budget_per_invocation = 5;
  string runtime_provider = 6;
  string runtime_model = 7;
  bytes schema_yaml = 8;
  AnnexIiiDomain annex_iii_domain = 9;
}

message AgentDeployment {
  string deployment_id = 1;
  string capability_id = 2;
  string tenant = 3;
  string current_version = 4;
  string prior_version = 5;
  RolloutPhase rollout_phase = 6;
  Verdict verdict = 7;
  google.protobuf.Timestamp advanced_at = 8;
}

message FleetState {
  string tenant = 1;
  uint32 agent_count = 2;
  uint32 healthy_count = 3;
  uint32 draining_count = 4;
  repeated CapabilityFleetSlice capabilities = 5;
}

message CapabilityFleetSlice {
  string capability_id = 1;
  string current_version = 2;
  uint32 agent_count = 3;
}

message DrainHandle {
  string tenant = 1;
  uint32 in_flight_count = 2;
  google.protobuf.Timestamp deadline = 3;
}

message KillSwitch {
  KillSwitchScope scope = 1;
  string target = 2;
  bool engaged = 3;
  EngageReason reason = 4;
  google.protobuf.Timestamp engaged_at = 5;
  google.protobuf.Timestamp disengaged_at = 6;
  string engaged_by = 7;
  repeated string signatures = 8;
}

message KillSwitchEvent {
  KillSwitch state = 1;
  google.protobuf.Timestamp event_time = 2;
  string trigger_event_id = 3;
}

message AutonomyEntitlement {
  string tenant = 1;
  string capability = 2;
  AutonomyLevel tier = 3;
  string granted_by = 4;
  google.protobuf.Timestamp granted_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message AutonomyDecision {
  bool permit = 1;
  string reason = 2;
  double cedar_evaluation_ms = 3;
}

// =========================================================================
// Request / response messages
// =========================================================================

message AdmitCapabilityRequest {
  string tenant = 1;
  string capability_id = 2;
  CapabilityDefinition definition = 3;
}

message GetCapabilityRequest {
  string tenant = 1;
  string capability_id = 2;
}

message ListCapabilitiesRequest {
  string tenant = 1;
}

message ListCapabilitiesResponse {
  repeated CapabilityDefinition capabilities = 1;
}

message ListDeploymentsRequest {
  string tenant = 1;
  string capability_id = 2;
}

message ListDeploymentsResponse {
  repeated AgentDeployment deployments = 1;
}

message RollbackDeploymentRequest {
  string tenant = 1;
  string deployment_id = 2;
  string target_version = 3;
  RollbackReason reason = 4;
}

message GetFleetStateRequest {
  string tenant = 1;
}

message DrainFleetRequest {
  string tenant = 1;
  uint32 grace_period_seconds = 2;
  string reason = 3;
}

message StreamFleetStateRequest {
  string tenant = 1;
  google.protobuf.Timestamp since = 2;
}

message EngageKillSwitchRequest {
  KillSwitchScope scope = 1;
  string target = 2;
  EngageReason reason = 3;
  repeated string signatures = 4;
}

message DisengageKillSwitchRequest {
  KillSwitchScope scope = 1;
  string target = 2;
  string reason = 3;
  repeated string signatures = 4;
}

message GetKillSwitchStateRequest {
  KillSwitchScope scope = 1;
  string target = 2;
}

message GetKillSwitchStateResponse {
  repeated KillSwitch switches = 1;
}

message StreamKillSwitchEventsRequest {
  string tenant = 1;
  google.protobuf.Timestamp since = 2;
}

message EvaluateAutonomyPreconditionRequest {
  string tenant = 1;
  string capability = 2;
  AutonomyLevel requested_autonomy_level = 3;
  string request_id = 4;
}

message ListAutonomyEntitlementsRequest {
  string tenant = 1;
}

message ListAutonomyEntitlementsResponse {
  repeated AutonomyEntitlement entitlements = 1;
}

message ValidateCapabilitySchemaRequest {
  bytes capability_yaml = 1;
}

message ValidateCapabilitySchemaResponse {
  bool valid = 1;
  repeated SchemaError errors = 2;
}

message SchemaError {
  uint32 line = 1;
  uint32 column = 2;
  string message = 3;
}
