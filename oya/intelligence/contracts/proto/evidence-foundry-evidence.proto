// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// foundry-evidence.proto
// Internal gRPC contract for high-throughput record_invocation path.
// Companion to contracts/openapi/foundry-evidence.yaml (REST); the gRPC
// surface is the preferred binding for foundry-runtime / foundry-guardrails /
// foundry-supervisor / foundry-eval sidecars and the SDK.

syntax = "proto3";

package oya.foundry_evidence.v1;

option go_package = "oyatie/foundry-evidence/v1";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Service: CapabilityInvocationRecorder
// =============================================================================

service CapabilityInvocationRecorder {
  // Sync receipt for a capability invocation; pack assembly + audit-chain seal
  // happen asynchronously. p99 ≤ 500 ms.
  rpc Record(InvocationEnvelope) returns (RecordInvocationReceipt);

  // Status of a previously-recorded invocation.
  rpc RecordStatus(RecordStatusRequest) returns (RecordStatusResponse);
}

// =============================================================================
// Service: EvidenceQuery
// =============================================================================

service EvidenceQuery {
  // Stream evidence packs matching filter. Server-side paginated; p99 ≤ 100 ms
  // for first page.
  rpc Query(EvidencePackQuery) returns (stream EvidencePack);

  // Read a single pack by id.
  rpc Get(GetEvidencePackRequest) returns (EvidencePack);
}

// =============================================================================
// Service: RegulatorExport
// =============================================================================

service RegulatorExport {
  // Request a framework-filtered, signed bundle. 2-person rule enforced.
  rpc Request(RegulatorExportRequest) returns (RegulatorExportReceipt);

  // Status of a bundle.
  rpc Status(RegulatorExportStatusRequest) returns (RegulatorExportBundleStatus);
}

// =============================================================================
// Messages
// =============================================================================

enum PayloadDataClass {
  PAYLOAD_DATA_CLASS_UNSPECIFIED = 0;
  INTERNAL_ONLY = 1;
  BEHAVIORAL_TENANT_PRODUCT = 2;
  PII_IDENTIFYING = 3;
  PII_QUASI_IDENTIFIER = 4;
  SENSITIVE_PIPA_ART23 = 5;
  PHI = 6;
  AUDIT = 7;
  SECRET = 8;
}

enum AutonomyLevel {
  AUTONOMY_TIER_UNSPECIFIED = 0;
  T0 = 1;
  T1 = 2;
  T2 = 3;
  T3 = 4;
}

enum Framework {
  FRAMEWORK_UNSPECIFIED = 0;
  EU_AI_ACT = 1;
  HIPAA = 2;
  GDPR = 3;
  KR_PIPA = 4;
  SOC2 = 5;
  ISO_27001 = 6;
}

enum SourceMicroservice {
  SOURCE_MICROSERVICE_UNSPECIFIED = 0;
  FOUNDRY_RUNTIME = 1;
  FOUNDRY_GUARDRAILS = 2;
  FOUNDRY_SUPERVISOR = 3;
  FOUNDRY_EVAL = 4;
}

message InvocationEnvelope {
  string schema_version = 1;             // "1.0"
  string invocation_id = 2;              // ULID
  uint32 attempt_no = 3;
  string tenant_id = 4;
  SourceMicroservice source_microservice = 5;
  string agent_id = 6;
  string capability_id = 7;
  AutonomyLevel autonomy_level_decision = 8;
  google.protobuf.Timestamp invocation_ts = 9;
  string pack = 10;
  string idempotency_key = 11;           // ULID
  PayloadDataClass payload_data_class = 12;
  string prompt_payload_sha = 13;        // sha256 hex
  string output_payload_sha = 14;        // sha256 hex
  optional string model_version = 15;
  optional string provider = 16;
  optional uint32 request_token_count = 17;
  optional uint32 response_token_count = 18;
  optional string subject_hash = 19;
  repeated Framework framework_tags = 20;
}

message RecordInvocationReceipt {
  string pack_id = 1;                    // ULID
  google.protobuf.Timestamp accepted_at = 2;
  bool sealed = 3;
  bool audit_chain_emit_pending = 4;
  optional string audit_event_id = 5;
}

message RecordStatusRequest {
  string pack_id = 1;
}

message RecordStatusResponse {
  string pack_id = 1;
  bool sealed = 2;
  bool audit_chain_emit_pending = 3;
  optional string audit_event_id = 4;
  optional google.protobuf.Timestamp sealed_at = 5;
  bool partial = 6;
  repeated string missing_sources = 7;
}

message EvalVerdictAtInvocation {
  string eval_set_id = 1;
  string verdict = 2;                    // pass | fail | advisory
  google.protobuf.Timestamp verdict_recorded_at = 3;
  optional double verdict_score = 4;
}

message GuardrailDecision {
  string guardrail_id = 1;
  string guardrail_version = 2;
  string decision = 3;                   // allow | block | escalate
  string rationale_hash = 4;
}

message EvidencePack {
  string pack_id = 1;
  string schema_version = 2;
  string tenant_id = 3;
  string invocation_id = 4;
  uint32 attempt_no = 5;
  SourceMicroservice source_microservice = 6;
  string agent_id = 7;
  string capability_id = 8;
  AutonomyLevel autonomy_level_decision = 9;
  google.protobuf.Timestamp invocation_ts = 10;
  optional google.protobuf.Timestamp sealed_at = 11;
  string pack = 12;
  PayloadDataClass payload_data_class = 13;
  string prompt_payload_sha = 14;
  string output_payload_sha = 15;
  optional EvalVerdictAtInvocation eval_verdict_at_invocation = 16;
  repeated GuardrailDecision guardrail_decisions = 17;
  optional string autonomy_level_rationale_hash = 18;
  optional string audit_event_id = 19;
  optional string merkle_inclusion_proof_hash = 20;
  bool sealed = 21;
  bool audit_chain_emit_pending = 22;
  bool partial = 23;
  repeated string missing_sources = 24;
  optional string supersedes_pack_ref = 25;
  optional string superseded_by_pack_ref = 26;
  repeated Framework framework_tags = 27;
  optional string subject_hash = 28;
  optional bool subject_restricted = 29;
  optional Plaintext plaintext = 30;     // present only when Cedar-permitted
}

message Plaintext {
  string prompt = 1;
  string output = 2;
}

message EvidencePackQuery {
  string tenant_id = 1;
  google.protobuf.Timestamp time_range_start = 2;
  google.protobuf.Timestamp time_range_end = 3;
  optional string invocation_id = 4;
  optional string agent_id = 5;
  optional string capability_id = 6;
  optional AutonomyLevel autonomy_level = 7;
  optional Framework framework_filter = 8;
  bool include_superseded = 9;
  bool include_partial = 10;
  optional string cursor = 11;
  uint32 limit = 12;
}

message GetEvidencePackRequest {
  string pack_id = 1;
  bool include_plaintext = 2;
}

message RegulatorExportRequest {
  string tenant_id = 1;
  Framework framework = 2;
  google.protobuf.Timestamp time_range_start = 3;
  google.protobuf.Timestamp time_range_end = 4;
  string requester_principal = 5;
  string approver_principal = 6;
  string approver_role = 7;
  string receiving_bucket_scc_id = 8;
  string dpa_export_plan_id = 9;
  string source_pack = 10;
  optional string receiving_pack = 11;
  optional string cross_pack_scc_attestation_id = 12;
  optional string engagement_id = 13;
  optional string supersedes_bundle_id = 14;
}

message RegulatorExportReceipt {
  string bundle_id = 1;
  google.protobuf.Timestamp accepted_at = 2;
  string status = 3;                     // accepted | assembling
}

message RegulatorExportStatusRequest {
  string bundle_id = 1;
}

message RegulatorExportBundleStatus {
  string bundle_id = 1;
  string status = 2;
  Framework framework = 3;
  string tenant_id = 4;
  google.protobuf.Timestamp time_range_start = 5;
  google.protobuf.Timestamp time_range_end = 6;
  uint32 pack_count = 7;
  optional string bundle_signature = 8;
  optional string bundle_merkle_root = 9;
  repeated DeliveryReceipt delivery_receipts = 10;
}

message DeliveryReceipt {
  string channel = 1;
  google.protobuf.Timestamp delivered_at = 2;
  optional google.protobuf.Timestamp acknowledged_at = 3;
}
