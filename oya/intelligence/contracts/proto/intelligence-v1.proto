// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-intelligence — gRPC contract v1
// Internal sibling-service gRPC contract; public clients use contracts/openapi/intelligence-v1.yaml.
// Per ADR-0255, ADR-0145 (direct internal gRPC), and ADR-0632 (HTTP/2 with mTLS/TLS 1.3).

syntax = "proto3";

package oya.intelligence.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =========================================================================
// Service: Dispatch
// =========================================================================
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluation server-side (dispatch-authorization, refusal-baseline,
//        eu-ai-act-high-risk, abuse-defence, byok-gating, provider-routing).
// Tenancy: per-request metadata "x-tenant-id" = "tenant:<hashed-id>".
// Audience: per-request metadata "x-audience-tag" = "consumer|developer|internal-foundry".

service Dispatch {
  // Issue a single-shot dispatch.
  rpc Issue(DispatchEnvelope) returns (DispatchOutcome);

  // Issue a streaming dispatch; chunks emitted as DispatchOutcome with status=streaming.
  rpc IssueStream(DispatchEnvelope) returns (stream DispatchOutcome);

  // Read a previously-issued dispatch outcome by envelope_id.
  rpc Get(GetDispatchRequest) returns (DispatchOutcome);

  // Read the audit-tap reference for a dispatch (auditor-scope-gated).
  rpc GetAuditTapRecord(GetDispatchRequest) returns (AuditTapRecordRef);
}

// =========================================================================
// Service: Providers
// =========================================================================

service Providers {
  rpc List(ListProvidersRequest) returns (ListProvidersResponse);
  rpc Health(ProviderHealthRequest) returns (ProviderHealth);
}

// =========================================================================
// Service: Eval
// =========================================================================

service Eval {
  rpc GetRecord(GetDispatchRequest) returns (EvalRecord);
}

// =========================================================================
// Common types
// =========================================================================

enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_CONSUMER = 1;
  AUDIENCE_DEVELOPER = 2;
  AUDIENCE_INTERNAL_FOUNDRY = 3;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_TEXT = 1;
  MODALITY_IMAGE = 2;
  MODALITY_AUDIO = 3;
  MODALITY_VIDEO = 4;
  MODALITY_MULTI = 5;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_AUTO = 1;
  PROVIDER_ANTHROPIC = 2;
  PROVIDER_OPENAI = 3;
  PROVIDER_GOOGLE_AI_STUDIO = 4;
  PROVIDER_GOOGLE_VERTEX = 5;
  PROVIDER_BEDROCK = 6;
  PROVIDER_AZURE_OPENAI = 7;
  PROVIDER_COHERE = 8;
  PROVIDER_MISTRAL = 9;
  PROVIDER_VLLM = 10;
  PROVIDER_SGLANG = 11;
  PROVIDER_TENSORRT_LLM = 12;
  PROVIDER_APPLE_FOUNDATION = 13;
  PROVIDER_OPENROUTER = 14;
  PROVIDER_TOGETHER = 15;
  PROVIDER_GROQ = 16;
  PROVIDER_HUGGINGFACE_INFERENCE = 17;
  PROVIDER_REPLICATE = 18;
  PROVIDER_ALIBABA_QWEN = 19;
  PROVIDER_TENCENT_HUNYUAN = 20;
  PROVIDER_BAIDU_ERNIE = 21;
  PROVIDER_NAVER_HYPERCLOVA_X = 22;
}

enum DispatchStatus {
  DISPATCH_STATUS_UNSPECIFIED = 0;
  DISPATCH_STATUS_STREAMING = 1;
  DISPATCH_STATUS_COMPLETED = 2;
  DISPATCH_STATUS_REFUSED = 3;
  DISPATCH_STATUS_FAILED = 4;
}

enum SecretReferenceKind {
  SECRET_REFERENCE_KIND_UNSPECIFIED = 0;
  SECRET_REFERENCE_KIND_OPENBAO_PATH = 1;
  SECRET_REFERENCE_KIND_PLATFORM_DEFAULT = 2;
}

enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  REFUSAL_REASON_CSAM = 1;
  REFUSAL_REASON_VIOLENCE = 2;
  REFUSAL_REASON_SELF_HARM = 3;
  REFUSAL_REASON_EXTREMISM = 4;
  REFUSAL_REASON_COPPA = 5;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_1 = 10;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_2 = 11;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_3 = 12;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_4 = 13;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_5 = 14;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_6 = 15;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_7 = 16;
  REFUSAL_REASON_EU_AI_ACT_ANNEX_III_CAT_8 = 17;
  REFUSAL_REASON_PCI_SCOPE_REFUSED = 20;
  REFUSAL_REASON_DATA_RESIDENCY_VIOLATION = 21;
  REFUSAL_REASON_COST_CAP_EXCEEDED = 22;
  REFUSAL_REASON_CREDENTIAL_UNAVAILABLE = 23;
  REFUSAL_REASON_PROVIDER_SATURATED = 24;
  REFUSAL_REASON_CONSENT_MISSING = 25;
  REFUSAL_REASON_MODALITY_BUDGET_EXCEEDED = 26;
  REFUSAL_REASON_PHI_PROVIDER_NOT_BAA = 27;
  REFUSAL_REASON_GDPR_ART9_LAWFUL_BASIS_MISSING = 28;
  REFUSAL_REASON_PIPA_ART23_CONSENT_MISSING = 29;
  REFUSAL_REASON_PROMPT_INJECTION_DETECTED = 30;
  REFUSAL_REASON_RFIA_REQUIRED = 31;
}

message DispatchEnvelope {
  string envelope_version = 1;          // "1.0"
  string envelope_id = 2;               // ULID
  string tenant_id = 3;                 // tenant:<hashed-id>
  Audience audience_tag = 4;
  string purpose = 5;
  Modality modality = 6;
  Provider provider_hint = 7;
  string model_hint = 8;
  Prompt prompt = 9;
  repeated ToolDef tools = 10;
  DispatchConfig config = 11;
  SecretReference secret_reference = 12;
  string pack = 13;
  string consent_grant_id = 14;
  string rfia_id = 15;
  repeated string annex_iii_categories = 16;
}

message Prompt {
  repeated PromptPart parts = 1;
}

message PromptPart {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_SYSTEM = 1;
    ROLE_USER = 2;
    ROLE_ASSISTANT = 3;
    ROLE_TOOL = 4;
  }
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TEXT = 1;
    KIND_IMAGE_URL = 2;
    KIND_IMAGE_BASE64 = 3;
    KIND_AUDIO_BLOB = 4;
    KIND_VIDEO_BLOB = 5;
    KIND_TOOL_RESPONSE = 6;
  }
  Role role = 1;
  Kind kind = 2;
  string content = 3;
  bytes content_bytes = 4;
  string content_ref = 5;
  bool untrusted_content = 6;
}

message ToolDef {
  string name = 1;
  string description = 2;
  google.protobuf.Struct schema = 3;
}

message DispatchConfig {
  double temperature = 1;
  double top_p = 2;
  uint32 max_tokens = 3;
  repeated string stop = 4;
  bool stream = 5;
  bool json_mode = 6;
  uint64 seed = 7;
}

message SecretReference {
  SecretReferenceKind kind = 1;
  string value = 2;                 // "${openbao:secret/<tenant>/<provider>}" or null
  string bound_tenant = 3;
}

message DispatchOutcome {
  string envelope_id = 1;
  DispatchStatus status = 2;
  RefusalDecision refusal = 3;
  DispatchOutput output = 4;
  RoutingDecision routing_decision = 5;
  string audit_tap_record_id = 6;
  CostRecord cost = 7;
  DispatchError error = 8;
}

message RefusalDecision {
  string decision_id = 1;
  RefusalReason reason = 2;
  string pack_overlay_applied = 3;
  string copy_localized = 4;
}

message DispatchOutput {
  repeated PromptPart parts = 1;
  repeated Citation citations = 2;
  double eval_score = 3;
}

message Citation {
  string source_uri = 1;
  uint32 span_start = 2;
  uint32 span_end = 3;
  double confidence = 4;
  string attribution_kind = 5;
}

message RoutingDecision {
  Provider provider = 1;
  string model = 2;
  string region = 3;
  uint32 latency_first_token_ms = 4;
  double streaming_tokens_per_sec = 5;
  SecretReferenceKind credential_kind = 6;
}

message CostRecord {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 vision_tokens = 3;
  uint32 audio_seconds = 4;
  uint32 video_seconds = 5;
  double input_cost_usd = 6;
  double output_cost_usd = 7;
  double modality_cost_usd = 8;
  double total_cost_usd = 9;
  SecretReferenceKind cost_owner = 10;
}

message DispatchError {
  string code = 1;
  string message = 2;
  google.protobuf.Struct provider_error = 3;
  uint32 retry_after_seconds = 4;
}

message AuditTapRecordRef {
  string envelope_id = 1;
  string audit_tap_record_id = 2;
  string audit_chain_seal_id = 3;
  google.protobuf.Timestamp emitted_at = 4;
  string signature = 5;
}

message GetDispatchRequest {
  string envelope_id = 1;
}

message ListProvidersRequest {
  string pack = 1;
}

message ListProvidersResponse {
  repeated ProviderListing providers = 1;
}

message ProviderListing {
  Provider provider = 1;
  string model = 2;
  repeated Modality modalities = 3;
  string region = 4;
  SecretReferenceKind credential_kind = 5;
  bool available = 6;
}

message ProviderHealthRequest {
  Provider provider = 1;
}

message ProviderHealth {
  Provider provider = 1;
  string status = 2;                  // up | degraded | down | circuit-broken
  uint32 latency_p99_ms = 3;
  double budget_remaining_pct = 4;
}

message EvalRecord {
  string envelope_id = 1;
  double score = 2;
  string method = 3;                  // canonicalen_set_match | judge_model_score | classifier_pass
  string eval_id = 4;
  google.protobuf.Timestamp evaluated_at = 5;
}
