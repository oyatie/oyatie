// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// oya-intelligence-runtime — gRPC contract
// Internal-only service RPC projection; contracts/openapi/foundry-runtime.yaml remains the public client contract.
// Per ADR-0025 + ADR-0131.

syntax = "proto3";

package oya.foundry_runtime.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =========================================================================
// Service: FoundryRuntime
// =========================================================================
//
// Authn: SPIFFE mTLS workload identity with TLS 1.3; user-token authentication belongs to REST/OpenAPI.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata key "x-scope-orgid" = "tenant:<hashed-id>".

service FoundryRuntime {
  // Dispatch a capability invocation.
  rpc DispatchCapability(DispatchCapabilityRequest)
      returns (Invocation);

  // Stream invocation lifecycle updates (until terminal state).
  rpc StreamInvocation(StreamInvocationRequest)
      returns (stream Invocation);

  // Get invocation by ID.
  rpc GetInvocation(GetInvocationRequest)
      returns (Invocation);

  // Cancel a running invocation.
  rpc CancelInvocation(CancelInvocationRequest)
      returns (CancelInvocationResponse);

  // Read session metadata + turn history.
  rpc GetSession(GetSessionRequest)
      returns (Session);

  // Read tenant's autonomy tier ceiling.
  rpc GetAutonomyCeiling(GetAutonomyCeilingRequest)
      returns (AutonomyCeiling);

  // Read capability descriptor (current local mirror version).
  rpc GetCapabilityDescriptor(GetCapabilityDescriptorRequest)
      returns (CapabilityDescriptor);

  // Schema-validate a capability descriptor (anonymous-allowed).
  rpc ValidateCapabilityDescriptorSchema(ValidateCapabilityDescriptorSchemaRequest)
      returns (ValidateCapabilityDescriptorSchemaResponse);
}

// =========================================================================
// Common types
// =========================================================================

enum InvocationStatus {
  INVOCATION_STATUS_UNSPECIFIED = 0;
  INVOCATION_STATUS_PENDING = 1;
  INVOCATION_STATUS_RUNNING = 2;
  INVOCATION_STATUS_COMPLETED = 3;
  INVOCATION_STATUS_FAILED = 4;
  INVOCATION_STATUS_CANCELLED = 5;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_PROVIDER_UNREACHABLE = 1;
  FAILURE_REASON_GUARDRAIL_BLOCK = 2;
  FAILURE_REASON_AUTONOMY_VIOLATION = 3;
  FAILURE_REASON_TIMEOUT = 4;
  FAILURE_REASON_RUNTIME_DRAIN_LOST = 5;
  FAILURE_REASON_DESCRIPTOR_INVALID = 6;
  FAILURE_REASON_INTERNAL_ERROR = 7;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_EVICTED = 2;
  SESSION_STATUS_TERMINATED = 3;
  SESSION_STATUS_SOFT_DELETED = 4;
}

enum EuAiActClass {
  EU_AI_ACT_CLASS_UNSPECIFIED = 0;
  EU_AI_ACT_CLASS_MINIMAL_RISK = 1;
  EU_AI_ACT_CLASS_LIMITED_RISK = 2;
  EU_AI_ACT_CLASS_HIGH_RISK_ANNEX_III = 3;
  EU_AI_ACT_CLASS_PROHIBITED = 4;
}

message Invocation {
  string invocation_id = 1;
  string tenant_id = 2;
  string capability_id = 3;
  string session_id = 4;
  InvocationStatus status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Struct result = 8;
  FailureReason failure_reason = 9;
  string failure_detail = 10;
  uint32 autonomy_level_used = 11;
  uint32 provider_invocation_count = 12;
  uint32 guardrail_invocation_count = 13;
  string evaluator_version = 14;
  string signature = 15;
}

message Session {
  string session_id = 1;
  string tenant_id = 2;
  google.protobuf.Timestamp opened_at = 3;
  google.protobuf.Timestamp last_active_at = 4;
  SessionStatus status = 5;
  uint32 turn_count = 6;
  uint64 scratchpad_size_bytes = 7;
}

message AutonomyCeiling {
  string tenant_id = 1;
  uint32 ceiling = 2;  // 0..4 per ADR-0022
  google.protobuf.Timestamp effective_at = 3;
  string signature = 4;
}

message CapabilityDescriptor {
  string capability_id = 1;
  string tenant_id = 2;
  uint32 declared_autonomy_level = 3;
  string version = 4;
  string purpose_of_use = 5;
  EuAiActClass eu_ai_act_class = 6;
  repeated string regulatory_packs_consumed = 7;
  string signature = 8;
}

// =========================================================================
// Request / response messages
// =========================================================================

message DispatchCapabilityRequest {
  string capability_id = 1;
  string session_id = 2;
  google.protobuf.Struct input = 3;
  uint32 autonomy_level_declared = 4;
  uint32 timeout_seconds = 5;
  map<string, string> metadata = 6;
  string idempotency_key = 7;
}

message StreamInvocationRequest {
  string invocation_id = 1;
}

message GetInvocationRequest {
  string invocation_id = 1;
}

message CancelInvocationRequest {
  string invocation_id = 1;
}

message CancelInvocationResponse {
  bool accepted = 1;
  string message = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetAutonomyCeilingRequest {}

message GetCapabilityDescriptorRequest {
  string capability_id = 1;
}

message ValidateCapabilityDescriptorSchemaRequest {
  bytes descriptor_yaml = 1;
}

message ValidateCapabilityDescriptorSchemaResponse {
  bool valid = 1;
  repeated SchemaError errors = 2;
}

message SchemaError {
  uint32 line = 1;
  uint32 column = 2;
  string message = 3;
}
