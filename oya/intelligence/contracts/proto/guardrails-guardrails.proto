// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// oya-intelligence-guardrails — gRPC contract
// Internal-only service RPC projection; contracts/openapi/guardrails.yaml remains the public client contract.
// Per ADR-0131 + ADR-0140 (retired per ADR-0145).

syntax = "proto3";

package oya.foundry_guardrails.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: Guardrails
// =========================================================================
//
// Authn: SPIFFE mTLS workload identity with TLS 1.3; the sanctioned in-cluster caller is foundry-runtime.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata "x-scope-orgid" = "tenant:<hashed-id>".

service Guardrails {
  rpc ClassifyPrompt(ClassifyPromptRequest) returns (Classification);
  rpc ValidateOutput(ValidateOutputRequest) returns (Validation);
  rpc EnforceAutonomy(EnforceAutonomyRequest) returns (AutonomyDecision);

  // Stream all guardrail decisions for a tenant (own-tenant scope; Cedar gated).
  rpc StreamDecisions(StreamDecisionsRequest) returns (stream GuardrailDecision);

  // GDPR Art. 22 + EU AI Act Art. 13 transparency.
  rpc GetDecisionDetail(GetDecisionDetailRequest) returns (DecisionDetail);

  // FP escalation budget.
  rpc GetFalsePositiveBudget(GetFalsePositiveBudgetRequest) returns (FalsePositiveBudget);
  rpc MarkFalsePositive(MarkFalsePositiveRequest) returns (MarkFalsePositiveResponse);
}

// =========================================================================
// Common types
// =========================================================================

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOW = 1;
  VERDICT_BLOCK = 2;
  VERDICT_REDACT = 3;
}

enum BlockReason {
  BLOCK_REASON_UNSPECIFIED = 0;
  BLOCK_REASON_PII = 1;
  BLOCK_REASON_PHI = 2;
  BLOCK_REASON_JAILBREAK_INJECTION = 3;
  BLOCK_REASON_CONTENT_SAFETY_TOXICITY = 4;
  BLOCK_REASON_CONTENT_SAFETY_SELF_HARM = 5;
  BLOCK_REASON_CONTENT_SAFETY_SEXUAL = 6;
  BLOCK_REASON_CONTENT_SAFETY_VIOLENCE = 7;
  BLOCK_REASON_CONTENT_SAFETY_MINORS = 8;
  BLOCK_REASON_CONTENT_SAFETY_HATE = 9;
  BLOCK_REASON_CONTENT_SAFETY_WEAPONS = 10;
  BLOCK_REASON_CONTENT_SAFETY_ILLEGAL = 11;
  BLOCK_REASON_AUTONOMY_TIER_EXCEEDED = 12;
  BLOCK_REASON_POLICY_DENY = 13;
  BLOCK_REASON_LLM_JUDGE_BUDGET_EXCEEDED = 14;
  BLOCK_REASON_AI_SLOP = 15;
}

enum AutonomyLevel {
  AUTONOMY_TIER_UNSPECIFIED = 0;
  AUTONOMY_TIER_T0 = 1;
  AUTONOMY_TIER_T1 = 2;
  AUTONOMY_TIER_T2 = 3;
  AUTONOMY_TIER_T3 = 4;
  AUTONOMY_TIER_T4 = 5;
}

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

enum SubjectClass {
  SUBJECT_CLASS_UNSPECIFIED = 0;
  SUBJECT_CLASS_ADULT = 1;
  SUBJECT_CLASS_MINOR = 2;
  SUBJECT_CLASS_VULNERABLE = 3;
  SUBJECT_CLASS_UNKNOWN = 4;
}

message Classification {
  Verdict verdict = 1;
  BlockReason block_reason = 2;       // unspecified when verdict=ALLOW
  repeated string cedar_policy_ids = 3;
  map<string, string> classifier_model_versions = 4;
  double ensemble_score = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  string audit_chain_id = 7;
}

message RedactionDiff {
  string original_hash = 1;
  string redacted_text = 2;
  repeated RedactedSpan redacted_spans = 3;
}

message RedactedSpan {
  uint32 offset = 1;
  uint32 length = 2;
  string reason = 3;
}

message Validation {
  Verdict verdict = 1;
  BlockReason block_reason = 2;
  RedactionDiff redaction_diff = 3;
  map<string, string> detector_versions = 4;
  google.protobuf.Timestamp evaluated_at = 5;
  string audit_chain_id = 6;
}

message AutonomyDecision {
  Verdict verdict = 1;
  AutonomyLevel effective_ceiling = 2;
  string ceiling_source = 3;
  repeated string cedar_policy_ids = 4;
  google.protobuf.Timestamp evaluated_at = 5;
  string audit_chain_id = 6;
}

message GuardrailDecision {
  string decision_id = 1;
  string invocation_id = 2;
  oneof kind {
    Classification classify = 3;
    Validation validate = 4;
    AutonomyDecision autonomy = 5;
  }
}

message DecisionDetail {
  string decision_id = 1;
  string invocation_id = 2;
  string decision_kind = 3;
  Verdict verdict = 4;
  BlockReason block_reason = 5;
  repeated string cedar_policy_ids = 6;
  map<string, string> classifier_model_versions = 7;
  google.protobuf.Timestamp evaluated_at = 8;
  string explanation = 9;       // human-readable derived from block_reason + cedar_policy_ids
}

message FalsePositiveBudget {
  string tenant_id_hashed = 1;
  uint32 used_this_month = 2;
  uint32 total_this_month = 3;
  google.protobuf.Timestamp reset_at = 4;
}

// =========================================================================
// Request / response messages
// =========================================================================

message ClassifyPromptRequest {
  string prompt_text = 1;
  string capability_id = 2;
  uint32 session_turn_count = 3;
  AutonomyLevel autonomy_level_claim = 4;
}

message ValidateOutputRequest {
  string output_text = 1;
  google.protobuf.Value tool_args = 2;
  string original_prompt_hash = 3;
}

message EnforceAutonomyRequest {
  string capability_id = 1;
  AutonomyLevel requested_autonomy_level = 2;
  Pack pack = 3;
  SubjectClass subject_class = 4;
}

message StreamDecisionsRequest {
  google.protobuf.Timestamp since = 1;
  repeated Verdict verdict_filter = 2;     // empty = all
}

message GetDecisionDetailRequest {
  string decision_id = 1;
}

message GetFalsePositiveBudgetRequest {}

message MarkFalsePositiveRequest {
  string decision_id = 1;
  string reason = 2;
}

message MarkFalsePositiveResponse {
  uint32 remaining_budget = 1;
}
