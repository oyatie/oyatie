// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// foundry-eval Eval Runner gRPC contract
// Per ADR-0024 (eval harness) + ADR-0131 (per-microservice flat layout)
// Owner: axis-foundry

syntax = "proto3";

package oya.foundry_eval.eval_runner.v1;

import "google/protobuf/timestamp.proto";

service EvalRunner {
  // Read latest publish-gate verdict for capability
  rpc GetPublishGateVerdict(GetPublishGateVerdictRequest) returns (PublishGateVerdict);

  // List recent eval-runs
  rpc ListEvalRuns(ListEvalRunsRequest) returns (ListEvalRunsResponse);

  // Trigger an ad-hoc eval-run (rate-limited per capability owner)
  rpc TriggerEvalRun(TriggerEvalRunRequest) returns (EvalRunReceipt);

  // Stream eval-run progress
  rpc StreamEvalRunProgress(StreamEvalRunProgressRequest) returns (stream EvalRunProgress);

  // Retrieve EU AI Act §15 evidence
  rpc GetEuAiActSection15Evidence(GetEuAiActSection15EvidenceRequest) returns (EuAiActSection15Evidence);

  // Retrieve EU AI Act §17 logging
  rpc GetEuAiActSection17Log(GetEuAiActSection17LogRequest) returns (EuAiActSection17Log);
}

message GetPublishGateVerdictRequest {
  string capability_id = 1;
}

message PublishGateVerdict {
  string capability_id = 1;
  string version = 2;
  Verdict verdict = 3;
  bool adversarial_cohort_pass = 4;
  bool linguistic_cohort_pass = 5;
  float latest_run_pass_rate = 6;
  google.protobuf.Timestamp latest_run_at = 7;
  google.protobuf.Timestamp evaluated_at = 8;
  string evaluator_version = 9;
  bytes signature = 10;  // Ed25519
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ELIGIBLE = 1;
  VERDICT_HELD_EVAL_SET_MISSING = 2;
  VERDICT_HELD_ADVERSARIAL_FAILURE = 3;
  VERDICT_HELD_LINGUISTIC_MINIMA = 4;
  VERDICT_HELD_STALE_RUN = 5;
  VERDICT_REJECTED = 6;
}

message ListEvalRunsRequest {
  string capability_id = 1;
  int32 limit = 2;
  string provider_route_filter = 3;
  google.protobuf.Timestamp since = 4;
}

message ListEvalRunsResponse {
  repeated EvalRun runs = 1;
  string next_page_token = 2;
}

message EvalRun {
  string run_id = 1;
  string capability_id = 2;
  string version = 3;
  ProviderRoute route = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  EvalAggregate aggregate = 7;
  bool passed = 8;
  float eu_ai_act_section_15_accuracy_metric = 9;
  string eu_ai_act_section_17_logging_payload_ref = 10;
  bytes signature = 11;
}

message ProviderRoute {
  string provider = 1;
  string model = 2;
  string variant = 3;
}

message EvalAggregate {
  float pass_rate = 1;
  int32 total_cases = 2;
  map<string, CohortAggregate> per_cohort = 3;
}

message CohortAggregate {
  string name = 1;
  float pass_rate = 2;
  int32 cases = 3;
  float p95_score = 4;
}

message TriggerEvalRunRequest {
  string capability_id = 1;
  string version = 2;
  ProviderRoute route = 3;
  string reason = 4;
  repeated string cohorts = 5;
}

message EvalRunReceipt {
  string run_id = 1;
  google.protobuf.Timestamp queued_at = 2;
  google.protobuf.Timestamp estimated_completion_at = 3;
}

message StreamEvalRunProgressRequest {
  string run_id = 1;
}

message EvalRunProgress {
  string run_id = 1;
  int32 cases_completed = 2;
  int32 cases_total = 3;
  float current_pass_rate = 4;
  google.protobuf.Timestamp emitted_at = 5;
}

message GetEuAiActSection15EvidenceRequest {
  string capability_id = 1;
  google.protobuf.Timestamp time_window_start = 2;
  google.protobuf.Timestamp time_window_end = 3;
}

message EuAiActSection15Evidence {
  string capability_id = 1;
  string version = 2;
  float accuracy_metric = 3;
  float robustness_metric = 4;
  float cybersecurity_metric = 5;
  google.protobuf.Timestamp generated_at = 6;
}

message GetEuAiActSection17LogRequest {
  string capability_id = 1;
}

message EuAiActSection17Log {
  string capability_id = 1;
  google.protobuf.Timestamp time_window_start = 2;
  google.protobuf.Timestamp time_window_end = 3;
  repeated LogEntry entries = 4;

  message LogEntry {
    string event_id = 1;
    string event_type = 2;
    google.protobuf.Timestamp timestamp = 3;
    bytes signature = 4;
  }
}
