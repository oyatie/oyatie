// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.detection.v1;

// Binding ADRs: ADR-0307, ADR-0308, ADR-0309, ADR-0310, ADR-0263.
service DetectionService {
  rpc EvaluateSignal(EvaluateSignalRequest) returns (EvaluateSignalResponse);
  rpc StartReplay(StartReplayRequest) returns (StartReplayResponse);
}

message EvaluateSignalRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string family = 3;
  string entity_id = 4;
  string trace_id = 5;
  repeated string compliance_packs = 6;
}

message EvaluateSignalResponse {
  double score = 1;
  string severity = 2;
  repeated string explanation = 3;
  string audit_id = 4;
}

message StartReplayRequest {
  string tenant_id = 1;
  string model_or_rule_version = 2;
  string replay_seed = 3;
}

message StartReplayResponse {
  string replay_run_id = 1;
  string audit_id = 2;
}
