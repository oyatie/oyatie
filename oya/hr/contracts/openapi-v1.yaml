          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/hr/v1/sensitive-read-policy-decisions": {
      "post": {
        "operationId": "evaluateHrSensitiveReadPolicy",
        "summary": "Evaluate a purpose-bound sensitive HR read policy decision envelope.",
        "x-oyatie-app-function": "oya_hr_employment_app::prepare_sensitive_hr_read_envelope",
        "requestBody": {
          "required": true,
          "content": {
