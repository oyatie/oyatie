# comms-email KR pack overlay — ADR-0064 + ADR-0201 (KR PIPA).
pack: kr
allowed_providers: [postal, smtp]
default_provider: postal
regions: [ap-northeast-2]
cross_region_allowed: false
dmarc:
  new_tenant_default: quarantine
  post_warmup_default: reject
data_residency:
  enforced: true
  allowed_processing_regions: [ap-northeast-2]
locale_default: ko-KR
