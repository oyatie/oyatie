apiVersion: oyatie.io/secrets/v1
kind: SecretBindings
metadata:
  name: comms-email-bindings
  microservice: comms-email
spec:
  bindings:
    - name: dkim-private-key
      openbao_path: "secret/{tenant_id}/comms-email/dkim-private-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/comms-email/outbound-sender
        - spiffe://oyatie/comms-email/dkim-rotator
    - name: ses-credentials
      openbao_path: "secret/{tenant_id}/comms-email/ses-credentials"
      kind: aws-iam-access-key
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/comms-email/outbound-sender
    - name: mailgun-api-key
      openbao_path: "secret/{tenant_id}/comms-email/mailgun-api-key"
      kind: api-token
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/comms-email/outbound-sender
    - name: postal-server-secret
      openbao_path: "secret/{tenant_id}/comms-email/postal-server-secret"
      kind: hmac-key
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/comms-email/outbound-sender
  # provider-credential BYOK (ADR-0255 §D-4) — tenants bring their own SES/Mailgun creds; distinct from
  # encryption-key BYOK (ADR-0251 §D-10) on the suppression list at-rest store.
  provider_credential_mode: tenant_byok
  encryption_credential_mode: tenant_byok
