# oya-comms-email-postal — Postal self-hosted, ADR-0201 sovereign tier.
# AGPL upstream. Per-tenant DKIM keys in OpenBao.

image:
  repository: ghcr.io/postalserver/postal
  # Pinned at wire time by parent (live-source verification owed).
  tag: ""
  pullPolicy: IfNotPresent

# Postal needs MariaDB + RabbitMQ + Ruby on Rails workers. The
# parent wiring step composes the full topology; this chart ships
# only the Postal application container itself plus the per-tenant
# DKIM mounting contract.

replicaCount: 2

deliverability:
  # Every send is DKIM signed. Adapters that cannot sign reject
  # at preflight per ADR-0201 §"Per-tenant deliverability primitives".
  dkim:
    enforced: true
    bao:
      mountPath: /run/secrets/oya/email-dkim
  spf:
    enforced: true
  dmarc:
    enforced: true
    newTenantDefault: quarantine
    postWarmupDefault: reject

rateCeiling:
  perTenantPerMinute: 1000

# Webhook delivery events flow into ADR-0145 audit chain via the
# comms-email µservice ingest path. The chart binds the egress URL.
webhooks:
  ingestUrl: ""    # parent wires

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

serviceAccount:
  create: true
  name: oya-comms-email-postal

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
