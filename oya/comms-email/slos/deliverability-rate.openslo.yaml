apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-deliverability-rate
  displayName: "comms-email · receiver-delivery rate"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: deliverability
spec:
  service: comms-email
  description: |
    Fraction of accepted sends that report a Delivered
    webhook event within 24h. Target: 99.5%.
  indicator:
    metadata:
      name: deliverability_rate
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: sum(rate(comms_email_delivery_event_total{kind="delivered"}[24h]))
        total:
          metricSource:
            spec:
              query: sum(rate(comms_email_provider_accepted_total[24h]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≥ 99.5%"
      target: 0.995
