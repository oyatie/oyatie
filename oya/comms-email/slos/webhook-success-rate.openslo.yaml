apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-webhook-success-rate
  displayName: "comms-email · webhook ingest → audit chain success rate"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: events
spec:
  service: comms-email
  description: |
    Fraction of webhook events that land in the audit chain
    on first attempt (no DLQ). Target: 99.99%.
  indicator:
    metadata:
      name: webhook_success_rate
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: sum(rate(comms_email_webhook_audit_emitted_total[5m]))
        total:
          metricSource:
            spec:
              query: |
                sum(rate(comms_email_webhook_audit_emitted_total[5m]))
                + sum(rate(comms_email_webhook_dlq_inserted_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≥ 99.99%"
      target: 0.9999
