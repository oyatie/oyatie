apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-send-latency-p99
  displayName: "comms-email · enqueue-to-provider-accept p99 latency"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: latency
spec:
  service: comms-email
  description: |
    End-to-end latency from receipt of the send request at the
    comms-email API to the provider acknowledging acceptance.
    Hyperscaler-bar target.
  indicator:
    metadata:
      name: send_latency_p99_ms
    spec:
      ratioMetric:
        counter: false
        good:
          metricSource:
            type: prometheus
            metricSourceRef: oya-prometheus
            spec:
              query: |
                histogram_quantile(0.99,
                  sum by (le) (rate(comms_email_send_latency_ms_bucket[5m])))
                <= 500
        total:
          metricSource:
            type: prometheus
            metricSourceRef: oya-prometheus
            spec:
              query: |
                count_over_time(up{job="comms-email"}[5m])
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 ≤ 500 ms"
      target: 0.99
