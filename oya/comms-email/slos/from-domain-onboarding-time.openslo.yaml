apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-from-domain-onboarding-time
  displayName: "comms-email · per-tenant from-domain onboarding time"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: onboarding
spec:
  service: comms-email
  description: |
    Wall-clock from POST /v1/tenants/{id}/from-domains to
    state = "active". Target: ≤ 24h p95.
  indicator:
    metadata:
      name: from_domain_onboarding_seconds
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: |
                histogram_quantile(0.95,
                  sum by (le) (rate(comms_email_from_domain_onboarding_seconds_bucket[7d])))
                <= 86400
        total:
          metricSource:
            spec:
              query: count_over_time(up{job="comms-email"}[7d])
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p95 ≤ 24h"
      target: 0.95
