openapi: 3.2.0
info:
  title: comms-email
  version: 0.1.0
  description: |
    ADR-0201 canonical transactional-email substrate.
  contact:
    name: oya-substrate-comms
    email: substrate@oyatie.local
  license:
    name: Apache-2.0

servers:
  - url: https://comms-email.{region}.oya.io
    variables:
      region:
        default: us-east-1
        enum:
          - us-east-1
          - us-west-2
          - eu-central-1
          - eu-west-1
          - ap-northeast-2
          - me-south-1

paths:
  /v1/messages:
    post:
      operationId: send_message
      summary: Send a transactional message.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AuditCorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboundMessageRequest"
      responses:
        "201":
          description: Provider accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutcome"
        "400":
          description: Preflight rejection (DKIM/SPF/DMARC/suppression/etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightError"
        "429":
          description: RateCeilingExceeded.

  /v1/bounces:
    get:
      operationId: list_bounces
      summary: List bounces (cursor-paginated, Tier-A invariant).
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: "Opaque cursor token from the previous response. Tier-A 4-INV pattern."
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Page of bounces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BounceListPage"

  /v1/suppressions:
    get:
      operationId: list_suppressions
      summary: List suppression entries (cursor-paginated, Tier-A invariant).
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Page of suppression entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressionListPage"

  /v1/webhooks/{provider}:
    post:
      operationId: ingest_webhook
      summary: Provider webhook ingest.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [ses, postal, mailgun]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Accepted.
        "401":
          description: Signature verification failed.

  /v1/tenants/{tenant_id}/from-domains:
    post:
      operationId: onboard_from_domain
      summary: Onboard a per-tenant from-domain.
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardFromDomainRequest"
      responses:
        "202":
          description: Onboarding accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardFromDomainOutcome"

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: comms-email
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    AuditCorrelationId:
      name: X-Oya-Audit-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        description: "Tier-A 4-INV: propagate request id end-to-end. ULID preferred."

  schemas:
    OutboundMessageRequest:
      type: object
      required: [from, to, subject, template_id, locale, vars]
      properties:
        from:
          type: string
          format: email
        reply_to:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
          minItems: 1
          maxItems: 50
        subject:
          type: string
        template_id:
          type: string
        locale:
          type: string
          example: en-US
        vars:
          type: object
          additionalProperties: true

    SendOutcome:
      type: object
      required: [provider, provider_message_id, message_id]
      properties:
        provider:
          type: string
          enum: [ses, postal, mailgun, smtp]
        provider_message_id:
          type: string
          description: "Provider-side message id (SES/Postal/Mailgun-specific)."
        message_id:
          type: string
          description: "Oyatie canonical ULID message id (Tier-A 4-INV)."
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    BounceListPage:
      type: object
      required: [bounces, next_cursor]
      properties:
        bounces:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          nullable: true

    SuppressionListPage:
      type: object
      required: [suppressions, next_cursor]
      properties:
        suppressions:
          type: array
          items:
            type: object
        next_cursor:
          type: string
          nullable: true

    PreflightError:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          enum:
            - DkimBindingMissing
            - SpfNotAuthorized
            - DmarcPolicyForbidden
            - RecipientSuppressed
            - RateCeilingExceeded
            - InvalidAddress
            - EmptyMessage
            - NoRecipients
            - IdempotencyConflict
        message:
          type: string

    OnboardFromDomainRequest:
      type: object
      required: [from_domain, locale_pack, support_inbox]
      properties:
        from_domain:
          type: string
        locale_pack:
          type: string
        support_inbox:
          type: string
          format: email
        provider_preference:
          type: string
          enum: [ses, postal, mailgun, smtp]

    OnboardFromDomainOutcome:
      type: object
      required: [onboarding_id, status, dns_records_to_publish]
      properties:
        onboarding_id:
          type: string
        status:
          type: string
          enum:
            - requested
            - dns-pending
            - dns-published
            - provider-binding
            - provider-bound
            - warm-up
            - active
            - rotating
            - revoked
        dns_records_to_publish:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [SPF, DKIM, DMARC]
              host:
                type: string
              value:
                type: string
