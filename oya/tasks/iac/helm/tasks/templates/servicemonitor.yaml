# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tasks
  namespace: tasks
  labels:
    app.kubernetes.io/name: tasks
    release: prometheus
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: tasks}
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: bc
      metricRelabelings:
        - sourceLabels: [task_id]
          action: labeldrop
        - sourceLabels: [project_id]
          action: labeldrop
