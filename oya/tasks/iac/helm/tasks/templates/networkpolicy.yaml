# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tasks-default-deny
  namespace: tasks
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tasks-allow-ingress-from-gateway
  namespace: tasks
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tasks}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-edge}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: tasks}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tasks-allow-egress-to-substrate
  namespace: tasks
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tasks}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: tasks-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: tasks-valkey}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: tasks-meilisearch}}}]
      ports: [{protocol: TCP, port: 7700}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ontology}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenancy}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: workflow-engine}}}]
      ports: [{protocol: TCP, port: 4222}]  # NATS bridge for ADR-TASKS-0005
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: foundry-runtime}}}]
      ports: [{protocol: TCP, port: 50051}]  # T0/T1/T2 capability invocation
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: drive}}}]
      ports: [{protocol: TCP, port: 50051}]  # attachment bridge
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
