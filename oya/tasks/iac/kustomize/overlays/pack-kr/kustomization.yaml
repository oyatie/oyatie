# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tasks
resources: [../../base]
commonAnnotations:
  oyatie/pack: "kr"
  oyatie/region: "ap-northeast-2"
  oyatie/legal-citations: |
    KR PIPA Arts. 15/17/22-2/23/28/29 + 통신비밀보호법 Art. 3 + 정보통신망법 Art. 28
    + 근로기준법 §17 + 직장갑질 §76 (auto-assign refusal in employment-context).
    Dual-context (Personal / Professional) isolation enforced structurally per
    ADR-TASKS-0001. T2 auto-assign refused at Cedar layer pending per-pack
    conformity assessment per ADR-TASKS-0006.
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--component=task-store-rest", "--pack=kr"]
    target:
      kind: Deployment
      name: tasks-task-store-rest
