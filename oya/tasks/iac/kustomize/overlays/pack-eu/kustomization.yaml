# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tasks
resources: [../../base]
commonAnnotations:
  oyatie/pack: "eu"
  oyatie/region: "eu-central-1"
  oyatie/legal-citations: |
    GDPR Arts. 5/6/9/17/20/22/25/32/44-50 + Recital 26 pseudonymisation
    + EU AI Act Annex III §4 (employment + worker management high-risk;
    auto-assign refused without conformity assessment per ADR-TASKS-0006)
    + EU AI Act Art. 50 transparency for AI features.
    Dual-context isolation enforced structurally per ADR-TASKS-0001.
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--component=task-store-rest", "--pack=eu"]
    target:
      kind: Deployment
      name: tasks-task-store-rest
