# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-task-list-render-latency
  displayName: "tasks: task-list render p95 (200 tasks)"
  labels:
    microservice: tasks
    bc: view-engine
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Task-list render p95 latency SLO. A request is "good" when rendering
    a 200-task list view completes in ≤ 200ms server-side. PRD-tasks
    §"Performance" + AC-01. Client paint is observed separately.
  service: tasks
  indicator:
    metadata: {name: tasks-task-list-render-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_tasks_task_list_render_seconds_bucket{tasks_in_list="200"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.2
      displayName: "30d rolling p95 ≤ 200ms (200 tasks)"
  alertPolicies:
    - alertPolicyRef: tasks-task-list-render-fast-burn-1h-14x
    - alertPolicyRef: tasks-task-list-render-slow-burn-6h-6x
