# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-recurring-materialise-latency
  displayName: "tasks: recurring-task materialise p99"
  labels:
    microservice: tasks
    bc: recurrence
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
    compliance: [ADR-TASKS-0003]
spec:
  description: |
    Recurring-task materialisation p99 latency SLO. A single RRULE
    expansion + insert is "good" when it completes in ≤ 1s. Aligned with
    calendar's recurrence SLO per ADR-TASKS-0003 + ADR-CAL-0002.
  service: tasks
  indicator:
    metadata: {name: tasks-recurring-materialise-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_tasks_recurrence_materialise_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 1.0
      displayName: "30d rolling p99 ≤ 1s"
  alertPolicies:
    - alertPolicyRef: tasks-recurring-materialise-fast-burn-1h-14x
    - alertPolicyRef: tasks-recurring-materialise-slow-burn-6h-6x
