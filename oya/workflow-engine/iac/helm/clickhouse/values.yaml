# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
clickhouse:
  shards: 1            # XS tier per capacity-model.md; grow with scale tier
  replicaCount: 2      # 2 replicas per shard for HA
  auth:
    username: workflow_engine_analytics
    existingSecret: openbao-clickhouse
    existingSecretKey: password
  persistence:
    enabled: true
    size: 300Gi
    storageClass: oci-bv-fast
  zookeeper:
    enabled: true           # required for replicated MergeTree
    replicaCount: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  configuration: |-
    <yandex>
      <merge_tree>
        <max_parts_in_total>10000</max_parts_in_total>
      </merge_tree>
      <kafka></kafka>
      <storage_configuration>
        <disks>
          <s3_disk>
            <type>s3</type>
            <endpoint>${OCI_OBJECTSTORAGE_ENDPOINT}/${OCI_WORKFLOW_ENGINE_CH_BUCKET}/</endpoint>
            <access_key_id from_env="OCI_ACCESS_KEY"/>
            <secret_access_key from_env="OCI_SECRET_KEY"/>
          </s3_disk>
        </disks>
        <policies>
          <tiered>
            <volumes>
              <hot><disk>default</disk></hot>
              <cold><disk>s3_disk</disk></cold>
            </volumes>
            <move_factor>0.2</move_factor>
          </tiered>
        </policies>
      </storage_configuration>
    </yandex>
  ingress:
    enabled: false              # in-cluster only
  networkPolicy:
    enabled: true
    allowExternal: false
