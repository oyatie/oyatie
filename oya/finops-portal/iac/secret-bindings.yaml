apiVersion: oyatie.io/secrets/v1
kind: SecretBindings
metadata:
  name: finops-portal-bindings
  microservice: finops-portal
spec:
  bindings:
    - name: quarterly-evidence-signing-key
      openbao_path: "secret/{tenant_id}/finops-portal/quarterly-evidence-signing-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/finops-portal/regulator-evidence-emit
    - name: grafana-iframe-embed-key
      openbao_path: "secret/{tenant_id}/finops-portal/grafana-iframe-embed-key"
      kind: hmac-sha256
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/finops-portal/tenant-billing-presenter
    - name: focus-export-tenant-key
      openbao_path: "secret/{tenant_id}/finops-portal/focus-export-tenant-key"
      kind: aes-256-gcm
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/finops-portal/focus-exporter
    - name: credit-ledger-signing-key
      openbao_path: "secret/{tenant_id}/finops-portal/credit-ledger-signing-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/finops-portal/credit-ledger
  provider_credential_mode: tenant_byok
  encryption_credential_mode: tenant_byok
