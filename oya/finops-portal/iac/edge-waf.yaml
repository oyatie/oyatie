apiVersion: oyatie.io/network/v1
kind: EdgeWAF
metadata:
  name: finops-portal-edge-waf
  microservice: finops-portal
spec:
  bot_management:
    provider: in-house-equivalent
    ja4_enabled: true
    ja4plus_enabled: true
    score_header: "X-Oya-Bot-Score"
  rate_limits:
    per_ip:
      drilldown: { rpm: 60, burst: 20 }
      focus_export: { rpm: 2, burst: 1 }
      admin: { rpm: 30, burst: 10 }
    per_fingerprint: { enabled: true }
    per_tenant: { enabled: true }
  challenges:
    captcha:
      providers: [hcaptcha, turnstile]
      trigger_bot_score: 60
      ux_floor:
        a11y_audio_alternative: true
        a11y_keyboard_navigable: true
        a11y_time_pressured: false
        cognitive_load_seconds_max: 10
        session_continuity_preserved: true
  honeypots:
    routes: [/v1/legacy-finops-debug, /v1/internal-cost-export]
  friendly_crawler_partners_allowlist: [googlebot, bingbot]
  default_path_latency_budget_ms: 2
