apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oya.fullname" . }}-slo-burn
  labels:
    {{- include "oya.labels" . | nindent 4 }}
    release: prometheus
spec:
  groups:
    - name: finops-portal.slo-burn
      rules:
        - alert: FinopsPortalRenderBurnRate
          expr: |
            (
              sum(rate(finops_portal_tenant_invoice_render_latency_ms_bucket{le="2000"}[1h]))
              /
              sum(rate(finops_portal_tenant_invoice_render_latency_ms_count[1h]))
            ) < {{ .Values.slo.tenantInvoiceRenderLatencyTarget }}
          for: 15m
          labels:
            severity: warning
            slo: tenant-invoice-render-latency
          annotations:
            summary: tenant-invoice-render-latency SLO burning fast
            runbook_url: https://oyatie.com/microservices/finops-portal/runbooks/finops-portal-deploy-rollback
        - alert: FinopsPortalFocusExportBurnRate
          expr: |
            (
              sum(rate(finops_portal_focus_export_total{outcome="success"}[1h]))
              /
              sum(rate(finops_portal_focus_export_total[1h]))
            ) < {{ .Values.slo.focusExportAvailabilityTarget }}
          for: 30m
          labels:
            severity: warning
            slo: focus-export-availability
          annotations:
            summary: FOCUS export availability below target
            runbook_url: https://oyatie.com/microservices/finops-portal/runbooks/focus-export-failure
        - alert: FinopsPortalQuarterlyEmitPageOnMiss
          expr: |
            (time() - max(finops_portal_quarterly_report_emit_timestamp_seconds{outcome="signed-sealed"})) > 95 * 24 * 3600
          for: 1h
          labels:
            severity: critical
            slo: regulator-emit-availability
          annotations:
            summary: quarterly regulator emit missed cure window
            runbook_url: https://oyatie.com/microservices/finops-portal/runbooks/quarterly-regulator-emit-miss
        - alert: FinopsPortalCreditSealMissPage
          expr: |
            sum(rate(finops_portal_credit_apply_total{audit_seal!="success"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
            slo: credit-application-correctness
          annotations:
            summary: credit ledger append succeeded but audit seal missing
            runbook_url: https://oyatie.com/microservices/finops-portal/runbooks/credit-application-reconciliation
