asyncapi: 3.1.0
info:
  title: finops-portal — FOCUS export internal events
  version: "0.1.0"
  description: |
    AsyncAPI for the asynchronous FOCUS export pipeline (per IP-014).
    The HTTP request `POST /v1/tenants/{id}/focus-export` returns an
    export-id immediately; the actual translate + write + signed-URL
    issuance is event-driven across the listed channels.
    Authority: ADR-0199 D-4 FOCUS canonical + ADR-0197 backup substrate.
  contact:
    name: ops-finops council
defaultContentType: application/cloudevents+json
servers:
  audit-chain:
    host: audit-chain.oya.internal
    protocol: kafka
    description: audit-chain canonical event substrate
channels:
  FocusExportRequested:
    address: finops-portal.focus-export.requested
    description: emitted when an HTTP POST starts an export
    messages:
      FocusExportRequested:
        $ref: "#/components/messages/FocusExportRequested"
  FocusExportTranslated:
    address: finops-portal.focus-export.translated
    description: emitted after kernel translate succeeds
    messages:
      FocusExportTranslated:
        $ref: "#/components/messages/FocusExportTranslated"
  FocusExportWritten:
    address: finops-portal.focus-export.written
    description: emitted after parquet/csv write to seaweedfs succeeds
    messages:
      FocusExportWritten:
        $ref: "#/components/messages/FocusExportWritten"
  FocusExportDownloaded:
    address: finops-portal.focus-export.downloaded
    description: emitted on first download of a signed URL (audit seal)
    messages:
      FocusExportDownloaded:
        $ref: "#/components/messages/FocusExportDownloaded"
  FocusExportFailed:
    address: finops-portal.focus-export.failed
    description: emitted on any failure in the pipeline
    messages:
      FocusExportFailed:
        $ref: "#/components/messages/FocusExportFailed"
operations:
  publishFocusExportRequested:
    action: send
    channel: { $ref: "#/channels/FocusExportRequested" }
  publishFocusExportTranslated:
    action: send
    channel: { $ref: "#/channels/FocusExportTranslated" }
  publishFocusExportWritten:
    action: send
    channel: { $ref: "#/channels/FocusExportWritten" }
  publishFocusExportDownloaded:
    action: send
    channel: { $ref: "#/channels/FocusExportDownloaded" }
  publishFocusExportFailed:
    action: send
    channel: { $ref: "#/channels/FocusExportFailed" }
components:
  messages:
    FocusExportRequested:
      name: FocusExportRequested
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [export_id, tenant_id, period, requested_at]
        properties:
          export_id: { type: string, format: ulid }
          tenant_id: { type: string, format: uuid }
          period: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
          format: { type: string, enum: [parquet, csv] }
          requested_at: { type: string, format: date-time }
          requested_by: { type: string }
    FocusExportTranslated:
      name: FocusExportTranslated
      payload:
        type: object
        required: [export_id, row_count, byte_estimate]
        properties:
          export_id: { type: string }
          row_count: { type: integer }
          byte_estimate: { type: integer }
          translate_duration_ms: { type: integer }
    FocusExportWritten:
      name: FocusExportWritten
      payload:
        type: object
        required: [export_id, object_key, bucket, byte_count]
        properties:
          export_id: { type: string }
          object_key: { type: string }
          bucket: { type: string }
          byte_count: { type: integer }
    FocusExportDownloaded:
      name: FocusExportDownloaded
      payload:
        type: object
        required: [export_id, object_key, downloaded_at, ip_hash]
        properties:
          export_id: { type: string }
          object_key: { type: string }
          downloaded_at: { type: string, format: date-time }
          ip_hash: { type: string }
          user_agent_hash: { type: string }
    FocusExportFailed:
      name: FocusExportFailed
      payload:
        type: object
        required: [export_id, failure_class, failed_at]
        properties:
          export_id: { type: string }
          failure_class:
            type: string
            enum:
              - UnknownCostCenter
              - BucketUnavailable
              - SignerKeyExpired
              - UpstreamMimirError
              - Internal
          failure_message: { type: string }
          failed_at: { type: string, format: date-time }
