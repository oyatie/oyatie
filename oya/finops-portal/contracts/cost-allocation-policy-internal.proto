// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// finops-portal — cost-allocation-policy internal gRPC contract
// Authored 2026-05-18.
// Authority: ADR-0174 chargeback formula + ADR-0083 Tier-A 4-INV +
// ADR-0131 flat layout + ADR-0199 cost-attribution canonical.
//
// Tier-A 4-INV (kernel-tier invariants encoded in the contract):
//   INV-1: every wire message is forward-compatible (proto3 default).
//   INV-2: every wire message field uses an explicit field number;
//          no field renumbering once shipped (audit-chain seals depend
//          on field ordering for byte-stable serialization).
//   INV-3: no recursive types (avoids unbounded depth — DOS shield).
//   INV-4: every Policy has a stable `version` field; downstream
//          consumers compare by `(name, version)` not by `(name, last-updated)`.

syntax = "proto3";

package oya.finops_portal.cost_allocation_policy.v1;

option go_package = "oya/finops_portal/cost_allocation_policy/v1";

// A persistent cost-allocation policy.
message CostAllocationPolicy {
  string name = 1;
  PolicyScope scope = 2;
  uint32 version = 3;
  string authored_at = 4;     // ISO-8601 UTC
  string authored_by = 5;
  PolicyLifecycle lifecycle = 6;
  repeated AllocationRule rules = 7;
  string regulatory_pack = 8; // generic, kr, eu, us-healthcare, ...
}

message PolicyScope {
  oneof scope {
    bool fleet = 1;
    string regulatory_pack = 2;
    string tenant_id = 3;
  }
}

enum PolicyLifecycle {
  POLICY_LIFECYCLE_UNSPECIFIED = 0;
  POLICY_LIFECYCLE_DRAFT = 1;
  POLICY_LIFECYCLE_REVIEWED = 2;
  POLICY_LIFECYCLE_ACTIVE = 3;
  POLICY_LIFECYCLE_RETIRED = 4;
}

// One allocation rule. Closed-set DSL per IP-009 kernel.
message AllocationRule {
  oneof rule {
    ProportionalToTenantRequestShare proportional = 1;
    FlatSplitAmongActiveTenants flat_split = 2;
    AssignToInvokingTenant invoking = 3;
    SplitBetweenTwoCostCenters split_two = 4;
    CustomFormula custom = 5;
  }
}

message ProportionalToTenantRequestShare {
  string cost_center = 1;
  string denominator_key = 2;
}

message FlatSplitAmongActiveTenants {
  string cost_center = 1;
  string active_window_period = 2;
}

message AssignToInvokingTenant {
  string cost_center = 1;
}

message SplitBetweenTwoCostCenters {
  string primary = 1;
  uint32 primary_share_pct = 2;
  string secondary = 3;
}

// AST in serialized form; the kernel's FormulaExpr parser enforces
// whitelist + depth cap. The contract only carries the serialized text.
message CustomFormula {
  string expression = 1;
  uint32 max_depth = 2;
}

// gRPC service definition.
service CostAllocationPolicyService {
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc PromotePolicy(PromotePolicyRequest) returns (PromotePolicyResponse);
  rpc DiffPolicies(DiffPoliciesRequest) returns (DiffPoliciesResponse);
}

message GetPolicyRequest {
  string name = 1;
  uint32 version = 2;
}
message GetPolicyResponse { CostAllocationPolicy policy = 1; }

message ListPoliciesRequest {
  PolicyLifecycle filter_lifecycle = 1;
  string regulatory_pack = 2;
}
message ListPoliciesResponse { repeated CostAllocationPolicy policies = 1; }

message PromotePolicyRequest {
  CostAllocationPolicy proposed = 1;
  repeated Reviewer reviewers = 2;
}
message PromotePolicyResponse {
  CostAllocationPolicy promoted = 1;
  // INV-4 byte-stable seal envelope hash so the audit-chain
  // consumer can verify.
  string seal_envelope_hash = 2;
}

message Reviewer {
  string user_id = 1;
  string approved_at = 2;
}

message DiffPoliciesRequest {
  string name = 1;
  uint32 from_version = 2;
  uint32 to_version = 3;
}
message DiffPoliciesResponse {
  // Each diff entry names a rule added/removed/changed.
  repeated DiffEntry entries = 1;
}

message DiffEntry {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_REMOVED = 2;
    KIND_CHANGED = 3;
  }
  Kind kind = 1;
  AllocationRule rule = 2;
  string note = 3;
}
