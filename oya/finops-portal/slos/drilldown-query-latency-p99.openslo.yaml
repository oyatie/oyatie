# OpenSLO v1alpha — drill-down query latency (p99 hard latency floor)
# Per ADR-0130 + ADR-0186.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-drilldown-query-latency-p99
  displayName: "finops-portal — drill-down query latency (p99)"
  labels:
    microservice: finops-portal
    bounded_context: tenant-billing-presentation
    plane: data
    sli_kind: latency
spec:
  description: |
    Tenant cost drill-down query against Mimir must complete within
    1 s p99 over the 28d rolling window. A breach degrades the
    interactive drill-down UX and signals upstream Mimir
    saturation.
  service: finops-portal
  indicator:
    metadata:
      name: drilldown-query-latency-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_drilldown_query_ms_bucket{le="1000"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_drilldown_query_ms_count[5m]
                ))
  objectives:
    - displayName: "p99 ≤ 1000 ms (28d window)"
      target: 0.99
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-drilldown-query-burn-rate
