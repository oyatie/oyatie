# Capability declaration — focus-export
# Authored 2026-05-18.
# Authority: ADR-0083 + ADR-0199 D-4 + risk classification.
schema_version: "1.0"
capability:
  id: focus-export
  microservice: finops-portal
  bounded_context: focus-export
  description: |
    Export per-tenant cost data as FOCUS 1.3 Parquet (default) or CSV,
    written to SeaweedFS, with a short-lived signed download URL.
    Used by tenants to feed their own finance pipelines.
  surface:
    public_api: true
    internal_api: true
  inputs:
    - tenant_id
    - period
    - format (parquet | csv)
  outputs:
    - signed_download_url
    - export_manifest (row count, byte count, schema_version)
  risk_class:
    risk_class: minimal
    rationale: |
      Pure data-export capability. No decisioning, no
      recommendation, no model. The output is a deterministic
      translation from internal TenantInvoice + InvoiceLine into
      FOCUS 1.3 canonical schema. Per EU AI Act, "minimal risk"
      applies because the capability does not influence any
      decision automatically.
    human_in_loop: not_applicable
    transparency_requirement: |
      The FOCUS 1.3 spec itself documents the schema; the
      export manifest cites schema_version "1.3" and pins the
      translator version.
  pii_classification:
    - tenant_id (medium)
    - per-resource dollar amounts (medium)
    - cloud-provider sub-account ids (low — opaque)
  rate_limit:
    per_tenant_per_hour: 12
    per_tenant_per_day: 96
  size_limits:
    max_rows_per_export: 100_000_000
    max_object_bytes: 50_000_000_000   # 50 GB
  slo_bindings:
    - slos/focus-export-availability.openslo.yaml
  audit_chain_events:
    - FocusExportRequested
    - FocusExportDownloaded
    - FocusExportFailed
  retired: false
