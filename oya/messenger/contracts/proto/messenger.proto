// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-messenger — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/messenger.yaml.
// Per ADR-0135 + ADR-0131 + ADR-0132.

syntax = "proto3";

package oya.messenger.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =========================================================================
// Service: ChannelStore
// =========================================================================

service ChannelStore {
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc GetChannel(GetChannelRequest) returns (Channel);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc ArchiveChannel(ArchiveChannelRequest) returns (google.protobuf.Empty);
  rpc AddChannelMember(AddChannelMemberRequest) returns (google.protobuf.Empty);
  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (google.protobuf.Empty);
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse);
}

// =========================================================================
// Service: MessageStream
// =========================================================================

service MessageStream {
  rpc PostMessage(PostMessageRequest) returns (Message);
  rpc GetMessage(GetMessageRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc EditMessage(EditMessageRequest) returns (Message);
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);
  rpc AddReaction(AddReactionRequest) returns (google.protobuf.Empty);
  rpc RemoveReaction(RemoveReactionRequest) returns (google.protobuf.Empty);
  rpc StreamMessages(StreamMessagesRequest) returns (stream Message);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
}

// =========================================================================
// Service: ThreadTree
// =========================================================================

service ThreadTree {
  rpc GetThread(GetThreadRequest) returns (Thread);
  rpc PostThreadReply(PostThreadReplyRequest) returns (Message);
  rpc ListThreadReplies(ListThreadRepliesRequest) returns (ListThreadRepliesResponse);
}

// =========================================================================
// Service: ReadReceiptTracker
// =========================================================================

service ReadReceiptTracker {
  rpc MarkRead(MarkReadRequest) returns (google.protobuf.Empty);
  rpc GetLastReadCursor(GetLastReadCursorRequest) returns (ReadReceipt);
}

// =========================================================================
// Service: FileAttachment
// =========================================================================

service FileAttachment {
  rpc InitiateUpload(InitiateUploadRequest) returns (UploadSession);
  rpc FinalizeUpload(FinalizeUploadRequest) returns (Attachment);
  rpc GetAttachment(GetAttachmentRequest) returns (Attachment);
}

// =========================================================================
// Service: Presence
// =========================================================================

service Presence {
  rpc UpdateOwnPresence(UpdateOwnPresenceRequest) returns (PresenceState);
  rpc GetPresence(GetPresenceRequest) returns (PresenceState);
  rpc StreamPresence(StreamPresenceRequest) returns (stream PresenceState);
}

// =========================================================================
// Common types
// =========================================================================

enum ContextKind {
  CONTEXT_KIND_UNSPECIFIED = 0;
  CONTEXT_KIND_PERSONAL = 1;
  CONTEXT_KIND_PROFESSIONAL = 2;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_PUBLIC = 1;
  CHANNEL_KIND_PRIVATE = 2;
  CHANNEL_KIND_DM = 3;
  CHANNEL_KIND_GROUP_DM = 4;
}

enum PresenceStateKind {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_ONLINE = 1;
  PRESENCE_STATE_AWAY = 2;
  PRESENCE_STATE_DO_NOT_DISTURB = 3;
  PRESENCE_STATE_OFFLINE = 4;
}

enum ScanStatus {
  SCAN_STATUS_UNSPECIFIED = 0;
  SCAN_STATUS_PENDING = 1;
  SCAN_STATUS_CLEAN = 2;
  SCAN_STATUS_INFECTED = 3;
  SCAN_STATUS_ERROR = 4;
}

message Channel {
  string channel_id = 1;
  string tenant_id = 2;
  ContextKind context_kind = 3;
  ChannelKind kind = 4;
  string name = 5;
  string topic = 6;
  int32 member_count = 7;
  string retention_policy_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp archived_at = 10;
}

message Message {
  string message_id = 1;
  string channel_id = 2;
  string thread_id = 3;
  string author_ref = 4;
  ContextKind context_kind = 5;
  string body = 6;
  bytes body_ciphertext = 7;
  string data_class = 8;
  repeated string attachment_refs = 9;
  repeated string mention_refs = 10;
  repeated Reaction reactions = 11;
  google.protobuf.Timestamp edited_at = 12;
  google.protobuf.Timestamp deleted_at = 13;
  google.protobuf.Timestamp posted_at = 14;
  string content_hash = 15;
  string signature = 16;
}

message Reaction {
  string emoji = 1;
  int32 count = 2;
  repeated string users = 3;
}

message Thread {
  string thread_id = 1;
  string channel_id = 2;
  string parent_message_id = 3;
  int32 participant_count = 4;
  int32 reply_count = 5;
  google.protobuf.Timestamp last_reply_at = 6;
}

message ReadReceipt {
  string user_ref = 1;
  string channel_id = 2;
  string last_read_message_id = 3;
  google.protobuf.Timestamp last_read_at = 4;
}

message Attachment {
  string attachment_id = 1;
  string blob_ref = 2;
  string digest_sha256 = 3;
  int64 size_bytes = 4;
  string mime_type = 5;
  ScanStatus scan_status = 6;
  string preview_url = 7;
}

message UploadSession {
  string attachment_id = 1;
  repeated string upload_urls = 2;
  string finalize_url = 3;
}

message PresenceState {
  string user_ref = 1;
  string tenant_id = 2;
  PresenceStateKind state = 3;
  string custom_status = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// =========================================================================
// Request / Response
// =========================================================================

message CreateChannelRequest {
  ContextKind context_kind = 1;
  ChannelKind kind = 2;
  string name = 3;
  string topic = 4;
  repeated string initial_members = 5;
  string retention_policy_id = 6;
}

message GetChannelRequest { string channel_id = 1; }
message ArchiveChannelRequest { string channel_id = 1; }
message ListChannelsRequest {
  ContextKind context_kind = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListChannelsResponse {
  repeated Channel channels = 1;
  string next_cursor = 2;
}
message AddChannelMemberRequest {
  string channel_id = 1;
  string user_ref = 2;
  string role = 3;
}
message RemoveChannelMemberRequest {
  string channel_id = 1;
  string user_ref = 2;
}
message ListChannelMembersRequest { string channel_id = 1; }
message ListChannelMembersResponse {
  repeated string user_refs = 1;
}

message PostMessageRequest {
  string channel_id = 1;
  string body = 2;
  bytes body_ciphertext = 3;
  string thread_id = 4;
  repeated string attachment_refs = 5;
  repeated string mention_refs = 6;
}
message GetMessageRequest { string channel_id = 1; string message_id = 2; }
message ListMessagesRequest {
  string channel_id = 1;
  string before_message_id = 2;
  int32 limit = 3;
}
message ListMessagesResponse { repeated Message messages = 1; }
message EditMessageRequest {
  string channel_id = 1;
  string message_id = 2;
  string body = 3;
}
message DeleteMessageRequest {
  string channel_id = 1;
  string message_id = 2;
}
message AddReactionRequest {
  string channel_id = 1;
  string message_id = 2;
  string emoji = 3;
}
message RemoveReactionRequest {
  string channel_id = 1;
  string message_id = 2;
  string emoji = 3;
}
message StreamMessagesRequest {
  string channel_id = 1;
  google.protobuf.Timestamp since = 2;
}
message SearchMessagesRequest {
  string query = 1;
  string channel_id = 2;
  google.protobuf.Timestamp before = 3;
  google.protobuf.Timestamp after = 4;
  int32 limit = 5;
}
message SearchMessagesResponse {
  repeated SearchHit hits = 1;
  int32 total_hits = 2;
  int32 took_ms = 3;
}
message SearchHit {
  Message message = 1;
  string channel_id = 2;
  double score = 3;
  string highlight = 4;
}

message GetThreadRequest { string thread_id = 1; }
message PostThreadReplyRequest {
  string thread_id = 1;
  string body = 2;
}
message ListThreadRepliesRequest { string thread_id = 1; }
message ListThreadRepliesResponse { repeated Message replies = 1; }

message MarkReadRequest {
  string channel_id = 1;
  string message_id = 2;
}
message GetLastReadCursorRequest { string channel_id = 1; }

message InitiateUploadRequest {
  string filename = 1;
  int64 size_bytes = 2;
  string mime_type = 3;
}
message FinalizeUploadRequest {
  string attachment_id = 1;
  repeated string etags = 2;
}
message GetAttachmentRequest { string attachment_id = 1; }

message UpdateOwnPresenceRequest {
  PresenceStateKind state = 1;
  string custom_status = 2;
}
message GetPresenceRequest { string user_ref = 1; }
message StreamPresenceRequest { repeated string user_refs = 1; }
