# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:messenger:t0-suggest:v1
name: smart-reply-suggest
namespace: messenger
display_name: Smart-Reply + Mention-Hint Suggestions
description: |
  Given the visible thread context (last N messages bounded by Cedar policy),
  emit ≤ 3 ranked reply suggestions and ≤ 3 ranked mention-hint candidates
  for the composing client. T0 = suggestion only; no autonomous send.
  Always presented to the user; no action taken without confirmation.

owner_team: axis-messenger + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133]
related_specs: [/specs/microservices/messenger.json]
related_artifacts:
  - microservices/messenger/PRD.md (FR-13 Workflow event integration)
  - microservices/messenger/contracts/openapi/messenger.yaml
  - microservices/messenger/policy/dual-context-isolation.md

autonomy_tier: T0
# T0 = suggest-only; per ADR-0022 autonomy tiers (Bominal-inherited).
# No state mutation; no auto-send.

inputs:
  - name: channel_id
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'  # ULID
    required: true
  - name: context_messages
    type: array
    items: {ref: Message (per contracts/openapi/messenger.yaml)}
    max_items: 32
    required: true
  - name: composing_user_ref
    type: string
    required: true
  - name: context_kind
    type: enum
    values: [Personal, Professional]
    required: true

outputs:
  - name: reply_suggestions
    type: array
    max_items: 3
    items:
      type: object
      properties:
        text: {type: string, maxLength: 280}
        confidence: {type: number, minimum: 0, maximum: 1}
        rationale_token: {type: string, description: opaque rationale id for audit replay}
  - name: mention_hints
    type: array
    max_items: 3
    items:
      type: object
      properties:
        target_kind: {type: string, enum: [Person, Team, Channel]}
        target_ref: {type: string}
        confidence: {type: number}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING  # message bodies may contain names / contact details
  # NEVER touches Personal-context plaintext: the body_client_only invariant
  # means a personal-DM body is never visible server-side, so T0 suggestions
  # operate ONLY on Professional-context channels and on client-side cached
  # personal-DM plaintext via the SDK (model runs in browser).

context_kind_constraint:
  Personal: model-runs-client-side-only  # E2E plaintext never touches server
  Professional: model-runs-server-side  # server has decrypted body via tenant-DEK
  enforcement: compile-time + LEAN-check oya-check-dual-context-isolation

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare  # MUST DISABLE for PHI channels per HIPAA Safe Harbour
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

pack_overrides:
  pack-us-healthcare:
    disabled_for_phi_channels: true
    reason: HIPAA 45 CFR §164.514 Safe Harbour — no derived inferences over PHI
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: must-label-as-AI-suggested per EU AI Act Art. 50
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required

evidence_topic: oya.messenger.capability.t0_suggest.evidence

cost_profile:
  type: per-suggestion-batch
  estimated_cost_usd_per_call: 0.0008
  cost_drivers:
    - LLM inference (small open-weights model; on-prem GPU pool)
    - Ontology lookup for mention-hint candidates

cedar_policy_fragments:
  - microservices/messenger/policy/channel-scope.cedar
  - microservices/messenger/policy/tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/messenger/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.90
  eval_metric: reply-suggestion-relevance vs human-rater baseline; mention-hint precision@1
  cadence: per-release

sunset:
  status: none
