# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "channelStore" "messageStreamRest" "presence" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: messenger-{{ . | kebabcase }}-pdb
  namespace: messenger
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: messenger
      app.kubernetes.io/component: {{ . | kebabcase }}
{{- end }}
