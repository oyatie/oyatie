# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# Base Kustomization for governance µservice
# Per ADR-0131 §"iac/kustomize/<overlay>/"
# Composed by per-pack overlays (iac/kustomize/overlays/pack-<pack>/)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: governance

commonLabels:
  microservice: governance
  managed-by: oyatie-governance-app

resources:
  # Layer-B oyatie-owned components
  - namespace.yaml
  - service-account.yaml
  - lane-runtime-deployment.yaml
  - lane-runtime-service.yaml
  - policy-engine-deployment.yaml
  - policy-engine-service.yaml
  - evidence-emitter-deployment.yaml
  - evidence-emitter-service.yaml
  - aggregation-indexer-deployment.yaml
  - aggregation-indexer-service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - servicemonitor.yaml

  # Cedar policy ConfigMaps
  - cedar-tenant-scope-configmap.yaml
  - cedar-ci-scope-configmap.yaml
  - cedar-auditor-scope-configmap.yaml
  - cedar-public-read-configmap.yaml

  # OpenSLO manifests as ConfigMaps
  - openslo-manifests-configmap.yaml

configMapGenerator:
  - name: governance-app-config
    files:
      - config.toml=app-config.toml
    options:
      disableNameSuffixHash: false

secretGenerator: []                    # Secrets via OpenBao operator; not generated here

images:
  - name: ghcr.io/oyatie/oya-governance-lane-runtime-app
    newTag: 0.1.0
  - name: ghcr.io/oyatie/oya-governance-policy-engine-app
    newTag: 0.1.0
  - name: ghcr.io/oyatie/oya-governance-evidence-emitter-app
    newTag: 0.1.0
  - name: ghcr.io/oyatie/oya-governance-aggregation-indexer-app
    newTag: 0.1.0

replicas:
  - name: lane-runtime
    count: 2
  - name: policy-engine
    count: 2
  - name: evidence-emitter
    count: 2
  - name: aggregation-indexer
    count: 2

patches:
  - path: patches/spiffe-injection.yaml
    target:
      kind: Deployment

# Reference: docs.oracle.com/en-us/iaas/Content/ContEng/Concepts/contengoverview.htm
