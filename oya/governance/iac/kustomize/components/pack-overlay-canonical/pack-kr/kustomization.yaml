apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-kr canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: KR (South Korea PIPA). Single-region OCI ap-seoul-1.
# Consumer pattern: per-µservice overlays/pack-kr/kustomization.yaml composes
#   this canonical component + appends µservice-specific patches.

commonAnnotations:
  oyatie/pack: pack-kr
  oyatie/jurisdiction: kr
  oyatie/region: ap-seoul-1
  oyatie/data-residency: kr-resident
  oyatie/kms-key-ref: ocikms://kr/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=kr-resident
      - CDN_EDGE_REGION=ap-seoul-1
