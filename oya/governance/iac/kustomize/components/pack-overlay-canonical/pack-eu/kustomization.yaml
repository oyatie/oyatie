apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-eu canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: EU (GDPR + EU AI Act). Region: eu-frankfurt-1.

commonAnnotations:
  oyatie/pack: pack-eu
  oyatie/jurisdiction: eu
  oyatie/region: eu-frankfurt-1
  oyatie/data-residency: eu-resident
  oyatie/kms-key-ref: ocikms://eu/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-eu
      - REGION=eu-frankfurt-1
      - JURISDICTION=eu
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.eu-frankfurt-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=eu-resident
      - CDN_EDGE_REGION=eu-frankfurt-1
      - GDPR_DPO_CONTACT=dpo@oyatie.com
      - EU_AI_ACT_TRANSPARENCY_REQUIRED=true
