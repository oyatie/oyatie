apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-us-healthcare canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: US-Healthcare (HIPAA). Region: us-ashburn-1 with isolated namespace.

commonAnnotations:
  oyatie/pack: pack-us-healthcare
  oyatie/jurisdiction: us-hc
  oyatie/region: us-ashburn-1
  oyatie/data-residency: us-resident
  oyatie/hipaa-baa-required: "true"
  oyatie/kms-key-ref: ocikms://us-hc/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-us-healthcare
      - REGION=us-ashburn-1
      - JURISDICTION=us-hc
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.us-ashburn-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=us-resident-hipaa-baa
      - CDN_EDGE_REGION=us-ashburn-1
      - HIPAA_BAA_REQUIRED=true
      - PHI_ENCRYPTION_AT_REST_KMS=ocikms://us-hc/phi-master-key
