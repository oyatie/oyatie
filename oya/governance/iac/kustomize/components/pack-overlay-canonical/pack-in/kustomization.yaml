apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-in canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: IN (DPDP Act 2023). Region: ap-mumbai-1.

commonAnnotations:
  oyatie/pack: pack-in
  oyatie/jurisdiction: in
  oyatie/region: ap-mumbai-1
  oyatie/data-residency: in-resident
  oyatie/kms-key-ref: ocikms://in/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-in
      - REGION=ap-mumbai-1
      - JURISDICTION=in
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-mumbai-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=in-resident
      - CDN_EDGE_REGION=ap-mumbai-1
