---
# pack-eu EU DSA Arts. 14/17/27 transparency response shaping at the Istio
# Ambient waypoint. Per ADR-0174. Per EU DSA 2065/2022:
#   - Art. 14 (terms and conditions)
#   - Art. 17 (statement of reasons on content moderation actions)
#   - Art. 27 (recommender system transparency)
#
# Decision shape: any content-moderation decision (community/anonymous/messenger
# moderation responses) must carry a DSA-compliant Statement of Reasons.
# Decisions issued without the SoR header are upgraded with the canonical SoR
# body skeleton; decisions that should be denied receive 451 + SoR.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   permit(principal, action == Action::"moderate_content", resource)
#     when { resource.has_dsa_statement_of_reasons };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-eu-dsa-transparency
  namespace: pack-eu
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-eu
    oyatie/regulation: EU-DSA
    oyatie/regulation-article: "14,17,27"
    oyatie/regulation-action: "shape-statement-of-reasons"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "EU DSA 2065/2022 Arts. 14 (T&C), 17 (statement of reasons), 27 (recommender transparency)"
    oyatie.cedar.source: "microservices/governance/policy/eu-dsa.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths:
              - "/community/*/moderate"
              - "/community/*/remove"
              - "/community/*/restrict"
              - "/anonymous/*/moderate"
              - "/messenger/*/moderate"
              - "/social/*/moderate"
              - "/shorts/*/moderate"
              - "/workflow/*/recommend"
      when:
        - key: request.headers[x-oyatie-statement-of-reasons]
          notValues: ["embedded"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-eu-dsa-transparency-response-shape
  namespace: pack-eu
  labels:
    oyatie/pack: pack-eu
    oyatie/regulation: EU-DSA
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  local status = response_handle:headers():get(":status")
                  local rule = response_handle:headers():get("x-istio-rule-matched")
                  -- Upgrade any moderation response on pack-eu with the canonical SoR body.
                  -- For DENY cases (rule matched), emit 451 + SoR; for ALLOW cases, ensure SoR header is present.
                  if rule and string.find(rule, "pack-eu-dsa-transparency") then
                    response_handle:headers():replace(":status", "451")
                    response_handle:headers():replace("content-type", "application/json")
                    response_handle:headers():add("x-oyatie-regulation", "EU-DSA-Art-17")
                    response_handle:headers():add("x-oyatie-statement-of-reasons", "embedded")
                    response_handle:headers():add("x-oyatie-redress-endpoint",
                      "https://app.oyatie.example/dsa/redress")
                    local body = [[
                      {
                        "regulation": "EU DSA 2065/2022 Art. 17",
                        "statement_of_reasons": {
                          "decision_type": "content_moderation_action",
                          "facts_and_circumstances": "see x-oyatie-moderation-detail header for ref",
                          "legal_ground": "Terms of Service §dsa-art-14",
                          "automated_means_used": "see x-oyatie-moderation-automated header",
                          "duration": "see x-oyatie-moderation-duration header",
                          "redress_path": "https://app.oyatie.example/dsa/redress",
                          "out_of_court_dispute_settlement": "https://app.oyatie.example/dsa/oocs"
                        },
                        "art_27_recommender_transparency": {
                          "available": "https://app.oyatie.example/dsa/recommender-transparency"
                        },
                        "audit_chain_seal": "embedded-via-waypoint"
                      }
                    ]]
                    response_handle:body():setBytes(body)
                  end
                end
