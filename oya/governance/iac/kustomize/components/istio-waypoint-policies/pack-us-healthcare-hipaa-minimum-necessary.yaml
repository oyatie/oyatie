---
# pack-us-healthcare HIPAA minimum-necessary scrubbing at the Istio Ambient
# waypoint. Per ADR-0174. Per HIPAA 45 CFR §164.502(b) (minimum necessary
# standard), §164.504(e) (business-associate boundary), §164.514 (de-identification).
#
# Decision shape: any outbound PHI-bearing response to a non-authorized caller
# (caller does not present a valid covered-entity or business-associate token)
# gets scrubbed of identifying fields by a Wasm filter. Denies PHI egress to
# uncovered destinations entirely.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   permit(principal, action == Action::"read_phi", resource)
#     when { principal.is_covered_entity || principal.is_business_associate };
#   forbid(principal, action == Action::"read_phi", resource)
#     when { !principal.is_covered_entity && !principal.is_business_associate };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-us-healthcare-hipaa-minimum-necessary
  namespace: pack-us-healthcare
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-us-healthcare
    oyatie/regulation: HIPAA
    oyatie/regulation-article: "164.502,164.504(e),164.514"
    oyatie/regulation-action: "scrub-minimum-necessary"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "HIPAA 45 CFR §164.502(b) (minimum necessary); §164.504(e) (BAA boundary); §164.514 (de-identification safe harbor)"
    oyatie.cedar.source: "microservices/governance/policy/hipaa.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    # Hard DENY: PHI egress to callers that are neither covered-entity nor business-associate.
    - to:
        - operation:
            methods: ["GET", "POST"]
            paths:
              - "/recordings/*/phi"
              - "/recordings/*/transcript"
              - "/messenger/*/dm-with-phi"
              - "/drive/*/phi-document"
              - "/notes/*/phi-note"
              - "/forms/*/phi-submission"
      when:
        - key: request.auth.claims[oyatie_hipaa_role]
          notValues: ["covered-entity", "business-associate"]
        - key: request.headers[x-oyatie-baa-attestation]
          notValues: ["valid", "present-and-current"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-us-healthcare-hipaa-minimum-necessary-scrubber
  namespace: pack-us-healthcare
  labels:
    oyatie/pack: pack-us-healthcare
    oyatie/regulation: HIPAA
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    # The Wasm filter scrubs minimum-necessary fields from the response body
    # for callers that ARE covered-entity / business-associate but are reading
    # outside their minimum-necessary scope (per §164.502(b)).
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.wasm
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              name: oyatie-hipaa-min-necessary-scrubber
              root_id: oyatie-hipaa-min-necessary-scrubber
              vm_config:
                runtime: envoy.wasm.runtime.v8
                code:
                  remote:
                    http_uri:
                      uri: "https://oci-objectstorage.us-ashburn-1.oraclecloud.com/n/oyatie/b/wasm-filters/o/oyatie-hipaa-min-necessary-scrubber-0.1.0.wasm"
                      cluster: oci_objectstorage
                      timeout: 10s
                    sha256: "REPLACE_WITH_RELEASED_WASM_SHA256"
              configuration:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "scrubbed_fields": [
                      "patient.ssn",
                      "patient.dob",
                      "patient.diagnosis",
                      "patient.prescription",
                      "patient.full_name",
                      "patient.address",
                      "patient.email",
                      "patient.phone",
                      "patient.mrn",
                      "provider.npi",
                      "provider.dea",
                      "claim.full"
                    ],
                    "scrub_strategy": "replace_with_redacted_placeholder",
                    "min_necessary_role_field": "request.auth.claims[oyatie_hipaa_min_necessary_role]",
                    "audit_chain_emit_on_scrub": true,
                    "audit_chain_endpoint": "audit-chain.audit-chain.svc.cluster.local:50051",
                    "regulation_anchor": "HIPAA-164-502-b"
                  }
    # Response-shape Lua filter: every scrub event adds the
    # x-oyatie-minimum-necessary-applied header for downstream observability.
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  local scrubbed = response_handle:headers():get("x-oyatie-wasm-scrubbed-fields")
                  if scrubbed then
                    response_handle:headers():add("x-oyatie-regulation", "HIPAA-164-502")
                    response_handle:headers():add("x-oyatie-minimum-necessary-applied", "true")
                    response_handle:headers():add("x-oyatie-baa-boundary", "enforced")
                  end
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-us-healthcare-hipaa-minimum-necessary") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "HIPAA-164-502")
                      response_handle:headers():add("x-oyatie-baa-required", "true")
                      local body = [[
                        {
                          "regulation": "HIPAA 45 CFR §164.502(b) + §164.504(e)",
                          "decision": "phi_egress_refused",
                          "reason": "caller_lacks_covered_entity_or_business_associate_role",
                          "baa_path": "https://app.oyatie.example/hipaa/baa-onboarding",
                          "minimum_necessary_basis": "164-502-b",
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
