# oya-important — non-critical app-tier µservices that should
# preempt low-priority workloads (notifications, search, view
# rendering).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: oya-important
  labels:
    oyatie/priority-tier: important
value: 100000
globalDefault: false
description: |
  Important app-tier workloads — search, notifications, view
  rendering. Preempted only by oya-critical. Per ADR-0145 +
  Fix-Agent-I Tier-A landing.
