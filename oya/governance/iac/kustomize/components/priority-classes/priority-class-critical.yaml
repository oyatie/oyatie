# oya-critical — data-plane, auth, tenant-isolation, audit-chain seal,
# distributed-locks. Workloads at this tier preempt every other tier.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: oya-critical
  labels:
    oyatie/priority-tier: critical
value: 1000000
globalDefault: false
description: |
  Critical-path workloads — data-plane, auth/Cedar evaluation,
  tenant-isolation enforcement, audit-chain seal emission. Preempts
  every other oyatie tier. Per ADR-0145 + Fix-Agent-I Tier-A landing.
