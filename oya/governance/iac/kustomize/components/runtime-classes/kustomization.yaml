---
# Canonical RuntimeClass install component per ADR-0147 (container sandboxing
# runtime ladder, amended 2026-05-18: Cloud Hypervisor primary). The
# cloud-k8s µservice composes this component into its base so every cluster
# reconciles a uniform set of RuntimeClass objects before any µservice that
# references them can schedule pods.
#
# Consumer pattern: cloud-k8s base/kustomization.yaml composes via
#   components: [../../../../governance/iac/kustomize/components/runtime-classes]
#
# RuntimeClass coverage (primary = Cloud Hypervisor):
#   - kata-clh         (handler kata-clh)         — PRIMARY: untrusted content +
#                                                   AI inference (CPU) +
#                                                   federation gateway
#   - kata-clh-sev-snp (handler kata-clh-sev-snp) — crypto + sovereign-tier
#                                                   overrides (AMD SEV-SNP CC)
#   - kata-clh-tdx     (handler kata-clh-tdx)     — AI inference + GPU-passthrough
#                                                   confidential compute (Intel TDX)
#   - gvisor           (handler runsc)            — LEGACY opt-in for cold-start-
#                                                   sensitive workloads only
#   - kata-qemu        (handler kata-qemu)        — LEGACY: prefer kata-clh
#   - kata-fc          (handler kata-fc)          — per-request ephemeral isolation
#   - wasmtime         (handler wasmtime)         — WASM-only workers
#   - istio-ambient-waypoint (handler runc)       — Istio Ambient waypoint
#                                                   Envoy pods for regulatory
#                                                   packs per ADR-0174

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - kata-clh-runtime-class.yaml
  - kata-clh-sev-snp-runtime-class.yaml
  - kata-clh-tdx-runtime-class.yaml
  - gvisor-runtime-class.yaml
  - kata-qemu-runtime-class.yaml
  - kata-firecracker-runtime-class.yaml
  - wasmtime-runtime-class.yaml
  - istio-ambient-waypoint-runtime-class.yaml
