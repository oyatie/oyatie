---
# gVisor RuntimeClass — userspace-kernel syscall interception via runsc handler.
# LEGACY opt-in per ADR-0147 (amended 2026-05-18: Cloud Hypervisor primary).
# Retained only for cold-start-sensitive workloads that explicitly elect
# gVisor's ~50 ms cold start over Cloud Hypervisor's 125-250 ms. No workload
# in the current ladder is cold-start sensitive — Whisper, ffmpeg, Pandoc,
# LibreOffice and Chromium-headless all run as long-running pods.
#
# NOT selected for: crypto (insufficient blast-radius — use kata-clh-sev-snp);
# untrusted-content default (use kata-clh); app-tier µservices (overhead
# unnecessary — use bare runc + CIS restricted).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    oyatie/runtime-class: gvisor
    oyatie/workload-classes: "cold-start-sensitive-opt-in"
    oyatie/adr: ADR-0147
    oyatie/status: legacy-opt-in
handler: runsc
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: gvisor
overhead:
  podFixed:
    cpu: "50m"
    memory: "64Mi"
