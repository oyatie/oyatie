---
# Kata Containers + Cloud Hypervisor RuntimeClass — full-VM isolation via the
# kata-clh handler. Primary runtime per ADR-0147 (amended 2026-05-18).
# Selected workload classes:
#   - untrusted-content transcoders/renderers (Pandoc, LibreOffice, Chromium,
#     WeasyPrint, ffmpeg, ImageMagick)
#   - AI inference on CPU paths (Whisper, ML model inference)
#   - federation/internet-egress gateway workers (paired with restrictive
#     egress NetworkPolicy)
#
# Cloud Hypervisor is a Rust VMM (CNCF Sandbox 2023, Linux Foundation
# governance, Microsoft Azure Boost in production). Compared to gVisor:
# Rust-primary aligned; full microVM via KVM (stronger isolation);
# 5-15% steady-state overhead vs gVisor's 10-50%; native AMD SEV-SNP +
# Intel TDX support paths through the sev-snp / tdx variants below.
#
# Host pool requires KVM virtualisation (AWS metal/m6a + EQX bare-metal +
# Azure CC-DC-series with KVM enabled). Cells claiming kata-clh must
# declare KVM capability in cell.host_pool.runtime_classes per cell PRD
# §scheduling.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
  labels:
    oyatie/runtime-class: kata-clh
    oyatie/workload-classes: "untrusted-content,ai-inference-cpu,federation-gateway"
    oyatie/adr: ADR-0147
    oyatie/vmm: cloud-hypervisor
handler: kata-clh
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: kata-clh
    oyatie/kvm: "true"
overhead:
  podFixed:
    cpu: "150m"
    memory: "192Mi"
