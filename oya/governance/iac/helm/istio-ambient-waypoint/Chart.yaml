# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs (layered on top of Cilium per ADR-0148).
# Pinned to Istio Ambient 1.24 LTS (long-term support).
apiVersion: v2
name: istio-ambient-waypoint
description: |
  Istio Ambient waypoint proxy (Envoy) deployed per regulatory-heavy namespace.
  Layered on top of Cilium Service Mesh (ADR-0148 primary). The waypoint enforces
  L7 regulatory response shaping that Cilium L7 cannot express (response envelope
  mutation, header-aware routing, Cedar-bound AuthorizationPolicy with regulatory
  anchors).

  Regulatory anchors per pack:
    - pack-eu              : GDPR Art. 22 + EU AI Act Annex III §4 + EU DSA Arts. 14/17/27
    - pack-kr              : KR PIPA Arts. 17/22-2/28 + 통신비밀보호법 Art. 9
    - pack-us-healthcare   : HIPAA 45 CFR §164.502 minimum necessary + §164.504(e) BAA boundary
    - pack-ksa             : KSA PDPL Arts. 5/29 + SAMA Cyber Security Framework v1.0
    - pack-uae             : UAE PDPL Arts. 22-24 + UAE Cybersecurity Council frameworks

  Per microservices/governance/policy/data-residency.md (per-pack overlay).
  Per microservices/governance/threat-model.md §T-I-04 (regulatory egress shaping).
  Per microservices/governance/compliance.md §regulatory-mesh-enforcement.
type: application
version: 0.1.0
appVersion: "1.24.1"                # Istio Ambient LTS pin (ADR-0148 Tier-2 baseline)
keywords:
  - oyatie
  - governance
  - istio
  - ambient
  - waypoint
  - regulatory
  - gdpr
  - dsa
  - eu-ai-act
  - hipaa
  - pipa
  - pdpl
home: https://github.com/oyatie/oyatie
maintainers:
