# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs
# pack-US-healthcare overlay over default values.yaml.

global:
  pack: pack-us-healthcare
  region: us-ashburn-1

waypoint:
  replicaCount: 3                              # US-healthcare — HIPAA availability target
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
    oyatie/regulatory-pack: pack-us-healthcare

authorizationPolicy:
  fragments:
    pack-us-healthcare:
      - pack-us-healthcare-hipaa-minimum-necessary

observability:
  tracing:
    samplingRate: 100
