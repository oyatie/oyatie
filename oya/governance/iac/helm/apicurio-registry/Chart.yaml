apiVersion: v2
name: apicurio-registry
description: |
  Apicurio Registry 3.x — canonical schema registry per ADR-0166.
  Hosts AsyncAPI 3.x event schemas, Protobuf 3 gRPC schemas, OpenAPI 3.1 REST
  schemas, Avro (legacy), and JSON Schema documents. Confluent Schema Registry
  compatibility API. Per-cell deployment with PostgreSQL backing; sovereign-pack
  compatible (ADR-0164 air-gap variant uses in-cell PostgreSQL).
type: application
version: 1.0.0
appVersion: "3.0.4"
kubeVersion: ">=1.27.0"
keywords:
  - schema-registry
  - apicurio
  - asyncapi
  - openapi
  - protobuf
  - confluent-compat
home: https://www.apicur.io/registry/
sources:
  - https://github.com/Apicurio/apicurio-registry
maintainers:
  - name: axis-governance
    email: axis-governance@oyatie.internal
icon: https://www.apicur.io/images/apicurio-registry-logo.svg
annotations:
  oyatie.adr: "ADR-0166"
  oyatie.related-adrs: "ADR-0005, ADR-0011, ADR-0029, ADR-0100, ADR-0105, ADR-0128, ADR-0131, ADR-0145, ADR-0148, ADR-0157"
  oyatie.layer: "Layer-1-substrate"
  oyatie.scope: "per-cell"
  oyatie.sovereign-compatible: "true"
  artifacthub.io/category: "integration-delivery"
dependencies:
  - name: postgresql
    version: ">=15.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - storage
  - name: kube-prometheus-stack
    version: ">=55.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
    tags:
      - observability
