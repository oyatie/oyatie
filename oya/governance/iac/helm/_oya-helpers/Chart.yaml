apiVersion: v2
name: oya-helpers
description: |
  Canonical Helm library chart (SWEEP-I Slice 2) per ADR-0064. Every µservice
  Helm chart depends on this library and consumes named templates via
  `{{ include "oya.<helper>" $ }}`.

  Helpers exposed:
    oya.labels                              — full label set
    oya.selectorLabels                      — selector subset
    oya.serviceAccountName                  — convention-driven SA name
    oya.securityContext.restricted          — restricted pod-security context
    oya.networkPolicy.defaultDeny           — ingress+egress deny baseline
    oya.networkPolicy.allowEgressToSubstrate — DNS + observability + audit-chain
    oya.prometheusRule.perSloBurnRate       — canonical multi-window burn-rate
    oya.probes.standardLiveness             — /health probe
    oya.probes.standardReadiness            — /ready probe
    oya.envFromOpenBao                      — OpenBao env-var renderer
    oya.resourceRequests.tier{xs,s,m,l,xl}  — sizing tiers
    oya.runtimeClassName.gvisor             — gVisor isolation runtime
type: library
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-shared-platform-substrate + council-platform-evolution
    email: axis-shared-platform-substrate@oyatie.com
