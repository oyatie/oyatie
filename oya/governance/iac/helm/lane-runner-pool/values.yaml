# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Default values for lane-runner-pool
# Per microservices/governance/cost-budget.md §"Per-Component Monthly Cost"
# Per microservices/governance/capacity-model.md §"Per-Cell Capacity Envelope"
# Per microservices/governance/threat-model.md §T-T-01 (supply-chain) + §T-D-01 (PR-bomb)

global:
  microservice: governance
  pack: pack-kr                        # overridden per overlay per multi-region.md
  region: ap-seoul-1
  cluster: governance

actions-runner-controller:
  enabled: true
  authSecret:
    # WORKFLOW_PAT lives in OpenBao; referenced not embedded
    create: false
    name: github-pat-from-openbao

runners:
  # ARC autoscaling per capacity-model.md §"Scale-Out Policy"
  minReplicas: 8                        # pre-warmed standbys
  maxReplicas: 200                      # cell-level cap
  targetUtilization: 70                 # % CPU before scale-out

  image:
    repository: ghcr.io/oyatie/governance-runner
    tag: "0.1.0"
    pullPolicy: IfNotPresent
    # SLSA L3 provenance verified at admission
    slsaProvenanceRequired: true

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"                     # per lane-execution.md Invariant 3 bound

  # T-D-02 mitigation: OOM-kill bounded by cgroup
  oomKillDisable: false

  # T-T-01 mitigation: outbound allow-list
  networkPolicy:
    enabled: true
    egress:
      allowedHosts:
        - "crates.io"                         # Cargo registry (read-only)
        - "static.crates.io"                  # Cargo CDN
        - "index.crates.io"                   # Cargo index
        - "github.com"                        # source fetch
        - "api.github.com"                    # workflow dispatch
        - "raw.githubusercontent.com"
        - "postgres.governance.svc.cluster.local"
        - "s3.ap-seoul-1.oci.example.com"
        - "audit-chain.audit-chain.svc.cluster.local"
        - "openbao.cloud-secrets.svc.cluster.local"
        - "mimir.observability.svc.cluster.local"     # metric emission only
      defaultDeny: true

  spiffe:
    enabled: true
    audience: "spiffe://oyatie/governance/lane-runner"
    workloadIdAnnotation: oyatie.example/spiffe-id

  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    # tmpfs only per threat-model.md
    seccompProfile:
      type: RuntimeDefault

  volumes:
    - name: work
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

  volumeMounts:
    - name: work
      mountPath: /work
      readOnly: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Per-µservice fairness queue per T-D-01
  fairnessQueue:
    enabled: true
    maxConcurrentPerMicroservice: 60   # 30% of maxReplicas

  # Lane timeout per lane-execution.md Invariant 3
  perLaneTimeoutSeconds: 60

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["lane-runner"]
            topologyKey: kubernetes.io/hostname

monitoring:
  prometheus:
    enabled: true
    serviceMonitorSelector:
      release: prometheus
  grafanaDashboards:
    - lane-pass-rate           # microservices/governance/dashboards/lane-pass-rate.json
    - finding-rate             # microservices/governance/dashboards/finding-rate.json
    - industry-conformance-delta

alerting:
  alertmanager:
    routes:
      - matchers:
          - severity = page
          - microservice = governance
        receiver: governance-oncall
      - matchers:
          - severity = ticket
          - microservice = governance
        receiver: governance-ticket
