// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.governance.v1;

// gRPC surface for governance µservice.
// Primary callers: merge-queue (admission gate); reviewer-agents (PR review);
// audit-chain µservice (seal verification); per-µservice SDK clients.
//
// Authentication: SPIFFE mTLS/TLS 1.3 authenticates the calling workload. Forwarded user claims,
// when required, are application authorization context rather than public RPC authentication.
// Each call is Cedar-authorized per tenant-scope.cedar / ci-scope.cedar / auditor-scope.cedar.
//
// Related:
//   - microservices/governance/contracts/openapi/governance.yaml (REST surface)
//   - microservices/governance/contracts/asyncapi/governance-events.yaml (event surface)
//   - microservices/governance/sdk-plan.md (SDK roadmap)

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// =============================================================================
// Service: GovernanceQuery
// Read-side queries (Findings, lane runs, admission verdicts).
// =============================================================================

service GovernanceQuery {
  rpc ListLanes (ListLanesRequest) returns (ListLanesResponse);
  rpc GetLaneRun (GetLaneRunRequest) returns (LaneRun);
  rpc QueryLaneRuns (QueryLaneRunsRequest) returns (stream LaneRun);
  rpc GetFinding (GetFindingRequest) returns (Finding);
  rpc QueryFindings (QueryFindingsRequest) returns (stream Finding);
  rpc QueryAdmissionVerdict (AdmissionVerdictRequest) returns (AdmissionVerdict);
  rpc GetConformancePosture (GetConformancePostureRequest) returns (ConformancePosture);
  rpc ListBaselinePins (ListBaselinePinsRequest) returns (ListBaselinePinsResponse);
}

// =============================================================================
// Service: GovernanceEvidence
// Evidence + replay queries (auditor + tenant self-service).
// =============================================================================

service GovernanceEvidence {
  rpc GetEvidenceBlob (GetEvidenceBlobRequest) returns (stream EvidenceBlobChunk);
  rpc ExportEvidenceBundle (ExportRequest) returns (ExportTicket);
  rpc GetEvidenceExport (GetExportRequest) returns (stream ExportChunk);
  rpc VerifySignature (VerifySignatureRequest) returns (VerifySignatureResponse);
  rpc QueryAuditChainSeal (QueryAuditChainSealRequest) returns (AuditChainSeal);
}

// =============================================================================
// Service: GovernanceLaneRuntime
// Internal: lane registration + matrix dispatch.
// Not for tenant or external consumption.
// =============================================================================

service GovernanceLaneRuntime {
  rpc RegisterLane (RegisterLaneRequest) returns (RegisterLaneResponse);
  rpc DispatchLane (DispatchLaneRequest) returns (DispatchLaneResponse);
  rpc StreamLaneRunUpdates (StreamLaneRunUpdatesRequest) returns (stream LaneRun);
}

// =============================================================================
// Messages
// =============================================================================

message LaneSummary {
  string lane_id = 1;
  Severity severity = 2;
  string version = 3;
  google.protobuf.Timestamp registered_at = 4;
  string microservice_scope = 5;       // "all" | "per-microservice"
  string rule_pack_sha = 6;
}

message LaneRun {
  string run_id = 1;
  string lane_id = 2;
  string microservice = 3;
  string sha = 4;
  Verdict verdict = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Duration duration = 8;
  string runner_profile = 9;
  string runner_id = 10;
  int32 pr_number = 11;
}

message Finding {
  string finding_id = 1;
  string microservice = 2;
  string tenant_id = 3;
  string lane_id = 4;
  Severity severity = 5;
  string sha = 6;
  Citation citation = 7;
  string evidence_blob_id = 8;
  string view = 9;
  string signature = 10;
  string signed_by = 11;
  google.protobuf.Timestamp sealed_at = 12;
  string merkle_root = 13;
  string finding_hash = 14;
  google.protobuf.Timestamp created_at = 15;
  int32 pr_number = 16;
  string pr_author_subject = 17;
}

message Citation {
  string rule_id = 1;
  string file_line = 2;
  string industry_baseline = 3;
  string remediation_url = 4;
  string rule_pack_version = 5;
}

message AdmissionVerdict {
  int32 pr_number = 1;
  string target_branch = 2;
  AdmissionDecision decision = 3;
  int32 blocker_findings = 4;
  int32 warn_findings = 5;
  int32 info_findings = 6;
  int32 lanes_passed = 7;
  int32 lanes_failed = 8;
  int32 lanes_pending = 9;
  int32 lanes_total = 10;
  google.protobuf.Timestamp computed_at = 11;
  bool stale_replica = 12;
}

message ConformancePosture {
  string period = 1;
  repeated AxisPosture axes = 2;
}

message AxisPosture {
  Axis axis = 1;
  double pass_rate = 2;
  int32 total_lanes = 3;
  int32 passing_lanes = 4;
  google.protobuf.Timestamp published_at = 5;
}

message BaselinePin {
  Axis axis = 1;
  string baseline_name = 2;
  string source_url = 3;
  string pinned_sha = 4;
  google.protobuf.Timestamp effective_at = 5;
  string last_refresh_quarter = 6;
}

message EvidenceBlobChunk {
  bytes data = 1;
  bool last = 2;
  string blob_id = 3;
}

message ExportRequest {
  repeated string scope_microservices = 1;
  google.protobuf.Timestamp window_start = 2;
  google.protobuf.Timestamp window_end = 3;
  bool include_audit_view = 4;
  repeated string scope_packs = 5;
}

message ExportTicket {
  string ticket_id = 1;
  google.protobuf.Timestamp expected_ready_at = 2;
  int64 expected_size_bytes = 3;
}

message ExportChunk {
  bytes data = 1;
  bool last = 2;
  string ticket_id = 3;
}

message VerifySignatureRequest {
  oneof target {
    string finding_id = 1;
    string lane_run_id = 2;
  }
}

message VerifySignatureResponse {
  bool valid = 1;
  string signed_by = 2;
  google.protobuf.Timestamp signed_at = 3;
  string failure_reason = 4;
}

message AuditChainSeal {
  string seal_id = 1;
  string merkle_root = 2;
  google.protobuf.Timestamp sealed_at = 3;
  string scope_microservice = 4;
  repeated string sealed_finding_ids = 5;
}

// --- Internal ---

message RegisterLaneRequest {
  string lane_id = 1;
  string version = 2;
  Severity severity = 3;
  string rule_pack_sha = 4;
  string microservice_scope = 5;
}

message RegisterLaneResponse {
  bool registered = 1;
  string registration_id = 2;
}

message DispatchLaneRequest {
  string lane_id = 1;
  string microservice = 2;
  string sha = 3;
  int32 pr_number = 4;
  string runner_profile = 5;
}

message DispatchLaneResponse {
  string run_id = 1;
  google.protobuf.Timestamp dispatched_at = 2;
}

// --- Query request types ---

message ListLanesRequest {
  Severity severity_filter = 1;
  int32 limit = 2;
}

message ListLanesResponse {
  repeated LaneSummary lanes = 1;
}

message GetLaneRunRequest { string run_id = 1; }

message QueryLaneRunsRequest {
  string microservice = 1;
  google.protobuf.Timestamp window_start = 2;
  google.protobuf.Timestamp window_end = 3;
  string lane_id_filter = 4;
}

message GetFindingRequest { string finding_id = 1; }

message QueryFindingsRequest {
  string microservice = 1;
  Severity severity_filter = 2;
  google.protobuf.Timestamp window_start = 3;
  google.protobuf.Timestamp window_end = 4;
  string view = 5;
}

message AdmissionVerdictRequest {
  int32 pr_number = 1;
  string target_branch = 2;
}

message GetConformancePostureRequest {
  string period = 1;
}

message ListBaselinePinsRequest {
  Axis axis_filter = 1;
}

message ListBaselinePinsResponse {
  repeated BaselinePin pins = 1;
}

message GetEvidenceBlobRequest { string blob_id = 1; }

message GetExportRequest { string ticket_id = 1; }

message QueryAuditChainSealRequest {
  oneof target {
    string seal_id = 1;
    string finding_id = 2;
  }
}

message StreamLaneRunUpdatesRequest {
  int32 pr_number = 1;
}

// --- Enums ---

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_BLOCKER = 1;
  SEVERITY_WARN = 2;
  SEVERITY_INFO = 3;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_PASS = 1;
  VERDICT_FAIL = 2;
  VERDICT_ERROR = 3;
  VERDICT_SKIPPED = 4;
  VERDICT_TIMEOUT = 5;
}

enum AdmissionDecision {
  ADMISSION_UNSPECIFIED = 0;
  ADMISSION_ADMIT = 1;
  ADMISSION_REFUSE = 2;
  ADMISSION_PENDING = 3;
}

enum Axis {
  AXIS_UNSPECIFIED = 0;
  AXIS_PIPELINE = 1;
  AXIS_DIRECTORY = 2;
  AXIS_NAMING = 3;
  AXIS_STANDARDS = 4;
  AXIS_PRACTICES = 5;
  AXIS_POLICIES = 6;
}
