# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
# Authoring authority: ADR-0130 agentic SLO-gated promotion + ADR-0132 governance lane rename.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-gate-validate-latency
  displayName: "governance: gate validate latency p95 ≤ 5s (full repo)"
  labels:
    microservice: governance
    bounded_context: lane-runtime
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-governance
    pack_scope: all
spec:
  service: governance
  description: |
    Gate validate latency p95 SLO. A `oya-dev-cli gate validate` invocation
    is "good" when it completes the full 50-check-crate sweep across the
    repository in ≤ 5s p95. Required for PR-pipeline fitness checks to
    stay within admission-gate budget. Per PRD §"Performance Targets" +
    handoff #13 50 check crates target.
  indicator:
    metadata:
      name: governance-gate-validate-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_gate_validate_duration_seconds_bucket{le="5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_gate_validate_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 5s for 95% of full-repo validates over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
