# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-check-crate-availability
  displayName: "governance: check-crate availability 99.9% (per-crate)"
  labels:
    microservice: governance
    bounded_context: lane-runtime
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-governance
    pack_scope: all
spec:
  service: governance
  description: |
    Check-crate availability SLO. A check-crate invocation is "good" when
    it returns a Pass/Fail verdict (not a Panic/Timeout/CrashLoop). All
    50 check-crates contribute to this aggregate ratio. Per PRD §"Reliability"
    governance-lane authority requirement.
  indicator:
    metadata:
      name: governance-check-crate-verdict-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_check_crate_invocation_total{outcome=~"pass|fail"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_check_crate_invocation_total[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling check-crate availability ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
