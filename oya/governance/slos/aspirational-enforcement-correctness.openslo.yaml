# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-aspirational-enforcement-correctness
  displayName: "governance: aspirational-enforcement correctness 100% (load-bearing)"
  labels:
    microservice: governance
    bounded_context: policy-engine
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-governance + council-quality
    pack_scope: all
    invariant: INV-GOVERNANCE-ASPIRATIONAL-ENFORCEMENT
spec:
  service: governance
  description: |
    Aspirational enforcement correctness SLO. A check-crate is "good" when
    its declared lean-a-N policy actually fails on a known-bad fixture AND
    passes on a known-good fixture (honesty test). Per ADR-0073 dishonest-
    aspirational-validator ban. Target = 100% (any miss is Sev-2 — a check-
    crate is silently broken).
  indicator:
    metadata:
      name: governance-aspirational-honesty-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_aspirational_honesty_test_total{outcome="honest"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_aspirational_honesty_test_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% aspirational-validator honesty (any miss is Sev-2 broken validator)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
