apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-read-latency
  labels:
    service: financial-planning
    adr: ADR-0139
spec:
  service: financial-planning
  indicator:
    metadata:
      name: read-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_read_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_read_latency_total[5m]))
  objectives:
    - displayName: Financial Planning read-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
