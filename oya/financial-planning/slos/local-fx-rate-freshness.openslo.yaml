apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-fx-rate-freshness
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: financial-planning
  description: FX rates refreshed for active planning scenarios for budget locking, forecast recalculation, variance explanation, close-cycle workflow, FX rate, and board-report operations.
  indicator:
    metadata:
      name: fx-rate-freshness
      labels:
        domain_object: PlanningCycle
        operator_audience: FPNA_CONTROLLER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_fx_rate_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_fx_rate_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: FX rates refreshed for active planning scenarios
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
