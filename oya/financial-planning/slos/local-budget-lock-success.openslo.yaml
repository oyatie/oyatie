apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-budget-lock-success
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: financial-planning
  description: Budget lock operations complete with controller evidence for budget locking, forecast recalculation, variance explanation, close-cycle workflow, FX rate, and board-report operations.
  indicator:
    metadata:
      name: budget-lock-success
      labels:
        domain_object: PlanningCycle
        operator_audience: FPNA_CONTROLLER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_budget_lock_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_budget_lock_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Budget lock operations complete with controller evidence
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
