apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-availability
  labels:
    service: financial-planning
    adr: ADR-0139
spec:
  service: financial-planning
  indicator:
    metadata:
      name: availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_availability_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_availability_total[5m]))
  objectives:
    - displayName: Financial Planning availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
