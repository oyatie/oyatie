apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-board-report-seal-completeness
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: financial-planning
  description: Board reports sealed with lineage evidence for budget locking, forecast recalculation, variance explanation, close-cycle workflow, FX rate, and board-report operations.
  indicator:
    metadata:
      name: board-report-seal-completeness
      labels:
        domain_object: PlanningCycle
        operator_audience: FPNA_CONTROLLER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_board_report_seal_completeness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_board_report_seal_completeness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Board reports sealed with lineage evidence
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
