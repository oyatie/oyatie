// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.financial_planning.v1;

message FinancialPlanningActionRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string purpose = 3;
  string data_class = 4;
  string deal_set_id = 5;
}

message FinancialPlanningActionAccepted {
  string audit_event_class = 1;
  string workflow_run_id = 2;
  string ontology_object_ref = 3;
}

service FinancialPlanningService {
  rpc InvokeAction(FinancialPlanningActionRequest) returns (FinancialPlanningActionAccepted);
}
