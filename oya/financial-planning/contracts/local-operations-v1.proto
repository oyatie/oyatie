// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.financial_planning.local.v1;

message FinancialPlanningLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message FinancialPlanningLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message FinancialPlanningLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message FinancialPlanningLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message FinancialPlanningSupportedActions {
  string budget_lock_action = 1;
  string forecast_recalculate_action = 2;
  string variance_explain_action = 3;
  string close_cycle_advance_action = 4;
  string fx_rate_backfill_action = 5;
  string board_report_seal_action = 6;
}

service FinancialPlanningLocalOperationsService {
  rpc CheckLocalPolicy(FinancialPlanningLocalPolicyCheckRequest) returns (FinancialPlanningLocalPolicyDecision);
  rpc GetLocalSloState(FinancialPlanningLocalSloStateRequest) returns (FinancialPlanningLocalSloState);
}
