apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: financial-planning-local-ops
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: financial-planning
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_financial_planning_close_cycle_latency_good_total
    - oya_financial_planning_forecast_recalc_latency_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-budget-lock-control.cedar
