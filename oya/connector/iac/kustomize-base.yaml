# Kustomize base — connector microservice
# Binding ADR: ADR-0254 (K8s + Cloud Hypervisor deployment), ADR-0248 (cellular architecture)
# Covers Tier-2/3 cell deployment base; overlays per cell in iac/overlays/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: connector

commonLabels:
  app.kubernetes.io/part-of: connector
  app.kubernetes.io/managed-by: kustomize
  oya.io/microservice: connector
  oya.io/cell-tier: "3"

resources:
  - helm-values-connector.yaml
  - network-policy.yaml
  - spiffe-workload-identity.yaml
  - external-secret.yaml
  - ingress-production.yaml
  - openbao-policy.hcl

configMapGenerator:
  - name: connector-adapter-config
    literals:
      - REPLAY_WINDOW_SECONDS=300
      - CIRCUIT_BREAKER_THRESHOLD=0.5
      - CIRCUIT_BREAKER_WINDOW_SECONDS=300
      - ACCESS_TOKEN_TTL_SECONDS=60
      - POLICY_EVAL_MODE=library-first
      - ONTOLOGY_READ_MODE=library-first
      - ONTOLOGY_FRESHNESS_FLOOR_SECONDS=5
      - INTELLIGENCE_CALL_MODE=library-first
      - HTTP3_ENABLED=true
      - ECH_ENABLED=true
      - PQC_HYBRID_ENABLED=true

patches:
  # Kata runtime class on adapter-worker per ADR-0254
  - patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata-qemu
    target:
      kind: Deployment
      name: connector-connector-adapter-worker
