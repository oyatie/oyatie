# SPIFFE Workload Identity — connector microservice
# Binding ADR: ADR-0295 (bootstrap CI SPIFFE + kill-switch), ADR-0296 (sidecar isolation)
# Every connector component workload gets a SPIFFE SVID from the cluster SPIRE server
# Hyperscaler precedent: AWS SPIFFE/SPIRE deployment; Istio workload identity

apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connector-connector-catalog-rest
spec:
  spiffeIDTemplate: "spiffe://oyatie.dev/ns/connector/sa/connector-connector-catalog-rest"
  podSelector:
    matchLabels:
      app: connector-connector-catalog-rest
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connector
  ttl: 1h
  dnsNameTemplates:
    - "connector-connector-catalog-rest.connector.svc.cluster.local"
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connector-oauth-broker-rest
spec:
  spiffeIDTemplate: "spiffe://oyatie.dev/ns/connector/sa/connector-oauth-broker-rest"
  podSelector:
    matchLabels:
      app: connector-oauth-broker-rest
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connector
  ttl: 1h
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connector-webhook-receiver-edge
spec:
  spiffeIDTemplate: "spiffe://oyatie.dev/ns/connector/sa/connector-webhook-receiver-edge"
  podSelector:
    matchLabels:
      app: connector-webhook-receiver-edge
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connector
  ttl: 1h
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connector-connector-adapter-worker
  annotations:
    note: "Kata-isolated pod; SVID bound to Kata VM identity, not host kernel"
spec:
  spiffeIDTemplate: "spiffe://oyatie.dev/ns/connector/sa/connector-connector-adapter-worker"
  podSelector:
    matchLabels:
      app: connector-connector-adapter-worker
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connector
  ttl: 1h
---
# Kill-switch: annotate namespace to revoke all SVIDs in <30s
# kubectl annotate ns connector oya.kill-switch=true
# This triggers SPIRE to rotate all SVIDs to a revoked state per ADR-0295
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-kill-switch-config
  namespace: connector
  annotations:
    description: "Kill-switch config for SPIFFE SVID revocation per ADR-0295"
data:
  kill_switch_enabled: "false"
  kill_switch_revocation_reason: ""
  # When set to true by ops-sre: SPIRE rotates all connector SVIDs; connector activity halts in <30s
