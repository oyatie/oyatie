asyncapi: 3.1.0
info:
  title: Retirement Events
  version: 0.1.0
channels:
  connectorRetirementEvents:
    address: oya.connector.retirement.events
    messages:
      statusChanged:
        $ref: '#/components/messages/RetirementStatusChanged'
operations:
  publishConnectorRetirementStatus:
    action: send
    channel:
      $ref: '#/channels/connectorRetirementEvents'
components:
  messages:
    RetirementStatusChanged:
      payload:
        type: object
        required: [status, service_id, evidence_ref]
        properties:
          status:
            type: string
          service_id:
            type: string
          evidence_ref:
            type: string
