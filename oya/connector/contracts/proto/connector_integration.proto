// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

// connector service — Integration Substrate gRPC contract
// Per ADR-0632: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3.
// Per ADR-0263 audit-event emission contract.

package oyatie.connector.v1;

option go_package = "oyatie/connect/v1;connectv1";
option java_package = "app.oyatie.connector.v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// ConnectorCatalogService
// =============================================================================

service ConnectorCatalogService {
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse);
  rpc GetConnectorDetail(GetConnectorDetailRequest) returns (ConnectorDetail);
}

message SearchCatalogRequest {
  string query = 1;
  string category = 2;
  string pack = 3;
  int32 page_size = 4;
  string cursor = 5;
}

message SearchCatalogResponse {
  repeated ConnectorSummary items = 1;
  string next_cursor = 2;
}

message ConnectorSummary {
  string connector_id = 1;
  string name = 2;
  string vendor = 3;
  string category = 4;
  string version = 5;
  repeated string compliance_packs = 6;
  string deprecation_status = 7;  // active | deprecated | yanked
}

message GetConnectorDetailRequest {
  string connector_id = 1;
}

message ConnectorDetail {
  ConnectorSummary summary = 1;
  repeated ConnectorAction actions = 2;
  repeated ConnectorTrigger triggers = 3;
  string auth_model = 4;
  google.protobuf.Struct rate_limit_profile = 5;
  repeated string data_classes_touched = 6;
}

message ConnectorAction {
  string name = 1;
  string description = 2;
  repeated string scopes_required = 3;
}

message ConnectorTrigger {
  string name = 1;
  string description = 2;
  string transport = 3;  // webhook | poll | streaming
}

// =============================================================================
// OAuthBrokerService
// =============================================================================

service OAuthBrokerService {
  rpc InitiateGrant(InitiateGrantRequest) returns (InitiateGrantResponse);
  rpc GetGrant(GetGrantRequest) returns (OAuthGrantMetadata);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
}

message InitiateGrantRequest {
  string connector_id = 1;
  repeated string scopes = 2;
  string redirect_uri = 3;
  string client_id_ref = 4;  // OpenBao SecretReference for provider-credential BYOK OAuth client (ADR-0255 §D-4)
}

message InitiateGrantResponse {
  string authorization_url = 1;
  string state = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetGrantRequest {
  string grant_id = 1;
}

message OAuthGrantMetadata {
  string grant_id = 1;
  string connector_id = 2;
  string tenant_id = 3;
  repeated string scopes = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  string status = 7;  // ACTIVE | REVOKED | EXPIRED
  string provider_credential_mode = 8;  // byok | oyatie_shared
}

message RevokeGrantRequest {
  string grant_id = 1;
  string step_up_auth_token = 2;
}

message RevokeGrantResponse {
  string status = 1;
}

// =============================================================================
// ConnectorActionService
// =============================================================================

service ConnectorActionService {
  rpc InvokeAction(InvokeActionRequest) returns (InvokeActionResponse);
}

message InvokeActionRequest {
  string grant_id = 1;
  string action = 2;
  google.protobuf.Struct args = 3;
  string idempotency_key = 4;
}

message InvokeActionResponse {
  string outcome = 1;  // success | vendor_error | rate_limited | circuit_open | timeout
  google.protobuf.Struct vendor_response = 2;
  int32 latency_ms = 3;
}

// =============================================================================
// WebhookEndpointService
// =============================================================================

service WebhookEndpointService {
  rpc RegisterEndpoint(RegisterEndpointRequest) returns (RegisterEndpointResponse);
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
}

message RegisterEndpointRequest {
  string connector_id = 1;
  string wiring_id = 2;
}

message RegisterEndpointResponse {
  string endpoint_id = 1;
  string webhook_url = 2;
  string signing_secret_ref = 3;  // OpenBao SecretReference (never raw)
}

message RotateSecretRequest {
  string endpoint_id = 1;
  string step_up_auth_token = 2;
  int32 grace_seconds = 3;
}

message RotateSecretResponse {
  string new_signing_secret_ref = 1;
  google.protobuf.Timestamp old_secret_valid_until = 2;
}

// =============================================================================
// DLQService
// =============================================================================

service DLQService {
  rpc ListEntries(ListDLQRequest) returns (ListDLQResponse);
  rpc ReplayEntry(ReplayDLQRequest) returns (ReplayDLQResponse);
}

message ListDLQRequest {
  string wiring_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

message ListDLQResponse {
  repeated DLQEntry entries = 1;
  string next_cursor = 2;
}

message DLQEntry {
  string entry_id = 1;
  string wiring_id = 2;
  string error_class = 3;
  google.protobuf.Timestamp last_tried_at = 4;
  int32 retry_count = 5;
  string payload_digest = 6;
}

message ReplayDLQRequest {
  string entry_id = 1;
}

message ReplayDLQResponse {
  string status = 1;
}
