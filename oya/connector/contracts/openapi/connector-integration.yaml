openapi: 3.2.0
info:
  title: connector — Integration Substrate REST API
  version: 0.2.0
  description: |
    REST surface for the connect integration substrate.
    Covers: catalog browse, OAuth grant lifecycle, webhook endpoint management,
    connector action invocation (server-to-server), DLQ inspection + replay,
    schema-drift detection.

    Authorization: OIDC bearer (tenant principal) + `X-Scope-OrgID` (tenant_id).
    Cedar policy gates every endpoint per `policy/*.cedar`.

    Transport: HTTP/3 + QUIC default per ADR-0253; HTTP/2 + HTTP/1.1 fallback.
    ECH advertised on every response (`HTTPS RR + Alt-Svc: h3=":443"`).
    PQC hybrid `X25519MLKEM768` advertised.
  contact:
    name: axis-integration
    email: axis-integration@oyatie.app
  license:
    name: oyatie-proprietary
  x-oya-related-adrs: [ADR-0145, ADR-0246, ADR-0253, ADR-0255, ADR-0258, ADR-0263, ADR-0297]

servers:
  - url: https://api.{tenant}.oyatie.app/connect/v1
    variables:
      tenant:
        default: example
        description: Tenant subdomain per ADR-0273

security:
  - oidcBearer: []
  - tenantScope: []

tags:
  - name: catalog
  - name: oauth-broker
  - name: webhook-endpoints
  - name: actions
  - name: dlq
  - name: schema-drift

paths:
  /catalog/connectors:
    get:
      tags: [catalog]
      summary: Search connector catalog
      operationId: searchCatalog
      parameters:
        - name: q
          in: query
          schema: {type: string}
          description: Search query (matches name, description, vendor)
        - name: category
          in: query
          schema:
            type: string
            enum: [crm, comms, payments, cloud, analytics, ai, storage, social, all]
        - name: pack
          in: query
          schema: {type: string}
          description: Filter by compliance pack eligibility
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCatalogPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /catalog/connectors/{connector_id}:
    get:
      tags: [catalog]
      summary: Get connector detail
      operationId: getConnectorDetail
      parameters:
        - name: connector_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectorDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /oauth/grants/initiate:
    post:
      tags: [oauth-broker]
      summary: Initiate OAuth grant flow (returns authorization URL)
      operationId: initiateOAuthGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector_id, scopes]
              properties:
                connector_id: {type: string}
                scopes: {type: array, items: {type: string}}
                redirect_uri: {type: string, format: uri}
                client_id_ref:
                  type: string
                  description: "OpenBao SecretReference for provider-credential BYOK OAuth client (optional; falls back to oyatie shared; ADR-0255 §D-4)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state, expires_at]
                properties:
                  authorization_url: {type: string, format: uri}
                  state: {type: string}
                  expires_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Forbidden'}

  /oauth/grants/callback:
    get:
      tags: [oauth-broker]
      summary: OAuth callback (vendor → broker)
      operationId: oauthCallback
      parameters:
        - name: code
          in: query
          schema: {type: string}
        - name: state
          in: query
          required: true
          schema: {type: string}
      responses:
        '302':
          description: Redirect back to workflow-studio with grant_id
        '400': {$ref: '#/components/responses/BadRequest'}

  /oauth/grants/{grant_id}:
    get:
      tags: [oauth-broker]
      summary: Get OAuth grant metadata
      operationId: getOAuthGrant
      parameters: [{name: grant_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthGrantMetadata'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [oauth-broker]
      summary: Revoke OAuth grant
      operationId: revokeOAuthGrant
      parameters:
        - {name: grant_id, in: path, required: true, schema: {type: string}}
        - name: X-Step-Up-Auth
          in: header
          required: true
          schema: {type: string}
          description: Step-up auth token (WebAuthn passkey)
      responses:
        '202': {description: Revocation initiated}
        '403': {$ref: '#/components/responses/Forbidden'}

  /webhook-endpoints:
    post:
      tags: [webhook-endpoints]
      summary: Register webhook endpoint
      operationId: registerWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector_id, wiring_id]
              properties:
                connector_id: {type: string}
                wiring_id: {type: string}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint_id: {type: string}
                  webhook_url: {type: string, format: uri}
                  signing_secret_ref:
                    type: string
                    description: "OpenBao SecretReference (substrate never returns raw secret)"

  /webhook-endpoints/{endpoint_id}/rotate-secret:
    post:
      tags: [webhook-endpoints]
      summary: Rotate webhook signing secret (5min grace window)
      operationId: rotateWebhookSecret
      parameters:
        - {name: endpoint_id, in: path, required: true, schema: {type: string}}
        - name: X-Step-Up-Auth
          in: header
          required: true
          schema: {type: string}
      responses:
        '202': {description: Rotation initiated}

  /actions/invoke:
    post:
      tags: [actions]
      summary: Invoke a connector action (server-to-server, typically called by workflow-engine)
      operationId: invokeAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_id, action, args]
              properties:
                grant_id: {type: string}
                action: {type: string, description: "e.g., slack.chat.postMessage"}
                args: {type: object, additionalProperties: true}
                idempotency_key: {type: string}
      responses:
        '200':
          description: OK (vendor response canonicalized)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: Circuit-breaker open}

  /dlq:
    get:
      tags: [dlq]
      summary: List DLQ entries
      operationId: listDLQ
      parameters:
        - {name: wiring_id, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DLQPage'}

  /dlq/{entry_id}/replay:
    post:
      tags: [dlq]
      summary: Replay a DLQ entry (idempotency-key preserved)
      operationId: replayDLQEntry
      parameters: [{name: entry_id, in: path, required: true, schema: {type: string}}]
      responses:
        '202': {description: Replay initiated}

  /schema-drift/{wiring_id}:
    get:
      tags: [schema-drift]
      summary: Get detected schema-drift events for a wiring
      operationId: getSchemaDrift
      parameters: [{name: wiring_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchemaDriftReport'}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: connector
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - cloud-ci-brand-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0515:
        purpose: >-
          Declare GitHub Actions plus branch protection as live CI authority until explicit owned-runner cutover, with cloud-ci producing the single protected `oya-ci-required` context.
        enforced_by:
          - oya-ci-required
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-ci-required
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantScope:
      type: apiKey
      in: header
      name: X-Scope-OrgID

  schemas:
    ConnectorCatalogPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ConnectorSummary'}
        next_cursor: {type: string}
    ConnectorSummary:
      type: object
      required: [connector_id, name, vendor, category, compliance_packs]
      properties:
        connector_id: {type: string}
        name: {type: string}
        vendor: {type: string}
        category: {type: string}
        version: {type: string}
        compliance_packs: {type: array, items: {type: string}}
        deprecation_status:
          type: string
          enum: [active, deprecated, yanked]
    ConnectorDetail:
      allOf:
        - $ref: '#/components/schemas/ConnectorSummary'
        - type: object
          properties:
            actions:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  description: {type: string}
                  scopes_required: {type: array, items: {type: string}}
            triggers: {type: array, items: {type: object}}
            auth_model:
              type: string
              enum: [oauth-2-authorization-code, oauth-2-client-credentials, jwt-bearer, api-key, basic, none]
            rate_limit_profile: {type: object, additionalProperties: true}
            data_classes_touched: {type: array, items: {type: string}}
    OAuthGrantMetadata:
      type: object
      properties:
        grant_id: {type: string}
        connector_id: {type: string}
        tenant_id: {type: string}
        scopes: {type: array, items: {type: string}}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
        provider_credential_mode:
          type: string
          enum: [byok, oyatie_shared]
    DLQPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              entry_id: {type: string}
              wiring_id: {type: string}
              error_class: {type: string}
              last_tried_at: {type: string, format: date-time}
              retry_count: {type: integer}
              payload_digest: {type: string, description: "SHA-256 of payload (full payload requires step-up auth)"}
        next_cursor: {type: string}
    SchemaDriftReport:
      type: object
      properties:
        wiring_id: {type: string}
        events:
          type: array
          items:
            type: object
            properties:
              detected_at: {type: string, format: date-time}
              field_path: {type: string}
              change_class:
                type: string
                enum: [additive, rename, deletion, type-change]
              auto_resolved: {type: boolean}

  responses:
    Unauthorized:
      description: Missing or invalid OIDC bearer
    Forbidden:
      description: Cedar policy denied
    NotFound:
      description: Resource not found
    BadRequest:
      description: Malformed request
    RateLimited:
      description: Per-tenant or per-route rate-limit
      headers:
        Retry-After:
          schema: {type: integer}
