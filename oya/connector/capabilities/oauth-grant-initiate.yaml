# Canonical-base: specs/capabilities/canonical-tier-schema.json (per ADR-0064)
id: cap:connect:oauth-grant-initiate:v1
name: oauth-grant-initiate
namespace: connector
display_name: Initiate OAuth 2.0 Authorization Grant
description: |
  Initiate an OAuth 2.0 authorization code flow for a tenant-connector pair.
  Generates a CSRF-safe state nonce, builds the vendor authorization URL using
  the tenant's provider-credential BYOK client credentials (per ADR-0255 §D-4), and returns the
  redirect URL. The nonce is stored in OpenBao with a 10-minute TTL.
  Supports Authorization Code (RFC 6749), PKCE (RFC 7636), and client-credentials flows.
  Precedent: Stripe OAuth flow; Auth0 authorization code + PKCE.

owner_team: axis-integration
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0243, ADR-0244, ADR-0246, ADR-0253, ADR-0255, ADR-0263, ADR-0296]
related_artifacts:
  - microservices/connector/PRD.md
  - microservices/connector/contracts/openapi/connector-integration.yaml
  - microservices/connector/policy/oauth-broker-authorization.cedar

autonomy_tier: T3
# T3: initiates external OAuth redirect that results in credential issuance;
# high-trust action requiring explicit Cedar permit per ADR-0243.

inputs:
  - name: tenant_id
    type: string
    format: uuid-v7
    required: true
  - name: connector_name
    type: string
    required: true
  - name: principal_id
    type: string
    description: The tenant principal requesting the grant
    required: true
  - name: scopes
    type: array
    items: { type: string }
    description: OAuth scopes requested
    required: true
  - name: redirect_uri
    type: string
    format: uri
    required: true
  - name: flow_type
    type: enum
    values: [authorization_code, pkce, client_credentials]
    default: pkce
    required: false

outputs:
  - name: authorization_url
    type: string
    format: uri
    description: Vendor authorization URL for user redirect
  - name: state_nonce
    type: string
    description: CSRF-safe nonce (opaque; stored server-side; not exposed to client)
  - name: grant_id
    type: string
    format: uuid-v7

data_classes_touched:
  - TENANT_OAUTH_CLIENT_CREDENTIAL_REF
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-jp

evidence_topic: oya.connector.oauth.grant.initiated

cost_profile:
  type: per-grant-initiation
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - OpenBao read for provider-credential BYOK client_id (ADR-0255 §D-4)
    - State nonce write (OpenBao KV, 10m TTL)

cedar_policy_fragments:
  - microservices/connector/policy/oauth-broker-authorization.cedar

sunset:
  status: none
  notes: ""
