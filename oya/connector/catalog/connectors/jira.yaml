name: jira
display_name: Jira (Atlassian)
category: project-management
publisher_namespace: oyatie
version: "2.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create, update, and search Jira issues; manage sprints and boards via Jira REST API v3.
  Receive real-time issue and project events via Jira Webhooks.
  Hyperscaler precedent: Atlassian Marketplace (5000+ apps); Workato Jira connector.

auth:
  flows: [oauth2_pkce, api_token_byok]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [jira:issue_created, jira:issue_updated, sprint_started, sprint_closed]

rate_limit:
  tier: standard
  requests_per_second: 10
  burst: 50

actions:
  - name: createIssue
    description: Create a new Jira issue
    data_classes: [INTERNAL_ONLY]
  - name: updateIssue
    description: Update issue fields or transition status
    data_classes: [INTERNAL_ONLY]
  - name: searchIssues
    description: JQL-based issue search
    data_classes: [INTERNAL_ONLY]
  - name: addComment
    description: Add a comment to an issue
    data_classes: [INTERNAL_ONLY]
  - name: assignIssue
    description: Assign an issue to a user
    data_classes: [PII_EMAIL]

compliance:
  pii_fields: [issue.fields.assignee.emailAddress, issue.fields.reporter.emailAddress]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
