name: segment
display_name: Segment (Twilio)
category: analytics
publisher_namespace: oyatie
version: "1.4.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Track events, identify users, and manage audiences via Segment Tracking API v1,
  Config API, and Profile API. Receive audience membership changes via Segment
  Webhooks (Destination Functions).
  Hyperscaler precedent: Segment (used by 25,000+ companies for CDP).

auth:
  flows: [api_key_byok, oauth2_pkce]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [track, identify, group, audience.entered, audience.exited]

rate_limit:
  tier: high
  requests_per_second: 1000
  burst: 2000

actions:
  - name: trackEvent
    description: Track an analytics event for a user or anonymous actor
    data_classes: [BEHAVIORAL_ANALYTICS, PII_ADJACENT]
  - name: identifyUser
    description: Identify a user with traits
    data_classes: [PII_EMAIL, PII_PHONE, BEHAVIORAL_ANALYTICS]
  - name: groupUser
    description: Associate a user with a group (company)
    data_classes: [BEHAVIORAL_ANALYTICS]
  - name: queryProfile
    description: Query a user's computed profile traits
    data_classes: [PII_EMAIL, BEHAVIORAL_ANALYTICS]

compliance:
  pii_fields: [traits.email, traits.phone, traits.name, context.ip]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br]
  gdpr_schrems_ii_mechanism: scc
  ccpa_opt_out_honored: true
  behavioral_analytics_consent_required: true

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
