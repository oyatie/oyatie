name: pagerduty
display_name: PagerDuty
category: incident-management
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Trigger, acknowledge, and resolve PagerDuty incidents; manage on-call schedules
  and escalation policies via PagerDuty Events API v2 and REST API v2.
  Hyperscaler precedent: AWS CloudWatch + PagerDuty integration (industry standard).
  LIFE-SAFETY: PagerDuty incident trigger MUST NEVER be throttled, rate-limited,
  or failed silently. Per §3.2.5 row 1 (emergency services) and §3.2.3 LIFE-SAFETY
  HARD RULE. This connector is EMERGENCY_SERVICES class.

auth:
  flows: [api_key_byok, oauth2_pkce]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [incident.triggered, incident.acknowledged, incident.resolved, incident.escalated]

rate_limit:
  tier: emergency_services
  requests_per_minute: unlimited_for_trigger
  note: "Event trigger endpoint has no rate limit per PagerDuty SLA. Receive-side throttle applies to list/status endpoints only."
  emergency_services_bypass: true

actions:
  - name: triggerIncident
    description: Trigger a new PagerDuty incident (EMERGENCY_SERVICES class — NEVER throttled)
    data_classes: [INCIDENT_METADATA]
    emergency_services_class: true
  - name: acknowledgeIncident
    description: Acknowledge an open incident
    data_classes: [INCIDENT_METADATA]
  - name: resolveIncident
    description: Resolve an open incident
    data_classes: [INCIDENT_METADATA]
  - name: listOnCallUsers
    description: List users currently on-call for a schedule
    data_classes: [PII_EMAIL, PII_PHONE]
  - name: createMaintenanceWindow
    description: Create a maintenance window to suppress alerts
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [incident.body.details.user_email, oncall.user.email, oncall.user.phone]
  pii_excluded_from_dlq: false
  note: "DLQ retention is critical for PagerDuty — incidents must NOT be silently dropped; alert on DLQ depth > 0 for this connector"
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

critical_path:
  emergency_services: true
  life_safety_class: true
  never_throttle: true
  never_challenge: true
  dlq_alert_threshold: 0
  note: "A failed PagerDuty trigger is a potential life-safety failure. Circuit breaker MUST alert at open state, not just log. SRE on-call MUST be paged by a secondary channel."
  secondary_alert_channel: ops-sre-oncall-slack

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
