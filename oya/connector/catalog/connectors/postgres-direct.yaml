name: postgres-direct
display_name: PostgreSQL (Direct)
category: databases
publisher_namespace: oyatie
version: "1.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Execute SQL queries, insert rows, and receive LISTEN/NOTIFY events against a
  tenant-managed PostgreSQL instance. Uses per-tenant connection pool with
  OpenBao-managed credentials (≤60s TTL per ADR-0296).
  Hyperscaler precedent: Fivetran Postgres connector; Airbyte Postgres source.

auth:
  flows: [db_credentials_byok]
  token_rotation: false
  credential_rotation_recommended_days: 90

webhook:
  supported: true
  method: postgres_listen_notify
  signing_algorithm: none
  note: "LISTEN/NOTIFY polling; no HTTP webhook; replay-window enforced at application level"

rate_limit:
  tier: configurable
  note: "Rate limit determined by tenant's Postgres instance capacity; connect enforces per-connection pool size"

actions:
  - name: executeQuery
    description: Execute a parameterized SELECT query (read-only by default)
    data_classes: [TENANT_DATABASE_CONTENT]
  - name: executeInsert
    description: Execute a parameterized INSERT statement
    data_classes: [TENANT_DATABASE_CONTENT]
  - name: executeUpsert
    description: Execute INSERT ... ON CONFLICT DO UPDATE
    data_classes: [TENANT_DATABASE_CONTENT]
  - name: listenNotify
    description: Listen on a Postgres channel for NOTIFY events
    data_classes: [TENANT_DATABASE_CONTENT]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  note: "Tenant is responsible for PII classification of their own database content; DLP hook applies"

data_residency:
  vendor_data_region: tenant_controlled
  cross_border_transfer_ok: tenant_controlled
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
