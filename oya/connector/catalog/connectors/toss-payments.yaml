name: toss-payments
display_name: Toss Payments (토스페이먼츠)
category: payments
publisher_namespace: oyatie
version: "1.5.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Process Korean domestic payments, manage refunds, query transaction history,
  and receive payment event webhooks via Toss Payments API v2.
  Hyperscaler precedent: Toss Payments (dominant KR payment gateway, 50M+ users).
  pack-kr required: KR-FSS (금융감독원) AML reporting + KISA ISMS-P security controls.

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90
  api_key_format: Basic base64(client_key:)

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [payment.done, payment.canceled, payment.partial_canceled, billing.key.issued]

rate_limit:
  tier: standard
  requests_per_second: 100
  burst: 200

actions:
  - name: confirmPayment
    description: Confirm a Toss Payments payment by payment key
    data_classes: [FINANCIAL_TRANSACTION, PII_PHONE]
  - name: cancelPayment
    description: Cancel (refund) a payment
    data_classes: [FINANCIAL_TRANSACTION]
  - name: queryPayment
    description: Query payment status by paymentKey or orderId
    data_classes: [FINANCIAL_TRANSACTION]
  - name: issueBillingKey
    description: Issue a billing key for recurring payments
    data_classes: [FINANCIAL_TRANSACTION, PII_PHONE]

compliance:
  pii_fields: [customerName, customerEmail, customerMobilePhone]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-kr]
  kr_fss_aml_reporting: required
  kr_isms_p: required
  gdpr_schrems_ii_mechanism: not_applicable
  note: "pack-kr mandatory; pack-eu/us cannot activate this connector by default (KR domestic only)"

data_residency:
  vendor_data_region: kr
  cross_border_transfer_ok: false
  kr_domestic_only: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
