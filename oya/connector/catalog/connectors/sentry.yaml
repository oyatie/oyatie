name: sentry
display_name: Sentry
category: observability
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage Sentry projects, issues, and releases via Sentry REST API v0.
  Receive real-time error event notifications via Sentry Webhooks.
  Hyperscaler precedent: Sentry's own GitHub/Jira/Slack integrations.

auth:
  flows: [api_key_byok, oauth2_pkce]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [issue.created, issue.resolved, issue.assigned, event.alert]

rate_limit:
  tier: standard
  requests_per_second: 50
  burst: 100

actions:
  - name: createIssue
    description: Programmatically create a Sentry issue
    data_classes: [INTERNAL_ONLY]
  - name: resolveIssue
    description: Mark an issue as resolved
    data_classes: [INTERNAL_ONLY]
  - name: assignIssue
    description: Assign an issue to a team member
    data_classes: [PII_EMAIL]
  - name: createRelease
    description: Create a new release for source-map upload
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [event.user.email, event.user.ip_address]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
