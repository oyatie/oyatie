name: sendgrid
display_name: SendGrid (Twilio)
category: email
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send transactional and marketing emails, manage suppression lists, and receive
  delivery events via SendGrid Web API v3 and Event Webhooks.
  Hyperscaler precedent: Twilio SendGrid (10B+ emails/month).

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: ecdsa-sha256
  replay_window_seconds: 300
  events: [delivered, bounce, open, click, unsubscribe, spam_report]

rate_limit:
  tier: high
  requests_per_second: 600
  burst: 1000

actions:
  - name: sendEmail
    description: Send a transactional email
    data_classes: [PII_EMAIL, MARKETING_CONTENT]
  - name: addToSuppressionList
    description: Add an email to the global suppression/unsubscribe list
    data_classes: [PII_EMAIL]
  - name: createTemplate
    description: Create a dynamic transactional email template
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [to.email, from.email, personalizations[].to[].email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc
  unsubscribe_honor: mandatory

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
