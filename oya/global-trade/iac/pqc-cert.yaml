apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-global-trade-pqc
spec:
  secretName: oya-global-trade-tls
  commonName: global-trade.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
