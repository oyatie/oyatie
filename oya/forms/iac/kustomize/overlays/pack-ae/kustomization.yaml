# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-ae overlay (per data-residency.md; OCI me-abudhabi-1 + me-dubai-1 DR; UAE PDPL).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-ae
      - REGION=me-abudhabi-1
      - DR_REGION=me-dubai-1
      - JURISDICTION=ae
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.me-abudhabi-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=ae-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-ae/kek
      - CDN_EDGE_REGION=me-abudhabi-1
      - HIPAA_BAA_ELIGIBLE=false
      - UAE_PDPL_BREACH_NOTIFY_HOURS=72
      - RTL_LOCALE_DEFAULT=ar-AE
