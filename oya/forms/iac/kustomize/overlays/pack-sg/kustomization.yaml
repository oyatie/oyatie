# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-sg overlay (per data-residency.md; OCI ap-singapore-1 single-region; PDPA).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-sg
      - REGION=ap-singapore-1
      - JURISDICTION=sg
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-singapore-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=sg-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-sg/kek
      - CDN_EDGE_REGION=ap-singapore-1
      - HIPAA_BAA_ELIGIBLE=false
      - PDPA_DNC_HONOUR=enabled
