# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
valkey:
  image:
    tag: "7.2.5"  # LTS pin
  sentinel:
    enabled: true
    replicas: 3
  primary:
    replicas: 1
    resources:
      requests: {cpu: 2, memory: 8Gi}
      limits: {cpu: 4, memory: 16Gi}
  replica:
    replicas: 2
  config:
    maxmemory: 12gb
    maxmemory-policy: "allkeys-lru"
    appendonly: "no"  # rate-limit + session are regenerable
auth:
  secretRef: "${openbao:secret/forms/valkey/auth-token}"
networkPolicy:
  enabled: true
  ingress:
    - from: forms.forms.svc.cluster.local
      ports: [6379, 26379]
monitoring:
  enabled: true
