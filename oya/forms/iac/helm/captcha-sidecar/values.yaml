# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
providers:
  hcaptcha:
    enabled: true
    sdk_version: "1"  # LTS line
    secretRef: "${openbao:secret/forms/captcha/hcaptcha-secret}"
    endpoint: "https://api.hcaptcha.com/siteverify"
  turnstile:
    enabled: true
    sdk_version: "0"
    secretRef: "${openbao:secret/forms/captcha/turnstile-secret}"
    endpoint: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
  friendly_captcha:
    enabled: true
    sdk_version: "1"
    secretRef: "${openbao:secret/forms/captcha/friendly-captcha-secret}"
    endpoint: "https://api.friendlycaptcha.com/api/v1/siteverify"
  recaptcha:
    enabled: false
    forbidden_in_packs: [pack-eu, pack-kr, pack-us-healthcare]
    note: |
      reCAPTCHA forbidden in those packs per ADR-FORMS-0002 (Schrems II +
      PIPA Art. 23-2 + HIPAA BAA risk). Cedar policy + adapter both refuse.

packRouting:
  pack-kr:        {primary: hcaptcha,   fallback: [friendly_captcha]}
  pack-eu:        {primary: hcaptcha,   fallback: [friendly_captcha]}
  pack-us:        {primary: turnstile,  fallback: [hcaptcha, friendly_captcha]}
  pack-us-healthcare: {primary: hcaptcha, fallback: [friendly_captcha]}
  pack-jp:        {primary: hcaptcha,   fallback: [friendly_captcha, turnstile]}
  pack-sg:        {primary: hcaptcha,   fallback: [friendly_captcha]}
  pack-au:        {primary: turnstile,  fallback: [hcaptcha, friendly_captcha]}
  pack-in:        {primary: hcaptcha,   fallback: [friendly_captcha, turnstile]}
  pack-br:        {primary: hcaptcha,   fallback: [friendly_captcha, turnstile]}
  pack-ae:        {primary: hcaptcha,   fallback: [friendly_captcha]}
  pack-ksa:       {primary: hcaptcha,   fallback: [friendly_captcha]}

failClosed: true
replicas: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: 1, memory: 1Gi}
