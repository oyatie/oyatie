asyncapi: 3.1.0
info:
  title: oyatie Forms — Async API (Kafka + Webhook)
  version: 1.0.0
  description: |
    AsyncAPI 3.0 surface for the forms µservice. Defines the Kafka topics published
    by Forms, plus the webhook delivery contract for tenant-owned receivers.

    Conforms to ADR-0028 audit-chain (Ed25519-sealed events).
  contact:
    name: axis-forms
    email: axis-forms@oyatie.com

defaultContentType: application/json

servers:
  forms-kafka-pack-kr:
    host: kafka.forms.kr.oyatie.com:9093
    protocol: kafka-secure
    description: pack-kr Kafka cluster
  forms-kafka-pack-eu:
    host: kafka.forms.eu.oyatie.com:9093
    protocol: kafka-secure
    description: pack-eu Kafka cluster

channels:
  oya.forms.published:
    address: oya.forms.published
    title: Form publish events
    messages:
      formPublished: {$ref: "#/components/messages/FormPublished"}

  oya.forms.response.submitted:
    address: oya.forms.response.submitted
    title: Response submission events
    messages:
      formResponseSubmitted: {$ref: "#/components/messages/FormResponseSubmitted"}

  oya.forms.response.submit_failed:
    address: oya.forms.response.submit_failed
    title: Submission failure events (informational SLI)
    messages:
      formResponseSubmitFailed: {$ref: "#/components/messages/FormResponseSubmitFailed"}

  oya.forms.ai_build.requested:
    address: oya.forms.ai_build.requested
    title: AI-form-build request events
    messages:
      formAiBuildRequested: {$ref: "#/components/messages/FormAiBuildRequested"}

  oya.forms.ai_build.completed:
    address: oya.forms.ai_build.completed
    title: AI-form-build completion events
    messages:
      formAiBuildAccepted: {$ref: "#/components/messages/FormAiBuildAccepted"}
      formAiBuildRejected: {$ref: "#/components/messages/FormAiBuildRejected"}

  oya.forms.dsr.executed:
    address: oya.forms.dsr.executed
    title: DSR execution events
    messages:
      formDsrExecuted: {$ref: "#/components/messages/FormDsrExecuted"}

  oya.forms.webhook.delivery:
    address: oya.forms.webhook.delivery
    title: Webhook delivery results
    messages:
      formWebhookDelivered: {$ref: "#/components/messages/FormWebhookDelivered"}

  oya.forms.bulk_distribute.completed:
    address: oya.forms.bulk_distribute.completed
    title: Bulk-distribute completion events
    messages:
      formBulkDistributeCompleted: {$ref: "#/components/messages/FormBulkDistributeCompleted"}

operations:
  publishFormPublished:
    action: send
    channel: {$ref: "#/channels/oya.forms.published"}
  publishFormResponseSubmitted:
    action: send
    channel: {$ref: "#/channels/oya.forms.response.submitted"}
  publishFormResponseSubmitFailed:
    action: send
    channel: {$ref: "#/channels/oya.forms.response.submit_failed"}
  publishFormAiBuildRequested:
    action: send
    channel: {$ref: "#/channels/oya.forms.ai_build.requested"}
  publishFormAiBuildCompleted:
    action: send
    channel: {$ref: "#/channels/oya.forms.ai_build.completed"}
  publishFormDsrExecuted:
    action: send
    channel: {$ref: "#/channels/oya.forms.dsr.executed"}
  publishFormWebhookDelivered:
    action: send
    channel: {$ref: "#/channels/oya.forms.webhook.delivery"}
  publishFormBulkDistributeCompleted:
    action: send
    channel: {$ref: "#/channels/oya.forms.bulk_distribute.completed"}

components:
  messages:
    FormPublished:
      name: FormPublished
      title: Form published
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormPublishedPayload"}
    FormResponseSubmitted:
      name: FormResponseSubmitted
      title: Response submitted
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormResponseSubmittedPayload"}
    FormResponseSubmitFailed:
      name: FormResponseSubmitFailed
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormResponseSubmitFailedPayload"}
    FormAiBuildRequested:
      name: FormAiBuildRequested
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormAiBuildRequestedPayload"}
    FormAiBuildAccepted:
      name: FormAiBuildAccepted
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormAiBuildAcceptedPayload"}
    FormAiBuildRejected:
      name: FormAiBuildRejected
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormAiBuildRejectedPayload"}
    FormDsrExecuted:
      name: FormDsrExecuted
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormDsrExecutedPayload"}
    FormWebhookDelivered:
      name: FormWebhookDelivered
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormWebhookDeliveredPayload"}
    FormBulkDistributeCompleted:
      name: FormBulkDistributeCompleted
      contentType: application/json
      payload: {$ref: "#/components/schemas/FormBulkDistributeCompletedPayload"}

  schemas:
    AuditChainSeal:
      type: object
      required: [seal_id, ed25519_signature, parent_seal_id, sealed_at]
      properties:
        seal_id: {type: string}
        ed25519_signature: {type: string, description: "base64-encoded Ed25519 signature"}
        parent_seal_id: {type: string}
        sealed_at: {type: string, format: date-time}

    EnvelopeHeader:
      type: object
      required: [event_id, tenant_id, pack, occurred_at, audit_chain_seal]
      properties:
        event_id: {type: string}
        tenant_id: {type: string}
        pack: {type: string}
        occurred_at: {type: string, format: date-time}
        audit_chain_seal: {$ref: "#/components/schemas/AuditChainSeal"}

    FormPublishedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [form_id, form_version, schema_hash, auto_decision_screening]
          properties:
            form_id: {type: string}
            form_version: {type: integer}
            schema_hash: {type: string}
            auto_decision_screening: {type: boolean}
            wcag_22_aa_attested: {type: boolean}

    FormResponseSubmittedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [form_id, form_version, response_id, submitter_hash]
          properties:
            form_id: {type: string}
            form_version: {type: integer}
            response_id: {type: string}
            submitter_hash: {type: string}
            pii_encrypted_bool: {type: boolean}
            captcha_provider: {type: string}
            submitter_ip_hash: {type: string, description: "HMAC of submitter IP; raw IP not stored"}
            user_agent_hash: {type: string}

    FormResponseSubmitFailedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          properties:
            form_id: {type: string}
            reason:
              type: string
              enum: [captcha_invalid, rate_limited, validation_error, schema_mismatch, prefill_link_expired, prefill_link_tampered, upload_scan_infected, cedar_deny, internal_error]

    FormAiBuildRequestedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [prompt_hash, tier]
          properties:
            prompt_hash: {type: string}
            tier: {type: string, enum: [T0, T1, T2-intra, T2-cross]}
            cross_microservice_destinations:
              type: array
              items: {type: string}
            auto_decision_screening: {type: boolean}
            high_risk_classified: {type: boolean}

    FormAiBuildAcceptedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [draft_id]
          properties:
            draft_id: {type: string}
            accepted_at: {type: string, format: date-time}
            published_as_form_id: {type: string}

    FormAiBuildRejectedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          properties:
            draft_id: {type: string}
            rejected_at: {type: string, format: date-time}
            reason: {type: string}

    FormDsrExecutedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [subject_hash, removed_response_ids_count]
          properties:
            subject_hash: {type: string}
            removed_response_ids_count: {type: integer}
            cascade_targets: {type: array, items: {type: string}, description: "downstream µservices cascaded to"}

    FormWebhookDeliveredPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          properties:
            form_id: {type: string}
            webhook_id: {type: string}
            target_host: {type: string}
            http_status: {type: integer}
            delivery_latency_ms: {type: integer}
            attempt: {type: integer}
            dlq: {type: boolean}

    FormBulkDistributeCompletedPayload:
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          properties:
            form_id: {type: string}
            job_id: {type: string}
            recipient_count: {type: integer}
            succeeded: {type: integer}
            failed: {type: integer}
            channel: {type: string, enum: [email, messenger, sms]}
