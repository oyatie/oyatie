# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-accessibility-wcag-correctness
  displayName: Forms — WCAG 2.2 AA conformance correctness (MUST be 100% on publish)
  labels:
    microservice: forms
    bounded_context: accessibility
    tier: external-facing
    plane: data
    severity: gate
spec:
  service: oya-forms-form-builder-leptos-wasm
  description: |
    Every form publish attempt MUST pass WCAG 2.2 AA conformance check via axe-core
    plus manual screen-reader + keyboard-only + reduced-motion tests. Target: 100%.
    Any non-100% triggers publish-block (not Sev-1 unless leak occurred via embed CSP).
  indicator:
    metadata:
      name: wcag-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_publish_wcag_pass_total[24h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_publish_attempt_total[24h]))'
  objectives:
    - target: 1.0
      displayName: 100% of publish attempts pass WCAG 2.2 AA
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
