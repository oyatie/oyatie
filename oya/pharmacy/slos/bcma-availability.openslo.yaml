apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-bcma-availability
  displayName: Pharmacy BCMA availability
  labels:
    microservice: pharmacy
    bounded_context: bcma
spec:
  service: pharmacy
  description: BCMA scan path availability ≥ 99.99%.
  indicator:
    metadata:
      name: oya-pharmacy-bcma-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_bcma_total{outcome="ok"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_bcma_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.99% success
      target: 0.9999
