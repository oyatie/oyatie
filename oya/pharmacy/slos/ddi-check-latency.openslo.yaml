apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-ddi-check-latency
  displayName: Pharmacy DDI check latency
  labels:
    microservice: pharmacy
    bounded_context: drug-interaction
spec:
  service: pharmacy
  description: DDI/DAI/DCI/DPI evaluation p99 ≤ 200 ms.
  indicator:
    metadata:
      name: oya-pharmacy-ddi-check-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_ddi_check_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_ddi_check_duration_seconds_count[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% of DDI checks under 200 ms
      target: 0.99
