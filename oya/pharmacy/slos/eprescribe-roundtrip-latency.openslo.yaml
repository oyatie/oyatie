apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-eprescribe-roundtrip-latency
  displayName: Pharmacy ePrescribe round-trip latency
  labels:
    microservice: pharmacy
    bounded_context: eprescribe
spec:
  service: pharmacy
  description: ePrescribe outbound→ack round-trip p95 ≤ 5 s.
  indicator:
    metadata:
      name: oya-pharmacy-eprescribe-roundtrip-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_eprescribe_duration_seconds_bucket{direction="outbound",le="5.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_eprescribe_duration_seconds_count{direction="outbound"}[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% of outbound round-trips under 5s
      target: 0.95
