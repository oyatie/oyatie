apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-audit-chain-coverage-completeness
  displayName: Pharmacy audit chain coverage completeness
  labels:
    microservice: pharmacy
    bounded_context: cross
spec:
  service: pharmacy
  description: 100% of seal-eligible pharmacy events MUST be sealed in audit-chain.
  indicator:
    metadata:
      name: oya-pharmacy-audit-chain-coverage-completeness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_audit_emit_total{outcome="sealed"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_audit_emit_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% sealed
      target: 1.0
