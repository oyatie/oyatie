asyncapi: 3.0.0
info:
  title: Oyatie Pharmacy Events
  version: 1.0.0
  description: |
    Pulsar event surface for the pharmacy microservice. All event names use the prefix `oya.pharmacy.*` and are
    sealed to `audit-chain` per ADR-0003. Topics are partitioned by `tenant_id` and (where applicable) `cell_id`.
defaultContentType: application/json
servers:
  pulsar:
    host: pulsar.oyatie.svc.cluster.local:6650
    protocol: pulsar+ssl
    description: Per-cell Pulsar cluster.
channels:
  oya.pharmacy.rx.prescribed:
    address: oya.pharmacy.rx.prescribed
    description: A prescription was written. NewRx received from prescriber or Surescripts.
    messages:
      RxPrescribed: { $ref: "#/components/messages/RxPrescribed" }
  oya.pharmacy.rx.verified:
    address: oya.pharmacy.rx.verified
    description: Pharmacist verified a prescription. Dual-verify required for CII.
    messages:
      RxVerified: { $ref: "#/components/messages/RxVerified" }
  oya.pharmacy.rx.dispensed:
    address: oya.pharmacy.rx.dispensed
    description: A medication was dispensed.
    messages:
      RxDispensed: { $ref: "#/components/messages/RxDispensed" }
  oya.pharmacy.rx.administered:
    address: oya.pharmacy.rx.administered
    description: A medication was administered to a patient (BCMA scan recorded).
    messages:
      RxAdministered: { $ref: "#/components/messages/RxAdministered" }
  oya.pharmacy.rx.refused:
    address: oya.pharmacy.rx.refused
    description: A patient or designee refused the medication.
    messages:
      RxRefused: { $ref: "#/components/messages/RxRefused" }
  oya.pharmacy.rx.alert.ddi:
    address: oya.pharmacy.rx.alert.ddi
    description: A DDI (drug-drug interaction) alert was generated.
    messages:
      DDIAlert: { $ref: "#/components/messages/DDIAlert" }
  oya.pharmacy.rx.alert.dai:
    address: oya.pharmacy.rx.alert.dai
    description: A DAI (drug-allergy/intolerance) alert was generated.
    messages:
      DAIAlert: { $ref: "#/components/messages/DAIAlert" }
  oya.pharmacy.rx.alert.dci:
    address: oya.pharmacy.rx.alert.dci
    description: A DCI (drug-condition) alert was generated.
    messages:
      DCIAlert: { $ref: "#/components/messages/DCIAlert" }
  oya.pharmacy.rx.alert.dpi:
    address: oya.pharmacy.rx.alert.dpi
    description: A DPI (drug-pregnancy/lactation) alert was generated.
    messages:
      DPIAlert: { $ref: "#/components/messages/DPIAlert" }
  oya.pharmacy.rx.alert.drc:
    address: oya.pharmacy.rx.alert.drc
    description: A DRC (dose range check) alert was generated.
    messages:
      DRCAlert: { $ref: "#/components/messages/DRCAlert" }
  oya.pharmacy.compounding.completed:
    address: oya.pharmacy.compounding.completed
    description: A compounding preparation completed.
    messages:
      CompoundingCompleted: { $ref: "#/components/messages/CompoundingCompleted" }
  oya.pharmacy.inventory.recall-sequestered:
    address: oya.pharmacy.inventory.recall-sequestered
    description: A lot was sequestered due to recall.
    messages:
      RecallSequestered: { $ref: "#/components/messages/RecallSequestered" }
  oya.pharmacy.cabinet.discrepancy:
    address: oya.pharmacy.cabinet.discrepancy
    description: A cabinet count discrepancy was detected.
    messages:
      CabinetDiscrepancy: { $ref: "#/components/messages/CabinetDiscrepancy" }
  oya.pharmacy.controlled.witness-signed:
    address: oya.pharmacy.controlled.witness-signed
    description: A controlled-substance transaction was witness-signed.
    messages:
      ControlledWitnessSigned: { $ref: "#/components/messages/ControlledWitnessSigned" }
  oya.pharmacy.dscsa.suspect-product-opened:
    address: oya.pharmacy.dscsa.suspect-product-opened
    description: A suspect product investigation was opened (DSCSA).
    messages:
      SuspectProductOpened: { $ref: "#/components/messages/SuspectProductOpened" }
  oya.pharmacy.dscsa.saleable-return-verified:
    address: oya.pharmacy.dscsa.saleable-return-verified
    description: A saleable return was verified.
    messages:
      SaleableReturnVerified: { $ref: "#/components/messages/SaleableReturnVerified" }
  oya.pharmacy.reimbursement.claim-accepted:
    address: oya.pharmacy.reimbursement.claim-accepted
    description: A PBM/payer accepted an NCPDP D.0 claim.
    messages:
      ClaimAccepted: { $ref: "#/components/messages/ClaimAccepted" }
  oya.pharmacy.reimbursement.claim-rejected:
    address: oya.pharmacy.reimbursement.claim-rejected
    description: A PBM/payer rejected an NCPDP D.0 claim.
    messages:
      ClaimRejected: { $ref: "#/components/messages/ClaimRejected" }
  oya.pharmacy.intervention.captured:
    address: oya.pharmacy.intervention.captured
    description: A clinical intervention was captured.
    messages:
      InterventionCaptured: { $ref: "#/components/messages/InterventionCaptured" }
  oya.pharmacy.medrec.session-completed:
    address: oya.pharmacy.medrec.session-completed
    description: A medication reconciliation session completed.
    messages:
      MedRecSessionCompleted: { $ref: "#/components/messages/MedRecSessionCompleted" }
  oya.pharmacy.eprescribe.epcs-signed:
    address: oya.pharmacy.eprescribe.epcs-signed
    description: An EPCS-required prescription was signed by the prescriber.
    messages:
      EPCSSigned: { $ref: "#/components/messages/EPCSSigned" }
  oya.pharmacy.allergy.override-attested:
    address: oya.pharmacy.allergy.override-attested
    description: An allergy alert was overridden with attestation.
    messages:
      AllergyOverrideAttested: { $ref: "#/components/messages/AllergyOverrideAttested" }
  oya.pharmacy.formulary.non-formulary-override:
    address: oya.pharmacy.formulary.non-formulary-override
    description: A non-formulary dispense was overridden.
    messages:
      NonFormularyOverride: { $ref: "#/components/messages/NonFormularyOverride" }
operations:
  publishRxPrescribed:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.prescribed" }
  publishRxVerified:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.verified" }
  publishRxDispensed:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.dispensed" }
  publishRxAdministered:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.administered" }
  publishRxRefused:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.refused" }
  publishDDIAlert:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.alert.ddi" }
  publishDAIAlert:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.alert.dai" }
  publishDCIAlert:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.alert.dci" }
  publishDPIAlert:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.alert.dpi" }
  publishDRCAlert:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.rx.alert.drc" }
  publishCompoundingCompleted:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.compounding.completed" }
  publishRecallSequestered:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.inventory.recall-sequestered" }
  publishCabinetDiscrepancy:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.cabinet.discrepancy" }
  publishControlledWitnessSigned:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.controlled.witness-signed" }
  publishSuspectProductOpened:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.dscsa.suspect-product-opened" }
  publishSaleableReturnVerified:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.dscsa.saleable-return-verified" }
  publishClaimAccepted:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.reimbursement.claim-accepted" }
  publishClaimRejected:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.reimbursement.claim-rejected" }
  publishInterventionCaptured:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.intervention.captured" }
  publishMedRecSessionCompleted:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.medrec.session-completed" }
  publishEPCSSigned:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.eprescribe.epcs-signed" }
  publishAllergyOverrideAttested:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.allergy.override-attested" }
  publishNonFormularyOverride:
    action: send
    channel: { $ref: "#/channels/oya.pharmacy.formulary.non-formulary-override" }
components:
  messages:
    RxPrescribed:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, prescription_id, prescriber_id, patient_id, rxcui]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          cell_id: { type: string }
          occurred_at: { type: string, format: date-time }
          prescription_id: { type: string }
          prescriber_id: { type: string }
          patient_id: { type: string }
          rxcui: { type: string }
          ndc: { type: string }
          schedule: { type: string, enum: [NONE, CII, CIII, CIV, CV] }
          source: { type: string, enum: [internal, surescripts] }
          trace_id: { type: string }
    RxVerified:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, prescription_id, pharmacist_id]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          cell_id: { type: string }
          occurred_at: { type: string, format: date-time }
          prescription_id: { type: string }
          pharmacist_id: { type: string }
          witness_pharmacist_id: { type: string }
          alerts_dismissed:
            type: array
            items: { type: string }
          trace_id: { type: string }
    RxDispensed:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, dispense_id, prescription_id, rxcui]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          cell_id: { type: string }
          occurred_at: { type: string, format: date-time }
          dispense_id: { type: string }
          prescription_id: { type: string }
          rxcui: { type: string }
          ndc: { type: string }
          lot: { type: string }
          expiry: { type: string, format: date }
          sgtin: { type: string }
          quantity: { type: number }
          days_supply: { type: integer }
          performer_id: { type: string }
          location: { type: string }
          trace_id: { type: string }
    RxAdministered:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, admin_id, patient_id, rxcui]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          cell_id: { type: string }
          occurred_at: { type: string, format: date-time }
          admin_id: { type: string }
          patient_id: { type: string }
          rxcui: { type: string }
          performer_id: { type: string }
          bcma_scan_id: { type: string }
          five_rights:
            type: object
            properties:
              right_patient: { type: boolean }
              right_drug: { type: boolean }
              right_dose: { type: boolean }
              right_route: { type: boolean }
              right_time: { type: boolean }
          override_reason: { type: string }
          trace_id: { type: string }
    RxRefused:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, prescription_id, reason]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          occurred_at: { type: string, format: date-time }
          prescription_id: { type: string }
          reason: { type: string }
          attested_by: { type: string }
          trace_id: { type: string }
    DDIAlert:
      payload:
        type: object
        required: [event_id, tenant_id, occurred_at, severity, actors, source]
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          occurred_at: { type: string, format: date-time }
          severity: { type: string, enum: [contraindicated, severe, major, moderate, minor, informational] }
          actors:
            type: array
            items: { type: string }
          source: { type: string, enum: [FDB, Multum, Medi-Span] }
          monograph_ref: { type: string }
          trace_id: { type: string }
    DAIAlert:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          severity: { type: string }
          allergen: { type: string }
          rxcui: { type: string }
          match_kind: { type: string, enum: [exact-ingredient, class-match] }
          trace_id: { type: string }
    DCIAlert:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          severity: { type: string }
          condition: { type: string }
          rxcui: { type: string }
          trace_id: { type: string }
    DPIAlert:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          severity: { type: string }
          trimester: { type: integer }
          rxcui: { type: string }
          trace_id: { type: string }
    DRCAlert:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          severity: { type: string }
          rule: { type: string }
          exceeds_by: { type: number }
          rxcui: { type: string }
          trace_id: { type: string }
    CompoundingCompleted:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          compounding_record_id: { type: string }
          usp_class: { type: string, enum: [USP-795, USP-797, USP-800] }
          bud: { type: string, format: date-time }
          environmental_log_ref: { type: string }
          trace_id: { type: string }
    RecallSequestered:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          lot: { type: string }
          ndc: { type: string }
          quantity_sequestered: { type: number }
          recall_notice_id: { type: string }
          trace_id: { type: string }
    CabinetDiscrepancy:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          vendor: { type: string }
          cabinet_asset_id: { type: string }
          expected_qty: { type: number }
          actual_qty: { type: number }
          drift: { type: number }
          trace_id: { type: string }
    ControlledWitnessSigned:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          transaction_id: { type: string }
          schedule: { type: string, enum: [CII, CIII, CIV, CV] }
          primary_id: { type: string }
          witness_id: { type: string }
          trace_id: { type: string }
    SuspectProductOpened:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          sgtin: { type: string }
          suspicion_type: { type: string }
          opened_by: { type: string }
          trace_id: { type: string }
    SaleableReturnVerified:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          sgtin: { type: string }
          verified: { type: boolean }
          reason: { type: string }
          trace_id: { type: string }
    ClaimAccepted:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          claim_id: { type: string }
          member_share: { type: number }
          plan_share: { type: number }
          trace_id: { type: string }
    ClaimRejected:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          claim_id: { type: string }
          reject_codes:
            type: array
            items: { type: string }
          trace_id: { type: string }
    InterventionCaptured:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          intervention_id: { type: string }
          mtm_cpt: { type: string }
          trace_id: { type: string }
    MedRecSessionCompleted:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          session_id: { type: string }
          diff_count: { type: integer }
          signed_by: { type: string }
          trace_id: { type: string }
    EPCSSigned:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          prescription_id: { type: string }
          dea_number: { type: string }
          kms_key_id: { type: string }
          trace_id: { type: string }
    AllergyOverrideAttested:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          override_id: { type: string }
          allergen: { type: string }
          severity: { type: string }
          attestor_id: { type: string }
          two_step_confirmed: { type: boolean }
          trace_id: { type: string }
    NonFormularyOverride:
      payload:
        type: object
        properties:
          event_id: { type: string }
          tenant_id: { type: string }
          override_id: { type: string }
          rxcui: { type: string }
          approver_id: { type: string }
          reason: { type: string }
          trace_id: { type: string }
