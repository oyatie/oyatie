// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oya.pharmacy.v1;

option go_package = "github.com/oyatie/proto/pharmacy/v1;pharmacyv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =====================================================================
// MedicationCatalog
// =====================================================================
service MedicationCatalogService {
  rpc Resolve(ResolveMedicationRequest) returns (Medication);
  rpc Search(SearchMedicationRequest) returns (SearchMedicationResponse);
  rpc RefreshKnowledgePackage(RefreshKnowledgePackageRequest) returns (RefreshKnowledgePackageResponse);
}

message Medication {
  string rxcui = 1;
  string ndc11 = 2;
  string gpi = 3;
  string atc = 4;
  string display_name = 5;
  string brand = 6;
  string generic = 7;
  string route = 8;
  string form = 9;
  string strength = 10;
  string knowledge_package_version = 11;
  bool active = 12;
}

message ResolveMedicationRequest {
  oneof key {
    string rxcui = 1;
    string ndc = 2;
    string gpi = 3;
  }
  string tenant_id = 4;
}

message SearchMedicationRequest {
  string query = 1;
  string tenant_id = 2;
  int32 limit = 3;
}

message SearchMedicationResponse { repeated Medication results = 1; }

message RefreshKnowledgePackageRequest {
  string vendor = 1; // FDB | Multum | Medi-Span
  string version = 2;
  string tenant_id = 3;
}

message RefreshKnowledgePackageResponse {
  string vendor = 1;
  string version_applied = 2;
  int64 entries_added = 3;
  int64 entries_modified = 4;
}

// =====================================================================
// Formulary
// =====================================================================
service FormularyService {
  rpc Lookup(FormularyLookupRequest) returns (FormularyStatus);
  rpc ProposeInterchange(InterchangeProposalRequest) returns (InterchangeProposalResponse);
}

message FormularyLookupRequest {
  string tenant_id = 1;
  string cell_id = 2;
  string rxcui = 3;
}

enum FormularyStatusEnum {
  FORMULARY_STATUS_UNSPECIFIED = 0;
  PREFERRED = 1;
  NON_PREFERRED = 2;
  RESTRICTED = 3;
  NON_FORMULARY = 4;
}

message FormularyStatus {
  string rxcui = 1;
  FormularyStatusEnum status = 2;
  int32 tier = 3;
  repeated string criteria = 4;
  bool prior_auth_required = 5;
  bool therapeutic_interchange_available = 6;
}

message InterchangeProposalRequest {
  string tenant_id = 1;
  string source_rxcui = 2;
  string indication = 3;
}

message InterchangeProposalResponse {
  string target_rxcui = 1;
  string rationale = 2;
}

// =====================================================================
// ePrescribe
// =====================================================================
service EPrescribeService {
  rpc CreatePrescription(CreatePrescriptionRequest) returns (Prescription);
  rpc Transmit(TransmitRequest) returns (TransmitResponse);
  rpc EPCSSignEnvelope(EPCSSignEnvelopeRequest) returns (EPCSSignEnvelopeResponse);
  rpc ReceiveSurescriptsInbound(SurescriptsInbound) returns (google.protobuf.Empty);
}

message Prescription {
  string id = 1;
  string tenant_id = 2;
  string prescriber_id = 3;
  string patient_id = 4;
  string rxcui = 5;
  string sig = 6;
  double quantity = 7;
  int32 refills = 8;
  string schedule = 9; // NONE | CII | CIII | CIV | CV
  bool epcs_required = 10;
  bool rems_required = 11;
  google.protobuf.Timestamp written_at = 12;
}

message CreatePrescriptionRequest { Prescription prescription = 1; }

message TransmitRequest { string prescription_id = 1; }

message TransmitResponse {
  string envelope_id = 1;
  string ack = 2;
}

message EPCSSignEnvelopeRequest {
  string prescription_id = 1;
  string prescriber_dea = 2;
  string two_factor_evidence = 3;
}

message EPCSSignEnvelopeResponse {
  string signature = 1;
  string kms_key_id = 2;
  google.protobuf.Timestamp signed_at = 3;
}

message SurescriptsInbound {
  bytes envelope = 1;
  string message_type = 2; // NewRx | RxRenewal | RxChange | CancelRx | RxFill | RxHistoryResponse | etc.
}

// =====================================================================
// DrugInteraction
// =====================================================================
service DrugInteractionService {
  rpc Evaluate(InteractionEvaluateRequest) returns (InteractionEvaluateResponse);
}

enum InteractionEngine {
  INTERACTION_ENGINE_UNSPECIFIED = 0;
  DDI = 1;
  DAI = 2;
  DCI = 3;
  DPI = 4;
  DDxI = 5;
  DLI = 6;
  DFI = 7;
  DDoseI = 8;
}

enum InteractionSeverity {
  INTERACTION_SEVERITY_UNSPECIFIED = 0;
  CONTRAINDICATED = 1;
  SEVERE = 2;
  MAJOR = 3;
  MODERATE = 4;
  MINOR = 5;
  INFORMATIONAL = 6;
}

message InteractionFinding {
  InteractionEngine engine = 1;
  InteractionSeverity severity = 2;
  string source = 3; // FDB | Multum | Medi-Span
  string monograph_ref = 4;
  repeated string actors = 5;
  string detail = 6;
}

message InteractionEvaluateRequest {
  string tenant_id = 1;
  string patient_id = 2;
  repeated string rxcuis = 3;
  repeated InteractionEngine engines = 4;
}

message InteractionEvaluateResponse { repeated InteractionFinding findings = 1; }

// =====================================================================
// AllergyCheck
// =====================================================================
service AllergyCheckService {
  rpc Check(AllergyCheckRequest) returns (AllergyCheckResponse);
  rpc RecordOverride(AllergyOverrideRequest) returns (AllergyOverrideResponse);
}

message AllergyCheckRequest {
  string tenant_id = 1;
  string patient_id = 2;
  string rxcui = 3;
}

enum AllergyMatchKind {
  ALLERGY_MATCH_UNSPECIFIED = 0;
  EXACT_INGREDIENT = 1;
  CLASS_MATCH = 2;
  NO_MATCH = 3;
}

message AllergyCheckResponse {
  AllergyMatchKind match_kind = 1;
  string allergen = 2;
  string severity = 3;
  string cross_class = 4;
  bool override_eligible = 5;
}

message AllergyOverrideRequest {
  string tenant_id = 1;
  string patient_id = 2;
  string rxcui = 3;
  string reason_code = 4;
  string attestor_id = 5;
  bool two_step_confirmed = 6;
}

message AllergyOverrideResponse { string override_id = 1; }

// =====================================================================
// DoseCheck
// =====================================================================
service DoseCheckService {
  rpc Check(DoseCheckRequest) returns (DoseCheckResponse);
}

message DoseCheckRequest {
  string tenant_id = 1;
  string patient_id = 2;
  string rxcui = 3;
  double dose_value = 4;
  string dose_unit = 5;
  string frequency = 6;
  string indication = 7;
}

message DoseCheckFinding {
  string rule_id = 1;
  string band = 2;
  bool exceeds = 3;
  double exceeds_by = 4;
  string recommendation = 5;
}

message DoseCheckResponse { repeated DoseCheckFinding findings = 1; }

// =====================================================================
// Verification
// =====================================================================
service VerificationService {
  rpc Verify(VerificationRequest) returns (VerificationTicket);
}

message VerificationRequest {
  string tenant_id = 1;
  string order_id = 2;
  string pharmacist_id = 3;
  string witness_pharmacist_id = 4;
  repeated string alerts_dismissed = 5;
}

message VerificationTicket {
  string id = 1;
  string order_id = 2;
  string decision = 3; // verified | rejected | deferred
  google.protobuf.Timestamp timestamp = 4;
}

// =====================================================================
// Compounding
// =====================================================================
service CompoundingService {
  rpc OpenRecord(CompoundingOpenRequest) returns (CompoundingRecord);
  rpc CompleteRecord(CompoundingCompleteRequest) returns (CompoundingRecord);
}

enum USPClass {
  USP_CLASS_UNSPECIFIED = 0;
  USP_795 = 1;
  USP_797 = 2;
  USP_800 = 3;
}

message CompoundingRecord {
  string id = 1;
  string master_formulation_record_ref = 2;
  USPClass usp_class = 3;
  google.protobuf.Timestamp bud = 4;
  string environmental_log_ref = 5;
  string compounder_id = 6;
}

message CompoundingOpenRequest {
  string master_formulation_record_ref = 1;
  USPClass usp_class = 2;
  string compounder_id = 3;
}

message CompoundingCompleteRequest {
  string id = 1;
  string environmental_log_ref = 2;
}

// =====================================================================
// Inventory
// =====================================================================
service InventoryService {
  rpc GetLot(GetLotRequest) returns (InventoryLot);
  rpc SequesterRecall(SequesterRecallRequest) returns (SequesterRecallResponse);
}

message InventoryLot {
  string ndc = 1;
  string sgtin = 2;
  string lot = 3;
  string expiry = 4; // YYYY-MM-DD
  double quantity = 5;
  string location = 6;
  string status = 7; // on-hand | recalled | expired | sequestered | dispensed
}

message GetLotRequest {
  string sgtin = 1;
  string ndc = 2;
  string lot = 3;
}

message SequesterRecallRequest {
  string ndc = 1;
  string lot = 2;
  string recall_notice_id = 3;
}

message SequesterRecallResponse {
  int64 lots_sequestered = 1;
  int64 units_sequestered = 2;
}

// =====================================================================
// AutoDispensing
// =====================================================================
service AutoDispensingService {
  rpc IngestTransaction(CabinetTransaction) returns (google.protobuf.Empty);
  rpc OpenDiscrepancy(CabinetDiscrepancy) returns (google.protobuf.Empty);
}

message CabinetTransaction {
  string id = 1;
  string vendor = 2; // pyxis | omnicell | carousel | acudose | meddispense
  string cabinet_asset_id = 3;
  string user_id = 4;
  string rxcui = 5;
  double quantity = 6;
  bool override = 7;
  string witness_id = 8;
  google.protobuf.Timestamp timestamp = 9;
}

message CabinetDiscrepancy {
  string id = 1;
  string vendor = 2;
  string cabinet_asset_id = 3;
  double expected_qty = 4;
  double actual_qty = 5;
}

// =====================================================================
// BCMA
// =====================================================================
service BCMAService {
  rpc Scan(BCMAScan) returns (FiveRightsResult);
}

message BCMAScan {
  string scan_id = 1;
  string tenant_id = 2;
  string nurse_id = 3;
  string patient_barcode = 4;
  string medication_barcode = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message FiveRightsResult {
  bool right_patient = 1;
  bool right_drug = 2;
  bool right_dose = 3;
  bool right_route = 4;
  bool right_time = 5;
  bool block = 6;
  bool override_allowed = 7;
}

// =====================================================================
// IVAdmixture
// =====================================================================
service IVAdmixtureService {
  rpc OpenOrder(IVAdmixtureOrder) returns (IVAdmixtureOrder);
  rpc ProgramPump(PumpAutoProgram) returns (PumpAutoProgram);
}

message IVAdmixtureOrder {
  string id = 1;
  string base = 2;
  string diluent = 3;
  string rate = 4;
  string duration = 5;
  string route = 6;
}

message PumpAutoProgram {
  string admixture_id = 1;
  string pump_asset_id = 2;
  string vendor = 3; // alaris | plum-360 | hospira
  string drug_library_entry_id = 4;
  string programmed_rate = 5;
  string programmed_concentration = 6;
  string ack = 7;
}

// =====================================================================
// ControlledSubstance
// =====================================================================
service ControlledSubstanceService {
  rpc SubmitForm222(Form222Order) returns (Form222Order);
  rpc RecordWitnessedWaste(WitnessedWaste) returns (WitnessedWaste);
  rpc GenerateDEAInspectionReport(DEAInspectionReportRequest) returns (DEAInspectionReport);
}

message Form222Order {
  string id = 1;
  string supplier_dea = 2;
  string purchaser_dea = 3;
  string signature = 4;
}

message WitnessedWaste {
  string id = 1;
  string rxcui = 2;
  double quantity = 3;
  string reason = 4;
  string primary_witness_id = 5;
  string secondary_witness_id = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message DEAInspectionReportRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message DEAInspectionReport {
  string id = 1;
  bytes content = 2;
}

// =====================================================================
// Reimbursement
// =====================================================================
service ReimbursementService {
  rpc SubmitPBMClaim(PBMClaim) returns (PBMClaimResponse);
  rpc EvaluateB340(B340EligibilityRequest) returns (B340Determination);
}

message PBMClaim {
  string ncpdp_envelope = 1;
  string member_id = 2;
  string bin = 3;
  string pcn = 4;
  string group_id = 5;
  string rxcui = 6;
  double dispense_quantity = 7;
}

message PBMClaimResponse {
  bool accepted = 1;
  repeated string reject_codes = 2;
  double member_share = 3;
  double plan_share = 4;
}

message B340EligibilityRequest {
  string encounter_id = 1;
  string provider_id = 2;
  string rxcui = 3;
  string location = 4;
}

message B340Determination {
  bool eligible = 1;
  bool mixed_use = 2;
  string replenishment_lot = 3;
}

// =====================================================================
// Operations
// =====================================================================
service OperationsService {
  rpc ListQueue(QueueRequest) returns (QueueResponse);
}

message QueueRequest {
  string tenant_id = 1;
  string lane = 2; // order | prep | verify | deliver
}

message QueueResponse { repeated string item_ids = 1; }

// =====================================================================
// Interventions
// =====================================================================
service InterventionsService {
  rpc Capture(ClinicalIntervention) returns (ClinicalIntervention);
}

message ClinicalIntervention {
  string id = 1;
  string patient_id = 2;
  string rxcui = 3;
  string problem = 4;
  string intervention = 5;
  string outcome = 6;
  string mtm_cpt = 7;
}

// =====================================================================
// MedRec
// =====================================================================
service MedRecService {
  rpc OpenSession(ReconciliationSession) returns (ReconciliationSession);
  rpc SignSession(ReconciliationSignRequest) returns (ReconciliationSession);
}

message ReconciliationSession {
  string id = 1;
  string encounter_id = 2;
  string signed_by = 3;
}

message ReconciliationSignRequest {
  string id = 1;
  string signer_id = 2;
}

// =====================================================================
// OutpatientRX
// =====================================================================
service OutpatientRXService {
  rpc SubmitRefill(RefillRequest) returns (RefillRequest);
}

message RefillRequest {
  string id = 1;
  string prescription_id = 2;
  string channel = 3; // retail | drive-through | mail | specialty | phone | app
  bool consent = 4;
}

// =====================================================================
// MTM
// =====================================================================
service MTMService {
  rpc OpenSession(MTMSession) returns (MTMSession);
  rpc DraftPML(MTMDraftPMLRequest) returns (MTMDraftPMLResponse);
}

message MTMSession {
  string id = 1;
  string patient_id = 2;
  string type = 3; // CMR | TMR
  string billing_cpt = 4;
}

message MTMDraftPMLRequest {
  string mtm_session_id = 1;
  string patient_id = 2;
}

message MTMDraftPMLResponse {
  string draft_md = 1;
  string intelligence_session_id = 2;
}

// =====================================================================
// DSCSA
// =====================================================================
service DSCSAService {
  rpc IngestT3(T3Transaction) returns (google.protobuf.Empty);
  rpc VerifySaleableReturn(SaleableReturnVerify) returns (SaleableReturnVerifyResult);
  rpc OpenSuspectProductCase(SuspectProductCase) returns (SuspectProductCase);
}

message T3Transaction {
  string id = 1;
  bytes ti = 2;
  bytes th = 3;
  bytes ts = 4;
  string epcis_version = 5; // "2.0"
}

message SaleableReturnVerify {
  string sgtin = 1;
  string original_transaction_id = 2;
}

message SaleableReturnVerifyResult {
  bool verified = 1;
  bool suspect = 2;
  string reason = 3;
}

message SuspectProductCase {
  string id = 1;
  string sgtin = 2;
  string suspicion_type = 3;
  string opened_by = 4;
  string disposition = 5;
}
