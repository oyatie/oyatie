apiVersion: oyatie.io/catalog/v2
kind: Crate
metadata:
  name: oya-compliance-pack-registry-domain
  microservice: compliance
  bounded_context: pack-registry
  layer: domain
spec:
  binding_adr: ADR-0251
  naming_justification: "BNF v4.1: oya-<microservice:compliance>-<bc:pack-registry>-<layer:domain>"
  ports: [storage, observability]
  dependencies: [oya-compliance-pack-registry-kernel]
  audit_event_classes:
    - oya.compliance.pack-registered
    - oya.compliance.pack-published
    - oya.compliance.pack-deprecated
