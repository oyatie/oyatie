# Legacy Backstage-shaped catalog import. It is migration input for the first-party ADR-0394
# portal projection, not a Backstage runtime or catalog authority.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: compliance
  title: Compliance
  description: Compliance evidence automation per ADR-0209 — in-house pipeline replacing Drata/Vanta.
  annotations:
    backstage.io/managed-by-location: url:https://github.com/oyadev/oyatie/blob/main/oya/compliance/manifest.json
    oya.dev/microservice: compliance
    oya.dev/owner: axis-compliance
    oya.dev/frameworks: soc2-type-2,gdpr,hipaa,pci-dss
  tags:
    - rust
    - compliance
    - in-house
    - audit-chain-seal
spec:
  type: service
  lifecycle: experimental
  owner: axis-compliance
  system: oyatie-platform
  providesApis:
    - compliance-rest-v1
    - compliance-asyncapi-v1
  dependsOn:
    - resource:default/seaweedfs
    - component:default/identity
    - component:default/tenancy
    - component:default/governance
