# Legacy Backstage-shaped catalog import for one-way migration into the first-party portal.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: compliance-auditor-portal
  description: Read-only first-party auditor portal module per ADR-0209 and ADR-0394.
spec:
  type: website
  lifecycle: experimental
  owner: axis-compliance
  system: oyatie-platform
  consumesApis:
    - compliance-rest-v1
  dependsOn:
    - component:default/compliance
