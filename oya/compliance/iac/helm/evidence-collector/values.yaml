# Canonical-base: microservices/governance/iac/helm/_oya-helpers (per ADR-0064)
# Compliance evidence collector tier per ADR-0209.

image:
  repository: oya/compliance-evidence-collector
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3                       # HA; one per cell minimum

# Collector enablement table — each collector toggleable per environment.
collectors:
  ciArtifactHash:
    enabled: true
    cronSchedule: "*/15 * * * *"     # poll CI build artifacts every 15 minutes
    framework: soc2-type-2
  deployReceipt:
    enabled: true
    eventDriven: true                 # consumes deploy events from ADR-0181 image promotion pipeline
    framework: soc2-type-2
  accessReviewSnapshot:
    enabled: true
    cronSchedule: "0 0 * * 0"        # weekly, Sunday 00:00 UTC
    framework: [soc2-type-2, gdpr, hipaa, pci-dss]
  backupRestoreDrillReceipt:
    enabled: true
    cronSchedule: "0 4 1 */3 *"      # quarterly, 1st of Jan/Apr/Jul/Oct, 04:00 UTC
    framework: [soc2-type-2, hipaa]
  vulnScanReport:
    enabled: true
    eventDriven: true                 # Trivy scan on every image (per ADR-0181)
    framework: [soc2-type-2, gdpr, pci-dss]
  penTestReport:
    enabled: true
    manualUpload: true                # annual external engagement; uploaded via auditor portal
    framework: [soc2-type-2, pci-dss]
  dsarCompletionRecord:
    enabled: true
    eventDriven: true                 # emitted by oya-dsr-usecase per request
    framework: gdpr
  baaInventoryEntry:
    enabled: true
    cronSchedule: "0 0 1 */3 *"      # quarterly review
    framework: hipaa
  minimumNecessaryAccessLog:
    enabled: true
    eventDriven: true                 # streamed continuously
    framework: hipaa

# Storage — SeaweedFS via filer (per ADR-0145).
storage:
  seaweedfsFilerEndpoint: oya-seaweedfs-filer.shared-storage.svc:8888
  bucketByFramework:
    soc2-type-2: oya-compliance-evidence-soc2
    gdpr:        oya-compliance-evidence-gdpr
    hipaa:       oya-compliance-evidence-hipaa
    pci-dss:     oya-compliance-evidence-pci

# Audit-chain seal — SHA-256 hex; verified via Sigstore / Cosign chain.
auditChain:
  enabled: true
  sealAlgorithm: sha256
  cosignKeylessOidc: true             # per ADR-0181 keyless OIDC pattern

# DSAR API.
dsar:
  enabled: true
  slaDays: 30                         # GDPR Art. 12 statutory
  targetDays: 5                       # internal target
  endpoint:
    pathPrefix: /api/v1/dsar
    auth: zitadel-passwordless        # per ADR-0145 identity tier

# Auditor portal — first-party read module (per ADR-0394).
auditorPortal:
  enabled: true
  portalRoute: /auditor
  readOnlyRoleBindingTemplate: cedar-fragment/auditor-readonly.cedar
  perEngagementAccess: true           # auditor identity provisioned per engagement; expires on close

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Cross-tenant isolation invariant: collectors stamp tenant_id on every artifact at emit;
# kernel-level guard rejects assembly when subject's tenant_id ≠ request's tenant_id.
tenantIsolation:
  enforce: true
