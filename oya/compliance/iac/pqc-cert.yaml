# compliance µservice — PQC hybrid cert configuration
# Per ADR-0253: KEM hybrid X25519MLKEM768 + signature hybrid ed25519+ml_dsa_65
apiVersion: oyatie.io/network/v1
kind: PQCCert
metadata:
  name: compliance-pqc
  microservice: compliance
spec:
  kem_hybrid: X25519MLKEM768
  kem_iana_codepoint: "0x11ec"
  sig_hybrid: ed25519+ml_dsa_65
  issuer: oyatie-rooted-ca-pqc
  sigstore_fulcio: true
  graceful_degradation_to_classical: true
  classical_fallback_curves: ["X25519", "P-256"]
  rotation_days: 90
