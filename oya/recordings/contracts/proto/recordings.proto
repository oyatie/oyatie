// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

// oyatie recordings µservice protobuf surface.
//
// Used for: internal RPC between recording-ingest workers + producer
// µservices (meet, messenger huddles, live-broadcast). REST surface is in
// `contracts/openapi/recordings.yaml`; AsyncAPI events are in
// `contracts/asyncapi/recordings-events.yaml`.

package oyatie.recordings.v1;

option go_package = "github.com/oyatie/microservices/recordings/contracts/proto/v1;recordings_v1";

// =============================================================================
// Recording (per ADR-RECORDINGS-0007 ingest contract)
// =============================================================================

message Recording {
  string recording_id = 1;
  string tenant_id = 2;
  SourceKind source_kind = 3;
  string pack_id = 4;
  ContextKind context_kind = 5;
  string title = 6;
  string description = 7;
  string ingested_at = 8; // RFC 3339
  string ended_at = 9; // RFC 3339 (nullable)
  int64 duration_seconds = 10;
  string content_hash = 11; // sha256:<hex>
  string retention_policy_id = 12;
  bool legal_hold_engaged = 13;
  string author_ref = 14;
  bool consent_banner_confirmed = 15;
  string cell_id = 16;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_MEET = 1;
  SOURCE_KIND_MESSENGER_HUDDLE = 2;
  SOURCE_KIND_LIVE_BROADCAST = 3;
  SOURCE_KIND_MANUAL_UPLOAD = 4;
  SOURCE_KIND_WORKFLOW_SCREEN_CAPTURE = 5;
  SOURCE_KIND_LEGACY_WORKSPACE_RECORDING = 6;
}

enum ContextKind {
  CONTEXT_KIND_UNSPECIFIED = 0;
  CONTEXT_KIND_PERSONAL = 1;
  CONTEXT_KIND_PROFESSIONAL = 2;
}

// =============================================================================
// Ingest (durable contract per ADR-RECORDINGS-0007)
// =============================================================================

message RecordingIngestRequest {
  string idempotency_key = 1;
  string tenant_id = 2;
  SourceKind source_kind = 3;
  string source_ref = 4; // meet session_id / messenger huddle_id / live broadcast_id / upload_id
  string content_hash = 5;
  int64 byte_len = 6;
  int64 duration_seconds = 7;
  string ingested_at = 8;
  string ended_at = 9;
  bool consent_banner_confirmed = 10;
  ContextKind context_kind = 11;
  string author_ref = 12;
  string cell_id = 13;
  // Producer SPIFFE identity (asserted by mTLS at gateway; carried for audit).
  string producer_spiffe_id = 14;
  // Audit chain parent: producer µservice's last seal on this source.
  string parent_audit_chain_ref = 15;
}

message RecordingIngestResponse {
  string recording_id = 1;
  string content_hash_verified = 2;
  string ingest_audit_chain_ref = 3;
}

// =============================================================================
// Legal Hold (per ADR-RECORDINGS-0002; load-bearing 100 % invariant)
// =============================================================================

message LegalHoldEngageRequest {
  string scope_expression = 1; // Cedar-evaluable
  CourtOrderRef court_order_ref = 2;
  string paired_approver = 3;
  string reason = 4;
}

message CourtOrderRef {
  string court_id = 1;
  string jurisdiction = 2;
  string case_no = 3;
  string order_date = 4; // RFC 3339
}

message LegalHold {
  string hold_id = 1;
  string tenant_id = 2;
  string scope_expression = 3;
  string engaged_at = 4;
  string released_at = 5; // nullable
  CourtOrderRef court_order_ref = 6;
  string engaged_by = 7;
  string paired_approver = 8;
  int64 engagement_latency_ms = 9;
  int64 matched_recordings_count = 10;
  string audit_chain_seal_ref = 11;
}

// =============================================================================
// Service surface
// =============================================================================

service RecordingsIngest {
  // Producer µservices call this on session end. Idempotent on
  // (idempotency_key, tenant_id).
  rpc Ingest(RecordingIngestRequest) returns (RecordingIngestResponse);
}

service RecordingsLegalHold {
  // Load-bearing — p99 ≤ 1s end-to-end.
  rpc Engage(LegalHoldEngageRequest) returns (LegalHold);
}
