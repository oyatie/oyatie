# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recordings
commonLabels:
  oyatie.com/microservice: recordings
  oyatie.com/pack: pack-us-healthcare
  oyatie.com/region: us-ashburn-1
  oyatie.com/hipaa-eligible: "true"
resources:
  - ../../base
configMapGenerator:
  - name: recordings-pack-config
    literals:
      - pack=pack-us-healthcare
      - cdn_backend=cloudfront                # HIPAA-eligible edges only
      - storage_hot_retention_days=365        # 1y clinical frequent-access
      - consent_banner_required=false         # implicit BAA-covered care delivery
      - retention_floor_days=2190             # 6y HIPAA §164.530(j)
      - retention_ceiling_days=3650           # 10y
      - phi_redaction_enabled=true            # PHI-aware Whisper post-process
      - baa_required=true                     # tenant onboarding gate
