# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range $bc, $cfg := .Values }}
{{- if and (kindIs "map" $cfg) (hasKey $cfg "replicas") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recordings-{{ $bc | replace "_" "-" }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- toYaml $.Values.commonLabels | nindent 4 }}
    oyatie.com/bc: {{ $bc | replace "_" "-" }}
    oyatie.com/pack: {{ $.Values.global.pack }}
    {{- if hasKey $cfg "load_bearing" }}
    oyatie.com/load-bearing: "true"
    {{- end }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      oyatie.com/microservice: recordings
      oyatie.com/bc: {{ $bc | replace "_" "-" }}
  template:
    metadata:
      labels:
        oyatie.com/microservice: recordings
        oyatie.com/bc: {{ $bc | replace "_" "-" }}
        oyatie.com/pack: {{ $.Values.global.pack }}
    spec:
      containers:
        - name: {{ $bc | replace "_" "-" }}
          image: oci.oyatie.com/recordings/{{ $bc | replace "_" "-" }}:0.1.0
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          env:
            - {name: OYA_PACK, value: {{ $.Values.global.pack }}}
            - {name: OYA_CELL, value: {{ $.Values.global.cell }}}
            - {name: OYA_MICROSERVICE, value: recordings}
            - {name: OYA_BC, value: {{ $bc | replace "_" "-" }}}
          {{- if hasKey $cfg "sandbox" }}
          securityContext:
            runtimeClassName: {{ $cfg.sandbox }}
          {{- end }}
          {{- if hasKey $cfg "gpu_requests" }}
          resources:
            limits:
              nvidia.com/gpu: {{ $cfg.gpu_requests }}
          {{- end }}
{{- end }}
{{- end }}
