id: cap:api-gateway:canary-route-shift:v1
name: canary-route-shift
namespace: api-gateway
display_name: Canary route weight shift
description: |
  Shift traffic weight between blue/green deployments per ADR-0114 + ADR-0139.
  Gated by SLO burn-rate; gradual ramp 5% → 25% → 50% → 100%.

owner_team: axis-network
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0114, ADR-0139, ADR-0294]
related_artifacts:
  - microservices/api-gateway/runbooks/blue-green-rollback.md
  - microservices/observability/IP-015-canary-cohort-weighting.md

autonomy_tier: T2
# T2 = write to ledger; auto-rollback bound to SLO burn-rate.

inputs:
  - name: route_id
    type: string
    required: true
  - name: target_weight_percent
    type: integer
    range: [0, 100]
    required: true
  - name: reason
    type: string
    required: true

outputs:
  - name: previous_weight
    type: integer
  - name: new_weight
    type: integer
  - name: soak_until
    type: timestamp

evidence_topic: oya.api_gateway.canary.routed
cost_profile:
  type: per-shift
  estimated_cost_usd_per_call: 0.0001

cedar_policy_fragments:
  - microservices/api-gateway/policy/ci-scope.cedar

sunset:
  status: none
