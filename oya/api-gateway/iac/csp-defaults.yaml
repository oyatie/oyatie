# api-gateway — Content-Security-Policy + security-headers defaults
# Per ADR-0157 + OWASP API Security Top 10.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-api-gateway-security-headers
  namespace: api-gateway
data:
  # Default CSP (overridden per route)
  csp-default: |
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https://cdn.oyatie.com;
    font-src 'self' https://cdn.oyatie.com;
    connect-src 'self' https://api.oyatie.com wss://api.oyatie.com;
    media-src 'self';
    object-src 'none';
    frame-ancestors 'none';
    form-action 'self';
    base-uri 'self';
    upgrade-insecure-requests;
    block-all-mixed-content;
    require-trusted-types-for 'script';
    report-uri /api/security/csp-report;
  hsts: |
    max-age=63072000; includeSubDomains; preload
  permissions-policy: |
    accelerometer=(),
    ambient-light-sensor=(),
    autoplay=(self),
    battery=(),
    camera=(self),
    cross-origin-isolated=(self),
    display-capture=(self),
    encrypted-media=(self),
    fullscreen=(self),
    geolocation=(),
    gyroscope=(),
    magnetometer=(),
    microphone=(self),
    midi=(),
    payment=(self),
    picture-in-picture=(self),
    publickey-credentials-get=(self),
    screen-wake-lock=(),
    sync-xhr=(),
    usb=(),
    web-share=(self),
    xr-spatial-tracking=()
  cross-origin-opener-policy: same-origin
  cross-origin-embedder-policy: require-corp
  cross-origin-resource-policy: same-origin
  referrer-policy: strict-origin-when-cross-origin
  x-content-type-options: nosniff
  x-frame-options: DENY
