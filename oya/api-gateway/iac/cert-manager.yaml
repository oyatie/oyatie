# api-gateway — cert-manager + cert issuance config
# Per ADR-0253 + ADR-0295.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: oya-letsencrypt-primary
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops-security@oyatie.com
    privateKeySecretRef:
      name: oya-letsencrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          email: ops-security@oyatie.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: oya-letsencrypt-backup
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    email: ops-security@oyatie.com
    privateKeySecretRef:
      name: oya-zerossl-account-key
    externalAccountBinding:
      keyID: ${ZEROSSL_KID}
      keySecretRef:
        name: zerossl-eab
        key: hmac
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-api-gateway-cert
  namespace: api-gateway
spec:
  secretName: oya-api-gateway-cert
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  issuerRef:
    name: oya-letsencrypt-primary
    kind: ClusterIssuer
  dnsNames:
  - api.oyatie.com
  - "*.api.oyatie.com"
  - "*.oyatie.dev"
  usages:
  - digital signature
  - key encipherment
  - server auth
  privateKey:
    algorithm: ECDSA
    size: 256  # P-256
    rotationPolicy: Always
  # Must-staple
  additionalOutputFormats:
  - type: CombinedPEM
  - type: DER
  encodeUsagesInRequest: true
  # CT log: enforced by Let's Encrypt
