# api-gateway — PQC hybrid cert chain
# Per ADR-0253 (X25519MLKEM768 + ed25519+ml_dsa_65).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-api-gateway-pqc-cert
  namespace: api-gateway
  annotations:
    cert-manager.io/private-key-algorithm: "ed25519+ml_dsa_65"
spec:
  secretName: oya-api-gateway-pqc-cert
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: oya-sigstore-pqc-issuer  # internal PQC-capable CA
    kind: ClusterIssuer
  dnsNames:
  - api.oyatie.com
  privateKey:
    algorithm: ed25519+ml_dsa_65
    rotationPolicy: Always
  additionalOutputFormats:
  - type: CombinedPEM
---
# Envoy KEM groups preference (configured at listener level via envoy-config.yaml)
# Documented here for traceability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-api-gateway-kem-groups
  namespace: api-gateway
data:
  preferred_kem_groups: "X25519MLKEM768,X25519,P-256"
  signature_alg_preference: "ed25519+ml_dsa_65,ed25519,ecdsa_p256_sha256"
  pqc_fallback: "FrodoKEM-640-AES"  # NIST round-2 alternate per pqc-cert-rotation runbook
