{{/*
CronJob — IANA tzdb refresh worker per ADR-CAL-0004.
Polls IANA tzdb releases every 24h; opens release-pin-bump ChangeSet
when a new release is detected; runs RFC 5545 corpus + DST edge-case
matrix before promotion.
*/}}
{{- if $.Values.tzdbRefreshWorker.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oya-calendar-tzdb-refresh-worker
  namespace: calendar
  labels:
    microservice: calendar
    component: tzdb-refresh
spec:
  schedule: "{{ $.Values.tzdbRefreshWorker.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            microservice: calendar
            component: tzdb-refresh
        spec:
          serviceAccountName: oya-calendar
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: tzdb-refresh
              image: "{{ $.Values.tzdbRefreshWorker.image.repository }}:{{ $.Values.tzdbRefreshWorker.image.tag }}"
              env:
                - {name: IANA_RELEASE_URL, value: "{{ $.Values.tzdbRefreshWorker.ianaReleaseUrl }}"}
                - {name: STALENESS_SLO_DAYS, value: "{{ $.Values.tzdbRefreshWorker.stalenessSloDays }}"}
                - {name: RUST_LOG, value: info}
              resources:
{{ toYaml $.Values.tzdbRefreshWorker.resources | indent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
