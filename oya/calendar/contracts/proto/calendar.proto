syntax = "proto3";

package oya.calendar.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option go_package = "oyatie.dev/calendar/v1;calendarv1";

// =====================================================================================
// Calendar µservice gRPC contracts.
//
// Per ADR-0135 (unbundle) + ADR-0132 (no-grouping policy) + ADR-0131 (per-µservice
// flat layout). Mirrors the REST surface defined in `contracts/openapi/calendar.yaml`.
//
// Authentication: SPIFFE-bound mTLS (internal) OR OIDC + per-tenant API key (external).
// Authorisation: Cedar policies per `policy/*.cedar`.
// Dual-context isolation: Personal vs Professional event types are NOT a shared enum;
// the gRPC service exposes two endpoint families to enforce structural separation.
// =====================================================================================

// ==================== Common ====================

enum EventContext {
  EVENT_CONTEXT_UNSPECIFIED = 0;
  EVENT_CONTEXT_PERSONAL = 1;
  EVENT_CONTEXT_PROFESSIONAL = 2;
}

enum AttendeeCountBucket {
  ATTENDEE_COUNT_BUCKET_UNSPECIFIED = 0;
  ATTENDEE_COUNT_BUCKET_SMALL = 1;   // 1-5
  ATTENDEE_COUNT_BUCKET_MEDIUM = 2;  // 6-20
  ATTENDEE_COUNT_BUCKET_LARGE = 3;   // 21+
}

enum RsvpState {
  RSVP_STATE_UNSPECIFIED = 0;
  RSVP_STATE_PENDING = 1;
  RSVP_STATE_ACCEPTED = 2;
  RSVP_STATE_TENTATIVE = 3;
  RSVP_STATE_DECLINED = 4;
  RSVP_STATE_COUNTER_PROPOSED = 5;
}

message Attendee {
  string email = 1;
  string display_name = 2;
  RsvpState rsvp_state = 3;
  bool is_organiser = 4;
}

message Event {
  string event_id = 1;
  string tenant_id = 2;
  EventContext context = 3;
  string title = 4;
  string description = 5;
  string location = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  string time_zone = 9;  // IANA tz, e.g., "Asia/Seoul"
  string organiser_user_id = 10;
  repeated Attendee attendees = 11;
  string recurrence_rule = 12;  // RFC 5545 RRULE
  string retention_policy_id = 13;
  bool legal_hold_open = 14;
  int64 version = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  string ownership_pillar = 18;  // "Org" for work events, "Personal" for personal events; details never cross pillar.
  string audit_ref = 19;  // Immutable audit-chain reference for event, attendee, hold, and action-card transitions.
  repeated string legal_hold_ids = 20;
}

// ==================== Event Store ====================

service EventStore {
  rpc CreateEvent(CreateEventRequest) returns (Event);
  rpc GetEvent(GetEventRequest) returns (Event);
  rpc UpdateEvent(UpdateEventRequest) returns (Event);
  rpc CancelEvent(CancelEventRequest) returns (google.protobuf.Empty);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc OpenLegalHold(OpenLegalHoldRequest) returns (LegalHold);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (google.protobuf.Empty);
}

message CreateEventRequest {
  EventContext context = 1;
  string title = 2;
  string description = 3;
  string location = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  string time_zone = 7;
  repeated Attendee attendees = 8;  // max 1000
  string recurrence_rule = 9;
}

message GetEventRequest {
  string event_id = 1;
}

message UpdateEventRequest {
  string event_id = 1;
  Event event = 2;
  int64 expected_version = 3;
}

message CancelEventRequest {
  string event_id = 1;
}

message ListEventsRequest {
  EventContext context = 1;
  google.protobuf.Timestamp starts_after = 2;
  google.protobuf.Timestamp starts_before = 3;
  int32 limit = 4;  // max 1000
  string cursor = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
}

message LegalHold {
  string hold_id = 1;
  string event_id = 2;
  string opened_by_user_id = 3;
  google.protobuf.Timestamp opened_at = 4;
  string reason = 5;
}

// ==================== Explicit Action Card / Workflow Handoff ====================

service CalendarActionWorkflow {
  rpc CompleteActionCard(CompleteActionCardRequest) returns (WorkflowHandoffAuditLog);
}

message ActionCard {
  string action_card_id = 1;
  string event_id = 2;
  string workflow_capability_ref = 3;
  string recipient_ref = 4;
  string policy_basis = 5;
  string state = 6;
  string audit_ref = 7;
}

message CompleteActionCardRequest {
  string action_card_id = 1;
  string event_id = 2;
  string approver_ref = 3;
  string policy_basis = 4;
  string explicit_consent_ref = 5;
}

message WorkflowHandoffAuditLog {
  string workflow_handoff_id = 1;
  string event_id = 2;
  string action_card_id = 3;
  string workflow_capability_ref = 4;
  string policy_basis = 5;
  string audit_ref = 6;
}

message OpenLegalHoldRequest {
  string event_id = 1;
  string opened_by_user_id = 2;
  string reason = 3;
  string related_matter_id = 4;
}

message ReleaseLegalHoldRequest {
  string hold_id = 1;
  string two_person_approver_id = 2;
  string release_reason = 3;
}

// ==================== Recurrence Engine ====================

service RecurrenceEngine {
  rpc ExpandRecurrence(ExpandRecurrenceRequest) returns (ExpandRecurrenceResponse);
}

message ExpandRecurrenceRequest {
  string recurrence_rule = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp window_starts_at = 3;
  google.protobuf.Timestamp window_ends_at = 4;  // ≤ 5y from window_starts_at
}

message Occurrence {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message ExpandRecurrenceResponse {
  repeated Occurrence occurrences = 1;
}

// ==================== Availability Resolver ====================

service AvailabilityResolver {
  rpc QueryAvailability(QueryAvailabilityRequest) returns (QueryAvailabilityResponse);
  rpc OpenCrossTenantGrant(OpenCrossTenantGrantRequest) returns (CrossTenantGrant);
  rpc RevokeCrossTenantGrant(RevokeCrossTenantGrantRequest) returns (google.protobuf.Empty);
}

message AttendeeRef {
  string user_ref = 1;
  string tenant_id = 2;
}

message FreeBusyProjection {
  // Minimum-necessary projection. NO event title, description, location, or attendee fields exposed across tenant boundaries. Compile-time guaranteed by the message shape; LEAN-check enforces.
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  bool busy = 3;
  AttendeeCountBucket attendee_count_bucket = 4;
}

message AttendeeAvailability {
  string user_ref = 1;
  repeated FreeBusyProjection free_busy = 2;
}

message QueryAvailabilityRequest {
  repeated AttendeeRef attendees = 1;  // max 100
  google.protobuf.Timestamp window_starts_at = 2;
  google.protobuf.Timestamp window_ends_at = 3;
  int32 granularity_minutes = 4;
}

message QueryAvailabilityResponse {
  repeated AttendeeAvailability attendees = 1;
}

message CrossTenantGrant {
  string grant_id = 1;
  string from_tenant_id = 2;
  string to_tenant_id = 3;
  string scope = 4;  // "freebusy" only
  google.protobuf.Timestamp opened_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message OpenCrossTenantGrantRequest {
  string from_tenant_id = 1;
  string to_tenant_id = 2;
  string scope = 3;  // must be "freebusy"
  google.protobuf.Timestamp expires_at = 4;
}

message RevokeCrossTenantGrantRequest {
  string grant_id = 1;
}

// ==================== Room Booking ====================

service RoomBooking {
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc BookRoom(BookRoomRequest) returns (BookRoomResponse);
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_ROOM = 1;
  RESOURCE_KIND_DEVICE = 2;
  RESOURCE_KIND_VEHICLE = 3;
  RESOURCE_KIND_VIRTUAL_MEETING = 4;
}

message Resource {
  string resource_id = 1;
  ResourceKind kind = 2;
  string name = 3;
  string location = 4;
  int32 capacity = 5;
}

message ListResourcesRequest {
  ResourceKind kind = 1;
}

message ListResourcesResponse {
  repeated Resource resources = 1;
}

message Booking {
  string booking_id = 1;
  string resource_id = 2;
  string event_id = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  string booker_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message BookRoomRequest {
  string resource_id = 1;
  string event_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  string idempotency_key = 5;
}

message BookingConflictAlternative {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message BookRoomResponse {
  oneof outcome {
    Booking booking = 1;
    BookingConflictResult conflict = 2;
  }
}

message BookingConflictResult {
  string conflicting_booking_id = 1;
  repeated BookingConflictAlternative suggested_alternatives = 2;
}

// ==================== Invitation Flow ====================

service InvitationFlow {
  rpc SubmitRsvp(SubmitRsvpRequest) returns (SubmitRsvpResponse);
}

message SubmitRsvpRequest {
  string invitation_id = 1;
  RsvpState state = 2;
  string reply_token = 3;  // HMAC-signed single-use token
  google.protobuf.Timestamp counter_proposal_starts_at = 4;
}

message SubmitRsvpResponse {
  string invitation_id = 1;
  RsvpState state = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

// ==================== ICS Import / Export ====================

service IcsImportExport {
  rpc StartImport(StartImportRequest) returns (IcsImportJob);
  rpc GetImportStatus(GetImportStatusRequest) returns (IcsImportJob);
  rpc StartExport(StartExportRequest) returns (StartExportResponse);
}

enum IcsImportState {
  ICS_IMPORT_STATE_UNSPECIFIED = 0;
  ICS_IMPORT_STATE_PENDING = 1;
  ICS_IMPORT_STATE_PARSING = 2;
  ICS_IMPORT_STATE_IMPORTING = 3;
  ICS_IMPORT_STATE_COMPLETED = 4;
  ICS_IMPORT_STATE_PARTIAL_SUCCESS = 5;
  ICS_IMPORT_STATE_FAILED = 6;
  ICS_IMPORT_STATE_QUARANTINED = 7;
}

message IcsImportError {
  int32 line = 1;
  string error_kind = 2;
  string sample = 3;
}

message IcsImportJob {
  string job_id = 1;
  IcsImportState state = 2;
  int32 event_count_planned = 3;
  int32 event_count_imported = 4;
  int32 event_count_skipped = 5;
  repeated IcsImportError errors = 6;
}

message StartImportRequest {
  bytes ics_payload = 1;  // RFC 5545; max 100k events; max 8KB per line
  EventContext target_context = 2;
}

message GetImportStatusRequest {
  string job_id = 1;
}

message StartExportRequest {
  EventContext context = 1;
  google.protobuf.Timestamp starts_after = 2;
  google.protobuf.Timestamp starts_before = 3;
}

message StartExportResponse {
  bytes ics_payload = 1;
  int32 event_count = 2;
}
