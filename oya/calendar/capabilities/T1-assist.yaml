# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — calendar µservice
#
# Autonomy Tier 1: "assist with bounded reversibility". The system takes an
# action, but it is bounded, reversible within a short window, and
# attributed to the agent + user clearly. User can cancel within the
# reversibility window. After the window closes, the action stands.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 transparency + Art. 14 human oversight.

doc_class: AutonomyTierCatalog
microservice: calendar
tier: T1
owner_team: axis-calendar + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-cal-smart-scheduling
    name: "Smart-scheduling on user behalf (auto-book best slot)"
    description: |
      User authorises the assistant to find a slot, book a room, and send
      invitations on the user's behalf for a meeting with a known set of
      attendees + a soft deadline. The assistant picks the best slot per
      free/busy + preferences, books a room, drafts a title + agenda,
      and sends invitations. The user is notified at each step and can
      cancel within a 30-second reversibility window.
    surface: assistant-ui (REST POST /v1/assist/smart-schedule)
    triggers:
      - user explicitly requests "schedule a meeting" via assistant
      - user provides attendee list + deadline + duration
    consent_basis:
      personal_context: explicit-on-invocation (user invokes assistant)
      professional_context: explicit-on-invocation + tenant-policy-admission (Cedar admits T1 for tenant tier)
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted:
      - INTERNAL_ONLY (slot + room + title + agenda)
      - PII_IDENTIFYING (invitation envelopes via mail bridge)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert event + cancel invitations + restore room availability
      cancel_surface: in-product banner + Workflow webhook
    cross_tenant_consultation:
      allowed: yes-when-cedar-admits
      surface: free/busy projection only
    model:
      primary: tenant-default-llm
      fallback: rule-based (slot-finder heuristic + default-room + template-title)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 2000 (target completion within 2s for typical 5-attendee scheduling)
    audit_event: CalendarSmartScheduledOnBehalf (Ed25519-sealed; payload — event hash + reversibility window expiry)
    fallback_on_model_failure: fall back to T0 suggestion mode (suggest only; do not act)
    risk_classification: limited-risk (Annex III §3 may apply for HR-scheduling overlay; per-pack ADR closes the EU AI Act conformity assessment for HR overlay — defers to a future ADR-CAL-XXXX)
    user_label: "AI is scheduling on your behalf — cancel within 30s"  # Art. 50 + Art. 14

  - id: T1-cal-auto-decline-conflicts
    name: "Auto-decline conflicts with policy-bound override"
    description: |
      When the user receives an invitation that conflicts with an existing
      higher-priority commitment, the assistant auto-declines on behalf of
      the user with a templated polite reason + suggestion to find an
      alternative time. The user can override the auto-decline within the
      30-second reversibility window. After the window, the decline stands.
    surface: notification-ui (REST POST /v1/assist/auto-decline) + Workflow trigger
    triggers:
      - incoming invitation overlaps a calendar block marked priority ≥ N (user-configurable)
      - user has opted in to auto-decline (per-user preference)
    consent_basis:
      personal_context: explicit-on-opt-in (user has explicitly enabled auto-decline)
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: PII_IDENTIFYING (decline reply via mail bridge)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert decline (re-mark as pending); re-fire the inbound invitation notification
      cancel_surface: in-product banner + Workflow webhook
    model:
      primary: rule-based (no LLM — priority comparison is deterministic)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 500
    audit_event: CalendarInvitationAutoDeclined (Ed25519-sealed; payload — invitation id hash + reason template id + reversibility window expiry)
    fallback_on_model_failure: n/a
    risk_classification: minimal-risk (deterministic logic; no LLM inference)
    user_label: "Auto-declined due to conflict — undo within 30s"

  - id: T1-cal-auto-rebook-cancelled
    name: "Auto-rebook a slot when an attendee cancels"
    description: |
      When an attendee's "yes" turns into a "no" on a meeting that user
      authored, the assistant proposes 3 alternative slots (where the
      remaining attendees are still free) and asks the user to pick. If
      the user picks, the assistant rebooks. The pick step is the
      reversibility gate; the assistant does NOT rebook without explicit
      user pick.
    surface: notification-ui (REST POST /v1/assist/auto-rebook)
    triggers:
      - existing event's required attendee RSVPs decline within 24h of event start
      - user has opted in to auto-rebook
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (3-slot suggestion; no envelope until user picks)
    reversibility:
      window_seconds: gated-by-pick (no auto-rebook until user picks; pick is the irreversible commit)
      action_on_cancel: dismiss the notification; original event stays
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm (slot ranking)
      fallback: rule-based heuristic
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 1500
    audit_event: CalendarAutoRebookSuggested (Ed25519-sealed; payload — event id hash + 3 candidate slot hashes)
    fallback_on_model_failure: fall back to T0 (suggest only)
    risk_classification: minimal-risk
    user_label: "AI suggested rebook — pick to confirm"

verification:
  - All T1 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting.
  - All T1 actions emit an audit-chain event (Ed25519-sealed) on action-initiated AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T1 actions are labelled per EU AI Act Art. 50 + offer the Art. 14 human-oversight cancel-within-window control.
  - All T1 actions respect dual-context isolation: Personal-context actions NEVER touch Professional-context data; Professional-context actions NEVER touch Personal-context data.
  - All T1 actions are tenant-tenant_class-gated: Cedar policy `cedar/t1-tenant-tier-gate.cedar` admits T1 only for tenant tiers ≥ pro.
  - HR-scheduling overlay (T1-cal-smart-scheduling when used for hiring / performance review / employment-decision adjacent contexts) is DEFERRED to a future ADR-CAL-XXXX for the EU AI Act Annex III §3 conformity assessment; until that ADR ships, the HR overlay is REFUSED at the Cedar layer for pack-eu tenants.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §3 employment-context obligation.
  - microservices/calendar/PRD.md §FR-12 (delegate event ownership) — adjacent surface.
  - microservices/calendar/policy/event-isolation.md.
  - microservices/mail/capabilities/T1-assist.yaml — sibling reference.
