# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T2-auto capabilities — calendar µservice
#
# Autonomy Tier 2: "autonomous, irreversible at completion". The system
# takes actions on a recurring basis WITHOUT per-action user approval,
# under a documented policy boundary. User can revoke the policy at any
# time; future actions stop. Past actions stand.
#
# T2 has the highest scrutiny: explicit Cedar tenant-tier admission, full
# audit-chain coverage, EU AI Act limited-risk classification with
# conformity assessment for HR overlays.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 + Art. 14 + Annex III §3.

doc_class: AutonomyTierCatalog
microservice: calendar
tier: T2
owner_team: axis-calendar + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly + annually for AI Act conformity

capabilities:
  - id: T2-cal-auto-block-focus
    name: "Auto-block focus time on the calendar"
    description: |
      User policy: "keep at least 4 hours of contiguous focus time per
      weekday." The assistant continuously monitors the user's upcoming
      week and auto-creates "focus block" events (priority 9; no
      attendees; not externally visible) to protect the unscheduled
      contiguous slots. As new meetings get scheduled, the assistant
      adjusts the focus blocks. The user can change the policy or
      revoke it at any time; existing focus blocks remain unless the
      user deletes them.
    surface: background-worker (oya-calendar-event-store-worker — focus-block sub-worker)
    triggers:
      - tick on policy refresh interval (default 1h)
      - new event lifecycle event (EventCreated/Updated/Canceled) for the user
      - user policy change
    consent_basis:
      personal_context: explicit-on-opt-in (user enables focus-block policy)
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: BEHAVIORAL_TENANT_PRODUCT (focus-block events; no externally visible content)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: not auto-reverted (focus blocks remain; user can delete)
      cancel_surface: settings UI + Workflow webhook + REST DELETE /v1/policies/focus-block
    model:
      primary: rule-based (deterministic slot-finder)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: "per-tick: 5000 (background; not user-facing)"
    audit_event:
      - CalendarFocusBlockPolicyEnabled (one-shot; Ed25519-sealed)
      - CalendarFocusBlockCreated (per-block; Ed25519-sealed)
      - CalendarFocusBlockAdjusted (per-adjustment; Ed25519-sealed)
      - CalendarFocusBlockPolicyDisabled (one-shot; Ed25519-sealed)
    risk_classification: minimal-risk (deterministic logic; no LLM)
    user_label: "Focus time auto-protected by AI"  # Art. 50
    cedar_admission_path: |
      tenant-scope.cedar :: action::CalendarT2EnablePolicy admits when
      tenant.tier >= pro AND user.has_opted_in_to_t2_calendar_policies.

  - id: T2-cal-auto-decline-recurring-conflicts
    name: "Auto-decline recurring conflicts (policy-bound)"
    description: |
      Extension of T1-cal-auto-decline-conflicts to the recurring case.
      When a recurring meeting (RRULE-bound) consistently conflicts with
      higher-priority commitments, the assistant declines the recurring
      series with a templated reason. Once declined, the series remains
      declined unless re-opted-in.
    surface: background-worker (oya-calendar-invitation-flow-worker)
    triggers:
      - recurring invitation arrives with conflicts in ≥ 3 of the next 5 occurrences
      - user has opted in to auto-decline-recurring
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: explicit-on-opt-in + tenant-policy-admission
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: PII_IDENTIFYING (decline reply via mail bridge)
    reversibility:
      revocability: revocable at any time via policy disable
      past_actions: not auto-reverted (declines remain; user can re-accept the series via direct action)
      cancel_surface: settings UI + Workflow webhook
    model:
      primary: rule-based (deterministic conflict count)
      fallback: no fallback needed
      private_inference: n/a
    latency_budget_p99_ms: 2000 (per-decline)
    audit_event:
      - CalendarRecurringSeriesAutoDeclined (Ed25519-sealed; payload — series id hash + reason template + per-occurrence conflict count)
    risk_classification: minimal-risk
    user_label: "Series auto-declined due to recurring conflicts"
    cedar_admission_path: |
      tenant-scope.cedar :: action::CalendarT2DeclineRecurring admits when
      tenant.tier >= pro AND user.has_opted_in_to_t2_calendar_policies.

  - id: T2-cal-auto-room-rebalance
    name: "Auto-rebalance room assignments tenant-wide"
    description: |
      Tenant-admin policy: "automatically rebalance room assignments at
      00:00 daily to maximise utilisation under attendee-count + AV-
      equipment + accessibility constraints." The assistant runs an
      optimisation pass over the next 14 days' bookings and proposes
      room swaps; per-tenant policy decides whether swaps auto-apply
      (T2) or surface as admin-approval queue (T1).
    surface: background-worker (oya-calendar-room-booking-worker — rebalance sub-worker)
    triggers:
      - tick at 00:00 daily (per-tenant timezone-aware)
      - tenant policy "auto-apply rebalance" set
    consent_basis:
      personal_context: not-applicable (rooms are tenant-resource scope)
      professional_context: explicit-on-tenant-admin-opt-in + tenant-tier-admission
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted:
      - BEHAVIORAL_TENANT_PRODUCT (booking swap actions)
      - PII_IDENTIFYING (notification to affected attendees of room change via mail bridge)
    reversibility:
      revocability: revocable at any time via tenant-admin policy disable
      past_actions: not auto-reverted (room swaps remain; tenant admin can manually revert)
      cancel_surface: tenant-admin portal + Workflow webhook
    model:
      primary: tenant-default-llm + linear-programming optimiser (constraint solver)
      fallback: rule-based heuristic (highest-utilisation-first)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: "per-daily-tick: 60000 (60s; background; not user-facing)"
    audit_event:
      - CalendarRoomRebalancePolicyEnabled (Ed25519-sealed)
      - CalendarRoomRebalanceRunCompleted (per-run; Ed25519-sealed; payload — # swaps + utilisation delta)
      - CalendarRoomRebalanceBookingSwapped (per-swap; Ed25519-sealed; payload — booking id hash + old room + new room)
    risk_classification: limited-risk (Annex III §3 may apply for hiring-room rebalancing in pack-eu HR overlays — DEFER to a future ADR for the conformity assessment; until then, pack-eu refuses T2-cal-auto-room-rebalance for hiring contexts at the Cedar layer)
    user_label: "Rooms auto-rebalanced by AI overnight"  # per-affected-attendee notification + Art. 50
    cedar_admission_path: |
      tenant-scope.cedar :: action::CalendarT2RebalanceRooms admits when
      tenant.tier >= enterprise AND tenant_admin.has_opted_in_to_t2_room_rebalance.

verification:
  - All T2 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting AND on each scheduled tick.
  - All T2 actions emit an audit-chain event (Ed25519-sealed) on policy-enabled, on each action, on policy-disabled.
  - All T2 actions are tenant-tenant_class-gated: Cedar policy `cedar/t2-tenant-tier-gate.cedar` admits T2 only for tenant tiers ≥ pro (focus-block + auto-decline-recurring) or ≥ enterprise (auto-room-rebalance).
  - T2 actions for HR-context overlays in pack-eu are REFUSED at the Cedar layer pending EU AI Act Annex III §3 conformity assessment ADR.
  - T2 actions respect dual-context isolation: Personal-context T2 actions NEVER touch Professional-context data; Professional-context T2 actions NEVER touch Personal-context data.
  - T2 actions emit user-visible labelling per EU AI Act Art. 50 at each affected user/attendee.
  - T2 actions are continuously reviewed: annual conformity-assessment cycle for any T2 capability that touches EU AI Act Annex III scope.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §3 employment-context.
  - microservices/calendar/PRD.md §FR-14 (Workflow webhook on event-state change) — referenced for policy-disable propagation.
  - microservices/calendar/policy/event-isolation.md.
  - microservices/mail/capabilities/T2-auto.yaml — sibling reference.
