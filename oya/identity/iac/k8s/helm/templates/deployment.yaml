{{- $imageDigest := .Values.image.digest | default "" -}}
{{- if and .Values.image.cosign.required (not (and (regexMatch "^sha256:[0-9a-f]{64}$" $imageDigest) (regexMatch "[1-9a-f]" (trimPrefix "sha256:" $imageDigest)))) -}}
{{- fail "image.digest must be set to a real non-zero sha256 digest when image.cosign.required=true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.id | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/cargo-package: {{ .Values.microservice.cargoPackage | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
      annotations:
        cosign.sigstore.dev/required: {{ .Values.image.cosign.required | quote }}
        oyatie.com/image-digest: {{ $imageDigest | quote }}
        oyatie.com/image-promotion-policy: {{ .Values.image.cosign.policy | quote }}
        oyatie.com/audit-chain-event: "microservice-deployment"
    spec:
      runtimeClassName: {{ .Values.podRuntime.runtimeClassName | quote }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}{{- if $imageDigest }}@{{ $imageDigest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcTargetPort }}
          env:
            - name: OYA_MICROSERVICE
              value: {{ .Values.microservice.id | quote }}
            - name: OYA_CARGO_PACKAGE
              value: {{ .Values.microservice.cargoPackage | quote }}
            - name: OYA_OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OYA_IMAGE_PROMOTION_POLICY
              value: {{ .Values.config.imagePromotionPolicy | quote }}
            - name: OYA_IDENTITY_REST_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: OYA_IDENTITY_GRPC_ADDR
              value: "0.0.0.0:{{ .Values.service.grpcTargetPort }}"
            - name: OYA_IDENTITY_ISSUER
              value: {{ .Values.identity.issuer | quote }}
            - name: OYA_IDENTITY_AUDIENCE
              value: {{ .Values.identity.audience | quote }}
            - name: OYA_IDENTITY_JWKS_PATH
              value: /etc/oya-identity/keys/jwks.json
            - name: OYA_IDENTITY_CEDAR_POLICY_PATH
              value: /etc/oya-identity/cedar/policies.cedar
            {{- if .Values.identity.signingKeySecretName }}
            - name: OYA_IDENTITY_SIGNING_KEY_PATH
              value: {{ .Values.identity.signingKeyPath | quote }}
            {{- end }}
            {{- if .Values.identity.principalsConfigMapName }}
            - name: OYA_IDENTITY_PRINCIPALS_PATH
              value: /etc/oya-identity/principals/principals.json
            {{- end }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/oya-identity/keys
              readOnly: true
            - name: cedar-policies
              mountPath: /etc/oya-identity/cedar
              readOnly: true
            {{- if .Values.identity.signingKeySecretName }}
            - name: signing-key
              mountPath: /etc/oya-identity/signing
              readOnly: true
            {{- end }}
            {{- if .Values.identity.principalsConfigMapName }}
            - name: principals
              mountPath: /etc/oya-identity/principals
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: jwks
          secret:
            secretName: {{ .Values.identity.jwksSecretName | quote }}
        - name: cedar-policies
          configMap:
            name: {{ .Values.cedar.policyConfigMapName | quote }}
        {{- if .Values.identity.signingKeySecretName }}
        - name: signing-key
          secret:
            secretName: {{ .Values.identity.signingKeySecretName | quote }}
            items:
              - key: {{ .Values.identity.signingKeySecretKey | quote }}
                path: signing-key.pk8
        {{- end }}
        {{- if .Values.identity.principalsConfigMapName }}
        - name: principals
          configMap:
            name: {{ .Values.identity.principalsConfigMapName | quote }}
        {{- end }}
