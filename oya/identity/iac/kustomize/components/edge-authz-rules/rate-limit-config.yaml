apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: identity-rate-limit
  namespace: istio-ingress
spec:
  workloadSelector:
    labels: { istio: ingressgateway }
  configPatches:
    - applyTo: HTTP_FILTER
      match: { context: GATEWAY }
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: identity-edge
            failure_mode_deny: false
            rate_limit_service:
              grpc_service:
                envoy_grpc:
                  cluster_name: rate-limit-service
              transport_api_version: V3
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: identity-rate-limit-descriptors
  namespace: istio-ingress
spec:
  configPatches:
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost: { name: "identity.oyatie.com:443" }
      patch:
        operation: MERGE
        value:
          rate_limits:
            # Per-IP limit on token endpoint.
            - actions:
                - request_headers:
                    header_name: ":path"
                    descriptor_key: "path"
                - remote_address: {}
            # Per-tenant limit on token endpoint (tenant_id header from PoP).
            - actions:
                - request_headers:
                    header_name: ":path"
                    descriptor_key: "path"
                - request_headers:
                    header_name: "x-tenant-id"
                    descriptor_key: "tenant_id_header"
