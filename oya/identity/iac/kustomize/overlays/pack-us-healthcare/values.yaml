# pack-us-healthcare overlay per HIPAA §164.312 + ADR-0179
packLabel: us-healthcare
zitadel:
  zitadelConfig:
    externalDomain: identity-us-healthcare.oyatie.com
    Telemetry:
      Endpoint: otel-collector.observability-us-healthcare.svc.cluster.local:4317
webauthn:
  attestation: direct  # HIPAA requires strong identity
  rpId: identity-us-healthcare.oyatie.com
openbao:
  hsm:
    type: aws-cloudhsm
    region: us-east-1
    hipaa_eligible: true
aaguidRefresher:
  enforce_l1_plus: true
auditEmitter:
  retention_years: 6  # HIPAA §164.316(b)(2)
edgeAuthz:
  geo_default: deny
  geo_allow: [US, CA]  # HIPAA US-PHI residency
