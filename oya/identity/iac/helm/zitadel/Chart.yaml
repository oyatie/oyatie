apiVersion: v2
name: oya-identity-zitadel
description: |
  Helm chart for the identity µservice's Zitadel deployment per ADR-0187.
  Pinned to upstream Zitadel chart v9.34.1 (May 2026) [^1]; Zitadel app v2.55.0.
  Production-grade: 3-replica HA, Postgres event-store, OpenBao SecretReference,
  Istio Ambient enrolment, HPA + PDB, NetworkPolicy lockdown.

type: application
version: 0.1.0
appVersion: "2.55.0"
kubeVersion: ">=1.29.0"

dependencies:
  - name: zitadel
    version: "9.34.1"
    repository: "https://charts.zitadel.com"

maintainers:
  - name: axis-identity
    url: https://oyatie.com/teams/axis-identity

keywords:
  - identity
  - oidc
  - scim
  - webauthn
  - passkey
  - step-up
  - zitadel

# [^1]: Versions current as of 2026-05-18. Verified via WebSearch:
#       https://github.com/zitadel/zitadel-charts/releases
#       https://artifacthub.io/packages/helm/zitadel/zitadel
