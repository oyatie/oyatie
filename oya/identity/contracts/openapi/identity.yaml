openapi: 3.2.0
info:
  title: oya-identity
  version: 1.0.0
  summary: OIDC issuer + WebAuthn relying-party + SCIM 2.0 + step-up + JWKS for the identity µservice
  description: |
    Per-pack identity substrate per ADR-0187. Authoritative source of:
    - OIDC ID-tokens with `tenant_id`, `acr`, `purpose`, `data_class` claims (ADR-0145).
    - JWKS endpoint with 24h rotation.
    - WebAuthn Level-3 relying-party endpoints (ADR-0188).
    - SCIM 2.0 inbound provisioning per RFC 7644 (ADR-0190).
    - Step-up ACR orchestration (ADR-0189).
    - External IdP federation bindings.

    The JWKS endpoint is unauthenticated and cached 24h.
    The OIDC discovery endpoint (`/.well-known/openid-configuration`) is unauthenticated.
    WebAuthn `/authenticate/*` endpoints are pre-auth (the assertion IS the auth).
    SCIM endpoints require per-tenant bearer + tenant-scope Cedar policy.
    Step-up endpoints require a valid (lower-tier) OIDC bearer.

    CRITICAL — token responses NEVER carry the secret in a redirectable URL parameter.
    All token issuance is via POST + JSON body; refresh tokens are HttpOnly cookies.
  contact:
    name: axis-identity
    url: https://oyatie.com/teams/axis-identity
  license:
    name: Internal
servers:
  - url: https://identity-{pack}.oyatie.com
    description: Per-pack identity endpoint
    variables:
      pack:
        default: eu
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
tags:
  - name: oidc
    description: OIDC issuance + verification + JWKS
  - name: webauthn
    description: WebAuthn L3 register + authenticate
  - name: scim
    description: SCIM 2.0 inbound provisioning per tenant
  - name: step-up
    description: ACR step-up orchestration
  - name: federation
    description: External IdP federation bindings
  - name: admin
    description: Operational admin endpoints

paths:
  /.well-known/openid-configuration:
    get:
      tags: [oidc]
      summary: OIDC discovery document
      operationId: getOidcDiscovery
      responses:
        '200':
          description: OIDC discovery per RFC 8414
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcDiscovery'

  /oauth/v2/keys:
    get:
      tags: [oidc]
      summary: JWKS endpoint (24h cache TTL)
      operationId: getJwks
      responses:
        '200':
          description: JWKS document
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=86400" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /oauth/v2/token:
    post:
      tags: [oidc]
      summary: OAuth 2.0 token issuance (authorization_code + refresh_token + device_code + client_credentials)
      operationId: postToken
      x-acr-required: routine
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: invalid grant / invalid request
        '401':
          description: invalid client credentials

  /oauth/v2/userinfo:
    get:
      tags: [oidc]
      summary: UserInfo endpoint
      operationId: getUserInfo
      security:
        - oidcBearer: []
      responses:
        '200':
          description: userinfo claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /webauthn/register/start:
    post:
      tags: [webauthn]
      summary: Begin WebAuthn registration ceremony
      operationId: beginWebauthnRegistration
      x-acr-required: elevated
      security:
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginRegistrationRequest'
      responses:
        '200':
          description: registration challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallenge'

  /webauthn/register/finish:
    post:
      tags: [webauthn]
      summary: Finish WebAuthn registration ceremony
      operationId: finishWebauthnRegistration
      x-acr-required: elevated
      security:
        - oidcBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationResponse'
      responses:
        '201':
          description: credential persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'

  /webauthn/authenticate/start:
    post:
      tags: [webauthn]
      summary: Begin WebAuthn authentication ceremony (pre-auth allowed)
      operationId: beginWebauthnAuthentication
      x-acr-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginAuthenticationRequest'
      responses:
        '200':
          description: authentication challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationChallenge'

  /webauthn/authenticate/finish:
    post:
      tags: [webauthn]
      summary: Finish WebAuthn authentication (mints OIDC session)
      operationId: finishWebauthnAuthentication
      x-acr-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationResponse'
      responses:
        '200':
          description: tokens minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /webauthn/credentials:
    get:
      tags: [webauthn]
      summary: List the authenticated user's WebAuthn credentials
      operationId: listWebauthnCredentials
      x-acr-required: elevated
      security:
        - oidcBearer: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
    delete:
      tags: [webauthn]
      summary: Revoke a WebAuthn credential
      operationId: deleteWebauthnCredential
      x-acr-required: sensitive
      security:
        - oidcBearer: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: revoked

  /scim/v2/{tenant}/Users:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [scim]
      summary: SCIM list users
      operationId: scimListUsers
      x-acr-required: routine
      security:
        - scimBearer: []
      parameters:
        - name: startIndex
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: filter
          in: query
          schema: { type: string }
      responses:
        '200':
          description: SCIM ListResponse
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimListUsers' }
    post:
      tags: [scim]
      summary: SCIM create user
      operationId: scimCreateUser
      x-acr-required: elevated
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimUser' }
      responses:
        '201':
          description: created
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimUser' }
        '409':
          description: uniqueness (userName already exists)

  /scim/v2/{tenant}/Users/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [scim]
      summary: SCIM get user
      operationId: scimGetUser
      x-acr-required: routine
      security: [ { scimBearer: [] } ]
      responses:
        '200':
          description: user
          content:
            application/scim+json:
              schema: { $ref: '#/components/schemas/ScimUser' }
    put:
      tags: [scim]
      summary: SCIM replace user
      operationId: scimReplaceUser
      x-acr-required: elevated
      security: [ { scimBearer: [] } ]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimUser' }
      responses:
        '200':
          description: replaced
    patch:
      tags: [scim]
      summary: SCIM patch user
      operationId: scimPatchUser
      x-acr-required: elevated
      security: [ { scimBearer: [] } ]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimPatchOp' }
      responses:
        '200':
          description: patched
    delete:
      tags: [scim]
      summary: SCIM delete user (cascades to DSR per ADR-0156)
      operationId: scimDeleteUser
      x-acr-required: sensitive
      security: [ { scimBearer: [] } ]
      responses:
        '204':
          description: deleted

  /scim/v2/{tenant}/Groups:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }]
    get:
      tags: [scim]
      x-acr-required: routine
      security: [ { scimBearer: [] } ]
      operationId: scimListGroups
      responses: { '200': { description: list } }
    post:
      tags: [scim]
      x-acr-required: elevated
      security: [ { scimBearer: [] } ]
      operationId: scimCreateGroup
      responses: { '201': { description: created } }

  /scim/v2/{tenant}/Groups/{id}:
    parameters: [{ name: tenant, in: path, required: true, schema: { type: string } }, { name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [scim]
      x-acr-required: elevated
      security: [ { scimBearer: [] } ]
      operationId: scimPatchGroup
      responses: { '200': { description: patched } }
    delete:
      tags: [scim]
      x-acr-required: sensitive
      security: [ { scimBearer: [] } ]
      operationId: scimDeleteGroup
      responses: { '204': { description: deleted } }

  /step-up:
    get:
      tags: [step-up]
      summary: Render step-up UI
      operationId: getStepUp
      x-acr-exempt: true
      parameters:
        - name: required_acr
          in: query
          required: true
          schema: { type: string, enum: [elevated, sensitive, critical] }
        - name: return_to
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML or JSON describing the step-up flow

  /step-up/passkey/start:
    post:
      tags: [step-up]
      operationId: stepUpPasskeyStart
      x-acr-required: routine
      security: [ { oidcBearer: [] } ]
      responses: { '200': { description: assertion challenge } }

  /step-up/passkey/finish:
    post:
      tags: [step-up]
      operationId: stepUpPasskeyFinish
      x-acr-required: routine
      security: [ { oidcBearer: [] } ]
      responses: { '200': { description: new token with elevated acr } }

  /step-up/it-approval/request:
    post:
      tags: [step-up]
      operationId: stepUpItApprovalRequest
      x-acr-required: sensitive
      security: [ { oidcBearer: [] } ]
      responses: { '202': { description: approval ticket created } }

  /step-up/it-approval/finish:
    post:
      tags: [step-up]
      operationId: stepUpItApprovalFinish
      x-acr-required: sensitive
      security: [ { oidcBearer: [] } ]
      responses: { '200': { description: critical token minted } }

  /federation/bindings:
    get:
      tags: [federation]
      x-acr-required: elevated
      security: [ { oidcBearer: [] } ]
      operationId: listFederationBindings
      responses: { '200': { description: list } }
    post:
      tags: [federation]
      x-acr-required: sensitive
      security: [ { oidcBearer: [] } ]
      operationId: createFederationBinding
      responses: { '201': { description: bound } }

  /federation/bindings/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [federation]
      x-acr-required: critical
      security: [ { oidcBearer: [] } ]
      operationId: deleteFederationBinding
      responses: { '204': { description: unbound } }

  /admin/jwks/rotate:
    post:
      tags: [admin]
      summary: Rotate JWKS signing key (operator-only)
      operationId: rotateJwks
      x-acr-required: critical
      security: [ { oidcBearer: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [scheduled, emergency] }
      responses: { '202': { description: rotation initiated } }

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: identity
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC ID-token issued by this issuer; verified per ADR-0145
    scimBearer:
      type: http
      scheme: bearer
      description: Per-tenant SCIM bearer; provisioned via /admin and rotated 90d
  schemas:
    OidcDiscovery:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        jwks_uri: { type: string }
        registration_endpoint: { type: string }
        scopes_supported: { type: array, items: { type: string } }
        response_types_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        id_token_signing_alg_values_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        acr_values_supported: { type: array, items: { type: string, enum: [routine, elevated, sensitive, critical] } }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kid: { type: string }
              kty: { type: string }
              alg: { type: string, enum: [RS256, ES256] }
              use: { type: string }
              n: { type: string }
              e: { type: string }
              x: { type: string }
              y: { type: string }
              crv: { type: string }
    TokenRequest:
      type: object
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token, device_code, client_credentials] }
        code: { type: string }
        refresh_token: { type: string }
        device_code: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        code_verifier: { type: string }
        scope: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
        id_token: { type: string }
        scope: { type: string }
    UserInfo:
      type: object
      properties:
        sub: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        name: { type: string }
        tenant_id: { type: string }
        acr: { type: string, enum: [routine, elevated, sensitive, critical] }
        purpose: { type: string }
        data_class: { type: string }
    BeginRegistrationRequest:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string }
        display_name: { type: string }
    RegistrationChallenge:
      type: object
      properties:
        challenge_id: { type: string }
        challenge: { type: string }
        rp: { type: object }
        user: { type: object }
        pubKeyCredParams: { type: array }
        attestation: { type: string }
        timeout: { type: integer }
        excludeCredentials: { type: array }
    RegistrationResponse:
      type: object
      properties:
        challenge_id: { type: string }
        clientDataJSON: { type: string }
        attestationObject: { type: string }
        transports: { type: array, items: { type: string } }
    BeginAuthenticationRequest:
      type: object
      properties:
        allow_credentials: { type: array, items: { type: string } }
        mediation: { type: string, enum: [silent, optional, required, conditional] }
    AuthenticationChallenge:
      type: object
      properties:
        challenge_id: { type: string }
        challenge: { type: string }
        rpId: { type: string }
        allowCredentials: { type: array }
        userVerification: { type: string, enum: [required, preferred, discouraged] }
        timeout: { type: integer }
    AuthenticationResponse:
      type: object
      properties:
        challenge_id: { type: string }
        credentialId: { type: string }
        clientDataJSON: { type: string }
        authenticatorData: { type: string }
        signature: { type: string }
        userHandle: { type: string }
    Credential:
      type: object
      properties:
        credential_id: { type: string }
        aaguid: { type: string, format: uuid }
        transports: { type: array, items: { type: string } }
        backup_eligible: { type: boolean }
        backup_state: { type: boolean }
        last_used_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ScimUser:
      type: object
      required: [schemas, userName]
      properties:
        schemas: { type: array, items: { type: string } }
        id: { type: string }
        externalId: { type: string }
        userName: { type: string }
        name:
          type: object
          properties:
            givenName: { type: string }
            familyName: { type: string }
        emails: { type: array }
        active: { type: boolean }
        meta:
          type: object
          properties:
            resourceType: { type: string }
            created: { type: string, format: date-time }
            lastModified: { type: string, format: date-time }
            location: { type: string }
            version: { type: string }
    ScimListUsers:
      type: object
      properties:
        schemas: { type: array, items: { type: string } }
        totalResults: { type: integer }
        Resources: { type: array, items: { $ref: '#/components/schemas/ScimUser' } }
        itemsPerPage: { type: integer }
        startIndex: { type: integer }
    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      properties:
        schemas: { type: array, items: { type: string } }
        Operations:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [add, replace, remove] }
              path: { type: string }
              value: {}
