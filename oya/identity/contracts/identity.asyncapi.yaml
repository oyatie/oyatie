asyncapi: 3.1.0
info:
  title: Oyatie Workload-Identity Event Streams
  version: 1.0.0
  description: |
    AsyncAPI 3.1 contract for the workload-identity bounded context of the
    `identity` µservice (ADR-0002, ADR-0131, ADR-0162 per-tenant audit slicing).

    Two event families, grounded in the best-practice brief §3 + §9:

    1. `identity.principal.lifecycle.v1` — every WorkloadPrincipal state
       transition (provision → active → suspended → retired). Carries old→new
       state, actor, and trust domain.
    2. `identity.authz.decision.v1` — every authorization decision rendered by
       the PDP, AND every token-validation outcome, as the **primary audit
       substrate**. The managed analog (AVP→CloudTrail) is opt-in and lands in
       `additionalEventData`; here we emit unconditionally (brief load-bearing
       flag #3 + §9).

    Subject-id contract (brief §3, §5): every event carries a stable,
    monotonic, **never-reused** `subject` id (`evt_<ULID>`). Retired principal
    ids are tombstoned and never reissued, so subject→principal correlation is
    one-to-one for non-repudiation (brief §9, GCP one-to-one subject mapping).
defaultContentType: application/cloudevents+json; charset=utf-8
servers:
  pulsar-cell:
    host: pulsar.observability.svc.cluster.local:6650
    protocol: pulsar+ssl
    description: Cell-local Pulsar broker (mTLS via SPIFFE, ADR-0148).
channels:
  identity.principal.lifecycle.v1:
    address: persistent://public/default/oya.identity.principal.lifecycle.v1
    description: WorkloadPrincipal lifecycle transitions.
    messages:
      principalProvisioned: { $ref: '#/components/messages/WorkloadPrincipalProvisioned' }
      principalActivated: { $ref: '#/components/messages/WorkloadPrincipalActivated' }
      principalSuspended: { $ref: '#/components/messages/WorkloadPrincipalSuspended' }
      principalRetired: { $ref: '#/components/messages/WorkloadPrincipalRetired' }
  identity.authz.decision.v1:
    address: persistent://public/default/oya.identity.authz.decision.v1
    description: |
      Authorization decisions + token-validation outcomes. Immutable, append-only,
      sealed into the audit chain (brief §9). Captured as two distinct event types
      so validation and authorization outcomes can be reconciled separately.
    messages:
      authorizationDecided: { $ref: '#/components/messages/AuthorizationDecided' }
      tokenValidated: { $ref: '#/components/messages/TokenValidationOutcome' }
operations:
  emitPrincipalLifecycle:
    action: send
    channel:
      $ref: '#/channels/identity.principal.lifecycle.v1'
    summary: Identity emits a lifecycle event on every WorkloadPrincipal state transition.
    messages:
      - $ref: '#/channels/identity.principal.lifecycle.v1/messages/principalProvisioned'
      - $ref: '#/channels/identity.principal.lifecycle.v1/messages/principalActivated'
      - $ref: '#/channels/identity.principal.lifecycle.v1/messages/principalSuspended'
      - $ref: '#/channels/identity.principal.lifecycle.v1/messages/principalRetired'
  emitAuthzDecision:
    action: send
    channel:
      $ref: '#/channels/identity.authz.decision.v1'
    summary: Identity emits one immutable record per authorize call and per token-validation outcome.
    messages:
      - $ref: '#/channels/identity.authz.decision.v1/messages/authorizationDecided'
      - $ref: '#/channels/identity.authz.decision.v1/messages/tokenValidated'
components:
  messageTraits:
    cloudEventEnvelope:
      headers:
        type: object
        required: [specversion, type, source, id, time]
        properties:
          specversion: { type: string, const: "1.0" }
          type: { type: string, description: CloudEvents event type, e.g. oya.identity.authz.decision.v1 }
          source: { type: string, description: Emitting cell + bounded context. }
          id:
            type: string
            description: Stable, never-reused event id (`evt_<ULID>`). One-to-one with the decision/transition.
            pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          time: { type: string, format: date-time }
          subject:
            type: string
            description: |
              Stable never-reused subject id (the principal id or decision id this
              event is about). Retired ids are tombstoned and never reused.
  messages:
    WorkloadPrincipalProvisioned:
      name: WorkloadPrincipalProvisioned
      title: WorkloadPrincipal provisioned (→ provision)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/LifecycleEvent' }
    WorkloadPrincipalActivated:
      name: WorkloadPrincipalActivated
      title: WorkloadPrincipal activated (provision → active)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/LifecycleEvent' }
    WorkloadPrincipalSuspended:
      name: WorkloadPrincipalSuspended
      title: WorkloadPrincipal suspended (active → suspended)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/LifecycleEvent' }
    WorkloadPrincipalRetired:
      name: WorkloadPrincipalRetired
      title: WorkloadPrincipal retired (→ retired, terminal + tombstoned)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/LifecycleEvent' }
    AuthorizationDecided:
      name: AuthorizationDecided
      title: One authorization decision (the primary audit record)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/AuthzDecisionEvent' }
    TokenValidationOutcome:
      name: TokenValidationOutcome
      title: One token-validation outcome (distinct event type from authorization)
      traits: [{ $ref: '#/components/messageTraits/cloudEventEnvelope' }]
      payload: { $ref: '#/components/schemas/TokenValidationEvent' }
  schemas:
    LifecycleEvent:
      type: object
      required: [subjectId, trustDomain, tenantId, oldState, newState, actor, occurredAt]
      properties:
        subjectId:
          type: string
          description: Immutable, never-reused WorkloadPrincipal id.
        trustDomain: { type: string, example: "acme.oyatie.com" }
        tenantId: { type: string, example: tenant_acme }
        oldState:
          type: string
          enum: [none, provision, active, suspended]
        newState:
          type: string
          enum: [provision, active, suspended, retired]
        actor: { type: string, description: Operator or automation principal that drove the transition. }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
    AuthzDecisionEvent:
      type: object
      required: [decisionId, tenantId, principalId, action, resource, decision, determiningPolicies, occurredAt]
      properties:
        decisionId:
          type: string
          description: Stable never-reused decision id (`evt_<ULID>`).
        tenantId: { type: string }
        trustDomain: { type: string }
        principalId: { type: string }
        action: { type: string, example: "ledger:Write" }
        resource: { type: string, example: "tenant_acme/ledger/main" }
        context:
          type: object
          additionalProperties: true
          description: Operational context only; no PII, no token bodies (brief §7, §9).
        decision: { type: string, enum: [ALLOW, DENY] }
        determiningPolicies:
          type: array
          items: { type: string }
          description: Empty + DENY = implicit deny; non-empty + DENY = explicit forbid (brief §9 preserve distinction).
        errors:
          type: array
          items: { type: string }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    TokenValidationEvent:
      type: object
      required: [outcomeId, tenantId, issuer, subject, valid, occurredAt]
      properties:
        outcomeId: { type: string, description: Stable never-reused id (`evt_<ULID>`). }
        tenantId: { type: string }
        issuer: { type: string }
        subject: { type: string, description: Token subject (workload principal id). }
        jti: { type: string, description: Token id for replay forensics; the token body itself is never emitted (brief §9). }
        valid: { type: boolean }
        failureReason:
          type: string
          description: Present when valid=false; one of the typed reasons.
          enum: [algorithm-mismatch, issuer-untrusted, audience-mismatch, expired, not-yet-valid, jwks-unavailable, alg-none-rejected, jku-not-allowlisted, malformed-token]
        occurredAt: { type: string, format: date-time }
