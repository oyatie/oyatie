asyncapi: 3.1.0
info:
  title: Identity Multi-Context Events
  version: 0.1.0
  description: Context resolver audit events required by ADR-0215.
defaultContentType: application/json
channels:
  context-resolved:
    address: oyatie.identity.context-resolved.v1
    messages:
      contextResolved:
        $ref: '#/components/messages/ContextResolved'
  context-switch-refused:
    address: oyatie.identity.context-switch-refused.v1
    messages:
      contextSwitchRefused:
        $ref: '#/components/messages/ContextSwitchRefused'
operations:
  publishContextResolved:
    action: send
    channel: { $ref: '#/channels/context-resolved' }
  publishContextSwitchRefused:
    action: send
    channel: { $ref: '#/channels/context-switch-refused' }
components:
  messages:
    ContextResolved:
      name: IdentityContextResolved
      payload:
        $ref: '#/components/schemas/ContextEvent'
    ContextSwitchRefused:
      name: IdentityContextSwitchRefused
      payload:
        $ref: '#/components/schemas/ContextEvent'
  schemas:
    ContextEvent:
      type: object
      required: [event_id, principal_id, active_context_id, context_type, audit_chain_seal]
      properties:
        event_id: { type: string }
        principal_id: { type: string }
        active_context_id: { type: string }
        requested_context_id: { type: string }
        context_type: { type: string }
        refusal_reason: { type: string }
        audit_chain_seal: { type: string }
