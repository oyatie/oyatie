[package]
name = "oya-identity-workload-rest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload-identity REST+gRPC delivery surface: mounts oya-identity-workload-app use-cases behind axum HTTP routes and tonic WorkloadAuthorizer/WorkloadTokenValidator services with identical fail-closed PEP semantics (deny=DECISION_EFFECT_DENY, token-fail typed error, store-unavailable=Unavailable) and one immutable audit record per authorize + token-validation."
build = "build.rs"

# Delivery layer (ADR-0105 Layer 5 / ADR-0509 single-crate-per-service extended).
# I/O-bearing crate that composes the inward use-case core (oya-identity-workload-app)
# + the API DTO contract (oya-identity-workload-api) + the pure domain.
# gRPC surface added under src/grpc/ mirrors the REST surface; both share one
# use-case core with no logic drift. tonic/prost deps are in dep-seam ReportOnly
# scope per ADR-0092 (seam default, lib.rs:63) — see tasks/id-workload-grpc-surface-plan.md.
[dependencies]
oya-identity-workload-domain = { path = "../oya-identity-workload-domain" }
oya-identity-workload-api = { path = "../oya-identity-workload-api" }
oya-identity-workload-app = { path = "../oya-identity-workload-app" }
oya-identity-workload-oidc-adapter = { path = "../oya-identity-workload-oidc-adapter" }
oya-identity-workload-authz-cedar-adapter = { path = "../oya-identity-workload-authz-cedar-adapter" }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# gRPC delivery surface — tonic 0.14 server-side only.
# router + transport features required to serve RPCs in-process for tests.
# NOTE: dep-seam allowed_crates for tonic/prost/tonic-prost does not yet include
# oya-identity-workload-rest; seam gate defaults to ReportOnly (ADR-0092, lib.rs:63)
# so this does NOT block gate-run-all. Registry update tracked separately.
prost.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost.workspace = true

[build-dependencies]
# Proto codegen — mirrors oya-shared-backbone-grpc-generated-adapter/build.rs pattern.
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# E2E: drive the router with tower::ServiceExt::oneshot and mint a real ES256
# workload JWT with aws-lc-rs (ring-API-compatible; ADR-0506 blessed crypto).
# Dev-only — NOT a library dependency.
oya-identity-oidc-issuer-kernel = { path = "../oya-identity-oidc-issuer-kernel" }
http-body-util = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
aws-lc-rs = "1.17.0"
base64 = "0.22.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros"] }

[lib]
name = "oya_identity_workload_rest"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
