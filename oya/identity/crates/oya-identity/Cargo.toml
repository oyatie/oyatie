[package]
name = "oya-identity"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "oya-identity runnable service binary: composes the workload-identity use-case core behind axum REST + tonic gRPC with fail-closed PEP semantics, env-driven config, static JWKS, Cedar policies, and graceful K8s-native shutdown (G005 / ADR-0536 IdP domain)."

[[bin]]
name = "oya-identity"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
oya-identity-oidc-issuer-kernel = { path = "../oya-identity-oidc-issuer-kernel" }
oya-identity-workload-domain = { path = "../oya-identity-workload-domain" }
oya-identity-workload-app = { path = "../oya-identity-workload-app" }
oya-identity-workload-authz-cedar-adapter = { path = "../oya-identity-workload-authz-cedar-adapter" }
oya-identity-workload-oidc-adapter = { path = "../oya-identity-workload-oidc-adapter" }
oya-identity-workload-rest = { path = "../oya-identity-workload-rest" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# aws-lc-rs: canonical Phase-1 crypto backend (ADR-0506) — ES256 issuer
# signing behind the kernel JwsSigner port (G02 KMS adapter replaces it).
aws-lc-rs = { workspace = true }
base64 = "0.22.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# E2E: drive the live REST socket with reqwest and the live gRPC socket with
# the tonic-generated client; tower for in-process router oneshot tests.
reqwest = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
