asyncapi: 3.1.0
info:
  title: Performance Management <-> Recruiting handoff
  version: 1.0.0
  description: |
    Inbound async contract from recruiting to performance-management.
    Closes audit Finding §3.4.B-9.
    Inbound (B-9): RecruitingHiredEvent triggers the new-hire 30/60/90 review cadence
    workflow inside performance-management.
defaultContentType: application/json
channels:
  recruiting.hired.v1:
    address: hr.handoff.recruiting.hired.v1
    messages:
      recruitingHired:
        $ref: '#/components/messages/RecruitingHiredEvent'
operations:
  subscribeRecruitingHired:
    action: receive
    channel:
      $ref: '#/channels/recruiting.hired.v1'
    messages:
      - $ref: '#/components/messages/RecruitingHiredEvent'
components:
  messages:
    RecruitingHiredEvent:
      name: RecruitingHiredEvent
      title: New-hire onboarded event
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - role_id
          - hire_date
          - manager_id
          - audit_event_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          role_id: { type: string }
          department_id: { type: string }
          manager_id: { type: string, format: uuid }
          hire_date: { type: string, format: date }
          probation_period_days: { type: integer, default: 90 }
          review_cadence_30_60_90: { type: boolean, default: true }
          audit_event_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "recruiting" }
