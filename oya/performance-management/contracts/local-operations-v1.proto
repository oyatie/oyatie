// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.performance_management.local.v1;

message PerformanceManagementLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message PerformanceManagementLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message PerformanceManagementLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message PerformanceManagementLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message PerformanceManagementSupportedActions {
  string review_cycle_open_action = 1;
  string feedback_submit_action = 2;
  string calibration_session_lock_action = 3;
  string rating_change_action = 4;
  string goal_align_action = 5;
  string hrbp_export_action = 6;
}

service PerformanceManagementLocalOperationsService {
  rpc CheckLocalPolicy(PerformanceManagementLocalPolicyCheckRequest) returns (PerformanceManagementLocalPolicyDecision);
  rpc GetLocalSloState(PerformanceManagementLocalSloStateRequest) returns (PerformanceManagementLocalSloState);
}
