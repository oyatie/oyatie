asyncapi: 3.1.0
info:
  title: Performance Management <-> Workforce Planning handoff
  version: 1.0.0
  description: |
    Outbound async contract from performance-management to workforce-planning.
    Closes audit Finding §3.4.B-7.
    Outbound (B-7): SuccessionTalentCardEvent feeds the financial-planning headcount
    cost model via workforce-planning.
defaultContentType: application/json
channels:
  performance-management.succession-talent-card.v1:
    address: hr.handoff.workforce-planning.succession-talent-card.v1
    messages:
      successionTalentCard:
        $ref: '#/components/messages/SuccessionTalentCardEvent'
operations:
  publishSuccessionTalentCard:
    action: send
    channel:
      $ref: '#/channels/performance-management.succession-talent-card.v1'
    messages:
      - $ref: '#/components/messages/SuccessionTalentCardEvent'
components:
  messages:
    SuccessionTalentCardEvent:
      name: SuccessionTalentCardEvent
      title: Succession talent card published
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - current_role_id
          - next_role_candidates
          - readiness_rating
          - published_at
          - audit_event_id
          - deal_set_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          current_role_id: { type: string }
          next_role_candidates:
            type: array
            items:
              type: object
              required: [role_id, readiness_rating]
              properties:
                role_id: { type: string }
                readiness_rating: { type: string, enum: [ready-now, ready-1-year, ready-2-year, not-ready] }
          readiness_rating: { type: string, enum: [ready-now, ready-1-year, ready-2-year, not-ready] }
          high_potential: { type: boolean, default: false }
          published_at: { type: string, format: date-time }
          audit_event_id: { type: string }
          deal_set_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "performance-management" }
          transport_profile: { type: string, const: "h3-h2-h1-strict-tls13-ech-pqc" }
