asyncapi: 3.1.0
info:
  title: Performance Management Local Operational Events
  version: 1.0.0
  description: Events for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  performance-management.local-ops.v1:
    address: performance-management.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/performance-management.local-ops.v1'
    messages:
      - $ref: '#/channels/performance-management.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/performance-management.local-ops.v1'
    messages:
      - $ref: '#/channels/performance-management.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: PerformanceManagementDomainEvent
      title: Performance Management domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['review.cycle.opened', 'feedback.submitted', 'calibration.session.locked', 'rating.change.recorded'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['review_form', 'calibration_rating', 'feedback_entry', 'goal_alignment', 'hr_export', 'manager_note'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: PerformanceManagementSloBurnEvent
      title: Performance Management SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'performance-management' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'review.cycle.opened' }
