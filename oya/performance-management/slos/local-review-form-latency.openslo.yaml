apiVersion: openslo/v1
kind: SLO
metadata:
  name: performance-management-review-form-latency
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: performance-management
  description: Review form load and save latency for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
  indicator:
    metadata:
      name: review-form-latency
      labels:
        domain_object: PerformanceReviewCycle
        operator_audience: PEOPLE_OPS_PARTNER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_review_form_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_review_form_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Review form load and save latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
