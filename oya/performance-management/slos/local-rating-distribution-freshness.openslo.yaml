apiVersion: openslo/v1
kind: SLO
metadata:
  name: performance-management-rating-distribution-freshness
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: performance-management
  description: Rating distribution projection freshness for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
  indicator:
    metadata:
      name: rating-distribution-freshness
      labels:
        domain_object: PerformanceReviewCycle
        operator_audience: PEOPLE_OPS_PARTNER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_rating_distribution_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_rating_distribution_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Rating distribution projection freshness
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
