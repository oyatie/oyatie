    - path: iac/on-prem/main.tf
      hash_algo: sha256
      signature: pending-pipeline-run
    - path: iac/colo/main.tf
      hash_algo: sha256
      signature: pending-pipeline-run
    - path: iac/oyatie-iaas/main.tf
      hash_algo: sha256
      signature: pending-pipeline-run
  verification:
