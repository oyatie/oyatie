apiVersion: oyatie.dev/v1
kind: EchConfig
metadata:
  name: performance-management-ech-config
  labels:
    service: performance-management
    binding_adr: ADR-0253-amendment
spec:
  service: performance-management
  tenantScoped: true
  audienceType: HR_BUSINESS_PARTNER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/review-calibration-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Lattice", "15Five", "Culture Amp", "Glint", "Workday Talent"]
