apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: performance-management-review-api
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: performance-management-review-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_performance_management_calibration_cycle_completion_inflight
        target:
          type: AverageValue
          averageValue: "100"
