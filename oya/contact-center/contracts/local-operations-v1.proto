// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.contact_center.local.v1;

message ContactCenterLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message ContactCenterLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message ContactCenterLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message ContactCenterLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message ContactCenterSupportedActions {
  string omnichannel_route_assign_action = 1;
  string voice_call_transfer_action = 2;
  string callback_schedule_action = 3;
  string recording_access_action = 4;
  string queue_rebalance_action = 5;
  string emergency_bypass_action = 6;
}

service ContactCenterLocalOperationsService {
  rpc CheckLocalPolicy(ContactCenterLocalPolicyCheckRequest) returns (ContactCenterLocalPolicyDecision);
  rpc GetLocalSloState(ContactCenterLocalSloStateRequest) returns (ContactCenterLocalSloState);
}
