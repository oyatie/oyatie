apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: contact-center-local-slo-burn
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: contact-center.local.slo
      rules:
        - alert: ContactCenterLocalSloBurn
          expr: (sum(rate(oya_contact_center_call_drop_rate_good_total[5m])) / sum(rate(oya_contact_center_call_drop_rate_total[5m]))) < 0.995
          for: 10m
          labels:
            severity: page
            service: contact-center
          annotations:
            summary: Contact Center call-drop-rate burn
            runbook: microservices/contact-center/runbooks/local-call-drop-burn.md
