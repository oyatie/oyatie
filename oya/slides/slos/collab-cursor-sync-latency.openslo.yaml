# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-collab-cursor-sync-latency
  displayName: Slides — Collab cursor sync latency
  labels:
    microservice: slides
    bounded_context: real-time-collaboration
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-real-time-collaboration-worker
  description: |
    p99 ≤ 150ms for cursor presence sync. Aligns workflow-studio cursor budget (100ms collab merge +
    slide-specific projection overhead). Per PRD §"Tenant Outcome 2".
  indicator:
    metadata: { name: collab-cursor-sync-p99-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_collab_cursor_sync_seconds_bucket{le="0.15"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_collab_cursor_sync_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% cursor sync ≤ 150ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: cursor-sync-burn-rate-high }
      spec:
        notificationTargets: [{ target: "grafana-oncall:slides-sev2" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.95, lookbackWindow: 1h, alertAfter: 0m }
