# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-present-mode-transition-latency
  displayName: Slides — Present-mode slide transition latency (60fps invariant)
  labels:
    microservice: slides
    bounded_context: transitions
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-slide-adapter-leptos-wasm
  description: |
    p95 ≤ 50ms slide-to-slide transition; 60fps per-frame budget p99 ≤ 16.7ms.
    Per PRD §"Performance" + AC-09 + ADR-SLIDES-0002.
  indicator:
    metadata: { name: present-transition-p95-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_present_transition_seconds_bucket{le="0.05"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_present_transition_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% transitions ≤ 50ms (60fps invariant)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: present-transition-burn-rate }
      spec:
        notificationTargets: [{ target: "grafana-oncall:slides-sev2" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.90, lookbackWindow: 1h, alertAfter: 0m }
