# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-crdt-merge-no-silent-loss
  displayName: Slides — Collab CRDT no silent loss (correctness invariant)
  labels:
    microservice: slides
    bounded_context: real-time-collaboration
    sli_kind: correctness
    tier: external-facing
    plane: data
spec:
  service: oya-slides-real-time-collaboration-worker
  description: |
    Correctness SLI: zero silent CRDT op losses. AC-06 load-bearing invariant.
    Aligns workflow-studio AC-06 + docs + sheets sibling invariants. Per ADR-SLIDES-0001.
    The "good" metric is total ops minus silent_loss_attempt_total; target is 100%.
  indicator:
    metadata: { name: crdt-no-silent-loss-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_collab_op_published_total[5m])) - sum(rate(oya_slides_collab_silent_loss_attempt_total[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_collab_op_published_total[5m]))'
  objectives:
    - target: 1.0
      displayName: 100% of CRDT ops merge without silent loss (AC-06 invariant)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: collab-silent-loss-detected }
      spec:
        description: ANY silent loss event → immediate Sev-1 page
        notificationTargets: [{ target: "grafana-oncall:slides-sev1" }]
        conditions:
          - kind: AlertCondition
            spec: { op: gte, threshold: 1, lookbackWindow: 5m, alertAfter: 0m }
