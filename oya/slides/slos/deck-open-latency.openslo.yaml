# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-deck-open-latency
  displayName: Slides — Deck open latency (cold; 50-slide deck)
  labels:
    microservice: slides
    bounded_context: presentation
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-presentation-rest
  description: |
    p95 ≤ 400ms for deck open on a 50-slide deck with CDN-cached WASM bundle (cold).
    Per PRD §"Tenant Outcome 1" and §"Performance" table.
  indicator:
    metadata: { name: deck-open-cold-p95-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_deck_open_seconds_bucket{cache="cold",le="0.4"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_deck_open_seconds_count{cache="cold"}[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of cold deck-opens ≤ 400ms (50-slide)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: deck-open-burn-rate-high }
      spec:
        description: 14.4× burn over 1h
        notificationTargets: [{ target: "grafana-oncall:slides-sev2" }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.85, lookbackWindow: 1h, alertAfter: 0m }
