# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# Capability T2 — Auto tier
# Full-deck generation + cross-language translation + theme cascade.
# Per ADR-SLIDES-0006: regional AI-risk class evaluated per-invocation.
# high-risk → REFUSED BY DEFAULT; per-pack override required.

automation_risk_class: T2
capability_name: slides-auto
microservice: slides
status: Accepted
foundry_runtime_integration: required
risk_class_default: medium  # baseline; high_risk_auto_decision if context matches a high-risk auto-decision trigger
authority: ADR-SLIDES-0006
related_specs:
  - microservices/slides/decisions/ADR-SLIDES-0006-ai-design-and-content-generation-bounds.md
  - microservices/slides/policy/tenant-scope.cedar

capabilities:
  - id: full-deck-from-prompt
    name: Full-deck-from-prompt generation
    description: |
      Tenant prose → candidate full deck (target slide count = N).
      high-risk auto-decision evaluation per-invocation:
        - usage_context in [general, educational, marketing] → baseline low/medium-risk
        - usage_context == employment → high-risk auto-decision (1)(b) recruitment; HIGH-RISK
        - usage_context == credit → high-risk auto-decision (5)(b) creditworthiness; HIGH-RISK
        - usage_context == legal → high-risk auto-decision (6)(a) administration of justice; HIGH-RISK
        - usage_context == medical → high-risk auto-decision (5)(c) emergency services / medical-device subcontext; HIGH-RISK
      HIGH-RISK invocations refused unless deck.pack has explicit `pack_override_high_risk_auto_decision=true`
      AND deck Cedar policy carries `pack_override_high_risk_auto_decision` permission.
      Outputs always carry indelible provenance watermark.
      Human-accept gate REQUIRED before save (Art. 14 human oversight).
    inputs:
      - prompt (text)
      - slide_count_target (1-100)
      - usage_context enum
      - per-pack PHI redaction policy
      - tenant ai-policy opt-in flag
    outputs:
      - candidate deck
      - risk_class (low | medium | high_risk_auto_decision)
      - provenance_watermark (indelible)
      - human_review_required = true
    latency_p95_ms: 30000  # 30s p95 for 10-slide deck
    risk_class_default: medium
    auto_decision_risk_check: required
    audit_emit: true  # every T2 invocation Ed25519-sealed with prompt-hash + completion-hash + risk-class
    foundry_runtime_invocation: required
    human_oversight_required: true
    provenance_watermark: required
    refuse_unless_consent: true  # tenant consent required per pack
    high_risk_auto_decision_refusal_default: true

  - id: auto-translate
    name: Per-slide translation across languages
    description: |
      Translate slide content into N target languages.
      Per ADR-SLIDES-0006: translation is medium-risk default; legal-context elevates to high-risk.
    inputs:
      - slide content
      - target language(s)
      - usage_context (general | legal | medical | educational | marketing)
    outputs:
      - translated slides (per-language)
      - risk_class
      - provenance_watermark
    latency_p95_ms: 8000
    risk_class_default: medium
    auto_decision_risk_check: contextual
    audit_emit: true
    foundry_runtime_invocation: required
    human_oversight_required: true
    provenance_watermark: required

  - id: theme-cascade
    name: Theme cascade
    description: |
      Apply a new theme across the entire deck; cascade color / typography / layout to all slides.
      Generative theme: foundry-runtime generates palette/typography per tenant brand seed.
    inputs:
      - tenant brand seed (color or text directive)
      - deck slide count
      - per-pack accessibility default (color-blind-safe)
    outputs:
      - new theme + cascaded deck
      - WCAG 2.2 AA contrast validation report
      - provenance_watermark
    latency_p95_ms: 12000
    risk_class_default: medium
    auto_decision_risk_check: false  # theme is design, not decisional
    audit_emit: true
    foundry_runtime_invocation: required
    human_oversight_required: true  # tenant accepts cascade
    provenance_watermark: required

per_tenant_controls:
  - opt_in_required_for_t2: true  # T2 default-off until tenant opts in
  - per_pack_default_off: [all]  # T2 OFF in all packs by default; tenant opt-in required
  - per_pack_high_risk_auto_decision_override_allowed: []  # NONE — packs do not pre-allow high-risk auto-decision; explicit per-deck Cedar grant required
  - phi_redaction_required: [us-healthcare]
  - human_review_required: [all]

rate_limits:
  per_user_per_hour: 10
  per_tenant_per_day: 100
  per_pack_per_day_overrideable: true
  per_pack_t2_quota_default:
    kr: 100
    eu: 50  # stricter regional privacy + AI-risk controls
    us: 100
    us-healthcare: 0  # HIPAA pack: opt-in only
    jp: 100
    sg: 100
    au: 100
    in: 100
    br: 100
    ae: 50
    ksa: 50

cost_class: tier-2  # high; metered per-invocation

# CI lane: ai-act-risk-class-stamp must be green
ci_lanes_blocking:
  - oya-governance-ai-act-risk-class-stamp
  - oya-governance-cedar-preview-required
