// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-slides protobuf contract — proto3
// Per ADR-0135 dissolution + ADR-0131 per-microservice flat layout.
// Used by cross-µservice SDK consumers (sheets, docs, forms, drive, messenger, etc.)
// for low-overhead structured calls. REST surface lives in contracts/openapi/slides.yaml.

syntax = "proto3";

package oya.slides.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option java_package = "dev.oyatie.slides.v1";
option go_package = "github.com/oyatie/slides/v1;slidesv1";

// ============================================================================
// Common types
// ============================================================================

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

enum AiRiskClass {
  AI_RISK_CLASS_UNSPECIFIED = 0;
  AI_RISK_CLASS_LOW = 1;
  AI_RISK_CLASS_MEDIUM = 2;
  AI_RISK_CLASS_HIGH_RISK_ANNEX_III = 3;
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_PPTX = 1;
  EXPORT_FORMAT_ODP = 2;
  EXPORT_FORMAT_PDF = 3;
  EXPORT_FORMAT_PDF_A_1B = 4;
  EXPORT_FORMAT_PDF_A_2U = 5;
  EXPORT_FORMAT_MP4 = 6;
  EXPORT_FORMAT_PNG_PER_SLIDE = 7;
}

enum ImportFormat {
  IMPORT_FORMAT_UNSPECIFIED = 0;
  IMPORT_FORMAT_PPTX = 1;
  IMPORT_FORMAT_ODP = 2;
  IMPORT_FORMAT_KEYNOTE = 3;
  IMPORT_FORMAT_PDF = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_EDITOR = 2;
  ROLE_COMMENTER = 3;
  ROLE_VIEWER = 4;
  ROLE_DENIED = 5;
}

message AclEntry {
  string principal_id = 1;
  string principal_kind = 2; // user | group | anyone_with_link
  Role role = 3;
}

// ============================================================================
// Deck
// ============================================================================

message Deck {
  string deck_id = 1;
  string tenant_id = 2;
  Pack pack = 3;
  string title = 4;
  string owner_oidc_sub = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string version_sha = 8;
  string parent_version_sha = 9; // optional
  string theme_id = 10; // optional
  int32 slide_count = 11;
  bool share_link_enabled = 12;
  string share_link_scope = 13; // restricted | anyone_with_link
  bool contains_special_category = 14;
  bool broadcast_link_public = 15;
  AiRiskClass ai_risk_class = 16;
}

message DeckAcl {
  string deck_id = 1;
  repeated AclEntry entries = 2;
}

// ============================================================================
// Slide
// ============================================================================

message Slide {
  string slide_id = 1;
  string deck_id = 2;
  int32 ordinal = 3;
  string layout_id = 4;
  string version_sha = 5;
  bytes content = 6; // opaque (CRDT-projected canonical JSON)
  string speaker_notes = 7;
}

message PerSlideAcl {
  string slide_id = 1;
  repeated AclEntry entries = 2;
}

// ============================================================================
// CRDT op envelope (used by collab-crdt-worker WS gateway)
// ============================================================================

message CrdtOpEnvelope {
  string author_oidc_sub = 1;
  int64 sequence_num = 2;
  bytes op_payload = 3; // loro-encoded op bytes
  string hmac = 4; // HMAC-SHA-256 over op envelope using per-session key
  google.protobuf.Timestamp emitted_at = 5;
}

// ============================================================================
// Export / Import
// ============================================================================

message ExportJob {
  string job_id = 1;
  string deck_id = 2;
  ExportFormat format = 3;
  string status = 4; // queued | running | completed | failed
  string output_url = 5;
  google.protobuf.Timestamp completed_at = 6;
  string error_code = 7;
}

message ImportJob {
  string job_id = 1;
  string deck_id = 2;
  ImportFormat format = 3;
  string status = 4;
  string scan_verdict = 5; // clean | suspicious | malware
  google.protobuf.Timestamp completed_at = 6;
  string error_code = 7;
}

// ============================================================================
// Broadcast
// ============================================================================

message BroadcastSession {
  string session_id = 1;
  string deck_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;
  string livekit_room_url = 5;
  int32 viewer_count = 6;
  int32 viewer_cap = 7;
  string presenter_oidc_sub = 8;
}

// ============================================================================
// AI capabilities
// ============================================================================

message AiDesignSuggestRequest {
  string deck_id = 1;
  repeated string slide_ids = 2;
  string hint = 3; // layout | color | font | copy
}

message AiDesignSuggestResponse {
  repeated string suggestions = 1; // opaque JSON suggestions
  AiRiskClass risk_class = 2;
  string provenance = 3; // foundry-runtime correlation id
}

message AiContentGenerateRequest {
  string deck_id = 1;
  string prompt = 2;
  int32 slide_count_target = 3;
  string usage_context = 4; // general | employment | credit | legal | medical | educational | marketing
}

message AiContentGenerateResponse {
  Deck generated_deck = 1;
  AiRiskClass risk_class = 2;
  string provenance_watermark = 3; // indelible provenance marker per ADR-SLIDES-0006
  bool human_review_required = 4;
}

// ============================================================================
// Chart live-link (per ADR-SLIDES-0008)
// ============================================================================

message ChartBinding {
  string binding_id = 1;
  string deck_id = 2;
  string slide_id = 3;
  string sheets_deck_id = 4;
  string cell_range = 5;
  string refresh_policy = 6; // eventual | on_open | manual
  google.protobuf.Timestamp last_refresh_at = 7;
}

// ============================================================================
// Service surface
// ============================================================================

service SlidesService {
  rpc CreateDeck (CreateDeckRequest) returns (Deck);
  rpc GetDeck (GetDeckRequest) returns (Deck);
  rpc UpdateDeck (UpdateDeckRequest) returns (Deck);
  rpc DeleteDeck (DeleteDeckRequest) returns (google.protobuf.Empty);
  rpc ListSlides (ListSlidesRequest) returns (ListSlidesResponse);
  rpc InsertSlide (InsertSlideRequest) returns (Slide);
  rpc UpdateSlide (UpdateSlideRequest) returns (Slide);
  rpc GetDeckAcl (GetDeckAclRequest) returns (DeckAcl);
  rpc SetDeckAcl (SetDeckAclRequest) returns (DeckAcl);
  rpc GetPerSlideAcl (GetPerSlideAclRequest) returns (PerSlideAcl);
  rpc SetPerSlideAcl (SetPerSlideAclRequest) returns (PerSlideAcl);
  rpc SubmitExport (SubmitExportRequest) returns (ExportJob);
  rpc SubmitImport (SubmitImportRequest) returns (ImportJob);
  rpc StartBroadcast (StartBroadcastRequest) returns (BroadcastSession);
  rpc EndBroadcast (EndBroadcastRequest) returns (google.protobuf.Empty);
  rpc AiDesignSuggest (AiDesignSuggestRequest) returns (AiDesignSuggestResponse);
  rpc AiContentGenerate (AiContentGenerateRequest) returns (AiContentGenerateResponse);
  rpc BindChart (BindChartRequest) returns (ChartBinding);

  // Streams
  rpc StreamCollabOps (stream CrdtOpEnvelope) returns (stream CrdtOpEnvelope);
}

message CreateDeckRequest { string title = 1; string from_template_id = 2; string theme_id = 3; }
message GetDeckRequest { string deck_id = 1; }
message UpdateDeckRequest { string deck_id = 1; Deck patch = 2; }
message DeleteDeckRequest { string deck_id = 1; }

message ListSlidesRequest { string deck_id = 1; }
message ListSlidesResponse { repeated Slide slides = 1; }

message InsertSlideRequest { string deck_id = 1; int32 ordinal = 2; string layout_id = 3; bytes content = 4; }
message UpdateSlideRequest { string deck_id = 1; string slide_id = 2; Slide patch = 3; }

message GetDeckAclRequest { string deck_id = 1; }
message SetDeckAclRequest { string deck_id = 1; DeckAcl acl = 2; }
message GetPerSlideAclRequest { string deck_id = 1; string slide_id = 2; }
message SetPerSlideAclRequest { string deck_id = 1; string slide_id = 2; PerSlideAcl acl = 3; }

message SubmitExportRequest { string deck_id = 1; ExportFormat format = 2; }
message SubmitImportRequest { string deck_id = 1; ImportFormat format = 2; bytes file = 3; }

message StartBroadcastRequest { string deck_id = 1; string presenter_oidc_sub = 2; int32 viewer_cap = 3; bool public_link_enabled = 4; }
message EndBroadcastRequest { string deck_id = 1; string session_id = 2; }

message BindChartRequest { string deck_id = 1; string slide_id = 2; string sheets_deck_id = 3; string cell_range = 4; string refresh_policy = 5; }
