apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-real-estate-pqc
spec:
  secretName: oya-real-estate-tls
  commonName: real-estate.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
