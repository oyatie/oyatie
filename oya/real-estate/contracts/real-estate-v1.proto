// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oya.real_estate.v1;

option java_package = "dev.oyatie.real_estate.v1";

// SAP RE-FX; benchmarks: SAP RE-FX Flexible Real Estate Management | Oracle Fusion Lease Accounting | Workday Lease Accounting | NetSuite Fixed Assets and lease-accounting counterpart | Microsoft Dynamics 365 Finance Lease Accounting
// Transport binding: internal-only gRPC over HTTP/2 with SPIFFE mTLS/TLS 1.3; public transport is defined by OpenAPI.

message LeaseContractCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message LeaseContractResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message FacilityMasterCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message FacilityMasterResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message OccupancyAllocationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message OccupancyAllocationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message RentScheduleCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message RentScheduleResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message LeaseAccountingEventCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message LeaseAccountingEventResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message FacilityServiceRequestCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message FacilityServiceRequestResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service RealEstateService {
  rpc MutateLeaseContract (LeaseContractCommand) returns (LeaseContractResult);
  rpc MutateFacilityMaster (FacilityMasterCommand) returns (FacilityMasterResult);
  rpc MutateOccupancyAllocation (OccupancyAllocationCommand) returns (OccupancyAllocationResult);
  rpc MutateRentSchedule (RentScheduleCommand) returns (RentScheduleResult);
  rpc MutateLeaseAccountingEvent (LeaseAccountingEventCommand) returns (LeaseAccountingEventResult);
  rpc MutateFacilityServiceRequest (FacilityServiceRequestCommand) returns (FacilityServiceRequestResult);
}
