[package]
name = "oya-real-estate-lease-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Real Estate lease portfolio application surface."

[package.metadata.oya]
microservice = "real-estate"
title = "Real Estate"
bounded_context = "lease-portfolio"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-real-estate + council-product"
data_classification = "tenant-scoped lease and facility records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/real-estate-v1.proto"

[lib]
name = "oya_real_estate_lease_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-real-estate-lease"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
