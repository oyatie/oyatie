// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.marketing_automation.local.v1;

message MarketingAutomationLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message MarketingAutomationLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message MarketingAutomationLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message MarketingAutomationLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message MarketingAutomationSupportedActions {
  string campaign_segment_read_action = 1;
  string campaign_segment_write_action = 2;
  string campaign_journey_launch_action = 3;
  string campaign_send_approve_action = 4;
  string campaign_suppression_enforce_action = 5;
  string campaign_deliverability_inspect_action = 6;
}

service MarketingAutomationLocalOperationsService {
  rpc CheckLocalPolicy(MarketingAutomationLocalPolicyCheckRequest) returns (MarketingAutomationLocalPolicyDecision);
  rpc GetLocalSloState(MarketingAutomationLocalSloStateRequest) returns (MarketingAutomationLocalSloState);
}
