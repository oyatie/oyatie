asyncapi: 3.1.0
info:
  title: Marketing Automation Events
  version: 1.0.0
  description: Tenant-scoped event contract for segmentation, journeys, suppression, and attribution.
defaultContentType: application/json
channels:
  marketing-automation.events.v1:
    address: marketing-automation.events.v1
    messages:
      marketingAutomationActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/marketing-automation.events.v1'
    messages:
      - $ref: '#/channels/marketing-automation.events.v1/messages/marketingAutomationActionAccepted'
components:
  messages:
    ActionAccepted:
      name: MarketingAutomationActionAccepted
      title: Marketing Automation action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
