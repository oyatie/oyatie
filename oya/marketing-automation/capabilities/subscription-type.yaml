apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-subscription-type
  service: marketing-automation
spec:
  businessCapability: marketing-subscription-type
  capability: subscription-type
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Subscription Type + Communication Preference Page
  flankingCounterparts:
    - Adobe Marketo Engage Communication Limits
    - Mailchimp Groups
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0251, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: subscription-type
  aggregateRoot: marketing_subscription_type
  invariants:
    - tenant scope required
    - per-tenant publication-channel category
    - per-pack disclosure requirement
    - opt-in evidence chain (signed by consent-graph)
    - unsubscribe link mandatory per CAN-SPAM/CASL
  commands: [create, amend, activate, deactivate, subject_subscribe, subject_unsubscribe]
  events: [created, amended, activated, deactivated, subject_subscribed, subject_unsubscribed]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::CreateSubscriptionType
      tenantClassRule: "demo_trial subscription_types cap = 5"
    - principal: subject
      action: marketingAutomation::SubjectUnsubscribe
      allowAlways: true
      adrReference: "Article 21 GDPR / CAN-SPAM / CASL — subject-initiated revocation always permitted"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/subscription-types
  observability:
    auditEvents:
      - EVT-MARKETING-SUBSCRIPTION-TYPE-CREATED
      - EVT-MARKETING-SUBSCRIPTION-SUBSCRIBED
      - EVT-MARKETING-SUBSCRIPTION-UNSUBSCRIBED
  crossMicroserviceHandoffs:
    - consent-graph (lawful-basis source)
    - consent-audience (cascade on unsubscribe)
    - audit-chain (sealing)
  implementationPlanRef: IP-041-subscription-type.md
