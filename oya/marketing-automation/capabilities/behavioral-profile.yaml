apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-behavioral-profile
  service: marketing-automation
spec:
  businessCapability: marketing-behavioral-profile
  capability: behavioral-profile
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Behavioral Event + Calculated Property (Enterprise)
  flankingCounterparts:
    - Adobe Marketo Engage Activity Log + Custom Activity
    - Mailchimp Audience Insights
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: behavioral-profile
  aggregateRoot: marketing_behavioral_profile
  invariants:
    - per-contact behavior aggregation distinct from segment predicate state
    - event-counters with HLC stamping
    - trait derivation rules declared and versioned
    - per-tenant event-schema registry
  commands: [ingest_event, derive_trait, recompute, prune]
  events: [event_ingested, trait_derived, recomputed, pruned]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: service.event-consumer
      action: marketingAutomation::IngestBehavioralEvent
      tenantClassRule: "demo_trial behavioral_events_per_day cap = 1000"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/behavioral-profile/events
  observability:
    auditEvents:
      - EVT-MARKETING-BEHAVIOR-EVENT-INGESTED
      - EVT-MARKETING-BEHAVIOR-TRAIT-DERIVED
  crossMicroserviceHandoffs:
    - ontology (event-schema registry)
    - segment (predicate-tree references derived traits)
    - audit-chain (sealing)
  implementationPlanRef: IP-044-behavioral-profile.md
