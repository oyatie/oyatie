apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-mobile-sdk-seam
  service: marketing-automation
spec:
  businessCapability: marketing-mobile-sdk
  capability: mobile-sdk-seam
  category: customer-engagement-substrate-seam
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Mobile SDK
  flankingCounterparts:
    - Adobe Marketo Engage Mobile
    - Mailchimp Mobile App
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0253-amendment, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: mobile-sdk-seam
  aggregateRoot: "(client-side SDK; this seam emits server-side contracts)"
  invariants:
    - Swift (iOS) + Kotlin (Android) frontend SDKs per Rust-strict policy
    - HTTP/3 + QUIC transport
    - per-tenant API-key + per-subject signed-token
    - in-app + push event ingestion
    - opt-in/opt-out evidence to consent-audience
  commands: [register_device, ingest_in_app_event, request_push_send]
  events: [device_registered, in_app_event_ingested, push_send_requested]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: service.mobile-sdk
      action: marketingAutomation::IngestMobileEvent
  observability:
    auditEvents:
      - EVT-MARKETING-MOBILE-DEVICE-REGISTERED
      - EVT-MARKETING-MOBILE-EVENT-INGESTED
  crossMicroserviceHandoffs:
    - messenger (push delivery)
    - behavioral-profile (event ingestion)
    - consent-audience (opt-in/opt-out evidence)
    - audit-chain (sealing)
  implementationPlanRef: IP-054-mobile-sdk-seam.md
  frontendLanguages: [Swift (iOS/macOS), Kotlin (Android)]
