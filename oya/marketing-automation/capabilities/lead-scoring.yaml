apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-lead-scoring
  service: marketing-automation
spec:
  businessCapability: marketing-lead-scoring
  capability: lead-scoring
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Lead Scoring
  flankingCounterparts:
    - Adobe Marketo Engage Lead Scoring
    - Mailchimp Premium Predicted Demographics
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: lead-scoring
  aggregateRoot: marketing_lead_score
  invariants:
    - tenant scope required
    - per-subject score = f(demographic_component, behavioral_component, predictive_component)
    - decay_half_life_days declared per model
    - manual adjustments auditable
    - per-tenant model isolation
  commands: [define_model, score_subject, decay, manual_adjust, recalculate]
  events: [model_defined, subject_scored, decayed, manually_adjusted, recalculated]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::DefineLeadScoringModel
      tenantClassRule: "demo_trial lead_scoring_models cap = 1"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/lead-scoring/models
  observability:
    auditEvents:
      - EVT-MARKETING-LEAD-SCORING-MODEL-DEFINED
      - EVT-MARKETING-LEAD-SCORED
    sloRef: slos/local-attribution-freshness.openslo.yaml
  crossMicroserviceHandoffs:
    - intelligence (predictive component)
    - behavioral-profile (behavioral component)
    - audit-chain (sealing)
  implementationPlanRef: IP-037-lead-scoring.md
