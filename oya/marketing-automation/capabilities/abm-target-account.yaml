apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-abm-target-account
  service: marketing-automation
spec:
  businessCapability: marketing-abm
  capability: abm-target-account
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot ABM
  flankingCounterparts:
    - Adobe Marketo Engage Account-Based Marketing
    - "(Mailchimp does not have ABM; SMB-focused)"
  referenceCounterparts:
    - Demandbase target-account intent
    - Terminus ABM
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0245, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: abm
  aggregateRoot: marketing_abm_target_account
  invariants:
    - tenant scope required
    - account binding via crm.account_id (crm contract)
    - account-score formula + decay
    - intent-data source provenance
    - account-level workflow trigger references
  commands: [target_account, score_account, attach_workflow, detach_workflow]
  events: [account_targeted, account_scored, workflow_attached, workflow_detached]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::TargetAccount
      tenantClassRule: "demo_trial abm_target_accounts cap = 25"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/abm/target-accounts
  observability:
    auditEvents:
      - EVT-MARKETING-ABM-ACCOUNT-TARGETED
      - EVT-MARKETING-ABM-ACCOUNT-SCORED
  crossMicroserviceHandoffs:
    - crm.account-master (account binding)
    - intelligence (intent data ingestion)
    - workflow-canvas (account-level trigger)
    - audit-chain (sealing)
  implementationPlanRef: IP-040-abm-target-account.md
