apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-email-tracking
  service: marketing-automation
spec:
  businessCapability: marketing-email-tracking
  capability: email-tracking
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Email Tracking (open + click + reply)
  flankingCounterparts:
    - Adobe Marketo Engage Email Insights
    - Mailchimp Click/Open Reports
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0251, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: email-tracking
  aggregateRoot: marketing_email_tracking_event
  invariants:
    - tenant scope required
    - GPC / DNT signal respected per pack overlay
    - Apple Mail Privacy Protection aggregation
    - tracking-pixel privacy-preserving for MPP-confirmed opens
    - distinct from attribution credit allocation
  commands: [record_open, record_click, record_reply, record_bounce]
  events: [open_recorded, click_recorded, reply_recorded, bounce_recorded]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: service.email-tracking-receiver
      action: marketingAutomation::RecordEmailTrackingEvent
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/email-tracking/events
  observability:
    auditEvents:
      - EVT-MARKETING-EMAIL-TRACKING-OPEN
      - EVT-MARKETING-EMAIL-TRACKING-CLICK
      - EVT-MARKETING-EMAIL-TRACKING-REPLY
      - EVT-MARKETING-EMAIL-TRACKING-BOUNCE
  crossMicroserviceHandoffs:
    - mail (bounce source)
    - attribution (touch source)
    - data-boundary (subject-hash labeling)
    - audit-chain (sealing)
  implementationPlanRef: IP-039-email-tracking.md
