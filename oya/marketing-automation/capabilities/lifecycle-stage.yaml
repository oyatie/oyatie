apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-lifecycle-stage
  service: marketing-automation
spec:
  businessCapability: marketing-lifecycle-stage
  capability: lifecycle-stage
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Lifecycle Stage (Subscriber→Lead→MQL→SQL→Opportunity→Customer→Evangelist)
  flankingCounterparts:
    - Adobe Marketo Engage Engagement Score Buckets
    - Mailchimp CLV bands
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: lifecycle-stage
  aggregateRoot: marketing_lifecycle_progression
  invariants:
    - tenant scope required
    - monotonic progression (default)
    - downgrade requires principal authorisation + reason
    - transitions emit auditable events
    - subject-mode (per contact) or account-mode (per account) per ABM
  commands: [progress, downgrade, freeze, resume]
  events: [progressed, downgraded, frozen, resumed]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: revops.manager
      action: marketingAutomation::DowngradeLifecycle
      stepUpRequired: true
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/lifecycle-stage/{subject_id}:progress
  observability:
    auditEvents:
      - EVT-MARKETING-LIFECYCLE-PROGRESSED
      - EVT-MARKETING-LIFECYCLE-DOWNGRADED
  crossMicroserviceHandoffs:
    - crm.lead (handoff at MQL→SQL transition)
    - crm.opportunity (handoff at SQL→Opportunity transition)
    - workflow-canvas (trigger on transition)
    - audit-chain (sealing)
  implementationPlanRef: IP-038-lifecycle-stage.md
