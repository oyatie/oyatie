apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-marketing-calendar
  service: marketing-automation
spec:
  businessCapability: marketing-calendar
  capability: marketing-calendar
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Marketing Calendar
  flankingCounterparts:
    - Adobe Marketo Engage Calendar
    - Mailchimp Content Studio Calendar
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: marketing-calendar
  aggregateRoot: marketing_calendar_entry
  invariants:
    - tenant scope required
    - temporal view across email + LP + workflow + social + ad assets
    - conflict detection per channel × audience overlap
    - meeting-scheduler delegated to calendar µservice
  commands: [schedule, reschedule, cancel, attach_asset, detect_conflicts]
  events: [scheduled, rescheduled, cancelled, asset_attached, conflict_detected]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::ScheduleCalendarEntry
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/calendar/entries
  observability:
    auditEvents:
      - EVT-MARKETING-CALENDAR-SCHEDULED
      - EVT-MARKETING-CALENDAR-CONFLICT-DETECTED
  crossMicroserviceHandoffs:
    - calendar (meeting-scheduler primitive)
    - audit-chain (sealing)
  implementationPlanRef: IP-043-marketing-calendar.md
