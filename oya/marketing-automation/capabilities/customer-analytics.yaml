apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-customer-analytics
  service: marketing-automation
spec:
  businessCapability: marketing-customer-analytics
  capability: customer-analytics
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Marketing Analytics
  flankingCounterparts:
    - Adobe Marketo Engage Performance Insights
    - Mailchimp Reports + Recipient Activity
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: customer-analytics
  aggregateRoot: marketing_customer_analytics_report
  invariants:
    - tenant scope required
    - tenant-visible reports distinct from operator-facing dashboards under dashboards/
    - per-report scope binding
    - export contracts honor data-class boundaries
    - scheduled report delivery via webhook-subscription or email
  commands: [define_report, run_report, schedule_report, export_report]
  events: [report_defined, report_ran, report_scheduled, report_exported]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::RunCustomerReport
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/customer-analytics/reports
  observability:
    auditEvents:
      - EVT-MARKETING-CUSTOMER-REPORT-DEFINED
      - EVT-MARKETING-CUSTOMER-REPORT-RAN
      - EVT-MARKETING-CUSTOMER-REPORT-EXPORTED
  crossMicroserviceHandoffs:
    - analytics (data substrate for reports)
    - data-boundary (data-class boundary enforcement)
    - audit-chain (sealing)
  implementationPlanRef: IP-051-customer-analytics.md
  openQuestionResolution: "customer-facing reports distinct from operator dashboards (dashboards/)"
