      - EVT-MARKETING-SOCIAL-POST-SCHEDULED
  crossMicroserviceHandoffs:
    - social (publishing + monitoring)
    - marketing-calendar (cross-channel coordination)
    - audit-chain (sealing)
  implementationPlanRef: IP-048-social-seam.md
  openQuestionResolution: "Q-011 settled — social media management delegated to social µservice"
