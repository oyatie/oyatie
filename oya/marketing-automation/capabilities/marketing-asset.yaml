apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-marketing-asset
  service: marketing-automation
spec:
  businessCapability: marketing-asset
  capability: marketing-asset
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Design Manager + Files + Snippets + Templates + Custom Modules + Themes + Brand Kit
  flankingCounterparts:
    - Adobe Marketo Engage Design Studio
    - Mailchimp Content Studio
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: marketing-asset
  aggregateRoot: marketing_asset
  invariants:
    - tenant scope required
    - templates + files + design blocks + snippets + brand kit
    - per-asset version monotonic
    - per-locale variants per pack overlay
    - accessibility audit on publish
  commands: [create, amend, publish, retire, duplicate]
  events: [created, amended, published, retired, duplicated]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishMarketingAsset
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/marketing-assets
  observability:
    auditEvents:
      - EVT-MARKETING-ASSET-CREATED
      - EVT-MARKETING-ASSET-PUBLISHED
  crossMicroserviceHandoffs:
    - drive (large-object storage for files)
    - design-collaboration (templates + design blocks)
    - audit-chain (sealing)
  implementationPlanRef: IP-045-marketing-asset.md
