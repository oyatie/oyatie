apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-webhook-subscription
  service: marketing-automation
spec:
  businessCapability: marketing-webhook-subscription
  capability: webhook-subscription
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Webhooks
  flankingCounterparts:
    - Adobe Marketo Engage Webhooks
    - Mailchimp Webhooks
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0253-amendment, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: webhook-subscription
  aggregateRoot: marketing_webhook_subscription
  invariants:
    - tenant scope required
    - subscriber URL + event-filter + signing secret in OpenBao
    - HMAC-SHA-256 with per-subscription secret
    - signed timestamp (5 min window) defends against replay
    - retry policy exponential backoff max 6 attempts over 24 hours
    - HTTP/3 delivery default
  commands: [subscribe, amend, unsubscribe, deliver, rotate_secret]
  events: [subscribed, amended, unsubscribed, delivery_attempted, delivery_succeeded, delivery_failed, secret_rotated]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::SubscribeWebhook
      tenantClassRule: "demo_trial webhook_subscriptions cap = 3"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/webhooks/subscriptions
  observability:
    auditEvents:
      - EVT-MARKETING-WEBHOOK-SUBSCRIBED
      - EVT-MARKETING-WEBHOOK-DELIVERY-ATTEMPTED
      - EVT-MARKETING-WEBHOOK-DELIVERY-SUCCEEDED
      - EVT-MARKETING-WEBHOOK-DELIVERY-FAILED
  perUsageMeter: webhook_deliveries
  crossMicroserviceHandoffs:
    - openbao (signing secret custody)
    - audit-chain (sealing)
    - finops (per_usage meter)
  implementationPlanRef: IP-042-webhook-subscription.md
