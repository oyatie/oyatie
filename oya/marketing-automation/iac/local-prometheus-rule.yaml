apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: marketing-automation-local-slo-burn
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: marketing-automation.local.slo
      rules:
        - alert: MarketingAutomationLocalSloBurn
          expr: (sum(rate(oya_marketing_automation_send_latency_good_total[5m])) / sum(rate(oya_marketing_automation_send_latency_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: marketing-automation
          annotations:
            summary: Marketing Automation send-latency burn
            runbook: microservices/marketing-automation/runbooks/local-send-latency-burn.md
