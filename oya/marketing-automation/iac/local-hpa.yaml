apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketing-automation-send-worker
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketing-automation-send-worker
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_marketing_automation_send_latency_inflight
        target:
          type: AverageValue
          averageValue: "100"
