apiVersion: oyatie.dev/v1
kind: EchConfig
metadata:
  name: marketing-automation-ech-config
  labels:
    service: marketing-automation
    binding_adr: ADR-0253-amendment
spec:
  service: marketing-automation
  tenantScoped: true
  audienceType: ENTERPRISE_MARKETING_OPERATOR
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/campaign-journey-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Salesforce Marketing Cloud", "Adobe Marketo Engage", "HubSpot Marketing Hub", "Mailchimp", "Klaviyo"]
