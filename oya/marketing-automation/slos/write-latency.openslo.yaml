apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-write-latency
  labels:
    service: marketing-automation
    adr: ADR-0139
spec:
  service: marketing-automation
  indicator:
    metadata:
      name: write-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_write_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_write_latency_total[5m]))
  objectives:
    - displayName: Marketing Automation write-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
