apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-attribution-freshness
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: marketing-automation
  description: Attribution rollups available for active campaigns for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  indicator:
    metadata:
      name: attribution-freshness
      labels:
        domain_object: CampaignJourney
        operator_audience: ENTERPRISE_MARKETING_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_attribution_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_attribution_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Attribution rollups available for active campaigns
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
