apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-suppression-enforcement
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: marketing-automation
  description: Suppression entries applied before send fanout for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  indicator:
    metadata:
      name: suppression-enforcement
      labels:
        domain_object: CampaignJourney
        operator_audience: ENTERPRISE_MARKETING_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_suppression_enforcement_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_suppression_enforcement_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Suppression entries applied before send fanout
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
