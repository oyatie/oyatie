apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-policy-decision-latency
  labels:
    service: marketing-automation
    adr: ADR-0139
spec:
  service: marketing-automation
  indicator:
    metadata:
      name: policy-decision-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_policy_decision_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_policy_decision_latency_total[5m]))
  objectives:
    - displayName: Marketing Automation policy-decision-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
