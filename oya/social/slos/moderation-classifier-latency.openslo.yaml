# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: social-moderation-classifier-latency
  displayName: "social: content-moderation classifier verdict p99 ≤ 2s"
  labels:
    microservice: social
    bc: content-moderation
    sli_class: latency
    owner_team: axis-social + axis-foundry-runtime
    risk_class: high-risk
spec:
  description: |
    Time from `PostPublished` event to `ModerationVerdictEmitted` audit-chain
    seal. Includes foundry-runtime inference call + batching window. Per
    EU AI Act Art. 14 (human oversight) and Art. 15 (accuracy + robustness),
    classifier verdict latency is bounded so that auto-hide and Statement
    of Reasons (EU DSA Art. 17) can fire on user-visible feed-render path.
  service: social
  indicator:
    metadata:
      name: social-moderation-classifier-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_moderation_classifier_duration_seconds_bucket{le="2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_social_moderation_classifier_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 moderation classifier verdict ≤ 2s"
