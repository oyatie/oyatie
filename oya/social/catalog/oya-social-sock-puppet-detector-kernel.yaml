apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-community-social-sock-puppet-detector-kernel
  namespace: social
spec:
  microservice: social
  bounded_context: sock-puppet-detection
  layer: kernel
  language: rust
  binding_adrs:
    - ADR-0297
  classifier:
    type: ml_cluster_analysis
    inputs:
      - device_fingerprint
      - ip_range
      - email_domain
      - phone_prefix
      - behavior_signature
      - signup_timing
    output:
      - sock_puppet_cluster_id
      - cluster_size
      - confidence_score
  emits_audit_classes:
    - oya.social.sock-puppet-detect
    - oya.social.cluster-takedown-complete
    - oya.social.engagement-reverse
  cedar_fragment: policy/abuse-defence.cedar
