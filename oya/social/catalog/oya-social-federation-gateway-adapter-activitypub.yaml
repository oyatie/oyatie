# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-community-social-federation-gateway-adapter-activitypub
role: adapter
context: social
plane: data
slo: hero-product
contracts_consumed: []
contracts_exposed: []
regulatory_packs_consumed: [oya-pack-eu, oya-pack-us, oya-pack-jp, oya-pack-sg, oya-pack-au, oya-pack-in, oya-pack-br, oya-pack-ae, oya-pack-ksa]  # pack-kr + pack-us-healthcare federation OFF by default
lifecycle: {state: scheduled-for-distinct-tracked-work, preview_since: 2026-05-17, activation_target: M02-P02}
traceability:
