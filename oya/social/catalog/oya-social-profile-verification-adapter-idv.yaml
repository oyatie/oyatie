apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-community-social-profile-verification-adapter-idv
  namespace: social
spec:
  microservice: social
  bounded_context: profile-verification
  layer: adapter
  language: rust
  binding_adrs:
    - ADR-0297
  backend_options:
    - persona-idv
    - onfido
    - jumio
    - stripe-identity
  emits_audit_classes:
    - oya.social.idv-attempt
    - oya.social.idv-verify
    - oya.social.idv-deny
  cedar_fragment: policy/profile-verification.cedar
