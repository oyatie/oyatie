# Edge WAF + bot-management config — social µservice (EXTENSIVE)
# Authority: ADR-0297; documentation-rigor.md §3.2.3
# UX-floor: ≤2ms default-path latency; passive scoring; challenge only on confirmed-suspicion.
# This surface is the highest-targeted on the platform — wiring is the most extensive of any µservice.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: social-edge-waf
  namespace: social
spec:
  routes:
    - path: /v1/social/feed
      action: feed_read
      rate_limit:
        per_ip_per_minute: 600
        per_tenant_per_minute_default: 6000
        per_tenant_per_minute_tier_1: 60000
        per_tenant_per_minute_tier_2: 600000
        per_tenant_per_minute_b2b_creator_verified: 60000000
        burst_multiplier: 1.5
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        challenge_provider: turnstile_invisible
    - path: /v1/social/profile/*
      action: profile_read
      rate_limit:
        per_ip_per_minute: 200
        per_tenant_per_minute_default: 2000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        anti_scrape_pattern_detection: enabled
    - path: /v1/social/signup
      action: signup
      rate_limit:
        per_ip_per_minute: 3
      bot_management:
        mode: challenge_on_every_request
        challenge_provider: turnstile_visible
        device_attestation_required:
          ios: app_attest
          android: play_integrity
          web: webauthn_origin
        sock_puppet_check: enabled
    - path: /v1/social/post
      action: post_create
      rate_limit:
        per_ip_per_minute: 30
        per_tenant_per_minute_default: 300
        per_tenant_per_minute_b2b_creator_verified: 3000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
    - path: /v1/social/dm/send
      action: dm_send
      rate_limit:
        per_ip_per_minute: 30
      bot_management:
        mode: passive_score
        threshold_challenge: 90  # tighter on DM surface
    - path: /v1/social/federation/inbound
      action: federation_inbound
      rate_limit:
        per_instance_per_minute: 6000
      bot_management:
        mode: ap_signature_verify
        replay_window_seconds: 300
    - path: /v1/social/bulk-export
      action: bulk_export
      rate_limit:
        per_ip_per_minute: 1
      bot_management:
        mode: paid_api_tier_only
        accredited_partner_allowlist:
          - searchengine-google-news
          - searchengine-bing-news
          - researcher-stanford-internet-observatory
          - a11y-tools-axe
    - path: /v1/social/search
      action: search
      rate_limit:
        per_ip_per_minute: 60
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        anti_scrape_alphabetical_enumeration_detection: enabled

  honeypot_routes:
    - path: /v1/social/_internal/secret-list
      response_class: canary
      audit_class: oya.social.honeypot-trip
    - path: /v1/social/_internal/api-keys-bulk
      response_class: canary
      audit_class: oya.social.honeypot-trip

  canary_payloads:
    - field: fake_creator_handle
      seed_in_responses: 1_per_100k
      audit_class: oya.social.canary-leak-detect

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  fingerprinting:
    ja4: enabled
    ja4_plus: enabled
    http2_frame_pattern: enabled
    http3_frame_pattern: enabled
    mode: passive

  anti_scrape:
    pattern_anomaly_detection: enabled
    sequential_id_detection: enabled
    breadth_first_traversal_detection: enabled
    alphabetical_enumeration_detection: enabled
    parallel_tab_detection: enabled
    css_class_name_randomization: enabled
    structural_html_mutation: enabled
    per_user_invisible_watermark: enabled

  ux_floor:
    default_path_latency_budget_ms: 2
    accessibility:
      audio_captcha_fallback: enabled
      keyboard_navigation: enabled
      screen_reader_friendly: enabled
      no_time_pressure_for_assistive_tech: enabled
    challenge_solve_time_floor_seconds: 10
    session_continuity_preserved: true
    tenant_tier_adaptive_sensitivity: enabled
    locale_aware_challenges: enabled
    mobile_native_attestation_preferred: true

  audit:
    emit_class_block: oya.social.abuse-defence-block
    emit_class_allow: oya.social.abuse-defence-allow
    emit_class_scrape_detect: oya.social.scrape-pattern-detect
    emit_class_spoof_attempt: oya.social.spoof-attempt-block
    emit_class_sock_puppet: oya.social.sock-puppet-detect
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
    false_positive_metric: oya_social_abuse_defence_false_positive_rate
    blocked_bot_metric: oya_social_abuse_defence_blocked_total
    friction_events_metric: oya_social_abuse_defence_challenge_present_total
