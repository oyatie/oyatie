# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the social µservice.
# Per-pack overlays adjust: residency, retention overrides, secret-ref URIs,
# replica scaling tier, pack federation/E2E posture, regulatory packs,
# capability tier toggles (T0/T1/T2), and age-gate thresholds.

namespace: social

resources:
  - namespace.yaml
  - openbao-secret-references.yaml

helmCharts:
  - name: oya-social
    valuesFile: ../../helm/social/values.yaml
    releaseName: social
    namespace: social

commonLabels:
  app.kubernetes.io/part-of: oya-social
  oyatie/microservice: social
