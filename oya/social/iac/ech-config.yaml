# ECH config for social
# Authority: ADR-0253 row-12 ECH

apiVersion: config.k8s.oya/v1
kind: ECHConfig
metadata:
  name: social-ech-config
  namespace: social
spec:
  enabled: true
  rotation_cadence_days: 90
  publish_https_rr: true
  dns_provider: cloudflare
  config_ids:
    - id: 01
      public_name: social.oyatie.example
      kem: x25519-kyber768
      kdf: hkdf-sha256
      aead: aes-256-gcm
      created_at: 2026-05-20T00:00:00Z
      expires_at: 2026-08-18T00:00:00Z
      status: ACTIVE
  fallback:
    standard_tls_13: enabled
    refuse_session_if_no_ech: false
