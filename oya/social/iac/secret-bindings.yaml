# External Secrets Operator + OpenBao bindings for social

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: social-openbao
spec:
  provider:
    vault:
      server: https://openbao.oyatie-internal.example:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: social
          serviceAccountRef:
            name: social-app
            namespace: social
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-federation-signing-key
  namespace: social
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: social-openbao
    kind: ClusterSecretStore
  target:
    name: social-federation-signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: social/federation-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-idv-provider-api-key
  namespace: social
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: social-openbao
    kind: ClusterSecretStore
  target:
    name: social-idv-provider-api-key
  dataFrom:
    - extract:
        key: social/idv-provider-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-photodna-api-key
  namespace: social
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: social-openbao
    kind: ClusterSecretStore
  target:
    name: social-photodna-api-key
  dataFrom:
    - extract:
        key: social/photodna-api-key
