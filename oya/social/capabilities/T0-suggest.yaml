# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:social:t0-suggest:v1
name: composer-suggest-and-hashtag-completion
namespace: social
display_name: Composer Auto-Suggest + Hashtag Completion
description: |
  Given the composing user's partial post draft (text + media + visible
  context), emit ≤ 3 ranked smart-reply / continuation suggestions and
  ≤ 5 ranked hashtag-completion candidates for the composing client.
  T0 = suggestion only; no autonomous publish. Always presented to the
  user; no action taken without confirmation.

owner_team: axis-social + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133]
related_specs: [/specs/microservices/social.json]
related_artifacts:
  - microservices/social/PRD.md (FR-25 Workflow event integration)
  - microservices/social/contracts/openapi/social.yaml
  - microservices/social/policy/dual-context-isolation.md

autonomy_tier: T0
# T0 = suggest-only; per ADR-0022 autonomy tiers (Bominal-inherited).
# No state mutation; no auto-publish.

inputs:
  - name: composing_user_ref
    type: string
    required: true
  - name: draft_body
    type: string
    maxLength: 4096
    required: true
  - name: context_kind
    type: enum
    values: [Personal, Professional]
    required: true
  - name: visible_thread_context
    type: array
    items: {ref: Post (per contracts/openapi/social.yaml)}
    max_items: 8
    required: false
  - name: locale
    type: string
    pattern: '^[a-z]{2}(-[A-Z]{2})?$'
    required: true

outputs:
  - name: continuation_suggestions
    type: array
    max_items: 3
    items:
      type: object
      properties:
        text: {type: string, maxLength: 280}
        confidence: {type: number, minimum: 0, maximum: 1}
        rationale_token: {type: string, description: opaque rationale id for audit replay}
  - name: hashtag_completions
    type: array
    max_items: 5
    items:
      type: object
      properties:
        hashtag: {type: string, maxLength: 100}
        post_count_signal: {type: integer}
        confidence: {type: number}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING  # draft body may contain names / contact details

context_kind_constraint:
  Personal: model-runs-server-side-on-draft-only  # not on personal historical posts
  Professional: model-runs-server-side  # server has decrypted body via tenant-DEK
  enforcement: compile-time + LEAN-check oya-check-dual-context-isolation

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare  # MUST DISABLE for PHI channels per HIPAA Safe Harbour
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

pack_overrides:
  pack-us-healthcare:
    disabled_for_phi_accounts: true
    reason: HIPAA 45 CFR §164.514 Safe Harbour — no derived inferences over PHI
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: must-label-as-AI-suggested per EU AI Act Art. 50
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required
  pack-cn-future:
    note: out-of-scope for current packs; future evaluation

evidence_topic: oya.social.capability.t0_suggest.evidence

cost_profile:
  type: per-suggestion-batch
  estimated_cost_usd_per_call: 0.0008
  cost_drivers:
    - LLM inference (small open-weights model; on-prem GPU pool)
    - Hashtag-corpus lookup for completion candidates

cedar_policy_fragments:
  - microservices/social/policy/tenant-scope.cedar
  - microservices/social/policy/public-read.cedar  # may reference public corpus for hashtag completion

eval_set:
  reference_inputs_path: microservices/social/capabilities/eval/t0-suggest-reference.jsonl
  pass_threshold: 0.90
  eval_metric: continuation-suggestion-relevance vs human-rater baseline; hashtag-completion precision@1
  cadence: per-release

sunset:
  status: none
