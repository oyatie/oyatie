openapi: 3.2.0
info:
  title: oya-social
  version: 1.0.0
  summary: REST API for the social µservice — profile + post + follow-graph + feed + reactions + comments + mentions + hashtags + search + notifications + moderation + bookmarks + lists
  description: |
    Tenant-facing REST surface for the social µservice. All endpoints require
    OIDC + Cedar authorisation (per `microservices/social/policy/*.cedar`)
    and are tenant-scoped via `X-Scope-OrgID` header.

    Real-time path is via WebSocket at `wss://social-{pack}.oyatie.com/ws/v1`
    documented in `contracts/asyncapi/social-events.yaml`.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries the principal's tenant_id claim. The X-Scope-OrgID header
    MUST match the claim; mismatch returns 401.

    Dual-context invariant: every write carries `X-Context-Kind: Personal | Professional`;
    cross-context writes refused per ADR-0135 (parallel) + `policy/dual-context-isolation.md`.
  contact:
    name: axis-social
    url: https://oyatie.com/teams/axis-social
  license:
    name: Internal
servers:
  - url: https://social-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: social
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    XContextKind:
      in: header
      name: X-Context-Kind
      required: true
      schema:
        type: string
        enum: [Personal, Professional]
      description: Dual-context invariant per parallel ADR-0238
    ProfileId:
      in: path
      name: profile_id
      required: true
      schema:
        type: string
        format: ulid
    PostId:
      in: path
      name: post_id
      required: true
      schema:
        type: string
        format: ulid
    Handle:
      in: path
      name: handle
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_]{1,30}$'
  schemas:
    Profile:
      type: object
      required: [profile_id, tenant_id, context_kind, handle, display_name, created_at]
      properties:
        profile_id: {type: string, format: ulid}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        handle: {type: string, maxLength: 30}
        display_name: {type: string, maxLength: 50}
        bio: {type: string, maxLength: 200}
        avatar_url: {type: string, format: uri, nullable: true}
        header_url: {type: string, format: uri, nullable: true}
        verification_badge: {type: string, enum: [none, blue, organisation, government], default: none}
        follower_count: {type: integer}
        following_count: {type: integer}
        post_count: {type: integer}
        is_protected: {type: boolean, default: false}
        federation_opt_in: {type: boolean, default: false, description: Professional-tier opt-in to ActivityPub federation; Personal-tier always false}
        created_at: {type: string, format: date-time}
    Post:
      type: object
      required: [post_id, author_ref, tenant_id, context_kind, posted_at, visibility]
      properties:
        post_id: {type: string, format: ulid}
        author_ref: {type: string}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        kind: {type: string, enum: [post, repost, quote_post, comment]}
        parent_post_id: {type: string, format: ulid, nullable: true, description: For comment/repost/quote_post}
        body: {type: string, maxLength: 4096}
        media_refs:
          type: array
          items: {type: string, format: ulid}
          maxItems: 10
        link_preview:
          type: object
          properties:
            url: {type: string, format: uri}
            title: {type: string}
            description: {type: string}
            image_url: {type: string, format: uri}
          nullable: true
        mention_refs:
          type: array
          items: {type: string}
        hashtag_refs:
          type: array
          items: {type: string}
        visibility: {type: string, enum: [public, followers, list, private]}
        visibility_list_id: {type: string, format: ulid, nullable: true}
        content_warning: {type: string, enum: [none, sensitive, spoiler, nsfw, violence], default: none}
        data_class: {type: string, enum: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PHI, BEHAVIORAL_USER_CONTENT, PERSONAL]}
        reaction_counts:
          type: object
          additionalProperties: {type: integer}
        comment_count: {type: integer}
        repost_count: {type: integer}
        bookmark_count: {type: integer}
        edited_at: {type: string, format: date-time, nullable: true}
        deleted_at: {type: string, format: date-time, nullable: true}
        posted_at: {type: string, format: date-time}
        content_hash: {type: string, description: sha256(canonical_body)}
    FollowEdge:
      type: object
      required: [follower_ref, followee_ref, established_at]
      properties:
        follower_ref: {type: string}
        followee_ref: {type: string}
        established_at: {type: string, format: date-time}
    Reaction:
      type: object
      required: [emoji]
      properties:
        emoji: {type: string, maxLength: 64}
    Media:
      type: object
      required: [media_id, blob_ref, digest_sha256, mime_type, scan_status]
      properties:
        media_id: {type: string, format: ulid}
        blob_ref: {type: string, description: signed-URL (≤15min TTL)}
        digest_sha256: {type: string}
        size_bytes: {type: integer}
        mime_type: {type: string}
        scan_status: {type: string, enum: [pending, clean, infected, error]}
        transcode_variants:
          type: array
          items:
            type: object
            properties:
              variant: {type: string, enum: [thumbnail, small, medium, large, hls_low, hls_high]}
              url: {type: string, format: uri}
        alt_text: {type: string, maxLength: 1000, nullable: true}
    Notification:
      type: object
      required: [notification_id, recipient_ref, kind, created_at]
      properties:
        notification_id: {type: string, format: ulid}
        recipient_ref: {type: string}
        kind: {type: string, enum: [mention, reply, repost, quote_post, follow, like, milestone, moderation_verdict, appeal_resolved, system]}
        actor_ref: {type: string, nullable: true}
        post_id: {type: string, format: ulid, nullable: true}
        preview: {type: string, maxLength: 200}
        read: {type: boolean, default: false}
        created_at: {type: string, format: date-time}
    Hashtag:
      type: object
      required: [hashtag, pack]
      properties:
        hashtag: {type: string, maxLength: 100}
        pack: {type: string}
        post_count: {type: integer}
        trend_velocity: {type: number}
    TrendingTopic:
      type: object
      required: [topic, pack, window_start, window_end, score]
      properties:
        topic: {type: string}
        pack: {type: string}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        score: {type: number}
        related_hashtags: {type: array, items: {type: string}}
    SearchResult:
      type: object
      required: [results, took_ms]
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Profile'
              - $ref: '#/components/schemas/Post'
        total_hits: {type: integer}
        took_ms: {type: integer}
    AbuseReport:
      type: object
      required: [report_id, reporter_ref, target_post_id, category, created_at]
      properties:
        report_id: {type: string, format: ulid}
        reporter_ref: {type: string}
        target_post_id: {type: string, format: ulid}
        category: {type: string, enum: [spam, abuse, harassment, hate_speech, impersonation, csam_suspect, self_harm_suspect, sensitive_media_unflagged, other]}
        reason: {type: string, maxLength: 500}
        created_at: {type: string, format: date-time}
        status: {type: string, enum: [open, under_review, resolved_action_taken, resolved_no_action], default: open}
    Appeal:
      type: object
      required: [appeal_id, appellant_ref, target_verdict_id, reason, created_at]
      properties:
        appeal_id: {type: string, format: ulid}
        appellant_ref: {type: string}
        target_verdict_id: {type: string, format: ulid}
        reason: {type: string, maxLength: 1000}
        created_at: {type: string, format: date-time}
        status: {type: string, enum: [open, under_review, upheld, overturned], default: open}
        resolution_at: {type: string, format: date-time, nullable: true}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /profiles:
    post:
      summary: Create a profile (signup)
      operationId: createProfile
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/XContextKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, display_name]
              properties:
                handle: {type: string}
                display_name: {type: string}
                bio: {type: string}
                age_attestation:
                  type: object
                  description: Required per pack; minor flow routes through parental consent
                  properties:
                    age_bracket: {type: string, enum: [under_13, 13_to_17, 18_to_24, 25_plus]}
                    parental_consent_token: {type: string, nullable: true}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {description: Bad request (age-gate failed; pack policy)}

  /profiles/me:
    get:
      summary: Read own profile
      operationId: getMyProfile
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
    patch:
      summary: Update own profile
      operationId: updateMyProfile
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                bio: {type: string}
                avatar_url: {type: string}
                header_url: {type: string}
                is_protected: {type: boolean}
                federation_opt_in: {type: boolean, description: Professional-tier only; Personal-tier rejection at server}
      responses:
        '200': {description: Updated}

  /profiles/{handle}:
    get:
      summary: Read a profile by handle
      operationId: getProfileByHandle
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Handle'
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}

  /profiles/{handle}/follow:
    post:
      summary: Follow a profile
      operationId: follow
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Handle'
      responses:
        '201': {description: Followed, content: {application/json: {schema: {$ref: '#/components/schemas/FollowEdge'}}}}

  /profiles/{handle}/unfollow:
    post:
      summary: Unfollow a profile
      operationId: unfollow
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Handle'
      responses:
        '204': {description: Unfollowed}

  /profiles/{handle}/block:
    post:
      summary: Block a profile
      operationId: block
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Handle'
      responses:
        '201': {description: Blocked}

  /profiles/{handle}/mute:
    post:
      summary: Mute a profile
      operationId: mute
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Handle'
      responses:
        '201': {description: Muted}

  /posts:
    post:
      summary: Publish a post
      operationId: publishPost
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/XContextKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, visibility]
              properties:
                body: {type: string, maxLength: 4096}
                media_refs:
                  type: array
                  items: {type: string, format: ulid}
                visibility: {type: string, enum: [public, followers, list, private]}
                visibility_list_id: {type: string, format: ulid, nullable: true}
                content_warning: {type: string, enum: [none, sensitive, spoiler, nsfw, violence]}
                parent_post_id: {type: string, nullable: true, description: For comment/repost/quote_post}
                kind: {type: string, enum: [post, repost, quote_post, comment], default: post}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}

  /posts/{post_id}:
    get:
      summary: Read a post
      operationId: getPost
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
      responses:
        '200': {description: Post, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
    patch:
      summary: Edit own post (within edit-window)
      operationId: editPost
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: string, maxLength: 4096}
      responses:
        '200': {description: Edited}
    delete:
      summary: Delete own post (tombstone)
      operationId: deletePost
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
      responses:
        '204': {description: Deleted}

  /posts/{post_id}/reactions:
    post:
      summary: Add a reaction to a post
      operationId: addReaction
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reaction'}
      responses:
        '201': {description: Added}

  /posts/{post_id}/reactions/{emoji}:
    delete:
      summary: Remove own reaction
      operationId: removeReaction
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
        - in: path
          name: emoji
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}

  /posts/{post_id}/bookmark:
    post:
      summary: Bookmark a post (private to caller)
      operationId: bookmarkPost
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/PostId'
      responses:
        '201': {description: Bookmarked}

  /feed:
    get:
      summary: Render the caller's feed (chronological default; algorithmic available)
      operationId: renderFeed
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: feed_mode
          schema: {type: string, enum: [chronological, algorithmic], default: chronological}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items: {$ref: '#/components/schemas/Post'}
                  next_cursor: {type: string, nullable: true}
                  ranking_explanation:
                    type: object
                    description: EU AI Act Art. 27 transparency; populated when feed_mode=algorithmic

  /search/people:
    get:
      summary: Search people (Cedar-filtered)
      operationId: searchPeople
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: q
          required: true
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: People matches (Cedar-filtered server-side)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResult'}

  /search/content:
    get:
      summary: Search content (Cedar-filtered)
      operationId: searchContent
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: q
          required: true
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Post matches (Cedar-filtered server-side)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResult'}

  /trending:
    get:
      summary: Get current trending topics within pack + tenant
      operationId: getTrending
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: window
          schema: {type: string, enum: [5m, 1h, 24h], default: 1h}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Trending topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items: {$ref: '#/components/schemas/TrendingTopic'}

  /media:
    post:
      summary: Initiate multipart media upload
      operationId: initiateMediaUpload
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size_bytes, mime_type]
              properties:
                filename: {type: string}
                size_bytes: {type: integer, maximum: 209715200}
                mime_type: {type: string}
                alt_text: {type: string}
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_id: {type: string}
                  upload_urls: {type: array, items: {type: string}}
                  finalize_url: {type: string}

  /notifications:
    get:
      summary: Get caller's notifications
      operationId: getNotifications
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: unread_only
          schema: {type: boolean, default: false}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: {type: array, items: {$ref: '#/components/schemas/Notification'}}

  /reports:
    post:
      summary: File abuse report (EU DSA Art. 16 notice-and-action)
      operationId: reportAbuse
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_post_id, category]
              properties:
                target_post_id: {type: string, format: ulid}
                category: {type: string, enum: [spam, abuse, harassment, hate_speech, impersonation, csam_suspect, self_harm_suspect, sensitive_media_unflagged, other]}
                reason: {type: string, maxLength: 500}
      responses:
        '201': {description: Report filed, content: {application/json: {schema: {$ref: '#/components/schemas/AbuseReport'}}}}

  /appeals:
    post:
      summary: Open appeal against a moderation verdict (EU DSA Art. 20)
      operationId: openAppeal
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_verdict_id, reason]
              properties:
                target_verdict_id: {type: string, format: ulid}
                reason: {type: string, maxLength: 1000}
      responses:
        '201': {description: Appeal opened, content: {application/json: {schema: {$ref: '#/components/schemas/Appeal'}}}}

  /holds:
    post:
      summary: Open eDiscovery hold (compliance-officer entitlement required; Professional-tier only)
      operationId: openEDiscoveryHold
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: object
                  properties:
                    profile_ids: {type: array, items: {type: string}}
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                reason: {type: string}
      responses:
        '201': {description: Hold opened}

  /disclosures:
    post:
      summary: Request four-eyes disclosure (Professional-tier; paired action)
      operationId: requestDisclosure
      parameters: [{$ref: '#/components/parameters/XScopeOrgID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_ids, reason, paired_approver_id]
              properties:
                post_ids: {type: array, items: {type: string}}
                reason: {type: string}
                paired_approver_id: {type: string}
      responses:
        '202': {description: Awaiting paired approval}

  /health:
    get:
      summary: Liveness
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness (Postgres + Valkey + Meilisearch + S3 reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
