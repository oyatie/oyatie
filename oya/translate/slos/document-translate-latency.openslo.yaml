# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-document-translate-latency
  displayName: "translate: 10-page DOCX document-translate latency p95"
  labels:
    microservice: translate
    bc: document-translation
    sli_class: latency
    service_classification: hero-and-substrate
    owner_team: axis-translate
    pack_scope: all
spec:
  description: |
    Document-translate latency p95 SLO. A document translate is "good" when a
    10-page DOCX submitted via `/document-translate` completes round-trip
    (Pandoc 3.x extract → per-segment MT → Pandoc re-merge) within ≤ 8 s p95.
    Pandoc + LibreOffice 24.x in gVisor sandbox per ADR-TRANSLATE-0005.
    PRD §"Performance" FR-11.
  service: translate
  indicator:
    metadata: {name: translate-document-translate-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95,
                sum by (le) (rate(oya_translate_document_translate_duration_seconds_bucket{format="docx",pages_bucket="10"}[5m])))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 8.0
      displayName: "30d rolling p95 ≤ 8 s for 10-page DOCX"
  alertPolicies:
    - alertPolicyRef: translate-document-fast-burn-1h-14x
    - alertPolicyRef: translate-document-slow-burn-6h-6x
    - alertPolicyRef: translate-document-fidelity-class-breach
    - alertPolicyRef: translate-document-sandbox-panic
