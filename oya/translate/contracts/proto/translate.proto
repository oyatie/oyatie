// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-translate — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/translate.yaml.
// Provides server-streaming for the real-time caption-translate session per ADR-TRANSLATE-0006.
// Per ADR-0131 + ADR-0132 + ADR-0133.

syntax = "proto3";

package oya.translate.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =========================================================================
// Service: Translate
// =========================================================================
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluated server-side; same fragments as REST.
// Tenancy: per-request metadata "x-tenant-id" + "x-pack".
// Pack residency: server enforces per ADR-TRANSLATE-0004; any violation is
// rejected with PERMISSION_DENIED and emits SovereignTenantLeakDetected.

service Translate {
  // ----- Single + batch translation -----
  rpc TranslateText(TranslateRequest) returns (TranslateResponse);
  rpc BatchTranslate(BatchTranslateRequest) returns (BatchTranslateResponse);

  // ----- Language detection -----
  rpc DetectLanguage(DetectLanguageRequest) returns (DetectLanguageResponse);

  // ----- Translation memory -----
  rpc TmLeverage(TmLeverageRequest) returns (TmLeverageResponse);

  // ----- Quality estimation -----
  rpc QeScore(QeScoreRequest) returns (QeScoreResponse);

  // ----- Document translate (asynchronous job) -----
  rpc DocumentTranslate(DocumentTranslateRequest) returns (DocumentTranslateJob);
  rpc GetDocumentTranslateJob(GetJobRequest) returns (DocumentTranslateJob);

  // ----- Bulk translate (asynchronous job) -----
  rpc BulkTranslate(BulkTranslateRequest) returns (BulkTranslateJob);
  rpc GetBulkTranslateJob(GetJobRequest) returns (BulkTranslateJob);

  // ----- Real-time stream (bidirectional) -----
  // Client sends a stream of caption chunks; server emits translated chunks
  // with correction-replay per ADR-TRANSLATE-0006.
  rpc RealTimeTranslateStream(stream CaptionChunkIn) returns (stream CaptionChunkOut);

  // ----- Glossary CRUD -----
  rpc ListGlossary(ListGlossaryRequest) returns (ListGlossaryResponse);
  rpc CreateGlossaryEntry(GlossaryEntry) returns (GlossaryEntry);
  rpc UpdateGlossaryEntry(GlossaryEntry) returns (GlossaryEntry);
  rpc DeleteGlossaryEntry(DeleteByIdRequest) returns (google.protobuf.Empty);

  // ----- Termbase CRUD -----
  rpc ListTermbases(ListTermbasesRequest) returns (ListTermbasesResponse);
  rpc CreateTermbase(TermbaseCreateRequest) returns (Termbase);
  rpc GetTermbase(GetByIdRequest) returns (Termbase);
  rpc DeleteTermbase(DeleteByIdRequest) returns (google.protobuf.Empty);
  rpc ImportTbx(stream ImportTbxChunk) returns (TermbaseImportJob);
  rpc ExportTbx(GetByIdRequest) returns (stream ExportTbxChunk);

  // ----- Event streaming subscriptions -----
  rpc StreamTranslationCompleted(StreamRequest) returns (stream TranslationCompletedEvent);
  rpc StreamEngineRouted(StreamRequest) returns (stream EngineRoutedEvent);
  rpc StreamSovereignLeakDetected(StreamRequest) returns (stream SovereignTenantLeakDetectedEvent);
}

// =========================================================================
// Common enums
// =========================================================================

enum ContentClass {
  CONTENT_CLASS_UNSPECIFIED = 0;
  CONTENT_CLASS_MARKETING = 1;
  CONTENT_CLASS_LEGAL = 2;
  CONTENT_CLASS_MEDICAL = 3;
  CONTENT_CLASS_CODE_COMMENT = 4;
  CONTENT_CLASS_UI_STRING = 5;
  CONTENT_CLASS_TECHNICAL = 6;
  CONTENT_CLASS_GENERIC = 7;
  CONTENT_CLASS_EMPLOYMENT = 8;
  CONTENT_CLASS_CREDIT_SCORING = 9;
}

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_IN_HOUSE = 1;
  ENGINE_ANTHROPIC = 2;
  ENGINE_OPENAI = 3;
  ENGINE_GOOGLE_TRANSLATE = 4;
  ENGINE_DEEPL = 5;
}

enum TmLeverageMatch {
  TM_LEVERAGE_MATCH_UNSPECIFIED = 0;
  TM_LEVERAGE_MATCH_EXACT = 1;
  TM_LEVERAGE_MATCH_ICE = 2;   // in-context exact
  TM_LEVERAGE_MATCH_FUZZY = 3;
  TM_LEVERAGE_MATCH_NONE = 4;
}

enum FidelityTier {
  FIDELITY_TIER_UNSPECIFIED = 0;
  FIDELITY_TIER_A = 1;  // structural + text 95%/100%
  FIDELITY_TIER_B = 2;  // structural 80%, text 100%
  FIDELITY_TIER_C = 3;  // text-only
}

enum DocumentFormat {
  DOCUMENT_FORMAT_UNSPECIFIED = 0;
  DOCUMENT_FORMAT_DOCX = 1;
  DOCUMENT_FORMAT_PPTX = 2;
  DOCUMENT_FORMAT_XLSX = 3;
  DOCUMENT_FORMAT_PDF = 4;
  DOCUMENT_FORMAT_HTML = 5;
  DOCUMENT_FORMAT_MARKDOWN = 6;
  DOCUMENT_FORMAT_PO = 7;
  DOCUMENT_FORMAT_XLIFF = 8;
  DOCUMENT_FORMAT_ARB = 9;
  DOCUMENT_FORMAT_STRINGS = 10;
  DOCUMENT_FORMAT_RESX = 11;
  DOCUMENT_FORMAT_PROPERTIES = 12;
}

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
  PACK_CN_STUB = 12;
}

// =========================================================================
// Single + batch translation
// =========================================================================

message TranslateRequest {
  string text = 1;
  string source_locale = 2;        // BCP 47; empty → auto-detect
  string target_locale = 3;
  ContentClass content_class = 4;
  string project_id = 5;           // ULID
  bool require_qe = 6;
  string formality = 7;            // default | formal | informal
  string tenant_id = 8;
  Pack pack = 9;
}

message TranslateResponse {
  string translation = 1;
  Engine engine = 2;
  string engine_region = 3;
  TmLeverageMatch tm_leverage = 4;
  double tm_leverage_score = 5;
  double qe_score = 6;             // -1 if not requested
  string content_hash = 7;         // BLAKE3
  string evidence_event_id = 8;    // ULID
  string ai_disclosure_label = 9;  // Art. 50 disclosure for EU
}

message BatchTranslateRequest {
  message Segment {
    string id = 1;
    string text = 2;
    string source_locale = 3;
    ContentClass content_class = 4;
  }
  repeated Segment segments = 1;   // max 100
  string target_locale = 2;
  string project_id = 3;
  string tenant_id = 4;
  Pack pack = 5;
}

message BatchTranslateResponse {
  message Result {
    string id = 1;
    string translation = 2;
    Engine engine = 3;
    TmLeverageMatch tm_leverage = 4;
    double qe_score = 5;
    string error = 6;
  }
  repeated Result results = 1;
}

// =========================================================================
// Language detection
// =========================================================================

message DetectLanguageRequest {
  string text = 1;
  string tenant_id = 2;
  Pack pack = 3;
}

message DetectLanguageResponse {
  message Alternate {
    string bcp47 = 1;
    double confidence = 2;
  }
  string detected_bcp47 = 1;
  string detected_iso_639_3 = 2;
  double confidence = 3;
  repeated Alternate alternates = 4;
}

// =========================================================================
// TM leverage
// =========================================================================

message TmLeverageRequest {
  string text = 1;
  string source_locale = 2;
  string target_locale = 3;
  string project_id = 4;
  string tenant_id = 5;
}

message TmLeverageResponse {
  message Candidate {
    string tm_unit_id = 1;
    string source_text = 2;
    string target_text = 3;
    TmLeverageMatch match = 4;
    double match_score = 5;
  }
  repeated Candidate candidates = 1;   // up to 10
}

// =========================================================================
// Quality estimation
// =========================================================================

message QeScoreRequest {
  string source_text = 1;
  string target_text = 2;
  string source_locale = 3;
  string target_locale = 4;
  string tenant_id = 5;
  Pack pack = 6;
}

message QeScoreResponse {
  double score = 1;                    // 0-100
  double confidence_interval_low = 2;
  double confidence_interval_high = 3;
  string qe_model_version = 4;
  bool review_recommended = 5;
  string eu_ai_act_disclosure_id = 6;  // ULID, present on EU
}

// =========================================================================
// Document translate
// =========================================================================

message DocumentTranslateRequest {
  bytes file_bytes = 1;   // For very large files use BulkTranslate or pre-signed URL
  DocumentFormat format = 2;
  string source_locale = 3;
  string target_locale = 4;
  FidelityTier fidelity_tier = 5;
  string tenant_id = 6;
  Pack pack = 7;
}

message DocumentTranslateJob {
  string job_id = 1;
  string status = 2;   // queued | running | sealed | failed
  double progress_pct = 3;
  string result_url = 4;
  FidelityTier fidelity_tier_achieved = 5;
  string evidence_event_id = 6;
}

// =========================================================================
// Bulk translate
// =========================================================================

message BulkTranslateRequest {
  bytes file_bytes = 1;
  string format = 2;   // xliff | tmx | tbx | json_i18n | arb | po | strings | resx | properties
  string source_locale = 3;
  string target_locale = 4;
  string project_id = 5;
  string webhook_url = 6;
  string tenant_id = 7;
  Pack pack = 8;
}

message BulkTranslateJob {
  string job_id = 1;
  string status = 2;
  int32 segment_count = 3;
  double progress_pct = 4;
  string result_manifest_url = 5;
  string evidence_event_id = 6;
}

// =========================================================================
// Real-time caption-translate stream
// =========================================================================

message CaptionChunkIn {
  oneof body {
    StreamSessionOpen open = 1;
    AudioCaptionChunk chunk = 2;
    CaptionCorrection correction = 3;
    StreamSessionClose close = 4;
  }
}

message StreamSessionOpen {
  string source_locale = 1;
  string target_locale = 2;
  string meet_session_id = 3;
  int32 correction_replay_window_ms = 4;   // default 800
  string tenant_id = 5;
  Pack pack = 6;
}

message AudioCaptionChunk {
  string chunk_id = 1;
  string source_text = 2;          // STT output for this chunk
  google.protobuf.Timestamp received_at = 3;
  bool is_final = 4;               // true when sentence-piece ends utterance
}

message CaptionCorrection {
  string original_chunk_id = 1;
  string corrected_source_text = 2;
  google.protobuf.Timestamp corrected_at = 3;
}

message StreamSessionClose {
  string reason = 1;
}

message CaptionChunkOut {
  string chunk_id = 1;
  string translated_text = 2;
  bool is_correction_replay = 3;
  int32 latency_ms = 4;
  string content_hash = 5;
  string evidence_event_id = 6;
}

// =========================================================================
// Glossary
// =========================================================================

message GlossaryEntry {
  string entry_id = 1;
  string project_id = 2;
  string source_term = 3;
  string target_locale = 4;
  string target_term = 5;
  string part_of_speech = 6;
  string note = 7;
  string register = 8;
  bool do_not_translate = 9;
  string tenant_id = 10;
}

message ListGlossaryRequest {
  string tenant_id = 1;
  string project_id = 2;
  string cursor = 3;
}

message ListGlossaryResponse {
  repeated GlossaryEntry entries = 1;
  string next_cursor = 2;
}

message DeleteByIdRequest {
  string id = 1;
  string tenant_id = 2;
}

// =========================================================================
// Termbase
// =========================================================================

message Termbase {
  string termbase_id = 1;
  string name = 2;
  string project_id = 3;
  string source_locale = 4;
  repeated string target_locales = 5;
  int32 concept_count = 6;
  google.protobuf.Timestamp created_at = 7;
  string tenant_id = 8;
}

message TermbaseCreateRequest {
  string name = 1;
  string project_id = 2;
  string source_locale = 3;
  repeated string target_locales = 4;
  string tenant_id = 5;
}

message GetByIdRequest {
  string id = 1;
  string tenant_id = 2;
}

message ListTermbasesRequest {
  string tenant_id = 1;
}

message ListTermbasesResponse {
  repeated Termbase termbases = 1;
}

message ImportTbxChunk {
  oneof body {
    ImportTbxOpen open = 1;
    bytes tbx_bytes = 2;
    ImportTbxClose close = 3;
  }
}

message ImportTbxOpen {
  string termbase_id = 1;
  string tenant_id = 2;
}

message ImportTbxClose {
  string final_checksum = 1;
}

message ExportTbxChunk {
  bytes tbx_bytes = 1;
  bool is_last = 2;
}

message TermbaseImportJob {
  string job_id = 1;
  string status = 2;
  int32 imported_count = 3;
  message ValidationError {
    int32 line = 1;
    string message = 2;
  }
  repeated ValidationError errors = 4;
}

message GetJobRequest {
  string job_id = 1;
  string tenant_id = 2;
}

// =========================================================================
// Event streaming
// =========================================================================

message StreamRequest {
  string tenant_id = 1;
  Pack pack = 2;
  google.protobuf.Timestamp since = 3;
}

message TranslationCompletedEvent {
  string event_id = 1;
  string tenant_id = 2;
  Pack pack = 3;
  string source_lang = 4;
  string target_lang = 5;
  ContentClass content_class = 6;
  Engine engine = 7;
  string engine_region = 8;
  string segment_hash = 9;
  string translation_hash = 10;
  double qe_score = 11;
  double cost_usd = 12;
  int32 latency_ms = 13;
  google.protobuf.Timestamp ts = 14;
  string ed25519_signature = 15;
}

message EngineRoutedEvent {
  string event_id = 1;
  string tenant_id = 2;
  Pack pack = 3;
  Engine engine = 4;
  string engine_region = 5;
  string pack_region = 6;
  bool residency_compliant = 7;
  string cross_border_consent_ref = 8;
  string routing_decision_reason = 9;
  google.protobuf.Timestamp ts = 10;
  string ed25519_signature = 11;
}

message SovereignTenantLeakDetectedEvent {
  string event_id = 1;
  string inc_id = 2;
  string tenant_id = 3;
  Pack pack = 4;
  int32 violation_count = 5;
  Engine engine = 6;
  string engine_region = 7;
  google.protobuf.Timestamp window_start = 8;
  google.protobuf.Timestamp window_end = 9;
  google.protobuf.Timestamp regulator_notification_clock_started_at = 10;
  string ed25519_signature = 11;
}
