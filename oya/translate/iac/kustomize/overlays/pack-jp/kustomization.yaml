# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: translate
resources: [../../base]
commonAnnotations:
  oyatie/pack: "jp"
  oyatie/region: "ap-northeast-1"
  oyatie/legal-citations: |
    APPI Art. 24 (cross-border transfer restriction) + Art. 26 (breach notification).
    PPC guidance on AI personal-data processing 2024.
    EU AI Act Art. 50 (when content involves EU-end-user disclosures).
  oyatie/residency-invariant: "JP-region inference only; cross-border requires Art. 24 consent record"
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--component=translation-request-rest", "--pack=jp"]
    target:
      kind: Deployment
      name: translate-translation-request-rest
