asyncapi: 3.1.0
info:
  title: Healthcare Integration Events
  version: 1.0.0
  description: Tenant-scoped event contract for clinical interoperability, consent, break-glass, and regulated health-record provenance.
defaultContentType: application/json
channels:
  healthcare-integration.events.v1:
    address: healthcare-integration.events.v1
    messages:
      healthcareIntegrationActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/healthcare-integration.events.v1'
    messages:
      - $ref: '#/channels/healthcare-integration.events.v1/messages/healthcareIntegrationActionAccepted'
components:
  messages:
    ActionAccepted:
      name: HealthcareIntegrationActionAccepted
      title: Healthcare Integration action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
