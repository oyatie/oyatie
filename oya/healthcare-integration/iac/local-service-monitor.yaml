apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: healthcare-integration-local-ops
  labels:
    service: healthcare-integration
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: healthcare-integration
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_healthcare_integration_phi_delivery_latency_good_total
    - oya_healthcare_integration_audit_completeness_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-hl7-ingest-source-scope.cedar
