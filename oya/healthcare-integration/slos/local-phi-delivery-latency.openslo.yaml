apiVersion: openslo/v1
kind: SLO
metadata:
  name: healthcare-integration-phi-delivery-latency
  labels:
    service: healthcare-integration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: healthcare-integration
  description: PHI delivery completed inside clinical integration objective for HL7 ingestion, FHIR exchange, HIPAA access controls, PHI delivery, consent synchronization, and audit completeness operations.
  indicator:
    metadata:
      name: phi-delivery-latency
      labels:
        domain_object: ClinicalExchange
        operator_audience: HEALTHCARE_INTEGRATION_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_phi_delivery_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_phi_delivery_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: PHI delivery completed inside clinical integration objective
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
