apiVersion: openslo/v1
kind: SLO
metadata:
  name: healthcare-integration-consent-sync-freshness
  labels:
    service: healthcare-integration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: healthcare-integration
  description: Patient consent synchronization freshness for HL7 ingestion, FHIR exchange, HIPAA access controls, PHI delivery, consent synchronization, and audit completeness operations.
  indicator:
    metadata:
      name: consent-sync-freshness
      labels:
        domain_object: ClinicalExchange
        operator_audience: HEALTHCARE_INTEGRATION_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_consent_sync_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_consent_sync_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Patient consent synchronization freshness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
