# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "postStoreRest" "votingEngine" "moderationQueue" "kbArticleStore" "searchIndexRest" "threadTree" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: community-{{ . | kebabcase }}-pdb
  namespace: community
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: community
      app.kubernetes.io/component: {{ . | kebabcase }}
{{- end }}
