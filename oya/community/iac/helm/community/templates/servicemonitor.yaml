# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: community
  namespace: community
  labels:
    app.kubernetes.io/name: community
    release: prometheus  # discovered by Prometheus Operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: community
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: bc
      metricRelabelings:
        # Drop high-cardinality post_id + reply_id labels before Mimir to control series count
        - sourceLabels: [post_id]
          action: labeldrop
        - sourceLabels: [reply_id]
          action: labeldrop
