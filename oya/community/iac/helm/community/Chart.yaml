# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-community
description: |
  Helm chart for the community µservice — post-store / thread-tree /
  voting-engine / moderation-queue / kb-article-store / search-index BCs
  deployed as horizontally-scaled, tenant-sharded workloads.
  Per ADR-0131 flat layout + ADR-0139 SLO-gated promotion.
  Search backend per ADR-COMM-0004 (Meilisearch primary, Tantivy fallback).
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-community
    email: axis-community@oyatie.com
keywords:
  - community
  - announcements
  - q-and-a
  - knowledge-base
  - threaded-discussion
  - voting
  - moderation
  - search
dependencies:
  - name: meilisearch
    version: "0.10.0"  # per ADR-COMM-0004 (aligned with ADR-MSGR-0003)
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
