# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr  # overridden per-pack overlay
  cluster: community
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-community-app
  tag: "1.0.0"  # SHA-pinned at release-pointer advance per ADR-0139

# ============================================================================
# Per-BC deployment sizing (XS-tier baseline; HPA scales up)
# ============================================================================

postStoreRest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 4
    maxReplicas: 100
    targetCPUUtilizationPercentage: 65

postStoreWorker:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

threadTree:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

votingEngine:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 4
    maxReplicas: 80
    targetCPUUtilizationPercentage: 60

votingEngineWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 1500m, memory: 2Gi}

moderationQueue:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

moderationQueueWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

kbArticleStore:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 65

searchIndexRest:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 60

searchIndexWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

# ============================================================================
# Backing stores — references; provisioning lives in cloud-k8s + cloud-db
# ============================================================================

postgres:
  host: community-pg.${global.pack}.svc.cluster.local
  port: 5432
  database: community
  sslmode: require
  username: "${openbao:secret/community/postgres/username}"
  password: "${openbao:secret/community/postgres/password}"
  citus:
    enabled: true
    distributionColumn: tenant_id  # per IP-001
    coordinatorReplicas: 1
    workerReplicas: 4
  rls: enabled  # MANDATORY per IP-001
  walRetentionDays: 7

valkeyHotFeed:
  host: community-valkey-hot.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/community/valkey/hot-feed-auth}"

valkeyVoteBuffer:
  host: community-valkey-votes.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/community/valkey/vote-buffer-auth}"

s3KbAttachments:
  endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
  bucket: oya-community-kb-attachments-${global.pack}
  quarantineBucket: oya-community-attachment-quarantine-${global.pack}
  accessKeyId: "${openbao:secret/community/s3/access-key}"
  secretAccessKey: "${openbao:secret/community/s3/secret-key}"
  sseKms: tenant-DEK
  multipartChunkBytes: 8388608  # 8 MiB; per IP-008 resumable upload

# ============================================================================
# Search backend — per ADR-COMM-0004
# ============================================================================

meilisearch:
  enabled: true  # primary; aligned with ADR-MSGR-0003
  host: community-meilisearch.${global.pack}.svc.cluster.local
  port: 7700
  apiKey: "${openbao:secret/community/meilisearch/master-key}"
  indexNamingPattern: "tenant-{tenant_id}-community-{bc}"  # announcement|question|kb|discussion

tantivy:
  enabled: false  # fallback; flip to true for single-cell / starter-tier
  embeddedPath: /var/lib/community/tantivy
  perTenantSubdir: true

# ============================================================================
# Cross-µservice integrations
# ============================================================================

foundryGuardrails:
  endpoint: foundry-guardrails.foundry.svc.cluster.local:50051
  classifierConfig:
    spamThreshold: 0.85
    abuseThreshold: 0.80

auditChain:
  endpoint: audit-chain.audit-chain.svc.cluster.local:50051
  sealLatencyBudgetMs: 1000  # per PRD §"Audit + Compliance"

ontology:
  endpoint: ontology.ontology.svc.cluster.local:50051

tenancy:
  endpoint: tenancy.tenancy.svc.cluster.local:50051

messenger:
  # mention-resolution shared identity registry per PRD FR-12
  endpoint: messenger.messenger.svc.cluster.local:50051

# ============================================================================
# Cedar policy + Authz
# ============================================================================

cedar:
  policyConfigMap: community-cedar-policies
  defaultDeny: true
  fragments:
    - tenant-scope.cedar
    - ci-scope.cedar
    - auditor-scope.cedar
    - public-read.cedar
    # Hop-level fragments per ADR-COMM-0001 (added in IP-011 successor-IP)
    - moderation-hop-classifier.cedar
    - moderation-hop-moderator.cedar
    - moderation-hop-appeal.cedar
    # Q&A shape per ADR-COMM-0005 (added in IP-005 successor-IP)
    - qa-shape.cedar

# ============================================================================
# Rate limits — per PRD §"Security"
# ============================================================================

rateLimits:
  postCreate:
    perMember: "60/min"
    perTenant: "10000/min"
  voteCast:
    perMember: "600/min"
  kbArticlePublish:
    perMember: "5/min"

# ============================================================================
# Attachment malware scan
# ============================================================================

clamav:
  enabled: true  # per PRD §"Security" inline ClamAV scan

# ============================================================================
# Observability
# ============================================================================

observability:
  otelEndpoint: alloy.observability.svc.cluster.local:4317
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true
