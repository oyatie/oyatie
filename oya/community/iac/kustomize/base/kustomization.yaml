# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the community µservice.
# Per-pack overlays adjust: residency, retention overrides, secret-ref URIs,
# replica scaling tier, packs' regulatory posture (PIPA, HIPAA, GDPR).

namespace: community

resources:
  - namespace.yaml
  - openbao-secret-references.yaml

helmCharts:
  - name: oya-community
    valuesFile: ../../helm/community/values.yaml
    releaseName: community
    namespace: community

commonLabels:
  app.kubernetes.io/part-of: oya-community
  oyatie/microservice: community
