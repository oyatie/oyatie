openapi: 3.2.0
info:
  title: oya-community
  version: 0.1.0
  description: |
    Org-wide community surface. Announcements + Q&A + KB articles + threaded
    discussion + voting + moderation + search. Per ADR-0135 Connect-unbundle.
  contact:
    name: axis-community
servers:
  - url: https://community.{region}.oyatie.io/v1
    variables:
      region:
        default: us-east-1
        enum: [us-east-1, us-west-2, eu-central-1, eu-west-1, ap-northeast-1, ap-northeast-2, ap-southeast-1, ap-southeast-2, sa-east-1, me-central-1, me-south-1, ap-south-1]
security:
  - bearerAuth: []
paths:
  /spaces:
    get:
      summary: List spaces accessible to caller
      operationId: listSpaces
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceList' }
  /spaces/{space_id}/posts:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      summary: List posts in a space (feed)
      operationId: listPosts
      parameters:
        - in: query
          name: sort
          schema: { type: string, enum: [hot, new, top, accepted], default: hot }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostList' }
    post:
      summary: Create a post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '429':
          $ref: '#/components/responses/RateLimited'
  /posts/{post_id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      summary: Read a post
      operationId: readPost
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
    patch:
      summary: Edit a post (append revision)
      operationId: editPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostEdit' }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete a post (tombstone)
      operationId: deletePost
      responses:
        '204': { description: Deleted }
  /posts/{post_id}/replies:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      summary: List replies (threaded)
      operationId: listReplies
      parameters:
        - in: query
          name: depth
          schema: { type: integer, default: 3, maximum: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadNodeList' }
    post:
      summary: Post a reply
      operationId: postReply
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplyCreate' }
      responses:
        '201':
          description: Created
  /posts/{post_id}/vote:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      summary: Cast or change a vote
      operationId: castVote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteCast' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteTally' }
  /posts/{post_id}/accept-answer:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      summary: Mark a reply as accepted answer (Q&A)
      operationId: acceptAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply_id]
              properties:
                reply_id: { type: string }
      responses:
        '200': { description: OK }
  /posts/{post_id}/flag:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      summary: Raise a flag
      operationId: raiseFlag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlagCreate' }
      responses:
        '201': { description: Created }
  /moderation/queue:
    get:
      summary: List moderation queue items
      operationId: listModerationQueue
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [pending, escalated, resolved] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationQueueList' }
  /moderation/actions:
    post:
      summary: Apply a moderation action
      operationId: applyModerationAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationActionCreate' }
      responses:
        '201': { description: Created }
  /kb/articles:
    get:
      summary: List KB articles
      operationId: listKbArticles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbArticleList' }
    post:
      summary: Create a KB article (draft)
      operationId: createKbArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KbArticleCreate' }
      responses:
        '201': { description: Created }
  /kb/articles/{article_id}:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      summary: Read a KB article
      operationId: readKbArticle
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbArticle' }
    patch:
      summary: Edit a KB article (append revision)
      operationId: editKbArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KbArticleEdit' }
      responses:
        '200': { description: OK }
  /kb/articles/{article_id}/publish:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    post:
      summary: Publish a KB article
      operationId: publishKbArticle
      responses:
        '200': { description: Published }
  /kb/articles/{article_id}/attachments:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    post:
      summary: Upload an attachment (multipart resumable)
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AttachmentUpload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
  /search:
    get:
      summary: Cross-space search
      operationId: search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, maxLength: 500 }
        - in: query
          name: scope
          schema: { type: string, enum: [posts, kb, all], default: all }
        - in: query
          name: limit
          schema: { type: integer, default: 25, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /subscriptions:
    get:
      summary: List my subscriptions
      operationId: listSubscriptions
      responses:
        '200': { description: OK }
    post:
      summary: Subscribe to a space / thread / tag
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '201': { description: Created }
  /health:
    get:
      summary: Liveness probe
      responses:
        '200': {description: healthy}
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200': {description: ready}
        '503': {description: not ready}
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: community
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpaceId:
      name: space_id
      in: path
      required: true
      schema: { type: string }
    PostId:
      name: post_id
      in: path
      required: true
      schema: { type: string }
    ArticleId:
      name: article_id
      in: path
      required: true
      schema: { type: string }
  responses:
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
  schemas:
    SpaceList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Space' } }
        next_cursor: { type: string, nullable: true }
    Space:
      type: object
      required: [id, tenant_id, name, visibility]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        visibility: { type: string, enum: [private, public] }
        kind: { type: string, enum: [announcements, qa, discussion, kb] }
    PostList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        next_cursor: { type: string, nullable: true }
    Post:
      type: object
      required: [id, tenant_id, author_id, kind, body, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        space_id: { type: string }
        author_id: { type: string }
        kind: { type: string, enum: [announcement, question, answer, reply, discussion] }
        body: { type: string }
        revision: { type: integer }
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        moderation_state: { type: string, enum: [approved, pending, hidden, locked] }
        vote_score: { type: integer }
        accepted_answer_id: { type: string, nullable: true }
    PostCreate:
      type: object
      required: [kind, body]
      properties:
        kind: { type: string, enum: [announcement, question, discussion] }
        body: { type: string, maxLength: 100000 }
        tags: { type: array, items: { type: string }, maxItems: 10 }
        parent_post_id: { type: string, nullable: true }
        mentions: { type: array, items: { type: string }, maxItems: 50 }
        ontology_links: { type: array, items: { type: string }, maxItems: 20 }
    PostEdit:
      type: object
      required: [body]
      properties:
        body: { type: string }
        edit_reason: { type: string }
    ReplyCreate:
      type: object
      required: [body]
      properties:
        body: { type: string }
        parent_node_id: { type: string, nullable: true }
    ThreadNodeList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ThreadNode' } }
        next_cursor: { type: string, nullable: true }
    ThreadNode:
      type: object
      required: [id, parent_id, depth, body]
      properties:
        id: { type: string }
        parent_id: { type: string, nullable: true }
        depth: { type: integer }
        path: { type: string }
        body: { type: string }
        author_id: { type: string }
        vote_score: { type: integer }
    VoteCast:
      type: object
      required: [direction]
      properties:
        direction: { type: string, enum: [up, down, clear] }
        idempotency_key: { type: string }
    VoteTally:
      type: object
      properties:
        upvotes: { type: integer }
        downvotes: { type: integer }
        score: { type: integer }
        my_vote: { type: string, enum: [up, down, none] }
    FlagCreate:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [spam, abuse, illegal, impersonation, off-topic, other] }
        note: { type: string, maxLength: 1000 }
    ModerationQueueList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModerationQueueItem' } }
    ModerationQueueItem:
      type: object
      required: [id, tenant_id, target_id, target_type, flag_count, oldest_flag_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        target_id: { type: string }
        target_type: { type: string, enum: [post, reply, kb_article, attachment] }
        flag_count: { type: integer }
        flags: { type: array, items: { $ref: '#/components/schemas/FlagCreate' } }
        oldest_flag_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, escalated, resolved] }
    ModerationActionCreate:
      type: object
      required: [target_id, target_type, verb]
      properties:
        target_id: { type: string }
        target_type: { type: string, enum: [post, reply, kb_article, attachment, member] }
        verb: { type: string, enum: [hide, lock, pin, unpin, unhide, unlock, merge, move, delete, ban, quarantine, resolve_flag] }
        reason: { type: string }
        two_eyes_approver_id: { type: string, nullable: true }
    KbArticleList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KbArticle' } }
    KbArticle:
      type: object
      required: [id, tenant_id, title, body, state]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        space_id: { type: string }
        author_id: { type: string }
        title: { type: string }
        body: { type: string }
        revision: { type: integer }
        state: { type: string, enum: [draft, published, archived] }
        tags: { type: array, items: { type: string } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        ontology_links: { type: array, items: { type: string } }
    KbArticleCreate:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000000 }
        space_id: { type: string }
        tags: { type: array, items: { type: string } }
    KbArticleEdit:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        edit_reason: { type: string }
    AttachmentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        filename: { type: string }
        content_type: { type: string }
    Attachment:
      type: object
      required: [id, filename, sha256, size_bytes]
      properties:
        id: { type: string }
        filename: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        content_type: { type: string }
        s3_url: { type: string, nullable: true }
        scan_state: { type: string, enum: [pending, clean, infected, error] }
    SearchResults:
      type: object
      properties:
        hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        next_cursor: { type: string, nullable: true }
        total: { type: integer }
        took_ms: { type: integer }
    SearchHit:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [post, reply, kb_article] }
        title: { type: string, nullable: true }
        snippet: { type: string }
        score: { type: number }
    SubscriptionCreate:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: { type: string, enum: [space, thread, tag] }
        target_id: { type: string }
        delivery: { type: string, enum: [email, in-app, webhook], default: in-app }
