# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
image:
  registry: registry.oyatie.dev
  repository: workflow-studio/visual-canvas-rest
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 4

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

# Per-tenant editor session cap; per threat-model T-D-01
perTenantSessionCap: 50

# OIDC + Cedar enforcement settings
oidc:
  issuer: https://auth.oyatie.com
  audience: workflow-studio
  jwksCacheSeconds: 300

cedar:
  evaluatorEndpoint: "http://license-gate-cedar.workflow-studio.svc.cluster.local:8080"
  failClosed: true  # T-D-07 invariant: cedar crash → 503, never fail-open

# Service mesh
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

# HPA
hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 2

# NetworkPolicy egress allowlist (only allow cross-µservice SDK consumers)
networkPolicy:
  enabled: true
  egress:
    - to: workflow-engine.workflow-engine.svc.cluster.local
      ports: [8080, 9090]
    - to: ontology.ontology.svc.cluster.local
      ports: [8080]
    - to: foundry-providers.foundry-providers.svc.cluster.local
      ports: [8080]
    - to: tenancy.tenancy.svc.cluster.local
      ports: [8080]
    - to: audit-chain.audit-chain.svc.cluster.local
      ports: [8080]
    - to: studio-postgres-primary.workflow-studio.svc.cluster.local
      ports: [5432]
    - to: studio-valkey-primary.workflow-studio.svc.cluster.local
      ports: [6379]

# Secret references (OpenBao)
secrets:
  spiffeIdentityPath: "secret/workflow-studio/visual-canvas-rest/spiffe"
  postgresConnectionPath: "secret/workflow-studio/visual-canvas-rest/postgres"
  valkeyAuthPath: "secret/workflow-studio/visual-canvas-rest/valkey"
  ed25519SigningKeyPath: "secret/workflow-studio/audit-chain/signing-key"

# Prometheus monitoring
serviceMonitor:
  enabled: true
  interval: 30s
  endpoints:
    - port: metrics
      path: /metrics

# PrometheusRule for SLO alerts
prometheusRule:
  enabled: true
  ruleFiles:
    - /etc/workflow-studio/recording-rules/editor-rest.yaml
    - /etc/workflow-studio/alerts/editor-rest-burn-rate.yaml
