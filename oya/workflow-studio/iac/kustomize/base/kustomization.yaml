# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the workflow-studio cluster, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier, per-pack node-library
# signing-key references.
# Per ADR-0131 per-microservice flat layout + multi-region.md DR posture.

namespace: workflow-studio

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - cdn-edge-config.yaml

helmCharts:
  - name: oya-workflow-studio-studio-postgres
    valuesFile: ../../helm/studio-postgres/values.yaml
    releaseName: studio-postgres
    namespace: workflow-studio
  - name: oya-workflow-studio-studio-valkey
    valuesFile: ../../helm/studio-valkey/values.yaml
    releaseName: studio-valkey
    namespace: workflow-studio
  - name: oya-workflow-studio-visual-canvas-rest
    valuesFile: ../../helm/visual-canvas-rest/values.yaml
    releaseName: visual-canvas-rest
    namespace: workflow-studio
  - name: oya-workflow-studio-collab-crdt-worker
    valuesFile: ../../helm/collab-crdt-worker/values.yaml
    releaseName: collab-crdt-worker
    namespace: workflow-studio
  - name: oya-workflow-studio-node-library-registry-rest
    valuesFile: ../../helm/node-library-registry-rest/values.yaml
    releaseName: node-library-registry-rest
    namespace: workflow-studio
  - name: oya-workflow-studio-license-gate-cedar
    valuesFile: ../../helm/license-gate-cedar/values.yaml
    releaseName: license-gate-cedar
    namespace: workflow-studio
  - name: oya-workflow-studio-studio-cdn
    valuesFile: ../../helm/studio-cdn/values.yaml
    releaseName: studio-cdn
    namespace: workflow-studio
  - name: oya-workflow-studio-studio-waf
    valuesFile: ../../helm/studio-waf/values.yaml
    releaseName: studio-waf
    namespace: workflow-studio

commonLabels:
  app.kubernetes.io/part-of: oya-workflow-studio
  oyatie/microservice: workflow-studio
