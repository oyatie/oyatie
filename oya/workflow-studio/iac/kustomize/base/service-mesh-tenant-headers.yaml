# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: networking.istio.io/v1beta1
kind: EnvoyFilter
metadata:
  name: workflow-studio-tenant-header-stamp
  namespace: workflow-studio
spec:
  workloadSelector:
    labels:
      oyatie/microservice: workflow-studio
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              -- Server-side tenant_id stamping per threat-model T-S-01.
              -- Even if client supplies X-Scope-OrgID, override with OIDC-claim-derived value.
              function envoy_on_request(request_handle)
                local oidc_tenant = request_handle:headers():get("x-oidc-tenant-claim")
                if oidc_tenant and oidc_tenant ~= "" then
                  request_handle:headers():replace("x-scope-orgid", oidc_tenant)
                end
              end
