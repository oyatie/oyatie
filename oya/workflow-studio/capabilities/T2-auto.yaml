# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-studio:t2-auto:v1
name: t2-auto
namespace: workflow-studio
display_name: Studio T2 — Authoring autosave + CRDT merge + audit emission
description: |
  T2-tier capability: workflow-studio autonomously merges CRDT ops, persists editor
  session state to Postgres + Valkey, emits audit-chain seals on save events, and
  triggers per-seat license-gate evaluation at editor open. These operations write
  to state and emit billable + auditable events; they do not require human approval
  per call but are heavily constrained:
  - Cedar policy default-deny across all paths
  - Tenant-scope binding server-side
  - All emissions Ed25519-sealed
  - Tenant operator explicitly initiated upstream action (e.g., save click)

  T2 because state mutation is autonomous given the trigger, but the trigger itself
  is human-originated and policy-constrained.

owner_team: axis-workflow + ops-security
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0028, ADR-0110, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-0164]
related_specs: [/specs/microservices/workflow-studio.json]
related_artifacts:
  - microservices/workflow-studio/PRD.md FR-04 + FR-06 + FR-07 + FR-13 + FR-14
  - microservices/workflow-studio/threat-model.md §"T-T-01" + §"T-T-02" + §"T-T-05"
  - microservices/workflow-studio/policy/tenant-scope.cedar
  - microservices/workflow-studio/contracts/asyncapi.yaml
  - microservices/workflow-studio/runbooks/collab-conflict-resolution.md

autonomy_tier: T2
# T2 = autonomous mutation given a human-originated trigger; default-deny policy gate.

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: trigger_kind
    type: enum
    values:
      - editor_open_request          # → license-gate-cedar evaluation + session-row insert
      - workflow_save_request        # → engine-SDK submit + audit-chain seal
      - crdt_op_received             # → CRDT merge + fan-out
      - editor_close_request         # → session-row close + final-state seal
      - jurisdiction_switch_request  # → overlay-resolver invocation + audit emit
    required: true
  - name: payload
    type: object
    description: trigger-specific payload
    required: true

outputs:
  - name: action_taken
    type: enum
    values: [accepted, conflict_surfaced, license_denied, schema_rejected, crdt_merged]
  - name: audit_chain_seal
    type: string
    description: Ed25519 over the action
  - name: side_effects_summary
    type: object
    description: |
      For editor_open: {session_id, license_decision}.
      For save: {version_sha, audit_chain_seal, engine_spec_store_ack}.
      For crdt_op: {merged_seq, conflict_id?}.
      For close: {session_closed_at}.
      For jurisdiction switch: {overlay_version_sha, jurisdiction}.

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # Editor session state, spec drafts, collab CRDT state.
  - AUDIT
  # Every save + license-gate + close emits AUDIT.
  - PII_QUASI_IDENTIFIER
  # Spec drafts may carry quasi-identifying configuration.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-studio.t2.action

cost_profile:
  type: per-action
  estimated_cost_usd_per_call: 0.0005
  cost_drivers:
    - Postgres write (per save: 2-4ms)
    - Valkey read+write (per CRDT op: 0.5ms)
    - Engine SDK round-trip (per save: 50-100ms)
    - Audit-chain seal (Ed25519 sign + emit: 1-2ms)
    - Cedar policy evaluation (constant-time, < 1ms)

cedar_policy_fragments:
  - microservices/workflow-studio/policy/tenant-scope.cedar
  - microservices/workflow-studio/policy/ci-scope.cedar
  - microservices/workflow-studio/policy/auditor-scope.cedar

eval_set:
  reference_inputs_path: microservices/workflow-studio/capabilities/eval/t2-auto-reference.jsonl
  pass_threshold: 0.999
  eval_metric: |
    Composite invariants (must hold over 1000-case corpus):
    (a) round-trip byte-equality (load(emit(x)) == x) on saves.
    (b) Never silent loss on CRDT merge (conflict surfaced when commutativity violated).
    (c) License-gate default-deny: missing seat → deny + audit row.
    (d) Cross-tenant attempts always rejected (T-I-01 + T-I-04 invariants).
    (e) Every save Ed25519-sealed; chain reconstructable.
  cadence: per-release + nightly chaos test
  reference: ADR-0028 audit-chain + ADR-0110 ChangeSet state machine

invariants:
  - never_silent_loss: |
      A CRDT op that cannot be auto-merged MUST surface conflict UI; never silently
      discard. Asserted by property test test_no_silent_overwrite (AC-06).
  - round_trip_byte_equality: |
      Every save → load → save produces byte-identical workflow_spec.v1.json.
      Asserted by test_load_emit_byte_equal (AC-02).
  - default_deny: |
      Every Cedar policy evaluation that doesn't match a permit returns deny + audit
      row. Asserted by policy-fragment compilation tests.
  - tenant_isolation: |
      Every Postgres + Valkey write tenant_id-scoped (RLS + Citus partition).
      Asserted by oya-governance-citus-rls-enforced lane.
  - ed25519_seal_chain: |
      Every save event's seal references its predecessor; chain reconstructable.
      Asserted by audit-chain regression tests.

sunset:
  status: none
  notes: ""
