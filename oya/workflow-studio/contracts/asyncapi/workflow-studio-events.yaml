asyncapi: 3.1.0
info:
  title: oya-workflow-studio — editor session + collab + audit events
  version: 1.0.0
  summary: Workflow Studio editor session, save, collab, LLM-assist, license-gate, debugger frontend events
  description: |
    Cross-µservice events emitted and consumed by workflow-studio. Per ADR-0131 unbundle,
    Studio publishes events for: editor session lifecycle (open / close / resume), save
    (definition saved), collab (CRDT merged / conflict surfaced), license-gate (Cedar decision),
    LLM-assist (draft requested / accepted), jurisdiction switch, and debugger frontend lifecycle.

    Studio CONSUMES engine events for replay-debugger-frontend rendering and tenant-seat-limit
    updates from the tenancy µservice; consumes ontology type-descriptor updates for hot-reload.

    All events Ed25519-sealed per Bominal ADR-0028 audit-chain.

    Consumers:
    - audit-chain µservice (Ed25519 seal of every event)
    - observability µservice (SLI emission)
    - tenancy µservice (per-seat billing)
    - foundry-providers µservice (LLM-assist downstream audit)
  contact:
    name: axis-workflow

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.workflow-studio.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus consumed by audit-chain + observability + tenancy
  collab-websocket:
    host: collab.workflow-studio.svc.cluster.local
    protocol: ws
    description: Per-tenant per-definition WebSocket fan-out (CRDT ops + debugger frames)

channels:
  editor-session-opened:
    address: workflow-events/editor-session.opened
    messages:
      EditorSessionOpenedMessage:
        $ref: '#/components/messages/EditorSessionOpened'
    description: Tenant operator opened a new editor session; per-seat license decision included.

  editor-session-closed:
    address: workflow-events/editor-session.closed
    messages:
      EditorSessionClosedMessage:
        $ref: '#/components/messages/EditorSessionClosed'

  definition-saved:
    address: workflow-events/definition.saved
    messages:
      DefinitionSavedMessage:
        $ref: '#/components/messages/DefinitionSaved'
    description: Save-action emitted canonical workflow_spec.v1.json; engine spec-store acked.

  collab-merged:
    address: workflow-events/collab.merged
    messages:
      CollabMergedMessage:
        $ref: '#/components/messages/CollabMerged'
    description: CRDT ops auto-merged across concurrent editors.

  collab-conflict-surfaced:
    address: workflow-events/collab.conflict_surfaced
    messages:
      CollabConflictSurfacedMessage:
        $ref: '#/components/messages/CollabConflictSurfaced'
    description: CRDT could not auto-merge; explicit conflict UI shown (FR-07 + AC-06).

  license-gate-emitted:
    address: workflow-events/license.gate_emitted
    messages:
      LicenseGateEmittedMessage:
        $ref: '#/components/messages/LicenseGateEmitted'

  jurisdiction-switched:
    address: workflow-events/jurisdiction.switched
    messages:
      JurisdictionSwitchedMessage:
        $ref: '#/components/messages/JurisdictionSwitched'

  llm-assist-draft-requested:
    address: workflow-events/llm_assist.draft_requested
    messages:
      LlmAssistDraftRequestedMessage:
        $ref: '#/components/messages/LlmAssistDraftRequested'

  llm-assist-draft-accepted:
    address: workflow-events/llm_assist.draft_accepted
    messages:
      LlmAssistDraftAcceptedMessage:
        $ref: '#/components/messages/LlmAssistDraftAccepted'

  workflow-started:
    address: workflow-events/workflow.started
    messages:
      WorkflowStartedMessage:
        $ref: '#/components/messages/WorkflowStarted'
    description: Consumed from workflow-engine; renders in replay-debugger-frontend.

  step-started:
    address: workflow-events/step.started
    messages:
      StepStartedMessage:
        $ref: '#/components/messages/StepStarted'
    description: Consumed from workflow-engine.

  step-completed:
    address: workflow-events/step.completed
    messages:
      StepCompletedMessage:
        $ref: '#/components/messages/StepCompleted'
    description: Consumed from workflow-engine.

  tenant-seat-limit-updated:
    address: workflow-events/tenant.seat_limit_updated
    messages:
      TenantSeatLimitUpdatedMessage:
        $ref: '#/components/messages/TenantSeatLimitUpdated'
    description: Consumed from tenancy µservice; refreshes entitlement-claim cache.

  ontology-type-descriptor-updated:
    address: workflow-events/ontology.type_descriptor_updated
    messages:
      OntologyTypeDescriptorUpdatedMessage:
        $ref: '#/components/messages/OntologyTypeDescriptorUpdated'
    description: Consumed from ontology; node-library-registry hot-reloads relevant descriptors.

operations:
  emitEditorSessionOpened:
    action: send
    channel: {$ref: '#/channels/editor-session-opened'}
  emitEditorSessionClosed:
    action: send
    channel: {$ref: '#/channels/editor-session-closed'}
  emitDefinitionSaved:
    action: send
    channel: {$ref: '#/channels/definition-saved'}
  emitCollabMerged:
    action: send
    channel: {$ref: '#/channels/collab-merged'}
  emitCollabConflictSurfaced:
    action: send
    channel: {$ref: '#/channels/collab-conflict-surfaced'}
  emitLicenseGateEmitted:
    action: send
    channel: {$ref: '#/channels/license-gate-emitted'}
  emitJurisdictionSwitched:
    action: send
    channel: {$ref: '#/channels/jurisdiction-switched'}
  emitLlmAssistDraftRequested:
    action: send
    channel: {$ref: '#/channels/llm-assist-draft-requested'}
  emitLlmAssistDraftAccepted:
    action: send
    channel: {$ref: '#/channels/llm-assist-draft-accepted'}
  consumeWorkflowStarted:
    action: receive
    channel: {$ref: '#/channels/workflow-started'}
  consumeStepStarted:
    action: receive
    channel: {$ref: '#/channels/step-started'}
  consumeStepCompleted:
    action: receive
    channel: {$ref: '#/channels/step-completed'}
  consumeTenantSeatLimitUpdated:
    action: receive
    channel: {$ref: '#/channels/tenant-seat-limit-updated'}
  consumeOntologyTypeDescriptorUpdated:
    action: receive
    channel: {$ref: '#/channels/ontology-type-descriptor-updated'}

components:
  messages:
    EditorSessionOpened:
      name: EditorSessionOpened
      contentType: application/json
      summary: Tenant operator opened a new editor session
      payload: {$ref: '#/components/schemas/EditorSessionOpenedPayload'}
    EditorSessionClosed:
      name: EditorSessionClosed
      payload: {$ref: '#/components/schemas/EditorSessionClosedPayload'}
    DefinitionSaved:
      name: DefinitionSaved
      payload: {$ref: '#/components/schemas/DefinitionSavedPayload'}
    CollabMerged:
      name: CollabMerged
      payload: {$ref: '#/components/schemas/CollabMergedPayload'}
    CollabConflictSurfaced:
      name: CollabConflictSurfaced
      payload: {$ref: '#/components/schemas/CollabConflictSurfacedPayload'}
    LicenseGateEmitted:
      name: LicenseGateEmitted
      payload: {$ref: '#/components/schemas/LicenseGateEmittedPayload'}
    JurisdictionSwitched:
      name: JurisdictionSwitched
      payload: {$ref: '#/components/schemas/JurisdictionSwitchedPayload'}
    LlmAssistDraftRequested:
      name: LlmAssistDraftRequested
      payload: {$ref: '#/components/schemas/LlmAssistDraftRequestedPayload'}
    LlmAssistDraftAccepted:
      name: LlmAssistDraftAccepted
      payload: {$ref: '#/components/schemas/LlmAssistDraftAcceptedPayload'}
    WorkflowStarted:
      name: WorkflowStarted
      payload: {$ref: '#/components/schemas/WorkflowStartedPayload'}
    StepStarted:
      name: StepStarted
      payload: {$ref: '#/components/schemas/StepStartedPayload'}
    StepCompleted:
      name: StepCompleted
      payload: {$ref: '#/components/schemas/StepCompletedPayload'}
    TenantSeatLimitUpdated:
      name: TenantSeatLimitUpdated
      payload: {$ref: '#/components/schemas/TenantSeatLimitUpdatedPayload'}
    OntologyTypeDescriptorUpdated:
      name: OntologyTypeDescriptorUpdated
      payload: {$ref: '#/components/schemas/OntologyTypeDescriptorUpdatedPayload'}

  schemas:
    Common:
      type: object
      properties:
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        pack: {type: string, enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]}
        occurred_at: {type: string, format: date-time}
        event_id: {type: string, description: ULID}
        signature: {type: string, description: Ed25519}

    EditorSessionOpenedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [session_id, definition_id, user_oidc_sub, license_decision]
          properties:
            session_id: {type: string}
            definition_id: {type: string}
            user_oidc_sub: {type: string}
            license_decision: {type: string, enum: [allow, deny_no_seat, deny_revoked]}
            seat_count_used: {type: integer}
            seat_count_limit: {type: integer}

    EditorSessionClosedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [session_id]
          properties:
            session_id: {type: string}
            close_reason: {type: string, enum: [user_close, idle_timeout, ws_disconnect, license_revoked]}

    DefinitionSavedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [definition_id, version_sha, parent_version_sha, author_oidc_sub, audit_chain_seal]
          properties:
            definition_id: {type: string}
            version_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
            parent_version_sha: {type: string, nullable: true}
            author_oidc_sub: {type: string}
            audit_chain_seal: {type: string, description: Ed25519 over save event}
            target_environment: {type: string, enum: [draft, staging, production]}
            cedar_preview_acknowledged: {type: boolean}
            byte_equality_verified: {type: boolean, description: AC-02 round-trip invariant}

    CollabMergedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [definition_id, op_count, merged_seq]
          properties:
            definition_id: {type: string}
            op_count: {type: integer}
            merged_seq: {type: integer}
            participants: {type: array, items: {type: string}}

    CollabConflictSurfacedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [definition_id, conflict_id, branches]
          properties:
            definition_id: {type: string}
            conflict_id: {type: string}
            branches:
              type: array
              items:
                type: object
                properties:
                  branch_id: {type: string}
                  author_oidc_sub: {type: string}
                  ops_summary: {type: string}
            resolution: {type: string, enum: [pending, branch_a_accepted, branch_b_accepted, merged_manually]}

    LicenseGateEmittedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [principal_oidc_sub, decision, seat_count_used, seat_count_limit]
          properties:
            principal_oidc_sub: {type: string}
            decision: {type: string, enum: [allow, deny_no_seat, deny_revoked, deny_unknown_principal]}
            seat_count_used: {type: integer}
            seat_count_limit: {type: integer}
            cedar_policy_sha: {type: string}

    JurisdictionSwitchedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [definition_id, from_jurisdiction, to_jurisdiction]
          properties:
            definition_id: {type: string}
            from_jurisdiction: {type: string}
            to_jurisdiction: {type: string}
            overlay_version_sha: {type: string}

    LlmAssistDraftRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [draft_id, definition_id, prompt_hash, consent_acknowledged]
          properties:
            draft_id: {type: string}
            definition_id: {type: string}
            prompt_hash: {type: string, description: BLAKE3 of redacted prompt}
            pii_redacted_count: {type: integer}
            prompt_injection_detected: {type: boolean}
            consent_acknowledged: {type: boolean}
            provider_routed: {type: string, description: foundry-providers LLM choice}

    LlmAssistDraftAcceptedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [draft_id, definition_id, accepted_version_sha]
          properties:
            draft_id: {type: string}
            definition_id: {type: string}
            accepted_version_sha: {type: string}
            user_modifications_before_accept: {type: integer}

    WorkflowStartedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [run_id, definition_id, version_sha]
          properties:
            run_id: {type: string}
            definition_id: {type: string}
            version_sha: {type: string}

    StepStartedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [run_id, step_id, seq]
          properties:
            run_id: {type: string}
            step_id: {type: string}
            seq: {type: integer}

    StepCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [run_id, step_id, seq, outcome]
          properties:
            run_id: {type: string}
            step_id: {type: string}
            seq: {type: integer}
            outcome: {type: string, enum: [success, failure, retry, skipped]}

    TenantSeatLimitUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [seat_count_limit, effective_at]
          properties:
            seat_count_limit: {type: integer}
            effective_at: {type: string, format: date-time}

    OntologyTypeDescriptorUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [type_name, descriptor_version_sha]
          properties:
            type_name: {type: string}
            descriptor_version_sha: {type: string}
            change_kind: {type: string, enum: [created, modified, deprecated]}
