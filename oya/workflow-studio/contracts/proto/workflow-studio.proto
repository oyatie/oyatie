// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-workflow-studio — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi.yaml.
// Per ADR-0131 unbundle + ADR-0056 BNF v4.1 + ADR-0105 13-layer.
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluation server-side; same fragments as REST (policy/*.cedar).
// Tenancy: per-request metadata key "x-scope-orgid" = "tenant:<hashed-id>".

syntax = "proto3";

package oya.workflow_studio.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =========================================================================
// Service: WorkflowStudio
// =========================================================================
service WorkflowStudio {
  // Editor session lifecycle (license-gated)
  rpc OpenEditorSession(OpenEditorSessionRequest) returns (EditorSession);
  rpc GetEditorSession(GetEditorSessionRequest) returns (EditorSession);
  rpc CloseEditorSession(CloseEditorSessionRequest) returns (CloseEditorSessionResponse);
  rpc ListEditorSessions(ListEditorSessionsRequest) returns (ListEditorSessionsResponse);

  // Workflow definition load + save (round-trip byte-equality invariant)
  rpc LoadWorkflowDefinition(LoadWorkflowDefinitionRequest) returns (LoadWorkflowDefinitionResponse);
  rpc SaveWorkflowDefinition(SaveWorkflowDefinitionRequest) returns (SaveWorkflowDefinitionResponse);

  // Jurisdiction overlay
  rpc SwitchJurisdictionOverlay(SwitchJurisdictionOverlayRequest) returns (JurisdictionOverlayView);

  // Collab CRDT (stream both directions; per-tenant per-definition)
  rpc StreamCrdtOps(stream CrdtOp) returns (stream CrdtOpAck);

  // Node libraries
  rpc ListNodeLibraries(ListNodeLibrariesRequest) returns (ListNodeLibrariesResponse);
  rpc GetNodeLibrary(GetNodeLibraryRequest) returns (NodeLibraryDescriptor);

  // LLM-assist
  rpc LlmAssistDraft(LlmAssistDraftRequest) returns (LlmAssistDraftResponse);

  // Replay-debugger frontend
  rpc OpenDebuggerSession(OpenDebuggerSessionRequest) returns (DebuggerSession);
  rpc StreamDebuggerFrames(StreamDebuggerFramesRequest) returns (stream DebuggerFrame);
  rpc ResyncDebuggerSession(ResyncDebuggerSessionRequest) returns (DebuggerSession);
}

// =========================================================================
// Common types
// =========================================================================

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HC = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

enum Jurisdiction {
  JURISDICTION_UNSPECIFIED = 0;
  JURISDICTION_BASE = 1;
  JURISDICTION_KR = 2;
  JURISDICTION_EU = 3;
  JURISDICTION_US = 4;
  JURISDICTION_US_HC = 5;
  JURISDICTION_JP = 6;
  JURISDICTION_SG = 7;
  JURISDICTION_AU = 8;
  JURISDICTION_IN = 9;
  JURISDICTION_BR = 10;
  JURISDICTION_AE = 11;
  JURISDICTION_KSA = 12;
}

enum LicenseDecision {
  LICENSE_DECISION_UNSPECIFIED = 0;
  LICENSE_DECISION_ALLOW = 1;
  LICENSE_DECISION_DENY_NO_SEAT = 2;
  LICENSE_DECISION_DENY_REVOKED = 3;
  LICENSE_DECISION_DENY_UNKNOWN_PRINCIPAL = 4;
}

enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  DATA_CLASS_INTERNAL_ONLY = 1;
  DATA_CLASS_BEHAVIORAL_TENANT_PRODUCT = 2;
  DATA_CLASS_PII_QUASI_IDENTIFIER = 3;
  DATA_CLASS_PII_IDENTIFYING = 4;
  DATA_CLASS_SECRET = 5;
  DATA_CLASS_AUDIT = 6;
  DATA_CLASS_PHI = 7;
}

message DataClassAnnotation {
  string json_pointer = 1;
  DataClass data_class = 2;
}

message EditorSession {
  string session_id = 1;
  string tenant_id = 2;
  string definition_id = 3;
  string user_oidc_sub = 4;
  google.protobuf.Timestamp opened_at = 5;
  google.protobuf.Timestamp last_active = 6;
  string crdt_state_sha = 7;
  LicenseDecision license_decision = 8;
}

message WorkflowSpec {
  string spec_id = 1;
  string version_sha = 2;
  string parent_version_sha = 3;  // empty if root
  string author_oidc_sub = 4;
  google.protobuf.Struct body = 5;  // canonical workflow_spec.v1.json per Bominal ADR-0164
  string signature = 6;
  repeated DataClassAnnotation data_class_annotations = 7;
}

message JurisdictionOverlayView {
  Jurisdiction jurisdiction = 1;
  string overlay_version_sha = 2;
  google.protobuf.Struct resolved_view = 3;
  bool base_reachable = 4;
}

// =========================================================================
// Editor session
// =========================================================================

message OpenEditorSessionRequest {
  string definition_id = 1;
  string resume_from_offline_buffer_sha = 2;  // empty if not resuming
}

message GetEditorSessionRequest { string session_id = 1; }
message CloseEditorSessionRequest { string session_id = 1; }
message CloseEditorSessionResponse {}
message ListEditorSessionsRequest {}
message ListEditorSessionsResponse { repeated EditorSession sessions = 1; }

// =========================================================================
// Load / Save
// =========================================================================

message LoadWorkflowDefinitionRequest {
  string definition_id = 1;
  Jurisdiction jurisdiction = 2;
}
message LoadWorkflowDefinitionResponse {
  WorkflowSpec spec = 1;
  JurisdictionOverlayView jurisdiction_view = 2;
}

message SaveWorkflowDefinitionRequest {
  string definition_id = 1;
  WorkflowSpec spec = 2;
  bool cedar_preview_acknowledged = 3;
  string commit_message = 4;
}

message SaveWorkflowDefinitionResponse {
  string definition_id = 1;
  string version_sha = 2;
  google.protobuf.Timestamp accepted_at = 3;
  string audit_chain_seal = 4;
  bool engine_spec_store_ack = 5;
}

// =========================================================================
// Jurisdiction overlay
// =========================================================================

message SwitchJurisdictionOverlayRequest {
  string definition_id = 1;
  Jurisdiction jurisdiction = 2;
}

// =========================================================================
// Collab CRDT
// =========================================================================

message CrdtOp {
  string definition_id = 1;
  string author_oidc_sub = 2;
  uint64 sequence_num = 3;
  bytes op_payload = 4;  // CRDT-engine-specific (yrs / loro op format)
  string hmac = 5;       // HMAC over (session_token, sequence_num, op_payload)
  google.protobuf.Timestamp emitted_at = 6;
}

message CrdtOpAck {
  string definition_id = 1;
  uint64 sequence_num = 2;
  bool merged = 3;
  bool conflict = 4;     // if true, conflict UI was surfaced
  string conflict_id = 5;
}

// =========================================================================
// Node library
// =========================================================================

message ListNodeLibrariesRequest { Pack pack = 1; }
message ListNodeLibrariesResponse { repeated NodeLibraryDescriptor libraries = 1; }

message GetNodeLibraryRequest { string library_id = 1; }

message NodeLibraryDescriptor {
  string library_id = 1;
  Pack pack = 2;
  string version_sha = 3;
  string signature = 4;  // Ed25519 by pack-signing key
  repeated NodeDescriptor nodes = 5;
}

message NodeDescriptor {
  string node_type = 1;
  string display_name = 2;
  google.protobuf.Struct config_schema = 3;
  repeated DataClass data_class_hints = 4;
}

// =========================================================================
// LLM-assist
// =========================================================================

message LlmAssistDraftRequest {
  string definition_id = 1;
  string prose = 2;
  bool consent_acknowledged = 3;
  Jurisdiction target_jurisdiction = 4;
}

message LlmAssistDraftResponse {
  string draft_id = 1;
  WorkflowSpec candidate_spec = 2;
  bool schema_valid = 3;
  repeated ValidationError validation_errors = 4;
  bool prompt_injection_detected = 5;
  uint32 pii_redacted_count = 6;
}

message ValidationError {
  string json_pointer = 1;
  string message = 2;
}

// =========================================================================
// Replay-debugger frontend
// =========================================================================

message OpenDebuggerSessionRequest {
  string run_id = 1;
}

message DebuggerSession {
  string debugger_session_id = 1;
  string tenant_id = 2;
  string run_id = 3;
  google.protobuf.Timestamp opened_at = 4;
  uint64 last_frame_seq = 5;
  string stream_status = 6;  // active / ended / error
}

message StreamDebuggerFramesRequest {
  string debugger_session_id = 1;
  uint64 from_seq = 2;
}

message DebuggerFrame {
  string debugger_session_id = 1;
  uint64 seq = 2;
  string step_id = 3;
  string outcome = 4;  // success / failure / retry / skipped
  google.protobuf.Struct payload = 5;
  string frame_checksum = 6;  // BLAKE3 over payload; Studio + Engine must agree
  google.protobuf.Timestamp emitted_at = 7;
}

message ResyncDebuggerSessionRequest {
  string debugger_session_id = 1;
  uint64 from_seq = 2;
}
