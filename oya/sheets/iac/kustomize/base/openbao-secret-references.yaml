# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: openbao.io/v1
kind: SecretReference
metadata:
  name: sheets-secrets
  namespace: sheets
spec:
  references:
    - mountPath: secret/sheets/cell-grid-rest/spiffe
      injectAs: env
      envVar: SPIFFE_IDENTITY
    - mountPath: secret/sheets/cell-grid-rest/postgres
      injectAs: env
      envVar: POSTGRES_CONN
    - mountPath: secret/sheets/cell-grid-rest/valkey
      injectAs: env
      envVar: VALKEY_AUTH
    - mountPath: secret/sheets/audit-chain/signing-key
      injectAs: file
      filePath: /etc/sheets/audit-chain/ed25519.pem
    - mountPath: secret/sheets/oci-object-storage/creds
      injectAs: env
      envVar: OCI_OBJECT_STORAGE_CREDS
    - mountPath: secret/sheets/foundry-runtime/token
      injectAs: env
      envVar: FOUNDRY_RUNTIME_TOKEN
    - mountPath: secret/sheets/connected-sheets-source-credentials/pack-${PACK}/{tenant_id}/{source_name}
      injectAs: env
      envVar: CONNECTED_SOURCE_CRED_REF
      description: 'Per-(tenant, source) external-DB credentials; referenced from connected-sheets worker only'
  rotation:
    spiffeIdentity: { intervalDays: 1 }
    auditChainSigningKey: { intervalDays: 90 }
    ociObjectStorageCreds: { intervalDays: 30 }
    foundryRuntimeToken: { intervalDays: 30 }
    connectedSourceCredentials: { intervalDays: 90 }
