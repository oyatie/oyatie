# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-sheets-chart-render-latency
  displayName: Sheets — Chart render latency
  labels:
    microservice: sheets
    bounded_context: charts
    tier: external-facing
    plane: data
spec:
  service: oya-sheets-charts-adapter-leptos-wasm
  description: |
    Chart render latency SLI (custom Leptos canvas renderer). GA target: 95% under 200ms
    (per PRD AC-13).
  indicator:
    metadata:
      name: chart-render-latency-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_chart_render_seconds_bucket{le="0.2"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_chart_render_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of chart renders under 200ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
