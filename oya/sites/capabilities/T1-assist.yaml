# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — sites µservice
#
# Autonomy Tier 1: "assist with bounded reversibility". The system takes an action,
# but it is bounded, reversible within a short window, and attributed to the agent +
# user clearly. User can cancel within the reversibility window. After the window
# closes, the action stands.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 transparency + Art. 14 human oversight.

doc_class: AutonomyTierCatalog
microservice: sites
tier: T1
owner_team: axis-sites + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-sites-auto-image-optimize
    name: "Auto-optimise images on upload (WebP/AVIF/JPEG-XL)"
    description: |
      When an editor uploads an image, the system automatically generates
      WebP/AVIF/JPEG-XL responsive variants per ADR-SITES-0007. Image-pipeline
      runs in background; user receives a notification when complete. User
      can revert to the original JPEG/PNG within the 30-second reversibility
      window. After the window, the variants are bound to the image.
    surface: editor-ui (background; no explicit user action) + notification
    triggers:
      - editor uploads an image
      - editor changes the source image of an existing block
    consent_basis:
      personal_context: explicit-on-invocation (uploading implies consent)
      professional_context: explicit-on-invocation + tenant-policy-admission
    data_class_processed: [PUBLIC_BY_TENANT_CHOICE]
    data_class_emitted: PUBLIC_BY_TENANT_CHOICE (responsive variants)
    reversibility:
      window_seconds: 30
      action_on_cancel: revert to original; delete variants
      cancel_surface: in-product banner
    model:
      primary: rule-based (libvips pipeline; no LLM)
      fallback: emit JPEG-only fallback
      private_inference: n/a
    latency_budget_p99_ms: 1500
    audit_event: SitesImageOptimized (Ed25519-sealed; payload — image hash + variant hashes + reversibility window expiry)
    fallback_on_model_failure: JPEG-only fallback
    risk_classification: minimal-risk (deterministic logic)
    user_label: "Image optimised — undo within 30s"

  - id: T1-sites-auto-redirect-on-route-change
    name: "Auto-create 301 redirect on route change"
    description: |
      When an editor changes a page's route, the system automatically creates a
      301 redirect from the old route. User can cancel within 30s.
    surface: editor-ui (notification banner) + Workflow event
    triggers:
      - editor changes a page's `route` field
      - editor confirmed they want auto-redirect (per-user preference)
    consent_basis: explicit-on-opt-in
    data_class_processed: [INTERNAL_ONLY]
    data_class_emitted: INTERNAL_ONLY
    reversibility:
      window_seconds: 30
      action_on_cancel: revert; delete redirect; restore old route as canonical
      cancel_surface: in-product banner
    model: {primary: rule-based}
    latency_budget_p99_ms: 500
    audit_event: SitesAutoRedirectCreated
    risk_classification: minimal-risk
    user_label: "301 redirect created — undo within 30s"

  - id: T1-sites-auto-renew-cert
    name: "Auto-renew TLS cert when within 30 days of expiry"
    description: |
      Per ADR-SITES-0004, ACME cert renewal is automatic at 30-day-pre-expiry.
      The user is notified on success; on failure, runbook
      `acme-cert-renewal-failure.md` is invoked. No reversibility window —
      cert renewal is intrinsically irreversible at the ACME-server side,
      but the prior cert remains valid until issuance.
    surface: background worker (no user UI)
    triggers:
      - cert expiry < 30 days (daily check via CronJob)
    consent_basis: tenant-policy-admission at domain-bind time
    data_class_processed: [SECRET_TLS_KEY, INTERNAL_ONLY]
    data_class_emitted: INTERNAL_ONLY (cert serial, expiry)
    reversibility:
      window_seconds: n/a (intrinsically irreversible)
      action_on_cancel: pre-empt by triggering manual revoke via runbook
      cancel_surface: ops dashboard
    model: {primary: rule-based; ACME RFC 8555 DNS-01}
    latency_budget_p99_ms: 30000  # 30s
    audit_event: SitesCertRenewed (Ed25519-sealed; payload — domain + cert serial + prior serial)
    fallback_on_model_failure: refer runbook
    risk_classification: minimal-risk
    user_label: "Cert auto-renewed — review domain status if issues"

  - id: T1-sites-auto-cdn-purge-on-publish
    name: "Auto-purge CDN cache on publish"
    description: |
      When a page is published, the system automatically issues a signed CDN
      purge for that page's URL(s). The user does not explicitly trigger purge.
      Per ADR-SITES-0003 cache strategy. The "reversibility" here is that the
      prior version's cache will still be served at edges that didn't yet
      receive purge — a property, not a bug.
    surface: background (post-publish hook)
    triggers:
      - PagePublished event
    consent_basis: implicit (publish implies user wants new version visible)
    data_class_processed: [INTERNAL_ONLY]
    data_class_emitted: INTERNAL_ONLY
    reversibility:
      window_seconds: n/a
      action_on_cancel: revert page → triggers new publish + new purge
      cancel_surface: page-revert UI
    model: {primary: rule-based}
    latency_budget_p99_ms: 2000
    audit_event: SitesCdnPurged
    risk_classification: minimal-risk
    user_label: "Published; CDN refreshed"

  - id: T1-sites-auto-sitemap-update
    name: "Auto-regenerate sitemap.xml on publish/unpublish"
    description: |
      When any page is published or unpublished, sitemap.xml is auto-regenerated
      and CDN-purged. User does not trigger.
    surface: background worker
    triggers: [PagePublished, PageUnpublished, PageDeleted, SiteUnpublished]
    consent_basis: implicit (publication change implies sitemap should reflect)
    data_class_processed: [PUBLIC_BY_TENANT_CHOICE]
    data_class_emitted: PUBLIC_BY_TENANT_CHOICE
    reversibility: {window_seconds: n/a}
    model: {primary: rule-based}
    latency_budget_p99_ms: 3000
    audit_event: SitesSitemapEmitted
    risk_classification: minimal-risk
    user_label: "Sitemap updated"

  - id: T1-sites-auto-wcag-report
    name: "Auto-compute WCAG 2.2 AA correctness report on publish"
    description: |
      At publish time, the system computes a WCAG 2.2 AA correctness report
      (alt-text presence, contrast ratio, heading-order, landmarks). The
      publish is refused if < 100% conformance unless tenant has explicitly
      acknowledged the override (with audit-chain seal). For pack-us-healthcare
      patient portals, override is REFUSED.
    surface: publish-pipeline (background)
    triggers: [PagePublishRequested]
    consent_basis: implicit (publishing implies wanting conformance)
    data_class_processed: [PUBLIC_BY_TENANT_CHOICE]
    data_class_emitted: PUBLIC_BY_TENANT_CHOICE (report)
    reversibility: {window_seconds: n/a (refusal is the safe state)}
    model: {primary: rule-based + accessibility checker}
    latency_budget_p99_ms: 5000
    audit_event: SitesWcagReportComputed (Ed25519-sealed)
    risk_classification: minimal-risk
    user_label: "Accessibility report computed"
    pack_us_healthcare_override: REFUSED

verification:
  - All T1 actions emit a Cedar-evaluable principal/action/resource triple BEFORE acting.
  - All T1 actions emit an audit-chain event (Ed25519-sealed) on action-initiated AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T1 actions are labelled per EU AI Act Art. 50 + offer the Art. 14 human-oversight cancel-within-window control (where applicable).
  - All T1 actions respect tenant-isolation: tenant-A actions NEVER touch tenant-B data.
  - All T1 actions are tenant-tenant_class-gated: Cedar policy admits T1 only for tenant_class values ≥ pro for LLM-backed actions; rule-based actions admit at all tiers.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-SITES-0003 — CDN substrate + cache strategy.
  - ADR-SITES-0004 — ACME + custom domain.
  - ADR-SITES-0007 — image + asset pipeline.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14, Art. 50.
  - WCAG 2.2 AA.
  - microservices/sites/PRD.md §FR-07, §FR-16, §FR-21, §FR-26.
  - microservices/sites/runbooks/acme-cert-renewal-failure.md.
  - microservices/sites/runbooks/cdn-cache-purge-cascade.md.
