# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-sites-domain-binding-adapter-acme
role: adapter
context: sites
bc: domain-binding
plane: control
slo: preview-control-plane
contracts_consumed: [oya-sites-domain-binding-kernel.port.AcmeClient]
contracts_exposed: []
backend: acme-letsencrypt
backend_lts_pin: "ACME RFC 8555 + Let's Encrypt 2026"
backend_residency: per-pack-account-pool
regulatory_packs_consumed: [oya-pack-kr, oya-pack-eu, oya-pack-us, oya-pack-us-healthcare, oya-pack-jp, oya-pack-sg, oya-pack-au, oya-pack-in, oya-pack-br, oya-pack-ae, oya-pack-ksa]
lifecycle: {state: incubating, preview_since: 2026-05-17}
traceability:
  source_adrs: [ADR-0105, ADR-SITES-0004]
data_classes_owned: [SECRET_TLS_KEY, INTERNAL_ONLY]
notes: |
  RFC 8555 ACME client; DNS-01 preferred (wildcard support); HTTP-01
  fallback for tenant-controlled root. Multi-account pool to manage
  Let's Encrypt 50-cert/wk rate limit. Per ADR-SITES-0004.
