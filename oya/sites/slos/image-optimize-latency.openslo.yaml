# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-image-optimize-latency
  displayName: "sites: image-optimize latency p95 (single image)"
  labels:
    microservice: sites
    bc: cdn-delivery
    sli_class: latency
    tier: editor-experience
    owner_team: axis-sites
    pack_scope: all
    data_classes: PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    Image-optimize p95 duration SLO. libvips WebP/AVIF/JPEG-XL pipeline is
    "good" when it produces all responsive variants for a single source image
    in ≤ 1s. Per PRD-sites §"Performance" target + ADR-SITES-0007.
  service: sites
  indicator:
    metadata: {name: sites-image-optimize-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_image_optimize_duration_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.95
      op: lte
      value: 1.0
      displayName: "30d rolling p95 ≤ 1s"
  alertPolicies:
    - alertPolicyRef: sites-image-optimize-fast-burn-1h-14x
    - alertPolicyRef: sites-image-optimize-slow-burn-6h-6x
