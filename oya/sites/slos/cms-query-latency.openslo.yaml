# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-cms-query-latency
  displayName: "sites: CMS-collection query latency p95"
  labels:
    microservice: sites
    bc: cms-collection
    sli_class: latency
    tier: hero-product
    owner_team: axis-sites
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT,PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    CMS-collection query p95 latency SLO. A query is "good" when it returns
    in ≤ 150ms for collections ≤ 1000 entries. PRD-sites §"Performance" target.
  service: sites
  indicator:
    metadata: {name: sites-cms-query-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_cms_query_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.15
      displayName: "30d rolling p95 ≤ 150ms"
  alertPolicies:
    - alertPolicyRef: sites-cms-query-fast-burn-1h-14x
    - alertPolicyRef: sites-cms-query-slow-burn-6h-6x
