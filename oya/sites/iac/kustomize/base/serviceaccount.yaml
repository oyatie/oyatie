# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-sites
  namespace: sites
  labels:
    microservice: sites
  annotations:
    # OpenBao Kubernetes auth binding for secret reference resolution
    openbao.oyatie.dev/role: sites
