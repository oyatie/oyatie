# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# Kustomize overlay — pack-us (CCPA / CPRA + sectoral).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sites

resources:
  - ../../base

commonLabels:
  oyatie.dev/pack: us
  oyatie.dev/data-residency: us-ashburn-1

configMapGenerator:
  - name: oya-sites-pack-config
    namespace: sites
    literals:
      - PACK_REGION=us
      - DATA_RESIDENCY=us-ashburn-1
      - DEFAULT_LOCALE=en-US
      - DEFAULT_TIMEZONE=America/New_York
      - CCPA_OPT_OUT=enabled

patches:
  - target: {kind: Deployment, name: oya-sites-page-app}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: us
