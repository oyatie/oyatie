{{/*
Per-BC Deployment template — one Deployment per BC.
Per ADR-0131 per-µservice flat layout + per-BC sizing in values.yaml.
*/}}
{{- range $bc, $cfg := dict "site" $.Values.site "page" $.Values.page "block" $.Values.block "theme" $.Values.theme "navigation" $.Values.navigation "url-routing" $.Values.urlRouting "domain-binding" $.Values.domainBinding "seo" $.Values.seo "cms-collection" $.Values.cmsCollection "search" $.Values.search "cdn-delivery" $.Values.cdnDelivery }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-sites-{{ $bc }}-app
  namespace: sites
  labels:
    microservice: sites
    bc: {{ $bc }}
    app.kubernetes.io/name: oya-sites-{{ $bc }}-app
    app.kubernetes.io/version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      microservice: sites
      bc: {{ $bc }}
  template:
    metadata:
      labels:
        microservice: sites
        bc: {{ $bc }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.global.observability.metricsPort }}"
    spec:
      serviceAccountName: oya-sites
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app,     containerPort: {{ $cfg.port }}, protocol: TCP}
            - {name: metrics, containerPort: {{ $.Values.global.observability.metricsPort }}, protocol: TCP}
          env:
            - {name: OYA_MICROSERVICE,   value: sites}
            - {name: OYA_BC,             value: {{ $bc }}}
            - {name: OYA_PACK_REGION,    value: {{ $.Values.global.packRegion }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ $.Values.global.observability.tracingEndpoint }}"}
            - {name: RUST_LOG, value: info}
          resources:
{{ toYaml $cfg.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
{{- end }}
