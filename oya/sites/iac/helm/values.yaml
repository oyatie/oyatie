# Default values for oya-sites Helm chart.
# Per ADR-0131 (per-µservice flat layout) + ADR-0133 (LTS-pinned versions) +
# ADR-SITES-0001 (Loro CRDT 1.x) + ADR-SITES-0003 (CDN substrate) +
# ADR-SITES-0004 (ACME + custom domain) + ADR-SITES-0005 (CMS-collection +
# Meilisearch) + ADR-SITES-0007 (libvips image pipeline).
#
# Pack-specific overrides live in `iac/kustomize/overlays/pack-<region>/`.
# All secrets via `${openbao:secret/sites/<path>}` SecretReferences (per
# CLAUDE.md user directive — no raw secrets in values.yaml).

global:
  microservice: sites
  ltsImageRegistry: registry.oyatie.dev
  tenantId: "${TENANT_ID}"
  packRegion: kr
  observability:
    metricsPort: 9090
    tracingEndpoint: otel-collector.observability.svc.cluster.local:4317

# ---- Per-BC workloads ----------------------------------------------------

site:
  replicaCount: 3
  image: {repository: registry.oyatie.dev/oya-sites-site-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 1Gi}
  port: 9101
  encryption:
    tenantDekRef: "${openbao:secret/sites/{tenant}/dek}"

page:
  replicaCount: 5
  image: {repository: registry.oyatie.dev/oya-sites-page-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}
  port: 9102
  aiPageBuild:
    enabled: true
    foundryRuntimeEndpoint: oya-intelligence-runtime.foundry-runtime.svc.cluster.local:9000
    perTenantDailyCap: 500

block:
  replicaCount: 3
  image: {repository: registry.oyatie.dev/oya-sites-block-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 1,    memory: 1Gi}
  port: 9103
  loroCrdt:
    relayEndpoint: oya-loro-relay.shared-crdt.svc.cluster.local:7777
    perSessionOpRateLimit: 100  # per second

theme:
  replicaCount: 2
  image: {repository: registry.oyatie.dev/oya-sites-theme-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}
  port: 9104

navigation:
  replicaCount: 2
  image: {repository: registry.oyatie.dev/oya-sites-navigation-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}
  port: 9105

urlRouting:
  replicaCount: 5
  image: {repository: registry.oyatie.dev/oya-sites-url-routing-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9106

domainBinding:
  replicaCount: 3
  image: {repository: registry.oyatie.dev/oya-sites-domain-binding-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  port: 9107
  acme:
    directoryUrl: "https://acme-v02.api.letsencrypt.org/directory"
    accountKeyRef: "${openbao:secret/sites/{pack}/acme-account-key}"
    accountPoolSize: 3
    preferChallenge: dns01
    perTenantCertExpiryWarningDays: 7

seo:
  replicaCount: 2
  image: {repository: registry.oyatie.dev/oya-sites-seo-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 512Mi}
  port: 9108
  schemaOrgContextPin: "https://schema.org/version/30.0/schemaorg-current-https.jsonld"

cmsCollection:
  replicaCount: 5
  image: {repository: registry.oyatie.dev/oya-sites-cms-collection-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9109

search:
  replicaCount: 5
  image: {repository: registry.oyatie.dev/oya-sites-search-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 1Gi}
  port: 9110
  meilisearch:
    endpoint: oya-sites-meilisearch:7700
    apiKeyRef: "${openbao:secret/sites/{tenant}/meilisearch-api-key}"

cdnDelivery:
  replicaCount: 5
  image: {repository: registry.oyatie.dev/oya-sites-cdn-delivery-app, tag: "1.0.0"}
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits:   {cpu: 2,    memory: 2Gi}
  port: 9111
  s3:
    endpoint: "https://objectstorage.{pack}.oci.oraclecloud.com"
    bucketRef: "${openbao:secret/sites/{tenant}/s3-bucket}"
    iamRoleRef: "${openbao:secret/sites/{tenant}/s3-iam-role}"
  cloudflare:
    apiTokenRef: "${openbao:secret/sites/{pack}/cloudflare-api-token}"
    zoneIdRef: "${openbao:secret/sites/{tenant}/cloudflare-zone-id}"
  libvips:
    maxSourceSizeBytes: 104857600  # 100 MB per ADR-SITES-0007
    maxSourcePixels: 50000000      # 50 MP
    emitWebP: true
    emitAvif: true
    emitJpegXl: true
    perJobMemoryMb: 512
  pandoc:
    image: registry.oyatie.dev/pandoc
    tag: "3.x"

# ---- Cron workers --------------------------------------------------------

acmeRenewalWorker:
  enabled: true
  schedule: "0 */6 * * *"   # every 6h check expiry; renew if < 30d
  image: {repository: registry.oyatie.dev/oya-sites-domain-binding-worker, tag: "1.0.0"}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 256Mi}

sitemapRegenWorker:
  enabled: true
  schedule: "0 2 * * *"     # daily 02:00 UTC; per-tenant
  image: {repository: registry.oyatie.dev/oya-sites-seo-worker, tag: "1.0.0"}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 500m, memory: 256Mi}

searchReindexWorker:
  enabled: true
  schedule: "*/15 * * * *"  # every 15 min; rebuild stale tenant indexes
  image: {repository: registry.oyatie.dev/oya-sites-search-worker, tag: "1.0.0"}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits:   {cpu: 1,    memory: 1Gi}

# ---- Underlying state stores --------------------------------------------

postgres:
  enabled: true
  image: {repository: registry.oyatie.dev/cloudnative-pg, tag: "16.4.0"}
  rls:
    perTenant: true
  ha:
    syncReplicas: 1
    streamingReplicas: 2
  storage: {size: 200Gi}
  backup:
    s3Ref: "${openbao:secret/sites/{pack}/backup-s3}"

valkey:
  enabled: true
  image: {repository: registry.oyatie.dev/valkey-cluster, tag: "7.2.0"}
  clusterMode: true
  evictionPolicy: allkeys-lru
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 1,    memory: 1Gi}

meilisearch:
  enabled: true
  image: {repository: registry.oyatie.dev/meilisearch, tag: "0.10.0"}
  perTenantIndex: true
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: 2,    memory: 4Gi}

certManager:
  enabled: true
  image: {repository: registry.oyatie.dev/cert-manager, tag: "1.16.0"}

# ---- HPA + PDB + NetworkPolicy + ServiceMonitor + PrometheusRule -------

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: "50%"

networkPolicy:
  enabled: true
  meshOnly: true

serviceMonitor:
  enabled: true
  interval: 30s

prometheusRule:
  enabled: true
