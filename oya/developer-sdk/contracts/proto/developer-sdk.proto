// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// Canonical-base: specs/contracts/proto3-canonical-envelope.proto (SWEEP-I Slice 3 per ADR-0064)
syntax = "proto3";

package oya.developer_sdk.v1;

option go_package = "oyatie.dev/api/developer_sdk/v1";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Developer / KYC
// ============================================================================

message Developer {
  string id = 1;
  string email = 2;
  string legal_name = 3;
  string company_name = 4;
  string country = 5;
  string regulatory_pack = 6;
  KycState kyc_state = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum KycState {
  KYC_STATE_UNSPECIFIED = 0;
  KYC_STATE_PENDING = 1;
  KYC_STATE_ID_COLLECTING = 2;
  KYC_STATE_LIVENESS_CHECKING = 3;
  KYC_STATE_SANCTIONS_SCREENING = 4;
  KYC_STATE_APPROVED = 5;
  KYC_STATE_REJECTED = 6;
}

// ============================================================================
// Signing keys
// ============================================================================

message SigningKey {
  string id = 1;
  string developer_id = 2;
  string public_key = 3;
  string algorithm = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  SigningKeyStatus status = 7;
}

enum SigningKeyStatus {
  SIGNING_KEY_STATUS_UNSPECIFIED = 0;
  SIGNING_KEY_STATUS_ACTIVE = 1;
  SIGNING_KEY_STATUS_ROTATED = 2;
  SIGNING_KEY_STATUS_REVOKED = 3;
}

// ============================================================================
// Sandbox
// ============================================================================

message SandboxTenant {
  string id = 1;
  string developer_id = 2;
  SandboxStatus status = 3;
  google.protobuf.Timestamp provisioned_at = 4;
  string endpoint = 5;
}

enum SandboxStatus {
  SANDBOX_STATUS_UNSPECIFIED = 0;
  SANDBOX_STATUS_PROVISIONING = 1;
  SANDBOX_STATUS_READY = 2;
  SANDBOX_STATUS_RESETTING = 3;
}

// ============================================================================
// Payout / Tax
// ============================================================================

message PayoutLedgerEntry {
  string id = 1;
  string developer_id = 2;
  string amount_minor_units = 3;
  string currency = 4;
  PayoutEntryKind kind = 5;
  PayoutRail rail = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

enum PayoutEntryKind {
  PAYOUT_ENTRY_KIND_UNSPECIFIED = 0;
  PAYOUT_ENTRY_KIND_REVENUE_SHARE = 1;
  PAYOUT_ENTRY_KIND_PAYOUT_SETTLED = 2;
  PAYOUT_ENTRY_KIND_PAYOUT_DEFERRED = 3;
  PAYOUT_ENTRY_KIND_PAYOUT_FAILED = 4;
  PAYOUT_ENTRY_KIND_ADJUSTMENT = 5;
}

enum PayoutRail {
  PAYOUT_RAIL_UNSPECIFIED = 0;
  PAYOUT_RAIL_ACH = 1;
  PAYOUT_RAIL_SEPA = 2;
  PAYOUT_RAIL_KFTC = 3;
  PAYOUT_RAIL_FEDWIRE = 4;
}

message TaxForm {
  string id = 1;
  string developer_id = 2;
  TaxFormKind kind = 3;
  int32 tax_year = 4;
  string pdf_storage_key = 5;
  google.protobuf.Timestamp emitted_at = 6;
}

enum TaxFormKind {
  TAX_FORM_KIND_UNSPECIFIED = 0;
  TAX_FORM_KIND_1099_MISC_US = 1;
  TAX_FORM_KIND_VAT_MOSS_EU = 2;
  TAX_FORM_KIND_VAT_KR = 3;
}

// ============================================================================
// Service
// ============================================================================

service DeveloperSdk {
  rpc SignupDeveloper(SignupRequest) returns (Developer);
  rpc IssueSigningKey(IssueSigningKeyRequest) returns (SigningKey);
  rpc RevokeSigningKey(RevokeSigningKeyRequest) returns (RevokeSigningKeyResponse);
  rpc ProvisionSandbox(ProvisionSandboxRequest) returns (SandboxTenant);
  rpc ResetSandbox(ResetSandboxRequest) returns (ResetSandboxResponse);
  rpc StreamPayoutLedger(StreamPayoutLedgerRequest) returns (stream PayoutLedgerEntry);
}

message SignupRequest {
  string email = 1;
  string legal_name = 2;
  string country = 3;
  string company_name = 4;
}

message IssueSigningKeyRequest { string developer_id = 1; }
message RevokeSigningKeyRequest { string developer_id = 1; string key_id = 2; }
message RevokeSigningKeyResponse {}
message ProvisionSandboxRequest { string developer_id = 1; }
message ResetSandboxRequest { string developer_id = 1; }
message ResetSandboxResponse {}
message StreamPayoutLedgerRequest { string developer_id = 1; }
