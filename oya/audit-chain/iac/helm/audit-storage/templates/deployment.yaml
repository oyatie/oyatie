# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-J Slice 2 per ADR-0064)
{{/*
Per-audit-chain CIS-compliant Deployment template (Sweep-E in-pass fix).

Substrate µservices share this baseline: non-root, read-only rootfs,
all capabilities dropped, no privilege escalation, seccompProfile RuntimeDefault,
explicit resource requests/limits, OpenBao SecretReference URIs (no literal secrets).

Per ADR-0131 per-µservice flat layout + ADR-0123 secret-reference URI policy.
*/}}
{{- $cfg := $.Values.auditstorage | default $.Values -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-audit-chain-audit-storage
  namespace: audit-chain
  labels:
    microservice: audit-chain
    app.kubernetes.io/name: oya-audit-chain-audit-storage
    app.kubernetes.io/version: {{ $.Chart.AppVersion | default "0.1.0" }}
spec:
  replicas: {{ $cfg.replicaCount | default 2 }}
  selector:
    matchLabels:
      microservice: audit-chain
      app.kubernetes.io/name: oya-audit-chain-audit-storage
  template:
    metadata:
      labels:
        microservice: audit-chain
        app.kubernetes.io/name: oya-audit-chain-audit-storage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: oya-audit-chain
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $cfg.image.repository | default "registry.oyatie.dev/oya-audit-chain-audit-storage" }}:{{ $cfg.image.tag | default "0.1.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app,     containerPort: 9000, protocol: TCP}
            - {name: metrics, containerPort: 9090, protocol: TCP}
          env:
            - {name: OYA_MICROSERVICE, value: audit-chain}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://oya-observability-alloy.observability.svc.cluster.local:4317"}
            - {name: RUST_LOG, value: info}
          resources:
            requests:
              cpu: {{ $cfg.resources.requests.cpu | default "500m" }}
              memory: {{ $cfg.resources.requests.memory | default "512Mi" }}
            limits:
              cpu: {{ $cfg.resources.limits.cpu | default "2" }}
              memory: {{ $cfg.resources.limits.memory | default "1Gi" }}
          readinessProbe:
            {{- include "oya.probes.healthzReadiness" $ | nindent 12 }}
          livenessProbe:
            {{- include "oya.probes.healthzLiveness" $ | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
