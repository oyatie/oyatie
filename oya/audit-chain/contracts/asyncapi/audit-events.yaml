asyncapi: 3.1.0
info:
  title: oya-audit-chain — audit events
  version: 1.0.0
  summary: AuditEmitted, SealMinted, VerificationFailed, RetentionApplied, KeyRotated events
  description: |
    Cross-µservice Workflow events emitted by audit-chain BCs.

    Per Bominal ADR-0028 + ADR-0003 and `/specs/audit-chain-merkle-ed25519.json` §`events`.
    Audit-chain-local emitted event classes are registered in
    `microservices/audit-chain/audit-event-class-registry.json`; root cross-µservice
    classes remain bound to ADR-0263.

    Consumers:
    - `observability` µservice (self-SLO + tamper-detection signal)
    - `tenancy` µservice (DSR receipts via RetentionApplied)
    - `grafana-oncall` (Sev-1 paging on VerificationFailed / SealMinted-divergence)
    - Every other µservice that wants confirmation its emission landed
  contact:
    name: axis-audit-chain

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.audit-chain.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus

channels:
  audit-emitted:
    address: workflow-events/audit.emitted
    messages:
      AuditEmittedMessage:
        $ref: '#/components/messages/AuditEmitted'
    description: An AuditEvent has been durable-stored and assigned an event_id + period_id.

  seal-minted:
    address: workflow-events/audit.seal.minted
    messages:
      SealMintedMessage:
        $ref: '#/components/messages/SealMinted'
    description: A (pack, tenant_partition, period_id) Merkle root was signed and published.

  verification-failed:
    address: workflow-events/audit.verification.failed
    messages:
      VerificationFailedMessage:
        $ref: '#/components/messages/VerificationFailed'
    description: A verification request returned verified=false; tamper-suspect.

  retention-applied:
    address: workflow-events/audit.retention.applied
    messages:
      RetentionAppliedMessage:
        $ref: '#/components/messages/RetentionApplied'
    description: A retention-cascade or DSR redaction was applied.

  key-rotated:
    address: workflow-events/audit.key.rotated
    messages:
      KeyRotatedMessage:
        $ref: '#/components/messages/KeyRotated'
    description: An HSM signing key was rotated.

operations:
  emitAuditEmitted:
    action: send
    channel: {$ref: '#/channels/audit-emitted'}
  emitSealMinted:
    action: send
    channel: {$ref: '#/channels/seal-minted'}
  emitVerificationFailed:
    action: send
    channel: {$ref: '#/channels/verification-failed'}
  emitRetentionApplied:
    action: send
    channel: {$ref: '#/channels/retention-applied'}
  emitKeyRotated:
    action: send
    channel: {$ref: '#/channels/key-rotated'}

components:
  messages:
    AuditEmitted:
      name: AuditEmitted
      contentType: application/json
      summary: AuditEvent durable-stored
      payload: {$ref: '#/components/schemas/AuditEmittedPayload'}

    SealMinted:
      name: SealMinted
      contentType: application/json
      summary: Merkle root signed + published
      payload: {$ref: '#/components/schemas/SealMintedPayload'}

    VerificationFailed:
      name: VerificationFailed
      contentType: application/json
      summary: Verification returned false; tamper-suspect
      payload: {$ref: '#/components/schemas/VerificationFailedPayload'}

    RetentionApplied:
      name: RetentionApplied
      contentType: application/json
      summary: Retention-cascade or DSR redaction applied
      payload: {$ref: '#/components/schemas/RetentionAppliedPayload'}

    KeyRotated:
      name: KeyRotated
      contentType: application/json
      summary: HSM signing-key rotation event
      payload: {$ref: '#/components/schemas/KeyRotatedPayload'}

  schemas:
    AuditEmittedPayload:
      type: object
      required: [event_id, pack, tenant_partition, source_microservice, event_class, payload_sha, emitted_at, accepted_at, period_id]
      properties:
        event_id: {type: string, format: ulid}
        pack: {type: string}
        tenant_partition: {type: string}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        source_microservice: {type: string}
        principal_spiffe_id: {type: string}
        event_class: {type: string}
        payload_sha: {type: string, description: 'sha256 of canonical-serialized payload'}
        payload_data_class: {type: string}
        emitted_at: {type: string, format: date-time, description: 'caller-supplied event time'}
        accepted_at: {type: string, format: date-time, description: 'WAL durable time'}
        period_id: {type: string}
        idempotency_key: {type: string, format: ulid}
        entity_ref: {type: string, nullable: true}
        subject_hash: {type: string, nullable: true}

    SealMintedPayload:
      type: object
      required: [pack, tenant_partition, period_id, root_hash, signature, signer_public_key_fp, prior_root_hash, event_count, signed_at]
      properties:
        pack: {type: string}
        tenant_partition: {type: string}
        period_id: {type: string}
        root_hash: {type: string}
        signature: {type: string}
        signer_public_key_fp: {type: string}
        prior_root_hash: {type: string}
        event_count: {type: integer}
        signed_at: {type: string, format: date-time}
        published_to_s3_at: {type: string, format: date-time, nullable: true}
        published_to_mimir_at: {type: string, format: date-time, nullable: true}
        published_to_git_at: {type: string, format: date-time, nullable: true}

    VerificationFailedPayload:
      type: object
      required: [event_id, claimed_root_hash, failure_reason, requested_at]
      properties:
        event_id: {type: string, format: ulid}
        claimed_root_hash: {type: string}
        claimed_proof_summary: {type: string}
        failure_reason:
          type: string
          enum: [signature_invalid, proof_invalid, root_chain_invalid, key_epoch_mismatch, event_not_found, payload_redacted]
        requesting_principal: {type: string}
        requested_at: {type: string, format: date-time}
        is_anonymous: {type: boolean}

    RetentionAppliedPayload:
      type: object
      required: [event_id, mode, applied_at, dsr_id_if_dsr_initiated]
      properties:
        event_id: {type: string, format: ulid}
        mode:
          type: string
          enum: [soft_delete, hard_delete, redact_payload, scheduled_retention_expiry]
        pack: {type: string}
        tenant_partition: {type: string}
        applied_at: {type: string, format: date-time}
        dsr_id_if_dsr_initiated: {type: string, nullable: true}
        operator_principal: {type: string, nullable: true, description: 'set when operator-initiated; null for scheduled retention'}
        merkle_proof_of_redaction_root_hash: {type: string}
        merkle_proof_of_redaction_signature: {type: string}

    KeyRotatedPayload:
      type: object
      required: [pack, prior_key_fp, new_key_fp, overlap_start_at, overlap_end_at, rotated_at, rotation_signed_by_prior_key, rotation_signed_by_new_key]
      properties:
        pack: {type: string}
        prior_key_fp: {type: string}
        new_key_fp: {type: string}
        overlap_start_at: {type: string, format: date-time}
        overlap_end_at: {type: string, format: date-time}
        retired_at: {type: string, format: date-time, nullable: true}
        rotated_at: {type: string, format: date-time}
        rotation_signed_by_prior_key: {type: string, description: 'Ed25519 signature over rotation record by outgoing key'}
        rotation_signed_by_new_key: {type: string, description: 'Ed25519 signature over rotation record by incoming key'}
        operator_principal: {type: string}
        approver_principal: {type: string, description: '2-person-rule approver'}
