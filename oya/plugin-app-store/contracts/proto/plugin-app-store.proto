// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// Canonical-base: specs/contracts/proto3-canonical-envelope.proto (SWEEP-I Slice 3 per ADR-0064)
// proto3; consumed by codegen pipeline + internal gRPC routes.

syntax = "proto3";

package oya.plugin_app_store.v1;

option go_package = "oyatie.dev/api/plugin_app_store/v1";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Plugin catalog
// ============================================================================

message Plugin {
  string id = 1;                                // ULID
  string slug = 2;
  string display_name = 3;
  string description = 4;
  string current_version = 5;                   // semver
  repeated Capability declared_capabilities = 6;
  repeated string declared_data_classes = 7;
  TrustVerdict trust_verdict = 8;
  google.protobuf.Timestamp vetted_at = 9;
  PricingModel pricing_model = 10;
  string price_usd_minor_units = 11;            // Decimal as string to avoid float drift
  string publisher_id = 12;
  uint64 install_count = 13;
  double rating_avg = 14;
  uint64 rating_count = 15;
}

enum TrustVerdict {
  TRUST_VERDICT_UNSPECIFIED = 0;
  TRUST_VERDICT_REVIEWED = 1;
  TRUST_VERDICT_VERIFIED = 2;
  TRUST_VERDICT_ATTESTED = 3;
  TRUST_VERDICT_PACK_BOUND = 4;
}

enum PricingModel {
  PRICING_MODEL_UNSPECIFIED = 0;
  PRICING_MODEL_FREE = 1;
  PRICING_MODEL_ONE_TIME = 2;
  PRICING_MODEL_RECURRING = 3;
}

message Capability {
  string name = 1;
  CapabilityScope scope = 2;
  repeated string data_classes = 3;
  uint32 rate_limit_override = 4;
}

enum CapabilityScope {
  CAPABILITY_SCOPE_UNSPECIFIED = 0;
  CAPABILITY_SCOPE_READ = 1;
  CAPABILITY_SCOPE_WRITE = 2;
  CAPABILITY_SCOPE_ADMIN = 3;
}

// ============================================================================
// Install / Installation
// ============================================================================

message Installation {
  string id = 1;
  string tenant_id = 2;
  string plugin_id = 3;
  string version = 4;
  repeated string granted_capabilities = 5;
  InstallationStatus status = 6;
  google.protobuf.Timestamp installed_at = 7;
}

enum InstallationStatus {
  INSTALLATION_STATUS_UNSPECIFIED = 0;
  INSTALLATION_STATUS_ACTIVE = 1;
  INSTALLATION_STATUS_SUSPENDED = 2;
  INSTALLATION_STATUS_UNINSTALLED = 3;
  INSTALLATION_STATUS_REVOKED = 4;
}

// ============================================================================
// Submission / Vetting
// ============================================================================

message Submission {
  string id = 1;
  string plugin_id = 2;
  string version = 3;
  SubmissionState state = 4;
  google.protobuf.Timestamp submitted_at = 5;
  google.protobuf.Timestamp decided_at = 6;
  RejectionReason rejection_reason = 7;
}

enum SubmissionState {
  SUBMISSION_STATE_UNSPECIFIED = 0;
  SUBMISSION_STATE_SUBMITTED = 1;
  SUBMISSION_STATE_VETTING = 2;
  SUBMISSION_STATE_APPROVED = 3;
  SUBMISSION_STATE_REJECTED = 4;
  SUBMISSION_STATE_WITHDRAWN = 5;
}

message RejectionReason {
  string stage = 1;
  string code = 2;
  string detail = 3;
}

message VettingStageEvent {
  string submission_id = 1;
  VettingStage stage = 2;
  VettingStageStatus status = 3;
  RejectionReason rejection_reason = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

enum VettingStage {
  VETTING_STAGE_UNSPECIFIED = 0;
  VETTING_STAGE_SIGNATURE_VERIFICATION = 1;
  VETTING_STAGE_VULNERABILITY_SCAN = 2;
  VETTING_STAGE_SANDBOX_ISOLATION_VALIDATION = 3;
  VETTING_STAGE_CAPABILITY_SCOPE_VALIDATION = 4;
  VETTING_STAGE_DATA_USE_BOUNDARY_CHECK = 5;
  VETTING_STAGE_ACCESSIBILITY_CONFORMANCE = 6;
  VETTING_STAGE_AI_ACT_CLASSIFICATION = 7;
  VETTING_STAGE_PERFORMANCE_BUDGET = 8;
}

enum VettingStageStatus {
  VETTING_STAGE_STATUS_UNSPECIFIED = 0;
  VETTING_STAGE_STATUS_PENDING = 1;
  VETTING_STAGE_STATUS_RUNNING = 2;
  VETTING_STAGE_STATUS_PASSED = 3;
  VETTING_STAGE_STATUS_FAILED = 4;
}

// ============================================================================
// Internal gRPC service
// ============================================================================

service PluginAppStore {
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc GetPlugin(GetPluginRequest) returns (Plugin);
  rpc InstallPlugin(InstallRequest) returns (Installation);
  rpc UninstallPlugin(UninstallRequest) returns (UninstallResponse);
  rpc SubmitPluginVersion(SubmitRequest) returns (Submission);
  rpc StreamSubmissionStatus(StreamSubmissionStatusRequest) returns (stream VettingStageEvent);
  rpc RevokePlugin(RevokePluginRequest) returns (RevokePluginResponse);
}

message ListPluginsRequest {
  string category = 1;
  string cursor = 2;
  uint32 limit = 3;
}

message ListPluginsResponse {
  repeated Plugin items = 1;
  string next_cursor = 2;
}

message GetPluginRequest {
  string plugin_id = 1;
}

message InstallRequest {
  string plugin_id = 1;
  string version = 2;
  repeated string granted_capabilities = 3;
}

message UninstallRequest {
  string installation_id = 1;
}

message UninstallResponse {}

message SubmitRequest {
  string plugin_id = 1;
  string version = 2;
  string manifest_url = 3;
  string artifact_url = 4;
  string signature_url = 5;
}

message StreamSubmissionStatusRequest {
  string submission_id = 1;
}

message RevokePluginRequest {
  string plugin_id = 1;
  string reason = 2;
}

message RevokePluginResponse {}
