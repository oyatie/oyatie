apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-pipeline-local-slo-burn
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: data-pipeline.local.slo
      rules:
        - alert: DataPipelineLocalSloBurn
          expr: (sum(rate(oya_data_pipeline_ingest_freshness_good_total[5m])) / sum(rate(oya_data_pipeline_ingest_freshness_total[5m]))) < 0.995
          for: 10m
          labels:
            severity: page
            service: data-pipeline
          annotations:
            summary: Data Pipeline ingest-freshness burn
            runbook: microservices/data-pipeline/runbooks/local-ingest-freshness-burn.md
