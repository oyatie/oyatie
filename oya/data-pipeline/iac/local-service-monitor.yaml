apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: data-pipeline-local-ops
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: data-pipeline
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_data_pipeline_ingest_freshness_good_total
    - oya_data_pipeline_transform_latency_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-ingest-source-scope.cedar
