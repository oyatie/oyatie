service:
  name: data-pipeline
  suite: local-operational-primitive
  audience: DATA_PIPELINE_OPERATOR
workloads:
  ingest-worker:
    replicas: 3
    sloMetric: oya_data_pipeline_ingest_freshness
  transform-runner:
    replicas: 2
    sloMetric: oya_data_pipeline_transform_latency
  quality-evaluator:
    replicas: 2
    sloMetric: oya_data_pipeline_quality_null_rate
policy:
  directory: policies
  defaultDeny: true
