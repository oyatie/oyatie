[package]
name = "oya-ci-webhook-gateway-github-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GitHub commit-status poster adapter for the CI webhook gateway (ADR-0387 D5).
# Implements the kernel CommitStatusPoster trait via reqwest blocking HTTP.
# Posts to the GitHub Statuses API v3 with proper auth headers.
# Stage-5 GREEN: real HTTP implementation backed by reqwest.

[lib]
name = "oya_ci_webhook_gateway_github_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-ci-webhook-gateway-kernel = { path = "../oya-ci-webhook-gateway-kernel" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# First-party scripted HTTP test server. Replaces `httpmock`, which ADR-0709 D-6
# Rule 2 fails on what it DRAGS IN (async-std, hyper 0.14, http 0.2, winapi 0.3.9,
# syn 1.0.109) rather than on the crate itself.
scripted-http-server = { path = "../../../../intelligence/testing/scripted-http-server" }
serde_json = { workspace = true }

[lints]
workspace = true
