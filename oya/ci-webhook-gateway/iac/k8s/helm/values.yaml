microservice:
  id: ci-webhook-gateway
  cargoPackage: oya-ci-webhook-gateway
  tenantClass: contributor

workloadLabels:
  tenantId: oyatie-dogfood
  costCenter: fd001-backbone
  workloadClass: app
  regulatoryPack: generic
  dogfoodSubstrate: oyatie-cloud
  productGoal: fd-001

replicaCount: 1

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-ci-webhook-gateway
  automountToken: false
  nonClaim: static-serviceaccount-template-only-no-live-cluster-rbac-tokenreview-or-bound-token-issuance

networkPolicy:
  # Static app network boundary for FD-001 Oyatie Cloud dogfood posture.
  # Live CNI enforcement, namespace labels, and traffic-flow proof remain separate rollout evidence.
  enabled: true
  nonClaim: static-networkpolicy-template-only-no-live-cni-admission-traffic-flow-or-network-isolation-proof
  ingress:
    forgejoNamespaceName: oya-forge
    gatewayNamespaceName: oya-gateway
  egress:
    dnsNamespaceName: kube-system
    jenkinsNamespaceName: oya-ci-jenkins
    jenkinsPort: 8080
    # oya-ci-controller /gate-run dispatch (controller DispatcherKind). The
    # controller runs in this same namespace (oya-ci) on TCP 8081.
    controllerNamespaceName: oya-ci
    controllerPort: 8081
    openbaoNamespaceName: oya-secrets
    openbaoPort: 8200
    githubApiPort: 443
    otelNamespaceName: observability
    otelPort: 4317

image:
  # Dev substrate: in-cluster registry, plain :dev tag (digest TBD by integrator).
  # cosign.required is false for the dev lane so the chart renders without a
  # pinned sha256 digest; release automation flips this on for staging/prod.
  registry: registry.oya-registry.svc.cluster.local:5000
  repository: ci-webhook-gateway
  tag: "dev"
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: false
    policy: ADR-0181

service:
  type: ClusterIP
  # Port 8099 matches DEFAULT_BIND_ADDR in src/config.rs ("0.0.0.0:8099").
  port: 8099
  targetPort: 8099

gateway:
  # Disabled by default so chart installation does not accidentally expose a
  # service before a pack-owned Gateway listener, DNS record, ECH config, and
  # PQC/classical certificate are provisioned and audited.
  enabled: true
  routeNameSuffix: http
  parentRef:
    name: oyatie-public-edge
    namespace: oya-gateway
    sectionName: https
  hostnames:
    - ci-webhook-gateway.oyatie.com
  pathPrefix: /webhook/forgejo
  tlsTermination: parent-gateway-tls13-ech-pqc
  openapiContract: microservices/ci-webhook-gateway/contracts/ci-webhook-gateway.openapi.yaml
  echConfigRef: microservices/ci-webhook-gateway/iac/ech-config.yaml
  pqcCertificateRef: microservices/ci-webhook-gateway/iac/pqc-cert.yaml
  nonClaim: static-httproute-template-only-no-live-gateway-dns-tls-or-cloud-rollout

config:
  tenantId: oyatie-dogfood
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

externalSecret:
  # ExternalSecret pulls OYA_FORGEJO_WEBHOOK_SECRET from OpenBao via ESO.
  # Canonical sref: sref://openbao/oya/ci/forgejo-webhook-secret (ADR-0043).
  # FOUNDER-GATED: OpenBao must be initialized and the secret written at
  # secret/oya/ci/forgejo-webhook-secret before this ExternalSecret resolves.
  enabled: true
  refreshInterval: 1h
  openbaoPath: secret/oya/ci/forgejo-webhook-secret
  secretName: ci-webhook-gateway-secrets
  nonClaim: static-externalsecret-template-only-no-live-eso-or-openbao-sync-evidence

# Dispatcher selection. Maps to OYA_CI_DISPATCHER (DispatcherKind) in src/config.rs.
# "controller" routes deliveries to the bespoke oya-ci-controller /gate-run path;
# "jenkins" (default in config.rs) routes to jenkins.dispatchUrl below.
dispatcher:
  # "controller" | "jenkins". Unrecognised/blank falls back to jenkins in config.rs.
  kind: controller
  # OYA_CI_CONTROLLER_URL — base URL of the oya-ci-controller /gate-run endpoint.
  # Only consulted when kind == controller. In-cluster plain HTTP on :8081.
  controllerUrl: "http://oya-ci-controller.oya-ci.svc.cluster.local:8081"

jenkins:
  # Full HTTP URL the gateway POSTs to kick the oyaCiLane pipeline.
  # Must be a plain http:// URL (TLS terminates at ingress; in-cluster is plain HTTP).
  # Maps to OYA_JENKINS_DISPATCH_URL in src/config.rs.
  # Only consulted when dispatcher.kind == jenkins.
  # TODO(founder): replace with the live generic-webhook-trigger or build-token endpoint.
  dispatchUrl: "http://oya-jenkins.oya-ci-jenkins.svc.cluster.local:8080/generic-webhook-trigger/invoke"

cedar:
  enabled: false
  policyConfigMapName: oya-ci-webhook-gateway-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
