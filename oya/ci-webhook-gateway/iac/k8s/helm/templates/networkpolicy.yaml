{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy: ingress from GitHub (oya-forge) and istio-gateway (oya-gateway);
# egress to Jenkins :8080, GitHub API :443, OpenBao :8200, OTel :4317, DNS :53.
# ADR-0387: ci-webhook-gateway-talos-deploy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-network-boundary" .Values.microservice.id | trunc 63 | trimSuffix "-" | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0387: ci-webhook-gateway-talos-deploy
    oyatie.com/network-boundary: app-ingress-egress
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
  annotations:
    oyatie.com/non-claim: {{ .Values.networkPolicy.nonClaim | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # GitHub webhook delivery
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.githubNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # Istio ingress gateway (for external webhook delivery via ci-webhook-gateway.oyatie.com)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.gatewayNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dnsNamespaceName | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Jenkins CI dispatch
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.jenkinsNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.jenkinsPort }}
    # OpenBao secret store (ESO pulls; also direct if needed)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.openbaoNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.openbaoPort }}
    # GitHub API for commit-status posting (external; allow all destinations on :443)
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.githubApiPort }}
    # OTel collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otelNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otelPort }}
{{- end }}
