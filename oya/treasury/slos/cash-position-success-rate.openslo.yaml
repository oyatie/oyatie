# Preview planning inventory only. Not measured SLO, production readiness,
# runtime audit-chain, or cloud deployment evidence for treasury.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cash-position-success-rate
  labels:
    service: treasury
    sap_code: "TRM"
    authority_scope: preview_planning_non_measured
  annotations:
    authority_ref: specs/microservices/treasury.json
    non_claim: "planning inventory only; no measured SLO, runtime service, cloud deployment, or production readiness"
spec:
  description: "Planning-only cash-position-success-rate objective; benchmark inventory only, with no measured SLO, runtime service, cloud deployment, GA, or production readiness claim."
  service: treasury
  indicator:
    metadata:
      name: cash-position-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_treasury_cash_position_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_treasury_cash_position_attempt_total[5m]))"
  objectives:
    - displayName: cash-position-success-rate
      target: 0.999
