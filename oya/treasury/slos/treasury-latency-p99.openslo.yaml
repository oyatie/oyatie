# Preview planning inventory only. Not measured SLO, production readiness,
# runtime audit-chain, or cloud deployment evidence for treasury.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: treasury-latency-p99
  labels:
    service: treasury
    sap_code: "TRM"
    authority_scope: preview_planning_non_measured
  annotations:
    authority_ref: specs/microservices/treasury.json
    non_claim: "planning inventory only; no measured SLO, runtime service, cloud deployment, or production readiness"
spec:
  description: "Planning-only treasury-latency-p99 objective; benchmark inventory only, with no measured SLO, runtime service, cloud deployment, GA, or production readiness claim."
  service: treasury
  indicator:
    metadata:
      name: treasury-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"treasury\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"treasury\"}[5m]))"
  objectives:
    - displayName: treasury-latency-p99
      target: 0.99
