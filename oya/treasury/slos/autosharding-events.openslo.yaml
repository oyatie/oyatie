# Preview planning inventory only. Governing authority is specs/microservices/treasury.json
# (status: preview, metadata-only). This OpenSLO file is not measured SLO,
# production readiness, runtime audit-chain, or cloud deployment evidence.
# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (Wave 15-ZF-15 per ADR-0346, ADR-0347, ADR-0348, ADR-0349)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: treasury-autosharding-hot-split-latency
  displayName: "treasury autosharding HOT-SPLIT p99 latency"
  labels:
    microservice: treasury
    doctrine_wave: wave-15-zf-15
    adr_0346: oya-verify-must-run-full-ci-mirror
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: jenkins-argocd-self-hostable-ci-cd-substrate
    automation_mode: dynamic_sharding
    automation_event: hot_split
    enforced_by: oya-governance-dynamic-sharding-threshold-coverage
    authority_scope: preview_planning_non_measured
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    authority_ref: specs/microservices/treasury.json
    non_claim: "planning inventory only; no measured SLO, runtime audit-chain emission, Workflow execution, cloud deployment, GA, or production readiness"
    adr_0346_purpose: "legacy oya verify wording is local-feedback/provenance only; protected oya-ci-required is branch-protection authority under ADR-0515."
    adr_0347_enforced_by: "oya-governance-lane-prefix-vocabulary"
    adr_0348_enforced_by: "oya-governance-dynamic-sharding-threshold-coverage; oya-governance-audit-chain-emit-on-automation-events"
    adr_0349_enforced_by: "oya-governance-jenkins-github-actions-parity"
spec:
  description: "Planning-only, non-measured target for future treasury dynamic-sharding HOT-SPLIT analysis. It does not claim a live treasury service, Prometheus metric, runtime audit-chain emission, Workflow execution, cloud deployment, or production readiness under the preview PRD."
  indicator:
    metadata:
      name: treasury-autosharding-hot-split-latency-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_hot_split_duration_seconds_bucket{microservice="treasury",automation_event="hot_split"}[5m])) by (le))'
  objectives:
    - displayName: "99% of HOT-SPLIT events complete within 300s over 30d"
      target: 0.99
      op: lte
      value: 300
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: treasury-autosharding-rebalance-migration-time
  displayName: "treasury AUTO-REBALANCE migration p99 duration"
  labels:
    microservice: treasury
    doctrine_wave: wave-15-zf-15
    adr_0346: oya-verify-must-run-full-ci-mirror
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: jenkins-argocd-self-hostable-ci-cd-substrate
    automation_mode: auto_rebalance
    automation_event: tenant_migration
    enforced_by: oya-governance-auto-rebalance-residency-honored
    authority_scope: preview_planning_non_measured
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    authority_ref: specs/microservices/treasury.json
    non_claim: "planning inventory only; no measured SLO, runtime audit-chain emission, Workflow execution, cloud deployment, GA, or production readiness"
    adr_0346_enforced_by: "oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics; oya-governance-oya-submit-calls-verify"
    adr_0347_enforced_by: "oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary; oya-governance-rename-inventory-presence"
    adr_0348_enforced_by: "oya-governance-auto-rebalance-residency-honored; oya-governance-audit-chain-emit-on-automation-events; oya-governance-tenant-migration-reversibility"
    adr_0349_purpose: "Jenkins CI wording is historical/provenance after ADR-0515; ArgoCD remains separately authorized CD evidence where applicable."
spec:
  description: "Planning-only, non-measured target for future treasury AUTO-REBALANCE analysis. It does not claim live tenant migration, Prometheus metrics, runtime audit-chain emission, Workflow execution, cloud deployment, or production readiness under the preview PRD."
  indicator:
    metadata:
      name: treasury-autosharding-rebalance-migration-time-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_rebalance_migration_duration_seconds_bucket{microservice="treasury",automation_event="tenant_migration"}[5m])) by (le, migration_distance))'
  objectives:
    - displayName: "99% of intra-region AUTO-REBALANCE migrations complete within 600s over 30d"
      target: 0.99
      op: lte
      value: 600
    - displayName: "99% of cross-region AUTO-REBALANCE migrations complete within 3600s over 30d"
      target: 0.99
      op: lte
      value: 3600
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
