# Preview planning inventory only. Governing authority is
# specs/microservices/treasury.json (status: preview, metadata-only).
# This file is not deployment authority and does not claim cloud deployment,
# durable persistence, runtime audit-chain emission, measured SLO/DR, or
# production readiness for treasury.
microservice:
  id: treasury
  cargoPackage: oya-treasury-cash-app
  tenantClass: contributor

replicaCount: 0

podRuntime:
  runtimeClassName: runc

serviceAccount:
  name: oya-treasury

image:
  registry: registry.oyatie.dev
  repository: oya-treasury
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: preview-planning
  auditChainEnabled: false
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-treasury-cedar

otel:
  enabled: false
  endpoint: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
