# Preview planning inventory only; paths below are future placeholders and do
# not claim durable persistence, live secrets, or runtime audit-chain emission.
apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: oya-treasury
spec:
  openbaoPaths:
    - secret/{{ tenant_id }}/treasury/database
    - secret/{{ tenant_id }}/treasury/signing
  maxTtlSeconds: 60
  auditEventClass: EVT-TREASURY-CASH_POSITION-SECRET_LEASE
