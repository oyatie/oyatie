# Preview planning inventory only; not a live cert-manager Certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-treasury-pqc
  annotations:
    oyatie.com/authority-scope: preview-planning-non-authoritative
spec:
  secretName: oya-treasury-tls
  commonName: treasury.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
