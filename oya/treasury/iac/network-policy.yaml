# Preview planning inventory only; not a live Kubernetes NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-treasury-default-deny
  annotations:
    oyatie.com/authority-scope: preview-planning-non-authoritative
spec:
  podSelector:
    matchLabels:
      app: oya-treasury
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oya-ingress: "true"
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              oya-substrate: "true"
