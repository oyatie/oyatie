          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    BankAccountCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
