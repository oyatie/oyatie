          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
  /v1/treasury/hedge-designation:
    post:
      summary: Accept Treasury hedge-designation metadata for preview validation
      operationId: treasury_hedge_designation_mutate
      x-transport:
        default: HTTP/3
