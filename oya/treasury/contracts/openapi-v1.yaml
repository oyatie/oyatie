      responses:
        "202":
          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
components:
  x-oyatie-preview-authority:
    microservice: treasury
    prd_ref: specs/microservices/treasury.json
    prd_status: preview
    artifact_type: contracts
    scope: >-
      Extension-only preview metadata; consumers must not treat this contract as
      proof of runtime payment, bank-network, persistence, workflow, audit-chain,
      or cloud readiness; it has no cloud deployment, no GA readiness, no SLO
      readiness, and no DR readiness.
    non_claims:
      - No live bank connectivity, bank API call, SWIFT/host-to-host transport, or payment execution.
      - No durable persistence, Postgres/RLS, Workflow execution, accounting ledger mutation, statutory filing, runtime audit-chain emission, or cloud deployment.
      - No SAP, Oracle, or treasury workstation exhaustive parity claim.
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as honest-claims metadata for preview PRD review only.
  schemas:
    CashPositionCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    LiquidityForecastCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
