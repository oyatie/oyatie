        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiquidityForecastCommand"
      responses:
        "202":
          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
  /v1/treasury/bank-account:
    post:
      summary: Accept Treasury bank-account approval metadata for preview validation
      operationId: treasury_bank_account_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountCommand"
      responses:
        "202":
          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
  /v1/treasury/debt-instrument:
    post:
      summary: Accept Treasury debt-instrument metadata for preview validation
      operationId: treasury_debt_instrument_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInstrumentCommand"
      responses:
        "202":
          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
  /v1/treasury/fx-exposure:
    post:
      summary: Accept Treasury fx-exposure metadata for preview validation
      operationId: treasury_fx_exposure_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
