            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    FxExposureCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
