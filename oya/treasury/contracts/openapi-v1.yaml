openapi: 3.2.0
info:
  title: Treasury API
  version: 1.0.0
  summary: Preview metadata-only Treasury API contract with SAP TRM parity references
  description: >-
    Public contract shape for the preview Treasury PRD metadata surface. This file
    documents bank-account approval metadata, cash-position metadata,
    deterministic liquidity-forecast metadata, and cash-transfer proposal
    metadata only; it has no payment execution, no live bank connectivity, no
    durable persistence, no Workflow execution, no runtime audit-chain emission,
    no cloud deployment, no GA readiness, and no measured SLO/DR readiness.
servers:
  - url: https://api.oyatie.example/treasury
    description: Example contract endpoint only; no live edge transport or cloud deployment is claimed
x-enterprise-benchmarks:
  - "SAP TRM Treasury and Risk Management"
  - "Oracle Fusion Cash Management"
  - "Workday Financial Management cash and treasury counterpart"
  - "NetSuite Cash Management"
  - "Microsoft Dynamics 365 Finance Cash and Bank"
paths:
  /v1/treasury/cash-position:
    post:
      summary: Accept Treasury cash-position metadata for preview validation
      operationId: treasury_cash_position_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPositionCommand"
      responses:
        "202":
          description: Accepted as metadata-only contract response; no signed/runtime audit-chain event or durable persistence is claimed
  /v1/treasury/liquidity-forecast:
    post:
      summary: Accept Treasury liquidity-forecast metadata for preview validation
      operationId: treasury_liquidity_forecast_mutate
      x-transport:
        default: HTTP/3
