syntax = "proto3";

package oya.treasury.v1;

option java_package = "dev.oyatie.treasury.v1";

// SAP TRM; benchmarks: SAP TRM Treasury and Risk Management | Oracle Fusion Cash Management | Workday Financial Management cash and treasury counterpart | NetSuite Cash Management | Microsoft Dynamics 365 Finance Cash and Bank
// Transport binding: HTTP/3 default at REST edge, gRPC over mTLS internally, ECH/PQC at ingress where supported.

message CashPositionCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message CashPositionResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message LiquidityForecastCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message LiquidityForecastResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message BankAccountCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message BankAccountResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message DebtInstrumentCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message DebtInstrumentResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message FxExposureCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message FxExposureResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message HedgeDesignationCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message HedgeDesignationResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service TreasuryService {
  rpc MutateCashPosition (CashPositionCommand) returns (CashPositionResult);
  rpc MutateLiquidityForecast (LiquidityForecastCommand) returns (LiquidityForecastResult);
  rpc MutateBankAccount (BankAccountCommand) returns (BankAccountResult);
  rpc MutateDebtInstrument (DebtInstrumentCommand) returns (DebtInstrumentResult);
  rpc MutateFxExposure (FxExposureCommand) returns (FxExposureResult);
  rpc MutateHedgeDesignation (HedgeDesignationCommand) returns (HedgeDesignationResult);
}
