{{- if .Values.externalSecret.enabled }}
# ExternalSecret pulls the Forgejo CI token (FORGEJO_CI_TOKEN) from OpenBao
# at secret/oya/ci/forgejo-ci-token via the External Secrets Operator.
# ADR-0043: sref secret contract. ADR-0387: ci-gate substrate.
# FOUNDER-GATED: OpenBao init + bao kv put must happen before this resolves.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-secrets" .Values.microservice.id | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ .Values.config.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
  annotations:
    oyatie.com/non-claim: {{ .Values.externalSecret.nonClaim | quote }}
    oyatie.com/audit-chain-event: "EVT-CI-CONTROLLER-SECRET-SYNC"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretName | quote }}
    creationPolicy: Owner
  data:
    # forgejo-ci-token → env FORGEJO_CI_TOKEN (controller).
    # OpenBao KV path: secret/oya/ci/forgejo-ci-token, field "token"
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecret.openbaoPath | quote }}
        property: token
{{- end }}
{{- if .Values.gateRunTokenSecret.enabled }}
---
# ExternalSecret for the POST /gate-run shared secret (OYA_CI_GATE_RUN_TOKEN).
# Callers must present this token in `X-Gate-Run-Token` to POST /gate-run.
# Gate runner Pods (untrusted PR code) MUST NOT have access to this Secret.
# ADR-0043: sref secret contract. ADR-0387: ci-gate substrate.
# FOUNDER-GATED: OpenBao init + bao kv put secret/oya/ci/gate-run-token must
# happen before this resolves.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-gate-run-token" .Values.microservice.id | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ .Values.config.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
  annotations:
    oyatie.com/non-claim: {{ .Values.gateRunTokenSecret.nonClaim | quote }}
    oyatie.com/audit-chain-event: "EVT-CI-CONTROLLER-GATE-RUN-TOKEN-SYNC"
spec:
  refreshInterval: {{ .Values.gateRunTokenSecret.refreshInterval | quote }}
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateRunTokenSecret.secretName | quote }}
    creationPolicy: Owner
  data:
    # gate-run-token → env OYA_CI_GATE_RUN_TOKEN (controller only).
    # OpenBao KV path: secret/oya/ci/gate-run-token, field "token"
    - secretKey: token
      remoteRef:
        key: {{ .Values.gateRunTokenSecret.openbaoPath | quote }}
        property: token
{{- end }}
