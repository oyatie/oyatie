{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for the oya-ci controller.
# Ingress: monitoring namespace (/healthz + /metrics) + ci namespace (POST /gate-run).
# Egress: kube-apiserver (Job/Pod watch+create), Forgejo (status post + clone),
#         OpenBao (ESO token sync), OTel collector, DNS.
# ADR-0387: ci-gate substrate.
#
# POST /gate-run is protected by X-Gate-Run-Token (shared-secret, projected from
# OpenBao via ESO). The NetworkPolicy further restricts callers to the named
# ci-webhook-gateway pod in oya-ci so that other workloads cannot even reach the
# port, providing defence-in-depth even if the token were somehow leaked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-network-boundary" .Values.microservice.id | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ .Values.config.namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/network-boundary: app-ingress-egress
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
  annotations:
    oyatie.com/non-claim: {{ .Values.networkPolicy.nonClaim | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus / OTel scrape from monitoring namespace (/healthz + /metrics).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.monitoringNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # POST /gate-run enters through ci-webhook-gateway (forgejo→gateway→controller).
    # X-Gate-Run-Token provides application-layer defence-in-depth; this rule keeps
    # the network path least-privilege by allowing only the gateway pod on 8081.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.gatewayNamespaceName | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.ingress.gatewayPodName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dnsNamespaceName | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver — Job/Pod watch + create
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.apiserverPort }}
    # Forgejo in-cluster — status post + git clone
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.forgejoNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.forgejoPort }}
    # OpenBao secret store (ESO pulls)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.openbaoNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.openbaoPort }}
    # OTel collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otelNamespaceName | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otelPort }}
{{- end }}
