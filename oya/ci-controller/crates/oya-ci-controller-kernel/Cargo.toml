[package]
name = "oya-ci-controller-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# oya-ci controller kernel — pure-domain state machine for Phase-1 bespoke-Prow
# (oya-ci-bespoke-prow design). No I/O, no async, no kube, no tokio.
# Owns: GateRun, GateOutcome, ForgejoState, JobObservation, map_job_to_status.
# ADR-0387 (ci-gate substrate); see docs/ideas/oya-ci-bespoke-prow.md Phase 1.

[lib]
name = "oya_ci_controller_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# async-trait: dyn-compatible async seam traits (ForgejoStatusPoster). The pure
# domain logic (map_job_to_status) remains sync; only the I/O ports are async.
async-trait = "0.1"

[lints]
workspace = true
