[package]
name = "oya-ci-controller-github-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# GitHub commit-status poster adapter for the oya-ci controller (the
# `oya-ci-required` producer). Implements kernel::CommitStatusPoster via reqwest
# blocking HTTP. Posts to the GitHub Statuses API: POST /repos/<owner>/<repo>/statuses/<sha>.
# HTTP shape lifted from the proven oya-ci-webhook-gateway-github-adapter (ADR-0387 D5).
# Forge-of-record = GitHub (D2/D-FORGE).

[lib]
name = "oya_ci_controller_github_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-ci-controller-kernel = { path = "../oya-ci-controller-kernel" }
reqwest = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
httpmock = "0.7"
serde_json = { workspace = true }

[lints]
workspace = true
