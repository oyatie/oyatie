apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-ticket-triage-latency
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: itsm
  description: Incident ticket triage latency for incident, change, problem, CMDB, knowledge base, and service-level management operations.
  indicator:
    metadata:
      name: ticket-triage-latency
      labels:
        domain_object: ServiceManagementRecord
        operator_audience: IT_SERVICE_MANAGER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_ticket_triage_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_ticket_triage_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Incident ticket triage latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
