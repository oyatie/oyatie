apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-read-latency
  labels:
    service: itsm
    adr: ADR-0139
spec:
  service: itsm
  indicator:
    metadata:
      name: read-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_read_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_read_latency_total[5m]))
  objectives:
    - displayName: ITSM read-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
