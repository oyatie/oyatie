apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-cmdb-relation-freshness
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: itsm
  description: CMDB relationship projection freshness for incident, change, problem, CMDB, knowledge base, and service-level management operations.
  indicator:
    metadata:
      name: cmdb-relation-freshness
      labels:
        domain_object: ServiceManagementRecord
        operator_audience: IT_SERVICE_MANAGER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_cmdb_relation_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_cmdb_relation_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: CMDB relationship projection freshness
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
