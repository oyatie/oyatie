apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-problem-link-correctness
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: itsm
  description: Problem records linked to incident evidence for incident, change, problem, CMDB, knowledge base, and service-level management operations.
  indicator:
    metadata:
      name: problem-link-correctness
      labels:
        domain_object: ServiceManagementRecord
        operator_audience: IT_SERVICE_MANAGER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_problem_link_correctness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_problem_link_correctness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Problem records linked to incident evidence
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
