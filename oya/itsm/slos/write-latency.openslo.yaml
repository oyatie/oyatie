apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-write-latency
  labels:
    service: itsm
    adr: ADR-0139
spec:
  service: itsm
  indicator:
    metadata:
      name: write-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_write_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_write_latency_total[5m]))
  objectives:
    - displayName: ITSM write-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
