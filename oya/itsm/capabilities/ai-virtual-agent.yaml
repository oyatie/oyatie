apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-ai-virtual-agent
  service: itsm
spec:
  businessCapability: service-management
  capability: ai-virtual-agent
  counterparts:
    - "ServiceNow Now Assist (Virtual Agent)"
    - "Atlassian Intelligence (JSM)"
    - "Freshservice Freddy AI"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0255, ADR-0263, ADR-0328]
  surface:
    flows:
      - greet_requester
      - classify_intent
      - retrieve_kb_answer_rag
      - escalate_to_human_when_uncertain
      - open_ticket_with_summarized_context
    deflection_target_percent: 35
    handoff_kind: warm_transfer_with_summary_to_agent_workspace
  tenantScope:
    requiredFields: [tenant_id, requester_principal_id, audience_type, purpose, data_class]
    dataClass: chatbot_conversation
  cedarGate: microservices/itsm/policy/ai-virtual-agent-authorization.cedar
  intelligenceBinding:
    chat_model: intelligence-µservice substrate (per-tenant residency)
    grounding: knowledge-base capability
    refusal_policy: ADR-0331-tenant-pack-overlay
  tenantClassSupport:
    demo_trial: true
    paid: true
  packs:
    demo_trial_caps:
      ai_deflection_attempts_per_month: 200
    paid_metering:
      per_usage: ai_deflection_attempts_per_month
