[package]
name = "oya-itsm-incident-room"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Incident Room bounded context for the ITSM µservice (war-room/major-incident bridge; MLS-encrypted)."

[package.metadata.oya]
microservice = "itsm"
bounded_context = "incident-room"
counterparts = ["PagerDuty Incident Workflows", "FireHydrant Runbooks", "ServiceNow Major Incident Management"]
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0243", "ADR-0244", "ADR-0245", "ADR-0246", "ADR-0263", "ADR-0328"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

