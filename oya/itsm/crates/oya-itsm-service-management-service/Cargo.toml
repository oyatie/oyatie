[package]
name = "oya-itsm-service-management-service"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "ITSM µservice umbrella: composes 5 bounded-context crates (on-call-schedule, escalation-policy, incident-room, status-update, postmortem) plus the legacy service-management aggregate."
authors = ["Oyatie Council Architecture"]
repository = "https://github.com/oyatie/oyatie"
keywords = ["oyatie", "itsm", "microservice"]
categories = ["development-tools"]

[package.metadata.oya]
microservice = "itsm"
bounded_contexts = [
    "on-call-schedule",
    "escalation-policy",
    "incident-room",
    "status-update",
    "postmortem",
]
architecture_layers = "ADR-0105-13-layer-enum-with-ADR-0106-usecase"
flat_layout_authority = "ADR-0131"
no_grouping_authority = "ADR-0132"
contracts = ["openapi-v1", "grpc-v1", "asyncapi-v1"]
scaffold_wave = "Wave-15A-ITSM-Remediation"
scaffold_date = "2026-05-21"
scaffold_agent = "wave-15a-itsm-remediation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oya-itsm-service"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
oya-itsm-on-call-schedule = { path = "../oya-itsm-on-call-schedule" }
oya-itsm-escalation-policy = { path = "../oya-itsm-escalation-policy" }
oya-itsm-incident-room = { path = "../oya-itsm-incident-room" }
oya-itsm-status-update = { path = "../oya-itsm-status-update" }
oya-itsm-postmortem = { path = "../oya-itsm-postmortem" }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
