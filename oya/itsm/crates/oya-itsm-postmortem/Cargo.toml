[package]
name = "oya-itsm-postmortem"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Postmortem bounded context for the ITSM µservice (blameless retros, FireHydrant/Jeli displacement)."

[package.metadata.oya]
microservice = "itsm"
bounded_context = "postmortem"
counterparts = ["FireHydrant Retro", "Jeli", "PagerDuty Postmortem"]
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0243", "ADR-0244", "ADR-0245", "ADR-0263", "ADR-0328"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
