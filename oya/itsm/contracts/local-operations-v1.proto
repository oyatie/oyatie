// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.itsm.local.v1;

message ItsmLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message ItsmLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message ItsmLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message ItsmLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message ItsmSupportedActions {
  string incident_ticket_create_action = 1;
  string change_request_approve_action = 2;
  string problem_link_action = 3;
  string cmdb_relation_update_action = 4;
  string sla_recompute_action = 5;
  string kb_publish_action = 6;
}

service ItsmLocalOperationsService {
  rpc CheckLocalPolicy(ItsmLocalPolicyCheckRequest) returns (ItsmLocalPolicyDecision);
  rpc GetLocalSloState(ItsmLocalSloStateRequest) returns (ItsmLocalSloState);
}
