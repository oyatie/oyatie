apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itsm-ticket-api
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itsm-ticket-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_itsm_mttr_objective_inflight
        target:
          type: AverageValue
          averageValue: "100"
