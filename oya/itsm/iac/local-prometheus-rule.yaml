apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: itsm-local-slo-burn
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: itsm.local.slo
      rules:
        - alert: ItsmLocalSloBurn
          expr: (sum(rate(oya_itsm_mttr_objective_good_total[5m])) / sum(rate(oya_itsm_mttr_objective_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: itsm
          annotations:
            summary: ITSM mttr-objective burn
            runbook: microservices/itsm/runbooks/local-mttr-burn.md
