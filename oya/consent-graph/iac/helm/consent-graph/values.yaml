image:
  repository: oya/consent-graph
  tag: "0.1.0"
  pullPolicy: IfNotPresent

region: us-east-1
pack: us
namespace: consent-graph

apps:
  consentGraph:
    replicas: 10
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  enforcement:
    replicas: 30
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  revocation:
    replicas: 5
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  projectionGateway:
    replicas: 5
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  projectionGatewayWorker:
    replicas: 20
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  auditBridgeWorker:
    replicas: 10
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "4", memory: "8Gi" }
  partnerDirectory:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "2", memory: "4Gi" }
  worker:
    replicas: 1
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "2", memory: "4Gi" }

postgres:
  host: citus-coordinator.consent-graph.svc.cluster.local
  port: 5432
  database: consent_graph
  sslMode: require
  poolSize: 100

pulsar:
  brokerUrl: pulsar+ssl://pulsar-broker.pulsar.svc.cluster.local:6651
  adminUrl: https://pulsar-admin.pulsar.svc.cluster.local:8443
  tenantPrefix: oya-tenant-
  topicNamespace: cross-tenant-projection
  revocationTopic: oya.consent-graph.revocation.v1
  auditBridgeTopic: oya.consent-graph.audit-bridge.v1

openbao:
  endpoint: https://openbao.openbao.svc.cluster.local:8200
  pathPrefix: secret/consent-graph
  rolePrefix: consent-graph

identity:
  endpoint: https://identity.identity.svc.cluster.local:9443

auditChain:
  endpoint: https://audit-chain.audit-chain.svc.cluster.local:9443

ontology:
  endpoint: https://ontology.ontology.svc.cluster.local:9443

observability:
  otelEndpoint: otel-collector.observability.svc.cluster.local:4317
  prometheusScrapePort: 9090

cedar:
  cacheSize: 100000
  compileTimeoutMs: 1000
  freshnessBudgetMs: 200

mesh:
  ciliumL4: true
  istioAmbient: true
  ambientWaypointInjected: true
  northSouthOnly: false

hpa:
  enabled: true
  enforcement:
    minReplicas: 30
    maxReplicas: 200
    targetRequestsPerPod: 8000
  projectionGatewayWorker:
    minReplicas: 20
    maxReplicas: 100
    targetUnackedMessages: 1000
  auditBridgeWorker:
    minReplicas: 10
    maxReplicas: 50
    targetOutboxOldestSeconds: 30

slo:
  enabled: true
  hgGroup: HG-CONSENT
  alertRouting:
    p0: pagerduty:axis-consent-graph-p0
    p1: pagerduty:axis-consent-graph-p1
    p2: slack:axis-consent-graph
    p3: email:axis-consent-graph

ports:
  rest: 8080
  grpc: 9443
  metrics: 9090
  health: 8081
