apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: consent-graph-kr-overlay
namespace: consent-graph
resources:
  - ../../base
patchesStrategicMerge:
  - pack-kr-values-patch.yaml
configMapGenerator:
  - name: consent-graph-pack-config
    literals:
      - pack=kr
      - default_cross_border_transfer_permitted=false
      - default_geo_replicate=false
      - audit_chain_retention_years=7
      - dsar_clock_days=10
      - sensitive_k_anonymity_min=10
      - lawful_basis_required=true
