apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-graph-app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - { name: OYA_PACK, value: "kr" }
            - { name: OYA_REGION, value: "ap-northeast-2" }
            - { name: OYA_DEFAULT_CROSS_BORDER_TRANSFER_PERMITTED, value: "false" }
            - { name: OYA_DEFAULT_GEO_REPLICATE, value: "false" }
            - { name: OYA_AUDIT_CHAIN_RETENTION_YEARS, value: "7" }
            - { name: OYA_DSAR_CLOCK_DAYS, value: "10" }
            - { name: OYA_SENSITIVE_K_ANONYMITY_MIN, value: "10" }
