apiVersion: oya.dev/v1
kind: SovereigntyRules
metadata:
  name: eu-pack-sovereignty
spec:
  pack: eu
  default_cross_border_transfer_permitted: false
  permitted_grantee_regions_default:
    - eu-west-1
    - eu-central-1
    - eu-south-1
    - eu-north-1
  cross_border_lawful_basis_required:
    - SCC
    - BCR
    - adequacy-decision
    - data-subject-explicit-consent
  adequacy_decisions:
    - gb-*
    - ch-*
    - jp-*
    - kr-*
    - nz-*
    - uy-*
    - il-*
    - ar-*
    - ca-*
  forbidden_destinations: []
  geo_replicate_permitted: true
  sensitive_categories_k_anonymity_min: 5
  audit_chain_retention_years: 7
  dsar_clock_days: 30
