apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: consent-graph-eu-overlay
namespace: consent-graph
resources:
  - ../../base
patchesStrategicMerge:
  - pack-eu-values-patch.yaml
configMapGenerator:
  - name: consent-graph-pack-config
    literals:
      - pack=eu
      - default_cross_border_transfer_permitted=false
      - audit_chain_retention_years=7
      - dsar_clock_days=30
      - sensitive_k_anonymity_min=5
      - lawful_basis_required=true
