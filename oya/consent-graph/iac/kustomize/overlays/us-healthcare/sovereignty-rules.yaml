apiVersion: oya.dev/v1
kind: SovereigntyRules
metadata:
  name: us-healthcare-pack-sovereignty
spec:
  pack: us-healthcare
  default_cross_border_transfer_permitted: false
  permitted_grantee_regions_default:
    - us-east-1
    - us-east-2
    - us-west-1
    - us-west-2
  adequacy_decisions: []  # HIPAA requires BAA explicitly; no implicit adequacy
  geo_replicate_permitted: false  # PHI residency strict
  sensitive_categories_k_anonymity_min: 10
  audit_chain_retention_years: 6  # HIPAA spec
  dsar_clock_days: 60  # HIPAA breach notification clock
  break_glass_purpose: emergency-treatment
  break_glass_audit_officer_review_required: true
  min_necessary_enforced: true
  baa_required: true
