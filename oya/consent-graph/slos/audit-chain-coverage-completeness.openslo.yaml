apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-audit-chain-coverage-completeness
  displayName: Audit-chain coverage completeness
spec:
  description: |
    Fraction of consent-graph events that successfully seal in audit-chain (both grantor + grantee
    chains). Target = 1.0 (zero un-sealed events).
    Authority: ADR-0214 §2.6 + IP-012.
  service: consent-graph
  indicator:
    metadata:
      name: audit-chain-coverage-completeness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_audit_emit_total{outcome="sealed"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_audit_emit_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% sealed
      target: 1.0
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P1
      burnRate: 14.4
      window: 1h
    - severity: P2
      burnRate: 6.0
      window: 6h
