# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay (single-region; KR geographic constraint)
# Per `microservices/application/policy/data-residency.md` and
# `microservices/application/multi-region.md`.

namespace: application

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: openbao-secret-references
    patch: |-
      - op: replace
        path: /data/pack
        value: "kr"

  - target:
      kind: ConfigMap
      name: pack-config
    patch: |-
      - op: replace
        path: /data/region
        value: "ap-seoul-1"
      - op: replace
        path: /data/jurisdiction
        value: "KR"
      - op: replace
        path: /data/dr_enabled
        value: "false"  # single-region per policy
      - op: replace
        path: /data/cloudflare_overlay_enabled
        value: "false"  # pack-kr never uses Cloudflare overlay (KR-only POPs)

helmValues:
  shell-app:
    components:
      shellRouting:
        replicas: 4  # XS tier
      authGatewayRest:
        replicas: 4
      moduleLoader:
        replicas: 2
    ingress:
      hosts:
        - host: "{tenant-hash}.app-kr.oyatie.dev"
          paths: [{ path: /, pathType: Prefix }]
      tls:
        - secretName: app-tls-cert-kr
          hosts: ["*.app-kr.oyatie.dev"]
    oidc:
      cookieDomain: ".app-kr.oyatie.dev"

  cdn-controller:
    oci:
      endpoint: "https://cdn.kr.oci.oraclecloud.com"
    cloudflare:
      enabled: false  # KR-only POPs

  postgres:
    citus:
      coordinator:
        nodeSelector:
          topology.kubernetes.io/region: "ap-seoul-1"
      worker:
        nodeSelector:
          topology.kubernetes.io/region: "ap-seoul-1"
    replication:
      enabled: false  # single-region pack
    backup:
      destination: oci-object-storage://application-postgres-backups-kr/

commonLabels:
  oyatie/pack: kr
