# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
citus:
  image:
    repository: citusdata/citus
    tag: "12.1.0"  # LTS pinned
  coordinator:
    replicaCount: 1
    resources:
      requests: { cpu: 4, memory: 16Gi }
      limits:   { cpu: 8, memory: 32Gi }
    persistence:
      enabled: true
      size: 200Gi  # XS tier per cost-budget.md
      storageClass: oci-bv
  worker:
    replicaCount: 3
    resources:
      requests: { cpu: 4, memory: 16Gi }
      limits:   { cpu: 8, memory: 32Gi }
    persistence:
      enabled: true
      size: 500Gi
      storageClass: oci-bv

  # Per-pack residency: only deploy in the pack's primary region
  nodeSelector:
    topology.kubernetes.io/region: "{pack-region}"

postgres:
  database: application
  user: "${openbao:secret/application/<pack>/postgres/user}"
  password: "${openbao:secret/application/<pack>/postgres/password}"
  extensions:
    - citus
    - pgcrypto
    - btree_gin
    - btree_gist
    - pgaudit
  parameters:
    max_connections: 500
    shared_buffers: 8GB
    work_mem: 32MB
    maintenance_work_mem: 1GB
    effective_cache_size: 24GB
    wal_level: replica
    synchronous_commit: on
    log_statement: ddl
    pgaudit.log: 'write, ddl, role'
  rls:
    enabled: true  # all tenant tables RLS-scoped
  citusShard:
    shardKey: tenant_id  # per `policy/data-residency.md`
    shardCount: 32

# Synchronous replication for DR-pair packs (eu/us/au/in/br/ae/ksa)
# Disabled for single-region packs (kr/jp/sg)
replication:
  enabled: false  # set true per pack overlay
  mode: synchronous
  drReplicaRegion: "{pack-dr-region}"

backup:
  enabled: true
  schedule: "0 */6 * * *"  # every 6 h
  retention:
    daily: 7
    weekly: 4
    monthly: 12
  destination: oci-object-storage://application-postgres-backups-{pack}/

audit:
  pgaudit:
    enabled: true
    sealedToObjectStorage: true  # daily Merkle-root seal per ADR-0028

otel:
  enabled: true
  endpoint: http://oya-observability-alloy.observability.svc.cluster.local:4317
