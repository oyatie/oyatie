id: cap:application:tenant-admin-console-control:v1
name: tenant-admin-console-control
namespace: application
display_name: Tenant Admin Console Control
description: |
  No-code control surface for tenant roles, Cedar fragments, JIT access review,
  context visibility, and tenant AI enablement.

owner_team: axis-application
maturity: scaffolded
created_at: 2026-05-18
related_adrs: [ADR-0215, ADR-0218, ADR-0219]
related_artifacts:
  - microservices/application/contracts/openapi/tenant-admin-console.yaml
  - microservices/application/policy/tenant-admin-console.cedar

autonomy_tier: T2
inputs:
  - name: tenant_id
    type: string
    required: true
  - name: admin_principal_id
    type: string
    required: true
  - name: active_context_id
    type: string
    required: true
  - name: draft
    type: object
    required: true

outputs:
  - name: draft_id
    type: string
  - name: simulation_result
    type: enum
    values: [allowed, refused, requires_four_eyes]
  - name: audit_event
    type: string

data_classes_touched:
  - PII_IDENTIFYING
  - AUTHENTICATION
  - AUDIT
  - INTERNAL_ONLY

cedar_policy_fragments:
  - microservices/application/policy/tenant-admin-console.cedar

evidence_topic: oya.application.tenant-admin.policy-change-applied
eval_set:
  canonical_inputs_path: microservices/application/capabilities/eval/tenant-admin-console-control-canonical.jsonl
  pass_threshold: 1.0
  eval_metric: tenant-policy-simulation-refusal-correctness
  cadence: per-release
