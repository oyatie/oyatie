# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:application:session-emit:v1
name: session-emit
namespace: application
display_name: Emit Session Lifecycle Event
description: |
  Emit a Workflow event for session lifecycle: SessionStarted on OIDC/SAML
  callback success; SessionEnded on logout / timeout / forced revocation /
  employee-terminated. Every event is Ed25519-sealed by audit-chain.

owner_team: axis-application + ops-security
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0123, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/application/PRD.md
  - microservices/application/contracts/asyncapi/application-events.yaml
  - microservices/application/policy/tenant-scope.cedar

autonomy_tier: T2
# T2 = read sensitive (session info) + write to ledger.

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: session_id
    type: string
    required: true
  - name: event_kind
    type: enum
    values: [started, ended]
    required: true
  - name: reason
    type: enum
    values: [oidc_signin, saml_signin, logout, timeout, forced_revocation, employee_terminated, hmac_rotated]
    required: false

outputs:
  - name: event_id
    type: string
  - name: sealed_at
    type: timestamp

data_classes_touched:
  - PII_IDENTIFYING
  - PII_AUTHN_CREDENTIAL
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.application.session

cost_profile:
  type: per-event
  estimated_cost_usd_per_call: 0.000002
  cost_drivers:
    - Audit-chain Ed25519 seal (amortized)
    - AMQP publish

cedar_policy_fragments:
  - microservices/application/policy/tenant-scope.cedar

eval_set:
  canonical_inputs_path: microservices/application/capabilities/eval/session-emit-canonical.jsonl
  pass_threshold: 0.999
  eval_metric: event-emission-correctness-against-session-state-machine
  cadence: per-release

sunset:
  status: none
  notes: ""
