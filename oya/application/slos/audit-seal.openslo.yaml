# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-application-audit-seal
  microservice: application
  display_name: Application Shell — Audit Chain Seal Latency
spec:
  service: oya-application-audit-emission
  description: |
    Time from event emission (SessionStarted / ModuleLoaded / RouteAccessDenied / etc.)
    to Ed25519-sealed record in audit-chain p99 must stay under 1 s per
    Bominal ADR-0028.
  indicator:
    metricSource:
      type: Prometheus
      spec:
        query: |
          histogram_quantile(0.99,
            sum by (le, pack) (
              rate(oya_application_audit_seal_latency_seconds_bucket[5m])
            )
          )
  objectives:
    - target: 0.999
      threshold: 1.0
  timeWindow:
    - duration: 30d
      isRolling: true
