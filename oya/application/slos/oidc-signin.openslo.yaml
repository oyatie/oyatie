# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-application-oidc-signin
  microservice: application
  display_name: Application Shell — OIDC Sign-in Round-Trip
spec:
  service: oya-application-auth-gateway-rest
  description: |
    OIDC token exchange + session creation p99 must stay under 200 ms per
    PRD §"Performance" and Bominal ADR-0123.
  indicator:
    metricSource:
      type: Prometheus
      spec:
        query: |
          histogram_quantile(0.99,
            sum by (le, pack) (
              rate(oya_application_oidc_signin_seconds_bucket{result="success"}[5m])
            )
          )
  objectives:
    - target: 0.999
      threshold: 0.2
  timeWindow:
    - duration: 30d
      isRolling: true
