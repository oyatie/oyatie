[package]
name = "oya-application-shell-frontend"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Production Leptos portal-shell for the Oyatie console (ADR-0393): SSR+hydration shell whose module visibility derives from the locked shell-BFF capability-registry contracts."

[lib]
name = "oya_application_shell_frontend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "oya-application-shell-frontend"
path = "src/main.rs"

[features]
default = ["csr"]
csr = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "leptos/csr"]
hydrate = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "leptos/hydrate"]
ssr = ["dep:any_spawner", "dep:axum", "dep:tokio", "leptos/ssr"]

[dependencies]
console_error_panic_hook = { version = "=0.1.7", optional = true }
leptos = { version = "=0.8.19", default-features = false }
oya-shared-oidc-client-kernel = { path = "../../../../libs/oya-shared-oidc-client-kernel" }
oya-shared-platform-contracts-kernel = { path = "../../../../libs/oya-shared-platform-contracts-kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true, optional = true }
any_spawner = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync"], optional = true }
wasm-bindgen = { version = "=0.2.121", optional = true }

# Integration tests compile this lib without `cfg(test)`, so `#[cfg(feature = "ssr")]`
# modules stay off under default `csr`. Depend on self with `ssr` so `cargo test`
# (including `--workspace`) builds the native Axum host the live-server tests need.
[dev-dependencies]
oya-application-shell-frontend = { path = ".", default-features = false, features = ["ssr"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos_axum = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = [
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Response",
    "Window",
] }

[package.metadata.leptos]
output-name = "oya_application_shell_frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/app.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[lints]
workspace = true
