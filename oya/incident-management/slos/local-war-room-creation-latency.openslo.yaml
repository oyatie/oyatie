apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-war-room-creation-latency
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: incident-management
  description: War-room creation latency for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations.
  indicator:
    metadata:
      name: war-room-creation-latency
      labels:
        domain_object: IncidentCommand
        operator_audience: ONCALL_RESPONDER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_war_room_creation_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_war_room_creation_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: War-room creation latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
