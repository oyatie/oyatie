apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-postmortem-seal-completeness
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: incident-management
  description: Postmortems sealed with required timeline evidence for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations.
  indicator:
    metadata:
      name: postmortem-seal-completeness
      labels:
        domain_object: IncidentCommand
        operator_audience: ONCALL_RESPONDER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_postmortem_seal_completeness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_postmortem_seal_completeness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Postmortems sealed with required timeline evidence
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
