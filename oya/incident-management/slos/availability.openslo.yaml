apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-availability
  labels:
    service: incident-management
    adr: ADR-0139
spec:
  service: incident-management
  indicator:
    metadata:
      name: availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_availability_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_availability_total[5m]))
  objectives:
    - displayName: Incident Management availability
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
