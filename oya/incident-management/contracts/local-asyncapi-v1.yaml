asyncapi: 3.1.0
info:
  title: Incident Management Local Operational Events
  version: 1.0.0
  description: Events for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  incident-management.local-ops.v1:
    address: incident-management.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/incident-management.local-ops.v1'
    messages:
      - $ref: '#/channels/incident-management.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/incident-management.local-ops.v1'
    messages:
      - $ref: '#/channels/incident-management.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: IncidentManagementDomainEvent
      title: Incident Management domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['page.dispatched', 'page.acknowledged', 'warroom.opened', 'escalation.advanced'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['page_event', 'escalation_policy', 'incident_timeline', 'war_room_record', 'stakeholder_update', 'postmortem_action'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: IncidentManagementSloBurnEvent
      title: Incident Management SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'incident-management' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'page.dispatched' }
