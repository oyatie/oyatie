apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-management-pager-dispatcher
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-management-pager-dispatcher
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_incident_management_page_to_acknowledge_inflight
        target:
          type: AverageValue
          averageValue: "100"
