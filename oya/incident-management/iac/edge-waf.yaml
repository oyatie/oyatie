apiVersion: oyatie.dev/v1
kind: EdgeWaf
metadata:
  name: incident-management-edge-waf
  labels:
    service: incident-management
    binding_adr: ADR-0253-amendment
spec:
  service: incident-management
  tenantScoped: true
  audienceType: ONCALL_RESPONDER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/sre-incident-command-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["PagerDuty", "OpsGenie", "xMatters", "FireHydrant"]
