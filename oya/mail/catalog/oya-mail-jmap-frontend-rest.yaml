apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-mail-jmap-frontend-rest
  namespace: mail
spec:
  microservice: mail
  bounded_context: jmap-frontend
  layer: rest
  language: rust
  binding_adrs:
    - ADR-0253
    - ADR-0258
  protocol:
    primary: jmap-rfc-8620
    secondary: jmap-mail-rfc-8621
    transport: http3-quic
  emits_audit_classes:
    - oya.mail.jmap-method-call
    - oya.mail.jmap-state-update
  cedar_fragments:
    - policy/tenant-scope.cedar
    - policy/abuse-defence.cedar
  semver_policy: ADR-0258
