# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for mail µservice; applied per-pack with overlays.
# Per ADR-0131 + ADR-0133.

namespace: mail

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - cilium-clusterwide-network-policy.yaml

helmCharts:
  - {name: oya-mail-postfix,    valuesFile: ../../helm/postfix/values.yaml,    releaseName: postfix,    namespace: mail}
  - {name: oya-mail-dovecot,    valuesFile: ../../helm/dovecot/values.yaml,    releaseName: dovecot,    namespace: mail}
  - {name: oya-mail-stalwart,   valuesFile: ../../helm/stalwart/values.yaml,   releaseName: stalwart,   namespace: mail}
  - {name: oya-mail-postgres,   valuesFile: ../../helm/postgres/values.yaml,   releaseName: postgres,   namespace: mail}
  - {name: oya-mail-rspamd,     valuesFile: ../../helm/rspamd/values.yaml,     releaseName: rspamd,     namespace: mail}
  - {name: oya-mail-tantivy,    valuesFile: ../../helm/tantivy/values.yaml,    releaseName: tantivy,    namespace: mail}

commonLabels:
  app.kubernetes.io/part-of: oya-mail
  oyatie/microservice: mail
