# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-us-healthcare — HIPAA overlay
# Per IP-015 (subsequent pack rollout) + compliance.md
namespace: mail

resources:
  - ../../base

patches:
  - target: {kind: ConfigMap, name: mail-retention-policy-config}
    patch: |-
      - op: replace
        path: /data/phi_floor_days
        value: "2190"   # 6y per HIPAA §164.316(b)(2)
      - op: replace
        path: /data/audit_log_floor_days
        value: "2190"   # 6y
  - target: {kind: Deployment, name: mail-mailbox-store-app}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_HIPAA_BAA_REQUIRED, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_S3_OBJECT_LOCK, value: "compliance"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_DEK_HSM_BACKED, value: "true"}

commonLabels:
  oyatie/pack: us-healthcare
  compliance/hipaa: conditional
  compliance/baa-required: "true"
