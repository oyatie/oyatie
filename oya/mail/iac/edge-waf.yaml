# Edge WAF + bot-management config — mail µservice
# Authority: ADR-0297; ADR-0273
# UX-floor: ≤2ms default-path latency.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: mail-edge-waf
  namespace: mail
spec:
  routes:
    - path: /jmap/*
      action: jmap
      rate_limit:
        per_ip_per_minute: 600
        per_tenant_per_minute_default: 6000
        per_tenant_per_minute_tier_1: 60000
        per_tenant_per_minute_tier_2: 600000
        burst_multiplier: 1.5
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        legacy_client_fingerprints:
          - thunderbird-jmap
          - apple-mail-jmap
    - path: /jmap/signup
      action: signup
      rate_limit:
        per_ip_per_minute: 5
        per_tenant_per_minute_default: 60
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 80
        challenge_provider: turnstile
    - path: /jmap/password-reset
      action: password_reset
      rate_limit:
        per_ip_per_minute: 5
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 80
        challenge_provider: turnstile
    - path: /imap
      action: imap
      rate_limit:
        per_ip_per_minute: 200
      bot_management:
        mode: passive_score_no_challenge  # IMAP clients can't render CAPTCHA
    - path: /smtp
      action: smtp
      rate_limit:
        per_ip_per_minute: 200
      bot_management:
        mode: passive_score_no_challenge

  smtp_anti_phishing:
    dkim_required: true
    spf_required: true
    dmarc_enforce_p_reject: true
    arc_validate: true
    bimi_lookup: true
    url_reputation_provider: openbao://mail/url-reputation-api-key

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  audit:
    emit_class_block: oya.mail.abuse-defence-block
    emit_class_allow: oya.mail.abuse-defence-allow
    emit_class_phishing: oya.mail.anti-phishing-block
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
    false_positive_metric: oya_mail_abuse_defence_false_positive_rate
