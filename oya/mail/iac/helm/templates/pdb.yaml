apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.global.podDisruptionBudget.minAvailable | default "50%" }}
  selector:
    matchLabels:
      oyatie/bc: {{ .Values.bc }}
      oyatie/layer: {{ .Values.layer }}
