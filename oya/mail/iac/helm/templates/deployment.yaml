apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "oya-mail.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    oyatie/microservice: mail
    oyatie/bc: {{ .Values.bc }}
    oyatie/layer: {{ .Values.layer }}
    oyatie/pack: {{ .Values.global.pack }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oya-mail.name" . }}
      oyatie/bc: {{ .Values.bc }}
      oyatie/layer: {{ .Values.layer }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oya-mail.name" . }}
        oyatie/bc: {{ .Values.bc }}
        oyatie/layer: {{ .Values.layer }}
        oyatie/pack: {{ .Values.global.pack }}
      annotations:
        linkerd.io/inject: enabled
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: "{{ .Values.global.imageRegistry }}/oya-mail-{{ .Values.bc }}-{{ .Values.layer }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9000
            - name: metrics
              containerPort: 9090
          env:
            - name: OYA_PACK
              value: {{ .Values.global.pack | quote }}
            - name: OYA_BC
              value: {{ .Values.bc | quote }}
            - name: OYA_LAYER
              value: {{ .Values.layer | quote }}
            - name: RUST_LOG
              value: "info,oya_mail=debug"
          envFrom:
            - secretRef:
                name: openbao-bridged-{{ .Values.bc }}-{{ .Values.layer }}
          resources:
            {{- include "oya.resourceRequests" (dict "tier" (.Values.resourceTier | default "S")) | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              oyatie/bc: {{ .Values.bc }}
              oyatie/layer: {{ .Values.layer }}
