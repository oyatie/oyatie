apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-warehouse-default-deny
spec:
  podSelector:
    matchLabels:
      app: oya-warehouse
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oya-ingress: "true"
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              oya-substrate: "true"
