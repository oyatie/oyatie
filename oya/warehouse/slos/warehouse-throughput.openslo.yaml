apiVersion: openslo/v1
kind: SLO
metadata:
  name: warehouse-throughput
  labels:
    service: warehouse
    sap_code: "EWM"
spec:
  description: "Warehouse warehouse-throughput objective; benchmarks SAP EWM Extended Warehouse Management | Oracle Fusion Warehouse Management | Workday inventory-operations counterpart | NetSuite WMS | Microsoft Dynamics 365 Warehouse Management"
  service: warehouse
  indicator:
    metadata:
      name: warehouse-throughput-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_warehouse_accepted_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_warehouse_received_total[5m]))"
  objectives:
    - displayName: warehouse-throughput
      target: 0.995
