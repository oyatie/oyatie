apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-ontology-share-token-kernel
  namespace: ontology
spec:
  microservice: ontology
  bounded_context: cross-tenant-projection
  layer: kernel
  language: rust
  binding_adrs:
    - ADR-0257
    - ADR-0244
  state_machine_states:
    - ISSUED
    - ACTIVE
    - REVOKED
    - EXPIRED
    - TERMINATED
  ttl_cap_seconds: 7776000  # 90 days
  emits_audit_classes:
    - oya.ontology.share-token-issue
    - oya.ontology.share-token-redeem
    - oya.ontology.share-token-revoke
    - oya.ontology.cross-tenant-projection-refused
  cedar_fragment: policy/cross-tenant-refusal.cedar
