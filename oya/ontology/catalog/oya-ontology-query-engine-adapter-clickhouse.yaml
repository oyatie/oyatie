# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
apiVersion: catalog.oya.dev/v1
kind: Crate
metadata:
  name: oya-ontology-query-engine-adapter-clickhouse
  microservice: ontology
  bounded_context: query-engine
  layer: adapter
  backend: clickhouse
  status: pending
spec:
