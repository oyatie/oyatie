    microservice = ontology; bc-tokens = query-engine; layer = adapter-clickhouse
    (per ADR-0105 Amendment 3). 3-layer Knowledge Graph OLAP read implementation
    over ClickHouse history-mirror with per-tenant row-policy enforcement.
  imports: [oya-ontology-query-engine-usecase, oya-ontology-query-engine-domain,
            oya-ontology-query-engine-kernel]
  external_deps: [clickhouse-rs]
  related_ip: IP-011
  related_adrs: [ADR-0105]
