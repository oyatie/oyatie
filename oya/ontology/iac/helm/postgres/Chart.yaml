# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: ontology-postgres
description: |
  Postgres 16 + Citus 12 sharded by tenant_id for the oyatie Ontology µservice.
  Enforces FORCE ROW LEVEL SECURITY on every Object Type table; per-tenant
  Postgres role issued by OpenBao; PITR via WAL-archiving; replication factor 3
  with streaming logical replication to DR-pair where applicable.
version: 1.0.0
appVersion: "16.6"
type: application
home: https://oyatie.com/microservices/ontology
sources:
  - https://github.com/oyatie/oyatie
keywords:
  - ontology
  - postgres
  - citus
  - rls
  - oyatie
maintainers:
  - name: axis-ontology
    email: axis-ontology@oyatie.com
  - name: cloud-iac
    email: cloud-iac@oyatie.com
dependencies:
  - name: postgresql
    version: "16.6.x"
    repository: https://charts.bitnami.com/bitnami
    alias: postgres-base
  - name: citus
    version: "12.1.x"
    repository: https://charts.citusdata.com/
annotations:
  artifacthub.io/license: AGPL-3.0
  oyatie.dev/related-adrs: ADR-0006,ADR-0018,ADR-0050,ADR-0106,ADR-0117,ADR-0131
  oyatie.dev/runbook: runbooks/postgres-citus-coordinator-restart.md
