# PQC hybrid cert config — X25519MLKEM768 + ed25519+ml_dsa_65
# Authority: ADR-0253 row-12 PQC; documentation-rigor.md §3.2.1 row-12

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ontology-pqc-hybrid
  namespace: ontology
spec:
  secretName: ontology-pqc-hybrid-tls
  issuerRef:
    name: oyatie-rooted-ca-pqc
    kind: ClusterIssuer
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: hybrid
    classical: ed25519
    pqc: ml_dsa_65
  dnsNames:
    - ontology.oyatie.example
    - ontology-agent-gateway.oyatie.example
  usages:
    - server auth
    - client auth
  tls_negotiation:
    kem_hybrid:
      preferred: X25519MLKEM768
      fallback_classical:
        - X25519
        - P-256
    signature_hybrid:
      preferred: ed25519+ml_dsa_65
      fallback_classical:
        - ed25519
        - ecdsa_secp256r1_sha256
    ux_floor:
      refuse_session_if_peer_lacks_pqc: false  # Graceful degradation per ADR-0253
      refuse_session_if_peer_lacks_ech: false
  audit:
    emit_class: oya.ontology.pqc-handshake-outcome
