# Encrypted Client Hello config (RFC 9460 + draft-ietf-tls-esni-22)
# Authority: ADR-0253 row-12 ECH; documentation-rigor.md §3.2.1 row-12
# Rotated every 90 days per docs/runbooks/cedar-fragment-emergency-rollback.md cadence.

apiVersion: config.k8s.oya/v1
kind: ECHConfig
metadata:
  name: ontology-ech-config
  namespace: ontology
spec:
  enabled: true
  rotation_cadence_days: 90
  publish_https_rr: true
  dns_provider: cloudflare
  config_ids:
    - id: 01
      public_name: ontology.oyatie.example
      kem: x25519-kyber768
      kdf: hkdf-sha256
      aead: aes-256-gcm
      created_at: 2026-05-20T00:00:00Z
      expires_at: 2026-08-18T00:00:00Z
      status: ACTIVE
    - id: 02
      public_name: ontology.oyatie.example
      kem: x25519-kyber768
      kdf: hkdf-sha256
      aead: aes-256-gcm
      created_at: 2026-04-21T00:00:00Z
      expires_at: 2026-07-20T00:00:00Z
      status: GRACE_PERIOD
  fallback:
    standard_tls_13: enabled
    refuse_session_if_no_ech: false  # UX-floor: never refuse session due to peer ECH-disabled
  metrics:
    emit_class: oya.ontology.ech-handshake-outcome
    cardinality_budget: 1000
