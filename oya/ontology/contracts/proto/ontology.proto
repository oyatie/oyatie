// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// Ontology µservice gRPC contracts.
//
// Mirrors the REST surface in contracts/openapi/ontology.yaml + the async surface
// in contracts/asyncapi/ontology-events.yaml. Used by:
//   - Workflow µservice (peer adapter; consumes Ontology Functions via gRPC for
//     low-latency typed reads inside Workflow state machines)
//   - Internal workload SDKs (Rust + future TS/Python via tonic/protoc) for in-cluster callers
//   - Internal cross-pod calls (mTLS over Istio)

syntax = "proto3";

package oya.ontology.v1;

option go_package = "oyatie.dev/ontology/v1;ontologyv1";
option csharp_namespace = "Oya.Ontology.V1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// Common types
// =============================================================================

enum PillarKind {
  PILLAR_KIND_UNSPECIFIED = 0;
  PILLAR_KIND_ORG = 1;
  PILLAR_KIND_PERSON = 2;
}

enum PropertyTier {
  PROPERTY_TIER_UNSPECIFIED = 0;
  PROPERTY_TIER_TIER1_SENSITIVE = 1;
  PROPERTY_TIER_TIER2_RESTRICTED = 2;
  PROPERTY_TIER_TIER3_INTERNAL = 3;
  PROPERTY_TIER_TIER4_PUBLIC = 4;
}

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  PROPERTY_TYPE_SCALAR = 1;
  PROPERTY_TYPE_VECTOR = 2;
  PROPERTY_TYPE_TIMESERIES = 3;
  PROPERTY_TYPE_GEO = 4;
  PROPERTY_TYPE_CIPHERTEXT = 5;
  PROPERTY_TYPE_STRUCT = 6;
}

enum ActionEffect {
  ACTION_EFFECT_UNSPECIFIED = 0;
  ACTION_EFFECT_WRITE_OBJECT = 1;
  ACTION_EFFECT_WRITE_LINK = 2;
  ACTION_EFFECT_SIDE_EFFECT_EXTERNAL = 3;
  ACTION_EFFECT_EMIT_EVENT = 4;
}

enum AutonomyTier {
  AUTONOMY_TIER_UNSPECIFIED = 0;
  AUTONOMY_TIER_OBSERVATION = 1;
  AUTONOMY_TIER_RECOMMENDATION = 2;
  AUTONOMY_TIER_ACTION = 3;
  AUTONOMY_TIER_FULL_AUTONOMY = 4;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_SUCCESS = 1;
  OUTCOME_DENIED = 2;
  OUTCOME_ERROR = 3;
}

message PropertyDescriptor {
  string name = 1;
  PropertyType type = 2;
  PropertyTier property_tier = 3;
  string data_class = 4;
  string index_strategy = 5;
  bool nullable = 6;
}

message ObjectTypeSchema {
  string name = 1;
  PillarKind pillar_kind = 2;
  repeated PropertyDescriptor properties = 3;
  int32 schema_version = 4;
  map<string, JurisdictionOverlay> jurisdiction_overlay = 5;
  bool deprecated = 6;
  google.protobuf.Timestamp deprecated_at = 7;
  string successor = 8;
}

message JurisdictionOverlay {
  repeated PropertyDescriptor properties = 1;
}

message LinkTypeSchema {
  string name = 1;
  string src_object_type = 2;
  string dst_object_type = 3;
  string cardinality = 4;  // one-to-one | one-to-many | many-to-many
  string traversal_direction = 5;
  string tenant_scope = 6;  // same-tenant-only | cross-tenant-allowed-with-grant
}

message ActionTypeSchema {
  string name = 1;
  repeated ActionEffect effects = 2;
  string idempotency = 3;  // required | optional | not_supported
  PropertyTier required_tier = 4;
  string cedar_fragment = 5;
  bool audit_emission = 6;
  AutonomyTier autonomy_tier_ceiling = 7;
}

message FunctionTypeSchema {
  string name = 1;
  string query_dsl = 2;
  google.protobuf.Struct result_shape = 3;
  int32 cache_ttl_seconds = 4;
  int32 max_memory_projection_mb = 5;
  bool olap = 6;
}

message ObjectInstance {
  string object_id = 1;
  string object_type = 2;
  string tenant_id = 3;
  string jurisdiction = 4;
  PillarKind pillar_kind = 5;
  PropertyTier property_tier = 6;
  google.protobuf.Struct properties = 7;
  int32 schema_version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string audit_chain_ref = 11;
}

message LinkInstance {
  string link_id = 1;
  string link_type = 2;
  string src_object_id = 3;
  string dst_object_id = 4;
  string src_tenant_id = 5;
  string dst_tenant_id = 6;
  string cross_tenant_grant_id = 7;
  google.protobuf.Timestamp created_at = 8;
  string audit_chain_ref = 9;
}

message ActionInvocationReceipt {
  string action_id = 1;
  string action_type = 2;
  string tenant_id = 3;
  string actor_principal = 4;
  repeated string object_ids = 5;
  repeated string link_ids = 6;
  string idempotency_key = 7;
  Outcome outcome = 8;
  string denial_reason = 9;
  google.protobuf.Timestamp executed_at = 10;
  string cedar_decision_ref = 11;
  string audit_chain_ref = 12;
  AutonomyTier autonomy_tier_used = 13;
}

message FunctionResult {
  string function_type = 1;
  string tenant_id = 2;
  repeated google.protobuf.Struct result = 3;
  int32 result_count = 4;
  bool cached = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  string evaluator_version = 7;
  double olap_lag_seconds = 8;
}

message MerkleSealRecord {
  string tenant_id = 1;
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  string merkle_root = 4;
  string signature = 5;
  string signer_key_id = 6;
  google.protobuf.Timestamp sealed_at = 7;
  int32 event_count = 8;
}

// =============================================================================
// Services
// =============================================================================

service ObjectTypeRegistryService {
  rpc ListObjectTypes(ListObjectTypesRequest) returns (ListObjectTypesResponse);
  rpc GetObjectType(GetObjectTypeRequest) returns (ObjectTypeSchema);
  rpc RegisterObjectType(ObjectTypeSchema) returns (ObjectTypeSchema);
  rpc UpdateObjectType(ObjectTypeSchema) returns (ObjectTypeSchema);
}

service EntityStoreService {
  rpc CreateObjectInstance(CreateObjectInstanceRequest) returns (ObjectInstance);
  rpc GetObjectInstance(GetObjectInstanceRequest) returns (ObjectInstance);
  rpc UpdateObjectInstance(UpdateObjectInstanceRequest) returns (ObjectInstance);
  rpc TombstoneObjectInstance(TombstoneObjectInstanceRequest) returns (google.protobuf.Empty);
  rpc ListObjectInstances(ListObjectInstancesRequest) returns (stream ObjectInstance);
}

service LinkStoreService {
  rpc CreateLinkInstance(CreateLinkInstanceRequest) returns (LinkInstance);
  rpc TraverseLink(TraverseLinkRequest) returns (stream ObjectInstance);
}

service ActionEngineService {
  rpc InvokeAction(InvokeActionRequest) returns (ActionInvocationReceipt);
  rpc GetActionReceipt(GetActionReceiptRequest) returns (ActionInvocationReceipt);
}

service FunctionEngineService {
  rpc EvaluateFunction(EvaluateFunctionRequest) returns (FunctionResult);
}

service AgentGatewayService {
  rpc ListToolSpecs(ListToolSpecsRequest) returns (ListToolSpecsResponse);
  rpc InvokeToolCall(InvokeToolCallRequest) returns (FunctionResult);
}

service AuditChainService {
  rpc GetMerkleRoot(GetMerkleRootRequest) returns (MerkleSealRecord);
  rpc VerifyMerkleProof(VerifyMerkleProofRequest) returns (VerifyMerkleProofResponse);
}

// =============================================================================
// Request / Response messages
// =============================================================================

message ListObjectTypesRequest {
  string tenant_id = 1;
}

message ListObjectTypesResponse {
  repeated ObjectTypeSchema schemas = 1;
}

message GetObjectTypeRequest {
  string tenant_id = 1;
  string object_type = 2;
}

message CreateObjectInstanceRequest {
  string tenant_id = 1;
  string object_type = 2;
  google.protobuf.Struct properties = 3;
  string idempotency_key = 4;
}

message GetObjectInstanceRequest {
  string tenant_id = 1;
  string object_type = 2;
  string object_id = 3;
}

message UpdateObjectInstanceRequest {
  string tenant_id = 1;
  string object_type = 2;
  string object_id = 3;
  google.protobuf.Struct properties_diff = 4;
  string idempotency_key = 5;
}

message TombstoneObjectInstanceRequest {
  string tenant_id = 1;
  string object_type = 2;
  string object_id = 3;
  string dsr_request_id = 4;
}

message ListObjectInstancesRequest {
  string tenant_id = 1;
  string object_type = 2;
  int32 limit = 3;
  string cursor = 4;
}

message CreateLinkInstanceRequest {
  string tenant_id = 1;
  string link_type = 2;
  string src_object_id = 3;
  string dst_object_id = 4;
  string cross_tenant_grant_id = 5;
  string idempotency_key = 6;
}

message TraverseLinkRequest {
  string tenant_id = 1;
  string link_type = 2;
  string src_object_id = 3;
  int32 depth = 4;
}

message InvokeActionRequest {
  string tenant_id = 1;
  string action_type = 2;
  google.protobuf.Struct arguments = 3;
  string idempotency_key = 4;
}

message GetActionReceiptRequest {
  string tenant_id = 1;
  string action_id = 2;
}

message EvaluateFunctionRequest {
  string tenant_id = 1;
  string function_type = 2;
  google.protobuf.Struct arguments = 3;
  bool use_olap = 4;
}

message ListToolSpecsRequest {
  string tenant_id = 1;
  AutonomyTier autonomy_tier = 2;
}

message ListToolSpecsResponse {
  repeated AgentToolSpec tool_specs = 1;
}

message AgentToolSpec {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
  string function_type = 4;
  AutonomyTier autonomy_tier_required = 5;
}

message InvokeToolCallRequest {
  string tool_name = 1;
  google.protobuf.Struct arguments = 2;
  string session_id = 3;
  string idempotency_key = 4;
}

message GetMerkleRootRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp period = 2;
}

message VerifyMerkleProofRequest {
  string tenant_id = 1;
  string event_id = 2;
  repeated string merkle_path = 3;
  string merkle_root = 4;
}

message VerifyMerkleProofResponse {
  bool valid = 1;
  string reason = 2;
}
