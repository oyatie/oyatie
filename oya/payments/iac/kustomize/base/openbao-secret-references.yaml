# OpenBao secret references for payments namespace
# ADR-0296: library-first credential sidecar; TTL ≤60s
# These ConfigMaps tell the OpenBao agent injector which secret paths to mount.
# Actual secret values are NEVER in this file — only paths.

apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-openbao-secret-paths
  namespace: payments
  annotations:
    oyatie/adrs: "ADR-0296"
    oyatie/pci-req: "3,7"
data:
  # PSP credential path template — rendered at runtime with tenant_id
  psp_stripe_path_template: "secret/data/{{ .TenantId }}/payments/stripe/secret_key"
  psp_adyen_path_template: "secret/data/{{ .TenantId }}/payments/adyen/api_key"
  psp_toss_path_template: "secret/data/{{ .TenantId }}/payments/toss/secret_key"
  psp_kakaopay_path_template: "secret/data/{{ .TenantId }}/payments/kakaopay/secret_key"
  psp_linepay_path_template: "secret/data/{{ .TenantId }}/payments/line-pay/channel_secret"

  # Webhook HMAC paths (static — not per-tenant)
  webhook_hmac_stripe_path: "secret/data/payments/webhook-hmac/stripe"
  webhook_hmac_adyen_path: "secret/data/payments/webhook-hmac/adyen"
  webhook_hmac_toss_path: "secret/data/payments/webhook-hmac/toss"

  # CRDB credentials path
  crdb_url_path: "secret/data/payments/crdb"

  # ECH config path
  ech_config_path: "secret/data/payments/ech-config"

  # Sidecar TTL (always ≤60s per ADR-0296)
  sidecar_ttl: "60s"
