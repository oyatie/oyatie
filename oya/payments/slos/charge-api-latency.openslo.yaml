# Canonical-base: specs/openslo/canonical-envelope-schema.json (per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-payments-charge-api-latency
  displayName: "payments: charge-API latency p99 ≤ 500ms"
  labels:
    microservice: payments
    bounded_context: charge
    sli_class: latency
    tier: substrate-hero
    plane: data
    owner_team: axis-payments
    pack_scope: all
spec:
  service: payments
  description: |
    p99 charge-API latency ≤ 500ms. SLI is the share of requests that complete
    within 500ms over a 5m rolling window. Excludes intentional 4xx-decline path.
  indicator:
    metadata:
      name: payments-charge-api-latency-under-500ms-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_charge_latency_ms_bucket{le="500"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(payments_charge_latency_ms_count[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling p99 latency ≤ 500ms"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
