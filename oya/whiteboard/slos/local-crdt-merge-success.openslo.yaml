apiVersion: openslo/v1
kind: SLO
metadata:
  name: whiteboard-crdt-merge-success
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: whiteboard
  description: CRDT merges complete without conflict loss for real-time board collaboration, cursor presence, stroke persistence, CRDT merge, export rendering, and board loading operations.
  indicator:
    metadata:
      name: crdt-merge-success
      labels:
        domain_object: WhiteboardSession
        operator_audience: WORKSPACE_COLLABORATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_crdt_merge_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_crdt_merge_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: CRDT merges complete without conflict loss
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
