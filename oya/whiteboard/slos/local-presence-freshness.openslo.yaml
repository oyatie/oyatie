apiVersion: openslo/v1
kind: SLO
metadata:
  name: whiteboard-presence-freshness
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: whiteboard
  description: Collaborator presence freshness for real-time board collaboration, cursor presence, stroke persistence, CRDT merge, export rendering, and board loading operations.
  indicator:
    metadata:
      name: presence-freshness
      labels:
        domain_object: WhiteboardSession
        operator_audience: WORKSPACE_COLLABORATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_presence_freshness_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_presence_freshness_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Collaborator presence freshness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
