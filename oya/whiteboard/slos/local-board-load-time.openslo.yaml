apiVersion: openslo/v1
kind: SLO
metadata:
  name: whiteboard-board-load-time
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: whiteboard
  description: Board load time for active canvases for real-time board collaboration, cursor presence, stroke persistence, CRDT merge, export rendering, and board loading operations.
  indicator:
    metadata:
      name: board-load-time
      labels:
        domain_object: WhiteboardSession
        operator_audience: WORKSPACE_COLLABORATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_board_load_time_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_board_load_time_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Board load time for active canvases
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
