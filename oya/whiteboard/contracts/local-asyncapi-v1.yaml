asyncapi: 3.1.0
info:
  title: Whiteboard Local Operational Events
  version: 1.0.0
  description: Events for real-time board collaboration, cursor presence, stroke persistence, CRDT merge, export rendering, and board loading operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  whiteboard.local-ops.v1:
    address: whiteboard.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/whiteboard.local-ops.v1'
    messages:
      - $ref: '#/channels/whiteboard.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/whiteboard.local-ops.v1'
    messages:
      - $ref: '#/channels/whiteboard.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: WhiteboardDomainEvent
      title: Whiteboard domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['board.opened', 'cursor.broadcasted', 'stroke.persisted', 'crdt.merge.applied'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['board_state', 'cursor_presence', 'stroke_event', 'shape_object', 'export_render', 'collaboration_acl'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: WhiteboardSloBurnEvent
      title: Whiteboard SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'whiteboard' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'board.opened' }
