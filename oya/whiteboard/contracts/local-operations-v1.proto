// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.whiteboard.local.v1;

message WhiteboardLocalPolicyCheckRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string resource_id = 3;
  string requested_action = 4;
  string data_class = 5;
  string purpose = 6;
  string audit_event_class = 7;
}

message WhiteboardLocalPolicyDecision {
  string decision = 1;
  string policy_file = 2;
  string audit_event_id = 3;
  string denied_reason = 4;
}

message WhiteboardLocalSloStateRequest {
  string tenant_id = 1;
  string resource_id = 2;
  string slo_name = 3;
}

message WhiteboardLocalSloState {
  string service = 1;
  string slo_name = 2;
  string window = 3;
  double objective = 4;
  double current_value = 5;
  double burn_rate = 6;
}

message WhiteboardSupportedActions {
  string board_open_action = 1;
  string cursor_broadcast_action = 2;
  string stroke_persist_action = 3;
  string shape_update_action = 4;
  string crdt_merge_action = 5;
  string board_export_action = 6;
}

service WhiteboardLocalOperationsService {
  rpc CheckLocalPolicy(WhiteboardLocalPolicyCheckRequest) returns (WhiteboardLocalPolicyDecision);
  rpc GetLocalSloState(WhiteboardLocalSloStateRequest) returns (WhiteboardLocalSloState);
}
