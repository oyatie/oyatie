apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: whiteboard-local-openbao-binding
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: whiteboard-local-ops
  vaultPath: kv/whiteboard/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: whiteboard.local-ops.v1
  requiredFor:
    - cursor-relay
    - stroke-writer
