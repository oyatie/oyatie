apiVersion: oyatie.dev/v1
kind: DrFailover
metadata:
  name: whiteboard-dr-failover
  labels:
    service: whiteboard
    binding_adr: ADR-0253-amendment
spec:
  service: whiteboard
  tenantScoped: true
  audienceType: COLLABORATION_USER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/canvas-collaboration-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Miro", "Mural", "Figma FigJam", "Lucid"]
