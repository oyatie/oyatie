microservice:
  id: whiteboard
  cargoPackage: oya-whiteboard-canvas-collaboration-app
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: runc

serviceAccount:
  name: oya-whiteboard

image:
  registry: registry.oyatie.dev
  repository: oya-whiteboard
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-whiteboard-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    permit(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class == "{{ .Values.microservice.tenantClass }}"
    };

    forbid(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class != "{{ .Values.microservice.tenantClass }}"
    };

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
