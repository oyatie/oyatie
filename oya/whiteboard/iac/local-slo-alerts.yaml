apiVersion: oyatie.dev/v1
kind: SloAlertPolicy
metadata:
  name: whiteboard-local-alerts
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: whiteboard
  burnWindows:
    - short: 5m
      long: 1h
      pageAt: 4
    - short: 30m
      long: 6h
      pageAt: 2
  runbooks:
    - microservices/whiteboard/runbooks/local-cursor-latency-burn.md
    - microservices/whiteboard/runbooks/local-stroke-persistence-lag.md
