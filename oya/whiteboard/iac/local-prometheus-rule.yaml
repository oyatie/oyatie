apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: whiteboard-local-slo-burn
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: whiteboard.local.slo
      rules:
        - alert: WhiteboardLocalSloBurn
          expr: (sum(rate(oya_whiteboard_cursor_latency_good_total[5m])) / sum(rate(oya_whiteboard_cursor_latency_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: whiteboard
          annotations:
            summary: Whiteboard cursor-latency burn
            runbook: microservices/whiteboard/runbooks/local-cursor-latency-burn.md
