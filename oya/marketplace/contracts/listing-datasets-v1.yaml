# Marketplace category-datasets listing surface — extends DealSetCommand envelope (ADR-0249 KS#11)
openapi: 3.2.0
info:
  title: Marketplace Datasets Category API
  version: 1.0.0
  description: Per-ADR-0249 dataset-category listing surface for signed-URL distribution with provenance + SBOM.
paths:
  /marketplace/categories/datasets/listings:
    post:
      operationId: DatasetListingPublish
      x-cedar-action: marketplace.category-datasets.listing.publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetListingPublishCommand'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
  /marketplace/categories/datasets/listings/{listing_id}/entitlement:
    post:
      operationId: DatasetEntitlementGrant
      x-cedar-action: marketplace.category-datasets.entitlement.grant
      parameters:
        - name: listing_id
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: Signed-URL dataset access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetEntitlement'
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: marketplace
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  schemas:
    DatasetListingPublishCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, audit_chain_ref, tenant_class,
                 revenue_share_cohort_id, title, description, dataset_class, data_format,
                 size_band, sensitivity_class, provenance_class, schema_signature,
                 sample_artifact_signature, datasheet_ref, sbom_ref,
                 revenue_share_rate_basis_points, pricing_model, kyc_artifact_ref, license_ref]
      properties:
        tenant_id: { type: string, format: ulid }
        sub_scope_path: { type: string }
        principal_id: { type: string }
        audit_chain_ref: { type: string }
        tenant_class: { type: string, enum: [paid] }
        revenue_share_cohort_id: { type: string }
        title: { type: string, minLength: 4, maxLength: 128 }
        description: { type: string, maxLength: 65535 }
        dataset_class: { type: string, enum: [tabular, image, audio, video, text-corpus, embeddings, time-series, geospatial, graph] }
        data_format: { type: string, enum: [parquet, csv, jsonl, arrow, hdf5, tfrecord, webdataset] }
        size_band: { type: string, enum: [under-1gb, 1-100gb, 100gb-1tb, 1tb-100tb, over-100tb] }
        sensitivity_class: { type: string, enum: [public, business, pii, phi, financial, sovereign-restricted] }
        provenance_class: { type: string, enum: [first-party-collected, licensed, public-domain, synthetic, scraped, mixed] }
        schema_signature: { type: string, description: 'BLAKE3 over schema definition' }
        sample_artifact_signature: { type: string }
        datasheet_ref: { type: string, description: 'Gebru-style datasheet FK' }
        sbom_ref: { type: string }
        revenue_share_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        pricing_model: { type: string, enum: [free, one_time, subscription, usage_based, tiered, private_offer, contract] }
        kyc_artifact_ref: { type: string }
        license_ref: { type: string }
        dpia_ref: { type: string }
        retention_policy_ref: { type: string }
        jurisdiction_pinning: { type: string }
    DatasetEntitlement:
      type: object
      required: [listing_id, signed_url, signature, expires_at, sbom_evidence_ref, audit_chain_seal_id]
      properties:
        listing_id: { type: string, format: ulid }
        signed_url: { type: string, format: uri }
        signature: { type: string }
        expires_at: { type: string, format: date-time }
        sbom_evidence_ref: { type: string }
        audit_chain_seal_id: { type: string }
    DealSetReceipt:
      type: object
      properties:
        listing_id: { type: string }
        decision: { type: string }
        evidence_ref: { type: string }
        state: { type: string }
