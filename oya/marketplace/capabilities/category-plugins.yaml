schema_version: 2
name: category-plugins
microservice: marketplace
category: plugins
risk_class: moderate
description: Marketplace category surface for plugin listings (Wasmtime signed-binary plugins) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-plugins.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - runtime: [wasmtime, wasi-preview2, wasi-preview3]
    - language: [rust, c, cpp, go-tinygo, assemblyscript]
    - extension_point: [pre-tool, post-tool, prompt-submit, session-start, session-end, error-recovery]
    - permission_class: [read-only, read-write, network, filesystem, secret-access]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id           # ulid
    - tenant_id            # FK cloud-iam tenants
    - title                # 4..128 unicode
    - description          # markdown <= 65535
    - runtime              # facets.runtime
    - permission_class     # facets.permission_class
    - artifact_signature   # ed25519 over BLAKE3 of wasm bytes
    - sbom_ref             # FK supply-chain SBOM
    - revenue_share_rate_basis_points  # default 1500 (15%); override per contract
    - tenant_class_required            # paid | demo_trial-sandbox
  optional_fields:
    - depends_on_listings  # listing_id[] (composition)
    - license_spdx
    - kyc_artifact_ref     # FK identity for paid listings
review_process:
  reviewer_role: marketplace_reviewer
  required_checks:
    - cedar_policy_compile_check
    - wasm_validator_pass
    - sbom_presence
    - artifact_signature_verify
    - sanctions_screen_pass
  automated: true
  manual_review_required_above_basis_points: 5000   # >50% rev share requires human
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based
  - private_offer
revenue_share_rate_basis_points_default: 1500  # 15%
entitlement_delivery:
  type: wasmtime_signed_binary_fetch
  delivery_envelope: contracts/listing-plugins-v1.yaml#PluginEntitlement
  binding_µservice: foundry-plugin-registry
sla_tier: contractual
compliance_requirements:
  required_packs: []   # base SOC2 only
  conditional_packs:
    - if_processes_pii: [GDPR, DPDPA]
    - if_eu_distribution: [EU-AI-Act-low-risk-only]
counterpart_reference:
  aws_marketplace: "AMI + container image (closest proxy)"
  appexchange: "Components / Lightning Web Components"
  atlassian_marketplace: "App for Jira/Confluence/Bitbucket"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 5
    max_listings: 10
    max_pending_transactions: 0
    payouts_enabled: false
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
observability:
  metric: oya_marketplace_category_plugins_listing_total
  trace: marketplace.category-plugins.listing
  audit_event: MarketplaceCategoryPluginsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
