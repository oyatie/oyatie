schema_version: 2
name: category-apps
microservice: marketplace
category: apps
risk_class: high
description: Marketplace category surface for app listings (SaaS / container / managed-tenant apps) per ADR-0249 KS#11
related_adrs:
  - ADR-0105
  - ADR-0131
  - ADR-0243
  - ADR-0244
  - ADR-0249
  - ADR-0263
  - ADR-0314
  - ADR-0329
  - ADR-0330
  - ADR-0331
naming_justifications:
  bnf_v4: "marketplace.category-apps.listing"
  layer_enum: "12-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, worker, cli, sdk, api"
taxonomy:
  facets:
    - delivery_mode: [saas-hosted-tenant, byo-cluster-container, ami-image, mcp-server]
    - integration_surface: [rest, grpc, mcp, async-events]
    - target_domain: [healthcare, finance, ecommerce, devtools, productivity, supply-chain]
    - data_residency: [tenant_local, multi_region, region_pinned]
  tags_max: 32
listing_schema:
  required_fields:
    - listing_id
    - tenant_id
    - title
    - description
    - delivery_mode
    - integration_surface
    - target_domain
    - container_image_signature    # cosign over OCI digest (when delivery_mode=byo-cluster-container)
    - mcp_server_manifest_ref      # FK mcp registry (when delivery_mode=mcp-server)
    - sbom_ref
    - revenue_share_rate_basis_points  # default 2000 (20%)
    - tenant_class_required
    - kyc_artifact_ref
    - terms_of_service_ref
  optional_fields:
    - dpia_ref                     # required when target_domain in {healthcare, finance}
    - sla_addendum_ref
    - private_offer_terms_ref
review_process:
  reviewer_role: marketplace_reviewer_apps
  required_checks:
    - cedar_policy_compile_check
    - container_signature_verify
    - sbom_presence
    - sanctions_screen_pass
    - security_review_pass
    - data_residency_attestation
  automated: false
  manual_review_required_above_basis_points: 5000
pricing_models_allowed:
  - free
  - one_time
  - subscription
  - usage_based
  - tiered
  - private_offer
  - contract
revenue_share_rate_basis_points_default: 2000  # 20% (industry parity AppExchange / AWS Marketplace SaaS)
entitlement_delivery:
  type: container_pull_or_hosted_tenant_provisioning
  delivery_envelope: contracts/listing-apps-v1.yaml#AppEntitlement
  binding_µservice: cloud-cell  # hosted-tenant provisioning via cells substrate
sla_tier: contractual
compliance_requirements:
  required_packs: [SOC2]
  conditional_packs:
    - if_target_domain_healthcare: [HIPAA]
    - if_target_domain_finance: [PCI, SOX]
    - if_eu_distribution: [GDPR, EU-AI-Act-conditional]
    - if_kr_distribution: [CSAP]
counterpart_reference:
  aws_marketplace: "SaaS product / AMI / Container"
  appexchange: "Managed package / App"
  atlassian_marketplace: "App for Jira/Confluence/Bitbucket/JSM"
tenant_class_caps:
  demo_trial:
    rate_per_minute: 2
    max_listings: 1
    max_pending_transactions: 0
    payouts_enabled: false
  paid:
    rate_per_minute: unbounded
    max_listings: unbounded
    payouts_enabled: true
observability:
  metric: oya_marketplace_category_apps_listing_total
  trace: marketplace.category-apps.listing
  audit_event: MarketplaceCategoryAppsListingPublished
inputs:
  - tenant_id
  - sub_scope_path
  - principal_id
  - audit_chain_ref
  - tenant_class
  - revenue_share_cohort_id
outputs:
  - decision
  - evidence_ref
  - listing_id
  - state
