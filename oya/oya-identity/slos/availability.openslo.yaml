# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
# Authoring authority: ADR-0130 agentic SLO-gated promotion + ADR-0139 per-µservice SLO authoring.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-identity-availability
  displayName: "oya-identity: availability 99.95%"
  labels:
    microservice: oya-identity
    bounded_context: identity-substrate
    sli_class: availability
    tier: platform-critical
    plane: identity
    owner_team: axis-identity
spec:
  service: oya-identity
  description: |
    Availability SLO for the oya-identity service. A request is "good" when
    the identity service returns a successful HTTP 2xx response. Per ADR-0476
    bespoke Rust human identity substrate — platform-critical tenant dependency.
  indicator:
    metadata:
      name: oya-identity-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{service="oya-identity",status=~"2.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{service="oya-identity"}[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling availability >= 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
