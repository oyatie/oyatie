apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenant-rbac-latency-p99
  labels:
    service: tenant-rbac
    sap_code: "suite"
spec:
  description: "Tenant RBAC governed API p99 latency objective over router-ready composition routes; production evidence remains unclaimed until runtime telemetry lands."
  service: tenant-rbac
  indicator:
    metadata:
      name: tenant-rbac-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_bucket{service=\"tenant-rbac\",le=\"0.5\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_count{service=\"tenant-rbac\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: tenant-rbac-latency-p99
      target: 0.99
