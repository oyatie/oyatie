asyncapi: 3.1.0
info:
  title: oya-notes events
  version: 1.0.0
  description: |
    AsyncAPI specification for the notes µservice Workflow event surface.
    Personal-tier events carry MINIMAL payloads (opaque note_id + tenant_id + user_id + context_kind + created_at) per ADR-NOTES-0001 + DCI-05 + Inv-E2E-09; never title, body, or tag.
    Professional-tier events carry full structured payloads (title, tag_refs, content_hash, etc.) under tenant-DEK trust boundary.

defaultContentType: application/json

servers:
  ws-per-pack:
    host: notes-{pack}.oyatie.com
    pathname: /ws/v1
    protocol: wss
    description: Per-pack realtime stream
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

channels:
  notes-events:
    address: oya.notes.event.v1
    description: All notes-µservice Workflow events
    messages:
      NoteCreated: {$ref: '#/components/messages/NoteCreated'}
      NoteEdited: {$ref: '#/components/messages/NoteEdited'}
      NoteDeleted: {$ref: '#/components/messages/NoteDeleted'}
      NoteTagged: {$ref: '#/components/messages/NoteTagged'}
      NoteUntagged: {$ref: '#/components/messages/NoteUntagged'}
      BacklinkResolved: {$ref: '#/components/messages/BacklinkResolved'}
      BacklinkBroken: {$ref: '#/components/messages/BacklinkBroken'}
      ChecklistItemEmitted: {$ref: '#/components/messages/ChecklistItemEmitted'}
      ChecklistItemDone: {$ref: '#/components/messages/ChecklistItemDone'}
      ShareLinkCreated: {$ref: '#/components/messages/ShareLinkCreated'}
      ShareLinkRevoked: {$ref: '#/components/messages/ShareLinkRevoked'}
      ShareLinkAccessed: {$ref: '#/components/messages/ShareLinkAccessed'}
      DailyNoteCreated: {$ref: '#/components/messages/DailyNoteCreated'}
      WebClipperCaptured: {$ref: '#/components/messages/WebClipperCaptured'}
      ImportJobCompleted: {$ref: '#/components/messages/ImportJobCompleted'}
      ExportJobCompleted: {$ref: '#/components/messages/ExportJobCompleted'}
      AiAssistInvoked: {$ref: '#/components/messages/AiAssistInvoked'}
      AiAssistResultDelivered: {$ref: '#/components/messages/AiAssistResultDelivered'}
      FourEyesDisclosureExecuted: {$ref: '#/components/messages/FourEyesDisclosureExecuted'}
      MlsEpochAdvanced: {$ref: '#/components/messages/MlsEpochAdvanced'}

operations:
  publish:
    action: send
    channel: {$ref: '#/channels/notes-events'}
    messages:
      - {$ref: '#/channels/notes-events/messages/NoteCreated'}

components:
  schemas:
    PersonalEventEnvelope:
      description: Minimal envelope per DCI-05 + Inv-E2E-09; no body / title / tags
      type: object
      required: [event_id, microservice, tenant_id, user_id, context_kind, occurred_at]
      properties:
        event_id: {type: string, format: ulid}
        microservice: {type: string, const: notes}
        tenant_id: {type: string}
        user_id: {type: string}
        context_kind: {type: string, const: Personal}
        occurred_at: {type: string, format: date-time}
        note_id: {type: string, format: ulid}

    ProfessionalEventEnvelope:
      description: Full envelope for Professional-tier; tenant-DEK trust boundary
      type: object
      required: [event_id, microservice, tenant_id, user_id, context_kind, occurred_at]
      properties:
        event_id: {type: string, format: ulid}
        microservice: {type: string, const: notes}
        tenant_id: {type: string}
        user_id: {type: string}
        context_kind: {type: string, const: Professional}
        occurred_at: {type: string, format: date-time}

  messages:
    NoteCreated:
      name: NoteCreated
      payload:
        oneOf:
          - $ref: '#/components/schemas/PersonalEventEnvelope'
          - allOf:
              - $ref: '#/components/schemas/ProfessionalEventEnvelope'
              - type: object
                required: [note_id, title, content_hash]
                properties:
                  note_id: {type: string, format: ulid}
                  notebook_ref: {type: string, format: ulid, nullable: true}
                  title: {type: string, maxLength: 200}
                  tag_refs: {type: array, items: {type: string, format: ulid}}
                  content_hash: {type: string}
                  data_class: {type: string, enum: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PHI]}

    NoteEdited:
      name: NoteEdited
      payload:
        oneOf:
          - $ref: '#/components/schemas/PersonalEventEnvelope'
          - allOf:
              - $ref: '#/components/schemas/ProfessionalEventEnvelope'
              - type: object
                required: [note_id, content_hash, version]
                properties:
                  note_id: {type: string, format: ulid}
                  version: {type: integer}
                  content_hash: {type: string}

    NoteDeleted:
      name: NoteDeleted
      payload:
        oneOf:
          - $ref: '#/components/schemas/PersonalEventEnvelope'
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'

    NoteTagged:
      name: NoteTagged
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [note_id, tag_id]
            properties:
              note_id: {type: string, format: ulid}
              tag_id: {type: string, format: ulid}

    NoteUntagged:
      name: NoteUntagged
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [note_id, tag_id]
            properties:
              note_id: {type: string, format: ulid}
              tag_id: {type: string, format: ulid}

    BacklinkResolved:
      name: BacklinkResolved
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [from_note_id, to_note_id, kind]
            properties:
              from_note_id: {type: string, format: ulid}
              to_note_id: {type: string, format: ulid}
              kind: {type: string, enum: [explicit, tag, embed]}

    BacklinkBroken:
      name: BacklinkBroken
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [from_note_id, to_title]
            properties:
              from_note_id: {type: string, format: ulid}
              to_title: {type: string, description: dangling-target text}

    ChecklistItemEmitted:
      name: ChecklistItemEmitted
      description: For tasks µservice
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, note_id, item_text, item_id]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          note_id: {type: string, format: ulid}
          context_kind: {type: string, enum: [Personal, Professional]}
          item_id: {type: string, format: ulid, description: stable derived id; idempotency-key}
          item_text: {type: string, maxLength: 300, description: Personal-tier emits ciphertext blob}
          due_hint: {type: string, format: date-time, nullable: true}

    ChecklistItemDone:
      name: ChecklistItemDone
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, note_id, item_id, done_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          note_id: {type: string, format: ulid}
          item_id: {type: string, format: ulid}
          done_at: {type: string, format: date-time}

    ShareLinkCreated:
      name: ShareLinkCreated
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, note_id, share_token_id, scope, ttl_seconds]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          context_kind: {type: string, enum: [Personal, Professional]}
          note_id: {type: string, format: ulid}
          share_token_id: {type: string, format: ulid}
          scope: {type: string, const: ReadOnly}
          passphrase_required: {type: boolean}
          ttl_seconds: {type: integer}

    ShareLinkRevoked:
      name: ShareLinkRevoked
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, share_token_id, revoked_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          share_token_id: {type: string, format: ulid}
          revoked_at: {type: string, format: date-time}

    ShareLinkAccessed:
      name: ShareLinkAccessed
      payload:
        type: object
        required: [event_id, microservice, tenant_id, share_token_id, accessed_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          share_token_id: {type: string, format: ulid}
          accessed_at: {type: string, format: date-time}
          accessor_hash: {type: string, description: PBKDF2 of (ip + ua) — never raw}

    DailyNoteCreated:
      name: DailyNoteCreated
      payload:
        allOf:
          - $ref: '#/components/schemas/PersonalEventEnvelope'
          - type: object
            required: [date]
            properties:
              date: {type: string, format: date}

    WebClipperCaptured:
      name: WebClipperCaptured
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, note_id, url, captured_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          context_kind: {type: string, enum: [Personal, Professional]}
          note_id: {type: string, format: ulid}
          url: {type: string, format: uri}
          captured_at: {type: string, format: date-time}
          clipper_installation_id: {type: string, format: ulid}

    ImportJobCompleted:
      name: ImportJobCompleted
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, job_id, source_format, notes_imported, completed_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          job_id: {type: string, format: ulid}
          source_format: {type: string, enum: [obsidian, enex, apple_notes, onenote, notion, bear]}
          notes_imported: {type: integer}
          completed_at: {type: string, format: date-time}

    ExportJobCompleted:
      name: ExportJobCompleted
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, job_id, format, completed_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          job_id: {type: string, format: ulid}
          format: {type: string, enum: [markdown_canonical_bundle, pdf, json_canonical]}
          completed_at: {type: string, format: date-time}

    AiAssistInvoked:
      name: AiAssistInvoked
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [note_id, capability, model_version, input_hash]
            properties:
              note_id: {type: string, format: ulid}
              capability: {type: string, enum: [summarize, tag_suggest, link_suggest]}
              model_version: {type: string}
              input_hash: {type: string}

    AiAssistResultDelivered:
      name: AiAssistResultDelivered
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [note_id, capability, output_hash]
            properties:
              note_id: {type: string, format: ulid}
              capability: {type: string, enum: [summarize, tag_suggest, link_suggest]}
              output_hash: {type: string}

    FourEyesDisclosureExecuted:
      name: FourEyesDisclosureExecuted
      payload:
        allOf:
          - $ref: '#/components/schemas/ProfessionalEventEnvelope'
          - type: object
            required: [note_id, approver_a_id, approver_b_id, reason_code]
            properties:
              note_id: {type: string, format: ulid}
              approver_a_id: {type: string}
              approver_b_id: {type: string}
              reason_code: {type: string}

    MlsEpochAdvanced:
      name: MlsEpochAdvanced
      payload:
        type: object
        required: [event_id, microservice, tenant_id, user_id, epoch_hash, advanced_at]
        properties:
          event_id: {type: string, format: ulid}
          microservice: {type: string, const: notes}
          tenant_id: {type: string}
          user_id: {type: string}
          epoch_hash: {type: string, description: opaque; never key material}
          advanced_at: {type: string, format: date-time}
