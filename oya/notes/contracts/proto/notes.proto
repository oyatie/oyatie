// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// notes µservice — internal Loro CRDT op stream Protobuf contract.
// Internal gRPC uses HTTP/2 with SPIFFE mTLS/TLS 1.3; public realtime uses the AsyncAPI-described
// WebSocket message contract.
// Version 1.0.0
// References: ADR-NOTES-0003 (Loro 1.x); ADR-NOTES-0001 (E2E refusal)

syntax = "proto3";

package oya.notes.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Loro CRDT op stream (Professional-tier only)
// =========================================================================
//
// Personal-tier collab is structurally refused per ADR-NOTES-0003 + DCI-09.
// Any Loro op stream message carrying context_kind=Personal is dropped at
// the broker boundary; the broker MUST NOT accept such ops.

message LoroOp {
    string note_id = 1;          // ULID
    string tenant_id = 2;
    string user_id = 3;          // op author
    string session_id = 4;       // ULID; session bound at start
    bytes  loro_payload = 5;     // opaque Loro 1.x op bytes
    uint64 op_sequence = 6;      // monotonic per-session
    google.protobuf.Timestamp emitted_at = 7;
}

message LoroSessionStart {
    string note_id = 1;          // MUST be Professional-tier
    string tenant_id = 2;
    string user_id = 3;
    google.protobuf.Timestamp started_at = 4;
}

message LoroSessionEnd {
    string session_id = 1;
    google.protobuf.Timestamp ended_at = 2;
    string reason = 3;           // user-left | idle-timeout | server-rotation
}

message LoroSnapshot {
    string note_id = 1;
    string snapshot_id = 2;
    bytes  loro_snapshot_bytes = 3;
    google.protobuf.Timestamp snapshotted_at = 4;
}

message Cursor {
    string note_id = 1;
    string user_id = 2;
    string session_id = 3;
    int32  offset = 4;            // text offset within current doc state
    int32  selection_end = 5;     // optional; -1 if no selection
}

// =========================================================================
// MLS key bundle distribution (Personal-tier)
// =========================================================================
//
// Server NEVER sees plaintext. KeyPackages are PUBLIC; commit messages are
// opaque to server.

message KeyPackage {
    string user_id = 1;
    string device_id = 2;
    bytes  key_package_bytes = 3;  // openmls 0.6 KeyPackage encoding
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp expires_at = 5;
}

message MlsCommit {
    string user_id = 1;
    string group_id = 2;          // MLS group id
    string device_id = 3;
    bytes  commit_bytes = 4;      // opaque MLS commit message
    google.protobuf.Timestamp emitted_at = 5;
}

message MlsCipherBlob {
    string note_id = 1;
    string user_id = 2;
    bytes  ciphertext = 3;        // MLS-protected body
    bytes  associated_data = 4;   // optional MLS AAD
    string content_hash = 5;      // sha256 of (ciphertext + AAD)
    google.protobuf.Timestamp persisted_at = 6;
}

// =========================================================================
// Web-clipper bridge (binary protocol fallback; primary is REST)
// =========================================================================

message ClipFrame {
    string installation_token = 1;
    string url = 2;
    string title = 3;
    string snippet = 4;
    bytes  full_html = 5;          // optional; up to 500KB
    google.protobuf.Timestamp captured_at = 6;
}

// =========================================================================
// Sync delta (non-collab path)
// =========================================================================

message SyncDelta {
    string note_id = 1;
    string tenant_id = 2;
    string user_id = 3;
    uint64 base_version = 4;
    uint64 new_version = 5;
    bytes  diff_bytes = 6;         // unified-diff or binary delta
    string content_hash = 7;
}

// =========================================================================
// Cross-µservice events (Workflow event payload schemas)
// =========================================================================

message ChecklistItemEmitted {
    string event_id = 1;            // ULID
    string tenant_id = 2;
    string user_id = 3;
    string note_id = 4;
    string item_id = 5;             // idempotency key
    string item_text = 6;           // Personal-tier emits ciphertext blob
    string context_kind = 7;        // Personal | Professional
    google.protobuf.Timestamp due_hint = 8;  // optional
    google.protobuf.Timestamp emitted_at = 9;
}

message BacklinkResolved {
    string event_id = 1;
    string tenant_id = 2;
    string user_id = 3;
    string from_note_id = 4;
    string to_note_id = 5;
    string kind = 6;                // explicit | tag | embed
    google.protobuf.Timestamp resolved_at = 7;
}

// =========================================================================
// Audit-chain seal (cross-cutting)
// =========================================================================

message AuditChainSeal {
    string event_id = 1;
    string microservice = 2;        // const: "notes"
    string tenant_id = 3;
    string user_id = 4;
    string kind = 5;                // NoteCreated | NoteEdited | ... | MlsEpochAdvanced
    bytes  payload_canonical = 6;   // JSON-Canonical encoding
    bytes  merkle_segment_root = 7;
    bytes  ed25519_signature = 8;
    google.protobuf.Timestamp sealed_at = 9;
}
