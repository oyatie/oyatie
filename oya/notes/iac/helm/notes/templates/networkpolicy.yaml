# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-default-deny
  namespace: notes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-allow-ingress-from-gateway
  namespace: notes
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: notes}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-edge}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: notes}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-allow-egress-to-substrate
  namespace: notes
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: notes}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: notes-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: notes-valkey}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: notes-meilisearch}}}]
      ports: [{protocol: TCP, port: 7700}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ontology}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenancy}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: drive}}}]
      ports: [{protocol: TCP, port: 50051}]  # attachment storage bridge
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# E2E invariant: import-export worker has NO egress except scan + DNS.
# AI features NEVER call out from import-export per ADR-NOTES-0005.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-import-export-no-egress
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notes
      app.kubernetes.io/component: import-export-worker
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: security-scanners}}}]
      ports: [{protocol: TCP, port: 8008}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}]
