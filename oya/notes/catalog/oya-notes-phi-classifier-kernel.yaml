apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-notes-phi-classifier-kernel
  namespace: notes
spec:
  microservice: notes
  bounded_context: phi-classifier
  layer: kernel
  language: rust
  binding_adrs:
    - ADR-0251
    - ADR-0255
  classifier:
    type: phi_detector
    similar_to:
      - microsoft_presidio
      - aws_comprehend_medical
  emits_audit_classes:
