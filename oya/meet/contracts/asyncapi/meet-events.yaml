asyncapi: 3.1.0
info:
  title: oya-meet — events
  version: 1.0.0
  summary: Real-time signaling + Workflow events emitted by the meet µservice
  description: |
    Two channel families:
    - **Real-time WebSocket** (`wss://meet-{pack}.oyatie.com/ws/v1`):
      client-facing signaling events (lobby, presence, captions, breakout
      transitions, host actions) delivered to authenticated session
      connections. Per-event Cedar evaluation.
    - **Workflow event bus** (cluster-internal AMQP / NATS):
      cross-µservice events consumed by ontology, audit-chain, calendar,
      foundry-runtime, mail, workflow-engine.

    Note: the WebRTC media plane is via LiveKit SFU directly (out-of-band
    from this AsyncAPI contract); this contract documents only the signaling
    + Workflow event surfaces.

defaultContentType: application/json

servers:
  signaling-gateway:
    host: meet-{pack}.oyatie.com
    protocol: wss
    description: Per-pack signaling WebSocket
    variables:
      pack:
        enum: [kr, eu, us, us-hc, us-fin, jp, sg, au, in, br, ae, ksa]
  workflow-events-bus:
    host: workflow-events.meet.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus

channels:
  meeting-room-created:
    address: workflow-events/meet.meeting_room.created
    messages: {MeetingRoomCreatedMessage: {$ref: '#/components/messages/MeetingRoomCreated'}}

  meeting-instance-started:
    address: workflow-events/meet.meeting_instance.started
    messages: {MeetingInstanceStartedMessage: {$ref: '#/components/messages/MeetingInstanceStarted'}}

  meeting-instance-ended:
    address: workflow-events/meet.meeting_instance.ended
    messages: {MeetingInstanceEndedMessage: {$ref: '#/components/messages/MeetingInstanceEnded'}}

  participant-joined:
    address: workflow-events/meet.participant.joined
    messages: {ParticipantJoinedMessage: {$ref: '#/components/messages/ParticipantJoined'}}

  participant-left:
    address: workflow-events/meet.participant.left
    messages: {ParticipantLeftMessage: {$ref: '#/components/messages/ParticipantLeft'}}

  recording-started:
    address: workflow-events/meet.recording.started
    messages: {RecordingStartedMessage: {$ref: '#/components/messages/RecordingStarted'}}

  recording-finalized:
    address: workflow-events/meet.recording.finalized
    messages: {RecordingFinalizedMessage: {$ref: '#/components/messages/RecordingFinalized'}}

  transcript-sealed:
    address: workflow-events/meet.transcript.sealed
    messages: {TranscriptSealedMessage: {$ref: '#/components/messages/TranscriptSealed'}}

  summary-produced:
    address: workflow-events/meet.summary.produced
    messages: {SummaryProducedMessage: {$ref: '#/components/messages/SummaryProduced'}}

  breakout-rooms-created:
    address: workflow-events/meet.breakout_rooms.created
    messages: {BreakoutRoomsCreatedMessage: {$ref: '#/components/messages/BreakoutRoomsCreated'}}

  breakout-rooms-merged:
    address: workflow-events/meet.breakout_rooms.merged
    messages: {BreakoutRoomsMergedMessage: {$ref: '#/components/messages/BreakoutRoomsMerged'}}

  live-stream-started:
    address: workflow-events/meet.live_stream.started
    messages: {LiveStreamStartedMessage: {$ref: '#/components/messages/LiveStreamStarted'}}

  live-stream-stopped:
    address: workflow-events/meet.live_stream.stopped
    messages: {LiveStreamStoppedMessage: {$ref: '#/components/messages/LiveStreamStopped'}}

  webinar-registration-opened:
    address: workflow-events/meet.webinar.registration_opened
    messages: {WebinarRegistrationOpenedMessage: {$ref: '#/components/messages/WebinarRegistrationOpened'}}

  mls-epoch-advanced:
    address: workflow-events/meet.mls.epoch_advanced
    messages: {MlsEpochAdvancedMessage: {$ref: '#/components/messages/MlsEpochAdvanced'}}

  ediscovery-hold:
    address: workflow-events/meet.ediscovery.hold
    messages: {EDiscoveryHoldMessage: {$ref: '#/components/messages/EDiscoveryHold'}}

  four-eyes-disclosure:
    address: workflow-events/meet.disclosure.executed
    messages: {FourEyesDisclosureMessage: {$ref: '#/components/messages/FourEyesDisclosure'}}

  # WebSocket signaling frames
  ws-lobby-frame:
    address: ws/lobby
    description: Lobby pending/approved/denied frames delivered to host
    messages: {LobbyFrame: {payload: {$ref: '#/components/schemas/LobbyFramePayload'}}}

  ws-presence-frame:
    address: ws/presence
    description: In-meeting presence updates
    messages: {PresenceFrame: {payload: {$ref: '#/components/schemas/PresenceFramePayload'}}}

  ws-caption-frame:
    address: ws/caption
    description: Live caption frames
    messages: {CaptionFrame: {payload: {$ref: '#/components/schemas/CaptionFramePayload'}}}

  ws-host-action-frame:
    address: ws/host-action
    description: Host actions (mute participant, spotlight, breakout, etc.)
    messages: {HostActionFrame: {payload: {$ref: '#/components/schemas/HostActionFramePayload'}}}

operations:
  emitMeetingRoomCreated:
    action: send
    channel: {$ref: '#/channels/meeting-room-created'}
  emitMeetingInstanceStarted:
    action: send
    channel: {$ref: '#/channels/meeting-instance-started'}
  emitMeetingInstanceEnded:
    action: send
    channel: {$ref: '#/channels/meeting-instance-ended'}
  emitParticipantJoined:
    action: send
    channel: {$ref: '#/channels/participant-joined'}
  emitParticipantLeft:
    action: send
    channel: {$ref: '#/channels/participant-left'}
  emitRecordingStarted:
    action: send
    channel: {$ref: '#/channels/recording-started'}
  emitRecordingFinalized:
    action: send
    channel: {$ref: '#/channels/recording-finalized'}
  emitTranscriptSealed:
    action: send
    channel: {$ref: '#/channels/transcript-sealed'}
  emitSummaryProduced:
    action: send
    channel: {$ref: '#/channels/summary-produced'}
  emitBreakoutRoomsCreated:
    action: send
    channel: {$ref: '#/channels/breakout-rooms-created'}
  emitLiveStreamStarted:
    action: send
    channel: {$ref: '#/channels/live-stream-started'}
  emitWebinarRegistrationOpened:
    action: send
    channel: {$ref: '#/channels/webinar-registration-opened'}
  emitMlsEpochAdvanced:
    action: send
    channel: {$ref: '#/channels/mls-epoch-advanced'}
  emitEDiscoveryHold:
    action: send
    channel: {$ref: '#/channels/ediscovery-hold'}
  emitFourEyesDisclosure:
    action: send
    channel: {$ref: '#/channels/four-eyes-disclosure'}

  # Consumed events
  consumeCalendarEventCreated:
    action: receive
    channel:
      address: workflow-events/calendar.event.created
    description: Calendar event creation triggers meet-link binding into the event payload
  consumeCalendarEventUpdated:
    action: receive
    channel:
      address: workflow-events/calendar.event.updated
    description: Calendar event update refreshes meet-link binding
  consumeMessengerHuddleGraduate:
    action: receive
    channel:
      address: workflow-events/messenger.huddle.graduate_to_meet
    description: Messenger huddle requests graduation to a named meet room
  consumeOntologyEntityChanged:
    action: receive
    channel:
      address: workflow-events/ontology.entity.changed
    description: Ontology entity update refreshes participant directory cache
  consumeTenantRetentionPolicyUpdated:
    action: receive
    channel:
      address: workflow-events/tenancy.retention_policy.updated
  consumeAuditChainSealed:
    action: receive
    channel:
      address: workflow-events/audit_chain.sealed

components:
  messages:
    MeetingRoomCreated:
      name: MeetingRoomCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/MeetingRoomCreatedPayload'}
    MeetingInstanceStarted:
      name: MeetingInstanceStarted
      contentType: application/json
      payload: {$ref: '#/components/schemas/MeetingInstanceStartedPayload'}
    MeetingInstanceEnded:
      name: MeetingInstanceEnded
      contentType: application/json
      payload: {$ref: '#/components/schemas/MeetingInstanceEndedPayload'}
    ParticipantJoined:
      name: ParticipantJoined
      contentType: application/json
      payload: {$ref: '#/components/schemas/ParticipantJoinedPayload'}
    ParticipantLeft:
      name: ParticipantLeft
      contentType: application/json
      payload: {$ref: '#/components/schemas/ParticipantLeftPayload'}
    RecordingStarted:
      name: RecordingStarted
      contentType: application/json
      payload: {$ref: '#/components/schemas/RecordingStartedPayload'}
    RecordingFinalized:
      name: RecordingFinalized
      contentType: application/json
      payload: {$ref: '#/components/schemas/RecordingFinalizedPayload'}
    TranscriptSealed:
      name: TranscriptSealed
      contentType: application/json
      payload: {$ref: '#/components/schemas/TranscriptSealedPayload'}
    SummaryProduced:
      name: SummaryProduced
      contentType: application/json
      payload: {$ref: '#/components/schemas/SummaryProducedPayload'}
    BreakoutRoomsCreated:
      name: BreakoutRoomsCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/BreakoutRoomsCreatedPayload'}
    BreakoutRoomsMerged:
      name: BreakoutRoomsMerged
      contentType: application/json
      payload: {$ref: '#/components/schemas/BreakoutRoomsMergedPayload'}
    LiveStreamStarted:
      name: LiveStreamStarted
      contentType: application/json
      payload: {$ref: '#/components/schemas/LiveStreamStartedPayload'}
    LiveStreamStopped:
      name: LiveStreamStopped
      contentType: application/json
      payload: {$ref: '#/components/schemas/LiveStreamStoppedPayload'}
    WebinarRegistrationOpened:
      name: WebinarRegistrationOpened
      contentType: application/json
      payload: {$ref: '#/components/schemas/WebinarRegistrationOpenedPayload'}
    MlsEpochAdvanced:
      name: MlsEpochAdvanced
      contentType: application/json
      payload: {$ref: '#/components/schemas/MlsEpochAdvancedPayload'}
    EDiscoveryHold:
      name: EDiscoveryHold
      contentType: application/json
      payload: {$ref: '#/components/schemas/EDiscoveryHoldPayload'}
    FourEyesDisclosure:
      name: FourEyesDisclosure
      contentType: application/json
      payload: {$ref: '#/components/schemas/FourEyesDisclosurePayload'}

  schemas:
    MeetingRoomCreatedPayload:
      type: object
      required: [room_id, tenant_id, name, created_by, created_at]
      properties:
        room_id: {type: string, format: ulid}
        tenant_id: {type: string}
        name: {type: string}
        lobby_policy: {type: string}
        e2e_mode: {type: boolean}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        retention_policy_id: {type: string, nullable: true}

    MeetingInstanceStartedPayload:
      type: object
      required: [instance_id, room_id, tenant_id, started_at]
      properties:
        instance_id: {type: string, format: ulid}
        room_id: {type: string, format: ulid}
        tenant_id: {type: string}
        calendar_event_id: {type: string, nullable: true}
        webinar_mode: {type: boolean}
        e2e_mode: {type: boolean}
        broadcast_tier: {type: string, enum: [Interactive, Broadcast]}
        started_by: {type: string}
        started_at: {type: string, format: date-time}

    MeetingInstanceEndedPayload:
      type: object
      required: [instance_id, ended_at]
      properties:
        instance_id: {type: string, format: ulid}
        ended_at: {type: string, format: date-time}
        ended_by: {type: string, nullable: true}
        attendee_count: {type: integer}
        duration_seconds: {type: integer}

    ParticipantJoinedPayload:
      type: object
      required: [instance_id, user_ref, role, joined_at, consent_acknowledged]
      properties:
        instance_id: {type: string, format: ulid}
        user_ref: {type: string}
        role: {type: string, enum: [Host, CoHost, Presenter, Attendee, Guest, Interpreter]}
        display_name: {type: string, nullable: true}
        consent_acknowledged: {type: boolean}
        joined_at: {type: string, format: date-time}
        client_app: {type: string}
        client_version: {type: string}

    ParticipantLeftPayload:
      type: object
      required: [instance_id, user_ref, left_at]
      properties:
        instance_id: {type: string, format: ulid}
        user_ref: {type: string}
        left_at: {type: string, format: date-time}
        reason: {type: string, enum: [user_left, host_removed, network, ended_by_host]}

    RecordingStartedPayload:
      type: object
      required: [recording_id, instance_id, started_by, started_at]
      properties:
        recording_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        started_by: {type: string}
        started_at: {type: string, format: date-time}
        consent_mode: {type: string, enum: [A, B]}
        participant_count_at_start: {type: integer}

    RecordingFinalizedPayload:
      type: object
      required: [recording_id, content_hash, size_bytes, finalized_at, retention_bound]
      properties:
        recording_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        content_hash: {type: string}
        size_bytes: {type: integer}
        duration_seconds: {type: integer}
        blob_ref_s3: {type: string}
        worm_locked: {type: boolean}
        retention_bound: {type: string, format: date-time}
        finalized_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 audit-chain seal}

    TranscriptSealedPayload:
      type: object
      required: [transcript_id, instance_id, content_hash, languages, sealed_at]
      properties:
        transcript_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        recording_id: {type: string, format: ulid, nullable: true}
        languages: {type: array, items: {type: string}}
        content_hash: {type: string}
        blob_ref_s3: {type: string}
        whisper_model_version: {type: string}
        sealed_at: {type: string, format: date-time}
        signature: {type: string}

    SummaryProducedPayload:
      type: object
      required: [summary_id, instance_id, transcript_id, produced_at]
      properties:
        summary_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        transcript_id: {type: string, format: ulid}
        content_hash: {type: string}
        ai_model_version: {type: string}
        action_item_count: {type: integer}
        produced_at: {type: string, format: date-time}
        ai_generated_label: {type: string}

    BreakoutRoomsCreatedPayload:
      type: object
      required: [instance_id, breakout_count, created_by, created_at]
      properties:
        instance_id: {type: string, format: ulid}
        breakout_count: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}

    BreakoutRoomsMergedPayload:
      type: object
      required: [instance_id, merged_at]
      properties:
        instance_id: {type: string, format: ulid}
        merged_at: {type: string, format: date-time}

    LiveStreamStartedPayload:
      type: object
      required: [instance_id, destination_host, destination_protocol, started_by, started_at, legal_attestation]
      properties:
        instance_id: {type: string, format: ulid}
        destination_host: {type: string}
        destination_protocol: {type: string, enum: [rtmp, rtmps, whip, hls]}
        platform_label: {type: string}
        started_by: {type: string}
        started_at: {type: string, format: date-time}
        legal_attestation: {type: boolean}

    LiveStreamStoppedPayload:
      type: object
      required: [instance_id, stopped_at]
      properties:
        instance_id: {type: string, format: ulid}
        stopped_at: {type: string, format: date-time}
        bytes_streamed: {type: integer}

    WebinarRegistrationOpenedPayload:
      type: object
      required: [webinar_id, opened_by, opened_at]
      properties:
        webinar_id: {type: string, format: ulid}
        opened_by: {type: string}
        public_form: {type: boolean}
        opened_at: {type: string, format: date-time}

    MlsEpochAdvancedPayload:
      type: object
      required: [instance_id, group_id, epoch, advanced_at]
      properties:
        instance_id: {type: string, format: ulid}
        group_id: {type: string}
        epoch: {type: integer}
        epoch_hash: {type: string}
        member_count: {type: integer}
        advanced_at: {type: string, format: date-time}

    EDiscoveryHoldPayload:
      type: object
      required: [hold_id, tenant_id, scope, reason, action, executed_at]
      properties:
        hold_id: {type: string}
        tenant_id: {type: string}
        scope: {type: object}
        reason: {type: string}
        action: {type: string, enum: [opened, closed]}
        executed_by: {type: string}
        executed_at: {type: string, format: date-time}

    FourEyesDisclosurePayload:
      type: object
      required: [disclosure_id, tenant_id, recording_ids, reason, primary_approver, paired_approver, executed_at]
      properties:
        disclosure_id: {type: string}
        tenant_id: {type: string}
        recording_ids: {type: array, items: {type: string}}
        reason: {type: string}
        primary_approver: {type: string}
        paired_approver: {type: string}
        executed_at: {type: string, format: date-time}
        signature_primary: {type: string}
        signature_paired: {type: string}

    LobbyFramePayload:
      type: object
      properties:
        instance_id: {type: string}
        event: {type: string, enum: [pending, approved, denied, evicted]}
        user_ref: {type: string}
        display_name: {type: string, nullable: true}
        ts: {type: string, format: date-time}

    PresenceFramePayload:
      type: object
      properties:
        instance_id: {type: string}
        user_ref: {type: string}
        state: {type: string, enum: [Online, Speaking, Muted, Away, Offline]}
        ts: {type: string, format: date-time}

    CaptionFramePayload:
      type: object
      properties:
        instance_id: {type: string}
        speaker_ref: {type: string, nullable: true}
        language: {type: string}
        text: {type: string}
        ai_generated_label: {type: string, default: "AI-generated"}
        ts: {type: string, format: date-time}
        sequence_no: {type: integer}

    HostActionFramePayload:
      type: object
      properties:
        instance_id: {type: string}
        action: {type: string, enum: [mute_participant, unmute_participant, remove_participant, spotlight, end_meeting, lower_all_hands]}
        target_user_ref: {type: string, nullable: true}
        actor_user_ref: {type: string}
        ts: {type: string, format: date-time}
