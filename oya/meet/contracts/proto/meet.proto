// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-meet — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/meet.yaml.
// Per ADR-0135 + ADR-0131 + ADR-0132.

syntax = "proto3";

package oya.meet.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =========================================================================
// Service: MeetingRoom
// =========================================================================

service MeetingRoom {
  rpc CreateMeetingRoom(CreateMeetingRoomRequest) returns (MeetingRoomDescriptor);
  rpc GetMeetingRoom(GetMeetingRoomRequest) returns (MeetingRoomDescriptor);
  rpc ListMeetingRooms(ListMeetingRoomsRequest) returns (ListMeetingRoomsResponse);
  rpc ArchiveMeetingRoom(ArchiveMeetingRoomRequest) returns (google.protobuf.Empty);
}

// =========================================================================
// Service: MeetingInstance
// =========================================================================

service MeetingInstance {
  rpc StartMeetingInstance(StartMeetingInstanceRequest) returns (MeetingInstanceDescriptor);
  rpc GetMeetingInstance(GetMeetingInstanceRequest) returns (MeetingInstanceDescriptor);
  rpc EndMeetingInstance(EndMeetingInstanceRequest) returns (google.protobuf.Empty);
  rpc JoinMeeting(JoinMeetingRequest) returns (JoinMeetingResponse);
  rpc StreamSignaling(StreamSignalingRequest) returns (stream SignalingFrame);
}

// =========================================================================
// Service: Participant + Lobby
// =========================================================================

service Participant {
  rpc ListLobby(ListLobbyRequest) returns (ListLobbyResponse);
  rpc ApproveLobbyMember(ApproveLobbyMemberRequest) returns (google.protobuf.Empty);
  rpc DenyLobbyMember(DenyLobbyMemberRequest) returns (google.protobuf.Empty);
  rpc RemoveParticipant(RemoveParticipantRequest) returns (google.protobuf.Empty);
  rpc ChangeParticipantRole(ChangeParticipantRoleRequest) returns (google.protobuf.Empty);
}

// =========================================================================
// Service: Recording
// =========================================================================

service Recording {
  rpc StartRecording(StartRecordingRequest) returns (RecordingDescriptor);
  rpc StopRecording(StopRecordingRequest) returns (google.protobuf.Empty);
  rpc GetRecording(GetRecordingRequest) returns (RecordingDescriptor);
  rpc OpenLegalHold(OpenLegalHoldRequest) returns (LegalHoldDescriptor);
  rpc RequestDisclosure(RequestDisclosureRequest) returns (DisclosureTicket);
}

// =========================================================================
// Service: Transcription
// =========================================================================

service Transcription {
  rpc StartTranscription(StartTranscriptionRequest) returns (TranscriptDescriptor);
  rpc GetTranscript(GetTranscriptRequest) returns (TranscriptDescriptor);
  rpc StreamCaptions(StreamCaptionsRequest) returns (stream CaptionFrame);
  rpc SearchTranscripts(SearchTranscriptsRequest) returns (SearchTranscriptsResponse);
  rpc GetSummary(GetSummaryRequest) returns (SummaryDescriptor);
}

// =========================================================================
// Service: Webinar
// =========================================================================

service Webinar {
  rpc OpenRegistration(OpenRegistrationRequest) returns (google.protobuf.Empty);
  rpc CloseRegistration(CloseRegistrationRequest) returns (google.protobuf.Empty);
  rpc SubmitRegistration(SubmitRegistrationRequest) returns (RegistrationDescriptor);
  rpc ApproveRegistration(ApproveRegistrationRequest) returns (google.protobuf.Empty);
  rpc StartPracticeSession(StartPracticeSessionRequest) returns (google.protobuf.Empty);
  rpc GetAttendeeReport(GetAttendeeReportRequest) returns (AttendeeReport);
}

// =========================================================================
// Service: LiveStreamEgress
// =========================================================================

service LiveStreamEgress {
  rpc StartLiveStreamEgress(StartLiveStreamEgressRequest) returns (EgressHandle);
  rpc StopLiveStreamEgress(StopLiveStreamEgressRequest) returns (google.protobuf.Empty);
}

// =========================================================================
// Common types
// =========================================================================

enum LobbyPolicy {
  LOBBY_POLICY_UNSPECIFIED = 0;
  LOBBY_POLICY_OPEN = 1;
  LOBBY_POLICY_KNOCK_TO_ENTER = 2;
  LOBBY_POLICY_INVITED_ONLY = 3;
}

enum ParticipantRole {
  PARTICIPANT_ROLE_UNSPECIFIED = 0;
  PARTICIPANT_ROLE_HOST = 1;
  PARTICIPANT_ROLE_COHOST = 2;
  PARTICIPANT_ROLE_PRESENTER = 3;
  PARTICIPANT_ROLE_ATTENDEE = 4;
  PARTICIPANT_ROLE_GUEST = 5;
  PARTICIPANT_ROLE_INTERPRETER = 6;
}

enum MeetingState {
  MEETING_STATE_UNSPECIFIED = 0;
  MEETING_STATE_CREATED = 1;
  MEETING_STATE_ACTIVE = 2;
  MEETING_STATE_ENDED = 3;
}

enum BroadcastTier {
  BROADCAST_TIER_UNSPECIFIED = 0;
  BROADCAST_TIER_INTERACTIVE = 1;
  BROADCAST_TIER_BROADCAST = 2;
}

enum EgressProtocol {
  EGRESS_PROTOCOL_UNSPECIFIED = 0;
  EGRESS_PROTOCOL_RTMP = 1;
  EGRESS_PROTOCOL_RTMPS = 2;
  EGRESS_PROTOCOL_WHIP = 3;
  EGRESS_PROTOCOL_HLS = 4;
}

message MeetingRoomDescriptor {
  string room_id = 1;
  string tenant_id = 2;
  string name = 3;
  string topic = 4;
  LobbyPolicy lobby_policy = 5;
  string retention_policy_id = 6;
  bool e2e_mode = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp archived_at = 9;
}

message MeetingInstanceDescriptor {
  string instance_id = 1;
  string room_id = 2;
  string tenant_id = 3;
  string calendar_event_id = 4;
  MeetingState state = 5;
  bool e2e_mode = 6;
  bool webinar_mode = 7;
  BroadcastTier broadcast_tier = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp ended_at = 10;
  int32 attendee_count = 11;
}

message RecordingDescriptor {
  string recording_id = 1;
  string instance_id = 2;
  string blob_ref = 3;
  string content_hash = 4;
  int64 size_bytes = 5;
  int32 duration_seconds = 6;
  google.protobuf.Timestamp retention_bound = 7;
  string legal_hold_id = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finalized_at = 10;
}

message TranscriptDescriptor {
  string transcript_id = 1;
  string instance_id = 2;
  string recording_id = 3;
  repeated string languages = 4;
  string content_hash = 5;
  string blob_ref = 6;
  string seal = 7;
  string whisper_model_version = 8;
  google.protobuf.Timestamp created_at = 9;
}

message SummaryDescriptor {
  string summary_id = 1;
  string instance_id = 2;
  string transcript_id = 3;
  repeated string bullet_points = 4;
  repeated ActionItem action_items = 5;
  string content_hash = 6;
  string ai_model_version = 7;
  string ai_generated_label = 8;
}

message ActionItem {
  string text = 1;
  string assignee_ref = 2;
  google.protobuf.Timestamp due_hint = 3;
  repeated string source_segment_ids = 4;
  double confidence = 5;
}

message CaptionFrame {
  string instance_id = 1;
  string speaker_ref = 2;
  string language = 3;
  string text = 4;
  google.protobuf.Timestamp ts = 5;
  int32 sequence_no = 6;
}

message SignalingFrame {
  string instance_id = 1;
  oneof payload {
    LobbyFrame lobby = 2;
    PresenceFrame presence = 3;
    HostActionFrame host_action = 4;
  }
}

message LobbyFrame {
  string user_ref = 1;
  string event = 2;  // pending, approved, denied, evicted
  string display_name = 3;
}

message PresenceFrame {
  string user_ref = 1;
  string state = 2;  // Online, Speaking, Muted, Away, Offline
}

message HostActionFrame {
  string action = 1;
  string target_user_ref = 2;
  string actor_user_ref = 3;
}

message EgressDestination {
  EgressProtocol protocol = 1;
  string host = 2;
  string stream_key_secret_ref = 3;
  string platform_label = 4;
}

message EgressHandle {
  string egress_id = 1;
  string instance_id = 2;
  EgressDestination destination = 3;
  google.protobuf.Timestamp started_at = 4;
}

// =========================================================================
// Requests + Responses
// =========================================================================

message CreateMeetingRoomRequest {
  string name = 1;
  string topic = 2;
  LobbyPolicy lobby_policy = 3;
  string retention_policy_id = 4;
  bool e2e_mode = 5;
}

message GetMeetingRoomRequest { string room_id = 1; }
message ArchiveMeetingRoomRequest { string room_id = 1; }
message ListMeetingRoomsRequest {
  string cursor = 1;
  int32 limit = 2;
}
message ListMeetingRoomsResponse {
  repeated MeetingRoomDescriptor rooms = 1;
  string next_cursor = 2;
}

message StartMeetingInstanceRequest {
  string room_id = 1;
  string calendar_event_id = 2;
  bool webinar_mode = 3;
}
message GetMeetingInstanceRequest { string instance_id = 1; }
message EndMeetingInstanceRequest { string instance_id = 1; }
message JoinMeetingRequest {
  string instance_id = 1;
  string display_name = 2;
  bool consent_acknowledged = 3;
}
message JoinMeetingResponse {
  string livekit_url = 1;
  string livekit_token = 2;
  string lobby_ticket = 3;  // empty if approved immediately
  ParticipantRole role = 4;
}
message StreamSignalingRequest { string instance_id = 1; }

message ListLobbyRequest { string instance_id = 1; }
message ListLobbyResponse {
  message Pending {
    string user_ref = 1;
    string display_name = 2;
    google.protobuf.Timestamp arrived_at = 3;
  }
  repeated Pending pending = 1;
}
message ApproveLobbyMemberRequest {
  string instance_id = 1;
  string user_ref = 2;
}
message DenyLobbyMemberRequest {
  string instance_id = 1;
  string user_ref = 2;
}
message RemoveParticipantRequest {
  string instance_id = 1;
  string user_ref = 2;
}
message ChangeParticipantRoleRequest {
  string instance_id = 1;
  string user_ref = 2;
  ParticipantRole new_role = 3;
}

message StartRecordingRequest { string instance_id = 1; }
message StopRecordingRequest { string instance_id = 1; }
message GetRecordingRequest { string recording_id = 1; }

message OpenLegalHoldRequest {
  repeated string recording_ids = 1;
  string reason = 2;
}
message LegalHoldDescriptor {
  string hold_id = 1;
  google.protobuf.Timestamp opened_at = 2;
}

message RequestDisclosureRequest {
  repeated string recording_ids = 1;
  string reason = 2;
  string paired_approver_id = 3;
}
message DisclosureTicket {
  string disclosure_id = 1;
  string status = 2;  // awaiting_paired_approval, approved, denied
}

message StartTranscriptionRequest {
  string instance_id = 1;
  repeated string target_languages = 2;
}
message GetTranscriptRequest { string transcript_id = 1; }
message StreamCaptionsRequest {
  string instance_id = 1;
  string target_language = 2;
}
message SearchTranscriptsRequest {
  string query = 1;
  string room_id = 2;
  google.protobuf.Timestamp before = 3;
  google.protobuf.Timestamp after = 4;
  int32 limit = 5;
}
message SearchTranscriptsResponse {
  message Hit {
    string transcript_id = 1;
    string instance_id = 2;
    string snippet = 3;
    double score = 4;
  }
  repeated Hit hits = 1;
  int32 total_hits = 2;
  int32 took_ms = 3;
}
message GetSummaryRequest { string transcript_id = 1; }

message OpenRegistrationRequest {
  string webinar_id = 1;
  bool public_form = 2;
}
message CloseRegistrationRequest { string webinar_id = 1; }
message SubmitRegistrationRequest {
  string webinar_id = 1;
  string attendee_email = 2;
  map<string, string> custom_fields = 3;
}
message RegistrationDescriptor {
  string registration_id = 1;
  string webinar_id = 2;
  string status = 3;
  string join_token = 4;
}
message ApproveRegistrationRequest {
  string webinar_id = 1;
  string registration_id = 2;
}
message StartPracticeSessionRequest { string webinar_id = 1; }
message GetAttendeeReportRequest { string webinar_id = 1; }
message AttendeeReport {
  string webinar_id = 1;
  int32 registered_count = 2;
  int32 attended_count = 3;
  int32 no_show_count = 4;
  repeated AttendeeReportRow rows = 5;
}
message AttendeeReportRow {
  string user_ref = 1;
  string display_name = 2;
  google.protobuf.Timestamp joined_at = 3;
  google.protobuf.Timestamp left_at = 4;
  int32 attendance_minutes = 5;
  int32 questions_submitted = 6;
}

message StartLiveStreamEgressRequest {
  string instance_id = 1;
  EgressDestination destination = 2;
  bool legal_attestation = 3;
}
message StopLiveStreamEgressRequest { string egress_id = 1; }
