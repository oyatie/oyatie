openapi: 3.2.0
info:
  title: oya-meet
  version: 1.0.0
  summary: REST API for the meet µservice — meeting-room CRUD, meeting-instance lifecycle, participant + lobby, recording, transcription, webinar, live-stream egress
  description: |
    Tenant-facing REST surface for the meet µservice. All endpoints require
    OIDC + Cedar authorisation (per `microservices/meet/policy/*.cedar`) and
    are tenant-scoped via `X-Scope-OrgID` header.

    Real-time signaling path is via WebSocket at
    `wss://meet-{pack}.oyatie.com/ws/v1` documented in
    `contracts/asyncapi/meet-events.yaml`. WebRTC media plane is via LiveKit
    SFU directly per ADR-MEET-0001.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries the principal's tenant_id claim. The X-Scope-OrgID header
    MUST match the claim; mismatch returns 401.
  contact:
    name: axis-meet
    url: https://oyatie.com/teams/axis-meet
  license:
    name: Internal
servers:
  - url: https://meet-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, us-fin, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: meet
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    RoomId:
      in: path
      name: room_id
      required: true
      schema: {type: string, format: ulid}
    InstanceId:
      in: path
      name: instance_id
      required: true
      schema: {type: string, format: ulid}
    RecordingId:
      in: path
      name: recording_id
      required: true
      schema: {type: string, format: ulid}
    WebinarId:
      in: path
      name: webinar_id
      required: true
      schema: {type: string, format: ulid}
  schemas:
    MeetingRoom:
      type: object
      required: [room_id, tenant_id, name, lobby_policy, created_at]
      properties:
        room_id: {type: string, format: ulid}
        tenant_id: {type: string}
        name: {type: string, maxLength: 100}
        topic: {type: string, maxLength: 250, nullable: true}
        lobby_policy: {type: string, enum: [Open, KnockToEnter, InvitedOnly]}
        waiting_room_policy: {type: string, enum: [None, AllGuests, NonMembers]}
        retention_policy_id: {type: string, nullable: true}
        e2e_mode: {type: boolean, default: false, description: Opt-in per ADR-MEET-0003}
        created_at: {type: string, format: date-time}
        archived_at: {type: string, format: date-time, nullable: true}
    MeetingInstance:
      type: object
      required: [instance_id, room_id, tenant_id, state, started_at]
      properties:
        instance_id: {type: string, format: ulid}
        room_id: {type: string, format: ulid}
        tenant_id: {type: string}
        calendar_event_id: {type: string, nullable: true, description: Calendar µservice binding}
        state: {type: string, enum: [Created, Active, Ended]}
        e2e_mode: {type: boolean}
        webinar_mode: {type: boolean}
        broadcast_tier: {type: string, enum: [Interactive, Broadcast], description: Per ADR-MEET-0005}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, nullable: true}
        host_refs:
          type: array
          items: {type: string}
        attendee_count: {type: integer}
    Participant:
      type: object
      required: [user_ref, instance_id, role, joined_at]
      properties:
        user_ref: {type: string}
        instance_id: {type: string, format: ulid}
        role: {type: string, enum: [Host, CoHost, Presenter, Attendee, Guest, Interpreter]}
        display_name: {type: string, nullable: true, maxLength: 80}
        lobby_status: {type: string, enum: [Approved, Pending, Denied]}
        consent_acknowledged: {type: boolean}
        joined_at: {type: string, format: date-time}
        left_at: {type: string, format: date-time, nullable: true}
    Recording:
      type: object
      required: [recording_id, instance_id, content_hash, size_bytes, started_at]
      properties:
        recording_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        blob_ref: {type: string, description: Signed short-TTL URL (≤ 15min)}
        content_hash: {type: string, description: sha256 over composite blob}
        size_bytes: {type: integer}
        duration_seconds: {type: integer, nullable: true}
        retention_bound: {type: string, format: date-time}
        legal_hold_id: {type: string, nullable: true}
        started_at: {type: string, format: date-time}
        finalized_at: {type: string, format: date-time, nullable: true}
    Transcript:
      type: object
      required: [transcript_id, instance_id, content_hash, seal]
      properties:
        transcript_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        recording_id: {type: string, format: ulid, nullable: true}
        languages:
          type: array
          items: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        content_hash: {type: string}
        blob_ref: {type: string}
        seal: {type: string, description: Ed25519 audit-chain seal}
        created_at: {type: string, format: date-time}
    Summary:
      type: object
      required: [summary_id, instance_id, content_hash]
      properties:
        summary_id: {type: string, format: ulid}
        instance_id: {type: string, format: ulid}
        bullet_points: {type: array, items: {type: string}, maxItems: 10}
        action_items:
          type: array
          items:
            type: object
            properties:
              text: {type: string, maxLength: 300}
              assignee_ref: {type: string, nullable: true}
              due_hint: {type: string, format: date-time, nullable: true}
              source_segment_ids: {type: array, items: {type: string}}
              confidence: {type: number, minimum: 0, maximum: 1}
        content_hash: {type: string}
        ai_generated_label: {type: string, default: "This summary was generated by AI; please review."}
    WebinarRegistration:
      type: object
      required: [registration_id, webinar_id, attendee_ref, status, created_at]
      properties:
        registration_id: {type: string, format: ulid}
        webinar_id: {type: string, format: ulid}
        attendee_ref: {type: string}
        attendee_email: {type: string, format: email, nullable: true}
        custom_fields: {type: object, additionalProperties: true}
        status: {type: string, enum: [Pending, Approved, Denied, Attended, NoShow]}
        join_token: {type: string, nullable: true, description: Short-TTL token issued on approval}
        created_at: {type: string, format: date-time}
    EgressDestination:
      type: object
      required: [protocol, host]
      properties:
        protocol: {type: string, enum: [rtmp, rtmps, whip, hls]}
        host: {type: string, format: hostname}
        stream_key_secret_ref: {type: string, description: OpenBao SecretReference path}
        platform_label: {type: string, enum: [youtube, twitch, vimeo, custom]}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /meeting-rooms:
    get:
      summary: List meeting rooms in tenant scope
      operationId: listMeetingRooms
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Room list
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items: {$ref: '#/components/schemas/MeetingRoom'}
                  next_cursor: {type: string, nullable: true}
    post:
      summary: Create a meeting room
      operationId: createMeetingRoom
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, lobby_policy]
              properties:
                name: {type: string, maxLength: 100}
                topic: {type: string, maxLength: 250}
                lobby_policy: {type: string, enum: [Open, KnockToEnter, InvitedOnly]}
                waiting_room_policy: {type: string, enum: [None, AllGuests, NonMembers]}
                retention_policy_id: {type: string}
                e2e_mode: {type: boolean, default: false}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingRoom'}

  /meeting-rooms/{room_id}:
    get:
      summary: Read a meeting room
      operationId: getMeetingRoom
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingRoom'}
    delete:
      summary: Archive a meeting room
      operationId: archiveMeetingRoom
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '202': {description: Archived}

  /meeting-rooms/{room_id}/instances:
    post:
      summary: Start a meeting instance for a room
      operationId: startMeetingInstance
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                calendar_event_id: {type: string}
                webinar_mode: {type: boolean, default: false}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingInstance'}

  /meeting-instances/{instance_id}:
    get:
      summary: Read a meeting instance
      operationId: getMeetingInstance
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeetingInstance'}
    post:
      summary: End a meeting instance (host only)
      operationId: endMeetingInstance
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202': {description: Ended}

  /meeting-instances/{instance_id}/join:
    post:
      summary: Request join (issues LiveKit access token if approved or lobby ticket if not)
      operationId: joinMeeting
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, maxLength: 80}
                consent_acknowledged: {type: boolean, description: Per recording-consent policy}
      responses:
        '200':
          description: Approved — LiveKit token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  livekit_token: {type: string}
                  livekit_url: {type: string}
                  role: {type: string}
        '202':
          description: Pending lobby approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  lobby_ticket: {type: string}

  /meeting-instances/{instance_id}/lobby:
    get:
      summary: List pending lobby members
      operationId: listLobby
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Lobby members
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items: {$ref: '#/components/schemas/Participant'}

  /meeting-instances/{instance_id}/lobby/{user_ref}:
    post:
      summary: Approve or deny a lobby member
      operationId: approveLobbyMember
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
        - {in: path, name: user_ref, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, deny]}
      responses:
        '200': {description: Approved/Denied}

  /meeting-instances/{instance_id}/recording:
    post:
      summary: Start recording
      operationId: startRecording
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '201':
          description: Recording started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recording'}
    delete:
      summary: Stop recording (auto-stops on meeting-end too)
      operationId: stopRecording
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202': {description: Stopped}

  /meeting-instances/{instance_id}/transcription:
    post:
      summary: Start live captions + transcript
      operationId: startTranscription
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_languages:
                  type: array
                  items: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
      responses:
        '201':
          description: Transcription started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transcript'}

  /meeting-instances/{instance_id}/breakout-rooms:
    post:
      summary: Create breakout rooms
      operationId: createBreakoutRooms
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      member_refs: {type: array, items: {type: string}}
      responses:
        '201': {description: Created}

  /meeting-instances/{instance_id}/live-stream:
    post:
      summary: Start RTMP/WHIP egress to external streaming platform
      operationId: startLiveStreamEgress
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, legal_attestation]
              properties:
                destination: {$ref: '#/components/schemas/EgressDestination'}
                legal_attestation: {type: boolean, description: Host attests legality per ADR-MEET-0004}
      responses:
        '201': {description: Egress started}

  /recordings/{recording_id}:
    get:
      summary: Read recording metadata + signed blob URL
      operationId: getRecording
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/RecordingId'
      responses:
        '200':
          description: Recording
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recording'}

  /transcripts/{transcript_id}:
    get:
      summary: Read transcript + signed blob URL
      operationId: getTranscript
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - {in: path, name: transcript_id, required: true, schema: {type: string, format: ulid}}
      responses:
        '200':
          description: Transcript
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transcript'}

  /transcripts/{transcript_id}/summary:
    get:
      summary: Read AI summary (per ADR-MEET-0006; AI-generated label included)
      operationId: getSummary
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - {in: path, name: transcript_id, required: true, schema: {type: string, format: ulid}}
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Summary'}

  /transcripts/search:
    get:
      summary: Search transcripts across meetings caller can read
      operationId: searchTranscripts
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - {in: query, name: q, required: true, schema: {type: string}}
        - {in: query, name: room_id, schema: {type: string}}
        - {in: query, name: before, schema: {type: string, format: date-time}}
        - {in: query, name: after, schema: {type: string, format: date-time}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Results (Cedar-filtered server-side; PHI-redacted snippets in pack-us-healthcare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        transcript_id: {type: string}
                        instance_id: {type: string}
                        snippet: {type: string}
                        score: {type: number}
                  total_hits: {type: integer}
                  took_ms: {type: integer}

  /webinars/{webinar_id}/registration:
    post:
      summary: Open registration (host only)
      operationId: openWebinarRegistration
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_form: {type: boolean}
                custom_fields: {type: object, additionalProperties: {type: string}}
      responses:
        '201': {description: Registration opened}

  /webinars/{webinar_id}/registrations:
    post:
      summary: Submit a registration (may be anonymous if public_form == true)
      operationId: submitWebinarRegistration
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendee_email]
              properties:
                attendee_email: {type: string, format: email}
                custom_fields: {type: object, additionalProperties: true}
      responses:
        '201':
          description: Registration submitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebinarRegistration'}

  /holds:
    post:
      summary: Open eDiscovery hold on recordings/transcripts (compliance-officer entitlement required)
      operationId: openEDiscoveryHold
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: object
                  properties:
                    room_ids: {type: array, items: {type: string}}
                    recording_ids: {type: array, items: {type: string}}
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                reason: {type: string}
      responses:
        '201':
          description: Hold opened
          content:
            application/json:
              schema:
                type: object
                properties: {hold_id: {type: string}}

  /disclosures:
    post:
      summary: Request four-eyes recording disclosure (paired action)
      operationId: requestDisclosure
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recording_ids, reason, paired_approver_id]
              properties:
                recording_ids: {type: array, items: {type: string}}
                reason: {type: string}
                paired_approver_id: {type: string}
      responses:
        '202': {description: Awaiting paired approval}

  /health:
    get:
      summary: Liveness
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness (Postgres + Valkey + LiveKit + coturn reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
