# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:meet:t1-assist:v1
name: live-captions-transcription-summary
namespace: meet
display_name: Live Captions + Post-Meeting Transcript + AI Summary + Translation
description: |
  T1 assist capability: user-invoked, human-in-loop. Four sub-capabilities
  bundled (each can be enabled/disabled per meeting):

  1. Live captions  — real-time speech-to-text via Whisper-medium streaming
     (≤ 500ms p99); 60+ languages.
  2. Post-meeting transcript  — batch speech-to-text via Whisper-large
     (≤ 60s for 60min meeting); per-language; searchable.
  3. AI summary  — post-meeting LLM-generated summary + action-item extraction.
  4. Live translation  — caption overlay translated into the participant's
     preferred locale.

  User retains final approval before any cross-µservice artifact (e.g., mail
  digest, Workflow task) is created from summary outputs. Recording must be
  enabled (or live captions standalone) for these to operate.

owner_team: axis-meet + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-MEET-0002, ADR-MEET-0003, ADR-MEET-0006]
related_artifacts:
  - microservices/meet/PRD.md (FR-07, FR-16)
  - microservices/meet/IP-009-transcription-pipeline.md
  - microservices/meet/policy/meeting-scope.cedar
  - microservices/meet/policy/recording-consent.md

autonomy_tier: T1
# T1 = user-invoked, human-in-loop; no autonomous write to user's view beyond
# the AI-generated label per Art. 50.

inputs:
  - name: instance_id
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'  # ULID
    required: true
  - name: invoking_user_ref
    type: string
    required: true
  - name: sub_capability
    type: enum
    values: [live_captions, transcript, summary, translation]
    required: true
  - name: target_languages
    type: array
    items: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
    required: false
    description: For live_captions and translation

outputs:
  - name: caption_stream
    type: stream
    description: WebSocket frame stream for live_captions sub-capability
  - name: transcript
    type: object
    description: Post-meeting transcript JSON; sealed at meeting-end
  - name: summary
    type: object
    description: AI summary + action-items
    properties:
      bullet_points: {type: array, items: {type: string}, max_items: 10}
      key_participants: {type: array, items: {type: string}}
      action_items:
        type: array
        max_items: 20
        items:
          type: object
          properties:
            text: {type: string, maxLength: 300}
            assignee_ref: {type: string, nullable: true}
            due_hint: {type: string, format: date-time, nullable: true}
            source_segment_ids: {type: array, items: {type: string}}
            confidence: {type: number, minimum: 0, maximum: 1}
      content_hash: {type: string}
      ai_generated_label: {type: string, default: "AI-generated; please review."}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI  # pack-us-healthcare meeting recordings; controlled access
  - BROKER_DEALER_RECORDED_COMMUNICATION  # pack-us-financial

e2e_mode_interaction:
  refused: true
  reason: ADR-MEET-0003 — recording + transcription + AI summary structurally Cedar-denied when meeting e2e_mode=true

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    transcript: enabled_with_baa
    summary: disabled_by_default  # opt-in per meeting + BAA-extension
    translation: disabled_for_phi_rooms  # only on-prem local-mbart
    reason: HIPAA 45 CFR §164.502(b) — minimum necessary; §164.514 Safe Harbour
  pack-us-financial:
    transcript: enabled_supervised_archive  # capture into SEC 17a-4 supervisory archive
    summary: enabled
    reason: FINRA Rule 4511 + SEC 17a-4(f)
  pack-eu:
    risk_classification:
      live_captions: limited_risk
      transcript: limited_risk
      summary: limited_risk
      translation: limited_risk
    transparency_obligation: must-label-as-AI-generated per EU AI Act Art. 50
    reference_adr: ADR-MEET-0006
    mifid_ii: transcript_retained_5_to_7_years_for_investment_firms
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in + per-user end-user notice
    kr_pipa_art_15: recording-consent modal acknowledgement required before activation

evidence_topic: oya.meet.capability.t1_assist.evidence

cost_profile:
  type: per-minute-of-meeting
  estimated_cost_usd_per_min: 0.020
  cost_drivers:
    - Whisper-medium streaming inference (GPU)
    - Whisper-large batch inference (GPU)
    - foundry-runtime LLM for summary (medium open-weights model)
    - faster-whisper / CTranslate2 acceleration

cedar_policy_fragments:
  - microservices/meet/policy/meeting-scope.cedar
  - microservices/meet/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/meet/capabilities/eval/t1-assist-baseline.jsonl
  pass_threshold:
    live_captions_wer: 0.92  # WER ≤ 8 % on LibriSpeech-test
    transcript_wer: 0.95
    summary_faithfulness: 0.92  # human-rater Likert vs reference
    translation_bleu: 0.40  # BLEU ≥ 40 on WMT22-newstest reference
  eval_metric: WER (transcription); ROUGE-Lsum + human eval (summary); BLEU + chrF++ + COMET (translation)
  cadence: per-release
  reference:
    - LibriSpeech / CommonVoice (transcription)
    - WMT22-newstest (translation)
    - HELM (LLM summary)

model_versions:
  live_captions_streaming:
    model: whisper-medium
    backend: faster-whisper + CTranslate2
    gpu_class: A10 or L4
    target_latency_p99_ms: 500
  transcript_batch:
    model: whisper-large-v3
    backend: faster-whisper + CTranslate2
    gpu_class: L4 or A100
    target_realtime_multiplier: 5x
  summary:
    model: open-weights medium-LLM (specific version pinned at deploy)
    gpu_class: L4
  translation:
    model: open-weights mBART-50 or NLLB-200
    backend: faster-whisper + LLM-translate hybrid
    gpu_class: L4

sunset:
  status: none
