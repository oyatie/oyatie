asyncapi: 3.1.0
info:
  title: oya-cloud-iac — IaC pipeline events
  version: 1.0.0
  summary: Render / Apply / Rollback / Drift events emitted by the cloud-iac µservice
  description: |
    Cross-µservice Workflow events emitted by `oya-cloud-iac-iac-*-worker` crates.
    Per PRD §"Workflow events produced" and the observability SLO gate integration
    (ADR-0139).

    Consumers:
    - `audit-chain` µservice (Ed25519 seal of every event per Bominal ADR-0028)
    - `observability` µservice (SLO gate signal; per ADR-0139)
    - `foundry-evidence` µservice (apply provenance + multispectrum evidence)
    - `grafana-oncall` (incident paging on rollback / drift / supply-chain failure)
  contact:
    name: axis-cloud-iac

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.cloud-iac.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus consumed by audit-chain + foundry-evidence + observability + grafana-oncall.

channels:
  render-requested:
    address: workflow-events/render.requested
    messages:
      RenderRequestedMessage:
        $ref: '#/components/messages/RenderRequested'
    description: A render was requested (PR webhook or manual trigger).

  render-completed:
    address: workflow-events/render.completed
    messages:
      RenderCompletedMessage:
        $ref: '#/components/messages/RenderCompleted'
    description: A render finished; rendered manifest digest is available.

  apply-started:
    address: workflow-events/apply.started
    messages:
      ApplyStartedMessage:
        $ref: '#/components/messages/ApplyStarted'
    description: An apply job started executing.

  apply-completed:
    address: workflow-events/apply.completed
    messages:
      ApplyCompletedMessage:
        $ref: '#/components/messages/ApplyCompleted'
    description: An apply job completed successfully; cluster state matches manifest.

  apply-rolled-back:
    address: workflow-events/apply.rolled_back
    messages:
      ApplyRolledBackMessage:
        $ref: '#/components/messages/ApplyRolledBack'
    description: An apply state was reverted to a prior apply.

  drift-detected:
    address: workflow-events/drift.detected
    messages:
      DriftDetectedMessage:
        $ref: '#/components/messages/DriftDetected'
    description: drift-detector found live cluster ≠ git-declared.

  microservice-registered:
    address: workflow-events/microservice.registered
    messages:
      MicroserviceRegisteredMessage:
        $ref: '#/components/messages/MicroserviceRegistered'
    description: A new µservice was onboarded into the iac-registry.

operations:
  emitRenderRequested:
    action: send
    channel:
      $ref: '#/channels/render-requested'
  emitRenderCompleted:
    action: send
    channel:
      $ref: '#/channels/render-completed'
  emitApplyStarted:
    action: send
    channel:
      $ref: '#/channels/apply-started'
  emitApplyCompleted:
    action: send
    channel:
      $ref: '#/channels/apply-completed'
  emitApplyRolledBack:
    action: send
    channel:
      $ref: '#/channels/apply-rolled-back'
  emitDriftDetected:
    action: send
    channel:
      $ref: '#/channels/drift-detected'
  emitMicroserviceRegistered:
    action: send
    channel:
      $ref: '#/channels/microservice-registered'

components:
  messages:
    RenderRequested:
      name: RenderRequested
      contentType: application/json
      summary: A render was requested
      payload:
        $ref: '#/components/schemas/RenderRequestedPayload'
    RenderCompleted:
      name: RenderCompleted
      contentType: application/json
      summary: A render completed
      payload:
        $ref: '#/components/schemas/RenderCompletedPayload'
    ApplyStarted:
      name: ApplyStarted
      contentType: application/json
      summary: An apply started
      payload:
        $ref: '#/components/schemas/ApplyStartedPayload'
    ApplyCompleted:
      name: ApplyCompleted
      contentType: application/json
      summary: An apply completed
      payload:
        $ref: '#/components/schemas/ApplyCompletedPayload'
    ApplyRolledBack:
      name: ApplyRolledBack
      contentType: application/json
      summary: A state reverted to a prior apply
      payload:
        $ref: '#/components/schemas/ApplyRolledBackPayload'
    DriftDetected:
      name: DriftDetected
      contentType: application/json
      summary: Live cluster diverged from git
      payload:
        $ref: '#/components/schemas/DriftDetectedPayload'
    MicroserviceRegistered:
      name: MicroserviceRegistered
      contentType: application/json
      summary: A new µservice was onboarded
      payload:
        $ref: '#/components/schemas/MicroserviceRegisteredPayload'

  schemas:
    RenderRequestedPayload:
      type: object
      required: [render_id, microservice, sha, pack, environment, requested_at]
      properties:
        render_id: {type: string, description: ULID}
        microservice: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        pack: {type: string}
        environment: {type: string, enum: [dev, staging, production]}
        requested_at: {type: string, format: date-time}
        requested_by: {type: string}
        trigger:
          type: string
          enum: [pr_webhook, manual, scheduled]

    RenderCompletedPayload:
      type: object
      required: [render_id, microservice, content_digest, rendered_at]
      properties:
        render_id: {type: string}
        microservice: {type: string}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        rendered_bytes_count: {type: integer}
        renderer_version: {type: string}
        rendered_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 signature by iac-renderer-worker}

    ApplyStartedPayload:
      type: object
      required: [apply_id, microservice, pack, environment, sha, started_at]
      properties:
        apply_id: {type: string, description: ULID}
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        sha: {type: string}
        content_digest: {type: string}
        started_at: {type: string, format: date-time}
        actor: {type: string}
        eligibility_verdict_signature: {type: string, description: Signed eligibility verdict from observability}
        slsa_attestation_digest: {type: string}
        signature: {type: string}

    ApplyCompletedPayload:
      type: object
      required: [apply_id, microservice, pack, environment, sha, completed_at]
      properties:
        apply_id: {type: string}
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        sha: {type: string}
        completed_at: {type: string, format: date-time}
        duration_seconds: {type: number}
        resources_applied:
          type: object
          properties:
            added: {type: integer}
            changed: {type: integer}
            destroyed: {type: integer}
        signature: {type: string}

    ApplyRolledBackPayload:
      type: object
      required: [rollback_id, microservice, pack, environment, from_apply_id, to_apply_id, reason, executed_at]
      properties:
        rollback_id: {type: string, description: ULID}
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string, enum: [production]}
        from_apply_id: {type: string}
        to_apply_id: {type: string}
        reason:
          type: string
          enum: [fast_burn_breach, slow_burn_breach, drift_remediation, supply_chain_response, manual_override, post_mortem_remediation]
        executed_at: {type: string, format: date-time}
        chain_depth: {type: integer, description: 0 for first rollback; 1+ for rollback-of-rollback}
        signature: {type: string}

    DriftDetectedPayload:
      type: object
      required: [microservice, pack, environment, drift_score, detected_at]
      properties:
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        drift_score: {type: number, minimum: 0, maximum: 1}
        detected_at: {type: string, format: date-time}
        drift_item_count: {type: integer}
        first_drifted_resource:
          type: object
          properties:
            kind: {type: string}
            name: {type: string}
            namespace: {type: string, nullable: true}
        signature: {type: string}

    MicroserviceRegisteredPayload:
      type: object
      required: [microservice, registered_at]
      properties:
        microservice: {type: string}
        registered_at: {type: string, format: date-time}
        iac_paths:
          type: array
          items: {type: string}
        signature: {type: string}
