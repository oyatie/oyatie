openapi: 3.2.0
info:
  title: oya-cloud-iac
  version: 1.0.0
  summary: REST API for the cloud-iac meta-IaC pipeline — render + plan-preview + apply + rollback + registry + drift queries
  description: |
    Internal-facing and operator-facing REST surface for the cloud-iac µservice. All
    mutation endpoints require OIDC + Cedar policy authorization (per
    `iac/policy/*.cedar`) + SPIFFE identity (for service-to-service
    calls). Reads are scoped per-µservice (and downstream tenant) via the X-Microservice
    header convention + Cedar policy enforcement at the rest layer.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT
    carries the principal's microservice_scope claim. The X-Microservice header MUST
    match the claim; mismatch returns 401.
  contact:
    name: axis-cloud-iac
    url: https://oyatie.com/teams/axis-cloud-iac
  license:
    name: Internal
servers:
  - url: https://cloud-iac-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cloud-iac
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Historical local-verifier wording is superseded for active work: local oya verifier/gate/check wrappers are retired authority mechanisms, and the cloud-ci/oya-ci pipeline status oya-ci-required is the single required CI authority.
        enforced_by:
          - oya-ci-required
          - cloud-ci-shared-rust-gate-logic
          - local-authority-enforcer
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - retired-fitness-residue-detection
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Historical bridge-CI parity wording is superseded for active work: GitHub Actions produces the live required oya-ci-required context until the owned oya-ci runner cutover; ArgoCD remains the GitOps CD bridge/reference adapter.
        enforced_by:
          - oya-ci-required
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    SPIFFE:
      type: mutualTLS
      description: SPIFFE identity for service-to-service calls
  parameters:
    XMicroservice:
      in: header
      name: X-Microservice
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
      description: principal's bound microservice_scope; must match JWT claim
    Microservice:
      in: path
      name: microservice
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    Pack:
      in: path
      name: pack
      required: true
      schema:
        type: string
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
    Environment:
      in: path
      name: environment
      required: true
      schema:
        type: string
        enum: [dev, staging, production]
    Sha:
      in: path
      name: sha
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{40}$'
    ApplyId:
      in: path
      name: apply_id
      required: true
      schema:
        type: string
        description: ULID
  schemas:
    ChartSource:
      type: object
      required: [microservice, chart_name, version, digest]
      properties:
        microservice: {type: string}
        chart_name: {type: string}
        version: {type: string}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        signed_by: {type: string, nullable: true}
    RenderedManifest:
      type: object
      required: [microservice, content_digest, rendered_bytes_count]
      properties:
        microservice: {type: string}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        rendered_bytes_count: {type: integer}
        renderer_version: {type: string}
        rendered_at: {type: string, format: date-time}
    PlanPreview:
      type: object
      required: [microservice, plan_id, summary, changes]
      properties:
        microservice: {type: string}
        plan_id: {type: string}
        summary:
          type: object
          properties:
            add: {type: integer}
            change: {type: integer}
            destroy: {type: integer}
        changes:
          type: array
          items:
            type: object
            properties:
              action: {type: string, enum: [add, change, destroy]}
              kind: {type: string}
              name: {type: string}
              namespace: {type: string, nullable: true}
        validation_verdict: {type: string, enum: [allow, refuse, advisory]}
    DriftReport:
      type: object
      required: [microservice, pack, environment, drift_score, detected_at, drift_items]
      properties:
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        drift_score: {type: number, minimum: 0, maximum: 1}
        detected_at: {type: string, format: date-time}
        drift_items:
          type: array
          items:
            type: object
            properties:
              kind: {type: string}
              name: {type: string}
              namespace: {type: string, nullable: true}
              live_value: {type: object}
              declared_value: {type: object}
    ApplyJob:
      type: object
      required: [apply_id, microservice, pack, environment, sha, state]
      properties:
        apply_id: {type: string}
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        sha: {type: string}
        state: {type: string, enum: [pending, running, completed, failed, rolled_back]}
        started_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        actor: {type: string}
        signature: {type: string}
    ApplyStateRecord:
      type: object
      required: [microservice, pack, environment, current_sha, applied_at]
      properties:
        microservice: {type: string}
        pack: {type: string}
        environment: {type: string}
        current_sha: {type: string}
        prior_sha: {type: string, nullable: true}
        applied_at: {type: string, format: date-time}
        applied_by: {type: string}
        signature: {type: string}
        slsa_attestation_digest: {type: string, nullable: true}
    Provenance:
      type: object
      required: [artifact_digest, slsa_level, sigstore_signature, builder_id]
      properties:
        artifact_digest: {type: string}
        slsa_level: {type: string, enum: [SLSA_L1, SLSA_L2, SLSA_L3, SLSA_L4]}
        sigstore_signature: {type: string}
        builder_id: {type: string}
        rekor_log_index: {type: integer, nullable: true}
        verified_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /microservices/{microservice}/render:
    post:
      summary: Trigger a render of a µservice's IaC sources (Helm + Kustomize + OpenTofu-plan)
      operationId: triggerRender
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sha: {type: string, description: git SHA to render at}
                pack: {type: string}
                environment: {type: string, enum: [dev, staging, production]}
      responses:
        '202':
          description: Render queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  render_id: {type: string}
                  estimated_completion: {type: string, format: date-time}
        '401':
          description: OIDC missing or X-Microservice mismatch
        '403':
          description: Cedar policy denied

  /microservices/{microservice}/render/{render_id}:
    get:
      summary: Read the render result for a render_id
      operationId: getRenderResult
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
        - in: path
          name: render_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Render result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenderedManifest'}
        '404':
          description: Render not found

  /microservices/{microservice}/plan-preview:
    post:
      summary: Compute plan-preview for a (microservice, environment) tuple
      operationId: planPreview
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack, environment, sha]
              properties:
                pack: {type: string}
                environment: {type: string}
                sha: {type: string}
      responses:
        '200':
          description: Plan-preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanPreview'}
        '403':
          description: Cedar policy denied OR apply-scope violation in proposed plan

  /microservices/{microservice}/apply:
    post:
      summary: Trigger an apply (requires SPIFFE identity of authorized applier)
      operationId: triggerApply
      security:
        - SPIFFE: []
      parameters:
        - $ref: '#/components/parameters/Microservice'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack, environment, sha]
              properties:
                pack: {type: string}
                environment: {type: string}
                sha: {type: string}
                eligibility_verdict_signature:
                  type: string
                  description: Signed eligibility verdict from observability SLO gate
      responses:
        '202':
          description: Apply queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  apply_id: {type: string}
        '403':
          description: Apply-scope violation OR SLSA L3 verification failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /microservices/{microservice}/apply/{apply_id}:
    get:
      summary: Read the status of an apply job
      operationId: getApplyJob
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/ApplyId'
      responses:
        '200':
          description: Apply job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplyJob'}

  /microservices/{microservice}/apply-state/{environment}:
    get:
      summary: Read the latest apply-state record for (microservice, environment)
      operationId: getApplyState
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Apply state record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplyStateRecord'}
        '404':
          description: No apply yet

  /microservices/{microservice}/rollback:
    post:
      summary: Trigger a rollback of a µservice's IaC state to a prior apply
      operationId: triggerRollback
      security:
        - SPIFFE: []
      parameters:
        - $ref: '#/components/parameters/Microservice'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack, environment, to_apply_id, reason]
              properties:
                pack: {type: string}
                environment: {type: string}
                to_apply_id: {type: string}
                reason:
                  type: string
                  enum: [fast_burn_breach, slow_burn_breach, drift_remediation, supply_chain_response, manual_override, post_mortem_remediation]
      responses:
        '202':
          description: Rollback queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollback_id: {type: string}

  /microservices/{microservice}/drift-report/{pack}/{environment}:
    get:
      summary: Read the latest drift report
      operationId: getDriftReport
      parameters:
        - $ref: '#/components/parameters/XMicroservice'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/Pack'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Drift report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriftReport'}

  /charts/{digest}/provenance:
    get:
      summary: Read SLSA L3 provenance for a chart digest
      operationId: getProvenance
      parameters:
        - in: path
          name: digest
          required: true
          schema: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      responses:
        '200':
          description: Provenance record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provenance'}

  /charts/validate:
    post:
      summary: Validate a chart signature + SLSA attestation (public; anonymous)
      operationId: validateChartSignature
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest, signature]
              properties:
                digest: {type: string}
                signature: {type: string}
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  rekor_log_index: {type: integer, nullable: true}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres reachable + ArgoCD reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
