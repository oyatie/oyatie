// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// cloud-iac — gRPC contract
// Internal-only service RPC projection; contracts/openapi/cloud-iac.yaml remains the public client contract.
// Per PRD-cloud-iac + ADR-0131.

syntax = "proto3";

package oya.cloud_iac.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: CloudIac
// =========================================================================
//
// Authn: SPIFFE mTLS workload identity with TLS 1.3; user-token authentication belongs to REST/OpenAPI.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata key "x-microservice" = "<microservice-id>".

service CloudIac {
  // Render a microservice's IaC sources.
  rpc TriggerRender(TriggerRenderRequest) returns (TriggerRenderResponse);

  // Read the result of a render.
  rpc GetRenderResult(GetRenderResultRequest) returns (RenderedManifest);

  // Compute plan-preview.
  rpc PlanPreview(PlanPreviewRequest) returns (PlanPreviewResponse);

  // Trigger an apply. SPIFFE-only.
  rpc TriggerApply(TriggerApplyRequest) returns (TriggerApplyResponse);

  // Read the status of an apply job.
  rpc GetApplyJob(GetApplyJobRequest) returns (ApplyJob);

  // Stream all apply-job status transitions for a microservice.
  rpc StreamApplyJobs(StreamApplyJobsRequest) returns (stream ApplyJob);

  // Read the latest apply-state record for (microservice, environment).
  rpc GetApplyState(GetApplyStateRequest) returns (ApplyStateRecord);

  // Trigger a rollback. SPIFFE-only.
  rpc TriggerRollback(TriggerRollbackRequest) returns (TriggerRollbackResponse);

  // Read the latest drift report.
  rpc GetDriftReport(GetDriftReportRequest) returns (DriftReport);

  // Read SLSA L3 provenance for a chart digest.
  rpc GetProvenance(GetProvenanceRequest) returns (Provenance);

  // Validate a chart signature + attestation (anonymous-allowed).
  rpc ValidateChartSignature(ValidateChartSignatureRequest) returns (ValidateChartSignatureResponse);
}

// =========================================================================
// Common types
// =========================================================================

enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_DEV = 1;
  ENVIRONMENT_STAGING = 2;
  ENVIRONMENT_PRODUCTION = 3;
}

enum ApplyState {
  APPLY_STATE_UNSPECIFIED = 0;
  APPLY_STATE_PENDING = 1;
  APPLY_STATE_RUNNING = 2;
  APPLY_STATE_COMPLETED = 3;
  APPLY_STATE_FAILED = 4;
  APPLY_STATE_ROLLED_BACK = 5;
}

enum RollbackReason {
  ROLLBACK_REASON_UNSPECIFIED = 0;
  ROLLBACK_REASON_FAST_BURN_BREACH = 1;
  ROLLBACK_REASON_SLOW_BURN_BREACH = 2;
  ROLLBACK_REASON_DRIFT_REMEDIATION = 3;
  ROLLBACK_REASON_SUPPLY_CHAIN_RESPONSE = 4;
  ROLLBACK_REASON_MANUAL_OVERRIDE = 5;
  ROLLBACK_REASON_POST_MORTEM_REMEDIATION = 6;
}

enum SlsaLevel {
  SLSA_LEVEL_UNSPECIFIED = 0;
  SLSA_LEVEL_L1 = 1;
  SLSA_LEVEL_L2 = 2;
  SLSA_LEVEL_L3 = 3;
  SLSA_LEVEL_L4 = 4;
}

enum ValidationVerdict {
  VALIDATION_VERDICT_UNSPECIFIED = 0;
  VALIDATION_VERDICT_ALLOW = 1;
  VALIDATION_VERDICT_REFUSE = 2;
  VALIDATION_VERDICT_ADVISORY = 3;
}

message ChartSource {
  string microservice = 1;
  string chart_name = 2;
  string version = 3;
  string digest = 4;          // sha256:<64-hex>
  string signed_by = 5;
}

message RenderedManifest {
  string microservice = 1;
  string content_digest = 2;
  uint64 rendered_bytes_count = 3;
  string renderer_version = 4;
  google.protobuf.Timestamp rendered_at = 5;
  string signature = 6;
}

message PlanChange {
  string action = 1;           // add | change | destroy
  string kind = 2;
  string name = 3;
  string namespace = 4;
}

message PlanSummary {
  uint32 add = 1;
  uint32 change = 2;
  uint32 destroy = 3;
}

message ApplyJob {
  string apply_id = 1;
  string microservice = 2;
  string pack = 3;
  Environment environment = 4;
  string sha = 5;
  ApplyState state = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string actor = 9;
  string signature = 10;
}

message ApplyStateRecord {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
  string current_sha = 4;
  string prior_sha = 5;
  google.protobuf.Timestamp applied_at = 6;
  string applied_by = 7;
  string signature = 8;
  string slsa_attestation_digest = 9;
}

message DriftItem {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  bytes live_value_json = 4;
  bytes declared_value_json = 5;
}

message DriftReport {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
  double drift_score = 4;
  google.protobuf.Timestamp detected_at = 5;
  repeated DriftItem drift_items = 6;
  string signature = 7;
}

message Provenance {
  string artifact_digest = 1;
  SlsaLevel slsa_level = 2;
  string sigstore_signature = 3;
  string builder_id = 4;
  uint64 rekor_log_index = 5;
  google.protobuf.Timestamp verified_at = 6;
}

// =========================================================================
// Request / response messages
// =========================================================================

message TriggerRenderRequest {
  string microservice = 1;
  string sha = 2;
  string pack = 3;
  Environment environment = 4;
}

message TriggerRenderResponse {
  string render_id = 1;
  google.protobuf.Timestamp estimated_completion = 2;
}

message GetRenderResultRequest {
  string microservice = 1;
  string render_id = 2;
}

message PlanPreviewRequest {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
  string sha = 4;
}

message PlanPreviewResponse {
  string microservice = 1;
  string plan_id = 2;
  PlanSummary summary = 3;
  repeated PlanChange changes = 4;
  ValidationVerdict validation_verdict = 5;
}

message TriggerApplyRequest {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
  string sha = 4;
  string eligibility_verdict_signature = 5;
}

message TriggerApplyResponse {
  string apply_id = 1;
}

message GetApplyJobRequest {
  string microservice = 1;
  string apply_id = 2;
}

message StreamApplyJobsRequest {
  string microservice = 1;
  google.protobuf.Timestamp since = 2;
}

message GetApplyStateRequest {
  string microservice = 1;
  Environment environment = 2;
}

message TriggerRollbackRequest {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
  string to_apply_id = 4;
  RollbackReason reason = 5;
}

message TriggerRollbackResponse {
  string rollback_id = 1;
}

message GetDriftReportRequest {
  string microservice = 1;
  string pack = 2;
  Environment environment = 3;
}

message GetProvenanceRequest {
  string digest = 1;
}

message ValidateChartSignatureRequest {
  string digest = 1;
  string signature = 2;
}

message ValidateChartSignatureResponse {
  bool valid = 1;
  uint64 rekor_log_index = 2;
}
