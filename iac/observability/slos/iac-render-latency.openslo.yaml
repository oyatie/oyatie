# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-iac-iac-render-latency
  displayName: "cloud-iac: IaC render latency p95 ≤ 10s"
  labels:
    microservice: cloud-iac
    bounded_context: iac-renderer
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-iac
    pack_scope: all
spec:
  service: cloud-iac
  description: |
    IaC render latency p95 SLO. A render is "good" when the per-pack
    template-resolve + variable-substitution + manifest-emit completes in
    ≤ 10s p95 for the standard composition (Helm + Kustomize + OpenTofu
    overlays). Per PRD §"Performance Targets" render-path.
  indicator:
    metadata:
      name: cloud-iac-render-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_render_duration_seconds_bucket{le="10"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_render_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 10s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
