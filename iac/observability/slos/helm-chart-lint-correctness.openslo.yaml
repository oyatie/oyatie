# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-iac-helm-chart-lint-correctness
  displayName: "cloud-iac: Helm chart lint correctness 100%"
  labels:
    microservice: cloud-iac
    bounded_context: iac-validator
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-cloud-iac
    pack_scope: all
spec:
  service: cloud-iac
  description: |
    Helm chart lint correctness SLO. A chart is "good" when `helm lint`
    AND the canonical extended-lint suite (security-hardening rules,
    image-pinning, no-default-secret) both pass on every render. Per
    PRD §"Quality Gates" Helm-lint requirement. Target = 100%.
  indicator:
    metadata:
      name: cloud-iac-helm-lint-pass-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_helm_lint_total{outcome="pass"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_helm_lint_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% Helm-lint pass (any miss blocks promotion)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
