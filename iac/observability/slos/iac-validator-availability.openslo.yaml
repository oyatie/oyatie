# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-iac-iac-validator-availability
  displayName: "cloud-iac: IaC validator availability 99.9%"
  labels:
    microservice: cloud-iac
    bounded_context: iac-validator
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-iac
    pack_scope: all
spec:
  service: cloud-iac
  description: |
    IaC validator availability SLO. A validate is "good" when the policy
    + schema + lint pipeline returns a verdict (Pass/Fail) within deadline.
    Crash/Panic/Timeout counted as bad. Per PRD §"Reliability" validator-
    must-be-online requirement.
  indicator:
    metadata:
      name: cloud-iac-validator-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_validate_total{outcome=~"pass|fail"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_validate_total[5m]))
  objectives:
    - target: 0.999
      displayName: "30d rolling validator availability ≥ 99.9%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
