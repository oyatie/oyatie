# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-iac-iac-rollback-latency
  displayName: "cloud-iac: IaC rollback latency p95 ≤ 60s"
  labels:
    microservice: cloud-iac
    bounded_context: iac-rollback-engine
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-iac + ops-incident-response
    pack_scope: all
spec:
  service: cloud-iac
  description: |
    IaC rollback latency p95 SLO. A rollback is "good" when the previous-
    known-good revision is re-applied + healthcheck-confirmed within
    ≤ 60s p95. Required to keep incident MTTR within budget. Per
    ADR-0124 automated-rollback primitive.
  indicator:
    metadata:
      name: cloud-iac-rollback-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_rollback_duration_seconds_bucket{le="60"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_rollback_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 60s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
