# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: iac-app-slsa-provenance-completeness
  displayName: "iac-app: SLSA provenance completeness 100% (L3 build provenance)"
  labels:
    microservice: iac-app
    bounded_context: iac-applier
    sli_class: correctness
    tier: load-bearing-invariant
    plane: audit
    owner_team: axis-iac-app + council-security
    pack_scope: all
    compliance: [SLSA-L3, NIST-SSDF, OWASP-SCVS]
spec:
  service: iac-app
  description: |
    SLSA L3 build-provenance completeness SLO. An apply is "good" when its
    associated artifact carries a SLSA L3 attestation chain (builder-id +
    in-toto provenance + signed material list). Any apply missing
    provenance = supply-chain trust failure. Per ADR-0125 SLSA-L3 mandate.
    Target = 100% (any miss is Sev-2).
  indicator:
    metadata:
      name: iac-app-slsa-provenance-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(iac_apply_total{slsa_l3="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(iac_apply_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% SLSA L3 provenance completeness (any miss is Sev-2)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
