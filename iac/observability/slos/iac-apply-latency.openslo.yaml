# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-iac-iac-apply-latency
  displayName: "cloud-iac: IaC apply latency p95 ≤ 30s"
  labels:
    microservice: cloud-iac
    bounded_context: iac-applier
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-iac
    pack_scope: all
spec:
  service: cloud-iac
  description: |
    IaC apply latency p95 SLO. An apply is "good" when the orchestrated
    sync (ArgoCD/Flux pickup → OpenTofu/Helm/Kustomize plan-and-apply →
    healthcheck → drift-zero confirmation) completes in ≤ 30s p95 for the
    standard 50-resource manifest. Per PRD §"Performance Targets" apply
    hot-path.
  indicator:
    metadata:
      name: cloud-iac-apply-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_apply_duration_seconds_bucket{le="30"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_iac_apply_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 30s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
