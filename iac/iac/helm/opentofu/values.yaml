# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
opentofu:
  image:
    registry: docker.io
    repository: opentofu/opentofu
    tag: "1.8.0"  # LTS pin
  runner:
    # capacity-model.md XS tier: 3 replicas HA min
    replicas: 3
    resources:
      requests: {cpu: "2", memory: "4Gi"}
      limits: {cpu: "4", memory: "8Gi"}
    pluginCachePath: /opt/opentofu/plugin-cache
  state:
    backend: s3
    encryption:
      enabled: true
      provider: kms
      kms_key_id: "${openbao:secret/iac-app/opentofu/kms-key-id}"
    s3:
      endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
      bucket_name: "iac-app-state-${PACK}"
      access_key_id: "${openbao:secret/iac-app/opentofu/s3-access-key}"
      secret_access_key: "${openbao:secret/iac-app/opentofu/s3-secret-key}"
      versioning: enabled
      object_lock_mode: compliance  # WORM
  lock:
    backend: postgres
    connection_string: "${openbao:secret/iac-app/opentofu/state-lock-pg-dsn}"
    timeout_seconds: 600  # per failure-modes.md FM-04
  plan:
    timeout_seconds: 600  # 10min p99 budget
  apply:
    timeout_seconds: 900  # 15min p999 budget per PRD
  observability:
    metrics_enabled: true
    audit_emit_enabled: true
    audit_chain_endpoint: "${AUDIT_CHAIN_ENDPOINT}"
