# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
#
# SeaweedFS values per ADR-0196 (object storage canonical) + ADR-0197 (backup substrate target).
# Per-pack overlay supplies KMS, OpenBao secret refs, replication topology overrides.
#
# Verified versions (2026-05-18):
#   - SeaweedFS 4.22 — Apache 2.0 — https://github.com/seaweedfs/seaweedfs/releases
seaweedfs:
  image:
    registry: chrislusf
    repository: seaweedfs
    tag: "4.22"

  # ---- master (metadata + topology) ----
  master:
    enabled: true
    replicas: 3  # raft quorum; per-pack overlay can raise to 5 for cross-AZ
    resources:
      requests: {cpu: "1", memory: "2Gi"}
      limits:   {cpu: "2", memory: "4Gi"}
    persistence:
      enabled: true
      storageClass: csi-fast-replicated
      size: 20Gi
    config: |
      [master.maintenance]
      scripts = """
        lock
        ec.encode -fullPercent=95 -quietFor=1h
        ec.rebuild -force
        ec.balance -force
        volume.balance -force
        volume.fix.replication
        unlock
      """
      sleep_minutes = 17
    defaultReplication: "020"  # 2 racks; replication overridable per bucket

  # ---- volume (data) ----
  volume:
    enabled: true
    replicas: 6  # capacity-model.md M tier; per-pack overlay scales horizontally
    dataNodes: 1
    resources:
      requests: {cpu: "2", memory: "4Gi"}
      limits:   {cpu: "4", memory: "8Gi"}
    persistence:
      enabled: true
      storageClass: csi-fast-replicated
      size: 1Ti
    # EC (erasure coding) shape — 10 data shards + 4 parity per ADR-0196 §Storage-efficiency
    ec:
      enabled: true
      shape: "10+4"
    diskTimeout: 30
    metricsPort: 9325

  # ---- filer (S3 + WebDAV + POSIX gateway) ----
  filer:
    enabled: true
    replicas: 3  # quorum for filer metadata
    resources:
      requests: {cpu: "1", memory: "2Gi"}
      limits:   {cpu: "2", memory: "4Gi"}
    persistence:
      enabled: true
      storageClass: csi-fast-replicated
      size: 50Gi
    config: |
      [filer.options]
      recursive_delete = false
      [postgres2]
      enabled = true
      hostname = "filer-meta-pg.iac-app.svc.cluster.local"
      port = 5432
      username = "${openbao:secret/iac-app/seaweedfs/filer-pg-user}"
      password = "${openbao:secret/iac-app/seaweedfs/filer-pg-password}"
      database = "seaweedfs_filer"
      sslmode = "require"

  # ---- s3 (S3-compatible gateway) ----
  s3:
    enabled: true
    replicas: 4
    resources:
      requests: {cpu: "1", memory: "1Gi"}
      limits:   {cpu: "2", memory: "2Gi"}
    # S3 access keys are sourced from OpenBao via the canonical secret reference
    auth:
      enabled: true
      # OpenBao secret reference per ADR-0064 + ADR-0196 §SecretReference
      accessKeySecretRef: "openbao://secret/iac-app/seaweedfs/s3-access-key"
      secretKeySecretRef: "openbao://secret/iac-app/seaweedfs/s3-secret-key"
    # Buckets declared per-µservice in iac-app IaC; preallocated to enforce naming convention
    # Convention: oyatie-<purpose>-<tenant-or-shared>-<env>
    defaultBuckets:
      - name: workflow-artifacts-shared-prod
        quota: 100Gi
        ttl: 90d
      - name: evidence-shared-prod
        quota: 500Gi
        ttl: 7y  # regulatory retention per ADR-0162
      - name: clickhouse-cold-shared-prod
        quota: 50Ti
        ttl: 1y
      - name: milvus-object-shared-prod
        quota: 10Ti
        ttl: 1y
      - name: velero-backup-shared-prod
        quota: 100Ti
        ttl: 7y  # backup retention per ADR-0197
      - name: audit-chain-archive-shared-prod
        quota: 100Ti
        ttl: 10y  # regulatory archival per ADR-0162
      - name: ci-sccache-shared-prod
        quota: 200Gi
        ttl: 30d  # CI remote build cache (sccache backend) per ADR-0349 + specs/ci-farm-substrate-canonical.json; regenerable, short TTL

  # ---- replication topology ----
  # Cross-AZ within region by default; cross-region replication via volume server pairing
  topology:
    crossAz: true
    crossRegion:
      enabled: false  # opt-in per regulatory pack; KR pack toggles on for in-country DR
      remoteEndpoints: []

  # ---- service monitor ----
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ---- canonical labels (consumed by helpers) ----
microservice: iac-app
boundedContext: object-store
tier: M
plane: data
partOf: iac-app

# ---- cost-attribution labels per ADR-0199 ----
costAttribution:
  costCenter: "infra-storage"
  workloadClass: "app"

# ---- canonical helm library ----
helpers:
  enabled: true
