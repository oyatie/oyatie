# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: cloud-iac-seaweedfs
description: |
  SeaweedFS distributed object store (S3-compatible API) per ADR-0196 storage
  canonical. Primary blob substrate for workflow artifacts, evidence files,
  doc attachments, ClickHouse cold tier, Milvus object backend, Velero backup
  target, audit-chain archival. Scale-up path to Ceph RGW when cluster ceiling
  is reached (~1PB / 10^9 objects per cluster).
type: application
version: 0.1.0
appVersion: "4.22"  # SeaweedFS latest stable per docs/standards/object-store-canonical.md (verified 2026-05-18)
maintainers:
  - name: axis-cloud-iac
    email: axis-cloud-iac@oyatie.com
dependencies:
  - name: seaweedfs
    version: "^4.22.0"
    repository: https://seaweedfs.github.io/seaweedfs/helm
