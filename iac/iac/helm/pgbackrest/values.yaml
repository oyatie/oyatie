# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
#
# pgBackRest sidecar values per ADR-0197 backup canonical.
# Verified versions (2026-05-18):
#   - pgBackRest 2.58.0 (upstream) — MIT — https://github.com/pgbackrest/pgbackrest/releases
#   - Continuity fork: pgxbackup — https://thebuild.com/blog/2026/05/01/pgxbackup-continuity-support-for-pgbackrest/
pgbackrest:
  image:
    repository: pgbackrest/pgbackrest
    tag: "2.58.0"
  # Sidecar runs alongside every primary Postgres pod
  sidecar:
    enabled: true
    resources:
      requests: {cpu: "500m", memory: "512Mi"}
      limits:   {cpu: "2",    memory: "2Gi"}
  # Repository config — SeaweedFS S3 (per ADR-0196)
  repo:
    type: s3
    s3:
      endpoint: "http://iac-app-seaweedfs-s3.iac-app.svc.cluster.local:8333"
      bucket: "backup-postgres-shared-prod"
      region: on-prem
      uriStyle: path
      accessKeyRef: "openbao://secret/iac-app/pgbackrest/s3-access-key"
      secretKeyRef: "openbao://secret/iac-app/pgbackrest/s3-secret-key"
      # Bucket-side encryption (age) per ADR-0197 §Encryption
      encryption:
        cipher: aes-256-cbc
        passwordRef: "openbao://secret/iac-app/pgbackrest/repo-passphrase"
  # Backup cadence — per ADR-0197 §Cadence
  schedules:
    # Full backup weekly
    full: "0 1 * * 0"
    # Differential daily (delta from last full)
    differential: "0 1 * * 1-6"
    # Incremental hourly (delta from last differential)
    incremental: "30 * * * *"
  # WAL archive — continuous; archive_command pushes to repo
  walArchive:
    enabled: true
    asyncProcessMax: 4
    pushQueueMax: "10GiB"
  # Retention policy — overridable per regulatory pack
  retention:
    full: 12       # 12 weekly fulls (~3 months)
    differential: 30  # 30 differentials (~30 days)
    archive: full  # WAL retained until matching full is expired
    # Regulatory pack overlays raise the floor: kr=5y, eu=7y, us-healthcare=6y
  # Restore drill cadence (chaos substrate per ADR-0165)
  restoreDrill:
    cadence: "0 6 * * 0"  # weekly
    targetEnv: "dr-staging"
    emitEvidence: true
    evidenceClass: "BackupRestoreDrill"

# ---- canonical labels ----
microservice: iac-app
boundedContext: backup-postgres
tier: M
plane: data
partOf: iac-app

# ---- cost-attribution labels per ADR-0199 ----
costAttribution:
  costCenter: "infra-backup"
  workloadClass: "batch"

# ---- canonical helm library ----
helpers:
  enabled: true
