# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: cloud-iac-pgbackrest
description: |
  pgBackRest sidecar Helm chart per ADR-0197 backup substrate. Provides
  Postgres point-in-time recovery (PITR) via WAL archive + full/differential/
  incremental backup cadence. WAL archive lands in SeaweedFS bucket
  `backup-postgres-<env>` per ADR-0196.

  Maintainer note (verified 2026-05-18): the original pgBackRest maintainer
  transitioned the project; PGX provides continuity support as `pgxbackup`.
  Oyatie pins pgBackRest 2.58.0 (the verified-stable upstream) and tracks
  pgxbackup as the migration path; the kernel adapter trait (shared-
  backup-kernel) abstracts the executor so the migration is a single
  adapter swap.
type: application
version: 0.1.0
appVersion: "2.58.0"  # pgBackRest stable per docs/standards/backup-canonical.md
maintainers:
  - name: axis-cloud-iac
    email: axis-cloud-iac@oyatie.com
# No upstream chart — sidecar pattern; values are consumed by per-Postgres
# StatefulSet templates rendered from the canonical postgres µservice chart.
