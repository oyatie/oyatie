# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
argo-cd:
  global:
    image:
      registry: quay.io
      repository: argoproj/argocd
      tag: "v2.13.0"  # LTS pin per docs/standards/observability-slo.md
  redis-ha: # counterpart-fact: upstream Argo CD Helm chart key; backing substrate is Valkey.
    enabled: true
    replicas:
      servers: 3
      sentinels: 3
  controller:
    # capacity-model.md XS tier: 3 replicas
    replicas: 3
    resources:
      requests: {cpu: "2", memory: "4Gi"}
      limits: {cpu: "4", memory: "8Gi"}
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  repoServer:
    replicas: 3
    resources:
      requests: {cpu: "2", memory: "2Gi"}
      limits: {cpu: "4", memory: "4Gi"}
  server:
    replicas: 2
    extensions:
      enabled: true
    config:
      admin.enabled: "false"  # admin disabled; SSO only
      url: "${ARGOCD_URL}"    # per-pack overlay supplies
      oidc.config: |
        name: oyatie-oidc
        issuer: "${OIDC_ISSUER}"
        clientID: "${openbao:secret/cloud-iac/argocd/oidc-client-id}"
        clientSecret: "${openbao:secret/cloud-iac/argocd/oidc-client-secret}"
    rbacConfig:
      policy.default: ""  # default deny; per-µservice policy via ApplicationSet
  applicationSet:
    enabled: true
    replicas: 1
    webhook:
      enabled: true
  notifications:
    enabled: true
  dex:
    enabled: false  # OIDC direct; no Dex
