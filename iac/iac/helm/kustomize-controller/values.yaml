# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
kustomize-controller:
  image:
    registry: ghcr.io
    repository: fluxcd/kustomize-controller
    tag: "v1.4.0"
  # capacity-model.md XS tier: 2 replicas HA min
  replicaCount: 2
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "1", memory: "2Gi"}
  serviceMonitor:
    enabled: true
  args:
    - --concurrent=10
    - --requeue-dependency=30s
    - --log-level=info
  serviceAccount:
    create: true
    name: kustomize-controller
  rbac:
    create: true
    namespaceScoped: true  # per iac-isolation.md ISO-02
