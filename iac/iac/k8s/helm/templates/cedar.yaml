{{- if .Values.cedar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.cedar.policyConfigMapName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    oyatie.com/policy-engine: cedar
    oyatie.com/adr-0246: policy-engine-substrate
data:
  policies.cedar: |
    // Deployed Cedar mirrors the authored PBAC policy directories for this capability.
    // Broad tenant-class-only permits are forbidden by the cedar-deploy-parity gate.

    // Source: policy/auditor-scope.cedar
    permit (
      principal in Auditor::?a,
      action in [
        Action::"read_apply_state",
        Action::"read_argo_application_status"
      ],
      resource is ApplyStateRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_drift_report",
      resource is DriftReport
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action in [
        Action::"read_provenance",
        Action::"read_slsa_attestation",
        Action::"read_cosign_verification_log"
      ],
      resource is ProvenanceRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_render_history",
      resource is RenderHistory
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_rollback_history",
      resource is RollbackHistory
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_iac_manifests",
      resource is IacManifest
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_audit_chain",
      resource is AuditChainRecord
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has microservice &&
      principal has scoped_microservices &&
      resource.microservice in principal.scoped_microservices &&
      resource has pack &&
      principal has scoped_packs &&
      resource.pack in principal.scoped_packs
    };

    permit (
      principal in Auditor::?a,
      action == Action::"read_artifact",
      resource in PolicyArtifact::?r
    )
    when {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to &&
      resource has artifact_type &&
      resource.artifact_type in [
        "threat-model",
        "dpia",
        "compliance",
        "iac-isolation",
        "data-residency",
        "policy-cedar",
        "runbook",
        "adr",
        "prd",
        "phase-spec",
        "implementation-plan",
        "capacity-model",
        "cost-budget",
        "multi-region",
        "failure-modes",
        "incident-response",
        "backfill-replay",
        "sdk-plan",
        "competitor-parity-matrix"
      ]
    };

    forbid (
      principal in Auditor::?a,
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"write_apply_state",
        Action::"write_drift_report",
        Action::"write_provenance",
        Action::"write_artifact",
        Action::"delete_apply_state",
        Action::"delete_drift_report",
        Action::"delete_provenance",
        Action::"delete_artifact",
        Action::"mutate_argo_application",
        Action::"rotate_secret"
      ],
      resource
    );

    forbid (
      principal in Auditor::?a,
      action,
      resource
    )
    unless {
      principal has valid_from &&
      principal has valid_to &&
      context has now &&
      principal.valid_from <= context.now &&
      context.now <= principal.valid_to
    };

    forbid (
      principal in Auditor::?a,
      action in [
        Action::"read_apply_state",
        Action::"read_drift_report",
        Action::"read_provenance",
        Action::"read_render_history",
        Action::"read_rollback_history",
        Action::"read_iac_manifests",
        Action::"read_audit_chain",
        Action::"read_slsa_attestation"
      ],
      resource
    )
    when {
      resource has microservice &&
      principal has scoped_microservices &&
      !(resource.microservice in principal.scoped_microservices)
    };

    forbid (
      principal in Auditor::?a,
      action,
      resource
    )
    when {
      resource has pack &&
      principal has scoped_packs &&
      !(resource.pack in principal.scoped_packs)
    };

    forbid (
      principal in Auditor::?a,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    // Source: policy/ci-scope.cedar
    permit (
      principal == Service::"iac-renderer-worker",
      action in [
        Action::"emit_render_completed",
        Action::"emit_render_failed",
        Action::"write_render_artifact_digest"
      ],
      resource is RenderEvent
    );

    permit (
      principal == Service::"iac-validator-worker",
      action in [
        Action::"emit_validation_verdict",
        Action::"emit_drift_detected",
        Action::"write_drift_report"
      ],
      resource is ValidationEvent
    );

    permit (
      principal == Service::"iac-applier-worker",
      action in [
        Action::"apply_iac",
        Action::"emit_apply_started",
        Action::"emit_apply_completed",
        Action::"emit_apply_failed",
        Action::"write_apply_state",
        Action::"mutate_argo_application"
      ],
      resource is ApplyJob
    )
    when {
      resource has microservice &&
      resource has apply_scope &&
      resource.apply_scope.microservice == resource.microservice
    };

    permit (
      principal == Service::"iac-rollback-worker",
      action in [
        Action::"rollback_iac",
        Action::"emit_apply_rolled_back",
        Action::"write_apply_state"
      ],
      resource is ApplyJob
    )
    when {
      resource has microservice &&
      resource has apply_scope &&
      resource.apply_scope.microservice == resource.microservice
    };

    permit (
      principal == Service::"iac-registry-worker",
      action in [
        Action::"write_apply_state",
        Action::"write_provenance",
        Action::"write_chart_record",
        Action::"write_module_record",
        Action::"write_overlay_record",
        Action::"emit_microservice_registered"
      ],
      resource is IacRegistryRecord
    );

    forbid (
      principal == Service::"iac-renderer-worker",
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"write_apply_state",
        Action::"mutate_argo_application"
      ],
      resource
    );

    forbid (
      principal == Service::"iac-validator-worker",
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"write_apply_state",
        Action::"mutate_argo_application"
      ],
      resource
    );

    forbid (
      principal == Service::"iac-applier-worker",
      action in [
        Action::"rollback_iac",
        Action::"write_provenance",
        Action::"emit_render_completed"
      ],
      resource
    );

    forbid (
      principal == Service::"iac-rollback-worker",
      action in [
        Action::"apply_iac",
        Action::"emit_render_completed",
        Action::"write_provenance"
      ],
      resource
    );

    forbid (
      principal == Service::"iac-registry-worker",
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"mutate_argo_application"
      ],
      resource
    );

    forbid (
      principal in [
        Service::"iac-applier-worker",
        Service::"iac-rollback-worker"
      ],
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"emit_apply_started",
        Action::"emit_apply_completed",
        Action::"emit_apply_failed",
        Action::"emit_apply_rolled_back",
        Action::"write_apply_state",
        Action::"mutate_argo_application"
      ],
      resource is ApplyJob
    )
    when {
      resource has apply_scope &&
      resource has target_resources &&
      exists r in resource.target_resources {
        r has microservice &&
        r.microservice != resource.apply_scope.microservice
      }
    };

    forbid (
      principal,
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"emit_apply_started",
        Action::"emit_apply_completed",
        Action::"emit_apply_failed",
        Action::"emit_apply_rolled_back",
        Action::"write_apply_state",
        Action::"mutate_argo_application"
      ],
      resource is ApplyJob
    )
    when {
      resource has apply_scope &&
      resource.apply_scope.microservice like "system:*" &&
      !(
        (principal == Service::"iac-applier-worker" && resource.apply_scope.microservice == "system:cloud-iac")
        || (principal == Service::"iac-rollback-worker" && resource.apply_scope.microservice == "system:cloud-iac")
        || (principal == Service::"cloud-k8s-applier" && resource.apply_scope.microservice == "system:cloud-k8s")
        || (principal == Service::"cloud-secrets-applier" && resource.apply_scope.microservice == "system:cloud-secrets")
        || (principal == Service::"observability-applier" && resource.apply_scope.microservice == "system:observability")
      )
    };

    forbid (
      principal in [
        Service::"iac-renderer-worker",
        Service::"iac-validator-worker",
        Service::"iac-applier-worker",
        Service::"iac-rollback-worker",
        Service::"iac-registry-worker"
      ],
      action in [
        Action::"read_secret_value",
        Action::"materialise_secret"
      ],
      resource
    );

    // Source: policy/public-read.cedar
    permit (
      principal == User::"anonymous",
      action == Action::"read_substrate_status",
      resource in SubstrateStatus::?s
    )
    when {
      resource has system_id &&
      resource.system_id == "system:cloud-iac" &&
      resource has data_class &&
      resource.data_class == "PUBLIC"
    };

    permit (
      principal == User::"anonymous",
      action == Action::"validate_chart_signature",
      resource in PublicEndpoint::"chart-signature-validator"
    );

    permit (
      principal == User::"anonymous",
      action == Action::"read_slsa_attestation_public",
      resource in SlsaAttestation::?a
    )
    when {
      resource has data_class &&
      resource.data_class == "PUBLIC" &&
      resource has source &&
      resource.source == "rekor"
    };

    forbid (
      principal == User::"anonymous",
      action,
      resource
    )
    when {
      resource has data_class &&
      !(resource.data_class == "PUBLIC")
    };

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"read_apply_state",
        Action::"read_drift_report",
        Action::"read_provenance",
        Action::"read_render_history",
        Action::"read_rollback_history",
        Action::"read_iac_manifests",
        Action::"read_audit_chain",
        Action::"read_argo_application_status"
      ],
      resource
    );

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"write_apply_state",
        Action::"write_drift_report",
        Action::"write_provenance",
        Action::"write_artifact",
        Action::"mutate_argo_application",
        Action::"rotate_secret"
      ],
      resource
    );

    forbid (
      principal == User::"anonymous",
      action in [
        Action::"read_artifact",
        Action::"write_artifact",
        Action::"delete_artifact"
      ],
      resource
    );

    // Source: policy/tenant-scope.cedar
    permit (
      principal in MicroserviceOwner::?p,
      action in [
        Action::"read_apply_state",
        Action::"read_drift_report",
        Action::"read_provenance",
        Action::"read_render_history",
        Action::"read_rollback_history",
        Action::"read_iac_manifests",
        Action::"read_argo_application_status"
      ],
      resource is ApplyStateRecord
    )
    when {
      principal has microservice_scope &&
      resource has microservice &&
      resource.microservice in principal.microservice_scope
    };

    permit (
      principal in MicroserviceOwner::?p,
      action in [Action::"read_drift_report", Action::"read_provenance"],
      resource
    )
    when {
      principal has microservice_scope &&
      resource has microservice &&
      resource.microservice in principal.microservice_scope
    };

    permit (
      principal in TenantOperator::?t,
      action in [Action::"read_apply_state", Action::"read_drift_report"],
      resource
    )
    when {
      principal has tenant_id &&
      principal has microservice_scope &&
      resource has tenant_id &&
      resource has microservice &&
      principal.tenant_id == resource.tenant_id &&
      resource.microservice in principal.microservice_scope
    };

    permit (
      principal in MicroserviceOwner::?p,
      action == Action::"read_iac_manifests",
      resource
    )
    when {
      principal has microservice_scope &&
      resource has microservice &&
      resource.microservice in principal.microservice_scope &&
      resource has data_class &&
      resource.data_class == "INTERNAL_ONLY"
    };

    forbid (
      principal,
      action in [
        Action::"read_apply_state",
        Action::"read_drift_report",
        Action::"read_provenance",
        Action::"read_render_history",
        Action::"read_rollback_history",
        Action::"read_iac_manifests",
        Action::"read_argo_application_status"
      ],
      resource
    )
    unless {
      principal has microservice_scope &&
      resource has microservice &&
      resource.microservice in principal.microservice_scope
    };

    forbid (
      principal,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal in MicroserviceOwner::?p,
      action in [
        Action::"write_apply_state",
        Action::"write_drift_report",
        Action::"write_provenance",
        Action::"apply_iac",
        Action::"rollback_iac",
        Action::"mutate_argo_application"
      ],
      resource
    );

    forbid (
      principal in TenantOperator::?t,
      action in [
        Action::"write_apply_state",
        Action::"write_drift_report",
        Action::"apply_iac",
        Action::"rollback_iac"
      ],
      resource
    );

    forbid (
      principal,
      action in [
        Action::"read_apply_state",
        Action::"read_drift_report",
        Action::"read_provenance",
        Action::"read_render_history",
        Action::"read_rollback_history"
      ],
      resource
    )
    when {
      principal has pack_scope &&
      resource has pack &&
      !(resource.pack in principal.pack_scope)
    };

    // Source: cedar/policies.cedar
    permit(
      principal == ServicePrincipal::"oyatie.cloud.cell-orchestrator",
      action in [Action::"ComputeAutoshardingPlacement", Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-iac" &&
      context.doctrine.adr_0348 == true &&
      context.autosharding_mode == "control_plane_driven" &&
      context.honors_residency == true &&
      context.compliance_pack_check_result == "pass" &&
      context.residency_check_result == "pass" &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.cloud.cell-orchestrator",
      action in [Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-iac" &&
      (
        context.honors_residency == false ||
        context.compliance_pack_check_result != "pass" ||
        context.residency_check_result != "pass" ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal == ServicePrincipal::"oyatie.cloud.cell-orchestrator",
      action == Action::"MigrateTenantCrossJurisdiction",
      resource is TenantMigration
    ) unless {
      resource.microservice == "cloud-iac" &&
      context.cedar_permit_id != "" &&
      context.cross_jurisdiction_permit_id != "" &&
      context.audit_chain_emit == true
    };

    permit(
      principal == ServicePrincipal::"oyatie.github-actions.oya-ci",
      action == Action::"RunRequiredCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iac" &&
      context.required_context == "oya-ci-required" &&
      context.shared_rust_gate_logic == true &&
      context.surface_all_aggregator == true &&
      context.local_cli_authority == false &&
      context.audit_chain_emit == true
    };

    permit(
      principal == ServicePrincipal::"oyatie.owned-oya-ci.runner",
      action == Action::"RunRequiredCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iac" &&
      context.required_context == "oya-ci-required" &&
      context.cutover_proven == true &&
      context.shared_rust_gate_logic == true &&
      context.surface_all_aggregator == true &&
      context.local_cli_authority == false &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.github-actions.oya-ci",
      action == Action::"RunRequiredCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iac" &&
      (
        context.required_context != "oya-ci-required" ||
        context.local_cli_authority == true ||
        context.lane_id.matches("^oya-governance-.*$")
      )
    };

    forbid(
      principal == ServicePrincipal::"oyatie.owned-oya-ci.runner",
      action == Action::"RunRequiredCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iac" &&
      (
        context.required_context != "oya-ci-required" ||
        context.local_cli_authority == true ||
        context.lane_id.matches("^oya-governance-.*$")
      )
    };

    permit(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-iac" &&
      context.doctrine.adr_0349 == true &&
      context.cosign_signature_verified == true &&
      context.tenant_namespace_isolated == true &&
      context.cedar_policy_gate_granted == true &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-iac" &&
      (
        context.cosign_signature_verified == false ||
        context.tenant_namespace_isolated == false ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal,
      action == Action::"AuthorGovernanceLane",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iac" &&
      context.doctrine.adr_0347 == true &&
      context.lane_id.matches("^oya-governance-.*$") &&
      context.historical_reference != true
    };
{{- end }}
