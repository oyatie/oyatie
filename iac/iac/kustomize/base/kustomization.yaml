# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the cloud-iac control-plane cluster, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides, OpenBao
# secret-reference URIs, replica scaling tier.
# Per ADR-0139 Layer-A + multi-region.md DR posture + policy/iac-isolation.md.

namespace: cloud-iac

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - postgres-iac-state-index.yaml
  - cedar-policy-configmap.yaml

helmCharts:
  - name: cloud-iac-argocd
    valuesFile: ../../helm/argocd/values.yaml
    releaseName: argocd
    namespace: cloud-iac
  - name: cloud-iac-opentofu
    valuesFile: ../../helm/opentofu/values.yaml
    releaseName: opentofu
    namespace: cloud-iac
  - name: cloud-iac-helm-controller
    valuesFile: ../../helm/helm-controller/values.yaml
    releaseName: helm-controller
    namespace: cloud-iac
  - name: cloud-iac-kustomize-controller
    valuesFile: ../../helm/kustomize-controller/values.yaml
    releaseName: kustomize-controller
    namespace: cloud-iac

commonLabels:
  app.kubernetes.io/part-of: cloud-iac
  oyatie/microservice: cloud-iac
