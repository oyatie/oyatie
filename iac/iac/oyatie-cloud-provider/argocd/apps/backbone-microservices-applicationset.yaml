apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backbone-microservices-dev
  namespace: cd-argocd
  labels:
    app.kubernetes.io/part-of: ci-cd-substrate
    app.kubernetes.io/managed-by: argocd
    oyatie.com/adr: ADR-0349
    oyatie.com/image-promotion: ADR-0181
    oyatie.com/context: oyatie-cloud-provider
    oyatie.com/change-bundle: cb-backbone-microservices-argocd-promotion-20260523
    oyatie.io/tenant-id: fd001-dogfood
    oyatie.io/cost-center: fd001-backbone
    oyatie.io/workload-class: app
    oyatie.io/regulatory-pack: generic
    oyatie.com/dogfood-substrate: oyatie-cloud
    oyatie.com/product-goal: fd-001
  annotations:
    cosign.sigstore.dev/required: "true"
    oyatie.com/fail-open: "false"
    oyatie.com/audit-chain-event: EVT-BACKBONE-ARGOCD-SYNC-REQUESTED
    oyatie.com/non-claim: "static-promotion-manifest-only-no-live-sync"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - microservice: messenger
            owner: axis-messenger
            chartPath: microservices/messenger/iac/k8s/helm
            namespace: backbone-messenger
            imageRepository: messenger
            imageDigest: "" # release automation injects ADR-0181 signed digest
            primaryCargoPackage: messenger-app
            tenantId: fd001-dogfood
            costCenter: fd001-backbone
            workloadClass: app
            regulatoryPack: generic
            dogfoodSubstrate: oyatie-cloud
            productGoal: fd-001
          - microservice: mail
            owner: axis-mail
            chartPath: microservices/mail/iac/k8s/helm
            namespace: backbone-mail
            imageRepository: mail
            imageDigest: "" # release automation injects ADR-0181 signed digest
            primaryCargoPackage: mail-mailbox-store-app
            tenantId: fd001-dogfood
            costCenter: fd001-backbone
            workloadClass: app
            regulatoryPack: generic
            dogfoodSubstrate: oyatie-cloud
            productGoal: fd-001
          - microservice: social
            owner: axis-social
            chartPath: microservices/social/iac/k8s/helm
            namespace: backbone-social
            imageRepository: social
            imageDigest: "" # release automation injects ADR-0181 signed digest
            primaryCargoPackage: community-social-app
            tenantId: fd001-dogfood
            costCenter: fd001-backbone
            workloadClass: app
            regulatoryPack: generic
            dogfoodSubstrate: oyatie-cloud
            productGoal: fd-001
          - microservice: community
            owner: axis-community
            chartPath: microservices/community/iac/k8s/helm
            namespace: backbone-community
            imageRepository: community
            imageDigest: "" # release automation injects ADR-0181 signed digest
            primaryCargoPackage: community-post-store-app
            tenantId: fd001-dogfood
            costCenter: fd001-backbone
            workloadClass: app
            regulatoryPack: generic
            dogfoodSubstrate: oyatie-cloud
            productGoal: fd-001
  template:
    metadata:
      name: '{{ .microservice }}-dev'
      labels:
        app.kubernetes.io/name: '{{ .microservice }}'
        app.kubernetes.io/part-of: oyatie-backbone-microservices
        app.kubernetes.io/managed-by: argocd
        oyatie.com/adr: ADR-0349
        oyatie.com/image-promotion: ADR-0181
        oyatie.com/context: oyatie-cloud-provider
        oyatie.com/owner: '{{ .owner }}'
        oyatie.com/primary-cargo-package: '{{ .primaryCargoPackage }}'
        oyatie.io/tenant-id: '{{ .tenantId }}'
        oyatie.io/cost-center: '{{ .costCenter }}'
        oyatie.io/workload-class: '{{ .workloadClass }}'
        oyatie.io/regulatory-pack: '{{ .regulatoryPack }}'
        oyatie.com/dogfood-substrate: '{{ .dogfoodSubstrate }}'
        oyatie.com/product-goal: '{{ .productGoal }}'
      annotations:
        cosign.sigstore.dev/required: "true"
        oyatie.com/fail-open: "false"
        oyatie.com/audit-chain-event: EVT-BACKBONE-ARGOCD-SYNC-REQUESTED
        oyatie.com/tenant-namespace-isolation: single-microservice
    spec:
      project: oyatie-cloud-provider-tenants
      source:
        repoURL: https://git.oyatie.internal/oyatie/oyatie.git
        targetRevision: dev
        path: '{{ .chartPath }}'
        helm:
          releaseName: 'oyatie-{{ .microservice }}'
          valueFiles:
            - values.yaml
          parameters:
            - name: image.repository
              value: '{{ .imageRepository }}'
            - name: image.digest
              value: '{{ .imageDigest }}'
            - name: image.cosign.required
              value: "true"
            - name: config.environment
              value: dev
            - name: config.imagePromotionPolicy
              value: cosign-required
            - name: workloadLabels.tenantId
              value: '{{ .tenantId }}'
            - name: workloadLabels.costCenter
              value: '{{ .costCenter }}'
            - name: workloadLabels.workloadClass
              value: '{{ .workloadClass }}'
            - name: workloadLabels.regulatoryPack
              value: '{{ .regulatoryPack }}'
            - name: workloadLabels.dogfoodSubstrate
              value: '{{ .dogfoodSubstrate }}'
            - name: workloadLabels.productGoal
              value: '{{ .productGoal }}'
            - name: otel.endpoint
              value: http://otel-collector.observability.svc.cluster.local:4317
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: oyatie-backbone-microservices
            istio.io/dataplane-mode: ambient
            oyatie.com/context: oyatie-cloud-provider
            oyatie.com/microservice: '{{ .microservice }}'
            oyatie.com/tenant-class: contributor
            oyatie.io/tenant-id: '{{ .tenantId }}'
            oyatie.io/cost-center: '{{ .costCenter }}'
            oyatie.io/workload-class: '{{ .workloadClass }}'
            oyatie.io/regulatory-pack: '{{ .regulatoryPack }}'
            oyatie.com/dogfood-substrate: '{{ .dogfoodSubstrate }}'
            oyatie.com/product-goal: '{{ .productGoal }}'
          annotations:
            oyatie.com/namespace-isolation: single-microservice
            oyatie.com/audit-chain-event: EVT-BACKBONE-ARGOCD-NAMESPACE-DECLARED
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - PrunePropagationPolicy=foreground
