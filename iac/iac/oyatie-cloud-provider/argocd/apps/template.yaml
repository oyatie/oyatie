apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{microservice}}-{{cluster_id}}"
  namespace: cd-argocd
  labels:
    app.kubernetes.io/part-of: ci-cd-substrate
    oyatie.com/adr: ADR-0349
    oyatie.com/image-promotion: ADR-0181
    oyatie.com/context: "oyatie-cloud-provider"
    oyatie.com/region: "kr-seoul-1"
    oyatie.com/cell-id: "oyatie-cloud-provider-kr-seoul-1-a-001"
    oyatie.com/tenant-id: "ten_cloud_iac_oyatie_cloud_provider"
    oyatie.com/isolation-tier: "foundation"
    oyatie.com/default-cross-cell-traffic-allowed: "false"
  annotations:
    cosign.sigstore.dev/required: "true"
    oyatie.com/audit-chain-event: argocd-application-sync
    oyatie.com/fail-open: "false"
spec:
  project: "oyatie-cloud-provider-tenants"
  source:
    repoURL: "{{repo_url}}"
    targetRevision: "{{target_revision}}"
    path: "microservices/{{microservice}}/iac/k8s/helm"
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.digest
          value: "{{signed_image_digest}}"
        - name: image.cosign.required
          value: "true"
  destination:
    server: "{{cluster_api_server}}"
    namespace: "{{tenant_namespace}}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences: []
