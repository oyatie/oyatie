apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: intelligence-app
  namespace: cd-argocd
  labels:
    app.kubernetes.io/part-of: ci-cd-substrate
    app.kubernetes.io/managed-by: argocd
    oyatie.com/adr: ADR-0349
    oyatie.com/image-promotion: ADR-0181
    oyatie.com/adr-0384: intelligence-app-path-b
    oyatie.com/context: oyatie-cloud-provider
    oyatie.io/tenant-id: oyatie-dogfood
    oyatie.io/cost-center: fd001-backbone
    oyatie.io/workload-class: app
    oyatie.io/regulatory-pack: generic
    oyatie.com/dogfood-substrate: oyatie-cloud
    oyatie.com/product-goal: fd-001
  annotations:
    cosign.sigstore.dev/required: "true"
    oyatie.com/fail-open: "false"
    oyatie.com/audit-chain-event: EVT-CLOUD-INTEL-ARGOCD-SYNC-REQUESTED
    oyatie.com/non-claim: "static-promotion-manifest-only-no-live-sync"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - environment: dev
            targetRevision: dev
            namespace: intelligence-app
            imageDigest: "" # release automation injects ADR-0181 signed digest
            configEnvironment: dev
            replicaCount: "1"
          - environment: staging
            targetRevision: main
            namespace: intelligence-app-staging
            imageDigest: "" # release automation injects ADR-0181 signed digest
            configEnvironment: staging
            replicaCount: "1"
          - environment: prod
            targetRevision: main
            namespace: intelligence-app-prod
            imageDigest: "" # release automation injects ADR-0181 signed digest
            configEnvironment: production
            replicaCount: "1"
  template:
    metadata:
      name: 'intelligence-app-{{ .environment }}'
      labels:
        app.kubernetes.io/name: intelligence-app
        app.kubernetes.io/part-of: oyatie-microservices
        app.kubernetes.io/managed-by: argocd
        oyatie.com/adr: ADR-0349
        oyatie.com/image-promotion: ADR-0181
        oyatie.com/adr-0384: intelligence-app-path-b
        oyatie.com/context: oyatie-cloud-provider
        oyatie.com/environment: '{{ .environment }}'
        oyatie.io/tenant-id: oyatie-dogfood
        oyatie.io/cost-center: fd001-backbone
        oyatie.io/workload-class: app
        oyatie.io/regulatory-pack: generic
        oyatie.com/dogfood-substrate: oyatie-cloud
        oyatie.com/product-goal: fd-001
      annotations:
        cosign.sigstore.dev/required: "true"
        oyatie.com/fail-open: "false"
        oyatie.com/audit-chain-event: EVT-CLOUD-INTEL-ARGOCD-SYNC-REQUESTED
        oyatie.com/tenant-namespace-isolation: single-microservice
    spec:
      project: oyatie-cloud-provider-tenants
      source:
        repoURL: https://git.oyatie.internal/oyatie/oyatie.git
        targetRevision: '{{ .targetRevision }}'
        path: microservices/intelligence-app/iac/k8s/helm
        helm:
          releaseName: intelligence-app
          valueFiles:
            - values.yaml
          parameters:
            - name: image.digest
              value: '{{ .imageDigest }}'
            - name: image.cosign.required
              value: "true"
            - name: config.environment
              value: '{{ .configEnvironment }}'
            - name: config.imagePromotionPolicy
              value: cosign-required
            - name: replicaCount
              value: '{{ .replicaCount }}'
            - name: workloadLabels.tenantId
              value: oyatie-dogfood
            - name: workloadLabels.costCenter
              value: fd001-backbone
            - name: workloadLabels.workloadClass
              value: app
            - name: workloadLabels.regulatoryPack
              value: generic
            - name: workloadLabels.dogfoodSubstrate
              value: oyatie-cloud
            - name: workloadLabels.productGoal
              value: fd-001
            - name: otel.endpoint
              value: http://otel-collector.observability.svc.cluster.local:4317
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: oyatie-microservices
            istio.io/dataplane-mode: ambient
            oyatie.com/context: oyatie-cloud-provider
            oyatie.com/microservice: intelligence-app
            oyatie.com/tenant-class: contributor
            oyatie.io/tenant-id: oyatie-dogfood
            oyatie.io/cost-center: fd001-backbone
            oyatie.io/workload-class: app
            oyatie.io/regulatory-pack: generic
            oyatie.com/dogfood-substrate: oyatie-cloud
            oyatie.com/product-goal: fd-001
          annotations:
            oyatie.com/namespace-isolation: single-microservice
            oyatie.com/audit-chain-event: EVT-CLOUD-INTEL-ARGOCD-NAMESPACE-DECLARED
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - PrunePropagationPolicy=foreground
