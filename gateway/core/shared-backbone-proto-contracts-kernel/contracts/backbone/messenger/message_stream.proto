syntax = "proto3";

package oya.messenger.v1;

service MessageStream {
  rpc PostMessage (PostMessageRequest) returns (PostMessageResponse);
}

enum MessengerContextKind {
  MESSENGER_CONTEXT_KIND_UNSPECIFIED = 0;
  MESSENGER_CONTEXT_KIND_PERSONAL = 1;
  MESSENGER_CONTEXT_KIND_WORK = 2;
}

message TenantDekEnvelope {
  string dek_ref = 1;
  bool four_eyes = 2;
}

message CrossOrgEnvelope {
  string local_dek_ref = 1;
  string partner_scope_ref = 2;
  string partner_dek_ref = 3;
  bool partner_ediscovery_allowed = 4;
}

message MessengerEnvelope {
  oneof envelope {
    string personal_e2e_envelope_ref = 1;
    TenantDekEnvelope tenant_dek = 2;
    CrossOrgEnvelope cross_org = 3;
  }
}

message PostMessageRequest {
  MessengerContextKind context = 1;
  string scope_ref = 2;
  string tenant_scope_ref = 3;
  string principal_ref = 4;
  string idempotency_key = 5;
  string policy_decision_ref = 6;
  string audit_correlation_id = 7;
  string message_id = 8;
  string channel_id = 9;
  string author_ref = 10;
  MessengerEnvelope envelope = 11;
  string retention_policy_id = 12;
  repeated string legal_hold_ids = 13;
}

message PostMessageResponse {
  string message_id = 1;
  string event_type = 2;
  string audit_correlation_id = 3;
  string idempotency_key = 4;
  string policy_decision_ref = 5;
}
