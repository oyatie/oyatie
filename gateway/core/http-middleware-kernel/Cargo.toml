[package]
name = "http-middleware-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
# Kernel is std-only per ADR-0092. Body type is Vec<u8>; the hyper adapter
# converts to/from `bytes::Bytes` at its boundary so no hyper-family dep
# (bytes, hyper, http-body-util, hyper-util) leaks into this kernel.
http-router-kernel = { path = "../http-router-kernel" }

[lib]
name = "http_middleware_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
