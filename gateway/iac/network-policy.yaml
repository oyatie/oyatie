# api-gateway — K8s NetworkPolicy
# Per ADR-0254 (deployment shape) + ADR-0295 (SPIFFE).
# Default-deny ingress + egress; permit only what's required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-default-deny
  namespace: api-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-envoy
  namespace: api-gateway
spec:
  podSelector:
    matchLabels:
      app: envoy
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0  # internet-facing
    ports:
    - port: 443
      protocol: TCP
    - port: 443
      protocol: UDP
  egress:
  # Identity µservice
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity
    ports:
    - port: 8443
      protocol: TCP
  # SPIRE agent
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire-system
    ports:
    - port: 8081
      protocol: TCP
  # Valkey cluster for rate-limit
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: api-gateway-valkey
    ports:
    - port: 6379
      protocol: TCP
  # Audit-chain µservice
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: audit-chain
    ports:
    - port: 8443
      protocol: TCP
  # OpenBao via sidecar (loopback only)
  - to:
    - podSelector:
        matchLabels:
          app: cert-sidecar
    ports:
    - port: 8200
      protocol: TCP
  # Cluster DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
