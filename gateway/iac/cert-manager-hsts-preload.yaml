# api-gateway — HSTS preload tracking
# Per ADR-0253.
# Submission status: tracked here; real submission via https://hstspreload.org/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-hsts-preload
  namespace: api-gateway
data:
  preload-list.yaml: |
    domains:
    - name: oyatie.com
      includes_subdomains: true
      submitted: 2026-05-15
      status: submitted
      submission_url: https://hstspreload.org/?domain=oyatie.com
    - name: oyatie.dev
      includes_subdomains: true
      submitted: 2026-05-15
      status: submitted
  rotation-policy: |
    HSTS max-age=63072000 (2 years) on every response.
    Re-confirm preload submission quarterly.
    If HSTS lapses, must re-apply for preload after 2y propagation.
