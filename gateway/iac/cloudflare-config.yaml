# api-gateway — Cloudflare zone configuration
# Per ADR-0297 (in flight) + ADR-0253.
zone: oyatie.com
settings:
  ssl: strict
  min_tls_version: "1.3"
  always_use_https: true
  hsts:
    enabled: true
    max_age: 63072000
    include_subdomains: true
    preload: true
    nosniff: true
  http3: enabled
  zero_rtt: disabled  # we re-enable per route via Envoy
  ech: enabled
  pqc: enabled  # Cloudflare native PQC support
  bot_fight_mode: enabled
  super_bot_fight_mode: enabled  # Enterprise tier
  security_level: medium  # under_attack raised during incidents per runbook
  challenge_passage: 30  # 30s grace after challenge pass
  browser_check: enabled
  managed_challenge: enabled
  privacy_pass: enabled
  email_obfuscation: enabled
  ipv6: enabled

waf:
  managed_rulesets:
  - cloudflare_managed_v2  # OWASP Core Rule Set
  - cloudflare_managed_special  # zero-day mitigations
  - cloudflare_owasp_managed
  custom_rules:
  - name: block_known_bad_asns
    expression: "ip.geoip.asnum in {0 12345}"  # placeholder; managed via CT-signed list
    action: block
  - name: rate_limit_auth_attempts
    expression: "http.request.uri.path contains '/v1/auth/' and not ip.geoip.is_in_european_union"
    action: managed_challenge
    threshold: 5
    period: 60

ddos:
  l7_protection: enabled
  rate_limiting_rules:
  - name: anon_read_rate
    expression: "not cf.bot_management.verified_bot and http.request.method eq 'GET'"
    rate: 60
    period: 60
    action: managed_challenge
  - name: anon_write_rate
    expression: "not cf.bot_management.verified_bot and http.request.method ne 'GET'"
    rate: 10
    period: 60
    action: block

origin:
  health_check:
    enabled: true
    interval: 60
    timeout: 10
    method: GET
    path: /healthz
  origin_pools:
  - name: cell-${CELL_ID}-pool
    origins:
    - name: envoy-${CELL_ID}
      address: envoy.api-gateway.svc.cluster.local
      weight: 1
