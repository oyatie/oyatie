# api-gateway — Envoy data-plane config
# Per ADR-0157 + ADR-0253 (HTTP/3 + TLS + ECH + PQC).
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

node:
  cluster: api-gateway
  id: api-gateway-${POD_NAME}

static_resources:
  listeners:
  - name: listener_https
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
              cipher_suites:
              - "TLS_AES_128_GCM_SHA256"
              - "TLS_AES_256_GCM_SHA384"
              - "TLS_CHACHA20_POLY1305_SHA256"
              ecdh_curves:
              - "X25519MLKEM768"
              - "X25519"
              - "P-256"
            tls_certificate_sds_secret_configs:
            - name: api_gateway_tls_cert
              sds_config:
                api_config_source:
                  api_type: GRPC
                  grpc_services:
                  - envoy_grpc:
                      cluster_name: sds_cluster
            alpn_protocols: ["h2", "http/1.1"]
          require_client_certificate: false
          # ECH config: published via DNS HTTPS RR; Envoy reads ECH config from sidecar at /etc/tls/ech-config.bin
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: api_gateway_https
          codec_type: AUTO
          http_filters:
          - name: abuse-defence-wasm
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              config:
                vm_config:
                  runtime: "envoy.wasm.runtime.v8"
                  code:
                    local:
                      filename: /etc/envoy/wasm/abuse-defence.wasm
          - name: cedar-eval-wasm
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              config:
                vm_config:
                  runtime: "envoy.wasm.runtime.v8"
                  code:
                    local:
                      filename: /etc/envoy/wasm/cedar-eval.wasm
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: api_gateway_rl
              token_bucket:
                max_tokens: 1200
                tokens_per_fill: 600
                fill_interval: 60s
              filter_enabled:
                runtime_key: rl_enabled
                default_value:
                  numerator: 100
              filter_enforced:
                runtime_key: rl_enforced
                default_value:
                  numerator: 100
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: api_gateway_routes
            virtual_hosts:
            - name: tenants
              domains: ["*"]
              routes: []
              # Routes pushed by api-gateway-routing-worker via xDS RDS
          http3_protocol_options: {}
          stream_idle_timeout: 30s
          request_timeout: 30s
          common_http_protocol_options:
            idle_timeout: 90s
            max_headers_count: 100
            max_stream_duration: 60s
          # Per-stream RST_STREAM limit (CVE-2023-44487 Rapid Reset mitigation)
          http2_protocol_options:
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
  - name: listener_h3
    address:
      socket_address:
        protocol: UDP
        address: 0.0.0.0
        port_value: 443
    udp_listener_config:
      quic_options: {}
    # HTTP/3 listener config; uses same TLS / Cedar / abuse-defence filter chain

  clusters:
  - name: sds_cluster
    type: STATIC
    load_assignment:
      cluster_name: sds_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe:
                path: /etc/envoy/sds.sock
  - name: identity_msvc
    type: STRICT_DNS
    load_assignment:
      cluster_name: identity_msvc
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: identity.identity.svc.cluster.local
                port_value: 8443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_certificate_sds_secret_configs:
          - name: spiffe_identity_cert
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 1000
        max_pending_requests: 100
        max_requests: 10000
        max_retries: 3
    outlier_detection:
      consecutive_5xx: 5
      interval: 10s
      base_ejection_time: 30s
