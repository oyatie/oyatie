# api-gateway — K8s deployment manifest
# Per ADR-0254 (deployment model + Cloud Hypervisor + Kata pods).
# Per cell: deployed in every Tier-0 cell (per ADR-0248 cellular).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-envoy
  namespace: api-gateway
  labels:
    app: envoy
    version: blue
    cell: ${CELL_ID}
    tier: tier-0-edge
spec:
  replicas: 4
  selector:
    matchLabels:
      app: envoy
      version: blue
  template:
    metadata:
      labels:
        app: envoy
        version: blue
      annotations:
        io.containerd.runc.v2.runtime: kata-cloud-hypervisor
        spire.io/identity: spiffe://oyatie.cell-${CELL_ID}/api-gateway/envoy
    spec:
      runtimeClassName: kata-clh
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.32-distroless
        args: ["-c", "/etc/envoy/envoy.yaml"]
        ports:
        - containerPort: 443
          protocol: TCP
          name: https
        - containerPort: 443
          protocol: UDP
          name: h3
        - containerPort: 9901
          protocol: TCP
          name: admin
        resources:
          requests:
            cpu: 8000m
            memory: 16Gi
          limits:
            cpu: 16000m
            memory: 32Gi
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: tls-certs
          mountPath: /etc/tls
        - name: spire-bundle
          mountPath: /etc/spire
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 9901
          periodSeconds: 30
      - name: cert-sidecar
        image: ghcr.io/oyatie/cert-sidecar:0.2.0
        args: ["--openbao-path", "secret/tls/${CELL_ID}", "--sds-socket", "/etc/envoy/sds.sock", "--ttl-seconds", "60"]
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/tls
      volumes:
      - name: envoy-config
        configMap:
          name: api-gateway-envoy-config
      - name: tls-certs
        emptyDir:
          medium: Memory
      - name: spire-bundle
        csi:
          driver: csi.spiffe.io
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-envoy
  namespace: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: envoy
  ports:
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: h3
    port: 443
    targetPort: 443
    protocol: UDP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-envoy-hpa
  namespace: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-envoy
  minReplicas: 4
  maxReplicas: 32
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
