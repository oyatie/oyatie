openapi: 3.2.0
info:
  title: QuickBooks Online Accounting API (gateway-quickbooks-connector snapshot)
  version: v3-snapshot
servers:
  - url: https://quickbooks.api.intuit.com/v3/company/{realmId}
    variables: { realmId: { default: 1234567890 } }
paths:
  /customer:
    get:
      operationId: listCustomers
      responses: { '200': { description: Customers page } }
    post:
      operationId: createCustomer
      responses: { '201': { description: Customer created } }
  /customer/{id}:
    get:
      operationId: getCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: Customer } }
  /vendor:
    get:
      operationId: listVendors
      responses: { '200': { description: Vendors page } }
  /invoice:
    get:
      operationId: listInvoices
      responses: { '200': { description: Invoices page } }
  /bill:
    get:
      operationId: listBills
      responses: { '200': { description: Bills page } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://appcenter.intuit.com/connect/oauth2
          tokenUrl: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
          scopes:
            com.intuit.quickbooks.accounting: accounting scope
security:
  - oauth2: [com.intuit.quickbooks.accounting]
