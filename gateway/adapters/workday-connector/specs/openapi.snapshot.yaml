openapi: 3.2.0
info:
  title: Workday REST API v40 (gateway-workday-connector snapshot)
  version: v40-snapshot
servers:
  - url: https://wd2-impl-services1.workday.com/ccx/api/v1/{tenant}
    variables:
      tenant: { default: oyatie }
paths:
  /workers:
    get:
      operationId: listWorkers
      parameters:
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 100 }
      responses: { '200': { description: Workers page } }
  /workers/{id}:
    get:
      operationId: getWorker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: Worker } }
    patch:
      operationId: updateWorker
      responses: { '200': { description: Worker updated } }
  /jobProfiles:
    get:
      operationId: listJobProfiles
      responses: { '200': { description: Job profiles page } }
  /compensation:
    get:
      operationId: listCompensation
      responses: { '200': { description: Compensation page } }
components:
  securitySchemes:
    isuJwt:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://wd2-impl-services1.workday.com/ccx/oauth2/{tenant}/token
          scopes: {}
security:
  - isuJwt: []
