openapi: 3.2.0
info:
  title: Salesforce REST + Bulk API 2.0 (gateway-salesforce-connector snapshot)
  version: v60.0-snapshot
servers:
  - url: https://{instance}.salesforce.com
    variables: { instance: { default: na1 } }
paths:
  /services/data/v60.0/sobjects/Account:
    get:
      operationId: listAccounts
      responses: { '200': { description: Accounts page } }
    post:
      operationId: createAccount
      responses: { '201': { description: Account created } }
  /services/data/v60.0/sobjects/Account/{id}:
    get:
      operationId: getAccount
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: Account } }
    patch:
      operationId: updateAccount
      responses: { '204': { description: Updated } }
    delete:
      operationId: deleteAccount
      responses: { '204': { description: Deleted } }
  /services/data/v60.0/sobjects/Contact:
    get:
      operationId: listContacts
      responses: { '200': { description: Contacts page } }
  /services/data/v60.0/sobjects/Opportunity:
    get:
      operationId: listOpportunities
      responses: { '200': { description: Opportunities page } }
  /services/data/v60.0/jobs/ingest:
    post:
      operationId: createBulkJob
      responses: { '200': { description: Bulk job created } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes: {}
security:
  - oauth2: []
