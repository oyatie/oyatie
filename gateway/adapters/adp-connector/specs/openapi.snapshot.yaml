openapi: 3.2.0
info:
  title: ADP Workforce Now API (gateway-adp-connector snapshot)
  version: v2-snapshot
servers:
  - url: https://api.adp.com
paths:
  /hr/v2/workers:
    get:
      operationId: listWorkers
      responses: { '200': { description: Workers page } }
  /hr/v2/workers/{aoid}:
    get:
      operationId: getWorker
      parameters:
        - in: path
          name: aoid
          required: true
          schema: { type: string }
      responses: { '200': { description: Worker } }
  /payroll/v1/pay-statements:
    get:
      operationId: listPayStatements
      responses: { '200': { description: Pay statements page } }
  /time/v2/time-cards:
    get:
      operationId: listTimeCards
      responses: { '200': { description: Time cards page } }
  /benefits/v1/coverages:
    get:
      operationId: listBenefitCoverages
      responses: { '200': { description: Benefit coverages page } }
components:
  securitySchemes:
    adpMtls:
      type: mutualTLS
security:
  - adpMtls: []
