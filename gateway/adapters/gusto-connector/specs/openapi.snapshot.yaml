openapi: 3.2.0
info:
  title: Gusto Embedded Payroll API (gateway-gusto-connector snapshot)
  version: 2024-04-01-snapshot
servers:
  - url: https://api.gusto.com
paths:
  /v1/companies/{company_id}/employees:
    get:
      operationId: listEmployees
      parameters:
        - in: path
          name: company_id
          required: true
          schema: { type: string }
      responses: { '200': { description: Employees page } }
    post:
      operationId: createEmployee
      responses: { '201': { description: Employee created } }
  /v1/companies/{company_id}/payrolls:
    get:
      operationId: listPayrolls
      responses: { '200': { description: Payrolls page } }
  /v1/companies/{company_id}/contractors:
    get:
      operationId: listContractors
      responses: { '200': { description: Contractors page } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.gusto.com/oauth/authorize
          tokenUrl: https://api.gusto.com/oauth/token
          scopes: {}
security:
  - oauth2: []
