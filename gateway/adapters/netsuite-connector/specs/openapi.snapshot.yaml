openapi: 3.2.0
info:
  title: NetSuite SuiteTalk REST (gateway-netsuite-connector snapshot)
  version: 2024.1-snapshot
servers:
  - url: https://{account}.suitetalk.api.netsuite.com/services/rest/record/v1
    variables: { account: { default: TSTDRV1234567 } }
paths:
  /customer:
    get:
      operationId: listCustomers
      responses: { '200': { description: Customers page } }
    post:
      operationId: createCustomer
      responses: { '201': { description: Customer created } }
  /customer/{id}:
    get:
      operationId: getCustomer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: Customer } }
    patch:
      operationId: updateCustomer
      responses: { '204': { description: Updated } }
    delete:
      operationId: deleteCustomer
      responses: { '204': { description: Deleted } }
  /vendor:
    get:
      operationId: listVendors
      responses: { '200': { description: Vendors page } }
  /salesOrder:
    get:
      operationId: listSalesOrders
      responses: { '200': { description: Sales orders page } }
  /journalEntry:
    get:
      operationId: listJournalEntries
      responses: { '200': { description: Journals page } }
components:
  securitySchemes:
    tba:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{account}.suitetalk.api.netsuite.com/services/rest/auth/oauth2/v1/token
          scopes: {}
security:
  - tba: []
