# Ingress — connector microservice (production tier)
# Binding ADR: ADR-0253 (HTTP/3 + QUIC + ECH + PQC), ADR-0254 (deployment shape)
# HTTP/3 default; Alt-Svc advertisement; ECH enabled; TLS 1.3 floor
# Hyperscaler precedent: Cloudflare ingress with QUIC + ECH; AWS ALB with HTTP/2 (we go further)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connector-ingress-production
  namespace: connector
  annotations:
    # HTTP/3 + QUIC (ADR-0253)
    nginx.ingress.kubernetes.io/http2-push-preload: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      listen 443 quic reuseport;
      listen [::]:443 quic reuseport;
      add_header Alt-Svc 'h3=":443"; ma=86400' always;
      ssl_protocols TLSv1.3;
      ssl_prefer_server_ciphers on;
      ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
      ssl_ecdh_curve X25519MLKEM768:X25519:P-256;
      # HSTS preload (ADR-0253)
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      # Certificate Transparency required
      add_header Expect-CT "max-age=86400, enforce" always;
      # ECH — actual ECH config-id managed by per-tenant DKIM/SPF/DMARC toolchain (ADR-0273)
      # PQC: X25519MLKEM768 in ssl_ecdh_curve above; ed25519+ml_dsa_65 cert chain
    # Bot-mgmt bot-score header forwarding (ADR-0297)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Oya-Bot-Score $http_x_bot_score;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # OCSP stapling
      ssl_stapling on;
      ssl_stapling_verify on;
    # Rate limiting (ADR-0297 anti-bot L0)
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/limit-connections: "100"
spec:
  ingressClassName: nginx-production
  tls:
    - hosts:
        - "*.oyatie.com"
        - "hooks.*.oyatie.com"
        - "oauth.*.oyatie.com"
      secretName: connector-tls-production
  rules:
    - host: "connector.oyatie.com"
      http:
        paths:
          - path: /v1/catalog
            pathType: Prefix
            backend:
              service:
                name: connector-connector-catalog-rest
                port:
                  number: 8080
          - path: /v1/oauth
            pathType: Prefix
            backend:
              service:
                name: connector-oauth-broker-rest
                port:
                  number: 8080
    # Per-tenant webhook receiver (hooks.<tenant>.oyatie.com)
    - host: "hooks.*.oyatie.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: connector-webhook-receiver-edge
                port:
                  number: 8080
    # Per-tenant OAuth callback (oauth.<tenant>.oyatie.com)
    - host: "oauth.*.oyatie.com"
      http:
        paths:
          - path: /callback
            pathType: Prefix
            backend:
              service:
                name: connector-oauth-broker-rest
                port:
                  number: 8080
