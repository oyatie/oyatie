# Encrypted Client Hello (ECH) configuration for connector service
# Per ADR-0253 amendment + documentation-rigor.md §3.2.1 row 12.
# RFC 9460 + draft-ietf-tls-esni-22. Graceful degradation: ECH-disabled clients
# fall through to standard TLS 1.3 without breakage.
---
schema_version: 1
microservice: connector
adr: "ADR-0253-amendment"
rfc_anchor: "RFC 9460 + draft-ietf-tls-esni-22"
ech_enabled: true
dns_https_rr:
  publisher: "tools/dns/adr-0273-dns-publisher"
  ttl_seconds: 300
  per_cell: true
  rotation:
    cadence: P90D
    grace_window: P14D
per_cell_config_shape:
  config_id: uint8
  hpke:
    kem_id: 0x0020  # X25519
    kdf_id: 0x0001  # HKDF-SHA256
    aead_id: 0x0001  # AES-128-GCM
  public_name: connector.oyatie.com
  extensions:
    - prefer_pqc_kem_when_available: true
    - prefer_pqc_signature_when_available: true
graceful_degradation:
  ech_unsupported_clients_pass_through_to_tls_1_3: true
  pqc_unsupported_clients_pass_through_to_classical: true
  log_event_class: "TlsEchDegradedSession"
# Webhook receivers: ECH preferred but never required (third-party providers
# vary widely in TLS feature support; connector must accept all legitimate
# webhook traffic from Slack/Stripe/HubSpot/Salesforce/etc.)
webhook_inbound_ech_required: false
