# PQC certificate configuration for connector service
# Per ADR-0253 amendment + documentation-rigor.md §3.2.1 row 12.
# Post-quantum hybrid: X25519MLKEM768 KEM + ed25519+ml_dsa_65 signature.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: connector-pqc-hybrid-cert
  namespace: connector
  labels:
    app.kubernetes.io/name: connector
    app.kubernetes.io/component: pqc-cert
    oyatie.tier: substrate
    oyatie.cell-tier: tier-3
  annotations:
    oyatie.adr: "ADR-0253-amendment + ADR-0297"
    oyatie.rotation-cadence: "P90D"
    oyatie.pqc-kem: "X25519MLKEM768"
    oyatie.pqc-signature: "ed25519+ml_dsa_65"
    oyatie.classical-fallback: "X25519 + Ed25519"
spec:
  secretName: connector-pqc-hybrid-tls
  issuerRef:
    name: oyatie-tier-0-offline-rooted-ca
    kind: ClusterIssuer
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  privateKey:
    algorithm: ed25519+ml-dsa-65-hybrid
    encoding: PKCS8
  dnsNames:
    - connector.oyatie.com
    - connector.cell-${CELL_ID}.oyatie.com
    - "*.connector.oyatie.com"
  uris:
    - spiffe://oyatie.dev/ns/connector/sa/connector-app
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
---
# Webhook receiver TLS: accept third-party providers' TLS, advertise PQC for
# webhook-publisher clients that support it; never refuse a legitimate webhook
# because the third-party provider lacks PQC.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: connector-pqc-gateway
  namespace: connector
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-pqc
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: connector-pqc-hybrid-tls
        minProtocolVersion: TLSV1_3
        cipherSuites:
          - TLS_AES_256_GCM_SHA384
          - TLS_CHACHA20_POLY1305_SHA256
          - TLS_AES_128_GCM_SHA256
      hosts:
        - "connector.oyatie.com"
        - "connector.cell-*.oyatie.com"
