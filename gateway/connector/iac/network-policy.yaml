# Cilium NetworkPolicy — connector microservice
# Binding ADR: ADR-0254 (Cilium ambient eBPF), ADR-0295 (SPIFFE workload identity)
# Default-deny + explicit ingress/egress per per-service boundary
# Hyperscaler precedent: AWS VPC Security Groups; GKE Dataplane V2 NetworkPolicy

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: connector-default-deny
  namespace: connector
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: connector-catalog-rest-ingress
  namespace: connector
spec:
  endpointSelector:
    matchLabels:
      app: connector-connector-catalog-rest
  ingress:
    # Allow from api-gateway (north-south)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: api-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Allow from workflow-engine (substrate consumer)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: workflow-engine
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Allow from marketplace (connector listings)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: marketplace
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Allow Prometheus scrape from observability namespace
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: connector-oauth-broker-ingress
  namespace: connector
spec:
  endpointSelector:
    matchLabels:
      app: connector-oauth-broker-rest
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: api-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: connector-adapter-worker-egress
  namespace: connector
  annotations:
    note: "Adapter worker requires egress to vendor APIs (internet) via Kata-isolated pods"
spec:
  endpointSelector:
    matchLabels:
      app: connector-connector-adapter-worker
  egress:
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    # Allow egress to internet (vendor APIs) — rate-limited at L7 by connector adapter
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Allow OpenBao sidecar (cloud-secrets namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloud-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Allow policy-engine (library-first Cedar eval)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: policy-engine
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
