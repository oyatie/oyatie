# Edge WAF config — connector microservice
# Binding ADR: ADR-0297 (abuse-defence baseline), documentation-rigor §3.2.3
# Hyperscaler precedent: Cloudflare WAF + Bot Management; Akamai Bot Manager
# Controls: anti-bot rate-limit, JA4 fingerprinting, CAPTCHA-on-suspicion, scrape-anomaly

apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-edge-waf-config
  namespace: connector
  annotations:
    binding_adr: "ADR-0297"
    doc_ref: "gateway/connector/policy/abuse-defence.cedar"
data:
  waf_config.yaml: |
    # ── Global rate-limit (anti-bot control #1) ──────────────────────────────
    rate_limits:
      per_ip:
        catalog_browse:
          window: 60s
          limit: 300
          burst: 600
        oauth_initiate:
          window: 60s
          limit: 10
          burst: 20
        webhook_ingest:
          window: 1s
          limit: 1000
          burst: 5000
      per_tenant:
        catalog_browse:
          window: 60s
          limit: 2000
        connector_action:
          window: 60s
          limit: 500

    # ── Behavioural fingerprinting (anti-bot control #2) ─────────────────────
    fingerprinting:
      ja4_enabled: true
      ja4_header: X-Oya-JA4-Fingerprint
      bot_score_header: X-Oya-Bot-Score
      # Passive — never alone gates a request; only informs scoring
      async_only: true

    # ── Bot management ML scoring (anti-bot control #3) ──────────────────────
    bot_management:
      provider: cloudflare_bot_management  # or in-house at parity
      threshold_challenge: 75  # bot-score > 75 → CAPTCHA
      threshold_block: 95      # bot-score > 95 → block (Cedar forbid in abuse-defence.cedar)
      # UX-floor: default-path adds ≤2ms p99 (CI-gated)
      latency_budget_ms: 2

    # ── CAPTCHA-on-suspicion (anti-bot control #4) ───────────────────────────
    captcha:
      provider: hcaptcha_and_cloudflare_turnstile
      # NEVER on default path; only when bot-score crosses threshold
      default_path_captcha: false
      # Accessibility alternatives per §3.2.3 UX-floor
      audio_captcha_enabled: true
      keyboard_only_enabled: true
      screen_reader_friendly: true
      max_solve_seconds: 10
      session_continuity_on_success: true
      locale_aware: true

    # ── Anti-scrape pattern detection ────────────────────────────────────────
    scrape_detection:
      sequential_id_enumeration: true
      breadth_first_crawl_signature: true
      high_page_depth_fan_out: true
      parallel_tab_signature: true
      # Adaptive challenge on scrape-pattern detection
      adaptive_challenge_on_pattern: true
      # robots.txt authoritative per tenant
      robots_txt_per_tenant: true

    # ── Emergency-services bypass (life-safety hard rule) ────────────────────
    emergency_services_bypass:
      enabled: true
      audience_type: EMERGENCY_SERVICES
      # Evaluated BEFORE any score gate (L0/L3-cheap, not L7-expensive)
      bypass_all_challenges: true
      # Bypass does NOT skip audit
      audit_event_class: AbuseDefenceEmergencyServiceBypass
      # PagerDuty connector: always emergency-services class
      pagerduty_connector_bypass: true

    # ── Honeypot routes (anti-scrape) ────────────────────────────────────────
    honeypot:
      routes:
        - /v1/internal-only/*
        - /v1/catalog/hidden-*
        - /admin/debug-*
      canary_api_keys_seeded: true
      alert_on_hit: true

    # ── Friendly crawler allow-list ───────────────────────────────────────────
    friendly_crawler_allowlist:
      audience_type: FRIENDLY_CRAWLER_PARTNER
      bypass_bot_challenge: true
      bypass_scrape_detection: true
      # Google, Bing, Yandex, Baidu, accessibility crawlers
      user_agent_prefixes:
        - Googlebot
        - Bingbot
        - DuckDuckBot
        - AhrefsBot
        - a11y-crawler-*
