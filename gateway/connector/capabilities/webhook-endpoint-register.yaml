# Canonical-base: specs/capabilities/canonical-tier-schema.json (per ADR-0064)
id: cap:connect:webhook-endpoint-register:v1
name: webhook-endpoint-register
namespace: connector
display_name: Register Per-Tenant Webhook Endpoint
description: |
  Provision a per-tenant HMAC-signed webhook endpoint for a connector. Generates
  a DNS subdomain (hooks.<tenant_slug>.oyatie.app), a signing secret stored in
  OpenBao, and registers the endpoint URL with the vendor's API. Returns the
  public endpoint URL and the signing-secret reference (never the raw secret).
  Idempotent: re-registering the same connector returns the existing endpoint.
  Precedent: GitHub Webhooks; Stripe Webhook endpoint management.

owner_team: axis-integration
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0243, ADR-0244, ADR-0253, ADR-0263, ADR-0273, ADR-0296]
related_artifacts:
  - microservices/connector/PRD.md
  - gateway/connector/contracts/openapi/connector-integration.yaml
  - gateway/connector/policy/webhook-receiver-gating.cedar

autonomy_tier: T3
# T3: provisions external DNS + registers endpoint with vendor API; external side-effect.

inputs:
  - name: tenant_id
    type: string
    format: uuid-v7
    required: true
  - name: connector_name
    type: string
    required: true
  - name: event_types
    type: array
    items: { type: string }
    description: Vendor event types to subscribe to (e.g., ["lead.created", "opportunity.updated"])
    required: true
  - name: signing_algorithm
    type: enum
    values: [hmac-sha256, hmac-sha512, vendor-specific]
    default: hmac-sha256
    description: HMAC algorithm; vendor-specific enables per-connector scheme (Shopify, Slack, etc.)
    required: false

outputs:
  - name: endpoint_url
    type: string
    format: uri
    description: Public HTTPS webhook URL for this tenant+connector
  - name: endpoint_id
    type: string
    format: uuid-v7
  - name: signing_secret_ref
    type: string
    description: "OpenBao SecretReference — format: ${openbao:secret/<tenant_id>/connect/webhooks/<connector>/<endpoint_id>}"
  - name: registered_at
    type: string
    format: date-time

data_classes_touched:
  - TENANT_WEBHOOK_SIGNING_SECRET_REF
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us

evidence_topic: oya.connector.webhook.endpoint.registered

cost_profile:
  type: per-registration
  estimated_cost_usd_per_call: 0.00005
  cost_drivers:
    - DNS CNAME provisioning (amortized)
    - OpenBao secret write for signing secret
    - Vendor API call to register endpoint

cedar_policy_fragments:
  - gateway/connector/policy/webhook-receiver-gating.cedar

sunset:
  status: none
  notes: ""
