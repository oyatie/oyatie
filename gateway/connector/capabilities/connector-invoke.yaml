# Canonical-base: specs/capabilities/canonical-tier-schema.json (per ADR-0064)
id: cap:connect:connector-invoke:v1
name: connector-invoke
namespace: connector
display_name: Invoke Connector Action
description: |
  Execute a typed action against a named connector (e.g., Salesforce:createLead,
  Stripe:createCharge). Resolves OAuth credentials via sidecar (ADR-0296),
  applies per-tenant rate-limit profile, handles retry-with-jitter and DLQ
  routing on failure. Library-first policy eval per ADR-0246 amendment.
  Precedent: Workato connector SDK action invocation model.

owner_team: axis-integration
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0145, ADR-0243, ADR-0246, ADR-0248, ADR-0255, ADR-0263, ADR-0296]
related_specs: []
related_artifacts:
  - microservices/connector/PRD.md
  - microservices/connector/contracts/openapi/connector-integration.yaml
  - microservices/connector/policy/connector-authorization.cedar

autonomy_tier: T2
# T2: reads tenant credentials (sensitive), writes to vendor API (external side-effect),
# writes DLQ entries; not T3 because no destructive platform-internal mutation.

inputs:
  - name: tenant_id
    type: string
    format: uuid-v7
    required: true
  - name: connector_name
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: action_name
    type: string
    pattern: '^[A-Za-z][A-Za-z0-9_]*:[A-Za-z][A-Za-z0-9_]*$'
    example: "Salesforce:createLead"
    required: true
  - name: payload
    type: object
    description: Action-specific typed payload (per connector schema)
    required: true
  - name: idempotency_key
    type: string
    format: uuid-v7
    required: true
  - name: wiring_id
    type: string
    description: Workflow wiring context reference
    required: false

outputs:
  - name: result
    type: enum
    values: [success, vendor_error, rate_limited, credential_error, dlq_enqueued]
  - name: vendor_response
    type: object
    description: Canonicalized vendor response
  - name: action_id
    type: string
    format: uuid-v7
  - name: latency_ms
    type: integer

data_classes_touched:
  - TENANT_INTEGRATION_CREDENTIAL_REF
  - VENDOR_API_PAYLOAD
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa
  - pack-cn

evidence_topic: oya.connector.action.invoked

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.00005
  cost_drivers:
    - OpenBao sidecar token fetch (amortized 60s TTL)
    - Outbound HTTPS/3 vendor API call
    - DLQ write on failure (conditional)

cedar_policy_fragments:
  - microservices/connector/policy/connector-authorization.cedar

eval_set:
  baseline_inputs_path: microservices/connector/capabilities/eval/connector-invoke-baseline.jsonl
  pass_threshold: 0.999
  eval_metric: action-success-rate-against-mock-vendor
  cadence: per-release

sunset:
  status: none
  notes: ""
