name: airtable
display_name: Airtable
category: productivity
publisher_namespace: oyatie
version: "1.3.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create, read, update, and delete Airtable records across bases and tables via
  Airtable REST API. Receive record change events via Airtable Webhooks (v1 Beta).
  Hyperscaler precedent: Zapier Airtable integration; n8n Airtable node.

auth:
  flows: [oauth2_pkce, personal_access_token]
  token_rotation: false

webhook:
  supported: true
  method: polling_fallback
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [record.created, record.updated, record.deleted]

rate_limit:
  tier: standard
  requests_per_second: 5
  burst: 10

actions:
  - name: createRecord
    description: Create a new record in a table
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: listRecords
    description: List records with optional filter formula
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: updateRecord
    description: Update a specific record's fields
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: deleteRecord
    description: Delete a specific record
    data_classes: [TENANT_SPREADSHEET_DATA]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
