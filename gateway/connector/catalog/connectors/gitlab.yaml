name: gitlab
display_name: GitLab
category: developer-tools
publisher_namespace: oyatie
version: "1.3.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage GitLab merge requests, issues, pipelines, and repositories via GitLab
  REST API v4. Receive real-time project events via GitLab Webhooks.
  Hyperscaler precedent: GitLab's own Slack/Jira integrations.

auth:
  flows: [oauth2_pkce, personal_access_token, group_access_token]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: x-gitlab-token
  replay_window_seconds: 300
  events: [push, merge_request, pipeline, issue, note]

rate_limit:
  tier: standard
  requests_per_minute: 2000
  burst: 4000

actions:
  - name: createMergeRequest
    description: Open a merge request
    data_classes: [INTERNAL_ONLY]
  - name: createIssue
    description: Create an issue in a project
    data_classes: [INTERNAL_ONLY]
  - name: triggerPipeline
    description: Trigger a GitLab CI/CD pipeline
    data_classes: [INTERNAL_ONLY]
  - name: addComment
    description: Add a comment to an issue or MR
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [author.email, assignee.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
