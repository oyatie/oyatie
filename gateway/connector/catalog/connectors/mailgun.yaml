name: mailgun
display_name: Mailgun
category: email
publisher_namespace: oyatie
version: "1.3.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send transactional emails, manage domains, and receive delivery events via
  Mailgun API v3. Hyperscaler precedent: Mailgun (used by 150,000+ businesses).

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: mailgun-hmac-sha256
  replay_window_seconds: 300
  events: [delivered, failed, bounced, complained, unsubscribed]

rate_limit:
  tier: high
  requests_per_second: 1000
  burst: 2000

actions:
  - name: sendEmail
    description: Send a transactional email
    data_classes: [PII_EMAIL, MARKETING_CONTENT]
  - name: addToSuppression
    description: Add address to unsubscribe list
    data_classes: [PII_EMAIL]
  - name: validateEmail
    description: Validate email deliverability
    data_classes: [PII_EMAIL]

compliance:
  pii_fields: [to, from, cc, bcc]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br]
  gdpr_schrems_ii_mechanism: scc
  unsubscribe_honor: mandatory

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
