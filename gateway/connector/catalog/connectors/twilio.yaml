name: twilio
display_name: Twilio
category: communications
publisher_namespace: oyatie
version: "2.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send SMS, MMS, WhatsApp messages, and make/receive voice calls via Twilio REST API.
  Receive delivery status and inbound message events via Twilio Webhooks.
  Hyperscaler precedent: Twilio (150B+ messages/year).
  CRITICAL: PagerDuty integration via Twilio — MUST NEVER be throttled (§3.2.5 row 1).

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: twilio-x-signature
  replay_window_seconds: 300
  events: [message.delivered, message.failed, call.completed, inbound_message]

rate_limit:
  tier: high
  requests_per_second: 1000
  burst: 2000
  emergency_services_bypass: true

actions:
  - name: sendSms
    description: Send an SMS message
    data_classes: [PII_PHONE, MESSAGING_CONTENT]
  - name: sendWhatsApp
    description: Send a WhatsApp message via Twilio WhatsApp API
    data_classes: [PII_PHONE, MESSAGING_CONTENT]
  - name: makeCall
    description: Initiate an outbound voice call
    data_classes: [PII_PHONE]
  - name: lookupPhoneNumber
    description: Look up carrier and line-type for a phone number
    data_classes: [PII_PHONE]

compliance:
  pii_fields: [to, from, body]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc
  tcpa_consent_required: true

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

critical_path:
  emergency_services: true
  note: "PagerDuty-via-Twilio is emergency-services class; bypass rate-limit; never throttle per §3.2.5 row 1"

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
