name: google-sheets
display_name: Google Sheets
category: productivity
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Read and write rows, manage spreadsheets, and respond to sheet change events via
  Google Sheets API v4 and Google Drive webhooks (push notifications).
  Hyperscaler precedent: Zapier Google Sheets (most-used Zapier app by volume).

auth:
  flows: [oauth2_pkce]
  token_rotation: true
  vendor_refresh_token_ttl_days: unlimited

webhook:
  supported: true
  method: google_drive_push_notifications
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [spreadsheet.change]

rate_limit:
  tier: standard
  requests_per_100s_per_user: 100
  requests_per_100s: 500

actions:
  - name: appendRow
    description: Append a row to a sheet
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: readRange
    description: Read a cell range from a sheet
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: updateRange
    description: Update a cell range
    data_classes: [TENANT_SPREADSHEET_DATA]
  - name: createSpreadsheet
    description: Create a new spreadsheet
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
