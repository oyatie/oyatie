name: slack
display_name: Slack
category: messaging
publisher_namespace: oyatie
version: "2.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send messages, create channels, manage users, and respond to events via Slack
  Web API and Events API. Supports bot tokens and user OAuth tokens.
  Hyperscaler precedent: Zapier Slack integration (500M+ zaps/month via Slack).

auth:
  flows: [oauth2_pkce, bot_token]
  scopes_required: [chat:write, channels:read, users:read]
  token_rotation: true
  vendor_refresh_token_ttl_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [message, channel_created, member_joined_channel, reaction_added]

rate_limit:
  tier: standard
  requests_per_minute: 50
  burst: 100
  retry_after_header: Retry-After

actions:
  - name: postMessage
    description: Post a message to a channel or DM
    data_classes: [TENANT_MESSAGING_CONTENT]
  - name: listChannels
    description: List public and private channels
    data_classes: [INTERNAL_ONLY]
  - name: lookupUserByEmail
    description: Look up a Slack user by email address
    data_classes: [PII_EMAIL]
  - name: createChannel
    description: Create a new channel
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [user.email, user.real_name, user.profile.display_name]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-kr, pack-eu, pack-us, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
