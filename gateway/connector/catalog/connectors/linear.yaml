name: linear
display_name: Linear
category: project-management
publisher_namespace: oyatie
version: "1.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create issues, update projects, manage cycles and roadmap via Linear GraphQL API.
  Receive real-time issue events via Linear Webhooks.
  Hyperscaler precedent: Linear's own Zapier + GitHub integrations.

auth:
  flows: [oauth2_pkce, api_key_byok]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [Issue, Comment, Project, Cycle]

rate_limit:
  tier: standard
  complexity_points_per_hour: 1500000
  burst: 10000

actions:
  - name: createIssue
    description: Create a new issue in a team
    data_classes: [INTERNAL_ONLY]
  - name: updateIssue
    description: Update issue status, assignee, or priority
    data_classes: [INTERNAL_ONLY]
  - name: listIssues
    description: List issues with GraphQL filters
    data_classes: [INTERNAL_ONLY]
  - name: createComment
    description: Add a comment to an issue
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [issue.creator.email, issue.assignee.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
