name: notion
display_name: Notion
category: productivity
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create, read, and update Notion pages, databases, and blocks via Notion API v1.
  Hyperscaler precedent: Zapier Notion integration; n8n Notion node.

auth:
  flows: [oauth2_pkce, internal_integration_token]
  token_rotation: false

webhook:
  supported: false
  note: "Notion does not support outbound webhooks in v1 API; polling-based trigger available."

rate_limit:
  tier: standard
  requests_per_second: 3
  burst: 10

actions:
  - name: createPage
    description: Create a page in a database or as a child of another page
    data_classes: [TENANT_CONTENT]
  - name: queryDatabase
    description: Query a Notion database with filters
    data_classes: [TENANT_CONTENT]
  - name: updatePageProperties
    description: Update properties on an existing page
    data_classes: [TENANT_CONTENT]
  - name: appendBlockChildren
    description: Append content blocks to a page
    data_classes: [TENANT_CONTENT]

compliance:
  pii_fields: [page.properties.Email, page.properties.Phone]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
