name: shopify
display_name: Shopify
category: ecommerce
publisher_namespace: oyatie
version: "2.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage Shopify orders, products, customers, and inventory via Shopify Admin API
  (REST + GraphQL). Receive real-time store events via Shopify Webhooks.
  Hyperscaler precedent: Shopify App Store (10,000+ apps); Boomi Shopify connector.

auth:
  flows: [oauth2_pkce, api_key_byok]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: shopify-hmac-sha256
  header: X-Shopify-Hmac-Sha256
  replay_window_seconds: 300
  events: [orders/create, orders/updated, products/create, customers/create, fulfillments/create]

rate_limit:
  tier: standard
  leaky_bucket_capacity: 40
  leaky_bucket_leak_rate: 2
  graphql_cost_per_second: 1000

actions:
  - name: createOrder
    description: Create a draft order
    data_classes: [PII_EMAIL, PII_ADDRESS, FINANCIAL_TRANSACTION]
  - name: getOrder
    description: Retrieve a specific order by ID
    data_classes: [PII_EMAIL, PII_ADDRESS, FINANCIAL_TRANSACTION]
  - name: createProduct
    description: Create a new product
    data_classes: [TENANT_PRODUCT_CATALOG]
  - name: updateInventoryLevel
    description: Update inventory for a variant at a location
    data_classes: [TENANT_PRODUCT_CATALOG]
  - name: createCustomer
    description: Create a new customer record
    data_classes: [PII_EMAIL, PII_ADDRESS, PII_PHONE]

compliance:
  pii_fields: [customer.email, customer.phone, order.shipping_address, order.billing_address]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
