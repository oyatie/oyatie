// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.connector.retirement.v1;

service ConnectorRetirement {
  rpc GetRetirementStatus(RetirementStatusRequest) returns (RetirementStatusResponse);
}

message RetirementStatusRequest {
  string tenant_id = 1;
}

message RetirementStatusResponse {
  string status = 1;
  repeated string service_ids = 2;
  string retirement_plan_ref = 3;
  string audit_event = 4;
}
