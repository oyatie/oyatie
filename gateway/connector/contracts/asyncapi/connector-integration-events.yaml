asyncapi: 3.1.0
info:
  title: connector — Integration Substrate Events
  version: 0.2.0
  description: |
    AsyncAPI channels for the connect integration substrate.
    Topics: OAuth lifecycle, webhook receive, connector invocation,
    DLQ events, schema-drift, audit-chain seals.

    All channels: NATS JetStream over QUIC per ADR-0253; consumer groups per BC.
    Every message carries `tenant_id`, `traceparent`, `tracestate`.
  contact: {name: axis-integration}
  x-oya-related-adrs: [ADR-0145, ADR-0253, ADR-0263]

servers:
  prod-kr:
    host: nats.kr.oyatie.app:4222
    protocol: nats
    description: KR pack NATS cluster
  prod-eu:
    host: nats.eu.oyatie.app:4222
    protocol: nats

channels:
  oyatie.connector.oauth.grant.issued:
    address: oyatie.connector.oauth.grant.issued
    messages:
      OAuthGrantIssued: {$ref: '#/components/messages/OAuthGrantIssued'}
  oyatie.connector.oauth.grant.revoked:
    address: oyatie.connector.oauth.grant.revoked
    messages:
      OAuthGrantRevoked: {$ref: '#/components/messages/OAuthGrantRevoked'}
  oyatie.connector.webhook.received:
    address: oyatie.connector.webhook.received
    messages:
      WebhookReceived: {$ref: '#/components/messages/WebhookReceived'}
  oyatie.connector.webhook.signature_verify_failed:
    address: oyatie.connector.webhook.signature_verify_failed
    messages:
      WebhookSignatureVerifyFailed: {$ref: '#/components/messages/WebhookSignatureVerifyFailed'}
  oyatie.connector.action.invoked:
    address: oyatie.connector.action.invoked
    messages:
      ConnectorActionInvoked: {$ref: '#/components/messages/ConnectorActionInvoked'}
  oyatie.connector.action.failed:
    address: oyatie.connector.action.failed
    messages:
      ConnectorActionFailed: {$ref: '#/components/messages/ConnectorActionFailed'}
  oyatie.connector.dlq.entry_added:
    address: oyatie.connector.dlq.entry_added
    messages:
      DLQEntryAdded: {$ref: '#/components/messages/DLQEntryAdded'}
  oyatie.connector.dlq.entry_replayed:
    address: oyatie.connector.dlq.entry_replayed
    messages:
      DLQEntryReplayed: {$ref: '#/components/messages/DLQEntryReplayed'}
  oyatie.connector.schema.drift_detected:
    address: oyatie.connector.schema.drift_detected
    messages:
      SchemaDriftDetected: {$ref: '#/components/messages/SchemaDriftDetected'}
  oyatie.connector.abuse_defence.challenge_issued:
    address: oyatie.connector.abuse_defence.challenge_issued
    messages:
      AbuseDefenceChallengeIssued: {$ref: '#/components/messages/AbuseDefenceChallengeIssued'}

operations:
  publishOAuthGrantIssued:
    action: send
    channel: {$ref: '#/channels/oyatie.connector.oauth.grant.issued'}

components:
  messages:
    OAuthGrantIssued:
      name: OAuthGrantIssued
      contentType: application/json
      payload:
        type: object
        required: [event_id, tenant_id, grant_id, connector_id, scopes, issued_at, signature]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          grant_id: {type: string}
          connector_id: {type: string}
          scopes: {type: array, items: {type: string}}
          issued_at: {type: string, format: date-time}
          provider_credential_mode: {type: string, enum: [byok, oyatie_shared]}
          signature: {type: string, description: "Ed25519 signature per ADR-0263"}
    OAuthGrantRevoked:
      payload:
        type: object
        required: [event_id, tenant_id, grant_id, revoked_at, reason, signature]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          grant_id: {type: string}
          revoked_at: {type: string, format: date-time}
          reason: {type: string, enum: [tenant_initiated, vendor_revoked, breach_response, expired]}
          signature: {type: string}
    WebhookReceived:
      payload:
        type: object
        required: [event_id, tenant_id, wiring_id, received_at, payload_digest, signature_verified]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          wiring_id: {type: string}
          received_at: {type: string, format: date-time}
          payload_digest: {type: string}
          signature_verified: {type: boolean}
          idempotency_key: {type: string}
    WebhookSignatureVerifyFailed:
      payload:
        type: object
        required: [event_id, tenant_id, wiring_id, received_at, source_ip_hash, alg]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          wiring_id: {type: string}
          received_at: {type: string, format: date-time}
          source_ip_hash: {type: string, description: "SHA-256 of source IP (avoid PII)"}
          alg: {type: string}
    ConnectorActionInvoked:
      payload:
        type: object
        required: [event_id, tenant_id, grant_id, connector_id, action, invoked_at, outcome, latency_ms]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          grant_id: {type: string}
          connector_id: {type: string}
          action: {type: string}
          invoked_at: {type: string, format: date-time}
          outcome: {type: string, enum: [success, vendor_error, rate_limited, circuit_open, timeout]}
          latency_ms: {type: integer}
    ConnectorActionFailed:
      payload:
        type: object
        required: [event_id, tenant_id, grant_id, error_class, signature]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          grant_id: {type: string}
          error_class: {type: string}
          vendor_status_code: {type: integer}
          signature: {type: string}
    DLQEntryAdded:
      payload:
        type: object
        required: [event_id, tenant_id, wiring_id, entry_id, error_class, added_at]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          wiring_id: {type: string}
          entry_id: {type: string}
          error_class: {type: string}
          added_at: {type: string, format: date-time}
    DLQEntryReplayed:
      payload:
        type: object
        required: [event_id, tenant_id, entry_id, replayed_at, outcome]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          entry_id: {type: string}
          replayed_at: {type: string, format: date-time}
          outcome: {type: string, enum: [success, failed, conflict]}
    SchemaDriftDetected:
      payload:
        type: object
        required: [event_id, tenant_id, wiring_id, detected_at, change_class, field_path]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          wiring_id: {type: string}
          detected_at: {type: string, format: date-time}
          change_class: {type: string, enum: [additive, rename, deletion, type-change]}
          field_path: {type: string}
    AbuseDefenceChallengeIssued:
      payload:
        type: object
        required: [event_id, tenant_id, principal_fingerprint_hash, bot_score, challenge_class, issued_at]
        properties:
          event_id: {type: string}
          tenant_id: {type: string}
          principal_fingerprint_hash: {type: string}
          bot_score: {type: integer, minimum: 0, maximum: 100}
          challenge_class: {type: string}
          issued_at: {type: string, format: date-time}
