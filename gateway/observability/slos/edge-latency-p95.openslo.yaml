apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-edge-latency-p95
  displayName: "api-gateway: edge p95 latency ≤ 200ms"
  labels:
    microservice: api-gateway
    sli_class: latency
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    Edge p95 latency. 95% of requests must complete (gateway-side) within 200ms.
  indicator:
    metadata:
      name: api-gateway-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "30d rolling p95 ≤ 200ms"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
