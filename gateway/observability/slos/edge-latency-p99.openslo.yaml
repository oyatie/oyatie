apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-edge-latency-p99
  displayName: "api-gateway: edge p99 latency ≤ 500ms"
  labels:
    microservice: api-gateway
    sli_class: latency
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    Edge p99 latency. 99% of requests must complete (gateway-side) within 500ms.
    Tail latency floor for Tier-0 edge.
  indicator:
    metadata:
      name: api-gateway-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling p99 ≤ 500ms"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
