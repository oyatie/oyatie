apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-edge-latency-p50
  displayName: "api-gateway: edge p50 latency ≤ 50ms"
  labels:
    microservice: api-gateway
    sli_class: latency
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    Edge p50 latency. 50% of requests must complete (gateway-side) within 50ms.
    Excludes upstream µservice time (measured separately).
  indicator:
    metadata:
      name: api-gateway-latency-p50
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_bucket{le="0.05"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_latency_seconds_count[5m]))
  objectives:
    - target: 0.5
      displayName: "30d rolling p50 ≤ 50ms"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
