apiVersion: openslo/v1
kind: SLO
metadata:
  name: connector-oauth-token-health
  microservice: connector
  binding_adr: ADR-0139
spec:
  description: |
    OAuth token health SLO: fraction of OAuth token-fetch operations (access-token
    issue from refresh token) that succeed within 500ms. A degraded token-health
    means connectors stall waiting for credentials, causing cascading DLQ growth.
    Precedent: Auth0 SLA 99.99% uptime on token endpoint.
  service: connector
  indicator:
    metadata:
      name: connector-oauth-token-fetch-latency-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_oauth_token_fetch_duration_seconds_bucket{le="0.5",result="success"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_oauth_token_fetch_duration_seconds_count[5m]))
  timeWindow:
    - count: 30
      isRolling: true
      unit: Day
  budgetingMethod: Occurrences
  objectives:
    - displayName: oauth-token-health-99.5
      target: 0.995
      op: gte
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: connector-oauth-token-health-fast-burn
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 14
            lookbackWindow: PT1H
            alertAfter: PT5M
        notification:
          pagerDutyServiceId: "${openbao:secret/connect/pagerduty/oauth-health-svc-id}"
