apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-edge-latency
spec:
  description: Design target for edge admission latency.
  objective:
    target: 0.99
  indicator:
    metadata:
      name: api-gateway-edge-latency-p99
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(api_gateway_request_duration_bucket{le="0.005"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(api_gateway_request_duration_count[5m]))
