apiVersion: openslo/v1
kind: SLO
metadata:
  name: connector-webhook-receiver-throughput
  microservice: connector
  binding_adr: ADR-0139
spec:
  description: |
    Webhook receiver throughput SLO: fraction of inbound webhooks that are
    successfully received, signature-verified, and enqueued within 200ms p99.
    Failures here mean vendors retry, causing duplication pressure.
    Precedent: Stripe webhook delivery expects 200ms p99 acknowledgment.
    Idempotency-key deduplication window: 5 minutes (per ADR §transport).
  service: connector
  indicator:
    metadata:
      name: connector-webhook-ack-latency-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_webhook_ack_duration_seconds_bucket{le="0.2",result="success"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_webhook_ack_duration_seconds_count[5m]))
  timeWindow:
    - count: 30
      isRolling: true
      unit: Day
  budgetingMethod: Occurrences
  objectives:
    - displayName: webhook-receiver-throughput-99.5
      target: 0.995
      op: gte
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: connector-webhook-throughput-fast-burn
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 14
            lookbackWindow: PT1H
            alertAfter: PT5M
        notification:
          pagerDutyServiceId: "${openbao:secret/connect/pagerduty/webhook-throughput-svc-id}"
