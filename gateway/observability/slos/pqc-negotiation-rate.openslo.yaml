apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-pqc-negotiation-rate
  displayName: "api-gateway: PQC hybrid negotiation rate (advisory)"
  labels:
    microservice: api-gateway
    sli_class: correctness
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    PQC hybrid (X25519MLKEM768) negotiation rate. Advisory only — graceful
    degradation per ADR-0253 means we never refuse a session for lack of PQC.
    Tracks adoption curve.
  indicator:
    metadata:
      name: api-gateway-pqc-negotiation-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_tls_handshake_total{kem_group="X25519MLKEM768"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_tls_handshake_total{status="success"}[5m]))
  objectives:
    - target: 0.1
      displayName: "Advisory: PQC hybrid offered to 10%+ of handshakes (adoption tracking)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
