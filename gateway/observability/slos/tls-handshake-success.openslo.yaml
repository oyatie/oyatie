apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-tls-handshake-success
  displayName: "api-gateway: TLS handshake success ≥ 99.95%"
  labels:
    microservice: api-gateway
    sli_class: availability
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    TLS 1.3 handshake success ratio. Includes ECH + PQC hybrid handshakes.
    Failures expected: cert expiry, CA outage, OCSP timeout, client-side TLS<1.3.
  indicator:
    metadata:
      name: api-gateway-tls-handshake-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_tls_handshake_total{status="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_tls_handshake_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling TLS handshake success ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
