apiVersion: openslo/v1
kind: SLO
metadata:
  name: connector-connector-availability
  microservice: connector
  binding_adr: ADR-0139
spec:
  description: |
    Availability SLO for connector action invocations. Measures the fraction of
    connector actions (outbound vendor API calls) that complete successfully
    (non-5xx, non-timeout). Per Google SRE Workbook multiwindow burn-rate model.
    Precedent: Workato connector availability ≥99.9% per their public SLA.
  service: connector
  indicator:
    metadata:
      name: connector-connector-action-success-ratio
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_action_total{result="success"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(connector_action_total[5m]))
  timeWindow:
    - count: 30
      isRolling: true
      unit: Day
  budgetingMethod: Occurrences
  objectives:
    - displayName: connector-availability-99.9
      target: 0.999
      op: gte
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: connector-connector-availability-fast-burn
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 14
            lookbackWindow: PT1H
            alertAfter: PT5M
        notification:
          pagerDutyServiceId: "${openbao:secret/connect/pagerduty/connector-availability-svc-id}"
    - kind: AlertPolicy
      metadata:
        name: connector-connector-availability-slow-burn
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 2
            lookbackWindow: PT6H
            alertAfter: PT15M
        notification:
          pagerDutyServiceId: "${openbao:secret/connect/pagerduty/connector-availability-svc-id}"
