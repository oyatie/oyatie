apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-h3-negotiation-rate
  displayName: "api-gateway: HTTP/3 negotiation rate ≥ 80%"
  labels:
    microservice: api-gateway
    sli_class: correctness
    tier: tier-0-edge
    owner_team: axis-network
spec:
  service: api-gateway
  description: |
    HTTP/3 negotiation ratio (vs falling back to h2/h1.1). 80% floor reflects
    realistic mix of QUIC-blocked corporate/edu networks. Per-tenant variance
    monitored separately.
  indicator:
    metadata:
      name: api-gateway-h3-negotiation-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_alpn_negotiated_total{alpn="h3"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_alpn_negotiated_total[5m]))
  objectives:
    - target: 0.8
      displayName: "30d rolling h3 negotiation rate ≥ 80%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
