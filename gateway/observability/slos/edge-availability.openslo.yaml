# Canonical-base: specs/openslo/canonical-envelope-schema.json
apiVersion: openslo/v1
kind: SLO
metadata:
  name: api-gateway-edge-availability
  displayName: "api-gateway: edge availability 99.99%"
  labels:
    microservice: api-gateway
    bounded_context: routing
    sli_class: availability
    tier: tier-0-edge
    plane: data
    owner_team: axis-network
    pack_scope: all
spec:
  service: api-gateway
  description: |
    Edge availability SLO. A request is "good" when the gateway returns a non-5xx
    response within the per-route deadline. 99.99% is the floor for Tier-0 edge
    per ADR-0157 + ADR-0248.
  indicator:
    metadata:
      name: api-gateway-non-5xx-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_requests_total{code!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(api_gateway_requests_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "30d rolling edge availability ≥ 99.99%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
