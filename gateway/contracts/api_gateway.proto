// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.api_gateway.v1;

service ApiGatewayAdmission {
  rpc AdmitEdgeRequest(EdgeAdmissionRequest) returns (EdgeAdmissionResponse);
}

message EdgeAdmissionRequest {
  string tenant_id = 1;
  string cell_id = 2;
  string route_id = 3;
  string request_id = 4;
}

message EdgeAdmissionResponse {
  string request_id = 1;
  string status = 2;
  string denial_reason = 3;
  string audit_event = 4;
}
