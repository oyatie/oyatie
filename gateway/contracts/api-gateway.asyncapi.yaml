asyncapi: 3.1.0
info:
  title: Oyatie API Gateway Events
  version: 0.1.0
channels:
  apiGatewayAdmissionEvents:
    address: oya.api_gateway.admission
    messages:
      admitted:
        $ref: '#/components/messages/RequestAdmitted'
      denied:
        $ref: '#/components/messages/RequestDenied'
operations:
  publishAdmissionDecision:
    action: send
    channel:
      $ref: '#/channels/apiGatewayAdmissionEvents'
components:
  messages:
    RequestAdmitted:
      payload:
        type: object
        required: [tenant_id, request_id, route_id]
        properties:
          tenant_id:
            type: string
          request_id:
            type: string
          route_id:
            type: string
    RequestDenied:
      payload:
        type: object
        required: [tenant_id, request_id, denial_reason]
        properties:
          tenant_id:
            type: string
          request_id:
            type: string
          denial_reason:
            type: string
