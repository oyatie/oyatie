# cargo-deny policy.
#
# Presubmit (hermetic): `cargo deny check licenses bans sources`.
# Weekly (network): `cargo deny check advisories`.
# Any change to this file is a policy change.

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# SQLx Postgres adapter review, 2026-05-23:
# - foldhash@0.1.5 is Zlib-licensed and enters only through sqlx-core's
#   hashlink/hashbrown cache path.
# - webpki-roots is CDLA-Permissive-2.0-licensed trust-anchor data used by the
#   rustls TLS path selected to avoid OpenSSL.
# Keep these as exact per-crate exceptions, not global allows, so future version
# bumps or broader license use re-open policy review.
exceptions = [
  { allow = ["Zlib"], crate = "foldhash@0.1.5" },
  # 2026-05-28 hyperscaler review: additional exact transitive
  # exceptions discovered outside the SQLx-specific review above. Keep
  # these per-crate instead of broad global allows so new uses re-open
  # review.
  { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer@0.5.3" },
  { allow = ["CC0-1.0"], crate = "base16@0.2.1" },
  { allow = ["Zlib"], crate = "const_format@0.2.36" },
  { allow = ["Zlib"], crate = "const_format_proc_macros@0.2.34" },
  { allow = ["Zlib"], crate = "foldhash@0.2.0" },
  { allow = ["Zlib"], crate = "konst@0.2.20" },
  { allow = ["Zlib"], crate = "konst_macro_rules@0.2.19" },
  { allow = ["Zlib"], crate = "slotmap@1.1.1" },
  { allow = ["BSL-1.0"], crate = "xxhash-rust@0.8.18" },
  # 2026-08-19: refreshed when `cargo deny check licenses` was FIRST actually executed
  # (see .github/workflows/license-weekly-advisory.yml). These rows had drifted because
  # nothing ran them: the pinned 1.0.7 row named a version no longer in the lock, and
  # rustls split its trust-anchor data into a SECOND crate, webpki-root-certs, which no
  # row covered at all. Same CDLA-Permissive-2.0 trust-anchor data, same rationale as the
  # 2026-05-23 review above; only the crate names and versions move.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.9" },
]

[advisories]
version = 2
# RustSec database advisories: fail on any unfixed vulnerability that
# does not have an explicit ignore. Unmaintained advisories block
# workspace crates; transitive unmaintained debt is reviewed through
# direct dependency upgrade lanes instead of blanket ignores.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
# Hyperscaler discipline: forbid duplicate crate versions (transitive
# diamond dependencies waste binary size + lengthen the supply-chain
# attack surface). Skip-tree the workspace itself so unavoidable
# upstream duplicates can be allowlisted explicitly here.
# Ratchet: no *new* diamonds. Existing extras are skipped until integ/build
# collapses them (one-version + auto-latest bump-bot). Newest of each name stays.
multiple-versions = "deny"
# Wildcard deps from third-party crates are forbidden; in-workspace
# path-dep declarations parse as wildcards under cargo-deny but are
# safe (the workspace pins their versions), so this stays `warn` not
# `deny`. CI surfaces the warning for review without blocking.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # OpenSSL footguns: prefer rustls everywhere. Adding either of
  # these requires an ADR-tracked exception.
  { name = "openssl" },
  { name = "openssl-sys" },
  # Unmaintained crates known to be unsafe.
  { name = "old-time" },
]
allow = []
skip = [
    { name = "arrayvec", version = "=0.5.2" },  # keep 0.7.8
    { name = "bit-vec", version = "=0.8.0" },  # keep 0.9.1
    { name = "bitflags", version = "=1.3.2" },  # keep 2.13.1
    { name = "convert_case", version = "=0.6.0" },  # keep 0.11.0
    { name = "cpufeatures", version = "=0.2.17" },  # keep 0.3.0
    { name = "educe", version = "=0.6.0" },  # keep 0.7.6
    { name = "foldhash", version = "=0.1.5" },  # keep 0.2.0
    { name = "getrandom", version = "=0.2.17" },  # keep 0.4.3
    { name = "getrandom", version = "=0.3.4" },  # keep 0.4.3
    { name = "hashbrown", version = "=0.12.3" },  # keep 0.17.1
    { name = "hashbrown", version = "=0.14.5" },  # keep 0.17.1
    { name = "hashbrown", version = "=0.15.5" },  # keep 0.17.1
    { name = "hashbrown", version = "=0.16.1" },  # keep 0.17.1
    { name = "hashlink", version = "=0.9.1" },  # keep 0.10.0
    { name = "indexmap", version = "=1.9.3" },  # keep 2.14.0
    { name = "itertools", version = "=0.13.0" },  # keep 0.15.0
    { name = "itertools", version = "=0.14.0" },  # keep 0.15.0
    { name = "petgraph", version = "=0.7.1" },  # keep 0.8.3
    { name = "r-efi", version = "=5.3.0" },  # keep 6.0.0
    { name = "rand", version = "=0.8.7" },  # keep 0.10.2
    { name = "rand", version = "=0.9.5" },  # keep 0.10.2
    { name = "rand_chacha", version = "=0.3.1" },  # keep 0.9.0
    { name = "rand_core", version = "=0.6.4" },  # keep 0.10.1
    { name = "rand_core", version = "=0.9.5" },  # keep 0.10.1
    { name = "redox_syscall", version = "=0.5.18" },  # keep 0.9.1
    { name = "reqwest", version = "=0.12.28" },  # keep 0.13.4
    { name = "schemars", version = "=0.9.0" },  # keep 1.2.2
    { name = "serde_spanned", version = "=0.6.9" },  # keep 1.1.1
    { name = "syn", version = "=2.0.119" },  # keep 3.0.3
    { name = "thiserror", version = "=1.0.69" },  # keep 2.0.20
    { name = "thiserror-impl", version = "=1.0.69" },  # keep 2.0.20
    { name = "tokio-tungstenite", version = "=0.27.0" },  # keep 0.29.0
    { name = "toml", version = "=0.8.23" },  # keep 1.1.4+spec-1.1.0
    { name = "toml_datetime", version = "=0.6.11" },  # keep 1.1.1+spec-1.1.0
    { name = "tower", version = "=0.4.13" },  # keep 0.5.3
    { name = "tungstenite", version = "=0.27.0" },  # keep 0.29.0
    { name = "unicode-width", version = "=0.1.14" },  # keep 0.2.2
    { name = "untrusted", version = "=0.7.1" },  # keep 0.9.0
    { name = "wasm-streams", version = "=0.4.2" },  # keep 0.5.0
    { name = "webpki-roots", version = "=0.26.11" },  # keep 1.0.9
    { name = "windows-sys", version = "=0.48.0" },  # keep 0.61.2
    { name = "windows-sys", version = "=0.52.0" },  # keep 0.61.2
    { name = "windows-targets", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_aarch64_gnullvm", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_aarch64_msvc", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_i686_gnu", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_i686_msvc", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_x86_64_gnu", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_x86_64_gnullvm", version = "=0.48.5" },  # keep 0.52.6
    { name = "windows_x86_64_msvc", version = "=0.48.5" },  # keep 0.52.6
    { name = "winnow", version = "=0.7.15" },  # keep 1.0.4
]
skip-tree = []

[sources]
# Only crates.io as a registry source. Adding a git or local registry
# requires an ADR-tracked exception.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
