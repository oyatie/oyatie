name: backbone-foundation-ci

# Required narrow gate for the ontology/workflow/workflow-studio/intelligence
# backbone preview foundation. This complements the broad workspace PR gates with
# a fast, source-of-truth check that the exact pre-cloud-integration crates,
# contracts, manifests, and honest-claim evidence still compile and validate.
#
# Best-practice posture:
# - least-privilege GITHUB_TOKEN (contents:read only)
# - concurrency cancellation for stale commits
# - full-length SHA-pinned GitHub-maintained actions
# - workspace rust-toolchain.toml controls the compiler pin
# - no secrets, deployments, or cloud credentials in this preview-foundation lane

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backbone-foundation-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FOUNDATION_PACKAGES: >-
    -p oya-ontology-kernel
    -p oya-ontology-query-engine-domain
    -p oya-ontology-query-engine-usecase
    -p oya-saas-workflow-kernel
    -p oya-saas-workflow-domain
    -p oya-saas-workflow-app
    -p oya-workflow-engine-event-bus-kernel
    -p oya-workflow-engine-event-bus-domain
    -p oya-workflow-engine-event-bus-usecase
    -p oya-workflow-engine-event-bus-api
    -p oya-workflow-engine-event-bus-rest
    -p oya-workflow-engine-event-bus-worker
    -p oya-workflow-engine-event-bus-sdk
    -p oya-workflow-engine-event-bus-app
    -p oya-workflow-engine-event-bus-adapter
    -p oya-workflow-engine-event-bus-adapter-postgres
    -p oya-workflow-engine-event-bus-adapter-valkey
    -p oya-workflow-engine-event-bus-adapter-kafka
    -p oya-workflow-engine-event-bus-adapter-redpanda
    -p oya-workflow-engine-event-bus-adapter-nats
    -p oya-workflow-engine-event-bus-adapter-pulsar
    -p oya-workflow-engine-execution-engine-kernel
    -p oya-workflow-engine-execution-engine-domain
    -p oya-workflow-engine-execution-engine-usecase
    -p oya-workflow-engine-execution-engine-adapter
    -p oya-workflow-engine-execution-engine-adapter-postgres
    -p oya-workflow-engine-execution-engine-api
    -p oya-workflow-engine-execution-engine-rest
    -p oya-workflow-engine-execution-engine-worker
    -p oya-workflow-engine-execution-engine-sdk
    -p oya-workflow-engine-execution-engine-app
    -p oya-workflow-engine-trigger-orchestrator-kernel
    -p oya-workflow-engine-trigger-orchestrator-domain
    -p oya-workflow-engine-trigger-orchestrator-usecase
    -p oya-workflow-engine-trigger-orchestrator-api
    -p oya-workflow-engine-trigger-orchestrator-rest
    -p oya-workflow-engine-trigger-orchestrator-worker
    -p oya-workflow-engine-trigger-orchestrator-sdk
    -p oya-workflow-engine-trigger-orchestrator-app
    -p oya-workflow-engine-state-machine-kernel
    -p oya-workflow-engine-state-machine-domain
    -p oya-workflow-engine-state-machine-usecase
    -p oya-workflow-engine-state-machine-api
    -p oya-workflow-engine-state-machine-adapter
    -p oya-workflow-engine-state-machine-adapter-postgres
    -p oya-workflow-studio-visual-canvas-kernel
    -p oya-workflow-studio-dsl-emitter-domain
    -p oya-workflow-studio-dsl-loader-domain
    -p oya-workflow-studio-policy-preview-domain
    -p oya-intelligence-model-routing-kernel
    -p oya-intelligence-model-routing-domain
    -p oya-intelligence-model-routing-usecase
    -p oya-intelligence-assist-draft-kernel
    -p oya-intelligence-assist-draft-domain
    -p oya-intelligence-assist-draft-usecase
    -p oya-intelligence-assist-draft-adapter
    -p oya-intelligence-assist-draft-api
    -p oya-intelligence-assist-draft-rest
    -p oya-intelligence-assist-draft-worker
    -p oya-intelligence-guardrails-kernel
    -p oya-intelligence-guardrails-domain
    -p oya-intelligence-guardrails-usecase
    -p oya-intelligence-context-aware-retrieval-kernel
    -p oya-intelligence-context-aware-retrieval-domain
    -p oya-intelligence-context-aware-retrieval-usecase
    -p oya-intelligence-context-aware-retrieval-adapter
    -p oya-intelligence-context-aware-retrieval-worker
    -p oya-intelligence-eval-kernel
    -p oya-intelligence-eval-domain
    -p oya-intelligence-eval-usecase
    -p oya-intelligence-eval-adapter
    -p oya-intelligence-eval-worker
    -p oya-intelligence-attribution-kernel
    -p oya-intelligence-attribution-domain
    -p oya-intelligence-attribution-usecase
    -p oya-intelligence-attribution-adapter
    -p oya-intelligence-attribution-worker
    -p oya-intelligence-dispatch-usecase
    -p oya-intelligence-credential-resolver-domain
    -p oya-intelligence-credential-resolver-usecase
    -p oya-intelligence-credential-resolver-adapter
    -p oya-intelligence-audit-tap-usecase
    -p oya-intelligence-audit-tap-adapter
    -p oya-intelligence-audit-tap-worker
    -p oya-intelligence-providers-adapter-openai

jobs:
  backbone-foundation-ci:
    name: backbone-foundation-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install workspace Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$toolchain" ]; then
            echo "::error::rust-toolchain.toml does not declare a channel" >&2
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache cargo registry, git index, and target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-backbone-foundation-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-backbone-foundation-

      - name: Rust format check for backbone foundation crates
        run: cargo fmt $FOUNDATION_PACKAGES -- --check

      - name: Unit and contract tests for backbone foundation crates
        run: cargo test $FOUNDATION_PACKAGES

      - name: Clippy for backbone foundation crates
        run: cargo clippy $FOUNDATION_PACKAGES --all-targets -- -D warnings

      - name: Validate backbone contracts, manifests, and honest-claim evidence
        run: |
          set -euo pipefail
          jq empty \
            contracts/workflow_spec.v1.json \
            specs/microservices/intelligence.json \
            specs/root-hub-pointers.json \
            specs/microservices/manifests-index.json \
            microservices/ontology/manifest.json \
            microservices/workflow-engine/manifest.json \
            microservices/workflow-studio/manifest.json \
            microservices/intelligence/manifest.json \
            evidence/multispectrum/backbone-microservices-foundation-20260523.json
          cargo metadata --no-deps --format-version 1 >/tmp/oyatie-backbone-metadata.json
          test "$(jq -r '.hyperscaler_grade' evidence/multispectrum/backbone-microservices-foundation-20260523.json)" = "not_claimed"
          cargo run -q -p oya-dev-cli -- gate validate protection-context-match
          cargo run -q -p oya-dev-cli -- gate validate honest-claims
