# Cold integrity-canary — the ADR-0556 D2 trust anchor, shipped in the same change
# as the NativeLink CAS wiring (ADR-0560; "no canary, no warm").
#
# A scheduled, declarative, FROM-EMPTY build of the pinned target set
# (ci/facade/build-cache-policy/src/canary-policy.json) on a
# clean ephemeral runner with the cache BYPASSED — no buckconfig overlay, no
# actions/cache restore of buck-out (deliberate; ADR-0556 D5 cold-must-stay: "no
# cache restore step may ever be added to the integrity-canary job"). Its output
# digests are byte-compared against the warm CAS entries for the same keys; any
# divergence is RED and the ADR-0556 RED response applies (suspend ALL warm reads
# fleet-wide: flip specs/cache-warm-license.json warm_reads_licensed to false
# before any remediation; divergent-key eviction rides the canary reconciler
# successor, ADR-0556 D4.3).
#
# Slice-1 honesty: until a live CAS endpoint is reachable
# (specs/cache-warm-license.json carries warm_reads_licensed=false), the warm-probe
# step is skipped and the verdict is INACTIVE_NO_ENDPOINT — explicitly NOT green,
# licensing nothing. The cold build, the from-empty proof (assert-cold over the
# structured invocation record), the digest manifest, and the verdict artifact all
# run for real today.
#
# THIS JOB THEREFORE FAILS DAILY UNTIL CAS EXISTS, AND THAT IS THE CORRECT READING.
# INACTIVE_NO_ENDPOINT exits nonzero (CanaryStatus::is_failure — only GREEN exits
# zero), so the check conclusion says "the trust anchor is not established" rather
# than "cache integrity verified". It previously exited zero, which published a
# daily green badge for a run that compared zero keys: run 30690156857 (2026-08-01)
# was conclusion=success with the warm-probe step SKIPPED. The job is deliberately
# outside the oya-ci-required fan-in (see below), so a red conclusion here carries
# no merge authority and cannot wedge trunk — it only refuses to invite the
# warm_reads_licensed flip on evidence that does not exist.
#
# This is NOT part of the oya-ci-required fan-in (zero impact on merge authority);
# results surface as run artifacts + the job's check conclusion per the no-shell
# axiom (ADR-0556 D4.3: result via API/artifact, never a log someone shells in to
# read). `run:` steps below are transitional local bridges per cli_surface_policy;
# the heavy lifting lives in the buck2-built Rust toolkit.

name: cache-integrity-canary

on:
  schedule:
    # Daily, off-peak UTC. Cadence is an ADR-0556 D2 tunable; coverage lag for
    # trunk keys minted between runs is at most one period.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      prelicense_probe:
        description: Run the explicit manual warm proof before licensing reads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cache-integrity-canary
  cancel-in-progress: false

jobs:
  canary:
    name: "integrity-canary (cold, from-empty — ADR-0556 D2 / ADR-0560)"
    permissions:
      contents: read
      id-token: write
    env:
      OYA_OPENBAO_ADDR: https://openbao.oya-kms.svc:8202
      OYA_OPENBAO_CA_CERT: /etc/openbao/ca/ca.crt
    # OWNED FLEET. This canary has NEVER been green — and not because the cold build fails.
    # Every scheduled run terminates with steps=0: the job never entered its body, so it failed
    # ADMISSION, not verification. Probed 30523904142 / 30433843967 / 30340384915 / 30251411018 /
    # 30193580189 — five consecutive runs, all steps=0, log blob absent. That is the same
    # hosted-runner condition that moved the required lane in #1450 and check-substrates in #1453.
    #
    # WHY THIS ONE MATTERS MOST: this canary is the trust anchor for the entire warm-cache and RE
    # architecture. ADR-0556 D2's licensing clause (b) cannot be satisfied without a green canary,
    # /specs/cache-warm-license.json correctly ships `warm_reads_licensed: false` because of it,
    # and ADR-0612 D5 states plainly: "no RE-covering canary, no RE". A one-line runner label has
    # been holding the whole cache/RE critical path closed, while presenting as a failing canary.
    #
    # Safe to flip: no `services:` block (so the Docker-daemon constraint keeping the two
    # gate-live-postgres-* jobs on hosted does not apply) and no pwsh/Windows/macOS dependency.
    # ADR-0560 D4's contract — from-empty, NO overlay, NO actions/cache step — is a property of
    # the STEPS, which are unchanged. Running in-cluster additionally puts the canary where the
    # NativeLink CAS is actually reachable, which is a precondition for it ever covering RE.
    runs-on: oya-arm64
    steps:
      - name: Bind short-lived identity paths to RUNNER_TEMP
        run: |
          echo "OYA_CACHE_TLS_CLIENT_CERT=${RUNNER_TEMP}/oya-cache-reader.pem" >> "${GITHUB_ENV}"
          echo "OYA_CACHE_TLS_CA_CERTS=${RUNNER_TEMP}/oya-cache-ca.pem" >> "${GITHUB_ENV}"
      # actions/checkout@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history: the materialization boundary runs the scm-facts emitter,
          # which derives last_touch via git log; a shallow checkout collapses it.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Same rustup serialization rationale as the oya-ci-required buck2 lane:
      # parallel buck2 actions racing a cold rustup install collide on shared
      # download state. NOTE: deliberately NO actions/cache step anywhere in this
      # workflow — toolchain download cost is part of the canary's from-empty price.
      - name: Pre-provision pinned rust toolchain (serialize rustup before parallel buck2)
        run: |
          set -euo pipefail
          rustup toolchain install
      - name: Materialize cloud-ci generated faces (out-of-graph boundary)
        run: buck2 run //ci/facade/generated-artifact-freshness:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
      # The pinned target set is policy DATA (canary-policy.json), resolved by the
      # buck2-built toolkit — the workflow hardcodes no target list.
      - name: Resolve pinned canary target set (policy-as-data)
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- canary-targets > /tmp/canary-targets
          cat /tmp/canary-targets
      # Belt-and-braces: the resolver must agree the integrity-canary class is
      # bypass (it is unconditional in the engine; this surfaces tampering loudly).
      - name: Resolve cache posture for build class integrity-canary (must be bypass)
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- resolve --build-class integrity-canary --require-bypass
      # THE COLD BUILD: no overlay, fresh runner, and its OWN isolation dir — the
      # toolkit `buck2 run` steps above build into the default buck-out, so the
      # measured build shares no local state with them (from-empty in its own
      # universe, not just remote-cold). The structured invocation record is the
      # from-empty evidence.
      - name: Cold from-empty build of the pinned target set
        run: |
          set -euo pipefail
          buck2 --isolation-dir canary-cold build @/tmp/canary-targets --unstable-write-invocation-record /tmp/canary-cold-record.json --show-full-output > /tmp/canary-cold-outputs.txt
      - name: Prove zero cache participation (assert-cold over the record)
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- assert-cold --record /tmp/canary-cold-record.json
      - name: Hash cold output digests into the manifest
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- hash-outputs --show-output /tmp/canary-cold-outputs.txt --out /tmp/canary-cold-manifest.json
      - name: Read warm-license state (the declarative kill-switch)
        id: license
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- license-state >> "$GITHUB_OUTPUT"
      - name: Exchange GitHub OIDC for short-lived CAS reader identity
        if: steps.license.outputs.warm_licensed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.prelicense_probe)
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- issue-identity \
            --role github-cas-reader-integrity-canary \
            --pki-role cas-reader \
            --uri-san spiffe://oyatie.dev/ci/cas-reader
      # WARM PROBE — activates at CAS bring-up (license flips true after the first
      # GREEN run is reviewed in). This is the canary CONTROLLER's retrieval of the
      # warm substrate's entries (ADR-0556 D2), not a build class: it dials the
      # READ-ONLY overlay directly (reader endpoint; AC read_only at the service;
      # allow_cache_uploads=false) in its own isolation dir. The cold build above
      # never touched the cache (assert-cold proved it). The reader mTLS identity
      # arrives via secret-mounted env, never the repo.
      - name: Warm-probe fetch (read-only; skipped while unlicensed)
        if: steps.license.outputs.warm_licensed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.prelicense_probe)
        run: |
          set -euo pipefail
          PRELICENSE_ARG=()
          if [ "${{ inputs.prelicense_probe || false }}" = "true" ]; then PRELICENSE_ARG=(--prelicense-probe); fi
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- run --warm-probe "${PRELICENSE_ARG[@]}" --mode-out /tmp/canary-cache-mode -- buck2 --isolation-dir canary-warm-probe build @/tmp/canary-targets --unstable-write-invocation-record /tmp/canary-warm-record.json --show-full-output > /tmp/canary-warm-outputs.txt
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- hash-outputs --show-output /tmp/canary-warm-outputs.txt --out /tmp/canary-warm-manifest.json
      - name: Canary verdict (byte-equality; RED fails the job)
        run: |
          set -euo pipefail
          if [ -f /tmp/canary-warm-manifest.json ]; then
            buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- canary-verdict --cold /tmp/canary-cold-manifest.json --warm /tmp/canary-warm-manifest.json --warm-record /tmp/canary-warm-record.json --out /tmp/canary-verdict.json
          else
            buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- canary-verdict --cold /tmp/canary-cold-manifest.json --out /tmp/canary-verdict.json
          fi
      - name: Cache-hit telemetry for the canary lane (must be 0%)
        if: always()
        run: |
          set -euo pipefail
          buck2 run //ci/facade/build-cache-policy:oya-cloud-ci-cache-wiring-bin -- report --record /tmp/canary-cold-record.json --build-class integrity-canary --mode bypass --out /tmp/canary-cache-hit-report.json
      - name: Remove short-lived cache identity
        if: always()
        run: rm -f "${OYA_CACHE_TLS_CLIENT_CERT}" "${OYA_CACHE_TLS_CA_CERTS}"
      - name: Upload canary artifacts (verdict + manifests + telemetry)
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-integrity-canary
          path: |
            /tmp/canary-verdict.json
            /tmp/canary-cold-manifest.json
            /tmp/canary-warm-manifest.json
            /tmp/canary-cache-hit-report.json
          # Bounded: same shared-quota accrual as every other upload in this repo. The
          # canary runs daily, so 30 days keeps a full month of cold-vs-warm verdicts.
          retention-days: 30
          if-no-files-found: warn
