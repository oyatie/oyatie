name: Validate Agent Skills

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Runs on every push/PR touching tools/agent-skills/** or tools/hook-bootstrap/**.
# Validates vendored skill structure, runs shellcheck on all hook scripts,
# and smoke-tests the install.sh --dry-run path.

on:
  push:
    paths:
      - 'tools/agent-skills/**'
      - 'tools/hook-bootstrap/**'
      - 'tools/hooks/**'
      - 'bin/oya'
  pull_request:
    paths:
      - 'tools/agent-skills/**'
      - 'tools/hook-bootstrap/**'
      - 'tools/hooks/**'
      - 'bin/oya'

jobs:
  validate:
    name: Validate skills + hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate vendored skill structure
        run: |
          if [ -f tools/agent-skills/scripts/validate-skills.js ]; then
            node tools/agent-skills/scripts/validate-skills.js
          else
            echo "ℹ validate-skills.js not found — agent-skills not yet vendored"
            echo "  Run: ./tools/hook-bootstrap/install.sh to vendor agent-skills"
          fi

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get install -y shellcheck
          fi

      - name: shellcheck — hook scripts
        run: |
          # -S info enforces the strictest lint level (catches SC2002 useless-cat,
          # SC2317 unreachable-code, etc.) so behavior is reproducible regardless
          # of which shellcheck distro the runner ships with. Locally: match via
          # `shellcheck -S info tools/hook-bootstrap/*.sh tools/hooks/*.sh bin/oya`.
          shellcheck -S info tools/hook-bootstrap/install.sh
          shellcheck -S info tools/hook-bootstrap/uninstall.sh
          shellcheck -S info bin/oya
          for f in tools/hooks/*.sh; do
            shellcheck -S info "$f"
          done

      - name: Smoke test — install.sh --dry-run
        run: |
          bash tools/hook-bootstrap/install.sh --dry-run --skip-skills
          echo "install.sh --dry-run exited 0"

      - name: Smoke test — uninstall.sh --dry-run
        run: |
          bash tools/hook-bootstrap/uninstall.sh --dry-run
          echo "uninstall.sh --dry-run exited 0"

      - name: Verify UPSTREAM.json provenance (if vendored)
        run: |
          set -e
          if [ ! -f tools/agent-skills/UPSTREAM.json ]; then
            echo "ℹ UPSTREAM.json not present — agent-skills not yet vendored (OK for base branch)"
            exit 0
          fi
          # Required fields present + license is MIT + manual_edits_prohibited is true
          jq -e '
            .upstream
            and .commit_sha
            and .fetched_at
            and (.license == "MIT")
            and .attribution
            and (.manual_edits_prohibited == true)
          ' tools/agent-skills/UPSTREAM.json > /dev/null
          # Oyatie-authored inheritance fields present
          jq -e '
            (.inheritance_pattern // empty) != null
            and (.oyatie_authored_files // empty) != null
            and (.import_targets // empty) != null
          ' tools/agent-skills/UPSTREAM.json > /dev/null
          # INHERITANCE.md must exist (oyatie-authored)
          test -f tools/agent-skills/INHERITANCE.md
          SHA_SHORT=$(jq -r '.commit_sha[0:12]' tools/agent-skills/UPSTREAM.json)
          FETCHED=$(jq -r '.fetched_at' tools/agent-skills/UPSTREAM.json)
          echo "UPSTREAM.json valid — SHA: ${SHA_SHORT}, fetched: ${FETCHED}"
