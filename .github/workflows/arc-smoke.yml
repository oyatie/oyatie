name: arc-smoke
on:
  push:
    branches: ["ci/arc-smoke"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: oya-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Report the runner we actually landed on
        run: |
          set -euo pipefail
          echo "uname: $(uname -s)-$(uname -m)"
          echo "hostname: $(hostname)"
