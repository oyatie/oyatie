name: arc-smoke
on:
  push:
    branches: ["ci/arc-smoke"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Proves the two capabilities the REQUIRED postgres gates need on an owned
  # runner: a `services:` container, and a real buck2 gate. containerMode
  # kubernetes turns the service into a pod, so no privileged Docker is involved.
  svc:
    runs-on: oya-arm64
    container:
      image: registry.oya-registry.svc.cluster.local:5000/oya/runner:arm64
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports: ["5432:5432"]
    steps:
      - name: Toolchain is baked
        run: |
          set -euo pipefail
          echo "platform: $(uname -s)-$(uname -m) on $(hostname)"
          buck2 --version && rustc --version && /usr/bin/clang --version | head -1
      - name: Service container reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/postgres/5432) 2>/dev/null; then echo "POSTGRES-SERVICE-REACHABLE"; exit 0; fi
            sleep 2
          done
          echo "postgres service never became reachable" >&2; exit 1
