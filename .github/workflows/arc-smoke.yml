name: arc-smoke
on:
  push:
    branches: ["ci/arc-smoke"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: oya-arm64
    steps:
      - name: Report the runner we actually landed on
        run: |
          set -euo pipefail
          echo "uname: $(uname -s)-$(uname -m)"
          echo "hostname: $(hostname)"
