# Laptop CAS — GitHub-hosted prelicense proof (outside oya-ci-required)
#
# Proves Access TCP → cw/cr.oyatie.dev → founder laptop NativeLink from GHA.
# Does NOT flip specs/cache-warm-license.json.
# Does NOT join the oya-ci-required fan-in.
#
# Secrets (repo): CF_ACCESS_{WRITE,READ}_CLIENT_{ID,SECRET}, OYA_CAS_TLS_CA,
# OYA_CAS_WRITE_HOST, OYA_CAS_READ_HOST, OYA_CAS_INSTANCE (bootstrapped via
# ~/oyatie-cas/gha/bootstrap-cas-secrets.sh).
name: laptop-cas-gha-proof

on:
  workflow_dispatch:
    inputs:
      run_buck2:
        description: Also run a Buck2 warm-overlay smoke (heavier; default off)
        required: false
        type: boolean
        default: false

# Never cancel mid-proof; one run at a time is enough.
concurrency:
  group: laptop-cas-gha-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reapi:
    name: REAPI Access-TCP proof
    runs-on: ubuntu-latest
    # Trusted repo only — secrets must never run on fork PRs (this workflow has no pull_request trigger).
    if: ${{ github.repository == 'jason931225/oyatie' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install grpcurl
        run: |
          set -euo pipefail
          ver=1.9.3
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${ver}/grpcurl_${ver}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grpcurl
          grpcurl -version

      - name: Start Access TCP forwarders
        env:
          CF_ACCESS_WRITE_CLIENT_ID: ${{ secrets.CF_ACCESS_WRITE_CLIENT_ID }}
          CF_ACCESS_WRITE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_WRITE_CLIENT_SECRET }}
          CF_ACCESS_READ_CLIENT_ID: ${{ secrets.CF_ACCESS_READ_CLIENT_ID }}
          CF_ACCESS_READ_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READ_CLIENT_SECRET }}
          OYA_CAS_WRITE_HOST: ${{ secrets.OYA_CAS_WRITE_HOST }}
          OYA_CAS_READ_HOST: ${{ secrets.OYA_CAS_READ_HOST }}
        run: |
          set -euo pipefail
          chmod +x infra/ci/laptop-cas/*.sh
          # Defaults if hostname secrets unset
          export OYA_CAS_WRITE_HOST="${OYA_CAS_WRITE_HOST:-cw.oyatie.dev}"
          export OYA_CAS_READ_HOST="${OYA_CAS_READ_HOST:-cr.oyatie.dev}"
          infra/ci/laptop-cas/start-access-tcp.sh

      - name: REAPI canary
        env:
          OYA_CAS_INSTANCE: ${{ secrets.OYA_CAS_INSTANCE }}
          OYA_CAS_WRITE_HOST: ${{ secrets.OYA_CAS_WRITE_HOST }}
          OYA_CAS_READ_HOST: ${{ secrets.OYA_CAS_READ_HOST }}
        run: |
          set -euo pipefail
          export OYA_CAS_WRITE_HOST="${OYA_CAS_WRITE_HOST:-cw.oyatie.dev}"
          export OYA_CAS_READ_HOST="${OYA_CAS_READ_HOST:-cr.oyatie.dev}"
          export OYA_CAS_INSTANCE="${OYA_CAS_INSTANCE:-main}"
          infra/ci/laptop-cas/reapi-proof.sh

      - name: Upload REAPI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laptop-cas-reapi-proof
          path: |
            ${{ runner.temp }}/oya-cas-caps-*.json
            ${{ runner.temp }}/oya-cas-fmb-*.json
          if-no-files-found: ignore

      - name: Stop Access TCP forwarders
        if: always()
        run: infra/ci/laptop-cas/stop-access-tcp.sh || true

  buck2:
    name: Buck2 warm-overlay smoke (optional)
    needs: reapi
    if: ${{ github.repository == 'jason931225/oyatie' && inputs.run_buck2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Buck2
        run: infra/ci/install-buck2.sh

      - name: Start Access TCP forwarders
        env:
          CF_ACCESS_WRITE_CLIENT_ID: ${{ secrets.CF_ACCESS_WRITE_CLIENT_ID }}
          CF_ACCESS_WRITE_CLIENT_SECRET: ${{ secrets.CF_ACCESS_WRITE_CLIENT_SECRET }}
          CF_ACCESS_READ_CLIENT_ID: ${{ secrets.CF_ACCESS_READ_CLIENT_ID }}
          CF_ACCESS_READ_CLIENT_SECRET: ${{ secrets.CF_ACCESS_READ_CLIENT_SECRET }}
          OYA_CAS_WRITE_HOST: ${{ secrets.OYA_CAS_WRITE_HOST }}
          OYA_CAS_READ_HOST: ${{ secrets.OYA_CAS_READ_HOST }}
        run: |
          set -euo pipefail
          chmod +x infra/ci/laptop-cas/*.sh
          export OYA_CAS_WRITE_HOST="${OYA_CAS_WRITE_HOST:-cw.oyatie.dev}"
          export OYA_CAS_READ_HOST="${OYA_CAS_READ_HOST:-cr.oyatie.dev}"
          infra/ci/laptop-cas/start-access-tcp.sh

      - name: Materialize prelicense Buck2 overlay
        env:
          OYA_CAS_TLS_CA: ${{ secrets.OYA_CAS_TLS_CA }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/oya-cas-tls
          printf '%s\n' "$OYA_CAS_TLS_CA" > /tmp/oya-cas-tls/ca.crt
          # Compose ignored local config: overlay + lab CA (tunnel origin has no client-CA).
          {
            cat infra/ci/buckconfig/laptop-cas-github-rw.buckconfig
            echo
            echo '[buck2_re_client]'
            echo "  tls_ca_certs = /tmp/oya-cas-tls/ca.crt"
          } > .buckconfig.local
          chmod 600 .buckconfig.local
          echo "wrote .buckconfig.local (mode 0600)"

      - name: Buck2 smoke against warm overlay
        run: |
          set -euo pipefail
          # Platform-only target keeps the smoke small; proves daemon accepts remote cache config.
          buck2 build toolchains//cache:cache-platform \
            --isolation-dir laptop-cas-gha-proof \
            --unstable-write-invocation-record "$RUNNER_TEMP/buck2-laptop-cas-record.json"
          echo "buck2 smoke OK"

      - name: Upload Buck2 record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laptop-cas-buck2-proof
          path: ${{ runner.temp }}/buck2-laptop-cas-record.json
          if-no-files-found: ignore

      - name: Stop Access TCP forwarders
        if: always()
        run: infra/ci/laptop-cas/stop-access-tcp.sh || true
