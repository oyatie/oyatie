name: oya-foundry-fitness-sequential-pr-merge-conflicts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      base_branch:
        description: "PR base branch to simulate"
        required: false
        default: "dev"
      start_pr:
        description: "First PR number in the numeric sequence"
        required: false
        default: "111"
      end_pr:
        description: "Last PR number in the numeric sequence; empty means all later open PRs"
        required: false
        default: ""
      skip_prs:
        description: "Explicit one-off comma-separated PR numbers to skip"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sequential-pr-merge-conflicts-${{ github.event.inputs.base_branch || 'dev' }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-sequential-pr-merge-conflicts:
    name: oya-foundry-fitness-sequential-pr-merge-conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || 'dev' }}
          fetch-depth: 0

      - name: Simulate numeric open-PR merge order
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || 'dev' }}
          START_PR: ${{ github.event.inputs.start_pr || vars.OYA_MERGE_QUEUE_START_PR || '111' }}
          END_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.inputs.end_pr || '' }}
          SKIP_PRS: ${{ github.event.inputs.skip_prs || '' }}
        run: |
          set -euo pipefail
          args=(
            --base-branch "$BASE_BRANCH"
            --base-ref "origin/$BASE_BRANCH"
            --start-pr "$START_PR"
            --skip-prs "$SKIP_PRS"
          )
          if [ -n "$END_PR" ]; then
            args+=(--end-pr "$END_PR")
          fi
          scripts/check-sequential-pr-merge-conflicts.sh "${args[@]}"
