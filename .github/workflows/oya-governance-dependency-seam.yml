name: oya-governance-dependency-seam

# Required-check workflow for dependency-seam governance. It fails closed on
# dependency rationale drift, non-adapter seam imports, missing fixture-pair
# coverage, malformed multispectrum evidence, or cargo-audit vulnerabilities.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-governance-dependency-seam-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-governance-dependency-seam:
    name: oya-governance-dependency-seam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Validate dependency-seam governance gate
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cargo run -q -p oya-dev-cli -- gate validate dependency-seam \
            --repo-root . \
            --evidence evidence/multispectrum/cs-p13-dependency-seam-1779166052.json \
            --online-audit \
            --severity error
