name: oya-governance-dependency-seam

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Required-check workflow for dependency-seam governance. It fails closed on
# dependency rationale drift, non-adapter seam imports, missing fixture-pair
# coverage, malformed multispectrum evidence, or cargo-audit vulnerabilities.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-governance-dependency-seam-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-governance-dependency-seam:
    name: oya-governance-dependency-seam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Fetch RustSec advisory database
        # cargo-audit 0.22.1 in the dep-seam gate path does not auto-fetch the
        # advisory database; without explicit population the cargo-audit-shell
        # subcheck fails with "error loading advisory database: ... No such
        # file or directory". Local runs work because ~/.cargo/advisory-db/
        # is populated from prior cargo-audit invocations.
        # `cargo audit fetch` is not a subcommand in 0.22.1, so we clone the
        # advisory DB directly into the canonical cache path.
        run: |
          set -euo pipefail
          ADVISORY_DB_DIR="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          if [ ! -d "$ADVISORY_DB_DIR/crates" ]; then
            git clone --depth=1 https://github.com/RustSec/advisory-db.git "$ADVISORY_DB_DIR"
          fi
          # Sanity-check that the clone produced the expected directory shape
          # (avoids `ls | head` which SIGPIPEs under `set -o pipefail`).
          test -d "$ADVISORY_DB_DIR/crates" && echo "advisory-db populated"
      - name: Validate dependency-seam governance gate
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          if ! cargo run -q -p oya-dev-cli -- gate validate dependency-seam \
                --repo-root . \
                --evidence evidence/multispectrum/cs-p13-dependency-seam-1779166052.json \
                --online-audit \
                --severity error \
                --emit-report dep-seam-report.json; then
            echo "==> DEPENDENCY-SEAM REPORT JSON (subcheck-level diagnostics) <=="
            cat dep-seam-report.json || echo "(report not emitted)"
            exit 1
          fi
      - name: Upload dep-seam report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dep-seam-report
          path: dep-seam-report.json
          retention-days: 7
          if-no-files-found: ignore
