# Cosign + Rekor signing pipeline (M01-P15-IP-001).
#
# Triggered on every release tag; signs each release artifact with Cosign
# (keyless via GitHub OIDC), uploads the signature, and writes the entry
# to the Rekor transparency log. Verification gate downstream consumes
# the resulting `*.sig` + Rekor log index via
# `oya-foundry-fitness-supply-chain-kernel::check_signed`.

name: cosign

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a

      - name: Sign release artifacts (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="releases/${tag}"
          mkdir -p "${out}"
          for artifact in releases/${tag}/*.tar.gz releases/${tag}/*.wasm releases/${tag}/*.zip; do
            [ -f "${artifact}" ] || continue
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.crt" \
              "${artifact}"
          done

      - name: Anchor signatures in Rekor
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for sig in releases/${tag}/*.sig; do
            [ -f "${sig}" ] || continue
            cosign verify-blob \
              --certificate "${sig%.sig}.crt" \
              --signature "${sig}" \
              --certificate-identity-regexp '^https://github\.com/jason931225/oyatie/\.github/workflows/cosign\.yml@refs/' \
              --certificate-oidc-issuer-regexp '^https://token\.actions\.githubusercontent\.com$' \
              "${sig%.sig}"
          done

      - name: Upload signatures + certs
        uses: actions/upload-artifact@v4
        with:
          name: cosign-signatures
          path: |
            releases/**/*.sig
            releases/**/*.crt
