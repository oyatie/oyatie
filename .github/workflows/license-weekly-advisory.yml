# Weekly advisory refresh (network). Licenses/bans/sources are hermetic on
# presubmit via cargo deny. This lane is not merge-blocking.
#
# Authority: deny.toml

name: license-weekly-advisory

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-weekly-advisory:
    name: deny advisories (weekly)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          command-arguments: advisories
          rust-version: "1.98.0"
