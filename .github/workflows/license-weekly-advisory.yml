# Weekly non-blocking license-policy check over the resolved dependency graph.
#
# Not part of the merge path: merge authority is the `oya-ci-required` context.
# A red run here means a dependency's license left the deny.toml allow-list, or an
# exception expired — a signal to fix the dependency or review the policy, never a
# merge blocker. It is scheduled rather than per-PR deliberately: a license
# regression is not the same urgency class as a broken build, and installing this
# tool on the required path would be wall-clock paid on every merge forever.
#
# WHY THIS IS NOT A PRODUCER-FACE GATE. Every registered gate here is hermetic: its
# producer reads tracked files and a pure evaluator scores the rows. Third-party
# license metadata is not a tracked file in this repository — Cargo.lock carries
# name/version/checksum but no license, and third-party/ holds reindeer fixups
# rather than vendored crate sources. The license of a transitive dependency is
# knowable only from the registry, so a hermetic producer cannot emit those rows.
# cargo-deny reads the registry cache directly and enforces deny.toml verbatim,
# exceptions and all, with no second policy surface to drift.
#
# Authority: deny.toml (the allow-list + dated per-crate exceptions);
# ci/facade/dependency-automation `[supply_chain] license_policy = "deny.toml"`;
# .github/CONTRIBUTING.md, which already documents `cargo deny check` as advisory.

name: license-weekly-advisory

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-weekly-advisory:
    name: license-weekly-advisory (deny.toml over the resolved graph)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup toolchain install && rustc --version
      # Version-pinned and --locked so the build resolves cargo-deny's own lockfile
      # rather than whatever is newest. A digest-verified prebuilt binary, matching
      # the infra/ci/install-buck2.sh pattern, is the better form and is deliberately
      # NOT faked here: it requires a recorded sha256 that nobody has published into
      # this repo yet. Weekly cadence makes the source build affordable in the interim.
      - name: Install pinned cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: License policy over the resolved dependency graph
        run: cargo deny --all-features check licenses
