# TAP postsubmit: merged SHA on `dev`. Unique proofs only — workspace nextest
# plus always-on live Postgres. Not a required context.
# Mirrors pipeline_admission::postsubmit_ok (tested).
name: postsubmit

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "nightly-2026-09-10"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-x86
          cache-workspace-crates: "true"
      - name: Workspace tests
        run: cargo nextest run --locked --workspace --profile ci

  live-postgres:
    uses: ./.github/workflows/live-postgres.yml
    with:
      run_backbone: true
      run_compute_lifecycle: true

  postsubmit:
    name: postsubmit
    runs-on: ubuntu-24.04
    if: always()
    needs: [test, live-postgres]
    steps:
      - name: Fan-in verdict
        run: |
          req() { [ "$1" = "success" ]; }
          req "${{ needs.test.result }}" && req "${{ needs.live-postgres.result }}" && exit 0 || exit 1
