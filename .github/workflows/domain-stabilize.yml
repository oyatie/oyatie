# Forever domain LOCAL_GREEN profile filename + public status string pattern.
#
# Public status pattern: `domain.<envelope>.stabilize`
# (e.g. domain.compute.stabilize). Advisory / Profile A — NOT merge authority.
#
# Merge authority forever string remains: `merge-admission-required`
# (see merge-admission-required.yml + dual-emit in oya-ci-required.yml).
#
# This file is workflow_call-only (BAN double full CI). Event triggers stay on
# oya-ci-required.yml until quiet-window cutover documented there.
# Protection flip = PAUSE-AND-PAIR only — never flip from this lane.
#
# Profile A semantics (SSOT: domain_stack § Merge admission + domain green):
#   envelope fence + graph-affected Buck2/tests under owned prefixes.
#   admission.policy allows in-envelope paths via envelope_globs (no tip-free tax).
#   MUST NOT require hub edits (specs/**, ci/**) for LOCAL_GREEN.
#
# Retired brands (comments only): oya-ci-required, firewall, cloud-ci-firewall.
name: domain-stabilize
on:
  workflow_call:

permissions:
  contents: read

jobs:
  domain-stabilize-filename-anchor:
    name: domain.stabilize (filename anchor)
    runs-on: ubuntu-latest
    steps:
      - name: Forever domain profile filename anchor (uses-only; no new inline shell)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: true
