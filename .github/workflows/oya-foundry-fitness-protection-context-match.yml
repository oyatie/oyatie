name: oya-foundry-fitness-protection-context-match

# Asserts that every `required_status_checks` context in
# `.github/branch-protection.yaml` is the `name:` field of some
# job in some `.github/workflows/*.yml`. Catches the silent-bypass
# class where branch-protection lists a context no workflow posts;
# GitHub then waits forever for a check_run that never arrives,
# and the protected branch becomes silently un-merge-able.
#
# Lane: oya-foundry-fitness-protection-context-match (per-pr).
# Kernel: crates/oya-check-protection-context-match.
# Runner: crates/oya-dev-cli/src/protection_context_match_gate.rs.
#
# History: this lane exists because of the 2026-05-15 PR #3
# merge-block — `branch-protection.yaml` listed `cargo-fmt`
# (the YAML job-key) while pr-tests.yml posted check_runs as
# `cargo fmt --check` (the workflow `name:` field). 5 of 9
# required gates were silently non-enforcing for the duration of
# the drift. This lane prevents the recurrence.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: protection-context-match-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-protection-context-match:
    name: oya-foundry-fitness-protection-context-match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: oya gate validate protection-context-match
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo run -q -p oya-dev-cli -- gate validate protection-context-match
