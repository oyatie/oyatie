# Single canonical required status check: branch protection keys on the `oya-ci-required`
# context, which is green IFF every constituent lane is green.
#
# Execution engine: the Cargo workspace graph (rust-toolchain.toml pins the toolchain).
# buck2 is local hermeticity tooling plus a weekly non-blocking smoke;
# (buck2-weekly-smoke.yml). Inside the merge path, buck2 appears only as the
# face materializer's internal helper (install-buck2.sh), never as a build/test verdict engine.
#
# Authority: docs/decisions/ADR-0716-cargo-merge-path-buck2-local-hermeticity.md

name: oya-ci-required

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Event tuple consumed by the generated-faces materializer (--github-event).
env:
  EVENT_EVALUATED_SHA: ${{ github.sha }}
  EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  EVENT_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
  EVENT_PUSH_AFTER_SHA: ${{ github.event.after || '' }}
  EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
  EVENT_MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
  EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  EVENT_NAME: ${{ github.event_name }}
  EVENT_REF: ${{ github.ref }}
  EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
  EVENT_MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
  # CI never opens a debugger, and this repo declares only [profile.release] — so dev/test
  # builds took cargo's defaults and generated FULL debuginfo for 1,759 packages. Debuginfo
  # also inflates target/, which slows cache save and restore at both ends. Set here rather
  # than in Cargo.toml so local developer builds keep their debuginfo.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Incremental state caches nothing useful on a fresh runner and costs time and disk to write.
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ADR-0718-D1. FAST BLOCKING LANE. `rustfmt --check` compiles nothing — it is differential
  # over the changed *.rs files only. It previously shared a job with an ADVISORY
  # `cargo clippy --workspace --all-targets`, so the blocking format verdict could not report
  # until a full-workspace compile finished, and the job restored/saved a cargo cache the
  # format check has no use for.
  lint:
    name: lint (format + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The format gate diffs against the base ref.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: Check formatting
        # Blocking and differential: only ACMR (added/copied/modified/renamed) *.rs
        # files this PR changed. Deleted paths are not rustfmt inputs. skip_children
        # keeps a crate-root path from re-checking untouched sibling modules that
        # still carry pre-existing rustfmt debt. Repo-wide drift is a follow-up PR.
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
        run: files="$(git diff --diff-filter=ACMR --name-only "origin/${BASE_REF#refs/heads/}...HEAD" -- '*.rs')" && { [ -z "$files" ] || rustfmt --check --config skip_children=true -- $files; }

  # ADR-0718-D1. DEEP LINT LANE, parallel with `test` and deliberately ABSENT from the
  # oya-ci-required fan-in. It was already `continue-on-error: true` inside the old lint job,
  # so it has never been able to fail a merge; keeping it out of `needs` therefore removes no
  # enforcement and takes an advisory full-workspace compile off the merge path. If the
  # repo-wide lint-debt cleanup lands and clippy becomes blocking, it must be added back to the
  # fan-in in that same change — ADR-0718 does not pre-authorize that.
  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-clippy
      - name: Clippy, warnings denied
        # Advisory until the repo-wide lint-debt cleanup PR lands, then blocking.
        # The differential format gate in `lint` is the blocking new-debt guard today.
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (workspace + gates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    env:
      # Same accounting-registry producer the Buck gate targets inject as
      # OYA_CI_PRODUCER_BIN (artifact-accountability and sibling live-corpus
      # tests fail closed without it) and OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER
      # (hook-wiring). Built once below; both names point at that binary.
      OYA_CI_PRODUCER_BIN: ${{ github.workspace }}/target/debug/oya-cloud-ci-accounting-registry-app
      OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER: ${{ github.workspace }}/target/debug/oya-cloud-ci-accounting-registry-app
      OYA_CI_ENFORCEMENT_LIVENESS_CLAUDE_SETTINGS: ${{ github.workspace }}/.claude
      OYA_CI_ENFORCEMENT_LIVENESS_CODEX_HOOKS: ${{ github.workspace }}/.codex
      OYA_CI_ENFORCEMENT_LIVENESS_HOOKS_DIR: ${{ github.workspace }}/tools/hooks
      # swatinem/rust-cache caches registry dependencies, NOT workspace members, and this
      # workspace has 885 of them — a run logged a cache HIT with Cargo.lock untouched and still
      # compiled 1,565 crates. sccache is content-addressed per compilation unit, so it survives
      # the lockfile churn and the workspace-member gap that rust-cache leaves open.
      # CARGO_INCREMENTAL=0 (set workflow-wide) is a prerequisite: sccache cannot cache
      # incremental compilation.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history: gate crates derive facts from git (merge-base, scm faces).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Its OWN key, not the shared cargo-ci-linux one. The live-postgres lanes compile a
          # small subset of the workspace; sharing a key would let their thin save overwrite this
          # lane's workspace-crate cache on every run — cache thrash that silently undoes the
          # setting below.
          shared-key: cargo-ci-test-workspace
          # THE fix for the measured defect: a run logged `Cache hit for: v0-rust-cargo-ci`
          # with Cargo.lock untouched and still compiled 1,565 crates, because this action
          # caches dependency crates but NOT workspace members by default — and this workspace
          # has 885 of them. Viable now specifically because #2113 turned debuginfo off, which
          # is what kept target/ small enough to be worth storing against the 10 GB per-repo
          # cache budget.
          cache-workspace-crates: "true"
      # The face materializer shells out to buck2 internally to build its sibling
      # face tools; the digest-pinned installer is the bridge it has always used.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Install pinned buck2 (digest-verified)
        shell: bash
        run: infra/ci/install-buck2.sh
      # buck2's builds need the full pinned toolchain (clippy/rustfmt components);
      # rustup must finish before buck2 runs or its downloads race (known class).
      - name: Pre-provision pinned toolchain components
        shell: bash
        # Full default profile (rustc+cargo+std+clippy+rustfmt): the materializer's buck2
        # build resolves the triple-named toolchain through rustup; pre-installing everything
        # makes those rustup calls no-ops and avoids the concurrent-download race.
        run: host=$(rustc -vV | awk '/^host/{print $2}') && for v in 1.97.1 1.96.0; do rustup component add --toolchain $v-$host cargo clippy rustfmt rust-std rustc; rustup component add --toolchain $v cargo clippy rustfmt rust-std rustc; done && rustup default 1.97.1 && rustc --version
      # Materialize generated faces before tests: several gate crates consume them.
      - name: Materialize generated faces
        run: |
          cargo build --locked --workspace --tests --quiet &
          compile=$!
          cargo run --locked -p ci-generated-artifact-freshness --bin oya-cloud-ci-materialize-generated-faces -- --repo-root . --github-event
          wait "$compile"
      # Shared accounting-registry producer for OYA_CI_PRODUCER_BIN and
      # OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER. Step name is a frozen
      # workflow_inline_shell baseline key — do not rename.
      - name: Build enforcement-liveness producer
        run: cargo build --locked -p ci-artifact-inventory-registry --bin oya-cloud-ci-accounting-registry-app
      # Every workspace member, including the whole ci/facade gate fleet, runs here.
      - name: Workspace tests
        # ADR-0718-D3. nextest runs each test in its own process with a work-stealing
        # scheduler — materially faster than libtest's in-process threads at this scale, with
        # per-test isolation. It does not run doctests, verified safe rather than assumed:
        # zero doc examples across the .rs corpus and `doctest = false` already declared by
        # the large majority of manifests.
        # --no-fail-fast: nextest stops at the first failure by default, so each defect costs a
        # WHOLE CI run to discover — four runs of this branch surfaced four separate failures one
        # at a time. Running the suite out reports every failure in one run at the same verdict.
        # This is not an advisory escape: the job still fails if any test fails, unlike
        # `--keep-going` or `|| true`, which the registration gates reject for that reason.
        run: cargo nextest run --locked --workspace --no-fail-fast
      # kernel/ is a nested workspace (ADR-0512 carve-out) the root workspace excludes.
      - name: Kernel workspace tests
        run: cargo nextest run --locked --manifest-path kernel/Cargo.toml
      # Live hub-exclusivity admission: rejects a second open PR touching a hub path
      # declared under specs/integ-branch-envelopes.json#hubs.paths.
      - name: Live hub-exclusivity admission
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --locked -p ci-affected-target-set --bin oya-cloud-ci-hub-exclusivity -- --repo-root . --live-open-prs --repo "$GITHUB_REPOSITORY" --candidate-pr "${{ github.event.pull_request.number }}"
      # Generated outputs are never contributor merge surfaces: reject non-deletion
      # edits to tracked generated artifacts (diff streamed to the policy binary).
      # BASE_REF resolves the merge_group base explicitly. `github.base_ref` is a
      # pull_request-only context and is EMPTY in a merge group, so this diffed against a
      # hardcoded `dev` there — correct only while dev is the sole queue target, and silently
      # the wrong base the moment a queue is enabled on another branch. merge_group.base_ref
      # arrives fully qualified (`refs/heads/dev`), so the prefix is stripped in place rather
      # than by adding a step, which would grow the frozen workflow_inline_shell debt.
      - name: Reject non-deletion generated output edits
        if: ${{ github.event_name != 'push' }}
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
        run: git diff --find-renames --name-status "origin/${BASE_REF#refs/heads/}...HEAD" | cargo run --locked -p ci-generated-artifact-policy --bin oya-cloud-ci-generated-output-diff-policy -- --manifest registry/generated-artifact-control-plane.json --repo-root .

  live-postgres-adapters:
    name: live-postgres-adapters (RLS / CDC / SCIM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oya_ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas (adapters)
        env:
          ADMIN_PASSWORD: oya_ci_pg_admin_local_only
          APP_PASSWORD: oya_ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-oya_ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-oya_ci_pg_app_local_only}"; if [ -f /run/oya-ci-postgres/admin-password ]; then admin_password="$(cat /run/oya-ci-postgres/admin-password)"; fi; if [ -f /run/oya-ci-postgres/app-password ]; then app_password="$(cat /run/oya-ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYA_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYA_PG_APP_URL=postgres://oya_app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          # psql runs INSIDE the postgres service container, which already ships it. The
          # runner previously apt-installed postgresql-client; that unretried network call was
          # cancelled mid-install and ejected a merge-queue entry (#2106). Under ALLGREEN
          # batching one such flake fails the whole batch and re-batches everything behind it.
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${admin_password}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='oya_app') THEN EXECUTE format('CREATE ROLE oya_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (adapters)
        env:
          OYA_DATA_LIVE_POSTGRES: "1"
          OYA_DATA_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_DATA_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_OUTBOX_LIVE_POSTGRES: "1"
          OYA_OUTBOX_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_OUTBOX_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: RUST_TEST_THREADS=1 cargo test --locked -p data-sql-adapter-sqlx -p data-outbox-adapter-postgres -p tenancy-tenant-lifecycle-store-postgres -p identity-scim-store-postgres

  live-postgres-facades:
    name: live-postgres-facades (tenant lifecycle / SCIM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oya_ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas (facades)
        env:
          ADMIN_PASSWORD: oya_ci_pg_admin_local_only
          APP_PASSWORD: oya_ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-oya_ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-oya_ci_pg_app_local_only}"; if [ -f /run/oya-ci-postgres/admin-password ]; then admin_password="$(cat /run/oya-ci-postgres/admin-password)"; fi; if [ -f /run/oya-ci-postgres/app-password ]; then app_password="$(cat /run/oya-ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYA_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYA_PG_APP_URL=postgres://oya_app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          # psql runs INSIDE the postgres service container, which already ships it. The
          # runner previously apt-installed postgresql-client; that unretried network call was
          # cancelled mid-install and ejected a merge-queue entry (#2106). Under ALLGREEN
          # batching one such flake fails the whole batch and re-batches everything behind it.
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${admin_password}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='oya_app') THEN EXECUTE format('CREATE ROLE oya_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (facades)
        env:
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: RUST_TEST_THREADS=1 cargo test --locked -p iam-identity-service -p tenancy-tenant-lifecycle-app

  cross-platform-smoke:
    name: cross-platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Portability signal only where it is actionable. On merge_group this job's result is
    # structurally discarded: it is absent from the fan-in verdict below (which checks only
    # lint/test/live-postgres-*) and carries continue-on-error, so it cannot affect
    # admission. That is observable, not inferred -- dev merges green today with the
    # windows leg red. The two legs are 73 of the 90 billable minutes a queue build costs
    # (macOS bills 10x, Windows 2x), so running them where nothing can read the answer is
    # 81% of that build spent for no merge signal.
    #
    # It stays on pull_request, which is the only event where an author can still change
    # the diff in response, and on push to dev for post-merge detection.
    if: github.event_name != 'merge_group'
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: matrix.os == 'windows-latest'
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-${{ matrix.os }}
      - name: Install pinned buck2 (digest-verified)
        shell: bash
        run: infra/ci/install-buck2.sh
      - name: Pre-provision pinned toolchain components
        shell: bash
        # Full default profile (rustc+cargo+std+clippy+rustfmt): the materializer's buck2
        # build resolves the triple-named toolchain through rustup; pre-installing everything
        # makes those rustup calls no-ops and avoids the concurrent-download race.
        run: host=$(rustc -vV | awk '/^host/{print $2}') && for v in 1.97.1 1.96.0; do rustup component add --toolchain $v-$host cargo clippy rustfmt rust-std rustc; rustup component add --toolchain $v cargo clippy rustfmt rust-std rustc; done && rustup default 1.97.1 && rustc --version
      - name: Materialize generated faces
        run: cargo run --locked -p ci-generated-artifact-freshness --bin oya-cloud-ci-materialize-generated-faces -- --repo-root . --github-event
      - name: Cross-platform smoke tests
        run: cargo test --locked -p ci-scm-facts-snapshot

  # Fan-in: the single required context. Green IFF lint, test, and both live-postgres
  # lanes are green. The cross-platform lane is soft: its failure never blocks merge.
  oya-ci-required:
    # The context string is the job's `name:`, not its id, so this renames the PUBLIC status
    # check while leaving the job id -- and therefore the rust-first inline-shell baseline key
    # `<file>::<job-id>::<step>` -- untouched. That is what makes this rename possible without
    # a replacement-window ADR.
    name: merge-admission-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    # cross-platform-smoke is deliberately NOT a dependency. The verdict below never reads
    # its result, so listing it only made the fan-in WAIT on a lane it does not consult --
    # and would make this required context's fate depend on that job's skip state. With
    # enforce_admins on, a required context that fails to report blocks every merge, so the
    # dependency is removed rather than reasoned about.
    needs: [lint, test, live-postgres-adapters, live-postgres-facades]
    steps:
      - name: Fan-in verdict
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.live-postgres-adapters.result }}" = "success" ] && [ "${{ needs.live-postgres-facades.result }}" = "success" ] && exit 0 || exit 1

  # Dual-emit of the forever public status string alongside the legacy protected context.
  # The branch-protection flip to `merge-admission-required` is a founder-only setting change.
  merge-admission-required:
    # TRANSITION MIRROR, to be deleted once branch protection requires only the new name.
    # It carries the OLD context string so `oya-ci-required` keeps reporting while protection
    # still lists it. It is a mirror, not the verdict: it SKIPS when the fan-in fails, which is
    # exactly why it must never be the sole required context. Protection currently requires
    # BOTH names, so at every point in this migration at least one required context is the real
    # fan-in and fails closed on red -- there is no window where a skip can satisfy the gate.
    name: oya-ci-required
    runs-on: ubuntu-latest
    if: ${{ always() && needs.oya-ci-required.result == 'success' }}
    needs:
      - oya-ci-required
    steps:
      - name: Dual-emit forever title
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: true
