          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
          server_version="$("${ADMIN_PSQL[@]}" -Atqc "SHOW server_version;")"
          cat > "${RUNNER_TEMP}/live-postgres-facades-bootstrap-provenance.json" <<JSON
          {
            "schema_version": 2,
            "artifact_type": "cloud_ci_operator_artifact",
            "artifact_id": "live-postgres-bootstrap-provenance",
            "gate_id": "gate-live-postgres-facades",
            "lane": "facades",
            "postgres": {
              "image": "postgres:16",
              "server_version": "${server_version}",
              "database": "oyatie",
              "host": "127.0.0.1",
              "port": 5432
            },
            "roles": [
              {"name": "postgres", "purpose": "admin bootstrap superuser; DSN/password redacted"},
              {"name": "oya_app", "purpose": "non-superuser NOBYPASSRLS app login; DSN/password redacted"},
              {"name": "tenancy_lifecycle_runtime", "purpose": "tenancy runtime role granted to oya_app"},
              {"name": "identity_scim_runtime", "purpose": "SCIM runtime role granted to oya_app"}
            ],
            "migrations": [
              "tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql",
              "tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql",
              "iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql",
              "iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql"
            ],
            "source_revision": "${GITHUB_SHA}",
            "retention_and_pii": {
              "retention_days": 30,
              "pii": "none; local CI database metadata and repo paths only",
              "secret_redaction": "admin/app DSNs, passwords, tenant secrets, idempotency keys, and tokens are not emitted"
            }
          }
          JSON
      - name: buck2 test — durable facades (live test = app-role, non-live = in-memory)
        env:
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: |
