# oya-ci-required — the SINGLE canonical blocking required status check (ONE CANONICAL CI).
#
# Authority: ADR-0515 (Phase-0 firewall + one-canonical-CI + cloud-native posture; Accepted
# 2026-06-07). Rulings: D-CICD-AUTHORITY, ONE CANONICAL CI, D-SEQUENCE (firewall-first),
# D-DOCTRINE (no false-green / surface-all).
#
# Design (per FIREWALL-GO-LIVE-RUNBOOK.md Part 2 + CICD-DESIGN-PLAN Stage 1A/1B): the gate
# lanes fan OUT (fail-fast:false, surface-all) and fan IN to ONE zero-build job named
# `oya-ci-required` that has NO command set of its own — it is green IFF every constituent
# gate lane is green. Branch protection keys on that one context name. The GH #983 PR
# metadata preflight is folded into the affected-set lane so it adds no new workflow shell surface.
#
# ░░ LIVE ░░
# Go-live executed 2026-06-08 (founder-authorized "fully autonomous through both"): the blocking
# triggers below are paired with making `oya-ci-required` the required status context on `dev`
# branch protection (FIREWALL-GO-LIVE-RUNBOOK Part 2). This is the SINGLE canonical required CI
# check — green IFF every constituent gate lane is green. workflow_dispatch retained for manual
# re-runs / verification.

name: oya-ci-required

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:

permissions:
  contents: read
  actions: read

# Surface-all: every gate lane runs to completion even if a sibling fails. The fan-in job
# collects the join. Matrix legs run one Buck2 target each, so a leg failure cannot hide a sibling.
# PR supersession is different: an older head SHA can never satisfy branch protection after a newer
# head exists, so keep only the newest run per PR. Push / merge_group / manual runs retain the full
# non-cancelling surface-all behavior for integration evidence. Group by workflow name instead of a
# repository-specific literal so the pattern remains reusable by the owned cloud-ci adapter.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Producer regen: materialize the cloud-ci generated faces from the checked-out candidate
  #    tree. Generated JSON is not a contributor merge surface; the CI/controller workspace
  #    regenerates it before gates consume it, then uploads it both as evidence AND as the
  #    faces source the mere-reader gate matrix legs download (ADR-0556 D5 QW-1).
  producer-regen:
    name: producer-regen (accounting-registry)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      - name: Materialize cloud-ci generated faces
        run: rustup toolchain install && rustc --version && buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
      - name: Upload regenerated faces
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accounting-faces
          # Two upload roots -> the artifact is rooted at their least common ancestor
          # (cloud/cloud-ci/gates/): the regenerated accounting faces PLUS the untracked
          # volatile scm snapshot (ADR-0552) the staleness-reaper leg ages rows from. The
          # mere-reader gate matrix legs download this artifact instead of re-materializing
          # per leg (ADR-0556 D5 QW-1, gate-fleet-shared-graph same-run trusted reuse).
          # Deliberately NOT uploaded: the firewall's merge-base frozen baseline — its
          # materialization is per-job by design (ADR-0551 frozen-policy-wins) and must
          # never become a shareable artifact.
          path: |
            cloud/cloud-ci/gates/oya-cloud-ci-accounting-registry-app/*.generated.json
            cloud/cloud-ci/gates/oya-cloud-ci-scm-facts-emitter-app/scm-volatile-facts.generated.json
          if-no-files-found: error

  # ── GATE LANES (reusable matrix). Every homogeneous gate is the SAME step — one
  #    `buck2 test //cloud/cloud-ci/gates/<crate>:{<crate>-unittest,<crate>-gate}` — so instead of copy-pasting a job per gate, a single
  #    matrixed `gate` job fans out over the crate list. Adding a homogeneous gate is ONE line in the matrix
  #    below; the `gate_registration` meta-test (in the cloud-ci-firewall lane) ENFORCES that
  #    every in-tree gate crate is listed here, every oya-ci.toml accounting/firewall gate has
  #    bundled disposition DATA, and every gate lane is a fan-in dependency. Each matrix leg is its own check-run
  #    `gate (oya-cloud-ci-<x>-app)`, preserving per-gate attribution; legs with a live-corpus
  #    self-test are born-blocking. `fail-fast: false` = surface-all (every leg runs to
  #    completion even if a sibling fails).
  #    (Deliberately a matrix, NOT a `workflow_call` reusable workflow: a called workflow would
  #    rename the published check-runs [`<caller> / <job>`], breaking the `oya-ci-required`
  #    branch-protection context. A future owned oya-ci runner can reuse this matrix verbatim —
  #    "one logic, two runners", D-CICD-AUTHORITY.)
  #
  #    FACES VIA ARTIFACT (ADR-0556 D5 QW-1, gate-fleet-shared-graph warm-safe same-run reuse):
  #    every leg here is a MERE READER of the generated faces — none re-verifies regeneration
  #    itself, so each leg downloads the producer-regen artifact instead of paying its own
  #    materialize step (the audit-measured ~45-55s/leg hub rebuild, 16x per run).
  #    Same-run, same candidate tree, same trusted writer — no cross-run cache participation.
  #    The regeneration-checking gates KEEP materializing independently: registry-drift (the
  #    byte-parity detector — detectors never consume the thing they attest), producer-regen
  #    itself, and cloud-ci-firewall (its merge-base frozen baseline is per-job by design,
  #    ADR-0551). `needs: producer-regen` serializes these legs behind a ~75s producer job;
  #    the workflow critical path (affected-set/buck2 lanes) is unaffected. If producer-regen
  #    fails, legs are skipped and the fan-in goes RED (fail-closed, same join as today).
  #    `fetch-depth: 0` retained conservatively: no matrix gate calls git (verified — faces
  #    carry all history-derived data per ADR-0552), but shallowing the checkout is a separate
  #    reviewed change, not a side effect of artifact reuse.
  gate:
    needs: producer-regen
    # Descriptive per-leg check-run name (matrix.label) — each leg publishes as
    # "gate · <discipline>", not a bare "gate (crate)". Adding a gate = one `include` line
    # (crate + label); the gate_registration meta-test enforces every gate crate is listed.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: oya-cloud-ci-cross-artifact-agreement-app, label: "gate · cross-artifact-agreement (GATE-1)" }
          - { crate: oya-cloud-ci-total-accounting-app,         label: "gate · total-accounting (GATE-2)" }
          - { crate: oya-cloud-ci-staleness-reaper-app,         label: "gate · staleness-reaper (GATE-3, born-blocking)" }
          - { crate: oya-cloud-ci-automation-ratchet-app,       label: "gate · automation-ratchet (GATE-4, polices gates)" }
          - { crate: oya-cloud-ci-bnf-layer-suffix-app,         label: "gate · bnf-layer-suffix (BNF §2.5#4, born-blocking)" }
          - { crate: oya-cloud-ci-manifest-hygiene-app,         label: "gate · manifest-hygiene (§2.5#7, born-blocking)" }
          - { crate: oya-cloud-ci-cargo-prefix-app,            label: "gate · cargo-prefix (ADR-0017)" }
          - { crate: oya-cloud-ci-slo-coverage-app,            label: "gate · slo-coverage (catalog SLO input contract, born-blocking)" }
          - { crate: oya-cloud-ci-catalog-liveness-app,        label: "gate · catalog-liveness (PR-C3 founder live-OR-explicitly-marked policy, born-blocking, EMPTY frozen baseline)" }
          - { crate: oya-cloud-ci-workspace-glob-coverage-app, label: "gate: workspace-glob-coverage (ADR-0538)" }
          - { crate: oya-cloud-ci-target-parity-app,           label: "gate · target-parity (ADR-0540, test-wiring false-green)" }
          - { crate: oya-cloud-ci-enforcement-liveness-app,    label: "gate · enforcement-liveness (FRIC-012, hook mirror liveness)" }
          - { crate: oya-cloud-ci-friction-accounting-app,     label: "gate · friction-accounting (ADR-0544, closed-loop friction-ledger accounting)" }
          - { crate: oya-cloud-ci-canonical-json-app,          label: "gate · canonical-json (ADR-0546, deterministic JSON serialization)" }
          - { crate: oya-cloud-ci-hyperscaler-parity-taxonomy-app, label: "gate · hyperscaler-parity-taxonomy (cloud hyperscaler parity taxonomy, born-blocking)" }
          - { crate: oya-cloud-ci-embedded-asset-hermeticity-app, label: "gate · embedded-asset-hermeticity (ADR-0545, include_str!/include_bytes! __srcs-tree mapping)" }
          - { crate: oya-cloud-ci-kernel-purity-app,           label: "gate · kernel-purity (ADR-0547, *-kernel/*-core zero transient-tech deps)" }
          - { crate: oya-cloud-ci-crypto-backend-purity-app,   label: "gate · crypto-backend-purity (ADR-0506, ring forbidden / aws-lc-rs mandated — zero ring activation)" }
          - { crate: oya-cloud-ci-no-graphql-without-adr-app,  label: "gate · no-graphql-without-adr (ADR-0565, zero-GraphQL: no graphql lib / .graphql/.gql/.sdl reintroduction without a reversing ADR — candidate-tree evaluated, EMPTY frozen baseline)" }
          - { crate: oya-cloud-ci-authz-coverage-app,          label: "gate · authz-coverage (issue #770 / AUTH-005, NEW unauthenticated HTTP control planes blocked vs frozen baseline)" }
          - { crate: oya-cloud-ci-dto-authz-trust-app,         label: "gate · dto-authz-trust (ADR-0582, the CLASS-FIX for caller-supplied-authz-trust: a NEW fn that trusts a forged *Authorization DTO / x-authorization-* header in place of a server-side PDP decide() is blocked vs the frozen baseline of ~92 known instances; v2: FN-01/02/03/04/05/06 hardened)" }
          - { crate: oya-cloud-ci-generated-artifact-control-plane-app, label: "gate · generated-artifact-control-plane (public hermetic CI artifact policy)" }
          - { crate: oya-cloud-ci-cache-wiring-app,            label: "gate · cache-wiring conformance (ADR-0560/ADR-0556, dark-wiring + cold floor + kill-switch)" }
          - { crate: oya-cloud-ci-substrate-dependency-dag-acyclicity-app, label: "gate · substrate-dependency-dag-acyclicity (ADR-0280 §D-3, Tarjan SCC + Kahn topo-order + forbidden-edge honouring)" }
          - { crate: oya-cloud-ci-tier-field-coverage-app,     label: "gate · tier-field-coverage (Phase-0 reorg ADR-0562/0536/0245, per-service tier/tier_subtype/dr_tier coverage + enum validity + no type-overload, born-blocking)" }
          - { crate: oya-cloud-ci-tier-dependency-acyclicity-app, label: "gate · tier-dependency-acyclicity (Phase-0 reorg ADR-0245/0280/0562, cargo+buck crate-graph tier rules + S-rank + Tarjan cycle backstop, born-ADVISORY vs frozen baseline → enforce-no-regression)" }
          - { crate: oya-cloud-ci-capability-membership-app,   label: "gate · capability-membership (Phase-0 reorg ADR-0562 §6, the anti-junk-drawer MEMBERSHIP lint: every crate → exactly one registered capability/meta home, no NEW unmapped crate, no NEW top-level dir, base/-admission; born-advisory + enforce-no-regression vs the frozen unmapped baseline)" }
          - { crate: oya-cloud-ci-runner-disk-reclaim-app,     label: "gate · runner-disk-reclaim conformance (FRIC-017 productization, ADR-0548 pipeline-as-product: policy parse + threshold/INFRA-RED discrimination + reclaim plan)" }
          - { crate: oya-cloud-ci-port-placement-app,          label: "gate · port-placement (ADR-0570, clean-arch ports-in-core: no storage-port trait DEFINED in an */adapters/* crate — productizes the #116 defect class; born-advisory + enforce-no-regression vs frozen baseline)" }
          - { crate: oya-cloud-ci-root-workspace-hygiene-app,  label: "gate · root-workspace-hygiene (ADR-0600, allowlist-as-DATA default-DENY: every TRACKED repo-root file must match the allowlist + every top-level dir must be a permitted capability/meta home — makes committed root scratch structurally impossible; complements the scratch DENYLIST)" }
          - { crate: oya-cloud-ci-dependency-automation-app, label: "gate · dependency-automation (ADR-0535, owned oya-deps.toml Rust bump-bot contract; external bot configs remain absent)" }
          - { crate: oya-cloud-ci-supply-chain-audit-app,    label: "gate · supply-chain-audit (owned RustSec advisory scan over vendored mirror, born-blocking)" }
          - { crate: oya-cloud-ci-planned-maturity-app, label: "gate · planned-maturity (GH #992, product PRD acceptance/verification contracts + rich capability records + retired-plan provenance boundary)" }
          - { crate: oya-cloud-ci-operator-secret-bootstrap-app, label: "gate · operator-secret-bootstrap (GH #980 + GH #988 / ADR-0606, least-privilege secret RBAC, declarative join-token bootstrap, ESO/OpenBao role+namespace+prefix scope, and plaintext OpenBao NetworkPolicy isolation)" }
          - { crate: oya-cloud-ci-cedar-deploy-parity-app, label: "gate · cedar-deploy-parity (GH #16 / ADR-0608, deployed-vs-authored Cedar parity: no deployed ConfigMap permit may leave the action unconstrained (action-agnostic blanket grant) and every deployed permit MUST be ⊆ the capability's authored <cap>/{policy,cedar}/*.cedar set; fail-closed on missing-authored/un-extractable/empty-scan; GH #16 byte-identical blanket ConfigMaps grandfathered in a documented shrink-only baseline pending the blanket-disarm follow-up)" }
          - { crate: oya-cloud-ci-cell-topology-manifest-contract-app, label: "gate · cell-topology-manifest-contract (CELL-001R manifest contract)" }
          - { crate: oya-cloud-ci-rust-first-automation-hygiene-app, label: "gate · rust-first automation hygiene (cloud-native infra anti-patterns: scripts, workflow shell, retired interpreters, and new CLI packages)" }
          - { crate: oya-cloud-ci-gate-self-conformance-app, label: "gate · gate-self-conformance (GH #777, pipeline-as-product 7-property bar over every gate)" }
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      # Consume the producer-regen artifact (faces + volatile scm snapshot) instead of
      # re-materializing per leg — see the FACES VIA ARTIFACT note on this job. The download
      # restores the same regenerated bytes the producer derived from this run's candidate
      # tree; registry-drift separately proves that derivation is byte-deterministic.
      - name: Download regenerated faces (producer-regen artifact, ADR-0556 D5 QW-1)
        # actions/download-artifact@v8.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accounting-faces
          path: cloud/cloud-ci/gates
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Buck2/rustc still use the pinned workspace toolchain + components; provision it before
      # the test action starts to avoid concurrent rustup writes inside parallel Buck2 actions.
      - name: Pre-provision pinned Rust toolchain for Buck2 gate tests
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: buck2 test ${{ matrix.crate }}
        run: |
          set -euo pipefail
          buck2 test \
            //cloud/cloud-ci/gates/${{ matrix.crate }}:${{ matrix.crate }}-unittest \
            //cloud/cloud-ci/gates/${{ matrix.crate }}:${{ matrix.crate }}-gate

  # ── freshness: first-diagnosis gate for the two stale-output failures from PR #662.
  #    Runs as its own fast job with no needs edge so stale Cargo.lock and stale generated faces
  #    surface together before the broader Buck2 lanes spend a full matrix round-trip.
  gate-freshness:
    name: freshness (lock + generated faces, ADR-0539)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4: the toolchain is a
      # version-pinned input, not a build output). rustup still resolves/validates the
      # toolchain on every run; the cache only pre-seeds ~/.rustup so the install is a no-op.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 freshness binaries
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: Run freshness gate
        run: |
          set -euo pipefail
          freshness_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-freshness-app-bin --show-output | awk '{print $2}')"
          "${freshness_bin}" --repo-root .

  # ── registry-drift: materialized workspace == regenerated byte-equal. Starts at t=0 alongside
  #    producer-regen; it rematerializes in-job so it is hermetic and self-contained. The
  #    producer-regen needs-edge was cosmetic (evidence only, nothing consumed) and serialized
  #    this job unnecessarily — removed so it starts at t=0.
  gate-registry-drift:
    name: registry-drift (materialized == regenerated)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # HERMETICITY CONTRACT (ADR-0556 D5 QW-1 deliberate exception): this gate IS the
      # byte-parity detector (committed == regenerated), so it MUST regenerate in-job —
      # feeding it the producer-regen artifact it is supposed to verify would make the
      # check self-referential. Detectors never consume the thing they attest.
      - name: Materialize faces then assert byte-parity
        run: |
          rustup toolchain install
          rustc --version
          buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
          buck2 test //cloud/cloud-ci/gates/registry-drift:registry-drift-gate

  # ── cloud-ci-firewall: the baseline ratchet (blocks only NEW debt) + the gate-registration
  #    meta-test (no in-tree gate may go unregistered in this workflow). This is the surface-all
  #    runner; per the runbook the existing firewall runner suffices — no separate aggregator bin
  #    is required for PRE-work.
  gate-cloud-ci-firewall:
    name: cloud-ci-firewall (baseline ratchet + gate-registration meta-test)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # HERMETICITY CONTRACT (ADR-0551 frozen-policy-wins): the firewall's frozen reference —
      # the merge-base baseline snapshot — is materialized per-job BY DESIGN via the emitter's
      # out-of-band bootstrap ref, and is deliberately absent from the producer-regen artifact.
      # This lane therefore KEEPS its own materialization (ADR-0556 D5 cold-must-stay list);
      # it is never converted to artifact reuse.
      - name: Materialize cloud-ci generated faces
        run: rustup toolchain install && rustc --version && buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
      - name: buck2 test cloud-ci-firewall
        run: |
          set -euo pipefail
          buck2 test \
            //cloud/cloud-ci/gates/oya-cloud-ci-firewall-app:oya-cloud-ci-firewall-app-unittest \
            //cloud/cloud-ci/gates/oya-cloud-ci-firewall-app:oya-cloud-ci-firewall-signoff-fixer-unittest \
            //cloud/cloud-ci/gates/oya-cloud-ci-firewall-app:oya-cloud-ci-firewall-app-gate \
            //cloud/cloud-ci/gates/oya-cloud-ci-firewall-app:oya-cloud-ci-firewall-app-gate-registration \
            //cloud/cloud-ci/gates/oya-cloud-ci-firewall-app:oya-cloud-ci-firewall-app-run-observability-packet

  # ── GENERATED OUTPUT DIFF POLICY. Generated files may be deleted to retire a tracked output,
  #    but PRs must not add/modify generated outputs as merge surfaces. Classification comes from
  #    registry/generated-artifact-control-plane.json `generated_path_rules` so adopters can encode
  #    their generated-output conventions once; .gitignore is preventive hygiene, not policy
  #    authority. The candidate workspace is regenerated by cloud-ci before gates consume it.
  generated-output-diff-policy:
    name: generated-output-diff-policy (no generated merge surfaces)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 policy binary
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: Reject non-deletion generated output edits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "generated-output-diff-policy: push event; presubmit diff policy not applicable."
            exit 0
          fi
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          policy_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-generated-artifact-control-plane-app:oya-cloud-ci-generated-output-diff-policy --show-output | awk '{print $2}')"
          git diff --name-status "origin/${BASE_REF}"...HEAD \
            | "${policy_bin}" --manifest registry/generated-artifact-control-plane.json

  # ── HERMETIC BUCK2 LANE (OYA-CI-HERMETIC-EXECUTION-DESIGN §3 + Stage P1/P2). Runs the SAME
  #    gate logic through buck2: `buck2 build` compiles every
  #    target (the env!CARGO eradication) and `buck2 test` runs the gate rust_tests fully
  #    hermetically (no ambient git in any action — the producer reads the materialized scm-facts
  #    face; the scm-facts emitter is the single out-of-graph boundary, run in the
  #    materialization step BELOW, never inside a cacheable action). Scoped by the
  #    affected-set driver (`infra/ci/buck2-affected-gate.sh`: uquery owner -> rdeps closure,
  #    FAILS CLOSED) for speed. RBE/NativeLink is staged LAST (D4) and NOT required for
  #    hermeticity — local-on-runner execution via the wired `noop_test_toolchain` is sufficient
  #    here. This lane feeds the same fan-in as the targeted Buck2 gate matrix above.
  buck2:
    name: buck2 (hermetic build + affected gate tests)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the materialization step below runs the emitter, which derives
          # last_touch via `git log --name-only`; a shallow checkout collapses it (PM1).
          fetch-depth: 0
      # buck2 is the BUILD TOOL, installed as a prebuilt release.
      # The adapter edge is immutable at CI time: release tag selects the asset, SHA-256 pins
      # the bytes, and CI verifies the digest before decompression/execution. Bump together.
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # Pre-provision the pinned rust toolchain ONCE, serially, before the buck2 build.
      # The buck2 rust toolchain (toolchains/BUCK: system_rust_toolchain via the rustup shim)
      # resolves rustc and toolchain components per compile action, and buck2 runs those actions in
      # PARALLEL. On a cold runner each action's first shim call triggers rustup to install the
      # rust-toolchain.toml channel (+ rustfmt,clippy) concurrently — the racing rustup
      # processes collide on the shared `~/.rustup/downloads/*.partial` files and fail with
      # `rustup::utils::rename ... No such file or directory (os error 2)` (a different component
      # each run: clippy, then a second toolchain component — proving a concurrency race, not a config defect). rustup
      # is not concurrency-safe. Installing the toolchain once here makes it ambient so the
      # parallel actions find it already present (no download).
      - name: Pre-provision pinned rust toolchain (serialize rustup before parallel buck2)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      # Restore buck-out across runs so ephemeral runners start warm (design §3.1 / ADR-0515 D4).
      #
      # WHAT IS WARMED, PRECISELY (ADR-0554 D9, round-5): 100% of buck2 cross-run warmth lives in
      # ./buck-out — buck-out/v2/cache/{materializer_state,incremental_state}/db.sqlite plus
      # buck-out/v2/art (the materialized action outputs). buck-out is PATH-RELOCATABLE (relative
      # paths + --remap-cwd-prefix=., no absolute project root baked in; a restored hit is keyed
      # only on buck2_revision + os + arch), so restoring it into any runner checkout is sound.
      # ~/.buck2 and ~/.buck hold ONLY daemon pid/endpoint/log scratch — ZERO action results — so
      # caching `path: buck-out` warms everything cacheable and ~/.buck2/~/.buck is DELIBERATELY
      # NOT cached (caching daemon scratch warms nothing; do not copy-paste global-state caching).
      #
      # SAVE/RESTORE SPLIT (ADR-0554 D9; specs/cache-warmth-policy.json postmerge-dev-trunk = sole
      # writer, presubmit-trusted-affected-cone = reader). dev-push is the SOLE canonical writer via
      # the gate-affected-set job's SAVE step (see below): that job builds the FULL //... graph on
      # push, so the saved buck-out is the full-graph superset. This buck2 job is READ-ONLY on every
      # trigger — it restores the full-graph buck-out and its //cloud/cloud-ci/... build is a subset
      # hit. PRs never write, eliminating the per-commit multi-GB write-churn/eviction (the
      # Bazel/Google post-merge-fills-the-cache pattern).
      #
      # Cache key is STABLE per dependency/toolchain-set (.buckconfig + toolchains/BUCK +
      # Cargo.lock + rust-toolchain.toml),
      # NOT per-commit. The previous `-${{ github.sha }}` suffix made the primary key unique
      # every commit, so actions/cache SAVED a fresh full buck-out (multi-GB) on EVERY run and
      # never hit the primary key — bloating the 10GB repo cache into constant LRU eviction and
      # exhausting ephemeral-runner disk at the save step (the "No space left on device" failure,
      # FRIC-017). A stable key saves once per dependency-set and restores it exactly: deterministic
      # warm start, no per-commit bloat. Changed crates still rebuild (buck2 is content-addressed,
      # so a restored hit is bit-identical to a cold build); only a Cargo.lock/toolchain/.buckconfig
      # or Rust channel change mints a new entry. The restore prefix is scoped by
      # rust-toolchain.toml so a Rust-version bump never reuses old rlibs into the new compiler.
      # Interim warm-by-default until the shared content-addressed
      # remote cache (NativeLink/CAS, ADR-0560, HANDOFF W3) lands with a cold-canary integrity job
      # proving cold==warm. See friction-ledger buck2-no-shared-cache.
      # Reclaim preinstalled ubuntu-latest bloat (.NET/Android/GHC/CodeQL/preloaded Docker images:
      # ~25-30 GiB) BEFORE the multi-GB buck-out restore. This lane decompresses a ~5.78 GiB buck-out
      # blob (~12-15 GiB on disk) on top of a fetch-depth:0 monorepo checkout, exhausting the ~14 GiB
      # free on / on GitHub-hosted ubuntu-latest; FRIC-017 recurred on PR #741 (No space left on device
      # at this restore, before any build ran). Hermetic: removes only vendor preinstall dirs that no
      # oya/buck2 action consumes; touches NO repo content and NO cache (buck-out / ~/.rustup / the
      # restored blob untouched), so the cold==warm integrity canary (ADR-0556/0560) is unaffected. df
      # is emitted so a genuine disk-NEED growth surfaces as a true RED instead of being masked.
      - name: Reclaim runner disk before warm restore (FRIC-017 preflight)
        # Rust-first, data-driven preflight (ADR-0548 pipeline-as-product): retires the two
        # duplicated inline `sudo rm -rf` blocks. The policy (reclaim_dirs + min_free_gib_after)
        # lives in runner-disk-reclaim-policy.json; the bin best-effort removes the profile's
        # vendor preinstall dirs and logs structured disk-before/after plus a JSON operator
        # artifact. Policy is explicit fail-closed: threshold-miss exits INFRA-RED unless a future
        # caller supplies a typed fail-open waiver, so the required context cannot silently green on
        # insufficient runner capacity. Built as the runner user (buck2 on user PATH; daemon must
        # not run as root); only the prebuilt binary is sudo'd (needs root for root-owned dirs).
        run: |
          # Build as the runner user (buck2 on user PATH; never run buck2 daemon as root —
          # that corrupts cache/daemon ownership). Then sudo ONLY the prebuilt binary (needs
          # root solely to remove the root-owned vendor preinstall dirs).
          BIN="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-runner-disk-reclaim-app:oya-cloud-ci-runner-disk-reclaim-bin --show-output 2>/dev/null | awk '{print $2}')"
          sudo -E "$BIN" \
            --profile github-hosted-ubuntu-latest \
            --infra-red-policy fail-closed \
            --artifact-out "${RUNNER_TEMP}/runner-disk-reclaim-buck2.json"
      - name: Restore buck-out (read-only; dev-push is the sole writer)
        # actions/cache/restore@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}
          restore-keys: |
            buck-out-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # Generated-face materialization — the SINGLE out-of-graph git boundary. Re-run the emitter
      # and producer against the checked-out candidate tree, then let buck2 consume those files as
      # declared inputs. We deliberately do NOT byte-compare against committed JSON here: that was
      # the self-referential merge-conflict surface. Byte-parity is checked after materialization.
      # KEEPS materializing (not converted to ADR-0556 D5 QW-1 artifact reuse): the hermetic
      # graph's gate tests consume the firewall's merge-base frozen baseline, which is per-job
      # by design (ADR-0551) and deliberately absent from the producer-regen artifact; this
      # step is the sanctioned boundary that feeds ALL declared generated inputs to the graph.
      - name: Materialize cloud-ci generated faces (out-of-graph boundary)
        run: buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
      # The hermetic gate: buck2 BUILDS every cloud-ci target (proves the env!CARGO eradication —
      # these targets could not compile under buck2 before) and TESTS them (the gate rust_tests
      # run green, fully hermetic, with verdicts identical to the targeted gate matrix). This is the
      # refactor's scope and is the binding hermetic check for this stage.
      #
      # The repo-wide affected-set verdict is owned by the binding gate-affected-set job below.
      # Do not run a duplicate best-effort affected-set probe here: a non-blocking BUILD FAILED
      # line inside a green job is indistinguishable from a false-green to humans and agents.
      - name: buck2 build + test (//cloud/cloud-ci/..., hermetic — binding)
        run: |
          set -euo pipefail
          # buck2 test builds its targets before running them, so a standalone
          # `buck2 build` immediately before is redundant — removed (item 4 quick win).
          # --unstable-write-invocation-record is additive observability only: it
          # writes buck2's structured run record (cache_hit_rate, run_* counters)
          # for the telemetry step below and changes nothing about the build.
          buck2 test //cloud/cloud-ci/... --unstable-write-invocation-record /tmp/buck2-lane-invocation-record.json
      # Per-lane cache-hit telemetry + warm-mode guard (ADR-0560; the audit's missing-SLO item):
      # structured counters from buck2's invocation record — never log-grep — labeled with this
      # lane's ADR-0556 build class. The report is now binding for record-shape / warm-mode
      # sanity: once owned cloud-ci flips this lane from `bypass` to warm-ro/rw, a 0%-hit run or
      # missing cache counters is an INFRA-RED misconfiguration, not advisory noise. Today GitHub
      # Actions remains the transitional adapter and this lane stays bypass while NativeLink is dark.
      - name: Cache-hit telemetry + warm-mode guard (ADR-0560)
        if: always()
        run: |
          set -euo pipefail
          CACHE_MODE=bypass
          buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-cache-wiring-app:oya-cloud-ci-cache-wiring-bin -- report --record /tmp/buck2-lane-invocation-record.json --build-class gate-fleet-shared-graph --mode "${CACHE_MODE}" --out /tmp/cache-hit-report.json
          cat /tmp/cache-hit-report.json
          buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-cache-wiring-app:oya-cloud-ci-cache-wiring-bin -- assert-warm --record /tmp/buck2-lane-invocation-record.json --build-class gate-fleet-shared-graph --mode "${CACHE_MODE}"
      - name: Upload cache-hit telemetry artifact
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-hit-report-buck2-lane
          path: /tmp/cache-hit-report.json
          if-no-files-found: error
      - name: Upload runner disk reclaim operator artifact (buck2 lane)
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-disk-reclaim-buck2
          path: ${{ runner.temp }}/runner-disk-reclaim-buck2.json
          retention-days: 30
          if-no-files-found: warn
  # ── BINDING WORKSPACE COVERAGE (ADR-0554, FRIC-1781310000). Closes the largest false-green
  #    channel: the buck2 lane above is scoped to //cloud/cloud-ci/..., so code anywhere else
  #    (oya/*, libs/*, cloud/* services) could merge broken — proven live by PR #651 head
  #    cf16525 (E0433 x3 in oya/identity, buck2 lane green, run 27288019517) and by
  #    //oya/ci-webhook-gateway carrying an E0428 on dev itself. This lane is the BINDING
  #    Rust successor of the advisory infra/ci/buck2-affected-gate.sh step (G011): on
  #    pull_request it derives the merge-base diff's owner()/rdeps() cone and builds+tests it;
  #    any derivation uncertainty or escape-trigger path class (BUCK macros, toolchains,
  #    third-party, .buckconfig) escalates FAIL-CLOSED to the full workspace — never skips.
  #    On merge_group/push/dispatch it runs the full workspace (ADR-0515 Tide admission tier).
  #    On a PR, the FULL tier is a BUILD-HEALTH RATCHET (ADR-0554 round-3; ADR-0551 merge-base
  #    frozen pattern): it grandfathers targets already failing at the merge-base and blocks only
  #    REGRESSIONS, so a BUCK-touching PR is not held hostage to pre-existing dev build debt (no
  #    flag-day requirement). Pack-shaped per ADR-0548 R0: all repo facts live in affected-set-policy.json.
  gate-affected-set:
    name: "gate · affected-set (ADR-0554, binding workspace coverage)"
    runs-on: ubuntu-latest
    # SAFETY RAIL (ADR-0554 D7): bound the cold full-workspace rebuild so a runaway/exhaustion
    # (a wedged buck2 action, a non-terminating compile) cannot burn the runner indefinitely.
    # Derivation: ≈4x the ADR-0554-measured warm full run (4m35s cold / 5m45s incl. tests, lines
    # 56-58) — fires only on a genuine runaway, never on a healthy cold build.
    timeout-minutes: 45
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the merge-base diff anchor + the materialization boundary both
          # derive from git history; a shallow checkout collapses them (PM1).
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # Same rustup serialization rationale as the buck2 lane above: parallel buck2 actions
      # racing a cold rustup install collide on shared download state.
      - name: Pre-provision pinned rust toolchain and PR metadata preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            body_path="${RUNNER_TEMP}/pull-request-body.md"
            printf '%s\n' "${PR_BODY}" > "${body_path}"
            buck2 run //libs/oya-check-pr-traceability:pr-traceability-admission-bin -- \
              --pr-title "${PR_TITLE}" \
              --pr-body "${body_path}" \
              --require-code-review
          fi
      # Restore buck-out read-only (ADR-0554 D9). Same stable per-dependency/toolchain-set key as the buck2
      # lane: warmth is 100% in buck-out/v2/cache + buck-out/v2/art (path-relocatable); ~/.buck2
      # and ~/.buck are daemon pid/endpoint/log scratch and are deliberately NOT cached. dev-push
      # is the sole writer (the save step below is push-to-dev-gated), so PR runs read only — no
      # per-commit multi-GB write-churn/eviction (see the buck2-lane rationale above).
      # Reclaim preinstalled ubuntu-latest bloat (.NET/Android/GHC/CodeQL/preloaded Docker images:
      # ~25-30 GiB) BEFORE the multi-GB buck-out restore. This lane decompresses a ~5.78 GiB buck-out
      # blob (~12-15 GiB on disk) on top of a fetch-depth:0 monorepo checkout, exhausting the ~14 GiB
      # free on / on GitHub-hosted ubuntu-latest; FRIC-017 recurred on PR #741 (No space left on device
      # at this restore, before any build ran). Hermetic: removes only vendor preinstall dirs that no
      # oya/buck2 action consumes; touches NO repo content and NO cache (buck-out / ~/.rustup / the
      # restored blob untouched), so the cold==warm integrity canary (ADR-0556/0560) is unaffected. df
      # is emitted so a genuine disk-NEED growth surfaces as a true RED instead of being masked.
      - name: Reclaim runner disk before warm restore (FRIC-017 preflight)
        # Rust-first, data-driven preflight (ADR-0548 pipeline-as-product): retires the two
        # duplicated inline `sudo rm -rf` blocks. The policy (reclaim_dirs + min_free_gib_after)
        # lives in runner-disk-reclaim-policy.json; the bin best-effort removes the profile's
        # vendor preinstall dirs and logs structured disk-before/after plus a JSON operator
        # artifact. Policy is explicit fail-closed: threshold-miss exits INFRA-RED unless a future
        # caller supplies a typed fail-open waiver, so the required context cannot silently green on
        # insufficient runner capacity. Built as the runner user (buck2 on user PATH; daemon must
        # not run as root); only the prebuilt binary is sudo'd (needs root for root-owned dirs).
        run: |
          # Build as the runner user (buck2 on user PATH; never run buck2 daemon as root —
          # that corrupts cache/daemon ownership). Then sudo ONLY the prebuilt binary (needs
          # root solely to remove the root-owned vendor preinstall dirs).
          BIN="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-runner-disk-reclaim-app:oya-cloud-ci-runner-disk-reclaim-bin --show-output 2>/dev/null | awk '{print $2}')"
          sudo -E "$BIN" \
            --profile github-hosted-ubuntu-latest \
            --infra-red-policy fail-closed \
            --artifact-out "${RUNNER_TEMP}/runner-disk-reclaim-affected-set.json"
      - name: Restore buck-out (read-only; dev-push is the sole writer)
        # actions/cache/restore@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}
          restore-keys: |
            buck-out-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # KEEPS materializing (not converted to ADR-0556 D5 QW-1 artifact reuse): same rationale
      # as the buck2 lane — the cone's gate tests consume the per-job merge-base frozen
      # baseline (ADR-0551), and this lane's own build-health baseline below is per-job by
      # design (ADR-0554 round-3).
      - name: Materialize cloud-ci generated faces (out-of-graph boundary)
        run: buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
      - name: Fetch base ref for the merge-base anchor
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      # ── BUILD-HEALTH BASELINE (ADR-0554 D9 same-root build, round-5; ADR-0551 merge-base frozen
      #    pattern). On a pull_request, derive the affected-set plan FIRST. Most PRs stay in the
      #    affected cone and do not need a merge-base full-workspace build at all; only a derived
      #    FULL decision needs the MERGE-BASE build-health baseline used by the ratchet. When FULL
      #    is required, materialize that baseline IN THE MAIN ROOT so it shares the warm ./buck-out
      #    restored above (the merge-base IS a dev commit, so the dev-keyed buck-out is near-fully
      #    warm for it). We detach the SAME working tree to the merge-base COMMITTED tree-ish (the
      #    candidate working tree is removed from disk for the build), run the full keep-going
      #    build, capture per-target pass/fail, then a TRAP restores the candidate on EXIT. The
      #    affected-set FULL tier grandfathers targets already failing at the merge-base and blocks
      #    only REGRESSIONS. Skipped for push/merge_group/dispatch (the admission tier is a hard
      #    full build — no grandfathering).
      #
      #    ANTI-LAUNDERING (ADR-0554 D6, preserved): the baseline failure-set comes ENTIRELY from
      #    the merge-base COMMITTED tree (git object history — candidate-uncontrollable); during the
      #    baseline build the candidate working tree is GONE from disk, so it cannot feed the
      #    baseline; the report reaches the verdict ONLY via --baseline-report. The warm ./buck-out
      #    is a content-addressed substrate — a buck2 hit is bit-identical to a cold build (ADR-0556
      #    D1/D2) — so warmth changes only wall-clock, never the baseline SOURCE. Warm-eligible
      #    under ADR-0556 with no policy change (trusted-author, content-addressed; not the
      #    integrity-canary/release cold floor). GH #899 activates the trusted D8 consumer first:
      #    use an exact push-to-dev baseline artifact when provenance and schema validate, else
      #    fail closed to the same in-job merge-base rebuild below.
      - name: Materialize merge-base build-health baseline when affected-set needs FULL
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          orig_ref="$(git rev-parse HEAD)"
          candidate_toolchain="$(awk -F'"' '/channel/ {print $2; exit}' rust-toolchain.toml)"
          decision_log="${RUNNER_TEMP}/affected-set-derive.log"
          full_required_marker="${RUNNER_TEMP}/affected-set-full-required"
          echo "false" > "${full_required_marker}"
          gate_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app:oya-cloud-ci-affected-set-bin --show-output | awk '{print $2}')"
          echo "affected-set preflight: derive plan before merge-base baseline"
          "${gate_bin}" \
            --policy cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app/affected-set-policy.json \
            --base "origin/${BASE_REF}" --mode auto --derive-only \
            --decision-artifact-out "${RUNNER_TEMP}/affected-set-derive-decision.json" \
            | tee "${decision_log}"
          if grep -Eq '^affected-set: (decision=FULL|ESCALATE to FULL)' "${decision_log}"; then
            echo "true" > "${full_required_marker}"
            echo "affected-set preflight: FULL decision requires merge-base build-health baseline"
          else
            echo "affected-set preflight: derived non-FULL decision; skipping merge-base baseline"
            exit 0
          fi
          echo "build-health baseline: merge-base=${merge_base} candidate=${orig_ref}"
          artifact_name="build-health-baseline-${merge_base}"
          echo "build-health baseline: attempting trusted dev-push artifact ${artifact_name}"
          try_trusted_baseline_artifact() {
            if ! command -v gh >/dev/null 2>&1; then
              echo "build-health baseline: gh unavailable; falling back to in-job merge-base rebuild"
              return 1
            fi
            local runs_json="${RUNNER_TEMP}/build-health-trusted-runs.json"
            local artifacts_json="${RUNNER_TEMP}/build-health-trusted-artifacts.json"
            local trusted_zip="${RUNNER_TEMP}/build-health-trusted.zip"
            local trusted_dir="${RUNNER_TEMP}/build-health-trusted"
            local trusted_report="${trusted_dir}/build-health-admission-report.json"

            gh api --method GET -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/oya-ci-required.yml/runs" \
              -f branch=dev -f event=push -f status=success -F per_page=50 > "${runs_json}" \
              || { echo "build-health baseline: trusted run lookup failed; falling back to in-job rebuild"; return 1; }

            local run_id
            run_id="$(python3 - "${runs_json}" "${merge_base}" <<'PY'
          import json
          import sys

          path, merge_base = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)
          for run in payload.get("workflow_runs", []):
              if (
                  run.get("head_sha") == merge_base
                  and run.get("event") == "push"
                  and run.get("head_branch") == "dev"
                  and run.get("conclusion") == "success"
              ):
                  print(run["id"])
                  break
          PY
            )"
            if [ -z "${run_id}" ]; then
              echo "build-health baseline: no successful trusted push-to-dev run for ${merge_base}; falling back to in-job rebuild"
              return 1
            fi

            gh api --method GET -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              -F per_page=100 > "${artifacts_json}" \
              || { echo "build-health baseline: trusted artifact lookup failed; falling back to in-job rebuild"; return 1; }

            local artifact_id
            artifact_id="$(python3 - "${artifacts_json}" "${artifact_name}" <<'PY'
          import json
          import sys

          path, expected_name = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)
          for artifact in payload.get("artifacts", []):
              if artifact.get("name") == expected_name and not artifact.get("expired", True):
                  print(artifact["id"])
                  break
          PY
            )"
            if [ -z "${artifact_id}" ]; then
              echo "build-health baseline: no unexpired exact artifact ${artifact_name} on trusted run ${run_id}; falling back to in-job rebuild"
              return 1
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${trusted_zip}" \
              || { echo "build-health baseline: artifact download failed; falling back to in-job rebuild"; return 1; }
            rm -rf "${trusted_dir}"
            mkdir -p "${trusted_dir}"
            python3 -m zipfile -e "${trusted_zip}" "${trusted_dir}" \
              || { echo "build-health baseline: artifact unzip failed; falling back to in-job rebuild"; return 1; }

            if ! python3 - "${trusted_report}" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          if not os.path.getsize(path):
              raise SystemExit("empty report file")
          with open(path, encoding="utf-8") as fh:
              payload = json.load(fh)
          results = payload.get("results")
          if not isinstance(results, dict) or not results:
              raise SystemExit("missing or empty results object")
          PY
            then
              echo "build-health baseline: trusted artifact schema/emptiness invalid; falling back to in-job rebuild"
              return 1
            fi
            cp "${trusted_report}" "${RUNNER_TEMP}/build-health-baseline.json"
            echo "build-health baseline: trusted artifact hit run_id=${run_id} artifact_id=${artifact_id}"
            return 0
          }
          if try_trusted_baseline_artifact; then
            exit 0
          fi
          # ALWAYS restore the candidate tree on EXIT — a failed baseline build can never strand CI
          # on the merge-base tree (the subsequent Binding affected-set step runs on the candidate).
          # NOTE: if the timeout-minutes:45 rail SIGKILLs this build, the bash EXIT trap does NOT
          # fire (tree left detached at merge-base) — but a timeout fails the whole job RED → fan-in
          # RED, so it is fail-closed and never produces a wrong-baseline verdict.
          restore_candidate_tree() {
            local exit_status="$?"
            git checkout --quiet --detach "${orig_ref}" 2>/dev/null || git checkout --quiet "${orig_ref}"
            if [ "${candidate_toolchain}" != "${baseline_toolchain:-${candidate_toolchain}}" ]; then
              echo "build-health baseline: cleaning buck-out after restoring candidate toolchain ${candidate_toolchain}"
              buck2 clean
            fi
            exit "${exit_status}"
          }
          trap restore_candidate_tree EXIT
          # Detach the MAIN working tree to the merge-base COMMITTED tree-ish: the baseline is
          # computed from git object history (candidate-uncontrollable), and the candidate working
          # tree is removed from disk for the build, so a PR cannot grow its own baseline to
          # launder a regression.
          git checkout --quiet --detach "${merge_base}"
          baseline_toolchain="$(awk -F'"' '/channel/ {print $2; exit}' rust-toolchain.toml)"
          rustup toolchain install
          if [ "${candidate_toolchain}" != "${baseline_toolchain}" ]; then
            echo "build-health baseline: Rust toolchain changed ${baseline_toolchain} -> ${candidate_toolchain}; isolating buck-out"
            buck2 clean
          fi
          # Build the whole merge-base workspace keep-going. Same-channel PRs share warm ./buck-out;
          # Rust-channel bump PRs intentionally go cold on both sides to avoid mixed-rustc rlibs.
          # The build is EXPECTED to be non-zero (dev carries pre-existing breakage) — that is the
          # baseline, not a failure, so we never propagate its exit code.
          buck2 build //... --keep-going \
              --build-report "${RUNNER_TEMP}/build-health-baseline.json" || true
          test -s "${RUNNER_TEMP}/build-health-baseline.json" \
            || { echo "build-health: FATAL empty merge-base baseline report"; exit 1; }
      - name: Binding affected-set build + test (cone-binding; FULL tier = build-health ratchet)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          gate_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app:oya-cloud-ci-affected-set-bin --show-output | awk '{print $2}')"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # PR tier: auto (cone-binding, hard-fail on a NEW break in the changed cone); a FULL
            # escalation runs the build-health ratchet against the merge-base baseline. The
            # baseline is only materialized when the derive preflight proves FULL is needed.
            baseline_args=()
            if [ -f "${RUNNER_TEMP}/affected-set-full-required" ] \
                && grep -qx 'true' "${RUNNER_TEMP}/affected-set-full-required"; then
              test -s "${RUNNER_TEMP}/build-health-baseline.json" \
                || { echo "affected-set: FATAL missing baseline after FULL derive preflight"; exit 1; }
              baseline_args=(--baseline-report "${RUNNER_TEMP}/build-health-baseline.json")
            fi
            "${gate_bin}" \
              --policy cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app/affected-set-policy.json \
              --base "origin/${BASE_REF}" --mode auto \
              --decision-artifact-out "${RUNNER_TEMP}/affected-set-binding-decision.json" \
              "${baseline_args[@]}"
          else
            # Admission/integration tier (merge_group/push/dispatch): hard full build+test — the
            # integration tip MUST be green, no grandfathering. ADR-0554 D7: this run ALSO captures
            # a build-report at ${RUNNER_TEMP}/build-health-admission-report.json (the binary's
            # stable RUNNER_TEMP-anchored path) as a pure byproduct; the verdict is unchanged
            # (non-empty failure set = hard fail) and the report is uploaded below only on
            # trusted push-to-dev.
            "${gate_bin}" \
              --policy cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app/affected-set-policy.json \
              --base "origin/${BASE_REF}" --mode full \
              --decision-artifact-out "${RUNNER_TEMP}/affected-set-binding-decision.json"
          fi
      # ── FULL-GRAPH CACHE SAVE (ADR-0554 D9; sole canonical writer). On dev-push this job runs
      #    --mode full (buck2 build + test //...), so buck-out is populated with the FULL workspace
      #    graph — not just //cloud/cloud-ci/... as in the buck2 lane. Saving here means PR
      #    gate-affected-set restores a full-graph buck-out, so the same-root merge-base baseline
      #    build is near-fully-warm (the merge-base IS a recent dev commit whose full-graph buck-out
      #    was just saved). The buck2 lane restores the same key and is a subset hit. One save step,
      #    one job, one key — no two-writer race. Runs AFTER the Binding step (buck-out fully
      #    populated). Guarded push-to-dev so PRs remain read-only (restore-only via the step above).
      #    Size note: the full-graph buck-out is one blob per stable key (overwrites, non-accumulating
      #    due to dev-push-sole-writer), bounded by the dependency-set change cadence — worth watching
      #    against the GitHub 10GB cache limit; NativeLink CAS (ADR-0560) removes this at cutover.
      - name: Save buck-out (dev-push only; sole canonical full-graph writer)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        # actions/cache/save@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}
      # ── BUILD-HEALTH BASELINE PRODUCER (ADR-0554 D7; ADR-0556 D5 QW-1 trusted-producer +
      #    postmerge-dev-trunk warmth class). ONLY a trusted push-to-dev publishes the admission
      #    build-report as the merge-base-to-be baseline artifact — NOT merge_group, NOT
      #    pull_request — so the artifact namespace stays clean of attacker-controllable producers
      #    (part of the DEFERRED D8 consumer's anti-laundering defense; D8 trusts workflow_run
      #    PROVENANCE, never the artifact name). Producer-only: nothing consumes this yet, so it is
      #    sound + harmless (no merge-authority change, no new permissions). The artifact is on the
      #    critical path of BOTH the deferred D8 cross-run consumer AND the ADR-0560 warm-CAS.
      - name: Upload build-health baseline artifact (trusted push-to-dev producer)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-health-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/build-health-admission-report.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload affected-set operator artifacts
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: affected-set-operator-artifacts
          path: |
            ${{ runner.temp }}/runner-disk-reclaim-affected-set.json
            ${{ runner.temp }}/affected-set-derive-decision.json
            ${{ runner.temp }}/affected-set-binding-decision.json
          retention-days: 30
          if-no-files-found: warn

  # ── LIVE-POSTGRES DURABLE-SUBSTRATE LANES (#101/#901). Runs the env-gated
  #    cross-tenant-deny / RLS / CDC / SCIM durability integration tests against
  #    CONTAINERIZED Postgres and GATES merge. Both adapter and facade groups block
  #    the single required `oya-ci-required` context.
  #
  #    SPLIT SAFETY (#901): adapter and facade groups run in parallel only because
  #    each job owns an independent Postgres service container and repeats the
  #    deterministic bootstrap. Inside each group, `--num-threads 1` and sequential
  #    target invocations remain because the harnesses in that group still share a
  #    local database.
  gate-live-postgres-adapters:
    name: "gate-live-postgres-adapters (durable adapters: RLS / CDC / SCIM, #901)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OYA_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/oyatie
      OYA_PG_APP_URL: postgres://oya_app:app@127.0.0.1:5432/oyatie
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 live tests
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: Install postgresql-client for the bootstrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
      - name: Bootstrap app role + durable schemas/roles (admin, adapters)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          ADMIN_PSQL=(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='oya_app') THEN CREATE ROLE oya_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE; END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
          server_version="$("${ADMIN_PSQL[@]}" -Atqc "SHOW server_version;")"
          cat > "${RUNNER_TEMP}/live-postgres-adapters-bootstrap-provenance.json" <<JSON
          {
            "schema_version": 2,
            "artifact_type": "cloud_ci_operator_artifact",
            "artifact_id": "live-postgres-bootstrap-provenance",
            "gate_id": "gate-live-postgres-adapters",
            "lane": "adapters",
            "postgres": {
              "image": "postgres:16",
              "server_version": "${server_version}",
              "database": "oyatie",
              "host": "127.0.0.1",
              "port": 5432
            },
            "roles": [
              {"name": "postgres", "purpose": "admin bootstrap superuser; DSN/password redacted"},
              {"name": "oya_app", "purpose": "non-superuser NOBYPASSRLS app login; DSN/password redacted"},
              {"name": "tenancy_lifecycle_runtime", "purpose": "tenancy runtime role granted to oya_app"},
              {"name": "identity_scim_runtime", "purpose": "SCIM runtime role granted to oya_app"}
            ],
            "migrations": [
              "tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql",
              "tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql",
              "iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql",
              "iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql"
            ],
            "source_revision": "${GITHUB_SHA}",
            "retention_and_pii": {
              "retention_days": 30,
              "pii": "none; local CI database metadata and repo paths only",
              "secret_redaction": "admin/app DSNs, passwords, tenant secrets, idempotency keys, and tokens are not emitted"
            }
          }
          JSON
      - name: buck2 test — durable adapters (admin=superuser, app=app-role)
        env:
          OYA_DATA_LIVE_POSTGRES: "1"
          OYA_DATA_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_DATA_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_OUTBOX_LIVE_POSTGRES: "1"
          OYA_OUTBOX_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_OUTBOX_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: |
          set -euo pipefail
          LIVE_ENV=(
            --env RUST_TEST_THREADS=1
            --env OYA_DATA_LIVE_POSTGRES="${OYA_DATA_LIVE_POSTGRES}"
            --env OYA_DATA_POSTGRES_ADMIN_URL="${OYA_DATA_POSTGRES_ADMIN_URL}"
            --env OYA_DATA_POSTGRES_APP_URL="${OYA_DATA_POSTGRES_APP_URL}"
            --env OYA_OUTBOX_LIVE_POSTGRES="${OYA_OUTBOX_LIVE_POSTGRES}"
            --env OYA_OUTBOX_POSTGRES_ADMIN_URL="${OYA_OUTBOX_POSTGRES_ADMIN_URL}"
            --env OYA_OUTBOX_POSTGRES_APP_URL="${OYA_OUTBOX_POSTGRES_APP_URL}"
            --env OYA_BACKBONE_LIVE_POSTGRES="${OYA_BACKBONE_LIVE_POSTGRES}"
            --env OYA_BACKBONE_POSTGRES_URL="${OYA_BACKBONE_POSTGRES_URL}"
            --env OYA_BACKBONE_POSTGRES_APP_URL="${OYA_BACKBONE_POSTGRES_APP_URL}"
          )
          buck2 test --local-only --num-threads 1 //libs/oya-data-sql-adapter-sqlx:oya-data-sql-adapter-sqlx-unittest -- "${LIVE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //libs/oya-data-outbox-adapter-postgres:oya-data-outbox-adapter-postgres-unittest -- "${LIVE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //tenancy/adapters/tenant-lifecycle-store-postgres:tenancy-tenant-lifecycle-store-postgres-unittest -- "${LIVE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //tenancy/adapters/tenant-lifecycle-store-postgres:tenancy-tenant-lifecycle-store-postgres-live -- "${LIVE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //iam/adapters/identity-scim-store-postgres:identity-scim-store-postgres-unittest -- "${LIVE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //iam/adapters/identity-scim-store-postgres:identity-scim-store-postgres-live -- "${LIVE_ENV[@]}"
      - name: Upload live-postgres adapter bootstrap provenance
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-postgres-adapters-bootstrap-provenance
          path: ${{ runner.temp }}/live-postgres-adapters-bootstrap-provenance.json
          retention-days: 30
          if-no-files-found: warn

  gate-live-postgres-facades:
    name: "gate-live-postgres-facades (durable facades: tenant lifecycle / SCIM, #901)"
    runs-on: ubuntu-latest
