# oya-ci-required — the SINGLE canonical blocking required status check (ONE CANONICAL CI).
#
# Authority: ADR-0515 (Phase-0 firewall + one-canonical-CI + cloud-native posture; Accepted
# 2026-06-07). Rulings: D-CICD-AUTHORITY, ONE CANONICAL CI, D-SEQUENCE (firewall-first),
# D-DOCTRINE (no false-green / surface-all).
#
# Design (per FIREWALL-GO-LIVE-RUNBOOK.md Part 2 + CICD-DESIGN-PLAN Stage 1A/1B): the gate
# lanes fan OUT (fail-fast:false, surface-all) and fan IN to ONE zero-build job named
# `oya-ci-required` that has NO command set of its own — it is green IFF every constituent
# gate lane is green. Branch protection keys on that one context name. Do NOT register the
# 6 gates individually (rejected by the oya-pr-review HTTP-501 multi-producer-deadlock lesson).
#
# ░░ LIVE ░░
# Go-live executed 2026-06-08 (founder-authorized "fully autonomous through both"): the blocking
# triggers below are paired with making `oya-ci-required` the required status context on `dev`
# branch protection (FIREWALL-GO-LIVE-RUNBOOK Part 2). This is the SINGLE canonical required CI
# check — green IFF every constituent gate lane is green. workflow_dispatch retained for manual
# re-runs / verification.

name: oya-ci-required

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  merge_group:

permissions:
  contents: read

# Surface-all: every gate lane runs to completion even if a sibling fails. The fan-in job
# collects the join. (Lane-internal fail-fast is killed inside each `cargo test` invocation.)
concurrency:
  group: oya-ci-required-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Producer regen: regenerate the 5 accounting faces in-place so registry-drift can
  #    byte-diff committed == regenerated on the candidate tree. Shared upstream of the
  #    drift gate (generate-once; CICD-DESIGN-PLAN 2A is the future warm-cache refinement).
  producer-regen:
    name: producer-regen (accounting-registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      # rust-toolchain.toml at the repo root pins the channel (1.95.0); the default runner
      # rustup honors it, so no explicit toolchain action is needed (zero version drift).
      - name: Regenerate accounting faces in-place
        run: cargo run --quiet -p oya-cloud-ci-accounting-registry-app -- --repo-root .
      - name: Upload regenerated faces
        uses: actions/upload-artifact@v4
        with:
          name: accounting-faces
          path: cloud/cloud-ci/gates/oya-cloud-ci-accounting-registry-app/*.generated.json
          if-no-files-found: error

  # ── GATE LANES (reusable matrix). Every homogeneous gate is the SAME step — one
  #    `cargo test -p <gate crate>` — so instead of copy-pasting a job per gate, a single
  #    matrixed `gate` job fans out over the crate list. Adding a gate is ONE line in the matrix
  #    below; the `gate_registration` meta-test (in the cloud-ci-firewall lane) ENFORCES that
  #    every in-tree gate crate is listed here AND that this job is a fan-in dependency, so a
  #    gate can never be silently dropped. Each matrix leg is its own check-run
  #    `gate (oya-cloud-ci-<x>-app)`, preserving per-gate attribution; legs with a live-corpus
  #    self-test are born-blocking. `fail-fast: false` = surface-all (every leg runs to
  #    completion even if a sibling fails). `fetch-depth: 0` because the born-blocking
  #    self-tests run the producer, which derives last_touch_commit via `git log`.
  #    (Deliberately a matrix, NOT a `workflow_call` reusable workflow: a called workflow would
  #    rename the published check-runs [`<caller> / <job>`], breaking the `oya-ci-required`
  #    branch-protection context. A future owned oya-ci runner can reuse this matrix verbatim —
  #    "one logic, two runners", D-CICD-AUTHORITY.)
  gate:
    # Descriptive per-leg check-run name (matrix.label) — each leg publishes as
    # "gate · <discipline>", not a bare "gate (crate)". Adding a gate = one `include` line
    # (crate + label); the gate_registration meta-test enforces every gate crate is listed.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: oya-cloud-ci-cross-artifact-agreement-app, label: "gate · cross-artifact-agreement (GATE-1)" }
          - { crate: oya-cloud-ci-total-accounting-app,         label: "gate · total-accounting (GATE-2)" }
          - { crate: oya-cloud-ci-staleness-reaper-app,         label: "gate · staleness-reaper (GATE-3, born-blocking)" }
          - { crate: oya-cloud-ci-automation-ratchet-app,       label: "gate · automation-ratchet (GATE-4, polices gates)" }
          - { crate: oya-cloud-ci-bnf-layer-suffix-app,         label: "gate · bnf-layer-suffix (BNF §2.5#4, born-blocking)" }
          - { crate: oya-cloud-ci-manifest-hygiene-app,         label: "gate · manifest-hygiene (§2.5#7, born-blocking)" }
          - { crate: oya-cloud-ci-cargo-prefix-app,            label: "gate · cargo-prefix (ADR-0017)" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cargo test ${{ matrix.crate }}
        run: cargo test --no-fail-fast -p ${{ matrix.crate }} -- --test-threads=1

  # ── registry-drift: committed == regenerated byte-equal. Depends on producer-regen so the
  #    diff target reflects the candidate tree (the regen runs in-job for hermeticity).
  gate-registry-drift:
    name: registry-drift (committed == regenerated)
    runs-on: ubuntu-latest
    needs: [producer-regen]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Regenerate faces then assert byte-parity
        run: |
          cargo run --quiet -p oya-cloud-ci-accounting-registry-app -- --repo-root .
          cargo test --no-fail-fast -p registry-drift -- --test-threads=1

  # ── cloud-ci-firewall: the baseline ratchet (blocks only NEW debt) + the gate-registration
  #    meta-test (no in-tree gate may go unregistered in this workflow). This is the surface-all
  #    runner; per the runbook the existing firewall runner suffices — no separate aggregator bin
  #    is required for PRE-work.
  gate-cloud-ci-firewall:
    name: cloud-ci-firewall (baseline ratchet + gate-registration meta-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: cargo test cloud-ci-firewall
        run: cargo test --no-fail-fast -p oya-cloud-ci-firewall-app -- --test-threads=1

  # ── HERMETIC BUCK2 LANE (OYA-CI-HERMETIC-EXECUTION-DESIGN §3 + Stage P1/P2). Runs the SAME
  #    gate logic as the cargo lanes above, but through buck2: `buck2 build` compiles every
  #    target (the env!CARGO eradication) and `buck2 test` runs the gate rust_tests fully
  #    hermetically (no ambient git in any action — the producer reads the committed git-facts
  #    face; the git-facts emitter is the single out-of-graph boundary, run in the
  #    `git-facts-regen` step BELOW, never inside a cacheable action). Scoped by the
  #    affected-set driver (`infra/ci/buck2-affected-gate.sh`: uquery owner -> rdeps closure,
  #    FAILS CLOSED) for speed. RBE/NativeLink is staged LAST (D4) and NOT required for
  #    hermeticity — local-on-runner execution via the wired `noop_test_toolchain` is sufficient
  #    here. This lane runs ALONGSIDE the cargo lanes (both feed the fan-in); the cargo->buck2
  #    required-context content swap is a separate founder-paired step.
  buck2:
    name: buck2 (hermetic build + affected gate tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the git-facts-regen step below runs the emitter, which derives
          # last_touch via `git log --name-only`; a shallow checkout collapses it (PM1).
          fetch-depth: 0
      # buck2 is the BUILD TOOL (like cargo/rustc), installed as a pinned prebuilt release —
      # NOT a hermetic artifact of this repo. Pinned by tag for reproducibility (the design's
      # "actions/cache keyed on the buck2 version" warm-start; bump the tag deliberately).
      - name: Install buck2 (pinned prebuilt release)
        env:
          BUCK2_RELEASE: "2026-06-01"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/facebook/buck2/releases/download/${BUCK2_RELEASE}/buck2-x86_64-unknown-linux-gnu.zst" -o /tmp/buck2.zst
          zstd -d /tmp/buck2.zst -o /tmp/buck2
          chmod +x /tmp/buck2
          sudo mv /tmp/buck2 /usr/local/bin/buck2
          buck2 --version
      # Pre-provision the pinned rust toolchain ONCE, serially, before the buck2 build.
      # The buck2 rust toolchain (toolchains/BUCK: system_rust_toolchain via the rustup shim)
      # resolves rustc/cargo/clippy per-compile-action, and buck2 runs those actions in
      # PARALLEL. On a cold runner each action's first shim call triggers rustup to install the
      # rust-toolchain.toml channel (1.95.0 + rustfmt,clippy) concurrently — the racing rustup
      # processes collide on the shared `~/.rustup/downloads/*.partial` files and fail with
      # `rustup::utils::rename ... No such file or directory (os error 2)` (a different component
      # each run: clippy, then cargo — proving a concurrency race, not a config defect). rustup
      # is not concurrency-safe. Installing the toolchain once here makes it ambient so the
      # parallel actions find it already present (no download). The cargo lanes never hit this
      # because cargo provisions the toolchain in a single up-front invocation.
      - name: Pre-provision pinned rust toolchain (serialize rustup before parallel buck2)
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      # Warm buck-out + the buck2 daemon cache across runs so ephemeral runners do not
      # cold-bootstrap the toolchain (design §3.1 / ADR-0515 D4).
      - name: Cache buck-out
        uses: actions/cache@v4
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            buck-out-${{ runner.os }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}-
            buck-out-${{ runner.os }}-
      # git-facts-regen — the SINGLE out-of-graph git boundary. Re-run the emitter against the
      # PR HEAD and assert the committed git-facts face matches (the byte-validation that, under
      # buck2, intentionally SKIPS inside the hermetic action graph). OYA_CI_GIT_FACTS_REGEN=1
      # opts the registry-drift git-facts check into running here. This catches a stale/hand-
      # edited git-facts face before the hermetic gates consume it.
      - name: git-facts-regen (out-of-graph git boundary) + byte-validate
        env:
          OYA_CI_GIT_FACTS_REGEN: "1"
        run: |
          set -euo pipefail
          buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-git-facts-emitter-app:oya-cloud-ci-git-facts-emitter-app
          EMITTER=$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-git-facts-emitter-app:oya-cloud-ci-git-facts-emitter-app --show-output 2>/dev/null | awk '{print $2}')
          "$EMITTER" --repo-root . --out /tmp/git-facts-regen.json
          if ! diff -q cloud/cloud-ci/gates/oya-cloud-ci-accounting-registry-app/git-facts.generated.json /tmp/git-facts-regen.json; then
            echo "GIT-FACTS DRIFT: committed git-facts.generated.json != regenerated. Re-run the emitter and settle." >&2
            exit 1
          fi
          echo "git-facts byte-validated against the emitter (out-of-graph boundary)."
      # The hermetic gate: buck2 BUILDS every cloud-ci target (proves the env!CARGO eradication —
      # these targets could not compile under buck2 before) and TESTS them (the gate rust_tests
      # run green, fully hermetic, with verdicts identical to the cargo lanes). This is the
      # refactor's scope and is the binding hermetic check for this stage.
      #
      # NOTE: the affected-set driver (`infra/ci/buck2-affected-gate.sh`, uquery owner -> rdeps
      # closure) is the design's speed mechanism (§3.2) and runs below as a best-effort fast path,
      # but its whole-graph `rdeps(//..., ...)` currently FAILS CLOSED on a PRE-EXISTING stale
      # git-worktree BUCK package (`.claire/worktrees/.../oya-payroll-run-usecase`) committed at
      # base — graph pollution unrelated to this refactor. Until that is cleaned, the binding gate
      # is the scoped `//cloud/cloud-ci/...` build+test above; the affected driver is advisory.
      - name: buck2 build + test (//cloud/cloud-ci/..., hermetic — binding)
        run: |
          set -euo pipefail
          buck2 build //cloud/cloud-ci/...
          buck2 test //cloud/cloud-ci/...
      - name: buck2 affected-set driver (advisory speed path)
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x infra/ci/buck2-affected-gate.sh
          BUCK2=buck2 infra/ci/buck2-affected-gate.sh "origin/${{ github.base_ref || 'dev' }}"

  # ── THE FAN-IN. This is the single required context branch protection keys on. It has NO
  #    command of its own (Principle 1 — it NEVER re-runs a narrower subset): it is green IFF
  #    every gate lane above is green. `needs:` lists EVERY gate job; the gate-registration
  #    meta-test (in the firewall lane) asserts every in-tree gate crate is represented here.
  oya-ci-required:
    name: oya-ci-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - gate                    # the matrix of homogeneous gate lanes (success IFF every leg passed)
      - gate-registry-drift     # bespoke: committed == regenerated byte-parity
      - gate-cloud-ci-firewall  # bespoke: baseline ratchet + gate_registration meta-test
      - buck2                   # hermetic buck2 build + affected gate tests (alongside cargo)
    steps:
      - name: Fan-in verdict (green IFF every gate lane is green)
        run: |
          echo "Gate results:"
          echo "  gate (matrix)     = ${{ needs.gate.result }}"
          echo "  registry-drift    = ${{ needs.gate-registry-drift.result }}"
          echo "  cloud-ci-firewall = ${{ needs.gate-cloud-ci-firewall.result }}"
          echo "  buck2             = ${{ needs.buck2.result }}"
          # A matrix job's aggregate `.result` is success IFF ALL legs succeeded, failure if any
          # leg failed, skipped if it never ran — so one check covers every gate in the matrix.
          if [ "${{ needs.gate.result }}" = "success" ] \
            && [ "${{ needs.gate-registry-drift.result }}" = "success" ] \
            && [ "${{ needs.gate-cloud-ci-firewall.result }}" = "success" ] \
            && [ "${{ needs.buck2.result }}" = "success" ]; then
            echo "oya-ci-required: GREEN — every constituent gate lane passed."
            exit 0
          fi
          echo "oya-ci-required: RED — at least one constituent gate lane failed or was skipped."
          exit 1
