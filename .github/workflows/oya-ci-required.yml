            --env OYA_BACKBONE_POSTGRES_APP_URL="${OYA_BACKBONE_POSTGRES_APP_URL}"
          )
          buck2 test --local-only --num-threads 1 //iam/facade/identity-service:iam-identity-service-tests -- "${FACADE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //iam/facade/identity-service:iam-identity-service-e2e -- "${FACADE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //tenancy/facade/tenant-lifecycle-app:tenancy-tenant-lifecycle-app-unittest -- "${FACADE_ENV[@]}"
          buck2 test --local-only --num-threads 1 //tenancy/facade/tenant-lifecycle-app:tenancy-tenant-lifecycle-app-acceptance -- "${FACADE_ENV[@]}"
      - name: Upload live-postgres facade bootstrap provenance
        if: always()
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-postgres-facades-bootstrap-provenance
          path: ${{ runner.temp }}/live-postgres-facades-bootstrap-provenance.json
          retention-days: 30
          if-no-files-found: warn



  # ── THE FAN-IN. This is the single required context branch protection keys on. It has NO
  #    command of its own (Principle 1 — it NEVER re-runs a narrower subset): it is green IFF
  #    every gate lane above is green. `needs:` lists EVERY gate job; the gate-registration
  #    meta-test (in the firewall lane) asserts every in-tree gate crate is represented here.
  oya-ci-required:
    name: oya-ci-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - gate                    # the matrix of homogeneous gate lanes (success IFF every leg passed)
      - gate-freshness          # bespoke: stale Cargo.lock + generated faces first diagnosis
      - gate-registry-drift     # bespoke: materialized == regenerated byte-parity
      - gate-cloud-ci-firewall  # bespoke: baseline ratchet + gate_registration meta-test
      - generated-output-diff-policy # generated outputs are never PR merge surfaces
      - buck2                   # hermetic buck2 build + affected gate tests
      - gate-affected-set       # binding workspace coverage: affected cone or fail-closed full run (ADR-0554)
      - gate-live-postgres-adapters # #901: durable adapter RLS / CDC / SCIM tests against isolated live Postgres
      - gate-live-postgres-facades  # #901: durable facade tenant lifecycle / SCIM tests against isolated live Postgres
    steps:
      - name: Fan-in verdict (green IFF every gate lane is green)
        run: |
          echo "Gate results:"
          echo "  gate (matrix)     = ${{ needs.gate.result }}"
          echo "  freshness         = ${{ needs.gate-freshness.result }}"
          echo "  registry-drift    = ${{ needs.gate-registry-drift.result }}"
          echo "  cloud-ci-firewall = ${{ needs.gate-cloud-ci-firewall.result }}"
          echo "  generated-diff    = ${{ needs.generated-output-diff-policy.result }}"
          echo "  buck2             = ${{ needs.buck2.result }}"
          echo "  affected-set      = ${{ needs.gate-affected-set.result }}"
          echo "  live-postgres/adapters = ${{ needs.gate-live-postgres-adapters.result }}"
          echo "  live-postgres/facades  = ${{ needs.gate-live-postgres-facades.result }}"
          # A matrix job's aggregate `.result` is success IFF ALL legs succeeded, failure if any
          # leg failed, skipped if it never ran — so one check covers every gate in the matrix.
          if [ "${{ needs.gate.result }}" = "success" ] \
            && [ "${{ needs.gate-freshness.result }}" = "success" ] \
            && [ "${{ needs.gate-registry-drift.result }}" = "success" ] \
            && [ "${{ needs.gate-cloud-ci-firewall.result }}" = "success" ] \
            && [ "${{ needs.generated-output-diff-policy.result }}" = "success" ] \
            && [ "${{ needs.buck2.result }}" = "success" ] \
            && [ "${{ needs.gate-affected-set.result }}" = "success" ] \
            && [ "${{ needs.gate-live-postgres-adapters.result }}" = "success" ] \
            && [ "${{ needs.gate-live-postgres-facades.result }}" = "success" ]; then
            echo "oya-ci-required: GREEN — every constituent gate lane passed."
            exit 0
          fi
          echo "oya-ci-required: RED — at least one constituent gate lane failed or was skipped."
          exit 1
