      OYA_PG_APP_URL: postgres://oya_app:app@127.0.0.1:5432/oyatie
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 live tests
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: Install postgresql-client for the bootstrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
      - name: Bootstrap app role + durable schemas/roles (admin, facades)
        env:
