# oya-ci-required — the SINGLE canonical blocking required status check (ONE CANONICAL CI).
#
# Authority: ADR-0515 (Phase-0 firewall + one-canonical-CI + cloud-native posture; Accepted
# 2026-06-07). Rulings: D-CICD-AUTHORITY, ONE CANONICAL CI, D-SEQUENCE (firewall-first),
# D-DOCTRINE (no false-green / surface-all).
#
# Design (per FIREWALL-GO-LIVE-RUNBOOK.md Part 2 + CICD-DESIGN-PLAN Stage 1A/1B): the gate
# lanes fan OUT (fail-fast:false, surface-all) and fan IN to ONE zero-build job named
# `oya-ci-required` that has NO command set of its own — it is green IFF every constituent
# gate lane is green. Branch protection keys on that one context name. Do NOT register the
# 6 gates individually (rejected by the oya-pr-review HTTP-501 multi-producer-deadlock lesson).
#
# ░░ LIVE ░░
# Go-live executed 2026-06-08 (founder-authorized "fully autonomous through both"): the blocking
# triggers below are paired with making `oya-ci-required` the required status context on `dev`
# branch protection (FIREWALL-GO-LIVE-RUNBOOK Part 2). This is the SINGLE canonical required CI
# check — green IFF every constituent gate lane is green. workflow_dispatch retained for manual
# re-runs / verification.

name: oya-ci-required

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  merge_group:

permissions:
  contents: read

# Surface-all: every gate lane runs to completion even if a sibling fails. The fan-in job
# collects the join. (Lane-internal fail-fast is killed inside each `cargo test` invocation.)
concurrency:
  group: oya-ci-required-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Producer regen: materialize the cloud-ci generated faces from the checked-out candidate
  #    tree. Generated JSON is not a contributor merge surface; the CI/controller workspace
  #    regenerates it before gates consume it, then uploads it both as evidence AND as the
  #    faces source the mere-reader gate matrix legs download (ADR-0556 D5 QW-1).
  producer-regen:
    name: producer-regen (accounting-registry)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      - name: Materialize cloud-ci generated faces
        run: infra/ci/materialize-cloud-ci-generated-faces.sh .
      - name: Upload regenerated faces
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accounting-faces
          # Two upload roots -> the artifact is rooted at their least common ancestor
          # (cloud/cloud-ci/gates/): the regenerated accounting faces PLUS the untracked
          # volatile scm snapshot (ADR-0552) the staleness-reaper leg ages rows from. The
          # mere-reader gate matrix legs download this artifact instead of re-materializing
          # per leg (ADR-0556 D5 QW-1, gate-fleet-shared-graph same-run trusted reuse).
          # Deliberately NOT uploaded: the firewall's merge-base frozen baseline — its
          # materialization is per-job by design (ADR-0551 frozen-policy-wins) and must
          # never become a shareable artifact.
          path: |
            cloud/cloud-ci/gates/oya-cloud-ci-accounting-registry-app/*.generated.json
            cloud/cloud-ci/gates/oya-cloud-ci-scm-facts-emitter-app/scm-volatile-facts.generated.json
          if-no-files-found: error

  # ── GATE LANES (reusable matrix). Every homogeneous gate is the SAME step — one
  #    `cargo test -p <gate crate>` — so instead of copy-pasting a job per gate, a single
  #    matrixed `gate` job fans out over the crate list. Adding a gate is ONE line in the matrix
  #    below; the `gate_registration` meta-test (in the cloud-ci-firewall lane) ENFORCES that
  #    every in-tree gate crate is listed here AND that this job is a fan-in dependency, so a
  #    gate can never be silently dropped. Each matrix leg is its own check-run
  #    `gate (oya-cloud-ci-<x>-app)`, preserving per-gate attribution; legs with a live-corpus
  #    self-test are born-blocking. `fail-fast: false` = surface-all (every leg runs to
  #    completion even if a sibling fails).
  #    (Deliberately a matrix, NOT a `workflow_call` reusable workflow: a called workflow would
  #    rename the published check-runs [`<caller> / <job>`], breaking the `oya-ci-required`
  #    branch-protection context. A future owned oya-ci runner can reuse this matrix verbatim —
  #    "one logic, two runners", D-CICD-AUTHORITY.)
  #
  #    FACES VIA ARTIFACT (ADR-0556 D5 QW-1, gate-fleet-shared-graph warm-safe same-run reuse):
  #    every leg here is a MERE READER of the generated faces — none re-verifies regeneration
  #    itself, so each leg downloads the producer-regen artifact instead of paying its own
  #    install-buck2 + materialize (the audit-measured ~45-55s/leg hub rebuild, 16x per run).
  #    Same-run, same candidate tree, same trusted writer — no cross-run cache participation.
  #    The regeneration-checking gates KEEP materializing independently: registry-drift (the
  #    byte-parity detector — detectors never consume the thing they attest), producer-regen
  #    itself, and cloud-ci-firewall (its merge-base frozen baseline is per-job by design,
  #    ADR-0551). `needs: producer-regen` serializes these legs behind a ~75s producer job;
  #    the workflow critical path (affected-set/buck2 lanes) is unaffected. If producer-regen
  #    fails, legs are skipped and the fan-in goes RED (fail-closed, same join as today).
  #    `fetch-depth: 0` retained conservatively: no matrix gate calls git (verified — faces
  #    carry all history-derived data per ADR-0552), but shallowing the checkout is a separate
  #    reviewed change, not a side effect of artifact reuse.
  gate:
    needs: producer-regen
    # Descriptive per-leg check-run name (matrix.label) — each leg publishes as
    # "gate · <discipline>", not a bare "gate (crate)". Adding a gate = one `include` line
    # (crate + label); the gate_registration meta-test enforces every gate crate is listed.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: oya-cloud-ci-cross-artifact-agreement-app, label: "gate · cross-artifact-agreement (GATE-1)" }
          - { crate: oya-cloud-ci-total-accounting-app,         label: "gate · total-accounting (GATE-2)" }
          - { crate: oya-cloud-ci-staleness-reaper-app,         label: "gate · staleness-reaper (GATE-3, born-blocking)" }
          - { crate: oya-cloud-ci-automation-ratchet-app,       label: "gate · automation-ratchet (GATE-4, polices gates)" }
          - { crate: oya-cloud-ci-bnf-layer-suffix-app,         label: "gate · bnf-layer-suffix (BNF §2.5#4, born-blocking)" }
          - { crate: oya-cloud-ci-manifest-hygiene-app,         label: "gate · manifest-hygiene (§2.5#7, born-blocking)" }
          - { crate: oya-cloud-ci-cargo-prefix-app,            label: "gate · cargo-prefix (ADR-0017)" }
          - { crate: oya-cloud-ci-slo-coverage-app,            label: "gate · slo-coverage (catalog SLO input contract, born-blocking)" }
          - { crate: oya-cloud-ci-workspace-glob-coverage-app, label: "gate: workspace-glob-coverage (ADR-0538)" }
          - { crate: oya-cloud-ci-target-parity-app,           label: "gate · target-parity (ADR-0540, test-wiring false-green)" }
          - { crate: oya-cloud-ci-enforcement-liveness-app,    label: "gate · enforcement-liveness (FRIC-012, hook mirror liveness)" }
          - { crate: oya-cloud-ci-friction-accounting-app,     label: "gate · friction-accounting (ADR-0544, closed-loop friction-ledger accounting)" }
          - { crate: oya-cloud-ci-canonical-json-app,          label: "gate · canonical-json (ADR-0546, deterministic JSON serialization)" }
          - { crate: oya-cloud-ci-embedded-asset-hermeticity-app, label: "gate · embedded-asset-hermeticity (ADR-0545, include_str!/include_bytes! __srcs-tree mapping)" }
          - { crate: oya-cloud-ci-kernel-purity-app,           label: "gate · kernel-purity (ADR-0547, *-kernel/*-core zero transient-tech deps)" }
          - { crate: oya-cloud-ci-generated-artifact-control-plane-app, label: "gate · generated-artifact-control-plane (public hermetic CI artifact policy)" }
          - { crate: oya-cloud-ci-cache-wiring-app,            label: "gate · cache-wiring conformance (ADR-0560/ADR-0556, dark-wiring + cold floor + kill-switch)" }
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      # Consume the producer-regen artifact (faces + volatile scm snapshot) instead of
      # re-materializing per leg — see the FACES VIA ARTIFACT note on this job. The download
      # restores the same regenerated bytes the producer derived from this run's candidate
      # tree; registry-drift separately proves that derivation is byte-deterministic.
      - name: Download regenerated faces (producer-regen artifact, ADR-0556 D5 QW-1)
        # actions/download-artifact@v8.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accounting-faces
          path: cloud/cloud-ci/gates
      # The materialize script used to provision the pinned toolchain as a side effect; the
      # legs still need it for `cargo test` (rust-toolchain.toml pins 1.95.0 + components).
      - name: Pre-provision pinned Rust toolchain for cargo test
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      - name: cargo test ${{ matrix.crate }}
        run: cargo test --locked --no-fail-fast -p ${{ matrix.crate }} -- --test-threads=1

  # ── freshness: first-diagnosis gate for the two stale-output failures from PR #662.
  #    Runs as its own fast job with no needs edge so stale Cargo.lock and stale generated faces
  #    surface together before the broader cargo/Buck lanes spend a full matrix round-trip.
  gate-freshness:
    name: freshness (lock + generated faces, ADR-0539)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4: the toolchain is a
      # version-pinned input, not a build output). rustup still resolves/validates the
      # toolchain on every run; the cache only pre-seeds ~/.rustup so the install is a no-op.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 freshness binaries
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      - name: Run freshness gate
        run: |
          set -euo pipefail
          freshness_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-freshness-app:oya-cloud-ci-freshness-app-bin --show-output | awk '{print $2}')"
          "${freshness_bin}" --repo-root .

  # ── registry-drift: materialized workspace == regenerated byte-equal. Starts at t=0 alongside
  #    producer-regen; it rematerializes in-job so it is hermetic and self-contained. The
  #    producer-regen needs-edge was cosmetic (evidence only, nothing consumed) and serialized
  #    this job unnecessarily — removed so it starts at t=0.
  gate-registry-drift:
    name: registry-drift (materialized == regenerated)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # HERMETICITY CONTRACT (ADR-0556 D5 QW-1 deliberate exception): this gate IS the
      # byte-parity detector (committed == regenerated), so it MUST regenerate in-job —
      # feeding it the producer-regen artifact it is supposed to verify would make the
      # check self-referential. Detectors never consume the thing they attest.
      - name: Materialize faces then assert byte-parity
        run: |
          infra/ci/materialize-cloud-ci-generated-faces.sh .
          cargo test --locked --no-fail-fast -p registry-drift -- --test-threads=1

  # ── cloud-ci-firewall: the baseline ratchet (blocks only NEW debt) + the gate-registration
  #    meta-test (no in-tree gate may go unregistered in this workflow). This is the surface-all
  #    runner; per the runbook the existing firewall runner suffices — no separate aggregator bin
  #    is required for PRE-work.
  gate-cloud-ci-firewall:
    name: cloud-ci-firewall (baseline ratchet + gate-registration meta-test)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the accounting producer derives last_touch_commit via
          # `git log --name-only`, and the staleness gate ages rows via `git log %H %ct`.
          # A shallow (depth-1) checkout truncates history to HEAD -> ages collapse to 0
          # and git-derived faces degrade (false-green). fetch-depth:0 keeps CI reproducible
          # and identical to a full local clone.
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # HERMETICITY CONTRACT (ADR-0551 frozen-policy-wins): the firewall's frozen reference —
      # the merge-base baseline snapshot — is materialized per-job BY DESIGN via the emitter's
      # out-of-band bootstrap ref, and is deliberately absent from the producer-regen artifact.
      # This lane therefore KEEPS its own materialization (ADR-0556 D5 cold-must-stay list);
      # it is never converted to artifact reuse.
      - name: Materialize cloud-ci generated faces
        run: infra/ci/materialize-cloud-ci-generated-faces.sh .
      - name: cargo test cloud-ci-firewall
        run: cargo test --locked --no-fail-fast -p oya-cloud-ci-firewall-app -- --test-threads=1

  # ── GENERATED OUTPUT DIFF POLICY. Generated files may be deleted to retire a tracked output,
  #    but PRs must not add/modify generated outputs as merge surfaces. Classification comes from
  #    registry/generated-artifact-control-plane.json `generated_path_rules` so adopters can encode
  #    their generated-output conventions once; .gitignore is preventive hygiene, not policy
  #    authority. The candidate workspace is regenerated by cloud-ci before gates consume it.
  generated-output-diff-policy:
    name: generated-output-diff-policy (no generated merge surfaces)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Pre-provision pinned Rust toolchain for Buck2 policy binary
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      - name: Reject non-deletion generated output edits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "generated-output-diff-policy: push event; presubmit diff policy not applicable."
            exit 0
          fi
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          policy_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-generated-artifact-control-plane-app:oya-cloud-ci-generated-output-diff-policy --show-output | awk '{print $2}')"
          git diff --name-status "origin/${BASE_REF}"...HEAD \
            | "${policy_bin}" --manifest registry/generated-artifact-control-plane.json

  # ── HERMETIC BUCK2 LANE (OYA-CI-HERMETIC-EXECUTION-DESIGN §3 + Stage P1/P2). Runs the SAME
  #    gate logic as the cargo lanes above, but through buck2: `buck2 build` compiles every
  #    target (the env!CARGO eradication) and `buck2 test` runs the gate rust_tests fully
  #    hermetically (no ambient git in any action — the producer reads the materialized scm-facts
  #    face; the scm-facts emitter is the single out-of-graph boundary, run in the
  #    materialization step BELOW, never inside a cacheable action). Scoped by the
  #    affected-set driver (`infra/ci/buck2-affected-gate.sh`: uquery owner -> rdeps closure,
  #    FAILS CLOSED) for speed. RBE/NativeLink is staged LAST (D4) and NOT required for
  #    hermeticity — local-on-runner execution via the wired `noop_test_toolchain` is sufficient
  #    here. This lane runs ALONGSIDE the cargo lanes (both feed the fan-in); the cargo->buck2
  #    required-context content swap is a separate founder-paired step.
  buck2:
    name: buck2 (hermetic build + affected gate tests)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the materialization step below runs the emitter, which derives
          # last_touch via `git log --name-only`; a shallow checkout collapses it (PM1).
          fetch-depth: 0
      # buck2 is the BUILD TOOL (like cargo/rustc), installed as a prebuilt release.
      # The adapter edge is immutable at CI time: release tag selects the asset, SHA-256 pins
      # the bytes, and CI verifies the digest before decompression/execution. Bump together.
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # Pre-provision the pinned rust toolchain ONCE, serially, before the buck2 build.
      # The buck2 rust toolchain (toolchains/BUCK: system_rust_toolchain via the rustup shim)
      # resolves rustc/cargo/clippy per-compile-action, and buck2 runs those actions in
      # PARALLEL. On a cold runner each action's first shim call triggers rustup to install the
      # rust-toolchain.toml channel (1.95.0 + rustfmt,clippy) concurrently — the racing rustup
      # processes collide on the shared `~/.rustup/downloads/*.partial` files and fail with
      # `rustup::utils::rename ... No such file or directory (os error 2)` (a different component
      # each run: clippy, then cargo — proving a concurrency race, not a config defect). rustup
      # is not concurrency-safe. Installing the toolchain once here makes it ambient so the
      # parallel actions find it already present (no download). The cargo lanes never hit this
      # because cargo provisions the toolchain in a single up-front invocation.
      - name: Pre-provision pinned rust toolchain (serialize rustup before parallel buck2)
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      # Restore buck-out across runs so ephemeral runners start warm (design §3.1 / ADR-0515 D4).
      #
      # WHAT IS WARMED, PRECISELY (ADR-0554 D9, round-5): 100% of buck2 cross-run warmth lives in
      # ./buck-out — buck-out/v2/cache/{materializer_state,incremental_state}/db.sqlite plus
      # buck-out/v2/art (the materialized action outputs). buck-out is PATH-RELOCATABLE (relative
      # paths + --remap-cwd-prefix=., no absolute project root baked in; a restored hit is keyed
      # only on buck2_revision + os + arch), so restoring it into any runner checkout is sound.
      # ~/.buck2 and ~/.buck hold ONLY daemon pid/endpoint/log scratch — ZERO action results — so
      # caching `path: buck-out` warms everything cacheable and ~/.buck2/~/.buck is DELIBERATELY
      # NOT cached (caching daemon scratch warms nothing; do not cargo-cult global-state caching).
      #
      # SAVE/RESTORE SPLIT (ADR-0554 D9; specs/cache-warmth-policy.json postmerge-dev-trunk = sole
      # writer, presubmit-trusted-affected-cone = reader). dev-push is the SOLE canonical writer:
      # PRs RESTORE read-only here, and only the push-to-dev SAVE step at the end of this job's
      # build writes — so PRs no longer churn multi-GB writes/evictions (the Bazel/Google
      # post-merge-fills-the-cache pattern).
      #
      # Cache key is STABLE per dependency-set (.buckconfig + toolchains/BUCK + Cargo.lock),
      # NOT per-commit. The previous `-${{ github.sha }}` suffix made the primary key unique
      # every commit, so actions/cache SAVED a fresh full buck-out (multi-GB) on EVERY run and
      # never hit the primary key — bloating the 10GB repo cache into constant LRU eviction and
      # exhausting ephemeral-runner disk at the save step (the "No space left on device" failure,
      # FRIC-017). A stable key saves once per dependency-set and restores it exactly: deterministic
      # warm start, no per-commit bloat. Changed crates still rebuild (buck2 is content-addressed,
      # so a restored hit is bit-identical to a cold build); only a Cargo.lock/toolchain/.buckconfig
      # change mints a new entry. Interim warm-by-default until the shared content-addressed
      # remote cache (NativeLink/CAS, ADR-0560, HANDOFF W3) lands with a cold-canary integrity job
      # proving cold==warm. See friction-ledger buck2-no-shared-cache.
      - name: Restore buck-out (read-only; dev-push is the sole writer)
        # actions/cache/restore@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}
          restore-keys: |
            buck-out-${{ runner.os }}-
      # Generated-face materialization — the SINGLE out-of-graph git boundary. Re-run the emitter
      # and producer against the checked-out candidate tree, then let buck2 consume those files as
      # declared inputs. We deliberately do NOT byte-compare against committed JSON here: that was
      # the self-referential merge-conflict surface. Byte-parity is checked after materialization.
      # KEEPS materializing (not converted to ADR-0556 D5 QW-1 artifact reuse): the hermetic
      # graph's gate tests consume the firewall's merge-base frozen baseline, which is per-job
      # by design (ADR-0551) and deliberately absent from the producer-regen artifact; this
      # step is the sanctioned boundary that feeds ALL declared generated inputs to the graph.
      - name: Materialize cloud-ci generated faces (out-of-graph boundary)
        run: infra/ci/materialize-cloud-ci-generated-faces.sh .
      # The hermetic gate: buck2 BUILDS every cloud-ci target (proves the env!CARGO eradication —
      # these targets could not compile under buck2 before) and TESTS them (the gate rust_tests
      # run green, fully hermetic, with verdicts identical to the cargo lanes). This is the
      # refactor's scope and is the binding hermetic check for this stage.
      #
      # NOTE: the affected-set driver (`infra/ci/buck2-affected-gate.sh`, uquery owner -> rdeps
      # closure) is the design's speed mechanism (§3.2) and runs below as a best-effort fast path,
      # but its whole-graph `rdeps(//..., ...)` currently FAILS CLOSED on a PRE-EXISTING stale
      # git-worktree BUCK package (`.claire/worktrees/.../oya-payroll-run-usecase`) committed at
      # base — graph pollution unrelated to this refactor. Until that is cleaned, the binding gate
      # is the scoped `//cloud/cloud-ci/...` build+test above; the affected driver is advisory.
      - name: buck2 build + test (//cloud/cloud-ci/..., hermetic — binding)
        run: |
          set -euo pipefail
          # buck2 test builds its targets before running them, so a standalone
          # `buck2 build` immediately before is redundant — removed (item 4 quick win).
          # --unstable-write-invocation-record is additive observability only: it
          # writes buck2's structured run record (cache_hit_rate, run_* counters)
          # for the telemetry step below and changes nothing about the build.
          buck2 test //cloud/cloud-ci/... --unstable-write-invocation-record /tmp/buck2-lane-invocation-record.json
      # Per-lane cache-hit telemetry (ADR-0560; the audit's missing-SLO item):
      # structured counters from buck2's invocation record — never log-grep — labeled
      # with this lane's ADR-0556 build class. Non-blocking by construction
      # (continue-on-error): telemetry must never affect merge authority. Today the
      # lane runs bypass (the NativeLink wiring ships dark), so this baselines the
      # 0%-hit cold state (FRIC-1781450000) that the warm substrate will move.
      - name: Cache-hit telemetry (ADR-0560, structured per-lane report)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          buck2 run //cloud/cloud-ci/gates/oya-cloud-ci-cache-wiring-app:oya-cloud-ci-cache-wiring-bin -- report --record /tmp/buck2-lane-invocation-record.json --build-class gate-fleet-shared-graph --mode bypass --out /tmp/cache-hit-report.json
          cat /tmp/cache-hit-report.json
      - name: Upload cache-hit telemetry artifact
        if: always()
        continue-on-error: true
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cache-hit-report-buck2-lane
          path: /tmp/cache-hit-report.json
          if-no-files-found: warn
      - name: buck2 affected-set driver (advisory speed path)
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x infra/ci/buck2-affected-gate.sh
          BUCK2=buck2 infra/ci/buck2-affected-gate.sh "origin/${{ github.base_ref || 'dev' }}"
      # SAVE buck-out — dev-push is the SOLE canonical writer (ADR-0554 D9;
      # specs/cache-warmth-policy.json postmerge-dev-trunk). Runs at the END of this job's build
      # steps so the saved buck-out reflects the completed warm build. Guarded to push-to-dev so
      # PRs never write (read-only via the restore step above): the stable per-dependency-set key
      # is written once per dependency-set by the trusted post-merge populator, eliminating the
      # FRIC-017 per-commit multi-GB write-churn/eviction. Same path + key as the restore step.
      - name: Save buck-out (dev-push only; sole canonical writer)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        # actions/cache/save@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}

  # ── BINDING WORKSPACE COVERAGE (ADR-0554, FRIC-1781310000). Closes the largest false-green
  #    channel: the buck2 lane above is scoped to //cloud/cloud-ci/..., so code anywhere else
  #    (oya/*, libs/*, cloud/* services) could merge broken — proven live by PR #651 head
  #    cf16525 (E0433 x3 in oya/identity, buck2 lane green, run 27288019517) and by
  #    //oya/ci-webhook-gateway carrying an E0428 on dev itself. This lane is the BINDING
  #    Rust successor of the advisory infra/ci/buck2-affected-gate.sh step (G011): on
  #    pull_request it derives the merge-base diff's owner()/rdeps() cone and builds+tests it;
  #    any derivation uncertainty or escape-trigger path class (BUCK macros, toolchains,
  #    third-party, .buckconfig) escalates FAIL-CLOSED to the full workspace — never skips.
  #    On merge_group/push/dispatch it runs the full workspace (ADR-0515 Tide admission tier).
  #    On a PR, the FULL tier is a BUILD-HEALTH RATCHET (ADR-0554 round-3; ADR-0551 merge-base
  #    frozen pattern): it grandfathers targets already failing at the merge-base and blocks only
  #    REGRESSIONS, so a BUCK-touching PR is not held hostage to pre-existing dev build debt (no
  #    flag-day requirement). Pack-shaped per ADR-0548 R0: all repo facts live in affected-set-policy.json.
  gate-affected-set:
    name: "gate · affected-set (ADR-0554, binding workspace coverage)"
    runs-on: ubuntu-latest
    # SAFETY RAIL (ADR-0554 D7): bound the cold full-workspace rebuild so a runaway/exhaustion
    # (a wedged buck2 action, a non-terminating compile) cannot burn the runner indefinitely.
    # Derivation: ≈4x the ADR-0554-measured warm full run (4m35s cold / 5m45s incl. tests, lines
    # 56-58) — fires only on a genuine runaway, never on a healthy cold build.
    timeout-minutes: 45
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          # Full history: the merge-base diff anchor + the materialization boundary both
          # derive from git history; a shallow checkout collapses them (PM1).
          fetch-depth: 0
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh
      # Warm the pinned toolchain across runs (ADR-0556 D5 QW-4); rustup still resolves and
      # validates the toolchain on every run.
      - name: Cache pinned Rust toolchain (ADR-0556 D5 QW-4)
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update-hashes
          key: rustup-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # Same rustup serialization rationale as the buck2 lane above: parallel buck2 actions
      # racing a cold rustup install collide on shared download state.
      - name: Pre-provision pinned rust toolchain (serialize rustup before parallel buck2)
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup component add rustfmt clippy --toolchain 1.95.0
          rustc --version
          cargo --version
      # Restore buck-out read-only (ADR-0554 D9). Same stable per-dependency-set key as the buck2
      # lane: warmth is 100% in buck-out/v2/cache + buck-out/v2/art (path-relocatable); ~/.buck2
      # and ~/.buck are daemon pid/endpoint/log scratch and are deliberately NOT cached. dev-push
      # is the sole writer (the save step below is push-to-dev-gated), so PR runs read only — no
      # per-commit multi-GB write-churn/eviction (see the buck2-lane rationale above).
      - name: Restore buck-out (read-only; dev-push is the sole writer)
        # actions/cache/restore@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('.buckconfig', 'toolchains/BUCK', 'Cargo.lock') }}
          restore-keys: |
            buck-out-${{ runner.os }}-
      # KEEPS materializing (not converted to ADR-0556 D5 QW-1 artifact reuse): same rationale
      # as the buck2 lane — the cone's gate tests consume the per-job merge-base frozen
      # baseline (ADR-0551), and this lane's own build-health baseline below is per-job by
      # design (ADR-0554 round-3).
      - name: Materialize cloud-ci generated faces (out-of-graph boundary)
        run: infra/ci/materialize-cloud-ci-generated-faces.sh .
      - name: Fetch base ref for the merge-base anchor
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      # ── BUILD-HEALTH BASELINE (ADR-0554 D9 same-root build, round-5; ADR-0551 merge-base frozen
      #    pattern). On a pull_request, materialize the MERGE-BASE build-health baseline IN THE MAIN
      #    ROOT so it shares the warm ./buck-out restored above (the merge-base IS a dev commit, so
      #    the dev-keyed buck-out is near-fully-warm for it). We detach the SAME working tree to the
      #    merge-base COMMITTED tree-ish (the candidate working tree is removed from disk for the
      #    build), run the full keep-going build, capture per-target pass/fail, then a TRAP restores
      #    the candidate on EXIT. The affected-set FULL tier grandfathers targets already failing at
      #    the merge-base and blocks only REGRESSIONS. Skipped for push/merge_group/dispatch (the
      #    admission tier is a hard full build — no grandfathering).
      #
      #    ANTI-LAUNDERING (ADR-0554 D6, preserved): the baseline failure-set comes ENTIRELY from
      #    the merge-base COMMITTED tree (git object history — candidate-uncontrollable); during the
      #    baseline build the candidate working tree is GONE from disk, so it cannot feed the
      #    baseline; the report reaches the verdict ONLY via --baseline-report. The warm ./buck-out
      #    is a content-addressed substrate — a buck2 hit is bit-identical to a cold build (ADR-0556
      #    D1/D2) — so warmth changes only wall-clock, never the baseline SOURCE. Warm-eligible
      #    under ADR-0556 with no policy change (trusted-author, content-addressed; not the
      #    integrity-canary/release cold floor). This SUPERSEDES the deferred ADR-0554 D8 cross-run
      #    report-artifact CONSUMER (do not build it) — Option A warms the build directly.
      - name: Materialize merge-base build-health baseline (same-root, warm buck-out)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          orig_ref="$(git rev-parse HEAD)"
          echo "build-health baseline: merge-base=${merge_base} candidate=${orig_ref}"
          # ALWAYS restore the candidate tree on EXIT — a failed baseline build can never strand CI
          # on the merge-base tree (the subsequent Binding affected-set step runs on the candidate).
          trap 'git checkout --quiet --detach "${orig_ref}" 2>/dev/null || git checkout --quiet "${orig_ref}"' EXIT
          # Detach the MAIN working tree to the merge-base COMMITTED tree-ish: the baseline is
          # computed from git object history (candidate-uncontrollable), and the candidate working
          # tree is removed from disk for the build, so a PR cannot grow its own baseline to
          # launder a regression.
          git checkout --quiet --detach "${merge_base}"
          # Build the whole merge-base workspace keep-going, sharing the warm ./buck-out. The build
          # is EXPECTED to be non-zero (dev carries pre-existing breakage) — that is the baseline,
          # not a failure, so we never propagate its exit code.
          buck2 build //... --keep-going \
              --build-report "${RUNNER_TEMP}/build-health-baseline.json" || true
          test -s "${RUNNER_TEMP}/build-health-baseline.json" \
            || { echo "build-health: FATAL empty merge-base baseline report"; exit 1; }
      - name: Binding affected-set build + test (cone-binding; FULL tier = build-health ratchet)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          set -euo pipefail
          gate_bin="$(buck2 build //cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app:oya-cloud-ci-affected-set-bin --show-output | awk '{print $2}')"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # PR tier: auto (cone-binding, hard-fail on a NEW break in the changed cone); a FULL
            # escalation runs the build-health ratchet against the merge-base baseline.
            "${gate_bin}" \
              --policy cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app/affected-set-policy.json \
              --base "origin/${BASE_REF}" --mode auto \
              --baseline-report "${RUNNER_TEMP}/build-health-baseline.json"
          else
            # Admission/integration tier (merge_group/push/dispatch): hard full build+test — the
            # integration tip MUST be green, no grandfathering. ADR-0554 D7: this run ALSO captures
            # a build-report at ${RUNNER_TEMP}/build-health-admission-report.json (the binary's
            # stable RUNNER_TEMP-anchored path) as a pure byproduct; the verdict is unchanged
            # (non-empty failure set = hard fail) and the report is uploaded below only on
            # trusted push-to-dev.
            "${gate_bin}" \
              --policy cloud/cloud-ci/gates/oya-cloud-ci-affected-set-app/affected-set-policy.json \
              --base "origin/${BASE_REF}" --mode full
          fi
      # ── BUILD-HEALTH BASELINE PRODUCER (ADR-0554 D7; ADR-0556 D5 QW-1 trusted-producer +
      #    postmerge-dev-trunk warmth class). ONLY a trusted push-to-dev publishes the admission
      #    build-report as the merge-base-to-be baseline artifact — NOT merge_group, NOT
      #    pull_request — so the artifact namespace stays clean of attacker-controllable producers
      #    (part of the DEFERRED D8 consumer's anti-laundering defense; D8 trusts workflow_run
      #    PROVENANCE, never the artifact name). Producer-only: nothing consumes this yet, so it is
      #    sound + harmless (no merge-authority change, no new permissions). The artifact is on the
      #    critical path of BOTH the deferred D8 cross-run consumer AND the ADR-0560 warm-CAS.
      - name: Upload build-health baseline artifact (trusted push-to-dev producer)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-health-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/build-health-admission-report.json
          retention-days: 90
          if-no-files-found: error

  # ── APP-SHELL GENERATED CLIENT LANE. Generated TypeScript clients are intentionally ignored
  #    in git, so clean checkout CI must prove they regenerate from canonical OpenAPI sources
  #    before the single required fan-in can go green. This is a bridge lane until the native
  #    cloud-ci runner has first-class non-Rust toolchain actions; the invariant is still the
  #    productized generated-output policy above, not committed client files.
  app-shell-codegen:
    name: app-shell-codegen (ignored generated clients are reproducible)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Prepare pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --version
      - name: Regenerate and verify app-shell clients
        run: |
          set -euo pipefail
          pnpm --dir oya/app-shell-frontend install --frozen-lockfile
          pnpm --dir oya/app-shell-frontend codegen
          pnpm --dir oya/app-shell-frontend codegen:check
          pnpm --dir oya/app-shell-frontend typecheck

  # ── THE FAN-IN. This is the single required context branch protection keys on. It has NO
  #    command of its own (Principle 1 — it NEVER re-runs a narrower subset): it is green IFF
  #    every gate lane above is green. `needs:` lists EVERY gate job; the gate-registration
  #    meta-test (in the firewall lane) asserts every in-tree gate crate is represented here.
  oya-ci-required:
    name: oya-ci-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - gate                    # the matrix of homogeneous gate lanes (success IFF every leg passed)
      - gate-freshness          # bespoke: stale Cargo.lock + generated faces first diagnosis
      - gate-registry-drift     # bespoke: materialized == regenerated byte-parity
      - gate-cloud-ci-firewall  # bespoke: baseline ratchet + gate_registration meta-test
      - generated-output-diff-policy # generated outputs are never PR merge surfaces
      - buck2                   # hermetic buck2 build + affected gate tests (alongside cargo)
      - gate-affected-set       # binding workspace coverage: affected cone or fail-closed full run (ADR-0554)
      - app-shell-codegen       # ignored generated app-shell clients regenerate from canonical contracts
    steps:
      - name: Fan-in verdict (green IFF every gate lane is green)
        run: |
          echo "Gate results:"
          echo "  gate (matrix)     = ${{ needs.gate.result }}"
          echo "  freshness         = ${{ needs.gate-freshness.result }}"
          echo "  registry-drift    = ${{ needs.gate-registry-drift.result }}"
          echo "  cloud-ci-firewall = ${{ needs.gate-cloud-ci-firewall.result }}"
          echo "  generated-diff    = ${{ needs.generated-output-diff-policy.result }}"
          echo "  buck2             = ${{ needs.buck2.result }}"
          echo "  affected-set      = ${{ needs.gate-affected-set.result }}"
          echo "  app-shell-codegen = ${{ needs.app-shell-codegen.result }}"
          # A matrix job's aggregate `.result` is success IFF ALL legs succeeded, failure if any
          # leg failed, skipped if it never ran — so one check covers every gate in the matrix.
          if [ "${{ needs.gate.result }}" = "success" ] \
            && [ "${{ needs.gate-freshness.result }}" = "success" ] \
            && [ "${{ needs.gate-registry-drift.result }}" = "success" ] \
            && [ "${{ needs.gate-cloud-ci-firewall.result }}" = "success" ] \
            && [ "${{ needs.generated-output-diff-policy.result }}" = "success" ] \
            && [ "${{ needs.buck2.result }}" = "success" ] \
            && [ "${{ needs.gate-affected-set.result }}" = "success" ] \
            && [ "${{ needs.app-shell-codegen.result }}" = "success" ]; then
            echo "oya-ci-required: GREEN — every constituent gate lane passed."
            exit 0
          fi
          echo "oya-ci-required: RED — at least one constituent gate lane failed or was skipped."
          exit 1
