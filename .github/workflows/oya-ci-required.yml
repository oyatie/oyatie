# Single canonical required status check: branch protection keys on the `oya-ci-required`
# context, which is green IFF every constituent lane is green.
#
# Execution engine: the Cargo workspace graph (rust-toolchain.toml pins the toolchain).
# buck2 is local hermeticity tooling plus a weekly non-blocking smoke;
# (buck2-weekly-smoke.yml). Inside the merge path, buck2 appears only as the
# face materializer's internal helper (install-buck2.sh), never as a build/test verdict engine.
#
# Authority: docs/decisions/ADR-0716-cargo-merge-path-buck2-local-hermeticity.md

name: oya-ci-required

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Event tuple consumed by the generated-faces materializer (--github-event).
env:
  EVENT_EVALUATED_SHA: ${{ github.sha }}
  EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  EVENT_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
  EVENT_PUSH_AFTER_SHA: ${{ github.event.after || '' }}
  EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
  EVENT_MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
  EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  EVENT_NAME: ${{ github.event_name }}
  EVENT_REF: ${{ github.ref }}
  EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
  EVENT_MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (format + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The format gate diffs against the base ref.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Check formatting
        # Blocking and differential: only ACMR (added/copied/modified/renamed) *.rs
        # files this PR changed. Deleted paths are not rustfmt inputs. skip_children
        # keeps a crate-root path from re-checking untouched sibling modules that
        # still carry pre-existing rustfmt debt. Repo-wide drift is a follow-up PR.
        run: files="$(git diff --diff-filter=ACMR --name-only "origin/${GITHUB_BASE_REF:-dev}...HEAD" -- '*.rs')" && { [ -z "$files" ] || rustfmt --check --config skip_children=true -- $files; }
      - name: Clippy, warnings denied
        # Advisory until the repo-wide lint-debt cleanup PR lands, then blocking.
        # The differential format gate above is the blocking new-debt guard today.
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (workspace + gates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    env:
      # Same accounting-registry producer the Buck gate targets inject as
      # OYA_CI_PRODUCER_BIN (artifact-accountability and sibling live-corpus
      # tests fail closed without it) and OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER
      # (hook-wiring). Built once below; both names point at that binary.
      OYA_CI_PRODUCER_BIN: ${{ github.workspace }}/target/debug/oya-cloud-ci-accounting-registry-app
      OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER: ${{ github.workspace }}/target/debug/oya-cloud-ci-accounting-registry-app
      OYA_CI_ENFORCEMENT_LIVENESS_CLAUDE_SETTINGS: ${{ github.workspace }}/.claude
      OYA_CI_ENFORCEMENT_LIVENESS_CODEX_HOOKS: ${{ github.workspace }}/.codex
      OYA_CI_ENFORCEMENT_LIVENESS_HOOKS_DIR: ${{ github.workspace }}/tools/hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history: gate crates derive facts from git (merge-base, scm faces).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      # The face materializer shells out to buck2 internally to build its sibling
      # face tools; the digest-pinned installer is the bridge it has always used.
      - name: Install pinned buck2 (digest-verified)
        shell: bash
        run: infra/ci/install-buck2.sh
      # buck2's builds need the full pinned toolchain (clippy/rustfmt components);
      # rustup must finish before buck2 runs or its downloads race (known class).
      - name: Pre-provision pinned toolchain components
        # Full default profile (rustc+cargo+std+clippy+rustfmt): the materializer's buck2
        # build resolves the triple-named toolchain through rustup; pre-installing everything
        # makes those rustup calls no-ops and avoids the concurrent-download race.
        run: rustup toolchain install --profile default && rustc --version
      # Materialize generated faces before tests: several gate crates consume them.
      - name: Materialize generated faces
        run: cargo run --locked -p ci-generated-artifact-freshness --bin oya-cloud-ci-materialize-generated-faces -- --repo-root . --github-event
      # Shared accounting-registry producer for OYA_CI_PRODUCER_BIN and
      # OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER. Step name is a frozen
      # workflow_inline_shell baseline key — do not rename.
      - name: Build enforcement-liveness producer
        run: cargo build --locked -p ci-artifact-inventory-registry --bin oya-cloud-ci-accounting-registry-app
      # Every workspace member, including the whole ci/facade gate fleet, runs here.
      - name: Workspace tests
        run: cargo test --locked --workspace
      # kernel/ is a nested workspace (ADR-0512 carve-out) the root workspace excludes.
      - name: Kernel workspace tests
        run: cargo test --locked --manifest-path kernel/Cargo.toml
      # Live hub-exclusivity admission: rejects a second open PR touching a hub path
      # declared under specs/integ-branch-envelopes.json#hubs.paths.
      - name: Live hub-exclusivity admission
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --locked -p ci-affected-target-set --bin oya-cloud-ci-hub-exclusivity -- --repo-root . --live-open-prs --repo "$GITHUB_REPOSITORY" --candidate-pr "${{ github.event.pull_request.number }}"
      # Generated outputs are never contributor merge surfaces: reject non-deletion
      # edits to tracked generated artifacts (diff streamed to the policy binary).
      - name: Reject non-deletion generated output edits
        if: ${{ github.event_name != 'push' }}
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: git diff --find-renames --name-status "origin/${BASE_REF}...HEAD" | cargo run --locked -p ci-generated-artifact-policy --bin oya-cloud-ci-generated-output-diff-policy -- --manifest registry/generated-artifact-control-plane.json --repo-root .

  live-postgres-adapters:
    name: live-postgres-adapters (RLS / CDC / SCIM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oya_ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && psql --version
      - name: Bootstrap roles and schemas (adapters)
        env:
          ADMIN_PASSWORD: oya_ci_pg_admin_local_only
          APP_PASSWORD: oya_ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-oya_ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-oya_ci_pg_app_local_only}"; if [ -f /run/oya-ci-postgres/admin-password ]; then admin_password="$(cat /run/oya-ci-postgres/admin-password)"; fi; if [ -f /run/oya-ci-postgres/app-password ]; then app_password="$(cat /run/oya-ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYA_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYA_PG_APP_URL=postgres://oya_app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          ADMIN_PSQL=(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='oya_app') THEN EXECUTE format('CREATE ROLE oya_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (adapters)
        env:
          OYA_DATA_LIVE_POSTGRES: "1"
          OYA_DATA_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_DATA_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_OUTBOX_LIVE_POSTGRES: "1"
          OYA_OUTBOX_POSTGRES_ADMIN_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_OUTBOX_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_URL: ${{ env.OYA_PG_ADMIN_URL }}
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: RUST_TEST_THREADS=1 cargo test --locked -p oya-data-sql-adapter-sqlx -p oya-data-outbox-adapter-postgres -p tenancy-tenant-lifecycle-store-postgres -p identity-scim-store-postgres

  live-postgres-facades:
    name: live-postgres-facades (tenant lifecycle / SCIM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oya_ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client && psql --version
      - name: Bootstrap roles and schemas (facades)
        env:
          ADMIN_PASSWORD: oya_ci_pg_admin_local_only
          APP_PASSWORD: oya_ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-oya_ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-oya_ci_pg_app_local_only}"; if [ -f /run/oya-ci-postgres/admin-password ]; then admin_password="$(cat /run/oya-ci-postgres/admin-password)"; fi; if [ -f /run/oya-ci-postgres/app-password ]; then app_password="$(cat /run/oya-ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYA_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYA_PG_APP_URL=postgres://oya_app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          ADMIN_PSQL=(psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='oya_app') THEN EXECUTE format('CREATE ROLE oya_app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" -f iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO oya_app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','oya_app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (facades)
        env:
          OYA_BACKBONE_LIVE_POSTGRES: "1"
          OYA_BACKBONE_POSTGRES_APP_URL: ${{ env.OYA_PG_APP_URL }}
        run: RUST_TEST_THREADS=1 cargo test --locked -p iam-identity-service -p tenancy-tenant-lifecycle-app

  cross-platform-smoke:
    name: cross-platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.97.1"
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-${{ matrix.os }}
      - name: Install pinned buck2 (digest-verified)
        shell: bash
        run: infra/ci/install-buck2.sh
      - name: Pre-provision pinned toolchain components
        # Full default profile (rustc+cargo+std+clippy+rustfmt): the materializer's buck2
        # build resolves the triple-named toolchain through rustup; pre-installing everything
        # makes those rustup calls no-ops and avoids the concurrent-download race.
        run: rustup toolchain install --profile default && rustc --version
      - name: Materialize generated faces
        run: cargo run --locked -p ci-generated-artifact-freshness --bin oya-cloud-ci-materialize-generated-faces -- --repo-root . --github-event
      - name: Cross-platform smoke tests
        run: cargo test --locked -p ci-scm-facts-snapshot

  # Fan-in: the single required context. Green IFF lint, test, and both live-postgres
  # lanes are green. The cross-platform lane is soft: its failure never blocks merge.
  oya-ci-required:
    name: oya-ci-required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint, test, live-postgres-adapters, live-postgres-facades, cross-platform-smoke]
    steps:
      - name: Fan-in verdict
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.live-postgres-adapters.result }}" = "success" ] && [ "${{ needs.live-postgres-facades.result }}" = "success" ] && exit 0 || exit 1

  # Dual-emit of the forever public status string alongside the legacy protected context.
  # The branch-protection flip to `merge-admission-required` is a founder-only setting change.
  merge-admission-required:
    name: merge-admission-required
    runs-on: ubuntu-latest
    if: ${{ always() && needs.oya-ci-required.result == 'success' }}
    needs:
      - oya-ci-required
    steps:
      - name: Dual-emit forever title
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: true
