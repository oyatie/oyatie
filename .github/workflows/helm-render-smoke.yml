# Advisory Helm render smoke.
#
# WHY THIS EXISTS: nothing in this repository has ever rendered a chart. There are
# 81 microservice charts (~1,500 files) and five workflows, none of which runs
# `helm template`. That is how `intelligence` came to keep a BUCK file inside
# `templates/` — Helm renders everything under `templates/`, so a Buck build file is
# parsed as a Kubernetes manifest and the chart cannot render at all.
#
# WHY ADVISORY, NOT REQUIRED (for now): the render count is already clean — 80 render, 1 skipped,
# 0 failing — so the usual objection to promotion does not apply. It stays advisory in the change
# that introduces it because a gate should prove itself on real CI runs before anything depends on
# it, not because anything is known to be broken. The job prints its failure count, so promotion to
# a required context is an observable criterion rather than a matter of opinion: when this has run
# green for a while, wire it into oya-ci-required.
#
# CHARTS THAT NEED MORE THAN A DIGEST: three charts declare a second image or a required
# deployment value with no default. Those are not chart defects — the gate simply has to supply
# every required fixture value. They are listed in FIXTURE_ARGS below.
#
# SKIPPED, not failed: a chart whose Chart.yaml declares remote dependencies cannot be rendered
# offline (observability pulls loki/tempo from grafana.github.io). Reporting that as a failure
# would be dishonest — nothing is broken, it is out of scope for an offline render. It is counted
# and named separately so the distinction stays visible.
name: helm-render-smoke

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  render:
    name: helm render (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Render every chart
        id: render
        continue-on-error: true
        env:
          # The ADR-0181 guard refuses to render without a real signed digest, and
          # values.yaml ships `digest: ""` because release automation injects it.
          # A fixture digest is therefore required to exercise the templates at all;
          # it never leaves this job and is not a promotion artifact.
          # Every value a chart requires with no default. The ADR-0181 guard refuses to render
          # without a signed digest and values.yaml ships digest:"" because release automation
          # injects it, so fixtures are required to exercise the templates at all. Charts with a
          # second image (svidOperator, operator) need their own digest. None of this leaves the
          # job or becomes a promotion artifact.
          FIXTURE_ARGS: >-
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
            --set svidOperator.image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
            --set operator.image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
            --set svidOperator.cellId=cell-test-001
        run: |
          set -uo pipefail
          ok=0; fail=0; skip=0; failed=""; skipped=""
          while IFS= read -r chart; do
            dir=$(dirname "$chart")
            # strip the leading './' that find(1) emits: a release name may not start with '.'
            name=$(printf '%s' "${dir#./}" | sed 's|/iac/k8s/helm||; s|/|-|g')
            if grep -q '^dependencies:' "$chart"; then
              skip=$((skip+1)); skipped="$skipped $name"; continue
            fi
            # shellcheck disable=SC2086
            if helm template "$name" "$dir" $FIXTURE_ARGS >/dev/null 2>"/tmp/$name.err"; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); failed="$failed $name"
              printf '::warning title=helm render failed::%s\n' "$dir"
              sed -n '1,3p' "/tmp/$name.err" | sed 's/^/    /'
            fi
          done < <(find . -path ./target -prune -o -name Chart.yaml -path '*/iac/k8s/helm/*' -print | sort)
          printf '\nrendered ok: %s\nskipped (remote chart deps): %s\nfailed: %s\n' "$ok" "$skip" "$fail"
          printf 'skipped charts:%s\n' "$skipped"
          printf 'failing charts:%s\n' "$failed"
          printf 'fail_count=%s\n' "$fail" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          echo "Advisory only — this job never blocks a merge."
          echo "Charts failing to render: ${{ steps.render.outputs.fail_count }}"
          echo "Promote to a required context once this reaches 0."
