# check-substrates — substrate-of-substrate dependency DAG checks (ADR-0280 §D-3).
#
# Authority: ADR-0280 (Substrate-of-Substrate Dependency Doctrine; Accepted, amended by ADR-0520 +
# ADR-0562). This workflow + the named lane `oya-check-substrate-dependency-dag-acyclicity` are
# prescribed VERBATIM by ADR-0280 §status prerequisite #3 ("The CI lane
# `oya-check-substrate-dependency-dag-acyclicity` is registered in
# `.github/workflows/check-substrates.yml` and runs on every pull request targeting `dev`") and §D-3.
#
# RELATIONSHIP TO ADR-0515 ONE-CANONICAL-CI (oya-ci-required.yml): ADR-0280 predates the ADR-0515
# CI consolidation. This lane is authored at the ADR-0280-mandated surface (check-substrates.yml +
# the named lane) because that is the doctrine's explicit prerequisite for promoting the acyclicity
# invariant from advisory to BLOCKER. Folding this lane into the oya-ci-required gate matrix is a
# follow-up the cloud-ci-platform owners sequence once the validator graduates per ADR-0139; doing
# it here would couple a Phase-0 reorg lane to the canonical-CI fan-in, out of this lane's scope.
#
# The acyclicity invariant is `advisory-until-dag-spec-lands-and-validator-green` (ADR-0280
# enforcement_status). With specs/substrate-dependency-dag.json now landed (§D-1 v1.0.0 verbatim)
# and this validator GREEN on it + RED on the cycle fixtures, the lane is wired; promotion to a
# BLOCKER required context is the cloud-ci-platform door per ADR-0139.

name: check-substrates

on:
  workflow_dispatch:
  push:
    # ADR-0280 §D-3: the lane runs on dev, staging, production, and main.
    branches: [dev, staging, production, main]
  pull_request:
    branches: [dev, staging, production, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-substrates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── ADR-0280 §D-3: oya-check-substrate-dependency-dag-acyclicity.
  #    1. Parse + schema-validate specs/substrate-dependency-dag.json (§D-1 required fields).
  #    2. Tarjan SCC: any SCC > 1 (or a self-loop) is a cycle -> exit 1 (R-12, no exception path).
  #    3. forbidden_edges_assertion honoured: a forbidden edge present -> exit 1.
  #    4. Kahn topo-sort coherence: bootstrap_order MUST equal the derived sort -> mismatch exit 1.
  #    The buck2 lane is PRIMARY (founder buck2-first directive); the RED cycle fixtures
  #    (tests/fixtures/dag-cycles/) MUST fail the validator and the real DAG MUST pass.
  oya-check-substrate-dependency-dag-acyclicity:
    name: oya-check-substrate-dependency-dag-acyclicity
    # OWNED FLEET, not hosted. GitHub-hosted runners are unavailable to this account: every
    # `ubuntu-latest` job here has terminated in ~2s with steps=0, runner_name empty and no log
    # blob at all (`BlobNotFound`) — an admission failure, not a gate verdict. Probed across the
    # five most recent runs (30605865889, 30605857132, 30531366207, 30512117350, 30499122616);
    # all five identical. That is the same condition that moved the required lane to `oya-arm64`
    # in PR #1450, and it left THIS lane silently red on `dev` ever since.
    #
    # Nothing in this job is hosted-specific: checkout, install-buck2.sh (switches on `uname -m`
    # and carries an aarch64 digest pin), rustup against rust-toolchain.toml, buck2 build/test,
    # and an artifact upload. There is no `services:` block, so the Docker-daemon constraint that
    # keeps the two gate-live-postgres-* jobs on hosted does not apply here.
    #
    # ADR-0280 §D-3 prescribes this FILE and this LANE NAME verbatim; it says nothing about the
    # runner, so the lane's authored surface is unchanged.
    runs-on: oya-arm64
    steps:
      # actions/checkout@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # ── PRIMARY: buck2-first verification (founder buck2-first directive). buck2 is the BUILD
      #    TOOL (like cargo/rustc), installed as a digest-pinned prebuilt release.
      - name: Install buck2 (digest-pinned prebuilt release)
        run: infra/ci/install-buck2.sh

      # Pre-provision the pinned toolchain ONCE, serially, before parallel buck2 compile actions
      # (rustup is not concurrency-safe; mirrors the oya-ci-required buck2 lane).
      - name: Pre-provision pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
          cargo --version

      - name: buck2 build (validator crate + cycle fixtures)
        run: |
          set -euo pipefail
          buck2 build \
            //ci/facade/dependency-graph-acyclicity:ci-dependency-graph-acyclicity \
            //ci/facade/dependency-graph-acyclicity:oya-cloud-ci-substrate-dependency-dag-acyclicity-bin

      - name: buck2 test (pure-kernel RED cycle classes + live-corpus GREEN gate)
        run: |
          set -euo pipefail
          buck2 test \
            //ci/facade/dependency-graph-acyclicity:ci-dependency-graph-acyclicity-unittest \
            //ci/facade/dependency-graph-acyclicity:ci-dependency-graph-acyclicity-gate

      # ── Run the validator binary over the canonical DAG and emit machine-readable evidence to
      #    evidence/governance-lane/ (ADR-0280 §D-3 step 9; evidence/ is the house evidence root,
      #    owned by cloud-ci-platform + reachability-registered).
      - name: Validate canonical DAG + emit evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/governance-lane
          bin="$(buck2 build //ci/facade/dependency-graph-acyclicity:oya-cloud-ci-substrate-dependency-dag-acyclicity-bin --show-output | awk 'NF>1 {print $2}')"
          log="evidence/governance-lane/substrate-dependency-dag-validation-${GITHUB_SHA:-local}.log"
          "${bin}" --repo-root . | tee "${log}"
          echo "evidence written to ${log}"

      # NO cargo step: cargo build/test is RETIRED in this repo (tools/hooks/no-cargo-enforcer.sh;
      # founder buck2-only directive 2026-05-29). buck2 build + buck2 test above are the sole
      # verification authority for this lane.

      - name: Upload DAG validation evidence
        # actions/upload-artifact@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: substrate-dependency-dag-validation
          path: evidence/governance-lane/substrate-dependency-dag-validation-*.log
          if-no-files-found: warn
