      - "crates/oya-shared-outbox-broker-http-adapter/**"
      - "crates/oya-shared-transactional-outbox-worker-app/**"
      - "crates/oya-shared-transactional-outbox-poller-app/**"
      - "crates/oya-shared-transactional-outbox-runtime-tokio-app/**"
      - "crates/oya-policy-cedar-domain/**"
      - "microservices/cloud-iac/iac/oyatie-cloud-provider/argocd/apps/backbone-microservices-applicationset.yaml"
      - "microservices/messenger/iac/k8s/helm/**"
      - "microservices/mail/iac/k8s/helm/**"
      - "microservices/social/iac/k8s/helm/**"
      - "microservices/community/iac/k8s/helm/**"
      - "microservices/messenger/iac/helm/**"
      - "microservices/mail/iac/helm/**"
      - "microservices/social/iac/helm/**"
      - "microservices/community/iac/helm/**"
      - "microservices/messenger/ci/Jenkinsfile"
      - "microservices/mail/ci/Jenkinsfile"
      - "microservices/social/ci/Jenkinsfile"
      - "microservices/community/ci/Jenkinsfile"
      - "microservices/messenger/manifest.json"
      - "microservices/mail/manifest.json"
      - "microservices/social/manifest.json"
      - "microservices/community/manifest.json"
      - "tasks/plan.md"
      - "tasks/todo.md"
      - "evidence/multispectrum/backbone-microservices-*.json"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: backbone-microservices-ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package-matrix:
    name: backbone-microservices-ci-${{ matrix.microservice }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - microservice: messenger
            packages: >-
              oya-messenger-app
              oya-connect-messenger-domain
              oya-messenger-message-stream-api
              oya-messenger-message-stream-usecase
              oya-messenger-message-stream-rest
              oya-messenger-message-stream-grpc
              oya-messenger-message-stream-adapter-postgres
              oya-shared-postgres-command-kernel
              oya-shared-postgres-command-adapter-sqlx
              oya-shared-hyperscaler-metrics-kernel
              oya-shared-hyperscaler-metrics-adapter-prometheus
              oya-shared-hyperscaler-metrics-adapter-otlp
              oya-shared-protocol-parity-kernel
              oya-shared-protocol-transport-kernel
              oya-shared-protocol-transport-retry-app
              oya-shared-backbone-proto-contracts-kernel
              oya-shared-backbone-grpc-generated-adapter
              oya-shared-backbone-grpc-transport-adapter
              oya-shared-backbone-rest-runtime-adapter
              oya-shared-transactional-outbox-kernel
              oya-shared-transactional-outbox-adapter-sqlx
              oya-shared-transactional-outbox-dispatch-app
              oya-shared-outbox-broker-http-adapter
              oya-shared-transactional-outbox-worker-app
              oya-shared-transactional-outbox-poller-app
              oya-shared-transactional-outbox-runtime-tokio-app
              oya-policy-cedar-domain
          - microservice: mail
            packages: >-
              oya-mail-mailbox-store-app
              oya-connect-mail-domain
              oya-mail-mailbox-store-api
              oya-mail-mailbox-store-usecase
              oya-mail-mailbox-store-rest
              oya-mail-mailbox-store-grpc
              oya-mail-mailbox-store-adapter-postgres
              oya-shared-postgres-command-kernel
              oya-shared-postgres-command-adapter-sqlx
              oya-shared-hyperscaler-metrics-kernel
              oya-shared-hyperscaler-metrics-adapter-prometheus
              oya-shared-hyperscaler-metrics-adapter-otlp
              oya-shared-protocol-parity-kernel
              oya-shared-protocol-transport-kernel
              oya-shared-protocol-transport-retry-app
              oya-shared-backbone-proto-contracts-kernel
              oya-shared-backbone-grpc-generated-adapter
              oya-shared-backbone-grpc-transport-adapter
              oya-shared-backbone-rest-runtime-adapter
              oya-shared-transactional-outbox-kernel
              oya-shared-transactional-outbox-adapter-sqlx
              oya-shared-transactional-outbox-dispatch-app
              oya-shared-outbox-broker-http-adapter
              oya-shared-transactional-outbox-worker-app
              oya-shared-transactional-outbox-poller-app
              oya-shared-transactional-outbox-runtime-tokio-app
              oya-policy-cedar-domain
          - microservice: social
            packages: >-
              oya-social-app
              oya-connect-social-domain
              oya-social-post-composition-api
              oya-social-post-composition-usecase
              oya-social-post-composition-rest
              oya-social-post-composition-grpc
              oya-social-post-composition-adapter-postgres
              oya-shared-postgres-command-kernel
              oya-shared-postgres-command-adapter-sqlx
              oya-shared-hyperscaler-metrics-kernel
              oya-shared-hyperscaler-metrics-adapter-prometheus
              oya-shared-hyperscaler-metrics-adapter-otlp
              oya-shared-protocol-parity-kernel
              oya-shared-protocol-transport-kernel
              oya-shared-protocol-transport-retry-app
              oya-shared-backbone-proto-contracts-kernel
              oya-shared-backbone-grpc-generated-adapter
              oya-shared-backbone-grpc-transport-adapter
              oya-shared-backbone-rest-runtime-adapter
              oya-shared-transactional-outbox-kernel
              oya-shared-transactional-outbox-adapter-sqlx
              oya-shared-transactional-outbox-dispatch-app
              oya-shared-outbox-broker-http-adapter
              oya-shared-transactional-outbox-worker-app
              oya-shared-transactional-outbox-poller-app
              oya-shared-transactional-outbox-runtime-tokio-app
              oya-policy-cedar-domain
          - microservice: community
            packages: >-
              oya-community-post-store-app
              oya-community-post-store-domain
              oya-community-post-store-api
              oya-community-post-store-usecase
              oya-community-post-store-rest
              oya-community-post-store-grpc
              oya-community-post-store-adapter-postgres
              oya-shared-postgres-command-kernel
              oya-shared-postgres-command-adapter-sqlx
              oya-shared-hyperscaler-metrics-kernel
              oya-shared-hyperscaler-metrics-adapter-prometheus
              oya-shared-hyperscaler-metrics-adapter-otlp
              oya-shared-protocol-parity-kernel
              oya-shared-protocol-transport-kernel
              oya-shared-protocol-transport-retry-app
              oya-shared-backbone-proto-contracts-kernel
              oya-shared-backbone-grpc-generated-adapter
              oya-shared-backbone-grpc-transport-adapter
              oya-shared-backbone-rest-runtime-adapter
              oya-shared-transactional-outbox-kernel
              oya-shared-transactional-outbox-adapter-sqlx
              oya-shared-transactional-outbox-dispatch-app
              oya-shared-outbox-broker-http-adapter
              oya-shared-transactional-outbox-worker-app
              oya-shared-transactional-outbox-poller-app
              oya-shared-transactional-outbox-runtime-tokio-app
              oya-policy-cedar-domain
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch dev base for Buck2 affected graph
        run: git fetch origin dev --depth=1
      - name: Require Buck2 runtime
        run: buck2 --version
      - name: Buck2 authority policy scan
        run: buck2 build //:buck2-authority-policy-check
      - name: Buck2 affected build/test for backbone package matrix
        env:
          OYA_BACKBONE_MICROSERVICE: ${{ matrix.microservice }}
          OYA_BACKBONE_PACKAGES: ${{ matrix.packages }}
        run: infra/ci/buck2-affected-gate.sh origin/dev HEAD


  governance-smoke:
    name: backbone-microservices-ci-governance-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require Buck2 runtime
        run: buck2 --version
      - name: Buck2 authority policy scan
        run: buck2 build //:buck2-authority-policy-check
      - name: Buck2 oya binary smoke
        run: buck2 uquery //oya/developer-sdk/crates/oya-dev-cli:oya
      - name: Parse backbone evidence, proto contracts, Gateway chart seams, tenant workload labels, and shared catalog rows
        run: |
          ruby -rjson -ryaml -e '
          http_route_required = [
            "apiVersion: gateway.networking.k8s.io/v1",
            "kind: HTTPRoute",
            "parentRefs:",
            "backendRefs:",
            "oyatie.com/non-claim:",
          ]
          deployment_required = [
            "kind: Deployment",
            "readinessProbe:",
            "livenessProbe:",
            "runtimeClassName:",
            "automountServiceAccountToken:",
            "resources:",
            "securityContext:",
            "topologySpreadConstraints:",
            "topology.kubernetes.io/zone",
            "kubernetes.io/hostname",
            "whenUnsatisfiable: ScheduleAnyway",
            "maxSkew: 1",
            "oya.io/tenant-id:",
            "oya.io/cost-center:",
            "oya.io/workload-class:",
            "oya.io/regulatory-pack:",
            "oyatie.com/dogfood-substrate:",
            "oyatie.com/product-goal:",
          ]
          rendered_deployment_required = deployment_required + [
            "oyatie.com/non-claim:",
          ]
          service_account_required = [
            "apiVersion: v1",
            "kind: ServiceAccount",
            "automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}",
            "oya.io/tenant-id:",
            "oya.io/cost-center:",
            "oya.io/workload-class:",
            "oya.io/regulatory-pack:",
            "oyatie.com/dogfood-substrate:",
            "oyatie.com/product-goal:",
            "oyatie.com/non-claim:",
          ]
          rendered_service_account_required = [
            "apiVersion: v1",
            "kind: ServiceAccount",
            "automountServiceAccountToken: false",
            "oya.io/tenant-id:",
            "oya.io/cost-center:",
            "oya.io/workload-class:",
            "oya.io/regulatory-pack:",
            "oyatie.com/dogfood-substrate:",
            "oyatie.com/product-goal:",
            "oyatie.com/non-claim:",
          ]
          network_policy_required = [
            "apiVersion: networking.k8s.io/v1",
            "kind: NetworkPolicy",
            "policyTypes:",
            "Ingress",
            "Egress",
            "podSelector:",
            "namespaceSelector:",
            "kubernetes.io/metadata.name:",
            "oya.io/tenant-id:",
            "oya.io/cost-center:",
            "oya.io/workload-class:",
            "oya.io/regulatory-pack:",
            "oyatie.com/dogfood-substrate:",
            "oyatie.com/product-goal:",
            "oyatie.com/non-claim:",
          ]
          rendered_network_policy_required = [
            "apiVersion: networking.k8s.io/v1",
            "kind: NetworkPolicy",
            "policyTypes:",
            "Ingress",
            "Egress",
            "podSelector:",
            "namespaceSelector:",
            "kubernetes.io/metadata.name: oya-gateway",
            "kubernetes.io/metadata.name: kube-system",
            "kubernetes.io/metadata.name: observability",
            "oya.io/tenant-id:",
            "oya.io/cost-center:",
            "oya.io/workload-class:",
            "oya.io/regulatory-pack:",
            "oyatie.com/dogfood-substrate:",
            "oyatie.com/product-goal:",
            "oyatie.com/non-claim:",
          ]
          argocd_tenant_label_values = {
            "oya.io/tenant-id" => "fd001-dogfood",
            "oya.io/cost-center" => "fd001-backbone",
            "oya.io/workload-class" => "app",
            "oya.io/regulatory-pack" => "generic",
            "oyatie.com/dogfood-substrate" => "oyatie-cloud",
            "oyatie.com/product-goal" => "fd-001",
          }
          argocd_helm_parameters = [
            "workloadLabels.tenantId",
            "workloadLabels.costCenter",
            "workloadLabels.workloadClass",
            "workloadLabels.regulatoryPack",
            "workloadLabels.dogfoodSubstrate",
            "workloadLabels.productGoal",
          ]
          expected_topology_keys = ["topology.kubernetes.io/zone", "kubernetes.io/hostname"]
          validate_template_topology = lambda do |path, text|
            block = text[/topologySpreadConstraints:\n(?<block>.*?)\n      containers:/m, "block"]
            raise "#{path} missing topologySpreadConstraints block before containers" unless block
            expected_topology_keys.each do |key|
              raise "#{path} missing topology key #{key} in topologySpreadConstraints block" unless block.include?("topologyKey: #{key}")
            end
            max_skew_count = block.scan(/^\s*- maxSkew: 1$/).length
            raise "#{path} expected exactly two topology constraints with maxSkew 1, found #{max_skew_count}" unless max_skew_count == 2
            schedule_anyway_count = block.scan(/^\s*whenUnsatisfiable: ScheduleAnyway$/).length
            raise "#{path} expected exactly two ScheduleAnyway topology constraints, found #{schedule_anyway_count}" unless schedule_anyway_count == 2
            selector_count = block.scan(/labelSelector:\n\s+matchLabels:\n\s+app\.kubernetes\.io\/name: \{\{ \.Values\.microservice\.id \| quote \}\}/m).length
            raise "#{path} expected each topology constraint to select app.kubernetes.io/name from .Values.microservice.id, found #{selector_count}" unless selector_count == 2
          end
          validate_rendered_topology = lambda do |path, doc|
            pod_name = doc.dig("spec", "template", "metadata", "labels", "app.kubernetes.io/name")
            raise "#{path} missing pod-template app.kubernetes.io/name label" if pod_name.to_s.empty?
            constraints = doc.dig("spec", "template", "spec", "topologySpreadConstraints") || []
            raise "#{path} expected topologySpreadConstraints array" unless constraints.is_a?(Array)
            expected_topology_keys.each do |key|
              matching = constraints.select { |constraint| constraint["topologyKey"] == key }
              raise "#{path} expected one topology constraint for #{key}, found #{matching.length}" unless matching.length == 1
              constraint = matching.first
              raise "#{path} #{key} maxSkew must be 1" unless constraint["maxSkew"] == 1
              raise "#{path} #{key} must use ScheduleAnyway" unless constraint["whenUnsatisfiable"] == "ScheduleAnyway"
              selector_name = constraint.dig("labelSelector", "matchLabels", "app.kubernetes.io/name")
              raise "#{path} #{key} selector #{selector_name.inspect} does not match pod label #{pod_name.inspect}" unless selector_name == pod_name
            end
          end
          validate_rendered_service_account = lambda do |path, doc|
            raise "#{path} is not a ServiceAccount" unless doc["kind"] == "ServiceAccount"
            raise "#{path} must disable service account token automount" unless doc["automountServiceAccountToken"] == false
            labels = doc.dig("metadata", "labels") || {}
            argocd_tenant_label_values.each do |key, expected|
              raise "#{path} label #{key} mismatch" unless labels[key] == expected
            end
            non_claim = doc.dig("metadata", "annotations", "oyatie.com/non-claim").to_s
            raise "#{path} missing static rendered serviceaccount non-claim" unless non_claim.include?("static-rendered-serviceaccount-only")
          end
          validate_rendered_network_policy = lambda do |path, doc|
            raise "#{path} is not a NetworkPolicy" unless doc["kind"] == "NetworkPolicy"
            labels = doc.dig("metadata", "labels") || {}
            argocd_tenant_label_values.each do |key, expected|
              raise "#{path} label #{key} mismatch" unless labels[key] == expected
            end
            policy_types = doc.dig("spec", "policyTypes") || []
            raise "#{path} missing Ingress policy type" unless policy_types.include?("Ingress")
            raise "#{path} missing Egress policy type" unless policy_types.include?("Egress")
            app_name = labels["app.kubernetes.io/name"]
            selector_name = doc.dig("spec", "podSelector", "matchLabels", "app.kubernetes.io/name")
            raise "#{path} selector #{selector_name.inspect} does not match label #{app_name.inspect}" unless selector_name == app_name
            ingress_namespaces = (doc.dig("spec", "ingress") || []).flat_map do |rule|
              (rule["from"] || []).map { |peer| peer.dig("namespaceSelector", "matchLabels", "kubernetes.io/metadata.name") }
            end.compact
            raise "#{path} must allow ingress only from oya-gateway namespace by default" unless ingress_namespaces == ["oya-gateway"]
            egress_namespaces = (doc.dig("spec", "egress") || []).flat_map do |rule|
              (rule["to"] || []).map { |peer| peer.dig("namespaceSelector", "matchLabels", "kubernetes.io/metadata.name") }
            end.compact
            raise "#{path} missing DNS egress namespace" unless egress_namespaces.include?("kube-system")
            raise "#{path} missing OTLP egress namespace" unless egress_namespaces.include?("observability")
            non_claim = doc.dig("metadata", "annotations", "oyatie.com/non-claim").to_s
            raise "#{path} missing static rendered networkpolicy non-claim" unless non_claim.include?("static-rendered-networkpolicy-only")
          end
          ARGV.each do |path|
            text = File.read(path)
            if path.end_with?(".json")
              JSON.parse(text)
            elsif path.end_with?(".proto")
              raise "#{path} is empty" if text.empty?
            elsif path.end_with?("/templates/httproute.yaml")
              missing = http_route_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
            elsif path.end_with?("/templates/deployment.yaml")
              missing = deployment_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
              validate_template_topology.call(path, text)
            elsif path.end_with?("/templates/serviceaccount.yaml")
              missing = service_account_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
            elsif path.end_with?("/templates/networkpolicy.yaml")
              missing = network_policy_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
            elsif path.include?("/rendered/") && path.end_with?("/deployment.yaml")
              doc = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
              missing = rendered_deployment_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
              raise "#{path} must disable service account token automount" unless doc.dig("spec", "template", "spec", "automountServiceAccountToken") == false
              validate_rendered_topology.call(path, doc)
            elsif path.include?("/rendered/") && path.end_with?("/serviceaccount.yaml")
              doc = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
              missing = rendered_service_account_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
              validate_rendered_service_account.call(path, doc)
            elsif path.include?("/rendered/") && path.end_with?("/networkpolicy.yaml")
              doc = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
              missing = rendered_network_policy_required.reject { |needle| text.include?(needle) }
              raise "#{path} missing #{missing.join(", " )}" unless missing.empty?
              validate_rendered_network_policy.call(path, doc)
            elsif path.end_with?("/values.yaml")
              doc = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
              raise "#{path} must default topologySpread.enabled to true for FD-001 dogfood static snapshots" unless doc.dig("topologySpread", "enabled") == true
              raise "#{path} must default serviceAccount.automountToken to false for FD-001 dogfood app workloads" unless doc.dig("serviceAccount", "automountToken") == false
              raise "#{path} must default networkPolicy.enabled to true for FD-001 dogfood app workload boundaries" unless doc.dig("networkPolicy", "enabled") == true
            elsif path.end_with?("backbone-microservices-applicationset.yaml")
              doc = YAML.safe_load(text, permitted_classes: [Symbol], aliases: true)
              raise "#{path} is not an ApplicationSet" unless doc["kind"] == "ApplicationSet"
              elements = doc.dig("spec", "generators", 0, "list", "elements") || []
              raise "#{path} expected four generator elements" unless elements.length == 4
              elements.each do |element|
                argocd_tenant_label_values.each do |key, expected|
                  field = key.split("/").last.gsub("-", "")
                  field = "tenantId" if key == "oya.io/tenant-id"
                  field = "costCenter" if key == "oya.io/cost-center"
                  field = "workloadClass" if key == "oya.io/workload-class"
                  field = "regulatoryPack" if key == "oya.io/regulatory-pack"
                  field = "dogfoodSubstrate" if key == "oyatie.com/dogfood-substrate"
                  field = "productGoal" if key == "oyatie.com/product-goal"
                  raise "#{path} #{element["microservice"]} #{field} mismatch" unless element[field] == expected
                end
                raise "#{path} missing chart path #{element["chartPath"]}" unless File.directory?(element["chartPath"])
              end
              parameter_names = (doc.dig("spec", "template", "spec", "source", "helm", "parameters") || []).map { |parameter| parameter["name"] }
