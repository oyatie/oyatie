# TAP nightly (ADR-0719 D-10): arm64 nextest. Not a required context.
name: nightly

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextest-arm64:
    name: nextest (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "nightly-2026-09-10"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: nextest
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: cargo-ci-nightly-arm64
          cache-workspace-crates: "true"
      - name: Workspace tests (arm64)
        run: cargo nextest run --locked --workspace --profile ci
