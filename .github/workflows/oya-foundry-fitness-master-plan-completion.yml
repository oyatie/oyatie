name: oya-foundry-fitness-master-plan-completion

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Required-check workflow for the master-plan-completion status-honesty lane.
#
# The lane (`oya gate validate master-plan-completion`) port of
# `scripts/audit-master-plan-completion.py` (per
# `evidence/audits/shell-python-replacement-audit-2026-05-15.md` row B-7)
# verifies that:
#   - no phase in `specs/masterplan.json#live_implementation_index` is
#     marked complete while any child implementation_plan is still in an
#     incomplete state ({stub, planned, pending, blocked, in-flight,
#     probe-green}), and
#   - every complete IP id is referenced by at least one evidence JSON
#     file under `evidence/foundation/`, `evidence/gitops-vcs/`, or
#     `evidence/agentic-pipeline/`.
#
# This addresses NEXT-004 from
# `evidence/goals/masterplan-actionability-durable-goal-2026-05-16.json`
# (status-honesty hard gate; GAP-STATUS-HONESTY). The kernel/dispatcher
# was already present at
# `crates/oya-dev-cli/src/commands/gate/master_plan_completion_audit.rs`
# and registered in
# `crates/oya-foundry-gate-catalog-domain::AGGREGATED_VALIDATE_LANES`
# (so `oya verify --include-deferred` runs it locally). This workflow
# wires it as a per-PR required-check candidate. Branch-protection
# `required_status_checks` inclusion is tracked as
# `F-MASTERPLAN-COMPLETION-BRANCH-PROTECTION` (admin step requiring
# `gh api PUT repos/.../branches/dev/protection`).
#
# Posture: surface-all-failures (M01-P09-IP-007). Single-job workflow;
# the job ID matches the required-check name exactly so the
# branch-protection ruleset resolves to this status one-for-one when
# the F-MASTERPLAN-COMPLETION-BRANCH-PROTECTION fixuptask lands.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-foundry-fitness-master-plan-completion-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-master-plan-completion:
    name: oya-foundry-fitness-master-plan-completion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: Validate master-plan-completion (status-honesty)
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo run -p oya-dev-cli -- gate validate master-plan-completion
