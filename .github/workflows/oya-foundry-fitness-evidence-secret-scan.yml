name: oya-foundry-fitness-evidence-secret-scan

# Per-PR secret-scan over evidence/multispectrum/ and evidence/audit-chain.jsonl.
#
# Motivation: multispectrum facet findings strings + audit-chain payloads
# carry agent-authored prose that can — by accident — embed credentials,
# API tokens, or session secrets surfaced from environment / debugger /
# log output. F-EVIDENCE-SECRET-SCAN (created during M01-P13-IP-002
# self-critique F9 compliance review, 2026-05-14) called this out as a
# high-priority gap. SOC2/FedRAMP review treats the evidence corpus as
# auditor-readable; secret material must not land there.
#
# Scope: deliberately narrow. Scans only evidence/multispectrum/ and
# evidence/audit-chain.jsonl on every PR. Patterns are high-signal,
# low-false-positive (common SaaS API tokens, AWS keys, PEM private keys,
# bearer tokens, JWT-like structures). The scanner is a small shell
# script committed at scripts/evidence-secret-scan.sh — purposely no
# third-party action, no binary download — deterministic and reviewable.
#
# Failure mode: any match → workflow fails → PR cannot merge. The PR
# author rewrites the offending evidence row (using redacted form) and
# re-runs. No automatic redaction is performed — that would mask intent.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oya-foundry-fitness-evidence-secret-scan-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-evidence-secret-scan:
    name: oya-foundry-fitness-evidence-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan evidence/ for secret-shape tokens
        run: bash scripts/evidence-secret-scan.sh evidence/multispectrum evidence/audit-chain.jsonl
