name: oya-foundry-fitness-evidence-secret-scan

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Per-PR secret-scan over evidence/multispectrum/ and evidence/audit-chain.jsonl.
#
# Motivation: multispectrum facet findings strings + audit-chain payloads
# carry agent-authored prose that can — by accident — embed credentials,
# API tokens, or session secrets surfaced from environment / debugger /
# log output. F-EVIDENCE-SECRET-SCAN (created during M01-P13-IP-002
# self-critique F9 compliance review, 2026-05-14) called this out as a
# high-priority gap. SOC2/FedRAMP review treats the evidence corpus as
# auditor-readable; secret material must not land there.
#
# Scope: deliberately narrow. Scans only evidence/multispectrum/ and
# evidence/audit-chain.jsonl on every PR. Patterns are high-signal,
# low-false-positive (common SaaS API tokens, AWS keys, PEM private keys,
# bearer tokens, JWT-like structures). The scanner is a small shell
# script committed at scripts/evidence-secret-scan.sh — purposely no
# third-party action, no binary download — deterministic and reviewable.
#
# Failure mode: any match → workflow fails → PR cannot merge. The PR
# author rewrites the offending evidence row (using redacted form) and
# re-runs. No automatic redaction is performed — that would mask intent.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-foundry-fitness-evidence-secret-scan-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-evidence-secret-scan:
    name: oya-foundry-fitness-evidence-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan evidence/ for secret-shape tokens
        run: bash scripts/evidence-secret-scan.sh evidence/multispectrum evidence/audit-chain.jsonl
