name: docs-graph-drift

# Generator health check for the architecture dashboard (docs/architecture/product-graph.html).
#
# The dashboard is GENERATED from SSOT by an owned-Rust CI pipeline tool
# (tools/oya-architecture-graph-generator-app) — NOT a developer-facing `oya`
# subcommand. As of ADR-0613 the dashboard AND its masterplan input are DE-COMMITTED
# (materialization_mode: not-tracked-in-git); byte-parity against a committed HTML copy
# is intentionally RETIRED. Dashboard freshness/determinism is now enforced by the
# REQUIRED generated-artifact-freshness gate (regenerate-twice determinism canary over the
# controller-materialized path). This job's remaining role is to build the generator and run
# its owned golden/regeneration tests — materializing the de-committed masterplan input first,
# since it is absent from a fresh checkout.
#
# Transitional runner model: GitHub Actions executes this feedback adapter today,
# but the durable policy source is the owned Rust generator/gate and future cloud-ci
# runner. Intentionally ABSENT from the branch-protection required set
# (.github/branch-protection.yaml) — feedback only; branch protection is NOT
# changed here.

on:
  pull_request:
    paths:
      # product-graph.html + masterplan.generated.json are de-committed (ADR-0613, untracked) and
      # can no longer appear in a PR file list; trigger only on the generator + its tracked inputs.
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/machine-readable/architecture-graph.json"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/machine-readable/architecture-graph.json"

permissions:
  contents: read

concurrency:
  group: docs-graph-drift-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-graph-drift:
    name: docs-graph-drift
    # OWNED FLEET, same admission condition as the canary above and check-substrates (#1453):
    # hosted runners are not admitted for this account, so this lane has been red since
    # 2026-07-26 without ever executing a step. No `services:` block and no pwsh/Windows/macOS
    # dependency, so nothing here is hosted-specific.
    runs-on: ubuntu-latest  # binding linux-amd64 hosted (ARC retired)
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # fetch-depth: 0 so merge-base(HEAD, origin/dev) resolves — the materializer's
          # landed-plan carve-out needs it to exclude the committed move-plans (matches the
          # required legs; a shallow checkout would fail-closed on the >1-plan guard).
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: 1.97.1
      - name: Cache Buck2 official prebuilt
        # actions/cache@v6.1.0 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/oya-ci-buck2-2026-07-15
          # The cached asset is always SHA-256 verified by infra/ci/install-buck2.sh before execution.
          key: docs-graph-drift-${{ runner.os }}-buck2-2026-07-15-ecc3d807dd0b0feff1a423688bd598263b8339d223e685578a87196456c19d95
          restore-keys: |
            docs-graph-drift-${{ runner.os }}-buck2-2026-07-15-
      - name: Materialize de-committed inputs, build + test the generator
        run: |
          set -euo pipefail
          infra/ci/install-buck2.sh
          PATH="$(tail -n1 "${GITHUB_PATH}"):${PATH}"; export PATH
          rustc --version
          # masterplan.generated.json (ADR-0613 de-commit) is absent from a fresh checkout;
          # materialize it (and the other on-demand faces) from SSOT before the generator and its
          # golden/regeneration tests consume it. Dashboard freshness/determinism is enforced by the
          # required generated-artifact-freshness gate (regenerate-twice determinism canary), not by a
          # byte-parity-against-committed check here (retired with the de-commit).
          buck2 run root//ci/facade/generated-artifact-freshness:oya-cloud-ci-materialize-generated-faces-bin -- --repo-root .
          buck2 build root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator
          buck2 test \
            root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator-regeneration-test \
            root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator-golden-test
