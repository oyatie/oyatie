name: docs-graph-drift

# Drift gate for the architecture dashboard (docs/architecture/product-graph.html).
#
# The dashboard is GENERATED from SSOT by an owned-Rust CI pipeline tool
# (tools/oya-architecture-graph-generator-app) — NOT a developer-facing `oya`
# subcommand. This job rebuilds the generator, regenerates the dashboard, and
# byte-compares the result against the committed HTML. If the committed file is
# stale, the job fails (red) and the author must run the generator and commit.
#
# Transitional runner model: GitHub Actions executes this feedback adapter today,
# but the durable policy source is the owned Rust generator/gate and future cloud-ci
# runner. Intentionally ABSENT from the branch-protection required set
# (.github/branch-protection.yaml) — feedback only; branch protection is NOT
# changed here.

on:
  pull_request:
    paths:
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/architecture/product-graph.html"
      - "docs/machine-readable/architecture-graph.json"
      - "docs/machine-readable/masterplan.generated.json"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/architecture/product-graph.html"
      - "docs/machine-readable/architecture-graph.json"
      - "docs/machine-readable/masterplan.generated.json"

permissions:
  contents: read

concurrency:
  group: docs-graph-drift-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-graph-drift:
    name: docs-graph-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Buck2 (digest-pinned official prebuilt)
        run: infra/ci/install-buck2.sh
      - name: Pre-provision pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - name: Build + test the architecture-graph generator
        run: |
          set -euo pipefail
          buck2 build root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator
          buck2 test \
            root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator-regeneration-test \
            root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator-golden-test
      - name: Regenerate the dashboard
        run: |
          set -euo pipefail
          generator=$(buck2 build --show-output \
            root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator \
            | awk '$1 == "root//tools/oya-architecture-graph-generator-app:oya-architecture-graph-generator" { print $2 }')
          test -n "${generator}"
          "${generator}" --write
      - name: Fail on dashboard drift
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/architecture/product-graph.html \
            || { echo "::error::docs/architecture/product-graph.html is stale; run the generator (--write) and commit."; exit 1; }
