name: docs-graph-drift

# Drift gate for the architecture dashboard (docs/architecture/product-graph.html).
#
# The dashboard is GENERATED from SSOT by an owned-Rust CI pipeline tool
# (tools/oya-architecture-graph-generator-app) — NOT a developer-facing `oya`
# subcommand. This job rebuilds the generator, regenerates the dashboard, and
# byte-compares the result against the committed HTML. If the committed file is
# stale, the job fails (red) and the author must run the generator and commit.
#
# Authority model: GitHub Actions (this workflow) is the SOLE live gating check
# (D-CICD-AUTHORITY; the legacy CI bridge was retired 2026-06-07). Intentionally ABSENT from
# the branch-protection required set (.github/branch-protection.yaml) — feedback only;
# branch protection is NOT changed here.

on:
  pull_request:
    paths:
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/architecture/product-graph.html"
      - "docs/machine-readable/architecture-graph.json"
      - "docs/machine-readable/masterplan.generated.json"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/docs-graph-drift.yml"
      - "tools/oya-architecture-graph-generator-app/**"
      - "docs/architecture/product-graph.template.html"
      - "docs/architecture/product-graph.html"
      - "docs/machine-readable/architecture-graph.json"
      - "docs/machine-readable/masterplan.generated.json"

permissions:
  contents: read

concurrency:
  group: docs-graph-drift-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-graph-drift:
    name: docs-graph-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v6.0.3 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        # actions/cache@v5.0.5 — Node 24 runtime; pinned to immutable release commit for hermetic CI.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Lockfile-scoped cache avoids per-commit cache churn; cargo still validates sources.
          key: docs-graph-drift-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            docs-graph-drift-${{ runner.os }}-
      - name: Build + test the architecture-graph generator
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cargo build --locked -p oya-architecture-graph-generator-app
          cargo test --locked -p oya-architecture-graph-generator-app
      - name: Regenerate the dashboard
        run: |
          set -euo pipefail
          cargo run --locked -q -p oya-architecture-graph-generator-app \
            --bin oya-architecture-graph-generator -- --write
      - name: Fail on dashboard drift
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/architecture/product-graph.html \
            || { echo "::error::docs/architecture/product-graph.html is stale; run the generator (--write) and commit."; exit 1; }
