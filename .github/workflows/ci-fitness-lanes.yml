name: ci-fitness-lanes

# P22-m02-exit-gate: All 14 fitness lanes run in BLOCKER mode (no --report-only).
# Any violation causes CI to fail hard, blocking merge.
# History: P20 introduced lane binaries in report-only mode; P21 verified all planes
# at L4+; P22 flips every lane to BLOCKER as M02-substrate exit gate.
# ADR refs: ADR-0056 v4.1 (check-namespace), ADR-0062 (quality/perf bar),
#            ADR-0063 (doc-coverage LEAN-A5), ADR-0064 §7/§8 (canonical-base-neutrality
#            + cross-pack-refusal).

on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-fitness-lanes-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # ── statelessness ─────────────────────────────────────────────────────────
  statelessness-check:
    name: statelessness-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: statelessness-check
      - name: statelessness-check (BLOCKER)
        run: cargo run -p oya-check-statelessness -- --workspace

  # ── shardability ──────────────────────────────────────────────────────────
  shardability-check:
    name: shardability-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: shardability-check
      - name: shardability-check (BLOCKER)
        run: cargo run -p oya-check-shardability -- --migrations-dir migrations/

  # ── doc-coverage (LEAN-A5; ADR-0063) ─────────────────────────────────────
  doc-coverage-check:
    name: doc-coverage-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: doc-coverage-check
      - name: doc-coverage-check (BLOCKER; --blocker required — CLI exits 1 only with --blocker)
        run: cargo run -p oya-check-documentation -- --workspace --blocker

  # ── architecture: dependency-direction ────────────────────────────────────
  architecture-dependency-direction:
    name: architecture-dependency-direction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: architecture-dependency-direction
      - name: architecture-dependency-direction (BLOCKER)
        run: cargo run -p oya-check-architecture -- dependency-direction --workspace

  # ── architecture: layer-correctness ───────────────────────────────────────
  architecture-layer-correctness:
