name: oya-foundry-fitness-supply-chain

# Posture: surface-all-failures (M-CC-P02-IP-007).
#   - `oya-foundry-fitness-supply-chain-adr0039`,
#     `oya-vcs-provider-execution`, and
#     `oya-foundry-fitness-release-artifact-attestation` each run
#     INDEPENDENTLY. No cross-job `needs:` chains (the rollup job at
#     the bottom is the ONE permitted aggregator and only exists
#     because branch-protection matches on a single context name).
#     One CI cycle exposes every gate's failure mode at once instead
#     of one-per-retry.
#   - `oya-foundry-fitness-release-artifact-attestation` is still
#     tag-gated via `if:` (only fires on `refs/tags/v*`), but with
#     `if: always()` so a failure in the ADR-0039 sub-gate does NOT
#     skip it on a release tag.
#   - Overall workflow conclusion is the AND of every job's
#     conclusion (GitHub required-check semantics).

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  oya-foundry-fitness-supply-chain-adr0039:
    name: oya-foundry-fitness-supply-chain-adr0039
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ADR-0039 supply-chain wiring
        run: cargo run -p oya-dev-cli -- gate validate supply-chain --require-adr0039-evidence


  oya-vcs-provider-execution:
    name: oya-vcs-provider-execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: bash scripts/install-trivy-ci.sh
      - name: Execute Oya VCS provider proof
        run: cargo run -q -p oya-foundry-vcs-provider-execution-gate-app -- --mode ci --emit-evidence target/oya-vcs-provider-execution/provider-execution-proof.json
      - name: Upload provider proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: oya-vcs-provider-execution-proof
          path: |
            target/oya-vcs-provider-execution/provider-execution-proof.json
            target/oya-vcs-provider-execution/trivy.sarif
          if-no-files-found: error

  oya-foundry-fitness-release-artifact-attestation:
    name: oya-foundry-fitness-release-artifact-attestation
    runs-on: ubuntu-latest
    # `if: always()` + tag-gate: still only fires on release tags, but no
    # longer skips when `oya-foundry-fitness-supply-chain-adr0039` fails —
    # that gate's failure surfaces in the same CI cycle as any
    # release-time issues.
    # No `needs:` per surface-all-failures posture (M-CC-P02-IP-007).
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Execute ADR-0039 release supply-chain script
        run: scripts/supply-chain-adr0039.sh registry/release/images.yaml
      - name: Validate release supply-chain evidence records
        run: cargo run -p oya-dev-cli -- gate validate release-supply-chain --phase release

  # Rollup aggregator: exposes a single required-check status whose name
  # matches `oya-foundry-fitness-supply-chain` exactly (the value listed in
  # `.github/branch-protection.yaml`). Branch-protection rulesets match on
  # JOB ID, not workflow name, so the sub-jobs above (`static-adr0039-wiring`,
  # `oya-vcs-provider-execution`, `release-artifact-attestation`) cannot
  # themselves satisfy that required check. This job needs: the PR-relevant
  # sub-jobs and succeeds iff every one of them concluded successful (or
  # was skipped for non-PR-relevant reasons — release-artifact-attestation
  # is tag-gated and not part of PR scope).
  oya-foundry-fitness-supply-chain:
    name: oya-foundry-fitness-supply-chain
    runs-on: ubuntu-latest
    needs:
      - oya-foundry-fitness-supply-chain-adr0039
      - oya-vcs-provider-execution
    if: always()
    steps:
      - name: Rollup sub-job results
        env:
          ADR0039_RESULT: ${{ needs.oya-foundry-fitness-supply-chain-adr0039.result }}
          PROVIDER_RESULT: ${{ needs.oya-vcs-provider-execution.result }}
        run: |
          echo "oya-foundry-fitness-supply-chain-adr0039=$ADR0039_RESULT"
          echo "oya-vcs-provider-execution=$PROVIDER_RESULT"
          if [ "$ADR0039_RESULT" != "success" ] || [ "$PROVIDER_RESULT" != "success" ]; then
            echo "::error::supply-chain rollup failed: one or more sub-jobs did not succeed" >&2
            exit 1
          fi
          echo "supply-chain rollup passed: all sub-jobs succeeded"
