name: oya-governance-oya-verify-ci-mirror-coverage

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-governance-oya-verify-ci-mirror-coverage-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-governance-oya-verify-ci-mirror-coverage:
    name: oya-governance-oya-verify-ci-mirror-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report-only verify mirror coverage assertion
        continue-on-error: true
        run: |
          set -euo pipefail
          source="crates/oya-dev-cli/src/commands/verify.rs"
          missing=0
          require() {
            if ! grep -Fq -- "$1" "$source"; then
              echo "::warning::verify.rs missing mirror command: $1"
              missing=1
            fi
          }
          require "cargo fmt --check"
          require "cargo check --workspace --all-targets"
          require "cargo clippy --workspace --all-targets -- -D warnings"
          require "cargo nextest run --workspace"
          require "oya gate run-all --ci-required"
          exit "$missing"
