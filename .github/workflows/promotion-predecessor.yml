# Promotion rungs: staging ← dev, canary ← staging, production ← canary.
# Feature work enters at `dev`. Skipping a rung is born-blocking.
# Checks that HEAD is a descendant of the predecessor ref, not that the
# feature-branch *name* equals the predecessor.
name: promotion-predecessor

on:
  pull_request:
    branches: [staging, canary, production]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  promotion-predecessor:
    name: promotion-predecessor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require predecessor rung
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          case "$BASE" in
            staging) want=dev ;;
            canary) want=staging ;;
            production) want=canary ;;
            *) echo "unexpected promotion base '$BASE'"; exit 1 ;;
          esac
          git fetch origin "$want" --depth=1
          if ! git merge-base --is-ancestor "origin/$want" HEAD; then
            echo "promote $BASE only from commits already on $want"
            exit 1
          fi
