name: oya-foundry-next-queue-automerge

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

on:
  pull_request:
    types: [closed, ready_for_review]
  workflow_dispatch:
    inputs:
      base_branch:
        description: "PR base branch to advance"
        required: false
        default: "dev"
      start_pr:
        description: "First PR number in the active numeric queue"
        required: false
        default: "111"
      after_pr:
        description: "Merged PR number that triggered this tick; 0 selects the queue floor"
        required: false
        default: "0"
      dry_run:
        description: "Print selected next PR without enabling auto-merge"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

concurrency:
  group: next-queue-automerge-${{ github.event.inputs.base_branch || github.event.pull_request.base.ref || 'dev' }}
  cancel-in-progress: false

jobs:
  next-queue-automerge:
    name: next-queue-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.action == 'closed' &&
       github.event.pull_request.base.ref == 'dev') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.event.pull_request.base.ref == 'dev')
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || github.event.pull_request.base.ref || 'dev' }}
          fetch-depth: 0

      - name: Trigger auto-merge for next queue PR only
        env:
          GH_TOKEN: ${{ github.token }}
          OYA_BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.OYA_BRANCH_PROTECTION_READ_TOKEN }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.pull_request.base.ref || 'dev' }}
          START_PR: ${{ github.event.inputs.start_pr || vars.OYA_MERGE_QUEUE_START_PR || '111' }}
          AFTER_PR: ${{ github.event.inputs.after_pr || (github.event.action == 'closed' && github.event.pull_request.number) || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(
            --base-branch "$BASE_BRANCH"
            --base-ref "origin/$BASE_BRANCH"
            --start-pr "$START_PR"
            --after-pr "$AFTER_PR"
            --required-review-check oya-pr-review
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          scripts/trigger-next-queue-automerge.sh "${args[@]}"
