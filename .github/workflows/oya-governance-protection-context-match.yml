name: oya-governance-protection-context-match

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Asserts that every `required_status_checks` context in
# `.github/branch-protection.yaml` is the `name:` field of some
# job in some `.github/workflows/*.yml`. Catches the silent-bypass
# class where branch-protection lists a context no workflow posts;
# GitHub then waits forever for a check_run that never arrives,
# and the protected branch becomes silently un-merge-able.
#
# Lane: oya-governance-protection-context-match (per-pr).
# Compatibility: this workflow still posts
# `oya-foundry-fitness-protection-context-match` as a mirror job during
# the staged branch-protection rollout. The governance-named job is the
# canonical required context for new config.
# Kernel: crates/oya-check-protection-context-match.
# Runner: crates/oya-dev-cli/src/protection_context_match_gate.rs.
#
# History: this lane exists because of the 2026-05-15 PR #3
# merge-block — `branch-protection.yaml` listed `cargo-fmt`
# (the YAML job-key) while pr-tests.yml posted check_runs as
# `cargo fmt --check` (the workflow `name:` field). 5 of 9
# required gates were silently non-enforcing for the duration of
# the drift. This lane prevents the recurrence and now also fails
# closed when live GitHub branch protection requires fewer checks
# than the canonical repo policy.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-governance-protection-context-match-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-governance-protection-context-match:
    name: oya-governance-protection-context-match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: oya gate validate protection-context-match
        env:
          GH_TOKEN: ${{ secrets.OYA_BRANCH_PROTECTION_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::OYA_BRANCH_PROTECTION_READ_TOKEN is required; GitHub branch-protection status-check APIs require Administration read permission, which GITHUB_TOKEN cannot request."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/branches/dev/protection/required_status_checks" \
            --jq '.contexts' > live-required-status-checks.json
      - name: oya gate validate protection-context-match
        env:
          GH_TOKEN: ${{ secrets.OYA_BRANCH_PROTECTION_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::OYA_BRANCH_PROTECTION_READ_TOKEN is required; GitHub branch-protection status-check APIs require Administration read permission, which GITHUB_TOKEN cannot request."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/branches/dev/protection/required_status_checks" \
            --jq '.contexts' > live-required-status-checks.json
      - name: oya gate validate protection-context-match
        env:
          GH_TOKEN: ${{ secrets.OYA_BRANCH_PROTECTION_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo run -q -p oya-dev-cli -- gate validate protection-context-match

  oya-foundry-fitness-protection-context-match:
    name: oya-foundry-fitness-protection-context-match
    needs: oya-governance-protection-context-match
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror migrated governance lane result
        env:
          GOVERNANCE_RESULT: ${{ needs.oya-governance-protection-context-match.result }}
        run: |
          set -euo pipefail
          echo "oya-governance-protection-context-match=${GOVERNANCE_RESULT}"
          test "${GOVERNANCE_RESULT}" = "success"
