name: pr-tests

# Required-check workflow for every PR + push to main per the 2026-05-15
# audit finding "0 workflows run cargo test/cargo nextest on pull_request."
#
# Posture: surface-all-failures (M-CC-P02-IP-007).
#   - Each gate (fmt / clippy / check / nextest / oya-vcs-admission) runs
#     INDEPENDENTLY. There are no cross-job `needs:` chains here — a
#     failure in one gate does NOT skip the others. One CI cycle therefore
#     exposes ALL failures simultaneously, instead of revealing them one
#     per re-trigger.
#   - Overall workflow conclusion is the AND of every gate's conclusion
#     (GitHub's default required-check semantics on the branch-protection
#     ruleset).
#   - History: today's PR #3 cascade (broken action SHA → missing nextest
#     profile → missing shebang) surfaced one issue per CI cycle because
#     `cargo-nextest needs: [cargo-check]` made nextest skip on check
#     failure. That dependency has been removed.
#
# Branch-protection ruleset (`.github/branch-protection.yaml`) lists these
# job IDs as required checks. The ruleset is deployed on `main` (gh api
# PUT, M-CC-P02-IP-001), so every PR to `main` blocks until these jobs
# pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo-fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  cargo-clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-check:
    name: cargo check --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo check --workspace --all-targets
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo check --workspace --all-targets

  cargo-nextest:
    name: cargo nextest run --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `needs:` — runs independently per surface-all-failures posture
    # (M-CC-P02-IP-007). If `cargo-check` fails for one reason, nextest
    # may still surface different failures (missing test binaries, broken
    # toolchain installs, missing nextest profile, etc.) in the SAME CI
    # cycle instead of waiting a re-trigger to expose them.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with:
          tool: cargo-nextest
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo nextest run --workspace
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace --no-fail-fast

  oya-vcs-admission:
    name: Oya VCS admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: oya-vcs-admission
      - name: Install Trivy
        run: bash scripts/install-trivy-ci.sh
      - name: Oya VCS admission
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: scripts/check-oya-vcs-admission.sh
