name: pr-tests

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Required-check workflow for every PR + push to dev per the 2026-05-15
# audit finding "0 workflows run cargo test/cargo nextest on pull_request."
#
# Posture: surface-all-failures (M01-P09-IP-007).
#   - Each gate (fmt / clippy / check / nextest / oya-vcs-admission) runs
#     INDEPENDENTLY. There are no cross-job `needs:` chains here — a
#     failure in one gate does NOT skip the others. One CI cycle therefore
#     exposes ALL failures simultaneously, instead of revealing them one
#     per re-trigger.
#   - Overall workflow conclusion is the AND of every gate's conclusion
#     (GitHub's default required-check semantics on the branch-protection
#     ruleset).
#   - History: today's PR #3 cascade (broken action SHA → missing nextest
#     profile → missing shebang) surfaced one issue per CI cycle because
#     `cargo-nextest needs: [cargo-check]` made nextest skip on check
#     failure. That dependency has been removed.
#
# Branch-protection ruleset (`.github/branch-protection.yaml`) lists these
# job IDs as required checks. The ruleset is deployed on `dev` (gh api
# PUT, M01-P09-IP-001), so every PR to `dev` blocks until these jobs
# pass.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo-fmt:
    name: cargo-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  cargo-clippy:
    name: cargo-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo clippy --workspace --all-targets --keep-going -- -D warnings
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        # `--keep-going` (stable since 1.74) continues clippy across every
        # crate even after one fails — surfaces ALL lint errors in a
        # single CI run instead of stopping at the first crate's first
        # error. Aligns with the surface-all-failures CI doctrine
        # elsewhere in this workflow (no `needs:` chains; nextest uses
        # `--no-fail-fast`). Three CI cycles on PR #3 (2026-05-15)
        # surfaced one clippy crate-failure at a time; this flag is the
        # canonical fix.
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

  cargo-check:
    name: cargo-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo check --workspace --all-targets --keep-going
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        # `--keep-going` continues checking every crate even after one
        # fails — surfaces ALL compile errors in a single CI run
        # (same surface-all-failures doctrine as the clippy step
        # above and `--no-fail-fast` on nextest).
        run: cargo check --workspace --all-targets --keep-going

  cargo-nextest:
    name: cargo-nextest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No `needs:` — runs independently per surface-all-failures posture
    # (M01-P09-IP-007). If `cargo-check` fails for one reason, nextest
    # may still surface different failures (missing test binaries, broken
    # toolchain installs, missing nextest profile, etc.) in the SAME CI
    # cycle instead of waiting a re-trigger to expose them.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with:
          tool: cargo-nextest
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: cargo nextest run --workspace
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace --no-fail-fast

  oya-vcs-admission:
    name: oya-vcs-admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: oya-vcs-admission
      - name: Install Trivy
        run: cargo run -p oya-dev-cli -- supply-chain install-trivy
      - name: Oya VCS admission
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo run -q -p oya-foundry-vcs-admission-gate-app

  oya-git-cutover-inventory:
    name: oya-git-cutover-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Inventory oya vcs policy-ratchet invocations
        run: bash tools/hooks/oya-git-cutover-inventory.sh

  oya-governance-vacuous-green:
    name: oya-governance-vacuous-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify vacuous-green gate detects a bad fixture
        run: bash tools/governance/adr-0221-governance-gates.sh vacuous-green

  oya-governance-adr-orphan-citation:
    name: oya-governance-adr-orphan-citation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify orphan-citation gate detects a bad fixture
        run: bash tools/governance/adr-0221-governance-gates.sh orphan-citation

  oya-governance-version-pin-source-citation:
    name: oya-governance-version-pin-source-citation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify version-pin gate detects bad fixtures
        run: bash tools/governance/adr-0221-governance-gates.sh version-pin

  oya-governance-buildability-line-count:
    name: oya-governance-buildability-line-count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify buildability-line-count gate detects bad and good fixtures
        run: bash tools/governance/adr-0221-governance-gates.sh buildability-line-count
