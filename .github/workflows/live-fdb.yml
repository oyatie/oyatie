# Unique live-FoundationDB proof for the mail store adapter. Callee for
# presubmit (path-gated) and postsubmit once pipeline wires the callers; until
# then it runs on its own path-scoped pull_request trigger and by dispatch.
# Runs #[ignore] live_* tests only, through .github/scripts/live-fdb.sh, which
# owns the server container and the lane rows; empty selection is red.
name: live-fdb

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - app/mail/adapters/store-fdb/**
      - .github/workflows/live-fdb.yml
      - .github/scripts/live-fdb.sh

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  live-fdb:
    name: mail live FoundationDB
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "nightly-2026-09-10"
          components: clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: nextest
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: cargo-ci-x86-mail-fdb
          cache-workspace-crates: "true"
      - name: Lint the FoundationDB build
        run: |
          set -euo pipefail
          cargo clippy --locked -p mail-store-fdb --all-targets --features fdb -- -D warnings
      - name: Live FoundationDB tests (live_* only)
        env:
          OYATIE_MAIL_LIVE_FDB: "1"
        run: |
          set -euo pipefail
          test "${OYATIE_MAIL_LIVE_FDB}" = "1"
          .github/scripts/live-fdb.sh
