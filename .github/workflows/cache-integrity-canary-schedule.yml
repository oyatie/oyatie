# Privilege-separated scheduler for the reusable cache-integrity executor.
# Cold evidence is always produced with contents-read only. The reader invocation
# does not exist unless activation is explicit and either the license is already
# warm or a trusted dev workflow_dispatch requests the first pre-license proof.
name: cache-integrity-canary-schedule

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      prelicense_probe:
        description: Run the explicit manual warm proof before licensing reads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cache-integrity-canary
  cancel-in-progress: false

jobs:
  cold:
    name: cold from-empty proof (zero OIDC permission)
    uses: ./.github/workflows/cache-integrity-canary.yml
    permissions:
      contents: read
    with:
      prelicense_probe: ${{ inputs.prelicense_probe || false }}

  reader-identity:
    name: activation-gated reader identity and parity verdict
    needs: cold
    if: ${{ always() && needs.cold.result == 'success' && vars.OYA_CAS_IDENTITY_PROOF_ENABLED == 'true' && github.ref == 'refs/heads/dev' && (needs.cold.outputs.warm_licensed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.prelicense_probe)) }}
    uses: ./.github/workflows/cache-integrity-canary.yml
    permissions:
      contents: read
      id-token: write
    with:
      reader_probe: true
      prelicense_probe: ${{ inputs.prelicense_probe || false }}
