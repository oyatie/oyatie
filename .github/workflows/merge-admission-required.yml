# Forever merge-admission workflow filename + public status string.
#
# Sole forever protected check context: `merge-admission-required`
# (matches this filename; dual-emitted from oya-ci-required.yml until quiet cutover).
#
# Event triggers remain on oya-ci-required.yml until a quiet-window cutover that:
#   1) moves pull_request/push/merge_group/workflow_dispatch onto THIS file, and
#   2) leaves oya-ci-required.yml as workflow_call-only body (or inlines via uses:),
# so only ONE full CI graph runs (BAN double full CI).
#
# Protection context flip (oya-ci-required → merge-admission-required) = PAUSE-AND-PAIR.
# This file is workflow_call-only — safe to land while dual-emit job titles stay green.
#
# Retired brands (comments only): oya-ci-required, firewall, cloud-ci-firewall.
# Sub-jobs: admission.* (e.g. admission.policy, admission.graph-affected).
# Domain: domain.<envelope>.stabilize. Trunk: trunk.postsubmit → trunk.health.
name: merge-admission-required
on:
  workflow_call:

permissions:
  contents: read

jobs:
  merge-admission-required-filename-anchor:
    name: merge-admission-required (filename anchor)
    runs-on: ubuntu-latest
    steps:
      - name: Forever filename anchor (uses-only; no new inline shell)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: true
