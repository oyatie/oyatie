name: github-lane-unlocker-ci-cd

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  BUCK2_RELEASE: "2026-06-01"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lane-unlocker-fanout:
    name: github-lane-unlocker-lane (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [governance, buck2-authority, rust-llvm-coverage, affected-build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare dev base
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev
      - name: Bootstrap Rust and Buck2 toolchains
        shell: bash
        run: scripts/ci/github-actions-lane-unlocker-bootstrap.sh
      - name: Show Buck2 version
        run: buck2 --version
      - name: Run lane
        run: |
          case "${{ matrix.lane }}" in
            governance)
              python3 scripts/ci/assert-github-lane-unlocker-bridge.py --json
              python3 scripts/ci/assert-repo-hygiene-automation.py --json
              buck2 build //:repo-hygiene-automation-check
              ;;
            buck2-authority)
              python3 scripts/ci/enforce-buck2-authority.py --policy specs/buck2-authority-policy.json
              buck2 build //:github-lane-unlocker-bridge-check //:buck2-authority-policy-check
              ;;
            rust-llvm-coverage)
              buck2 build //:rust-llvm-coverage-runner-contract-check //:rust-llvm-coverage-smoke-check
              ;;
            affected-build)
              infra/ci/buck2-affected-gate.sh origin/dev HEAD
              ;;
          esac

  github-lane-unlocker-required:
    name: github-lane-unlocker-required
    runs-on: ubuntu-24.04-arm
    needs: lane-unlocker-fanout
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bootstrap Rust and Buck2 toolchains
        shell: bash
        run: scripts/ci/github-actions-lane-unlocker-bootstrap.sh
      - name: Aggregate bridge evidence
        run: |
          python3 scripts/ci/assert-github-lane-unlocker-bridge.py --json
          python3 scripts/ci/assert-repo-hygiene-automation.py --json
          buck2 build //:github-lane-unlocker-bridge-check //:repo-hygiene-automation-check

  github-lane-unlocker-cd-dry-run:
    name: github-lane-unlocker-cd-dry-run
    runs-on: ubuntu-24.04-arm
    needs: github-lane-unlocker-required
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bootstrap Rust and Buck2 toolchains
        shell: bash
        run: scripts/ci/github-actions-lane-unlocker-bootstrap.sh
      - name: Validate dry-run bridge only
        run: |
          python3 scripts/ci/assert-github-lane-unlocker-bridge.py --json
          python3 scripts/ci/assert-repo-hygiene-automation.py --json
          buck2 build //:github-lane-unlocker-bridge-check //:repo-hygiene-automation-check
          echo "dry-run bridge only; native release conveyor cutover remains separate"
