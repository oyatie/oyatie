name: oya-foundry-fitness-aspirational-enforcement

# Required-check workflow for the active aspirational-enforcement detector.
# The workflow name and job name intentionally match branch protection exactly.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-foundry-fitness-aspirational-enforcement-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-foundry-fitness-aspirational-enforcement:
    name: oya-foundry-fitness-aspirational-enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: pr-tests
      - name: Validate aspirational enforcement claims
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo run -p oya-dev-cli -- gate validate aspirational-enforcement
