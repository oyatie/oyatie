name: Sync Agent Skills

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Checks addyosmani/agent-skills daily for upstream drift.
# On drift: re-vendors content, updates UPSTREAM.json, opens a review PR.
# Required reviewer: per repo branch-protection policy — do NOT auto-merge.
# The review is the audit point.

on:
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-vendor even if SHA matches'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: Check upstream drift
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      vendored_sha: ${{ steps.compare.outputs.vendored_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream HEAD SHA
        id: upstream
        run: |
          SHA=$(gh api repos/addyosmani/agent-skills/commits/main --jq '.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read vendored SHA
        id: vendored
        run: |
          if [ -f tools/agent-skills/UPSTREAM.json ]; then
            SHA=$(jq -r '.commit_sha' tools/agent-skills/UPSTREAM.json)
          else
            SHA=""
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compare SHAs
        id: compare
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          VENDORED_SHA="${{ steps.vendored.outputs.sha }}"
          FORCE="${{ github.event.inputs.force_sync }}"
          if [ "$UPSTREAM_SHA" != "$VENDORED_SHA" ] || [ "$FORCE" = "true" ]; then
            echo "drift=true"  >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "vendored_sha=$VENDORED_SHA" >> "$GITHUB_OUTPUT"

  validate-vendored:
    name: Validate vendored content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validate-skills.js
        run: |
          if [ -f tools/agent-skills/scripts/validate-skills.js ]; then
            node tools/agent-skills/scripts/validate-skills.js
          else
            echo "validate-skills.js not found — vendored content may be missing; run install.sh first"
            exit 1
          fi

  open-sync-pr:
    name: Re-vendor and open sync PR
    needs: [check-upstream, validate-vendored]
    if: needs.check-upstream.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor upstream tarball
        id: vendor
        run: |
          UPSTREAM_SHA="${{ needs.check-upstream.outputs.upstream_sha }}"
          SKILLS_DIR="tools/agent-skills"

          # Stash oyatie-authored files + extract oyatie-authored UPSTREAM.json fields
          # so they survive the rm -rf below. Per UPSTREAM.json.oyatie_authored_files.
          STASH_DIR=$(mktemp -d)
          OYATIE_FILES=$(jq -r '.oyatie_authored_files[]?' "$SKILLS_DIR/UPSTREAM.json" 2>/dev/null || true)
          for f in $OYATIE_FILES; do
            if [ -f "$SKILLS_DIR/$f" ]; then
              mkdir -p "$STASH_DIR/$(dirname "$f")"
              cp "$SKILLS_DIR/$f" "$STASH_DIR/$f"
            fi
          done
          # Stash oyatie-authored UPSTREAM.json fields (everything except upstream-tracked metadata)
          if [ -f "$SKILLS_DIR/UPSTREAM.json" ]; then
            jq '{inheritance_pattern, oyatie_authored_files, import_targets, structural_invariants_for_sync_pr}' \
              "$SKILLS_DIR/UPSTREAM.json" > "$STASH_DIR/oyatie-fields.json"
          fi

          # Download tarball
          gh api repos/addyosmani/agent-skills/tarball/main > /tmp/skills.tar.gz
          mkdir -p /tmp/skills-extract
          tar -xzf /tmp/skills.tar.gz -C /tmp/skills-extract
          EXTRACTED=$(find /tmp/skills-extract -maxdepth 1 -type d -name 'addyosmani-agent-skills-*' | head -1)

          # Replace vendored directory (exclude .github/)
          rm -rf "$SKILLS_DIR"
          mkdir -p "$SKILLS_DIR"
          rsync -a --exclude='.github/' "$EXTRACTED/" "$SKILLS_DIR/"
          rm -rf "$SKILLS_DIR/.github"

          # Restore oyatie-authored files
          if [ -d "$STASH_DIR" ]; then
            (cd "$STASH_DIR" && find . -type f ! -name 'oyatie-fields.json' \
              -exec sh -c 'mkdir -p "'"$SKILLS_DIR"'/$(dirname "$1")" && cp "$1" "'"$SKILLS_DIR"'/$1"' _ {} \;)
          fi

          # Compute skill/persona/reference counts for UPSTREAM.json
          SKILL_COUNT=$(find "$SKILLS_DIR/skills" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          PERSONA_COUNT=$(find "$SKILLS_DIR/agents" -mindepth 1 -maxdepth 1 -type f -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          REFERENCE_COUNT=$(find "$SKILLS_DIR/references" -mindepth 1 -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')

          # Update UPSTREAM.json (merge upstream-tracked fields with stashed oyatie-authored fields)
          FETCH_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UPSTREAM_FIELDS=$(jq -n \
            --arg sha "$UPSTREAM_SHA" \
            --arg ts "$FETCH_TS" \
            --argjson skills "$SKILL_COUNT" \
            --argjson personas "$PERSONA_COUNT" \
            --argjson refs "$REFERENCE_COUNT" \
            '{
              upstream: "https://github.com/addyosmani/agent-skills",
              commit_sha: $sha,
              fetched_at: $ts,
              license: "MIT",
              license_file: "tools/agent-skills/LICENSE",
              attribution: "Addy Osmani and contributors",
              vendor_method: "tarball-extract",
              vendor_managed_by: "tools/hook-bootstrap/install.sh + .github/workflows/sync-agent-skills.yml",
              manual_edits_prohibited: true,
              sync_policy: "auto-PR on upstream drift; never edit in place",
              skill_count: $skills,
              persona_count: $personas,
              reference_count: $refs
            }')

          if [ -f "$STASH_DIR/oyatie-fields.json" ]; then
            jq -s '.[0] * .[1]' \
              <(echo "$UPSTREAM_FIELDS") \
              "$STASH_DIR/oyatie-fields.json" \
              > "$SKILLS_DIR/UPSTREAM.json"
          else
            echo "$UPSTREAM_FIELDS" > "$SKILLS_DIR/UPSTREAM.json"
          fi

          rm -rf "$STASH_DIR"
          touch "$SKILLS_DIR/.vendored"

          # Fail closed before opening a sync PR: validate the newly downloaded tree
          # and the oyatie inheritance/provenance fields restored into UPSTREAM.json.
          test -f "$SKILLS_DIR/LICENSE"
          test -f "$SKILLS_DIR/INHERITANCE.md"
          test -f "$SKILLS_DIR/scripts/validate-skills.js"
          test -d "$SKILLS_DIR/skills"
          test -d "$SKILLS_DIR/agents"
          test -d "$SKILLS_DIR/references"
          node "$SKILLS_DIR/scripts/validate-skills.js"
          jq -e '
            .license == "MIT" and
            .license_file == "tools/agent-skills/LICENSE" and
            .manual_edits_prohibited == true and
            (.inheritance_pattern | type == "string" and length > 0) and
            (.oyatie_authored_files | index("INHERITANCE.md")) and
            (.import_targets | type == "object") and
            (.structural_invariants_for_sync_pr | type == "array" and length > 0)
          ' "$SKILLS_DIR/UPSTREAM.json" >/dev/null

          echo "upstream_sha_short=${UPSTREAM_SHA:0:12}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream changelog link
        id: changelog
        run: |
          OLD="${{ needs.check-upstream.outputs.vendored_sha }}"
          NEW="${{ needs.check-upstream.outputs.upstream_sha }}"
          if [ -n "$OLD" ]; then
            COMPARE_URL="https://github.com/addyosmani/agent-skills/compare/${OLD}...${NEW}"
          else
            COMPARE_URL="https://github.com/addyosmani/agent-skills/commits/main"
          fi
          echo "url=$COMPARE_URL" >> "$GITHUB_OUTPUT"

      - name: Create sync branch and PR
        run: |
          SHORT_SHA="${{ steps.vendor.outputs.upstream_sha_short }}"
          BRANCH="chore/sync-agent-skills-${SHORT_SHA}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tools/agent-skills/
          git commit -m "chore(vendor): sync agent-skills to upstream ${SHORT_SHA}

          Automated vendor sync from addyosmani/agent-skills.
          Upstream changelog: ${{ steps.changelog.outputs.url }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          PR_BODY=$(cat <<EOF
          ## Automated Agent Skills Sync

          Upstream drift detected in [addyosmani/agent-skills](https://github.com/addyosmani/agent-skills).

          **Upstream changelog:** ${{ steps.changelog.outputs.url }}

          ## Changes
          - Re-vendored \`tools/agent-skills/\` from upstream HEAD
          - Updated \`tools/agent-skills/UPSTREAM.json\` with new SHA + fetch timestamp
          - Preserved oyatie-authored files (per \`UPSTREAM.json.oyatie_authored_files\`)

          ## Review checklist
          - [ ] Review upstream diff for breaking changes to skill structure
          - [ ] Confirm \`validate-skills.js\` passes (required CI check)
          - [ ] Confirm session-start hook payload still references valid skill names
          - [ ] Confirm \`tools/agent-skills/INHERITANCE.md\` survived sync
          - [ ] Merge when satisfied — do NOT auto-merge

          **Attribution:** Lifecycle skills vendored from addyosmani/agent-skills (MIT).
          EOF
          )

          gh pr create \
            --title "chore(vendor): sync agent-skills to ${SHORT_SHA}" \
            --body "$PR_BODY" \
            --label "auto-vendor-sync,agent-skills" \
            --base dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
