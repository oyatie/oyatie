name: oya-foundry-fitness-pr-review

# Reviewer-agent auto-dispatch on CI-green (M-CC-P10-IP-004).
#
# Trigger: AFTER the required-check workflows (`pr-tests` and
# `oya-foundry-fitness-supply-chain`) converge with `conclusion: success`.
# This matches the canonical pipeline state machine:
#   push → CI → fix-loop until green → review → fix-loop until APPROVE → merge
# Review only fires once CI is green, so we never burn reviewer-agent
# cycles on broken builds (audit blocker #4,
# evidence/audits/pipeline-maturity-audit-2026-05-15.md row Stage 5).
#
# The dispatcher binary `oya-foundry-pr-review-dispatcher-app`:
#   - reads per-facet findings from
#     `evidence/pipeline-maturity-glue/ip-004-pr-review/<pr>/<facet>.json`
#     (written by the multispectrum subagent panel per
#     feedback_multispectrum_review_v22 + feedback_multispectrum_adherence_facets);
#   - rolls them up to APPROVE / CHANGES_REQUESTED / REJECT;
#   - posts a single Check Run named `oya-pr-review` (matches the
#     branch-protection required-check binding);
#   - on APPROVE → emits `pr-review-approved` into
#     `registries/cross-cutting/merge-queue-admission-log.json`
#     (consumed by IP-006 merge-queue);
#   - on CHANGES_REQUESTED / REJECT → emits `pr-review-fix-requested`
#     (consumed by IP-005 fix-loop).
#
# Scaffold-pending note: until the per-facet subagent runtime lands
# (TODO captured in evidence/pipeline-maturity-glue/ip-004-reviewer-agent.json
# audit_trail.subagent_runtime_followup), no `<facet>.json` files exist
# and the dispatcher emits APPROVE with `subagent_runtime_pending = true`
# in the rollup. The merge-queue admission consumer (IP-006) MUST refuse
# to trust an APPROVE that carries that flag.

on:
  workflow_run:
    workflows:
      - pr-tests
      - oya-foundry-fitness-supply-chain
    types:
      - completed

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read

concurrency:
  group: oya-pr-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  # Job ID matches the required-check name listed in
  # `.github/branch-protection.yaml::required_status_checks`. Branch
  # protection matches on JOB ID, not workflow name — so this ID MUST
  # stay `oya-pr-review` to satisfy the gate.
  oya-pr-review:
    name: oya-pr-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only fan out review on a green upstream. If pr-tests or
    # supply-chain failed, fix-loop takes over (IP-005); review never
    # runs against red CI.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: oya-pr-review

      - name: Resolve PR number from workflow_run head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api \
            "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "::error::could not resolve PR number for head SHA ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$pr_number"

      - name: Run pr-review dispatcher
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          cargo run -q -p oya-foundry-pr-review-dispatcher-app -- \
            --pr-number "${{ steps.pr.outputs.pr_number }}" \
            --repo-root .

      - name: Upload rollup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oya-pr-review-rollup-${{ steps.pr.outputs.pr_number }}
          path: |
            evidence/pipeline-maturity-glue/ip-004-reviewer-agent.json
            evidence/pipeline-maturity-glue/ip-004-pr-review/${{ steps.pr.outputs.pr_number }}/
            registries/cross-cutting/merge-queue-admission-log.json
          if-no-files-found: warn

      - name: Post rollup as Check Run conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          rollup="evidence/pipeline-maturity-glue/ip-004-reviewer-agent.json"
          if [ ! -f "$rollup" ]; then
            echo "::error::rollup file missing at $rollup" >&2
            exit 1
          fi
          verdict=$(grep -o '"verdict": *"[A-Z_]*"' "$rollup" | head -n1 | sed 's/.*"\([A-Z_]*\)"/\1/')
          pending=$(grep -o '"subagent_runtime_pending": *\(true\|false\)' "$rollup" | head -n1 | awk -F': *' '{print $2}')
          echo "rollup verdict=${verdict} pending=${pending}"
          # Required-check semantics: the cargo run step above already
          # exits non-zero on REJECT-state I/O failures. The Check Run
          # status is implicit in the job conclusion (job success =
          # required-check pass = APPROVE; job failure = block merge).
          if [ "$verdict" = "REJECT" ]; then
            echo "::error::pr-review verdict REJECT — blocking merge" >&2
            exit 1
          fi
          if [ "$verdict" = "CHANGES_REQUESTED" ]; then
            echo "::error::pr-review verdict CHANGES_REQUESTED — fix-loop dispatched via pr-review-fix-requested event" >&2
            exit 1
          fi
          echo "pr-review APPROVE (pending=${pending})"
