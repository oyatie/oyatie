name: oya-foundry-fitness-pr-review

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Fully automated reviewer-agent dispatch on CI-green (M01-P17-IP-004 +
# IP-009). There is no human PR-review gate in the shared-world pipeline:
# branch protection requires the `oya-pr-review` check, and that check is
# produced by the agent review panel below.
#
# Trigger: AFTER the required-check workflows (`pr-tests` and
# `oya-foundry-fitness-supply-chain`) converge with `conclusion: success`.
# This matches the canonical pipeline state machine:
#   push → CI → fix-loop until green → review → fix-loop until APPROVE → merge
# Review only fires once CI is green, so we never burn reviewer-agent
# cycles on broken builds (audit blocker #4,
# evidence/audits/pipeline-maturity-audit-2026-05-15.md row Stage 5).
#
# Runtime and dispatcher contract:
#   - `oya-foundry-subagent-runtime-app fan-out` writes per-facet findings to
#     `evidence/pipeline-maturity-glue/ip-004-pr-review/<pr>/<facet>.json`;
#   - `oya-foundry-pr-review-dispatcher-app` reads those findings from
#     `evidence/pipeline-maturity-glue/ip-004-pr-review/<pr>/<facet>.json`
#     (multispectrum subagent panel per feedback_multispectrum_review_v22 +
#     feedback_multispectrum_adherence_facets);
#   - rolls them up to APPROVE / CHANGES_REQUESTED / REJECT;
#   - posts a single explicit Check Run named `oya-pr-review` on the
#     PR head SHA (matches the branch-protection required-check binding);
#   - on APPROVE → emits `pr-review-approved` into
#     `registry/merge-queue-admission-log.json`
#     (consumed by IP-006 merge-queue);
#   - on CHANGES_REQUESTED / REJECT → emits `pr-review-fix-requested`
#     (consumed by IP-005 fix-loop).
#
# The merge-queue admission consumer refuses APPROVE events carrying
# `subagent_runtime_pending=true`; this workflow therefore runs the runtime
# before the dispatcher and fails the required check if the runtime remains
# pending.

on:
  workflow_run:
    workflows:
      - pr-tests
      - oya-foundry-fitness-supply-chain
    types:
      - completed

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read

concurrency:
  group: oya-pr-review-${{ github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  # Job ID matches the required-check name listed in
  # `.github/branch-protection.yaml::required_status_checks`. Branch
  # protection matches on JOB ID, not workflow name — so this ID MUST
  # stay `oya-pr-review` to satisfy the gate.
  oya-pr-review:
    name: oya-pr-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only fan out review on a green upstream. If pr-tests or
    # supply-chain failed, fix-loop takes over (IP-005); review never
    # runs against red CI.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve PR number and PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          event_pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          event_pr_head_sha=$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")

          pr_number="${event_pr_number}"
          if [ -z "$pr_number" ]; then
            pr_number=$(gh api \
              "repos/${{ github.repository }}/commits/${UPSTREAM_HEAD_SHA}/pulls" \
              --jq '.[0].number // empty')
          fi
          if [ -z "$pr_number" ]; then
            echo "::error::could not resolve PR number for upstream workflow_run SHA ${UPSTREAM_HEAD_SHA}" >&2
            exit 1
          fi

          pr_head_sha=$(gh pr view "${pr_number}" --json headRefOid --jq '.headRefOid // empty')
          if [ -z "$pr_head_sha" ]; then
            echo "::error::could not resolve PR head SHA for PR #${pr_number}" >&2
            exit 1
          fi
          if [ -n "$event_pr_head_sha" ] && [ "$event_pr_head_sha" != "$pr_head_sha" ]; then
            echo "::notice::workflow_run payload PR head ${event_pr_head_sha} differs from live PR head ${pr_head_sha}; binding oya-pr-review to live PR head"
          fi

          {
            echo "pr_number=$pr_number"
            echo "pr_head_sha=$pr_head_sha"
            echo "upstream_head_sha=$UPSTREAM_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$pr_number head=${pr_head_sha} upstream_workflow_run_head=${UPSTREAM_HEAD_SHA}"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.pr_head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: oya-pr-review

      - name: Capture PR review input bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pr_head_sha }}
        run: |
          mkdir -p "evidence/pipeline-maturity-glue/ip-004-pr-review/${PR_NUMBER}"
          metadata_json=$(gh pr view "${PR_NUMBER}" \
            --json number,title,body,headRefName,baseRefName,headRefOid,baseRefOid,author,labels,files)
          base_sha=$(jq -r '.baseRefOid // empty' <<< "$metadata_json")
          head_sha=$(jq -r '.headRefOid // empty' <<< "$metadata_json")
          if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
            echo "::error::could not resolve base/head SHA for PR #${PR_NUMBER}" >&2
            exit 1
          fi
          if [ "$head_sha" != "$PR_HEAD_SHA" ]; then
            echo "::error::live PR head ${head_sha} differs from resolved head ${PR_HEAD_SHA}" >&2
            exit 1
          fi

          {
            echo "PR #${PR_NUMBER}"
            echo
            echo "## PR Metadata"
            printf '%s\n' "$metadata_json"
            echo
            echo "## PR Diff"
            if git fetch --no-tags --depth=1 origin "$base_sha"; then
              git diff --patch --no-ext-diff "$base_sha" "$head_sha"
            else
              echo "Local base fetch failed; falling back to paginated file list."
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[] | "\(.status)\t\(.filename)\t+\(.additions)\t-\(.deletions)"'
            fi
          } > "evidence/pipeline-maturity-glue/ip-004-pr-review/${PR_NUMBER}/review-input.md"

      - name: Run reviewer-agent runtime
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          cargo run -q -p oya-foundry-subagent-runtime-app -- fan-out \
            --pr-number "${{ steps.pr.outputs.pr_number }}" \
            --change-id "${{ steps.pr.outputs.pr_head_sha }}" \
            --templates-dir evidence/pipeline-maturity-glue/ip-004-pr-review/facets \
            --evidence-dir evidence/pipeline-maturity-glue/ip-004-pr-review \
            --user-message-file "evidence/pipeline-maturity-glue/ip-004-pr-review/${{ steps.pr.outputs.pr_number }}/review-input.md" \
            --mode deterministic-mock \
            --tool-tag github-actions-agent-review

      - name: Run pr-review dispatcher
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: |
          cargo run -q -p oya-foundry-pr-review-dispatcher-app -- \
            --pr-number "${{ steps.pr.outputs.pr_number }}" \
            --repo-root . \
            --runtime-mode external

      - name: Upload rollup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oya-pr-review-rollup-${{ steps.pr.outputs.pr_number }}
          path: |
            evidence/pipeline-maturity-glue/ip-004-reviewer-agent.json
            evidence/pipeline-maturity-glue/ip-004-pr-review/${{ steps.pr.outputs.pr_number }}/
            registry/merge-queue-admission-log.json
          if-no-files-found: warn

      - name: Post rollup as Check Run conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_RUNTIME_MODE: deterministic-mock
        run: |
          rollup="evidence/pipeline-maturity-glue/ip-004-reviewer-agent.json"
          verdict="ROLLUP_MISSING"
          pending="unknown"
          conclusion="failure"
          summary="PR #${PR_NUMBER}; head_sha=${HEAD_SHA}; workflow_run=${GITHUB_RUN_ID}; runtime_mode=${REVIEW_RUNTIME_MODE}; deterministic_mock_smoke_only=true; rollup file missing at ${rollup}"

          if [ ! -f "$rollup" ]; then
            echo "::error::rollup file missing at $rollup" >&2
          else
            verdict=$(grep -o '"verdict": *"[A-Z_]*"' "$rollup" | head -n1 | sed 's/.*"\([A-Z_]*\)"/\1/' || true)
            pending=$(grep -o '"subagent_runtime_pending": *\(true\|false\)' "$rollup" | head -n1 | awk -F': *' '{print $2}' || true)
            if [ -z "$verdict" ]; then
              verdict="UNKNOWN"
            fi
            if [ -z "$pending" ]; then
              pending="unknown"
            fi
            if [ "$verdict" = "APPROVE" ] && [ "$pending" = "false" ]; then
              conclusion="success"
            fi
            summary="PR #${PR_NUMBER}; head_sha=${HEAD_SHA}; workflow_run=${GITHUB_RUN_ID}; runtime_mode=${REVIEW_RUNTIME_MODE}; deterministic_mock_smoke_only=true; verdict=${verdict}; subagent_runtime_pending=${pending}"
          fi

          echo "rollup verdict=${verdict} pending=${pending} conclusion=${conclusion} runtime_mode=${REVIEW_RUNTIME_MODE}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="oya-pr-review" \
            -f head_sha="${HEAD_SHA}" \
            -f status="completed" \
            -f conclusion="${conclusion}" \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f output[title]="pr-review ${verdict} (${REVIEW_RUNTIME_MODE})" \
            -f output[summary]="${summary}"

          # Required-check semantics: branch protection binds to the
          # explicit Check Run above because workflow_run jobs attach to
          # the default-branch workflow SHA, not reliably to the PR head.
          if [ "$conclusion" != "success" ]; then
            if [ "$pending" != "false" ]; then
              echo "::error::pr-review runtime still pending — refusing required-check pass" >&2
            elif [ "$verdict" = "CHANGES_REQUESTED" ]; then
              echo "::error::pr-review verdict CHANGES_REQUESTED — fix-loop dispatched via pr-review-fix-requested event" >&2
            else
              echo "::error::pr-review verdict ${verdict} — blocking merge" >&2
            fi
            exit 1
          fi
          echo "pr-review APPROVE (pending=${pending})"
