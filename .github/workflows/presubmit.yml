# TAP cadences (ADR-0719 D-9/D-10): pre-commit / pre-push / presubmit / postsubmit.
# This file is the reusable graph:
#   workflow_call from postsubmit.yml (push to dev)
#   pull_request + merge_group + workflow_dispatch = presubmit
# Local: pre-commit / pre-push = cargo fmt on touched *.rs (.githooks/).
# Clippy is advisory until the tree is -D-warnings clean (then it joins fan-in).
# Live Postgres is path-gated on pull_request; always on merge_group / postsubmit.
#
# Dual-emit: GitHub protection still keys oya-ci-required + merge-admission-required.
# Fan-in jobs post presubmit AND those two names until the protection flip (same change).

name: presubmit

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-clippy
      - name: Clippy, warnings denied
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  deny:
    name: deny (licenses bans sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          command-arguments: licenses bans sources
          rust-version: "1.98.0"

  test:
    name: test (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-test-workspace-ubuntu-24.04
          cache-workspace-crates: "true"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Workspace tests
        run: cargo nextest run --locked --workspace --profile ci

  pg-gate:
    name: pg-gate
    runs-on: ubuntu-24.04
    outputs:
      live: ${{ steps.g.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: g
        name: Path-gate live Postgres
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -Eq '^(tenancy/adapters/tenant-lifecycle-store-postgres/|iam/adapters/identity-scim-store-postgres/|iam/facade/identity-service/|tenancy/facade/tenant-lifecycle-app/|\.github/workflows/presubmit\.yml)'; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

  live-postgres-adapters:
    name: live-postgres-adapters (RLS / SCIM)
    needs: pg-gate
    if: needs.pg-gate.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_local_only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas
        env:
          ADMIN_PASSWORD: ci_pg_admin_local_only
          APP_PASSWORD: ci_pg_app_local_only
        run: |
          set -euo pipefail
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "::add-mask::${APP_PASSWORD}"
          printf 'PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/ci\nPG_APP_URL=postgres://app:%s@127.0.0.1:5432/ci\n' "${ADMIN_PASSWORD}" "${APP_PASSWORD}" >> "${GITHUB_ENV}"
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${ADMIN_PASSWORD}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d ci)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='app') THEN EXECUTE format('CREATE ROLE app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${APP_PASSWORD}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO app;"
      - name: Live Postgres tests (adapters)
        env:
          OYATIE_BACKBONE_LIVE_POSTGRES: "1"
          OYATIE_BACKBONE_POSTGRES_URL: ${{ env.PG_ADMIN_URL }}
          OYATIE_BACKBONE_POSTGRES_APP_URL: ${{ env.PG_APP_URL }}
        run: cargo nextest run --locked --no-fail-fast -p tenancy-tenant-lifecycle-store-postgres -p identity-scim-store-postgres

  live-postgres-facades:
    name: live-postgres-facades (tenant lifecycle / SCIM)
    needs: pg-gate
    if: needs.pg-gate.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_local_only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas
        env:
          ADMIN_PASSWORD: ci_pg_admin_local_only
          APP_PASSWORD: ci_pg_app_local_only
        run: |
          set -euo pipefail
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "::add-mask::${APP_PASSWORD}"
          printf 'PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/ci\nPG_APP_URL=postgres://app:%s@127.0.0.1:5432/ci\n' "${ADMIN_PASSWORD}" "${APP_PASSWORD}" >> "${GITHUB_ENV}"
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${ADMIN_PASSWORD}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d ci)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='app') THEN EXECUTE format('CREATE ROLE app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${APP_PASSWORD}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO app;"
      - name: Live Postgres tests (facades)
        env:
          OYATIE_BACKBONE_LIVE_POSTGRES: "1"
          OYATIE_BACKBONE_POSTGRES_APP_URL: ${{ env.PG_APP_URL }}
        run: cargo nextest run --locked --no-fail-fast -p iam-identity-service -p tenancy-tenant-lifecycle-app

  presubmit:
    name: presubmit
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, test, deny, live-postgres-adapters, live-postgres-facades]
    steps:
      - name: Fan-in verdict
        run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          ok "${{ needs.lint.result }}" && ok "${{ needs.test.result }}" && ok "${{ needs.deny.result }}" && ok "${{ needs.live-postgres-adapters.result }}" && ok "${{ needs.live-postgres-facades.result }}" && exit 0 || exit 1

  oya-ci-required:
    name: oya-ci-required
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, test, deny, live-postgres-adapters, live-postgres-facades]
    steps:
      - name: Dual-emit until protection flip
        run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          ok "${{ needs.lint.result }}" && ok "${{ needs.test.result }}" && ok "${{ needs.deny.result }}" && ok "${{ needs.live-postgres-adapters.result }}" && ok "${{ needs.live-postgres-facades.result }}" && exit 0 || exit 1

  merge-admission-required:
    name: merge-admission-required
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, test, deny, live-postgres-adapters, live-postgres-facades]
    steps:
      - name: Dual-emit until protection flip
        run: |
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          ok "${{ needs.lint.result }}" && ok "${{ needs.test.result }}" && ok "${{ needs.deny.result }}" && ok "${{ needs.live-postgres-adapters.result }}" && ok "${{ needs.live-postgres-facades.result }}" && exit 0 || exit 1
