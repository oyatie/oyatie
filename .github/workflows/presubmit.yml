# TAP presubmit (ADR-0719 D-9/D-10). Occupant of the required context: job `presubmit`.
# Graph: trusted D-8 layout + occupancy (pull_request only) + lint + clippy
# + deny + test (nextest workspace) + path-gated live Postgres.
name: presubmit

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  layout:
    name: layout (D-8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out protected admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - name: Build protected path-layout application
        working-directory: ${{ runner.temp }}
        run: >-
          cargo build --locked
          --manifest-path "$GITHUB_WORKSPACE/trusted/Cargo.toml"
          --target x86_64-unknown-linux-gnu
          --target-dir "$RUNNER_TEMP/oyatie-layout-admission"
          -p pipeline-path-layout-app
      - name: Admit candidate tree
        working-directory: candidate
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify 'HEAD^1^{commit}')"
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          "$RUNNER_TEMP/oyatie-layout-admission/x86_64-unknown-linux-gnu/debug/pipeline-path-layout-app" "$base_sha" "$head_sha"

  occupancy:
    name: occupancy (path-set)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out protected admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - name: Build path occupancy application
        working-directory: ${{ runner.temp }}
        run: >-
          cargo build --locked
          --manifest-path "$GITHUB_WORKSPACE/trusted/Cargo.toml"
          --target x86_64-unknown-linux-gnu
          --target-dir "$RUNNER_TEMP/oyatie-occupancy-admission"
          -p pipeline-path-occupancy-app
      - name: Admit complete Git path-set
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          OYATIE_REPOSITORY: ${{ github.repository }}
        run: "$RUNNER_TEMP/oyatie-occupancy-admission/x86_64-unknown-linux-gnu/debug/pipeline-path-occupancy-app"

  lint:
    name: lint (format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Check formatting
        working-directory: ${{ runner.temp }}
        run: >-
          cargo fmt
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --all --check

  clippy:
    name: clippy (workspace)
    needs: [layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-x86
          cache-workspace-crates: "true"
      - name: Workspace clippy
        run: >-
          cargo clippy --locked --workspace --all-targets
          -- -D warnings

  deny:
    name: deny (licenses bans sources)
    needs: [layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          command-arguments: licenses bans sources
          rust-version: "1.98.0"

  test:
    name: test (workspace)
    needs: [layout, occupancy]
    if: always() && needs.layout.result == 'success' && (needs.occupancy.result == 'success' || needs.occupancy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-x86
          cache-workspace-crates: "true"
      - name: Workspace tests
        run: >-
          cargo-nextest nextest run
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --locked --workspace --profile ci

  pg-gate:
    name: pg-gate
    runs-on: ubuntu-24.04
    outputs:
      live: ${{ steps.g.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: g
        name: Path-gate live Postgres
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify 'HEAD^1^{commit}')"
          if git diff --name-only "$base_sha" HEAD -- | grep -Eq '^(tenancy/adapters/tenant-lifecycle-store-postgres/|iam/adapters/identity-scim-store-postgres/|iam/facade/identity-service/|tenancy/facade/tenant-lifecycle-app/|\.github/workflows/presubmit\.yml|\.github/workflows/live-postgres\.yml|\.github/workflows/postsubmit\.yml|\.config/nextest\.toml)'; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

  live-postgres:
    needs: [layout, pg-gate]
    if: needs.layout.result == 'success' && needs.pg-gate.outputs.live == 'true'
    uses: oyatie/oyatie/.github/workflows/live-postgres.yml@dev

  # Mirrors pipeline_admission::fan_in_ok (tested).
  presubmit:
    name: presubmit
    runs-on: ubuntu-24.04
    if: always()
    needs: [layout, occupancy, lint, clippy, test, deny, pg-gate, live-postgres]
    steps:
      - name: Fan-in verdict
        env:
          LIVE: ${{ needs.pg-gate.outputs.live }}
          EVENT: ${{ github.event_name }}
        run: |
          req() { [ "$1" = "success" ]; }
          pg() {
            if [ "${LIVE}" = "true" ]; then [ "$1" = "success" ]; else [ "$1" = "skipped" ] || [ "$1" = "success" ]; fi
          }
          occ() {
            if [ "${EVENT}" = "pull_request" ]; then [ "$1" = "success" ]; else [ "$1" = "skipped" ] || [ "$1" = "success" ]; fi
          }
          req "${{ needs.layout.result }}" && occ "${{ needs.occupancy.result }}" && req "${{ needs.lint.result }}" && req "${{ needs.clippy.result }}" && req "${{ needs.test.result }}" && req "${{ needs.deny.result }}" && req "${{ needs.pg-gate.result }}" && pg "${{ needs.live-postgres.result }}" && exit 0 || exit 1
