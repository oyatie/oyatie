# TAP cadences (ADR-0719 D-9/D-10): precommit / prepush / presubmit / postsubmit.
# This file is the reusable graph. Triggers:
#   workflow_call from postsubmit.yml (push to dev)
#   pull_request + merge_group + workflow_dispatch = presubmit (merge-blocking)
# Local: precommit = rustfmt on staged *.rs; prepush is not a full nextest.
# Weekly: buck2-weekly-smoke.yml. No second required GitHub context.
#
# Execution engine: the Cargo workspace graph (rust-toolchain.toml pins the toolchain).
# buck2 is local hermeticity tooling plus a weekly non-blocking smoke;
# (buck2-weekly-smoke.yml). Inside the merge path, buck2 appears only as the
# face materializer's internal helper (install-buck2.sh), never as a build/test verdict engine.
#
# Authority: docs/decisions/ADR-0716-cargo-merge-path-buck2-local-hermeticity.md

name: presubmit

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Event tuple consumed by the generated-faces materializer (--github-event).
env:
  EVENT_EVALUATED_SHA: ${{ github.sha }}
  EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  EVENT_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
  EVENT_PUSH_AFTER_SHA: ${{ github.event.after || '' }}
  EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
  EVENT_MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
  EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  EVENT_NAME: ${{ github.event_name }}
  EVENT_REF: ${{ github.ref }}
  EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
  EVENT_MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
  # CI never opens a debugger, and this repo declares only [profile.release] — so dev/test
  # builds took cargo's defaults and generated FULL debuginfo for 1,759 packages. Debuginfo
  # also inflates target/, which slows cache save and restore at both ends. Set here rather
  # than in Cargo.toml so local developer builds keep their debuginfo.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Incremental state caches nothing useful on a fresh runner and costs time and disk to write.
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ADR-0719 D-10. FAST BLOCKING LANE. cargo fmt --all --check is the merge bar.
  # Clippy is a separate job (advisory until the tree is -D warnings clean).
  lint:
    name: lint (format)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - name: Check formatting
        # Merge bar is cargo fmt --all --check (ADR-0719 D-10). Not the rustfmt CLI.
        run: cargo fmt --all --check

  # ADR-0718-D1. DEEP LINT LANE, parallel with `test` and deliberately ABSENT from the
  # presubmit fan-in. Advisory until the tree is -D warnings clean.
  clippy:
    name: clippy (advisory)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-clippy
      - name: Clippy, warnings denied
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    # D88-amend: per-PR / merge_group / push-to-dev nextest is native Linux
    # amd64 only. GitHub rejects job-level `if:` that reads `matrix.*`
    # ("Unrecognized named-value: matrix"), so arm64 cannot share this job.
    # Arm64 nextest stays a follow-up workflow (nightly + promotion train);
    # it is not a fan-in input below.
    name: test (workspace + gates)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 60
    env:
      # swatinem/rust-cache caches registry dependencies, NOT workspace members, and this
      # workspace has 885 of them — a run logged a cache HIT with Cargo.lock untouched and still
      # compiled 1,565 crates. sccache is content-addressed per compilation unit, so it survives
      # the lockfile churn and the workspace-member gap that rust-cache leaves open.
      # CARGO_INCREMENTAL=0 (set workflow-wide) is a prerequisite: sccache cannot cache
      # incremental compilation.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history: gate crates derive facts from git (merge-base, scm faces).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # Its OWN key, not the shared cargo-ci-linux one. The live-postgres lanes compile a
          # small subset of the workspace; sharing a key would let their thin save overwrite this
          # lane's workspace-crate cache on every run — cache thrash that silently undoes the
          # setting below.
          shared-key: cargo-ci-test-workspace-ubuntu-24.04
          # THE fix for the measured defect: a run logged `Cache hit for: v0-rust-cargo-ci`
          # with Cargo.lock untouched and still compiled 1,565 crates, because this action
          # caches dependency crates but NOT workspace members by default — and this workspace
          # has 885 of them. Viable now specifically because #2113 turned debuginfo off, which
          # is what kept target/ small enough to be worth storing against the 10 GB per-repo
          # cache budget.
          cache-workspace-crates: "true"
      # The face materializer shells out to buck2 internally to build its sibling
      # face tools; the digest-pinned installer is the bridge it has always used.
      - name: Install pinned buck2 (digest-verified)
        shell: bash
        run: infra/ci/install-buck2.sh
      # buck2's builds need the full pinned toolchain (clippy/rustfmt components);
      # rustup must finish before buck2 runs or its downloads race (known class).
      - name: Pre-provision pinned toolchain components
        shell: bash
        # Full default profile (rustc+cargo+std+clippy+rustfmt): the materializer's buck2
        # build resolves the triple-named toolchain through rustup; pre-installing everything
        # makes those rustup calls no-ops and avoids the concurrent-download race.
        # Buck2 still resolves 1.96.0 (prelude pin) as well as rust-toolchain.toml 1.98.0.
        # Pre-install both so face materialize does not rustup-download clippy in-band.
        run: host=$(rustc -vV | awk '/^host/{print $2}') && for v in 1.98.0 1.96.0; do rustup component add --toolchain $v-$host cargo clippy rustfmt rust-std rustc; rustup component add --toolchain $v cargo clippy rustfmt rust-std rustc; done && rustup default 1.98.0 && rustc --version
      # Materialize generated faces before tests: several remaining crates consume them.
      # This is cargo *run* of the materializer, not a product `cargo build --workspace`.
      # The materializer still shells out to buck2 to build face-tool bins (ADR-0716
      # leak); product `buck2 build //...` stays on the weekly honesty job / CD train.
      - name: Materialize generated faces
        run: cargo run --locked -p ci-generated-artifact-freshness --bin cloud-ci-materialize-generated-faces -- --repo-root . --github-event
      # Every remaining workspace member (D-17 admission set, not the census fleet) runs here.
      - name: Workspace tests
        # ADR-0718-D3. nextest runs each test in its own process with a work-stealing
        # scheduler — materially faster than libtest's in-process threads at this scale, with
        # per-test isolation. It does not run doctests, verified safe rather than assumed:
        # zero doc examples across the .rs corpus and `doctest = false` already declared by
        # the large majority of manifests.
        # --no-fail-fast: nextest stops at the first failure by default, so each defect costs a
        # WHOLE CI run to discover — four runs of this branch surfaced four separate failures one
        # at a time. Running the suite out reports every failure in one run at the same verdict.
        # This is not an advisory escape: the job still fails if any test fails, unlike
        # `--keep-going` or `|| true`, which the registration gates reject for that reason.
        run: cargo nextest run --locked --workspace --profile ci
      # kernel/ is a nested workspace (ADR-0512 carve-out) the root workspace excludes.
      - name: Kernel workspace tests
        run: cargo nextest run --locked --manifest-path kernel/Cargo.toml --no-fail-fast
      # Live hub-exclusivity admission: rejects a second open PR touching a hub path
      # declared under specs/integ-branch-envelopes.json#hubs.paths.
      - name: Live hub-exclusivity admission
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --locked -p ci-affected-target-set --bin cloud-ci-hub-exclusivity -- --repo-root . --live-open-prs --repo "$GITHUB_REPOSITORY" --candidate-pr "${{ github.event.pull_request.number }}"
      # Generated outputs are never contributor merge surfaces: reject non-deletion
      # edits to tracked generated artifacts (diff streamed to the policy binary).
      # BASE_REF resolves the merge_group base explicitly. `github.base_ref` is a
      # pull_request-only context and is EMPTY in a merge group, so this diffed against a
      # hardcoded `dev` there — correct only while dev is the sole queue target, and silently
      # the wrong base the moment a queue is enabled on another branch. merge_group.base_ref
      # arrives fully qualified (`refs/heads/dev`), so the prefix is stripped in place rather
      # than by adding a step, which would grow the frozen workflow_inline_shell debt.
      - name: Reject non-deletion generated output edits
        if: ${{ github.event_name != 'push' }}
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'dev' }}
        run: git diff --find-renames --name-status "origin/${BASE_REF#refs/heads/}...HEAD" | cargo run --locked -p ci-generated-artifact-policy --bin cloud-ci-generated-output-diff-policy -- --manifest registry/generated-artifact-control-plane.json --repo-root .

  live-postgres-adapters:
    name: live-postgres-adapters (RLS / CDC / SCIM)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas (adapters)
        env:
          ADMIN_PASSWORD: ci_pg_admin_local_only
          APP_PASSWORD: ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-ci_pg_app_local_only}"; if [ -f /run/ci-postgres/admin-password ]; then admin_password="$(cat /run/ci-postgres/admin-password)"; fi; if [ -f /run/ci-postgres/app-password ]; then app_password="$(cat /run/ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYATIE_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYATIE_PG_APP_URL=postgres://app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          # psql runs INSIDE the postgres service container, which already ships it. The
          # runner previously apt-installed postgresql-client; that unretried network call was
          # cancelled mid-install and ejected a merge-queue entry (#2106). Under ALLGREEN
          # batching one such flake fails the whole batch and re-batches everything behind it.
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${admin_password}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='app') THEN EXECUTE format('CREATE ROLE app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (adapters)
        env:
          OYATIE_DATA_LIVE_POSTGRES: "1"
          OYATIE_DATA_POSTGRES_ADMIN_URL: ${{ env.OYATIE_PG_ADMIN_URL }}
          OYATIE_DATA_POSTGRES_APP_URL: ${{ env.OYATIE_PG_APP_URL }}
          OYATIE_OUTBOX_LIVE_POSTGRES: "1"
          OYATIE_OUTBOX_POSTGRES_ADMIN_URL: ${{ env.OYATIE_PG_ADMIN_URL }}
          OYATIE_OUTBOX_POSTGRES_APP_URL: ${{ env.OYATIE_PG_APP_URL }}
          OYATIE_BACKBONE_LIVE_POSTGRES: "1"
          OYATIE_BACKBONE_POSTGRES_URL: ${{ env.OYATIE_PG_ADMIN_URL }}
          OYATIE_BACKBONE_POSTGRES_APP_URL: ${{ env.OYATIE_PG_APP_URL }}
        run: cargo nextest run --locked --no-fail-fast -p data-sql-adapter-sqlx -p data-outbox-adapter-postgres -p tenancy-tenant-lifecycle-store-postgres -p identity-scim-store-postgres

  live-postgres-facades:
    name: live-postgres-facades (tenant lifecycle / SCIM)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_admin_local_only
          POSTGRES_DB: oyatie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oyatie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "1.98.0"
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: nextest
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cargo-ci-linux
      - name: Bootstrap roles and schemas (facades)
        env:
          ADMIN_PASSWORD: ci_pg_admin_local_only
          APP_PASSWORD: ci_pg_app_local_only
        run: |
          set -euo pipefail; admin_password="${ADMIN_PASSWORD:-ci_pg_admin_local_only}"; app_password="${APP_PASSWORD:-ci_pg_app_local_only}"; if [ -f /run/ci-postgres/admin-password ]; then admin_password="$(cat /run/ci-postgres/admin-password)"; fi; if [ -f /run/ci-postgres/app-password ]; then app_password="$(cat /run/ci-postgres/app-password)"; fi; test -n "${admin_password}" && test -n "${app_password}"; echo "::add-mask::${admin_password}"; echo "::add-mask::${app_password}"; export PGPASSWORD="${admin_password}"; printf 'OYATIE_PG_ADMIN_URL=postgres://postgres:%s@127.0.0.1:5432/oyatie\nOYATIE_PG_APP_URL=postgres://app:%s@127.0.0.1:5432/oyatie\n' "${admin_password}" "${app_password}" >> "${GITHUB_ENV}"
          # psql runs INSIDE the postgres service container, which already ships it. The
          # runner previously apt-installed postgresql-client; that unretried network call was
          # cancelled mid-install and ejected a merge-queue entry (#2106). Under ALLGREEN
          # batching one such flake fails the whole batch and re-batches everything behind it.
          ADMIN_PSQL=(docker exec -i -e PGPASSWORD="${admin_password}" "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d oyatie)
          "${ADMIN_PSQL[@]}" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='app') THEN EXECUTE format('CREATE ROLE app LOGIN PASSWORD %L NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE', '${app_password}'); END IF; END \$\$;"
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < tenancy/adapters/tenant-lifecycle-store-postgres/migrations/0001_tenant_lifecycle_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT tenancy_lifecycle_runtime TO app;"
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0000_runtime_role.sql
          "${ADMIN_PSQL[@]}" < iam/adapters/identity-scim-store-postgres/migrations/0001_identity_scim_store.sql
          "${ADMIN_PSQL[@]}" -c "GRANT identity_scim_runtime TO app;"
          "${ADMIN_PSQL[@]}" -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('postgres','app','tenancy_lifecycle_runtime','identity_scim_runtime') ORDER BY rolname;"
      - name: Live Postgres tests (facades)
        env:
          OYATIE_BACKBONE_LIVE_POSTGRES: "1"
          OYATIE_BACKBONE_POSTGRES_APP_URL: ${{ env.OYATIE_PG_APP_URL }}
        run: cargo nextest run --locked --no-fail-fast -p iam-identity-service -p tenancy-tenant-lifecycle-app

  # Fan-in: the single required context `presubmit`. Green IFF lint, Linux amd64
  # nextest, and both live-postgres lanes are green. Arm64 nextest is not a
  # per-PR fan-in input (D88-amend). No Windows/macOS job. No cargo test/libtest.
  presubmit:
    name: presubmit
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [lint, test, live-postgres-adapters, live-postgres-facades]
    steps:
      - name: Fan-in verdict
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.live-postgres-adapters.result }}" = "success" ] && [ "${{ needs.live-postgres-facades.result }}" = "success" ] && exit 0 || exit 1
