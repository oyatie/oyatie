name: ci-failure-fix-loop

# Dual-source fix-loop dispatcher (M-CC-P10-IP-005).
#
# Canonical state machine:
#   push → CI → fix-loop until green → review → fix-loop until APPROVE → merge
#                  ^^^^^^^^^^^^^^^^^^^^                ^^^^^^^^^^^^^^^^^^
#                  CI-source trigger                   review-source trigger
#                  (workflow_run failure)              (repository_dispatch)
#
# Both sources funnel into oya-foundry-vcs-ci-fix-loop-dispatcher-app
# which:
#   1. Loads the shared retry-budget pool (N=5/PR across BOTH sources).
#   2. If budget remaining: writes a context-bundle to
#      evidence/pipeline-maturity-glue/ip-005-fix-loop/<pr>/<attempt>.json
#      and appends a dispatch event to the registry.
#   3. If budget exhausted: writes an escalation record to
#      evidence/pipeline-maturity-glue/ip-005-fix-loop/<pr>/escalation.json
#      and this workflow then opens a stuck-PR GitHub issue with the
#      `human-escalation` label.
#
# Surface-all-failures: the dispatcher reads ALL failed jobs from the
# upstream workflow_run (not just the first one) so one CI cycle ⇒ one
# bundle ⇒ one retry-counter increment, regardless of how many jobs
# failed. Matches IP-007's `surface-all-failures` posture.
#
# Subagent runtime caveat (subagent_runtime_pending): the actual
# fix-loop agent runtime is TBD — the dispatcher posts to the agent
# queue (writes the bundle file + appends the dispatch event) and
# returns. When the agent runtime lands, it tails the registry and
# claims via `oya claim --agent ci-fix-loop --intent fix-<source>-PR-<N>`
# (or the grit-scaffold fallback per ADR-0054 during transition).

on:
  workflow_run:
    workflows:
      - pr-tests
      - oya-foundry-fitness-supply-chain
      - oya-foundry-fitness-sequential-pr-merge-conflicts
      - oya-foundry-fitness-pr-review
    types: [completed]
  repository_dispatch:
    types: [pr-review-fix-requested]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: ci-failure-fix-loop-${{ github.event.workflow_run.id || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  dispatch-fix-loop:
    name: Dispatch fix-loop agent task
    # Gate: only run when upstream workflow_run actually failed, or on
    # explicit review-source dispatch. Skips on workflow_run success +
    # any other repository_dispatch type.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'pr-review-fix-requested')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the dispatcher can collect the last N=5
          # commit history entries for the context bundle.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: ci-failure-fix-loop

      - name: Resolve PR + heads (CI-source)
        if: github.event_name == 'workflow_run'
        id: ci-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # PR number: workflow_run lists associated PRs.
          PR=$(gh api "repos/$REPO/actions/runs/$WORKFLOW_RUN_ID" --jq '.pull_requests[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "no PR associated with workflow_run; nothing to dispatch"
            exit 0
          fi
          BASE_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.sha')
          # Surface-all-failures: list ALL failed jobs in this run.
          gh api "repos/$REPO/actions/runs/$WORKFLOW_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out") | "\(.name)\t\(.conclusion)\t\(.url)"' \
            > failed-jobs.tsv || true
          {
            echo "pr=$PR"
            echo "head=$HEAD_SHA"
            echo "base=$BASE_SHA"
            echo "source=ci-failure"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve PR + heads (review-source)
        if: github.event_name == 'repository_dispatch'
        id: review-source
        env:
          PR: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
        run: |
          set -euo pipefail
          : > failed-jobs.tsv
          {
            echo "pr=$PR"
            echo "head=$HEAD_SHA"
            echo "base=$BASE_SHA"
            echo "source=pr-review-fix-requested"
          } >> "$GITHUB_OUTPUT"

      - name: Build dispatcher
        run: cargo build -p oya-foundry-vcs-ci-fix-loop-dispatcher-app

      - name: Assemble + dispatch context-bundle
        id: dispatch
        env:
          PR: ${{ steps.ci-source.outputs.pr || steps.review-source.outputs.pr }}
          HEAD: ${{ steps.ci-source.outputs.head || steps.review-source.outputs.head }}
          BASE: ${{ steps.ci-source.outputs.base || steps.review-source.outputs.base }}
          SOURCE: ${{ steps.ci-source.outputs.source || steps.review-source.outputs.source }}
        run: |
          set -euo pipefail
          [ -n "$PR" ] || { echo "no PR to dispatch for"; exit 0; }
          NOW_EPOCH=$(date +%s)
          # Compute patch sha256 over the PR diff (vs base).
          PATCH_SHA=$(git diff "$BASE...$HEAD" | shasum -a 256 | awk '{print $1}')
          FILES=$(git diff --name-only "$BASE...$HEAD" | wc -l | tr -d ' ')
          ADD=$(git diff --shortstat "$BASE...$HEAD" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          DEL=$(git diff --shortstat "$BASE...$HEAD" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          ARGS=(
            --source "$SOURCE"
            --pr "$PR"
            --head-sha "$HEAD"
            --base-sha "$BASE"
            --now-epoch "$NOW_EPOCH"
            --workspace-root "$GITHUB_WORKSPACE"
            --diff-summary "$FILES:${ADD:-0}:${DEL:-0}:$PATCH_SHA"
          )
          while IFS=$'\t' read -r name conclusion url; do
            [ -n "$name" ] || continue
            SHA=$(echo "$url" | shasum -a 256 | awk '{print $1}')
            ARGS+=(--failed-job "$name:$conclusion:$SHA:$url")
          done < failed-jobs.tsv
          while IFS=$'\t' read -r sha epoch subject; do
            [ -n "$sha" ] || continue
            ARGS+=(--commit "$sha:$epoch:$subject")
          done < <(git log -n 5 "$HEAD" --format='%H%x09%at%x09%s')
          cargo run -q -p oya-foundry-vcs-ci-fix-loop-dispatcher-app -- "${ARGS[@]}"

      - name: Open stuck-PR issue on escalation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ci-source.outputs.pr || steps.review-source.outputs.pr }}
        run: |
          set -euo pipefail
          ESC="evidence/pipeline-maturity-glue/ip-005-fix-loop/$PR/escalation.json"
          if [ -n "$PR" ] && [ -f "$ESC" ]; then
            TITLE=$(python3 -c "import json,sys;print(json.load(open('$ESC'))['issue_title'])")
            BODY=$(python3 -c "import json,sys;print(json.load(open('$ESC'))['issue_body'])")
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --body "$BODY" \
              --label human-escalation \
              --label fix-loop-exhausted
          fi
