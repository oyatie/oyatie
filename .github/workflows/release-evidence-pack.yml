name: release-evidence-pack

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence-pack:
    name: regulator evidence-pack release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published regulator evidence packs
        run: cargo run -p oya-dev-cli -- gate validate release-evidence-pack --require-records
