name: promote-dev-to-staging

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Phase 2 of the FINAL-FINAL branch pipeline (per
# `feedback_branch_pipeline_final_final`, 2026-05-12). Auto-promotes
# `dev` to `staging` by fast-forwarding the `staging` ref to dev's
# HEAD. The commit at that SHA was signed + gated by every required
# check on dev (PR-level), so staging inherits the same signature +
# CI state with no re-review.
#
# Trigger:
#   - push to `dev` (every merge to dev attempts promotion)
#   - workflow_dispatch (manual canary-pass-confirmed promotion)
#   - schedule (every 30 minutes, idempotent — re-points staging to
#     dev if dev advanced; no-op if already at the same SHA)
#
# Downstream-trigger limitation (per Codex P2 finding 2026-05-16):
#   GitHub Actions does NOT create new workflow runs for events
#   caused by `GITHUB_TOKEN` (except dispatch events). So advancing
#   `staging` via this workflow does NOT fire the `push` trigger on
#   `promote-staging-to-production`. Two mitigations: (a) when a
#   `WORKFLOW_PAT` repository secret is configured, the final step
#   below explicitly invokes the downstream workflow via
#   `gh workflow run`; (b) the downstream workflow's hourly cron is
#   the safety-net fallback so production still promotes within ≤1
#   hour of dev advancing even if `WORKFLOW_PAT` is absent.
#
# Canary gate (FUTURE — currently always-promote):
#   Per FINAL-FINAL "canary cohort exposure begins here", a future
#   amendment SHOULD add a step that queries the canary observability
#   surface (latency, error rate, SLO breach count for the prior 15
#   min window of dev traffic on the canary cohort) and refuses to
#   advance staging if any threshold is breached. The
#   `oya-foundry-fitness-canary-cohort-observability` lane (TBD) will
#   own that logic; this workflow consumes it as a single gate step.
#   Until that lane lands, every dev → staging is unconditional.

on:
  push:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: promote-dev-to-staging
  cancel-in-progress: false

jobs:
  promote-dev-to-staging:
    name: promote-dev-to-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward staging to dev HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dev_sha=$(gh api repos/${{ github.repository }}/git/ref/heads/dev --jq .object.sha)
          staging_sha=$(gh api repos/${{ github.repository }}/git/ref/heads/staging --jq .object.sha)
          echo "dev HEAD     = $dev_sha"
          echo "staging HEAD = $staging_sha"
          if [ "$dev_sha" = "$staging_sha" ]; then
            echo "staging already at dev HEAD — no-op"
            exit 0
          fi
          gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/staging \
            -F sha="$dev_sha" \
            -F force=false
          echo "staging advanced to $dev_sha"
      - name: Trigger downstream production promotion (PAT-only)
        # GITHUB_TOKEN can't fire downstream workflow_runs (per the
        # Codex P2 finding). If WORKFLOW_PAT is configured, use it to
        # fire `promote-staging-to-production` immediately. If absent,
        # the hourly cron on that workflow is the fallback.
        if: success() && env.WORKFLOW_PAT != ''
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh workflow run` needs to know which repo. Since this job
          # never runs `actions/checkout`, there's no implicit
          # repository context — pass it via `GH_REPO` env var (gh CLI
          # convention) which is equivalent to `--repo <owner>/<repo>`
          # on every gh invocation.
          gh workflow run promote-staging-to-production.yml --ref dev
          echo "Triggered promote-staging-to-production via WORKFLOW_PAT (repo=$GH_REPO)"
