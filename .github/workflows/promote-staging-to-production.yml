name: promote-staging-to-production

# Wave 15-ZF Jenkinsfile-mirror-parity (ADR-0346, ADR-0347, ADR-0348, ADR-0349):
# - ADR-0346 purpose: Establish that `./bin/oya verify --ci-required` is the canonical local
#   pre-push verifier and MUST locally mirror the full CI matrix.
#   enforced_by: oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics.
# - ADR-0347 purpose: Declare that every `oya-foundry-fitness-*` CI lane prefix in the Oyatie
#   corpus RENAMES to `oya-governance-*` in a single bulk-rename pull request (Wave 15-ZB).
#   enforced_by: oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary.
# - ADR-0348 purpose: Declare that cellular topology MUST support three control-plane-driven
#   automation modes underneath the cell-level promotion gates already doctrined in ADR-0341.
#   enforced_by: oya-governance-sharding-automation-coverage; oya-governance-audit-chain-emit-on-automation-events.
# - ADR-0349 enforced_by: oya-governance-jenkins-github-actions-parity (new lane; refuses Jenkinsfile /
#   .github/workflows drift such that a CI step exists in one surface but not the other across
#   the per-microservice CI-parity contract enumerated in D-3 below; promoted to BLOCKER
#   30 days post Wave 15-ZE-completion).
#   Purpose: Jenkins is the canonical CI orchestrator for air-gap + on-prem + colo +
#   oyatie-as-cloud-provider deployment contexts where GitHub Actions runners are not available;
#   GitHub Actions is RETAINED as the primary CI for the hosted-on-GitHub PR review surface
#   (oya verify + PR checks); Jenkins augments rather than replaces it.

# Phase 3 of the FINAL-FINAL branch pipeline (per
# `feedback_branch_pipeline_final_final`, 2026-05-12). Auto-promotes
# `staging` to `production` by fast-forwarding the `production` ref
# to staging's HEAD. The commit at that SHA was signed + gated +
# canary-observed on staging, so production inherits that state with
# no re-review.
#
# Trigger:
#   - push to `staging` (every staging advance attempts promotion)
#   - workflow_dispatch (manual full-cohort confirmation)
#   - schedule (every hour, idempotent)
#
# Full-rollout gate (FUTURE — currently always-promote):
#   Per FINAL-FINAL "full rollout", a future amendment SHOULD add a
#   step that asserts the staging traffic has run for ≥1 hour with
#   zero SLO breach on the FULL cohort. The
#   `oya-foundry-fitness-full-rollout-observability` lane (TBD) will
#   own that logic. Until then, every staging → production is
#   unconditional (with a longer cadence to give canary time to
#   accumulate signal).

on:
  push:
    branches: [staging]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: promote-staging-to-production
  cancel-in-progress: false

jobs:
  promote-staging-to-production:
    name: promote-staging-to-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward production to staging HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging_sha=$(gh api repos/${{ github.repository }}/git/ref/heads/staging --jq .object.sha)
          production_sha=$(gh api repos/${{ github.repository }}/git/ref/heads/production --jq .object.sha)
          echo "staging HEAD    = $staging_sha"
          echo "production HEAD = $production_sha"
          if [ "$staging_sha" = "$production_sha" ]; then
            echo "production already at staging HEAD — no-op"
            exit 0
          fi
          gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/production \
            -F sha="$staging_sha" \
            -F force=false
          echo "production advanced to $staging_sha"
