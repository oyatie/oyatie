name: oya-governance-oya-verify-advisory-step-classification

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: oya-governance-oya-verify-advisory-step-classification-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  oya-governance-oya-verify-advisory-step-classification:
    name: oya-governance-oya-verify-advisory-step-classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report-only advisory classification assertion
        continue-on-error: true
        run: |
          set -euo pipefail
          source="crates/oya-dev-cli/src/commands/verify.rs"
          missing=0
          require() {
            if ! grep -Fq -- "$1" "$source"; then
              echo "::warning::verify.rs missing advisory marker: $1"
              missing=1
            fi
          }
          require "const ADVISORY_TOTAL: usize = 2"
          require "D-6"
          require "oya doc adr-index --write"
          require "D-7"
          require "oya lint adr-shape"
          require "blocks_on_failure"
          exit "$missing"
