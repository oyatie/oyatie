name: Feature request
description: Propose a new capability or improvement
title: "[feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: >-
        Read the canonical authority for the change class first
        (`docs/AGENTS.md` §Canonical doc map). Features that introduce new
        dependencies must clear the dependency policy — AGPL / GPL / SSPL /
        BUSL / RSAL are not permitted in product code.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should be built, at what boundary (crate/service/doc)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" and buy-vs-build per ADR-0014.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, verifiable outcomes; name the verification path.
      placeholder: |
        - [ ] …
        - Verification: cargo nextest target / fitness lane / browser evidence
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: ADRs, catalog records, cross-axis contracts this touches.
    validations:
      required: false
