name: Blocker / resolution card
description: Dispatcher-ready blocker resolution card per the AGENTS.md blocker policy
title: "[blocker] "
labels: ["blocker"]
body:
  - type: markdown
    attributes:
      value: >-
        Per the blocker policy in `AGENTS.md`: blockers become dispatcher-ready
        resolution cards. Fill every field so a worker can pick this up without
        re-discovery.
  - type: textarea
    id: source-context
    attributes:
      label: Source context
      description: Where the blocker was found (PR, lane, card, doc, command).
    validations:
      required: true
  - type: dropdown
    id: blocker-class
    attributes:
      label: Blocker class
      options:
        - CI / gate failure
        - Merge conflict / branch protection
        - Missing contract or spec
        - Dependency / license
        - Tooling / infra
        - Documentation / governance drift
        - Cross-axis coordination
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What "resolved" looks like, in observable terms.
      placeholder: |
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification path
      description: Exact command, lane, or status context that proves resolution.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Suggested owner / profile
      description: Team handle from .github/CODEOWNERS or worker profile.
      placeholder: "@jason931225"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependency / conflict notes
      description: Cards, PRs, or lanes this depends on or conflicts with.
    validations:
      required: false
