# ADR-0513 amendment (2026-06-04): Prow/Kubernetes-native oya-ci is CI authority.
# The required dev context is oya-ci-required. GitHub/GitHub Actions remains a
# PR/publication adapter and may emit github-lane-unlocker-required as shadow
# compatibility evidence only; it is not merge authority and must not impersonate
# the trusted oya-ci producer. Buck2 remains build/test/check authority.

# Branch-protection shadow/target record for dev/staging/production.
# This file does not mutate live branch protection. It records the target
# ruleset agents should preserve while native SCM and release-conveyor seams
# mature.
#
# Pipeline topology:
#
#   per-agent worktree → PR adapter → dev → staging → production
#
# Branches in this file are the SHARED-WORLD branches (L2/L3/L4):
#
#   - dev        Shared-world entry point. PRs target here. Required evidence:
#                signed commits + linear history + trusted oya-ci-required.
#   - staging    Promotion from dev is owned by native release-conveyor-like CD.
#                GitHub Actions may prepare dry-run evidence only.
#   - production Promotion from staging to production is owned by native release
#                conveyor and requires native evidence, rollback, policy, audit,
#                and signed provenance.
#
# `main` is retained for read-only legacy compatibility but has no protection and
# is not the default branch. New work targets `dev`.

branches:
  dev:
    require_pull_request: true
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
    # Reviews are agent-run and automated unless a lane explicitly requires a
    # human/council reviewer. GitHub approving reviews are not merge authority.
    required_approving_reviews: 0
    # ADR-0513 target: trusted Prow/Kubernetes-native oya-ci aggregate context.
    # GitHub Actions github-lane-unlocker-required is shadow compatibility only.
    required_status_checks:
      - oya-ci-required

  staging:
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true

  production:
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
