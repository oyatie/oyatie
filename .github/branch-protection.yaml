# Branch-protection shadow/target record for dev/staging/production.
# As of the P0.0 gap packet, live GitHub dev protection does not reflect
# this file exactly; drift is recorded in
# specs/phase0-ci-enforcement-baseline.json. This file is not Phase-0
# exit authority until a trusted cloud-ci/oya-ci required context is live.
#
# Pipeline topology (per feedback_branch_pipeline_final_final,
# 2026-05-12):
#
#   per-agent worktree → local main → dev → staging → production
#
# Branches in this file are the SHARED-WORLD branches (L2/L3/L4):
#
#   - dev        Shared-world entry point. PRs target here. 3-gate:
#                signed-commits + linear-history + every required
#                CI check green. Default branch on github.
#   - staging    Auto-promoted from dev by the promote-dev-to-staging
#                pipeline (GitHub Actions is the sole CI per ADR-0515 D3;
#                pipeline impl tracked in registry/placeholder-debt/
#                adr-follow-ups.yaml#adr-0361-promote-pipelines). No PR review;
#                signed-commits + linear-history; CANARY cohort exposure begins
#                on this ref.
#   - production Auto-promoted from staging by the
#                promote-staging-to-production pipeline (GitHub Actions per
#                ADR-0515 D3; pipeline impl tracked in the same placeholder-debt
#                entry). No PR review; signed-commits + linear-history; FULL
#                ROLLOUT exposure on this ref.
#
# `main` is RETAINED for read-only legacy compatibility but has NO
# protection and is not the default branch. PRs targeting `main` are
# accepted only for emergency hotfixes that bypass the pipeline; new
# work targets `dev`.

branches:
  dev:
    require_pull_request: true
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
    # Reviews are agent-run and fully automated. GitHub human approving
    # reviews are not merge authority. Reviewer-agent APPROVE evidence is
    # enforced inside the required `oya-ci-required` context by the
    # `pr-reviewer-evidence` pull_request lane until `oya-pr-review` has a
    # live trusted producer and is explicitly required.
    required_approving_reviews: 0
    # P0.0 local target: one required context posted by trusted
    # cloud-ci/oya-ci control state. This file is not a live-enforcement
    # claim until the ruleset is applied and oya-ci-controller posts the
    # candidate-SHA status. Legacy cargo/* and oya-verify lanes are feedback
    # only, not protected-branch merge or Phase-0 exit authority.
    # NOTE: oya-pr-review is intentionally ABSENT from required checks.
    # Current reviewer evidence enforcement lives in `oya-ci-required`.
    # Its producer (reviewer-agent HTTP endpoint) returns HTTP 501 (not yet
    # shipped); requiring it would deadlock every PR. It can return only after
    # the reviewer-agent endpoint is live and explicitly classified.
    required_status_checks:
      - oya-ci-required

  staging:
    # Auto-promoted from dev by the promote-dev-to-staging pipeline
    # (GitHub Actions per ADR-0515 D3); the fast-forward inherits dev's
    # signature + CI state.
    # No PR required, no review, no CI gate at THIS layer — those gates
    # already fired on dev. What we do enforce: the ref must only move
    # forward, the underlying commits must be signed, no force-push, no
    # deletion. Pipeline impl is tracked in
    # registry/placeholder-debt/adr-follow-ups.yaml#adr-0361-promote-pipelines.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true

  production:
    # Auto-promoted from staging by the promote-staging-to-production
    # pipeline (GitHub Actions per ADR-0515 D3); same fast-forward inheritance
    # as staging.
    # FULL-rollout layer; canary observability gate (per FINAL-FINAL) is the
    # future addition that conditions this promotion. Pipeline impl tracked
    # in registry/placeholder-debt/adr-follow-ups.yaml#adr-0361-promote-pipelines.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
