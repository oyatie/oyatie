# Branch-protection canonical record — the deployed ruleset on
# github.com/jason931225/oyatie reflects this file exactly. Drift is
# caught by the `oya-foundry-fitness-protection-context-match` lane
# (per-pr CI).
#
# Pipeline topology (per feedback_branch_pipeline_final_final,
# 2026-05-12):
#
#   per-agent worktree → local main → dev → staging → production
#
# Branches in this file are the SHARED-WORLD branches (L2/L3/L4):
#
#   - dev        Shared-world entry point. PRs target here. 3-gate:
#                signed-commits + linear-history + every required
#                CI check green. Default branch on github.
#   - staging    Auto-promoted from dev (workflow:
#                .github/workflows/promote-dev-to-staging.yml).
#                No PR review; signed-commits + linear-history;
#                CANARY cohort exposure begins on this ref.
#   - production Auto-promoted from staging (workflow:
#                .github/workflows/promote-staging-to-production.yml).
#                No PR review; signed-commits + linear-history;
#                FULL ROLLOUT exposure on this ref.
#
# `main` is RETAINED for read-only legacy compatibility but has NO
# protection and is not the default branch. PRs targeting `main` are
# accepted only for emergency hotfixes that bypass the pipeline; new
# work targets `dev`.

branches:
  dev:
    require_pull_request: true
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
    # Reviews are agent-run and fully automated. GitHub human approving
    # reviews are not the merge authority; the required `oya-pr-review`
    # check below is.
    required_approving_reviews: 0
    # Canonical contract: each entry below is BOTH the workflow YAML
    # job-key AND the workflow's `name:` field. The
    # `oya-foundry-fitness-protection-context-match` lane enforces
    # this invariant.
    required_status_checks:
      - cargo-fmt
      - cargo-check
      - cargo-clippy
      - cargo-nextest
      - oya-vcs-admission
      - oya-vcs-provider-execution
      - oya-foundry-fitness-supply-chain
      - oya-foundry-fitness-cohesion
      - oya-foundry-fitness-api-semver
      - oya-foundry-fitness-protection-context-match
      - oya-pr-review

  staging:
    # Auto-promoted from dev by promote-dev-to-staging.yml; the
    # fast-forward inherits dev's signature + CI state. No PR
    # required, no review, no CI gate at THIS layer — those gates
    # already fired on dev. What we do enforce: the ref must only
    # move forward, the underlying commits must be signed, no
    # force-push, no deletion.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true

  production:
    # Auto-promoted from staging by
    # promote-staging-to-production.yml; same fast-forward inheritance
    # as staging. FULL-rollout layer; canary observability gate (per
    # FINAL-FINAL) is the future addition that conditions this
    # promotion.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
