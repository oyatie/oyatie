# Branch-protection canonical record — the deployed ruleset on
# github.com/jason931225/oyatie reflects this file exactly. Drift is
# caught by the `oya-governance-protection-context-match` lane
# (per-pr CI).
#
# Pipeline topology (per feedback_branch_pipeline_final_final,
# 2026-05-12):
#
#   per-agent worktree → local main → dev → staging → production
#
# Branches in this file are the SHARED-WORLD branches (L2/L3/L4):
#
#   - dev        Shared-world entry point. PRs target here. 3-gate:
#                signed-commits + linear-history + every required
#                CI check green. Default branch on github.
#   - staging    Auto-promoted from dev by the Jenkins promote-dev-to-staging
#                pipeline (per ADR-0361 Jenkins-native CI/CD; pipeline impl
#                tracked in registry/placeholder-debt/adr-follow-ups.yaml
#                #adr-0361-promote-pipelines). The prior GHA workflow at
#                .github/workflows/promote-dev-to-staging.yml was retired in
#                R5 (ADR-0361). No PR review; signed-commits + linear-history;
#                CANARY cohort exposure begins on this ref.
#   - production Auto-promoted from staging by the Jenkins
#                promote-staging-to-production pipeline (per ADR-0361; pipeline
#                impl tracked in the same placeholder-debt entry). The prior
#                GHA workflow was retired in R5. No PR review; signed-commits
#                + linear-history; FULL ROLLOUT exposure on this ref.
#
# `main` is RETAINED for read-only legacy compatibility but has NO
# protection and is not the default branch. PRs targeting `main` are
# accepted only for emergency hotfixes that bypass the pipeline; new
# work targets `dev`.

branches:
  dev:
    require_pull_request: true
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
    # Reviews are agent-run and fully automated. GitHub human approving
    # reviews are not the merge authority; the required `oya-pr-review`
    # check below is.
    required_approving_reviews: 0
    # Canonical contract: these entries are the live dev branch required
    # commit-status contexts posted by the local/Jenkins bridge. ADR-0363
    # retired oya-vcs admission/provider-execution as required contexts; the
    # broad governance lanes are folded under `oya-pr-review` until the
    # Forgejo/Jenkins substrate publishes one context per lane.
    required_status_checks:
      - cargo-fmt
      - cargo-check
      - cargo-clippy
      - cargo-nextest
      - oya-pr-review

  staging:
    # Auto-promoted from dev by the Jenkins promote-dev-to-staging pipeline
    # (per ADR-0361); the fast-forward inherits dev's signature + CI state.
    # No PR required, no review, no CI gate at THIS layer — those gates
    # already fired on dev. What we do enforce: the ref must only move
    # forward, the underlying commits must be signed, no force-push, no
    # deletion. Pipeline impl is tracked in
    # registry/placeholder-debt/adr-follow-ups.yaml#adr-0361-promote-pipelines.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true

  production:
    # Auto-promoted from staging by the Jenkins promote-staging-to-production
    # pipeline (per ADR-0361); same fast-forward inheritance as staging.
    # FULL-rollout layer; canary observability gate (per FINAL-FINAL) is the
    # future addition that conditions this promotion. Pipeline impl tracked
    # in registry/placeholder-debt/adr-follow-ups.yaml#adr-0361-promote-pipelines.
    require_pull_request: false
    require_linear_history: true
    disallow_force_push: true
    require_signed_commits: true
    require_signed_tags: true
