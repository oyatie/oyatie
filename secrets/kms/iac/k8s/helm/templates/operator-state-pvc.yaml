{{- if .Values.operator.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.operator.state.claimName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.operator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0510: transient-kms-operator-kube-adapter
spec:
  accessModes:
    - ReadWriteOnce
{{- if .Values.operator.state.storageClassName }}
  storageClassName: {{ .Values.operator.state.storageClassName | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.operator.state.size | quote }}
{{- end }}
