{{- if .Values.operator.enabled }}
{{- $operatorDigest := .Values.operator.image.digest | default "" -}}
{{- if and .Values.operator.image.cosign.required (not (and (regexMatch "^sha256:[0-9a-f]{64}$" $operatorDigest) (regexMatch "[1-9a-f]" (trimPrefix "sha256:" $operatorDigest)))) -}}
{{- fail "operator.image.digest must be set to a real non-zero sha256 digest when operator.image.cosign.required=true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operator.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.operator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0510: transient-kms-operator-kube-adapter
    oyatie.com/cargo-package: {{ .Values.operator.cargoPackage | quote }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.operator.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.operator.name | quote }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
      annotations:
        cosign.sigstore.dev/required: {{ .Values.operator.image.cosign.required | quote }}
        oyatie.com/image-digest: {{ $operatorDigest | quote }}
        oyatie.com/image-promotion-policy: {{ .Values.operator.image.cosign.policy | quote }}
        oyatie.com/audit-chain-event: "cloud-kms-operator-deployment"
    spec:
      runtimeClassName: {{ .Values.podRuntime.runtimeClassName | quote }}
      serviceAccountName: {{ .Values.operator.serviceAccount.name | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.operator.image.registry }}/{{ .Values.operator.image.repository }}{{- if $operatorDigest }}@{{ $operatorDigest }}{{- else }}:{{ .Values.operator.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy | quote }}
          command:
            - /usr/local/bin/oya-cloud-kms-operator
          env:
            - name: OYA_MICROSERVICE
              value: {{ .Values.microservice.id | quote }}
            - name: OYA_CARGO_PACKAGE
              value: {{ .Values.operator.cargoPackage | quote }}
            - name: OYA_KMS_OPERATOR_NAMESPACE
              value: {{ .Values.operator.watchedNamespace | quote }}
            - name: OYA_KMS_OPERATOR_MTLS_CERT_DIR
              value: {{ .Values.operator.mtls.mountPath | quote }}
            - name: OYA_KMS_OPERATOR_MTLS_CA_PATH
              value: {{ printf "%s/ca.crt" .Values.operator.mtls.mountPath | quote }}
            - name: OYA_KMS_OPERATOR_MTLS_CERT_PATH
              value: {{ printf "%s/tls.crt" .Values.operator.mtls.mountPath | quote }}
            - name: OYA_KMS_OPERATOR_MTLS_KEY_PATH
              value: {{ printf "%s/tls.key" .Values.operator.mtls.mountPath | quote }}
            - name: OYA_KMS_OPERATOR_STATE_PATH
              value: {{ printf "%s/%s" .Values.operator.state.mountPath .Values.operator.state.fileName | quote }}
          volumeMounts:
            - name: operator-mtls
              mountPath: {{ .Values.operator.mtls.mountPath | quote }}
              readOnly: true
            - name: operator-state
              mountPath: {{ .Values.operator.state.mountPath | quote }}
              readOnly: false
          resources:
{{ toYaml .Values.operator.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: operator-mtls
          secret:
            secretName: {{ .Values.operator.mtls.secretName | quote }}
            optional: false
        - name: operator-state
          persistentVolumeClaim:
            claimName: {{ .Values.operator.state.claimName | quote }}
{{- end }}
