microservice:
  id: cloud-secrets
  cargoPackage: cloud-secrets
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: cloud-secrets

image:
  registry: registry.oyatie.dev
  repository: cloud-secrets
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: cloud-secrets-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    // Deployed Cedar mirrors the authored PBAC policy directories for this capability.
    // Broad tenant-class-only permits are forbidden by the cedar-deploy-parity gate.

    // Source: policy/auditor-scope.cedar
    permit (
      principal in ExternalAuditor::?p,
      action == Action::"read_audit_chain_export",
      resource in AuditChainEvent::?e
    )
    when {
      principal has audit_window_start &&
      principal has audit_window_end &&
      e has occurred_at &&
      principal.audit_window_start <= e.occurred_at &&
      e.occurred_at <= principal.audit_window_end &&
      principal has authorised_pack &&
      resource has pack &&
      principal.authorised_pack == resource.pack
    };

    permit (
      principal in ExternalAuditor::?p,
      action in [
        Action::"read_policy_fragment",
        Action::"read_iac_manifest",
        Action::"read_threat_model",
        Action::"read_dpia",
        Action::"read_runbook",
        Action::"read_rotation_policy",
        Action::"read_attestation_report",
        Action::"read_compliance_evidence"
      ],
      resource in Repo::?r
    )
    when {
      resource has microservice &&
      resource.microservice == "cloud-secrets"
    };

    permit (
      principal in ExternalAuditor::?p,
      action == Action::"read_pack_assignment",
      resource in PackAssignment::?r
    )
    when {
      resource has data_class &&
      resource.data_class != "SECRET"
    };

    forbid (
      principal in ExternalAuditor::?p,
      action == Action::"resolve_secret_reference",
      resource
    );

    forbid (
      principal in ExternalAuditor::?p,
      action in [
        Action::"hsm_sign",
        Action::"hsm_attest",
        Action::"hsm_generate_kek",
        Action::"hsm_rotate_kek",
        Action::"hsm_export_partition_state"
      ],
      resource
    );

    forbid (
      principal in ExternalAuditor::?p,
      action,
      resource
    )
    when {
      principal has audit_window_start &&
      principal has audit_window_end &&
      resource has occurred_at &&
      (resource.occurred_at < principal.audit_window_start ||
       resource.occurred_at > principal.audit_window_end)
    };

    forbid (
      principal in ExternalAuditor::?p,
      action,
      resource
    )
    when {
      principal has authorised_pack &&
      resource has pack &&
      principal.authorised_pack != resource.pack
    };

    forbid (
      principal in ExternalAuditor::?p,
      action,
      resource
    )
    when {
      principal has token_expires_at &&
      principal has now &&
      principal.token_expires_at <= principal.now
    };

    // Source: policy/ci-scope.cedar
    permit (
      principal == CIRunner::"ci",
      action in [
        Action::"read_policy_fragment",
        Action::"read_iac_manifest",
        Action::"read_contract",
        Action::"read_catalog_record",
        Action::"read_capability_card",
        Action::"read_runbook"
      ],
      resource in Repo::?r
    )
    when {
      resource has microservice &&
      resource.microservice == "cloud-secrets"
    };

    permit (
      principal == CIRunner::"ci",
      action in [
        Action::"resolve_secret_reference",
        Action::"write_secret_reference",
        Action::"rotate_secret",
        Action::"revoke_secret"
      ],
      resource in TenantNamespace::"tenant:cisandbox0000000"
    );

    permit (
      principal == CIRunner::"ci",
      action == Action::"emit_scan_finding",
      resource in ScanFindingsBucket::"cloud-secrets-leak-scan-findings"
    );

    forbid (
      principal == CIRunner::"ci",
      action == Action::"resolve_secret_reference",
      resource
    )
    unless {
      resource has tenant_id &&
      resource.tenant_id == "tenant:cisandbox0000000"
    };

    forbid (
      principal == CIRunner::"ci",
      action in [
        Action::"hsm_sign",
        Action::"hsm_attest",
        Action::"hsm_generate_kek",
        Action::"hsm_rotate_kek",
        Action::"hsm_export_partition_state"
      ],
      resource
    );

    forbid (
      principal == CIRunner::"ci",
      action in [
        Action::"break_glass_admin",
        Action::"unseal_recovery",
        Action::"seal_namespace",
        Action::"reset_root_token"
      ],
      resource
    );

    // Source: policy/public-read.cedar
    permit (
      principal == Anonymous::"public",
      action in [
        Action::"get_health",
        Action::"get_ready"
      ],
      resource in HealthEndpoint::?r
    );

    permit (
      principal == Anonymous::"public",
      action == Action::"read_contract",
      resource in Contract::?r
    )
    when {
      resource has visibility &&
      resource.visibility == "public"
    };

    permit (
      principal == Anonymous::"public",
      action == Action::"read_doc",
      resource in PublicDoc::?r
    )
    when {
      resource has visibility &&
      resource.visibility == "public" &&
      resource has data_class &&
      resource.data_class != "SECRET" &&
      resource.data_class != "AUDIT" &&
      resource.data_class != "SENSITIVE_PIPA_ART23"
    };

    forbid (
      principal == Anonymous::"public",
      action in [
        Action::"resolve_secret_reference",
        Action::"list_secret_references",
        Action::"read_rotation_policy",
        Action::"read_namespace_metadata",
        Action::"read_attestation_report",
        Action::"read_audit_chain_export",
        Action::"read_policy_fragment",
        Action::"read_iac_manifest",
        Action::"hsm_sign",
        Action::"upload_byok"
      ],
      resource
    );

    forbid (
      principal == Anonymous::"public",
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class != "PUBLIC" &&
      resource.data_class != "INTERNAL_ONLY"
    };

    // Source: policy/tenant-scope.cedar
    permit (
      principal in TenantOperator::?p,
      action in [
        Action::"list_secret_references",
        Action::"read_rotation_policy",
        Action::"read_namespace_metadata",
        Action::"read_own_audit",
        Action::"read_attestation_report"
      ],
      resource in TenantNamespace::?r
    )
    when {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id
    };

    permit (
      principal in TenantOperator::?p,
      action == Action::"upload_byok",
      resource in TenantNamespace::?r
    )
    when {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id &&
      principal has mfa_verified &&
      principal.mfa_verified == true &&
      principal has jit_elevation_active &&
      principal.jit_elevation_active == true
    };

    permit (
      principal in WorkloadIdentity::?p,
      action == Action::"resolve_secret_reference",
      resource in SecretReferenceResource::?r
    )
    when {
      principal has spiffe_id &&
      principal has tenant_id &&
      principal has microservice &&
      resource has tenant_id &&
      resource has microservice &&
      principal.tenant_id == resource.tenant_id &&
      principal.microservice == resource.microservice
    };

    permit (
      principal in WorkloadIdentity::?p,
      action == Action::"resolve_secret_reference",
      resource in SharedSecretReferenceResource::?r
    )
    when {
      resource has scope &&
      resource.scope == "shared" &&
      principal has microservice &&
      resource has reader_allowlist &&
      principal.microservice in resource.reader_allowlist
    };

    forbid (
      principal,
      action in [
        Action::"list_secret_references",
        Action::"read_rotation_policy",
        Action::"read_namespace_metadata",
        Action::"read_own_audit",
        Action::"read_attestation_report",
        Action::"resolve_secret_reference",
        Action::"upload_byok"
      ],
      resource
    )
    unless {
      principal has tenant_id &&
      resource has tenant_id &&
      principal.tenant_id == resource.tenant_id
    };

    forbid (
      principal in WorkloadIdentity::?p,
      action == Action::"resolve_secret_reference",
      resource in SecretReferenceResource::?r
    )
    unless {
      principal has microservice &&
      resource has microservice &&
      principal.microservice == resource.microservice
    };

    forbid (
      principal in TenantOperator::?p,
      action == Action::"resolve_secret_reference",
      resource
    );

    forbid (
      principal in Human::?p,
      action,
      resource
    )
    when {
      resource has data_class &&
      resource.data_class == "SECRET"
    };

    forbid (
      principal,
      action,
      resource
    )
    when {
      principal has pack &&
      resource has pack &&
      principal.pack != resource.pack
    };

    // Source: cedar/policies.cedar
    permit(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ComputeAutoshardingPlacement", Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-secrets" &&
      context.doctrine.adr_0348 == true &&
      context.autosharding_mode == "control_plane_driven" &&
      context.honors_residency == true &&
      context.compliance_pack_check_result == "pass" &&
      context.residency_check_result == "pass" &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-secrets" &&
      (
        context.honors_residency == false ||
        context.compliance_pack_check_result != "pass" ||
        context.residency_check_result != "pass" ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action == Action::"MigrateTenantCrossJurisdiction",
      resource is TenantMigration
    ) unless {
      resource.microservice == "cloud-secrets" &&
      context.cedar_permit_id != "" &&
      context.cross_jurisdiction_permit_id != "" &&
      context.audit_chain_emit == true
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunCiMirror",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-secrets" &&
      context.doctrine.adr_0346 == true &&
      context.verify_ci_required == true &&
      context.steps.cargo_fmt_all_check == true &&
      context.steps.cargo_check_workspace_all_targets == true &&
      context.steps.cargo_clippy_workspace_all_targets_d_warnings == true &&
      context.steps.cargo_nextest_workspace_no_fail_fast == true &&
      context.steps.gate_run_all_ci_required == true &&
      context.step_exit_semantics == "block_on_exit_0_each_step" &&
      context.exit_code_contract in [0, 1, 2]
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunSelfHostedCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-secrets" &&
      context.doctrine.adr_0349 == true &&
      context.github_actions_parity_ok == true &&
      context.jcasc_declared == true &&
      context.lane_prefix in ["governance", "check"] &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action in [Action::"RunCiMirror", Action::"RunSelfHostedCi"],
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-secrets" &&
      (
        context.github_actions_parity_ok == false ||
        context.jcasc_declared == false ||
        context.lane_id.matches("^governance-.*$")
      )
    };

    permit(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-secrets" &&
      context.doctrine.adr_0349 == true &&
      context.cosign_signature_verified == true &&
      context.tenant_namespace_isolated == true &&
      context.cedar_policy_gate_granted == true &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-secrets" &&
      (
        context.cosign_signature_verified == false ||
        context.tenant_namespace_isolated == false ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal,
      action == Action::"AuthorGovernanceLane",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-secrets" &&
      context.doctrine.adr_0347 == true &&
      context.lane_id.matches("^governance-.*$") &&
      context.historical_reference != true
    };

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
