# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
# OpenBao 2.x LTS — production HA values for the cloud-secrets µservice.
#
# Auto-unseal: PKCS#11 via HSM partition (OCI Cloud-HSM or Thales Luna per pack).
# Storage: Postgres-HA (via patroni; see ../postgres/).
# Audit: file device locally; bridged to audit-chain by audit-emitter.
#
# CRITICAL — every secret reference uses ${openbao:secret/...} form OR the
# bootstrap-only ${openbao_bootstrap:...} form (4-eye HSM ceremony seeds).
# NO raw values in this file.

openbao:
  fullnameOverride: openbao
  image:
    repository: openbao/openbao
    tag: "2.0.0"   # LTS pinned per docs/standards/version-pinning.md
    pullPolicy: IfNotPresent

  global:
    enabled: true
    tlsDisable: false   # mTLS-only
    serverTelemetry:
      prometheusOperator: true

  server:
    enabled: true
    ha:
      enabled: true
      replicas: 5
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false   # no public UI; admin via REST + ops CLI

          listener "tcp" {
            address     = "[::]:8200"
            tls_disable = 0
            tls_cert_file        = "/openbao/tls/tls.crt"
            tls_key_file         = "/openbao/tls/tls.key"
            tls_client_ca_file   = "/openbao/tls/ca.crt"
            tls_require_and_verify_client_cert = "true"   # mTLS mandatory
          }

          storage "postgresql" {
            connection_url = "postgresql://openbao@postgres-rw:5432/openbao?sslmode=verify-full"
            table          = "openbao_kv"
            ha_enabled     = "true"
          }

          seal "pkcs11" {
            lib            = "/usr/local/lib/pkcs11/libCryptoki2_64.so"
            slot           = "0"
            pin            = "${openbao_bootstrap:hsm-pin}"
            key_label      = "${openbao_bootstrap:kek-alias}"
            mechanism      = "0x1086"   # CKM_AES_GCM
            generate_key   = "false"    # KEK generated in HSM ceremony; never via OpenBao
          }

          telemetry {
            prometheus_retention_time = "60s"
            disable_hostname           = true
          }

          audit "file" {
            path             = "/var/log/openbao/audit/audit.log"
            log_raw          = false       # NEVER log raw values
            hmac_accessor    = true
            mode             = "0600"
            format           = "json"
            prefix           = ""
          }

          plugin_directory = "/openbao/plugins"

    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"

    serviceAccount:
      create: true
      name: openbao
      annotations:
        spiffe.io/spiffe-identity: "spiffe://oyatie.dev/cloud-secrets/${pack_overlay}/openbao"

    auditStorage:
      enabled: true
      storageClass: "oci-bv-luks"   # LUKS-encrypted block storage
      size: "10Gi"
      mountPath: "/var/log/openbao/audit"

    dataStorage:
      enabled: false   # storage is Postgres-HA, not local volumes

    extraEnvironmentVars:
      OPENBAO_LOG_LEVEL: "info"
      OPENBAO_LOG_FORMAT: "json"

    networkPolicy:
      enabled: true
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app: postgres
          ports:
            - port: 5432
              protocol: TCP
        - to:
            - namespaceSelector:
                matchLabels:
                  name: cloud-secrets-${pack_overlay}
          ports:
            - port: 8200
              protocol: TCP

    livenessProbe:
      enabled: true
      execCommand:
        - /bin/sh
        - -ec
        - "openbao status -tls-skip-verify"
      initialDelaySeconds: 60
      periodSeconds: 10

    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true&perfstandbyok=true"

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200
    annotations:
      service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"

  injector:
    enabled: false   # SDK is the integration surface; injector not used

  csi:
    enabled: false   # SDK is the integration surface; CSI not used

  ui:
    enabled: false   # no UI; admin via REST + CLI only
