# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
# Patroni-HA Postgres for OpenBao storage backend.
# 3-node HA per `multi-region.md`; sync replication; LUKS at rest; encrypted backups.

postgresql:
  fullnameOverride: postgres
  image:
    registry: ghcr.io
    repository: zalando/spilo-16
    tag: "3.2-p3"   # Patroni 3.2; Postgres 16.x LTS

  replicaCount: 3   # 3-node Patroni-HA

  postgresql:
    parameters:
      ssl: "on"
      ssl_cert_file: "/run/certs/tls.crt"
      ssl_key_file: "/run/certs/tls.key"
      ssl_ca_file: "/run/certs/ca.crt"
      synchronous_commit: "remote_apply"   # sync replication
      max_connections: "200"
      shared_buffers: "8GB"
      effective_cache_size: "24GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      wal_level: "replica"
      max_wal_senders: "10"
      wal_keep_size: "8GB"
      log_destination: "csvlog"
      log_min_duration_statement: "1s"
      logging_collector: "on"

  patroni:
    synchronous_mode: true
    synchronous_mode_strict: true   # refuse writes if no sync replica
    maximum_lag_on_failover: 1048576   # 1 MiB

  storage:
    storageClassName: "oci-bv-luks"   # LUKS encrypted via per-pack BCDR KEK
    size: 500Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: "2000m"
      memory: "32Gi"
    limits:
      cpu: "4000m"
      memory: "64Gi"

  serviceAccount:
    create: true
    name: postgres
    annotations:
      spiffe.io/spiffe-identity: "spiffe://oyatie.dev/cloud-secrets/${pack_overlay}/postgres"

  backup:
    enabled: true
    schedule: "0 */1 * * *"   # hourly incremental; daily full via cron
    retention: "168h"          # 7 days hot; longer in cold via lifecycle policy
    encryption:
      enabled: true
      # Backups encrypted with the per-pack BCDR KEK (HSM-wrapped).
      kmsKeyRef: "${openbao:secret/shared/cloud-secrets/postgres-backup-kek}"
    storage:
      provider: "oci-object-storage"
      bucket: "oyatie-${pack_overlay}-postgres-backups"
      pathPrefix: "openbao/"

  networkPolicy:
    enabled: true
    egress: []   # Patroni egress restricted to within cluster
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: openbao
        ports:
          - port: 5432
            protocol: TCP

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
