# Canonical-base: microservices/governance/iac/helm/_oyatie-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: postgres
description: Patroni-HA Postgres backend for OpenBao (cloud-secrets µservice)
type: application
version: 0.1.0
appVersion: "16.4"   # Postgres LTS pinned per docs/standards/version-pinning.md
home: https://github.com/zalando/postgres-operator
sources:
  - https://github.com/zalando/postgres-operator
maintainers:
  - name: axis-cloud-secrets + ops-sre
    email: axis-cloud-secrets@oyatie.com
keywords:
  - postgres
  - patroni
  - openbao-storage-backend
dependencies:
  - name: postgres-operator
    version: "1.12.0"   # Zalando postgres-operator LTS pinned
    repository: "https://opensource.zalando.com/postgres-operator/charts/postgres-operator"
annotations:
  cloud-secrets.oyatie.dev/pack: "${pack_overlay}"
  cloud-secrets.oyatie.dev/role: openbao-storage-backend
