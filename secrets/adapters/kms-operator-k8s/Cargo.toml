[package]
name = "secrets-kms-operator-k8s"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Transient kube-rs adapter for the Cloud KMS operator. ADR-0510-marked:
# kube-rs/k8s-openapi are isolated here until the owned cloud-k8s port cutover.

[lib]
name = "secrets_kms_operator_k8s"
path = "src/lib.rs"
doctest = false

[dependencies]
secrets-kms-operator-kernel = { path = "../../core/kms-operator-kernel" }
secrets-kms-domain = { path = "../../core/kms-domain" }

network-residency = { path = "../../../network/core/residency" }
futures = "0.3"
kube = { workspace = true }
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tracing = { workspace = true }

[lints]
workspace = true
