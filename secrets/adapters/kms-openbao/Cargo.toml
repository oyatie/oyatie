[package]
name = "secrets-kms-openbao"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "secrets_kms_openbao"
path = "src/lib.rs"
doctest = false

[dependencies]
# Keep the workspace on one public base64 major version.  Reindeer emits a
# single unversioned alias for direct dependencies, so a 0.21/0.22 split makes
# full regeneration ambiguous.
base64 = "0.22"
secrets-kms-domain = { path = "../../core/kms-domain" }
secrets-kms-enclave = { path = "../../core/kms-enclave" }
zeroize = "1.8"

[dev-dependencies]
data-boundary-kernel = { path = "../../../base/data-boundary-kernel" }

[lints]
workspace = true
