# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Story G002 (LANE-G02 trust-substrate): control-plane envelope operation
# latency for the crypto-enclave kernel (wrap/unwrap of KEKs and DEKs).
# Envelope operations sit on tenant-provisioning and key-rotation paths, not
# the per-request data path (the DEK cache keeps KMS off the hot path per
# ADR-0536 D-8), so the bound is tens of milliseconds.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-kms-envelope-wrap-latency-p99
  displayName: "KMS envelope wrap/unwrap p99 latency"
  labels:
    microservice: cloud-kms
    bounded_context: enclave
    tier: control-plane
    plane: control
spec:
  service: cloud-kms
  description: "p99 latency of enclave envelope operations (KEK wrap/unwrap under the sealing root, DEK generate/unwrap under a KEK version). Budget burn degrades tenant provisioning and rotation throughput; it must never degrade data-plane reads, which are served from the bounded-TTL DEK cache."
  indicator:
    metadata:
      name: cloud-kms-envelope-wrap-latency-p99-sli
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(cloud_kms_envelope_op_duration_seconds_bucket[5m])) by (le))'
  objectives:
    - displayName: "99% of envelope operations complete within 50ms over rolling 30d"
      target: 0.99
      op: lte
      value: 0.050
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
