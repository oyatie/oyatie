# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-hsm-availability
  displayName: "cloud-secrets: HSM availability 99.99% (PKCS#11 substrate)"
  labels:
    microservice: cloud-secrets
    bounded_context: hsm-integration
    sli_class: availability
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-secrets + ops-security
    pack_scope: all
spec:
  service: cloud-secrets
  description: |
    HSM availability SLO. A PKCS#11 op is "good" when it returns within
    the HSM session deadline (sign/verify/wrap/unwrap). Required for
    transit-key sealing + master-key rotation. Per ADR-0029 HSM-backed
    KMS substrate. Cross-cutting dependency for audit-chain seal-write.
  indicator:
    metadata:
      name: cloud-secrets-hsm-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_hsm_op_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_hsm_op_total[5m]))
  objectives:
    - target: 0.9999
      displayName: "30d rolling HSM availability ≥ 99.99%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
