# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-secret-resolve-latency
  displayName: "cloud-secrets: secret resolve latency p99 ≤ 100ms"
  labels:
    microservice: cloud-secrets
    bounded_context: resolver
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-secrets
    pack_scope: all
spec:
  service: cloud-secrets
  description: |
    Secret resolve latency p99 SLO. A resolve is "good" when the
    SecretReference URI → OpenBao lookup → cache-hit-or-fresh-read → deliver
    completes in ≤ 100ms p99. Per PRD §"Performance Targets" hot-path
    resolve. Every µservice depends on this latency for boot + rotation.
  indicator:
    metadata:
      name: cloud-secrets-resolve-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_resolve_duration_seconds_bucket{le="0.1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_resolve_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 100ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
