# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-pki-cert-issuance-latency
  displayName: "cloud-secrets: PKI cert issuance latency p95 ≤ 1s"
  labels:
    microservice: cloud-secrets
    bounded_context: resolver
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-secrets + ops-security
    pack_scope: all
spec:
  service: cloud-secrets
  description: |
    PKI cert issuance latency p95 SLO. A cert issuance is "good" when the
    CSR → OpenBao PKI sign → cert delivery completes in ≤ 1s p95. Required
    for SPIFFE workload identity bootstrap + per-pod sidecar TLS. Per
    PRD §"Performance Targets" PKI hot-path.
  indicator:
    metadata:
      name: cloud-secrets-pki-issuance-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_pki_issue_duration_seconds_bucket{le="1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_pki_issue_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 1s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
