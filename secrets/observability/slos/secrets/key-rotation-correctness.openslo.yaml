# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-key-rotation-correctness
  displayName: "cloud-secrets: key rotation correctness 100% (cadence honored)"
  labels:
    microservice: cloud-secrets
    bounded_context: key-rotation
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-cloud-secrets + ops-security
    pack_scope: all
    compliance: [NIST-SP-800-57, PCI-DSS-3.6, SOC2-CC6.1]
spec:
  service: cloud-secrets
  description: |
    Key rotation correctness SLO. A scheduled rotation is "good" when the
    new key is generated, sealed, distributed, and verified within its
    declared cadence window AND the prior key is retired (read-only) before
    the next cadence expires. Per ADR-0029 key-lifecycle invariant.
    Target = 100%; any miss is Sev-2 (compliance violation).
  indicator:
    metadata:
      name: cloud-secrets-key-rotation-on-cadence-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_key_rotation_total{outcome="on_cadence"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_key_rotation_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% rotation-on-cadence (any miss is Sev-2 compliance violation)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
