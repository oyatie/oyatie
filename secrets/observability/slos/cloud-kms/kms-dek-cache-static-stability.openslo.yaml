# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Story G002 (LANE-G02 trust-substrate): static-stability SLO for the
# bounded-TTL DEK cache (cloud-kms-enclave-kernel). ADR-0536 D-8 mandates
# that the data plane keeps decrypting while the KMS control plane is down;
# this SLO measures exactly that property in production (ADR-0130 SLO-gated
# promotion).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-kms-dek-cache-static-stability
  displayName: "KMS data-plane decrypt availability during control-plane unavailability"
  labels:
    microservice: cloud-kms
    bounded_context: enclave
    tier: data-plane
    plane: data
spec:
  service: cloud-kms
  description: "Proportion of data-plane DEK serves that succeed (cache hit within the TTL static-stability window or control-plane fetch) versus fail-closed denials. Static stability means control-plane outages shorter than the TTL window cause zero data-plane decrypt failures; sustained burn indicates the TTL bound is being exceeded by real outages or the cache is being bypassed with per-request KMS calls (rejected anti-pattern, ADR-0536 D-8)."
  indicator:
    metadata:
      name: cloud-kms-dek-cache-static-stability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(cloud_kms_dek_serve_total{outcome=~"cache_hit|control_plane_fetch"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(cloud_kms_dek_serve_total[5m]))'
  objectives:
    - displayName: "99.99% of DEK serves succeed over rolling 30d"
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
