# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# Story G002 (cloud-kms operator): convergence latency for KMS CRD desired-state
# reconcile cycles. The operator is control-plane only; data-plane encrypt and
# decrypt paths must remain served by active key versions and DEK cache behavior.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-kms-reconcile-convergence
  displayName: "KMS operator reconcile convergence"
  labels:
    microservice: cloud-kms
    bounded_context: operator
    tier: control-plane
    plane: control
    adr_0510: transient-kms-operator-kube-adapter
  annotations:
    instrumentation_status: target-only
    current_runtime_signal: "structured tracing event cloud_kms_operator_reconcile"
    exporter_gap: "Prometheus histogram cloud_kms_operator_reconcile_convergence_seconds_bucket is not exported in this slice."
    current_actuation_scope: "CloudKmsDirectory-backed runtime reconciles KmsKeyRing create/rotate, KmsSealingRoot create, decrypt-only demotion, and key-ring quarantine through Cloud KMS domain lifecycle ports."
spec:
  service: cloud-kms
  description: "Target SLO for time to converge KmsKeyRing and KmsSealingRoot desired state after a CRD watch event. The current CloudKmsDirectory-backed runtime domain-actuates KmsKeyRing create/rotate paths, KmsSealingRoot creation, decrypt-only demotion, and key-ring quarantine, while partial or ambiguous observed state fails closed without mutation. The operator emits the structured wide-event cloud_kms_operator_reconcile with convergence_seconds; the Prometheus histogram below is the target exporter mapping, not a claim that the exporter is live in this slice."
  indicator:
    metadata:
      name: cloud-kms-reconcile-convergence-sli
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(cloud_kms_operator_reconcile_convergence_seconds_bucket{microservice="cloud-kms"}[5m])) by (le))'
  objectives:
    - displayName: "99% of reconcile cycles converge within 60s over rolling 30d"
      target: 0.99
      op: lte
      value: 60
    - displayName: "99.9% of fail-closed partial-observation cycles emit a structured event within 10s"
      target: 0.999
      op: lte
      value: 10
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
