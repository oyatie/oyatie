# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-secret-write-latency
  displayName: "cloud-secrets: secret write latency p95 ≤ 200ms"
  labels:
    microservice: cloud-secrets
    bounded_context: resolver
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cloud-secrets
    pack_scope: all
spec:
  service: cloud-secrets
  description: |
    Secret write latency p95 SLO. A write is "good" when the PUT path
    (validate → OpenBao-write → HSM-wrap-key-if-needed → audit-emit) is
    ≤ 200ms p95. Per PRD §"Performance Targets" secret-mutation path.
  indicator:
    metadata:
      name: cloud-secrets-write-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_write_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_write_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 200ms for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
