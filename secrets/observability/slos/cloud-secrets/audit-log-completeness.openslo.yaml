# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-secrets-audit-log-completeness
  displayName: "cloud-secrets: audit log completeness 100% (every op sealed)"
  labels:
    microservice: cloud-secrets
    bounded_context: audit-emitter
    sli_class: correctness
    tier: load-bearing-invariant
    plane: audit
    owner_team: axis-cloud-secrets + council-privacy
    pack_scope: all
    compliance: [SOC2-CC7, ISO27001-A12.4]
spec:
  service: cloud-secrets
  description: |
    Audit log completeness SLO. An op is "good" when its corresponding
    audit-chain seal-emit ack returns within the same request lifetime
    (sync seal contract). Any op without a sealed audit row = Sev-2
    compliance event. Per ADR-0030 sync-audit contract + IP-013 emitter.
  indicator:
    metadata:
      name: cloud-secrets-audit-completeness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_op_total{audit_sealed="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_secrets_op_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% audit completeness (any miss is Sev-2)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
