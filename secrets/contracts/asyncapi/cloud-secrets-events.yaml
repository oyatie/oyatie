asyncapi: 3.1.0
info:
  title: cloud-secrets — events
  version: 1.0.0
  summary: SecretLifecycle + Attestation + Namespace events emitted by cloud-secrets
  description: |
    Cross-µservice Workflow events emitted by cloud-secrets BCs. Per ADR-0028
    every event is Ed25519-signed by the emitter SPIFFE identity and sealed
    in `audit-chain`.

    Consumers:
    - `audit-chain` µservice (Merkle + Ed25519 seal)
    - `tenancy` µservice (per-tenant inventory)
    - `governance` µservice (compliance evidence)
    - `grafana-oncall` (Sev-1 paging on RotationOverdue, KekAttested-failed)
    - downstream consumer SDKs (cache-flush on Revoked + Rotated)
  contact:
    name: axis-cloud-secrets

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.cloud-secrets.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus
  audit-chain-bridge:
    host: audit-chain.svc.cluster.local
    protocol: https
    description: Ed25519-signed bridge to audit-chain µservice
  revocation-push:
    host: revocation-push.cloud-secrets.svc.cluster.local
    protocol: sse
    description: Server-sent events for consumer SDK revocation push

channels:
  secret-created:
    address: workflow-events/secret.created
    messages:
      SecretCreatedMessage:
        $ref: '#/components/messages/SecretCreated'
    description: A new secret was written to OpenBao via SDK or admin endpoint.

  secret-rotated:
    address: workflow-events/secret.rotated
    messages:
      SecretRotatedMessage:
        $ref: '#/components/messages/SecretRotated'
    description: A secret was rotated (new version active).

  secret-revoked:
    address: workflow-events/secret.revoked
    messages:
      SecretRevokedMessage:
        $ref: '#/components/messages/SecretRevoked'
    description: A secret was revoked (no longer resolvable until rotated).

  secret-accessed:
    address: workflow-events/secret.accessed
    messages:
      SecretAccessedMessage:
        $ref: '#/components/messages/SecretAccessed'
    description: A secret was resolved by a consumer SDK.

  namespace-provisioned:
    address: workflow-events/namespace.provisioned
    messages:
      NamespaceProvisionedMessage:
        $ref: '#/components/messages/NamespaceProvisioned'
    description: A tenant namespace was provisioned.

  namespace-sealed:
    address: workflow-events/namespace.sealed
    messages:
      NamespaceSealedMessage:
        $ref: '#/components/messages/NamespaceSealed'
    description: A tenant namespace was sealed (deprovision in progress).

  kek-attested:
    address: workflow-events/kek.attested
    messages:
      KekAttestedMessage:
        $ref: '#/components/messages/KekAttested'
    description: Daily HSM attestation snapshot.

  rotation-overdue:
    address: workflow-events/rotation.overdue
    messages:
      RotationOverdueMessage:
        $ref: '#/components/messages/RotationOverdue'
    description: A scheduled rotation has not completed within SLA.

  revocation-push:
    address: revocation-push/secret/{path}
    messages:
      RevocationPushMessage:
        $ref: '#/components/messages/RevocationPush'
    description: Server-sent revocation event to consumer SDKs.

operations:
  emitSecretCreated:
    action: send
    channel: {$ref: '#/channels/secret-created'}
  emitSecretRotated:
    action: send
    channel: {$ref: '#/channels/secret-rotated'}
  emitSecretRevoked:
    action: send
    channel: {$ref: '#/channels/secret-revoked'}
  emitSecretAccessed:
    action: send
    channel: {$ref: '#/channels/secret-accessed'}
  emitNamespaceProvisioned:
    action: send
    channel: {$ref: '#/channels/namespace-provisioned'}
  emitKekAttested:
    action: send
    channel: {$ref: '#/channels/kek-attested'}
  emitRotationOverdue:
    action: send
    channel: {$ref: '#/channels/rotation-overdue'}
  pushRevocation:
    action: send
    channel: {$ref: '#/channels/revocation-push'}

components:
  messages:
    SecretCreated:
      name: SecretCreated
      contentType: application/json
      summary: New secret written
      payload: {$ref: '#/components/schemas/SecretLifecyclePayload'}
    SecretRotated:
      name: SecretRotated
      contentType: application/json
      summary: Secret rotated to new version
      payload: {$ref: '#/components/schemas/SecretLifecyclePayload'}
    SecretRevoked:
      name: SecretRevoked
      contentType: application/json
      summary: Secret revoked
      payload: {$ref: '#/components/schemas/SecretRevokedPayload'}
    SecretAccessed:
      name: SecretAccessed
      contentType: application/json
      summary: Secret resolved by a consumer
      payload: {$ref: '#/components/schemas/SecretAccessedPayload'}
    NamespaceProvisioned:
      name: NamespaceProvisioned
      contentType: application/json
      summary: Tenant namespace created
      payload: {$ref: '#/components/schemas/NamespaceLifecyclePayload'}
    NamespaceSealed:
      name: NamespaceSealed
      contentType: application/json
      summary: Tenant namespace sealed (deprovision in progress)
      payload: {$ref: '#/components/schemas/NamespaceLifecyclePayload'}
    KekAttested:
      name: KekAttested
      contentType: application/json
      summary: HSM attestation snapshot
      payload: {$ref: '#/components/schemas/KekAttestedPayload'}
    RotationOverdue:
      name: RotationOverdue
      contentType: application/json
      summary: Rotation past SLA
      payload: {$ref: '#/components/schemas/RotationOverduePayload'}
    RevocationPush:
      name: RevocationPush
      contentType: application/json
      summary: Server-sent revocation push to SDK
      payload: {$ref: '#/components/schemas/RevocationPushPayload'}

  schemas:
    SecretLifecyclePayload:
      type: object
      required: [event_id, secret_path_hash, tenant_hash, microservice, version, occurred_at, signature]
      properties:
        event_id: {type: string, description: ULID}
        secret_path_hash:
          type: string
          description: sha256(secret_path); raw path never in events
        tenant_hash: {type: string}
        microservice: {type: string}
        version: {type: integer, minimum: 1}
        data_class:
          type: string
          enum: [SECRET, AUDIT, INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, SENSITIVE_PIPA_ART23]
        occurred_at: {type: string, format: date-time}
        emitter_spiffe_id: {type: string}
        signature: {type: string, description: Ed25519}
        incident_id: {type: string, nullable: true}

    SecretRevokedPayload:
      type: object
      required: [event_id, secret_path_hash, tenant_hash, reason, occurred_at, signature]
      properties:
        event_id: {type: string}
        secret_path_hash: {type: string}
        tenant_hash: {type: string}
        microservice: {type: string}
        reason:
          type: string
          enum: [leaked-in-repo, leaked-in-chat, leaked-in-checkpoint, leaked-in-log, leaked-external-disclosure, suspected-compromise, end-of-life]
        cascade_dependents:
          type: array
          items:
            type: string
        occurred_at: {type: string, format: date-time}
        emitter_spiffe_id: {type: string}
        signature: {type: string}
        incident_id: {type: string, nullable: true}

    SecretAccessedPayload:
      type: object
      required: [event_id, secret_path_hash, tenant_hash, principal_spiffe_id, occurred_at, signature]
      properties:
        event_id: {type: string}
        secret_path_hash: {type: string}
        tenant_hash: {type: string}
        microservice: {type: string}
        principal_spiffe_id: {type: string}
        access_outcome:
          type: string
          enum: [success, denied, revoked, cache_hit, cache_miss]
        occurred_at: {type: string, format: date-time}
        signature: {type: string}

    NamespaceLifecyclePayload:
      type: object
      required: [event_id, tenant_hash, pack, occurred_at, signature]
      properties:
        event_id: {type: string}
        tenant_hash: {type: string}
        pack: {type: string}
        namespace_path: {type: string}
        active_microservices:
          type: array
          items: {type: string}
        occurred_at: {type: string, format: date-time}
        emitter_spiffe_id: {type: string}
        signature: {type: string}

    KekAttestedPayload:
      type: object
      required: [event_id, pack, partition_id, vendor, verified, occurred_at, signature]
      properties:
        event_id: {type: string}
        pack: {type: string}
        partition_id: {type: string}
        vendor:
          type: string
          enum: [oci-cloud-hsm, thales-luna]
        verified: {type: boolean}
        attestation_sha: {type: string}
        firmware_version: {type: string}
        fips_140_3_level: {type: integer, enum: [3, 4]}
        occurred_at: {type: string, format: date-time}
        signature: {type: string}

    RotationOverduePayload:
      type: object
      required: [event_id, secret_path_hash, due_at, observed_at, signature]
      properties:
        event_id: {type: string}
        secret_path_hash: {type: string}
        tenant_hash: {type: string}
        microservice: {type: string}
        rotation_policy_id: {type: string}
        due_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        overdue_seconds: {type: integer, minimum: 0}
        signature: {type: string}

    RevocationPushPayload:
      type: object
      required: [event_id, secret_path_hash, version_revoked, occurred_at, signature]
      properties:
        event_id: {type: string}
        secret_path_hash: {type: string}
        version_revoked: {type: integer}
        occurred_at: {type: string, format: date-time}
        signature: {type: string}
