// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// cloud-secrets µservice — gRPC contracts
//
// Used by:
//   - SecretReference SDK (Rust + TS + Python) for the resolver hot path
//   - openbao-operator + key-rotation-scheduler + per-tenant-namespace-controller
//     internal control plane
//   - audit-emitter bridge to audit-chain
//
// Authentication: mTLS via SPIFFE workload identity. The SPIFFE SVID is
// presented as the client cert; the server validates against the policy
// fragments under secrets/policy/
//
// CRITICAL — the proto carries SecretReferences (paths) and resolved
// transient values. Resolved values use the `ResolvedSecret` message which
// MUST be treated as `Secret<T>` in client SDKs: zeroised on drop, never
// logged, never serialised to persistent storage.

syntax = "proto3";

package oya.cloud_secrets.v1;

option go_package = "github.com/oyatie/cloud-secrets/proto/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// =============================================================================
// SecretReference resolution service (SDK hot path)
// =============================================================================

service SecretReferenceResolver {
  // Resolve a SecretReference to a transient ResolvedSecret. The returned
  // value MUST be wrapped in Secret<T> client-side and zeroised on drop.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // List references within (tenant, microservice) scope. Returns metadata
  // only, never values.
  rpc List(ListRequest) returns (ListResponse);

  // Subscribe to revocation push events. Returns a server-streaming
  // sequence of RevocationPush events; SDK flushes cache on each.
  rpc SubscribeRevocations(SubscribeRevocationsRequest)
      returns (stream RevocationPush);
}

message ResolveRequest {
  // SecretReference URI: openbao:secret/<tenant>/<microservice>/<name>[@version]
  string reference_uri = 1;
  // Optional explicit version (overrides @version in URI)
  optional uint64 version = 2;
}

message ResolveResponse {
  // The resolved secret. CLIENT MUST wrap in Secret<T> and zeroise on drop.
  ResolvedSecret resolved = 1;
  // Cache TTL hint; client MUST clamp to ≤60s.
  google.protobuf.Duration cache_ttl_hint = 2;
}

message ResolvedSecret {
  // The raw secret bytes. NEVER log; NEVER persist.
  bytes value = 1;
  // Version that produced this value.
  uint64 version = 2;
  // Data class for downstream handling.
  DataClass data_class = 3;
  // Resolved at (server time).
  google.protobuf.Timestamp resolved_at = 4;
  // HMAC over (reference_uri, version, resolved_at) — SDK validates on
  // cache-hit to detect in-process tampering.
  bytes integrity_hmac = 5;
}

message ListRequest {
  string tenant = 1;
  string microservice = 2;
  optional uint32 page_size = 3;
  optional string page_token = 4;
}

message ListResponse {
  repeated SecretReferenceMetadata references = 1;
  optional string next_page_token = 2;
}

message SecretReferenceMetadata {
  string reference_uri = 1;
  uint64 version = 2;
  DataClass data_class = 3;
  string rotation_policy_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_rotated_at = 6;
}

message SubscribeRevocationsRequest {
  string tenant = 1;
  string microservice = 2;
  // Resume-from cursor; empty = from now.
  optional string since_event_id = 3;
}

message RevocationPush {
  string event_id = 1;       // ULID
  // sha256(secret_path); raw path never on the wire here
  bytes secret_path_hash = 2;
  uint64 version_revoked = 3;
  google.protobuf.Timestamp occurred_at = 4;
  bytes signature = 5;       // Ed25519
}

enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  SECRET = 1;
  AUDIT = 2;
  INTERNAL_ONLY = 3;
  BEHAVIORAL_TENANT_PRODUCT = 4;
  SENSITIVE_PIPA_ART23 = 5;
}

// =============================================================================
// Key rotation scheduler (control plane)
// =============================================================================

service KeyRotationScheduler {
  rpc Rotate(RotateRequest) returns (RotateResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc GetCascade(GetCascadeRequest) returns (GetCascadeResponse);
  rpc ListOverdue(ListOverdueRequest) returns (ListOverdueResponse);
}

message RotateRequest {
  string reference_uri = 1;
  bool cascade = 2;
  Priority priority = 3;
  string reason = 4;
  optional string incident_id = 5;
}

message RotateResponse {
  string rotation_job_id = 1;
  google.protobuf.Timestamp accepted_at = 2;
}

message RevokeRequest {
  string reference_uri = 1;
  RevokeReason reason = 2;
  optional string incident_id = 3;
  bool cascade_dependents = 4;
}

message RevokeResponse {
  google.protobuf.Timestamp revoked_at = 1;
  repeated string cascade_paths = 2;
}

message GetCascadeRequest {
  string reference_uri = 1;
}

message GetCascadeResponse {
  // Topologically sorted; root first, leaves last.
  repeated string dependents = 1;
}

message ListOverdueRequest {
  string pack = 1;
  google.protobuf.Timestamp since = 2;
}

message ListOverdueResponse {
  repeated OverdueRotation overdue = 1;
}

message OverdueRotation {
  string reference_uri = 1;
  string rotation_policy_id = 2;
  google.protobuf.Timestamp due_at = 3;
  uint64 overdue_seconds = 4;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  IMMEDIATE = 4;
}

enum RevokeReason {
  REVOKE_REASON_UNSPECIFIED = 0;
  LEAKED_IN_REPO = 1;
  LEAKED_IN_CHAT = 2;
  LEAKED_IN_CHECKPOINT = 3;
  LEAKED_IN_LOG = 4;
  LEAKED_EXTERNAL_DISCLOSURE = 5;
  SUSPECTED_COMPROMISE = 6;
  END_OF_LIFE = 7;
}

// =============================================================================
// Per-tenant namespace controller (control plane)
// =============================================================================

service PerTenantNamespaceController {
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  rpc Seal(SealRequest) returns (SealResponse);
  rpc Get(GetNamespaceRequest) returns (GetNamespaceResponse);
}

message ProvisionRequest {
  string tenant_id = 1;       // raw; salted-hash performed server-side
  string pack = 2;
  repeated string microservices = 3;
}

message ProvisionResponse {
  string namespace_path = 1;
  google.protobuf.Timestamp provisioned_at = 2;
}

message SealRequest {
  string tenant_id = 1;
  string reason = 2;
}

message SealResponse {
  google.protobuf.Timestamp sealed_at = 1;
  google.protobuf.Timestamp cryptographic_erasure_scheduled_at = 2;
}

message GetNamespaceRequest {
  string tenant_id = 1;
}

message GetNamespaceResponse {
  string namespace_path = 1;
  string pack = 2;
  repeated string active_microservices = 3;
  uint64 secret_count = 4;
  bool sealed = 5;
}

// =============================================================================
// HSM integration (control plane)
// =============================================================================

service HsmIntegration {
  rpc Sign(SignRequest) returns (SignResponse);
  rpc GetAttestation(GetAttestationRequest) returns (GetAttestationResponse);
}

message SignRequest {
  string kek_alias = 1;
  bytes payload = 2;
  SignAlgorithm algorithm = 3;
}

message SignResponse {
  bytes signature = 1;
  google.protobuf.Timestamp signed_at = 2;
}

message GetAttestationRequest {
  string pack = 1;
  optional string partition_id = 2;
}

message GetAttestationResponse {
  string pack = 1;
  string partition_id = 2;
  HsmVendor vendor = 3;
  bool verified = 4;
  bytes attestation_sha = 5;
  string firmware_version = 6;
  uint32 fips_140_3_level = 7;
  google.protobuf.Timestamp report_at = 8;
}

enum SignAlgorithm {
  SIGN_ALGORITHM_UNSPECIFIED = 0;
  ED25519 = 1;
  ECDSA_P384 = 2;
  RSA_4096_PSS = 3;
}

enum HsmVendor {
  HSM_VENDOR_UNSPECIFIED = 0;
  OCI_CLOUD_HSM = 1;
  THALES_LUNA = 2;
}
