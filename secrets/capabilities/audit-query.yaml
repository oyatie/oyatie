# Canonical-base: specs/capabilities/canonical-tenant_class-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-secrets:audit-query:v1
name: audit-query
namespace: cloud-secrets
display_name: Audit-chain Query
description: |
  Query the audit-chain for cloud-secrets events (SecretAccessed, SecretRotated,
  SecretRevoked, NamespaceProvisioned, KekAttested, RotationOverdue) over a
  window. Used by:
    - external auditors (SOC 2 / ISO / PCI-DSS / HIPAA / PIPC) for evidence
    - ops-security for forensic during incidents
    - tenants for own audit export (GDPR Art. 15; PIPA Art. 35)

  Returns Ed25519-signed events with Merkle proof; non-repudiation is
  cryptographically guaranteed.

owner_team: axis-cloud-secrets + axis-governance
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0117, ADR-0131]
related_artifacts:
  - microservices/cloud-secrets/PRD.md FR-10
  - microservices/cloud-secrets/contracts/openapi/cloud-secrets.yaml (paths: /audit/query)
  - microservices/cloud-secrets/policy/auditor-scope.cedar

autonomy_tier: T2
# T2 = read-only audit query; sensitive data class (AUDIT + may embed
# PII_QUASI_IDENTIFIER via SPIFFE-id-of-human-operator); requires policy eval.

inputs:
  - name: event_type
    type: enum
    values: [SecretCreated, SecretRotated, SecretRevoked, SecretAccessed, NamespaceProvisioned, NamespaceSealed, KekAttested, RotationOverdue]
    required: false
  - name: since
    type: timestamp
    required: false
  - name: until
    type: timestamp
    required: false
  - name: tenant
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: false
  - name: microservice
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: false
  - name: incident_id
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    required: false

outputs:
  - name: events
    type: array
    items: AuditEvent
  - name: merkle_root
    type: string
    description: Merkle root for the window; auditor verifies inclusion
  - name: total_count
    type: integer

data_classes_touched:
  - AUDIT
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_PIPA_ART23

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud_secrets.audit.query.executed
# Even the query itself is audited (auditor accountability).

cost_profile:
  type: per-query
  estimated_cost_usd_per_call: 0.01
  cost_drivers:
    - audit-chain range scan
    - Merkle proof construction
    - Signature verification (per event)

cedar_policy_fragments:
  - microservices/cloud-secrets/policy/auditor-scope.cedar
  - microservices/cloud-secrets/policy/tenant-scope.cedar

eval_set:
  paiden_inputs_path: microservices/cloud-secrets/capabilities/eval/audit-query-paiden.jsonl
  pass_threshold: 0.999
  eval_metric: query-completeness-against-audit-chain-snapshot
  cadence: per-release
  reference: Bominal ADR-0028 audit-chain Merkle proof spec

sunset:
  status: none
  notes: ""
