# Canonical-base: specs/capabilities/canonical-tenant_class-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-secrets:secret-reference-resolve:v1
name: secret-reference-resolve
namespace: cloud-secrets
display_name: Resolve SecretReference
description: |
  Resolve a `${openbao:secret/<path>}` reference to its current value at
  runtime. THIS IS THE HOT PATH for every oyatie µservice that consumes a
  secret. Resolution is in-process (SDK-side), backed by an LRU cache with
  TTL ≤60s; cache miss escalates to OpenBao (mTLS + SPIFFE-attested) with
  policy evaluation + audit emission.

  CRITICAL — the resolved value MUST be wrapped in `Secret<T>` newtype
  (Rust); JS/Python equivalents enforce equivalent zeroisation. The value
  MUST NEVER be logged, persisted, or echoed in error messages.

owner_team: axis-cloud-secrets
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0117, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - secrets/PRD.md
  - secrets/contracts/proto/cloud-secrets.proto
  - secrets/contracts/openapi/cloud-secrets.yaml
  - secrets/policy/tenant-scope.cedar
  - secrets/policy/secret-isolation.md

autonomy_tier: T0
# T0 = hot-path operation; sub-25ms p99; called by every consumer µservice.
# No agent decision-making; this is mechanical resolution + cache + audit.

inputs:
  - name: reference_uri
    type: string
    pattern: '^openbao:secret/.+$'
    required: true
  - name: version
    type: integer
    minimum: 1
    required: false
    description: explicit version (overrides @version in URI)

outputs:
  - name: resolved_secret
    type: bytes
    description: |
      The resolved secret value. MUST be wrapped in Secret<T> client-side;
      MUST be zeroised on drop; MUST NEVER be logged or persisted.
  - name: version
    type: integer
  - name: data_class
    type: enum
    values: [SECRET, AUDIT, INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, SENSITIVE_PIPA_ART23]
  - name: cache_ttl_hint
    type: duration
    description: SDK MUST clamp to ≤60s

data_classes_touched:
  - SECRET
  # The raw secret value passes through this capability transiently.
  - AUDIT
  # Resolution emits a SecretAccessed audit event.
  - SENSITIVE_PIPA_ART23
  # The reference URI embeds a hashed tenant identifier.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud_secrets.secret.accessed
# Every resolution emits to audit-chain via audit-emitter bridge.

cost_profile:
  type: per-resolution
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - OpenBao KV read on cache miss
    - mTLS handshake (amortised over connection pool)
    - Audit emission (amortised over batch bridge)

cedar_policy_fragments:
  - secrets/policy/tenant-scope.cedar
  - secrets/policy/ci-scope.cedar

eval_set:
  paiden_inputs_path: microservices/cloud-secrets/capabilities/eval/secret-reference-resolve-paiden.jsonl
  pass_threshold: 0.999
  eval_metric: resolution-correctness-against-canonical-OpenBao-KV-snapshots
  cadence: per-release
  reference: OpenBao KV v2 semantics (OpenBao inherits)

sunset:
  status: none
  notes: ""
