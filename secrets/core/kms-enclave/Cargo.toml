[package]
name = "secrets-kms-enclave"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Crypto-enclave kernel for kms: mlock+zeroize one-way-door key material, wrapped-KEK tokens, decrypt-only key-version rotation, bounded-TTL DEK cache for static stability (ADR-0536 D-8, story G002)."

[dependencies]
aws-lc-rs = { workspace = true }
libc = "0.2"
secrets-kms-domain = { path = "../kms-domain" }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[lib]
name = "secrets_kms_enclave"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
