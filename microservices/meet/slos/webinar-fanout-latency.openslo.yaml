apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-webinar-fanout-latency
  displayName: "meet: webinar 10k-attendee fan-out p99 ≤ 5s"
  labels:
    microservice: meet
    bc: webinar
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Time from host content emission to a broadcast-tier attendee receiving
    the HLS segment for a webinar with ≥ 1000 concurrent attendees.
    Per ADR-MEET-0005 (broadcast tier via WHIP/HLS edge mesh).
    Reference: HLS RFC 8216; LL-HLS Apple extension; IETF MoQ future-track.
  service: meet
  indicator:
    metadata:
      name: meet-webinar-fanout
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_webinar_fanout_seconds_bucket{le="5",broadcast_tier="Broadcast"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_webinar_fanout_seconds_count{broadcast_tier="Broadcast"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 webinar broadcast-tier fanout ≤ 5s"
