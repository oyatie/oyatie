# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-participant-join-latency
  displayName: "meet: participant-join latency p95 ≤ 1.5s"
  labels:
    microservice: meet
    bc: meeting-instance
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Time from "join meeting" request to first media frame received. Spans:
    - lobby approval (when applicable),
    - LiveKit access-token issuance,
    - SDP offer/answer exchange,
    - ICE gathering (with STUN; TURN if needed),
    - LiveKit SFU room allocation + DTLS handshake.
    Reference: RFC 8825 (WebRTC), RFC 8866 (SDP), RFC 8445 (ICE).
  service: meet
  indicator:
    metadata:
      name: meet-participant-join
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_participant_join_seconds_bucket{le="1.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_participant_join_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 participant-join ≤ 1.5s"
