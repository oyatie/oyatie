apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-meeting-summary-post-end-latency
  displayName: "meet: meeting summary post-end p95 ≤ 60s for 60min meeting"
  labels:
    microservice: meet
    bc: transcription
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Time from meeting-end to AI summary produced for a 60-minute meeting.
    Includes Whisper-large batch transcript (real-time × 5 on L4 GPU) + LLM
    summary inference. Per ADR-MEET-0002 + ADR-MEET-0006.
  service: meet
  indicator:
    metadata:
      name: meet-meeting-summary
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_summary_produce_seconds_bucket{le="60",meeting_duration_bucket="60min"}[1h]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_summary_produce_seconds_count{meeting_duration_bucket="60min"}[1h]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 60-min summary post-end ≤ 60s"
