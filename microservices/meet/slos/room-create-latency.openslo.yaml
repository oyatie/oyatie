apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-room-create-latency
  displayName: "meet: room-create latency p95 ≤ 100ms"
  labels:
    microservice: meet
    bc: meeting-room
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Latency SLO for the POST → meeting-room created path. A request is "good"
    when its end-to-end latency (REST request received → Postgres commit +
    audit-chain seal acknowledgement) is ≤ 100ms.
  service: meet
  indicator:
    metadata:
      name: meet-room-create-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_room_create_seconds_bucket{le="0.1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_room_create_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 100ms for 95 % of 5min windows over 30d"
