apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-e2e-mls-handshake-latency
  displayName: "meet: E2E MLS handshake p95 ≤ 1.0s (≤ 12 participants)"
  labels:
    microservice: meet
    bc: e2e-encryption
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    MLS group bootstrap or epoch-advance handshake latency for E2E-mode
    meetings, scoped to groups ≤ 12 participants (typical E2E meeting size).
    Reference: RFC 9420 (MLS); ADR-MEET-0003.
  service: meet
  indicator:
    metadata:
      name: meet-mls-handshake
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_mls_handshake_seconds_bucket{le="1.0",group_size_bucket="le12"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_mls_handshake_seconds_count{group_size_bucket="le12"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 MLS handshake ≤ 1.0s for ≤ 12-participant groups"
