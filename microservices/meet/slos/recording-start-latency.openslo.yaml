# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-recording-start-latency
  displayName: "meet: recording start p95 ≤ 800ms"
  labels:
    microservice: meet
    bc: recording
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Time from host "start recording" click to LiveKit Egress acknowledged +
    ffmpeg gVisor sandbox boot + first segment buffered. Per ADR-MEET-0002.
  service: meet
  indicator:
    metadata:
      name: meet-recording-start
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_recording_start_seconds_bucket{le="0.8"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_recording_start_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 recording start ≤ 800ms"
