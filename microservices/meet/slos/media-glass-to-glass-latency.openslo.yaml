# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-media-glass-to-glass-latency
  displayName: "meet: media glass-to-glass p95 ≤ 150ms intra-region; ≤ 250ms inter-region"
  labels:
    microservice: meet
    bc: meeting-instance
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Glass-to-glass latency from publisher capture to subscriber display.
    Includes encode + RTP packetization + LiveKit SFU forwarding + decode.
    Reference: ITU-T Y.1541 IPTV class definitions; RFC 8825 WebRTC.
  service: meet
  indicator:
    metadata:
      name: meet-media-glass-to-glass
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_media_glass_to_glass_seconds_bucket{le="0.15",region_pair="intra"}[5m]))
                +
                sum(rate(oya_meet_media_glass_to_glass_seconds_bucket{le="0.25",region_pair="inter"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_media_glass_to_glass_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 intra ≤ 150ms / inter ≤ 250ms"
