# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meet
commonLabels:
  app.kubernetes.io/name: meet
  app.kubernetes.io/part-of: oya-meet
resources:
  - namespace.yaml
helmCharts:
  - name: oya-meet
    repo: file://../../helm/meet
    version: 0.1.0
    releaseName: meet
    valuesFile: ../../helm/meet/values.yaml
