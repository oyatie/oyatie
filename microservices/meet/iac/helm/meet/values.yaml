# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr
  cluster: meet
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-meet-app
  tag: "1.0.0"

meetingRoomRest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 4
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70

signalingGateway:
  replicas: 6
  resources:
    requests: {cpu: 1000m, memory: 1Gi}
    limits: {cpu: 4000m, memory: 4Gi}
  hpa:
    minReplicas: 6
    maxReplicas: 200
    targetCPUUtilizationPercentage: 65

transcriptionWorker:
  replicas: 2
  resources:
    requests: {cpu: 2000m, memory: 4Gi, nvidia.com/gpu: 1}
    limits: {cpu: 4000m, memory: 8Gi, nvidia.com/gpu: 1}
  nodeSelector: {workload-class: gpu-whisper}
  runtimeClassName: gvisor

recordingMuxWorker:
  replicas: 2
  resources:
    requests: {cpu: 1000m, memory: 2Gi}
    limits: {cpu: 4000m, memory: 4Gi}
  runtimeClassName: gvisor

webinarFanoutWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}

liveStreamEgressWorker:
  replicas: 1
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}

openbao:
  postgresUrl: "${openbao:secret/meet/postgres-url}"
  redisUrl: "${openbao:secret/meet/redis-url}"
  livekitApiKey: "${openbao:secret/meet/livekit-api-key}"
  livekitApiSecret: "${openbao:secret/meet/livekit-api-secret}"
  coturnSharedSecret: "${openbao:secret/meet/coturn-shared-secret}"
  s3AccessKey: "${openbao:secret/meet/s3-access-key}"
  s3SecretKey: "${openbao:secret/meet/s3-secret-key}"
  rtmpEgressKey: "${openbao:secret/meet/rtmp-egress-key}"

livekit:
  enabled: true
coturn:
  enabled: true
