# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: meet-rest
  namespace: meet
  labels: {app.kubernetes.io/name: meet}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meet
    app.kubernetes.io/component: meeting-room-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: v1
kind: Service
metadata:
  name: meet-signaling
  namespace: meet
  labels: {app.kubernetes.io/name: meet}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meet
    app.kubernetes.io/component: signaling-gateway
  ports:
    - {name: wss, port: 443, targetPort: 8443}
