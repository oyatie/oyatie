apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: meet
  namespace: meet
  labels:
    app.kubernetes.io/name: meet
    release: prometheus
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: meet}
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: bc
      metricRelabelings:
        - sourceLabels: [participant_id]
          action: labeldrop
        - sourceLabels: [meeting_instance_id]
          action: labeldrop
