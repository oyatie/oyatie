apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: meet-burn-rate-rules
  namespace: meet
  labels:
    app.kubernetes.io/name: meet
    prometheus: mimir
spec:
  groups:
    - name: meet-recording-rules
      interval: 60s
      rules:
        - record: meet:participant_join:availability_5m
          expr: |
            sum(rate(oya_meet_participant_join_total{result="success"}[5m]))
            /
            sum(rate(oya_meet_participant_join_total[5m]))
        - record: meet:media_g2g_latency:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_meet_media_glass_to_glass_seconds_bucket[5m]))
            )

    - name: meet-burn-rate-alerts
      rules:
        - alert: MeetParticipantJoinFastBurn1h
          expr: |
            (1 - meet:participant_join:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: meet
          annotations:
            summary: "meet participant-join fast-burn (14.4x) for 5m"
            runbook_url: "https://oyatie.dev/microservices/meet/runbooks/sfu-degraded"

        - alert: MeetMediaG2GLatencyP99High
          expr: |
            meet:media_g2g_latency:p99_5m > 0.25
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: meet
            bc: media

        - alert: MeetLiveStreamEgressUnauthorized
          expr: |
            increase(oya_meet_live_stream_egress_unauthorized_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: tenant-opt-in
            microservice: meet
          annotations:
            summary: "meet live-stream-egress to unauthorized RTMP endpoint detected"

    - name: meet-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: meet-llm-capability-circuit-open
          expr: max(oya_meet_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: meet
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "meet LLM/capability circuit-breaker tripped open"
        - alert: meet-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_meet_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: meet
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "meet capability retry-budget exhausted"

    - name: meet-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: meet-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_meet_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: meet
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "meet tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: meet-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: meet-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"meet-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: meet
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "meet pod CPU saturation > 70% sustained 10m"
        - alert: meet-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_meet_responses_5xx_total[5m]))
            /
            sum(rate(oya_meet_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: meet
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "meet 5xx rate > 1% sustained 5m"
        - alert: meet-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_meet_responses_total[5m]))
              /
              sum(rate(oya_meet_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: meet
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "meet inbound RPS dropped > 90% vs prior hour"

    - name: meet-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: meet-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_meet_request_success_total[1h]))
              /
              sum(rate(oya_meet_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: meet
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "meet aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: meet-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_meet_request_success_total[6h]))
              /
              sum(rate(oya_meet_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: meet
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "meet aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
