# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: meet-default-deny, namespace: meet}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: meet-allow-ingress, namespace: meet}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: meet}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-edge}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: meet}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: meet-allow-egress, namespace: meet}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: meet}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: meet-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: meet-valkey}}}]
      ports: [{protocol: TCP, port: 6379}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: livekit-server}}}]
      ports:
        - {protocol: TCP, port: 7880}
        - {protocol: TCP, port: 7881}
        - {protocol: UDP, port: 7882}
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: coturn}}}]
      ports:
        - {protocol: TCP, port: 3478}
        - {protocol: UDP, port: 3478}
        - {protocol: UDP, port: 5349}
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}}]
      ports: [{protocol: TCP, port: 50051}]
    # Cross-cutting carriers per ADR-0140 (retired per ADR-0145) (drive / mail / messenger / calendar
    # / recordings). meet's PRD declares carry concerns for `recordings` (long-
    # running media persistence for the binary-payload pull leg). The orchestration
    # leg (when-to-ingest, retention-policy-binding, legal-hold attachment) is
    # a workflow-engine concern — see the workflow-engine egress below.
    {{- include "oya.networkPolicy.allowEgressToCarriers" $ | nindent 4 }}
    # Post-meeting recording handoff orchestration. meet emits
    # `meet.meeting.v1.ended` → workflow-engine routes
    # `recordings.ingest.v1.requested` → recordings consumes the event and
    # pulls media from meet via signed-URL (binary-payload pull permitted by
    # the ADR-0140 carrier exemption above). The trigger path is
    # workflow-engine-mediated per the Workflow+Ontology adapter rule
    # (feedback_workflow_objectgraph_adapter_layer (retired per ADR-0145)).
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: workflow-engine}}}]
      ports: [{protocol: TCP, port: 50051}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: foundry-runtime}}}]
      ports: [{protocol: TCP, port: 50051}]  # Whisper inference
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# Live-stream-egress can reach external RTMP endpoints (YouTube/Twitch/Vimeo).
# Per ADR-MEET-0004 tenant opt-in only; FQDN egress allowlisted at edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: meet-live-stream-egress-external, namespace: meet}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meet
      app.kubernetes.io/component: live-stream-egress-worker
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: edge-egress-rtmp}}}]
      ports: [{protocol: TCP, port: 1935}, {protocol: TCP, port: 443}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}]
