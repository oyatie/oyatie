# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "meetingRoomRest" "signalingGateway" }}
{{- $c := index $.Values . }}
{{- if $c.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meet-{{ . | kebabcase }}-hpa
  namespace: meet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meet-{{ . | kebabcase }}
  minReplicas: {{ $c.hpa.minReplicas }}
  maxReplicas: {{ $c.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $c.hpa.targetCPUUtilizationPercentage }}}
    - type: Pods
      pods:
        metric:
          name: oya_meet_active_participants
        target: {type: AverageValue, averageValue: "200"}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Percent, value: 10, periodSeconds: 60}]
{{- end }}
{{- end }}
