# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-meet
description: |
  Helm chart for the meet µservice — meeting-room / participant / audio / video /
  screen-share / recording-bridge / transcription / breakout-rooms / webinar-mode /
  live-stream-egress / e2e-encryption BCs deployed with LiveKit SFU + coturn TURN
  + Whisper transcription substrate. Per ADR-0131 flat layout + ADR-0139 SLO-gated
  promotion + ADR-MEET-0001 LiveKit SFU shared with messenger huddles.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - {name: axis-meet, email: axis-meet@oyatie.com}
keywords: [meet, conferencing, video, audio, webrtc, livekit, sfu, webinar, transcription]
dependencies:
  - name: livekit-server
    version: "1.6.2"
    repository: https://helm.livekit.io
    condition: livekit.enabled
  - name: coturn
    version: "0.2.0"
    repository: https://k8s-at-home.com/charts/
    condition: coturn.enabled
