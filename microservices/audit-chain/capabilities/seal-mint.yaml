# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:audit-chain:seal-mint:v1
name: seal-mint
namespace: audit-chain
display_name: Mint Merkle Seal
description: |
  Batch WAL events per (tenant_partition, period_id) into a Merkle tree
  (RFC-6962-shaped, SHA-256); request HSM Ed25519 signature on the root;
  durable-write the SealRecord; publish the root to S3 WORM + Mimir + GitHub-pinned
  manifest. Per Bominal ADR-0028 + policy/seal-integrity.md.

owner_team: axis-audit-chain
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0131]
related_specs: [/specs/audit-chain-merkle-ed25519.json]
related_artifacts:
  - microservices/audit-chain/policy/seal-integrity.md
  - microservices/audit-chain/contracts/asyncapi/audit-events.yaml

autonomy_tier: T3
# T3: cryptographic signing operation; state-mutating; load-bearing for compliance.

inputs:
  - name: pack
    type: string
    required: true
  - name: tenant_partition
    type: string
    required: true
  - name: period_id
    type: string
    required: true
  - name: event_envelopes
    type: array
    item_type: object
    description: WAL-sourced events for this period; ordered by event_id
    required: true
  - name: prior_root_hash
    type: string
    description: chain-link to previous period root; required for non-genesis periods
    required: true

outputs:
  - name: root_hash
    type: string
  - name: signature
    type: string
    description: Ed25519 over root_hash by pack HSM key
  - name: signer_public_key_fp
    type: string
  - name: signed_at
    type: timestamp
  - name: published_to_s3_at
    type: timestamp
  - name: published_to_mimir_at
    type: timestamp
  - name: published_to_git_at
    type: timestamp

data_classes_touched:
  - AUDIT
  - SECRET
  # The HSM signing-key (SECRET) is the load-bearing private input; signature output is AUDIT.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.audit-chain.seal.minted

cost_profile:
  type: per-seal
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - Merkle tree build O(n log n) for n events (≤ 200ms CPU for n=50k)
    - HSM Ed25519 signing call (~50ms; HSM utilization)
    - S3 WORM blob write (~30ms; SSE-KMS)
    - Postgres SealRecord insert (~5ms)
    - Mimir metric emission (~5ms)
    - GitHub manifest commit (~200ms; rate-bounded; daily-batched in practice)

cedar_policy_fragments:
  - microservices/audit-chain/policy/ci-scope.cedar
  - microservices/audit-chain/policy/seal-integrity.md

eval_set:
  golden_inputs_path: microservices/audit-chain/capabilities/eval/seal-mint-golden.jsonl
  pass_threshold: 1.0
  eval_metric: merkle-correctness-against-RFC-6962-reference-vectors
  cadence: per-release
  reference: RFC 6962 §"Test Vectors"

sunset:
  status: none
  notes: ""
