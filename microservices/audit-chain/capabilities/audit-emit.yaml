# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:audit-chain:audit-emit:v1
name: audit-emit
namespace: audit-chain
display_name: Emit Audit Event
description: |
  Accept an AuditEvent from a workload µservice, durable-write to WAL, return
  receipt with event_id + period_id within ≤100ms p99. Per Bominal ADR-0003.

owner_team: axis-audit-chain
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0003, ADR-0131]
related_specs: [/specs/audit-chain-merkle-ed25519.json]
related_artifacts:
  - microservices/audit-chain/PRD.md
  - microservices/audit-chain/contracts/openapi/audit-chain.yaml
  - microservices/audit-chain/policy/tenant-scope.cedar

autonomy_tier: T2
# T2: writes durable state; emits chain event.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: source_microservice
    type: string
    required: true
  - name: event_class
    type: string
    description: dotted-namespace event identifier
    required: true
  - name: payload
    type: bytes
    max_size_bytes: 1048576
    required: true
  - name: payload_data_class
    type: enum
    values: [INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PII_QUASI_IDENTIFIER, SENSITIVE_PIPA_ART23, PHI, AUDIT, SECRET]
    required: true
  - name: pack
    type: string
    required: true
  - name: idempotency_key
    type: string
    format: ulid
    required: true

outputs:
  - name: event_id
    type: string
    format: ulid
  - name: period_id
    type: string
  - name: accepted_at
    type: timestamp
  - name: sealed
    type: boolean
    description: false at receipt; client polls verify endpoint for sealed status

data_classes_touched:
  - AUDIT
  # The audit_emit capability is itself audit-emitting (recursive); per Bominal ADR-0028 §"Self-observability".
  # Payload data_class is variable; declared by caller and respected throughout the chain.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.audit-chain.audit.emitted

cost_profile:
  type: per-emission
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - Postgres INSERT (≤ 1ms)
    - S3 raw blob stage (≤ 10ms)
    - SPIFFE + Cedar validation (≤ 5ms)
    - Idempotency dedup check (≤ 1ms)

cedar_policy_fragments:
  - microservices/audit-chain/policy/tenant-scope.cedar
  - microservices/audit-chain/policy/ci-scope.cedar

eval_set:
  golden_inputs_path: microservices/audit-chain/capabilities/eval/audit-emit-golden.jsonl
  pass_threshold: 0.999
  eval_metric: emission-correctness-against-bominal-ADR-0003-reference
  cadence: per-release
  reference: Bominal ADR-0003 §"Emission contract reference vectors"

sunset:
  status: none
  notes: ""
