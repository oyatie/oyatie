# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas + HSM partition.
# Per policy/data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1; no DR pair).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/audit_storage/object_lock/default_retention_days
        value: 1095  # pack-kr default 3y; 5y for KR-FSS-finance tenants overlaid per-tenant
    target:
      kind: HelmRelease
      name: audit-storage
  - patch: |-
      - op: replace
        path: /spec/values/postgresql-ha/postgresql/replicaCount
        value: 2  # primary + 1 replica (no DR-pair region available for pack-kr at M01)
    target:
      kind: HelmRelease
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/values/hsm_operator/partition_ref/pack
        value: "pack-kr"
    target:
      kind: HelmRelease
      name: hsm-operator

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - HSM_ENDPOINT=hsm.ap-seoul-1.oraclecloud.com
      - DEFAULT_RETENTION_DAYS=1095
      - PERIOD_BUCKET_SECONDS=1
      - KEY_ROTATION_DAYS=90
      - OVERLAP_HOURS=24
