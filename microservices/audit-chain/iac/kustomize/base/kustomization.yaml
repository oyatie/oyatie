# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for audit-chain cluster, applied identically per-pack with overlays for:
# residency region, retention overrides, OpenBao secret references, HSM partition handle,
# replica scaling tier. Per ADR-0028 + ADR-0131 + multi-region.md.

namespace: audit-chain

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - cedar-policy-configmap.yaml
  - retention-matrix-configmap.yaml

helmCharts:
  - name: oya-audit-chain-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: postgres
    namespace: audit-chain
  - name: oya-audit-chain-audit-storage
    valuesFile: ../../helm/audit-storage/values.yaml
    releaseName: audit-storage
    namespace: audit-chain
  - name: oya-audit-chain-hsm-operator
    valuesFile: ../../helm/hsm-operator/values.yaml
    releaseName: hsm-operator
    namespace: audit-chain

commonLabels:
  app.kubernetes.io/part-of: oya-audit-chain
  oyatie/microservice: audit-chain
