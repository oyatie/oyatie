# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# OCI Cloud-HSM operator configuration.
# Partition lifecycle (create, rotate, retire keys) is in iac/terraform/oci-cloud-hsm-partition.tf;
# this Helm chart deploys the in-cluster operator that mediates PKCS#11 sessions
# from sealing-worker to the HSM partition.

hsm_operator:
  image:
    repository: oyatie/audit-chain-hsm-operator
    tag: "1.0.0"

  replica_count: 2  # HA

  partition_ref:
    pack: "${PACK}"
    partition_handle: "${oci:audit-chain-hsm-partition-${PACK}}"
    # Resolved from OpenBao at startup; not stored in git.
    openbao_partition_handle_path: "secret/audit-chain/hsm/${PACK}/partition-handle"

  pkcs11:
    module_path: /opt/oci/hsm/libpkcs11.so  # OCI Cloud-HSM PKCS#11 lib
    session_cert_path: /etc/openbao/audit-chain-hsm-session.crt
    session_cert_ttl: 24h  # short-lived per policy/seal-integrity.md SI-09
    auto_rotate: true

  spiffe:
    workload_api_socket: /run/spiffe/agent.sock
    expected_spiffe_id: "spiffe://oyatie/audit-chain/sealing-worker-${PACK}"

  network_policy:
    enabled: true
    allowed_callers:
      # Only sealing-worker may reach the HSM operator
      - app: sealing-worker
        namespace: audit-chain
    egress:
      - to_hsm_endpoint: "hsm.${OCI_REGION}.oraclecloud.com:443"

  audit:
    # Every PKCS#11 call emits a structured audit event
    enabled: true
    emit_to_audit_chain: true  # recursive; self-audit
    emit_to_mimir_oya_self: true

  health_check:
    enabled: true
    interval: 30s
    probe_endpoint: /ready

  key_lifecycle:
    rotation_cadence_days: 90  # per policy/seal-integrity.md SI-10
    overlap_window_hours: 24
    retain_retired_keys: true  # never destroy; needed for verification of past events
