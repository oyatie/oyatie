# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
postgresql-ha:
  postgresql:
    image:
      tag: "16.2.0"  # LTS pin
    replicaCount: 2  # primary + 1 replica per multi-region.md
    syncReplication: true  # primary→replica sync replication per multi-region.md
    repmgrConfiguration: |
      # Repmgr-managed HA
      promote_command='/opt/bitnami/postgresql/bin/repmgr standby promote -f /opt/bitnami/postgresql/conf/repmgr.conf'

    # Postgres role grants per policy/seal-integrity.md T-T-01 + T-E-01
    initdbScripts:
      00-role-grants.sql: |
        -- audit_emitter: INSERT-only on events table
        CREATE ROLE audit_emitter;
        GRANT CONNECT ON DATABASE audit_chain TO audit_emitter;
        GRANT USAGE ON SCHEMA public TO audit_emitter;
        GRANT INSERT ON TABLE events TO audit_emitter;
        -- explicitly REVOKE UPDATE/DELETE; defence-in-depth for T-T-01
        REVOKE UPDATE, DELETE ON TABLE events FROM audit_emitter;

        -- audit_sealer: SELECT events + INSERT seal_record
        CREATE ROLE audit_sealer;
        GRANT CONNECT ON DATABASE audit_chain TO audit_sealer;
        GRANT USAGE ON SCHEMA public TO audit_sealer;
        GRANT SELECT ON TABLE events TO audit_sealer;
        GRANT INSERT ON TABLE seal_record TO audit_sealer;
        REVOKE UPDATE, DELETE ON TABLE seal_record FROM audit_sealer;

        -- audit_retention_cascader: SELECT events + UPDATE redaction_token only
        CREATE ROLE audit_retention_cascader;
        GRANT SELECT, UPDATE (redaction_token, redacted_at) ON TABLE events TO audit_retention_cascader;

        -- audit_query: SELECT only
        CREATE ROLE audit_query;
        GRANT SELECT ON TABLE events, seal_record TO audit_query;
        REVOKE INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public FROM audit_query;

      01-pgaudit-config.sql: |
        -- Enable pgaudit per CC8.1 / A.8.15
        CREATE EXTENSION IF NOT EXISTS pgaudit;
        ALTER SYSTEM SET pgaudit.log = 'all';
        ALTER SYSTEM SET pgaudit.log_catalog = 'on';

  persistence:
    enabled: true
    size: 500Gi  # XS tier per capacity-model.md; auto-extends per HPA hook
    storageClass: oci-block-volume
    accessModes: [ReadWriteOnce]

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true  # Prometheus scrape per observability µservice
