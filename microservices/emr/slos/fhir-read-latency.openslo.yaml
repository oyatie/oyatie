apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-fhir-read-latency
  microservice: emr
  bc: all
spec:
  description: FHIR R5 read latency across Patient, Encounter, Condition, Observation, MedicationStatement, AllergyIntolerance, Immunization, DocumentReference, ServiceRequest, DiagnosticReport, CarePlan, CareTeam
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell, resource_type) (rate(emr_fhir_read_duration_seconds_bucket[1m]))) <= 0.15
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell, resource_type) (rate(emr_fhir_read_duration_seconds_count[1m]))
  objectives:
    - displayName: 99.9% of FHIR reads within 150ms p99
      target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
