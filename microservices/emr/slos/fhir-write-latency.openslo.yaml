apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-fhir-write-latency
  microservice: emr
spec:
  description: FHIR R5 write latency
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell, resource_type) (rate(emr_fhir_write_duration_seconds_bucket[1m]))) <= 0.3
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell, resource_type) (rate(emr_fhir_write_duration_seconds_count[1m]))
  objectives:
    - target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
