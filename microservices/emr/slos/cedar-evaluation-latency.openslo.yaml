apiVersion: openslo/v1
kind: SLO
metadata:
  name: emr-cedar-evaluation-latency
  microservice: emr
spec:
  description: |
    Cedar policy evaluation latency for every PHI-touching action per ADR-0243. Target
    p99 ≤ 20ms so that Cedar evaluation does not visibly tax chart-open or order-entry.
  service: emr
  indicator:
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: histogram_quantile(0.99, sum by(le, tenant, cell, outcome) (rate(emr_cedar_evaluation_duration_seconds_bucket[1m]))) <= 0.02
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum by(tenant, cell, outcome) (rate(emr_cedar_evaluation_duration_seconds_count[1m]))
  objectives:
    - target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true
  budgetingMethod: Occurrences
