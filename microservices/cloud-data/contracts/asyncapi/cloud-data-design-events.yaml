asyncapi: 3.1.0
info:
  title: Cloud Data design-surface events
  version: 0.1.0
  summary: Design/spec maturity event contract for cloud-data
  description: |
    This contract declares metadata-only design-surface events for the cloud-data microservice.
    It is implementation-ready review evidence only; it does not prove that a broker,
    producer, consumer, runtime deployment, or delivery SLO exists.

defaultContentType: application/json

channels:
  design-surface-recorded:
    address: cloud-data.design.surface.recorded
    messages:
      CloudDataDesignSurfaceRecorded:
        $ref: '#/components/messages/CloudDataDesignSurfaceRecorded'

operations:
  emitCloudDataDesignSurfaceRecorded:
    action: send
    channel:
      $ref: '#/channels/design-surface-recorded'

components:
  messages:
    CloudDataDesignSurfaceRecorded:
      name: CloudDataDesignSurfaceRecorded
      title: Cloud Data design surface recorded
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CloudDataDesignSurfaceRecordedPayload'
  schemas:
    EventHeaders:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Canonical event contract version header.
    CloudDataDesignSurfaceRecordedPayload:
      type: object
      required: [event_id, tenant_id, service_id, design_surface, evidence_ref, recorded_at]
      properties:
        event_id:
          type: string
          description: ULID event identifier.
        tenant_id:
          type: string
          description: Tenant or platform-scope identifier.
        service_id:
          type: string
          const: cloud-data
        design_surface:
          type: string
          description: Required design/spec surface represented by this evidence.
        evidence_ref:
          type: string
          description: Repository-relative evidence or design artifact reference.
        recorded_at:
          type: string
          format: date-time
        non_claim:
          type: string
          description: Explicit boundary that this event is design evidence, not runtime proof.
