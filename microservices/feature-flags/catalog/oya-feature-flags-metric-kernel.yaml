# Canonical-base: specs/catalog/canonical-crate-record-schema.json (ADR-0064)
name: oya-feature-flags-metric-kernel
role: kernel
context: feature-flags
plane: data
slo: experiment-result-freshness
contracts_consumed: []
contracts_exposed:
  - microservices/feature-flags/contracts/asyncapi-v1.yaml
regulatory_packs_consumed: [oya-pack-kr, oya-pack-eu, oya-pack-us, oya-pack-us-healthcare, oya-pack-fedramp, oya-pack-eu-ai-act]
lifecycle: {state: incubating, preview_since: 2026-05-20}
traceability:
  github_issue: "oya-governance-pipeline://feature-flags-buildout-2026-05-20"
  source_adrs: [ADR-0105, ADR-0131, ADR-0159, ADR-0243, ADR-0244, ADR-0248, ADR-0252, ADR-0263, ADR-0276]
allowed_dependency_edges:
  - oya-feature-flags-experiment-kernel
  - oya-shared-clickhouse-client
  - oya-shared-hlc
  - oya-shared-tenant-context
  - oya-shared-audit-emitter
data_classes_owned: [METRIC_DEFINITION, METRIC_EVENT, METRIC_ATTRIBUTION_RESULT]
operational_classes_owned: [METRIC_INGEST_THROUGHPUT, METRIC_ATTRIBUTION_LAG_S, CLICKHOUSE_QUERY_DURATION]
autonomy_tier_required: T2
storage:
  engine: clickhouse
  cluster: oyatie-clickhouse-{cell_id}
  table: feature_flags_audit_events
  partition_by: toYYYYMM(timestamp)
  ingest_rate_gb_day: 860
naming_justification: "oya-feature-flags-metric-kernel — BC=metric + layer=kernel per ADR-0105 13-layer BNF v4.1; ClickHouse attribution cold tier; GDPR Art. 20 portability path"
