asyncapi: 3.1.0
info:
  title: Feature Flags Event Bus
  version: 1.0.0
  description: |
    AsyncAPI contract for feature-flags event channels. Implements the
    flag-state-changed event stream per ADR-0263 audit emission contract
    and ADR-0028 sealed audit chain.

    Hyperscaler precedents: LaunchDarkly flag change events, Statsig experiment
    activation events, Unleash client-side events.

    Transport: Kafka (internal); SSE (SDK push); HTTP/3 default per ADR-0253.
  x-binding-adr: ADR-0159
  x-audit-chain: ADR-0028
  x-deprecation-policy: "SemVer per ADR-0258; MINOR-deprecated channels sunset after 2 minor versions."

defaultContentType: application/json

channels:
  flag-state-changed:
    address: oya.feature-flags.flag-state-changed
    description: |
      Emitted on every flag lifecycle state change: creation, mutation, archive,
      deletion, kill-switch engagement/disengagement, pack-override application.
      Sealed per ADR-0028. Consumed by: SDK SSE stream, observability substrate,
      detection substrate (family 8: policy violation).
    messages:
      FlagStateChangedMessage:
        $ref: '#/components/messages/FlagStateChanged'

  experiment-activated:
    address: oya.feature-flags.experiment-activated
    description: |
      Emitted when an experiment transitions from draft to active state.
      Consumed by: metric-attribution BC, analytics integrations, ops-dashboard.
    messages:
      ExperimentActivatedMessage:
        $ref: '#/components/messages/ExperimentActivated'

  experiment-concluded:
    address: oya.feature-flags.experiment-concluded
    description: |
      Emitted when an experiment concludes with a winner selection.
      Includes statistical significance results + LIME/SHAP explainability.
      Consumed by: analytics, product-manager dashboards, Intelligence substrate.
    messages:
      ExperimentConcludedMessage:
        $ref: '#/components/messages/ExperimentConcluded'

  killswitch-engaged:
    address: oya.feature-flags.killswitch-engaged
    description: |
      Emitted when a kill-switch is activated. High-priority broadcast topic.
      Kafka partition key: flag_key (ensures ordering per flag).
      Consumed by: all SDK instances (via SSE push), observability, ops-dashboard.
      Propagation target: all cells ≤1s.
    messages:
      KillSwitchEngagedMessage:
        $ref: '#/components/messages/KillSwitchEngaged'

  killswitch-disengaged:
    address: oya.feature-flags.killswitch-disengaged
    description: Emitted when a kill-switch is deactivated.
    messages:
      KillSwitchDisengagedMessage:
        $ref: '#/components/messages/KillSwitchDisengaged'

  pack-override-applied:
    address: oya.feature-flags.pack-override-applied
    description: |
      Emitted when a pack-mandated flag override is applied.
      Consumed by: compliance audit surface, ops-dashboard.
    messages:
      PackOverrideAppliedMessage:
        $ref: '#/components/messages/PackOverrideApplied'

  abuse-detection-signal:
    address: oya.feature-flags.abuse-detection-signal
    description: |
      Emitted for abuse-defence detection signals: flag-flooding, experiment
      manipulation attempt, cross-tenant access attempt, honeypot hit.
      Consumed by: detection substrate (family 8), ops-dashboard case queue.
    messages:
      AbuseDetectionSignalMessage:
        $ref: '#/components/messages/AbuseDetectionSignal'

operations:
  publishFlagStateChanged:
    action: send
    channel:
      $ref: '#/channels/flag-state-changed'
    summary: Publish flag state change event

  publishKillSwitchEngaged:
    action: send
    channel:
      $ref: '#/channels/killswitch-engaged'
    summary: Publish kill-switch engaged event

  publishExperimentConcluded:
    action: send
    channel:
      $ref: '#/channels/experiment-concluded'
    summary: Publish experiment conclusion with statistical results

  subscribePackOverrideApplied:
    action: receive
    channel:
      $ref: '#/channels/pack-override-applied'
    summary: SDK subscribes to pack-override events for cache invalidation

components:
  messages:
    FlagStateChanged:
      name: FlagStateChanged
      title: Flag State Changed
      summary: A flag's lifecycle state or configuration changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FlagStateChangedPayload'
      headers:
        type: object
        properties:
          x-audit-sealed:
            type: boolean
            description: Whether this event is sealed per ADR-0028
          x-hlc-timestamp:
            type: string
            description: HLC timestamp per ADR-0252
          x-tenant-id:
            type: string
          x-event-class:
            type: string
            enum: [FlagCreated, FlagUpdated, FlagArchived, FlagDeleted, FlagStateChanged]

    ExperimentActivated:
      name: ExperimentActivated
      payload:
        $ref: '#/components/schemas/ExperimentActivatedPayload'

    ExperimentConcluded:
      name: ExperimentConcluded
      payload:
        $ref: '#/components/schemas/ExperimentConcludedPayload'

    KillSwitchEngaged:
      name: KillSwitchEngaged
      title: Kill-Switch Engaged
      summary: Emergency kill-switch activated for a flag
      contentType: application/json
      payload:
        $ref: '#/components/schemas/KillSwitchEngagedPayload'
      headers:
        type: object
        properties:
          x-audit-sealed:
            type: boolean
            const: true
          x-priority:
            type: string
            const: HIGH
          x-propagation-target:
            type: string
            description: Comma-separated list of target cell IDs

    KillSwitchDisengaged:
      name: KillSwitchDisengaged
      payload:
        $ref: '#/components/schemas/KillSwitchDisengagedPayload'

    PackOverrideApplied:
      name: PackOverrideApplied
      payload:
        $ref: '#/components/schemas/PackOverrideAppliedPayload'

    AbuseDetectionSignal:
      name: AbuseDetectionSignal
      payload:
        $ref: '#/components/schemas/AbuseDetectionSignalPayload'

  schemas:
    FlagStateChangedPayload:
      type: object
      required: [event_id, event_class, flag_key, tenant_id, timestamp, actor_principal_id]
      properties:
        event_id:
          type: string
          format: uuid
        event_class:
          type: string
          enum: [FlagCreated, FlagUpdated, FlagArchived, FlagDeleted, FlagStateChanged]
        flag_key:
          type: string
        tenant_id:
          type: string
        timestamp:
          type: string
          format: date-time
        hlc_timestamp:
          type: string
          description: HLC timestamp per ADR-0252
        actor_principal_id:
          type: string
        previous_state:
          type: object
          description: Previous flag state snapshot
        new_state:
          type: object
          description: New flag state snapshot
        audit_sealed:
          type: boolean
        audit_chain_id:
          type: string
          format: uuid

    ExperimentActivatedPayload:
      type: object
      required: [event_id, experiment_id, experiment_key, tenant_id, flag_key, timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
        experiment_key:
          type: string
        tenant_id:
          type: string
        flag_key:
          type: string
        variants:
          type: array
          items:
            type: object
        allocation_percentage:
          type: number
        timestamp:
          type: string
          format: date-time

    ExperimentConcludedPayload:
      type: object
      required: [event_id, experiment_id, tenant_id, winner_variant, timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        experiment_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        winner_variant:
          type: string
        statistical_significance:
          type: number
        p_value:
          type: number
        bayesian_posterior_probability:
          type: number
        sample_ratio_mismatch_detected:
          type: boolean
        feature_importance:
          type: object
          description: LIME/SHAP explainability (EU AI Act Art. 13)
        timestamp:
          type: string
          format: date-time

    KillSwitchEngagedPayload:
      type: object
      required: [event_id, flag_key, tenant_id, actor_principal_id, reason, timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        flag_key:
          type: string
        tenant_id:
          type: string
        actor_principal_id:
          type: string
        reason:
          type: string
        incident_id:
          type: string
        engaged_at:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
        audit_chain_id:
          type: string
          format: uuid

    KillSwitchDisengagedPayload:
      type: object
      required: [event_id, flag_key, tenant_id, actor_principal_id, timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        flag_key:
          type: string
        tenant_id:
          type: string
        actor_principal_id:
          type: string
        timestamp:
          type: string
          format: date-time

    PackOverrideAppliedPayload:
      type: object
      required: [event_id, flag_key, tenant_id, pack_id, override_value, timestamp]
      properties:
        event_id:
          type: string
          format: uuid
        flag_key:
          type: string
        tenant_id:
          type: string
        pack_id:
          type: string
        override_value:
          description: The value that was forced by the pack
        previous_value:
          description: The previous value before override
        timestamp:
          type: string
          format: date-time
        audit_chain_id:
          type: string
          format: uuid

    AbuseDetectionSignalPayload:
      type: object
      required: [event_id, signal_type, tenant_id, timestamp, severity]
      properties:
        event_id:
          type: string
          format: uuid
        signal_type:
          type: string
          enum:
            - FlagMutationAnomaly
            - CrossTenantFlagAccessAttempt
            - PackOverrideTamperAttempt
            - ExperimentAssignmentManipulationAttempt
            - HoneypotFlagHit
            - AbuseDefenceEmergencyServiceBypass
        tenant_id:
          type: string
        principal_id:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        details:
          type: object
        timestamp:
          type: string
          format: date-time
