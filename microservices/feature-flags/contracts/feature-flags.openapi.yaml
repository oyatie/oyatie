openapi: 3.2.0
info:
  title: Oyatie Feature Flags
  version: 0.1.0
paths:
  /flags/{flag_key}/evaluate:
    post:
      operationId: evaluateFlag
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagEvaluationRequest'
      responses:
        '200':
          description: Evaluation result.
components:
  schemas:
    FlagEvaluationRequest:
      type: object
      required: [tenant_id, principal_id, persona_tier]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        persona_tier:
          type: string
        cohort_ids:
          type: array
          items:
            type: string
