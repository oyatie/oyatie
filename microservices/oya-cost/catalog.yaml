apiVersion: oyatie.io/v1
kind: ServiceCatalog
metadata:
  name: oya-cost
  labels:
    microservice: oya-cost
    bounded_context: cost-allocation-substrate
    owner_team: council-cost
spec:
  role: tenant-service
  context: cost-allocation-substrate
  governing_adr: ADR-0480
  pattern: single-crate-per-service
  binding_adrs:
    - ADR-0509
  data_classes_owned:
    - USAGE_METRICS
  operational_classes_owned:
    - AUDIT
  dependencies: []
  honest_claims:
    status: scaffold
    note: "non_claim: implementation deferred to ADR-0480 D1-D5 phases."
