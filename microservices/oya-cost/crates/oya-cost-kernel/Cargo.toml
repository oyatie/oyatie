[package]
name = "oya-cost-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Pure cost-allocation domain: usage aggregation, allocation rules, and chargeback value objects. No I/O, no async, std+serde only. ADR-0480 D1-D2."

[package.metadata.oya]
microservice = "oya-cost"
bounded_context = "cost-allocation-substrate"
layer = "kernel"
owner_team = "council-cost"
adr_anchors = ["ADR-0083", "ADR-0480"]
data_classification = "USAGE_METRICS, AUDIT, INTERNAL_ONLY"

[lib]
name = "oya_cost_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
