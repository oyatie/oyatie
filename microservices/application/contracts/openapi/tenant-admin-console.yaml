openapi: 3.2.0
info:
  title: Tenant Admin Console API
  version: 0.1.0
  description: Tenant-facing no-code control surface per ADR-0218 and ADR-0219.
paths:
  /tenant-admin/policy-drafts:
    post:
      summary: Create and simulate a tenant policy draft
      operationId: createTenantPolicyDraft
      tags: [tenant-admin-console]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPolicyDraftRequest'
      responses:
        '201':
          description: Draft created with simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPolicyDraftResponse'
        '403':
          description: Cedar refusal
  /tenant-admin/policy-drafts/{draft_id}/apply:
    post:
      summary: Apply a simulated tenant policy draft
      operationId: applyTenantPolicyDraft
      tags: [tenant-admin-console]
      parameters:
        - in: path
          name: draft_id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Policy change accepted and audit-chain event emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPolicyApplyResponse'
        '403':
          description: Cedar refusal or four-eyes approval missing
components:
  schemas:
    TenantPolicyDraftRequest:
      type: object
      required: [tenant_id, admin_principal_id, active_context_id, draft_kind, proposed_fragment]
      properties:
        tenant_id: { type: string }
        admin_principal_id: { type: string }
        active_context_id: { type: string }
        draft_kind:
          type: string
          enum: [role, cedar-fragment, jit-access, context-visibility, ai-enablement]
        proposed_fragment: { type: object }
    TenantPolicyDraftResponse:
      type: object
      required: [draft_id, simulation_result, audit_event]
      properties:
        draft_id: { type: string }
        simulation_result: { type: string, enum: [allowed, refused, requires_four_eyes] }
        refusal_reason: { type: string }
        audit_event: { type: string }
    TenantPolicyApplyResponse:
      type: object
      required: [change_id, status, audit_event]
      properties:
        change_id: { type: string }
        status: { type: string, enum: [applied, refused] }
        previous_fragment_id: { type: string }
        next_fragment_id: { type: string }
        audit_event: { type: string }
