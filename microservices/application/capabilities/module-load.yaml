# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:application:module-load:v1
name: module-load
namespace: application
display_name: Load Product Module
description: |
  Fetch a product module's signed manifest, verify SRI hash + Ed25519 signature,
  load the bundle into the shell's iframe sandbox, register its routes, and emit
  ModuleLoaded (or ModuleLoadRejected) Workflow event.

owner_team: axis-application
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0121, ADR-0123, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/application/PRD.md
  - microservices/application/contracts/openapi/application.yaml
  - microservices/application/policy/tenant-scope.cedar
  - microservices/application/threat-model.md (T-02, S-06, E-02)

autonomy_tier: T2
# T2 = read sensitive data (per-tenant module enablement) + write to ledger
# (audit event). Not destructive.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: user_id
    type: string
    pattern: '^user:[a-f0-9]{16}$'
    required: true
  - name: module
    type: string
    pattern: '^oya-[a-z][a-z0-9-]*-module$'
    required: true
  - name: version
    type: string
    pattern: '^[a-f0-9]{40}$'
    required: true

outputs:
  - name: loaded
    type: boolean
  - name: reason
    type: enum
    values: [loaded, sri_mismatch, signature_invalid, signer_revoked, cedar_deny, residency_mismatch, manifest_malformed]
  - name: time_to_load_ms
    type: integer

data_classes_touched:
  - INTERNAL_ONLY        # manifest body
  - BEHAVIORAL_TENANT_PRODUCT  # per-user module access count
  - AUDIT                # load / reject event

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.application.module.load

cost_profile:
  type: per-load
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - CDN bandwidth (cached)
    - Ed25519 verify
    - Postgres tenant-enablement lookup

cedar_policy_fragments:
  - microservices/application/policy/tenant-scope.cedar
  - microservices/application/policy/ci-scope.cedar

eval_set:
  canonical_inputs_path: microservices/application/capabilities/eval/module-load-canonical.jsonl
  pass_threshold: 0.999
  eval_metric: load-or-reject-correctness-against-signed-and-tampered-manifests
  cadence: per-release

sunset:
  status: none
  notes: ""
