# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:messenger:t1-assist:v1
name: thread-summary-and-action-item-extract
namespace: messenger
display_name: Thread Summary + Action-Item Extraction
description: |
  T1 assist capability: invoked by user action ("/summarize thread" or
  "/extract action items"). Produces a structured summary + action-item list
  bound to the thread. User retains final approval before any cross-µservice
  artifact (e.g., Workflow task) is created. Output is a draft document the
  user can edit or discard.

owner_team: axis-messenger + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133]
related_artifacts:
  - microservices/messenger/PRD.md (Open Question 2 — voice/video signaling related)
  - microservices/messenger/policy/dual-context-isolation.md

autonomy_tier: T1
# T1 = user-invoked, human-in-loop; no autonomous write.

inputs:
  - name: thread_id
    type: string
    required: true
  - name: invoking_user_ref
    type: string
    required: true
  - name: command
    type: enum
    values: [summarize, extract_action_items, both]
    required: true
  - name: context_kind
    type: enum
    values: [Personal, Professional]
    required: true

outputs:
  - name: summary
    type: object
    properties:
      bullet_points: {type: array, items: {type: string}, max_items: 10}
      key_participants: {type: array, items: {type: string}}
      sentiment: {type: string, enum: [neutral, positive, negative, mixed]}
      content_hash: {type: string}
  - name: action_items
    type: array
    max_items: 20
    items:
      type: object
      properties:
        text: {type: string, maxLength: 300}
        assignee_ref: {type: string, nullable: true}
        due_hint: {type: string, format: date-time, nullable: true}
        source_message_ids: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI  # pack-us-healthcare professional channels; disabled by default

context_kind_constraint:
  Personal: refused-server-side (E2E plaintext unavailable; client may run locally if SDK opted-in)
  Professional: server-side via tenant-DEK; tenant-admin entitlement required to enable

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    requires: signed BAA + explicit per-channel opt-in
    reason: HIPAA 45 CFR §164.502(b) — minimum necessary
  pack-eu:
    risk_classification: limited_risk
    transparency_obligation: must-label-as-AI-generated; must store evidence_topic record per Art. 13
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required

evidence_topic: oya.messenger.capability.t1_assist.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.012
  cost_drivers:
    - LLM inference (medium open-weights model)
    - Per-thread retrieval over Postgres + Tantivy

cedar_policy_fragments:
  - microservices/messenger/policy/channel-scope.cedar
  - microservices/messenger/policy/tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/messenger/capabilities/eval/t1-assist-reference.jsonl
  pass_threshold: 0.92
  eval_metric: summary-faithfulness (Likert vs human rater); action-item-precision@1
  cadence: per-release
  reference: ROUGE-Lsum + human evaluation per HELM benchmark

sunset:
  status: none
