asyncapi: 3.1.0
info:
  title: oya-messenger — events
  version: 1.0.0
  summary: Real-time + Workflow events emitted by the messenger µservice
  description: |
    Two channel families:
    - **Real-time WebSocket** (`wss://messenger-{pack}.oyatie.com/ws/v1`):
      client-facing events delivered to authenticated session connections.
      Per-event Cedar evaluation; payloads scoped to the consumer's membership.
    - **Workflow event bus** (cluster-internal AMQP / NATS):
      cross-µservice events consumed by ontology, audit-chain, mail, workflow-engine.

defaultContentType: application/json

servers:
  websocket-gateway:
    host: messenger-{pack}.oyatie.com
    protocol: wss
    description: Per-pack WebSocket gateway
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
  workflow-events-bus:
    host: workflow-events.messenger.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus

channels:
  message-posted:
    address: workflow-events/messenger.message.posted
    messages:
      MessagePostedMessage:
        $ref: '#/components/messages/MessagePosted'
    description: A new message was appended to a channel

  message-edited:
    address: workflow-events/messenger.message.edited
    messages:
      MessageEditedMessage:
        $ref: '#/components/messages/MessageEdited'

  message-deleted:
    address: workflow-events/messenger.message.deleted
    messages:
      MessageDeletedMessage:
        $ref: '#/components/messages/MessageDeleted'

  message-reaction:
    address: workflow-events/messenger.message.reaction
    messages:
      MessageReactionMessage:
        $ref: '#/components/messages/MessageReaction'

  presence-changed:
    address: workflow-events/messenger.presence.changed
    messages:
      PresenceChangedMessage:
        $ref: '#/components/messages/PresenceChanged'

  file-attached:
    address: workflow-events/messenger.file.attached
    messages:
      FileAttachedMessage:
        $ref: '#/components/messages/FileAttached'

  mention-emitted:
    address: workflow-events/messenger.mention.emitted
    messages:
      MentionEmittedMessage:
        $ref: '#/components/messages/MentionEmitted'

  channel-created:
    address: workflow-events/messenger.channel.created
    messages:
      ChannelCreatedMessage:
        $ref: '#/components/messages/ChannelCreated'

  channel-member-changed:
    address: workflow-events/messenger.channel.member.changed
    messages:
      ChannelMemberChangedMessage:
        $ref: '#/components/messages/ChannelMemberChanged'

  ediscovery-hold:
    address: workflow-events/messenger.ediscovery.hold
    messages:
      EDiscoveryHoldMessage:
        $ref: '#/components/messages/EDiscoveryHold'

  four-eyes-disclosure:
    address: workflow-events/messenger.disclosure.executed
    messages:
      FourEyesDisclosureMessage:
        $ref: '#/components/messages/FourEyesDisclosure'

  # WebSocket frames (real-time delivery)
  ws-message-frame:
    address: ws/message
    messages:
      MessageFrame:
        $ref: '#/components/messages/MessagePosted'
    description: Real-time WebSocket frame delivered to channel subscribers

  ws-presence-frame:
    address: ws/presence
    messages:
      PresenceFrame:
        $ref: '#/components/messages/PresenceChanged'

  ws-reaction-frame:
    address: ws/reaction
    messages:
      ReactionFrame:
        $ref: '#/components/messages/MessageReaction'

operations:
  emitMessagePosted:
    action: send
    channel:
      $ref: '#/channels/message-posted'
  emitMessageEdited:
    action: send
    channel:
      $ref: '#/channels/message-edited'
  emitMessageDeleted:
    action: send
    channel:
      $ref: '#/channels/message-deleted'
  emitMessageReaction:
    action: send
    channel:
      $ref: '#/channels/message-reaction'
  emitPresenceChanged:
    action: send
    channel:
      $ref: '#/channels/presence-changed'
  emitFileAttached:
    action: send
    channel:
      $ref: '#/channels/file-attached'
  emitMentionEmitted:
    action: send
    channel:
      $ref: '#/channels/mention-emitted'
  emitChannelCreated:
    action: send
    channel:
      $ref: '#/channels/channel-created'
  emitChannelMemberChanged:
    action: send
    channel:
      $ref: '#/channels/channel-member-changed'
  emitEDiscoveryHold:
    action: send
    channel:
      $ref: '#/channels/ediscovery-hold'
  emitFourEyesDisclosure:
    action: send
    channel:
      $ref: '#/channels/four-eyes-disclosure'

  # Consumed events
  consumeMailActionCard:
    action: receive
    channel:
      address: workflow-events/mail.action_card.emitted
    description: mail µservice emits action-card destined for a messenger channel
  consumeOntologyEntityChanged:
    action: receive
    channel:
      address: workflow-events/ontology.entity.changed
    description: ontology entity update refreshes mention-resolution cache
  consumeTenantRetentionPolicyUpdated:
    action: receive
    channel:
      address: workflow-events/tenancy.retention_policy.updated
  consumeAuditChainSealed:
    action: receive
    channel:
      address: workflow-events/audit_chain.sealed

components:
  # Canonical event envelope header per ADR-0154
  # (event-schema-versioning). Every message MUST carry the
  # `version` header (SemVer) plus `event_id` (ULID), `event_kind`,
  # `tenant_id` (ULID), `occurred_at` (RFC 3339).
  messageTraits:
    OyaEventEnvelope:
      headers:
        type: object
        required: [event_id, event_kind, version, tenant_id, occurred_at]
        properties:
          event_id:
            type: string
            format: ulid
            description: Per-event ULID per ADR-0156 id-discipline.
          event_kind:
            type: string
            pattern: '^oya\.'
            description: Canonical event kind (`oya.<microservice>.<verb>.<aggregate>`).
          version:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
            description: SemVer schema version per ADR-0154.
          tenant_id:
            type: string
            format: ulid
          occurred_at:
            type: string
            format: date-time
  messages:
    MessagePosted:
      name: MessagePosted
      contentType: application/json
      summary: A message was posted to a channel
      traits:
        - $ref: '#/components/messageTraits/OyaEventEnvelope'
      payload:
        $ref: '#/components/schemas/MessagePostedPayload'

    MessageEdited:
      name: MessageEdited
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageEditedPayload'

    MessageDeleted:
      name: MessageDeleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageDeletedPayload'

    MessageReaction:
      name: MessageReaction
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageReactionPayload'

    PresenceChanged:
      name: PresenceChanged
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PresenceChangedPayload'

    FileAttached:
      name: FileAttached
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FileAttachedPayload'

    MentionEmitted:
      name: MentionEmitted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MentionEmittedPayload'

    ChannelCreated:
      name: ChannelCreated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChannelCreatedPayload'

    ChannelMemberChanged:
      name: ChannelMemberChanged
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChannelMemberChangedPayload'

    EDiscoveryHold:
      name: EDiscoveryHold
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EDiscoveryHoldPayload'

    FourEyesDisclosure:
      name: FourEyesDisclosure
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FourEyesDisclosurePayload'

  schemas:
    MessagePostedPayload:
      type: object
      required: [message_id, channel_id, tenant_id, context_kind, author_ref, posted_at, content_hash]
      properties:
        message_id: {type: string, format: ulid}
        channel_id: {type: string, format: ulid}
        thread_id: {type: string, format: ulid, nullable: true}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        author_ref: {type: string}
        data_class: {type: string}
        body_present: {type: boolean}
        attachment_count: {type: integer}
        mention_count: {type: integer}
        posted_at: {type: string, format: date-time}
        content_hash: {type: string}
        signature: {type: string}

    MessageEditedPayload:
      type: object
      required: [message_id, channel_id, edited_at, content_hash]
      properties:
        message_id: {type: string}
        channel_id: {type: string}
        editor_ref: {type: string}
        edited_at: {type: string, format: date-time}
        content_hash: {type: string}
        edit_kind: {type: string, enum: [body, mentions, attachments]}

    MessageDeletedPayload:
      type: object
      required: [message_id, channel_id, deleted_at]
      properties:
        message_id: {type: string}
        channel_id: {type: string}
        deleter_ref: {type: string}
        deleted_at: {type: string, format: date-time}
        tombstone_only: {type: boolean, default: true}

    MessageReactionPayload:
      type: object
      required: [message_id, channel_id, user_ref, emoji, action]
      properties:
        message_id: {type: string}
        channel_id: {type: string}
        user_ref: {type: string}
        emoji: {type: string}
        action: {type: string, enum: [added, removed]}

    PresenceChangedPayload:
      type: object
      required: [user_ref, tenant_id, state, changed_at]
      properties:
        user_ref: {type: string}
        tenant_id: {type: string}
        state: {type: string, enum: [Online, Away, DoNotDisturb, Offline]}
        prior_state: {type: string, nullable: true}
        custom_status: {type: string, nullable: true}
        changed_at: {type: string, format: date-time}

    FileAttachedPayload:
      type: object
      required: [attachment_id, message_id, channel_id, digest_sha256, size_bytes, scan_status]
      properties:
        attachment_id: {type: string}
        message_id: {type: string}
        channel_id: {type: string}
        digest_sha256: {type: string}
        size_bytes: {type: integer}
        mime_type: {type: string}
        scan_status: {type: string, enum: [pending, clean, infected, error]}

    MentionEmittedPayload:
      type: object
      required: [message_id, target_kind, target_ref, mention_kind]
      properties:
        message_id: {type: string}
        channel_id: {type: string}
        target_kind: {type: string, enum: [Person, Team, Channel, Everyone]}
        target_ref: {type: string}
        mention_kind: {type: string, enum: [direct, broadcast]}

    ChannelCreatedPayload:
      type: object
      required: [channel_id, tenant_id, context_kind, kind, created_by, created_at]
      properties:
        channel_id: {type: string}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        kind: {type: string, enum: [Public, Private, DM, GroupDM]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        retention_policy_id: {type: string, nullable: true}

    ChannelMemberChangedPayload:
      type: object
      required: [channel_id, member_ref, action, actor_ref, changed_at]
      properties:
        channel_id: {type: string}
        member_ref: {type: string}
        action: {type: string, enum: [granted, revoked, role_changed]}
        role: {type: string, enum: [member, channel_admin], nullable: true}
        actor_ref: {type: string}
        changed_at: {type: string, format: date-time}

    EDiscoveryHoldPayload:
      type: object
      required: [hold_id, tenant_id, scope, reason, action, executed_at]
      properties:
        hold_id: {type: string}
        tenant_id: {type: string}
        scope:
          type: object
        reason: {type: string}
        action: {type: string, enum: [opened, closed]}
        executed_by: {type: string}
        executed_at: {type: string, format: date-time}

    FourEyesDisclosurePayload:
      type: object
      required: [disclosure_id, tenant_id, message_ids, reason, primary_approver, paired_approver, executed_at]
      properties:
        disclosure_id: {type: string}
        tenant_id: {type: string}
        message_ids:
          type: array
          items: {type: string}
        reason: {type: string}
        primary_approver: {type: string}
        paired_approver: {type: string}
        executed_at: {type: string, format: date-time}
        signature_primary: {type: string}
        signature_paired: {type: string}
