# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the messenger µservice.
# Per-pack overlays adjust: residency, retention overrides, secret-ref URIs,
# replica scaling tier, packs' federation/E2E posture, regulatory packs.

namespace: messenger

resources:
  - namespace.yaml
  - openbao-secret-references.yaml

helmCharts:
  - name: oya-messenger
    valuesFile: ../../helm/messenger/values.yaml
    releaseName: messenger
    namespace: messenger

commonLabels:
  app.kubernetes.io/part-of: oya-messenger
  oyatie/microservice: messenger
