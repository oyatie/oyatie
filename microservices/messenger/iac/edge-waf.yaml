# Edge WAF + bot-management config — messenger µservice
# Authority: ADR-0297; ADR-0253 row-12 TLS/ECH/PQC posture.
# Static hardening manifest only; live Cloudflare/API-gateway application is separate evidence.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: messenger-edge-waf
  namespace: messenger
spec:
  routes:
    - path: /v1/messenger/channels/*
      action: channel_read_write
      rate_limit:
        per_ip_per_minute: 300
        per_tenant_per_minute_default: 3000
        per_tenant_per_minute_tier_1: 30000
        burst_multiplier: 1.5
      bot_management:
        mode: passive_score
        threshold_challenge: 95
    - path: /v1/messenger/channels/*/messages
      action: message_send
      rate_limit:
        per_ip_per_minute: 120
        per_tenant_per_minute_default: 12000
        per_tenant_per_minute_tier_1: 120000
      bot_management:
        mode: passive_score
        threshold_challenge: 90
        spam_pattern_detection: enabled
    - path: /v1/messenger/attachments
      action: attachment_upload
      rate_limit:
        per_ip_per_minute: 30
        per_tenant_per_minute_default: 600
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 85
        upload_malware_scan_required: true
    - path: /v1/messenger/presence/*
      action: presence_update
      rate_limit:
        per_ip_per_minute: 600
        per_tenant_per_minute_default: 60000
      bot_management:
        mode: passive_score_no_challenge
    - path: /v1/messenger/disclosures
      action: disclosure_audit
      rate_limit:
        per_ip_per_minute: 10
        per_tenant_per_minute_default: 120
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 80
        four_eyes_evidence_required: true

  honeypot_routes:
    - path: /v1/messenger/_internal/dek-dump
      response_class: canary
      audit_class: oya.messenger.honeypot-trip
    - path: /v1/messenger/_internal/channel-export-all
      response_class: canary
      audit_class: oya.messenger.honeypot-trip

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  fingerprinting:
    ja4: enabled
    ja4_plus: enabled
    http2_frame_pattern: enabled
    http3_frame_pattern: enabled
    mode: passive

  anti_abuse:
    spam_burst_detection: enabled
    attachment_hash_reputation: enabled
    sequential_channel_scan_detection: enabled
    cross_tenant_invite_storm_detection: enabled
    per_user_invisible_watermark: enabled

  ux_floor:
    default_path_latency_budget_ms: 2
    accessibility:
      audio_captcha_fallback: enabled
      keyboard_navigation: enabled
      screen_reader_friendly: enabled
      no_time_pressure_for_assistive_tech: enabled
    challenge_solve_time_floor_seconds: 10
    session_continuity_preserved: true
    tenant_tier_adaptive_sensitivity: enabled
    locale_aware_challenges: enabled

  audit:
    emit_class_block: oya.messenger.abuse-defence-block
    emit_class_allow: oya.messenger.abuse-defence-allow
    emit_class_spam_detect: oya.messenger.spam-pattern-detect
    emit_class_dek_honeypot: oya.messenger.dek-honeypot-trip
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
    false_positive_metric: oya_messenger_abuse_defence_false_positive_rate
    blocked_bot_metric: oya_messenger_abuse_defence_blocked_total
