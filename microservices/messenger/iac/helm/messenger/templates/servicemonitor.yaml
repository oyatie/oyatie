# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: messenger
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger
    release: prometheus  # discovered by Prometheus Operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: messenger
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: bc
      metricRelabelings:
        # Drop high-cardinality labels before Mimir per
        # docs/standards/request-id-canonical.md + ADR-0151. The six
        # canonical labels MUST be dropped at the metric layer; they
        # are kept in Tempo span attributes + Loki log fields.
        - sourceLabels: [message_id]
          action: labeldrop
        - sourceLabels: [request_id]
          action: labeldrop
        - sourceLabels: [user_id]
          action: labeldrop
        - sourceLabels: [session_id]
          action: labeldrop
        - sourceLabels: [document_id]
          action: labeldrop
        - sourceLabels: [channel_id]
          action: labeldrop
