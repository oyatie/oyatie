# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messenger-default-deny
  namespace: messenger
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messenger-allow-ingress-from-gateway
  namespace: messenger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: messenger
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: messenger
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messenger-allow-egress-to-substrate
  namespace: messenger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: messenger
  policyTypes: [Egress]
  egress:
    # Postgres
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: messenger-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    # Valkey (presence + streams)
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: messenger-valkey}}
      ports: [{protocol: TCP, port: 6379}]
    # Meilisearch
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: messenger-meilisearch}}
      ports: [{protocol: TCP, port: 7700}]
    # LiveKit + coturn
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: livekit-server}}
      ports: [{protocol: TCP, port: 7880}, {protocol: TCP, port: 7881}, {protocol: UDP, port: 7882}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: coturn}}
      ports: [{protocol: TCP, port: 3478}, {protocol: UDP, port: 3478}]
    # Cross-µservice: observability, audit-chain, ontology, tenancy, mail
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ontology}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenancy}}
      ports: [{protocol: TCP, port: 50051}]
    # OPSWAT scan endpoint
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: security-scanners}}
      ports: [{protocol: TCP, port: 8008}]
    # DNS
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
