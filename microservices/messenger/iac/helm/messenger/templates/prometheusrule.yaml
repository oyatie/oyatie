apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: messenger-burn-rate-rules
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger
    prometheus: mimir
spec:
  groups:
    - name: messenger-recording-rules
      interval: 60s
      rules:
        - record: messenger:message_send:availability_5m
          expr: |
            sum(rate(oya_messenger_message_send_total{result="success"}[5m]))
            /
            sum(rate(oya_messenger_message_send_total[5m]))
        - record: messenger:message_send:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_messenger_message_send_duration_seconds_bucket[5m]))
            )

    - name: messenger-burn-rate-alerts
      rules:
        - alert: MessengerMessageSendFastBurn1h
          expr: |
            (1 - messenger:message_send:availability_5m) > 14.4 * (1 - 0.9995)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: messenger
          annotations:
            summary: "messenger message-send fast-burn (14.4x) for 5m"
            runbook_url: "https://oyatie.dev/microservices/messenger/runbooks/websocket-storm"

        - alert: MessengerMessageSendSlowBurn6h
          expr: |
            (1 - avg_over_time(messenger:message_send:availability_5m[6h])) > 6 * (1 - 0.9995)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: messenger

        - alert: MessengerPresencePropagationLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_messenger_presence_propagation_seconds_bucket[5m]))
            ) > 0.2
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: messenger
            bc: presence

        - alert: MessengerDualContextDenyDetected
          expr: |
            increase(oya_messenger_dual_context_denied_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: dual-context-isolation
            microservice: messenger
          annotations:
            summary: "messenger context-isolation invariant violation attempt detected"
            runbook_url: "https://oyatie.dev/microservices/messenger/policy/dual-context-isolation"

    - name: messenger-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: messenger-llm-capability-circuit-open
          expr: max(oya_messenger_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: messenger
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "messenger LLM/capability circuit-breaker tripped open"
        - alert: messenger-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_messenger_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: messenger
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "messenger capability retry-budget exhausted"

    - name: messenger-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: messenger-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_messenger_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: messenger
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "messenger tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: messenger-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: messenger-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"messenger-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: messenger
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "messenger pod CPU saturation > 70% sustained 10m"
        - alert: messenger-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_messenger_responses_5xx_total[5m]))
            /
            sum(rate(oya_messenger_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: messenger
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "messenger 5xx rate > 1% sustained 5m"
        - alert: messenger-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_messenger_responses_total[5m]))
              /
              sum(rate(oya_messenger_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: messenger
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "messenger inbound RPS dropped > 90% vs prior hour"

    - name: messenger-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: messenger-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_messenger_request_success_total[1h]))
              /
              sum(rate(oya_messenger_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: messenger
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "messenger aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: messenger-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_messenger_request_success_total[6h]))
              /
              sum(rate(oya_messenger_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: messenger
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "messenger aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
