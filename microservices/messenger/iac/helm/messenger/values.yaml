# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr  # overridden per-pack overlay
  cluster: messenger
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-messenger-app
  tag: "1.0.0"  # SHA-pinned at release-pointer advance per ADR-0139

# ============================================================================
# Per-BC deployment sizing (XS-tier baseline; HPA scales up)
# ============================================================================

# Per-component resourceTier (canonical-base: oya.resourceRequests dispatcher).
# Tier letters resolve to canonical CPU/memory grids defined in
# microservices/governance/iac/helm/_oya-helpers/templates/_helpers.tpl:
#   XS: 100m/128Mi req, 250m/256Mi lim
#   S : 250m/512Mi req, 1/1Gi lim
#   M : 500m/1Gi  req, 2/4Gi lim
#   L : 1/2Gi     req, 4/8Gi lim
#   XL: 2/4Gi     req, 8/16Gi lim
websocketGateway:
  replicas: 4
  resourceTier: M
  hpa:
    minReplicas: 4
    maxReplicas: 200
    targetCPUUtilizationPercentage: 70

channelStore:
  replicas: 3
  resourceTier: S

messageStreamRest:
  replicas: 6
  resourceTier: M
  hpa:
    minReplicas: 6
    maxReplicas: 100
    targetCPUUtilizationPercentage: 65

messageStreamWorker:
  replicas: 4
  resourceTier: M

presence:
  replicas: 3
  resourceTier: S

fileAttachmentWorker:
  replicas: 2
  resourceTier: M

mentionRouter:
  replicas: 3
  resourceTier: S

# ============================================================================
# Backing stores — references; provisioning lives in cloud-k8s + cloud-db
# ============================================================================

postgres:
  host: messenger-pg.${global.pack}.svc.cluster.local
  port: 5432
  database: messenger
  sslmode: require
  username: "${openbao:secret/messenger/postgres/username}"
  password: "${openbao:secret/messenger/postgres/password}"
  partitionStrategy: "by_tenant_channel_yyyy_mm"
  rls: enabled  # MANDATORY

valkeyPresence:
  host: messenger-valkey-presence.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/messenger/valkey/presence-auth}"
  fallback: keydb

valkeyStreams:
  host: messenger-valkey-streams.${global.pack}.svc.cluster.local
  port: 6379
  authToken: "${openbao:secret/messenger/valkey/streams-auth}"

s3Attachments:
  endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
  bucket: oya-messenger-attachments-${global.pack}
  quarantineBucket: oya-attachment-quarantine-${global.pack}
  accessKeyId: "${openbao:secret/messenger/s3/access-key}"
  secretAccessKey: "${openbao:secret/messenger/s3/secret-key}"
  sseKms: tenant-DEK

meilisearch:
  enabled: true
  host: messenger-meilisearch.${global.pack}.svc.cluster.local
  port: 7700
  apiKey: "${openbao:secret/messenger/meilisearch/master-key}"

# ============================================================================
# Voice + Video stack (LiveKit + coturn)
# ============================================================================

livekit:
  enabled: true
  apiKey: "${openbao:secret/messenger/livekit/api-key}"
  apiSecret: "${openbao:secret/messenger/livekit/api-secret}"
  rtcPortRange:
    start: 50000
    end: 60000

coturn:
  enabled: true
  realm: oyatie.dev
  authSecret: "${openbao:secret/messenger/coturn/auth-secret}"
  externalIp: "${COTURN_EXTERNAL_IP}"

# ============================================================================
# Cedar policy + Authz
# ============================================================================

cedar:
  policyConfigMap: messenger-cedar-policies
  defaultDeny: true

# ============================================================================
# Attachment malware scan
# ============================================================================

opswat:
  enabled: true
  endpoint: "${openbao:secret/messenger/opswat/endpoint}"
  apiKey: "${openbao:secret/messenger/opswat/api-key}"
  fallback: clamav

clamav:
  enabled: true  # fallback only; primary is opswat

# ============================================================================
# Observability
# ============================================================================

observability:
  otelEndpoint: alloy.observability.svc.cluster.local:4317
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRule:
    enabled: true
