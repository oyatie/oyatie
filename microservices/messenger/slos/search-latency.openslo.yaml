apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-search-latency
  displayName: "messenger: search p95 ≤ 400ms over 10M-msg corpus"
  labels:
    microservice: messenger
    bc: message-stream
    sli_class: latency
    owner_team: axis-messenger
spec:
  description: |
    p95 latency for GET /search with Cedar-filtered post-process. Corpus
    baseline 10M messages per tenant (large-tenant envelope). Beyond
    10M messages, latency follows the search-adapter scaling curve and
    a tenant-tier SLO override applies (see capacity-model.md).
  service: messenger
  indicator:
    metadata:
      name: messenger-search-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_search_duration_seconds_bucket{le="0.4"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_search_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 search ≤ 400ms"
