apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-read-receipt-fanout
  displayName: "messenger: read-receipt per-recipient fanout p99 ≤ 150ms"
  labels:
    microservice: messenger
    bc: read-receipt-tracker
    sli_class: latency
    owner_team: axis-messenger
spec:
  description: |
    Per-recipient last-read-cursor fan-out latency. Coalesced under 250ms
    windows; idempotent under backpressure. Reference: PRD §"Performance
    NFR" row "Read-receipt fan-out".
  service: messenger
  indicator:
    metadata:
      name: messenger-read-receipt-fanout
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_read_receipt_fanout_duration_seconds_bucket{le="0.15"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_read_receipt_fanout_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 read-receipt fanout ≤ 150ms"
