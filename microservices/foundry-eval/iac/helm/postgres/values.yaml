# Postgres — eval-set metadata HA cluster for foundry-eval
# Per ADR-0024 + threat-model T-D-04

pack: kr
region: ap-seoul-1

cluster:
  name: foundry-eval-postgres
  instances: 3  # primary + 2 sync replicas
  postgresVersion: "16"

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "32Gi"

  storage:
    size: "100Gi"
    storageClass: oya-block-ssd

  monitoring:
    enabled: true
    podMonitorEnabled: true

  backup:
    enabled: true
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://foundry-eval-postgres-backup-kr/"
      s3Credentials:
        accessKeyId:
          name: postgres-backup-s3-creds
          key: access-key-id
        secretAccessKey:
          name: postgres-backup-s3-creds
          key: secret-access-key
      wal:
        compression: gzip
        maxParallel: 8

  bootstrap:
    initdb:
      database: foundry_eval
      owner: foundry_eval_app
      secret:
        name: foundry-eval-app-credentials

# Row-level security policies (per policy/tenant-isolation.md TI-04)
rowLevelSecurity:
  enabled: true
  tenantPolicies:
    - schema: public
      table: eval_sets
      tenantColumn: tenant_id

# OpenBao integration for credentials
secrets:
  openBaoMountPath: "/var/run/secrets/openbao"

# Pod security
podSecurityContext:
  fsGroup: 999
  runAsUser: 999
  runAsNonRoot: true

# Replica affinity (cross-AZ)
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            cnpg.io/cluster: foundry-eval-postgres
        topologyKey: topology.kubernetes.io/zone

# Network policy
networkPolicy:
  enabled: true
  ingressAllowedFrom:
    - eval-runner-worker
    - eval-runner-rest
    - eval-set-registry-rest
