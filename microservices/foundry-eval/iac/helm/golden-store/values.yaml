# Golden-output + replay-trace store for foundry-eval
# Per ADR-0024 + threat-model T-T-02, T-T-03 + policy/tenant-isolation.md TI-03

pack: kr
region: ap-seoul-1

minio:
  mode: distributed
  replicas: 4

  image: quay.io/minio/minio:RELEASE.2026-03-01T00-00-00Z

  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  storage:
    size: "500Gi"
    storageClass: oya-block-ssd

  # Object Lock in Compliance mode (per threat-model T-T-02)
  objectLock:
    enabled: true
    mode: Compliance
    retentionDays: 30

  # SSE-KMS with per-pack KMS keyring
  serverSideEncryption:
    enabled: true
    kmsKeyId: "alias/oya-foundry-eval-kek-kr"

  # Buckets created via post-install Job
  buckets:
    - name: oya-foundry-eval-goldens-kr
      versioning: enabled
      objectLock: enabled
      lifecyclePolicies:
        - id: archive-cold-after-90d
          status: enabled
          transitions:
            - days: 90
              storageClass: GLACIER
    - name: oya-foundry-eval-replay-kr
      versioning: enabled
      objectLock: enabled
      lifecyclePolicies:
        - id: archive-cold-after-30d
          status: enabled
          transitions:
            - days: 30
              storageClass: GLACIER
        - id: expire-after-24mo
          status: enabled
          expiration:
            days: 730

  # Network policy
  networkPolicy:
    enabled: true
    ingressAllowedFrom:
      - eval-runner-worker
      - eval-runner-rest
      - replay-engine-worker
      - golden-output-store-rest

  # OpenBao integration
  secrets:
    openBaoMountPath: "/var/run/secrets/openbao"

  # Pod security
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true

  # Pod anti-affinity (cross-AZ)
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: minio-foundry-eval
        topologyKey: topology.kubernetes.io/zone

# Cosign verifier sidecar (per eval-set load path)
cosignVerifier:
  enabled: true
  image: ghcr.io/sigstore/cosign:v2.5.0
  rekorPublicLog: https://rekor.sigstore.dev
  rekorMirror: https://rekor.oyatie.internal  # fallback per threat-model FM-11

# Per-subject DEK envelope helper
dekEnvelope:
  enabled: true
  kmsKeyringAlias: "alias/oya-foundry-eval-kek-kr"
  rotationPolicy:
    dekRotationDays: 90
    kekRotationDays: 365
