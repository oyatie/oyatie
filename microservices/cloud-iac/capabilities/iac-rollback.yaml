# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-iac:iac-rollback:v1
name: iac-rollback
namespace: cloud-iac
display_name: Rollback IaC State
description: |
  Revert a µservice's IaC state to a prior known-good apply. Invoked by observability's
  SLO gate auto-rollback primitive (per ADR-0139) when a production-tier burn-rate
  breach fires within 1h post-promotion, OR by an on-call operator under 2-person rule
  for security-response or post-mortem-remediation scenarios.

owner_team: axis-cloud-iac
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0117, ADR-0139, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json, /specs/agentic-slo-gated-promotion.json]
related_artifacts:
  - microservices/cloud-iac/PRD.md
  - microservices/cloud-iac/contracts/openapi/cloud-iac.yaml
  - microservices/cloud-iac/runbooks/rollback-orchestration.md

autonomy_tier: T3
# T3 = destructive cluster mutation; reverting state is a destructive operation.
# Requires SPIFFE identity + signed rationale + audit-chain seal.

inputs:
  - name: microservice
    type: string
    required: true
  - name: pack
    type: enum
    required: true
  - name: environment
    type: enum
    values: [production]
    required: true
  - name: to_apply_id
    type: string
    required: true
    description: ULID of the target prior apply to revert to
  - name: reason
    type: enum
    values:
      - fast_burn_breach
      - slow_burn_breach
      - drift_remediation
      - supply_chain_response
      - manual_override
      - post_mortem_remediation
    required: true

outputs:
  - name: rollback_id
    type: string
    description: ULID
  - name: chain_depth
    type: integer
    description: 0 for first rollback; 1+ for rollback-of-rollback
  - name: executed_at
    type: timestamp
  - name: signature
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud-iac.apply.rolled_back

cost_profile:
  type: per-rollback
  estimated_cost_usd_per_call: 0.005
  cost_drivers:
    - ArgoCD re-sync to prior content digest
    - iac-state-index update
    - Audit-chain seal

cedar_policy_fragments:
  - microservices/cloud-iac/policy/ci-scope.cedar
  - microservices/cloud-iac/policy/auditor-scope.cedar (for audit-trail read)

eval_set:
  golden_inputs_path: microservices/cloud-iac/capabilities/eval/iac-rollback-golden.jsonl
  pass_threshold: 0.999
  eval_metric: rollback-latency-and-integrity (revert ≤2min p99; audit-chain seal complete)
  cadence: per-release
  reference: PRD-cloud-iac AC-05; runbooks/rollback-orchestration.md

sunset:
  status: none
  notes: ""
