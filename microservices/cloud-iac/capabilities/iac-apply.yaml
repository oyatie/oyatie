# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-iac:iac-apply:v1
name: iac-apply
namespace: cloud-iac
display_name: Apply IaC Manifests
description: |
  Apply a rendered manifest set to a µservice's declared apply-scope (namespaces +
  cluster roles) within a target pack + environment. Verifies SLSA L3 attestation
  pre-apply; refuses applies outside the µservice's declared scope per Cedar policy
  iac-isolation.md; orchestrates dependency-correct apply via ArgoCD or direct
  Kubernetes API; emits ApplyStarted + ApplyCompleted events sealed by audit-chain.

owner_team: axis-cloud-iac
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0117, ADR-0139, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/cloud-iac/PRD.md
  - microservices/cloud-iac/contracts/openapi/cloud-iac.yaml
  - microservices/cloud-iac/policy/iac-isolation.md

autonomy_tier: T3
# T3 = destructive cluster mutation; requires SPIFFE identity + SLSA L3 attestation
# verification + Cedar policy approval + signed eligibility verdict from observability.

inputs:
  - name: microservice
    type: string
    required: true
  - name: pack
    type: enum
    required: true
  - name: environment
    type: enum
    values: [dev, staging, production]
    required: true
  - name: sha
    type: string
    pattern: '^[a-f0-9]{40}$'
    required: true
  - name: eligibility_verdict_signature
    type: string
    required: true
    description: Signed verdict from observability SLO gate proving eligibility

outputs:
  - name: apply_id
    type: string
    description: ULID
  - name: state
    type: enum
    values: [pending, running, completed, failed, rolled_back]
  - name: resources_applied
    type: object
    properties:
      added: integer
      changed: integer
      destroyed: integer
  - name: signature
    type: string
    description: Ed25519 signature by iac-applier-worker for non-repudiation

data_classes_touched:
  - INTERNAL_ONLY
  - BEHAVIORAL_TENANT_PRODUCT
  # Cluster state per tenant is BEHAVIORAL_TENANT_PRODUCT.
  - AUDIT
  # Apply emission is an audit event.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud-iac.apply.completed

cost_profile:
  type: per-apply
  estimated_cost_usd_per_call: 0.01
  cost_drivers:
    - Kubernetes API mutation rate
    - OpenTofu refresh + apply
    - ArgoCD reconcile cycle
    - Audit-chain seal

cedar_policy_fragments:
  - microservices/cloud-iac/policy/ci-scope.cedar
  - microservices/cloud-iac/policy/tenant-scope.cedar

eval_set:
  golden_inputs_path: microservices/cloud-iac/capabilities/eval/iac-apply-golden.jsonl
  pass_threshold: 0.995
  eval_metric: apply-scope-correctness (refuses cross-µservice mutation; accepts in-scope)
  cadence: per-release
  reference: PRD-cloud-iac AC-04 + AC-07 + AC-11; iac-isolation.md ISO-01..ISO-07

sunset:
  status: none
  notes: ""
