plugins:
  required:
    - id: configuration-as-code
      purpose: "JCasC-only controller state"
    - id: kubernetes
      purpose: "Kubernetes Kata agent pods"
    - id: workflow-aggregator
      purpose: "Declarative pipeline execution"
    - id: git
      purpose: "SCM checkout"
    - id: credentials
      purpose: "OpenBao-backed credential binding"
    - id: oidc-provider
      purpose: "OIDC authentication bridge"
    - id: matrix-auth
      purpose: "Tenant-scoped UI and API authorization"
