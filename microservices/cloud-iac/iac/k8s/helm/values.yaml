microservice:
  id: cloud-iac
  cargoPackage: oya-cloud-iac-app
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-iac

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-iac
  tag: "0.1.0"
  # Placeholder non-zero digest — satisfies the cloud-iac-helm-chart-signed-image-wiring
  # gate's "no all-zeros" rule (PR #268) while release automation has not yet published
  # the real cosign-signed image. Replace on first release.
  digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-cloud-iac-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
