jenkins:
  systemMessage: "Oyatie ADR-0349 Jenkins LTS controller for colo; managed exclusively through JCasC."
  mode: NORMAL
  numExecutors: 0
  scmCheckoutRetryCount: 2
  markupFormatter:
    rawHtml:
      disableSyntaxHighlighting: false
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  securityRealm:
    local:
      allowsSignup: false
      users: []
  clouds:
    - kubernetes:
        name: "colo-kata-agents"
        namespace: "oya-ci-jenkins"
        serverUrl: "https://kubernetes.default.svc"
        jenkinsUrl: "http://jenkins.oya-ci-jenkins.svc.cluster.local:8080"
        containerCapStr: "20"
        podLabels:
          - key: "oyatie.com/runtime-tier"
            value: "1"
          - key: "oyatie.com/pod-runtime"
            value: "kata-cloud-hypervisor"
        templates:
          - name: "rust-ci"
            label: "rust-ci kata-cloud-hypervisor"
            namespace: "oya-ci-jenkins"
            serviceAccount: "jenkins-controller"
            yaml: |
              apiVersion: v1
              kind: Pod
              metadata:
                annotations:
                  cosign.sigstore.dev/required: "true"
                  oyatie.com/adr-0349: "jenkins-agent"
              spec:
                runtimeClassName: kata-cloud-hypervisor
                containers:
                  - name: rust
                    image: ${agent_image_ref}
                    command: ["cat"]
                    tty: true
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
  unclassified:
    location:
      url: "https://jenkins.colo.oyatie.internal/"
    globalLibraries:
      libraries:
        - name: "oya-jenkins-shared"
          defaultVersion: "main"
          retriever:
            modernSCM:
              scm:
                git:
                  remote: "https://git.oyatie.internal/oyatie/jenkins-shared-library.git"
