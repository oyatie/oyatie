# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-cloud-iac-velero
description: |
  Velero Kubernetes backup + migration substrate per ADR-0197. Backs up cluster
  state (manifests, CRDs) + persistent volumes via the file-system backup
  plugin (kopia / restic). Lands all backups in SeaweedFS bucket
  `oya-velero-backup-shared-<env>` per ADR-0196 + ADR-0197.
type: application
version: 0.1.0
appVersion: "1.18.0"  # Velero stable per docs/standards/backup-canonical.md (verified 2026-05-18)
maintainers:
  - name: axis-cloud-iac
    email: axis-cloud-iac@oyatie.com
dependencies:
  - name: velero
    version: "^9.0.0"
    repository: https://vmware-tanzu.github.io/helm-charts
