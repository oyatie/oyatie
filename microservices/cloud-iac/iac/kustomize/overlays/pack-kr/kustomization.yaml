# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas.
# Per data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/argo-cd/server/config/url
        value: "https://argocd-kr.oyatie.dev"
    target:
      kind: HelmRelease
      name: argocd
  - patch: |-
      - op: replace
        path: /spec/values/opentofu/state/s3/endpoint
        value: "https://objectstorage.ap-seoul-1.oraclecloud.com"
    target:
      kind: HelmRelease
      name: opentofu

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - DR_REGION=  # pack-kr is single-region (no DR pair)
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - KMS_KEY_RING=cloud-iac-kr-keyring
      - APPLY_AUDIT_RETENTION_YEARS=5  # KR commercial code; KR-FSS guidance
      - HIPAA_ELIGIBLE=false
      - ARGOCD_URL=https://argocd-kr.oyatie.dev
      - AUDIT_CHAIN_ENDPOINT=https://audit-chain-kr.oyatie.com
      - OIDC_ISSUER=https://auth.oyatie.com
