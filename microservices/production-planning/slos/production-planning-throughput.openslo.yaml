apiVersion: openslo/v1
kind: SLO
metadata:
  name: production-planning-throughput
  labels:
    service: production-planning
    sap_code: "PP"
spec:
  description: "Production Planning production-planning-throughput objective; benchmarks SAP PP Production Planning | Oracle Fusion Cloud Manufacturing | Workday Adaptive Planning production-capacity counterpart | NetSuite Manufacturing WIP and Routings | Microsoft Dynamics 365 Supply Chain Management"
  service: production-planning
  indicator:
    metadata:
      name: production-planning-throughput-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_production_planning_accepted_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_production_planning_received_total[5m]))"
  objectives:
    - displayName: production-planning-throughput
      target: 0.995
