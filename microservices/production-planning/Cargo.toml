[package]
name = "oya-production-planning-mrp-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Production Planning MRP application surface."

[package.metadata.oya]
microservice = "production-planning"
title = "Production Planning"
bounded_context = "mrp"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-production + council-product"
data_classification = "tenant-scoped production plans with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/production-planning-v1.proto"

[lib]
name = "oya_production_planning_mrp_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-production-planning-mrp"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
