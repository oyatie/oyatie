openapi: 3.2.0
info:
  title: consent-graph
  version: 0.1.0
  description: |
    Cross-tenant real-time visibility kernel. Owns the DataSharingAgreement entity, Cedar enforcement,
    bilateral audit chain emission, projection-gateway, and partner-directory handshake.
    Authority: ADR-0214 Cross-Tenant Real-Time Visibility.
  contact:
    name: axis-consent-graph
    url: https://docs.oya.dev/microservices/consent-graph/
  license:
    name: oyatie Proprietary
servers:
  - url: https://consent-graph.{region}.oya.dev
    variables:
      region:
        default: us-east-1
        enum: [us-east-1, us-west-2, eu-west-1, eu-central-1, ap-northeast-2, ap-northeast-1,
               ap-southeast-1, ap-southeast-2, ap-south-1, sa-east-1, me-south-1]
tags:
  - name: agreements
    description: DataSharingAgreement CRUD + lifecycle
  - name: enforcement
    description: Cedar-evaluated cross-tenant access decisions
  - name: revocation
    description: Real-time revocation propagation
  - name: partner-directory
    description: Peer-tenant handshake + trust-anchor verification
security:
  - mTLSAndJwtBearer: []
paths:
  /v1/agreements:
    post:
      tags: [agreements]
      summary: Draft a new DataSharingAgreement (grantor only)
      operationId: draftAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftAgreementCommand'
      responses:
        '201':
          description: drafted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementIdEnvelope'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [agreements]
      summary: List agreements visible to caller (grantor and/or grantee)
      operationId: listAgreements
      parameters:
        - in: query
          name: grantor
          schema: { type: string, format: tenant-id }
        - in: query
          name: grantee
          schema: { type: string, format: tenant-id }
        - in: query
          name: state
          schema:
            type: string
            enum: [Drafted, Offered, Accepted, Active, Suspended, Revoked, Expired]
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementPage'
  /v1/agreements/{agreement_id}:
    parameters:
      - $ref: '#/components/parameters/AgreementId'
    get:
      tags: [agreements]
      summary: Read an agreement
      operationId: readAgreement
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSharingAgreement' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agreements/{agreement_id}/offer:
    parameters: [{ $ref: '#/components/parameters/AgreementId' }]
    post:
      tags: [agreements]
      summary: Offer a Drafted agreement to grantee
      operationId: offerAgreement
      responses:
        '204': { description: offered }
  /v1/agreements/{agreement_id}/accept:
    parameters: [{ $ref: '#/components/parameters/AgreementId' }]
    post:
      tags: [agreements]
      summary: Accept an Offered agreement (grantee only)
      operationId: acceptAgreement
      responses:
        '204': { description: accepted; Cedar compile + projection mint in flight }
  /v1/agreements/{agreement_id}/revoke:
    parameters: [{ $ref: '#/components/parameters/AgreementId' }]
    post:
      tags: [agreements]
      summary: Revoke an Active agreement (grantor or grantee, or data-subject for B2C)
      operationId: revokeAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevocationReasonBody' }
      responses:
        '204': { description: revoked; propagation in flight }
  /v1/agreements/{agreement_id}/amend:
    parameters: [{ $ref: '#/components/parameters/AgreementId' }]
    post:
      tags: [agreements]
      summary: Amend scope or terms of an Active agreement (grantor only)
      operationId: amendAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendAgreementBody' }
      responses:
        '201':
          description: new amended version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgreementIdEnvelope' }
  /v1/agreements/{agreement_id}/self-revoke:
    parameters: [{ $ref: '#/components/parameters/AgreementId' }]
    post:
      tags: [agreements]
      summary: B2C data-subject self-revocation (ADR-SVC-CG-005)
      operationId: selfRevokeAgreement
      responses:
        '204': { description: revoked }
        '403': { description: not a self-revocable agreement }
  /v1/enforcement/evaluate:
    post:
      tags: [enforcement]
      summary: Internal Cedar evaluation (mTLS-only; not public)
      operationId: evaluateEnforcement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnforcementRequest' }
      responses:
        '200':
          description: decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnforcementDecision' }
  /v1/enforcement/break-glass-evaluate:
    post:
      tags: [enforcement]
      summary: Break-glass evaluation (emergency purposes; see break-glass.md)
      operationId: breakGlassEvaluate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BreakGlassRequest' }
      responses:
        '200': { description: decision; alert-target notified }
  /v1/partner-directory/handshake/initiate:
    post:
      tags: [partner-directory]
      summary: Initiate Leg 1 of three-leg handshake
      operationId: handshakeInitiate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandshakeInitiateBody' }
      responses:
        '200':
          description: peer responded; awaiting finalize
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandshakeRespondPayload' }
  /v1/partner-directory/handshake/respond:
    post:
      tags: [partner-directory]
      summary: Peer responds to Leg 1 (Leg 2)
      operationId: handshakeRespond
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandshakeInitiatePayload' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandshakeRespondPayload' }
  /v1/partner-directory/handshake/finalize:
    post:
      tags: [partner-directory]
      summary: Initiator finalizes (Leg 3)
      operationId: handshakeFinalize
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandshakeFinalizeBody' }
      responses:
        '204': { description: verified; both sides commit }
  /v1/partner-directory/{tenant_id}:
    parameters: [{ in: path, name: tenant_id, required: true, schema: { type: string, format: tenant-id } }]
    get:
      tags: [partner-directory]
      summary: Read partner record
      operationId: readPartner
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerTenant' }
  /v1/partner-directory/{tenant_id}/suspend:
    parameters: [{ in: path, name: tenant_id, required: true, schema: { type: string, format: tenant-id } }]
    post:
      tags: [partner-directory]
      summary: Suspend a partner (audit-officer role required)
      operationId: suspendPartner
      responses: { '204': { description: suspended } }
  /v1/partner-directory/{tenant_id}/offboard:
    parameters: [{ in: path, name: tenant_id, required: true, schema: { type: string, format: tenant-id } }]
    post:
      tags: [partner-directory]
      summary: Offboard a partner; cascades agreement revocation
      operationId: offboardPartner
      responses: { '204': { description: offboarded; cascade in flight } }
  /v1/revocations:
    post:
      tags: [revocation]
      summary: Originate a revocation
      operationId: originateRevocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OriginateRevocationCommand' }
      responses:
        '201':
          description: originated; propagation in flight
          content:
            application/json:
              schema:
                type: object
                properties:
                  revocation_id: { type: string }
  /v1/revocations/{revocation_id}/receipts:
    parameters: [{ in: path, name: revocation_id, required: true, schema: { type: string } }]
    get:
      tags: [revocation]
      summary: Read propagation receipts for a revocation
      operationId: listReceipts
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items: { $ref: '#/components/schemas/RevocationReceipt' }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: consent-graph
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  parameters:
    AgreementId:
      in: path
      name: agreement_id
      required: true
      schema: { type: string, format: ulid }
  responses:
    ValidationError:
      description: invalid input
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: missing or invalid auth
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: caller not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: not found or RLS hidden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  securitySchemes:
    mTLSAndJwtBearer:
      type: mutualTLS
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    DraftAgreementCommand:
      type: object
      required: [grantor, grantee, scope, terms, sovereignty]
      properties:
        grantor: { type: string, format: tenant-id }
        grantee: { type: string, format: tenant-id }
        scope: { $ref: '#/components/schemas/EntityScope' }
        terms: { $ref: '#/components/schemas/SharingTerms' }
        sovereignty: { $ref: '#/components/schemas/SovereigntyCfg' }
        expiration: { type: string, format: date-time }
        template_id:
          type: string
          enum: [tmpl-supply-chain-po-visibility, tmpl-healthcare-eligibility-verification,
                 tmpl-banking-account-share, tmpl-marketplace-cohort-stats, tmpl-b2c-order-tracking]
    EntityScope:
      type: object
      required: [entity_type, field_set]
      properties:
        entity_type: { type: string }
        field_set:
          oneOf:
            - type: object
              properties: { all_fields: { type: boolean, const: true } }
            - type: object
              properties:
                allow:
                  type: array
                  items: { type: string }
            - type: object
              properties:
                deny:
                  type: array
                  items: { type: string }
        predicate: { type: string, nullable: true }
    SharingTerms:
      type: object
      required: [purpose_of_use, mode]
      properties:
        purpose_of_use: { type: string }
        mode:
          type: string
          enum: [Projection, Aggregate, AttestedQuery]
        redaction:
          $ref: '#/components/schemas/RedactionConfig'
        k_anonymity: { type: integer, minimum: 2 }
        differential_privacy:
          type: object
          properties:
            epsilon: { type: number }
            delta: { type: number }
        max_qps: { type: integer, minimum: 1, maximum: 100000 }
    RedactionConfig:
      type: object
      additionalProperties:
        type: string
        enum: [mask, hash_sha256, null_, range_bucket, date_bucket, keep_raw]
    SovereigntyCfg:
      type: object
      required: [grantor_region, permitted_grantee_regions]
      properties:
        grantor_region: { type: string }
        permitted_grantee_regions:
          type: array
          items: { type: string }
        cross_border_transfer_permitted: { type: boolean, default: false }
        geo_replicate_to_grantee_region: { type: boolean, default: false }
        residency_overlay_pack:
          type: string
          enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
    DataSharingAgreement:
      type: object
      properties:
        agreement_id: { type: string, format: ulid }
        grantor: { type: string }
        grantee: { type: string }
        scope: { $ref: '#/components/schemas/EntityScope' }
        terms: { $ref: '#/components/schemas/SharingTerms' }
        state:
          type: string
          enum: [Drafted, Offered, Accepted, Active, Suspended, Revoked, Expired]
        state_payload: { type: object, additionalProperties: true }
        sovereignty: { $ref: '#/components/schemas/SovereigntyCfg' }
        cedar_policy_id: { type: string, nullable: true }
        bilateral_chain_link:
          type: object
          nullable: true
          properties:
            grantor:
              type: object
              properties:
                chain_id: { type: string }
                seq: { type: integer }
                sealed_at: { type: string, format: date-time }
                merkle_root: { type: string, format: byte }
            grantee:
              type: object
              properties:
                chain_id: { type: string }
                seq: { type: integer }
                sealed_at: { type: string, format: date-time }
                merkle_root: { type: string, format: byte }
        revocable: { type: boolean }
        expiration: { type: string, format: date-time, nullable: true }
        schema_version: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgreementIdEnvelope:
      type: object
      properties:
        agreement_id: { type: string, format: ulid }
    AgreementPage:
      type: object
      properties:
        agreements:
          type: array
          items: { $ref: '#/components/schemas/DataSharingAgreement' }
        next_page_token: { type: string, nullable: true }
    AmendAgreementBody:
      type: object
      properties:
        new_scope: { $ref: '#/components/schemas/EntityScope' }
        new_terms: { $ref: '#/components/schemas/SharingTerms' }
    RevocationReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [GrantorInitiated, GranteeInitiated, DataSubjectInitiated,
                 ContractEnded, PolicyViolation, SecurityIncident, ExpirationCascade, DsarErasure]
    EnforcementRequest:
      type: object
      required: [grantor, grantee, principal, action, resource, context]
      properties:
        request_id: { type: string, format: ulid }
        grantor: { type: string }
        grantee: { type: string }
        principal: { type: string }
        action:
          type: string
          enum: [project.subscribe, project.read, attested.query, aggregate.read]
        resource:
          type: object
          properties:
            entity_type: { type: string }
            entity_id: { type: string, nullable: true }
        context:
          type: object
          properties:
            purpose_of_use: { type: string }
            request_time: { type: string, format: date-time }
            request_region: { type: string }
            tenant_class:
              type: string
              enum: [demo_trial, paid]
            prior_revocation_check_ms_ago: { type: integer }
            trace_id: { type: string }
        agreement_id_hint: { type: string, format: ulid, nullable: true }
    EnforcementDecision:
      type: object
      properties:
        outcome:
          type: string
          enum: [Permit, Deny, Indeterminate]
        deny_reason:
          type: string
          nullable: true
          enum: [NoAgreement, AgreementRevoked, AgreementSuspended, AgreementExpired,
                 ScopeNotPermitted, PurposeOfUseMismatch, SovereigntyViolation,
                 RateLimitExceeded, CedarPolicyDeny, PartnerSuspended, InvalidPrincipal,
                 StaleRevocationCheck]
        matched_agreement: { type: string, nullable: true }
        determining_policy_id: { type: string, nullable: true }
        reasons:
          type: array
          items: { type: string }
        eval_duration_ns: { type: integer }
        cache_hit: { type: boolean }
    BreakGlassRequest:
      type: object
      required: [agreement_id, purpose_override, attestation, requesting_principal, expiry]
      properties:
        agreement_id: { type: string }
        purpose_override:
          type: string
          enum: [emergency-treatment, fraud-investigation, regulator-mandated-disclosure]
        attestation: { type: string, minLength: 200 }
        legal_instrument_ref: { type: string, nullable: true }
        requesting_principal: { type: string }
        case_id: { type: string, nullable: true }
        expiry: { type: string, format: date-time }
    PartnerTenant:
      type: object
      properties:
        local_tenant_id: { type: string }
        peer_tenant_id: { type: string }
        state:
          type: string
          enum: [Onboarding, Verified, Active, Suspended, Offboarded]
        peer_x509_spki: { type: string, format: byte }
        peer_pulsar_jwt_pub: { type: string, format: byte }
        peer_audit_chain_merkle_root: { type: string, format: byte }
        peer_audit_chain_schema_version: { type: integer }
        handshake_completed_at: { type: string, format: date-time, nullable: true }
    HandshakeInitiateBody:
      type: object
      required: [peer_tenant_id, anchors_proposed, nonce]
      properties:
        peer_tenant_id: { type: string }
        anchors_proposed:
          type: object
          properties:
            x509_spki: { type: string, format: byte }
            pulsar_jwt_pub: { type: string, format: byte }
            audit_chain_merkle_root: { type: string, format: byte }
            audit_chain_schema_version: { type: integer }
        nonce: { type: string, format: byte }
    HandshakeInitiatePayload:
      $ref: '#/components/schemas/HandshakeInitiateBody'
    HandshakeRespondPayload:
      type: object
      properties:
        anchors: { $ref: '#/components/schemas/HandshakeInitiateBody/properties/anchors_proposed' }
        nonce: { type: string, format: byte }
        hmac_over_initiator_nonce_and_self_anchors: { type: string, format: byte }
    HandshakeFinalizeBody:
      type: object
      properties:
        hmac_over_responder_nonce_and_self_anchors: { type: string, format: byte }
    OriginateRevocationCommand:
      type: object
      required: [agreement_id, reason]
      properties:
        agreement_id: { type: string }
        reason: { $ref: '#/components/schemas/RevocationReasonBody/properties/reason' }
        idempotency_key: { type: string, nullable: true }
    RevocationReceipt:
      type: object
      properties:
        revocation_id: { type: string }
        subscriber_service: { type: string }
        subscriber_region: { type: string }
        propagated_at: { type: string, format: date-time }
        propagation_latency_ms: { type: integer }
        action_taken:
          type: string
          enum: [CacheInvalidated, ProjectionPaused, TopicDestroyed, RowTombstoned, NoOp]
