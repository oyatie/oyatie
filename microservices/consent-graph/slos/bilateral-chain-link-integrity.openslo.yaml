apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-bilateral-chain-link-integrity
  displayName: Bilateral chain link integrity
spec:
  description: |
    For every consent-graph event, both grantor + grantee chains must have paired entries with
    matching paired_hmac. Reconciliation runs hourly.
    Authority: ADR-0214 §2.6 + ADR-SVC-CG-001 + IP-013.
  service: consent-graph
  indicator:
    metadata:
      name: bilateral-chain-link-integrity
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_bilateral_link_total{outcome="paired"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_bilateral_link_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% paired
      target: 1.0
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P0
      burnRate: 14.4
      window: 1h
    - severity: P1
      burnRate: 6.0
      window: 6h
