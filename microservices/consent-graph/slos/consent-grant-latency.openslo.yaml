apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-consent-grant-latency
  displayName: Consent grant E2E latency
spec:
  description: |
    p95 latency for draft → offer → accept → Active lifecycle, end-to-end.
    Authority: ADR-0214 §5 + PRD §5.
  service: consent-graph
  indicator:
    metadata:
      name: consent-grant-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_grant_duration_seconds_bucket{le="2.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_grant_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 2 seconds
      target: 0.95
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P2
      burnRate: 14.4
      window: 1h
    - severity: P3
      burnRate: 3.0
      window: 24h
