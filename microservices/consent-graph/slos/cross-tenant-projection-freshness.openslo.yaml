apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-cross-tenant-projection-freshness
  displayName: Cross-tenant projection freshness
spec:
  description: |
    p95 grantor-commit → grantee-visible latency for Projection mode.
    Authority: ADR-0214 §5; IP-011 §10.
  service: consent-graph
  indicator:
    metadata:
      name: projection-freshness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_projection_lag_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_projection_lag_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 500ms
      target: 0.95
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P1
      burnRate: 14.4
      window: 1h
    - severity: P2
      burnRate: 3.0
      window: 24h
