apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-cedar-evaluation-latency
  displayName: Cedar evaluation latency
spec:
  description: |
    p99 hot-path Cedar evaluation latency, cache-hit path.
    Authority: ADR-0214 §2.3 + IP-006 §8.
  service: consent-graph
  indicator:
    metadata:
      name: cedar-evaluation-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_cedar_eval_duration_seconds_bucket{le="0.01"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_cedar_eval_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% within 10ms
      target: 0.99
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P1
      burnRate: 14.4
      window: 1h
    - severity: P2
      burnRate: 3.0
      window: 24h
