apiVersion: oya.dev/v1
kind: FrameworkScorecard
metadata:
  name: consent-graph-architecture-conformance
spec:
  microservice: consent-graph
  framework: Clean-Architecture + ADR-0105 13-Layer + ADR-0131 flat layout
  reviewers: [axis-consent-graph, architecture-axis]
  date: 2026-05-18
  axes:
    - name: 13-layer enum conformance (kernel/domain/usecase/api/adapter/rest/sdk/app/worker)
      score: 9
      max: 9
      evidence: every crate maps to a layer; manifest layers section lists 9 layer values
    - name: Inward-only dependency flow
      score: 5
      max: 5
      evidence: 51 crates; dependency graph in IP §dependencies validates inward arrows only
    - name: Port-in-kernel
      score: 5
      max: 5
      evidence: every BC kernel exposes ports; adapter layer implements; usecase consumes
    - name: Cross-product refusal (Workflow + Ontology adapter only)
      score: 5
      max: 5
      evidence: consent-graph depends on audit-chain, ontology, identity, observability via SDK; no direct cross-product
    - name: ADR-0131 flat layout
      score: 5
      max: 5
      evidence: directory under microservices/consent-graph/; no nested suite
    - name: ADR-0132 no-grouping policy
      score: 5
      max: 5
      evidence: single-concern (cross-tenant visibility kernel); not a bundle
    - name: ADR-0064 canonical-base + pack overlays
      score: 5
      max: 5
      evidence: 11 pack overlays under iac/kustomize/overlays/; classifier + sovereignty rules pluggable
    - name: ADR-0130 SLO-gated promotion
      score: 5
      max: 5
      evidence: 9 SLOs authored + IP-015 HG-CONSENT registration ready
    - name: Naming justification + 13-layer enum
      score: 5
      max: 5
      evidence: 51 crate names conform to oya-consent-graph-<bc>-<layer>[-<specialization>]
  overall:
    score: 49
    max: 49
    percent: 100.0
    verdict: pass
