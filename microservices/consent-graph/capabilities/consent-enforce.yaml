apiVersion: oya.dev/v1
kind: Capability
metadata:
  name: consent-enforce
  description: Read-only Cedar evaluation for a cross-tenant access decision (deny-by-default).
spec:
  microservice: consent-graph
  tier: T0
  risk_class: none
  rationale: |
    Pure read-only evaluation. No data modification. Deterministic given inputs + policy. Deny-by-default
    failure mode. Hot-path; T0 = no separate authorization required (caller is in-cluster mTLS-verified).
  audit_emission:
    - oya.consent-graph.enforcement-permit (sampled 0.1% default; 100% on high-stakes)
    - oya.consent-graph.enforcement-deny (100%)
  required_authorization:
    - in-cluster mTLS + SPIFFE workload identity
  reversibility:
    revocable_state_set: []
    rationale: read-only; no state change to revoke
  failure_mode: fail-closed
  hyperscaler_invariants:
    - INV-CIRCUIT-BREAKER-BULKHEAD
    - INV-FOUR-CANONICAL-SIGNALS
    - INV-SLO-ERROR-BUDGET
  performance:
    p99_latency_ms: 10
    p50_latency_us: 500
    throughput_req_s: 100000
    cache_hit_rate_floor: 0.80
  pack_overlays_supported:
    - kr
    - eu
    - us
    - us-healthcare
    - jp
    - sg
    - au
    - in
    - br
    - ae
    - ksa
