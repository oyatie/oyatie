apiVersion: oya.dev/v1
kind: Capability
metadata:
  name: consent-grant
  description: Issue / amend / revoke a DataSharingAgreement. Cross-tenant data flow authorization.
spec:
  microservice: consent-graph
  tier: T3
  risk_class: high
  rationale: |
    Cross-tenant data-sharing creation has legal-grade implications: it constitutes processing under
    GDPR Art. 28 (joint controllers/processors), HIPAA Business Associate relationships, KR PIPA
    cross-border transfer regulations, etc. Mistakes here have multi-jurisdictional regulatory
    consequences. T3 = legal-grade audit + multi-party approval + bilateral chain + reversibility
    via revocation.
  audit_emission:
    - oya.consent-graph.agreement-drafted
    - oya.consent-graph.agreement-offered
    - oya.consent-graph.agreement-accepted
    - oya.consent-graph.agreement-amended
    - oya.consent-graph.agreement-revoked
    - oya.consent-graph.agreement-expired
    - oya.consent-graph.agreement-suspended
  required_authorization:
    - grantor.role:partnership-manager
    - grantee.role:partnership-manager
    - audit-officer review for first-handshake transitions
  reversibility:
    revocable_state_set: [Active, Suspended, Accepted]
    revocation_propagation_max: 1s
  failure_mode: fail-closed
  hyperscaler_invariants:
    - INV-CIRCUIT-BREAKER-BULKHEAD
    - INV-SLO-ERROR-BUDGET
    - INV-FOUR-CANONICAL-SIGNALS
  pack_overlays_supported:
    - kr
    - eu
    - us
    - us-healthcare
    - jp
    - sg
    - au
    - in
    - br
    - ae
    - ksa
