apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-graph-app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - { name: OYA_PACK, value: "eu" }
            - { name: OYA_REGION, value: "eu-west-1" }
            - { name: OYA_DEFAULT_CROSS_BORDER_TRANSFER_PERMITTED, value: "false" }
            - { name: OYA_AUDIT_CHAIN_RETENTION_YEARS, value: "7" }
            - { name: OYA_DSAR_CLOCK_DAYS, value: "30" }
