apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: consent-graph-us-overlay
namespace: consent-graph
resources:
  - ../../base
configMapGenerator:
  - name: consent-graph-pack-config
    literals:
      - pack=us
      - default_cross_border_transfer_permitted=false
      - audit_chain_retention_years=7
      - dsar_clock_days=45
      - sensitive_k_anonymity_min=5
