apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: consent-graph-us-healthcare-overlay
namespace: consent-graph
resources:
  - ../../base
configMapGenerator:
  - name: consent-graph-pack-config
    literals:
      - pack=us-healthcare
      - default_cross_border_transfer_permitted=false
      - audit_chain_retention_years=6
      - min_necessary_enforced=true
      - break_glass_purpose_supported=emergency-treatment
      - baa_required=true
      - sensitive_k_anonymity_min=10
