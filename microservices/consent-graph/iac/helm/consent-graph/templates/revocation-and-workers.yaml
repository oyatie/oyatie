apiVersion: apps/v1
kind: Deployment
metadata:
  name: revocation-app
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/name: revocation-app, app.kubernetes.io/part-of: consent-graph }
spec:
  replicas: {{ .Values.apps.revocation.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: revocation-app } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: revocation-app, app.kubernetes.io/part-of: consent-graph, ambient.istio.io/redirection: enabled }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "{{ .Values.ports.metrics }}" }
    spec:
      serviceAccountName: revocation-app
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/usr/local/bin/oya-consent-graph-revocation-app"]
          ports:
            - { name: grpc, containerPort: {{ .Values.ports.grpc }} }
            - { name: metrics, containerPort: {{ .Values.ports.metrics }} }
            - { name: health, containerPort: {{ .Values.ports.health }} }
          env:
            - { name: OYA_REGION, value: "{{ .Values.region }}" }
            - { name: OYA_PULSAR_URL, value: "{{ .Values.pulsar.brokerUrl }}" }
            - { name: OYA_PULSAR_REVOCATION_TOPIC, value: "{{ .Values.pulsar.revocationTopic }}" }
          resources: {{ toYaml .Values.apps.revocation.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-gateway-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.apps.projectionGatewayWorker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: projection-gateway-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: projection-gateway-worker, app.kubernetes.io/part-of: consent-graph, ambient.istio.io/redirection: enabled }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "{{ .Values.ports.metrics }}" }
    spec:
      serviceAccountName: projection-gateway-worker
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/usr/local/bin/oya-consent-graph-projection-gateway-worker"]
          ports:
            - { name: metrics, containerPort: {{ .Values.ports.metrics }} }
            - { name: health,  containerPort: {{ .Values.ports.health }} }
          env:
            - { name: OYA_REGION, value: "{{ .Values.region }}" }
          resources: {{ toYaml .Values.apps.projectionGatewayWorker.resources | nindent 12 }}
---
