apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-survey
  service: marketing-automation
spec:
  businessCapability: marketing-survey
  capability: survey
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Feedback Surveys (CSAT/NPS/CES)
  flankingCounterparts:
    - Adobe Marketo Engage Survey Form
    - Mailchimp Survey + Sign-up Form
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0251, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: survey
  aggregateRoot: marketing_survey
  invariants:
    - tenant scope required
    - survey kinds NPS / CSAT / CES / custom
    - response idempotency via signed response token
    - per-pack disclosure block
  commands: [create, publish, send, record_response, retire]
  events: [created, published, sent, response_recorded, retired]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishSurvey
  observability:
    auditEvents:
      - EVT-MARKETING-SURVEY-CREATED
      - EVT-MARKETING-SURVEY-RESPONSE-RECORDED
  crossMicroserviceHandoffs:
    - email (survey distribution)
    - audit-chain (sealing)
  implementationPlanRef: IP-052-survey.md
