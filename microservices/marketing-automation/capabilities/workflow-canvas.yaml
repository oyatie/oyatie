apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-workflow-canvas
  service: marketing-automation
spec:
  businessCapability: marketing-workflow-canvas
  capability: workflow-canvas
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Workflow Editor
  flankingCounterparts:
    - Adobe Marketo Engage Smart Campaign Designer
    - Mailchimp Customer Journey Builder
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0245, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: workflow-canvas
  aggregateRoot: marketing_workflow_canvas
  invariants:
    - tenant scope required
    - DAG-validated (no cycles)
    - step types from canonical step-registry
    - version monotonic
    - published versions immutable
    - only one published version at a time per canvas name
  commands: [create, amend, validate, publish, retire, duplicate]
  events: [created, amended, validated, published, retired, duplicated]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishWorkflowCanvas
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/workflow-canvases
    proto: marketing-automation-v1.proto MarketingWorkflowCanvasService
  observability:
    auditEvents:
      - EVT-MARKETING-WORKFLOW-CANVAS-CREATED
      - EVT-MARKETING-WORKFLOW-CANVAS-PUBLISHED
    sloRef: slos/local-journey-trigger-latency.openslo.yaml
  crossMicroserviceHandoffs:
    - workflow-engine (snapshot execution; runtime is workflow-engine)
    - audit-chain (sealing)
  implementationPlanRef: IP-034-workflow-canvas.md
  separationOfConcerns: "authoring surface here; runtime execution in workflow-engine; journey runtime in marketing-automation.journey bounded context consumes both"
