apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-send-time-optimization
  service: marketing-automation
spec:
  businessCapability: marketing-send-time-optimization
  capability: send-time-optimization
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Send Time Optimization
  flankingCounterparts:
    - Adobe Marketo Engage Optimal Send Time
    - Mailchimp Send Time Optimization
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: send-time-optimization
  aggregateRoot: marketing_sto_profile
  invariants:
    - per-subject optimal-send-time prediction sourced from intelligence
    - fallback default window when prediction confidence low
    - respects frequency-cap reservation (does not schedule into denial windows)
    - respects deliverability admit decisions
  commands: [predict_window, override_window, reset_profile]
  events: [window_predicted, window_overridden, profile_reset]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PredictSendWindow
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/send-time-optimization/predict
  observability:
    auditEvents:
      - EVT-MARKETING-STO-WINDOW-PREDICTED
      - EVT-MARKETING-STO-WINDOW-OVERRIDDEN
  crossMicroserviceHandoffs:
    - intelligence (prediction source)
    - frequency-cap (reservation consistency)
    - deliverability (admit budget consistency)
    - audit-chain (sealing)
  implementationPlanRef: IP-036-send-time-optimization.md
