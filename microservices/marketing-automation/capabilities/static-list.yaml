apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-static-list
  service: marketing-automation
spec:
  businessCapability: marketing-static-list
  capability: static-list
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Static List
  flankingCounterparts:
    - Adobe Marketo Engage Static List
    - Mailchimp Tag
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: static-list
  aggregateRoot: marketing_static_list
  invariants:
    - tenant scope required
    - membership rows have explicit source provenance
    - admin-only mutation paths
    - distinct from segment (segment = predicate-derived dynamic membership; static-list = explicit membership)
  commands: [create, add_member, remove_member, archive, import]
  events: [created, member_added, member_removed, archived, import_completed]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::ManageStaticList
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/static-lists
  observability:
    auditEvents:
      - EVT-MARKETING-STATIC-LIST-CREATED
      - EVT-MARKETING-STATIC-LIST-MEMBER-ADDED
      - EVT-MARKETING-STATIC-LIST-IMPORT-COMPLETED
  crossMicroserviceHandoffs:
    - audit-chain (sealing)
  implementationPlanRef: IP-046-static-list.md
