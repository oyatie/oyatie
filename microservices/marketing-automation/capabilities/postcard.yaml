apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-postcard
  service: marketing-automation
spec:
  businessCapability: marketing-postcard
  capability: postcard
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: Mailchimp Postcard (physical-mail direct-mail)
  flankingCounterparts:
    - "(HubSpot via integrations only)"
    - "(Marketo via integrations only)"
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0251, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: postcard
  aggregateRoot: marketing_postcard
  invariants:
    - tenant scope required
    - physical-mail delivery via postal-provider adapter
    - address validation against postal API
    - per-pack disclosure (CAN-SPAM does not apply to postal; CCPA/GDPR do)
    - per_usage meter physical-piece billed
  commands: [compose, address_list, send, track_delivery]
  events: [composed, addressed, sent, delivered, returned_to_sender]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::SendPostcard
  perUsageMeter: postcards_sent
  observability:
    auditEvents:
      - EVT-MARKETING-POSTCARD-COMPOSED
      - EVT-MARKETING-POSTCARD-SENT
      - EVT-MARKETING-POSTCARD-DELIVERED
  crossMicroserviceHandoffs:
    - postal-provider-adapter (physical delivery)
    - audit-chain (sealing)
    - finops (per_usage meter)
  implementationPlanRef: IP-053-postcard.md
