apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-landing-page
  service: marketing-automation
spec:
  businessCapability: marketing-landing-page
  capability: landing-page
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Landing Page
  flankingCounterparts:
    - Adobe Marketo Engage Landing Page
    - Mailchimp Landing Page
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0245, ADR-0253-amendment, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: landing-page
  aggregateRoot: marketing_landing_page
  invariants:
    - tenant scope required
    - template + form attachment + conversion goal + A/B variant + SEO metadata
    - custom CSS/HTML override + password protection + language localisation
    - delegation to sites for tenant website root
  commands: [create, amend, publish, retire, A_B_variant_add]
  events: [created, amended, published, retired, variant_added, converted]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
    tenantClassValues: [demo_trial, paid]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishLandingPage
      tenantClassRule: "demo_trial landing_pages cap = 3"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/landing-pages
    events: asyncapi-v1.yaml channel marketing_automation.landing_page.*
  observability:
    auditEvents:
      - EVT-MARKETING-LANDING-PAGE-CREATED
      - EVT-MARKETING-LANDING-PAGE-PUBLISHED
      - EVT-MARKETING-LANDING-PAGE-CONVERTED
    sloRef: slos/local-deliverability-success.openslo.yaml
  perUsageMeter: landing_page_views
  crossMicroserviceHandoffs:
    - sites (tenant CNAME + tenant website root seam per ADR-MS-MA-002)
    - forms (form attachment)
    - a-b-test (variant test)
    - audit-chain (sealing)
  implementationPlanRef: IP-032-landing-page.md
