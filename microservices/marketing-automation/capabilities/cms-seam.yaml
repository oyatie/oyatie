apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-cms-seam
  service: marketing-automation
spec:
  businessCapability: marketing-cms
  capability: cms-seam
  category: customer-engagement-substrate-seam
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot CMS Hub
  flankingCounterparts:
    - Adobe Marketo Engage Design Studio (limited)
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: cms-seam
  aggregateRoot: "(delegation only; sites + design-collaboration own aggregates)"
  invariants:
    - delegation to sites for tenant website root
    - delegation to design-collaboration for content authoring
    - marketing-attached landing pages remain in this microservice
  commands: [reference_cms_page, embed_cms_block]
  events: [cms_page_referenced, cms_block_embedded]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::ReferenceCmsPage
  observability:
    auditEvents:
      - EVT-MARKETING-CMS-PAGE-REFERENCED
  crossMicroserviceHandoffs:
    - sites (tenant website root)
    - design-collaboration (content authoring)
    - audit-chain (sealing)
  implementationPlanRef: IP-050-cms-seam.md
  openQuestionResolution: "Q-007 + Q-019 settled — CMS overlap delegated to sites + design-collaboration"
