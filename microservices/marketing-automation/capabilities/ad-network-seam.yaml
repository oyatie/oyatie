apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-ad-network-seam
  service: marketing-automation
spec:
  businessCapability: marketing-ad-network
  capability: ad-network-seam
  category: customer-engagement-substrate-seam
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Ads (Google + LinkedIn + Facebook)
  flankingCounterparts:
    - Adobe Marketo Engage Ad Bridge
    - Mailchimp Ads (Google + Facebook + Instagram)
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0314, ADR-0321, ADR-0328]
  boundedContext: ad-network-seam
  aggregateRoot: "(delegation only; advertising-platform owns aggregates)"
  invariants:
    - delegation to advertising-platform µservice
    - audience sync via marketplace audience-license (DealSet per ADR-0314)
    - touch ingestion into attribution via crm contract for spend events
  commands: [sync_audience, ingest_ad_event]
  events: [audience_synced, ad_event_ingested]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::SyncAudienceToAdNetwork
  observability:
    auditEvents:
      - EVT-MARKETING-AD-NETWORK-AUDIENCE-SYNCED
      - EVT-MARKETING-AD-NETWORK-EVENT-INGESTED
  crossMicroserviceHandoffs:
    - advertising-platform (Google + LinkedIn + Facebook + TikTok adapters)
    - marketplace (audience-license DealSet per ADR-0314)
    - attribution (touch ingestion)
    - audit-chain (sealing)
  implementationPlanRef: IP-047-ad-network-seam.md
  openQuestionResolution: "Q-022 settled — ad-network primitive delegated to advertising-platform µservice"
