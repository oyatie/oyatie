apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-chatflow
  service: marketing-automation
spec:
  businessCapability: marketing-chatflow
  capability: chatflow
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Chatflows + Conversational Bots
  flankingCounterparts:
    - "(Marketo bot integrations via third-party)"
    - "(Mailchimp not a primary counterpart for chatbot)"
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0251, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: chatflow
  aggregateRoot: marketing_chatflow
  invariants:
    - tenant scope required
    - bot decision tree DAG
    - handoff rules to messenger / contact-center
    - per-tenant routing
    - PII redaction at handoff boundary
  commands: [define, publish, retire, handoff]
  events: [defined, published, retired, handoff_triggered]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishChatflow
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/chatflows
  observability:
    auditEvents:
      - EVT-MARKETING-CHATFLOW-DEFINED
      - EVT-MARKETING-CHATFLOW-HANDOFF-TRIGGERED
  crossMicroserviceHandoffs:
    - messenger (chat delivery)
    - contact-center (live agent handoff)
    - data-boundary (PII redaction)
    - audit-chain (sealing)
  implementationPlanRef: IP-055-chatflow.md
