apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-a-b-test
  service: marketing-automation
spec:
  businessCapability: marketing-a-b-test
  capability: a-b-test
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot A/B Test
  flankingCounterparts:
    - Adobe Marketo Engage A/B Test
    - Mailchimp A/B Test (Premium)
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: a-b-test
  aggregateRoot: marketing_a_b_test
  invariants:
    - tenant scope required
    - variant set with allocation percentages summing to 100
    - statistical significance threshold declared (default 0.95)
    - winner-selection rule declared
    - applicable to email + landing-page + workflow-canvas
  commands: [configure_test, allocate_traffic, conclude, declare_winner]
  events: [test_configured, traffic_allocated, concluded, winner_declared]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::ConfigureABTest
      tenantClassRule: "demo_trial a_b_tests cap = 1"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/a-b-tests
  observability:
    auditEvents:
      - EVT-MARKETING-AB-TEST-CONFIGURED
      - EVT-MARKETING-AB-TEST-CONCLUDED
  perUsageMeter: ab_test_runs
  crossMicroserviceHandoffs:
    - intelligence (statistical significance calculation)
    - audit-chain (sealing)
    - finops (per_usage meter)
  implementationPlanRef: IP-035-a-b-test.md
