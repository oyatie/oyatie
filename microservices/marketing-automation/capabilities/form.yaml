apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-form
  service: marketing-automation
spec:
  businessCapability: marketing-form
  capability: form
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Form (regular + pop-up + collected + chatflow-form)
  flankingCounterparts:
    - Adobe Marketo Engage Form
    - Mailchimp Signup Form
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0245, ADR-0251, ADR-0253-amendment, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: form
  aggregateRoot: marketing_form
  invariants:
    - tenant scope required
    - field configuration + validation rules + post-submit redirect
    - GDPR consent block per residency pack overlay
    - progressive profiling + conditional logic DAG
    - submission idempotency via idempotency-key
    - CAPTCHA invariant per pack overlay
    - delegation to forms µservice substrate per ADR-MS-MA-003
  commands: [create, amend, publish, retire, submit]
  events: [created, amended, published, retired, submission_received]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
    tenantClassValues: [demo_trial, paid]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::PublishForm
      tenantClassRule: "demo_trial forms cap = 5"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/forms
    events: asyncapi-v1.yaml channel marketing_automation.form.*
  observability:
    auditEvents:
      - EVT-MARKETING-FORM-CREATED
      - EVT-MARKETING-FORM-PUBLISHED
      - EVT-MARKETING-FORM-SUBMITTED
    sloRef: slos/local-deliverability-success.openslo.yaml
  perUsageMeter: form_submissions
  crossMicroserviceHandoffs:
    - forms (substrate per ADR-MS-MA-003)
    - consent-graph (consent block evidence)
    - audit-chain (sealing)
  implementationPlanRef: IP-033-form.md
