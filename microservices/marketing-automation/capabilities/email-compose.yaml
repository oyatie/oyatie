apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: marketing-automation-email-compose
  service: marketing-automation
spec:
  businessCapability: marketing-email
  capability: email-compose
  category: customer-engagement-substrate
  big8Phase: "4A.5"
  primaryCounterpart: HubSpot Marketing Hub Marketing Email
  flankingCounterparts:
    - Adobe Marketo Engage Email Program
    - Mailchimp Regular Campaign + Automated Email + Plain-text + RSS-driven + Postcard
  bindingAdrs: [ADR-0105, ADR-0244, ADR-0245, ADR-0251, ADR-0253-amendment, ADR-0263, ADR-0321, ADR-0328]
  boundedContext: email
  aggregateRoot: marketing_email
  invariants:
    - tenant scope required
    - subject + content + dynamic tokens + smart content rules + A/B variant set
    - preview-text, from-name, from-email, replyTo immutable for sent envelopes
    - accessibility-checker pass before publish
    - locale variants resolve per pack overlay
  commands: [create, amend, validate, publish, A_B_variant_add, schedule_send, cancel_send]
  events: [created, amended, validated, published, variant_added, send_scheduled, send_cancelled]
  tenantScope:
    requiredFields: [tenant_id, principal_id, tenant_class, purpose, data_class]
    tenantClassValues: [demo_trial, paid]
  cedarGates:
    - principal: marketing.ops
      action: marketingAutomation::ComposeEmail
      tenantClassRule: "demo_trial monthly_email_sends cap = 5000"
  contracts:
    rest: openapi-v1.yaml POST /v1/marketing-automation/emails
    events: asyncapi-v1.yaml channel marketing_automation.email.*
    proto: marketing-automation-v1.proto MarketingEmailService
  observability:
    auditEvents:
      - EVT-MARKETING-EMAIL-CREATED
      - EVT-MARKETING-EMAIL-PUBLISHED
      - EVT-MARKETING-EMAIL-SCHEDULED-SEND
    metrics:
      - marketing_automation_emails_composed_total
      - marketing_automation_emails_published_total
      - marketing_automation_emails_sent_total
    sloRef: slos/local-send-latency.openslo.yaml
  perUsageMeter: email_sends
  crossMicroserviceHandoffs:
    - mail (send execution)
    - frequency-cap (touch reservation)
    - deliverability (admit decision)
    - consent-audience (suppression check)
    - send-time-optimization (window prediction)
    - audit-chain (sealing)
    - finops (per_usage meter)
  implementationPlanRef: IP-031-email-compose.md
  marketplaceSettlement: DealSet
