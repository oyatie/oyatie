apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: marketing-automation-local-ops
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: marketing-automation
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_marketing_automation_send_latency_good_total
    - oya_marketing_automation_deliverability_success_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-campaign-segment-scope.cedar
