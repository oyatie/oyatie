service:
  name: marketing-automation
  suite: local-operational-primitive
  audience: ENTERPRISE_MARKETING_OPERATOR
workloads:
  send-worker:
    replicas: 3
    sloMetric: oya_marketing_automation_send_latency
  deliverability-consumer:
    replicas: 2
    sloMetric: oya_marketing_automation_deliverability_success
  suppression-cache:
    replicas: 2
    sloMetric: oya_marketing_automation_suppression_enforcement
policy:
  directory: policies
  defaultDeny: true
