apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: marketing-automation-local-openbao-binding
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: marketing-automation-local-ops
  vaultPath: kv/marketing-automation/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: marketing-automation.local-ops.v1
  requiredFor:
    - send-worker
    - deliverability-consumer
