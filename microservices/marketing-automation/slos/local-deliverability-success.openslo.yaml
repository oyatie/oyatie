apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-deliverability-success
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: marketing-automation
  description: Accepted campaign messages that produce delivery evidence for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  indicator:
    metadata:
      name: deliverability-success
      labels:
        domain_object: CampaignJourney
        operator_audience: ENTERPRISE_MARKETING_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_deliverability_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_deliverability_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Accepted campaign messages that produce delivery evidence
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
