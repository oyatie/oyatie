apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-consent-propagation
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: marketing-automation
  description: Consent changes propagated to audience segments for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  indicator:
    metadata:
      name: consent-propagation
      labels:
        domain_object: CampaignJourney
        operator_audience: ENTERPRISE_MARKETING_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_consent_propagation_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_consent_propagation_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Consent changes propagated to audience segments
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
