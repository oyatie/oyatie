apiVersion: openslo/v1
kind: SLO
metadata:
  name: marketing-automation-send-latency
  labels:
    service: marketing-automation
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: marketing-automation
  description: Campaign send acceptance latency for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  indicator:
    metadata:
      name: send-latency
      labels:
        domain_object: CampaignJourney
        operator_audience: ENTERPRISE_MARKETING_OPERATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_send_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_marketing_automation_send_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Campaign send acceptance latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
