asyncapi: 3.1.0
info:
  title: Marketing Automation Local Operational Events
  version: 1.0.0
  description: Events for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  marketing-automation.local-ops.v1:
    address: marketing-automation.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/marketing-automation.local-ops.v1'
    messages:
      - $ref: '#/channels/marketing-automation.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/marketing-automation.local-ops.v1'
    messages:
      - $ref: '#/channels/marketing-automation.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: MarketingAutomationDomainEvent
      title: Marketing Automation domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['segment.membership.rebuilt', 'journey.step.executed', 'send.batch.accepted', 'deliverability.signal.received'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['campaign_profile', 'consent_signal', 'suppression_entry', 'attribution_event', 'segment_membership', 'deliverability_report'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: MarketingAutomationSloBurnEvent
      title: Marketing Automation SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'marketing-automation' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'segment.membership.rebuilt' }
