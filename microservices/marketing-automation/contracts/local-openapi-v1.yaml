openapi: 3.2.0
info:
  title: Marketing Automation Local Operational API
  version: 1.0.0
  summary: Local operational contract for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
  x-binding-adrs: [ADR-0130, ADR-0131, ADR-0139]
servers:
  - url: https://api.oyatie.com/marketing-automation/v1
    description: Tenant-scoped production API with HTTP/3 default and strict TLS 1.3.
paths:
  /marketing-automation/v1/campaign-journeys/{resource_id}/policy-check:
    post:
      operationId: checkMarketingAutomationLocalPolicy
      summary: Evaluate Marketing Automation local policy for campaign, journey, segment operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalPolicyCheckRequest'
      responses:
        '200':
          description: Policy decision with audit event binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalPolicyDecision'
  /marketing-automation/v1/campaign-journeys/{resource_id}/slo-state:
    get:
      operationId: getMarketingAutomationLocalSloState
      summary: Read Marketing Automation domain SLO burn state including send-latency.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
        - name: slo_name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Current SLO state for the local domain suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalSloState'
  /marketing-automation/v1/campaign-journeys/{resource_id}/operator-remediation:
    post:
      operationId: invokeMarketingAutomationOperatorRemediation
      summary: Start an audited remediation workflow for campaign orchestration, journey execution, segment membership, suppression, and deliverability operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRemediationRequest'
      responses:
        '202':
          description: Remediation workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAccepted'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LocalPolicyCheckRequest:
      type: object
      required: [tenant_id, principal_id, requested_action, data_class, purpose, audit_event_class]
      properties:
        tenant_id: { type: string, minLength: 4 }
        principal_id: { type: string, minLength: 4 }
        requested_action: { type: string, enum: ['campaign.segment.read', 'campaign.segment.write', 'campaign.journey.launch', 'campaign.send.approve', 'campaign.suppression.enforce', 'campaign.deliverability.inspect'] }
        data_class: { type: string, enum: ['campaign_profile', 'consent_signal', 'suppression_entry', 'attribution_event', 'segment_membership', 'deliverability_report'] }
        purpose: { type: string, enum: ['operate', 'support', 'security-review', 'regulated-audit'] }
        audit_event_class: { type: string, pattern: '^[A-Z][A-Za-z0-9]+$' }
    LocalPolicyDecision:
      type: object
      required: [decision, policy_file, audit_event_id]
      properties:
        decision: { type: string, enum: ['permit', 'forbid'] }
        policy_file: { type: string }
        audit_event_id: { type: string }
        denied_reason: { type: string }
    LocalSloState:
      type: object
      required: [service, slo_name, window, objective, current_value, burn_rate]
      properties:
        service: { type: string, const: 'marketing-automation' }
        slo_name: { type: string }
        window: { type: string }
        objective: { type: number }
        current_value: { type: number }
        burn_rate: { type: number }
    OperatorRemediationRequest:
      type: object
      required: [tenant_id, incident_key, runbook, mitigation]
      properties:
        tenant_id: { type: string }
        incident_key: { type: string }
        runbook: { type: string }
        mitigation: { type: string }
    RemediationAccepted:
      type: object
      required: [workflow_run_id, audit_event_id, expected_operator_update_at]
      properties:
        workflow_run_id: { type: string }
        audit_event_id: { type: string }
        expected_operator_update_at: { type: string, format: date-time }
