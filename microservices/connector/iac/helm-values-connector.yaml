# Helm values — connector microservice
# Binding ADR: ADR-0254 (K8s + Cloud Hypervisor deployment shape)
# Covers: connector-catalog-rest, oauth-broker-rest, webhook-receiver-edge,
#         connector-adapter-worker, dlq-replay-worker, schema-drift-monitor

global:
  namespace: connector
  imageRegistry: registry.oyatie.internal/connect
  imagePullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

connectorCatalogRest:
  enabled: true
  replicaCount: 3
  image:
    repository: oya-connector-catalog-rest
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8080
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5

oauthBrokerRest:
  enabled: true
  replicaCount: 3
  image:
    repository: oya-connector-oauth-broker-rest
    tag: "0.1.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 65
  env:
    - name: OPENBAO_ADDR
      value: "https://openbao.cloud-secrets.svc.cluster.local:8200"
    - name: POLICY_EVAL_MODE
      value: library-first

webhookReceiverEdge:
  enabled: true
  replicaCount: 5
  image:
    repository: oya-connector-webhook-receiver-edge
    tag: "0.1.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 60
  env:
    - name: REPLAY_WINDOW_SECONDS
      value: "300"
    - name: HMAC_VERIFY_CONSTANT_TIME
      value: "true"

connectorAdapterWorker:
  enabled: true
  replicaCount: 5
  runtimeClass: kata-qemu  # Cloud Hypervisor + Kata per ADR-0254
  image:
    repository: oya-connector-adapter-worker
    tag: "0.1.0"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
  env:
    - name: CREDENTIAL_SIDECAR_MODE
      value: "sidecar"
    - name: ACCESS_TOKEN_TTL_SECONDS
      value: "60"
    - name: CIRCUIT_BREAKER_THRESHOLD
      value: "0.5"
    - name: CIRCUIT_BREAKER_WINDOW_SECONDS
      value: "300"

dlqReplayWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: oya-connector-dlq-replay-worker
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

schemaDriftMonitor:
  enabled: true
  replicaCount: 1
  image:
    repository: oya-connector-schema-drift-monitor
    tag: "0.1.0"
  schedule: "0 */6 * * *"  # Every 6 hours
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

serviceMonitor:
  enabled: true
  namespace: observability
  interval: 30s
  path: /metrics
  port: metrics

podDisruptionBudget:
  enabled: true
  minAvailable: 2
