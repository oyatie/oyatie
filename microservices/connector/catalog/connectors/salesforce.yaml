name: salesforce
display_name: Salesforce
category: crm
publisher_namespace: oyatie
version: "3.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create, read, update, and delete Salesforce records (Leads, Contacts,
  Opportunities, Accounts) and receive real-time change events via Salesforce
  Platform Events and Streaming API.
  Hyperscaler precedent: Salesforce AppExchange; Workato Salesforce connector.

auth:
  flows: [oauth2_pkce, jwt_bearer]
  token_rotation: true
  vendor_access_token_ttl_seconds: 7200

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  relay: salesforce_platform_events
  replay_window_seconds: 300
  events: [LeadChangeEvent, OpportunityChangeEvent, ContactChangeEvent, AccountChangeEvent]

rate_limit:
  tier: enterprise
  api_daily_limit_per_org: 1000000
  requests_per_second: 100
  burst: 200

actions:
  - name: createLead
    description: Create a new Lead record
    data_classes: [PII_EMAIL, PII_PHONE, CRM_RECORD]
  - name: updateOpportunity
    description: Update an existing Opportunity
    data_classes: [CRM_RECORD, FINANCIAL_PIPELINE]
  - name: queryRecords
    description: SOQL query for arbitrary records
    data_classes: [CRM_RECORD]
  - name: upsertContact
    description: Upsert a Contact record by external ID
    data_classes: [PII_EMAIL, PII_PHONE, CRM_RECORD]
  - name: createCase
    description: Create a new Case (support ticket)
    data_classes: [CRM_RECORD]

compliance:
  pii_fields: [Lead.Email, Lead.Phone, Contact.Email, Contact.Phone, Contact.MailingAddress]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: bcr

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
