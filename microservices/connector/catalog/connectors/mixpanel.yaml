name: mixpanel
display_name: Mixpanel
category: analytics
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Track events, manage user profiles, and query analytics via Mixpanel
  Ingestion API and Query API. No webhook support; export API for batch pulls.
  Hyperscaler precedent: Mixpanel (used by 8,000+ companies for product analytics).

auth:
  flows: [api_key_byok, service_account_byok]
  token_rotation: false

webhook:
  supported: false

rate_limit:
  tier: standard
  events_per_second: 500
  burst: 1000

actions:
  - name: trackEvent
    description: Track an event for a distinct_id
    data_classes: [BEHAVIORAL_ANALYTICS, PII_ADJACENT]
  - name: setPeopleProperties
    description: Set or update user profile properties
    data_classes: [PII_EMAIL, BEHAVIORAL_ANALYTICS]
  - name: queryJqlReport
    description: Execute a JQL analytics query
    data_classes: [BEHAVIORAL_ANALYTICS]

compliance:
  pii_fields: [distinct_id, people.$email, people.$phone]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc
  behavioral_analytics_consent_required: true

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
