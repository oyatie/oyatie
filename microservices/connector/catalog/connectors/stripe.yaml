name: stripe
display_name: Stripe
category: payments
publisher_namespace: oyatie
version: "3.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create charges, manage customers, handle subscriptions, process refunds, and
  receive real-time payment events via Stripe API v1 and Stripe Webhooks.
  Hyperscaler precedent: Stripe (used by millions of platforms globally).

auth:
  flows: [api_key_byok, oauth2_stripe_connect]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: stripe-signature
  replay_window_seconds: 300
  events: [payment_intent.succeeded, charge.failed, customer.subscription.updated, invoice.payment_failed]

rate_limit:
  tier: high
  requests_per_minute: 100
  burst: 200
  retry_after_header: Retry-After

actions:
  - name: createPaymentIntent
    description: Create a Stripe PaymentIntent
    data_classes: [FINANCIAL_TRANSACTION, PCI_ADJACENT]
  - name: retrieveCustomer
    description: Retrieve a customer record
    data_classes: [PII_EMAIL, FINANCIAL_PROFILE]
  - name: createRefund
    description: Issue a full or partial refund
    data_classes: [FINANCIAL_TRANSACTION]
  - name: listInvoices
    description: List invoices for a customer
    data_classes: [FINANCIAL_TRANSACTION, PII_EMAIL]
  - name: createSubscription
    description: Create a subscription for a customer
    data_classes: [FINANCIAL_TRANSACTION]

compliance:
  pii_fields: [customer.email, customer.name, customer.address]
  pci_dss_scope: pass_through
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-kr, pack-eu, pack-us, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: false
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
