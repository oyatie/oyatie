name: bigquery
display_name: Google BigQuery
category: data-warehouse
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Execute SQL queries, load data via BigQuery Storage Write API, and manage
  datasets and tables via BigQuery REST API v2.
  No webhook support; polling-based triggers available.
  Hyperscaler precedent: Google BigQuery (used by 50,000+ orgs globally).

auth:
  flows: [oauth2_pkce, service_account_key_byok]
  token_rotation: true
  vendor_access_token_ttl_seconds: 3600

webhook:
  supported: false
  note: "BigQuery does not support outbound webhooks; use scheduled queries or Pub/Sub triggers."

rate_limit:
  tier: enterprise
  concurrent_interactive_queries: 300
  streaming_rows_per_second: 500000

actions:
  - name: runQuery
    description: Execute a BigQuery SQL query (synchronous or async job)
    data_classes: [TENANT_DATA_WAREHOUSE]
  - name: insertRows
    description: Stream rows into a BigQuery table via tabledata.insertAll
    data_classes: [TENANT_DATA_WAREHOUSE]
  - name: createDataset
    description: Create a new BigQuery dataset
    data_classes: [INTERNAL_ONLY]
  - name: listTables
    description: List tables in a dataset
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
