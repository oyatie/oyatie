name: trello
display_name: Trello (Atlassian)
category: project-management
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create and manage Trello cards, boards, and lists via Trello REST API v1.
  Receive real-time board events via Trello Webhooks.
  Hyperscaler precedent: Zapier Trello integration.

auth:
  flows: [oauth2_pkce, api_key_byok]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [createCard, updateCard, addMemberToCard, commentCard]

rate_limit:
  tier: standard
  requests_per_10s: 100
  burst: 300

actions:
  - name: createCard
    description: Create a card on a list
    data_classes: [INTERNAL_ONLY]
  - name: updateCard
    description: Update card title, description, or list
    data_classes: [INTERNAL_ONLY]
  - name: addComment
    description: Add a comment to a card
    data_classes: [INTERNAL_ONLY]
  - name: listCards
    description: List cards on a board
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [member.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
