openapi: 3.1.0
info:
  title: oyatie patient-monitoring API
  version: 1.0.0-wave-15m-f
  description: |
    REST surface for the patient-monitoring µservice. FHIR R5 Observation
    (vital-signs profile), Device, DeviceMetric, Encounter cross-ref; plus
    admin surfaces for central-station session management and unit-bed
    enumeration. Per ADR-MS-001 the realtime streaming surface is gRPC;
    this REST surface complements the streaming surface for read/query
    and administrative actions.
  contact:
    name: axis-clinical-realtime
    email: patient-monitoring-stewards@oyatie.com
  license:
    name: oyatie monorepo license
servers:
  - url: https://api.oyatie.example/patient-monitoring/v1
    description: oyatie-public-cloud
  - url: https://api.oyatie-on-prem.local/patient-monitoring/v1
    description: on-prem context
security:
  - oauth2:
      - patient-monitoring.read
      - patient-monitoring.write
paths:
  /fhir/r5/Observation:
    get:
      summary: Query vital-signs observations
      description: |
        FHIR R5 search on Observation resources scoped to vital-signs category.
        Subject scoping enforced via Cedar (nurse_assigned_to_bed_group or
        physician_attending principals only; RPM patients see own only).
      parameters:
        - name: subject
          in: query
          description: Patient reference (Patient/{id})
          schema:
            type: string
        - name: encounter
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            default: vital-signs
        - name: code
          in: query
          description: LOINC code for the vital (e.g., 8867-4 for HR)
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: _count
          in: query
          schema:
            type: integer
            default: 50
            maximum: 1000
      responses:
        '200':
          description: FHIR Bundle of Observations
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Write a vital-signs observation
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/FhirObservation'
      responses:
        '201':
          description: Observation created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirObservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fhir/r5/Observation/{id}:
    get:
      summary: Read a vital-signs observation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observation
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirObservation'
        '404':
          $ref: '#/components/responses/NotFound'
  /fhir/r5/Device:
    get:
      summary: Query monitoring devices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, entered-in-error]
        - name: manufacturer
          in: query
          schema:
            type: string
      responses:
        '200':
          description: FHIR Bundle of Devices
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
  /fhir/r5/Device/{id}:
    get:
      summary: Read device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirDevice'
  /fhir/r5/DeviceMetric:
    get:
      summary: Query device measurement-channels
      parameters:
        - name: device
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: FHIR Bundle of DeviceMetrics
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
  /fhir/r5/Encounter/{id}/$vital-signs-summary:
    get:
      summary: FHIR operation — vital-signs summary for an encounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: window-hours
          in: query
          schema:
            type: integer
            default: 24
            maximum: 168
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalSignsSummary'
  /api/v1/units:
    get:
      summary: List units in tenant
      responses:
        '200':
          description: Units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
  /api/v1/units/{unit_id}/beds:
    get:
      summary: List beds in a unit
      parameters:
        - name: unit_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Beds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bed'
  /api/v1/central-station/sessions:
    post:
      summary: Open a central-station session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CentralStationSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralStationSession'
  /api/v1/central-station/sessions/{session_id}:
    delete:
      summary: Close a central-station session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Closed
  /api/v1/alarms/{alarm_id}/acknowledge:
    post:
      summary: Acknowledge an alarm
      parameters:
        - name: alarm_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmAckRequest'
      responses:
        '200':
          description: Ack recorded
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/alarms/{alarm_id}/suppress:
    post:
      summary: Suppress an alarm (physician + Cedar authority required)
      parameters:
        - name: alarm_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmSuppressRequest'
      responses:
        '200':
          description: Suppression recorded
        '403':
          description: Cedar denied (not authorized, or justification missing, or duration > 4h)
  /api/v1/code-blue/activate:
    post:
      summary: Activate code-blue for a bed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeBlueActivationRequest'
      responses:
        '200':
          description: Activation recorded
  /api/v1/deterioration-scores:
    get:
      summary: Query deterioration scores for a bed/window
      parameters:
        - name: bed_id
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeteriorationScore'
  /api/v1/sepsis-scores:
    get:
      summary: Query sepsis scores for a bed/window
      parameters:
        - name: bed_id
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SepsisScore'
  /api/v1/rpm/enrollments:
    post:
      summary: Enroll a patient in an RPM program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpmEnrollmentRequest'
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpmEnrollment'
  /api/v1/rpm/patients/{patient_id}:
    get:
      summary: View a patient's RPM dashboard
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpmPatientDashboard'
  /api/v1/wearable/sessions:
    post:
      summary: Start a wearable integration session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WearableSessionRequest'
      responses:
        '201':
          description: Session created
  /api/v1/bundles/{bundle_kind}/observations:
    post:
      summary: Write an ICU bundle observation (HOB, DVT, SAT/SBT, glucose-control, ...)
      parameters:
        - name: bundle_kind
          in: path
          required: true
          schema:
            type: string
            enum: [hob, dvt, sat-sbt, glucose-control, sedation-interruption, cauti, clabsi, mobility]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleObservation'
      responses:
        '201':
          description: Observation recorded
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: patient-monitoring
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.oyatie.example/oauth2/token
          scopes:
            patient-monitoring.read: read
            patient-monitoring.write: write
  responses:
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Cedar denied
    NotFound:
      description: Not found
    BadRequest:
      description: Validation error
  schemas:
    FhirBundle:
      type: object
      properties:
        resourceType: { type: string, const: Bundle }
        type: { type: string }
        entry:
          type: array
          items:
            type: object
    FhirObservation:
      type: object
      properties:
        resourceType: { type: string, const: Observation }
        id: { type: string }
        status: { type: string, enum: [registered, preliminary, final, amended, corrected, cancelled, entered-in-error, unknown] }
        category:
          type: array
          items:
            type: object
        code:
          type: object
          description: LOINC code
        subject:
          type: object
        encounter:
          type: object
        effectiveDateTime: { type: string, format: date-time }
        valueQuantity:
          type: object
          properties:
            value: { type: number }
            unit: { type: string }
            system: { type: string }
            code: { type: string }
        device:
          type: object
        meta:
          type: object
    FhirDevice:
      type: object
      properties:
        resourceType: { type: string, const: Device }
        id: { type: string }
        manufacturer: { type: string }
        modelNumber: { type: string }
        serialNumber: { type: string }
        version:
          type: array
          items:
            type: object
        property:
          type: array
          items:
            type: object
        location:
          type: object
        status: { type: string }
    VitalSignsSummary:
      type: object
      properties:
        encounter_id: { type: string }
        window_hours: { type: integer }
        parameters:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              count: { type: integer }
              min: { type: number }
              max: { type: number }
              mean: { type: number }
              p50: { type: number }
              p95: { type: number }
    Unit:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [icu, ccu, picu, nicu, pacu, ed, telemetry, med-surg, rpm] }
        bed_count: { type: integer }
        cell_id: { type: string }
    Bed:
      type: object
      properties:
        id: { type: string }
        unit_id: { type: string }
        label: { type: string }
        status: { type: string, enum: [empty, occupied, cleaning, maintenance] }
        current_session_id: { type: string, nullable: true }
    CentralStationSessionRequest:
      type: object
      properties:
        unit_id: { type: string }
        bed_count: { type: integer, enum: [4, 8, 16, 32] }
        client_id: { type: string }
        client_render_target: { type: string, enum: [linux-sdl2-kiosk, windows-winui3, macos-apple-silicon, ios, android] }
    CentralStationSession:
      allOf:
        - $ref: '#/components/schemas/CentralStationSessionRequest'
        - type: object
          properties:
            id: { type: string }
            stream_endpoint: { type: string, description: gRPC stream URL }
            opened_at: { type: string, format: date-time }
    AlarmAckRequest:
      type: object
      properties:
        clinician_id: { type: string }
        device_id: { type: string }
        note: { type: string, nullable: true }
      required: [clinician_id, device_id]
    AlarmSuppressRequest:
      type: object
      properties:
        physician_id: { type: string }
        justification: { type: string, minLength: 16, maxLength: 1024 }
        duration_minutes: { type: integer, minimum: 1, maximum: 240 }
      required: [physician_id, justification, duration_minutes]
    CodeBlueActivationRequest:
      type: object
      properties:
        bed_id: { type: string }
        activator_id: { type: string }
        type: { type: string, enum: [code-blue, rapid-response, code-sepsis, code-stroke, code-trauma] }
        rationale: { type: string }
      required: [bed_id, activator_id, type]
    DeteriorationScore:
      type: object
      properties:
        bed_id: { type: string }
        t: { type: string, format: date-time }
        scoring_method: { type: string, enum: [news2, mews, pews, qsofa, sofa, apache-iv, saps-3, rothman-analog, epic-di-analog] }
        score: { type: number }
        components:
          type: object
          additionalProperties: { type: number }
        delta_from_prior: { type: number }
        threshold_breached: { type: string, nullable: true }
        lineage_id: { type: string }
    SepsisScore:
      type: object
      properties:
        bed_id: { type: string }
        t: { type: string, format: date-time }
        score: { type: number }
        qsofa: { type: integer }
        sofa: { type: integer }
        components:
          type: object
        lineage_id: { type: string }
    RpmEnrollmentRequest:
      type: object
      properties:
        patient_id: { type: string }
        program: { type: string, enum: [post-discharge-chf, post-discharge-copd, post-discharge-cabg, chronic-htn, chronic-diabetes, chronic-afib, high-risk-pregnancy, clinical-trial] }
        start: { type: string, format: date }
        planned_end: { type: string, format: date, nullable: true }
        consent_id: { type: string }
      required: [patient_id, program, start, consent_id]
    RpmEnrollment:
      allOf:
        - $ref: '#/components/schemas/RpmEnrollmentRequest'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [active, paused, completed, withdrawn] }
            adherence_score: { type: number, nullable: true }
    RpmPatientDashboard:
      type: object
      properties:
        patient_id: { type: string }
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/RpmEnrollment'
        latest_vitals:
          type: array
          items:
            $ref: '#/components/schemas/FhirObservation'
        escalation_score: { type: number, nullable: true }
        adherence_score: { type: number, nullable: true }
    WearableSessionRequest:
      type: object
      properties:
        patient_id: { type: string }
        wearable_class: { type: string, enum: [apple-healthkit, fitbit, garmin, withings, oura, dexcom-g7, abbott-libreview, polar, whoop, samsung-health, bluetooth-gatt] }
        device_identifier: { type: string }
        consent_id: { type: string }
      required: [patient_id, wearable_class, consent_id]
    BundleObservation:
      type: object
      properties:
        bed_id: { type: string }
        bundle_element: { type: string }
        status: { type: string, enum: [compliant, non-compliant, not-applicable, deferred-with-rationale] }
        observed_by: { type: string }
        rationale: { type: string, nullable: true }
      required: [bed_id, bundle_element, status, observed_by]
