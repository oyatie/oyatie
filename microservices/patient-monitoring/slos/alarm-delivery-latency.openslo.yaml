apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-alarm-delivery-latency
  displayName: "patient-monitoring: alarm fire → mobile-notification delivered p99 ≤ 3 s"
  labels:
    microservice: patient-monitoring
    bounded_context: alarm-management
    sli_class: latency
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Alarm fire → mobile-notification delivered p99 SLO. A "good" event is a
    notification confirmed delivered to clinician device within 3 s of alarm-fire.
    Critical for clinical-safety contract; routinely audited per HIPAA + 21 CFR.
  indicator:
    metadata:
      name: alarm-delivery-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_alarm_delivery_seconds_bucket{le="3.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_alarm_delivery_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 3 s for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
