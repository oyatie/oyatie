apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-patient-monitoring-waveform-jitter
  displayName: "patient-monitoring: waveform streaming jitter p99 ≤ 8 ms"
  labels:
    microservice: patient-monitoring
    bounded_context: waveform
    sli_class: latency-jitter
    tier: product
    plane: data
    owner_team: axis-clinical-realtime
    pack_scope: all
spec:
  service: patient-monitoring
  description: |
    Waveform jitter (variance between consecutive batches) p99 SLO ≤ 8 ms.
    A "good" inter-batch interval is one with |observed-expected| ≤ 8 ms.
    Critical for clinician waveform-display fidelity at central-station kiosks.
  indicator:
    metadata:
      name: waveform-jitter-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_waveform_jitter_seconds_bucket{le="0.008"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_patient_monitoring_waveform_jitter_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 8 ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
