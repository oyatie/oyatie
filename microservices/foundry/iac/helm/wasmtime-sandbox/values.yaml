# oya-wasmtime-sandbox — canonical WASM sandbox runtime helpers.
# ADR-0200. Every value here corresponds to a kernel invariant
# defined in `crates/oya-shared-wasm-runtime-kernel/src/lib.rs`.

image:
  repository: ghcr.io/oyatie/oya-wasmtime-sandbox
  # Pinned at wire time by parent (see evidence/parent-wiring-todo-build-batch.json).
  tag: ""
  pullPolicy: IfNotPresent

# Wasmtime LTS line floor. Live-source verification owed at
# parent-wiring time; this is a sentinel value, not a hard pin.
wasmtime:
  versionFloor: "30.0.0"
  componentModel: true
  wasiPreview: "preview2"

sandboxClasses:
  envoyFilter:
    fuelCeiling: 1000000
    memoryCeilingBytes: 16777216    # 16 MiB
    wallClockMs: 50
    importAllowlist:
      - "oya:envoy/header_get"
      - "oya:envoy/header_set"
      - "oya:envoy/body_read"
      - "oya:envoy/log"
  workflowStudioNode:
    fuelCeiling: 50000000
    memoryCeilingBytes: 134217728   # 128 MiB
    wallClockMs: 5000
    importAllowlist:
      - "oya:workflow/input_read"
      - "oya:workflow/output_write"
      - "oya:workflow/log"
  foundryTool:
    fuelCeiling: 500000000
    memoryCeilingBytes: 536870912   # 512 MiB
    wallClockMs: 60000
    importAllowlist:
      - "oya:foundry/argv_read"
      - "oya:foundry/stdout_write"
      - "oya:foundry/log"
      - "oya:foundry/capability_token_check"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# No ambient authority. Capability tokens flow through the kernel.
capabilityTokens:
  rotationSchedule: "annual"
  bao:
    secretMountPath: /run/secrets/oya/wasm-capability-tokens

serviceAccount:
  create: true
  name: oya-wasmtime-sandbox

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
