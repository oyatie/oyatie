apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wasmtime-sandbox
  labels:
    app.kubernetes.io/name: oya-wasmtime-sandbox
    app.kubernetes.io/instance: {{ .Release.Name }}
    oyatie.io/adr: "ADR-0200"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-wasmtime-sandbox
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-wasmtime-sandbox
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wasmtime-sandbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: OYA_WASM_RUNTIME_FLOOR
              value: {{ .Values.wasmtime.versionFloor | quote }}
            - name: OYA_WASM_COMPONENT_MODEL
              value: {{ .Values.wasmtime.componentModel | quote }}
            - name: OYA_WASM_WASI_PREVIEW
              value: {{ .Values.wasmtime.wasiPreview | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: capability-tokens
              mountPath: {{ .Values.capabilityTokens.bao.secretMountPath }}
              readOnly: true
      volumes:
        - name: capability-tokens
          emptyDir:
            medium: Memory
