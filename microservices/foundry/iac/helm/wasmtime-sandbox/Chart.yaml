apiVersion: v2
name: oya-wasmtime-sandbox
description: |
  ADR-0200 canonical WASM sandbox runtime helpers for the
  oyatie Foundry µservice. Bundles the Wasmtime-based
  sandbox-class enforcement adapter (envoy-filter,
  workflow-studio-node, foundry-tool) deployed as a sidecar
  to the Foundry runtime pool. No ambient authority. Every
  invocation carries a capability token per ADR-0200
  §"Security model".
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/oyatie/oyatie
sources:
  - https://github.com/bytecodealliance/wasmtime
maintainers:
  - name: oyatie-architecture-authority
    email: substrate@oyatie.local
keywords:
  - wasm
  - wasmtime
  - sandbox
  - adr-0200
annotations:
  oyatie.io/adr: ADR-0200
  oyatie.io/microservice: foundry
  oyatie.io/sandbox-classes: envoy-filter,workflow-studio-node,foundry-tool
