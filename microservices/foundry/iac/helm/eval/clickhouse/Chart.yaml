apiVersion: v2
name: clickhouse
description: |
  ClickHouse cluster for parity_analytics MergeTree storage in foundry-eval.
  3-shard × 3-replica + ZooKeeper coordination. Week-partitioned; sealed-partition
  read-only post-week. Per ADR-0024 + threat-model T-T-04 (HMAC per row) +
  T-I-01 (per-tenant partition + RBAC).
type: application
version: 1.0.0
appVersion: "24.3"
home: https://oyatie.com
maintainers:
