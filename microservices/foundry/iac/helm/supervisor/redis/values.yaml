redis-cluster:
  image:
    tag: "7.2.4-debian-12-r0"  # LTS pin
  cluster:
    nodes: 6  # 3 masters × 2 replicas
    replicas: 1  # each master has 1 replica
    init: true
    enabled: true
  auth:
    enabled: true
    existingSecret: "openbao://secret/foundry-supervisor/redis/auth-token"

  # ACL configuration (Valkey 8.1 (Redis wire-compat); per TI-R-01)
  acl:
    enabled: true
    sourceFiles:
      - users.acl
    files:
      users.acl: |
        # Default deny; explicit user grants below
        user default off

        # Supervisor pods: broad scope (supervisor IS the boundary)
        user supervisor on >$<OPENBAO_TOKEN_PLACEHOLDER>
          ~tenant:*:*
          ~oya-aggregate:*
          ~oya-self:*
          ~supervision-events:*
          +@all
          -DEBUG
          -CONFIG
          -FLUSHALL
          -FLUSHDB

        # Tenant-side: per-tenant scoped (used by tenants observing own kill-switch state)
        # Per-tenant tokens injected at OpenBao issuance time; this is the template.
        user tenant-template on resetkeys -@all
          +GET +XREAD
          ~tenant:<HASHED_ID>:*
          ~supervision-events:tenant:<HASHED_ID>:*

  # AOF every-second per TI-R-02
  configmap:
    config: |
      appendonly yes
      appendfsync everysec
      cluster-enabled yes
      cluster-node-timeout 5000
      cluster-require-full-coverage no  # tolerate partial outage
      maxmemory 4gb
      maxmemory-policy allkeys-lru
      # TLS
      tls-port 6379
      port 0  # disable non-TLS
      tls-cert-file /opt/valkey/valkey/certs/server.crt
      tls-key-file /opt/valkey/valkey/certs/server.key
      tls-ca-cert-file /opt/valkey/valkey/certs/ca.crt
      tls-auth-clients yes
      # ACL
      aclfile /opt/valkey/valkey/etc/users.acl

  # TLS via cert-manager
  tls:
    enabled: true
    certManager:
      enabled: true
      issuer: "foundry-supervisor-ca-issuer"

  persistence:
    enabled: true
    size: 30Gi
    storageClass: "oci-block-volume"

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 4Gi

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 2  # allow at most 2 pods (1 shard's worth) unavailable

# Streams config (separate ConfigMap for supervision-event-bus retention)
streams:
  retention: 7d  # MAXLEN-based retention in supervision-events stream
  consumerGroups:
    - name: foundry-evidence
      from: 0
    - name: observability-collector
      from: $
