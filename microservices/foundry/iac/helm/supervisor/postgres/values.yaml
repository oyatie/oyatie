postgresql-ha:
  global:
    postgresql:
      auth:
        existingSecret: "openbao://secret/foundry-supervisor/postgres/superuser-password"

  postgresql:
    image:
      tag: "16.2.0-debian-12-r0"  # LTS pin
    replicaCount: 2  # primary + replica (synchronous streaming)
    syncReplication: true  # zero-RPO
    primary:
      persistence:
        enabled: true
        size: 1Ti
        storageClass: "oci-block-volume-high-perf"
      extraEnvVars:
        - name: PG_REWIND_USER
          value: "rewind"
      pgHbaConfiguration: |
        # Only supervisor SA pods + Patroni cluster members may connect
        hostssl all all ::/0 cert
        host    replication rewind 0.0.0.0/0 scram-sha-256
      # Row-level security mandatory per TI-P-01
      postgresqlExtendedConf: |
        # Mandatory for tenant isolation per supervisor-isolation.md
        row_security = on
        # Audit logging per A.8.15
        shared_preload_libraries = 'pg_stat_statements,pgaudit'
        pgaudit.log = 'ddl, role, function, misc_set, write'
        # WAL archival for residency-pinned cold backup
        archive_mode = on
        archive_command = '/usr/local/bin/wal-g wal-push %p'
        wal_level = replica
        # Replication settings
        synchronous_commit = on
        synchronous_standby_names = '*'
        # Connection limits
        max_connections = 200  # bounded by PgBouncer pool

  pgpool:
    enabled: false  # we use pgbouncer separately (see below)

# PgBouncer connection pooler (separate deployment)
pgbouncer:
  enabled: true
  replicas: 2
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 100
  reservePoolSize: 20
  image:
    tag: "1.22.0"
  databaseSecret:
    existingSecret: "openbao://secret/foundry-supervisor/postgres/pgbouncer-credentials"

# WAL archival to S3-compatible bucket (per-pack residency)
walArchive:
  enabled: true
  s3Bucket: "${OCI_FOUNDRY_SUPERVISOR_WAL_BUCKET}"
  s3Endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
  sseKmsKeyId: "${OCI_KMS_KEY_ID}"
  credentialsSecretRef: "openbao://secret/foundry-supervisor/postgres/s3-credentials"
  retention: 24mo

# Patroni configuration for HA leader election + failover
patroni:
  enabled: true
  configmap: foundry-supervisor-patroni-config
  ttl: 30
  loopWait: 10
  retryTimeout: 10
  maximumLagOnFailover: 1048576  # 1MB max replica lag before failover refused

# Backup schedule
backups:
  schedule: "0 */4 * * *"  # every 4h base backup; continuous WAL stream
  retention:
    days: 90  # 90d hot backup; older via WAL archive
