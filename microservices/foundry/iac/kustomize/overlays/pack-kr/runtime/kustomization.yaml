# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas + KMS-in-KR.
# Per policy/data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1; no DR pair).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/capabilityExecutor/autoscaling/maxReplicas
        value: 50   # pack-kr M01 launch ceiling
    target:
      kind: HelmRelease
      name: foundry-runtime-pool
  - patch: |-
      - op: replace
        path: /spec/values/runtimePool/warmPods/baseline
        value: 4   # pack-kr smaller warm pool at M01 launch
    target:
      kind: HelmRelease
      name: foundry-runtime-pool
  - patch: |-
      - op: replace
        path: /spec/values/postgresql/primary/configuration
        value: |
          # KR-FSS sector retention ≥ 5y per policy/data-residency.md
          log_retention_days = 1825
          # KR-resident KMS for TDE
          kms_endpoint = https://kms.ap-seoul-1.oraclecloud.com
    target:
      kind: HelmRelease
      name: foundry-runtime-postgres

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - OCI_KMS_ENDPOINT=https://kms.ap-seoul-1.oraclecloud.com
      # Per data-residency.md: cross-pack replication forbidden by default
      - CROSS_PACK_REPLICATION_ALLOWED=false
      # KR-FSS sector: retention ≥ 5y
      - AUDIT_RETENTION_DAYS=1825
      # Pack-pinned data jurisdiction tag for every record
      - DATA_RESIDENCY_TAG=kr
