# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + thresholds + replicas.
# Per policy/data-residency.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/classifierModelServing/models/0/modelArtifactUri
        value: "s3://foundry-guardrails-kr-models/pii-phi/${MODEL_PII_PHI_VERSION}.onnx"
      - op: replace
        path: /spec/values/classifierModelServing/models/1/modelArtifactUri
        value: "s3://foundry-guardrails-kr-models/jailbreak/${MODEL_JAILBREAK_VERSION}.onnx"
      - op: replace
        path: /spec/values/classifierModelServing/models/2/modelArtifactUri
        value: "s3://foundry-guardrails-kr-models/content-safety/${MODEL_CONTENT_SAFETY_VERSION}.onnx"
      - op: replace
        path: /spec/values/classifierModelServing/models/3/modelArtifactUri
        value: "s3://foundry-guardrails-kr-models/ai-slop/${MODEL_AI_SLOP_VERSION}.onnx"
    target:
      kind: HelmRelease
      name: classifier-model-serving
  - patch: |-
      - op: replace
        path: /spec/values/cedarEngine/bundle/configMapName
        value: cedar-bundle-pack-kr
    target:
      kind: HelmRelease
      name: cedar-engine

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
  - name: cedar-bundle-pack-kr
    files:
      - ../../../policy/cedar-base.cedar
      - ../../../policy/tenant-scope.cedar
      - ../../../policy/ci-scope.cedar
      - ../../../policy/auditor-scope.cedar
      - ../../../policy/public-read.cedar
