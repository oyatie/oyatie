apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-milvus-search-latency
  displayName: "Foundry Milvus Hot-RAG Search Latency"
  labels:
    microservice: foundry
    substrate: milvus
    adr: "ADR-0192"
spec:
  service: foundry
  description: |
    99% of Milvus HNSW search requests on the hot RAG retrieval path
    complete within 30ms p99 over a rolling 30-day SLO window.
    Per ADR-0192 §"Index types — pinned per workload class".
  indicator:
    metadata:
      name: milvus-hnsw-search-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  milvus_proxy_req_latency_bucket{
                    operation="Search",index_type="HNSW",le="0.030"
                  }[5m]
                )) by (cell)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  milvus_proxy_req_latency_count{
                    operation="Search",index_type="HNSW"
                  }[5m]
                )) by (cell)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "HNSW p99 < 30ms"
      target: 0.99
  alertPolicies:
    - name: foundry-milvus-search-latency-burnrate-fastburn
      kind: AlertPolicy
      spec:
        description: "fast burn — 14.4x in 1h"
        conditions:
          - kind: AlertCondition
            metadata:
              name: fastburn
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 2m
