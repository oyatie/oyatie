apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-milvus-ingest-lag
  displayName: "Foundry Milvus Embedding Ingest Lag"
  labels:
    microservice: foundry
    substrate: milvus
    adr: "ADR-0192"
spec:
  service: foundry
  description: |
    99% of embeddings emitted via the canonical outbox CDC pipeline land
    in the Milvus collection within 60s p99. Per ADR-0192 §"Embedding
    pipeline integration".
  indicator:
    metadata:
      name: milvus-ingest-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  milvus_datacoord_insert_latency_bucket{le="60"}[5m]
                )) by (cell)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  milvus_datacoord_insert_latency_count[5m]
                )) by (cell)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "ingest lag p99 < 60s"
      target: 0.99
