asyncapi: 3.1.0
info:
  title: foundry-eval Eval Events
  version: 1.0.0
  description: |
    Workflow event topology for foundry-eval. Per ADR-0024 (eval harness) +
    ADR-0026 (in-house cutover gate) + ADR-0028 (audit-chain) + ADR-0131
    (per-microservice flat layout). All events Ed25519-signed; audit-chain
    seal carries Merkle proof.
  contact:
    name: axis-foundry
defaultContentType: application/json
servers:
  oya-workflow:
    host: workflow.{pack}.oyatie.com
    pathname: /events
    protocol: nats
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
channels:
  eval-run-started:
    address: oya.foundry-eval.eval-run.started
    messages:
      EvalRunStarted:
        $ref: '#/components/messages/EvalRunStarted'
  eval-run-completed:
    address: oya.foundry-eval.eval-run.completed
    messages:
      EvalRunCompleted:
        $ref: '#/components/messages/EvalRunCompleted'
  parity-verdict-emitted:
    address: oya.foundry-eval.parity.verdict-emitted
    messages:
      ParityVerdictEmitted:
        $ref: '#/components/messages/ParityVerdictEmitted'
  replay-divergence-detected:
    address: oya.foundry-eval.replay.divergence-detected
    messages:
      ReplayDivergenceDetected:
        $ref: '#/components/messages/ReplayDivergenceDetected'
  in-house-cutover-eligible:
    address: oya.foundry-eval.in-house.cutover-eligible
    messages:
      InHouseCutoverEligible:
        $ref: '#/components/messages/InHouseCutoverEligible'
  eval-subject-shred:
    address: oya.foundry-eval.dsr.subject-shred
    messages:
      EvalSubjectShred:
        $ref: '#/components/messages/EvalSubjectShred'
  capability-publish-requested:
    address: oya.foundry-runtime.capability.publish-requested
    messages:
      CapabilityPublishRequested:
        $ref: '#/components/messages/CapabilityPublishRequested'
  routing-preference-change-requested:
    address: oya.foundry-providers.routing.preference-change-requested
    messages:
      RoutingPreferenceChangeRequested:
        $ref: '#/components/messages/RoutingPreferenceChangeRequested'
  erase-subject-requested:
    address: oya.tenancy.dsr.erase-subject-requested
    messages:
      EraseSubjectRequested:
        $ref: '#/components/messages/EraseSubjectRequested'
operations:
  emit-eval-run-started:
    action: send
    channel:
      $ref: '#/channels/eval-run-started'
  emit-eval-run-completed:
    action: send
    channel:
      $ref: '#/channels/eval-run-completed'
  emit-parity-verdict:
    action: send
    channel:
      $ref: '#/channels/parity-verdict-emitted'
  emit-replay-divergence:
    action: send
    channel:
      $ref: '#/channels/replay-divergence-detected'
  emit-in-house-cutover-eligible:
    action: send
    channel:
      $ref: '#/channels/in-house-cutover-eligible'
  emit-eval-subject-shred:
    action: send
    channel:
      $ref: '#/channels/eval-subject-shred'
  consume-capability-publish-requested:
    action: receive
    channel:
      $ref: '#/channels/capability-publish-requested'
  consume-routing-preference-change-requested:
    action: receive
    channel:
      $ref: '#/channels/routing-preference-change-requested'
  consume-erase-subject-requested:
    action: receive
    channel:
      $ref: '#/channels/erase-subject-requested'
components:
  messages:
    EvalRunStarted:
      name: EvalRunStarted
      title: Eval run started
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, version, route, started_at, run_id, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          version:
            type: string
          route:
            $ref: '#/components/schemas/ProviderRoute'
          started_at:
            type: string
            format: date-time
          run_id:
            type: string
            format: uuid
          trigger:
            type: string
            enum: [publish-gate, nightly, ad-hoc, ab-routing, replay, model-upgrade]
          signature:
            type: string
    EvalRunCompleted:
      name: EvalRunCompleted
      title: Eval run completed
      contentType: application/json
      payload:
        type: object
        required: [event_id, run_id, capability_id, version, aggregate, passed, completed_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          run_id:
            type: string
            format: uuid
          capability_id:
            type: string
          version:
            type: string
          aggregate:
            $ref: '#/components/schemas/EvalAggregate'
          passed:
            type: boolean
          completed_at:
            type: string
            format: date-time
          eu_ai_act_section_15_accuracy_metric:
            type: number
          eu_ai_act_section_17_logging_payload_ref:
            type: string
          signature:
            type: string
    ParityVerdictEmitted:
      name: ParityVerdictEmitted
      title: Parity verdict emitted
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, route_a, route_b, verdict, cohort_deltas, emitted_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          route_a:
            $ref: '#/components/schemas/ProviderRoute'
          route_b:
            $ref: '#/components/schemas/ProviderRoute'
          verdict:
            type: string
            enum: [route_a_wins, route_b_wins, tie, indeterminate]
          cohort_deltas:
            type: object
            additionalProperties:
              type: object
              properties:
                cohort:
                  type: string
                margin:
                  type: number
          emitted_at:
            type: string
            format: date-time
          signature:
            type: string
    ReplayDivergenceDetected:
      name: ReplayDivergenceDetected
      title: Replay determinism divergence detected
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, sample_id, divergence_ms, seed, detected_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          sample_id:
            type: string
          divergence_ms:
            type: integer
          seed:
            type: integer
            format: int64
          detected_at:
            type: string
            format: date-time
          signature:
            type: string
    InHouseCutoverEligible:
      name: InHouseCutoverEligible
      title: In-house variant eligible for cutover (per ADR-0026)
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, incumbent_route, in_house_route, parity_evidence_ref, eligible_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          incumbent_route:
            $ref: '#/components/schemas/ProviderRoute'
          in_house_route:
            $ref: '#/components/schemas/ProviderRoute'
          parity_evidence_ref:
            type: string
            description: ParityReport id; verifiable against ParityVerdictEmitted
          eligible_at:
            type: string
            format: date-time
          signature:
            type: string
    EvalSubjectShred:
      name: EvalSubjectShred
      title: Per-subject DEK shredded (DSR cascade per ADR-0024 §"Resolved 1")
      contentType: application/json
      payload:
        type: object
        required: [event_id, tenant_id, subject_id, shred_count, shredded_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          tenant_id:
            type: string
          subject_id:
            type: string
          shred_count:
            type: integer
            description: number of per-subject DEKs deleted
          shredded_at:
            type: string
            format: date-time
          signature:
            type: string
    CapabilityPublishRequested:
      name: CapabilityPublishRequested
      title: Capability publish requested (from foundry-runtime)
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, version, requested_by, requested_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          version:
            type: string
          requested_by:
            type: string
          requested_at:
            type: string
            format: date-time
          signature:
            type: string
    RoutingPreferenceChangeRequested:
      name: RoutingPreferenceChangeRequested
      title: Router-preference change requested (from foundry-providers)
      contentType: application/json
      payload:
        type: object
        required: [event_id, capability_id, candidate_route, incumbent_route, requested_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          capability_id:
            type: string
          candidate_route:
            $ref: '#/components/schemas/ProviderRoute'
          incumbent_route:
            $ref: '#/components/schemas/ProviderRoute'
          requested_at:
            type: string
            format: date-time
          signature:
            type: string
    EraseSubjectRequested:
      name: EraseSubjectRequested
      title: Erase-subject DSR cascade (from tenancy)
      contentType: application/json
      payload:
        type: object
        required: [event_id, tenant_id, subject_id, requested_at, signature]
        properties:
          event_id:
            type: string
            format: uuid
          tenant_id:
            type: string
          subject_id:
            type: string
          requested_at:
            type: string
            format: date-time
          signature:
            type: string
  schemas:
    ProviderRoute:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
        variant:
          type: string
    EvalAggregate:
      type: object
      required: [pass_rate, total_cases, per_cohort]
      properties:
        pass_rate:
          type: number
        total_cases:
          type: integer
        per_cohort:
          type: object
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              pass_rate:
                type: number
              cases:
                type: integer
              p95_score:
                type: number
