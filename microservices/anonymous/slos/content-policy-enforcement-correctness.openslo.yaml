apiVersion: openslo/v1
kind: SLO
metadata:
  name: anonymous-content-policy-enforcement-correctness
  displayName: Content policy enforcement correctness — anonymous µservice
  labels:
    microservice: anonymous
    bc: content-moderation
    tier: shared-substrate
    owner_team: axis-anonymous + axis-foundry-runtime
spec:
  description: |
    Correctness of content policy enforcement:
      - every classifier verdict carries `ai_assessed_label` (EU AI Act Art. 50)
      - every auto-action (T2) carries `appeal_link` (EU DSA Art. 14)
      - every auto-action carries `statement_of_reasons` (EU DSA Art. 17)
      - every CSAM-suspect verdict triggers NCMEC CyberTipline within 48h (PRD FR-27)
      - every moderation hop seals to audit-chain per ADR-COMM-0001 inherited

    Target: 100%. Slippage = regulatory violation. Per ADR-ANON-0005 +
    EU AI Act + EU DSA + 18 USC §2258A.
  service: oya-anonymous-content-moderation-rest
  indicator:
    metadata:
      name: content-policy-enforcement-correctness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_anonymous_moderation_verdict_total{ai_assessed_label_present="true",appeal_link_present="true",statement_of_reasons_present="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_moderation_verdict_total[5m]))'
  objectives:
    - displayName: 100% of verdicts carry required transparency artifacts
      target: 1.0
  timeWindow:
    - duration: 28d
      isRolling: true
  alertPolicies:
    - alertPolicyRef: anonymous-content-policy-burnrate-sev1
