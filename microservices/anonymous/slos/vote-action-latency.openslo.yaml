apiVersion: openslo/v1
kind: SLO
metadata:
  name: anonymous-vote-action-latency
  displayName: Vote action latency — anonymous µservice
  labels:
    microservice: anonymous
    bc: upvote-downvote
    tier: shared-substrate
    owner_team: axis-anonymous
spec:
  description: |
    Vote action latency (cast / retract). Per PRD §"Performance" vote p99 ≤ 50ms.
    Blinded vote tokens verified inline; Redis dedupe; Postgres flush async.
  service: oya-anonymous-upvote-downvote-rest
  indicator:
    metadata:
      name: vote-action-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_vote_cast_latency_bucket{le="0.05"}[5m]))'
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_vote_cast_latency_count[5m]))'
  objectives:
    - displayName: 99% of vote-cast requests under 50ms over 28 days
      target: 0.99
  timeWindow:
    - duration: 28d
      isRolling: true
  alertPolicies:
    - alertPolicyRef: anonymous-vote-action-burnrate
