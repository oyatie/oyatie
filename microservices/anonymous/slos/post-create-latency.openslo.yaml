# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: anonymous-post-create-latency
  displayName: Post create latency — anonymous µservice
  labels:
    microservice: anonymous
    bc: post-thread
    tier: shared-substrate
    owner_team: axis-anonymous
spec:
  description: |
    Post-create latency including BBS+ proof verification + Postgres insert +
    audit-chain seal. Per PRD §"Performance" post-create p95 ≤ 100ms.
  service: oya-anonymous-post-thread-rest
  indicator:
    metadata:
      name: post-create-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_post_create_latency_bucket{le="0.1"}[5m]))'
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_post_create_latency_count[5m]))'
  objectives:
    - displayName: 95% of post-create requests under 100ms over 28 days
      target: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  alertPolicies:
    - alertPolicyRef: anonymous-post-create-burnrate
