# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: anonymous-feed-render-latency
  displayName: Feed render latency — anonymous µservice
  labels:
    microservice: anonymous
    bc: feed-timeline
    tier: shared-substrate
    owner_team: axis-anonymous
spec:
  description: |
    Feed-render latency for affinity-scoped chronological / Wilson-ranked feed
    queries. Per PRD §"Performance" feed-render target p95 ≤ 250ms.
    Per ADR-0139, this SLO is mandatory before promotion past dev.
  service: oya-anonymous-feed-timeline-rest
  indicator:
    metadata:
      name: feed-render-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_feed_render_latency_bucket{le="0.25"}[5m]))'
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_feed_render_latency_count[5m]))'
  objectives:
    - displayName: 95% of feed-render requests under 250ms over 28 days
      target: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  alertPolicies:
    - alertPolicyRef: anonymous-feed-render-burnrate
