# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: anonymous-abuse-classifier-latency
  displayName: Abuse classifier latency — anonymous µservice
  labels:
    microservice: anonymous
    bc: content-moderation
    tier: shared-substrate
    owner_team: axis-anonymous + axis-foundry-runtime
spec:
  description: |
    Abuse-classifier inference latency via foundry-runtime T1. Per PRD
    §"Performance" classifier p95 ≤ 200ms.
  service: oya-anonymous-content-moderation-worker
  indicator:
    metadata:
      name: abuse-classifier-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_abuse_classifier_latency_bucket{le="0.2"}[5m]))'
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(oya_anonymous_abuse_classifier_latency_count[5m]))'
  objectives:
    - displayName: 95% of classifier inference under 200ms over 28 days
      target: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  alertPolicies:
    - alertPolicyRef: anonymous-abuse-classifier-burnrate
