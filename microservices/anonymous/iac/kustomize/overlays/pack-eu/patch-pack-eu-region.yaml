# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anonymous-oya-anonymous
spec:
  template:
    spec:
      nodeSelector:
        topology.kubernetes.io/region: eu-central-1
      containers:
        - name: oya-anonymous
          env:
            - name: OYA_REGULATORY_PACK
              value: "eu"
            - name: OYA_REGION
              value: "eu-central-1"
            - name: OYA_DR_REGION
              value: "eu-west-1"
            - name: OYA_DATA_RESIDENCY_STRICT
              value: "true"
            - name: OYA_LEGAL_PROCESS_FRAMEWORK
              value: "eu-dsa-art-27,eu-mlat"
            - name: OYA_DSA_COMPLAINT_MECHANISM_ENABLED
              value: "true"
            - name: OYA_DSA_STATEMENT_OF_REASONS_TEMPLATE
              value: "annex-i"
            - name: OYA_TRANSPARENCY_REPORT_CADENCE
              value: "quarterly"
            - name: OYA_RETENTION_DEFAULT_TIER
              value: "30d"
            - name: OYA_RETENTION_MAX_ALLOWED_TIER
              value: "60d"
            - name: OYA_EU_AI_ACT_ART_50_LABEL_REQUIRED
              value: "true"
