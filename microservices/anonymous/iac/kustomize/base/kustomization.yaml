apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the anonymous µservice; pack-specific overlays under
# overlays/pack-{kr,eu,...}.
# Per ADR-0131 per-microservice flat layout + ADR-0117 tenant jurisdiction.

namespace: anonymous

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - cedar-policies-configmap.yaml

helmCharts:
  - name: oya-anonymous
    valuesFile: ../../helm/values.yaml
    releaseName: anonymous
    namespace: anonymous

commonLabels:
  app.kubernetes.io/part-of: oya-anonymous
  oyatie/microservice: anonymous
