apiVersion: v1
kind: Service
metadata:
  name: {{ include "oya-anonymous.fullname" . }}
  labels:
    {{- include "oya-anonymous.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 9000
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "oya-anonymous.selectorLabels" . | nindent 4 }}
