{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oya-anonymous.fullname" . }}
  labels:
    {{- include "oya-anonymous.labels" . | nindent 4 }}
    release: prometheus-stack
spec:
  groups:
    - name: anonymous.invariants
      interval: 30s
      rules:
        - alert: AnonymityLeakDetected
          expr: sum(rate(oya_anonymous_correlation_attempt_total[5m])) > 0
          for: 1m
          labels:
            severity: sev-0
            invariant: I1
          annotations:
            summary: "Anonymity leak — I1 invariant violated"
            runbook: "https://oyatie.dev/microservices/anonymous/runbooks/anonymity-leak-incident-response.md"
        - alert: HardDeletePropagationSLOBreach
          expr: |
            (sum(rate(oya_anonymous_hard_delete_propagation_success_total[5m]))
             / sum(rate(oya_anonymous_hard_delete_propagation_total[5m]))) < 1.0
          for: 5m
          labels:
            severity: sev-1
            invariant: I3
          annotations:
            summary: "Hard-delete propagation correctness below 100%"
            runbook: "https://oyatie.dev/microservices/anonymous/runbooks/hard-delete-tombstone-corruption.md"
        - alert: LegalProcessChainOfCustodyBreach
          expr: |
            (sum(rate(oya_anonymous_legal_process_disclosure_chain_of_custody_verified_total[1h]))
             / sum(rate(oya_anonymous_legal_process_disclosure_executed_total[1h]))) < 1.0
          for: 5m
          labels:
            severity: sev-0
            invariant: I7
          annotations:
            summary: "Legal-process chain-of-custody integrity breach"
            runbook: "https://oyatie.dev/microservices/anonymous/runbooks/legal-process-court-order-receipt.md"
        - alert: AiAssessedLabelMissing
          expr: |
            sum(rate(oya_anonymous_moderation_verdict_total{ai_assessed_label_present="false"}[5m])) > 0
          for: 1m
          labels:
            severity: sev-1
            regulatory: "EU AI Act Art. 50"
          annotations:
            summary: "EU AI Act Art. 50 transparency label missing on classifier verdict"
            runbook: "https://oyatie.dev/microservices/anonymous/runbooks/abuse-classifier-rollback.md"
        - alert: FeedRenderLatencyBurnRate
          expr: |
            histogram_quantile(0.95, sum by (le)(rate(oya_anonymous_feed_render_latency_bucket[5m]))) > 0.25
          for: 10m
          labels:
            severity: sev-2
          annotations:
            summary: "Feed render p95 > 250ms"
        - alert: ThirdPartyTrackerEgressDetected
          expr: |
            sum(rate(oya_anonymous_third_party_tracker_egress_attempts_total[5m])) > 0
          for: 1m
          labels:
            severity: sev-1
            invariant: I4
          annotations:
            summary: "Third-party tracker egress attempt detected — I4 invariant violated"
{{- end }}

    - name: anonymous-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: anonymous-llm-capability-circuit-open
          expr: max(oya_anonymous_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: anonymous
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "anonymous LLM/capability circuit-breaker tripped open"
        - alert: anonymous-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_anonymous_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: anonymous
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "anonymous capability retry-budget exhausted"

    - name: anonymous-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: anonymous-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_anonymous_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: anonymous
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "anonymous tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: anonymous-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: anonymous-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"anonymous-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: anonymous
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "anonymous pod CPU saturation > 70% sustained 10m"
        - alert: anonymous-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_anonymous_responses_5xx_total[5m]))
            /
            sum(rate(oya_anonymous_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: anonymous
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "anonymous 5xx rate > 1% sustained 5m"
        - alert: anonymous-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_anonymous_responses_total[5m]))
              /
              sum(rate(oya_anonymous_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: anonymous
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "anonymous inbound RPS dropped > 90% vs prior hour"

    - name: anonymous-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: anonymous-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_anonymous_request_success_total[1h]))
              /
              sum(rate(oya_anonymous_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: anonymous
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "anonymous aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: anonymous-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_anonymous_request_success_total[6h]))
              /
              sum(rate(oya_anonymous_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: anonymous
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "anonymous aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
