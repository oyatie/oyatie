apiVersion: v2
name: oya-anonymous
description: Helm chart for the anonymous µservice — privacy-pseudonymous affinity-bound posting substrate
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - anonymous
  - pseudonymous
  - affinity-bound
  - privacy
  - oyatie
home: https://oyatie.dev/microservices/anonymous
