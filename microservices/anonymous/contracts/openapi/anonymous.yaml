openapi: 3.2.0
info:
  title: oya-anonymous
  version: 1.0.0
  summary: REST API for the anonymous µservice — affinity-bound pseudonymous posting
  description: |
    Tenant-facing REST surface for the anonymous µservice. All endpoints
    require an authenticated blinded credential (per ADR-ANON-0001) and a
    verified affinity attestation (per ADR-ANON-0002). The platform never
    learns the user's identity; all writes are bound to a blinded commitment.

    Cross-cutting authentication: Authorization header carries a per-session
    BBS+ proof-of-credential (NOT a bearer JWT). The platform verifies the
    proof at every request boundary.

    Privacy invariants:
    - I1: no endpoint returns a `user_id` field. Every author identifier is
          a `blinded_commitment` (opaque bytes).
    - I2: affinity attestation reveals affinity only.
    - I3: 30-day default retention.
    - I7: legal-process disclosure is the ONLY endpoint that correlates.
  contact:
    name: axis-anonymous
    url: https://oyatie.dev/teams/axis-anonymous
  license:
    name: Internal
servers:
  - url: https://anonymous-{pack}.oyatie.dev/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, uk, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  securitySchemes:
    BBSPlusProof:
      type: apiKey
      in: header
      name: X-BBS-Plus-Proof
      description: |
        Per-session BBS+ proof-of-credential. The platform verifies the
        proof against the registered affinity-issuer public keys. NEVER
        a bearer JWT (would defeat I1).
  parameters:
    XScopeTenantID:
      in: header
      name: X-Scope-Tenant-ID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    AffinityClusterID:
      in: header
      name: X-Affinity-Cluster-ID
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
  schemas:
    Post:
      type: object
      required: [post_id, blinded_commitment, body, posted_at, affinity_cluster_id]
      properties:
        post_id:
          type: string
          description: opaque post identifier
        blinded_commitment:
          type: string
          description: |
            BBS+ commitment representing the post author. NOT correlatable
            to a user_id by design (I1).
        body:
          type: string
          maxLength: 4096
          description: post body (text-only; max 4096 chars per PRD)
        posted_at:
          type: string
          format: date-time
        affinity_cluster_id:
          type: string
        hashtags:
          type: array
          items:
            type: string
            pattern: '^#[a-zA-Z0-9_-]+$'
            maxLength: 50
        retention_tier:
          type: string
          enum: [30d, 60d, 90d]
        vote_count:
          type: integer
          minimum: 0
        comment_count:
          type: integer
          minimum: 0
    Comment:
      type: object
      required: [comment_id, post_id, blinded_commitment, body, posted_at]
      properties:
        comment_id:
          type: string
        post_id:
          type: string
        parent_comment_id:
          type: string
          nullable: true
        blinded_commitment:
          type: string
        body:
          type: string
          maxLength: 2048
        posted_at:
          type: string
          format: date-time
        depth:
          type: integer
          minimum: 0
          maximum: 6
          description: thread depth; cap 6 per ADR-COMM-0005 inherited
    Vote:
      type: object
      required: [vote_id, target_id, kind]
      properties:
        vote_id:
          type: string
        target_id:
          type: string
          description: post_id or comment_id
        target_kind:
          type: string
          enum: [post, comment]
        kind:
          type: string
          enum: [upvote, downvote, retract]
        voted_at:
          type: string
          format: date-time
    AffinityAttestationBinding:
      type: object
      required: [binding_id, blinded_commitment, affinity_cluster_id, expires_at]
      properties:
        binding_id:
          type: string
        blinded_commitment:
          type: string
        affinity_cluster_id:
          type: string
        established_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Feed:
      type: object
      required: [posts, next_cursor]
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        next_cursor:
          type: string
          nullable: true
    AbuseReport:
      type: object
      required: [report_id, target_id, reason]
      properties:
        report_id:
          type: string
        target_id:
          type: string
        target_kind:
          type: string
          enum: [post, comment, dm]
        reason:
          type: string
          enum: [harassment, hate_speech, csam_suspect, spam, impersonation, threat, doxxing, other]
        free_text:
          type: string
          maxLength: 1024
    ModerationVerdict:
      type: object
      required: [verdict_id, target_id, verdict, ai_assessed_label]
      properties:
        verdict_id:
          type: string
        target_id:
          type: string
        verdict:
          type: string
          enum: [hide, lock, pin, quarantine, revoke_affinity, dismiss]
        reason:
          type: string
        ai_assessed_label:
          type: string
          description: |
            EU AI Act Art. 50 transparency label per ADR-ANON-0005. Always
            present on classifier-issued verdicts. "AI-assessed" or
            "human-moderator".
        issued_at:
          type: string
          format: date-time
    Tombstone:
      type: object
      required: [tombstone_id, target_id, deleted_at]
      properties:
        tombstone_id:
          type: string
        target_id:
          type: string
        target_kind:
          type: string
          enum: [post, comment]
        deleted_at:
          type: string
          format: date-time
        deletion_reason:
          type: string
          enum: [author_request, retention_expired, moderation_action, legal_process]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

security:
  - BBSPlusProof: []

paths:
  /v1/affinity-attestations:verify:
    post:
      operationId: verifyAffinityAttestation
      summary: Verify a BBS+ affinity attestation and issue a binding
      parameters:
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [issuer_key_id, credential_format, selective_disclosure_proof, revealed_attributes]
              properties:
                issuer_key_id:
                  type: string
                credential_format:
                  type: string
                  enum: [bbs-plus-vc-2.0]
                selective_disclosure_proof:
                  type: string
                  format: byte
                revealed_attributes:
                  type: object
      responses:
        '200':
          description: Attestation verified; binding issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffinityAttestationBinding'
        '400':
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/posts:
    post:
      operationId: publishPost
      summary: Publish a post bound to the caller's blinded credential
      parameters:
        - $ref: '#/components/parameters/XScopeTenantID'
        - $ref: '#/components/parameters/AffinityClusterID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4096
                hashtags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Post published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '403':
          description: Cedar policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listPosts
      summary: List posts in the caller's affinity feed
      parameters:
        - $ref: '#/components/parameters/XScopeTenantID'
        - $ref: '#/components/parameters/AffinityClusterID'
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: ranking
          schema:
            type: string
            enum: [chronological, wilson_lower_bound]
            default: chronological
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'

  /v1/posts/{post_id}:
    delete:
      operationId: hardDeletePost
      summary: Hard-delete own post (GDPR Art. 17; p99 ≤ 5s propagation)
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XScopeTenantID'
      responses:
        '202':
          description: Hard-delete initiated; tombstone returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tombstone'

  /v1/posts/{post_id}/comments:
    post:
      operationId: publishComment
      summary: Publish a comment / reply
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2048
                parent_comment_id:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Comment published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  /v1/posts/{post_id}/votes:
    post:
      operationId: castVote
      summary: Cast an idempotent upvote / downvote / retract
      parameters:
        - in: path
          name: post_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [upvote, downvote, retract]
      responses:
        '200':
          description: Vote cast (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vote'

  /v1/reports:
    post:
      operationId: fileAbuseReport
      summary: File an abuse report
      parameters:
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbuseReport'
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbuseReport'

  /v1/moderation-verdicts/{verdict_id}/appeals:
    post:
      operationId: openAppeal
      summary: Appeal a moderation verdict (EU DSA Art. 14)
      parameters:
        - in: path
          name: verdict_id
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [appeal_reason]
              properties:
                appeal_reason:
                  type: string
                  maxLength: 2048
      responses:
        '201':
          description: Appeal opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  appeal_id:
                    type: string

  /v1/legal-process/orders:
    post:
      operationId: recordLegalProcessOrder
      summary: Record a court order (legal-process intake; Cedar-gated)
      parameters:
        - $ref: '#/components/parameters/XScopeTenantID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [court_order_doctype, court_authority, order_reference]
              properties:
                court_order_doctype:
                  type: string
                  enum: [subpoena, warrant, court_order, preservation_request, ncmec_cybertipline_request, ipa_2016_targeted_interception_warrant, ipa_2016_targeted_equipment_interference_warrant, kr_telecom_secrecy_act_warrant, jp_telecom_secrecy_court_order]
                court_authority:
                  type: string
                order_reference:
                  type: string
                jurisdiction:
                  type: string
      responses:
        '202':
          description: Order recorded; awaiting dual-control approval

  /v1/transparency-report:
    get:
      operationId: getTransparencyReport
      summary: Quarterly transparency report (public, aggregate-only)
      security: []  # public-read.cedar permits
      parameters:
        - in: query
          name: quarter
          schema:
            type: string
            pattern: '^[0-9]{4}Q[1-4]$'
      responses:
        '200':
          description: Transparency report
          content:
            application/json:
              schema:
                type: object
                properties:
                  quarter:
                    type: string
                  total_orders_received:
                    type: integer
                  orders_by_doctype:
                    type: object
                    additionalProperties:
                      type: integer
                  orders_by_jurisdiction:
                    type: object
                    additionalProperties:
                      type: integer
                  gag_orders:
                    type: integer
