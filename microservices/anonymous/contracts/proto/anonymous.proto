// anonymous µservice — gRPC contract (proto3)
// Privacy invariants:
//   I1: no message field is `user_id`; every author identifier is `blinded_commitment` (bytes)
//   I2: AffinityAttestation reveals only affinity, never identity
//   I7: only the legal-process gRPC service can correlate
//
// owner: axis-anonymous

syntax = "proto3";

package oya.anonymous.v1;

option go_package = "github.com/oyatie/oya-anonymous/v1";
option java_package = "dev.oyatie.anonymous.v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =====================================================================
// Messages
// =====================================================================

message Post {
  string post_id = 1;
  bytes blinded_commitment = 2;  // NEVER user_id (I1)
  string body = 3;               // max 4096 chars
  google.protobuf.Timestamp posted_at = 4;
  string affinity_cluster_id = 5;
  repeated string hashtags = 6;
  RetentionTier retention_tier = 7;
  uint32 vote_count = 8;
  uint32 comment_count = 9;
}

enum RetentionTier {
  RETENTION_TIER_UNSPECIFIED = 0;
  RETENTION_TIER_30D = 1;
  RETENTION_TIER_60D = 2;
  RETENTION_TIER_90D = 3;
}

message Comment {
  string comment_id = 1;
  string post_id = 2;
  string parent_comment_id = 3;
  bytes blinded_commitment = 4;
  string body = 5;
  google.protobuf.Timestamp posted_at = 6;
  uint32 depth = 7;  // max 6 per ADR-COMM-0005
}

message Vote {
  string vote_id = 1;
  string target_id = 2;
  TargetKind target_kind = 3;
  VoteKind kind = 4;
  google.protobuf.Timestamp voted_at = 5;
}

enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  TARGET_KIND_POST = 1;
  TARGET_KIND_COMMENT = 2;
}

enum VoteKind {
  VOTE_KIND_UNSPECIFIED = 0;
  VOTE_KIND_UPVOTE = 1;
  VOTE_KIND_DOWNVOTE = 2;
  VOTE_KIND_RETRACT = 3;
}

message AffinityAttestationBinding {
  string binding_id = 1;
  bytes blinded_commitment = 2;
  string affinity_cluster_id = 3;
  google.protobuf.Timestamp established_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // NOTE: NEVER carries identity attributes
}

message ModerationVerdict {
  string verdict_id = 1;
  string target_id = 2;
  VerdictKind verdict = 3;
  string reason = 4;
  string ai_assessed_label = 5;  // EU AI Act Art. 50 transparency
  string classifier_version = 6;
  google.protobuf.Timestamp issued_at = 7;
}

enum VerdictKind {
  VERDICT_KIND_UNSPECIFIED = 0;
  VERDICT_KIND_HIDE = 1;
  VERDICT_KIND_LOCK = 2;
  VERDICT_KIND_PIN = 3;
  VERDICT_KIND_QUARANTINE = 4;
  VERDICT_KIND_REVOKE_AFFINITY = 5;
  VERDICT_KIND_DISMISS = 6;
}

message Tombstone {
  string tombstone_id = 1;
  string target_id = 2;
  TargetKind target_kind = 3;
  google.protobuf.Timestamp deleted_at = 4;
  DeletionReason deletion_reason = 5;
}

enum DeletionReason {
  DELETION_REASON_UNSPECIFIED = 0;
  DELETION_REASON_AUTHOR_REQUEST = 1;
  DELETION_REASON_RETENTION_EXPIRED = 2;
  DELETION_REASON_MODERATION_ACTION = 3;
  DELETION_REASON_LEGAL_PROCESS = 4;
}

// =====================================================================
// Requests / Responses
// =====================================================================

message PublishPostRequest {
  string tenant_id = 1;
  string affinity_cluster_id = 2;
  bytes bbs_plus_proof = 3;  // proof-of-credential (NOT a JWT)
  string body = 4;
  repeated string hashtags = 5;
}

message PublishPostResponse {
  Post post = 1;
}

message HardDeletePostRequest {
  string tenant_id = 1;
  string post_id = 2;
  bytes bbs_plus_proof = 3;
}

message HardDeletePostResponse {
  Tombstone tombstone = 1;
}

message ListPostsRequest {
  string tenant_id = 1;
  string affinity_cluster_id = 2;
  bytes bbs_plus_proof = 3;
  string cursor = 4;
  uint32 limit = 5;
  Ranking ranking = 6;
}

enum Ranking {
  RANKING_UNSPECIFIED = 0;
  RANKING_CHRONOLOGICAL = 1;
  RANKING_WILSON_LOWER_BOUND = 2;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
}

message CastVoteRequest {
  string tenant_id = 1;
  string target_id = 2;
  TargetKind target_kind = 3;
  VoteKind kind = 4;
  bytes bbs_plus_proof = 5;
}

message CastVoteResponse {
  Vote vote = 1;
}

message VerifyAffinityAttestationRequest {
  string tenant_id = 1;
  string issuer_key_id = 2;
  bytes selective_disclosure_proof = 3;
  string affinity_kind = 4;
  string affinity_scope = 5;
  string affinity_cluster_id = 6;
}

message VerifyAffinityAttestationResponse {
  AffinityAttestationBinding binding = 1;
}

// =====================================================================
// Service definitions
// =====================================================================

service AnonymousPostService {
  rpc PublishPost(PublishPostRequest) returns (PublishPostResponse);
  rpc HardDeletePost(HardDeletePostRequest) returns (HardDeletePostResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
}

service AnonymousVoteService {
  rpc CastVote(CastVoteRequest) returns (CastVoteResponse);
}

service AffinityAttestationService {
  rpc VerifyAffinityAttestation(VerifyAffinityAttestationRequest) returns (VerifyAffinityAttestationResponse);
}

// =====================================================================
// Legal-process service — Cedar-gated; dual-control; audit-chain seal
// =====================================================================

message LegalProcessOrder {
  string order_id = 1;
  string doctype = 2;
  string jurisdiction = 3;
  google.protobuf.Timestamp recorded_at = 4;
  uint32 approval_count = 5;
  bool court_prohibited_gag = 6;
}

message RecordLegalProcessOrderRequest {
  bytes legal_process_intake_credential = 1;
  string doctype = 2;
  string court_authority = 3;
  string order_reference = 4;
  string jurisdiction = 5;
}

message SignDualControlApprovalRequest {
  string order_id = 1;
  bytes approver_credential = 2;
}

message ExecuteDisclosureRequest {
  string order_id = 1;
  bytes executor_credential = 2;
  string chain_of_custody_seed = 3;
}

message ExecuteDisclosureResponse {
  string disclosure_package_uri = 1;
  string chain_of_custody_hash = 2;
  google.protobuf.Timestamp executed_at = 3;
}

service LegalProcessDisclosureService {
  rpc RecordOrder(RecordLegalProcessOrderRequest) returns (LegalProcessOrder);
  rpc SignDualControlApproval(SignDualControlApprovalRequest) returns (LegalProcessOrder);
  rpc ExecuteDisclosure(ExecuteDisclosureRequest) returns (ExecuteDisclosureResponse);
}
