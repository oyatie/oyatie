name: oya-anonymous-post-thread-adapter-postgres
role: adapter
context: anonymous
plane: data
backend: postgres
lts_pin: "postgres-16.4"
slo: post-create-latency
contracts_consumed: [oya-anonymous-post-thread-kernel]
contracts_exposed: []
regulatory_packs_consumed: [oya-pack-kr, oya-pack-eu, oya-pack-us, oya-pack-us-healthcare, oya-pack-uk, oya-pack-jp, oya-pack-sg, oya-pack-au, oya-pack-in, oya-pack-br, oya-pack-ae, oya-pack-ksa]
lifecycle: {state: incubating, preview_since: 2026-05-17}
traceability:
  source_adrs: [ADR-0105, ADR-ANON-0001]
allowed_dependency_edges: [oya-anonymous-post-thread-kernel]
data_classes_owned: [BEHAVIORAL_USER_CONTENT, BEHAVIORAL_TENANT_PRODUCT]
operational_classes_owned: []
autonomy_tier_required: T1
schema_notes: |
  Table `posts` has columns: post_id (uuid), blinded_commitment (bytea),
  affinity_cluster_id (text), posted_at (timestamptz), body_ciphertext (bytea),
  retention_tier (enum), audit_chain_seal (bytea).
  NO user_id column — I1 invariant enforced by LEAN lane
  `oya-check-blinding-column-isolation`.
