# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the tenancy substrate, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier.
# Per Bominal ADR-0018 + ADR-0131 + multi-region.md DR posture.

namespace: tenancy

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - service-monitors.yaml

helmCharts:
  - name: oya-tenancy-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: postgres
    namespace: tenancy
  - name: oya-tenancy-citus
    valuesFile: ../../helm/citus/values.yaml
    releaseName: citus
    namespace: tenancy
  - name: oya-tenancy-patroni
    valuesFile: ../../helm/patroni/values.yaml
    releaseName: patroni
    namespace: tenancy

commonLabels:
  app.kubernetes.io/part-of: oya-tenancy
  oyatie/microservice: tenancy
