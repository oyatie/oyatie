apiVersion: oyatie.dev/v1
kind: HelmValues
metadata:
  name: contact-center-helm-values
  labels:
    service: contact-center
    binding_adr: ADR-0253-amendment
spec:
  service: contact-center
  tenantScoped: true
  audienceType: CONTACT_CENTER_AGENT
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/voice-routing-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Genesys Cloud", "Twilio Flex", "Zendesk Talk", "Five9"]
