apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: contact-center-local-ops
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: contact-center
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_contact_center_call_drop_rate_good_total
    - oya_contact_center_transfer_success_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-omnichannel-routing-scope.cedar
