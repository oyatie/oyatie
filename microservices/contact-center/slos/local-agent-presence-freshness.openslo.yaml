apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-agent-presence-freshness
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: contact-center
  description: Agent presence state freshness for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  indicator:
    metadata:
      name: agent-presence-freshness
      labels:
        domain_object: OmnichannelInteraction
        operator_audience: CONTACT_CENTER_SUPERVISOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_agent_presence_freshness_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_agent_presence_freshness_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Agent presence state freshness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
