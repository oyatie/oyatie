apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-call-drop-rate
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: contact-center
  description: Calls completed without unexpected drop for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  indicator:
    metadata:
      name: call-drop-rate
      labels:
        domain_object: OmnichannelInteraction
        operator_audience: CONTACT_CENTER_SUPERVISOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_call_drop_rate_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_call_drop_rate_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Calls completed without unexpected drop
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
