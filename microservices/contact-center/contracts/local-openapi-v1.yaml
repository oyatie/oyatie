openapi: 3.2.0
info:
  title: Contact Center Local Operational API
  version: 1.0.0
  summary: Local operational contract for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  x-binding-adrs: [ADR-0130, ADR-0131, ADR-0139]
servers:
  - url: https://api.oyatie.com/contact-center/v1
    description: Tenant-scoped production API with HTTP/3 default and strict TLS 1.3.
paths:
  /contact-center/v1/interactions/{resource_id}/policy-check:
    post:
      operationId: checkContactCenterLocalPolicy
      summary: Evaluate Contact Center local policy for omnichannel, routing, call operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalPolicyCheckRequest'
      responses:
        '200':
          description: Policy decision with audit event binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalPolicyDecision'
  /contact-center/v1/interactions/{resource_id}/slo-state:
    get:
      operationId: getContactCenterLocalSloState
      summary: Read Contact Center domain SLO burn state including call-drop-rate.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
        - name: slo_name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Current SLO state for the local domain suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalSloState'
  /contact-center/v1/interactions/{resource_id}/operator-remediation:
    post:
      operationId: invokeContactCenterOperatorRemediation
      summary: Start an audited remediation workflow for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRemediationRequest'
      responses:
        '202':
          description: Remediation workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAccepted'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LocalPolicyCheckRequest:
      type: object
      required: [tenant_id, principal_id, requested_action, data_class, purpose, audit_event_class]
      properties:
        tenant_id: { type: string, minLength: 4 }
        principal_id: { type: string, minLength: 4 }
        requested_action: { type: string, enum: ['omnichannel.route.assign', 'voice.call.transfer', 'callback.schedule', 'recording.access', 'queue.rebalance', 'emergency.bypass'] }
        data_class: { type: string, enum: ['conversation_record', 'call_recording', 'routing_state', 'transfer_event', 'agent_presence', 'callback_request'] }
        purpose: { type: string, enum: ['operate', 'support', 'security-review', 'regulated-audit'] }
        audit_event_class: { type: string, pattern: '^[A-Z][A-Za-z0-9]+$' }
    LocalPolicyDecision:
      type: object
      required: [decision, policy_file, audit_event_id]
      properties:
        decision: { type: string, enum: ['permit', 'forbid'] }
        policy_file: { type: string }
        audit_event_id: { type: string }
        denied_reason: { type: string }
    LocalSloState:
      type: object
      required: [service, slo_name, window, objective, current_value, burn_rate]
      properties:
        service: { type: string, const: 'contact-center' }
        slo_name: { type: string }
        window: { type: string }
        objective: { type: number }
        current_value: { type: number }
        burn_rate: { type: number }
    OperatorRemediationRequest:
      type: object
      required: [tenant_id, incident_key, runbook, mitigation]
      properties:
        tenant_id: { type: string }
        incident_key: { type: string }
        runbook: { type: string }
        mitigation: { type: string }
    RemediationAccepted:
      type: object
      required: [workflow_run_id, audit_event_id, expected_operator_update_at]
      properties:
        workflow_run_id: { type: string }
        audit_event_id: { type: string }
        expected_operator_update_at: { type: string, format: date-time }
