openapi: 3.2.0
info:
  title: Contact Center API
  version: 1.0.0
  summary: real-time voice routing, recording consent, and agent-state operations
  x-binding-adrs: [ADR-0105, ADR-0243, ADR-0244, ADR-0253-amendment, ADR-0258, ADR-0314, ADR-0321]
servers:
  - url: https://api.oyatie.example/contact-center/v1
    description: HTTP/3 default, HTTP/2 and HTTP/1.1 fallback, strict TLS 1.3, ECH, PQC hybrid where negotiated
paths:
  /contact-center/capabilities:
    get:
      operationId: listContactCenterCapabilities
      summary: List tenant-scoped Contact Center capabilities
      security: [{ tenantBearer: [] }]
      x-audience-type: CONTACT_CENTER_AGENT
      x-marketplace-settlement: DealSet
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
  /contact-center/actions/{action_id}:
    post:
      operationId: invokeContactCenterAction
      summary: Invoke a Cedar-gated Contact Center action
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: action_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CapabilityList:
      type: object
      required: [tenant_id, capabilities]
      properties:
        tenant_id: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: ['voice-route', 'recording-consent', 'agent-state-sync', 'queue-rebalance', 'callback-schedule', 'emergency-caller-bypass'] }
    ActionRequest:
      type: object
      required: [tenant_id, principal_id, purpose, data_class, deal_set_id]
      properties:
        tenant_id: { type: string }
        principal_id: { type: string }
        purpose: { type: string }
        data_class: { type: string, enum: ['call_session', 'agent_state', 'recording_consent', 'queue_metric'] }
        deal_set_id: { type: string }
    ActionAccepted:
      type: object
      required: [audit_event_class, workflow_run_id, ontology_object_ref]
      properties:
        audit_event_class: { type: string }
        workflow_run_id: { type: string }
        ontology_object_ref: { type: string }
