asyncapi: 2.6.0
info:
  title: Emergency Department Information System (ED-IS) Event Catalog
  version: 0.1.0
  description: |
    AsyncAPI catalog for the `ed.*` event prefix published by the
    `emergency` µservice. Every consumer must be idempotent on
    idempotency_key and must propagate the OpenTelemetry trace_id.
  contact:
    name: emergency-medicine-platform-engineer
defaultContentType: application/json
servers:
  nats-jetstream:
    url: nats://nats.internal.oyatie.cloud:4222
    protocol: nats
    description: NATS JetStream cluster (primary eventing substrate)
channels:
  ed.patient.registered:
    description: Patient registered in ED (quick-reg, pre-arrival, walk-in)
    publish:
      operationId: publishPatientRegistered
      message:
        $ref: '#/components/messages/PatientRegistered'
  ed.triage.completed:
    description: Triage encounter finalized
    publish:
      message: { $ref: '#/components/messages/TriageCompleted' }
  ed.triage.reassessed:
    description: Re-triage event
    publish:
      message: { $ref: '#/components/messages/TriageReassessed' }
  ed.protocol.activated:
    description: Clinical protocol activated (trauma/stroke/STEMI/sepsis/MTP/local)
    publish:
      message: { $ref: '#/components/messages/ProtocolActivated' }
  ed.protocol.deactivated:
    description: Protocol closed (false-alert or final closure)
    publish:
      message: { $ref: '#/components/messages/ProtocolDeactivated' }
  ed.protocol.window.breached:
    description: Bundle timer past regulatory window
    publish:
      message: { $ref: '#/components/messages/ProtocolWindowBreached' }
  ed.mci.activated:
    description: Mass-casualty incident mode active
    publish:
      message: { $ref: '#/components/messages/MciActivated' }
  ed.mci.deactivated:
    description: MCI mode closed
    publish:
      message: { $ref: '#/components/messages/MciDeactivated' }
  ed.ems.report.received:
    description: EMS prehospital report received
    publish:
      message: { $ref: '#/components/messages/EmsReportReceived' }
  ed.ems.handoff.completed:
    description: Bedside EMS handoff acknowledged
    publish:
      message: { $ref: '#/components/messages/EmsHandoffCompleted' }
  ed.order.placed:
    description: New ED order accepted
    publish:
      message: { $ref: '#/components/messages/OrderPlaced' }
  ed.order.signed:
    description: Verbal order countersigned
    publish:
      message: { $ref: '#/components/messages/OrderSigned' }
  ed.order.unverified.window-exceeded:
    description: Verbal order countersign window expired
    publish:
      message: { $ref: '#/components/messages/OrderUnverifiedWindowExceeded' }
  ed.bed.assigned:
    description: Patient assigned to bed
    publish:
      message: { $ref: '#/components/messages/BedAssigned' }
  ed.bed.reassigned:
    description: Patient moved between beds (charge-nurse override)
    publish:
      message: { $ref: '#/components/messages/BedReassigned' }
  ed.bed.status.changed:
    description: Bed state transition (cleaning / out-of-service / available)
    publish:
      message: { $ref: '#/components/messages/BedStatusChanged' }
  ed.disposition.set:
    description: Disposition finalized
    publish:
      message: { $ref: '#/components/messages/DispositionSet' }
  ed.boarding.threshold:
    description: Boarding hold past threshold (2h/4h/8h/12h/24h)
    publish:
      message: { $ref: '#/components/messages/BoardingThreshold' }
  ed.lwbs.recorded:
    description: Left-without-being-seen / left-before-treatment-complete record
    publish:
      message: { $ref: '#/components/messages/LwbsRecorded' }
  ed.metrics.snapshot:
    description: Continuous door-to-X metric publication
    publish:
      message: { $ref: '#/components/messages/MetricsSnapshot' }
  ed.shift.handoff:
    description: Provider / nurse shift change handoff
    publish:
      message: { $ref: '#/components/messages/ShiftHandoff' }
  ed.disaster.activated:
    description: Incident-command-structure activation
    publish:
      message: { $ref: '#/components/messages/DisasterActivated' }
  ed.disaster.deactivated:
    description: ICS closure
    publish:
      message: { $ref: '#/components/messages/DisasterDeactivated' }
  ed.trauma.registry.exported:
    description: TQIP / NTDB-conformant trauma registry export complete
    publish:
      message: { $ref: '#/components/messages/TraumaRegistryExported' }
  ed.expired.notify:
    description: Disposition=Expired → chaplaincy / decedent-affairs notification
    publish:
      message: { $ref: '#/components/messages/ExpiredNotify' }
components:
  messages:
    PatientRegistered:
      name: PatientRegistered
      payload:
        $ref: '#/components/schemas/PatientRegisteredPayload'
    TriageCompleted:
      name: TriageCompleted
      payload:
        $ref: '#/components/schemas/TriageCompletedPayload'
    TriageReassessed:
      name: TriageReassessed
      payload:
        $ref: '#/components/schemas/TriageReassessedPayload'
    ProtocolActivated:
      name: ProtocolActivated
      payload:
        $ref: '#/components/schemas/ProtocolActivatedPayload'
    ProtocolDeactivated:
      name: ProtocolDeactivated
      payload:
        $ref: '#/components/schemas/ProtocolDeactivatedPayload'
    ProtocolWindowBreached:
      name: ProtocolWindowBreached
      payload:
        $ref: '#/components/schemas/ProtocolWindowBreachedPayload'
    MciActivated:
      name: MciActivated
      payload:
        $ref: '#/components/schemas/MciActivatedPayload'
    MciDeactivated:
      name: MciDeactivated
      payload:
        $ref: '#/components/schemas/MciDeactivatedPayload'
    EmsReportReceived:
      name: EmsReportReceived
      payload:
        $ref: '#/components/schemas/EmsReportReceivedPayload'
    EmsHandoffCompleted:
      name: EmsHandoffCompleted
      payload:
        $ref: '#/components/schemas/EmsHandoffCompletedPayload'
    OrderPlaced:
      name: OrderPlaced
      payload:
        $ref: '#/components/schemas/OrderPlacedPayload'
    OrderSigned:
      name: OrderSigned
      payload:
        $ref: '#/components/schemas/OrderSignedPayload'
    OrderUnverifiedWindowExceeded:
      name: OrderUnverifiedWindowExceeded
      payload:
        $ref: '#/components/schemas/OrderUnverifiedWindowExceededPayload'
    BedAssigned:
      name: BedAssigned
      payload:
        $ref: '#/components/schemas/BedAssignedPayload'
    BedReassigned:
      name: BedReassigned
      payload:
        $ref: '#/components/schemas/BedReassignedPayload'
    BedStatusChanged:
      name: BedStatusChanged
      payload:
        $ref: '#/components/schemas/BedStatusChangedPayload'
    DispositionSet:
      name: DispositionSet
      payload:
        $ref: '#/components/schemas/DispositionSetPayload'
    BoardingThreshold:
      name: BoardingThreshold
      payload:
        $ref: '#/components/schemas/BoardingThresholdPayload'
    LwbsRecorded:
      name: LwbsRecorded
      payload:
        $ref: '#/components/schemas/LwbsRecordedPayload'
    MetricsSnapshot:
      name: MetricsSnapshot
      payload:
        $ref: '#/components/schemas/MetricsSnapshotPayload'
    ShiftHandoff:
      name: ShiftHandoff
      payload:
        $ref: '#/components/schemas/ShiftHandoffPayload'
    DisasterActivated:
      name: DisasterActivated
      payload:
        $ref: '#/components/schemas/DisasterActivatedPayload'
    DisasterDeactivated:
      name: DisasterDeactivated
      payload:
        $ref: '#/components/schemas/DisasterDeactivatedPayload'
    TraumaRegistryExported:
      name: TraumaRegistryExported
      payload:
        $ref: '#/components/schemas/TraumaRegistryExportedPayload'
    ExpiredNotify:
      name: ExpiredNotify
      payload:
        $ref: '#/components/schemas/ExpiredNotifyPayload'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, idempotencyKey, tenantId, cellId, traceId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        idempotencyKey: { type: string }
        tenantId: { type: string }
        cellId: { type: string }
        traceId: { type: string }
        correlationId: { type: string }
        causationId: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string }
    PatientRegisteredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            registrationId: { type: string, format: uuid }
            mode: { type: string, enum: [quick-reg, pre-arrival, walk-in] }
            placeholderName: { type: string, nullable: true }
            ambulanceArrival: { type: boolean }
    TriageCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            triageEncounterId: { type: string, format: uuid }
            sequence: { type: integer }
            acuity: { type: integer, minimum: 1, maximum: 5 }
            chiefComplaint: { type: string }
            pediatricOverlay: { type: boolean }
    TriageReassessedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            priorAcuity: { type: integer }
            newAcuity: { type: integer }
            reason: { type: string }
    ProtocolActivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            activationId: { type: string, format: uuid }
            protocolType: { type: string, enum: [trauma, stroke, stemi, sepsis, mtp, local] }
            attestingActorId: { type: string }
            targetWindowsMinutes:
              type: object
              additionalProperties:
                type: integer
    ProtocolDeactivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            activationId: { type: string, format: uuid }
            reason: { type: string }
            falseAlert: { type: boolean }
    ProtocolWindowBreachedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            activationId: { type: string, format: uuid }
            windowName: { type: string }
            elapsedMinutes: { type: integer }
            targetMinutes: { type: integer }
    MciActivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            incidentId: { type: string, format: uuid }
            facilityId: { type: string }
            triageMode: { type: string, enum: [start, salt] }
            drillMode: { type: boolean }
    MciDeactivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            incidentId: { type: string, format: uuid }
            afterActionReportFlag: { type: boolean }
    EmsReportReceivedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            runNumber: { type: string }
            unitId: { type: string }
            etaSeconds: { type: integer }
            chiefComplaint: { type: string }
            mechanismOfInjury: { type: string }
            nemsisPayloadRef: { type: string }
    EmsHandoffCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            handoffId: { type: string, format: uuid }
            runNumber: { type: string }
            receivedAt: { type: string, format: date-time }
    OrderPlacedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            orderId: { type: string, format: uuid }
            orderKind: { type: string, enum: [med, lab, imaging, procedure, observation] }
            verbal: { type: boolean }
            orderSetRef: { type: string, nullable: true }
    OrderSignedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            orderId: { type: string, format: uuid }
            signedAt: { type: string, format: date-time }
    OrderUnverifiedWindowExceededPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            orderId: { type: string, format: uuid }
            hoursElapsed: { type: integer }
    BedAssignedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            bedId: { type: string }
            zoneId: { type: string }
            decisionId: { type: string, format: uuid }
    BedReassignedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            priorBedId: { type: string }
            newBedId: { type: string }
            chargeNurseActorId: { type: string }
    BedStatusChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            bedId: { type: string }
            priorState: { type: string }
            newState: { type: string }
            reason: { type: string, nullable: true }
    DispositionSetPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            dispositionId: { type: string, format: uuid }
            outcome: { type: string, enum: [admit, transfer, discharge, ama, expired] }
            attestingActorId: { type: string }
    BoardingThresholdPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            holdId: { type: string, format: uuid }
            thresholdHours: { type: integer, enum: [2, 4, 8, 12, 24] }
            elapsedMinutes: { type: integer }
    LwbsRecordedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            kind: { type: string, enum: [lwbs, lbtc, lbr] }
            elapsedMinutes: { type: integer }
    MetricsSnapshotPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            doorToDoctorMedianMinutes: { type: number }
            doorToDoctorP95Minutes: { type: number }
            doorToCtMedianMinutes: { type: number }
            doorToNeedleMedianMinutes: { type: number }
            doorToBalloonMedianMinutes: { type: number }
            doorToDispositionMedianMinutes: { type: number }
            edLengthOfStayP95Minutes: { type: number }
            lwbsRatePercent: { type: number }
            boarding4hCount: { type: integer }
            boarding24hCount: { type: integer }
    ShiftHandoffPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            shiftId: { type: string }
            outgoingActorId: { type: string }
            incomingActorId: { type: string }
            ipassPayload: { type: object }
    DisasterActivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            icsId: { type: string, format: uuid }
            facilityId: { type: string }
            statusColor: { type: string, enum: [green, yellow, red, black] }
            drillMode: { type: boolean }
    DisasterDeactivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            icsId: { type: string, format: uuid }
            afterActionReportFlag: { type: boolean }
    TraumaRegistryExportedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            exportId: { type: string, format: uuid }
            facilityId: { type: string }
            recordCount: { type: integer }
            tqipConformant: { type: boolean }
            signatureRef: { type: string }
    ExpiredNotifyPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            encounterId: { type: string, format: uuid }
            dispositionId: { type: string, format: uuid }
            chaplaincyRequested: { type: boolean }
            decedentAffairsRequested: { type: boolean }
