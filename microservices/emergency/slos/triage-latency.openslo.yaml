apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-triage-latency
  displayName: ED Door-to-Triage-Complete
  labels:
    microservice: emergency
    domain: healthcare.emergency.triage
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from arrival to triage close. Median ≤ 10 min, p95 ≤ 20 min.
  service: emergency
  indicator:
    metadata: { name: triage-latency }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_triage_latency_seconds_bucket{le="1200"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_triage_latency_seconds_count[28d]))
  objectives:
    - displayName: p95 ≤ 20 min
      target: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
