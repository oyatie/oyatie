apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-tracking-board-staleness
  displayName: ED Tracking Board Update Lag
  labels:
    microservice: emergency
    domain: healthcare.emergency.trackingboard
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from domain mutation to dashboard render. p99 ≤ 500 ms.
  service: emergency
  indicator:
    metadata: { name: tracking-board-lag }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_board_fanout_lag_seconds_bucket{le="0.5"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_board_fanout_lag_seconds_count[28d]))
  objectives:
    - displayName: p99 ≤ 500 ms
      target: 0.99
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
