apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-door-to-needle-stroke
  displayName: ED Stroke Door-to-Needle
  labels:
    microservice: emergency
    domain: healthcare.emergency.stroke
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Time from stroke patient arrival to thrombolytic administration.
    Target ≤ 60 min per AHA Get-With-The-Guidelines.
  service: emergency
  indicator:
    metadata: { name: door-to-needle }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stroke_door_to_needle_seconds_bucket{le="3600"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_stroke_door_to_needle_seconds_count[28d]))
  objectives:
    - displayName: door-to-needle ≤ 60 min
      target: 0.85
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
