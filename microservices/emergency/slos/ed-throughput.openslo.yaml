apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-ed-throughput
  displayName: ED Treat-and-Release LOS
  labels:
    microservice: emergency
    domain: healthcare.emergency.throughput
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Treat-and-release length-of-stay p95 ≤ 6 h.
  service: emergency
  indicator:
    metadata: { name: ed-treat-and-release-los }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_treat_release_los_seconds_bucket{le="21600"}[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_treat_release_los_seconds_count[28d]))
  objectives:
    - displayName: p95 ≤ 6 h
      target: 0.95
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
