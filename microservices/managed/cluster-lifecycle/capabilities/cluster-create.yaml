name: cluster-lifecycle-create
tier: T3
risk_class: high
bounded_context: managed-k8s-cluster-lifecycle
summary: "Validate tenant cluster create requests, check quota, then call ControlPlaneProvisioning."
autonomy_ceiling: T3
ports_consumed:
  - oya-managed-k8s-tenant-quota-api::QuotaDecisionPort
  - oya-managed-k8s-control-plane-host-api::ControlPlaneProvisioning
fail_closed:
  - malformed_request
  - quota_denied
  - quota_not_found
  - quota_persistence_failure
