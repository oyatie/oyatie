name: sla-summary-read
tier: T1
risk_class: minimal
owner: axis-cloud-k8s
summary: Read deterministic managed-K8s SLA summaries for a known tenant cluster.
inputs:
  - tenant_id
  - cluster_name
outputs:
  - availability_state
  - availability_basis_points
  - provisioning_latency_state
  - error_budget_burn_basis_points
non_claims:
  - no live Prometheus or Kubernetes dependency in this lane
