[package]
name = "oya-managed-k8s-sla-observability-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Composition/application service for managed-Kubernetes SLA observability. Reads the control-plane-host status port, ingests snapshots, and returns deterministic golden-signal DTOs without live Prometheus/Kubernetes coupling."

[dependencies]
oya-managed-k8s-sla-observability-kernel = { path = "../oya-managed-k8s-sla-observability-kernel" }
oya-managed-k8s-sla-observability-api = { path = "../oya-managed-k8s-sla-observability-api" }
oya-managed-k8s-sla-observability-adapter-inmemory = { path = "../oya-managed-k8s-sla-observability-adapter-inmemory" }
oya-managed-k8s-control-plane-host-api = { path = "../oya-managed-k8s-control-plane-host-api" }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
oya-managed-k8s-control-plane-host-adapter-inmemory = { path = "../oya-managed-k8s-control-plane-host-adapter-inmemory" }

[lib]
name = "oya_managed_k8s_sla_observability_app"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
