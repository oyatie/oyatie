[package]
name = "oya-managed-k8s-sla-observability-adapter-inmemory"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Deterministic in-memory SLA snapshot store implementing the managed-Kubernetes SLA observability port for tests and single-node bring-up."

[dependencies]
oya-managed-k8s-sla-observability-kernel = { path = "../oya-managed-k8s-sla-observability-kernel" }
oya-managed-k8s-sla-observability-api = { path = "../oya-managed-k8s-sla-observability-api" }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lib]
name = "oya_managed_k8s_sla_observability_adapter_inmemory"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
