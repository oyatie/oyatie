[package]
name = "oya-managed-k8s-tenant-quota-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Composition root: quota admin REST API (PUT/GET /tenants/{id}/quota, GET /tenants/{id}/usage) + QuotaDecision service. ADR-0376."

[dependencies]
oya-managed-k8s-tenant-quota-kernel = { path = "../oya-managed-k8s-tenant-quota-kernel" }
oya-managed-k8s-tenant-quota-api = { path = "../oya-managed-k8s-tenant-quota-api" }
oya-managed-k8s-tenant-quota-adapter-inmemory = { path = "../oya-managed-k8s-tenant-quota-adapter-inmemory" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = { workspace = true }

[dev-dependencies]
oya-managed-k8s-tenant-quota-adapter-inmemory = { path = "../oya-managed-k8s-tenant-quota-adapter-inmemory" }
tower = { version = "0.4", default-features = false, features = ["util"] }
http-body-util = { workspace = true }

[[bin]]
name = "oya-managed-k8s-tenant-quota"
path = "src/main.rs"

[lib]
name = "oya_managed_k8s_tenant_quota_app"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
