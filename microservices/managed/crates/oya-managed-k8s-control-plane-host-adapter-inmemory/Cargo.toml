[package]
name = "oya-managed-k8s-control-plane-host-adapter-inmemory"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Deterministic in-memory adapter implementing the ControlPlaneProvisioning port (ADR-0376) for tests + single-node bring-up. Drives a tenant control plane through the kernel status state machine for both the hosted (Kamaji) and dedicated (Talos-spoke) tiers WITHOUT any kube-rs/network. The reference adapter the control-plane-host app composes when no management kubeconfig is wired."

# Adapter layer (ADR-0105): reference in-memory implementation of the api port.
# Path-deps inward on the api (port + DTOs) and kernel (state machine). NO
# kube-rs — that is isolated to the -adapter-capi crate per ADR-0376. tokio
# only for the boxed-future port methods' async glue at the seam.
[dependencies]
oya-managed-k8s-control-plane-host-kernel = { path = "../oya-managed-k8s-control-plane-host-kernel" }
oya-managed-k8s-control-plane-host-api = { path = "../oya-managed-k8s-control-plane-host-api" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lib]
name = "oya_managed_k8s_control_plane_host_adapter_inmemory"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
