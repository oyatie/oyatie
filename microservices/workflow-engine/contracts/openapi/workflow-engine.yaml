openapi: 3.2.0
info:
  title: workflow-engine REST API
  version: 0.1.0
  description: |
    Workflow execution substrate REST API. Owned by axis-workflow.
    Surfaces:
      - spec-store: CRUD over workflow specs (compiled IR + signature)
      - execution-engine: start/pause/resume/cancel/signal runs; read run state
      - event-bus: publish + subscribe + replay typed workflow events
      - state-machine: read transition history (read-only; transitions emitted only by engine)
      - replay-debugger-backend: read replay sessions + step snapshots
    All endpoints require OIDC + per-tenant scope via Cedar (`policy/tenant-scope.cedar`).
    All paths bound to the authenticated tenant; client cannot override tenant_id.
  contact:
    name: axis-workflow
    email: axis-workflow@oyatie.com
  license:
    name: Internal
servers:
  - url: https://workflow-engine.<pack>.oyatie.com/v1
    description: Per-pack engine endpoint (pack = kr | eu | us | us-hc | jp | sg | au | in | br | ae | ksa)

security:
  - oidcAuth: []

paths:
  /specs:
    post:
      summary: Submit a workflow spec (compiled IR + signature)
      operationId: submitWorkflowSpec
      tags: [spec-store]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSpecSubmission'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSpec'
        '400':
          description: Spec validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Auth failed
        '409':
          description: Conflict (e.g., spec_id immutable after submit)
        '422':
          description: Spec semantic error (forbidden construct; failed signature verification)
    get:
      summary: List workflow specs for tenant
      operationId: listWorkflowSpecs
      tags: [spec-store]
      parameters:
        - in: query
          name: spec_id
          schema: {type: string}
          required: false
        - in: query
          name: lifecycle
          schema:
            type: string
            enum: [draft, published, deprecated, retired]
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  specs:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowSpec'

  /specs/{spec_id}/versions/{version_sha}:
    get:
      summary: Get a specific workflow spec version
      operationId: getWorkflowSpecVersion
      tags: [spec-store]
      parameters:
        - in: path
          name: spec_id
          schema: {type: string}
          required: true
        - in: path
          name: version_sha
          schema: {type: string}
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSpec'
        '404':
          description: Not found
        '410':
          description: Gone (retired)

  /specs/{spec_id}/lifecycle:
    patch:
      summary: Transition spec lifecycle (deprecate / retire)
      operationId: transitionSpecLifecycle
      tags: [spec-store]
      parameters:
        - in: path
          name: spec_id
          schema: {type: string}
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_sha, lifecycle_to, reason]
              properties:
                version_sha: {type: string}
                lifecycle_to:
                  type: string
                  enum: [deprecated, retired]
                reason: {type: string, minLength: 10}
                two_person_signature:
                  type: array
                  items: {type: string}
                  minItems: 2
                  maxItems: 2
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden (two-person rule not satisfied for retired)

  /runs:
    post:
      summary: Start a new workflow run
      operationId: startWorkflowRun
      tags: [execution-engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunStartRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '400':
          description: Bad request
        '409':
          description: Per-tenant active-run cap reached
        '422':
          description: Spec not in published state

  /runs/{run_id}:
    get:
      summary: Read current state of a run
      operationId: getWorkflowRun
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '404':
          description: Not found

  /runs/{run_id}/pause:
    post:
      summary: Pause a running workflow
      operationId: pauseWorkflowRun
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5}
      responses:
        '200':
          description: OK

  /runs/{run_id}/resume:
    post:
      summary: Resume a paused workflow
      operationId: resumeWorkflowRun
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      responses:
        '200':
          description: OK

  /runs/{run_id}/cancel:
    post:
      summary: Cancel a running workflow
      operationId: cancelWorkflowRun
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                two_person_signature:
                  type: array
                  items: {type: string}
                  description: Required for production-tier runs
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden (two-person rule required for production)

  /runs/{run_id}/signal:
    post:
      summary: Send a signal to a running workflow
      operationId: signalWorkflowRun
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal_name, payload]
              properties:
                signal_name: {type: string}
                payload: {type: object}
      responses:
        '200':
          description: OK

  /runs/{run_id}/steps:
    get:
      summary: List step executions for a run
      operationId: listStepExecutions
      tags: [execution-engine]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      $ref: '#/components/schemas/StepExecution'

  /runs/{run_id}/replay:
    post:
      summary: Initiate a deterministic replay of a run (debugger backend)
      operationId: replayWorkflowRun
      tags: [replay-debugger-backend]
      parameters:
        - in: path
          name: run_id
          schema: {type: string}
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from_step: {type: integer, minimum: 0}
                to_step: {type: integer, minimum: 0}
      responses:
        '202':
          description: Replay session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaySession'

  /events:
    post:
      summary: Publish a typed workflow event
      operationId: publishWorkflowEvent
      tags: [event-bus]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowEventPublish'
      responses:
        '202':
          description: Accepted (event-bus is async; outbox-persisted before 202 returned)

  /subscriptions:
    post:
      summary: Create an event subscription
      operationId: createSubscription
      tags: [event-bus]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscriptions/{sub_id}:
    delete:
      summary: Cancel a subscription
      operationId: deleteSubscription
      tags: [event-bus]
      parameters:
        - in: path
          name: sub_id
          schema: {type: string}
          required: true
      responses:
        '204':
          description: Deleted

  /subscriptions/{sub_id}/replay:
    post:
      summary: Replay events from offset N to M for a subscription
      operationId: replayEvents
      tags: [event-bus]
      parameters:
        - in: path
          name: sub_id
          schema: {type: string}
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_offset, to_offset]
              properties:
                from_offset: {type: integer, format: int64}
                to_offset: {type: integer, format: int64}
      responses:
        '202':
          description: Accepted

  /metrics:
    get:
      summary: Tenant-scoped engine metrics
      operationId: getTenantMetrics
      tags: [execution-engine]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_runs: {type: integer}
                  runs_started_today: {type: integer}
                  step_latency_p50_ms: {type: number}
                  step_latency_p99_ms: {type: number}
                  step_failure_rate: {type: number, format: float}
                  audit_chain_seal_count: {type: integer}

  /health:
    get:
      summary: Engine health endpoint (anonymous; no tenant data)
      operationId: getEngineHealth
      security: []  # anonymous
      tags: [public]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, degraded, down]}
                  version: {type: string}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: workflow-engine
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.<pack>.oyatie.com/.well-known/openid-configuration

  schemas:
    WorkflowSpec:
      type: object
      required: [spec_id, version_sha, body, signature, signer_identity, lifecycle, submitted_at]
      properties:
        spec_id: {type: string}
        version_sha: {type: string}
        body: {type: object, description: Compiled spec IR (JSON canonicalized)}
        signature: {type: string, description: Ed25519 signature}
        signer_identity: {type: string, description: SPIFFE or OIDC subject}
        lifecycle:
          type: string
          enum: [draft, published, deprecated, retired]
        submitted_at: {type: string, format: date-time}

    WorkflowSpecSubmission:
      type: object
      required: [spec_id, body, signature, signer_identity]
      properties:
        spec_id: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        body: {type: object}
        signature: {type: string}
        signer_identity: {type: string}

    WorkflowRunStartRequest:
      type: object
      required: [spec_id, version_sha, input]
      properties:
        spec_id: {type: string}
        version_sha: {type: string}
        input: {type: object, description: Initial input payload (data_class-annotated at spec level)}
        environment:
          type: string
          enum: [sandbox, staging, production]
          default: production
        idempotency_key: {type: string}

    WorkflowRun:
      type: object
      required: [run_id, tenant_id, spec_id, version_sha, status, started_at]
      properties:
        run_id: {type: string}
        tenant_id: {type: string}
        spec_id: {type: string}
        version_sha: {type: string}
        status:
          type: string
          enum: [running, paused, waiting, completed, failed, cancelled]
        current_step_index: {type: integer}
        current_state: {type: string}
        waiting_on: {type: string, nullable: true}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        terminal_reason: {type: string, nullable: true}

    StepExecution:
      type: object
      required: [run_id, step_index, status, started_at]
      properties:
        run_id: {type: string}
        step_index: {type: integer}
        status:
          type: string
          enum: [pending, running, completed, failed, retrying]
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        retry_count: {type: integer}
        error: {type: string, nullable: true}

    WorkflowEventPublish:
      type: object
      required: [event_type, payload]
      properties:
        event_type: {type: string, description: Registered event type (e.g., EmployeeHired, PayrollRunCompleted)}
        payload: {type: object, description: Event payload (data_class-annotated)}
        correlation_id: {type: string}
        idempotency_key: {type: string}

    SubscriptionCreate:
      type: object
      required: [event_type_filter, delivery_url]
      properties:
        event_type_filter: {type: string, description: Filter pattern (regex or exact match)}
        delivery_url: {type: string, format: uri}
        webhook_signing_secret_ref: {type: string, description: OpenBao SecretReference for HMAC signing}
        retry_policy:
          type: object
          properties:
            max_attempts: {type: integer, minimum: 1, maximum: 100}
            backoff: {type: string, enum: [exponential, linear, fixed]}
            initial_delay_ms: {type: integer, minimum: 100}

    Subscription:
      type: object
      required: [sub_id, tenant_id, event_type_filter, created_at]
      properties:
        sub_id: {type: string}
        tenant_id: {type: string}
        event_type_filter: {type: string}
        delivery_url: {type: string}
        created_at: {type: string, format: date-time}
        consumer_lag_seconds: {type: number}
        last_delivery_at: {type: string, format: date-time, nullable: true}

    ReplaySession:
      type: object
      required: [session_id, run_id, status]
      properties:
        session_id: {type: string}
        run_id: {type: string}
        status:
          type: string
          enum: [pending, running, completed, failed]
        from_step: {type: integer}
        to_step: {type: integer}
        steps_replayed: {type: integer}
        identical_to_original: {type: boolean, nullable: true}

    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object}
