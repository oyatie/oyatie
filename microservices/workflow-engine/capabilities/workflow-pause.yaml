# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-engine:workflow-pause:v1
name: workflow-pause
namespace: workflow-engine
display_name: Pause Workflow Run
description: |
  Pause an in-flight workflow run at the next step boundary. The run remains durable
  (state persisted in Postgres) and survives engine restarts. Resume via workflow-resume.
  Long-running paused workflows tolerated up to 90 days per durability ceiling.

owner_team: axis-workflow
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0035, ADR-0103, ADR-0131]
related_specs: [/specs/microservices/workflow.json]
related_artifacts:
  - microservices/workflow-engine/PRD.md
  - microservices/workflow-engine/contracts/openapi/workflow-engine.yaml

autonomy_tier: T2
# T2 = operator intervention; reversible.

inputs:
  - name: run_id
    type: string
    required: true
  - name: reason
    type: string
    min_length: 5
    required: true

outputs:
  - name: paused_at
    type: timestamp
  - name: current_step_index
    type: integer
    description: Step at which the run paused

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT
  # Pause action is operator-initiated; audit-emitted with actor identity

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-engine.workflow.paused

cost_profile:
  type: per-pause
  estimated_cost_usd_per_call: 0.00005
  cost_drivers:
    - Postgres run-state update
    - Audit-chain seal

cedar_policy_fragments:
  - microservices/workflow-engine/policy/tenant-scope.cedar

eval_set:
  golden_inputs_path: microservices/workflow-engine/capabilities/eval/workflow-pause-golden.jsonl
  pass_threshold: 1.00
  eval_metric: pause-resume-roundtrip-identical-state
  cadence: per-release

sunset:
  status: none
  notes: ""
