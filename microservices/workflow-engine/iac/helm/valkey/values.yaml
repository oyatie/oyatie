# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
valkey:
  architecture: replication
  auth:
    enabled: true
    existingSecret: openbao-valkey
    existingSecretPasswordKey: password
  sentinel:
    enabled: true
    quorum: 2          # 3 sentinels; quorum 2 per capacity-model.md
    downAfterMilliseconds: 10000
    failoverTimeout: 30000
  replica:
    replicaCount: 3    # primary + 2 replicas (HA per multi-region.md)
    persistence:
      enabled: true
      size: 30Gi       # AOF + RDB
      storageClass: oci-bv-fast
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: oci-bv-fast
  metrics:
    enabled: true       # scraped by observability µservice's Alloy collector
    serviceMonitor:
      enabled: true
  commonConfiguration: |-
    maxmemory-policy noeviction          # never evict; lease state must be reliable
    appendonly yes
    appendfsync everysec
    save ""                              # disable RDB if AOF is sufficient
    notify-keyspace-events "Ex"          # expiry notifications for lease TTL
  networkPolicy:
    enabled: true
    allowExternal: false                 # in-cluster only
