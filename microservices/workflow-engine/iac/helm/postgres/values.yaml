# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
postgres:
  image:
    repository: citusdata/citus
    tag: "12.1-pg16"  # LTS pin per docs/standards/workflow-engine-substrate.md
  coordinator:
    replicas: 2  # HA primary + standby (capacity-model.md XS tier)
    persistence:
      size: 200Gi
      storageClassName: oci-bv-fast
  worker:
    replicas: 4  # XS tier per capacity-model.md
    persistence:
      size: 200Gi
      storageClassName: oci-bv-fast
  readReplica:
    replicas: 4  # 1:1 with worker per capacity-model.md
    persistence:
      size: 200Gi
      storageClassName: oci-bv-fast
  citus:
    enable_2pc: true        # cross-shard transactional consistency
    shard_count: 32         # initial sharding; can grow linearly
    rebalancer:
      enabled: true
      schedule: "0 4 * * 0"  # weekly off-hours
  config:
    max_connections: 500
    shared_buffers: 4GB
    wal_level: replica
    synchronous_standby_names: "ANY 1 (coord_standby)"  # HA on coordinator
  secrets:
    postgres_password:
      valueFrom:
        secretKeyRef:
          name: openbao-postgres
          key: password
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: true   # scraped by observability µservice's Alloy collector
  backup:
    enabled: true
    cron: "0 2 * * *"           # daily 2 AM UTC
    retention_days: 30
    target: s3
    s3:
      endpoint: "${OCI_OBJECTSTORAGE_ENDPOINT}"
      bucket_name: "${OCI_WORKFLOW_ENGINE_PG_BACKUP_BUCKET}"
      access_key_id: "${openbao:secret/workflow-engine/postgres/s3-access-key}"
      secret_access_key: "${openbao:secret/workflow-engine/postgres/s3-secret-key}"
