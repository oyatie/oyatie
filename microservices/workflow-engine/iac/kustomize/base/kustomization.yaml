# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the workflow-engine cluster, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier.
# Per ADR-0131 + multi-region.md DR posture.

namespace: workflow-engine

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml

helmCharts:
  - name: oya-workflow-engine-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: postgres
    namespace: workflow-engine
  - name: oya-workflow-engine-valkey
    valuesFile: ../../helm/valkey/values.yaml
    releaseName: valkey
    namespace: workflow-engine
  - name: oya-workflow-engine-clickhouse
    valuesFile: ../../helm/clickhouse/values.yaml
    releaseName: clickhouse
    namespace: workflow-engine
  - name: oya-workflow-engine-runtime
    valuesFile: ../../helm/workflow-runtime/values.yaml
    releaseName: workflow-runtime
    namespace: workflow-engine

commonLabels:
  app.kubernetes.io/part-of: oya-workflow-engine
  oyatie/microservice: workflow-engine
