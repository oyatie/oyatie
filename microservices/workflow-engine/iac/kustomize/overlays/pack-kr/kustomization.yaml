# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Per-pack overlay: pack-kr (initial active pack at M02b launch)
# OCI region: ap-seoul-1 (single-region; no DR pair per multi-region.md).
# KR-FSS sector tenants: 5y audit retention override; KMS keys in KR-resident KMS.

bases:
  - ../../base

namespace: workflow-engine

patches:
  - target:
      kind: HelmChart
      name: oya-workflow-engine-postgres
    patch: |
      - op: replace
        path: /spec/values/postgres/coordinator/replicas
        value: 2
      - op: replace
        path: /spec/values/postgres/worker/replicas
        value: 4

  - target:
      kind: HelmChart
      name: oya-workflow-engine-runtime
    patch: |
      - op: replace
        path: /spec/values/executionEngine/worker/replicas
        value: 3
      - op: replace
        path: /spec/values/executionEngine/rest/replicas
        value: 2

configMapGenerator:
  - name: workflow-engine-pack-config
    literals:
      - PACK=pack-kr
      - PACK_REGION=ap-seoul-1
      - PACK_JURISDICTION=kr
      - DR_PAIR_REGION=""                       # single-region pack
      - RETENTION_AUDIT_DAYS=1095               # 3y for KR-FSS sector default
      - RETENTION_PII_DAYS=365                  # PIPA Art. 28 bounded
      - KMS_KEYRING_NAME=oci-kms-kr-workflow-engine

secretGenerator:
  - name: openbao-secret-paths
    literals:
      - POSTGRES_PATH=secret/pack-kr/workflow-engine/postgres
      - VALKEY_PATH=secret/pack-kr/workflow-engine/valkey
      - CLICKHOUSE_PATH=secret/pack-kr/workflow-engine/clickhouse
      - AUDIT_CHAIN_KEY_PATH=secret/pack-kr/workflow-engine/audit-chain
      - SPEC_SIGNING_KEY_PATH=secret/pack-kr/workflow-engine/spec-signing

commonLabels:
  oyatie/pack: pack-kr
  oyatie/jurisdiction: kr
