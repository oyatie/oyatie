# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-engine-workflow-completion-availability
  displayName: "workflow-engine: workflow completion availability 99.95%"
  labels:
    microservice: workflow-engine
    bounded_context: execution-engine
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-workflow
    pack_scope: all
spec:
  service: workflow-engine
  description: |
    Workflow completion availability SLO. A workflow is "good" when it
    reaches a terminal state (COMPLETED / FAILED / CANCELLED with deterministic
    cause) without engine-side error (timer-fire failure, history-rehydrate
    failure, replay non-determinism). 4xx user-cause failures excluded per
    Google SRE Workbook ch. 5 convention.
  indicator:
    metadata:
      name: workflow-engine-completion-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_workflow_terminal_total{outcome=~"completed|user_failed|cancelled"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_workflow_terminal_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling completion availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
