# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-engine-workflow-step-execute-latency
  displayName: "workflow-engine: workflow-step execute latency p99 ≤ 500ms"
  labels:
    microservice: workflow-engine
    bounded_context: execution-engine
    sli_class: latency
    tier: internal-substrate
    plane: data
    owner_team: axis-workflow
    pack_scope: all
spec:
  service: workflow-engine
  description: |
    Per-step execution latency p99 SLO. A step is "good" when the
    activity-dispatch → activity-result-commit interval completes in
    ≤ 500ms p99. Excludes user-code execution duration (owned by caller
    activity SLOs). Per PRD §"Performance Targets" durable-execution path.
  indicator:
    metadata:
      name: workflow-engine-step-execute-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_step_execute_duration_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_step_execute_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 500ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
