# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-engine-payload-bytes-budget-correctness
  displayName: "workflow-engine: payload-bytes budget correctness (within history-size limits)"
  labels:
    microservice: workflow-engine
    bounded_context: spec-store
    sli_class: correctness
    tier: load-bearing-invariant
    plane: data
    owner_team: axis-workflow
    pack_scope: all
spec:
  service: workflow-engine
  description: |
    Payload-bytes budget correctness SLO. A workflow execution is "good" when
    its per-event payload (≤ 2 MiB) AND its cumulative-history payload
    (≤ 50 MiB; 50K events) remain within Temporal-class envelope. Any
    breach of either ceiling = correctness violation forcing termination
    (continue-as-new contract). Per PRD §"Invariants" payload-budget-bound.
  indicator:
    metadata:
      name: workflow-engine-payload-budget-compliance-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_workflow_event_total{payload_budget="within_limit"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_workflow_engine_workflow_event_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% payload-budget compliance (any breach is Sev-2 continue-as-new violation)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
