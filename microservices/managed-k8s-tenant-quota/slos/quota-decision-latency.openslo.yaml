apiVersion: openslo/v1
kind: SLO
metadata:
  name: quota-decision-latency
  namespace: managed-k8s-tenant-quota
spec:
  description: >
    QuotaDecision evaluate() on the cluster-lifecycle hot path must complete
    in under 1ms p99 (O(1) pure Rust, no I/O). ADR-0376.
  service: managed-k8s-tenant-quota
  indicator:
    metadata:
      name: evaluate-latency
    spec:
      type: latency
      ratioMetric:
        counter: false
        good:
          source: prometheus
          queryType: promql
          query: "histogram_quantile(0.99, quota_evaluate_duration_seconds_bucket) < 0.001"
        total:
          source: prometheus
          queryType: promql
          query: "quota_evaluate_total"
  objectives:
    - displayName: p99 < 1ms
      target: 0.999
      timeWindow:
        - duration: 1d
          isRolling: true
