apiVersion: openslo/v1
kind: Service
metadata:
  name: cell-lifecycle
  displayName: Cell Lifecycle
spec:
  description: Logical cell lifecycle state machine per ADR-0276 D-3.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-register-api-p99
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: api_p99_latency_ms_register
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(http_request_duration_milliseconds_bucket{service="cell-lifecycle",operation="registerCell",le="100"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(http_request_duration_milliseconds_count{service="cell-lifecycle",operation="registerCell"}[5m]))
  objectives:
    - displayName: register p99 latency <= 100ms
      target: 0.99
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-promote-api-p99
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: api_p99_latency_ms_promote
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket{service="cell-lifecycle",operation="promoteCell"}[5m])) by (le))
  objectives:
    - displayName: promote p99 latency <= 500ms
      target: 500
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-drain-api-p99
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: api_p99_latency_ms_drain
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket{service="cell-lifecycle",operation="drainCell"}[5m])) by (le))
  objectives:
    - displayName: drain intent p99 latency <= 200ms
      target: 200
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-lookup-api-p99
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: api_p99_latency_ms_lookup
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket{service="cell-lifecycle",operation=~"listCells|getCellLifecycle"}[5m])) by (le))
  objectives:
    - displayName: lookup p99 latency <= 50ms
      target: 50
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-promotion-evidence-validation-p99
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: promotion_evidence_validation_p99_seconds
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: histogram_quantile(0.99, sum(rate(cell_lifecycle_evidence_validation_duration_seconds_bucket{service="cell-lifecycle"}[5m])) by (le))
  objectives:
    - displayName: promotion evidence validation p99 <= 30s
      target: 30
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: cell-lifecycle-drain-to-decommission-duration
spec:
  service: cell-lifecycle
  indicator:
    metadata:
      name: drain_to_decommission_max_duration_hours
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: max_over_time(cell_lifecycle_drain_to_decommission_duration_hours{service="cell-lifecycle"}[30d])
  objectives:
    - displayName: drain to decommission duration <= 168h
      target: 168
