apiVersion: openslo/v1
kind: SLO
metadata:
  name: managed-k8s-cluster-lifecycle-create-admission-latency
spec:
  description: "Latency for cluster lifecycle admission before downstream control-plane provisioning."
  service: managed-k8s-cluster-lifecycle
  indicator:
    metadata:
      name: create-admission-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'histogram_quantile(0.95, sum(rate(oya_managed_k8s_cluster_lifecycle_admission_duration_seconds_bucket[5m])) by (le)) < 0.05'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_managed_k8s_cluster_lifecycle_create_requests_total[5m]))'
  objectives:
    - displayName: "p95 admission under 50ms"
      target: 0.95
