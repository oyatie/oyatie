apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-escalation-delivery
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: incident-management
  description: Escalations delivered to current schedule target for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations.
  indicator:
    metadata:
      name: escalation-delivery
      labels:
        domain_object: IncidentCommand
        operator_audience: ONCALL_RESPONDER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_escalation_delivery_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_escalation_delivery_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Escalations delivered to current schedule target
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
