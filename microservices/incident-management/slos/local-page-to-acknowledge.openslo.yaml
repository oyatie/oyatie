apiVersion: openslo/v1
kind: SLO
metadata:
  name: incident-management-page-to-acknowledge
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: incident-management
  description: Pages acknowledged inside escalation objective for paging, escalation, war-room creation, stakeholder update, status page, and postmortem operations.
  indicator:
    metadata:
      name: page-to-acknowledge
      labels:
        domain_object: IncidentCommand
        operator_audience: ONCALL_RESPONDER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_page_to_acknowledge_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_incident_management_page_to_acknowledge_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Pages acknowledged inside escalation objective
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
