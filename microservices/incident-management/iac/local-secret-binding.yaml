apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: incident-management-local-openbao-binding
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: incident-management-local-ops
  vaultPath: kv/incident-management/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: incident-management.local-ops.v1
  requiredFor:
    - pager-dispatcher
    - warroom-controller
