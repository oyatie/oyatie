apiVersion: oyatie.dev/v1
kind: SloAlertPolicy
metadata:
  name: incident-management-local-alerts
  labels:
    service: incident-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: incident-management
  burnWindows:
    - short: 5m
      long: 1h
      pageAt: 4
    - short: 30m
      long: 6h
      pageAt: 2
  runbooks:
    - microservices/incident-management/runbooks/local-page-to-ack-burn.md
    - microservices/incident-management/runbooks/local-escalation-delivery-gap.md
