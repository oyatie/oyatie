apiVersion: openslo/v1
kind: SLO
metadata:
  name: diagnostics-tat-dashboard-refresh
  displayName: Turn-around-time dashboard refresh latency
  labels:
    microservice: diagnostics
    bounded_context: turn-around-time
    tier: tier-1
spec:
  description: |
    TAT dashboard refresh latency per tenant + service line + priority. Target
    p99 <= 5 seconds.
  service: diagnostics
  indicator:
    metadata:
      name: tat-dashboard-refresh
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(diagnostics_tat_dashboard_refresh_seconds_bucket[5m])))
  objectives:
    - displayName: p99 <= 5s
      target: 5
      op: lte
  timeWindows:
    - duration: 30d
      isRolling: true
