[package]
name = "oya-analytics-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Analytics composition-root binary: wires kernel + adapter + domain + usecase + api into a runnable µservice process. Layer 12 per ADR-0083. Static-musl binary; distroless image."

[package.metadata.oya]
microservice = "analytics"
bounded_context = "analytics"
layer = "app"
owner_team = "council-analytics"
adr_anchors = ["ADR-0083", "ADR-0090", "ADR-0039", "ADR-0193"]
ip_anchor = "IP-015"
container_image = "ghcr.io/oyatie/analytics:<sha> (non_claim: not yet built)"
data_classification = "INTERNAL_ONLY"

[lib]
name = "oya_analytics_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-analytics-app"
path = "src/main.rs"

[dependencies]
oya-analytics-api = { path = "../oya-analytics-api" }
oya-analytics-domain = { path = "../oya-analytics-domain" }
oya-analytics-usecase = { path = "../oya-analytics-usecase" }
oya-shared-olap-client-kernel = { path = "../../../../crates/oya-shared-olap-client-kernel" }
oya-shared-olap-clickhouse-adapter = { path = "../../../../crates/oya-shared-olap-clickhouse-adapter" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
