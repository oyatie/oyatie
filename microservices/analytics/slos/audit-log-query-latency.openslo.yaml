apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-audit-log-query-latency-hot
  displayName: "Analytics Audit Log Query Latency (Hot Tier)"
  labels:
    microservice: analytics
    surface: audit-log-search
    tier: hot
    adr: "ADR-0003,ADR-0193"
spec:
  service: analytics
  description: |
    99% of audit-log queries against the hot tier (<= 90 days) return within 800ms p99.
    Cold-tier queries have a separate, looser SLO (see audit-log-query-cold-latency).
  indicator:
    metadata: { name: audit-log-query-latency-hot-p99 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_bucket{
                  service="analytics",route="/v1/audit-log/search",tier="hot",le="0.8"
                }[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_count{
                  service="analytics",route="/v1/audit-log/search",tier="hot"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 < 800ms (hot)"
      target: 0.99
  alertPolicies:
    - name: audit-log-hot-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-analytics
          - target: opsgenie-analytics
    - name: audit-log-hot-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: audit-log-hot-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: audit-log-hot-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
