apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-audit-log-query-cold-latency
  displayName: "Analytics Audit Log Query Latency (Cold Tier)"
  labels:
    microservice: analytics
    surface: audit-log-search
    tier: cold
    adr: "ADR-0003,ADR-0193"
spec:
  service: analytics
  description: |
    95% of audit-log queries against the cold tier (> 90 days) return within 2s p95.
    Cold tier is S3-compat; inherently slower than hot NVMe; SLO budget is looser.
  indicator:
    metadata: { name: audit-log-query-latency-cold-p95 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_bucket{
                  service="analytics",route="/v1/audit-log/search",tier="cold",le="2"
                }[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(http_request_duration_seconds_count{
                  service="analytics",route="/v1/audit-log/search",tier="cold"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p95 < 2s (cold)"
      target: 0.95
  alertPolicies:
    - name: audit-log-cold-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets: [{ target: pagerduty-analytics }]
    - name: audit-log-cold-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: audit-log-cold-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: audit-log-cold-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
