apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-keeper-quorum-availability
  displayName: "Analytics ClickHouse Keeper Quorum Availability"
  labels:
    microservice: analytics
    substrate: clickhouse-keeper
    adr: "ADR-0193"
spec:
  service: analytics
  description: |
    99.99% of minutes have a Keeper leader (Raft quorum healthy).
    DDL availability depends on Keeper quorum; this is the tightest SLO in the
    analytics µservice because lost-quorum blocks tenant onboard.
  indicator:
    metadata: { name: keeper-quorum-healthy }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(min_over_time(clickhouse_keeper_is_leader{cluster=~"analytics.*"}[1m])) by (cluster)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                count(clickhouse_keeper_is_leader{cluster=~"analytics.*"}) by (cluster)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.99% leader present"
      target: 0.9999
  alertPolicies:
    - name: keeper-quorum-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-analytics
          - target: opsgenie-analytics
    - name: keeper-quorum-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: keeper-quorum-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: keeper-quorum-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
