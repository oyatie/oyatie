apiVersion: openslo/v1
kind: SLO
metadata:
  name: analytics-cluster-availability
  displayName: "Analytics ClickHouse Cluster Availability"
  labels:
    microservice: analytics
    substrate: clickhouse
    adr: "ADR-0193"
spec:
  service: analytics
  description: |
    99.95% cluster availability. Cluster is "available" when ≥1 replica is up
    in every shard (3 shards × 2 replicas tolerates single-replica failure per shard).
  indicator:
    metadata: { name: cluster-available-per-shard }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(min_over_time((sum by (shard) (up{job="clickhouse-server"}) > 0)[1m:])) by (cluster)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                count(up{job="clickhouse-server"}) by (cluster) / 2
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.95% availability"
      target: 0.9995
  alertPolicies:
    - name: cluster-avail-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-analytics
          - target: opsgenie-analytics
    - name: cluster-avail-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: cluster-avail-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: cluster-avail-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
