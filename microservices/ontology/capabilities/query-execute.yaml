# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
apiVersion: foundry.oya.dev/v1
kind: Capability
metadata:
  name: ontology-query-execute
  microservice: ontology
  bounded_context: function-engine
  status: stable
  date: 2026-05-17
spec:
  intent: |
    Evaluate a Function Type against the Ontology, returning a typed read
    projection. Function reads are tenant-isolated via Postgres RLS, tier-
    filtered via projection, and Cedar-gated. OLAP variants route to the
    ClickHouse history-mirror.

  input:
    function_type:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
    arguments:
      type: object
    use_olap:
      type: boolean
      default: false

  preconditions:
    - "OIDC bearer with tenant_id + max_sensitivity_level + pillar_kind claims"
    - "Cedar permit from policy/tenant-scope.cedar for the (principal, function_type) pair"
    - "Per-tenant Function-read rate-limit budget remaining (HTTP 429 if exceeded)"
    - "Function Type schema registered + non-deprecated"

  output:
    success:
      function_result:
        $ref: "../contracts/openapi/ontology.yaml#/components/schemas/FunctionResult"
    denied:
      cedar_decision:
        type: string
    rate_limited:
      retry_after_seconds:
        type: integer

  performance_targets:
    p50: 5ms
    p99: 50ms (per ADR-0107 mandate; Bominal-inherited)
    p999: 100ms
    olap_p99: 500ms (ClickHouse mirror)

  side_effects: []  # Function reads are pure; no audit-chain emit unless Function touches Tier1Sensitive

  authority:
    enforcement_lane: oya-governance-ontology-tier-enforcement
    cedar_fragment: policy/tenant-scope.cedar
    perf_lane: oya-governance-perf-budget

  failure_modes:
    - "FM-05 (query OOM) — runbook: runbooks/query-engine-restart.md"
    - "FM-10 (ClickHouse lag) — runbook: runbooks/clickhouse-rebalance.md"
    - "Cedar deny → 403"
    - "Per-tenant rate-limit → 429"

  observability:
    metrics:
      - "oya_ontology_function_evaluations_total{function_type,olap,outcome}"
      - "oya_ontology_function_evaluation_duration_seconds{function_type,olap,quantile}"
      - "oya_ontology_function_cache_hit_total{function_type}"
    dashboards:
      - dashboards/query-latency.json

  source_evidence:
    - "Bominal ADR-0107 (Ontology agent gateway + Function p99 ≤ 50 ms)"
    - "Palantir Foundry Ontology Function model"
