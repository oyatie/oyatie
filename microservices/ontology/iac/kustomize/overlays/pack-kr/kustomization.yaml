# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ontology

bases:
  - ../../base

commonLabels:
  oyatie.dev/pack: kr
  oyatie.dev/jurisdiction: kr
  topology.kubernetes.io/region: ap-seoul-1

## Pack-kr override patches per microservices/ontology/policy/data-residency.md
patches:
  - patch: |
      - op: replace
        path: /data/pack
        value: kr
      - op: replace
        path: /data/jurisdiction
        value: kr
      - op: replace
        path: /data/postgres_pitr_bucket
        value: oya-ontology-pg-pitr-kr
      - op: replace
        path: /data/clickhouse_warm_bucket
        value: oya-ontology-ch-warm-kr
      - op: replace
        path: /data/clickhouse_cold_bucket
        value: oya-ontology-ch-cold-kr
    target:
      kind: ConfigMap
      name: ontology-config

  ## OCI region affinity — every pod pinned to ap-seoul-1 AZs
  - patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/region
                      operator: In
                      values: [ap-seoul-1]
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values: [ap-seoul-1-AD-1, ap-seoul-1-AD-2, ap-seoul-1-AD-3]
    target:
      kind: Deployment

  ## Pack-kr retention: KR-FSS production-tier extended to 5y
  - patch: |
      - op: replace
        path: /spec/values/backup/storage/retention
        value: 5y
    target:
      kind: HelmRelease
      name: ontology-postgres

## Pack-kr per-pack Cedar overlay fragment (PIPA Art. 23 enforcement)
resources:
  - cedar-overlay-pack-kr-pipa.yaml

configMapGenerator:
  - name: ontology-config-pack-kr
    literals:
      - pack=kr
      - jurisdiction=kr
      - postgres_pitr_bucket=oya-ontology-pg-pitr-kr
      - clickhouse_warm_bucket=oya-ontology-ch-warm-kr
      - clickhouse_cold_bucket=oya-ontology-ch-cold-kr
      - audit_log_retention_days=1095     # 3y for production-tier per KR-FSS

images:
  ## Pack-kr always pulls from OCI ap-seoul-1 registry mirror
  - name: oci.oyatie.dev/oya-ontology-object-type-registry-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-object-type-registry-app
  - name: oci.oyatie.dev/oya-ontology-entity-store-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-entity-store-app
  - name: oci.oyatie.dev/oya-ontology-function-engine-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-function-engine-app
  - name: oci.oyatie.dev/oya-ontology-action-engine-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-action-engine-app
  - name: oci.oyatie.dev/oya-ontology-audit-chain-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-audit-chain-app
  - name: oci.oyatie.dev/oya-ontology-agent-gateway-app
    newName: ap-seoul-1.oci.oyatie.dev/oya-ontology-agent-gateway-app
