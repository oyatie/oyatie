# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ontology

commonLabels:
  app.kubernetes.io/part-of: oya-ontology
  app.kubernetes.io/managed-by: kustomize
  oyatie.dev/microservice: ontology

resources:
  ## Helm chart manifest references (rendered via `kustomize build --enable-helm`)
  - ../../helm/postgres
  - ../../helm/clickhouse
  - ../../helm/cedar-policy-engine

  ## Per-BC ontology Layer-B apps (composition-root binaries from IP-015)
  - manifests/ontology-object-type-registry-app.yaml
  - manifests/ontology-link-type-registry-app.yaml
  - manifests/ontology-action-type-registry-app.yaml
  - manifests/ontology-function-type-registry-app.yaml
  - manifests/ontology-entity-store-app.yaml
  - manifests/ontology-link-store-app.yaml
  - manifests/ontology-function-engine-app.yaml
  - manifests/ontology-action-engine-app.yaml
  - manifests/ontology-query-engine-app.yaml
  - manifests/ontology-agent-gateway-app.yaml
  - manifests/ontology-audit-chain-app.yaml

  ## Network policies + Cedar fragment ConfigMap
  - network-policies.yaml
  - cedar-fragments-configmap.yaml

  ## OpenSLO manifests (consumed by observability µservice's slo-engine-worker)
  - ../../../slos/function-read-availability.openslo.yaml
  - ../../../slos/function-read-latency.openslo.yaml
  - ../../../slos/action-invocation-availability.openslo.yaml
  - ../../../slos/audit-chain-emission-completeness.openslo.yaml
  - ../../../slos/dynamic-layer-freshness.openslo.yaml

configMapGenerator:
  - name: ontology-config
    literals:
      - tenant_isolation_mode=force_rls
      - citus_multi_shard_modify_mode=strict
      - audit_chain_seal_cadence_seconds=60
      - cedar_default_deny=true
      - dynamic_layer_freshness_budget_seconds=2

secretGenerator:
  - name: ontology-secrets
    type: oyatie.dev/openbao-secret-reference
    literals:
      - postgres-app-role-ref=secret/ontology/postgres-app-role
      - openbao-ed25519-signing-key-ref=secret/ontology/audit-chain-signing
      - kafka-mtls-cert-ref=secret/ontology/kafka-mtls
      - clickhouse-app-role-ref=secret/ontology/clickhouse-app-role

generatorOptions:
  disableNameSuffixHash: true

patches:
  ## Inject pod-identity SPIFFE annotations on every Layer-B app
  - patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value:
          spiffe.io/spiffe-id-template: spiffe://oyatie/ontology/{{ .Values.appName }}
    target:
      kind: Deployment

vars:
  - name: PACK
    objref:
      kind: ConfigMap
      name: ontology-config
      apiVersion: v1
    fieldref:
      fieldpath: data.pack
