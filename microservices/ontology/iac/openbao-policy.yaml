# OpenBao policy bindings for ontology µservice
# Authority: ADR-0296 library-first credential sidecar; ADR-0255 §D-4 provider-credential BYOK
# Path shape: ${openbao:secret/<tenant_id>/<scope>/<name>}

apiVersion: openbao.io/v1
kind: PolicyBinding
metadata:
  name: ontology-openbao-policy
spec:
  policies:
    - name: ontology-write-path
      paths:
        - "secret/data/+/ontology/write/*":
            capabilities: [read]
            ttl_seconds: 60
        - "secret/data/+/ontology/audit-signing-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: ontology-read-path-library
      paths:
        - "secret/data/+/ontology/read-cache-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: ontology-share-token
      paths:
        - "secret/data/+/ontology/share-token-signing-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: ontology-tenant-byok
      paths:
        - "secret/data/+/byok/intelligence-provider":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.ontology.tenant-byok-mint
  sidecar:
    enabled: true
    image: openbao-sidecar:1.18
    ttl_seconds: 60
    refresh_advance_seconds: 10
    audit_emit_class: oya.ontology.credential-mint
