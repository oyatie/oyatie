apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-ontology-write-quota-adapter-postgres
  namespace: ontology
spec:
  microservice: ontology
  bounded_context: write-path
  layer: adapter
  language: rust
  binding_adrs:
    - ADR-0297
    - ADR-0257
  cedar_fragment: policy/ontology-write-quota.cedar
  storage:
    backend: postgres
    table: ontology_write_quota_ledger
    rls_enabled: true
  emits_audit_classes:
    - oya.ontology.write-quota-deny
    - oya.ontology.write-quota-grant
    - oya.ontology.write-quota-recharge
