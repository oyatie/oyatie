# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
apiVersion: catalog.oya.dev/v1
kind: Crate
metadata:
  name: oya-ontology-sdk
  microservice: ontology
  bounded_context: cross-bc
  layer: sdk
  status: pending
spec:
  bnf_v4_1_justification: |
    microservice = ontology; layer = sdk. Closes the industry-standard Ontology
    SDK gap (Palantir Foundry SDK + Salesforce SOAP/REST SDK parity).
    Re-exports kernel types + per-BC clients (object-type-registry-sdk,
    entity-store-sdk, function-engine-sdk, action-engine-sdk, agent-gateway-sdk,
    audit-chain-sdk). Type-safe builder pattern; OIDC auth; retry +
    circuit breaker; OpenTelemetry instrumentation.
  external_deps: [reqwest, tonic, tower, opentelemetry, uuid]
  related_ip: IP-014
  related_adrs: [ADR-0056, ADR-0059, ADR-0105, ADR-0106]
