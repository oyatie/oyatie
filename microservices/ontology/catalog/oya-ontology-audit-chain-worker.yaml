# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
apiVersion: catalog.oya.dev/v1
kind: Crate
metadata:
  name: oya-ontology-audit-chain-worker
  microservice: ontology
  bounded_context: audit-chain
  layer: worker
  status: pending
spec:
  bnf_v4_1_justification: |
    microservice = ontology; bc-tokens = audit-chain; layer = worker.
    Outbox-consumer worker: consume ontology.events.* topics from Kafka;
    append events to per-tenant per-period Merkle tree; seal segments every
    60s OR 10^4 events via Ed25519 from OpenBao Transit.
  imports: [oya-ontology-audit-chain-usecase, oya-ontology-audit-chain-domain,
            oya-ontology-audit-chain-kernel]
  external_deps: [rdkafka, ed25519-dalek, openbao-rs]
  shard_key: tenant_id
  hsm_backed: true  # for pack-us-healthcare + pack-eu where available
  related_ip: IP-010
  related_adrs: [ADR-0028, ADR-0117]
