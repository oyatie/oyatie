apiVersion: openslo/v1
kind: SLO
metadata:
  name: ontology-audit-chain-emission-completeness
  displayName: "Ontology Audit Chain Emission Completeness (100 %)"
  labels:
    microservice: ontology
    bc: audit-chain
    tier: substrate
spec:
  service: ontology
  description: |
    Completeness of audit-chain emission. Every Action invocation must
    produce an audit-chain seal entry; zero tolerance per Bominal ADR-0028.
    A breach here indicates an outbox or audit-chain worker failure that
    threatens provenance claims; PIPC/OCR/DPA notification chain may be
    required if Tier1Sensitive data was affected during the gap.
  indicator:
    metadata:
      name: ontology-audit-chain-emission-completeness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(oya_ontology_audit_chain_seal_total[1m]))
        total:
          metricSource:
            metricSourceRef: prometheus
            type: prometheus
            spec:
              query: |
                sum(rate(oya_ontology_action_invocations_total{outcome="success"}[1m]))
  objectives:
    - displayName: 100 % emission (zero tolerance)
      target: 1.0
      op: gte
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - oya-burn-rate-fast-1h   # any breach pages immediately
