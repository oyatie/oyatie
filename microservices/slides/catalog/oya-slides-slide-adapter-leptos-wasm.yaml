# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-slides-slide-adapter-leptos-wasm
microservice: slides
bounded_context: slide
layer: adapter-leptos-wasm
purpose: |
  Leptos WASM SVG rendering of Slide entities. Per ADR-SLIDES-0002 + ADR-0105 Amd.3.
  Compile-target wasm32-unknown-unknown; SVG-baseline + canvas-2d tier per ADR-SLIDES-0002.
depends_on:
  - oya-slides-slide-kernel
  - leptos
  - wasm-bindgen
  - web-sys
backend: leptos-wasm
ci_lanes:
  - wasm-bundle-sri
  - layer-correctness
  - present-mode-frame-budget
  - reduced-motion-fallback-mandatory
