# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-slides-real-time-collaboration-kernel
microservice: slides
bounded_context: real-time-collaboration
layer: kernel
purpose: |
  Port-trait declarations for Loro CRDT engine + editor-session lease + WS dispatcher.
  Per ADR-SLIDES-0001: Loro types NEVER leak through port signatures.
ports_declared:
  - CrdtMergeEngine
  - EditorSessionStore
  - WebSocketGatewayDispatcher
  - HmacVerifier
  - PerSlideAclFilter
entities:
  - CrdtState
  - MergeOp
  - Conflict
  - EditorSession
data_classes:
  - BEHAVIORAL_TENANT_PRODUCT
  - SPEAKER_NOTE
  - INTERNAL_ONLY
ci_lanes:
  - lean-a1
  - port-location
  - layer-correctness
  - data-class
  - no-loro-leakage-through-ports
