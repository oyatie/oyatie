# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-slides-import-export-adapter-chromium-headless
microservice: slides
bounded_context: import-export
layer: adapter-chromium-headless
purpose: |
  Chromium-headless PDF/PNG renderer fallback for decks with CSS unrenderable by WeasyPrint.
  gVisor-sandboxed. Post-processed via qpdf for PDF/A-1b conformance.
  Per ADR-SLIDES-0003 + ADR-0105 Amd.3.
depends_on:
  - oya-slides-import-export-kernel
  - chromium-headless-shell
backend: chromium-headless
ci_lanes:
  - gvisor-isolation
  - pdf-a-conformance
  - cargo-nextest
