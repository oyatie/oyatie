# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-save-latency
  displayName: Slides — Save round-trip latency
  labels:
    microservice: slides
    bounded_context: presentation
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-presentation-rest
  description: |
    p95 ≤ 100ms for save delta. Per PRD §"Performance".
  indicator:
    metadata: { name: save-p95-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_save_seconds_bucket{le="0.1"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_save_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% save ≤ 100ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: save-burn-rate-high }
      spec:
        notificationTargets: [{ target: grafana-oncall:slides-sev2 }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.85, lookbackWindow: 1h, alertAfter: 0m }
