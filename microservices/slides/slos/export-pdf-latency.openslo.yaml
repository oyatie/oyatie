# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-slides-export-pdf-latency
  displayName: Slides — Export PDF latency (50-slide deck)
  labels:
    microservice: slides
    bounded_context: import-export
    sli_kind: latency
    tier: external-facing
    plane: data
spec:
  service: oya-slides-import-export-worker
  description: |
    p95 ≤ 3s for PDF export of 50-slide deck. Per PRD §"Performance" + ADR-SLIDES-0003.
  indicator:
    metadata: { name: export-pdf-p95-sli }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_export_pdf_seconds_bucket{le="3.0"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_slides_export_pdf_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% PDF export ≤ 3s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata: { name: export-pdf-burn-rate }
      spec:
        notificationTargets: [{ target: grafana-oncall:slides-sev3 }]
        conditions:
          - kind: AlertCondition
            spec: { op: lt, threshold: 0.85, lookbackWindow: 1h, alertAfter: 0m }
