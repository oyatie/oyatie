# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the slides cluster, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier, per-pack theme/template
# signing-key references, per-pack AI-policy + reduced-motion default.
# Per ADR-0131 + multi-region.md DR posture.

namespace: slides

resources:
  - namespace.yaml

helmCharts:
  - name: oya-slides
    valuesFile: ../../helm/values.yaml
    releaseName: slides
    namespace: slides

commonLabels:
  app.kubernetes.io/part-of: oya-slides
  oyatie/microservice: slides
