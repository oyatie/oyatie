{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-slides-networkpolicy
  namespace: slides
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oya-slides
  policyTypes: [Egress, Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { name: ingress-gateway }
      ports:
        - { protocol: TCP, port: {{ .Values.service.port }} }
        - { protocol: TCP, port: {{ .Values.service.metricsPort }} }
  egress:
    {{- range .Values.networkPolicy.egress }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { app.kubernetes.io/name: "{{ .to }}" }
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
