{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-slides-monitor
  namespace: slides
  labels:
    oyatie/microservice: slides
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-slides
  endpoints:
    {{- range .Values.serviceMonitor.endpoints }}
    - port: {{ .port }}
      path: {{ .path }}
      interval: {{ $.Values.serviceMonitor.interval }}
    {{- end }}
{{- end }}
