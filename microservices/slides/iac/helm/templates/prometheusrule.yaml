{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-slides-rules
  namespace: slides
  labels:
    oyatie/microservice: slides
spec:
  groups:
    - name: slides-burn-rate
      interval: 30s
      rules:
        - alert: SlidesEditorBurnRateHigh
          expr: |
            (sum(rate(oya_slides_save_seconds_count{status_code=~"5.."}[1h]))
             / sum(rate(oya_slides_save_seconds_count[1h]))) > 0.005 * 14.4
          for: 5m
          labels: { severity: sev-2, microservice: slides }
          annotations:
            summary: "Editor burn-rate 14.4x over 1h budget"
            runbook_url: https://docs.oyatie.dev/runbooks/slides/burn-rate

        - alert: SlidesCollabSilentLossDetected
          expr: |
            sum(rate(oya_slides_collab_silent_loss_attempt_total[5m])) > 0
          for: 1m
          labels: { severity: sev-1, microservice: slides }
          annotations:
            summary: "AC-06 invariant violated — silent CRDT loss detected"
            runbook_url: https://docs.oyatie.dev/runbooks/slides/collab-conflict-resolution-crdt

        - alert: SlidesBroadcastSignalDegraded
          expr: |
            avg(oya_slides_broadcast_signal_health) < 0.95
          for: 5m
          labels: { severity: sev-2, microservice: slides }
          annotations:
            summary: "Broadcast-mode LiveKit signaling degraded"
            runbook_url: https://docs.oyatie.dev/runbooks/slides/broadcast-mode-degraded

        - alert: SlidesExportWorkerOomSpike
          expr: |
            sum(rate(oya_slides_export_worker_oom_total[5m])) > 1
          for: 1m
          labels: { severity: sev-2, microservice: slides }
          annotations:
            summary: "gVisor export worker OOM rate > 3/5min"
            runbook_url: https://docs.oyatie.dev/runbooks/slides/export-pipeline-failure-pptx

        - alert: SlidesAiActHighRiskEngagedWithoutOverride
          expr: |
            sum(rate(oya_slides_ai_high_risk_annex_iii_engaged_total{pack_override="false"}[5m])) > 0
          for: 1m
          labels: { severity: sev-1, microservice: slides }
          annotations:
            summary: "EU AI Act Annex III high-risk T2 engaged without pack override — investigate immediately"
            runbook_url: https://docs.oyatie.dev/runbooks/slides/ai-act-risk-class
{{- end }}

    - name: slides-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: slides-llm-capability-circuit-open
          expr: max(oya_slides_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: slides
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "slides LLM/capability circuit-breaker tripped open"
        - alert: slides-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_slides_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: slides
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "slides capability retry-budget exhausted"

    - name: slides-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: slides-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_slides_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: slides
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "slides tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: slides-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: slides-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"slides-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: slides
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "slides pod CPU saturation > 70% sustained 10m"
        - alert: slides-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_slides_responses_5xx_total[5m]))
            /
            sum(rate(oya_slides_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: slides
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "slides 5xx rate > 1% sustained 5m"
        - alert: slides-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_slides_responses_total[5m]))
              /
              sum(rate(oya_slides_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: slides
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "slides inbound RPS dropped > 90% vs prior hour"

    - name: slides-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: slides-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_slides_request_success_total[1h]))
              /
              sum(rate(oya_slides_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: slides
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "slides aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: slides-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_slides_request_success_total[6h]))
              /
              sum(rate(oya_slides_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: slides
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "slides aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
