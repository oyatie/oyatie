apiVersion: openslo/v1
kind: SLO
metadata:
  name: enterprise-suite-availability
  labels:
    service: enterprise-suite
    sap_code: "suite"
spec:
  description: "Enterprise Suite API availability objective for governed HR, payroll, accounting, and ERP composition routes; production evidence remains unclaimed until runtime telemetry lands."
  service: enterprise-suite
  indicator:
    metadata:
      name: enterprise-suite-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_count{service=\"enterprise-suite\",http_response_status_code=~\"2..|3..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_count{service=\"enterprise-suite\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: enterprise-suite-availability
      target: 0.999
