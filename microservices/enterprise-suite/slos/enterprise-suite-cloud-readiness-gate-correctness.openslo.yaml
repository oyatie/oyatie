apiVersion: openslo/v1
kind: SLO
metadata:
  name: enterprise-suite-cloud-readiness-gate-correctness
  labels:
    service: enterprise-suite
    sap_code: "suite"
spec:
  description: "Enterprise Suite cloud-readiness gate correctness objective: cloud claims must remain blocked whenever listener, IdP, durable storage, Workflow, audit, deployment, or production SLO evidence is missing."
  service: enterprise-suite
  indicator:
    metadata:
      name: enterprise-suite-cloud-readiness-gate-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(enterprise_cloud_readiness_gate_result_total{service=\"enterprise-suite\",result=\"correct\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(enterprise_cloud_readiness_gate_result_total{service=\"enterprise-suite\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: enterprise-suite-cloud-readiness-gate-correctness
      target: 0.9999
