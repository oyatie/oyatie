apiVersion: openslo/v1
kind: SLO
metadata:
  name: enterprise-suite-audit-emission-lag-p99
  labels:
    service: enterprise-suite
    sap_code: "suite"
spec:
  description: "Enterprise Suite audit-chain emission freshness objective for later WAL/outbox/Merkle runtime integration; production evidence remains unclaimed until runtime telemetry lands."
  service: enterprise-suite
  indicator:
    metadata:
      name: enterprise-suite-audit-emission-lag-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(audit_chain_emit_lag_bucket{service=\"enterprise-suite\",le=\"30\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(audit_chain_emit_lag_count{service=\"enterprise-suite\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: enterprise-suite-audit-emission-lag-p99
      target: 0.99
