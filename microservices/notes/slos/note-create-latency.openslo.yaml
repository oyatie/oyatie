# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: notes-note-create-latency
  displayName: "notes: note-create latency p95 ≤ 30ms"
  labels:
    microservice: notes
    bc: note-store
    sli_class: latency
    owner_team: axis-notes
spec:
  description: |
    Latency SLO for note-create. A request is "good" when end-to-end
    latency (REST POST → Postgres insert + Cedar + audit-chain seal where applicable)
    is ≤ 30ms p95. Distribution captured via Histogram.
  service: notes
  indicator:
    metadata:
      name: notes-note-create-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_note_create_duration_seconds_bucket{le="0.03"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_notes_note_create_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 30ms for 95 % of 5min windows over 30d"
