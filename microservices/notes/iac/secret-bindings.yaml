# External Secrets Operator + OpenBao bindings for notes

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: notes-openbao
spec:
  provider:
    vault:
      server: https://openbao.oyatie-internal.example:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: notes
          serviceAccountRef:
            name: notes-app
            namespace: notes
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notes-mls-group-key
  namespace: notes
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: notes-openbao
    kind: ClusterSecretStore
  target:
    name: notes-mls-group-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: notes/mls-group-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notes-share-token-signing-key
  namespace: notes
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: notes-openbao
    kind: ClusterSecretStore
  target:
    name: notes-share-token-signing-key
  dataFrom:
    - extract:
        key: notes/share-token-signing-key
