# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes
resources: [../../base]
commonAnnotations:
  oyatie/pack: "eu"
  oyatie/region: "eu-central-1"
  oyatie/legal-citations: |
    GDPR Arts. 5/6/9/17/22/25/32/44-50 + Recital 26 pseudonymisation.
    EU AI Act Art. 50 transparency for AI features. E2E personal-tier default ON.
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--component=note-store-rest", "--pack=eu"]
    target:
      kind: Deployment
      name: notes-note-store-rest
