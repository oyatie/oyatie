# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes
commonLabels:
  app.kubernetes.io/name: notes
  app.kubernetes.io/part-of: oya-notes
resources:
  - namespace.yaml
helmCharts:
  - name: oya-notes
    repo: file://../../helm/notes
    version: 0.1.0
    releaseName: notes
    valuesFile: ../../helm/notes/values.yaml
