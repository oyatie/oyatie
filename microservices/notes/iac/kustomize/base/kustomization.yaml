apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes
commonLabels:
  app.kubernetes.io/name: notes
  app.kubernetes.io/part-of: oya-notes
resources:
  - namespace.yaml
helmCharts:
  - name: oya-notes
    repo: file://../../helm/notes
    version: 0.1.0
    releaseName: notes
    valuesFile: ../../helm/notes/values.yaml
