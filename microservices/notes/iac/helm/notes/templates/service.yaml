# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: notes-rest
  namespace: notes
  labels: {app.kubernetes.io/name: notes}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: note-store-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-collab-edit
  namespace: notes
  labels: {app.kubernetes.io/name: notes}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: collab-edit-gateway
  ports:
    - {name: wss, port: 443, targetPort: 8443}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-web-clipper
  namespace: notes
  labels: {app.kubernetes.io/name: notes}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: web-clipper-bridge-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
