apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notes-burn-rate-rules
  namespace: notes
  labels:
    app.kubernetes.io/name: notes
    prometheus: mimir
spec:
  groups:
    - name: notes-recording-rules
      interval: 60s
      rules:
        - record: notes:note_create:availability_5m
          expr: |
            sum(rate(oya_notes_note_create_total{result="success"}[5m]))
            /
            sum(rate(oya_notes_note_create_total[5m]))
        - record: notes:sync:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_notes_sync_latency_seconds_bucket[5m]))
            )

    - name: notes-burn-rate-alerts
      rules:
        - alert: NotesNoteCreateFastBurn1h
          expr: |
            (1 - notes:note_create:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: notes
          annotations:
            summary: "notes note-create fast-burn (14.4x) for 5m"

        - alert: NotesNoteCreateSlowBurn6h
          expr: |
            (1 - avg_over_time(notes:note_create:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: notes

        - alert: NotesE2ELeakageDetected
          expr: |
            increase(oya_notes_e2e_content_to_inference_attempts_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: e2e-personal-tier-default
            microservice: notes
          annotations:
            summary: "notes E2E invariant violation: AI feature attempted to read E2E note content"
            runbook_url: "https://oyatie.dev/microservices/notes/runbooks/ai-classifier-rollback-e2e-respect"

    - name: notes-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: notes-llm-capability-circuit-open
          expr: max(oya_notes_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: notes
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "notes LLM/capability circuit-breaker tripped open"
        - alert: notes-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_notes_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: notes
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "notes capability retry-budget exhausted"

    - name: notes-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: notes-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_notes_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: notes
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "notes tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: notes-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: notes-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"notes-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: notes
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "notes pod CPU saturation > 70% sustained 10m"
        - alert: notes-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_notes_responses_5xx_total[5m]))
            /
            sum(rate(oya_notes_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: notes
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "notes 5xx rate > 1% sustained 5m"
        - alert: notes-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_notes_responses_total[5m]))
              /
              sum(rate(oya_notes_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: notes
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "notes inbound RPS dropped > 90% vs prior hour"

    - name: notes-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: notes-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_notes_request_success_total[1h]))
              /
              sum(rate(oya_notes_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: notes
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "notes aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: notes-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_notes_request_success_total[6h]))
              /
              sum(rate(oya_notes_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: notes
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "notes aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
