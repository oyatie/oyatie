# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-notes
description: |
  Helm chart for the notes µservice — note-store / tag-graph / backlink-graph /
  daily-note / web-clipper-bridge / collab-edit / e2e-key-management / search-index /
  template-gallery / checklist / version-history / share-link / embed-resolver /
  import-export BCs deployed as horizontally-scaled, tenant-sharded, E2E-default
  workloads. Per ADR-0131 flat layout + ADR-0139 SLO-gated promotion + ADR-NOTES-0001
  Personal-tier E2E-default invariant.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-notes
    email: axis-notes@oyatie.com
keywords:
  - notes
  - quick-capture
  - bidirectional-links
  - e2e-encryption
  - personal-tier
  - obsidian-class
  - notion-quick-note
dependencies:
  - name: meilisearch
    version: "0.10.0"
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
