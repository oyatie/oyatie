# BuildKit Job that builds the llm-gateway image (per ADR-0381 D1).
# Context: the full git repo (workspace root) — the binary depends on workspace
# siblings. context-sub-path is empty (we want the root); the Dockerfile is at
# microservices/llm-gateway/Dockerfile, referenced via --opt filename=...
#
# Cache backend: SeaweedFS-on-Talos (ADR-0381 D4) on the shared
# oya-ci-buildkit-cache bucket. Cell-pinned (soft) to oya.cell/ci.
#
# Re-run: delete + re-apply (or bump the image tag in --output).
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-gateway-image-build
  namespace: oya-ci
  labels:
    oya.adr/decided-by: ADR-0381-D1
    oya.microservice: llm-gateway
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/ci
                    operator: In
                    values: ["true"]
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      volumes:
        - name: cosign-key
          secret:
            secretName: cosign-key
            items:
              - key: cosign-key
                path: cosign-key
      containers:
        - name: buildctl
          image: moby/buildkit:v0.18.2-rootless
          workingDir: /workspace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              CONTEXT_URL="https://${GIT_USERNAME}:${GIT_PASSWORD}@github.com/jason931225/oyatie.git#refs/heads/dev"
              CACHE_PARAMS="type=s3,region=oya-local,bucket=oya-ci-buildkit-cache,endpoint_url=http://seaweedfs-bucket-api.oya-storage.svc.cluster.local:8333,access_key_id=oya-ci-anon,secret_access_key=oya-ci-anon,use_path_style=true"
              buildctl --addr "tcp://buildkitd.oya-ci.svc.cluster.local:1234" \
                build \
                --frontend dockerfile.v0 \
                --opt "context=${CONTEXT_URL}" \
                --opt "filename=microservices/llm-gateway/Dockerfile" \
                --output "type=image,name=registry.oya-registry.svc.cluster.local:5000/llm-gateway:dev,push=true,registry.insecure=true" \
                --import-cache "${CACHE_PARAMS}" \
                --export-cache "${CACHE_PARAMS},mode=max"
              cosign sign --key oya-ci/cosign-key registry.oya-registry.svc.cluster.local:5000/llm-gateway:dev
          env:
            - name: GIT_USERNAME
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: username } }
            - name: GIT_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-build-git, key: token } }
            - name: COSIGN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cosign-key
                  key: password
                  optional: true
          volumeMounts:
            - name: cosign-key
              mountPath: /workspace/oya-ci
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "4Gi" }
