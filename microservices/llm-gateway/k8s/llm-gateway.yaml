# llm-gateway K8s deployment manifest — Namespace + ConfigMap + ExternalSecret
# + Deployment + Service.
#
# Implementation status: kernel + rest adapter + app are 100%-Rust-implemented
# (crates/oya-llm-gateway-{kernel,rest,app}; ~5,600 LOC + 30 tests). This file
# wires the binary into the cluster.
#
# Reads (per crates/oya-llm-gateway-rest/src/main.rs):
#   - $GATEWAY_CONFIG — path to a ConfigMap-mounted JSON file (NO secrets).
#   - $BAO_TOKEN — only secret env; from k8s Secret (projected via ESO from
#     OpenBao path sref://openbao/oya/llm-gateway/bao-token).
#   - $ADMIN_TOKEN + $INGRESS_PROXY_KEYS — auth tokens from the same Secret.
#
# Provider API keys (OpenAI/Anthropic/Gemini) live in OpenBao under
# sref://openbao/oya/llm-gateway/<group>/keys and are loaded by the rest
# adapter at startup + on a periodic refresh.
#
# Cell affinity (ADR-0381 D2 preview; soft preference so single-node still
# schedules): tenant cell (this is a tenant-tier workload, not foundation/ci/
# storage).
---
apiVersion: v1
kind: Namespace
metadata:
  name: oya-llm-gateway
  labels:
    oya.io/cell: tenant
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Declarative non-secret config. Fill these in from your actual deployment;
# this is the wire-shape the rest adapter reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: oya-llm-gateway
data:
  config.json: |
    {
      "listen_addr": "0.0.0.0:8080",
      "openbao": {
        "address": "http://openbao.oya-kms.svc.cluster.local:8200",
        "mount": "secret",
        "key_refresh_interval_seconds": 300
      },
      "groups": []
    }
---
# ExternalSecret (per ADR-0043) projecting tokens from OpenBao into a k8s
# Secret named llm-gateway-secrets. The reference (sref://openbao/oya/...) is
# the canonical path; the secret value never appears in this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-secrets
  namespace: oya-llm-gateway
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: llm-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: bao-token
      remoteRef:
        key: oya/llm-gateway/bao-token
    - secretKey: admin-token
      remoteRef:
        key: oya/llm-gateway/admin-token
    - secretKey: ingress-proxy-keys
      remoteRef:
        key: oya/llm-gateway/ingress-proxy-keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: oya-llm-gateway
  labels:
    app: llm-gateway
    oya.microservice: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      # ADR-0381 D2 soft cell affinity: prefer tenant pool when it exists.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: oya.cell/tenant
                    operator: In
                    values: ["true"]
      containers:
        - name: llm-gateway
          # Image is built via BuildKit (per ADR-0381 D1); operator runs the
          # build Job at microservices/llm-gateway/k8s/buildkit-build.yaml
          # (deferred until operator authorization — see microservices/llm-
          # gateway/k8s/BUILDKIT-JOB-TEMPLATE.md). Before first deploy, the
          # image must exist in the in-cluster registry.
          image: registry.oya-registry.svc.cluster.local:5000/llm-gateway:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GATEWAY_CONFIG
              value: "/etc/llm-gateway/config.json"
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: bao-token
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: admin-token
            - name: INGRESS_PROXY_KEYS
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: ingress-proxy-keys
          volumeMounts:
            - name: config
              mountPath: /etc/llm-gateway
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532   # distroless:nonroot
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: llm-gateway-config
            items:
              - key: config.json
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: oya-llm-gateway
  labels:
    app: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
