[package]
name = "oya-llm-gateway-oauth-pool-openbao-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Real OpenBao Transit envelope-encryption adapter for the llm-gateway OAuth
# subscription pool (ADR-0384 Path B, Stage-7 D8 production seam).
#
# Implements `OpenBaoSecretStore` from `oya-llm-gateway-oauth-pool-rest` via
# direct HTTP to OpenBao's `/v1/transit/encrypt|decrypt/<key_name>` endpoints.
# Refresh tokens are stored envelope-encrypted under `/v1/secret/data/<key>/<handle>`.
#
# ADR citations: ADR-0083 (Tier-3 panic-free), ADR-0105, ADR-0131, ADR-0181,
#                ADR-0183, ADR-0384.

[lib]
name = "oya_llm_gateway_oauth_pool_openbao_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-llm-gateway-oauth-pool-kernel = { path = "../oya-llm-gateway-oauth-pool-kernel" }
oya-llm-gateway-oauth-pool-rest = { path = "../oya-llm-gateway-oauth-pool-rest" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes.workspace = true
base64 = "0.22"
# reqwest not yet in workspace deps — pinned directly per ADR-0090 blessed-allowlist.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
httpmock = "0.7"
serde_json.workspace = true

[lints]
workspace = true
