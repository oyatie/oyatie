apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-audit-chain-seal-latency
  displayName: Cloud-billing audit-chain seal latency
  labels:
    microservice: cloud-billing
    bounded_context: audit-chain-emission
    related_adr: ADR-0263
spec:
  description: |
    Latency from event commit (Postgres ledger write) to audit-chain seal
    acknowledgment. Target p99 ≤ 30 ms per ADR-0263 audit-emission contract.

    No event is acknowledged to the producer until sealed; pending events
    queue and are retried.
  service: cloud-billing
  indicator:
    metadata:
      name: audit-chain-seal-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_audit_chain_seal_seconds_bucket{le="0.030"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_audit_chain_seal_seconds_count[5m]))
  objectives:
    - displayName: Seal p99 within 30ms
      target: 0.99
    - displayName: Seal availability
      target: 0.9999
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-audit-chain-seal-pager
