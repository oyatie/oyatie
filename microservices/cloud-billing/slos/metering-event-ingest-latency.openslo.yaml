apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-metering-event-ingest-latency
  displayName: Cloud-billing metering event ingest latency
  labels:
    microservice: cloud-billing
    bounded_context: metering-bus
    keystone_adr: ADR-0330
spec:
  description: |
    Latency from CloudBillingEvent emission to ledger acknowledgment (incl.
    Postgres unique-constraint check + Kafka commit + audit-chain seal).
    Target p99 ≤ 35 ms.

    Sustained throughput per cell: 5,000,000 events/sec, with burst capacity
    18,000,000 events/sec.
  service: cloud-billing
  indicator:
    metadata:
      name: metering-event-ingest-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_metering_ingest_seconds_bucket{le="0.035"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_metering_ingest_seconds_count[5m]))
  objectives:
    - displayName: Metering ingest p99 within 35ms
      target: 0.99
    - displayName: Sustained ingest throughput floor (per cell)
      target: 5000000
      op: gte
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-metering-bus-latency-pager
    - cloud-billing-metering-bus-throughput-floor
