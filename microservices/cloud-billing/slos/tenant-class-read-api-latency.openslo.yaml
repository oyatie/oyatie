apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-tenant-class-read-api-latency
  displayName: Cloud-billing tenant_class read API latency
  labels:
    microservice: cloud-billing
    bounded_context: tenant-class-api
    keystone_adr: ADR-0330
    consumer: cloud-iam
spec:
  description: |
    Latency of cloud-iam's GetTenantClass(tenant_id) call to cloud-billing.
    Hot read path on every principal-issuance event; target p99 ≤ 10 ms.

    Cache TTL at cloud-iam side is 60s; tenant-class-mutated events trigger
    explicit cache invalidation.
  service: cloud-billing
  indicator:
    metadata:
      name: tenant-class-read-api-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_tenant_class_read_seconds_bucket{le="0.010"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_tenant_class_read_seconds_count[5m]))
  objectives:
    - displayName: tenant_class read p99 within 10ms
      target: 0.99
    - displayName: tenant_class read p999 within 25ms
      target: 0.999
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-tenant-class-api-latency-pager
