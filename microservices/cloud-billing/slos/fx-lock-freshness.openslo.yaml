apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-fx-lock-freshness
  displayName: Cloud-billing FX lock freshness
  labels:
    microservice: cloud-billing
    bounded_context: fx-lock-service
    keystone_adr: ADR-0330
spec:
  description: |
    Age of the most recent FX lock per (base, quote) currency pair. ECB-daily
    fiat rates target 30 min staleness post-publication. Vendor mid-rate
    stable-coin sources target 5 min staleness.

    Stale rates are not used; settlement waits or alerts.
  service: cloud-billing
  indicator:
    metadata:
      name: fx-lock-freshness
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              time() - max(cloud_billing_fx_lock_last_fetched_at_seconds) by (feed_source, base_currency, quote_currency)
  objectives:
    - displayName: ECB fiat lock fresher than 30 min
      op: lte
      target: 1800
    - displayName: Vendor stable-coin lock fresher than 5 min
      op: lte
      target: 300
  timeWindows:
    - duration: 24h
      isRolling: true
  alertPolicies:
    - cloud-billing-fx-feed-outage-pager
