apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-billing-focus-export-completion-time
  displayName: Cloud-billing FOCUS 1.1 export completion time
  labels:
    microservice: cloud-billing
    bounded_context: focus-export-adapter
    counterpart: aws-cur
spec:
  description: |
    Time from FOCUS export trigger to parquet object write completion. Target
    p99 ≤ 90 seconds per tenant per month for typical workloads; large tenants
    (>1B events/month) may take longer and are tracked separately.
  service: cloud-billing
  indicator:
    metadata:
      name: focus-export-completion-time
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_focus_export_seconds_bucket{le="90"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(cloud_billing_focus_export_seconds_count[5m]))
  objectives:
    - displayName: FOCUS export within 90s
      target: 0.99
    - displayName: FOCUS export within 30s
      target: 0.50
  timeWindows:
    - duration: 30d
      isRolling: true
  alertPolicies:
    - cloud-billing-focus-export-pager
