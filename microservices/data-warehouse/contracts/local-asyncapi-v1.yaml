asyncapi: 3.1.0
info:
  title: Data Warehouse Local Operational Events
  version: 1.0.0
  description: Events for warehouse pipeline scheduling, SLA-tier enforcement, dimensional completeness, query serving, and lineage operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  data-warehouse.local-ops.v1:
    address: data-warehouse.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/data-warehouse.local-ops.v1'
    messages:
      - $ref: '#/channels/data-warehouse.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/data-warehouse.local-ops.v1'
    messages:
      - $ref: '#/channels/data-warehouse.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: DataWarehouseDomainEvent
      title: Data Warehouse domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['pipeline.partition.refreshed', 'sla.tier.assigned', 'lineage.edge.captured', 'schema.change.approved'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['warehouse_table', 'dimension_snapshot', 'fact_partition', 'lineage_edge', 'sla_tier', 'query_profile'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: DataWarehouseSloBurnEvent
      title: Data Warehouse SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'data-warehouse' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'pipeline.partition.refreshed' }
