asyncapi: 3.1.0
info:
  title: Data Warehouse Events
  version: 1.0.0
  description: Tenant-scoped event contract for per-tenant OLAP, workload isolation, retention tiers, and analytical cost controls.
defaultContentType: application/json
channels:
  data-warehouse.events.v1:
    address: data-warehouse.events.v1
    messages:
      dataWarehouseActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/data-warehouse.events.v1'
    messages:
      - $ref: '#/channels/data-warehouse.events.v1/messages/dataWarehouseActionAccepted'
components:
  messages:
    ActionAccepted:
      name: DataWarehouseActionAccepted
      title: Data Warehouse action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
