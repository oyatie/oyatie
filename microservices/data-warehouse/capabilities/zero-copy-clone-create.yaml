apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-zero-copy-clone-create
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: dataset
  capability: zero-copy-clone-create
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0329, ADR-0331]
  benchmarks: ["Snowflake zero-copy clone"]
  cloneScope: [table, schema, database]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents: []  # clone create itself is free; later divergence accrues storage_bytes
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-zero-copy-clone-scope.cedar
  sloBindings:
    - zero-copy-clone-latency.openslo.yaml
  ipBindings: [IP-041]
