apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-lake-table-write
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: lake-table
  capability: lake-table-write
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0254, ADR-0329, ADR-0331]
  benchmarks: ["Databricks Delta", "Apache Iceberg", "Apache Hudi"]
  formatsSupported: [delta, iceberg, hudi_cow, hudi_mor]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        bytes_per_commit_max: 104857600  # 100 MiB
        commits_per_day_max: 100
    paid:
      allowed: true
      billingComponents:
        - storage_bytes
        - compute_credits
  policyEvaluationMode: caller_side_library_first
  cedarFragments:
    - local-schema-change-approval.cedar
  sloBindings:
    - delta-write-commit-latency.openslo.yaml
    - iceberg-snapshot-commit-latency.openslo.yaml
  ipBindings: [IP-031, IP-032, IP-033]
