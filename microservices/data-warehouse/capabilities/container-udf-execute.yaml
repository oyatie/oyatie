apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-container-udf-execute
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: tenant-olap
  capability: container-udf-execute
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0244, ADR-0254, ADR-0329, ADR-0331]
  benchmarks:
    ["Snowflake Snowpark Container Services", "BigQuery Remote Functions", "Databricks custom container"]
  runtimeShape: cloud_hypervisor_pod  # per ADR-0254
  imageSignatureRequired: true
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: false
      refusalCode: tenant_class_cap_exceeded
    paid:
      allowed: true
      billingComponents:
        - container_udf_seconds
        - compute_credits
  policyEvaluationMode: caller_side_library_first
  cedarFragments: []
  ipBindings: [IP-043]
