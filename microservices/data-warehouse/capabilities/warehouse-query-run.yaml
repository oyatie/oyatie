apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-warehouse-query-run
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: tenant-olap
  capability: warehouse-query-run
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0243, ADR-0244, ADR-0314, ADR-0321, ADR-0329, ADR-0331]
  benchmarks: ["Snowflake", "Google BigQuery", "Databricks Lakehouse Platform"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class, pack_overlay]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        bytes_per_query_max: 100000000
        concurrent_queries_max: 4
    paid:
      allowed: true
      billingComponents:
        - compute_credits
        - federated_query_bytes  # if external scan
  marketplaceSettlement: DealSet
  policyEvaluationMode: caller_side_library_first
  ontologyReadMode: library_first
  cedarFragments:
    - local-warehouse-query-access.cedar
  sloBindings:
    - local-query-latency.openslo.yaml
