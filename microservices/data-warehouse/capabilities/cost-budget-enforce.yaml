apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: data-warehouse-cost-budget-enforce
  service: data-warehouse
  wave: Wave-15A
spec:
  businessCapability: tenant-olap
  capability: cost-budget-enforce
  tier: product
  bindingAdrs:
    [ADR-0105, ADR-0145, ADR-0243, ADR-0244, ADR-0321, ADR-0329, ADR-0331]
  benchmarks: ["Snowflake resource monitors", "BigQuery slot reservation alerts"]
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
  tenantClassEnvelope:
    demo_trial:
      allowed: true
      caps:
        budget_alert_thresholds: [50, 75, 90, 100]
    paid:
      allowed: true
      billingComponents: []  # control plane action; no per-event accrual
  policyEvaluationMode: caller_side_library_first
  cedarFragments: []
  sloBindings:
    - cost-budget-exhaustion-alert-latency.openslo.yaml
