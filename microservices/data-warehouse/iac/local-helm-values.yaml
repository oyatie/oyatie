service:
  name: data-warehouse
  suite: local-operational-primitive
  audience: DATA_WAREHOUSE_OPERATOR
workloads:
  partition-refresher:
    replicas: 3
    sloMetric: oya_data_warehouse_freshness
  sla-tier-controller:
    replicas: 2
    sloMetric: oya_data_warehouse_completeness
  lineage-capture:
    replicas: 2
    sloMetric: oya_data_warehouse_query_latency
policy:
  directory: policies
  defaultDeny: true
