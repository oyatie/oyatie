apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-warehouse-partition-refresher
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-warehouse-partition-refresher
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_data_warehouse_freshness_inflight
        target:
          type: AverageValue
          averageValue: "100"
