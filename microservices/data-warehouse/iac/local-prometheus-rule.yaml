apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-warehouse-local-slo-burn
  labels:
    service: data-warehouse
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: data-warehouse.local.slo
      rules:
        - alert: DataWarehouseLocalSloBurn
          expr: (sum(rate(oya_data_warehouse_freshness_good_total[5m])) / sum(rate(oya_data_warehouse_freshness_total[5m]))) < 0.995
          for: 10m
          labels:
            severity: page
            service: data-warehouse
          annotations:
            summary: Data Warehouse freshness burn
            runbook: microservices/data-warehouse/runbooks/local-freshness-burn.md
