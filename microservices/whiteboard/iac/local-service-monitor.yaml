apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: whiteboard-local-ops
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: whiteboard
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_whiteboard_cursor_latency_good_total
    - oya_whiteboard_stroke_persistence_latency_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-board-open-scope.cedar
