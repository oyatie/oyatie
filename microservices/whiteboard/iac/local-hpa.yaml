apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whiteboard-cursor-relay
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whiteboard-cursor-relay
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_whiteboard_cursor_latency_inflight
        target:
          type: AverageValue
          averageValue: "100"
