service:
  name: whiteboard
  suite: local-operational-primitive
  audience: WORKSPACE_COLLABORATOR
workloads:
  cursor-relay:
    replicas: 3
    sloMetric: oya_whiteboard_cursor_latency
  stroke-writer:
    replicas: 2
    sloMetric: oya_whiteboard_stroke_persistence_latency
  crdt-merger:
    replicas: 2
    sloMetric: oya_whiteboard_board_load_time
policy:
  directory: policies
  defaultDeny: true
