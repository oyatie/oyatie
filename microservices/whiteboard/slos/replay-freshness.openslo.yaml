apiVersion: openslo/v1
kind: SLO
metadata:
  name: whiteboard-replay-freshness
  labels:
    service: whiteboard
    adr: ADR-0139
spec:
  service: whiteboard
  indicator:
    metadata:
      name: replay-freshness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_replay_freshness_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_replay_freshness_total[5m]))
  objectives:
    - displayName: Whiteboard replay-freshness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
