apiVersion: openslo/v1
kind: SLO
metadata:
  name: whiteboard-stroke-persistence-latency
  labels:
    service: whiteboard
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: whiteboard
  description: Whiteboard strokes persisted durably for real-time board collaboration, cursor presence, stroke persistence, CRDT merge, export rendering, and board loading operations.
  indicator:
    metadata:
      name: stroke-persistence-latency
      labels:
        domain_object: WhiteboardSession
        operator_audience: WORKSPACE_COLLABORATOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_stroke_persistence_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_whiteboard_stroke_persistence_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Whiteboard strokes persisted durably
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
