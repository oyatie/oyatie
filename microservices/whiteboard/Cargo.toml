[package]
name = "oya-whiteboard-canvas-collaboration-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Whiteboard canvas collaboration application surface."

[package.metadata.oya]
microservice = "whiteboard"
title = "Whiteboard"
bounded_context = "canvas-collaboration"
layer = "app"
wave = "wave-3-k"
owner_team = "axis-whiteboard + council-product"
data_classification = "tenant-scoped operational records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0132", "ADR-0316"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/whiteboard-v1.proto"

[lib]
name = "oya_whiteboard_canvas_collaboration_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-whiteboard-canvas-collaboration"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
