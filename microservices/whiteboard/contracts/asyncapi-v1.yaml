asyncapi: 3.1.0
info:
  title: Whiteboard Events
  version: 1.0.0
  description: Tenant-scoped event contract for low-latency multi-user canvas operations, board history, and export semantics.
defaultContentType: application/json
channels:
  whiteboard.events.v1:
    address: whiteboard.events.v1
    messages:
      whiteboardActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/whiteboard.events.v1'
    messages:
      - $ref: '#/channels/whiteboard.events.v1/messages/whiteboardActionAccepted'
components:
  messages:
    ActionAccepted:
      name: WhiteboardActionAccepted
      title: Whiteboard action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
