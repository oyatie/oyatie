[package]
name = "oya-flags-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# oya-flags application binary — wires kernel + REST adapter (ADR-0481).
# Binary: oya-flags. Exposes OFREP endpoints; sub-ms evaluation critical path.

[[bin]]
name = "oya-flags"
path = "src/main.rs"

[lib]
name = "oya_flags_app"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-flags-kernel = { path = "../oya-flags-kernel" }
oya-flags-rest = { path = "../oya-flags-rest" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
