asyncapi: 3.1.0
info:
  title: Performance Management <-> Learning Management handoff
  version: 1.0.0
  description: |
    Inbound async contract from learning-management to performance-management.
    Closes audit Finding §3.4.B-5.
    Inbound (B-5): LearningCompletionEvent provides review-cycle evidence for
    development-goal achievement.
defaultContentType: application/json
channels:
  learning-management.completion.v1:
    address: hr.handoff.learning-management.completion.v1
    messages:
      learningCompletion:
        $ref: '#/components/messages/LearningCompletionEvent'
operations:
  subscribeLearningCompletion:
    action: receive
    channel:
      $ref: '#/channels/learning-management.completion.v1'
    messages:
      - $ref: '#/components/messages/LearningCompletionEvent'
components:
  messages:
    LearningCompletionEvent:
      name: LearningCompletionEvent
      title: Learning course/path completion event
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - course_id
          - completion_status
          - completed_at
          - audit_event_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          course_id: { type: string }
          learning_path_id: { type: string, nullable: true }
          completion_status: { type: string, enum: [completed, passed, certified, failed] }
          score: { type: number, nullable: true }
          completed_at: { type: string, format: date-time }
          development_goal_ref: { type: string, nullable: true, description: "Optional link back to a performance goal" }
          audit_event_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "learning-management" }
