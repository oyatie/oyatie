asyncapi: 3.1.0
info:
  title: Performance Management <-> People Records (HRIS) handoff
  version: 1.0.0
  description: |
    Bidirectional async contract between performance-management and people-records.
    Closes audit Finding §3.4.B-2/B-3.
    Outbound (B-2): CalibrationOutcomeRecord -> HRIS audit trail.
    Inbound (B-3): EmployeeDirectoryProjection (org-tree) for goal cascade.
defaultContentType: application/json
channels:
  performance-management.calibration-outcome.v1:
    address: hr.handoff.people-records.calibration-outcome.v1
    messages:
      calibrationOutcome:
        $ref: '#/components/messages/CalibrationOutcomeRecord'
  people-records.employee-directory-projection.v1:
    address: hr.handoff.people-records.employee-directory-projection.v1
    messages:
      directoryProjection:
        $ref: '#/components/messages/EmployeeDirectoryProjection'
operations:
  publishCalibrationOutcome:
    action: send
    channel:
      $ref: '#/channels/performance-management.calibration-outcome.v1'
    messages:
      - $ref: '#/components/messages/CalibrationOutcomeRecord'
  subscribeDirectoryProjection:
    action: receive
    channel:
      $ref: '#/channels/people-records.employee-directory-projection.v1'
    messages:
      - $ref: '#/components/messages/EmployeeDirectoryProjection'
components:
  messages:
    CalibrationOutcomeRecord:
      name: CalibrationOutcomeRecord
      title: Calibration outcome (immutable audit record)
      payload:
        type: object
        required:
          - tenant_id
          - calibration_session_id
          - employee_id
          - bucket_assignment
          - nine_box_cell
          - finalized_at
          - audit_event_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          calibration_session_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          bucket_assignment: { type: string, example: "exceeds-expectations" }
          nine_box_cell: { type: string, example: "high-high" }
          readiness_rating: { type: string, enum: [ready-now, ready-1-year, ready-2-year, not-ready] }
          finalized_at: { type: string, format: date-time }
          audit_event_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "performance-management" }
          transport_profile: { type: string, const: "h3-h2-h1-strict-tls13-ech-pqc" }
    EmployeeDirectoryProjection:
      name: EmployeeDirectoryProjection
      title: Employee org-tree projection
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - manager_id
          - department_id
          - employment_status
          - effective_at
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          manager_id: { type: string, format: uuid, nullable: true }
          department_id: { type: string }
          location_id: { type: string }
          employment_status: { type: string, enum: [active, leave, terminated] }
          role_id: { type: string }
          effective_at: { type: string, format: date-time }
          source_microservice: { type: string, const: "people-records" }
