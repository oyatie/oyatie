asyncapi: 3.1.0
info:
  title: Performance Management <-> Time Tracking handoff
  version: 1.0.0
  description: |
    Inbound async contract from time-tracking to performance-management.
    Closes audit Finding §3.4.B-6.
    Inbound (B-6): TimeOffPeriod is consumed for goal-cycle proration during parental
    leave, sabbatical, or extended medical leave.
defaultContentType: application/json
channels:
  time-tracking.time-off-period.v1:
    address: hr.handoff.time-tracking.time-off-period.v1
    messages:
      timeOffPeriod:
        $ref: '#/components/messages/TimeOffPeriod'
operations:
  subscribeTimeOffPeriod:
    action: receive
    channel:
      $ref: '#/channels/time-tracking.time-off-period.v1'
    messages:
      - $ref: '#/components/messages/TimeOffPeriod'
components:
  messages:
    TimeOffPeriod:
      name: TimeOffPeriod
      title: Approved time-off period for an employee
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - leave_type
          - start_date
          - end_date
          - audit_event_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          leave_type:
            type: string
            enum: [parental, sabbatical, medical, bereavement, vacation, jury-duty, military]
          start_date: { type: string, format: date }
          end_date: { type: string, format: date }
          status: { type: string, enum: [approved, in-progress, completed, cancelled] }
          proration_applicable: { type: boolean, default: true }
          audit_event_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "time-tracking" }
