asyncapi: 3.1.0
info:
  title: Performance Management Events
  version: 1.0.0
  description: Tenant-scoped event contract for employee goals, review evidence, calibration, and engagement analytics.
defaultContentType: application/json
channels:
  performance-management.events.v1:
    address: performance-management.events.v1
    messages:
      performanceManagementActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/performance-management.events.v1'
    messages:
      - $ref: '#/channels/performance-management.events.v1/messages/performanceManagementActionAccepted'
components:
  messages:
    ActionAccepted:
      name: PerformanceManagementActionAccepted
      title: Performance Management action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
