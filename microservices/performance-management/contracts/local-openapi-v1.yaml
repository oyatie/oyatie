openapi: 3.2.0
info:
  title: Performance Management Local Operational API
  version: 1.0.0
  summary: Local operational contract for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
  x-binding-adrs: [ADR-0130, ADR-0131, ADR-0139]
servers:
  - url: https://api.oyatie.com/performance-management/v1
    description: Tenant-scoped production API with HTTP/3 default and strict TLS 1.3.
paths:
  /performance-management/v1/review-cycles/{resource_id}/policy-check:
    post:
      operationId: checkPerformanceManagementLocalPolicy
      summary: Evaluate Performance Management local policy for review, calibration, rating operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalPolicyCheckRequest'
      responses:
        '200':
          description: Policy decision with audit event binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalPolicyDecision'
  /performance-management/v1/review-cycles/{resource_id}/slo-state:
    get:
      operationId: getPerformanceManagementLocalSloState
      summary: Read Performance Management domain SLO burn state including calibration-cycle-completion.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
        - name: slo_name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Current SLO state for the local domain suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalSloState'
  /performance-management/v1/review-cycles/{resource_id}/operator-remediation:
    post:
      operationId: invokePerformanceManagementOperatorRemediation
      summary: Start an audited remediation workflow for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
      security: [{ tenantBearer: [] }]
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, minLength: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRemediationRequest'
      responses:
        '202':
          description: Remediation workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAccepted'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LocalPolicyCheckRequest:
      type: object
      required: [tenant_id, principal_id, requested_action, data_class, purpose, audit_event_class]
      properties:
        tenant_id: { type: string, minLength: 4 }
        principal_id: { type: string, minLength: 4 }
        requested_action: { type: string, enum: ['review.cycle.open', 'feedback.submit', 'calibration.session.lock', 'rating.change', 'goal.align', 'hrbp.export'] }
        data_class: { type: string, enum: ['review_form', 'calibration_rating', 'feedback_entry', 'goal_alignment', 'hr_export', 'manager_note'] }
        purpose: { type: string, enum: ['operate', 'support', 'security-review', 'regulated-audit'] }
        audit_event_class: { type: string, pattern: '^[A-Z][A-Za-z0-9]+$' }
    LocalPolicyDecision:
      type: object
      required: [decision, policy_file, audit_event_id]
      properties:
        decision: { type: string, enum: ['permit', 'forbid'] }
        policy_file: { type: string }
        audit_event_id: { type: string }
        denied_reason: { type: string }
    LocalSloState:
      type: object
      required: [service, slo_name, window, objective, current_value, burn_rate]
      properties:
        service: { type: string, const: 'performance-management' }
        slo_name: { type: string }
        window: { type: string }
        objective: { type: number }
        current_value: { type: number }
        burn_rate: { type: number }
    OperatorRemediationRequest:
      type: object
      required: [tenant_id, incident_key, runbook, mitigation]
      properties:
        tenant_id: { type: string }
        incident_key: { type: string }
        runbook: { type: string }
        mitigation: { type: string }
    RemediationAccepted:
      type: object
      required: [workflow_run_id, audit_event_id, expected_operator_update_at]
      properties:
        workflow_run_id: { type: string }
        audit_event_id: { type: string }
        expected_operator_update_at: { type: string, format: date-time }
