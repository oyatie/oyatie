asyncapi: 3.1.0
info:
  title: Performance Management <-> Compensation handoff
  version: 1.0.0
  description: |
    Bidirectional async contract between performance-management and compensation.
    Closes audit Finding 2.2.A (P0) and §3.4.B-1/B-4.
    Outbound (B-1): RatingFinalizedEvent triggers merit-increase recommendation.
    Inbound (B-4): CompensationBandReference informs calibration justification.
defaultContentType: application/json
channels:
  performance-management.rating-finalized.v1:
    address: hr.handoff.compensation.rating-finalized.v1
    messages:
      ratingFinalized:
        $ref: '#/components/messages/RatingFinalizedEvent'
  compensation.band-reference.v1:
    address: hr.handoff.compensation.band-reference.v1
    messages:
      bandReference:
        $ref: '#/components/messages/CompensationBandReference'
operations:
  publishRatingFinalized:
    action: send
    channel:
      $ref: '#/channels/performance-management.rating-finalized.v1'
    messages:
      - $ref: '#/components/messages/RatingFinalizedEvent'
  subscribeBandReference:
    action: receive
    channel:
      $ref: '#/channels/compensation.band-reference.v1'
    messages:
      - $ref: '#/components/messages/CompensationBandReference'
components:
  messages:
    RatingFinalizedEvent:
      name: RatingFinalizedEvent
      title: Review-cycle rating finalized
      payload:
        type: object
        required:
          - tenant_id
          - principal_id
          - employee_id
          - review_cycle_id
          - rating_value
          - rating_scale
          - finalized_at
          - audit_event_id
          - deal_set_id
          - tenant_class
          - source_microservice
        properties:
          tenant_id: { type: string, format: uuid }
          principal_id: { type: string }
          employee_id: { type: string, format: uuid }
          review_cycle_id: { type: string, format: uuid }
          rating_value: { type: number, description: "e.g. 1.0 - 5.0 on configured scale" }
          rating_scale: { type: string, example: "1to5" }
          calibration_session_id: { type: string, format: uuid }
          finalized_at: { type: string, format: date-time }
          audit_event_id: { type: string }
          deal_set_id: { type: string }
          tenant_class: { type: string, enum: [demo_trial, paid] }
          source_microservice: { type: string, const: "performance-management" }
          transport_profile: { type: string, const: "h3-h2-h1-strict-tls13-ech-pqc" }
    CompensationBandReference:
      name: CompensationBandReference
      title: Compensation band reference for an employee role
      payload:
        type: object
        required:
          - tenant_id
          - employee_id
          - role_id
          - band_id
          - band_min
          - band_mid
          - band_max
          - currency
          - effective_at
        properties:
          tenant_id: { type: string, format: uuid }
          employee_id: { type: string, format: uuid }
          role_id: { type: string }
          band_id: { type: string }
          band_min: { type: number }
          band_mid: { type: number }
          band_max: { type: number }
          currency: { type: string }
          effective_at: { type: string, format: date-time }
          source_microservice: { type: string, const: "compensation" }
