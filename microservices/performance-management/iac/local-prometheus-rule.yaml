apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: performance-management-local-slo-burn
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: performance-management.local.slo
      rules:
        - alert: PerformanceManagementLocalSloBurn
          expr: (sum(rate(oya_performance_management_calibration_cycle_completion_good_total[5m])) / sum(rate(oya_performance_management_calibration_cycle_completion_total[5m]))) < 0.995
          for: 10m
          labels:
            severity: page
            service: performance-management
          annotations:
            summary: Performance Management calibration-cycle-completion burn
            runbook: microservices/performance-management/runbooks/local-calibration-cycle-slip.md
