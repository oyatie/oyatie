apiVersion: oyatie.dev/v1
kind: SloAlertPolicy
metadata:
  name: performance-management-local-alerts
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: performance-management
  burnWindows:
