apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: performance-management-local-ops
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: performance-management
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_performance_management_calibration_cycle_completion_good_total
    - oya_performance_management_review_form_latency_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-review-cycle-scope.cedar
