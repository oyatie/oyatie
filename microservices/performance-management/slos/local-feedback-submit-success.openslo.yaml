apiVersion: openslo/v1
kind: SLO
metadata:
  name: performance-management-feedback-submit-success
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: performance-management
  description: Feedback submissions accepted with audit evidence for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
  indicator:
    metadata:
      name: feedback-submit-success
      labels:
        domain_object: PerformanceReviewCycle
        operator_audience: PEOPLE_OPS_PARTNER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_feedback_submit_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_feedback_submit_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Feedback submissions accepted with audit evidence
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
