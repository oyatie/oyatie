apiVersion: openslo/v1
kind: SLO
metadata:
  name: performance-management-calibration-lock-conflict-rate
  labels:
    service: performance-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: performance-management
  description: Calibration lock operations without conflict for review cycles, calibration sessions, goal alignment, feedback submission, and rating governance operations.
  indicator:
    metadata:
      name: calibration-lock-conflict-rate
      labels:
        domain_object: PerformanceReviewCycle
        operator_audience: PEOPLE_OPS_PARTNER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_calibration_lock_conflict_rate_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_performance_management_calibration_lock_conflict_rate_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Calibration lock operations without conflict
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
