# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: recordings
commonLabels:
  oyatie.com/microservice: recordings
  oyatie.com/pack: pack-eu
  oyatie.com/region: eu-frankfurt-1
resources:
  - ../../base
configMapGenerator:
  - name: recordings-pack-config
    literals:
      - pack=pack-eu
      - cdn_backend=cloudfront
      - storage_hot_retention_days=90
      - consent_banner_required=true    # ePrivacy Art. 5(3)
      - retention_floor_days=0          # GDPR Art. 5(1)(e) tenant-driven
      - retention_ceiling_days=2555     # 7y storage-limitation default
      - eu_ai_act_transparency=enabled  # Art. 50
