apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: recordings-burn-rate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
spec:
  groups:
    - name: recordings-burn-rate
      interval: 1m
      rules:
        - alert: RecordingsPlaybackBurnRateFast
          expr: |
            oya_promotion_burn_rate_fast_1h{microservice="recordings",sli="playback-start-availability"} > 14.4
          for: 5m
          labels:
            severity: page
            microservice: recordings
          annotations:
            summary: "recordings playback-start burn rate fast (1h) > 14.4"

        - alert: RecordingsLegalHoldEngagementLatency
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_recordings_legal_hold_engagement_duration_seconds_bucket[5m]))) > 1.0
          for: 1m
          labels:
            severity: page
            microservice: recordings
            load_bearing: "true"
          annotations:
            summary: "recordings legal-hold engagement p99 > 1s — LOAD-BEARING BREACH"

        - alert: RecordingsRetentionPolicyCorrectness
          expr: |
            sum(rate(oya_recordings_retention_breach_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: recordings
            load_bearing: "true"
          annotations:
            summary: "recordings retention-policy correctness breach — LOAD-BEARING SEV-1"

        - alert: RecordingsLegalHoldChainOfCustodyCorrectness
          expr: |
            sum(rate(oya_recordings_legal_hold_chain_of_custody_breach_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: recordings
            load_bearing: "true"
          annotations:
            summary: "recordings legal-hold chain-of-custody correctness breach — LOAD-BEARING SEV-1"

        - alert: RecordingsTranscriptPipelineDegraded
          expr: |
            oya_recordings_transcript_pipeline_queue_minutes > 60
          for: 5m
          labels:
            severity: warning
            microservice: recordings
          annotations:
            summary: "recordings Whisper queue depth > 60 min — engage degraded-runbook"

        - alert: RecordingsCdnCacheCascade
          expr: |
            (sum(rate(oya_recordings_cdn_hits_total[5m])) / sum(rate(oya_recordings_cdn_requests_total[5m]))) < 0.7
          for: 5m
          labels:
            severity: warning
            microservice: recordings
          annotations:
            summary: "recordings CDN cache hit < 70 % — engage playback-cdn-cache-cascade runbook"

    - name: recordings-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: recordings-llm-capability-circuit-open
          expr: max(oya_recordings_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: recordings
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "recordings LLM/capability circuit-breaker tripped open"
        - alert: recordings-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_recordings_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: recordings
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "recordings capability retry-budget exhausted"

    - name: recordings-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: recordings-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_recordings_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: recordings
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "recordings tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: recordings-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: recordings-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"recordings-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: recordings
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "recordings pod CPU saturation > 70% sustained 10m"
        - alert: recordings-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_recordings_responses_5xx_total[5m]))
            /
            sum(rate(oya_recordings_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: recordings
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "recordings 5xx rate > 1% sustained 5m"
        - alert: recordings-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_recordings_responses_total[5m]))
              /
              sum(rate(oya_recordings_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: recordings
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "recordings inbound RPS dropped > 90% vs prior hour"

    - name: recordings-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: recordings-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_recordings_request_success_total[1h]))
              /
              sum(rate(oya_recordings_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: recordings
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "recordings aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: recordings-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_recordings_request_success_total[6h]))
              /
              sum(rate(oya_recordings_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: recordings
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "recordings aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
