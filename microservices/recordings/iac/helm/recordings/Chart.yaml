# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: recordings
description: oyatie recordings µservice - centralised recording store + transcript + redaction + retention + legal-hold + ediscovery + export + share-link + playback
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-recordings
    url: https://oyatie.internal/microservices/recordings
dependencies:
  - name: postgres
    version: "16.x"
    repository: oci://oci.oyatie.com/charts
    condition: postgres.enabled
  - name: valkey
    version: "7.2.x"
    repository: oci://oci.oyatie.com/charts
    condition: valkey.enabled
  - name: meilisearch
    version: "0.10.0"
    repository: oci://oci.oyatie.com/charts
    condition: meilisearch.enabled
annotations:
  oyatie.com/microservice: recordings
  oyatie.com/load-bearing-slos: "recordings-retention-policy-correctness,recordings-legal-hold-engagement-latency,recordings-legal-hold-chain-of-custody-correctness"
  oyatie.com/related-adrs: "ADR-RECORDINGS-0001,ADR-RECORDINGS-0002,ADR-RECORDINGS-0003,ADR-RECORDINGS-0004,ADR-RECORDINGS-0005,ADR-RECORDINGS-0006,ADR-RECORDINGS-0007"
