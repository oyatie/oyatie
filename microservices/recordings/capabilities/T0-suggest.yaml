# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:recordings:t0-suggest:v1
name: chapter-marker-suggest
namespace: recordings
display_name: Chapter Marker Suggestion (T0 suggest)
description: |
  T0 suggest capability — at user request, surface candidate chapter markers
  derived from speaker-diarization transitions + acoustic-energy changes.
  Suggestions appear inline in the playback UI; the user accepts or
  discards each one. No automated write to canonical chapter index.

owner_team: axis-recordings
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-RECORDINGS-0001, ADR-RECORDINGS-0006]
related_artifacts:
  - microservices/recordings/PRD.md (FR-12 chapter-marker + summary)
  - microservices/recordings/decisions/ADR-RECORDINGS-0001-transcription-and-diarization-pipeline.md

autonomy_tier: T0
# T0 = suggest-only; no autonomous write; user explicit accept required.

inputs:
  - name: recording_id
    type: string
    required: true
  - name: invoking_user_ref
    type: string
    required: true

outputs:
  - name: suggestions
    type: array
    max_items: 20
    items:
      type: object
      properties:
        suggested_start_ms: {type: integer, format: int64}
        suggested_title:    {type: string, maxLength: 200}
        confidence:         {type: number, minimum: 0, maximum: 1}
        rationale:          {type: string, enum: [speaker_change, acoustic_energy_change, topic_keyword]}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: must-label-as-AI-generated; no high-risk obligation
  pack-us-healthcare:
    requires: signed BAA (PHI inference at chapter boundaries is metadata-only; still PHI-adjacent)

evidence_topic: oya.recordings.capability.t0_chapter_suggest.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.002
  cost_drivers:
    - foundry-runtime diarization-output read (cached from earlier transcript pass)
    - acoustic-energy windowing on cached audio

cedar_policy_fragments:
  - microservices/recordings/policy/cedar/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/recordings/capabilities/eval/t0-chapter-suggest-baseline.jsonl
  pass_threshold: 0.85
  eval_metric: chapter-boundary precision@5 (human-labelled baseline set)
  cadence: per-release

sunset:
  status: none
