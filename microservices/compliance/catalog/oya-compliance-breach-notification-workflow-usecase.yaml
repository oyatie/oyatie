apiVersion: oyatie.io/catalog/v2
kind: Crate
metadata:
  name: oya-compliance-breach-notification-workflow-usecase
  microservice: compliance
  bounded_context: breach-notification-workflow
  layer: usecase
spec:
  binding_adr: ADR-0251
  naming_justification: "BNF v4.1: oya-<microservice:compliance>-<bc:breach-notification-workflow>-<layer:usecase>"
  ports: [notifications-fanout, comms-email, audit-chain]
  dependencies: []
  audit_event_classes:
    - oya.compliance.breach-declared
    - oya.compliance.breach-notify-authority
    - oya.compliance.breach-notify-subjects
    - oya.compliance.breach-closed
