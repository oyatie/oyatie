# Canonical-base: specs/capabilities/canonical-tenant_class-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-secrets:secret-rotate:v1
name: secret-rotate
namespace: cloud-secrets
display_name: Rotate Secret (cascade-aware)
description: |
  Rotate a secret to a new version and propagate cascade rotations to
  dependents (e.g., KEK rotation triggers DEK re-wrap; signing-key rotation
  triggers downstream API-key rotation). Rotation emits SecretRotated event;
  cache invalidation propagates via revocation push to consumer SDKs.

  Cascade semantics: rotation policies declare `cascade_dependents`; the
  scheduler computes the topological order and rotates leaves-first to
  avoid breaking dependents that still use the parent.

owner_team: axis-cloud-secrets
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0117, ADR-0131]
related_artifacts:
  - microservices/cloud-secrets/PRD.md FR-03
  - microservices/cloud-secrets/runbooks/rotation-cascade-recovery.md
  - microservices/cloud-secrets/runbooks/hsm-key-rotation.md

autonomy_tier: T2
# T2 = scheduler-initiated control plane operation; not a T3 destructive op,
# but it does mutate live secrets + cascades.

inputs:
  - name: reference_uri
    type: string
    pattern: '^openbao:secret/.+$'
    required: true
  - name: cascade
    type: boolean
    default: true
    required: false
  - name: priority
    type: enum
    values: [low, normal, high, immediate]
    default: normal
    required: false
  - name: reason
    type: string
    required: true
  - name: incident_id
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    required: false

outputs:
  - name: rotation_job_id
    type: string
  - name: accepted_at
    type: timestamp
  - name: cascade_dependents
    type: array
    items: string

data_classes_touched:
  - SECRET
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud_secrets.secret.rotated

cost_profile:
  type: per-rotation
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - HSM signing op (KEK rotation specifically)
    - OpenBao write
    - Cascade fanout (per dependent)

cedar_policy_fragments:
  - microservices/cloud-secrets/policy/tenant-scope.cedar
  - microservices/cloud-secrets/policy/auditor-scope.cedar

eval_set:
  paiden_inputs_path: microservices/cloud-secrets/capabilities/eval/secret-rotate-paiden.jsonl
  pass_threshold: 0.995
  eval_metric: cascade-completeness-and-revocation-propagation-within-SLA
  cadence: per-release
  reference: NIST SP 800-57 Part 1 §"Rev. 5 §5 Key Lifecycle"

sunset:
  status: none
  notes: ""
