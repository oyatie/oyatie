# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# HSM operator — manages PKCS#11 client config + KMIP client + daily attestation.

hsmOperator:
  image:
    repository: oyatie/cloud-secrets-hsm-operator
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  vendor: "${pack_overlay:hsm_vendor}"   # oci-cloud-hsm | thales-luna

  partition:
    # Partition ID resolved at runtime from OpenBao bootstrap secret.
    id: "${openbao:secret/shared/cloud-secrets/hsm-partition-id}"
    haReplicaId: "${openbao:secret/shared/cloud-secrets/hsm-ha-replica-id}"

  pkcs11:
    libPath: /usr/local/lib/pkcs11/libCryptoki2_64.so
    # PIN resolved via ${openbao:...} at boot; never in plain text.
    pinRef: "${openbao:secret/shared/cloud-secrets/hsm-pin}"

  kmip:
    enabled: true
    endpoint: "${openbao:secret/shared/cloud-secrets/hsm-kmip-endpoint}"
    certRef: "${openbao:secret/shared/cloud-secrets/hsm-kmip-cert}"

  attestation:
    cadenceCron: "0 3 * * *"   # 03:00 UTC daily; deviation pages Sev-1
    verifier:
      endpoint: "${openbao:secret/shared/cloud-secrets/attestation-verifier-endpoint}"
      vendorChainSha:
        oci-cloud-hsm: "${openbao:secret/shared/cloud-secrets/oci-attestation-chain-sha}"
        thales-luna: "${openbao:secret/shared/cloud-secrets/luna-attestation-chain-sha}"

  fourEye:
    enabled: true
    witnessGroup: ops-security
    minWitnesses: 2
    elevationTtl: "1h"

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  serviceAccount:
    create: true
    name: hsm-operator
    annotations:
      spiffe.io/spiffe-identity: "spiffe://oyatie.dev/cloud-secrets/${pack_overlay}/hsm-operator"

  networkPolicy:
    enabled: true
    egress:
      # Permit egress only to the HSM endpoints (PKCS#11 / KMIP).
      - to:
          - ipBlock:
              cidr: "${pack_overlay:hsm_cidr}"
        ports:
          - port: 5696    # KMIP
            protocol: TCP

  observability:
    serviceMonitor:
      enabled: true
    metrics:
      port: 9090
