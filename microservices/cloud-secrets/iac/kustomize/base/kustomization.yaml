# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base for cloud-secrets µservice deployment.
# Per-pack overlays customise: HSM vendor, region, residency labels, capacity.

namespace: cloud-secrets

commonLabels:
  app.kubernetes.io/part-of: cloud-secrets
  app.kubernetes.io/managed-by: kustomize
  microservice: cloud-secrets

helmCharts:
  - name: postgres
    repo: file://../../helm/postgres
    namespace: cloud-secrets
    releaseName: postgres
    version: "0.1.0"
    valuesFile: ../../helm/postgres/values.yaml

  - name: openbao
    repo: file://../../helm/openbao
    namespace: cloud-secrets
    releaseName: openbao
    version: "0.1.0"
    valuesFile: ../../helm/openbao/values.yaml

  - name: hsm-operator
    repo: file://../../helm/hsm-operator
    namespace: cloud-secrets
    releaseName: hsm-operator
    version: "0.1.0"
    valuesFile: ../../helm/hsm-operator/values.yaml

# NetworkPolicy: default-deny ingress + egress.
resources: []

# Per-µservice ingress / egress rules layered by overlays.
patches: []

# Required labels enforced by per-microservice-layout lane.
labels:
  - includeSelectors: true
    pairs:
      oyatie.dev/microservice: cloud-secrets
      oyatie.dev/layer: substrate
      oyatie.dev/criticality: tier-0
