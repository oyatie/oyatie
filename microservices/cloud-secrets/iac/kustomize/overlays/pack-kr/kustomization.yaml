# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay — OCI ap-seoul-1; Thales Luna HSM; KR-FSS sector tenants.

namespace: cloud-secrets-kr

resources:
  - ../../base

namePrefix: kr-

commonLabels:
  oyatie.dev/pack: pack-kr
  oyatie.dev/jurisdiction: kr
  oyatie.dev/region: ap-seoul-1

commonAnnotations:
  cloud-secrets.oyatie.dev/hsm-vendor: thales-luna
  cloud-secrets.oyatie.dev/residency: kr-only
  cloud-secrets.oyatie.dev/fips: "140-3-L3"

patches:
  - target:
      kind: Deployment
      name: openbao
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5

  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

configMapGenerator:
  - name: pack-overlay-values
    literals:
      - pack_overlay=kr
      - hsm_vendor=thales-luna
      - hsm_cidr=10.10.0.0/16   # KR pack HSM endpoint range
      - oci_region=ap-seoul-1
      - audit_retention=5y     # KR-FSS sector minimum

# Pack-specific resource quotas (per capacity-model.md baseline for pack-kr launch)
patchesStrategicMerge:
  - resource-quota.yaml
