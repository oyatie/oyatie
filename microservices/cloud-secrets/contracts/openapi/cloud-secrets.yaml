openapi: 3.2.0
info:
  title: oya-cloud-secrets
  version: 1.0.0
  summary: REST API for the cloud-secrets µservice — admin operations only; SecretReference resolution is SDK-side
  description: |
    Tenant-facing and operator-facing REST surface for cloud-secrets. The hot
    path (SecretReference resolution) is intentionally NOT exposed here — it
    runs in-process via the SDK against OpenBao directly with SPIFFE mTLS.

    Admin endpoints (rotation, revocation, namespace lifecycle, audit query)
    are mTLS-only; tenant endpoints (encryption-key BYOK upload per ADR-0251 §D-10, attestation review, audit
    export) are OIDC+MFA+JIT.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`
    with `tenant_id` claim. The X-Scope-OrgID header MUST match the claim.

    CRITICAL — the API NEVER returns a raw secret value over the wire. All
    resolution happens SDK-side. Admin endpoints return references,
    metadata, attestation reports, and audit events.
  contact:
    name: axis-cloud-secrets
    url: https://oyatie.com/teams/axis-cloud-secrets
  license:
    name: Internal
servers:
  - url: https://cloud-secrets-{pack}.oyatie.com/api/v1
    description: Per-pack admin endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: cloud-secrets
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    mTLS:
      type: mutualTLS
      description: SPIFFE workload identity (mTLS via cert-manager)
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/secret-isolation.md` §"TI-01"
    Tenant:
      in: path
      name: tenant
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    Microservice:
      in: path
      name: microservice
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    SecretName:
      in: path
      name: secret_name
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    IncidentId:
      in: query
      name: incident_id
      required: false
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'   # ULID
  schemas:
    SecretReference:
      type: object
      description: |
        A SecretReference is the canonical handle for a secret. The reference
        is NEVER the secret value itself.
      required: [path, version, data_class, rotation_policy_id]
      properties:
        path:
          type: string
          pattern: '^openbao:secret/.+$'
          example: openbao:secret/tenant:a1b2c3d4e5f6g7h8/workflow-engine/oauth-client-secret@v3
        version:
          type: integer
          minimum: 1
        data_class:
          type: string
          enum: [SECRET, AUDIT, INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, SENSITIVE_PIPA_ART23]
        rotation_policy_id:
          type: string
        created_at:
          type: string
          format: date-time
        last_rotated_at:
          type: string
          format: date-time
        cascade_dependents:
          type: array
          items:
            type: string
    RotationPolicy:
      type: object
      required: [policy_id, cadence_days, cascade_dependents]
      properties:
        policy_id: {type: string}
        cadence_days: {type: integer, minimum: 1, maximum: 3650}
        jitter_pct: {type: number, minimum: 0, maximum: 25}
        cascade_dependents:
          type: array
          items:
            type: string
        algorithm:
          type: string
          enum: [aes-256-gcm, rsa-4096, ecdsa-p384, ed25519, chacha20-poly1305]
    SecretRotateRequest:
      type: object
      required: [path]
      properties:
        path: {type: string, pattern: '^openbao:secret/.+$'}
        cascade: {type: boolean, default: true}
        priority:
          type: string
          enum: [low, normal, high, immediate]
          default: normal
        reason: {type: string}
        incident_id: {type: string}
    SecretRevokeRequest:
      type: object
      required: [path, reason]
      properties:
        path: {type: string, pattern: '^openbao:secret/.+$'}
        reason: {type: string, enum: [leaked-in-repo, leaked-in-chat, leaked-in-checkpoint, leaked-in-log, leaked-external-disclosure, suspected-compromise, end-of-life]}
        incident_id: {type: string}
        cascade_dependents:
          type: boolean
          default: true
    AttestationReport:
      type: object
      required: [pack, partition_id, report_at, verified, vendor]
      properties:
        pack: {type: string}
        partition_id: {type: string}
        vendor:
          type: string
          enum: [oci-cloud-hsm, thales-luna]
        report_at: {type: string, format: date-time}
        verified: {type: boolean}
        attestation_sha: {type: string}
        firmware_version: {type: string}
        fips_140_3_level: {type: integer, enum: [3, 4]}
    TenantNamespace:
      type: object
      required: [tenant, pack, namespace_path, provisioned_at]
      properties:
        tenant: {type: string}
        pack: {type: string}
        namespace_path: {type: string}
        provisioned_at: {type: string, format: date-time}
        active_microservices:
          type: array
          items: {type: string}
        secret_count: {type: integer, minimum: 0}
        sealed: {type: boolean, default: false}
    BYOKUploadRequest:
      type: object
      description: |
        encryption-key BYOK material (ADR-0251 §D-10) is uploaded wrapped under our per-pack KEK-of-KEKs
        before transmission. The plain-text encryption-key BYOK never crosses this API.
      required: [tenant, wrapped_byok, wrap_algorithm, jit_token]
      properties:
        tenant: {type: string}
        wrapped_byok:
          type: string
          format: base64
          description: encryption-key BYOK wrapped under KEK-of-KEKs (RSA-OAEP-SHA256; ADR-0251 §D-10)
        wrap_algorithm:
          type: string
          enum: [rsa-oaep-sha256, rsa-oaep-sha512]
        intended_use:
          type: string
          enum: [data-encryption, signing]
        jit_token:
          type: string
          description: short-lived JIT token from OpenBao (≤1h TTL)
    AuditQueryParams:
      type: object
      properties:
        event_type:
          type: string
          enum: [SecretCreated, SecretRotated, SecretRevoked, SecretAccessed, NamespaceProvisioned, KekAttested, RotationOverdue]
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        tenant: {type: string}
        microservice: {type: string}
        incident_id: {type: string}
    AuditEvent:
      type: object
      required: [event_id, event_type, occurred_at, signature]
      properties:
        event_id: {type: string, description: ULID}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        tenant: {type: string}
        microservice: {type: string}
        secret_path_hash: {type: string}
        principal_spiffe_id: {type: string}
        details: {type: object}
        signature:
          type: string
          description: Ed25519 signature
        merkle_proof:
          type: object
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []
  - mTLS: []

paths:
  /secrets/{tenant}/{microservice}/{secret_name}/reference:
    get:
      summary: |
        Read the SecretReference handle for a (tenant, microservice, secret) tuple.
        Returns the reference URI + metadata — NEVER the raw secret value.
      operationId: getSecretReference
      security:
        - OIDC: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/SecretName'
      responses:
        '200':
          description: SecretReference returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretReference'}
        '401': {description: OIDC missing or X-Scope-OrgID mismatch}
        '403': {description: Cedar policy denied (cross-tenant or cross-µservice)}
        '404': {description: Secret not found}

  /secrets/{tenant}/{microservice}/references:
    get:
      summary: List SecretReferences within (tenant, microservice) scope
      operationId: listSecretReferences
      security:
        - OIDC: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Microservice'
      responses:
        '200':
          description: References
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SecretReference'}

  /secrets/{tenant}/{microservice}/{secret_name}/rotate:
    post:
      summary: Trigger rotation of a secret (admin / scheduler initiated)
      operationId: rotateSecret
      security:
        - mTLS: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/SecretName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecretRotateRequest'}
      responses:
        '202': {description: Rotation accepted; async}
        '403': {description: Cedar policy denied}
        '409': {description: Rotation already in progress}

  /secrets/{tenant}/{microservice}/{secret_name}/revoke:
    post:
      summary: Revoke a secret immediately (Sev-1 incident path)
      operationId: revokeSecret
      security:
        - mTLS: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/Microservice'
        - $ref: '#/components/parameters/SecretName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecretRevokeRequest'}
      responses:
        '202': {description: Revocation accepted; revocation push initiated}
        '403': {description: Cedar policy denied}

  /tenants/{tenant}/namespace:
    get:
      summary: Read the tenant namespace metadata
      operationId: getTenantNamespace
      security:
        - OIDC: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Namespace metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantNamespace'}

  /tenants/{tenant}/byok:
    post:
      summary: Upload encryption-key BYOK (wrapped under per-pack KEK-of-KEKs; ADR-0251 §D-10)
      operationId: uploadByok
      security:
        - OIDC: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BYOKUploadRequest'}
      responses:
        '202':
          description: encryption-key BYOK accepted (ADR-0251 §D-10); KekAttested event will be emitted
        '403': {description: Cedar policy denied}
        '422': {description: Wrap algorithm not supported or wrap verification failed}

  /attestation/{pack}/reports:
    get:
      summary: List HSM attestation reports (auditor-scope only)
      operationId: listAttestationReports
      security:
        - OIDC: []
      parameters:
        - in: path
          name: pack
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AttestationReport'}

  /audit/query:
    get:
      summary: Query audit-chain for cloud-secrets events (operator + auditor only)
      operationId: queryAudit
      security:
        - OIDC: []
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: event_type
          schema: {type: string}
        - in: query
          name: since
          schema: {type: string, format: date-time}
        - in: query
          name: until
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEvent'}

  /rotation-policies/{policy_id}:
    get:
      summary: Read a rotation policy definition
      operationId: getRotationPolicy
      security:
        - OIDC: []
      parameters:
        - in: path
          name: policy_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationPolicy'}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (OpenBao reachable + HSM partition healthy)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}

  /metrics:
    get:
      summary: Prometheus metrics endpoint (in-cluster scrape only)
      operationId: getMetrics
      security:
        - mTLS: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
