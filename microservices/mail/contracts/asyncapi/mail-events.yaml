asyncapi: 3.1.0
info:
  title: oya-mail — delivery + lifecycle events
  version: 1.0.0
  summary: Inbound/outbound delivery, legal-hold, retention, dual-context, and DLP events
  description: |
    Workflow events emitted + consumed by the mail µservice per PRD §"Integration via Workflow + Ontology".
    All events are Ed25519-sealed via audit-chain µservice (per Bominal ADR-0028 + ADR-0008).

    Producers:
      - oya-mail-inbound-smtp-worker, oya-mail-outbound-smtp-worker
      - oya-mail-mailbox-store-worker (retention sweep)
      - oya-mail-legal-hold-worker (hold + eDiscovery)
      - oya-mail-dual-context-isolation-usecase (context switch + cross-context refusal)
      - oya-mail-search-index-worker

    Consumers:
      - audit-chain (every event sealed)
      - workflow-engine (tenant-subscribed events)
      - messenger (cross-link mentions / action cards)
      - calendar (ICS attachment → calendar event)
      - ontology (Mailbox / MailMessage / LegalHold / EDiscoveryExportJob writes)
      - observability (deliverability + reputation telemetry)

    Standards: RFC 5321 (SMTP), RFC 9051 (IMAP4rev2), RFC 8620 (JMAP-Core), RFC 8621 (JMAP-Mail),
    RFC 6376 (DKIM), RFC 7489 (DMARC), RFC 8617 (ARC).
  contact:
    name: axis-mail
    email: axis-mail@oyatie.com

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.mail.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus consumed by audit-chain + tenant workflow handlers
  github-actions:
    host: api.github.com
    protocol: https
    description: GitHub repository_dispatch for cross-µservice notifications (e.g., reputation-changed → ops dashboard)

channels:
  message-received:
    address: workflow-events/mail.message.received
    messages:
      MessageReceivedMessage:
        $ref: '#/components/messages/MessageReceived'
    description: Inbound SMTP DATA accepted + persisted

  message-sent:
    address: workflow-events/mail.message.sent
    messages:
      MessageSentMessage:
        $ref: '#/components/messages/MessageSent'

  message-delivered:
    address: workflow-events/mail.message.delivered
    messages:
      MessageDeliveredMessage:
        $ref: '#/components/messages/MessageDelivered'

  message-bounced:
    address: workflow-events/mail.message.bounced
    messages:
      MessageBouncedMessage:
        $ref: '#/components/messages/MessageBounced'

  legal-hold-engaged:
    address: workflow-events/mail.legal_hold.engaged
    messages:
      LegalHoldEngagedMessage:
        $ref: '#/components/messages/LegalHoldEngaged'

  legal-hold-released:
    address: workflow-events/mail.legal_hold.released
    messages:
      LegalHoldReleasedMessage:
        $ref: '#/components/messages/LegalHoldReleased'

  retention-expired:
    address: workflow-events/mail.retention.expired
    messages:
      RetentionExpiredMessage:
        $ref: '#/components/messages/RetentionExpired'

  ediscovery-export-sealed:
    address: workflow-events/mail.ediscovery.sealed
    messages:
      EDiscoveryExportSealedMessage:
        $ref: '#/components/messages/EDiscoveryExportSealed'

  workflow-handoff-created:
    address: workflow-events/mail.workflow.handoff.created
    messages:
      MailWorkflowHandoffCreatedMessage:
        $ref: '#/components/messages/MailWorkflowHandoffCreated'

  context-switched:
    address: workflow-events/mail.context.switched
    messages:
      MailContextSwitchedMessage:
        $ref: '#/components/messages/MailContextSwitched'

  reputation-changed:
    address: workflow-events/mail.deliverability.reputation_changed
    messages:
      MailDeliverabilityReputationChangedMessage:
        $ref: '#/components/messages/MailDeliverabilityReputationChanged'

  dlp-quarantined:
    address: workflow-events/mail.dlp.quarantined
    messages:
      DlpQuarantinedMessage:
        $ref: '#/components/messages/DlpQuarantined'

  dlp-released:
    address: workflow-events/mail.dlp.released
    messages:
      DlpReleasedMessage:
        $ref: '#/components/messages/DlpReleased'

  dkim-key-rotated:
    address: workflow-events/mail.dkim.rotated
    messages:
      DkimKeyRotatedMessage:
        $ref: '#/components/messages/DkimKeyRotated'

  mailbox-restored:
    address: workflow-events/mail.mailbox.restored
    messages:
      MailMailboxRestoredMessage:
        $ref: '#/components/messages/MailMailboxRestored'

operations:
  emitMessageReceived:    {action: send, channel: {$ref: '#/channels/message-received'}}
  emitMessageSent:        {action: send, channel: {$ref: '#/channels/message-sent'}}
  emitMessageDelivered:   {action: send, channel: {$ref: '#/channels/message-delivered'}}
  emitMessageBounced:     {action: send, channel: {$ref: '#/channels/message-bounced'}}
  emitLegalHoldEngaged:   {action: send, channel: {$ref: '#/channels/legal-hold-engaged'}}
  emitLegalHoldReleased:  {action: send, channel: {$ref: '#/channels/legal-hold-released'}}
  emitRetentionExpired:   {action: send, channel: {$ref: '#/channels/retention-expired'}}
  emitEDiscoverySealed:   {action: send, channel: {$ref: '#/channels/ediscovery-export-sealed'}}
  emitWorkflowHandoff:    {action: send, channel: {$ref: '#/channels/workflow-handoff-created'}}
  emitContextSwitched:    {action: send, channel: {$ref: '#/channels/context-switched'}}
  emitReputationChanged:  {action: send, channel: {$ref: '#/channels/reputation-changed'}}
  emitDlpQuarantined:     {action: send, channel: {$ref: '#/channels/dlp-quarantined'}}
  emitDlpReleased:        {action: send, channel: {$ref: '#/channels/dlp-released'}}
  emitDkimRotated:        {action: send, channel: {$ref: '#/channels/dkim-key-rotated'}}
  emitMailboxRestored:    {action: send, channel: {$ref: '#/channels/mailbox-restored'}}

components:
  messages:
    MessageReceived:
      name: MessageReceived
      contentType: application/json
      summary: Inbound SMTP message persisted to mailbox
      payload: {$ref: '#/components/schemas/MessageReceivedPayload'}

    MessageSent:
      name: MessageSent
      contentType: application/json
      payload: {$ref: '#/components/schemas/MessageSentPayload'}

    MessageDelivered:
      name: MessageDelivered
      contentType: application/json
      payload: {$ref: '#/components/schemas/MessageDeliveredPayload'}

    MessageBounced:
      name: MessageBounced
      contentType: application/json
      payload: {$ref: '#/components/schemas/MessageBouncedPayload'}

    LegalHoldEngaged:
      name: LegalHoldEngaged
      contentType: application/json
      payload: {$ref: '#/components/schemas/LegalHoldEngagedPayload'}

    LegalHoldReleased:
      name: LegalHoldReleased
      contentType: application/json
      payload: {$ref: '#/components/schemas/LegalHoldReleasedPayload'}

    RetentionExpired:
      name: RetentionExpired
      contentType: application/json
      payload: {$ref: '#/components/schemas/RetentionExpiredPayload'}

    EDiscoveryExportSealed:
      name: EDiscoveryExportSealed
      contentType: application/json
      payload: {$ref: '#/components/schemas/EDiscoveryExportSealedPayload'}

    MailWorkflowHandoffCreated:
      name: MailWorkflowHandoffCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/MailWorkflowHandoffCreatedPayload'}

    MailContextSwitched:
      name: MailContextSwitched
      contentType: application/json
      payload: {$ref: '#/components/schemas/MailContextSwitchedPayload'}

    MailDeliverabilityReputationChanged:
      name: MailDeliverabilityReputationChanged
      contentType: application/json
      payload: {$ref: '#/components/schemas/MailDeliverabilityReputationChangedPayload'}

    DlpQuarantined:
      name: DlpQuarantined
      contentType: application/json
      payload: {$ref: '#/components/schemas/DlpQuarantinedPayload'}

    DlpReleased:
      name: DlpReleased
      contentType: application/json
      payload: {$ref: '#/components/schemas/DlpReleasedPayload'}

    DkimKeyRotated:
      name: DkimKeyRotated
      contentType: application/json
      payload: {$ref: '#/components/schemas/DkimKeyRotatedPayload'}

    MailMailboxRestored:
      name: MailMailboxRestored
      contentType: application/json
      payload: {$ref: '#/components/schemas/MailMailboxRestoredPayload'}

  schemas:
    Common:
      type: object
      properties:
        event_id: {type: string, description: ULID}
        emitted_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519}
        tenant_id: {type: string, nullable: true}

    MessageReceivedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [message_id, mailbox_id, context_kind, dkim_result, spf_result, dmarc_result]
          properties:
            message_id: {type: string}
            mailbox_id: {type: string, format: ulid}
            context_kind: {type: string, enum: [Personal, Professional]}
            from: {type: string, format: email}
            to: {type: array, items: {type: string, format: email}}
            subject_hash: {type: string, description: SHA-256 of subject; plaintext NOT emitted}
            size_bytes: {type: integer}
            dkim_result: {type: string, enum: [pass, fail, none, neutral, policy, temperror, permerror]}
            spf_result: {type: string, enum: [pass, fail, softfail, neutral, none, temperror, permerror]}
            dmarc_result: {type: string, enum: [pass, fail, bestguesspass, none]}
            arc_chain: {type: string, enum: [pass, fail, none]}
            abuse_verdict: {type: string, enum: [clean, spam, phish, malware, dlp]}
            retention_class: {type: string}
            data_class: {type: string}

    MessageSentPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [message_id, mailbox_id, dkim_selector]
          properties:
            message_id: {type: string}
            mailbox_id: {type: string, format: ulid}
            context_kind: {type: string, enum: [Personal, Professional]}
            dkim_selector: {type: string}
            dkim_algorithm: {type: string, enum: [ed25519-sha256, rsa-sha256]}
            recipients_count: {type: integer}

    MessageDeliveredPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            message_id: {type: string}
            recipient_mx: {type: string}
            delivery_attempt: {type: integer}
            mta_response_code: {type: string}

    MessageBouncedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            message_id: {type: string}
            bounce_class: {type: string, enum: [hard, soft, transient, mailbox_full, rejected_policy, unknown]}
            smtp_status_code: {type: string, description: RFC 3463 enhanced status}
            dsn_blob_ref: {type: string}

    LegalHoldEngagedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [hold_id, scope, approver_a, approver_b]
          properties:
            hold_id: {type: string, format: ulid}
            scope:
              type: object
              properties:
                mailbox_ids: {type: array, items: {type: string, format: ulid}}
                date_range: {type: object}
            approver_a: {type: string, description: OIDC subject}
            approver_b: {type: string, description: OIDC subject (distinct from approver_a)}
            chain_of_custody_seal: {type: string}

    LegalHoldReleasedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            hold_id: {type: string, format: ulid}
            released_by: {type: string}
            second_releaser: {type: string, description: four-eyes second signature}

    RetentionExpiredPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            mailbox_id: {type: string, format: ulid}
            message_count: {type: integer}
            retention_class: {type: string}
            statutory_floor_check: {type: string, enum: [pass, would_have_violated_but_for_floor]}
            hold_check: {type: string, enum: [no_hold, held_so_skipped]}

    EDiscoveryExportSealedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            export_id: {type: string, format: ulid}
            hold_id: {type: string, format: ulid}
            artifact_digest: {type: string}
            chain_of_custody_seal: {type: string}
            expires_at: {type: string, format: date-time}
            plaintext_disclosed: {type: boolean}
            plaintext_disclosure_approvers: {type: array, items: {type: string}}

    MailWorkflowHandoffCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          required: [source_message_id, workflow_item_id, consent_basis]
          properties:
            source_message_id: {type: string}
            mailbox_id: {type: string, format: ulid}
            workflow_item_id: {type: string, format: ulid}
            consent_basis: {type: string, enum: [user_explicit_action, tenant_policy_basis]}
            consent_evidence_ref: {type: string}
            extracted_payload_digest: {type: string, description: SHA-256 of extracted payload}

    MailContextSwitchedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            user_id: {type: string}
            from_context: {type: string, enum: [Personal, Professional]}
            to_context: {type: string, enum: [Personal, Professional]}
            session_id: {type: string}

    MailDeliverabilityReputationChangedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            ip_pool: {type: string}
            dkim_domain: {type: string}
            score: {type: number, minimum: 0, maximum: 100}
            previous_score: {type: number}
            evaluated_at: {type: string, format: date-time}
            triggers: {type: array, items: {type: string, enum: [bounce_rate_spike, complaint_rate_spike, rbl_listing, dmarc_alignment_drop]}}

    DlpQuarantinedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            quarantine_id: {type: string, format: ulid}
            mailbox_id: {type: string, format: ulid}
            message_id: {type: string}
            match_rule_ids: {type: array, items: {type: string}}
            data_class_inferred: {type: string}

    DlpReleasedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            quarantine_id: {type: string, format: ulid}
            decision: {type: string, enum: [release, redact_and_release, discard, escalate]}
            reviewer_a: {type: string}
            reviewer_b: {type: string, nullable: true, description: required for PHI/PCI scope}

    DkimKeyRotatedPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            old_selector: {type: string}
            new_selector: {type: string}
            reason: {type: string, enum: [planned, emergency_compromise, offboarding, audit_finding]}
            overlap_window_days: {type: integer, default: 14}

    MailMailboxRestoredPayload:
      allOf:
        - $ref: '#/components/schemas/Common'
        - type: object
          properties:
            mailbox_id: {type: string, format: ulid}
            restored_to: {type: string, format: date-time}
            job_id: {type: string, format: ulid}
            approver_ids: {type: array, items: {type: string}}
            scope: {type: string, enum: [single_mailbox, tenant_wide, cell_wide]}
