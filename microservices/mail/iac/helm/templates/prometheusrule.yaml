apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oya-mail.fullname" . }}-burn-rate
  namespace: {{ .Release.Namespace }}
  labels:
    oyatie/microservice: mail
    release: prometheus
spec:
  groups:
    - name: mail-availability
      interval: 60s
      rules:
        - alert: mail-inbound-fast-burn-1h-14x
          expr: |
            (1 - (sum(rate(oya_mail_inbound_smtp_data_accepted_total[1h]))
                 / sum(rate(oya_mail_inbound_smtp_data_total[1h])))) * 60 * 24 * 30 > 14.4 * 0.0005
          for: 5m
          labels: {severity: page, microservice: mail, sli: inbound-availability, burn: fast}
          annotations:
            summary: "mail inbound SMTP availability fast-burn (1h 14x)"
            runbook_url: microservices/mail/runbooks/smtp-queue-backup.md

    - name: mail-deliverability
      interval: 60s
      rules:
        - alert: mail-outbound-queue-backup
          expr: max(oya_mail_outbound_queue_depth_seconds) > 60
          for: 5m
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/runbooks/smtp-queue-backup.md}
        - alert: mail-deliverability-reputation-collapse
          expr: min(oya_mail_deliverability_reputation_score) < 70
          for: 10m
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/runbooks/smtp-queue-backup.md}
        - alert: mail-dkim-key-overdue-90d
          expr: max(oya_mail_dkim_key_age_days) > 90
          for: 1h
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/runbooks/dkim-key-rotation.md}

    - name: mail-dual-context
      interval: 60s
      rules:
        - alert: mail-cross-context-leak
          expr: increase(oya_mail_cross_context_routing_leak_total[5m]) > 0
          for: 1m
          labels: {severity: page, microservice: mail, invariant: DCI-02}
          annotations: {runbook_url: microservices/mail/policy/dual-context-isolation.md}
        - alert: mail-personal-pillar-hold-attempt
          expr: increase(oya_mail_personal_pillar_hold_attempt_total[5m]) > 0
          for: 1m
          labels: {severity: page, microservice: mail, invariant: DCI-04}
          annotations: {runbook_url: microservices/mail/policy/dual-context-isolation.md}
        - alert: mail-personal-pillar-kms-violation
          expr: increase(oya_mail_personal_pillar_kms_violation_total[5m]) > 0
          for: 1m
          labels: {severity: page, microservice: mail, invariant: DCI-03}
          annotations: {runbook_url: microservices/mail/runbooks/e2e-encryption-key-recovery.md}

    - name: mail-dlp
      interval: 60s
      rules:
        - alert: mail-dlp-quarantine-stall
          expr: max(oya_mail_dlp_quarantine_age_p99_seconds) > 7200
          for: 30m
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/runbooks/dlp-quarantine-release.md}
        - alert: mail-spam-fp-surge
          expr: oya_mail_inbound_spam_false_positive_rate_5m > 0.05
          for: 10m
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/runbooks/spam-rule-rollback.md}

    - name: mail-legal-hold
      interval: 60s
      rules:
        - alert: mail-legal-hold-bypass-attempt
          expr: increase(oya_mail_legal_hold_bypass_attempt_total[5m]) > 0
          for: 1m
          labels: {severity: page, microservice: mail}
          annotations: {runbook_url: microservices/mail/policy/dual-context-isolation.md}

    - name: mail-retention
      interval: 60s
      rules:
        - alert: mail-retention-floor-violation
          expr: increase(oya_mail_retention_floor_violation_attempt_total[5m]) > 0
          for: 1m
          labels: {severity: page}
          annotations: {runbook_url: microservices/mail/policy/data-residency.md}

    - name: mail-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: mail-llm-capability-circuit-open
          expr: max(oya_mail_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: mail
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "mail LLM/capability circuit-breaker tripped open"
        - alert: mail-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_mail_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: mail
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "mail capability retry-budget exhausted"

    - name: mail-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: mail-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_mail_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: mail
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "mail tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: mail-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: mail-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"mail-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: mail
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "mail pod CPU saturation > 70% sustained 10m"
        - alert: mail-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_mail_responses_5xx_total[5m]))
            /
            sum(rate(oya_mail_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: mail
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "mail 5xx rate > 1% sustained 5m"
        - alert: mail-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_mail_responses_total[5m]))
              /
              sum(rate(oya_mail_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: mail
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "mail inbound RPS dropped > 90% vs prior hour"

    - name: mail-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: mail-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_mail_request_success_total[1h]))
              /
              sum(rate(oya_mail_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: mail
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "mail aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: mail-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_mail_request_success_total[6h]))
              /
              sum(rate(oya_mail_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: mail
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "mail aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
