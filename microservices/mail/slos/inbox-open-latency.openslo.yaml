apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-inbox-open-latency
  displayName: "mail: inbox-open latency p95"
  labels:
    microservice: mail
    bc: imap-frontend
    sli_class: latency
    tier: hero-product
    owner_team: axis-mail
    pack_scope: all
    data_classes: PII_IDENTIFYING,BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Inbox open p95 latency SLO. A request is "good" when the REST/JMAP/IMAP
    "open inbox" round-trip (auth → fetch latest 50 threads + flags) returns
    in ≤ 300ms. PRD §"Performance" target.
  service: mail
  indicator:
    metadata: {name: mail-inbox-open-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_mail_inbox_open_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99      # 99% of timeslices ≤ 300ms
      op: lte
      value: 0.3        # seconds
      displayName: "30d rolling p95 ≤ 300ms"
  alertPolicies:
    - alertPolicyRef: mail-inbox-fast-burn-1h-14x
    - alertPolicyRef: mail-inbox-slow-burn-6h-6x
    - alertPolicyRef: mail-inbox-ticket-burn-3d-1x
