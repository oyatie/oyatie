apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-thread-render-latency
  displayName: "mail: thread-render latency p95"
  labels:
    microservice: mail
    bc: imap-frontend
    sli_class: latency
    owner_team: axis-mail
    pack_scope: all
spec:
  description: |
    Thread render p95 SLO. A request is "good" when fetching full thread
    body + parts returns in ≤ 150ms. PRD §"Performance" target.
  service: mail
  indicator:
    metadata: {name: mail-thread-render-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_mail_thread_render_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.15
      displayName: "30d rolling p95 ≤ 150ms"
  alertPolicies:
    - alertPolicyRef: mail-thread-fast-burn-1h-14x
    - alertPolicyRef: mail-thread-slow-burn-6h-6x
