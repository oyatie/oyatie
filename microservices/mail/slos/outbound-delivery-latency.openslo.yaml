apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-outbound-delivery-latency
  displayName: "mail: outbound delivery latency (queue → recipient MX) p99"
  labels:
    microservice: mail
    bc: outbound-smtp
    sli_class: latency
    tier: hero-product
    owner_team: axis-mail + ops-deliverability
    pack_scope: all
spec:
  description: |
    Outbound delivery latency p99 SLO. A delivery is "good" when handed off
    to recipient MX with 2xx response within ≤ 30s p99. PRD §"Performance".
    Note: this is the queue→MX leg; submission→queue is a separate SLO.
  service: mail
  indicator:
    metadata: {name: mail-outbound-delivery-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_mail_outbound_delivery_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 30.0
      displayName: "30d rolling p99 ≤ 30s"
  alertPolicies:
    - alertPolicyRef: mail-outbound-fast-burn-1h-14x
    - alertPolicyRef: mail-outbound-slow-burn-6h-6x
