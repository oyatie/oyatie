apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-search-latency
  displayName: "mail: encrypted-token search latency p95"
  labels:
    microservice: mail
    bc: search-index
    sli_class: latency
    owner_team: axis-mail
    pack_scope: all
spec:
  description: |
    Encrypted-token search p95 SLO over 1M-message reference corpus. A request
    is "good" when search returns first page of results in ≤ 500ms.
    PRD §"Performance" target. Microsoft Exchange parity benchmark.
  service: mail
  indicator:
    metadata: {name: mail-search-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_mail_search_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.5
      displayName: "30d rolling p95 ≤ 500ms"
  alertPolicies:
    - alertPolicyRef: mail-search-fast-burn-1h-14x
    - alertPolicyRef: mail-search-slow-burn-6h-6x
