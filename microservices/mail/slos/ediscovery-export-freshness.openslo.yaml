# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-ediscovery-export-freshness
  displayName: "mail: eDiscovery export freshness (sealed within 24h)"
  labels:
    microservice: mail
    bc: legal-hold
    sli_class: freshness
    owner_team: axis-mail + ops-legal
    pack_scope: all
spec:
  description: |
    eDiscovery export freshness SLO. A request is "good" when the sealed
    bundle is available within ≤ 24h for a 10-year archive of a 5GB mailbox.
    PRD §"Performance".
  service: mail
  indicator:
    metadata: {name: mail-ediscovery-export-freshness}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_mail_ediscovery_export_duration_seconds_bucket[30d])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.995
      op: lte
      value: 86400  # 24h
      displayName: "30d rolling p99 ≤ 24h"
  alertPolicies:
    - alertPolicyRef: mail-ediscovery-slow-burn-6h-6x
