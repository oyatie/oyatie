apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-legal-hold-engage-latency
  displayName: "mail: legal-hold engage latency (approval → hold confirmed)"
  labels:
    microservice: mail
    bc: legal-hold
    sli_class: latency
    owner_team: axis-mail + council-privacy + ops-legal
    pack_scope: all
    compliance: [HIPAA-164.502b, GDPR-Art18, BominalADR-0215]
spec:
  description: |
    Legal hold engage p99 latency SLO. A hold is "good" when the four-eyes
    co-signed approval is sealed + scope blocked in retention sweep within
    ≤ 2s p99 (PRD AC-10).
  service: mail
  indicator:
    metadata: {name: mail-legal-hold-engage-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_mail_legal_hold_engage_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 2.0
      displayName: "30d rolling p99 ≤ 2s"
  alertPolicies:
    - alertPolicyRef: mail-legal-hold-fast-burn-1h-14x
