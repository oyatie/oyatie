# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-dual-context-correctness
  displayName: "mail: cross-context refusal rate (must be 100%)"
  labels:
    microservice: mail
    bc: dual-context-isolation
    sli_class: correctness
    tier: load-bearing-invariant
    owner_team: axis-mail + council-privacy
    pack_scope: all
    compliance: [GDPR-Art25, GDPR-Art32, KR-PIPA-Art23, HIPAA-164.502b]
spec:
  description: |
    Dual-context invariant DCI-02 correctness SLO. A cross-context routing
    attempt is "good" if it is REFUSED (403 + audit-emit). Anything else is
    a catastrophic failure of pillar isolation. Target = 100%.
  service: mail
  indicator:
    metadata: {name: mail-cross-context-refusal-ratio}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_mail_cross_context_routing_refused_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_mail_cross_context_routing_attempt_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0   # 100% — load-bearing invariant
      displayName: "100% cross-context refusal (no error budget; any leak is Sev-1)"
  alertPolicies:
    - alertPolicyRef: mail-dual-context-any-leak-page
