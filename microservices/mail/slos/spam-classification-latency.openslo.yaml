# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-spam-classification-latency
  displayName: "mail: spam classification latency p99"
  labels:
    microservice: mail
    bc: inbound-smtp
    sli_class: latency
    owner_team: axis-mail + axis-trust-safety
    pack_scope: all
spec:
  description: |
    Spam + phishing + DLP classification p99 latency. A classification is
    "good" when the verdict is decided ≤ 100ms p99 per PRD. Includes Rspamd
    score + ML model inference + rule cascade.
  service: mail
  indicator:
    metadata: {name: mail-spam-classification-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_mail_inbound_spam_classify_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 0.1
      displayName: "30d rolling p99 ≤ 100ms"
  alertPolicies:
    - alertPolicyRef: mail-spam-fast-burn-1h-14x
