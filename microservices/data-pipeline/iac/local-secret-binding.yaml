apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: data-pipeline-local-openbao-binding
  labels:
    service: data-pipeline
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: data-pipeline-local-ops
  vaultPath: kv/data-pipeline/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: data-pipeline.local-ops.v1
  requiredFor:
    - ingest-worker
    - transform-runner
