apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foundry-evidence

commonLabels:
  app.kubernetes.io/part-of: foundry-evidence
  oyatie.dev/microservice: foundry-evidence

resources:
  - ../../helm/evidence-builder
  - ../../helm/postgres
  - ../../helm/evidence-blob-store

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: foundry-evidence-cedar-policies
    files:
      - ../../../policy/tenant-scope.cedar
      - ../../../policy/regulator-export-scope.cedar
      - ../../../policy/ci-scope.cedar
      - ../../../policy/public-read.cedar
      - ../../../policy/auditor-scope.cedar
