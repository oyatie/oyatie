# Helm values for the foundry-evidence blob-store configuration.
# foundry-evidence does NOT own the substrate WORM bucket; that belongs to
# audit-chain µservice. This chart provisions:
#   1. IAM grant for foundry-evidence to READ the substrate WORM (for query path).
#   2. A foundry-evidence-owned dead-letter bucket (NOT WORM).
#   3. A regulator-export staging bucket (NOT WORM; ephemeral).

substrateWormBucket:
  # Owned by audit-chain µservice. foundry-evidence is a READ-side consumer.
  bucketName: "audit-chain-worm-{{ .Values.pack }}"
  region: "{{ .Values.packRegion }}"
  iamGrant:
    foundryEvidencePrincipal: "spiffe://oyatie/foundry-evidence/{{ .Values.pack }}"
    permissions:
      - GetObject
      - ListBucket
    crossMicroserviceAttestation: true  # IAM bound to the SPIFFE identity, not a static key

deadLetterBucket:
  bucketName: "foundry-evidence-deadletter-{{ .Values.pack }}"
  region: "{{ .Values.packRegion }}"
  encryption:
    sseAlgorithm: aws:kms
    kmsKeyId: "alias/foundry-evidence-{{ .Values.pack }}"
  lifecycle:
    rules:
      - id: dead-letter-expire-30d
        status: Enabled
        expiration:
          days: 30
  acl: private
  publicAccessBlock:
    blockPublicAcls: true
    ignorePublicAcls: true
    blockPublicPolicy: true
    restrictPublicBuckets: true

regulatorExportStagingBucket:
  bucketName: "foundry-evidence-regulator-export-staging-{{ .Values.pack }}"
  region: "{{ .Values.packRegion }}"
  encryption:
    sseAlgorithm: aws:kms
    kmsKeyId: "alias/foundry-evidence-{{ .Values.pack }}"
  lifecycle:
    rules:
      - id: staging-expire-7d
        status: Enabled
        expiration:
          days: 7
  acl: private
  publicAccessBlock:
    blockPublicAcls: true
    ignorePublicAcls: true
    blockPublicPolicy: true
    restrictPublicBuckets: true
  # Pre-signed URLs from this bucket are TTL-capped to 5 min per Cedar policy.

pack: pack-kr
packRegion: ap-seoul-1
