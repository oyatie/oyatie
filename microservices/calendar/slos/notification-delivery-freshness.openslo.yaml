# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: calendar-notification-delivery-freshness
  displayName: "calendar: invitation + reminder notification delivery freshness p95"
  labels:
    microservice: calendar
    bc: invitation-flow
    sli_class: freshness
    tier: hero-product
    owner_team: axis-calendar + axis-mail
    pack_scope: all
    data_classes: PII_IDENTIFYING
spec:
  description: |
    Notification delivery freshness SLO. A notification (invitation,
    reminder, RSVP-result-fanout) is "good" when it is delivered to the
    next-hop sink (mail outbound SMTP, push notification queue, or
    in-product feed) in ≤ 60s p95 from emission. Per PRD problem-
    statement target.
  service: calendar
  indicator:
    metadata: {name: calendar-notification-delivery-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_calendar_notification_delivery_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 60
      displayName: "30d rolling p95 ≤ 60s emission-to-sink"
  alertPolicies:
    - alertPolicyRef: calendar-notification-fast-burn-1h-14x
    - alertPolicyRef: calendar-notification-slow-burn-6h-6x
