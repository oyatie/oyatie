# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:workflow-studio:t1-assist:v1
name: t1-assist
namespace: workflow-studio
display_name: Studio T1 — LLM-assisted draft (advisory; human reviews)
description: |
  T1-tier capability: workflow-studio bridges to foundry-providers to draft a candidate
  workflow_spec.v1.json from tenant prose. The completion is:
  1. PII-redacted before LLM submission (per threat-model T-I-05).
  2. Prompt-injection-scrubbed (per threat-model T-S-05).
  3. Schema-validated against the canonical workflow_spec.v1.json schema BEFORE the
     editor surfaces it.
  4. Surfaced to the human author for explicit accept/reject; never auto-saved.

  T1 because the LLM proposes; the human disposes. No autonomous action.

owner_team: axis-workflow + foundry-providers-team
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0131, ADR-0140 (retired per ADR-0145), ADR-0164]
related_specs: [/specs/microservices/workflow-studio.json]
related_artifacts:
  - microservices/workflow-studio/PRD.md FR-12
  - microservices/workflow-studio/threat-model.md §"T-I-05" + §"T-S-05" + §"T-D-04"
  - microservices/workflow-studio/runbooks/copilot-degraded-fallback.md
  - microservices/workflow-studio/contracts/openapi.yaml /llm-assist:draft

autonomy_tier: T1
# T1 = advisory; LLM proposes, human disposes. No autonomous mutation.

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: definition_id
    type: string
    required: true
  - name: prose
    type: string
    max_length: 10000
    required: true
  - name: consent_acknowledged
    type: boolean
    required: true
    description: |
      Must be true; per tenant-scope.cedar PERMIT 5, LLM-assist invocation requires
      explicit per-session consent click.
  - name: target_jurisdiction
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa, base]
    required: false
    default: base

outputs:
  - name: draft_id
    type: string
  - name: candidate_spec
    type: object
    schema: WorkflowSpec (per contracts/openapi.yaml)
  - name: schema_valid
    type: boolean
  - name: validation_errors
    type: array
  - name: prompt_injection_detected
    type: boolean
  - name: pii_redacted_count
    type: integer
  - name: provider_routed
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  # Tenant prose may contain BEHAVIORAL_TENANT_PRODUCT signal.
  - PII_QUASI_IDENTIFIER
  # Prose occasionally mentions end-user data; redactor scrubs before LLM submission.
  - AUDIT
  # Every invocation audit-sealed.

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.workflow-studio.llm-assist.draft

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.02
  cost_drivers:
    - LLM provider token usage (typical prose 100-500 tokens; completion 500-2000 tokens)
    - PII redactor + injection classifier (sub-millisecond)
    - Schema validation on completion
    - foundry-providers SDK overhead

cedar_policy_fragments:
  - microservices/workflow-studio/policy/tenant-scope.cedar  # PERMIT 5
  - microservices/workflow-studio/policy/ci-scope.cedar

eval_set:
  reference_inputs_path: microservices/workflow-studio/capabilities/eval/t1-assist-reference.jsonl
  pass_threshold: 0.80
  eval_metric: |
    Composite: (a) schema_valid_rate over corpus of 100 prose inputs;
    (b) human-author-accept rate (proxy via reviewer panel);
    (c) prompt-injection-bypass rate (must be 0%);
    (d) PII-leak rate (must be < 0.1% of invocations).
  cadence: per-release
  reference: |
    Test corpus authored by axis-workflow + council-design-system; covers 6 domain
    packs (Agentic / Dev / Business / Healthcare / Supply-Chain / Delivery) × 3 complexity
    tiers (simple / medium / multi-step). Adversarial-set covers prompt-injection vectors
    from OWASP Top 10 LLM A01 + curated by ops-security.

regulatory_compliance:
  ai_act_2024_1689:
    # EU AI Act applies for pack-eu tenants invoking LLM-assist
    classification: limited-risk-ai-system  # Annex III §10 (advisory drafting)
    arts_applicable: [Art. 9 risk management, Art. 13 transparency, Art. 14 human oversight, Art. 50 transparency to users]
    transparency_obligation: tenant operator UI shows "AI-generated; review before accept"
    human_oversight: explicit-accept (never auto-save) per FR-12

sunset:
  status: none
  notes: ""
