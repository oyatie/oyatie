apiVersion: openbao.io/v1
kind: SecretReference
metadata:
  name: workflow-studio-secrets
  namespace: workflow-studio
spec:
  references:
    - mountPath: secret/workflow-studio/visual-canvas-rest/spiffe
      injectAs: env
      envVar: SPIFFE_IDENTITY
    - mountPath: secret/workflow-studio/visual-canvas-rest/postgres
      injectAs: env
      envVar: POSTGRES_CONN
    - mountPath: secret/workflow-studio/visual-canvas-rest/redis
      injectAs: env
      envVar: REDIS_AUTH
    - mountPath: secret/workflow-studio/audit-chain/signing-key
      injectAs: file
      filePath: /etc/workflow-studio/audit-chain/ed25519.pem
    - mountPath: secret/workflow-studio/node-library-signing/pack-${PACK}
      injectAs: file
      filePath: /etc/workflow-studio/node-library-signing/pack-key.pem
    - mountPath: secret/workflow-studio/llm-assist/foundry-providers-token
      injectAs: env
      envVar: FOUNDRY_PROVIDERS_TOKEN
  rotation:
    spiffeIdentity: { intervalDays: 1 }
    auditChainSigningKey: { intervalDays: 90 }
    nodeLibrarySigningKey: { intervalDays: 90 }
