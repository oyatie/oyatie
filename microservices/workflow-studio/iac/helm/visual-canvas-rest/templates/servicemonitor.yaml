{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-visual-canvas-rest
  namespace: workflow-studio
  labels:
    app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
    oyatie/microservice: workflow-studio
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_oyatie_microservice]
          targetLabel: microservice
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: pack
          regex: workflow-studio-(.+)
          replacement: $1
{{- end }}
