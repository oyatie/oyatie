# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-visual-canvas-rest
  namespace: workflow-studio
  labels:
    app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
    app.kubernetes.io/part-of: oya-workflow-studio
    oyatie/microservice: workflow-studio
    oyatie/bounded_context: visual-canvas
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
        oyatie/microservice: workflow-studio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: workflow-studio-visual-canvas-rest
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
      containers:
        - name: visual-canvas-rest
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            - containerPort: {{ .Values.service.metricsPort }}
              name: metrics
          env:
            - name: PER_TENANT_SESSION_CAP
              value: "{{ .Values.perTenantSessionCap }}"
            - name: OIDC_ISSUER
              value: "{{ .Values.oidc.issuer }}"
            - name: OIDC_AUDIENCE
              value: "{{ .Values.oidc.audience }}"
            - name: CEDAR_EVALUATOR_ENDPOINT
              value: "{{ .Values.cedar.evaluatorEndpoint }}"
            - name: CEDAR_FAIL_CLOSED
              value: "{{ .Values.cedar.failClosed }}"
            - name: SPIFFE_IDENTITY_REF
              value: "${openbao:{{ .Values.secrets.spiffeIdentityPath }}}"
            - name: POSTGRES_CONN_REF
              value: "${openbao:{{ .Values.secrets.postgresConnectionPath }}}"
            - name: REDIS_AUTH_REF
              value: "${openbao:{{ .Values.secrets.redisAuthPath }}}"
            - name: ED25519_SIGNING_KEY_REF
              value: "${openbao:{{ .Values.secrets.ed25519SigningKeyPath }}}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
