# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-visual-canvas-rest
  namespace: workflow-studio
  labels:
    app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
    oyatie/microservice: workflow-studio
    release: prometheus
spec:
  groups:
    - name: oya-workflow-studio-visual-canvas-rest.recording
      interval: 30s
      rules:
        - record: oya:workflow_studio_editor_rest_availability:ratio_5m
          expr: |
            sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest",status!~"5.."}[5m]))
            / sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest"}[5m]))
        - record: oya:workflow_studio_save_round_trip:p99_5m
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="oya-workflow-studio-visual-canvas-rest",route="/workflow-definitions/{definition_id}:save"}[5m])))

    - name: oya-workflow-studio-visual-canvas-rest.alerts
      rules:
        - alert: StudioEditorRestFastBurn
          expr: |
            (1 - oya:workflow_studio_editor_rest_availability:ratio_5m) > 14.4 * (1 - 0.9995)
          for: 5m
          labels:
            severity: page
            service: oya-workflow-studio-visual-canvas-rest
          annotations:
            summary: "Studio editor REST availability burn-rate fast-burn"
            runbook: "microservices/workflow-studio/runbooks/canvas-perf-regression.md"

        - alert: StudioSaveRoundTripBudgetBreached
          expr: oya:workflow_studio_save_round_trip:p99_5m > 0.2
          for: 15m
          labels:
            severity: ticket
            service: oya-workflow-studio-visual-canvas-rest
          annotations:
            summary: "Studio save round-trip p99 > 200ms (stable budget breached)"
            runbook: "microservices/workflow-studio/runbooks/canvas-perf-regression.md"

        - alert: StudioCollabSilentLossDetected
          expr: oya_workflow_studio_collab_silent_loss_attempt_total > 0
          for: 0m
          labels:
            severity: page
            severity_level: sev1
            service: oya-workflow-studio-collab-crdt-worker
          annotations:
            summary: "AC-06 silent-loss invariant violated — Sev-1"
            runbook: "microservices/workflow-studio/runbooks/collab-conflict-resolution.md"
{{- end }}
