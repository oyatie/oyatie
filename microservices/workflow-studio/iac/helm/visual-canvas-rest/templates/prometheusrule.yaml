{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-visual-canvas-rest
  namespace: workflow-studio
  labels:
    app.kubernetes.io/name: oya-workflow-studio-visual-canvas-rest
    oyatie/microservice: workflow-studio
    release: prometheus
spec:
  groups:
    - name: oya-workflow-studio-visual-canvas-rest.recording
      interval: 30s
      rules:
        - record: oya:workflow_studio_editor_rest_availability:ratio_5m
          expr: |
            sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest",status!~"5.."}[5m]))
            / sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest"}[5m]))
        - record: oya:workflow_studio_save_round_trip:p99_5m
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="oya-workflow-studio-visual-canvas-rest",route="/workflow-definitions/{definition_id}:save"}[5m])))

    - name: oya-workflow-studio-visual-canvas-rest.alerts
      rules:
        - alert: StudioEditorRestFastBurn
          expr: |
            (1 - oya:workflow_studio_editor_rest_availability:ratio_5m) > 14.4 * (1 - 0.9995)
          for: 5m
          labels:
            severity: page
            service: oya-workflow-studio-visual-canvas-rest
          annotations:
            summary: "Studio editor REST availability burn-rate fast-burn"
            runbook: "microservices/workflow-studio/runbooks/canvas-perf-regression.md"

        - alert: StudioSaveRoundTripBudgetBreached
          expr: oya:workflow_studio_save_round_trip:p99_5m > 0.2
          for: 15m
          labels:
            severity: ticket
            service: oya-workflow-studio-visual-canvas-rest
          annotations:
            summary: "Studio save round-trip p99 > 200ms (stable budget breached)"
            runbook: "microservices/workflow-studio/runbooks/canvas-perf-regression.md"

        - alert: StudioCollabSilentLossDetected
          expr: oya_workflow_studio_collab_silent_loss_attempt_total > 0
          for: 0m
          labels:
            severity: page
            severity_level: sev1
            service: oya-workflow-studio-collab-crdt-worker
          annotations:
            summary: "AC-06 silent-loss invariant violated — Sev-1"
            runbook: "microservices/workflow-studio/runbooks/collab-conflict-resolution.md"
{{- end }}

    - name: workflow-studio-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: workflow-studio-llm-capability-circuit-open
          expr: max(oya_workflow_studio_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: workflow-studio
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "workflow-studio LLM/capability circuit-breaker tripped open"
        - alert: workflow-studio-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_workflow_studio_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: workflow-studio
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "workflow-studio capability retry-budget exhausted"

    - name: workflow-studio-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: workflow-studio-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_workflow_studio_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: workflow-studio
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "workflow-studio tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: workflow-studio-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: workflow-studio-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"workflow-studio-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: workflow-studio
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "workflow-studio pod CPU saturation > 70% sustained 10m"
        - alert: workflow-studio-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_workflow_studio_responses_5xx_total[5m]))
            /
            sum(rate(oya_workflow_studio_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: workflow-studio
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "workflow-studio 5xx rate > 1% sustained 5m"
        - alert: workflow-studio-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_workflow_studio_responses_total[5m]))
              /
              sum(rate(oya_workflow_studio_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: workflow-studio
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "workflow-studio inbound RPS dropped > 90% vs prior hour"

    - name: workflow-studio-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: workflow-studio-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_workflow_studio_request_success_total[1h]))
              /
              sum(rate(oya_workflow_studio_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: workflow-studio
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "workflow-studio aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: workflow-studio-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_workflow_studio_request_success_total[6h]))
              /
              sum(rate(oya_workflow_studio_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: workflow-studio
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "workflow-studio aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
