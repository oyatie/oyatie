apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-collab-crdt-no-silent-loss
  displayName: Workflow Studio Collab — No silent loss (correctness invariant)
  labels:
    microservice: workflow-studio
    bounded_context: collab-crdt
    sli_kind: correctness
    tier: external-facing
    plane: data
spec:
  service: oya-workflow-studio-collab-crdt-worker
  description: |
    Correctness SLI: zero silent CRDT op losses. AC-06 load-bearing invariant.
    The "good" metric is total ops minus silent_loss_attempt_total; target is 100%.
  indicator:
    metadata:
      name: collab-crdt-no-silent-loss-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_collab_op_published_total[5m])) - sum(rate(oya_workflow_studio_collab_silent_loss_attempt_total[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_workflow_studio_collab_op_published_total[5m]))'
  objectives:
    - target: 1.0  # 100% — any silent loss is Sev-1
      displayName: 100% of CRDT ops merge without silent loss (AC-06 invariant)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: collab-silent-loss-detected
      spec:
        description: ANY silent loss event → immediate Sev-1 page
        notificationTargets:
          - target: grafana-oncall:studio-sev1
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 1
              lookbackWindow: 5m
              alertAfter: 0m
