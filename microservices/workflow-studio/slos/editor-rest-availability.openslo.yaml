apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-workflow-studio-editor-rest-availability
  displayName: Workflow Studio Editor REST — Availability
  labels:
    microservice: workflow-studio
    bounded_context: visual-canvas
    tier: external-facing
    plane: data
spec:
  service: oya-workflow-studio-visual-canvas-rest
  description: |
    Studio editor REST availability SLI. The percentage of HTTP requests to the
    editor REST surface that complete without a 5xx status. GA target 99.95%.
  indicator:
    metadata:
      name: editor-rest-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest",status!~"5.."}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(http_request_total{service="oya-workflow-studio-visual-canvas-rest"}[5m]))'
  objectives:
    - target: 0.9995  # 99.95% GA per PRD §"Availability + SLO"
      displayName: 99.95% successful editor REST requests
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: editor-rest-fast-burn-1h
      spec:
        description: Fast-burn 1h burn-rate 14.4x → page on-call (Sev-2)
        notificationTargets:
          - target: grafana-oncall:studio-rest-pri
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 14.4
              lookbackWindow: 1h
              alertAfter: 5m
