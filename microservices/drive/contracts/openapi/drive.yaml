        retention_floor_seconds: {type: integer, description: "WORM retention period in seconds; cannot be reduced"}
        mode: {type: string, enum: [compliance, governance], description: "compliance per AWS S3 Object Lock terminology"}
        reason: {type: string}

    ImmutabilityRecord:
      type: object
      properties:
