openapi: 3.2.0
info:
  title: oyatie Drive µservice API
  version: 1.0.0
  description: |
    Drive µservice REST API. Surfaces file-store, folder-hierarchy, upload, download,
    sync, share-link, permissions, search-index, preview, dlp-virus-scan, and
    immutability-tier bounded contexts.

    Per ADR-0135 (unbundle) + ADR-0132 (no-grouping forward policy): drive is a
    standalone tenant-facing µservice. Dual-context (Personal / Professional) isolation
    enforced structurally per `policy/dual-context-isolation.md`.

    The same µservice also exposes an S3-compatible facade (under `/s3/`) and a
    WebDAV (RFC 4918) facade (under `/dav/`). This OpenAPI describes the oya-native
    API only; the S3 facade follows the AWS S3 SigV4 spec; the WebDAV facade follows
    RFC 4918.

    Authentication: OIDC + per-tenant API key (over HTTPS + mTLS where applicable);
    S3 facade uses SigV4; WebDAV uses Basic Auth over TLS + per-tenant credential.
    Authorisation: Cedar policies (`tenant-scope.cedar`, `auditor-scope.cedar`,
    `public-read.cedar`, `ci-scope.cedar`).
  contact:
    name: axis-drive
    email: drive@oyatie.com
  license:
    name: Internal-Use
servers:
  - url: https://drive.{pack}.oyatie.com/v1
    description: per-pack production endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
        default: kr

security:
  - oidcBearer: []
  - tenantApiKey: []

tags:
  - name: files
    description: File lifecycle (file-store BC)
  - name: folders
    description: Folder hierarchy (folder-hierarchy BC)
  - name: upload
    description: Multipart resumable upload (upload BC; tus.io 1.0 compatible)
  - name: download
    description: Range download + signed URL (download BC; RFC 9110 Range)
  - name: sync
    description: Delta-sync sessions (sync BC; FastCDC + LBFS)
  - name: share-links
    description: Share-link mint + revoke (share-link BC)
  - name: permissions
    description: Permission management (permissions BC)
  - name: search
    description: File search (search-index BC)
  - name: preview
    description: Preview render (preview BC)
  - name: scan
    description: Virus + DLP scan (dlp-virus-scan BC)
  - name: immutability
    description: WORM tier + legal hold (immutability-tier BC)

paths:
  /files:
    post:
      summary: Create file (single-shot ≤ 5MiB; use /upload for larger)
      tags: [files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/FileCreateMetadata'
                content:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    get:
      summary: List files in a folder (per tenant + context)
      tags: [files]
      parameters:
        - name: context
          in: query
          required: true
          schema: {type: string, enum: [personal, professional]}
        - name: parent_folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, maximum: 1000, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileListResponse'}

  /files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get file metadata
      tags: [files]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Update file metadata
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/File'}
    delete:
      summary: Soft-delete file to Trash (legal-hold + WORM blocks hard-delete)
      tags: [files]
      responses:
        '204':
          description: Trashed

  /files/{file_id}/versions:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: List file versions
      tags: [files]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileVersionListResponse'}

  /folders:
    post:
      summary: Create folder
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FolderCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}

  /folders/{folder_id}:
    parameters:
      - name: folder_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get folder
      tags: [folders]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}

  /upload/sessions:
    post:
      summary: Initiate multipart resumable upload (S3 multipart + tus 1.0 compatible)
      tags: [upload]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadSessionCreateRequest'}
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            Tus-Resumable:
              schema: {type: string, const: "1.0.0"}
            Upload-Length:
              schema: {type: integer}

  /upload/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    head:
      summary: Get upload session state (tus HEAD)
      tags: [upload]
      responses:
        '200':
          description: OK
          headers:
            Upload-Offset:
              schema: {type: integer}
            Upload-Length:
              schema: {type: integer}
    patch:
      summary: Upload chunk (tus PATCH; Content-Type=application/offset+octet-stream)
      tags: [upload]
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer}
        - name: Content-Length
          in: header
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk accepted
          headers:
            Upload-Offset:
              schema: {type: integer}
    delete:
      summary: Abort session (tus DELETE)
      tags: [upload]
      responses:
        '204':
          description: Aborted

  /download/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Range
        in: header
        schema: {type: string}
        description: HTTP Range header per RFC 9110
    get:
      summary: Download file bytes (range supported)
      tags: [download]
      responses:
        '200':
          description: Full content
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Partial content (range)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
          headers:
            Content-Range:
              schema: {type: string}

  /download/{file_id}/signed-url:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Mint a short-lived signed download URL
      tags: [download]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  default: 300
                  maximum: 86400
      responses:
        '201':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}

  /sync/sessions:
    post:
      summary: Open a delta-sync session (FastCDC + LBFS)
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncSessionCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncSession'}

  /sync/sessions/{session_id}/manifest:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Submit client chunk manifest; receive needed-chunks set
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChunkManifest'}
      responses:
        '200':
          description: Needed-chunks set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncDelta'}

  /share-links:
    post:
      summary: Mint share-link (password-protected / expiring / view-cap supported)
      tags: [share-links]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareLinkCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLink'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /share-links/{link_id}:
    parameters:
      - name: link_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      summary: Revoke share-link
      tags: [share-links]
      responses:
        '204':
          description: Revoked

  /share-links/{link_id}/access:
    parameters:
      - name: link_id
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Access a shared resource via signed link (public endpoint; no auth)
      tags: [share-links]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password_proof:
                  type: string
                  description: Argon2id-derived proof if link is password-protected
      responses:
        '200':
          description: OK; returns file or render
        '401':
          description: Password required
        '403':
          description: Forbidden (revoked / expired / view-cap exhausted / DLP flagged / malware)
        '410':
          description: Gone (revoked)

  /permissions:
    post:
      summary: Grant permission on file or folder
      tags: [permissions]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionGrantRequest'}
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permission'}

  /permissions/{permission_id}:
    parameters:
      - name: permission_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      summary: Revoke permission
      tags: [permissions]
      responses:
        '204':
          description: Revoked

  /search:
    get:
      summary: Search files (filename + full-text via Meilisearch + Tika)
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: context
          in: query
          required: true
          schema: {type: string, enum: [personal, professional]}
        - name: limit
          in: query
          schema: {type: integer, default: 50, maximum: 1000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}

  /preview/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: kind
        in: query
        schema: {type: string, enum: [thumbnail, first-page, video-frame], default: thumbnail}
    get:
      summary: Fetch preview render (thumbnail / first-page / video-frame)
      tags: [preview]
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          description: Preview not yet rendered (request triggers async render)

  /scan/{file_id}/verdict:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Get scan verdict (virus + DLP)
      tags: [scan]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanVerdict'}

  /immutability/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Elect file into WORM immutability tier
      tags: [immutability]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImmutabilityElectionRequest'}
      responses:
        '201':
          description: Elected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImmutabilityRecord'}

  /immutability/files/{file_id}/legal-hold:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      summary: Open legal hold on file
      tags: [immutability]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LegalHoldRequest'}
      responses:
        '201':
          description: Hold opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: drive
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantApiKey:
      type: apiKey
      in: header
      name: X-Tenant-API-Key
  responses:
    Forbidden:
      description: Forbidden (Cedar policy refusal)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not Found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Unprocessable Entity (validation error)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    File:
      type: object
      required: [file_id, tenant_id, context, name, size, mime, content_address, version, created_at]
      properties:
        file_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, professional]}
        name: {type: string, maxLength: 1024}
        parent_folder_id: {type: string, format: uuid, nullable: true}
        size: {type: integer, format: int64}
        mime: {type: string}
        content_address: {type: string, description: "sha256 of file bytes; stable across uploads"}
        version: {type: integer}
        owner_user_id: {type: string, format: uuid}
        e2e_encrypted: {type: boolean, default: false, description: "true for client-side E2E (libsodium); server cannot decrypt"}
        worm_tier_enabled: {type: boolean, default: false}
        worm_retention_floor: {type: string, format: date-time, nullable: true}
        legal_hold_open: {type: boolean, default: false}
        dlp_flagged: {type: boolean, default: false}
        virus_verdict: {type: string, enum: [pending, clean, malicious, quarantined], default: pending}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    FileCreateMetadata:
      type: object
      required: [context, name, mime]
      properties:
        context: {type: string, enum: [personal, professional]}
        name: {type: string, maxLength: 1024}
        parent_folder_id: {type: string, format: uuid}
        mime: {type: string}
        e2e_encrypted: {type: boolean, default: false}

    FileUpdateRequest:
      type: object
      properties:
        name: {type: string}
        parent_folder_id: {type: string, format: uuid}

    FileListResponse:
      type: object
      properties:
        files:
          type: array
          items: {$ref: '#/components/schemas/File'}
        next_cursor: {type: string}

    FileVersionListResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version: {type: integer}
              content_address: {type: string}
              size: {type: integer, format: int64}
              created_at: {type: string, format: date-time}
              created_by: {type: string, format: uuid}

    Folder:
      type: object
      required: [folder_id, tenant_id, name, path]
      properties:
        folder_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, professional]}
        name: {type: string}
        parent_folder_id: {type: string, format: uuid, nullable: true}
        path: {type: string, description: "POSIX-style; e.g. /alpha/beta"}
        created_at: {type: string, format: date-time}

    FolderCreateRequest:
      type: object
      required: [name, context]
      properties:
        name: {type: string}
        parent_folder_id: {type: string, format: uuid}
        context: {type: string, enum: [personal, professional]}

    UploadSessionCreateRequest:
      type: object
      required: [parent_folder_id, name, size, mime, context]
      properties:
        parent_folder_id: {type: string, format: uuid}
        name: {type: string}
        size: {type: integer, format: int64}
        mime: {type: string}
        context: {type: string, enum: [personal, professional]}
        chunk_size: {type: integer, default: 8388608, description: "client-suggested chunk size; server may override per ADR-DRIVE-0002"}
        e2e_encrypted: {type: boolean, default: false}

    UploadSession:
      type: object
      properties:
        session_id: {type: string, format: uuid}
        upload_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        chunk_size: {type: integer}
        chunks_required: {type: integer}

    SyncSessionCreateRequest:
      type: object
      required: [device_id, root_folder_id]
      properties:
        device_id: {type: string, format: uuid}
        root_folder_id: {type: string, format: uuid}

    SyncSession:
      type: object
      properties:
        session_id: {type: string, format: uuid}
        opened_at: {type: string, format: date-time}

    ChunkManifest:
      type: object
      required: [file_id, chunks]
      properties:
        file_id: {type: string, format: uuid}
        chunks:
          type: array
          maxItems: 100000
          items:
            type: object
            properties:
              offset: {type: integer, format: int64}
              length: {type: integer}
              hash: {type: string, description: "blake3 hash"}

    SyncDelta:
      type: object
      properties:
        needed_chunks:
          type: array
          items:
            type: object
            properties:
              offset: {type: integer, format: int64}
              length: {type: integer}
              upload_url: {type: string, format: uri}

    ShareLinkCreateRequest:
      type: object
      required: [resource_id, scope, ttl_seconds]
      properties:
        resource_id: {type: string, format: uuid}
        resource_kind: {type: string, enum: [file, folder]}
        scope: {type: string, enum: [read, comment, edit]}
        ttl_seconds: {type: integer, maximum: 31536000, description: "max 1 year"}
        view_cap: {type: integer, description: "max views; 0 = unlimited"}
        password: {type: string, description: "if set, link is password-protected; Argon2id KDF"}
        preview_only: {type: boolean, default: false}

    ShareLink:
      type: object
      properties:
        link_id: {type: string, format: uuid}
        signed_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        view_cap_remaining: {type: integer}
        password_protected: {type: boolean}
        revoked_at: {type: string, format: date-time, nullable: true}

    PermissionGrantRequest:
      type: object
      required: [resource_id, principal_id, scope]
      properties:
        resource_id: {type: string, format: uuid}
        resource_kind: {type: string, enum: [file, folder]}
        principal_id: {type: string, format: uuid}
        principal_kind: {type: string, enum: [user, group]}
        scope: {type: string, enum: [read, comment, edit, manage]}
        inherit_to_children: {type: boolean, default: true, description: "for folders"}

    Permission:
      type: object
      properties:
        permission_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        principal_id: {type: string, format: uuid}
        scope: {type: string}
        granted_by: {type: string, format: uuid}
        granted_at: {type: string, format: date-time}

    SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            type: object
            properties:
              file_id: {type: string, format: uuid}
              name: {type: string}
              path: {type: string}
              snippet: {type: string}
              score: {type: number}

    ScanVerdict:
      type: object
      properties:
        scan_job_id: {type: string, format: uuid}
        virus_verdict: {type: string, enum: [pending, clean, malicious, quarantined]}
        dlp_verdict: {type: string, enum: [pending, clean, flagged]}
        dlp_rules_matched:
          type: array
          items: {type: string}
        scanned_at: {type: string, format: date-time}

    ImmutabilityElectionRequest:
      type: object
      required: [retention_floor_seconds, mode]
