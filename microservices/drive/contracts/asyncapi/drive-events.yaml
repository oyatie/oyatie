asyncapi: 3.1.0
info:
  title: oyatie Drive µservice — AsyncAPI Event Catalog
  version: 1.0.0
  description: |
    AsyncAPI definitions for drive µservice events on the oyatie Workflow event bus.

    Per ADR-0131 + ADR-0132, drive emits events that may be consumed by:
    - mail (attachment-bridge minting)
    - messenger (file-share embed minting)
    - workflow-engine (file-change-trigger automation)
    - foundry-runtime (OCR / auto-tag / smart-search inference)
    - audit-chain (seal emission)
    - observability (telemetry)

    Per Bominal ADR-0028: every event carries a content hash + audit-chain seal pointer.

defaultContentType: application/cloudevents+json

servers:
  workflow-event-bus:
    host: workflow.{pack}.oyatie.com
    protocol: nats
    description: per-pack Workflow event bus
    variables:
      pack:
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]

channels:
  drive.file.lifecycle.v1:
    address: drive.file.lifecycle.v1
    description: File lifecycle (uploaded / updated / trashed / purged)
    messages:
      FileUploaded: {$ref: '#/components/messages/FileUploaded'}
      FileUpdated:  {$ref: '#/components/messages/FileUpdated'}
      FileMovedToTrash: {$ref: '#/components/messages/FileMovedToTrash'}
      FilePurged: {$ref: '#/components/messages/FilePurged'}

  drive.file.access.v1:
    address: drive.file.access.v1
    description: File access (download / signed-URL minting)
    messages:
      FileDownloaded: {$ref: '#/components/messages/FileDownloaded'}

  drive.share.v1:
    address: drive.share.v1
    description: Share-link lifecycle
    messages:
      ShareLinkIssued:    {$ref: '#/components/messages/ShareLinkIssued'}
      ShareLinkAccessed:  {$ref: '#/components/messages/ShareLinkAccessed'}
      ShareLinkRevoked:   {$ref: '#/components/messages/ShareLinkRevoked'}

  drive.permissions.v1:
    address: drive.permissions.v1
    description: Permission lifecycle
    messages:
      PermissionChanged: {$ref: '#/components/messages/PermissionChanged'}

  drive.sync.v1:
    address: drive.sync.v1
    description: Sync delta lifecycle
    messages:
      SyncDeltaApplied:       {$ref: '#/components/messages/SyncDeltaApplied'}
      SyncConflictDetected:   {$ref: '#/components/messages/SyncConflictDetected'}

  drive.scan.v1:
    address: drive.scan.v1
    description: Virus + DLP scan verdicts
    messages:
      VirusDetected: {$ref: '#/components/messages/VirusDetected'}
      DlpFlagRaised: {$ref: '#/components/messages/DlpFlagRaised'}

  audit.drive.immutability.v1:
    address: audit.drive.immutability.v1
    description: WORM immutability tier transitions
    messages:
      ImmutabilityTierEntered: {$ref: '#/components/messages/ImmutabilityTierEntered'}

  audit.drive.legal_hold.v1:
    address: audit.drive.legal_hold.v1
    description: Legal hold transitions
    messages:
      LegalHoldApplied:  {$ref: '#/components/messages/LegalHoldApplied'}
      LegalHoldReleased: {$ref: '#/components/messages/LegalHoldReleased'}

  drive.quota.v1:
    address: drive.quota.v1
    description: Quota thresholds
    messages:
      QuotaThresholdCrossed: {$ref: '#/components/messages/QuotaThresholdCrossed'}

operations:
  publishFileUploaded:
    action: send
    channel: {$ref: '#/channels/drive.file.lifecycle.v1'}
  publishFileUpdated:
    action: send
    channel: {$ref: '#/channels/drive.file.lifecycle.v1'}
  publishFileMovedToTrash:
    action: send
    channel: {$ref: '#/channels/drive.file.lifecycle.v1'}
  publishFilePurged:
    action: send
    channel: {$ref: '#/channels/drive.file.lifecycle.v1'}
  publishFileDownloaded:
    action: send
    channel: {$ref: '#/channels/drive.file.access.v1'}
  publishShareLinkIssued:
    action: send
    channel: {$ref: '#/channels/drive.share.v1'}
  publishShareLinkAccessed:
    action: send
    channel: {$ref: '#/channels/drive.share.v1'}
  publishShareLinkRevoked:
    action: send
    channel: {$ref: '#/channels/drive.share.v1'}
  publishPermissionChanged:
    action: send
    channel: {$ref: '#/channels/drive.permissions.v1'}
  publishSyncDeltaApplied:
    action: send
    channel: {$ref: '#/channels/drive.sync.v1'}
  publishSyncConflictDetected:
    action: send
    channel: {$ref: '#/channels/drive.sync.v1'}
  publishVirusDetected:
    action: send
    channel: {$ref: '#/channels/drive.scan.v1'}
  publishDlpFlagRaised:
    action: send
    channel: {$ref: '#/channels/drive.scan.v1'}
  publishImmutabilityTierEntered:
    action: send
    channel: {$ref: '#/channels/audit.drive.immutability.v1'}
  publishLegalHoldApplied:
    action: send
    channel: {$ref: '#/channels/audit.drive.legal_hold.v1'}
  publishLegalHoldReleased:
    action: send
    channel: {$ref: '#/channels/audit.drive.legal_hold.v1'}
  publishQuotaThresholdCrossed:
    action: send
    channel: {$ref: '#/channels/drive.quota.v1'}

components:
  messages:
    FileUploaded:
      name: FileUploaded
      payload: {$ref: '#/components/schemas/FileLifecycleEvent'}
    FileUpdated:
      name: FileUpdated
      payload: {$ref: '#/components/schemas/FileLifecycleEvent'}
    FileMovedToTrash:
      name: FileMovedToTrash
      payload: {$ref: '#/components/schemas/FileLifecycleEvent'}
    FilePurged:
      name: FilePurged
      payload: {$ref: '#/components/schemas/FileLifecycleEvent'}
    FileDownloaded:
      name: FileDownloaded
      payload: {$ref: '#/components/schemas/FileAccessEvent'}
    ShareLinkIssued:
      name: ShareLinkIssued
      payload: {$ref: '#/components/schemas/ShareLinkEvent'}
    ShareLinkAccessed:
      name: ShareLinkAccessed
      payload: {$ref: '#/components/schemas/ShareLinkAccessEvent'}
    ShareLinkRevoked:
      name: ShareLinkRevoked
      payload: {$ref: '#/components/schemas/ShareLinkEvent'}
    PermissionChanged:
      name: PermissionChanged
      payload: {$ref: '#/components/schemas/PermissionEvent'}
    SyncDeltaApplied:
      name: SyncDeltaApplied
      payload: {$ref: '#/components/schemas/SyncEvent'}
    SyncConflictDetected:
      name: SyncConflictDetected
      payload: {$ref: '#/components/schemas/SyncConflictEvent'}
    VirusDetected:
      name: VirusDetected
      payload: {$ref: '#/components/schemas/ScanEvent'}
    DlpFlagRaised:
      name: DlpFlagRaised
      payload: {$ref: '#/components/schemas/ScanEvent'}
    ImmutabilityTierEntered:
      name: ImmutabilityTierEntered
      payload: {$ref: '#/components/schemas/ImmutabilityEvent'}
    LegalHoldApplied:
      name: LegalHoldApplied
      payload: {$ref: '#/components/schemas/LegalHoldEvent'}
    LegalHoldReleased:
      name: LegalHoldReleased
      payload: {$ref: '#/components/schemas/LegalHoldEvent'}
    QuotaThresholdCrossed:
      name: QuotaThresholdCrossed
      payload: {$ref: '#/components/schemas/QuotaEvent'}

  schemas:
    CloudEventEnvelope:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - subject
        - tenant_id_hashed
        - pack_tag
        - audit_chain_seal_id
        - signature_ed25519
      properties:
        specversion: {type: string, const: "1.0"}
        id: {type: string, format: uuid}
        source: {type: string, const: "drive"}
        type: {type: string}
        time: {type: string, format: date-time}
        subject: {type: string}
        tenant_id_hashed: {type: string, description: "sha256(tenant_id)[..16]"}
        pack_tag:
          type: string
          enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
        context_kind: {type: string, enum: [personal, professional]}
        audit_chain_seal_id: {type: string, format: uuid}
        signature_ed25519: {type: string}

    FileLifecycleEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [file_id, version, lifecycle_state]
          properties:
            file_id: {type: string, format: uuid}
            version: {type: integer}
            lifecycle_state: {type: string, enum: [uploaded, updated, trashed, purged]}
            content_address: {type: string}
            size: {type: integer, format: int64}
            mime: {type: string}
            parent_folder_id: {type: string, format: uuid, nullable: true}
            actor_user_id_hashed: {type: string}

    FileAccessEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [file_id]
          properties:
            file_id: {type: string, format: uuid}
            accessor_user_id_hashed: {type: string}
            accessor_ip_hashed: {type: string}
            accessor_ua_hashed: {type: string}
            range: {type: string, nullable: true}
            byte_count: {type: integer, format: int64}

    ShareLinkEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [link_id, file_or_folder_id]
          properties:
            link_id: {type: string, format: uuid}
            file_or_folder_id: {type: string, format: uuid}
            resource_kind: {type: string, enum: [file, folder]}
            scope: {type: string, enum: [read, comment, edit]}
            ttl_seconds: {type: integer}
            view_cap: {type: integer}
            password_protected: {type: boolean}

    ShareLinkAccessEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [link_id]
          properties:
            link_id: {type: string, format: uuid}
            viewer_ip_hashed: {type: string}
            viewer_ua_hashed: {type: string}
            verdict: {type: string, enum: [allowed, refused_revoked, refused_expired, refused_view_cap, refused_password, refused_flagged]}

    PermissionEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [permission_id, resource_id, change_kind]
          properties:
            permission_id: {type: string, format: uuid}
            resource_id: {type: string, format: uuid}
            resource_kind: {type: string, enum: [file, folder]}
            principal_id_hashed: {type: string}
            principal_kind: {type: string, enum: [user, group]}
            scope: {type: string, enum: [read, comment, edit, manage]}
            change_kind: {type: string, enum: [granted, revoked, scope_changed]}

    SyncEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [session_id, delta_hash]
          properties:
            session_id: {type: string, format: uuid}
            delta_hash: {type: string}
            files_changed: {type: integer}
            bytes_transferred: {type: integer, format: int64}

    SyncConflictEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [session_id, file_id]
          properties:
            session_id: {type: string, format: uuid}
            file_id: {type: string, format: uuid}
            last_writer_a_hashed: {type: string}
            last_writer_b_hashed: {type: string}
            tie_breaker_decided: {type: string, enum: [a, b, both_preserved]}

    ScanEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [scan_job_id, file_id, verdict]
          properties:
            scan_job_id: {type: string, format: uuid}
            file_id: {type: string, format: uuid}
            verdict: {type: string, enum: [clean, malicious, flagged, quarantined]}
            signature_matched: {type: string}
            engines_used:
              type: array
              items: {type: string, enum: [clamav, opswat]}

    ImmutabilityEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [record_id, file_id, retention_floor, mode]
          properties:
            record_id: {type: string, format: uuid}
            file_id: {type: string, format: uuid}
            retention_floor: {type: string, format: date-time}
            mode: {type: string, enum: [compliance, governance]}
            elected_by_user_id_hashed: {type: string}

    LegalHoldEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [hold_id, file_id, action]
          properties:
            hold_id: {type: string, format: uuid}
            file_id: {type: string, format: uuid}
            action: {type: string, enum: [applied, released]}
            opened_by_user_id_hashed: {type: string}
            reason: {type: string}
            two_person_approver_id_hashed: {type: string, description: "Required when action=released"}

    QuotaEvent:
      allOf:
        - {$ref: '#/components/schemas/CloudEventEnvelope'}
        - type: object
          required: [level, bytes_used, bytes_quota]
          properties:
            level: {type: string, enum: [soft, hard]}
            bytes_used: {type: integer, format: int64}
            bytes_quota: {type: integer, format: int64}
            crossed_at: {type: string, format: date-time}
