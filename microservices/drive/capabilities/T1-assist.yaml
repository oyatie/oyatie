# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — drive µservice
#
# Autonomy Tier 1: "assist with bounded reversibility". The system takes an
# action, but it is bounded, reversible within a short window, and attributed
# to the agent + user clearly. After the window, the action stands.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145).
# Per EU AI Act Art. 50 transparency + Art. 14 human oversight.

doc_class: AutonomyTierCatalog
microservice: drive
tier: T1
owner_team: axis-drive + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-drive-ocr
    name: "OCR on image / scanned PDF (foundry-runtime handoff)"
    description: |
      On file upload (image / scanned PDF), the assistant runs OCR via foundry-
      runtime ML and stores the extracted text in the Tika extract record so the
      file becomes full-text-searchable. User can disable OCR per-folder or
      per-file. The OCR text is stored under the same context (Personal /
      Professional) as the source file; no cross-context leakage.
    surface: post-upload pipeline (Workflow event handoff)
    triggers:
      - file uploaded with mime image/* OR mime application/pdf with scanned-page heuristic
      - tenant has OCR opt-in (per-user override available)
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: tenant-policy-admission
    data_class_processed: [PERSONAL_FILE_CONTENT or PROFESSIONAL_FILE_CONTENT]
    data_class_emitted:
      - INTERNAL_ONLY (extracted text → Tika extract record; same tenant + context)
    reversibility:
      window_seconds: 60
      action_on_cancel: drop the Tika extract record; file is still uploaded but no full-text index
      cancel_surface: in-product banner + Workflow webhook
    cross_tenant_consultation:
      allowed: no
    model:
      primary: tenant-default-ocr (foundry-runtime managed; Tesseract LSTM or PaddleOCR per pack)
      fallback: skip OCR (file is still uploaded; not full-text searchable)
      private_inference: tenant-DEK-wrapped pipeline; no cross-tenant training
    latency_budget_p99_ms: 5000
    audit_event: DriveOcrCompleted (Ed25519-sealed; payload — file id hash + extract size + reversibility window expiry)
    fallback_on_model_failure: skip; file uploaded without OCR
    risk_classification: limited-risk (Annex III §3 may apply for HR-context documents; per-pack ADR closes the EU AI Act conformity assessment — defers to ADR-DRIVE-XXXX)
    user_label: "AI is OCR'ing this file — cancel within 60s"

  - id: T1-drive-auto-tag
    name: "Auto-tag from OCR + content extract"
    description: |
      After OCR + Tika extract, the assistant assigns tags inferred from
      content. Tags are tenant-scoped metadata; visible to file owner + share
      recipients. User can edit / remove tags within the reversibility window.
      After the window, tags persist (but remain editable).
    surface: post-OCR pipeline (Workflow event handoff)
    triggers:
      - file has Tika extract; tenant has auto-tag opt-in
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: tenant-policy-admission
    data_class_processed: [PERSONAL_FILE_CONTENT or PROFESSIONAL_FILE_CONTENT]
    data_class_emitted: INTERNAL_ONLY (suggested tag list applied as metadata)
    reversibility:
      window_seconds: 120
      action_on_cancel: revert tags to empty
      cancel_surface: in-product banner
    model:
      primary: tenant-default-llm
      fallback: T0-drive-suggest-tags (suggest only; don't apply)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 2000
    audit_event: DriveAutoTagApplied
    fallback_on_model_failure: fall back to T0 (suggest only; do not act)
    risk_classification: limited-risk
    user_label: "AI applied tags — edit/remove within 120s"

  - id: T1-drive-smart-search
    name: "Semantic smart-search (natural-language query)"
    description: |
      User types a natural-language query in search UI (e.g., "Q3 budget
      spreadsheet from Alice"). Assistant returns ranked hits via foundry-
      runtime LLM-augmented retrieval over Meilisearch + Tika extract. User
      picks the file to open. No automatic action; only ranked suggestion.
      Although ranking is LLM-driven, the action ("open file") is user-
      triggered — placing this capability at the T1 / T0 boundary. Classified
      as T1 because the LLM has access to file content extracts (a privacy-
      adjacent operation) AND because mis-ranking + over-confidence can
      anchor user attention; reversibility window applies to the search
      session ("Was this the right file? Undo and search again").
    surface: search-ui (REST POST /v1/assist/smart-search)
    triggers:
      - user enters natural-language query in search UI
      - tenant has smart-search opt-in
    consent_basis:
      personal_context: explicit-on-opt-in
      professional_context: tenant-policy-admission
    data_class_processed: [PERSONAL_FILE_CONTENT or PROFESSIONAL_FILE_CONTENT, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (ranked hit list)
    reversibility:
      window_seconds: 30
      action_on_cancel: re-show classic-search results
      cancel_surface: in-product "Switch to classic search" button
    model:
      primary: tenant-default-llm + retrieval over Meilisearch + Tika
      fallback: classic Meilisearch keyword search
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 1500
    audit_event: DriveSmartSearchExecuted (Ed25519-sealed; payload — query hash + result count + reversibility window expiry)
    fallback_on_model_failure: fall back to classic search
    risk_classification: limited-risk
    user_label: "AI-powered search — switch to classic search"

verification:
  - All T1 actions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE acting.
  - All T1 actions emit an audit-chain event (Ed25519-sealed) on action-initiated AND on action-cancelled-within-window AND on action-stood (window-expired).
  - All T1 actions are labelled per EU AI Act Art. 50 + offer the Art. 14 human-oversight cancel-within-window control.
  - All T1 actions respect dual-context isolation: Personal-context actions NEVER touch Professional-context data; Professional-context actions NEVER touch Personal-context data.
  - All T1 actions are tenant_class-gated: Cedar policy `cedar/t1-tenant-class-gate.cedar` admits T1 only for paid tenant_class with per_seat billing_component.
  - HR-document overlay (T1-drive-ocr / T1-drive-auto-tag when used on HR documents — performance reviews, hiring docs, employment-decision adjacent contexts) is DEFERRED to a future ADR-DRIVE-XXXX for the EU AI Act Annex III §3 conformity assessment; until that ADR ships, the HR overlay is REFUSED at the Cedar layer for pack-eu tenants.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 14 human oversight; Art. 50 transparency; Annex III §3 employment-context obligation.
  - microservices/drive/PRD.md §FR-08 / §FR-09 (full-text search + OCR adjacent surfaces).
  - microservices/drive/policy/dual-context-isolation.md.
  - microservices/calendar/capabilities/T1-assist.yaml — sibling reference.
