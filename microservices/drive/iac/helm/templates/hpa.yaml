{{- range $bc := list "fileStore" "folderHierarchy" "upload" "download" "sync" "shareLink" "permissions" "searchIndex" "preview" "dlpVirusScan" "immutabilityTier" }}
{{- if $.Values.autoscaling.enabled }}
{{- $kebab := $bc | snakecase | replace "_" "-" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oya-drive-{{ $kebab }}
  namespace: drive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oya-drive-{{ $kebab }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
