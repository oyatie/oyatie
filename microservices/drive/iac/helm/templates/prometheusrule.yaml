{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-drive-alerts
  namespace: drive
spec:
  groups:
    - name: drive-burn-rate-alerts
      rules:
        # File-list latency burn-rate
        - alert: DriveFileListFastBurn1h14x
          expr: |
            (
              histogram_quantile(0.99, sum by (le) (rate(oya_drive_file_list_seconds_bucket[1h])))
              > 0.15 * 14
            )
          for: 5m
          labels: {severity: page, microservice: drive, bc: folder-hierarchy}
          annotations:
            summary: "file-list p99 14× the 30d SLO budget over the last 1h"
            runbook: "microservices/drive/runbooks/object-storage-degraded.md"

        # Upload multipart throughput burn-rate
        - alert: DriveUploadMultipartFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_upload_multipart_seconds_bucket{size_bucket="1gb"}[1h])))
              > 90 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: upload}
          annotations:
            summary: "upload multipart 1GB p99 14× the 30d SLO budget over the last 1h"
            runbook: "microservices/drive/runbooks/upload-multipart-stuck.md"

        # Download first-byte burn-rate
        - alert: DriveDownloadFirstByteFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_download_first_byte_seconds_bucket{cache_state="warm"}[1h])))
              > 0.1 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: download}
          annotations:
            summary: "download first-byte (warm) p99 14× the 30d SLO budget over the last 1h"
            runbook: "microservices/drive/runbooks/object-storage-degraded.md"

        # Search query burn-rate
        - alert: DriveSearchFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_search_query_seconds_bucket{corpus_size_bucket="1m"}[1h])))
              > 0.4 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: search-index}
          annotations:
            summary: "search query p99 14× the 30d SLO budget over the last 1h"

        # Sync delta burn-rate
        - alert: DriveSyncDeltaFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_sync_delta_seconds_bucket{changed_file_count_bucket="100"}[1h])))
              > 30 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: sync}
          annotations:
            summary: "sync delta p99 14× the 30d SLO budget over the last 1h"
            runbook: "microservices/drive/runbooks/sync-conflict-resolution.md"

        # Share-link verify CPU/latency burn-rate
        - alert: DriveShareLinkMintFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_share_link_mint_seconds_bucket[1h])))
              > 0.05 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: share-link}
          annotations:
            summary: "share-link mint p99 14× the 30d SLO budget over the last 1h"
            runbook: "microservices/drive/runbooks/share-link-takeover-incident.md"

        # Preview render burn-rate
        - alert: DrivePreviewFastBurn1h14x
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(oya_drive_preview_render_seconds_bucket{kind=~"image|pdf|office"}[1h])))
              > 1.0 * 14
          for: 5m
          labels: {severity: page, microservice: drive, bc: preview}
          annotations:
            summary: "preview render p99 14× the 30d SLO budget over the last 1h"

        # WORM correctness — zero-tolerance immediate alert
        - alert: DriveImmutabilityViolationImmediate
          expr: |
            sum(rate(oya_drive_immutability_tier_violation_total[5m])) > 0
          for: 0m
          labels: {severity: page, microservice: drive, bc: immutability-tier, sev: 1}
          annotations:
            summary: "WORM immutability violation detected (zero-tolerance)"
            runbook: "microservices/drive/runbooks/immutability-tier-violation.md"

        # Scan correctness — zero-tolerance immediate alert
        - alert: DriveScanCorrectnessViolationImmediate
          expr: |
            sum(rate(oya_drive_scan_correctness_violation_total[5m])) > 0
          for: 0m
          labels: {severity: page, microservice: drive, bc: dlp-virus-scan, sev: 1}
          annotations:
            summary: "Scan correctness violation: a file reached durable storage without verdict"
            runbook: "microservices/drive/runbooks/virus-scan-rollback.md"

        # Share-link enumeration detected
        - alert: DriveShareLinkEnumerationDetected
          expr: |
            sum(rate(oya_drive_share_link_enumeration_pattern_detected_total[5m])) > 0
          for: 1m
          labels: {severity: page, microservice: drive, bc: share-link, sev: 1}
          annotations:
            summary: "Share-link enumeration pattern detected"
            runbook: "microservices/drive/runbooks/share-link-takeover-incident.md"
{{- end }}

    - name: drive-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: drive-llm-capability-circuit-open
          expr: max(oya_drive_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: drive
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "drive LLM/capability circuit-breaker tripped open"
        - alert: drive-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_drive_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: drive
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "drive capability retry-budget exhausted"

    - name: drive-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: drive-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_drive_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: drive
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "drive tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: drive-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: drive-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"drive-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: drive
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "drive pod CPU saturation > 70% sustained 10m"
        - alert: drive-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_drive_responses_5xx_total[5m]))
            /
            sum(rate(oya_drive_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: drive
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "drive 5xx rate > 1% sustained 5m"
        - alert: drive-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_drive_responses_total[5m]))
              /
              sum(rate(oya_drive_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: drive
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "drive inbound RPS dropped > 90% vs prior hour"

    - name: drive-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: drive-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_drive_request_success_total[1h]))
              /
              sum(rate(oya_drive_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: drive
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "drive aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: drive-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_drive_request_success_total[6h]))
              /
              sum(rate(oya_drive_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: drive
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "drive aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
