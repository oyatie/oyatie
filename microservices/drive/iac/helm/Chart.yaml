apiVersion: v2
name: oya-drive
description: |
  Helm chart for the oyatie drive µservice. Bundles file-store + folder-hierarchy +
  upload + download + sync + share-link + permissions + search-index + preview +
  dlp-virus-scan + immutability-tier bounded contexts, plus their Layer-A substrate
  (object store, Postgres, Valkey, Meilisearch, Tika, ClamAV, OPSWAT, preview workers).

  Per ADR-0131 (per-µservice flat layout) + ADR-0133 (LTS-pinned versions) +
  ADR-DRIVE-0001 (object-storage substrate selection) + ADR-DRIVE-0002 (FastCDC) +
  ADR-DRIVE-0003 (share-link security) + ADR-DRIVE-0004 (encryption-at-rest + E2E) +
  ADR-DRIVE-0005 (preview pipeline sandboxing) + ADR-DRIVE-0006 (immutability + WORM).
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/oyatie/oyatie/tree/main/microservices/drive
maintainers:
  - name: axis-drive
    email: drive@oyatie.com
dependencies:
  # Object-store backends (per ADR-DRIVE-0001)
  - name: garage
    version: "1.0.1"           # LTS pinned; primary edge-distributed
    repository: oci://registry.oyatie.dev/charts
    condition: garage.enabled
  - name: minio
    version: "RELEASE.2024-08-17T01-24-54Z"  # LTS pinned; secondary single-cluster + healthcare
    repository: oci://registry.oyatie.dev/charts
    condition: minio.enabled
  - name: seaweedfs
    version: "3.71.0"          # LTS pinned; archive tier
    repository: oci://registry.oyatie.dev/charts
    condition: seaweedfs.enabled
  # Metadata + cache
  - name: cloudnative-pg
    version: "16.4.0"          # Postgres 16 LTS
    repository: oci://registry.oyatie.dev/charts
  - name: valkey-cluster
    version: "7.4.0"           # LTS
    repository: oci://registry.oyatie.dev/charts
  # Search + extract
  - name: meilisearch
    version: "1.10.3"
    repository: oci://registry.oyatie.dev/charts
  - name: apache-tika
    version: "2.9.2"
    repository: oci://registry.oyatie.dev/charts
  # Scan
  - name: clamav
    version: "1.4.1"
    repository: oci://registry.oyatie.dev/charts
  - name: opswat-metadefender
    version: "5.10.0"
    repository: oci://registry.oyatie.dev/charts
    condition: opswat.enabled
  # Preview workers
  - name: libreoffice-gvisor
    version: "24.8.4"          # LibreOffice 24 LTS inside gVisor (per ADR-DRIVE-0005)
    repository: oci://registry.oyatie.dev/charts
