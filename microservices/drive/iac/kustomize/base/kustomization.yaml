# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drive

resources:
  - namespace.yaml
  - serviceaccount.yaml

commonLabels:
  microservice: drive
  managed-by: oya-dev-cli

generators: []

