# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drive

resources:
  - ../../base

commonAnnotations:
  pack.oyatie.dev/region: pack-eu
  pack.oyatie.dev/residency: eu-frankfurt-1
  pack.oyatie.dev/compliance: "GDPR, EDPB, NIS2, eIDAS, EU-AI-Act"

patchesStrategicMerge:
  - values-pack-eu.yaml
