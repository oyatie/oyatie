# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:network:t0-suggest:v1
name: composer-suggest-and-hashtag-and-connection-suggest
namespace: network
display_name: Composer Auto-Suggest + Hashtag Completion + Connection-Suggestion (T0; suggest-only)
description: |
  Given the composing user's partial Professional post draft (text + media +
  visible context), emit ≤ 3 ranked continuation suggestions and ≤ 5 ranked
  hashtag-completion candidates for the composing client. Additionally, given
  a profile view, emit ≤ 5 connection suggestions (T0 surface; no autonomous
  send of a connection request). T0 = suggestion only; no autonomous publish
  or connection-send. Always presented to the user; no action without
  confirmation.

owner_team: axis-network + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133]
related_specs: [/specs/microservices/network.json]
related_artifacts:
  - microservices/network/PRD.md (FR-32 Workflow event integration)
  - microservices/network/contracts/openapi/network.yaml
  - microservices/network/policy/professional-context-isolation.md

autonomy_tier: T0
# T0 = suggest-only; per ADR-0022 autonomy tiers (Bominal-inherited).
# No state mutation; no auto-publish; no auto-connect.

inputs:
  - name: composing_user_ref
    type: string
    required: true
  - name: draft_body
    type: string
    maxLength: 4096
    required: false
  - name: context_kind
    type: enum
    values: [Professional]
    required: true
  - name: visible_thread_context
    type: array
    items: {ref: ProfessionalPost (per contracts/openapi/network.yaml)}
    max_items: 8
    required: false
  - name: profile_view_target
    type: string
    description: profile being viewed (for connection-suggestion sub-capability)
    required: false
  - name: locale
    type: string
    pattern: '^[a-z]{2}(-[A-Z]{2})?$'
    required: true

outputs:
  - name: continuation_suggestions
    type: array
    max_items: 3
    items:
      type: object
      properties:
        text: {type: string, maxLength: 280}
        confidence: {type: number, minimum: 0, maximum: 1}
        rationale_token: {type: string, description: opaque rationale id for audit replay}
  - name: hashtag_completions
    type: array
    max_items: 5
    items:
      type: object
      properties:
        hashtag: {type: string, maxLength: 100}
        post_count_signal: {type: integer}
        confidence: {type: number}
  - name: connection_suggestions
    type: array
    max_items: 5
    items:
      type: object
      properties:
        candidate_profile_ref: {type: string}
        rationale_token: {type: string}
        contributing_signals:
          type: array
          items: {type: string, enum: [mutual-connections, shared-skill, shared-employer-history, shared-education, geographic-proximity, content-engagement-similarity]}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - RELATIONSHIP_GRAPH

context_kind_constraint:
  Professional: model-runs-server-side; server has decrypted body via tenant-DEK
  enforcement: compile-time PCI-01 + LEAN-check oya-check-professional-context-isolation

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare  # MUST DISABLE for PHI accounts per HIPAA Safe Harbour
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

pack_overrides:
  pack-us-healthcare:
    disabled_for_phi_accounts: true
    reason: HIPAA 45 CFR §164.514 Safe Harbour — no derived inferences over PHI
  pack-eu:
    eu_ai_act_classification: minimal_risk
    transparency_obligation: must-label-as-AI-suggested per EU AI Act Art. 50
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required

minor_protect_constraint:
  minor_accounts_never_in_connection_suggestion: true
  reason: per `policy/data-residency.md` MINOR_PROTECT class; COPPA + GDPR Art. 8

evidence_topic: oya.network.capability.t0_suggest.evidence

cost_profile:
  type: per-suggestion-batch
  estimated_cost_usd_per_call: 0.0008
  cost_drivers:
    - LLM inference (small open-weights model; on-prem GPU pool)
    - Hashtag-corpus lookup
    - Connection-graph adjacency-BFS for connection-suggestion sub-capability

cedar_policy_fragments:
  - microservices/network/policy/tenant-scope.cedar
  - microservices/network/policy/public-read.cedar

eval_set:
  golden_inputs_path: microservices/network/capabilities/eval/t0-suggest-golden.jsonl
  pass_threshold: 0.90
  eval_metric: continuation-suggestion-relevance vs human-rater baseline; hashtag-completion precision@1; connection-suggestion 4/5-rule disparity audit (no employment-context bias)
  cadence: per-release

sunset:
  status: none
