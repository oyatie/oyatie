# Canonical-base: specs/catalog/canonical-crate-record-schema.json (SWEEP-I Slice 6 per ADR-0064)
name: oya-network-endorsement-engine-adapter-postgres
role: adapter
backend: postgres
context: network
plane: data
slo: hero-product
contracts_consumed: [EndorsementRepository (from oya-network-endorsement-engine-kernel)]
contracts_exposed: []
regulatory_packs_consumed: [oya-pack-kr, oya-pack-eu, oya-pack-us, oya-pack-us-healthcare, oya-pack-jp, oya-pack-sg, oya-pack-au, oya-pack-in, oya-pack-br, oya-pack-ae, oya-pack-ksa]
lifecycle: {state: incubating, preview_since: 2026-05-17, stable_since: null, deprecated_since: null}
traceability:
  github_issue: "oya-foundry-pipeline://scaffold-pr-microservice-flat-layout-buildout-2026-05-17"
  source_adrs: [ADR-0105, ADR-0135, ADR-0131, ADR-NET-0001, ADR-NET-0005]
data_classes_owned: [ENDORSEMENT_RECORD, AUDIT]
operational_classes_owned: [AUDIT]
autonomy_tier_required: T1
backend_constraints:
  postgres_version: "16"
  rls_enabled: true
  partition_strategy: by_tenant_id_hash_64
  sync_commit: remote_write
  advisory_lock_per_tenant_for_merkle_position: true  # per ADR-NET-0001 ordering invariant
context_kind_invariant: Professional
