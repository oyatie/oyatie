apiVersion: v2
name: oya-network
description: |
  Helm chart for the network µservice — Professional-tier social network:
  professional-profile / professional-graph / connection-request /
  post-composition / feed-timeline / reactions / mentions / hashtags /
  trending-topics / notifications / endorsement-engine / skill-assessments /
  profile-verification / pages / groups / events-bridge / jobs-handoff /
  inmail-bridge / recruiter-stub (OFF by default) / services-marketplace-stub
  (OFF) / learning-stub (OFF) / salary-insights-stub / search /
  accessibility-captions / abuse-reporting BCs deployed as horizontally-scaled,
  tenant-sharded workloads.
  Per ADR-0131 flat layout + ADR-0130 SLO-gated promotion + parallel
  ADR-0126 Professional-context invariant.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-network
    email: axis-network@oyatie.dev
keywords:
  - network
  - professional
  - linkedin-class
  - connection-graph
  - endorsement
  - inmail
  - jobs
  - recruiter
  - eu-ai-act
  - ll144
dependencies:
  - name: meilisearch
    version: "0.10.0"  # Meilisearch LTS
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
