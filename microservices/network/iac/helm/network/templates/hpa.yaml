# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "postCompositionRest" "feedTimeline" }}
{{- $c := index $.Values . }}
{{- if $c.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: network-{{ . | kebabcase }}
  namespace: network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: network-{{ . | kebabcase }}
  minReplicas: {{ $c.hpa.minReplicas }}
  maxReplicas: {{ $c.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
