# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "professionalProfile" "professionalGraph" "connectionRequest" "postCompositionRest" "feedTimeline" "endorsementEngine" "skillAssessments" "profileVerification" "pages" "groups" "eventsBridge" "inmailBridge" "jobsHandoff" "search" "abuseReporting" }}
---
apiVersion: v1
kind: Service
metadata:
  name: network-{{ . | kebabcase }}
  namespace: network
  labels:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: {{ . | kebabcase }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: {{ . | kebabcase }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: ws
      port: 443
      targetPort: 8443
    - name: metrics
      port: 9091
      targetPort: 9091
{{- end }}
