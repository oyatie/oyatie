# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-default-deny
  namespace: network
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-allow-ingress-from-gateway
  namespace: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: network
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-allow-egress-to-substrate
  namespace: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network
  policyTypes: [Egress]
  egress:
    # Postgres
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: network-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    # Valkey (cache + streams)
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: network-redis}}
      ports: [{protocol: TCP, port: 6379}]
    # Meilisearch
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: network-meilisearch}}
      ports: [{protocol: TCP, port: 7700}]
    # Cross-µservice in-pack bridges
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ontology}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenancy}}
      ports: [{protocol: TCP, port: 50051}]
    # Cross-µservice carriers (drive / mail / messenger / calendar / recordings).
    # network's PRD declares carry concerns for messenger (InMail bridge),
    # calendar (events bridge), and mail (newsletter-of-record send). The
    # canonical-base helper emits all five; the unused three are harmless
    # under default-deny posture and align with the ADR-0064 canonical-base
    # pattern.
    #
    # Under ADR-0145, these direct egresses are no longer a "carrier exemption";
    # they are simply the default direct-sibling-µservice path that ADR-0145
    # permits. The prior ADR-0140 (retired per ADR-0145) carrier-exemption framing is retired per
    # ADR-0145 (kept for back-reference only).
    {{- include "oya.networkPolicy.allowEgressToCarriers" $ | nindent 4 }}
    # Jobs-handoff to Tier-G ATS µservice flows through workflow-engine event-bus
    # per the workflow-vs-direct-gRPC rubric (durable execution + saga semantics +
    # audit-chain causal ordering, per docs/standards/workflow-vs-direct-grpc-rubric.md).
    # network emits oya.network.jobposting.v1.published → workflow-engine routes
    # → ATS consumes; ATS ack returns via workflow-engine.
    #
    # ATS µservice does NOT exist yet as a shipping µservice; it is
    # tracked-for-tier-g-onboarding per ADR-0132 forward policy and activates
    # when the first ATS-tier tenant signals onboarding. Until then, the
    # workflow-engine egress carries jobposting events into a bounded queue
    # that ATS will consume once deployed.
    #
    # ADR-0145 supersedes the prior ADR-0140 carrier-exemption framing: direct
    # sibling-µservice gRPC is now permitted in general. This BC retains the
    # workflow-engine egress for the rubric-driven reasons above, NOT because
    # of a universal-mediator rule.
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: workflow-engine}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: foundry-runtime}}
      ports: [{protocol: TCP, port: 50051}]
    # OPSWAT scan endpoint
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: security-scanners}}
      ports: [{protocol: TCP, port: 8008}]
    # DNS
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
# Note: federation egress NOT permitted; network does NOT federate in P01.
