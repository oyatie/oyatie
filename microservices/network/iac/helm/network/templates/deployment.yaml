# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "professionalProfile" "professionalGraph" "connectionRequest" "postCompositionRest" "postCompositionWorker" "feedTimeline" "reactions" "mentions" "hashtags" "trendingTopics" "notifications" "endorsementEngine" "skillAssessments" "profileVerification" "pages" "groups" "eventsBridge" "inmailBridge" "jobsHandoff" "salaryInsightsStub" "search" "accessibilityCaptions" "abuseReporting" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-{{ . | kebabcase }}
  namespace: network
  labels:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: oya-network
    oyatie/microservice: network
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: network
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: network-{{ . | kebabcase }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: network-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--component={{ . | kebabcase }}", "--pack={{ $.Values.global.pack }}"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
            - name: ws
              containerPort: 8443
          resources:
            requests: {{- toYaml $c.resources.requests | nindent 14 }}
            limits: {{- toYaml $c.resources.limits | nindent 14 }}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: network-openbao-injected
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
{{- end }}

# =============================================================================
# Recruiter-stub deployment — conditional (OFF BY DEFAULT per ADR-NET-0002)
# =============================================================================
{{- if .Values.recruiterStub.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-recruiter-stub
  namespace: network
  labels:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: recruiter-stub
    app.kubernetes.io/part-of: oya-network
    oyatie/microservice: network
    eu-ai-act: high-risk
spec:
  replicas: {{ .Values.recruiterStub.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: network
      app.kubernetes.io/component: recruiter-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network
        app.kubernetes.io/component: recruiter-stub
        eu-ai-act: high-risk
    spec:
      serviceAccountName: network-recruiter-stub
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: network-recruiter-stub
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--component=recruiter-stub", "--pack={{ .Values.global.pack }}"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          resources:
            requests: {{- toYaml .Values.recruiterStub.resources.requests | nindent 14 }}
            limits: {{- toYaml .Values.recruiterStub.resources.limits | nindent 14 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
{{- end }}

# =============================================================================
# Media + document transcode worker (sandboxed via gVisor per threat-model T-E-05)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-media-transcode-worker
  namespace: network
  labels:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: media-transcode-worker
    app.kubernetes.io/part-of: oya-network
    oyatie/microservice: network
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: network
      app.kubernetes.io/component: media-transcode-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network
        app.kubernetes.io/component: media-transcode-worker
      annotations:
        io.kubernetes.cri.untrusted-workload: "true"  # gVisor sandbox
    spec:
      runtimeClassName: gvisor
      serviceAccountName: network-media-transcode-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: network-media-transcode-worker
          image: "{{ .Values.global.imageRegistry }}/oya-network-media-transcode:{{ .Values.image.tag }}"
          args: ["--pack={{ .Values.global.pack }}"]
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 4000m, memory: 8Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}

# =============================================================================
# Bias-audit pipeline worker (EU AI Act + EEOC + NYC LL144 monitoring)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-bias-audit-pipeline
  namespace: network
  labels:
    app.kubernetes.io/name: network
    app.kubernetes.io/component: bias-audit-pipeline
    app.kubernetes.io/part-of: oya-network
    oyatie/microservice: network
    eu-ai-act: post-deployment-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network
      app.kubernetes.io/component: bias-audit-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network
        app.kubernetes.io/component: bias-audit-pipeline
    spec:
      serviceAccountName: network-bias-audit-pipeline
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: network-bias-audit-pipeline
          image: "{{ .Values.global.imageRegistry }}/oya-network-bias-audit:{{ .Values.image.tag }}"
          args: ["--pack={{ .Values.global.pack }}", "--threshold-4-5-rule={{ .Values.biasAudit.threshold4_5_rule }}"]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 2000m, memory: 4Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
