# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the network µservice.
# Per-pack overlays adjust: residency, retention overrides, secret-ref URIs,
# replica scaling tier, regulatory packs, capability tier toggles (T0/T1/T2),
# recruiter-stub activation gating, bias-audit cadence, age-gate thresholds.

namespace: network

resources:
  - namespace.yaml
  - openbao-secret-references.yaml

helmCharts:
  - name: oya-network
    valuesFile: ../../helm/network/values.yaml
    releaseName: network
    namespace: network

commonLabels:
  app.kubernetes.io/part-of: oya-network
  oyatie/microservice: network
