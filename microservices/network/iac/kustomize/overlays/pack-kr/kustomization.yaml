apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network-kr

resources:
  - ../../base

# Pack-KR overlay per /specs/regulatory-packs.json#pack-kr
# Residency: KR data centers only; cross-pack federation forbidden.
# Retention floor: KR PIPA Art. 21 + 근로기준법 Art. 42 (3y work record).
# Age-gate: KR 청소년 보호법 + PIPA Art. 8 — minor < 14y requires parental consent.
# Abuse category: 직장 갑질 (workplace harassment) is a first-class category.
# InMail intercept: 통신비밀보호법 four-eyes audit.
# Recruiter-stub activation: explicit tenant opt-in + PIPA Art. 29-2 user opt-out surface.

patches:
  - target: {kind: HelmRelease, name: network}
    patch: |-
      - op: replace
        path: /spec/values/global/pack
        value: kr
      - op: replace
        path: /spec/values/minorProtection/packKrMinorThreshold
        value: 14
      - op: replace
        path: /spec/values/biasAudit/euAiActFriaRequiredForEuTenant
        value: false
  - target: {kind: ConfigMap, name: network-retention-policy}
    patch: |-
      - op: replace
        path: /data/pack-kr-floor-days
        value: "1095"  # 3y work-record floor per 근로기준법 Art. 42
      - op: replace
        path: /data/pack-kr-ceiling-days
        value: "1825"  # 5y default; tenant-configurable up to 7y
      - op: replace
        path: /data/pack-kr-employment-record-retention-floor
        value: "1095"
