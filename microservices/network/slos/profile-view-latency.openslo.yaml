# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: network-profile-view-latency
  displayName: "network: profile-view p95 ≤ 150ms"
  labels:
    microservice: network
    bc: professional-profile
    sli_class: latency
    tier: hero-product
    owner_team: axis-network
    pack_scope: all
spec:
  description: |
    Latency SLO for GET /profiles/{handle}. A request is "good" when its
    end-to-end latency is ≤ 150ms. Profile-view is the most-trafficked READ
    surface in the µservice; it must remain fast.
    Reference: Google SRE Workbook ch. 5 multi-window multi-burn-rate.
  service: network
  indicator:
    metadata:
      name: network-profile-view-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_profile_view_duration_seconds_bucket{le="0.15"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_profile_view_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 150ms for 95 % of 5min windows over 30d"
  alertPolicies:
    - alertPolicyRef: network-profile-view-fast-burn-1h-14x
    - alertPolicyRef: network-profile-view-slow-burn-6h-6x
