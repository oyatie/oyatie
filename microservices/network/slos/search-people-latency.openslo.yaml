apiVersion: openslo/v1
kind: SLO
metadata:
  name: network-search-people-latency
  displayName: "network: search-people p95 ≤ 250ms (≤ 25 results)"
  labels:
    microservice: network
    bc: search
    sli_class: latency
    tier: hero-product
    owner_team: axis-network
    pack_scope: all
spec:
  description: |
    Latency SLO for GET /search/people. A request is "good" when its end-to-end
    latency is ≤ 250ms (Meilisearch query + Cedar post-filter). This is the
    most-searched surface in the µservice industry-wide; per-pack
    Meilisearch sharding tunes for low p95.
    Reference: LinkedIn engineering published targets.
  service: network
  indicator:
    metadata:
      name: network-search-people-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_search_people_duration_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_search_people_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 250ms for 95 % of 5min windows over 30d"
  alertPolicies:
    - alertPolicyRef: network-search-people-fast-burn-1h-14x
    - alertPolicyRef: network-search-people-slow-burn-6h-6x
