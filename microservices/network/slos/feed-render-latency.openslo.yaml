# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: network-feed-render-latency
  displayName: "network: feed-render p95 ≤ 200ms (top 50 posts)"
  labels:
    microservice: network
    bc: feed-timeline
    sli_class: latency
    tier: hero-product
    owner_team: axis-network
    pack_scope: all
spec:
  description: |
    Latency SLO for GET /feed (top 50 Professional posts). A request is "good"
    when its end-to-end latency (REST request received → response body sent)
    is ≤ 200ms. Distribution captured via Histogram with le buckets at
    [0.025, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, 1.0, 2.0]. Includes Redis hot-cache
    hit + warm rebuild miss tail; excludes anonymous-public feed (separate SLO).
    Reference: Google SRE Workbook ch. 5 multi-window multi-burn-rate.
  service: network
  indicator:
    metadata:
      name: network-feed-render-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_feed_render_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_network_feed_render_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 200ms for 95 % of 5min windows over 30d"
  alertPolicies:
    - alertPolicyRef: network-feed-render-fast-burn-1h-14x
    - alertPolicyRef: network-feed-render-slow-burn-6h-6x
    - alertPolicyRef: network-feed-render-ticket-burn-3d-1x
