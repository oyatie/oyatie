openapi: 3.2.0
info:
  title: oyatie Forms — REST API
  version: 1.0.0
  description: |
    Public REST surface for the forms µservice. Speaks OpenAPI 3.2.0. All endpoints
    are tenant-scoped via OIDC bearer; anonymous submission endpoints are scoped to
    a published form's runtime token + captcha verification.

    Conforms to ADR-FORMS-0001 (form-definition schema), ADR-FORMS-0002 (captcha),
    ADR-FORMS-0003 (PII encryption), ADR-FORMS-0004 (conditional logic),
    ADR-FORMS-0005 (AI-form-build bounds), ADR-FORMS-0006 (eIDAS).
  contact:
    name: axis-forms
    email: axis-forms@oyatie.com
  license:
    name: Proprietary
servers:
  - url: https://forms-{pack}.oyatie.com/v1
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        description: pack-pinned API endpoint
security:
  - oidcBearer: []
tags:
  - name: forms
    description: Form authoring + publish
  - name: responses
    description: Response capture + read
  - name: distribute
    description: Bulk distribution
  - name: export
    description: Response export
  - name: webhook
    description: Webhook configuration + DLQ replay
  - name: ai-build
    description: AI-form-build T2 capability
  - name: public
    description: Anonymous submission endpoints (no auth)
paths:
  /forms:
    get:
      tags: [forms]
      operationId: listForms
      summary: List forms for the authenticated tenant
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: list of forms
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormList"}
    post:
      tags: [forms]
      operationId: createForm
      summary: Create a new form draft (ChangeSet-bound)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormDraft"}
      responses:
        "201":
          description: form created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Form"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /forms/{form_id}:
    parameters:
      - $ref: "#/components/parameters/FormId"
    get:
      tags: [forms]
      operationId: getForm
      responses:
        "200":
          description: form definition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Form"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [forms]
      operationId: editFormDraft
      summary: Edit form draft (creates new draft version)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormDraft"}
      responses:
        "200":
          description: draft updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Form"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /forms/{form_id}:publish:
    parameters:
      - $ref: "#/components/parameters/FormId"
    post:
      tags: [forms]
      operationId: publishForm
      summary: Publish a form (production-tier requires Cedar policy preview acknowledgment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy_preview_acknowledged:
                  type: boolean
                  description: required for production-tier
                accepting_submissions:
                  type: boolean
                  default: true
                anonymous_submission_allowed:
                  type: boolean
                  default: false
                auto_decision_screening:
                  type: boolean
                  description: tenant attests whether this form is used for employment/credit/insurance screening per employment-context high-risk auto-decision
                  default: false
              required: [policy_preview_acknowledged, auto_decision_screening]
      responses:
        "200":
          description: form published
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Form"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "412":
          description: WCAG 2.2 AA gate failure OR data-class declaration missing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Problem"}
  /forms/{form_id}/responses:
    parameters:
      - $ref: "#/components/parameters/FormId"
    get:
      tags: [responses]
      operationId: listResponses
      parameters:
        - in: query
          name: pii_unredacted
          schema: {type: boolean, default: false}
          description: requires has_pii_read_entitlement; subject to Cedar gate
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        "200":
          description: list of responses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResponseList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /forms/{form_id}/responses:export:
    parameters:
      - $ref: "#/components/parameters/FormId"
    post:
      tags: [export]
      operationId: exportResponses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [csv, xlsx, json, sheets-bridge]
                pii_unredacted:
                  type: boolean
                  default: false
                filter:
                  type: object
                  description: optional filter; field-equality predicates
      responses:
        "202":
          description: export queued; returns export job id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExportJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /forms/{form_id}/distribute:
    parameters:
      - $ref: "#/components/parameters/FormId"
    post:
      tags: [distribute]
      operationId: bulkDistribute
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BulkDistributeRequest"}
      responses:
        "202":
          description: distribute job queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkDistributeJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /forms/{form_id}/webhooks:
    parameters:
      - $ref: "#/components/parameters/FormId"
    post:
      tags: [webhook]
      operationId: configureWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookConfig"}
      responses:
        "201":
          description: webhook configured
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /forms/{form_id}/webhooks/{webhook_id}:dlq-replay:
    parameters:
      - $ref: "#/components/parameters/FormId"
      - in: path
        name: webhook_id
        required: true
        schema: {type: string}
    post:
      tags: [webhook]
      operationId: replayWebhookDlq
      responses:
        "202":
          description: replay queued
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /ai-build:draft:
    post:
      tags: [ai-build]
      operationId: aiFormBuildDraft
      summary: Invoke AI-form-build (T2 capability; ADR-FORMS-0005 gated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, tier]
              properties:
                prompt:
                  type: string
                  maxLength: 4000
                tier:
                  type: string
                  enum: [T0, T1, T2-intra, T2-cross]
                cross_microservice_destinations:
                  type: array
                  items: {type: string}
                  description: required for T2-cross; must match tenant allow-list
                auto_decision_screening:
                  type: boolean
                  description: attestation; if true, triggers high-risk classification
      responses:
        "202":
          description: draft queued; subscribe to AsyncAPI for completion
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiBuildDraft"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /public/forms/{form_runtime_token}:submit:
    parameters:
      - in: path
        name: form_runtime_token
        required: true
        schema: {type: string}
        description: published-form opaque runtime token; HMAC-signed
    post:
      tags: [public]
      operationId: submitResponse
      security: []
      summary: Anonymous + authenticated submitter submission endpoint
      parameters:
        - in: header
          name: X-Captcha-Token
          required: true
          schema: {type: string}
          description: hCaptcha / Turnstile / Friendly Captcha token
        - in: header
          name: X-Submitter-Hash
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmissionPayload"}
      responses:
        "201":
          description: response captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_id: {type: string}
                  audit_chain_seal: {type: string}
                  next_action_hint: {type: string}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401":
          description: captcha invalid or HMAC mismatch
        "410":
          description: form no longer accepting submissions OR pre-fill link expired
        "429":
          description: rate-limited; retry after Retry-After header
        "503":
          description: captcha sidecar unavailable; fail-closed per ADR-FORMS-0002
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: forms
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (OIDC)
  parameters:
    FormId:
      in: path
      name: form_id
      required: true
      schema: {type: string, pattern: "^form:[a-f0-9]{16}$"}
  responses:
    Unauthorized:
      description: missing / invalid OIDC bearer
      content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}
    Forbidden:
      description: Cedar policy deny
      content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}
    NotFound:
      description: not found
      content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}
    Conflict:
      description: conflict (e.g., ChangeSet rebase required)
      content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}
    ValidationError:
      description: schema / cross-field validation error with precise json-pointer
      content: {application/json: {schema: {$ref: "#/components/schemas/Problem"}}}
  schemas:
    Form:
      type: object
      required: [form_id, tenant_id, schema_hash, version, status]
      properties:
        form_id: {type: string}
        tenant_id: {type: string}
        title: {type: string}
        schema_hash: {type: string, description: "RFC 8785 canonicalised hash"}
        version: {type: integer}
        status: {type: string, enum: [draft, published, archived]}
        ai_build_origin: {type: boolean}
        auto_decision_screening: {type: boolean}
        accepting_submissions: {type: boolean}
        anonymous_submission_allowed: {type: boolean}
        published_at: {type: string, format: date-time}
        pack: {type: string}
        data_residency: {type: string}
        wcag_22_aa_attested_at: {type: string, format: date-time}
        spec: {$ref: "#/components/schemas/FormSpecV1"}
    FormDraft:
      type: object
      required: [title, spec]
      properties:
        title: {type: string}
        spec: {$ref: "#/components/schemas/FormSpecV1"}
    FormSpecV1:
      type: object
      description: form.v1 spec per ADR-FORMS-0001
      required: [pages]
      properties:
        purpose:
          type: string
          description: GDPR Art. 5(1)(b) purpose statement
        consent_notice:
          type: string
          description: Art. 7 explicit consent text (required if any data_class=PII_*)
        pages:
          type: array
          items: {$ref: "#/components/schemas/Page"}
        branching:
          type: array
          items: {$ref: "#/components/schemas/BranchPredicate"}
        cross_field_rules:
          type: array
          items: {$ref: "#/components/schemas/CrossFieldRule"}
        webhooks:
          type: array
          items: {$ref: "#/components/schemas/WebhookConfig"}
    Page:
      type: object
      properties:
        page_id: {type: string}
        sections:
          type: array
          items: {$ref: "#/components/schemas/Section"}
    Section:
      type: object
      properties:
        section_id: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/Field"}
    Field:
      type: object
      required: [field_id, type, data_class]
      properties:
        field_id: {type: string}
        type:
          type: string
          enum: [text, number, date, datetime, single_choice, multi_choice, scale, grid, file_upload, signature, payment, conditional]
        data_class:
          type: string
          enum: [NORMAL, PII_IDENTIFYING, PII_QUASI_IDENTIFIER, SENSITIVE_GDPR_ART9, PHI, FINANCIAL, BEHAVIORAL_TENANT_PRODUCT, SECRET]
        required: {type: boolean}
        i18n_label: {type: object, additionalProperties: {type: string}}
        validation: {$ref: "#/components/schemas/FieldValidation"}
    FieldValidation:
      type: object
      properties:
        pattern: {type: string}
        min: {oneOf: [{type: number}, {type: string}]}
        max: {oneOf: [{type: number}, {type: string}]}
        min_length: {type: integer}
        max_length: {type: integer}
        allowed_mime_types:
          type: array
          items: {type: string}
        max_bytes: {type: integer}
    BranchPredicate:
      type: object
      properties:
        when: {type: string, description: "CEL expression per ADR-FORMS-0004"}
        show_field_ids: {type: array, items: {type: string}}
        hide_field_ids: {type: array, items: {type: string}}
        next_page_id: {type: string}
    CrossFieldRule:
      type: object
      properties:
        rule: {type: string, description: "CEL expression"}
        error_message_i18n: {type: object, additionalProperties: {type: string}}
    SubmissionPayload:
      type: object
      additionalProperties: true
      description: "free-form payload validated against form spec"
    ResponseList:
      type: object
      properties:
        responses:
          type: array
          items: {$ref: "#/components/schemas/ResponseEntry"}
        next_cursor: {type: string}
    ResponseEntry:
      type: object
      properties:
        response_id: {type: string}
        form_id: {type: string}
        form_version: {type: integer}
        submitter_hash: {type: string}
        submitted_at: {type: string, format: date-time}
        audit_chain_seal: {type: string}
        fields:
          type: object
          additionalProperties: true
          description: PII fields redacted unless pii_unredacted=true AND entitlement
    BulkDistributeRequest:
      type: object
      required: [channel, recipients]
      properties:
        channel:
          type: string
          enum: [email, messenger, sms]
        recipients:
          type: array
          maxItems: 10000
          items:
            type: object
            properties:
              identifier: {type: string}
              prefill: {type: object, additionalProperties: true}
        i18n_locale_default: {type: string}
    BulkDistributeJob:
      type: object
      properties:
        job_id: {type: string}
        scheduled_at: {type: string, format: date-time}
        recipient_count: {type: integer}
    ExportJob:
      type: object
      properties:
        job_id: {type: string}
        format: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
    WebhookConfig:
      type: object
      required: [target_url, mtls_cert_ref, hmac_secret_ref, purpose]
      properties:
        target_url: {type: string, format: uri}
        mtls_cert_ref: {type: string, description: "OpenBao reference"}
        hmac_secret_ref: {type: string, description: "OpenBao reference"}
        purpose: {type: string}
    Webhook:
      allOf:
        - $ref: "#/components/schemas/WebhookConfig"
        - type: object
          properties:
            webhook_id: {type: string}
            status: {type: string, enum: [active, paused, error]}
    AiBuildDraft:
      type: object
      properties:
        draft_id: {type: string}
        tier: {type: string}
        cross_microservice_destinations: {type: array, items: {type: string}}
        auto_decision_screening: {type: boolean}
        high_risk_classified: {type: boolean}
        dpia_required: {type: boolean}
    FormList:
      type: object
      properties:
        forms:
          type: array
          items: {$ref: "#/components/schemas/Form"}
        next_cursor: {type: string}
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              json_pointer: {type: string}
              code: {type: string}
              message: {type: string}
