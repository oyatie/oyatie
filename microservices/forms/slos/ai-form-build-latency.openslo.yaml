# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-ai-form-build-latency
  displayName: Forms — AI-form-build latency (T2 invocation)
  labels:
    microservice: forms
    bounded_context: ai-form-build
    tier: external-facing
    plane: data
spec:
  service: oya-forms-ai-build-worker
  description: |
    AI-form-build round-trip latency SLI (PII redactor + LLM + schema validate +
    Cedar). GA target: 95% under 8s.
  indicator:
    metadata:
      name: ai-form-build-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_ai_build_latency_seconds_bucket{le="8"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_ai_build_latency_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of AI-form-build calls under 8s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
