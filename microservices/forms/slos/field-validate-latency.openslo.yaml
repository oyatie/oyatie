apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-field-validate-latency
  displayName: Forms — Field validate latency
  labels:
    microservice: forms
    bounded_context: validation
    tier: external-facing
    plane: data
spec:
  service: oya-forms-validation-domain
  description: |
    Per-field validation latency SLI. GA target: 99% under 50ms.
  indicator:
    metadata:
      name: field-validate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_field_validate_latency_seconds_bucket{le="0.05"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_field_validate_latency_seconds_count[5m]))'
  objectives:
    - target: 0.99
      displayName: 99% of field validations under 50ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
