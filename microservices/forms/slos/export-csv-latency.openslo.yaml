apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-export-csv-latency
  displayName: Forms — Export CSV latency (100k responses)
  labels:
    microservice: forms
    bounded_context: export
    tier: external-facing
    plane: data
spec:
  service: oya-forms-export-worker
  description: |
    CSV streaming export latency SLI for 100k responses per export.
    GA target: 95% under 5s.
  indicator:
    metadata:
      name: export-csv-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_export_csv_duration_seconds_bucket{le="5"}[1h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_export_csv_duration_seconds_count[1h]))'
  objectives:
    - target: 0.95
      displayName: 95% of 100k-row CSV exports under 5s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
