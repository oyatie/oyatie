apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-pii-encryption-correctness
  displayName: Forms — PII column-encryption correctness (MUST be 100%)
  labels:
    microservice: forms
    bounded_context: pii-encryption
    tier: external-facing
    plane: data
    severity: gate
spec:
  service: oya-forms-postgres-adapter
  description: |
    Every PII column write MUST be encrypted at rest with per-tenant DEK envelope.
    Correctness target: 100%. Any non-100% triggers Sev-1.
  indicator:
    metadata:
      name: pii-encryption-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_pii_column_encrypted_total[1h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_pii_column_write_total[1h]))'
  objectives:
    - target: 1.0
      displayName: 100% of PII column writes encrypted
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
