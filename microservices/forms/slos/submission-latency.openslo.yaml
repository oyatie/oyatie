apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-submission-latency
  displayName: Forms — Submission latency (response capture → seal)
  labels:
    microservice: forms
    bounded_context: response-collector
    tier: external-facing
    plane: data
spec:
  service: oya-forms-response-collector-rest
  description: |
    Submission round-trip latency SLI (captcha verify + validate + encrypt + seal +
    workflow-trigger enqueue). GA target: 95% under 150ms.
  indicator:
    metadata:
      name: submission-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_submission_latency_seconds_bucket{le="0.15"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_submission_latency_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of submissions under 150ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
