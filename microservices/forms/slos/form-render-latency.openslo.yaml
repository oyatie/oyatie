apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-form-render-latency
  displayName: Forms — Form render (TTI) latency
  labels:
    microservice: forms
    bounded_context: form-renderer
    tier: external-facing
    plane: data
spec:
  service: oya-forms-form-renderer
  description: |
    Submitter form-render TTI latency SLI. The percentage of form renders that
    reach Time-To-Interactive under the latency budget. GA target: 95% under 200ms.
  indicator:
    metadata:
      name: form-render-tti-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_render_tti_seconds_bucket{le="0.2"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_render_tti_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of form renders under 200ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
