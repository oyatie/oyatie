apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-bulk-distribute-latency
  displayName: Forms — Bulk-distribute latency (10k recipients per blast)
  labels:
    microservice: forms
    bounded_context: bulk-distribute
    tier: external-facing
    plane: data
spec:
  service: oya-forms-bulk-distribute-worker
  description: |
    Bulk-distribute job end-to-end latency SLI for ≤ 10k recipients per blast.
    GA target: 95% under 30s.
  indicator:
    metadata:
      name: bulk-distribute-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_bulk_distribute_duration_seconds_bucket{le="30"}[1h]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_bulk_distribute_duration_seconds_count[1h]))'
  objectives:
    - target: 0.95
      displayName: 95% of 10k-recipient blasts under 30s
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
