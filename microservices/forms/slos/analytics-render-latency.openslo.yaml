apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-forms-analytics-render-latency
  displayName: Forms — Analytics dashboard render latency
  labels:
    microservice: forms
    bounded_context: analytics
    tier: external-facing
    plane: data
spec:
  service: oya-forms-analytics
  description: |
    Analytics dashboard render latency SLI. Cached aggregate < 60s freshness.
    GA target: 95% under 500ms.
  indicator:
    metadata:
      name: analytics-render-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_analytics_render_latency_seconds_bucket{le="0.5"}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_forms_analytics_render_latency_seconds_count[5m]))'
  objectives:
    - target: 0.95
      displayName: 95% of analytics renders under 500ms
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
