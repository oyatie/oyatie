# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the forms cluster, applied identically per-pack with pack-specific
# overlays for: residency region, retention overrides, OpenBao secret-reference URIs,
# replica scaling tier, per-pack captcha provider, per-pack LLM provider routing,
# per-pack KEK references. Per ADR-0131 + ADR-FORMS-0001..0006 + multi-region.md.

namespace: forms

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml
  - cdn-edge-config.yaml

helmCharts:
  - name: oya-forms-response-store-postgres
    valuesFile: ../../helm/response-store-postgres/values.yaml
    releaseName: response-store-postgres
    namespace: forms
  - name: oya-forms-response-cache-valkey
    valuesFile: ../../helm/response-cache-valkey/values.yaml
    releaseName: response-cache-valkey
    namespace: forms
  - name: oya-forms-response-search-meilisearch
    valuesFile: ../../helm/response-search-meilisearch/values.yaml
    releaseName: response-search-meilisearch
    namespace: forms
  - name: oya-forms-upload-scan-clamav
    valuesFile: ../../helm/upload-scan-clamav/values.yaml
    releaseName: upload-scan-clamav
    namespace: forms
  - name: oya-forms-captcha-sidecar
    valuesFile: ../../helm/captcha-sidecar/values.yaml
    releaseName: captcha-sidecar
    namespace: forms
  - name: oya-forms-form-rest
    valuesFile: ../../helm/form-rest/values.yaml
    releaseName: form-rest
    namespace: forms
  - name: oya-forms-form-cdn
    valuesFile: ../../helm/form-cdn/values.yaml
    releaseName: form-cdn
    namespace: forms
  - name: oya-forms-form-waf
    valuesFile: ../../helm/form-waf/values.yaml
    releaseName: form-waf
    namespace: forms

commonLabels:
  app.kubernetes.io/part-of: oya-forms
  oyatie/microservice: forms
