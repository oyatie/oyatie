# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ConfigMap
metadata:
  name: forms-cdn-edge-config
  namespace: forms
data:
  # OCI CDN per-pack edge config; resolved at apply time.
  CACHE_KEY_COMPONENTS: "tenant_id,form_id,locale,pack"
  INVALIDATION_TRIGGERS: "form_publish,form_archive,retention_expiry"
  CSP_INJECT_HEADER: "true"
  TRUSTED_TYPES_ENFORCE: "true"
  STATIC_ASSETS_GLOBAL: "true"
  TENANT_SCOPED_ASSETS_GLOBAL: "false"
