# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: networking.istio.io/v1beta1
kind: EnvoyFilter
metadata:
  name: forms-tenant-header-injection
  namespace: forms
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/part-of: oya-forms
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
      patch:
        operation: ADD
        value:
          name: oyatie.tenant-header-enforcer
          typed_config:
            "@type": type.googleapis.com/google.protobuf.Struct
            value:
              required_headers: [x-oya-tenant-id, x-oya-pack]
              cross_tenant_default: deny
              forbidden_recaptcha_in_packs: [pack-eu, pack-kr, pack-us-healthcare]
