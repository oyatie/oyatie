# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-jp overlay (per data-residency.md; OCI ap-tokyo-1 single-region; APPI).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-jp
      - REGION=ap-tokyo-1
      - JURISDICTION=jp
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-tokyo-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=jp-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha,turnstile
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-jp/kek
      - CDN_EDGE_REGION=ap-tokyo-1
      - HIPAA_BAA_ELIGIBLE=false
      - APPI_PSEUDONYMISATION_AVAILABLE=true
