# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-us-healthcare overlay (per data-residency.md; HIPAA BAA required;
# OCI us-ashburn-1 + us-phoenix-1 HIPAA-eligible facilities; reCAPTCHA forbidden;
# tenant must sign BAA before pack-us-healthcare ingest enabled).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/citus/worker/replicas
        value: 4
    target:
      kind: HelmRelease
      name: response-store-postgres
  - patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 4
    target:
      kind: HelmRelease
      name: form-rest

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-us-healthcare
      - REGION=us-ashburn-1
      - DR_REGION=us-phoenix-1
      - JURISDICTION=us-hc
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.us-ashburn-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=us-resident-baa
      - LLM_PROVIDER_LIST=aws-bedrock-baa,azure-openai-baa
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha
      - RECAPTCHA_ALLOWED=false
      - KEK_PATH=secret/forms/pack-us-healthcare/kek
      - TEMPLATE_SIGNING_KEY_PATH=secret/forms/template-marketplace/signing-key-pack-us-healthcare
      - CDN_EDGE_REGION=us-ashburn-1
      - HIPAA_BAA_ELIGIBLE=true
      - HIPAA_PHI_RETENTION_YEARS=6
      - PHI_FIELD_REQUIRES_BAA=true
      - PEN_TEST_CADENCE=annual
      - CHAOS_DRILL_CADENCE=quarterly
