# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-au overlay (per data-residency.md; OCI ap-sydney-1 + ap-melbourne-1 DR;
# Privacy Act + OAIC).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-au
      - REGION=ap-sydney-1
      - DR_REGION=ap-melbourne-1
      - JURISDICTION=au
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-sydney-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=au-resident
      - CAPTCHA_PRIMARY=turnstile
      - CAPTCHA_FALLBACK=hcaptcha,friendly_captcha
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-au/kek
      - CDN_EDGE_REGION=ap-sydney-1
      - HIPAA_BAA_ELIGIBLE=false
      - OAIC_BREACH_NOTIFY_DAYS=30
