# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-ksa overlay (per data-residency.md; OCI me-jeddah-1 + me-riyadh-1 DR;
# KSA PDPL + NCA notification).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-ksa
      - REGION=me-jeddah-1
      - DR_REGION=me-riyadh-1
      - JURISDICTION=ksa
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.me-jeddah-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=ksa-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-ksa/kek
      - CDN_EDGE_REGION=me-jeddah-1
      - HIPAA_BAA_ELIGIBLE=false
      - KSA_PDPL_NCA_BREACH_NOTIFY_HOURS=72
      - RTL_LOCALE_DEFAULT=ar-SA
