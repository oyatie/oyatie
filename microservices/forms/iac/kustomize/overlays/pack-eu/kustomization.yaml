# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-eu overlay (per data-residency.md; OCI eu-frankfurt-1 + eu-amsterdam-1 DR pair;
# GDPR + EDPB + Schrems II posture; reCAPTCHA forbidden per ADR-FORMS-0002).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/citus/worker/replicas
        value: 4
    target:
      kind: HelmRelease
      name: response-store-postgres
  - patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 6
    target:
      kind: HelmRelease
      name: form-rest

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-eu
      - REGION=eu-frankfurt-1
      - DR_REGION=eu-amsterdam-1
      - JURISDICTION=eu
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.eu-frankfurt-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=eu-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha
      - RECAPTCHA_ALLOWED=false
      - KEK_PATH=secret/forms/pack-eu/kek
      - TEMPLATE_SIGNING_KEY_PATH=secret/forms/template-marketplace/signing-key-pack-eu
      - CDN_EDGE_REGION=eu-frankfurt-1
      - HIPAA_BAA_ELIGIBLE=false
      - SCC_TRANSFER_REQUIRED=true
      - GDPR_ART_22_HUMAN_IN_LOOP_DEFAULT=true
      - AI_ACT_HIGH_RISK_GATING=enabled
