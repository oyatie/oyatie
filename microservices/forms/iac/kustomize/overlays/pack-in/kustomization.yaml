# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-in overlay (per data-residency.md; OCI ap-hyderabad-1 + ap-mumbai-1 DR;
# DPDPA 2023).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-in
      - REGION=ap-hyderabad-1
      - DR_REGION=ap-mumbai-1
      - JURISDICTION=in
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-hyderabad-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=in-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha,turnstile
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-in/kek
      - CDN_EDGE_REGION=ap-hyderabad-1
      - HIPAA_BAA_ELIGIBLE=false
      - DPDPA_SDF_OBLIGATIONS=enabled
      - DPDPA_CHILD_PROTECTION=enabled
