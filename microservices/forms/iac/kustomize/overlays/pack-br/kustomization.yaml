# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-br overlay (per data-residency.md; OCI sa-saopaulo-1 + sa-vinhedo-1 DR; LGPD).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-br
      - REGION=sa-saopaulo-1
      - DR_REGION=sa-vinhedo-1
      - JURISDICTION=br
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.sa-saopaulo-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=br-resident
      - CAPTCHA_PRIMARY=hcaptcha
      - CAPTCHA_FALLBACK=friendly_captcha,turnstile
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-br/kek
      - CDN_EDGE_REGION=sa-saopaulo-1
      - HIPAA_BAA_ELIGIBLE=false
      - LGPD_DPO_CONTACT_REQUIRED=true
      - ANPD_BREACH_NOTIFY_DAYS=15
