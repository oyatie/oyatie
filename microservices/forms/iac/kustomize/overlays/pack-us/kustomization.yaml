# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-us overlay (per data-residency.md; OCI us-ashburn-1 + us-phoenix-1 DR pair;
# CCPA + state privacy laws; reCAPTCHA permitted but Turnstile preferred).

bases:
  - ../../base

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-us
      - REGION=us-ashburn-1
      - DR_REGION=us-phoenix-1
      - JURISDICTION=us
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.us-ashburn-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=us-resident
      - CAPTCHA_PRIMARY=turnstile
      - CAPTCHA_FALLBACK=hcaptcha,friendly_captcha
      - RECAPTCHA_ALLOWED=true
      - KEK_PATH=secret/forms/pack-us/kek
      - CDN_EDGE_REGION=us-ashburn-1
      - HIPAA_BAA_ELIGIBLE=false
