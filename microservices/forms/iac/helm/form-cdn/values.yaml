cdn:
  provider: oci
  edges:
    - region: ap-seoul-1
      pack: pack-kr
    - region: eu-frankfurt-1
      pack: pack-eu
    - region: us-ashburn-1
      pack: pack-us
    - region: us-ashburn-1
      pack: pack-us-healthcare
  cacheKey:
    components: [tenant_id, form_id, locale, pack]
  invalidation:
    on: [form_publish, form_archive, retention_expiry]
  cspHeadersInjected: true
  trustedTypesEnforced: true
