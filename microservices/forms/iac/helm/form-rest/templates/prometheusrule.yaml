# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forms-burn-rate
  namespace: {{ .Release.Namespace }}
  labels:
    oyatie/microservice: forms
    release: prometheus
spec:
  groups:
    - name: forms-burn-rate
      interval: 60s
      rules:
        # Per-SLO burn-rate alerts (submission-latency SLO). The aggregate
        # INV-SLO-ERROR-BUDGET coverage lives in the canonical PrometheusRule
        # at microservices/observability/iac/helm/observability/templates/
        # hyperscaler-invariants-canonical-prometheusrule.yaml.
        #
        # Fast-burn (per ADR-0114 + INV-SLO-ERROR-BUDGET burn-rate policy):
        # 1h window, 14.4x burn -> page (consumes 2% of monthly budget in 1h).
        - alert: forms-submission-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_forms_response_submission_success_total[1h]))
              /
              sum(rate(oya_forms_response_submission_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: forms
            slo: submission-latency
            burn: fast-1h-14x
          annotations:
            summary: "forms submission availability fast-burn (1h 14.4x)"
            runbook_url: microservices/forms/runbooks/spam-flood-throttle.md
            slo_ref: microservices/forms/slos/submission-latency.openslo.yaml

        # Slow-burn: 6h window, 6x burn -> ticket (consumes 5% of monthly budget over 6h).
        - alert: forms-submission-slow-burn-6h-6x
          expr: |
            (1 - (
              sum(rate(oya_forms_response_submission_success_total[6h]))
              /
              sum(rate(oya_forms_response_submission_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: forms
            slo: submission-latency
            burn: slow-6h-6x
          annotations:
            summary: "forms submission availability slow-burn (6h 6x)"
            runbook_url: microservices/forms/runbooks/spam-flood-throttle.md
            slo_ref: microservices/forms/slos/submission-latency.openslo.yaml
