# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
image:
  registry: registry.oyatie.dev
  repository: forms/form-rest
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 4

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

perTenantSessionCap: 50

oidc:
  issuer: https://auth.oyatie.com
  audience: forms
  jwksCacheSeconds: 300

cedar:
  evaluatorEndpoint: "http://license-gate-cedar.forms.svc.cluster.local:8080"
  failClosed: true

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 80
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  egress:
    - to: response-store-postgres-primary.forms.svc.cluster.local
      ports: [5432]
    - to: response-cache-valkey-primary.forms.svc.cluster.local
      ports: [6379]
    - to: captcha-sidecar.forms.svc.cluster.local
      ports: [8080]
    - to: tenancy.tenancy.svc.cluster.local
      ports: [8080]
    - to: audit-chain.audit-chain.svc.cluster.local
      ports: [8080]
    - to: ontology.ontology.svc.cluster.local
      ports: [8080]
    - to: foundry-providers.foundry-providers.svc.cluster.local
      ports: [8080]
    - to: workflow-engine.workflow-engine.svc.cluster.local
      ports: [8080]

secrets:
  spiffeIdentityPath: "secret/forms/form-rest/spiffe"
  postgresConnectionPath: "secret/forms/form-rest/postgres"
  valkeyAuthPath: "secret/forms/form-rest/valkey"
  ed25519SigningKeyPath: "secret/forms/audit-chain/signing-key"
  hmacPrefillSecretPath: "secret/forms/prefill-link/hmac"

serviceMonitor:
  enabled: true
  interval: 30s
  endpoints:
    - port: metrics
      path: /metrics

prometheusRule:
  enabled: true
  ruleFiles:
    - /etc/forms/recording-rules/form-rest.yaml
    - /etc/forms/alerts/submission-burn-rate.yaml
