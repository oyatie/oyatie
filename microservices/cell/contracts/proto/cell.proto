// oya-cell — gRPC contract
// Peer to contracts/openapi/cell.yaml for clients that prefer gRPC.
// Per ADR-0130 + ADR-0131.

syntax = "proto3";

package oya.cell.v1;

import "google/protobuf/timestamp.proto";

// =========================================================================
// Service: CellRegistry
// =========================================================================
//
// Authn: per-request OIDC bearer (gRPC metadata key "authorization") OR
//        mTLS via SPIFFE SVID (workload µservices on hot path).
// Authz: Cedar policy evaluation server-side.
// Tenancy: per-request metadata key "x-scope-orgid" = "tenant:<hashed>".

service CellRegistry {
  rpc GetCellAssignment(GetCellAssignmentRequest) returns (CellAssignment);

  rpc StreamCellAssignmentChanges(StreamCellAssignmentChangesRequest)
      returns (stream CellAssignment);

  rpc GetMigrationHistory(GetMigrationHistoryRequest)
      returns (GetMigrationHistoryResponse);

  rpc ListCells(ListCellsRequest) returns (ListCellsResponse);

  rpc GetCell(GetCellRequest) returns (Cell);
}

// =========================================================================
// Service: Scheduler
// =========================================================================

service Scheduler {
  rpc RequestPlacementDecision(RequestPlacementDecisionRequest)
      returns (PlacementDecision);

  rpc TriggerRebalance(TriggerRebalanceRequest) returns (TriggerRebalanceResponse);
}

// =========================================================================
// Service: TenantMigration
// =========================================================================

service TenantMigration {
  rpc CreateMigrationPlan(CreateMigrationPlanRequest) returns (MigrationPlan);

  rpc GetMigrationPlan(GetMigrationPlanRequest) returns (MigrationPlan);

  rpc AbortMigration(AbortMigrationRequest) returns (AbortMigrationResponse);
}

// =========================================================================
// Service: HostPool
// =========================================================================

service HostPool {
  rpc GetHostPoolStatus(GetHostPoolStatusRequest) returns (HostPoolStatus);

  rpc DrainHost(DrainHostRequest) returns (DrainHostResponse);
}

// =========================================================================
// Service: CellLifecycle
// =========================================================================

service CellLifecycle {
  rpc CreateCell(CreateCellRequest) returns (Cell);

  rpc DecommissionCell(DecommissionCellRequest) returns (DecommissionCellResponse);
}

// =========================================================================
// Common types
// =========================================================================

enum CellState {
  CELL_STATE_UNSPECIFIED = 0;
  CELL_STATE_REQUESTED = 1;
  CELL_STATE_PROVISIONING = 2;
  CELL_STATE_READY = 3;
  CELL_STATE_DRAINING = 4;
  CELL_STATE_DECOMMISSIONING_SOFT_DELETE = 5;
  CELL_STATE_DECOMMISSIONED = 6;
}

enum CellScope {
  CELL_SCOPE_UNSPECIFIED = 0;
  CELL_SCOPE_SHARED = 1;
  CELL_SCOPE_DEDICATED = 2;
  CELL_SCOPE_HIPAA_DEDICATED = 3;
  CELL_SCOPE_SANDBOX = 4;
  CELL_SCOPE_INTERNAL = 5;
}

enum Pack {
  PACK_UNSPECIFIED = 0;
  PACK_KR = 1;
  PACK_EU = 2;
  PACK_US = 3;
  PACK_US_HEALTHCARE = 4;
  PACK_JP = 5;
  PACK_SG = 6;
  PACK_AU = 7;
  PACK_IN = 8;
  PACK_BR = 9;
  PACK_AE = 10;
  PACK_KSA = 11;
}

enum AssignmentScope {
  ASSIGNMENT_SCOPE_UNSPECIFIED = 0;
  ASSIGNMENT_SCOPE_PRIMARY = 1;
  ASSIGNMENT_SCOPE_HA_SECONDARY = 2;
  ASSIGNMENT_SCOPE_MIGRATING_TARGET = 3;
  ASSIGNMENT_SCOPE_MIGRATING_SOURCE = 4;
}

enum MigrationState {
  MIGRATION_STATE_UNSPECIFIED = 0;
  MIGRATION_STATE_PLANNED = 1;
  MIGRATION_STATE_DRAINING = 2;
  MIGRATION_STATE_COPYING = 3;
  MIGRATION_STATE_CUTOVER = 4;
  MIGRATION_STATE_COMPLETED = 5;
  MIGRATION_STATE_FAILED = 6;
  MIGRATION_STATE_ABORTED = 7;
}

enum MigrationReason {
  MIGRATION_REASON_UNSPECIFIED = 0;
  MIGRATION_REASON_REBALANCE = 1;
  MIGRATION_REASON_SCALE_UP = 2;
  MIGRATION_REASON_PACK_REHOME = 3;
  MIGRATION_REASON_DSR_CASCADE = 4;
  MIGRATION_REASON_DECOMMISSION_SOURCE = 5;
}

enum HostPoolState {
  HOST_POOL_STATE_UNSPECIFIED = 0;
  HOST_POOL_STATE_WARM_STANDBY = 1;
  HOST_POOL_STATE_BOUND_TO_CELL = 2;
  HOST_POOL_STATE_DRAINING = 3;
  HOST_POOL_STATE_DECOMMISSIONED = 4;
}

message CapacityEnvelope {
  uint32 max_tenants = 1;
  uint32 current_tenants = 2;
  double utilization_pct = 3;
  uint32 max_pods = 4;
  uint32 current_pods = 5;
}

message Cell {
  string cell_id = 1;
  Pack pack = 2;
  string region = 3;
  CellState state = 4;
  CellScope cell_scope = 5;
  CapacityEnvelope capacity_envelope = 6;
  string version = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CellAssignment {
  string tenant_id = 1;
  string cell_id = 2;
  Pack pack = 3;
  AssignmentScope scope = 4;
  google.protobuf.Timestamp assigned_at = 5;
  string signature = 6;
}

message MigrationPlan {
  string migration_id = 1;
  string tenant_id = 2;
  string source_cell = 3;
  string target_cell = 4;
  MigrationState state = 5;
  MigrationReason reason = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  bytes checkpoint = 9;
  string signature = 10;
}

message HostNode {
  string host_id = 1;
  Pack pack = 2;
  string region = 3;
  HostPoolState pool_state = 4;
  string bound_cell_id = 5;
}

message PlacementDecision {
  string tenant_id = 1;
  google.protobuf.Timestamp decided_at = 2;
  string target_cell = 3;
  double binpack_score = 4;
  repeated string considered_cells = 5;
  string signature = 6;
}

// =========================================================================
// Request / response messages
// =========================================================================

message GetCellAssignmentRequest { string tenant_id = 1; }

message StreamCellAssignmentChangesRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp since = 2;
}

message GetMigrationHistoryRequest { string tenant_id = 1; }
message GetMigrationHistoryResponse { repeated MigrationPlan plans = 1; }

message ListCellsRequest { Pack pack = 1; }
message ListCellsResponse { repeated Cell cells = 1; }

message GetCellRequest { string cell_id = 1; }

message RequestPlacementDecisionRequest {
  string tenant_id = 1;
  Pack pack = 2;
}

message TriggerRebalanceRequest {
  Pack pack = 1;
  bool dry_run = 2;
}
message TriggerRebalanceResponse {
  repeated MigrationPlan proposed_plans = 1;
}

message CreateMigrationPlanRequest {
  string tenant_id = 1;
  string target_cell = 2;
  MigrationReason reason = 3;
}

message GetMigrationPlanRequest { string migration_id = 1; }

message AbortMigrationRequest {
  string migration_id = 1;
  string reason = 2;
}
message AbortMigrationResponse {
  MigrationPlan final_state = 1;
}

message GetHostPoolStatusRequest { Pack pack = 1; }
message HostPoolStatus {
  Pack pack = 1;
  uint32 warm_pool_size = 2;
  uint32 bound_count = 3;
  uint32 draining_count = 4;
  uint32 total = 5;
  repeated HostNode hosts = 6;
}

message DrainHostRequest {
  string host_id = 1;
  string reason = 2;
}
message DrainHostResponse {
  string host_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

message CreateCellRequest {
  Pack pack = 1;
  CellScope cell_scope = 2;
  CapacityEnvelope desired_envelope = 3;
}

message DecommissionCellRequest {
  string cell_id = 1;
  string reason = 2;
  // 2-person-rule operators carrying JIT quorum acknowledgement
  repeated string operator_quorum = 3;
  bool dry_run = 4;
}
message DecommissionCellResponse {
  string cell_id = 1;
  CellState resulting_state = 2;
  google.protobuf.Timestamp soft_delete_window_ends_at = 3;
}
