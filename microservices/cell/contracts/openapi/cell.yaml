openapi: 3.2.0
info:
  title: oya-cell
  version: 1.0.0
  summary: REST API for the cell µservice — cell-registry CRUD, tenant-assignment lookup, scheduler decisions, lifecycle ops
  description: |
    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. JWT carries the
    principal's tenant_id claim. The X-Scope-OrgID header MUST match; mismatch returns 401.

    Tenant operators read their own cell-assignment + cell metadata only. Workload µservices read
    their own bound cell via per-cell SVID. Operators with elevated principals invoke lifecycle
    + scheduler operations.
  contact:
    name: axis-cell-substrate
    url: https://oyatie.dev/teams/axis-cell-substrate
  license:
    name: Internal
servers:
  - url: https://cell-{pack}.oyatie.dev/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.dev/.well-known/openid-configuration
    SpiffeSvid:
      type: mutualTLS
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    CellId:
      in: path
      name: cell_id
      required: true
      schema:
        type: string
        pattern: '^cell:[a-f0-9]{16}$'
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    Pack:
      in: query
      name: pack
      schema:
        type: string
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  schemas:
    Cell:
      type: object
      required: [cell_id, pack, region, state, cell_scope, capacity_envelope]
      properties:
        cell_id: {type: string}
        pack: {type: string}
        region: {type: string, example: ap-seoul-1}
        state:
          type: string
          enum: [requested, provisioning, ready, draining, decommissioning-soft-delete, decommissioned]
        cell_scope:
          type: string
          enum: [shared, dedicated, hipaa-dedicated, sandbox, internal]
        capacity_envelope:
          $ref: '#/components/schemas/CapacityEnvelope'
        version: {type: string, example: "v1.2.0"}
        created_at: {type: string, format: date-time}
    CapacityEnvelope:
      type: object
      properties:
        max_tenants: {type: integer}
        current_tenants: {type: integer}
        utilization_pct: {type: number, minimum: 0, maximum: 100}
        max_pods: {type: integer}
        current_pods: {type: integer}
    CellAssignment:
      type: object
      required: [tenant_id, cell_id, pack, assigned_at, scope]
      properties:
        tenant_id: {type: string}
        cell_id: {type: string}
        pack: {type: string}
        scope: {type: string, enum: [primary, ha-secondary, migrating-target, migrating-source]}
        assigned_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 audit-chain seal}
    MigrationPlan:
      type: object
      required: [migration_id, tenant_id, source_cell, target_cell, state, started_at]
      properties:
        migration_id: {type: string}
        tenant_id: {type: string}
        source_cell: {type: string}
        target_cell: {type: string}
        state:
          type: string
          enum: [planned, draining, copying, cutover, completed, failed, aborted]
        reason: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        checkpoint: {type: object}
        signature: {type: string}
    HostNode:
      type: object
      required: [host_id, pack, region, pool_state]
      properties:
        host_id: {type: string}
        pack: {type: string}
        region: {type: string}
        pool_state: {type: string, enum: [warm-standby, bound-to-cell, draining, decommissioned]}
        bound_cell_id: {type: string, nullable: true}
    PlacementDecision:
      type: object
      required: [tenant_id, decided_at, target_cell, binpack_score]
      properties:
        tenant_id: {type: string}
        decided_at: {type: string, format: date-time}
        target_cell: {type: string}
        binpack_score: {type: number}
        considered_cells: {type: array, items: {type: string}}
        signature: {type: string}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /tenants/{tenant_id}/assignment:
    get:
      summary: Read the cell-assignment for a tenant (hot path for workload µservices)
      operationId: getCellAssignment
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Assignment found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CellAssignment'}
          headers:
            Cache-Control:
              schema: {type: string, default: "max-age=60"}
        '401': {description: OIDC/scope mismatch, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: Cedar policy denied}
        '404': {description: No assignment exists for tenant}

  /tenants/{tenant_id}/migration-history:
    get:
      summary: Read migration history for a tenant
      operationId: getMigrationHistory
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of migration plans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MigrationPlan'}

  /cells:
    get:
      summary: List cells (operator scope; CI scope only via reserved cells)
      operationId: listCells
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Pack'
      responses:
        '200':
          description: List of cells matching scope
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Cell'}

  /cells/{cell_id}:
    get:
      summary: Read one cell's metadata
      operationId: getCell
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/CellId'
      responses:
        '200':
          description: Cell metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cell'}
        '403': {description: Cedar policy denied (workload may only read own bound cell)}

  /scheduler/placement-decisions:
    post:
      summary: Request a placement decision (typically auto-invoked by scheduler on TenantOnboarded)
      operationId: requestPlacementDecision
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, pack]
              properties:
                tenant_id: {type: string}
                pack: {type: string}
                constraints: {type: object}
      responses:
        '200':
          description: Placement decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlacementDecision'}
        '403': {description: scheduler authority required}

  /migration-plans:
    post:
      summary: Create a migration plan (operator-initiated or scheduler-rebalance)
      operationId: createMigrationPlan
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, target_cell, reason]
              properties:
                tenant_id: {type: string}
                target_cell: {type: string}
                reason: {type: string, enum: [rebalance, scale-up, pack-rehome, dsr-cascade, decommission-source]}
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MigrationPlan'}
        '409': {description: Migration already in progress for tenant (advisory-lock contention)}

  /migration-plans/{migration_id}:
    get:
      summary: Read migration plan status
      operationId: getMigrationPlan
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: migration_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Plan status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MigrationPlan'}

  /host-pool/{pack}:
    get:
      summary: Read host-pool status for a pack (operator scope)
      operationId: getHostPoolStatus
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: pack
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Host pool inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: {type: string}
                  warm_pool_size: {type: integer}
                  bound_count: {type: integer}
                  draining_count: {type: integer}
                  total: {type: integer}
                  hosts:
                    type: array
                    items: {$ref: '#/components/schemas/HostNode'}

  /cells/{cell_id}/decommission:
    post:
      summary: Initiate cell decommission (2-person rule required)
      operationId: decommissionCell
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/CellId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, operator_1, operator_2]
              properties:
                reason: {type: string}
                operator_1: {type: string, description: SPIFFE ID + JIT acknowledgment}
                operator_2: {type: string}
                dry_run: {type: boolean, default: false}
      responses:
        '202':
          description: Decommission initiated; soft-delete window begins
        '403': {description: 2-person rule not satisfied}
        '409': {description: Tenants still bound to cell}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres registry reachable + SPIRE healthy)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
