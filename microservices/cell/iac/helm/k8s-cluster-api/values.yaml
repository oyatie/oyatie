# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
cluster-api:
  image:
    tag: "v1.7.0"

managementCluster:
  replicas: 3                       # HA control plane
  nodeSize: VM.Standard.E4.4-core
  region: "${OCI_REGION}"           # pack-specific
  availabilityDomains: 3            # multi-AZ within region

workloadClusterTemplate:
  # Cluster API Cluster CRD template instantiated per oyatie cell
  controlPlane:
    replicas: 3
    nodeSize: VM.Standard.E4.4-core
  workerMachineDeployment:
    minReplicas: 6                  # per capacity-model.md cell sizing
    maxReplicas: 50
    nodeSize: VM.Standard.E4.4-core
    autoscalingEnabled: true

warmPool:
  # Warm node pool maintained at minReplicas, scales up on placement-queue depth
  machineDeployment:
    replicas: 2                     # baseline per capacity-model.md
    nodeSize: VM.Standard.E4.4-core
  autoscaler:
    minReplicas: 2
    maxReplicas: 20
    scaleUpTrigger: "oya_cell_placement_queue_depth > 5"
    scaleUpCooldown: "60s"
    scaleDownTrigger: "oya_cell_placement_queue_depth == 0 && warm_pool_size > 4"
    scaleDownCooldown: "10m"

# NetworkPolicy template applied to every per-cell namespace
networkPolicyTemplate:
  defaultDeny: true                 # CB-01: per-cell namespace isolation
  permitMeshControlPlane: true      # only mesh-internal control-plane traffic

# SPIRE / SPIFFE integration for per-cell SVID issuance
spire:
  enabled: true
  serverReplicas: 3
  trustDomain: "oyatie"
  attestor: k8s-psat

# Audit: every cell CRD mutation emits to audit-chain
audit:
  enabled: true
  emitter: "spiffe://oyatie/audit-chain/cell-substrate"
