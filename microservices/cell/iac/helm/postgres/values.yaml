# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
cloudnative-pg:
  image:
    tag: "1.23.0"  # operator LTS pin

cluster:
  name: cell-registry-{{ .Values.pack }}
  instances: 3  # HA primary + 2 replicas
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2
  postgresql:
    parameters:
      max_connections: "500"           # paired with PgBouncer pool sizing
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      wal_level: replica
      max_wal_size: "2GB"
      # RLS guard rails (per cell-boundary.md CB-03)
      row_security: "on"
    pg_hba:
      # All connections require mTLS-based cert auth; no password auth
      - hostssl all all all cert
  storage:
    size: 100Gi                        # XS tier; per capacity-model.md
    storageClass: oci-bv-ssd
  backup:
    barmanObjectStore:
      destinationPath: "s3://${OCI_CELL_BACKUP_BUCKET}/cell-registry-{{ .Values.pack }}"
      s3Credentials:
        accessKeyId:
          name: "openbao:secret/cell/postgres/{{ .Values.pack }}/s3-access-key"
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: "openbao:secret/cell/postgres/{{ .Values.pack }}/s3-secret-key"
          key: SECRET_ACCESS_KEY
    retentionPolicy: "30d"             # soft-delete window + audit retention

pgbouncer:
  enabled: true
  poolSize: 250                        # XS tier; sized per capacity-model.md
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 100

# Row-level-security enforcement check (read by oya-cell-rls-conformance lane)
rlsAssertions:
  cell_assignments: |
    SELECT pg_policies.policyname
    FROM pg_policies
    WHERE schemaname = 'public' AND tablename = 'cell_assignments';
  migration_plans: |
    SELECT pg_policies.policyname
    FROM pg_policies
    WHERE schemaname = 'public' AND tablename = 'migration_plans';
