{{/*
Per-cell CIS-compliant Deployment template (Sweep-E in-pass fix).

Substrate µservices share this baseline: non-root, read-only rootfs,
all capabilities dropped, no privilege escalation, seccompProfile RuntimeDefault,
explicit resource requests/limits, OpenBao SecretReference URIs (no literal secrets).

Per ADR-0131 per-µservice flat layout + ADR-0123 secret-reference URI policy.
*/}}
{{- $cfg := $.Values.scheduler | default $.Values -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-cell-scheduler
  namespace: cell
  labels:
    microservice: cell
    app.kubernetes.io/name: oya-cell-scheduler
    app.kubernetes.io/version: {{ $.Chart.AppVersion | default "0.1.0" }}
spec:
  replicas: {{ $cfg.replicaCount | default 2 }}
  selector:
    matchLabels:
      microservice: cell
      app.kubernetes.io/name: oya-cell-scheduler
  template:
    metadata:
      labels:
        microservice: cell
        app.kubernetes.io/name: oya-cell-scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: oya-cell
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $cfg.image.repository | default "registry.oyatie.dev/oya-cell-scheduler" }}:{{ $cfg.image.tag | default "0.1.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app,     containerPort: 9000, protocol: TCP}
            - {name: metrics, containerPort: 9090, protocol: TCP}
          env:
            - {name: OYA_MICROSERVICE, value: cell}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://oya-observability-alloy.observability.svc.cluster.local:4317"}
            - {name: RUST_LOG, value: info}
          resources:
            requests:
              cpu: {{ $cfg.resources.requests.cpu | default "500m" }}
              memory: {{ $cfg.resources.requests.memory | default "512Mi" }}
            limits:
              cpu: {{ $cfg.resources.limits.cpu | default "2" }}
              memory: {{ $cfg.resources.limits.memory | default "1Gi" }}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
