{{/*
Per-cell default-deny + mesh-ingress + scoped-egress NetworkPolicy (Sweep-E in-pass fix).

CIS K8s Benchmark v1.10 sections 5.3.1-5.3.4: default-deny, explicit ingress,
explicit egress, DNS scoped to kube-system.

Per ADR-0131 per-µservice flat layout.
*/}}
{{- if (default true $.Values.networkPolicy.enabled) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-cell-default-deny
  namespace: cell
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-cell-allow-mesh-ingress
  namespace: cell
spec:
  podSelector:
    matchLabels: {microservice: cell}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {istio-injection: enabled}
        - podSelector:
            matchLabels: {app.kubernetes.io/component: gateway}
      ports:
        - {port: 9000, protocol: TCP}
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-cell-allow-egress
  namespace: cell
spec:
  podSelector:
    matchLabels: {microservice: cell}
  policyTypes: [Egress]
  egress:
    # OpenBao for SecretReference resolution
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cloud-secrets}
      ports: [{port: 8200, protocol: TCP}]
    # Observability (OTel + Prometheus)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports: [{port: 4317, protocol: TCP}, {port: 9090, protocol: TCP}]
    # Audit-chain emission
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: audit-chain}
      ports: [{port: 9000, protocol: TCP}]
    # Tenancy (JWT verification + RLS context)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tenancy}
      ports: [{port: 9000, protocol: TCP}]
    # DNS (kube-system only)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
