apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas.
# Per data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/cluster/storage/size
        value: "100Gi"  # pack-kr XS tier
      - op: replace
        path: /spec/values/cluster/instances
        value: 3
    target:
      kind: HelmRelease
      name: cell-postgres
  - patch: |-
      - op: replace
        path: /spec/values/managementCluster/replicas
        value: 3
      - op: replace
        path: /spec/values/warmPool/machineDeployment/replicas
        value: 2  # pack-kr XS warm baseline per capacity-model.md
    target:
      kind: HelmRelease
      name: cell-cluster-api
  - patch: |-
      - op: replace
        path: /spec/values/replicas
        value: 2
      - op: replace
        path: /spec/values/boundPack
        value: "pack-kr"
    target:
      kind: HelmRelease
      name: cell-scheduler

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
      - CELL_AUDIT_RETENTION=3y   # KR PIPA + KR-FSS extended for production tier
      - CELL_SOFT_DELETE_WINDOW=30d
      - SCC_EXCEPTION_REGISTRY=microservices/cell/legal/transfer-register.md
