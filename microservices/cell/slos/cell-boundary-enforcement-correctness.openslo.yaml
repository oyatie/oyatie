# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-cell-boundary-enforcement-correctness
  displayName: "cell: cell boundary enforcement correctness 100% (load-bearing)"
  labels:
    microservice: cell
    bounded_context: cell-boundary-gate
    sli_class: correctness
    tier: load-bearing-invariant
    plane: data
    owner_team: axis-cell + council-privacy
    pack_scope: all
    invariant: INV-CELL-BOUNDARY-ZERO-LEAK
    compliance: [GDPR-Art25, KR-PIPA-Art23, HIPAA-164.502b]
spec:
  service: cell
  description: |
    Cell-boundary enforcement correctness SLO. A cross-cell access attempt
    is "good" when it is REFUSED (403 + audit-emit). Zero cross-cell data
    leakage is the load-bearing tenant-isolation invariant. Per ADR-0119
    cell-boundary-gate + DPIA. Target = 100% (any leak is Sev-1 catastrophic
    privacy event).
  indicator:
    metadata:
      name: cell-cross-boundary-refusal-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_cross_boundary_refused_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_cross_boundary_attempt_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% cross-cell refusal (no error budget; any leak is Sev-1)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
