# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-cell-decommission-correctness
  displayName: "cell: cell decommission correctness 100% (zero data remnant)"
  labels:
    microservice: cell
    bounded_context: lifecycle-manager
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-cell + council-privacy
    pack_scope: all
    compliance: [GDPR-Art17, KR-PIPA-Art21]
spec:
  service: cell
  description: |
    Cell decommission correctness SLO. A decommission is "good" when the
    full sweep (drain-tenants → wipe-storage-with-attestation → revoke-
    SPIFFE-trust-domain → audit-seal) completes with zero residual data
    artifacts. Per ADR-0119 lifecycle + GDPR Art-17 erasure. Target = 100%
    (any miss is Sev-2 compliance violation).
  indicator:
    metadata:
      name: cell-decommission-clean-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_decommission_total{outcome="clean"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_decommission_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% clean decommission (any miss is Sev-2 compliance violation)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
