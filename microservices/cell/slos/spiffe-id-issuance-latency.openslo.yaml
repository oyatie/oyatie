# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-spiffe-id-issuance-latency
  displayName: "cell: SPIFFE ID issuance latency p99 ≤ 200ms"
  labels:
    microservice: cell
    bounded_context: cell-registry
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cell + axis-cloud-secrets
    pack_scope: all
spec:
  service: cell
  description: |
    SPIFFE ID issuance latency p99 SLO. A workload SPIFFE-id mint is "good"
    when the SVID issue (CSR-from-attested-workload → SPIFFE-trust-domain
    sign → SVID deliver) completes in ≤ 200ms p99. Required for per-pod
    sidecar boot. Per PRD §"Performance Targets" identity-bootstrap path.
  indicator:
    metadata:
      name: cell-spiffe-issuance-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_spiffe_issuance_duration_seconds_bucket{le="0.2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_spiffe_issuance_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 200ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
