# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-cedar-eval-latency
  displayName: "cell: Cedar policy eval latency p99 ≤ 5ms"
  labels:
    microservice: cell
    bounded_context: cell-boundary-gate
    sli_class: latency
    tier: internal-substrate
    plane: data
    owner_team: axis-cell
    pack_scope: all
spec:
  service: cell
  description: |
    Cedar policy evaluation latency p99 SLO. A policy eval is "good" when
    the Cedar engine returns Allow/Deny in ≤ 5ms p99 for the standard
    per-request policy bundle. Inline with every cell-boundary check —
    tight latency keeps gate overhead negligible. Per ADR-0120 Cedar-
    as-policy-engine.
  indicator:
    metadata:
      name: cell-cedar-eval-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_cedar_eval_duration_seconds_bucket{le="0.005"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_cedar_eval_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 5ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
