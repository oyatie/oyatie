# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-cell-migration-latency
  displayName: "cell: cell migration latency p95 ≤ 30s"
  labels:
    microservice: cell
    bounded_context: migration-orchestrator
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cell + ops-platform
    pack_scope: all
spec:
  service: cell
  description: |
    Cell migration latency p95 SLO. A tenant-cell migration is "good" when
    the orchestrated move (drain-source → snapshot → replicate → cutover →
    confirm) completes in ≤ 30s p95. Required for hot-spot rebalancing
    + maintenance drains. Per PRD §"Performance Targets" migration path.
  indicator:
    metadata:
      name: cell-migration-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_migration_duration_seconds_bucket{le="30"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_migration_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 30s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
