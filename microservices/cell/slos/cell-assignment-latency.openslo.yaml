# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-cell-cell-assignment-latency
  displayName: "cell: cell assignment latency p95 ≤ 100ms"
  labels:
    microservice: cell
    bounded_context: cell-registry
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-cell
    pack_scope: all
spec:
  service: cell
  description: |
    Cell assignment latency p95 SLO. A new-tenant assignment is "good" when
    the assignment-stack (binpack-decision → Postgres write → SPIFFE-id
    issuance) completes in ≤ 100ms p95. Per PRD §"Performance Targets"
    assignment-path requirement.
  indicator:
    metadata:
      name: cell-assignment-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_assignment_duration_seconds_bucket{le="0.1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_cell_assignment_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 100ms for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
