[package]
name = "oya-billing-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Billing composition-root binary: wires kernel + REST + PostgreSQL + Pulsar into a runnable µservice process. ADR-0083 layer 12, ADR-0478 D4-D5."

[package.metadata.oya]
microservice = "oya-billing"
bounded_context = "billing-substrate"
layer = "app"
owner_team = "council-billing"
adr_anchors = ["ADR-0083", "ADR-0478"]
container_image = "ghcr.io/oyatie/oya-billing:<sha> (non_claim: not yet built)"
data_classification = "INTERNAL_ONLY"

[lib]
name = "oya_billing_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-billing-app"
path = "src/main.rs"

[dependencies]
oya-billing-kernel = { path = "../oya-billing-kernel" }
oya-billing-rest = { path = "../oya-billing-rest" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
