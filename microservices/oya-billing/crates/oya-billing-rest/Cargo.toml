[package]
name = "oya-billing-rest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Billing HTTP surface: axum routes + Connect-RPC handlers over oya-billing-kernel. ADR-0478 D3."

[package.metadata.oya]
microservice = "oya-billing"
bounded_context = "billing-substrate"
layer = "api"
owner_team = "council-billing"
adr_anchors = ["ADR-0083", "ADR-0478"]
data_classification = "INTERNAL_ONLY"

[lib]
name = "oya_billing_rest"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-billing-kernel = { path = "../oya-billing-kernel" }
serde = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
