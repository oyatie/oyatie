apiVersion: openslo/v1
kind: SLO
metadata:
  name: shorts-moderation-classifier-latency
  displayName: "shorts: content-moderation classifier verdict p99 ≤ 2s"
  labels:
    microservice: shorts
    bc: content-moderation
    sli_class: latency
    owner_team: axis-shorts + axis-foundry-runtime
    eu_ai_act: high-risk
    pack_scope: all
spec:
  description: |
    Time from `VideoPublished` event to `ModerationVerdictEmitted` audit-chain
    seal. Includes foundry-runtime inference call (NSFW + violence + minor-
    protection classifier) + batching window. Per EU AI Act Art. 14 (human
    oversight) and Art. 15 (accuracy + robustness), classifier verdict latency
    is bounded so that auto-hide and Statement of Reasons (EU DSA Art. 17) can
    fire on user-visible feed-render path.
    Reference: PRD §Performance NFR row 8; ADR-SHORTS-0003; capabilities/T2-auto.yaml.
  service: shorts
  indicator:
    metadata:
      name: shorts-moderation-classifier-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_moderation_classifier_duration_seconds_bucket{le="2"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_moderation_classifier_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 moderation classifier verdict ≤ 2s"
  alertPolicies:
    - alertPolicyRef: shorts-moderation-classifier-fast-burn-1h-14x
    - alertPolicyRef: shorts-moderation-classifier-drift-alert
