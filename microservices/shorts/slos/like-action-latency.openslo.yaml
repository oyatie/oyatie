# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: shorts-like-action-latency
  displayName: "shorts: like-action p99 ≤ 50ms"
  labels:
    microservice: shorts
    bc: like-share-comment
    sli_class: latency
    owner_team: axis-shorts
    pack_scope: all
spec:
  description: |
    Time from POST /videos/{id}/likes received to response sent. Redis-buffered
    counter + Postgres async flush. Reference: PRD §Performance NFR row 4.
  service: shorts
  indicator:
    metadata:
      name: shorts-like-action-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_like_action_duration_seconds_bucket{le="0.05"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_like_action_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 50ms"
  alertPolicies:
    - alertPolicyRef: shorts-like-action-fast-burn-1h-14x
