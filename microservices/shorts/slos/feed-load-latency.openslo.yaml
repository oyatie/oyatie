# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: shorts-feed-load-latency
  displayName: "shorts: feed-load p95 ≤ 250ms (top 10 videos)"
  labels:
    microservice: shorts
    bc: feed-timeline
    sli_class: latency
    tier: hero-product
    owner_team: axis-shorts
    pack_scope: all
spec:
  description: |
    Latency SLO for GET /feed/for-you + GET /feed/chronological (top 10 videos).
    A request is "good" when its end-to-end latency (REST request received →
    response body sent) is ≤ 250ms. Distribution captured via Histogram with
    le buckets at [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.5, 1.0, 2.0]. Includes
    Redis hot-cache hit + warm rebuild miss tail; excludes anonymous-public
    feed (separate SLO).
    Reference: Google SRE Workbook ch. 5 multi-window multi-burn-rate.
    PRD §Performance NFR row 1.
  service: shorts
  indicator:
    metadata:
      name: shorts-feed-load-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_feed_render_duration_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_feed_render_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 250ms for 95 % of 5min windows over 30d"
  alertPolicies:
    - alertPolicyRef: shorts-feed-load-fast-burn-1h-14x
    - alertPolicyRef: shorts-feed-load-slow-burn-6h-6x
    - alertPolicyRef: shorts-feed-load-ticket-burn-3d-1x
