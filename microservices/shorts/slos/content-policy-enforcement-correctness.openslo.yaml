# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: shorts-content-policy-enforcement-correctness
  displayName: "shorts: content-policy + dual-context + minor-protection + DRM-tier + pack-residency enforcement correctness ≥ 100 %"
  labels:
    microservice: shorts
    bc: cross-cutting
    sli_class: correctness
    tier: hero-product
    owner_team: axis-shorts + ops-security + council-privacy + ops-legal
    pack_scope: all
spec:
  description: |
    Correctness SLO covering load-bearing policy invariants:
      - Dual-context isolation (DCI-02, DCI-08)
      - Personal-tier never-federates (DCI-08)
      - Pack residency (FM-13)
      - Tenant-scope (T-I-01)
      - Age-attestation isolation (T-I-09)
      - Minor-protection bypass refusal (FM-14)
      - DRM tier gating (DCI-09)
      - Four-eyes Professional disclosure pairing (T-S-05)

    A measurement window is "good" when the sum of the following violation
    counters is exactly zero:
      - oya_shorts_dual_context_denied_total
      - oya_shorts_personal_tier_federation_attempt_total
      - oya_shorts_pack_residency_violation_total
      - oya_shorts_age_attestation_unauthorized_read_total
      - oya_shorts_four_eyes_pairing_violation_total
      - oya_shorts_minor_protection_bypass_attempt_total
      - oya_shorts_drm_tier_violation_total
      - oya_shorts_parental_link_unauthorized_read_total

    Target: 100 %. Any non-zero violation is a Sev-1 incident and burns the
    entire 30d window's budget (zero-budget; no error budget for security +
    minor-protection + DRM-tier + pack-residency invariants).
  service: shorts
  indicator:
    metadata:
      name: shorts-content-policy-enforcement-correctness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                # Number of 5-minute windows with zero violations across all invariants
                count_over_time(
                  (
                    (sum(increase(oya_shorts_dual_context_denied_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_personal_tier_federation_attempt_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_pack_residency_violation_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_age_attestation_unauthorized_read_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_four_eyes_pairing_violation_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_minor_protection_bypass_attempt_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_drm_tier_violation_total[5m])) or vector(0)) +
                    (sum(increase(oya_shorts_parental_link_unauthorized_read_total[5m])) or vector(0))
                    == 0
                  )[5m:5m]
                )
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count_over_time(vector(1)[5m:5m])
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      displayName: "100 % correctness over 30d (zero violation tolerance)"
  alertPolicies:
    - alertPolicyRef: shorts-correctness-immediate-page
