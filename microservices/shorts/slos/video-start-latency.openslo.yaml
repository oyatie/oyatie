apiVersion: openslo/v1
kind: SLO
metadata:
  name: shorts-video-start-latency
  displayName: "shorts: video-start p95 ≤ 400ms (first frame)"
  labels:
    microservice: shorts
    bc: video-storage
    sli_class: latency
    tier: hero-product
    owner_team: axis-shorts
    pack_scope: all
spec:
  description: |
    Time-to-first-frame for video playback initiation. Includes manifest fetch
    (HLS/DASH) + first ABR segment fetch from CDN edge + decoder priming.
    Excludes DRM license acquisition (separate SLO: drm-license-issuance).
    Reference: PRD §Performance NFR row 2. Cloudflare R2 + Workers reference.
  service: shorts
  indicator:
    metadata:
      name: shorts-video-start-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_video_start_duration_seconds_bucket{le="0.4"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_shorts_video_start_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 400ms for 95 % of 5min windows over 30d"
  alertPolicies:
    - alertPolicyRef: shorts-video-start-fast-burn-1h-14x
    - alertPolicyRef: shorts-video-start-slow-burn-6h-6x
