# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-shorts
description: |
  Helm chart for the shorts µservice — video-upload + video-transcode +
  video-storage + thumbnail + audio-track-library + audio-attribution +
  video-composition + feed-timeline + watch-time + like-share-comment +
  repost-stitch-duet + hashtag + trending + notifications +
  content-moderation + copyright-claim + age-gate + parental-controls +
  accessibility-captions + creator-analytics + monetization-stub (off) +
  live-streaming-stub (off) + drm-stub (premium-tier gated) BCs deployed
  as horizontally-scaled, tenant-sharded workloads. Per ADR-0131 flat
  layout + ADR-0130 SLO-gated promotion + ADR-SHORTS-0001 through
  ADR-SHORTS-0006.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-shorts
    email: axis-shorts@oyatie.dev
keywords:
  - shorts
  - video
  - short-form-video
  - tiktok-class
  - reels-class
  - youtube-shorts-class
  - feed
  - moderation
  - copyright
  - dmca
  - drm
  - widevine
  - fairplay
  - playready
  - federation
dependencies:
  - name: meilisearch
    version: "0.10.0"  # Meilisearch LTS
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
