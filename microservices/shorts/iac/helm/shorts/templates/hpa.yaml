# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "videoUploadRest" "feedTimeline" }}
{{- $c := index $.Values . }}
{{- if $c.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shorts-{{ . | kebabcase }}
  namespace: shorts
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shorts-{{ . | kebabcase }}
  minReplicas: {{ $c.hpa.minReplicas }}
  maxReplicas: {{ $c.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

# =============================================================================
# video-transcode-worker uses KEDA queue-depth scaler (separate from CPU HPA)
# =============================================================================
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: shorts-video-transcode-worker
  namespace: shorts
spec:
  scaleTargetRef:
    name: shorts-video-transcode-worker
    apiVersion: apps/v1
    kind: Deployment
  minReplicaCount: {{ .Values.videoTranscodeWorker.hpa.minReplicas }}
  maxReplicaCount: {{ .Values.videoTranscodeWorker.hpa.maxReplicas }}
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://mimir.observability.svc.cluster.local:9090
        metricName: oya_shorts_transcode_queue_depth
        threshold: "10"  # 10 jobs queued per replica
        query: sum(oya_shorts_transcode_queue_depth{pack="{{ .Values.global.pack }}"})
