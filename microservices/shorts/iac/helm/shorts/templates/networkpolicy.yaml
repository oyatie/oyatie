apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorts-default-deny
  namespace: shorts
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorts-allow-ingress-from-gateway
  namespace: shorts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shorts
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shorts
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorts-allow-egress-to-substrate
  namespace: shorts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shorts
  policyTypes: [Egress]
  egress:
    # Postgres
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: shorts-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    # Redis
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: shorts-redis}}
      ports: [{protocol: TCP, port: 6379}]
    # Meilisearch
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: shorts-meilisearch}}
      ports: [{protocol: TCP, port: 7700}]
    # S3 / CDN egress via API endpoint
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: s3-egress-proxy}}
      ports: [{protocol: TCP, port: 443}]
    # Cross-µservice: observability, audit-chain, ontology, tenancy, social, messenger, mail, foundry-runtime
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 9090}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: audit-chain}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ontology}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenancy}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: social}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: messenger}}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: foundry-runtime}}
      ports: [{protocol: TCP, port: 50051}]
    # OPSWAT / ClamAV scan endpoint
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: security-scanners}}
      ports: [{protocol: TCP, port: 8008}]
    # Widevine + FairPlay + PlayReady vendor endpoints (egress for license-server coordination)
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: drm-vendor-egress-proxy}}
      ports: [{protocol: TCP, port: 443}]
    # DNS
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# video-transcode + copyright-claim + content-moderation workers — restrict
# additionally to deny network egress except scratch S3 + foundry-runtime (gVisor sandbox CVE containment)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorts-transcode-worker-restricted-egress
  namespace: shorts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: video-transcode-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: s3-egress-proxy}}
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# Federation egress (Professional-tier only, when activated per ADR successor-IP; Personal-tier never federates per DCI-08)
{{- if .Values.federationGateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shorts-federation-egress
  namespace: shorts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: federation-gateway
  policyTypes: [Egress]
  egress:
    # ActivityPub federation peers — restricted by peer allowlist enforced at app layer
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0  # peer allowlist enforced at Cedar layer; this is L3 fallback
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]
{{- end }}
