# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocket-gateway" "video-upload-rest" "video-transcode-worker" "video-storage-rest" "feed-timeline" "content-moderation-worker" "copyright-claim-worker" "drm-key-server" "notifications-worker" "accessibility-captions-worker" "age-gate-rest" "parental-controls-rest" "creator-analytics-worker" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shorts-{{ . }}
  namespace: shorts
  labels:
    app.kubernetes.io/name: shorts
    app.kubernetes.io/component: {{ . }}
    prometheus: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: {{ . }}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_oyatie_microservice]
          targetLabel: microservice
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
{{- end }}
