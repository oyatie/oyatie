# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "websocketGateway" "videoUploadRest" "videoStorageRest" "thumbnailGenerationWorker" "audioTrackLibraryRest" "audioAttributionWorker" "videoCompositionWorker" "feedTimeline" "watchTimeTrackingWorker" "likeShareCommentWorker" "repostStitchDuetWorker" "hashtagWorker" "trendingWorker" "notificationsWorker" "contentModerationWorker" "copyrightClaimWorker" "accessibilityCaptionsWorker" "creatorAnalyticsWorker" "ageGateRest" "parentalControlsRest" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorts-{{ . | kebabcase }}
  namespace: shorts
  labels:
    app.kubernetes.io/name: shorts
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: oya-shorts
    oyatie/microservice: shorts
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorts
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: shorts-{{ . | kebabcase }}
      {{- if $c.sandbox }}
      runtimeClassName: {{ $c.sandbox }}  # gVisor or Kata Container for transcode/composition/moderation workers
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shorts-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--component={{ . | kebabcase }}", "--pack={{ $.Values.global.pack }}"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
            - name: ws
              containerPort: 8443
          resources:
            requests: {{- toYaml $c.resources.requests | nindent 14 }}
            limits: {{- toYaml $c.resources.limits | nindent 14 }}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: shorts-openbao-injected
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
{{- end }}

# =============================================================================
# video-transcode-worker — separately templated to attach larger ephemeral
# storage scratch (ffmpeg scratch) + gVisor runtimeclass.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorts-video-transcode-worker
  namespace: shorts
  labels:
    app.kubernetes.io/name: shorts
    app.kubernetes.io/component: video-transcode-worker
    app.kubernetes.io/part-of: oya-shorts
    oyatie/microservice: shorts
spec:
  replicas: {{ .Values.videoTranscodeWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: video-transcode-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorts
        app.kubernetes.io/component: video-transcode-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: shorts-video-transcode-worker
      runtimeClassName: {{ .Values.videoTranscodeWorker.sandbox }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shorts-video-transcode-worker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--component=video-transcode-worker", "--pack={{ .Values.global.pack }}", "--ffmpeg-version={{ .Values.videoTranscodeWorker.ffmpegVersion }}"]
          ports:
            - name: metrics
              containerPort: 9091
          resources:
            requests: {{- toYaml .Values.videoTranscodeWorker.resources.requests | nindent 14 }}
            limits: {{- toYaml .Values.videoTranscodeWorker.resources.limits | nindent 14 }}
          volumeMounts:
            - name: ffmpeg-scratch
              mountPath: /var/scratch
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 30
          envFrom:
            - secretRef:
                name: shorts-openbao-injected
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: ffmpeg-scratch
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: ssd-fast
                resources:
                  requests:
                    storage: 100Gi

# =============================================================================
# drm-key-server — separately templated; Premium-tier gated; HA per pack
# =============================================================================
{{- if .Values.drmKeyServer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorts-drm-key-server
  namespace: shorts
  labels:
    app.kubernetes.io/name: shorts
    app.kubernetes.io/component: drm-key-server
    app.kubernetes.io/part-of: oya-shorts
    oyatie/microservice: shorts
spec:
  replicas: {{ .Values.drmKeyServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: drm-key-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorts
        app.kubernetes.io/component: drm-key-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      serviceAccountName: shorts-drm-key-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shorts-drm-key-server
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--component=drm-key-server", "--pack={{ .Values.global.pack }}", "--key-systems=widevine,fairplay,playready"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          resources:
            requests: {{- toYaml .Values.drmKeyServer.resources.requests | nindent 14 }}
            limits: {{- toYaml .Values.drmKeyServer.resources.limits | nindent 14 }}
          envFrom:
            - secretRef:
                name: shorts-openbao-injected
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
{{- end }}

# =============================================================================
# federation-gateway — off by default; activated in P02 per ADR-SOC-0004 pattern
# =============================================================================
{{- if .Values.federationGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorts-federation-gateway
  namespace: shorts
  labels:
    app.kubernetes.io/name: shorts
    app.kubernetes.io/component: federation-gateway
    app.kubernetes.io/part-of: oya-shorts
    oyatie/microservice: shorts
spec:
  replicas: {{ .Values.federationGateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: federation-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shorts
        app.kubernetes.io/component: federation-gateway
    spec:
      serviceAccountName: shorts-federation-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shorts-federation-gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--component=federation-gateway", "--pack={{ .Values.global.pack }}", "--personal-tier-refused=true"]
          ports:
            - name: http
              containerPort: 8080
{{- end }}
