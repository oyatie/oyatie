{{- range tuple "websocket-gateway" "video-upload-rest" "feed-timeline" "content-moderation-worker" "drm-key-server" "video-transcode-worker" "copyright-claim-worker" "notifications-worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shorts-{{ . }}
  namespace: shorts
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shorts
      app.kubernetes.io/component: {{ . }}
{{- end }}
