apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shorts-kr

resources:
  - ../../base

# Pack-KR overlay per /specs/regulatory-packs.json#pack-kr
# Residency: KR data centers only (OCI ap-seoul-1); cross-pack federation forbidden by default.
# Retention floor: KR PIPA Art. 21 + Art. 28.
# Age-gate: KR 청소년 보호법 + PIPA Art. 8 — minor < 14y requires parental consent.
# eDiscovery: 전자문서법 (Electronic Document Act) compliance.
# Federation: Professional-tier opt-in only; Personal-tier NEVER federates per DCI-08.
# Telecommunications Business Act: video-sharing-platform obligations.

patches:
  - target: {kind: HelmRelease, name: shorts}
    patch: |-
      - op: replace
        path: /spec/values/global/pack
        value: kr
      - op: replace
        path: /spec/values/ageGatePolicy/packKrMinorThreshold
        value: 14
  - target: {kind: ConfigMap, name: shorts-retention-policy}
    patch: |-
      - op: replace
        path: /data/pack-kr-floor-days
        value: "365"  # 1 year for work-context default per KR PIPA Art. 21
      - op: replace
        path: /data/pack-kr-ceiling-days
        value: "1825"  # 5 years default; tenant-configurable up to 7y
