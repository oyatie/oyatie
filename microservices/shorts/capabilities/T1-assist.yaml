# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:shorts:t1-assist:v1
name: auto-caption-and-nsfw-classifier-and-copyright-precheck
namespace: shorts
display_name: Auto-Caption (ASR) + NSFW Classifier + Copyright Pre-Check
description: |
  T1 assist capability: invoked by upload action ("publish", "save-draft").
  Produces structured assist outputs bound to the video before publication
  decision. Creator retains final decision; verdicts can be reversed via
  appeal (NSFW) or counter-notice (copyright). Three sub-capabilities:

  1. Auto-caption (foundry-runtime ASR; e.g., Whisper-class) — emits WebVTT
     + TTML caption track; per video duration × 0.3 latency target. Creator
     can override before publish; auto-applied if creator skips.
  2. NSFW classifier (foundry-runtime; T1 surface; T2 auto-action via
     capabilities/T2-auto.yaml) — flags potentially NSFW + violence content
     for creator awareness pre-publish; creator can confirm intent and override.
  3. Copyright pre-check (Chromaprint audio + DCT perceptual-hash video) —
     scans against per-pack licensed corpus + UGC fingerprint corpus before
     publication; flags potential matches for creator review.

  All three are reversible: caption overridable, NSFW appealable, copyright
  counter-notice. Per EU AI Act Art. 50, all carry `eu_ai_act_label` on
  output. Per EU DSA Art. 17, NSFW + copyright actions emit Statement of
  Reasons when acted on.

  *** EU AI Act 2024/1689 HIGH-RISK applies to sub-capability 2 (NSFW
      classifier) when it autonomously acts (T2 lifecycle); T1 surface is
      advisory + transparency-labelled. ***

owner_team: axis-shorts + axis-foundry-runtime + ops-legal
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-SHORTS-0002, ADR-SHORTS-0003]
related_artifacts:
  - microservices/shorts/PRD.md (FR-15, FR-16, FR-20)
  - microservices/shorts/policy/dual-context-isolation.md
  - microservices/shorts/runbooks/moderation-classifier-rollback.md
  - microservices/shorts/decisions/ADR-SHORTS-0002-copyright-claim-system.md
  - microservices/shorts/decisions/ADR-SHORTS-0003-content-moderation-classifier-bounds.md

autonomy_tier: T1
# T1 = user-invoked, human-in-loop; no autonomous publication of NSFW-flagged
# content without human confirmation; auto-caption auto-applied with override.

inputs:
  - name: invoking_user_ref
    type: string
    required: true
  - name: video_id
    type: string
    format: ulid
    required: true
  - name: command
    type: enum
    values: [auto_caption, nsfw_precheck, copyright_precheck]
    required: true
  - name: context_kind
    type: enum
    values: [Personal, Professional]
    required: true
  - name: locale
    type: string
    pattern: '^[a-z]{2}(-[A-Z]{2})?$'
    required: true
  - name: pack
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
    required: true

outputs:
  - name: caption_track
    type: object
    properties:
      webvtt_url: {type: string, format: uri}
      ttml_url: {type: string, format: uri}
      detected_language: {type: string}
      word_error_rate_estimate: {type: number, minimum: 0, maximum: 1}
      eu_ai_act_label: {type: string, enum: [ai_generated]}
    description: emitted only when command=auto_caption
  - name: nsfw_verdict
    type: object
    properties:
      verdict: {type: string, enum: [safe, sensitive, nsfw, violence, minor_protection_concern]}
      confidence: {type: number, minimum: 0, maximum: 1}
      action_taken: {type: string, enum: [flagged_for_creator_review, no_action]}
      statement_of_reasons:
        type: object
        properties:
          grounds: {type: string}
          facts_and_circumstances: {type: string}
          automated_means: {type: boolean, default: true}
          redress: {type: string, description: appeal URL}
      eu_ai_act_label: {type: string, enum: [ai_generated_assessment, human_assessment, hybrid]}
    description: emitted only when command=nsfw_precheck
  - name: copyright_matches
    type: object
    properties:
      audio_matches:
        type: array
        items:
          type: object
          properties:
            match_id: {type: string}
            licensor_namespace: {type: string}
            confidence: {type: number}
            match_start_ms: {type: integer}
            match_end_ms: {type: integer}
            recommended_action: {type: string, enum: [allow, attribute, license_required, block]}
      video_matches:
        type: array
        items:
          type: object
          properties:
            match_id: {type: string}
            licensor_namespace: {type: string}
            confidence: {type: number}
            match_start_ms: {type: integer}
            match_end_ms: {type: integer}
            recommended_action: {type: string, enum: [allow, attribute, license_required, block]}
      eu_ai_act_label: {type: string, enum: [ai_generated_assessment]}
    description: emitted only when command=copyright_precheck

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI  # pack-us-healthcare patient-ed videos; disabled by default

context_kind_constraint:
  Personal: server-side allowed on creator's own video; refused on others' protected content
  Professional: server-side via tenant-DEK; tenant-admin entitlement required to enable for org-wide assists
  enforcement: oya-check-dual-context-isolation + Cedar permit when entitlement present

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    auto_caption_disabled_for_phi_accounts: true
    nsfw_precheck_disabled_for_phi_accounts: true
    reason: HIPAA 45 CFR §164.502(b) — minimum necessary; no automated assessment over PHI
    explicit_opt_in_required: true
  pack-eu:
    eu_ai_act_classification:
      auto_caption: limited_risk  # ASR
      nsfw_precheck: high_risk_when_t2_actioned  # T1 surface is advisory
      copyright_precheck: limited_risk  # advisory; humans confirm
    transparency_obligation: every output carries eu_ai_act_label per Art. 50
    art_27_recommender_transparency: ranking signals explanation API
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required
    kr_pipa_art29_2_automated_decision: per Art. 29-2 individual right to opt-out
    kr_청소년_보호법: minor-protection NSFW classifier is mandatory; opt-out not permitted for minor accounts
  pack-uk:
    uk_online_safety_act_2023: NSFW + minor-protection classifier mandatory; safety-by-design report
  pack-us:
    coppa: minor accounts NSFW classifier mandatory
    ca_ab_2273: minor protection NSFW classifier mandatory

minor_account_constraint:
  nsfw_classifier_mandatory: true
  copyright_precheck_mandatory: true
  auto_caption_default_on: true
  notes: |
    Minor accounts cannot opt out of NSFW / minor-protection / copyright classifiers.
    Per EU DSA Art. 28, KR 청소년 보호법, COPPA, CA AB-2273, UT SMRA — minor
    protection is a regulatory floor; creator-control opt-out not permitted.

evidence_topic: oya.shorts.capability.t1_assist.evidence

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call_auto_caption: 0.02
  estimated_cost_usd_per_call_nsfw_precheck: 0.0008
  estimated_cost_usd_per_call_copyright_precheck: 0.002
  cost_drivers:
    - ASR inference (Whisper-class; per video-duration second × 0.3 wallclock × GPU cost)
    - NSFW classifier inference (medium open-weights model; per-keyframe batched)
    - Chromaprint fingerprint generation + corpus query
    - DCT perceptual-hash generation + corpus query

cedar_policy_fragments:
  - microservices/shorts/policy/tenant-scope.cedar

eval_set:
  golden_inputs_path: microservices/shorts/capabilities/eval/t1-assist-golden.jsonl
  pass_threshold: 0.92
  eval_metric: |
    auto-caption: WER (word error rate) per locale ≤ 8 % on common locale corpus;
                  WCAG 2.2 Level AA conformance check;
    nsfw_precheck: macro-F1 ≥ 0.95 over 5 verdict labels;
                   false-positive rate < 2 % at production threshold;
                   bias-audit (disparity ratio 4/5 rule across protected groups);
    copyright_precheck: precision@1 vs licensor-verified corpus; recall ≥ 0.95
  cadence: per-release + monthly drift-monitor
  reference: WER benchmarks; NIST AI RMF; EU AI Act Art. 15 accuracy requirement; WCAG 2.2 Level AA

eu_ai_act_classification:
  classification: HIGH_RISK
  basis: |
    Annex III §1(a) applies to NSFW + minor-protection classifier when it
    autonomously acts (T2 lifecycle via capabilities/T2-auto.yaml). T1
    surface here is advisory; obligations operative throughout per ADR-SHORTS-0003.
  obligations_satisfied:
    art_9_risk_management_system: see microservices/shorts/dpia.md Step 6 + R-08, R-09, R-14, R-18
    art_10_data_governance: training-dataset SHA + bias-audit per release
    art_11_technical_documentation: per-classifier model card
    art_13_transparency: per-output eu_ai_act_label
    art_14_human_oversight: creator/manual-reviewer in loop
    art_15_accuracy_robustness: per-release golden-set eval + adversarial robustness eval + WER bound for ASR
    art_50_transparency: UI label "AI-generated" on captions + "AI-assessed" on classifier verdicts
    art_52_codes_of_conduct: voluntary alignment
    art_73_serious_incident_reporting: 15-day clock for mass false-positive event per `runbooks/moderation-classifier-rollback.md`

rollback:
  ttl_seconds: 0  # T1 outputs are reversible: caption overridable, classifier appealable, copyright counter-noticed
  audit_trail: every invocation emits to evidence_topic with hash + reasoning_token + Statement of Reasons (per EU DSA Art. 17)
  rollback_runbook: microservices/shorts/runbooks/moderation-classifier-rollback.md

sunset:
  status: none
