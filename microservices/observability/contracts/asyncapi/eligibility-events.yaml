asyncapi: 3.1.0
info:
  title: oya-observability — eligibility events
  version: 1.0.0
  summary: Eligibility verdict, promotion, and rollback events emitted by the SLO engine
  description: |
    Cross-µservice Workflow events emitted by `oya-observability-slo-engine-worker`.
    Per ADR-0139 and `/specs/agentic-slo-gated-promotion.json` §`events`.

    Consumers:
    - Jenkins promotion job: dev → staging
    - Jenkins promotion job: staging → production
    - `audit-chain` µservice (Ed25519 seal of every event per Bominal ADR-0028)
    - `grafana-oncall` (incident paging on held/rejected/rollback)
  contact:
    name: axis-observability

defaultContentType: application/json

servers:
  promotion-pipeline:
    host: jenkins.oyatie.internal
    protocol: https
    description: |
      Jenkins promotion endpoint. Promotion jobs consume signed `eligibility-changed` events.
  workflow-events-bus:
    host: workflow-events.observability.svc.cluster.local
    protocol: amqp
    description: |
      Internal AMQP event bus consumed by audit-chain + grafana-oncall.

channels:
  eligibility-changed:
    address: workflow-events/eligibility.changed
    messages:
      EligibilityChangedMessage:
        $ref: '#/components/messages/EligibilityChanged'
    description: A µservice's eligibility verdict transitioned.

  promotion-executed:
    address: workflow-events/promotion.executed
    messages:
      PromotionExecutedMessage:
        $ref: '#/components/messages/PromotionExecuted'
    description: A release pointer was fast-forwarded to a new SHA.

  rollback-executed:
    address: workflow-events/rollback.executed
    messages:
      RollbackExecutedMessage:
        $ref: '#/components/messages/RollbackExecuted'
    description: A production-tier release pointer was rolled back to its prior SHA.

  openslo-manifest-updated:
    address: workflow-events/openslo.manifest.updated
    messages:
      OpenSloManifestUpdatedMessage:
        $ref: '#/components/messages/OpenSloManifestUpdated'
    description: A µservice's OpenSLO manifest was added or modified via git PR.

operations:
  emitEligibilityChanged:
    action: send
    channel:
      $ref: '#/channels/eligibility-changed'
  emitPromotionExecuted:
    action: send
    channel:
      $ref: '#/channels/promotion-executed'
  emitRollbackExecuted:
    action: send
    channel:
      $ref: '#/channels/rollback-executed'
  consumeOpenSloManifestUpdated:
    action: receive
    channel:
      $ref: '#/channels/openslo-manifest-updated'

components:
  messages:
    EligibilityChanged:
      name: EligibilityChanged
      contentType: application/json
      summary: Verdict transitioned for (microservice, source_sha, target_env)
      payload:
        $ref: '#/components/schemas/EligibilityChangedPayload'

    PromotionExecuted:
      name: PromotionExecuted
      contentType: application/json
      summary: A release pointer fast-forwarded
      payload:
        $ref: '#/components/schemas/PromotionExecutedPayload'

    RollbackExecuted:
      name: RollbackExecuted
      contentType: application/json
      summary: A release pointer rolled back to its prior SHA
      payload:
        $ref: '#/components/schemas/RollbackExecutedPayload'

    OpenSloManifestUpdated:
      name: OpenSloManifestUpdated
      contentType: application/json
      summary: A µservice's OpenSLO manifest changed in git
      payload:
        $ref: '#/components/schemas/OpenSloManifestUpdatedPayload'

  schemas:
    EligibilityChangedPayload:
      type: object
      required: [microservice, source_sha, target_env, verdict, evaluated_at]
      properties:
        microservice: {type: string, pattern: '^[a-z][a-z0-9-]*$'}
        source_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        target_env: {type: string, enum: [staging, production]}
        verdict: {type: string, enum: [eligible, held, rejected, rollback]}
        previous_verdict: {type: string, enum: [eligible, held, rejected, rollback]}
        burn_rate_snapshot:
          $ref: '#/components/schemas/BurnRateSnapshot'
        evaluated_at: {type: string, format: date-time}
        evaluator_version: {type: string}
        trigger_event_id: {type: string, description: ULID}
        openslo_manifest_sha: {type: string}
        signature:
          type: string
          description: Ed25519 signature by slo-engine-worker SPIFFE identity

    PromotionExecutedPayload:
      type: object
      required: [microservice, target_env, sha, executed_at]
      properties:
        microservice: {type: string}
        target_env: {type: string, enum: [staging, production]}
        sha: {type: string}
        executed_at: {type: string, format: date-time}
        actor:
          type: string
          enum: [github-actions, manual-override]
        workflow_run_id: {type: string, nullable: true}
        signature: {type: string}

    RollbackExecutedPayload:
      type: object
      required: [microservice, target_env, from_sha, to_sha, reason, executed_at]
      properties:
        microservice: {type: string}
        target_env: {type: string, enum: [production]}
        from_sha: {type: string}
        to_sha: {type: string}
        reason:
          type: string
          enum: [fast_burn_breach, slow_burn_breach, manual_override, post_mortem_remediation]
        burn_rate_snapshot:
          $ref: '#/components/schemas/BurnRateSnapshot'
        executed_at: {type: string, format: date-time}
        signature: {type: string}

    OpenSloManifestUpdatedPayload:
      type: object
      required: [microservice, sli, action, manifest_sha, committed_at]
      properties:
        microservice: {type: string}
        sli: {type: string}
        action: {type: string, enum: [created, modified, deleted]}
        manifest_sha: {type: string}
        commit_sha: {type: string}
        committed_at: {type: string, format: date-time}
        committed_by: {type: string}

    BurnRateSnapshot:
      type: object
      properties:
        fast_burn_1h: {type: number}
        slow_burn_6h: {type: number}
        ticket_burn_3d: {type: number}
        budget_remaining_pct: {type: number, minimum: 0, maximum: 100}
