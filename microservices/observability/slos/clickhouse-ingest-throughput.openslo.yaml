apiVersion: openslo/v1
kind: SLO
metadata:
  name: observability-clickhouse-ingest-throughput
  displayName: "Observability ClickHouse Ingest Throughput"
  labels:
    microservice: observability
    substrate: clickhouse
    adr: "ADR-0193"
spec:
  service: observability
  description: |
    99.9% of OpenTelemetry-collector-forwarded rows land in ClickHouse
    within 30s of emission. Per ADR-0186 Stage 1+2 ingest path.
  indicator:
    metadata:
      name: clickhouse-ingest-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  ClickHouseMetrics_AsyncInsertCacheLastAddedAge_bucket{le="30"}[5m]
                )) by (cluster)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  ClickHouseMetrics_AsyncInsertCacheLastAddedAge_count[5m]
                )) by (cluster)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "ingest lag p99 < 30s"
      target: 0.999
