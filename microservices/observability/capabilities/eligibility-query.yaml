# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:observability:eligibility-query:v1
name: eligibility-query
namespace: observability
display_name: Query Eligibility Verdict
description: |
  Read the latest eligibility verdict for a (microservice, source_sha, target_env) tuple
  from Mimir-native recording-rules (per ADR-0139). The verdict is the gate decision
  consumed by `oya-governance-promotion-readiness` CI lane and by tenant-facing dashboards.

owner_team: axis-observability
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0139, ADR-0131]
related_specs: [/specs/agentic-slo-gated-promotion.json]
related_artifacts:
  - microservices/observability/contracts/openapi/slo-engine.yaml
  - microservices/observability/contracts/proto/slo-engine.proto

autonomy_tier: T1
# T1 = pure read; no state mutation.

inputs:
  - name: microservice
    type: string
    required: true
  - name: source_sha
    type: string
    required: true
  - name: target_env
    type: enum
    values: [staging, production]
    required: true

outputs:
  - name: verdict
    type: enum
    values: [eligible, held, rejected, rollback]
  - name: burn_rate_snapshot
    type: object
  - name: evaluated_at
    type: timestamp
  - name: signature
    type: string
    description: Ed25519 signature by slo-engine-worker for non-repudiation

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.observability.eligibility.read
# Every read is audit-emitted per tenant-isolation.md §"Audit Trail".

cost_profile:
  type: per-read
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - Single PromQL recording-rule lookup (constant-time)

cedar_policy_fragments:
  - microservices/observability/policy/tenant-scope.cedar
  - microservices/observability/policy/ci-scope.cedar
  - microservices/observability/policy/auditor-scope.cedar

eval_set:
  reference_inputs_path: microservices/observability/capabilities/eval/eligibility-query-reference.jsonl
  pass_threshold: 0.999
  eval_metric: read-correctness-against-mimir-truth
  cadence: per-release

sunset:
  status: none
  notes: ""
