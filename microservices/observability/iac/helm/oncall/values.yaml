# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
oncall:
  image:
    tag: "v1.8.0"
  replicas: 2
  postgresql:
    enabled: true
    auth:
      existingSecret: "openbao://secret/observability/oncall/postgres"
  externalGrafana:
    url: http://oya-observability-grafana.observability.svc/
  base_url: "https://oncall-${PACK}.oyatie.dev"
  secrets:
    secretKey: "openbao://secret/observability/oncall/secret-key"
    mirageSecretKey: "openbao://secret/observability/oncall/mirage-secret-key"
  webhookSecret: "openbao://secret/observability/oncall/webhook-hmac"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1", memory: "2Gi" }
