# Canonical-base: microservices/governance/iac/helm/_oya-helpers (per ADR-0064)
apiVersion: v2
name: oya-observability-otel-tailsampling-collector
description: OpenTelemetry Collector tier configured with the Tail Sampling Processor per ADR-0210. Deployed as the gateway role downstream of per-node agent collectors (per ADR-0186 Stage 1). 100% sampling of errors / p99 / new-endpoint traces; 1% baseline.
type: application
version: 0.1.0
appVersion: "0.108.0"  # opentelemetry-collector-contrib latest stable 2026-05-18
maintainers:
  - name: axis-observability
  - name: ops-sre-reliability
dependencies:
  - name: opentelemetry-collector
    version: "^0.108.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
