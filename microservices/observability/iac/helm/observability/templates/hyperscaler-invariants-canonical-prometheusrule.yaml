# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-hyperscaler-invariants-canonical
  namespace: observability
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: hyperscaler-invariants-canonical
    prometheus: mimir
    canonical_base: "true"
    overlay_for: specs/hyperscaler-architecture-invariants.json
  annotations:
    # ADR-0064 canonical-base-and-localization-packs: this PrometheusRule is the
    # ONE canonical source for the four hyperscaler architecture invariants. It
    # fires alerts across ALL oyatie microservices via label query against the
    # `oya_<microservice>_*` metric naming convention (see
    # microservices/observability/contracts/metric-naming-convention.md).
    #
    # No per-microservice prometheusrule.yaml may re-declare these four INV
    # groups; the canonical PrometheusRule is authoritative.
    #
    # The four invariants drawn from /specs/hyperscaler-architecture-invariants.json:
    #   INV-CIRCUIT-BREAKER-BULKHEAD  — LLM/capability circuit-breaker
    #   INV-SHUFFLE-SHARDING          — Per-tenant rate-limit + shuffle-sharding
    #   INV-FOUR-GOLDEN-SIGNALS       — Google SRE golden-signals trio
    #   INV-SLO-ERROR-BUDGET          — Error-budget burn-rate policy
    canonical_authority: ADR-0064
    canonical_doc: docs/standards/hyperscaler-invariant-conformance.md
    metric_naming_convention: microservices/observability/contracts/metric-naming-convention.md
spec:
  groups:
    # =========================================================================
    # INV-CIRCUIT-BREAKER-BULKHEAD — LLM/capability circuit-breaker
    # =========================================================================
    - name: oya-hyperscaler-canonical-circuit-breaker
      interval: 60s
      rules:
        # Fires for ANY microservice whose `oya_<ms>_capability_circuit_state`
        # gauge reports a circuit in the open state. The {{$labels.microservice}}
        # interpolation surfaces which µservice tripped.
        - alert: OyaCapabilityCircuitOpen
          expr: |
            max by (microservice, capability_id) (
              {__name__=~"oya_.+_capability_circuit_state", state="open"}
            ) > 0
          for: 1m
          labels:
            severity: page
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} capability circuit-breaker tripped open (capability={{ $labels.capability_id }})"
            description: |
              Microservice {{ $labels.microservice }} reports an open circuit
              for capability {{ $labels.capability_id }}. Per
              INV-CIRCUIT-BREAKER-BULKHEAD, this halts retries against the
              failing downstream until the breaker probes back to half-open.
            runbook_url: "https://oyatie.dev/microservices/{{ $labels.microservice }}/runbooks/"

        - alert: OyaCapabilityRetryBudgetExhausted
          expr: |
            sum by (microservice, capability_id) (
              increase({__name__=~"oya_.+_capability_retry_budget_exhausted_total"}[5m])
            ) > 0
          for: 1m
          labels:
            severity: page
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} retry budget exhausted (capability={{ $labels.capability_id }})"
            description: |
              Capability {{ $labels.capability_id }} on microservice
              {{ $labels.microservice }} consumed its retry budget within the
              5-minute window. Per INV-CIRCUIT-BREAKER-BULKHEAD, retries are
              suppressed until the budget refills.

    # =========================================================================
    # INV-SHUFFLE-SHARDING — Per-tenant rate-limit (429 surge detection)
    # =========================================================================
    - name: oya-hyperscaler-canonical-tenant-rate-limit
      interval: 60s
      rules:
        - alert: OyaTenantRateLimit429Surge
          expr: |
            sum by (microservice, tenant_id) (
              rate({__name__=~"oya_.+_responses_429_total"}[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            inv: INV-SHUFFLE-SHARDING
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} tenant {{ $labels.tenant_id }} 429 surge (>50/s sustained 5m)"
            description: |
              Tenant {{ $labels.tenant_id }} is hitting per-tenant rate limits
              on microservice {{ $labels.microservice }} above 50 rejections/s
              for 5 minutes. Per INV-SHUFFLE-SHARDING, this is bounded to the
              tenant's shuffle-shard cell subset; investigate whether the
              tenant needs a quota lift or has runaway client behavior.

    # =========================================================================
    # INV-FOUR-GOLDEN-SIGNALS — Traffic + Errors + Saturation
    # (Latency is covered by per-SLO burn-rate alerts; the trio below ensures
    #  the OTHER three golden signals are materially observable for every µservice.)
    # =========================================================================
    - name: oya-hyperscaler-canonical-golden-signals
      interval: 60s
      rules:
        - alert: OyaSaturationCpuOver70pct
          expr: |
            avg by (microservice, pod) (
              rate(container_cpu_usage_seconds_total{namespace=~".+", pod=~".+"}[5m])
              * on(pod, namespace) group_left(microservice)
                label_replace(
                  kube_pod_labels{label_app_kubernetes_io_name!=""},
                  "microservice", "$1", "label_app_kubernetes_io_name", "(.+)"
                )
            ) > 0.7
          for: 10m
          labels:
            severity: ticket
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} pod {{ $labels.pod }} CPU > 70% sustained 10m"
            description: |
              Per INV-FOUR-GOLDEN-SIGNALS, saturation must be observed.
              Pod {{ $labels.pod }} on microservice {{ $labels.microservice }}
              has sustained CPU > 70% for 10 minutes; HPA should be scaling
              or capacity model needs revisiting.

        - alert: OyaErrors5xxRateSpike
          expr: |
            (
              sum by (microservice) (rate({__name__=~"oya_.+_responses_5xx_total"}[5m]))
              /
              sum by (microservice) (rate({__name__=~"oya_.+_responses_total"}[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: page
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} 5xx rate > 1% sustained 5m"
            description: |
              Per INV-FOUR-GOLDEN-SIGNALS, error rate must be observed.
              Microservice {{ $labels.microservice }} 5xx-to-total ratio
              exceeded 1% for 5 minutes.

        - alert: OyaTrafficDrop90pct
          expr: |
            (
              sum by (microservice) (rate({__name__=~"oya_.+_responses_total"}[5m]))
              /
              sum by (microservice) (rate({__name__=~"oya_.+_responses_total"}[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} inbound RPS dropped > 90% vs prior hour"
            description: |
              Per INV-FOUR-GOLDEN-SIGNALS, traffic must be observed.
              Microservice {{ $labels.microservice }} request volume fell to
              < 10% of the prior-hour baseline for 10 minutes — may indicate
              upstream outage, mis-routing, or full ingress failure.

    # =========================================================================
    # INV-SLO-ERROR-BUDGET — Multi-window burn-rate policy
    # (Per-SLO burn-rate alerts remain in per-µservice prometheusrules; the
    #  aggregate rules below provide the canonical INV label so the
    #  conformance gate can audit by `inv:INV-SLO-ERROR-BUDGET` label query.)
    # =========================================================================
    - name: oya-hyperscaler-canonical-error-budget-burn
      interval: 60s
      rules:
        - alert: OyaErrorBudgetFastBurn1h14x
          expr: |
            (
              1 - (
                sum by (microservice) (rate({__name__=~"oya_.+_request_success_total"}[1h]))
                /
                sum by (microservice) (rate({__name__=~"oya_.+_request_total"}[1h]))
              )
            ) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} aggregate availability fast-burn (1h, 14.4x)"
            description: |
              Per INV-SLO-ERROR-BUDGET, microservice {{ $labels.microservice }}
              is burning its 30d error budget at 14.4x the steady-state rate
              over the trailing 1h window. Per-SLO burn-rate alerts in the
              µservice's own prometheusrule are authoritative for which SLI
              is breaching; this aggregate is the canonical INV citation.

        - alert: OyaErrorBudgetSlowBurn6h6x
          expr: |
            (
              1 - (
                sum by (microservice) (rate({__name__=~"oya_.+_request_success_total"}[6h]))
                /
                sum by (microservice) (rate({__name__=~"oya_.+_request_total"}[6h]))
              )
            ) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
            canonical_base: "true"
          annotations:
            summary: "{{ $labels.microservice }} aggregate availability slow-burn (6h, 6x)"
            description: |
              Per INV-SLO-ERROR-BUDGET, microservice {{ $labels.microservice }}
              is burning its 30d error budget at 6x the steady-state rate over
              the trailing 6h window. Open a ticket for the on-call axis team.
