# ClickHouse 26.3 LTS — distributed cluster per ADR-0193 §"Cluster shape".
# 3 shards × 2 replicas = 6 nodes; ClickHouse Keeper 3-replica Raft quorum.

clickhouse-operator:
  enabled: true

clickhouseInstallation:
  metadata:
    name: oya-observability-clickhouse
  spec:
    configuration:
      clusters:
        - name: oya-cell
          layout:
            shardsCount: 3
            replicasCount: 2
      users:
        # ADR-0043 — admin password resolved via OpenBao External Secret.
        admin/password_sha256_hex: "{openbao:secret/observability/clickhouse/admin-password-sha256}"
        admin/networks/ip:
          - "::/0"
        admin/profile: "default"
        admin/quota: "default"
      profiles:
        default/max_memory_usage: "10737418240"  # 10 GiB
        default/max_bytes_before_external_group_by: "5368709120"  # 5 GiB
        default/load_balancing: "in_order"
        default/use_uncompressed_cache: "0"
        # Async inserts default-on (ClickHouse 26.3 default per release notes)
        default/async_insert: "1"
        default/wait_for_async_insert: "1"
      quotas:
        default/interval/duration: "3600"
        default/interval/queries: "10000"
        default/interval/read_rows: "1000000000"
      settings:
        # Cold tier via S3-compat disk per ADR-0193 §"TTL + partition rotation + cold tier"
        storage_configuration/disks/s3_cold/type: "s3"
        storage_configuration/disks/s3_cold/endpoint: "http://seaweedfs-s3.observability.svc.cluster.local:8333/clickhouse-cold/"
        storage_configuration/disks/s3_cold/access_key_id: "{openbao:secret/observability/clickhouse/s3-access-key}"
        storage_configuration/disks/s3_cold/secret_access_key: "{openbao:secret/observability/clickhouse/s3-secret-key}"
        storage_configuration/policies/hot_cold/volumes/hot/disk: "default"
        storage_configuration/policies/hot_cold/volumes/cold/disk: "s3_cold"
        storage_configuration/policies/hot_cold/move_factor: "0.2"
      files:
        # MV ingest from Pulsar Kafka-protocol endpoint per ADR-0195 default tier.
        kafka.xml: |
          <yandex>
            <kafka>
              <auto_offset_reset>latest</auto_offset_reset>
              <enable_partition_eof>false</enable_partition_eof>
            </kafka>
          </yandex>

    defaults:
      templates:
        podTemplate: clickhouse-pod
        dataVolumeClaimTemplate: clickhouse-data
        logVolumeClaimTemplate: clickhouse-logs
        serviceTemplate: clickhouse-service

    templates:
      podTemplates:
        - name: clickhouse-pod
          spec:
            containers:
              - name: clickhouse
                image: "clickhouse/clickhouse-server:26.3.10.60-lts"
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: "4000m"
                    memory: "16Gi"
                  limits:
                    cpu: "8000m"
                    memory: "32Gi"
                ports:
                  - name: http
                    containerPort: 8123
                  - name: tcp
                    containerPort: 9000
                  - name: interserver
                    containerPort: 9009
                  - name: metrics
                    containerPort: 9363
      volumeClaimTemplates:
        - name: clickhouse-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: csi-fast
            resources:
              requests:
                storage: 500Gi
        - name: clickhouse-logs
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: csi-standard
            resources:
              requests:
                storage: 50Gi

    useTemplates:
      - name: clickhouse-keeper-template
        useType: merge
