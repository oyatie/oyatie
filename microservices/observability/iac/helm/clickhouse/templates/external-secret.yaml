apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-admin
  namespace: {{ .Release.Namespace }}
  labels:
    oya.adr: "0043,0193"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-cluster
    kind: ClusterSecretStore
  target:
    name: clickhouse-admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/observability/clickhouse/admin-password
        property: password
    - secretKey: s3-access-key
      remoteRef:
        key: secret/observability/clickhouse/s3-access-key
        property: key
    - secretKey: s3-secret-key
      remoteRef:
        key: secret/observability/clickhouse/s3-secret-key
        property: key
