{{- /*
Fail closed if an operator promotes this dev-cell umbrella to production while
any local/dev-only storage or tenancy invariant is still in use.
*/ -}}
{{- if eq (.Values.config.environment | default "development") "production" -}}
  {{- if .Values.loki.loki.useTestSchema -}}
    {{- fail "production observability requires Loki production schema; useTestSchema=true is dev-only" -}}
  {{- end -}}
  {{- if eq (.Values.loki.loki.storage.type | default "") "filesystem" -}}
    {{- fail "production observability requires Loki SeaweedFS object storage; filesystem storage is dev-only" -}}
  {{- end -}}
  {{- if eq (.Values.tempo.storage.trace.backend | default "") "local" -}}
    {{- fail "production observability requires Tempo SeaweedFS object storage; local trace backend is dev-only" -}}
  {{- end -}}
  {{- if eq (.Values.mimir.mimir.structuredConfig.blocks_storage.backend | default "") "filesystem" -}}
    {{- fail "production observability requires Mimir SeaweedFS object storage; filesystem blocks storage is dev-only" -}}
  {{- end -}}
  {{- if not .Values.mimir.mimir.structuredConfig.multitenancy_enabled -}}
    {{- fail "production observability requires Mimir multitenancy_enabled=true" -}}
  {{- end -}}
  {{- if not .Values.tempo.multitenancyEnabled -}}
    {{- fail "production observability requires Tempo multitenancyEnabled=true" -}}
  {{- end -}}
  {{- if not .Values.externalSecrets.grafanaAdmin.enabled -}}
    {{- fail "production observability requires the Grafana admin ExternalSecret contract" -}}
  {{- end -}}
  {{- if eq (.Values.config.defaultTenant | default "") "oyatie-dev" -}}
    {{- fail "production observability requires tenant-scoped datasource provisioning; config.defaultTenant=oyatie-dev is dev-only" -}}
  {{- end -}}
  {{- range $datasource := .Values.grafana.datasources.datasources.yaml.datasources -}}
    {{- $secureJsonData := (get $datasource "secureJsonData") | default dict -}}
    {{- if eq ((get $secureJsonData "httpHeaderValue1") | default "") "oyatie-dev" -}}
      {{- fail "production observability requires tenant-scoped datasource provisioning; Grafana datasource header oyatie-dev is dev-only" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
