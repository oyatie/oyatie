---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-keeper
spec:
  type: ClusterIP
  clusterIP: None  # Headless — pods addressable as pod-N.clickhouse-keeper
  selector:
    app.kubernetes.io/name: clickhouse-keeper
  ports:
    - name: keeper
      port: 9181
    - name: raft
      port: 9234
    - name: metrics
      port: 9182
