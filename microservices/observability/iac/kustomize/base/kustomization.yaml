# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the observability cluster, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier.
# Per ADR-0139 Layer-A + multi-region.md DR posture.

namespace: observability

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - service-mesh-tenant-headers.yaml

helmCharts:
  - name: oya-observability-alloy
    valuesFile: ../../helm/alloy/values.yaml
    releaseName: alloy
    namespace: observability
  - name: oya-observability-mimir
    valuesFile: ../../helm/mimir/values.yaml
    releaseName: mimir
    namespace: observability
  - name: oya-observability-loki
    valuesFile: ../../helm/loki/values.yaml
    releaseName: loki
    namespace: observability
  - name: oya-observability-tempo
    valuesFile: ../../helm/tempo/values.yaml
    releaseName: tempo
    namespace: observability
  - name: oya-observability-pyroscope
    valuesFile: ../../helm/pyroscope/values.yaml
    releaseName: pyroscope
    namespace: observability
  - name: oya-observability-grafana
    valuesFile: ../../helm/grafana/values.yaml
    releaseName: grafana
    namespace: observability
  - name: oya-observability-alertmanager
    valuesFile: ../../helm/alertmanager/values.yaml
    releaseName: alertmanager
    namespace: observability
  - name: oya-observability-oncall
    valuesFile: ../../helm/oncall/values.yaml
    releaseName: oncall
    namespace: observability

commonLabels:
  app.kubernetes.io/part-of: oya-observability
  oyatie/microservice: observability
