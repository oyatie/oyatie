# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay: pack-specific residency + retention + replicas.
# Per data-residency.md + multi-region.md (pack-kr: single-region OCI ap-seoul-1).

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/values/mimir/structuredConfig/limits/max_global_series_per_user
        value: 500000  # pack-kr initial trial-tier cap
    target:
      kind: HelmRelease
      name: mimir
  - patch: |-
      - op: replace
        path: /spec/values/loki/loki/structuredConfig/limits_config/retention_period
        value: "120h"  # 5d hot — pack-kr trial
    target:
      kind: HelmRelease
      name: loki

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=kr
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-seoul-1.oraclecloud.com
