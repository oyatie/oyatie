# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: community-kr

resources:
  - ../../base

# Pack-KR overlay per /specs/regulatory-packs.json#pack-kr
# Residency: KR data centers only; cross-pack federation forbidden.
# Retention floor: KR PIPA Art. 21 + Art. 28 (3 years default; 5 years for audit-class events).
# eDiscovery: 전자문서법 (Electronic Document Act) compliance.
# Cross-pack search forbidden by policy/tenant-scope.cedar.

patches:
  - target: {kind: HelmRelease, name: community}
    patch: |-
      - op: replace
        path: /spec/values/global/pack
        value: kr
  - target: {kind: ConfigMap, name: community-retention-policy}
    patch: |-
      - op: replace
        path: /data/pack-kr-floor-days
        value: "1095"  # 3 years default for community posts per KR PIPA Art. 21
      - op: replace
        path: /data/pack-kr-audit-floor-days
        value: "1825"  # 5 years for moderation actions + vote audit events
