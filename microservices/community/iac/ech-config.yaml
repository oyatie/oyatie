# ECH config for community REST edge surfaces.
# Authority: ADR-0253 row-12 ECH. Static config only; DNS publication evidence is separate.

apiVersion: config.k8s.oya/v1
kind: ECHConfig
metadata:
  name: community-ech-config
  namespace: community
spec:
  enabled: true
  rotation_cadence_days: 90
  publish_https_rr: true
  dns_provider: cloudflare
  config_ids:
    - id: 01
      public_name: community.oyatie.example
      kem: x25519-kyber768
      kdf: hkdf-sha256
      aead: aes-256-gcm
      created_at: 2026-05-24T00:00:00Z
      expires_at: 2026-08-22T00:00:00Z
      status: ACTIVE
  fallback:
    standard_tls_13: enabled
    refuse_session_if_no_ech: false
