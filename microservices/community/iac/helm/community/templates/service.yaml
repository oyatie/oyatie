# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: community-post-store-rest
  namespace: community
  labels:
    app.kubernetes.io/name: community
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: community
    app.kubernetes.io/component: post-store-rest
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9091
      targetPort: 9091
---
