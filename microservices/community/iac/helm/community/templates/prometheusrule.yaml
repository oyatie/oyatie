apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: community-burn-rate-rules
  namespace: community
  labels:
    app.kubernetes.io/name: community
    prometheus: mimir
spec:
  groups:
    - name: community-recording-rules
      interval: 60s
      rules:
        - record: community:post_create:availability_5m
          expr: |
            sum(rate(oya_community_post_create_total{result="success"}[5m]))
            /
            sum(rate(oya_community_post_create_total[5m]))
        - record: community:post_create:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_community_post_create_duration_seconds_bucket[5m]))
            )
        - record: community:vote_cast:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_community_vote_cast_duration_seconds_bucket[5m]))
            )
        - record: community:search_query:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_community_search_query_duration_seconds_bucket[5m]))
            )
        - record: community:moderation_action:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_community_moderation_action_duration_seconds_bucket[5m]))
            )
        - record: community:audit_seal:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_community_audit_seal_duration_seconds_bucket[5m]))
            )

    - name: community-burn-rate-alerts
      rules:
        - alert: CommunityPostCreateFastBurn1h
          expr: |
            (1 - community:post_create:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: community
            bc: post-store
          annotations:
            summary: "community post-create fast-burn (14.4x) for 5m"
            runbook_url: "https://oyatie.dev/microservices/community/runbooks/post-mass-deletion"

        - alert: CommunityPostCreateSlowBurn6h
          expr: |
            (1 - avg_over_time(community:post_create:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: community

        - alert: CommunityVoteCastLatencyP99High
          expr: community:vote_cast:latency_p99_5m > 0.1
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: community
            bc: voting-engine
          annotations:
            summary: "community vote-cast p99 latency > 100ms for 10m"
            runbook_url: "https://oyatie.dev/microservices/community/runbooks/vote-anomaly"

        - alert: CommunitySearchQueryLatencyP99High
          expr: community:search_query:latency_p99_5m > 0.5
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: community
            bc: search-index
          annotations:
            summary: "community search-query p99 > 500ms for 10m"
            runbook_url: "https://oyatie.dev/microservices/community/runbooks/search-rebuild"

        - alert: CommunityModerationQueueDepthHigh
          expr: |
            max by (tenant_id) (oya_community_moderation_queue_depth) > 5000
          for: 15m
          labels:
            severity: warning
            sli: queue-depth
            microservice: community
            bc: moderation-queue
          annotations:
            summary: "community moderation queue depth > 5000 for 15m"
            runbook_url: "https://oyatie.dev/microservices/community/runbooks/moderation-queue-clear"

        - alert: CommunityAuditSealMiss
          expr: |
            increase(oya_community_audit_seal_missed_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            policy: audit-chain-seal-invariant
            microservice: community
          annotations:
            summary: "community audit-chain seal miss detected — P0"
            runbook_url: "https://oyatie.dev/microservices/community/decisions/ADR-COMM-0001"

        - alert: CommunitySpamFloodDetected
          expr: |
            sum by (tenant_id) (rate(oya_community_post_create_total[5m])) > 100
          for: 5m
          labels:
            severity: warning
            sli: rate-limit
            microservice: community
            bc: post-store
          annotations:
            summary: "community post-create rate >100/s sustained 5m per tenant — possible spam flood"
            runbook_url: "https://oyatie.dev/microservices/community/runbooks/spam-flood-throttle"

    - name: community-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: community-llm-capability-circuit-open
          expr: max(oya_community_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: community
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "community LLM/capability circuit-breaker tripped open"
        - alert: community-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_community_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: community
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "community capability retry-budget exhausted"

    - name: community-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: community-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_community_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: community
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "community tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: community-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: community-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"community-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: community
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "community pod CPU saturation > 70% sustained 10m"
        - alert: community-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_community_responses_5xx_total[5m]))
            /
            sum(rate(oya_community_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: community
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "community 5xx rate > 1% sustained 5m"
        - alert: community-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_community_responses_total[5m]))
              /
              sum(rate(oya_community_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: community
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "community inbound RPS dropped > 90% vs prior hour"

    - name: community-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: community-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_community_request_success_total[1h]))
              /
              sum(rate(oya_community_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: community
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "community aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: community-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_community_request_success_total[6h]))
              /
              sum(rate(oya_community_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: community
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "community aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
