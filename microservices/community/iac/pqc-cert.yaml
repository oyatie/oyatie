# PQC hybrid cert config for community.
# Authority: ADR-0253 row-12 PQC. Static cert-manager intent only; no issued cert is claimed.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: community-pqc-hybrid
  namespace: community
spec:
  secretName: community-pqc-hybrid-tls
  issuerRef:
    name: oyatie-rooted-ca-pqc
    kind: ClusterIssuer
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: hybrid
    classical: ed25519
    pqc: ml_dsa_65
  dnsNames:
    - community.oyatie.example
    - support.oyatie.example
    - kb.community.oyatie.example
  usages:
    - server auth
    - client auth
  tls_negotiation:
    kem_hybrid:
      preferred: X25519MLKEM768
      fallback_classical:
        - X25519
        - P-256
    signature_hybrid:
      preferred: ed25519+ml_dsa_65
      fallback_classical:
        - ed25519
        - ecdsa_secp256r1_sha256
    ux_floor:
      refuse_session_if_peer_lacks_pqc: false
      refuse_session_if_peer_lacks_ech: false
