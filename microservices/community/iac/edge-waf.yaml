# Edge WAF + bot-management config — community µservice
# Authority: ADR-0297; ADR-0253 row-12 TLS/ECH/PQC posture.
# Static hardening manifest only; live Cloudflare/API-gateway application is separate evidence.

apiVersion: cloudflare.com/v1
kind: EdgeWAFConfig
metadata:
  name: community-edge-waf
  namespace: community
spec:
  routes:
    - path: /v1/community/spaces/*
      action: space_read
      rate_limit:
        per_ip_per_minute: 300
        per_tenant_per_minute_default: 6000
        per_tenant_per_minute_tier_1: 60000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
    - path: /v1/community/spaces/*/posts
      action: post_create
      rate_limit:
        per_ip_per_minute: 60
        per_tenant_per_minute_default: 3000
      bot_management:
        mode: passive_score
        threshold_challenge: 90
        spam_pattern_detection: enabled
    - path: /v1/community/posts/*/vote
      action: vote_cast
      rate_limit:
        per_ip_per_minute: 300
        per_tenant_per_minute_default: 30000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        sock_puppet_check: enabled
    - path: /v1/community/moderation/*
      action: moderation_action
      rate_limit:
        per_ip_per_minute: 30
        per_tenant_per_minute_default: 600
      bot_management:
        mode: challenge_on_suspicion
        threshold_challenge: 80
        moderator_role_evidence_required: true
    - path: /v1/community/kb/*
      action: kb_read_write
      rate_limit:
        per_ip_per_minute: 240
        per_tenant_per_minute_default: 6000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
    - path: /v1/community/search
      action: search
      rate_limit:
        per_ip_per_minute: 60
        per_tenant_per_minute_default: 2000
      bot_management:
        mode: passive_score
        threshold_challenge: 95
        anti_scrape_alphabetical_enumeration_detection: enabled

  honeypot_routes:
    - path: /v1/community/_internal/moderator-roster
      response_class: canary
      audit_class: oya.community.honeypot-trip
    - path: /v1/community/_internal/tenant-vote-export
      response_class: canary
      audit_class: oya.community.honeypot-trip

  tls:
    min_version: "1.3"
    ech_enabled: true
    ech_config_path: iac/ech-config.yaml
    pqc_hybrid: X25519MLKEM768
    pqc_signature_hybrid: ed25519+ml_dsa_65
    hsts: "max-age=63072000; includeSubDomains; preload"
    ocsp_stapling: true
    ct_required: true

  fingerprinting:
    ja4: enabled
    ja4_plus: enabled
    http2_frame_pattern: enabled
    http3_frame_pattern: enabled
    mode: passive

  anti_abuse:
    spam_burst_detection: enabled
    sequential_post_scan_detection: enabled
    vote_ring_detection: enabled
    sock_puppet_graph_detection: enabled
    per_user_invisible_watermark: enabled

  ux_floor:
    default_path_latency_budget_ms: 2
    accessibility:
      audio_captcha_fallback: enabled
      keyboard_navigation: enabled
      screen_reader_friendly: enabled
      no_time_pressure_for_assistive_tech: enabled
    challenge_solve_time_floor_seconds: 10
    session_continuity_preserved: true
    tenant_tier_adaptive_sensitivity: enabled
    locale_aware_challenges: enabled

  audit:
    emit_class_block: oya.community.abuse-defence-block
    emit_class_allow: oya.community.abuse-defence-allow
    emit_class_vote_ring: oya.community.vote-ring-detect
    emit_class_honeypot: oya.community.honeypot-trip
    cardinality_budget: 10000

  tenant_visibility:
    dashboard_path: dashboards/abuse-defence-outcomes.json
    false_positive_metric: oya_community_abuse_defence_false_positive_rate
    blocked_bot_metric: oya_community_abuse_defence_blocked_total
