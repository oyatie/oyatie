# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
capability_id: oya.community.vote-cast
microservice: community
bc: voting-engine
version: 0.1.0
status: incubating
description: |
  Cast (or change / clear) a vote on a post or reply. Idempotent per
  (member_id, post_id) tuple via idempotency_key.
preconditions:
  - "principal authenticated via tenancy JWT"
  - "principal is a tenant member"
  - "principal not banned"
  - "principal account age + reputation gate"
inputs:
  - name: post_id
    type: string
    required: true
  - name: direction
    type: enum[up, down, clear]
    required: true
  - name: idempotency_key
    type: string
    required: true
outputs:
  - name: tally
    type: VoteTally
side_effects:
  - "Valkey SET NX on (tenant_id, member_id, post_id)"
  - "Async Postgres flush"
  - "Audit-chain seal of VoteCast event"
  - "AsyncAPI emit community.vote.cast"
slo_targets:
  - { metric: latency_p99, value: 100ms }
  - { metric: success_rate, value: 99.99% }
required_policies:
  - policy/tenant-scope.cedar (Action::"cast_vote")
rate_limits:
  - "600 / min / member"
events_emitted:
  - oya.community.vote.cast.v1
gates:
  - "account_age >= 24h OR rate_limit_factor = 10x"
  - "reputation >= 100 OR downvote_daily_cap = 30"
audit:
  - "Every cast emits an audit-chain seal"
