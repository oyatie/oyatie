# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Community µservice — TeamBlind-mode capability record
# Posting mode: persona-anchored (verified-employer anonymous)
# Owner: axis-community + ops-security + council-privacy
# References:
#   - ADR-0300 (whistleblower + press-freedom doctrine — not primary here but informs
#               the anonymity-mode taxonomy this capability sits within)
#   - community/policy/anonymity-mode-persona-anchored.cedar
#   - community/ARCHITECTURE.md §community-as-4-mixture-product
#   - ADR-ANON-0001 (cryptographic blinding protocol — migrated from anonymous/)
#   - ADR-ANON-0002 (affinity attestation verification — migrated from anonymous/)

capability_id: oya-community-teamblind-mode
tier: product-surface
microservice: community
status: Accepted
date: 2026-05-21
owner_team: axis-community
deciders: axis-community, ops-security, council-privacy, council-architecture

purpose: |
  The TeamBlind-mode surface enables verified-employer anonymous posting within
  the community µservice. Users prove employer affinity (via OIDC/SAML/ZK-proof)
  through the affinity-attestation bounded context, then post under a rotating
  anonymous handle. The employer name + role level is visible on the post; the
  user_id is NEVER disclosed except under legal-process-disclosure dual-control.

  This is the persona-anchored posting mode within community's 4-mixture product
  (TeamBlind + Reddit + LinkedIn + Handshake). It was previously mis-scaffolded
  as a standalone µservice (microservices/anonymous/); per user clarification
  2026-05-21, it is a capability tier within community.

product_surface: teamblind-style
posting_mode: persona-anchored

scope:
  authorised:
    - employer affinity attestation (OIDC/SAML/ZK-proof via affinity-attestation BC)
    - blinded-credential issuance (BBS+ blind signatures)
    - anonymous-handle rotation (per-post handle; not stable across posts)
    - cross-employer industry channels (affinity_cluster_id scoping)
    - post/comment/vote under blinded persona
    - hard-delete own post (user-initiated; propagates per IP-013 chain)
    - abuse reporting + appeal flow
    - moderator queue routing (T1-assist)
    - auto-moderation on high-confidence classifier verdict (T2-auto)
  forbidden:
    - platform-side user_id ↔ post_id correlation (except legal-process-disclosure)
    - Ontology Person writes from this mode
    - cross-tenant reads
    - third-party tracker egress
    - stable handle across sessions (rotating handle only; stability = persona-anchored risk)

anonymity_guarantees:
  - employer affinity is attested but user_id is never stored alongside post_id
  - blinded credential is a BBS+ signature over (employer_hash, role_hash) only
  - handle rotation prevents temporal correlation across posts
  - ZK-proof option available for high-privacy attestation (ring signature over
    employer domain set without revealing specific employer)

legal_process_disclosure:
  applicable: true
  cedar_fragment: community/policy/anonymity-mode-persona-anchored.cedar
  dual_control_required: true
  notice_period_days: 14
  gag_order_exception: true
  reference_adr: ADR-ANON-0003 (migrated from anonymous/)

affinity_attestation:
  methods:
    - OIDC (work email domain verification)
    - SAML (enterprise SSO)
    - ZK-proof (ring signature over employer domain set)
  verified_attributes:
    - employer_hash (HMAC-SHA256 of normalized employer domain)
    - role_level (one of: IC, manager, director, vp, c-suite, intern)
  not_attested:
    - user_id
    - personal email
    - device fingerprint

regulatory_flags:
  - regional AI-risk Art. 50 transparency (classifier verdicts carry ai_assessed_label)
  - EU DSA Art. 14 appeal mechanism
  - EU DSA Art. 17 statement-of-reasons
  - GDPR Art. 22 not triggered (posts are not identifiable decisions about specific persons)
  - ECPA / SCA §§2510-2523 governs legal-process disclosure path

acceptance_criteria:
  - affinity attestation completes in p99 ≤ 500 ms
  - blinded-credential issuance completes in p99 ≤ 200 ms
  - post publish under persona completes in p99 ≤ 400 ms
  - handle rotation produces no stable correlation across N posts (verified by
    anonymity-correlation-resistance SLO; target = 1.0)
  - every auto-moderation action carries ai_assessed_label + appeal_link
  - legal-process disclosure requires 2 distinct approvers from distinct org units

references:
  - ADR-0300 (whistleblower + press-freedom doctrine; anonymity-mode taxonomy authority)
  - ADR-0243 (Cedar universal gate)
  - ADR-0244 (tenant scoping primitive)
  - ADR-ANON-0001 (cryptographic blinding protocol — migrated from anonymous/)
  - ADR-ANON-0002 (affinity attestation verification — migrated from anonymous/)
  - ADR-ANON-0003 (legal-process workflow — migrated from anonymous/)
  - ADR-0119 (capability-tier enum)
  - community/policy/anonymity-mode-persona-anchored.cedar
  - community/ARCHITECTURE.md §community-as-4-mixture-product
