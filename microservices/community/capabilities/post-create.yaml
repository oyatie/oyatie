# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
capability_id: oya.community.post-create
microservice: community
bc: post-store
version: 0.1.0
status: incubating
description: |
  Create a post (announcement / question / discussion) in a space.
  Per ADR-0135 Connect-unbundle, this is the canonical post-authorship capability.
preconditions:
  - "principal authenticated via tenancy JWT"
  - "principal is a tenant member"
  - "principal not banned"
  - "post create rate within tenant + per-member quota"
inputs:
  - name: space_id
    type: string
    required: true
  - name: kind
    type: enum[announcement, question, discussion]
    required: true
  - name: body
    type: string
    required: true
    constraints: { max_length: 100000 }
  - name: tags
    type: array<string>
    constraints: { max_items: 10 }
  - name: mentions
    type: array<string>
    constraints: { max_items: 50 }
  - name: ontology_links
    type: array<string>
    constraints: { max_items: 20 }
outputs:
  - name: post
    type: Post
side_effects:
  - "Postgres INSERT into community.posts"
  - "Audit-chain seal of PostCreated event"
  - "AsyncAPI emit community.post.created"
  - "Search-index reindex (async, ≤ 5 s)"
  - "Foundry-guardrails classification request (async)"
slo_targets:
  - { metric: latency_p99, value: 250ms }
  - { metric: success_rate, value: 99.95% }
required_policies:
  - policy/tenant-scope.cedar (Action::"create_post")
rate_limits:
  - "60 / min / member"
  - "10000 / min / tenant"
events_emitted:
  - oya.community.post.created.v1
audit:
  - "Every create emits an audit-chain seal"
