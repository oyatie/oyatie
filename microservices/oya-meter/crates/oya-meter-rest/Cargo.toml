[package]
name = "oya-meter-rest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Axum REST adapter for oya-meter: HTTP surface for usage event ingestion and query. ADR-0479."

[dependencies]
oya-meter-kernel = { path = "../oya-meter-kernel" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "oya_meter_rest"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
