apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-meter-availability
  namespace: oya-meter
spec:
  service: oya-meter
  description: "Availability SLO for the oya-meter metering µservice (ADR-0479)."
  indicator:
    metadata:
      name: oya-meter-http-availability
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(http_requests_total{service="oya-meter",code!~"5.."}[5m]))'
        total:
          metricSource:
            type: Prometheus
            spec:
              query: 'sum(rate(http_requests_total{service="oya-meter"}[5m]))'
  objectives:
    - displayName: "99.95% availability"
      target: 0.9995
      timeWindow:
        - duration: 30d
          isRolling: true
