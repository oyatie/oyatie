{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-cell-grid-rest
  namespace: sheets
  labels:
    app.kubernetes.io/name: oya-sheets-cell-grid-rest
    oyatie/microservice: sheets
    release: prometheus
spec:
  groups:
    - name: oya-sheets-cell-grid-rest.recording
      interval: 30s
      rules:
        - record: oya:sheets_editor_rest_availability:ratio_5m
          expr: |
            sum(rate(http_request_total{service="oya-sheets-cell-grid-rest",status!~"5.."}[5m]))
            / sum(rate(http_request_total{service="oya-sheets-cell-grid-rest"}[5m]))
        - record: oya:sheets_save_round_trip:p99_5m
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="oya-sheets-cell-grid-rest",route="/workbooks/{workbook_id}:save"}[5m])))
        - record: oya:sheets_sheet_open_cold:p95_5m
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(oya_sheets_sheet_open_cold_seconds_bucket[5m])))

    - name: oya-sheets-cell-grid-rest.alerts
      rules:
        - alert: SheetsEditorRestFastBurn
          expr: |
            (1 - oya:sheets_editor_rest_availability:ratio_5m) > 14.4 * (1 - 0.9995)
          for: 5m
          labels:
            severity: page
            service: oya-sheets-cell-grid-rest
          annotations:
            summary: "Sheets editor REST availability burn-rate fast-burn"
            runbook: "microservices/sheets/runbooks/recalc-storm-throttle.md"

        - alert: SheetsSaveRoundTripBudgetBreached
          expr: oya:sheets_save_round_trip:p99_5m > 0.1
          for: 15m
          labels:
            severity: ticket
            service: oya-sheets-cell-grid-rest
          annotations:
            summary: "Sheets save round-trip p99 > 100ms (GA budget breached)"
            runbook: "microservices/sheets/runbooks/recalc-storm-throttle.md"

        - alert: SheetsCollabSilentLossDetected
          expr: oya_sheets_collab_silent_loss_attempt_total > 0
          for: 0m
          labels:
            severity: page
            severity_level: sev1
            service: oya-sheets-collab-crdt-worker
          annotations:
            summary: "AC-06 silent-loss invariant violated — Sev-1"
            runbook: "microservices/sheets/runbooks/collab-conflict-resolution-crdt.md"

        - alert: SheetsFormulaEngineCorpusMismatch
          expr: increase(oya_sheets_formula_engine_corpus_mismatch_total[5m]) > 0
          for: 0m
          labels:
            severity: page
            severity_level: sev2
            service: oya-sheets-formula-engine-domain
          annotations:
            summary: "Formula-engine LibreOffice Calc reference corpus mismatch — Sev-2 data-integrity"
            runbook: "microservices/sheets/runbooks/formula-engine-rollback.md"

        - alert: SheetsRangeAclDriftDetected
          expr: oya_sheets_range_acl_drift_total > 0
          for: 0m
          labels:
            severity: page
            severity_level: sev1
            service: oya-sheets-sharing-acl-domain
          annotations:
            summary: "Per-range ACL drift detected — Sev-1 confidentiality"
            runbook: "microservices/sheets/runbooks/share-acl-drift.md"
{{- end }}

    - name: sheets-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: sheets-llm-capability-circuit-open
          expr: max(oya_sheets_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: sheets
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "sheets LLM/capability circuit-breaker tripped open"
        - alert: sheets-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_sheets_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: sheets
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "sheets capability retry-budget exhausted"

    - name: sheets-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: sheets-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_sheets_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: sheets
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "sheets tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: sheets-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: sheets-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"sheets-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: sheets
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sheets pod CPU saturation > 70% sustained 10m"
        - alert: sheets-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_sheets_responses_5xx_total[5m]))
            /
            sum(rate(oya_sheets_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: sheets
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sheets 5xx rate > 1% sustained 5m"
        - alert: sheets-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_sheets_responses_total[5m]))
              /
              sum(rate(oya_sheets_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: sheets
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sheets inbound RPS dropped > 90% vs prior hour"

    - name: sheets-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: sheets-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_sheets_request_success_total[1h]))
              /
              sum(rate(oya_sheets_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: sheets
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "sheets aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: sheets-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_sheets_request_success_total[6h]))
              /
              sum(rate(oya_sheets_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: sheets
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "sheets aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
