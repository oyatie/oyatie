# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cell-grid-rest
  namespace: sheets
  labels:
    app.kubernetes.io/name: oya-sheets-cell-grid-rest
    oyatie/microservice: sheets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oya-sheets-cell-grid-rest
  policyTypes: [Ingress, Egress]
  ingress:
    # Ingress from Istio gateway only.
    - from:
        - namespaceSelector:
            matchLabels:
              istio-injection: enabled
          podSelector:
            matchLabels:
              app: istio-ingressgateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
    # Cross-µservice SDK consumers (strict allowlist; LEAN-A2 enforced)
{{- range .Values.networkPolicy.egress }}
    - to:
        - namespaceSelector:
            matchLabels:
              oyatie/microservice: {{ regexReplaceAll "^([^.]+)\\..*$" .to "${1}" }}
      ports:
{{- range .ports }}
        - port: {{ . }}
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
