# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-sheets-formula-engine-correctness
  displayName: Sheets — Formula-engine correctness vs LibreOffice Calc reference corpus
  labels:
    microservice: sheets
    bounded_context: formula-engine
    sli_kind: correctness
    tier: external-facing
    plane: data
spec:
  service: oya-sheets-formula-engine-domain
  description: |
    Correctness SLI: formula-engine outputs MUST match LibreOffice Calc reference behaviour
    on the named test corpus per ADR-SHEETS-0002. Target is 100%. Any divergence is a
    Sev-2 (data-integrity regression).
  indicator:
    metadata:
      name: formula-engine-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_formula_engine_corpus_match_total[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(oya_sheets_formula_engine_corpus_eval_total[5m]))'
  objectives:
    - target: 1.0
      displayName: 100% of formula-engine corpus cases match LibreOffice Calc reference per ADR-SHEETS-0002
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: formula-engine-correctness-mismatch
      spec:
        description: Formula-engine corpus mismatch → Sev-2 page (data-integrity)
        notificationTargets:
          - target: grafana-oncall:sheets-sev2
        conditions:
          - kind: AlertCondition
            spec:
              op: gte
              threshold: 1
              lookbackWindow: 10m
              alertAfter: 0m
