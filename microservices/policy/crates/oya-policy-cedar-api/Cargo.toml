[package]
name = "oya-policy-cedar-api"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Cedar policy publish API boundary: REST control-plane edge (ADR-0090 amendment; axum control-plane WARN accepted) wiring validate + publish to POST /policies/{policy_id}/versions/{version} with idempotency ledger, error mapping, and OTel spans."

[dependencies]
oya-policy-cedar-domain = { path = "../oya-policy-cedar-domain" }

# REST control-plane edge (ADR-0090 amendment; axum for control-plane REST; WARN acceptable).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Router-level tests: drive axum via tower oneshot.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }

[lib]
name = "oya_policy_cedar_api"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
