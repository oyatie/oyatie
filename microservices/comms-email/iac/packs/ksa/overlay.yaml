# comms-email KSA sovereign pack overlay — ADR-0064 + ADR-0201 + IP-014.
pack: ksa
sovereign: true
allowed_providers: [postal]   # IP-014 forces Postal-only
default_provider: postal
regions: [me-south-1]
cross_region_allowed: false
dmarc:
  new_tenant_default: quarantine
  post_warmup_default: reject
data_residency:
  enforced: true
  allowed_processing_regions: [me-south-1]
