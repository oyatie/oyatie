# comms-email EU pack overlay — ADR-0064 + ADR-0201.
pack: eu
allowed_providers: [ses, postal, mailgun, smtp]
default_provider: ses
regions: [eu-central-1, eu-west-1]
cross_region_allowed: false   # GDPR Art. 44-50
dmarc:
  new_tenant_default: quarantine
  post_warmup_default: reject
data_residency:
  enforced: true
  allowed_processing_regions: [eu-central-1, eu-west-1]
