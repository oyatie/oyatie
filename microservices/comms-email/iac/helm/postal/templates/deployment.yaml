apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postal
  labels:
    app.kubernetes.io/name: oya-comms-email-postal
    app.kubernetes.io/instance: {{ .Release.Name }}
    oyatie.io/adr: "ADR-0201"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-comms-email-postal
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-comms-email-postal
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: OYA_DKIM_ENFORCED
              value: {{ .Values.deliverability.dkim.enforced | quote }}
            - name: OYA_SPF_ENFORCED
              value: {{ .Values.deliverability.spf.enforced | quote }}
            - name: OYA_DMARC_ENFORCED
              value: {{ .Values.deliverability.dmarc.enforced | quote }}
            - name: OYA_RATE_CEILING_PER_TENANT_PER_MIN
              value: {{ .Values.rateCeiling.perTenantPerMinute | quote }}
            - name: OYA_WEBHOOK_INGEST_URL
              value: {{ .Values.webhooks.ingestUrl | quote }}
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: web
              containerPort: 5000
          volumeMounts:
            - name: dkim-keys
              mountPath: {{ .Values.deliverability.dkim.bao.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dkim-keys
          emptyDir:
            medium: Memory
