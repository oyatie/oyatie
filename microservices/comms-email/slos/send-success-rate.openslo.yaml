apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-send-success-rate
  displayName: "comms-email · provider-accept success rate"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: reliability
spec:
  service: comms-email
  description: |
    Fraction of API send calls that result in provider
    acceptance. Excludes preflight-rejection (those are
    intentional rejects). Target: 99.9%.
  indicator:
    metadata:
      name: send_success_rate
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(comms_email_provider_accepted_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(comms_email_provider_accepted_total[5m]))
                + sum(rate(comms_email_provider_error_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≥ 99.9%"
      target: 0.999
