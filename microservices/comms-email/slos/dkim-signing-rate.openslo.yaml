apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-dkim-signing-rate
  displayName: "comms-email · DKIM signed send rate"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: security
spec:
  service: comms-email
  description: |
    Fraction of provider-accepted sends that were DKIM signed.
    Target: 99.99%. ADR-0201 requires DKIM signing on every send.
  indicator:
    metadata:
      name: dkim_signing_rate
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: sum(rate(comms_email_provider_accepted_total{dkim_signed="true"}[5m]))
        total:
          metricSource:
            spec:
              query: sum(rate(comms_email_provider_accepted_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≥ 99.99%"
      target: 0.9999
