asyncapi: 3.1.0
info:
  title: comms-email event surfaces
  version: 0.1.0
  description: |
    ADR-0201 webhook delivery events normalized into ADR-0145
    audit chain on ADR-0166-versioned schemas.

defaultContentType: application/cloudevents+json

servers:
  audit-chain:
    host: audit-chain.oya.io
    protocol: kafka
    description: ADR-0145 audit chain federated topic.

channels:
  comms-email.delivery-event:
    address: oya/comms-email/delivery-event/v1
    messages:
      DeliveryEvent:
        $ref: "#/components/messages/DeliveryEvent"

  comms-email.bounce-classified:
    address: oya/comms-email/bounce-classified/v1
    messages:
      BounceClassified:
        $ref: "#/components/messages/BounceClassified"

  comms-email.suppression-inserted:
    address: oya/comms-email/suppression-inserted/v1
    messages:
      SuppressionInserted:
        $ref: "#/components/messages/SuppressionInserted"

  comms-email.dkim-rotated:
    address: oya/comms-email/dkim-rotated/v1
    messages:
      DkimRotated:
        $ref: "#/components/messages/DkimRotated"

  comms-email.from-domain-state-changed:
    address: oya/comms-email/from-domain-state-changed/v1
    messages:
      FromDomainStateChanged:
        $ref: "#/components/messages/FromDomainStateChanged"

operations:
  send-delivery-event:
    action: send
    channel:
      $ref: "#/channels/comms-email.delivery-event"

components:
  messages:
    DeliveryEvent:
      name: DeliveryEvent
      title: Normalized provider delivery event
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/DeliveryEventPayload"

    BounceClassified:
      name: BounceClassified
      payload:
        $ref: "#/components/schemas/BounceClassifiedPayload"

    SuppressionInserted:
      name: SuppressionInserted
      payload:
        $ref: "#/components/schemas/SuppressionInsertedPayload"

    DkimRotated:
      name: DkimRotated
      payload:
        $ref: "#/components/schemas/DkimRotatedPayload"

    FromDomainStateChanged:
      name: FromDomainStateChanged
      payload:
        $ref: "#/components/schemas/FromDomainStateChangedPayload"

  schemas:
    DeliveryEventPayload:
      type: object
      required: [provider, provider_message_id, kind, at_epoch_ms, tenant_id]
      properties:
        provider:
          type: string
          enum: [ses, postal, mailgun, smtp]
        provider_message_id:
          type: string
        kind:
          type: string
          enum: [sent, delivered, opened, clicked, bounced, complained, suppressed]
        at_epoch_ms:
          type: integer
        tenant_id:
          type: string
        recipient:
          type: string
          format: email
        processing_region:
          type: string

    BounceClassifiedPayload:
      type: object
      required: [provider_message_id, classification]
      properties:
        provider_message_id:
          type: string
        classification:
          type: string
          enum: [hard, soft]
        smtp_code:
          type: string

    SuppressionInsertedPayload:
      type: object
      required: [tenant_id, recipient, reason]
      properties:
        tenant_id:
          type: string
        recipient:
          type: string
          format: email
        reason:
          type: string
          enum: [HardBounce, Complained, OperatorManual, RegulatoryOptOut, GdprErasure]

    DkimRotatedPayload:
      type: object
      required: [tenant_id, from_domain, old_selector, new_selector]
      properties:
        tenant_id:
          type: string
        from_domain:
          type: string
        old_selector:
          type: string
        new_selector:
          type: string

    FromDomainStateChangedPayload:
      type: object
      required: [tenant_id, from_domain, old_state, new_state]
      properties:
        tenant_id:
          type: string
        from_domain:
          type: string
        old_state:
          type: string
        new_state:
          type: string
