# ops-dashboard-control-center — Cilium Network Policy
# Implements L4 default-deny with explicit allowlist per ADR-0148 (Cilium Ambient)
# Binding ADRs: ADR-0148, ADR-0244 (tenant isolation), ADR-0295 (SPIFFE)
# Cell tier: Tier 1 control-plane
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ops-dashboard-control-center-l4-policy
  namespace: ops-dashboard
  annotations:
    binding_adr: "ADR-0148,ADR-0244,ADR-0295"
spec:
  endpointSelector:
    matchLabels:
      app: ops-dashboard-control-center
  ingress:
    # Allow ingress from Istio gateway (north-south; operators)
    - fromEndpoints:
        - matchLabels:
            app: istio-ingressgateway
            namespace: istio-system
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # Allow ingress from Prometheus scrape (metrics)
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            namespace: observability
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # Allow east-west from other ops-dashboard BCs
    - fromEndpoints:
        - matchLabels:
            microservice: ops-dashboard-control-center
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Allow Foundry pipeline reads (CI scope)
    - fromEndpoints:
        - matchLabels:
            app: governance-pipeline
            namespace: foundry
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    # Allow egress to observability µservice (SLO reads)
    - toEndpoints:
        - matchLabels:
            microservice: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Allow egress to tenancy µservice
    - toEndpoints:
        - matchLabels:
            microservice: tenancy
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Allow egress to policy-engine (Cedar eval fallback)
    - toEndpoints:
        - matchLabels:
            microservice: policy-engine
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Allow egress to OpenBao (credential sidecar)
    - toEndpoints:
        - matchLabels:
            app: openbao
            namespace: secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # Allow egress to Kafka (audit outbox)
    - toEndpoints:
        - matchLabels:
            app: kafka
            namespace: messaging
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # Allow egress to SPIFFE SPIRE agent
    - toEndpoints:
        - matchLabels:
            app: spire-agent
            namespace: spire
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  # Sovereign-cell L4 hard-stop: EU operators cannot egress to us-east-1 cell
  # Enforced via separate CiliumClusterwideNetworkPolicy per pack overlay
  egressDeny:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "1-65535"
              protocol: TCP
