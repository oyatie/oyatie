apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-ops-control-center-command-availability
spec:
  service: ops-dashboard-control-center
  objective:
    target: "0.999"
  indicator:
    ratioMetric:
      good:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_requests_total{status!~"5.."}[5m])) / sum(rate(oya_ops_control_center_requests_total[5m]))'
      total:
        metricSource:
          type: prometheus
          spec:
            query: 'sum(rate(oya_ops_control_center_requests_total[5m]))'
