# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: docs-collab-cursor-sync-latency
  displayName: "docs: collab cursor-sync p99 (aligns with workflow-studio)"
  labels:
    microservice: docs
    bc: collab-crdt
    sli_class: latency
    tier: hero-product
    owner_team: axis-docs
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Collab cursor-sync p99 latency SLO. A cursor-sync hop (presence broadcast
    via Valkey to all subscribers in the same (tenant, doc) lease) completes
    in ≤ 150ms. Mirrors workflow-studio §"Performance" cursor sync budget
    per ADR-DOCS-0001 + ADR-WS-0001 cross-µservice CRDT alignment.
  service: docs
  indicator:
    metadata: {name: docs-cursor-sync-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_docs_collab_cursor_sync_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.15
      displayName: "30d rolling p99 ≤ 150ms"
  alertPolicies:
    - alertPolicyRef: docs-cursor-sync-fast-burn-1h-14x
    - alertPolicyRef: docs-cursor-sync-slow-burn-6h-6x
