# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oya-docs
  namespace: docs
  annotations:
    openbao.io/role: oya-docs
    spiffe.io/identity: spiffe://oyatie.dev/ns/docs/sa/oya-docs
  labels:
    oyatie.dev/microservice: docs
