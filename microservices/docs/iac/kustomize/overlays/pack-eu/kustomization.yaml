# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# Kustomize overlay — pack-eu (GDPR + EU AI Act + eIDAS PAdES).
# Per ADR-0131 + ADR-0133 (11-pack-overlay program).
# EU AI Act T1/T2 HR-context REFUSED at Cedar layer per ADR-DOCS-0005.
# eIDAS PAdES B-LT signed PDF export available per legal-evidence tenants.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docs

resources:
  - ../../base

commonLabels:
  oyatie.dev/pack: eu
  oyatie.dev/data-residency: eu-frankfurt-1

configMapGenerator:
  - name: oya-docs-pack-config
    namespace: docs
    literals:
      - PACK_REGION=eu
      - DATA_RESIDENCY=eu-frankfurt-1
      - DEFAULT_LOCALE=en-EU
      - GDPR_CHAPTER_V_SCC_REQUIRED=true
      - EU_AI_ACT_ANNEX_III_3_HR_CONTEXT=refused_at_cedar_until_per_tenant_conformity_assessment
      - EIDAS_PADES_BLT_PDF_EXPORT=enabled
      - NIS2_INCIDENT_REPORTING_TIMELINES=24h-72h-1mo

patches:
  - target: {kind: Deployment, name: oya-docs-document-store-app}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: eu
  - target: {kind: HorizontalPodAutoscaler, name: oya-docs-document-store-app-hpa}
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 80
