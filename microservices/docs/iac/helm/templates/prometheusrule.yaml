{{/*
PrometheusRule — fast-burn + slow-burn alert rules per SLO. Aligns with
slos/*.openslo.yaml alertPolicyRef bindings.
*/}}
{{- if $.Values.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-docs-slo-burn-rules
  namespace: docs
  labels:
    microservice: docs
    release: kube-prometheus-stack
spec:
  groups:
    - name: docs-doc-open-latency
      interval: 30s
      rules:
        - alert: docs-doc-open-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_docs_document_open_seconds_bucket{le="0.3",cache_kind="cold"}[1h]))
              /
              sum(rate(oya_docs_document_open_seconds_count{cache_kind="cold"}[1h]))
            )) > 14 * (1 - 0.99)
          for: 2m
          labels: {severity: page, slo: doc-open-latency, burn: fast-1h-14x}
          annotations:
            summary: "Doc-open latency burning 14x over 1h"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/editor-session-storm-throttle.md"

    - name: docs-crdt-no-silent-loss
      interval: 30s
      rules:
        - alert: docs-crdt-silent-loss-any-page
          expr: |
            sum(rate(oya_docs_collab_silent_loss_attempt_total[5m])) > 0
          for: 1m
          labels: {severity: page, slo: crdt-merge-no-silent-loss, slo_target: 1.0}
          annotations:
            summary: "CRDT silent loss DETECTED — Sev-1; PRD AC-06 broken"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/collab-conflict-resolution.md"

    - name: docs-per-block-acl-correctness
      interval: 30s
      rules:
        - alert: docs-per-block-acl-violation-page
          expr: |
            sum(rate(oya_docs_per_block_acl_violation_total[5m])) > 0
          for: 1m
          labels: {severity: page, slo: share-acl-enforcement-correctness, slo_target: 1.0}
          annotations:
            summary: "Per-block ACL violation DETECTED — Sev-1; PRD AC-04 broken"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/share-acl-drift.md"

    - name: docs-export-pipeline
      interval: 30s
      rules:
        - alert: docs-export-pdf-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_docs_export_pdf_seconds_bucket{le="3"}[1h]))
              /
              sum(rate(oya_docs_export_pdf_seconds_count[1h]))
            )) > 14 * (1 - 0.99)
          for: 2m
          labels: {severity: page, slo: export-pdf-latency, burn: fast-1h-14x}
          annotations:
            summary: "PDF export latency burning 14x over 1h"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/export-pipeline-failure-pandoc-rollback.md"
        - alert: docs-gvisor-seccomp-violation-page
          expr: |
            sum(rate(oya_docs_gvisor_seccomp_violation_total[5m])) > 0
          for: 1m
          labels: {severity: page, slo: export-sandbox-conformance}
          annotations:
            summary: "gVisor seccomp violation DETECTED — Sev-1; possible sandbox escape attempt"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/export-pipeline-failure-pandoc-rollback.md"

    - name: docs-collab-cursor-sync
      interval: 30s
      rules:
        - alert: docs-cursor-sync-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_docs_collab_cursor_sync_seconds_bucket{le="0.15"}[1h]))
              /
              sum(rate(oya_docs_collab_cursor_sync_seconds_count[1h]))
            )) > 14 * (1 - 0.99)
          for: 2m
          labels: {severity: page, slo: collab-cursor-sync-latency, burn: fast-1h-14x}
          annotations:
            summary: "Collab cursor-sync latency burning 14x over 1h"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/collab-conflict-resolution.md"

    - name: docs-ooxml-import-fidelity
      interval: 5m
      rules:
        - alert: docs-ooxml-fidelity-below-threshold
          expr: |
            avg_over_time(oya_docs_ooxml_import_fidelity_ratio[1h]) < 0.95
          for: 30m
          labels: {severity: ticket, slo: ooxml-import-fidelity}
          annotations:
            summary: "OOXML import fidelity below 95% threshold"
            runbook_url: "https://oyatie.dev/microservices/docs/runbooks/export-pipeline-failure-pandoc-rollback.md"
{{- end }}

    - name: docs-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: docs-llm-capability-circuit-open
          expr: max(oya_docs_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: docs
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "docs LLM/capability circuit-breaker tripped open"
        - alert: docs-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_docs_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: docs
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "docs capability retry-budget exhausted"

    - name: docs-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: docs-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_docs_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: docs
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "docs tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: docs-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: docs-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"docs-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: docs
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "docs pod CPU saturation > 70% sustained 10m"
        - alert: docs-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_docs_responses_5xx_total[5m]))
            /
            sum(rate(oya_docs_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: docs
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "docs 5xx rate > 1% sustained 5m"
        - alert: docs-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_docs_responses_total[5m]))
              /
              sum(rate(oya_docs_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: docs
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "docs inbound RPS dropped > 90% vs prior hour"

    - name: docs-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: docs-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_docs_request_success_total[1h]))
              /
              sum(rate(oya_docs_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: docs
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "docs aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: docs-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_docs_request_success_total[6h]))
              /
              sum(rate(oya_docs_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: docs
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "docs aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
