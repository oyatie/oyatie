# Marketplace category-agents listing surface — extends DealSetCommand envelope (ADR-0249 KS#11 + ADR-0308 EU AI Act)
openapi: 3.2.0
info:
  title: Marketplace Agents Category API
  version: 1.0.0
  description: Per-ADR-0249 agent-category listing surface for autonomous AI agents + agent templates.
paths:
  /marketplace/categories/agents/listings:
    post:
      operationId: AgentListingPublish
      x-cedar-action: marketplace.category-agents.listing.publish
      x-eu-ai-act-classification-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentListingPublishCommand'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '422':
          description: EU AI Act risk class == unacceptable (FORBID)
  /marketplace/categories/agents/listings/{listing_id}/entitlement:
    post:
      operationId: AgentEntitlementRegister
      x-cedar-action: marketplace.category-agents.entitlement.register
      parameters:
        - name: listing_id
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: Agent registered with intelligence µservice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEntitlement'
components:
  schemas:
    AgentListingPublishCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, audit_chain_ref, tenant_class,
                 revenue_share_cohort_id, title, description, agent_class, tool_access_class,
                 autonomy_level, eu_ai_act_risk_class, system_prompt_signature,
                 tool_manifest_signature, sbom_ref, revenue_share_rate_basis_points,
                 pricing_model, kyc_artifact_ref, safety_card_ref]
      properties:
        tenant_id: { type: string, format: ulid }
        sub_scope_path: { type: string }
        principal_id: { type: string }
        audit_chain_ref: { type: string }
        tenant_class: { type: string, enum: [paid] }
        revenue_share_cohort_id: { type: string }
        title: { type: string, minLength: 4, maxLength: 128 }
        description: { type: string, maxLength: 65535 }
        agent_class: { type: string, enum: [task-runner, advisor, autonomous-loop, multi-agent-orchestrator, browser-driver] }
        tool_access_class: { type: string, enum: [read-only, sandboxed, full-tool, code-exec, network-write] }
        autonomy_level: { type: string, enum: [supervised, semi-autonomous, fully-autonomous] }
        eu_ai_act_risk_class:
          type: string
          enum: [minimal, limited, high]   # unacceptable excluded (publish forbidden)
        system_prompt_signature: { type: string }
        tool_manifest_signature: { type: string }
        sbom_ref: { type: string }
        revenue_share_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        pricing_model: { type: string, enum: [free, one_time, subscription, usage_based, tiered, private_offer] }
        kyc_artifact_ref: { type: string }
        safety_card_ref: { type: string }
        capability_card_ref: { type: string }
        dpia_ref: { type: string }
        human_oversight_attestation_ref:
          type: string
          description: 'Required when eu_ai_act_risk_class == high'
    AgentEntitlement:
      type: object
      required: [listing_id, intelligence_agent_id, registration_signature, audit_chain_seal_id]
      properties:
        listing_id: { type: string, format: ulid }
        intelligence_agent_id: { type: string }
        registration_signature: { type: string }
        audit_chain_seal_id: { type: string }
    DealSetReceipt:
      type: object
      properties:
        listing_id: { type: string }
        decision: { type: string }
        evidence_ref: { type: string }
        state: { type: string }
