# Marketplace category-models listing surface — extends DealSetCommand envelope (ADR-0249 KS#11 + ADR-0308 EU AI Act)
openapi: 3.2.0
info:
  title: Marketplace Models Category API
  version: 1.0.0
  description: Per-ADR-0249 model-category listing surface for ML/LLM model registry + signed artifacts.
paths:
  /marketplace/categories/models/listings:
    post:
      operationId: ModelListingPublish
      x-cedar-action: marketplace.category-models.listing.publish
      x-eu-ai-act-classification-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelListingPublishCommand'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
  /marketplace/categories/models/listings/{listing_id}/entitlement:
    post:
      operationId: ModelEntitlementFetch
      x-cedar-action: marketplace.category-models.entitlement.fetch
      parameters:
        - name: listing_id
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: Model artifact fetch granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEntitlement'
components:
  schemas:
    ModelListingPublishCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, audit_chain_ref, tenant_class,
                 revenue_share_cohort_id, title, description, model_class, model_format,
                 model_size_band, training_data_provenance, eu_ai_act_risk_class,
                 artifact_signature, model_card_ref, evals_ref, sbom_ref,
                 revenue_share_rate_basis_points, pricing_model, kyc_artifact_ref, license_ref]
      properties:
        tenant_id: { type: string, format: ulid }
        sub_scope_path: { type: string }
        principal_id: { type: string }
        audit_chain_ref: { type: string }
        tenant_class: { type: string, enum: [paid] }
        revenue_share_cohort_id: { type: string }
        title: { type: string, minLength: 4, maxLength: 128 }
        description: { type: string, maxLength: 65535 }
        model_class: { type: string, enum: [llm, vlm, embedding, asr, tts, vision, tabular, time-series, recsys] }
        model_format: { type: string, enum: [gguf, safetensors, onnx, tensorrt, openvino, mlx, coreml] }
        model_size_band: { type: string, enum: [tiny-under-1b, small-1b-7b, mid-7b-30b, large-30b-200b, frontier-200b+] }
        training_data_provenance: { type: string, enum: [public-cc, licensed, synthetic, mixed, undisclosed] }
        eu_ai_act_risk_class: { type: string, enum: [minimal, limited, high, gpai-systemic-risk] }
        artifact_signature: { type: string, description: 'cosign signature over model artifact digest' }
        model_card_ref: { type: string }
        evals_ref: { type: string }
        sbom_ref: { type: string }
        revenue_share_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        pricing_model: { type: string, enum: [free, one_time, subscription, usage_based, tiered, private_offer, contract] }
        kyc_artifact_ref: { type: string }
        license_ref: { type: string }
        fine_tune_lineage_ref: { type: string }
        quantization_method: { type: string }
        data_governance_ref: { type: string }
    ModelEntitlement:
      type: object
      required: [listing_id, signed_artifact_url, signature, expires_at, audit_chain_seal_id]
      properties:
        listing_id: { type: string, format: ulid }
        signed_artifact_url: { type: string, format: uri }
        signature: { type: string }
        expires_at: { type: string, format: date-time }
        audit_chain_seal_id: { type: string }
    DealSetReceipt:
      type: object
      properties:
        listing_id: { type: string }
        decision: { type: string }
        evidence_ref: { type: string }
        state: { type: string }
