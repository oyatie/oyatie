openapi: 3.2.0
info:
  title: Marketplace API
  version: 1.0.0
  summary: Tenant-scoped DealSet API for universal deal-settlement substrate
  x-related-adrs:
    - ADR-0105
    - ADR-0131
    - ADR-0243
    - ADR-0244
    - ADR-0263
    - ADR-0249
    - ADR-0314
  x-naming-justifications:
    bnf_v4: "service.action.resource grammar uses marketplace.DealSet.<action>"
    layer_enum: "13-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, graphql, worker, cli, sdk, api"
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.oyatie.example/marketplace/v1
    description: Production tenant-scoped endpoint
paths:
  /marketplace/deal-sets:
    post:
      operationId: marketplace__marketplace_deal_sets_post
      summary: create DealSet envelopes
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/deal-sets/{deal_set_id}/accept:
    post:
      operationId: marketplace__marketplace_deal_sets_deal_set_id_accept_post
      summary: accept priced commercial terms
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/deal-sets/{deal_set_id}/settle:
    post:
      operationId: marketplace__marketplace_deal_sets_deal_set_id_settle_post
      summary: authorize settlement transition
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/listings:
    post:
      operationId: marketplace__marketplace_listings_post
      summary: publish seller listings
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/escrow/holds:
    post:
      operationId: marketplace__marketplace_escrow_holds_post
      summary: reserve escrow with payments
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/disputes:
    post:
      operationId: marketplace__marketplace_disputes_post
      summary: open mediation case
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
  /marketplace/revenue-shares:
    post:
      operationId: marketplace__marketplace_revenue_shares_post
      summary: bind developer or partner share
      tags: [marketplace]
      x-cedar-action: marketplace.DealSet.mutate
      x-audit-event: MarketplaceDealOffered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealSetCommand'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealSetReceipt'
        '403':
          description: Cedar denied the tenant-scoped action
        '409':
          description: Idempotency conflict or state conflict
components:
  schemas:
    DealSetCommand:
      type: object
      required: [tenant_id, sub_scope_path, principal_id, idempotency_key, action, resource]
      properties:
        tenant_id:
          type: string
          pattern: '^tenant_[a-z0-9_]+$'
          examples: [tenant_acme]
        sub_scope_path:
          type: string
          examples: [workplace.hr.offers]
        principal_id:
          type: string
          examples: [principal_01h]
        idempotency_key:
          type: string
          examples: [idem_01h_marketplace]
        action:
          type: string
          examples: [marketplace.DealSet.mutate]
        resource:
          type: object
          additionalProperties: true
    DealSetReceipt:
      type: object
      required: [accepted, audit_chain_ref, state]
      properties:
        accepted:
          type: boolean
        audit_chain_ref:
          type: string
        state:
          type: string
          enum: [accepted, denied, deferred, replay_required, compensated]
