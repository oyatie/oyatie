apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-marketplace-revenue-share-accuracy
  displayName: Marketplace Revenue Share Accuracy
  labels:
    service: marketplace
    adr: ADR-0314
spec:
  description: Marketplace SLO for revenue-share-accuracy using ledger=revenue-share
  service: marketplace
  indicator:
    metadata:
      name: oya-marketplace-revenue-share-accuracy-sli
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_marketplace_mediation_open_success_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_marketplace_mediation_open_total[5m]))
  objectives:
    - displayName: Revenue Share Accuracy
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
naming_justifications:
  bnf_v4: "marketplace.slo.revenue-share-accuracy"
  layer_enum: "13-layer-enum: kernel, domain, usecase, app, adapter, infrastructure, rest, grpc, graphql, worker, cli, sdk, api"
