[package]
name = "oya-plant-maintenance-work-order-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Plant Maintenance work order application surface."

[package.metadata.oya]
microservice = "plant-maintenance"
title = "Plant Maintenance"
bounded_context = "work-order-maintenance"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-maintenance + council-product"
data_classification = "tenant-scoped maintenance records with audit evidence"
criticality_class = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/plant-maintenance-v1.proto"

[lib]
name = "oya_plant_maintenance_work_order_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-plant-maintenance-work-order"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
