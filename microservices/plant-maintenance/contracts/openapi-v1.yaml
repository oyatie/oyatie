openapi: 3.2.0
info:
  title: Plant Maintenance API
  version: 1.0.0
  summary: SAP PM parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/plant-maintenance
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
