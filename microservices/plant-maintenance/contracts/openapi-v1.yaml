  - "Oracle Fusion Maintenance"
  - "Workday Extend asset-maintenance workflow counterpart"
  - "NetSuite Fixed Assets and Field Service counterpart"
  - "Microsoft Dynamics 365 Asset Management"
paths:
  /v1/plant-maintenance/equipment-master:
    post:
      summary: Create or amend Plant Maintenance equipment-master
      operationId: plant_maintenance_equipment_master_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentMasterCommand"
      responses:
        "202":
          description: Accepted with signed audit event
