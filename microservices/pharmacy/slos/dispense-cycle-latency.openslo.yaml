apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-dispense-cycle-latency
  displayName: Pharmacy dispense cycle latency
  labels:
    microservice: pharmacy
    bounded_context: eprescribe
spec:
  service: pharmacy
  description: Verification-to-label-print dispense cycle p99 ≤ 2 s.
  indicator:
    metadata:
      name: oya-pharmacy-dispense-cycle-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dispense_duration_seconds_bucket{le="2.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_dispense_duration_seconds_count[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% under 2 s
      target: 0.99
