apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-catalog-read-availability
  displayName: Pharmacy catalog read availability
  labels:
    microservice: pharmacy
    bounded_context: medication-catalog
spec:
  service: pharmacy
  description: Catalog read availability ≥ 99.95%.
  indicator:
    metadata:
      name: oya-pharmacy-catalog-read-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_catalog_read_total{outcome="ok"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_catalog_read_total[5m]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.95% success
      target: 0.9995
