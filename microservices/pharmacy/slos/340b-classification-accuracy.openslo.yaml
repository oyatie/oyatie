apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-pharmacy-340b-classification-accuracy
  displayName: Pharmacy 340B classification accuracy
  labels:
    microservice: pharmacy
    bounded_context: reimbursement
spec:
  service: pharmacy
  description: 340B mixed-use classification accuracy ≥ 99.99% (audit-sample-driven).
  indicator:
    metadata:
      name: oya-pharmacy-340b-classification-accuracy
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_b340_classification_total{outcome="correct"}[1h]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_pharmacy_b340_classification_total[1h]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.99% correct
      target: 0.9999
