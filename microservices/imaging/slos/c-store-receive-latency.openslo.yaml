apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-c-store-receive-latency
  namespace: imaging
  displayName: DICOM C-STORE Receive Latency
  labels:
    microservice: imaging
    bounded_context: DICOMSubstrate
    binding_adr: ADR-0328
spec:
  description: |
    Time from DICOM C-STORE-REQ accepted to PACS index write committed +
    audit-chain entry emitted. Preserves the 10,250 inst/min/pod throughput
    floor inherited from healthcare-integration.
  service: imaging
  indicator:
    metadata:
      name: c-store-receive-latency-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_c_store_receive_seconds_bucket{le="0.2",bounded_context="DICOMSubstrate"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_c_store_receive_seconds_count{bounded_context="DICOMSubstrate"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% of C-STORE within 200ms
      target: 0.95
    - displayName: 99% of C-STORE within 500ms
      target: 0.99
    - displayName: 99.9% of C-STORE within 1s
      target: 0.999
