apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-voice-partial-transcript-latency
  namespace: imaging
  displayName: Voice Recognition Partial Transcript Latency
  labels:
    microservice: imaging
    bounded_context: VoiceRecognition
spec:
  description: |
    Time from voice audio frame received to partial transcript emitted.
    Target p95 < 250ms per FR-RAD-007.
  service: imaging
  indicator:
    metadata:
      name: voice-partial-transcript-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_voice_partial_transcript_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_voice_partial_transcript_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 250ms
      target: 0.95
    - displayName: 99% within 600ms
      target: 0.99
