apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-availability
  namespace: imaging
  displayName: Imaging Surface Availability
  labels:
    microservice: imaging
    bounded_context: (cross-cutting)
spec:
  description: |
    Per-surface availability per PRD §6.2. C-STORE + DICOMweb 99.99%; MWL +
    worklist 99.95%; AI marketplace 99.9%; patient portal 99.5%; peer review
    99.0%. This SLO measures the union 99.95% target.
  service: imaging
  indicator:
    metadata:
      name: imaging-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_request_total{status!~"5.."}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_request_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99.95% overall
      target: 0.9995
    - displayName: 99.99% C-STORE (label-filtered)
      target: 0.9999
