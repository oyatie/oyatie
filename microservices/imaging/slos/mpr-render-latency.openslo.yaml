apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-mpr-render-latency
  namespace: imaging
  displayName: MPR / MIP Server-Side Render Latency
  labels:
    microservice: imaging
    bounded_context: 3DReconstruction
spec:
  description: |
    Time from MPR/MIP render request enqueued to first reformatted frame sent
    to viewer. Target p95 < 2s per FR-RAD-013.
  service: imaging
  indicator:
    metadata:
      name: mpr-render-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_mpr_render_seconds_bucket{le="2.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_mpr_render_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 2s
      target: 0.95
    - displayName: 99% within 5s
      target: 0.99
