apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-critical-result-notify-latency
  namespace: imaging
  displayName: Critical Result Notification Latency
  labels:
    microservice: imaging
    bounded_context: CriticalResults
spec:
  description: |
    Time from critical-finding code asserted in structured report to
    notification delivered to ordering clinician. Target p99 < 30s per
    FR-RAD-010.
  service: imaging
  indicator:
    metadata:
      name: critical-result-notify-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_critical_result_notify_seconds_bucket{le="30"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_critical_result_notify_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% within 30s
      target: 0.99
    - displayName: 99.9% within 90s
      target: 0.999
