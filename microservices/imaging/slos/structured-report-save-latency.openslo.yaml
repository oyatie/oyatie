apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-structured-report-save-latency
  namespace: imaging
  displayName: Structured Report Save Latency
  labels:
    microservice: imaging
    bounded_context: StructuredReport
spec:
  description: |
    Time from save request to durable commit + FHIR DiagnosticReport emission.
    Target p95 < 800ms per FR-RAD-008.
  service: imaging
  indicator:
    metadata:
      name: structured-report-save-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_structured_report_save_seconds_bucket{le="0.8"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_structured_report_save_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 800ms
      target: 0.95
    - displayName: 99% within 2s
      target: 0.99
