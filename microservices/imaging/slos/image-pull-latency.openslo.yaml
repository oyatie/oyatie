apiVersion: openslo/v1
kind: SLO
metadata:
  name: imaging-image-pull-latency
  namespace: imaging
  displayName: DICOMweb WADO-RS Image Pull Latency
  labels:
    microservice: imaging
    bounded_context: DICOMweb
    binding_adr: ADR-0253
spec:
  description: |
    Time from WADO-RS request accepted to first byte sent to the viewer.
    Target: p95 < 1 second per FR-RAD-013 / PRD §6.1.
  service: imaging
  indicator:
    metadata:
      name: wado-rs-image-pull-latency-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_wado_rs_ttfb_seconds_bucket{le="1.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(imaging_wado_rs_ttfb_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 1s
      target: 0.95
    - displayName: 99% within 3s
      target: 0.99
