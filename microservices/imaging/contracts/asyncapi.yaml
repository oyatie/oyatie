asyncapi: 3.1.0
info:
  title: Oyatie Imaging — Event Mesh
  version: 0.1.0-wave-15m-g
  description: |
    AsyncAPI 3.1.0 event definitions for the imaging µservice.

    Every event is tenant-scoped (ADR-0244) and Cedar-gated at the producer +
    consumer boundary (ADR-0243). Topics live on the oyatie event mesh.

    Authority: split from `diagnostics` per ADR-0132 + user directive 2026-05-21.
  contact:
    name: axis-imaging
    email: axis-imaging@oyatie.com
defaultContentType: application/cloudevents+json
servers:
  oyatie-event-mesh:
    host: events.oyatie.com
    protocol: kafka-tls
    description: |
      Tenant-scoped event mesh; partition key is `tenant_id`. Cell-aware
      routing per ADR-0248. PHI events are encrypted with per-tenant envelope
      keys at rest.
channels:
  imaging.study.received:
    address: imaging.study.received
    description: Fired when a study lands via DIMSE C-STORE or DICOMweb STOW-RS
    messages:
      receivedMessage:
        $ref: '#/components/messages/ImagingStudyReceived'
  imaging.study.acquired:
    address: imaging.study.acquired
    description: Fired when MPPS COMPLETED state is observed for a modality study
    messages:
      acquiredMessage:
        $ref: '#/components/messages/ImagingStudyAcquired'
  imaging.study.read:
    address: imaging.study.read
    description: Fired when a radiologist opens a study in the reading-room
    messages:
      readMessage:
        $ref: '#/components/messages/ImagingStudyRead'
  imaging.report.signed:
    address: imaging.report.signed
    description: Fired when a structured report is signed
    messages:
      reportSignedMessage:
        $ref: '#/components/messages/ImagingReportSigned'
  imaging.critical-result.communicated:
    address: imaging.critical-result.communicated
    description: Fired at each step of the critical-result closed-loop cascade
    messages:
      criticalResultMessage:
        $ref: '#/components/messages/CriticalResultCommunicated'
  imaging.peer-review.completed:
    address: imaging.peer-review.completed
    description: Fired when a peer review is submitted
    messages:
      peerReviewMessage:
        $ref: '#/components/messages/PeerReviewCompleted'
  imaging.ai.inference-dispatched:
    address: imaging.ai.inference-dispatched
    description: Fired when an AI inference is dispatched to a vendor
    messages:
      aiDispatchMessage:
        $ref: '#/components/messages/AiInferenceDispatched'
  imaging.ai.inference-result:
    address: imaging.ai.inference-result
    description: Fired when an AI vendor returns results
    messages:
      aiResultMessage:
        $ref: '#/components/messages/AiInferenceResult'
  imaging.ai.drift-detected:
    address: imaging.ai.drift-detected
    description: Fired when AI vendor drift exceeds threshold
    messages:
      aiDriftMessage:
        $ref: '#/components/messages/AiDriftDetected'
  imaging.dose.deviation-detected:
    address: imaging.dose.deviation-detected
    description: Fired when per-protocol dose exceeds 1.25x target
    messages:
      doseDeviationMessage:
        $ref: '#/components/messages/DoseDeviation'
  imaging.mammography.recall-issued:
    address: imaging.mammography.recall-issued
    description: Fired when a mammography screening recall is issued
    messages:
      mammographyRecallMessage:
        $ref: '#/components/messages/MammographyRecallIssued'
  imaging.vna.federation-pulled:
    address: imaging.vna.federation-pulled
    description: Fired when a cross-VNA pull completes
    messages:
      vnaPullMessage:
        $ref: '#/components/messages/VnaFederationPulled'
  imaging.patient-portal.access-granted:
    address: imaging.patient-portal.access-granted
    description: Fired when a patient-portal access token is issued
    messages:
      portalAccessMessage:
        $ref: '#/components/messages/PatientPortalAccessGranted'
  imaging.mpps.state-changed:
    address: imaging.mpps.state-changed
    description: Fired on MPPS IN_PROGRESS / DISCONTINUED / COMPLETED transitions
    messages:
      mppsMessage:
        $ref: '#/components/messages/MppsStateChanged'
  imaging.hanging-protocol.applied:
    address: imaging.hanging-protocol.applied
    description: Fired when a hanging protocol is matched + applied
    messages:
      hangingProtocolMessage:
        $ref: '#/components/messages/HangingProtocolApplied'
operations:
  publishStudyReceived:
    action: send
    channel: { $ref: '#/channels/imaging.study.received' }
  publishStudyAcquired:
    action: send
    channel: { $ref: '#/channels/imaging.study.acquired' }
  publishStudyRead:
    action: send
    channel: { $ref: '#/channels/imaging.study.read' }
  publishReportSigned:
    action: send
    channel: { $ref: '#/channels/imaging.report.signed' }
  publishCriticalResultCommunicated:
    action: send
    channel: { $ref: '#/channels/imaging.critical-result.communicated' }
  publishPeerReviewCompleted:
    action: send
    channel: { $ref: '#/channels/imaging.peer-review.completed' }
  publishAiDispatched:
    action: send
    channel: { $ref: '#/channels/imaging.ai.inference-dispatched' }
  publishAiResult:
    action: send
    channel: { $ref: '#/channels/imaging.ai.inference-result' }
  publishAiDrift:
    action: send
    channel: { $ref: '#/channels/imaging.ai.drift-detected' }
  publishDoseDeviation:
    action: send
    channel: { $ref: '#/channels/imaging.dose.deviation-detected' }
  publishMammographyRecall:
    action: send
    channel: { $ref: '#/channels/imaging.mammography.recall-issued' }
  publishVnaPull:
    action: send
    channel: { $ref: '#/channels/imaging.vna.federation-pulled' }
  publishPortalAccess:
    action: send
    channel: { $ref: '#/channels/imaging.patient-portal.access-granted' }
  publishMppsStateChanged:
    action: send
    channel: { $ref: '#/channels/imaging.mpps.state-changed' }
  publishHangingProtocolApplied:
    action: send
    channel: { $ref: '#/channels/imaging.hanging-protocol.applied' }
components:
  schemas:
    CloudEventCore:
      type: object
      required: [specversion, id, source, type, datacontenttype, time, data]
      properties:
        specversion: { type: string, const: '1.0' }
        id: { type: string }
        source: { type: string, const: oyatie.imaging }
        type: { type: string }
        datacontenttype: { type: string, const: application/json }
        time: { type: string, format: date-time }
        tenant_id: { type: string }
        cell_id: { type: string }
        correlation_id: { type: string }
        data: { type: object }
    StudyReceivedData:
      type: object
      required: [study_instance_uid, accession_number, patient_id, modality, transport, received_at]
      properties:
        study_instance_uid: { type: string }
        accession_number: { type: string }
        patient_id: { type: string }
        modality: { type: string }
        transport: { type: string, enum: [DIMSE-C-STORE, DICOMweb-STOW-RS, VNA-Federation] }
        received_at: { type: string, format: date-time }
        instance_count: { type: integer }
        size_bytes: { type: integer }
    StudyAcquiredData:
      type: object
      required: [study_instance_uid, mpps_uid, completed_at, modality]
      properties:
        study_instance_uid: { type: string }
        mpps_uid: { type: string }
        completed_at: { type: string, format: date-time }
        modality: { type: string }
        performed_protocol_codes: { type: array, items: { type: string } }
        dose_emitted: { type: boolean }
    StudyReadData:
      type: object
      properties:
        study_instance_uid: { type: string }
        radiologist_id: { type: string }
        opened_at: { type: string, format: date-time }
        hanging_protocol_id: { type: string }
    ReportSignedData:
      type: object
      required: [study_instance_uid, report_id, signing_radiologist_id, signed_at, status]
      properties:
        study_instance_uid: { type: string }
        report_id: { type: string }
        signing_radiologist_id: { type: string }
        signed_at: { type: string, format: date-time }
        status: { type: string, enum: [preliminary, final, addendum, corrected] }
        critical_finding_codes:
          type: array
          items: { type: string }
        fhir_diagnostic_report_id: { type: string }
        dicom_sr_sop_instance_uid: { type: string }
    CriticalResultCommunicatedData:
      type: object
      required: [report_id, escalation_step, channel, recipient_role, status]
      properties:
        report_id: { type: string }
        escalation_step: { type: integer }
        channel: { type: string, enum: [push, sms, voice, in-portal, fallback-fax] }
        recipient_role: { type: string, enum: [ordering, covering, charge-nurse, on-call-attending, patient-safety-officer] }
        recipient_id: { type: string }
        status: { type: string, enum: [sent, delivered, confirmed, escalated, failed] }
        confirmed_at: { type: string, format: date-time }
    PeerReviewCompletedData:
      type: object
      required: [study_instance_uid, reviewer_id, radpeer_score]
      properties:
        study_instance_uid: { type: string }
        reviewer_id: { type: string }
        radpeer_score: { type: integer, enum: [1, 2, 3] }
        sample_type: { type: string }
    AiInferenceDispatchedData:
      type: object
      required: [dispatch_id, study_instance_uid, vendor, model_version]
      properties:
        dispatch_id: { type: string }
        study_instance_uid: { type: string }
        vendor: { type: string }
        model_version: { type: string }
        indication: { type: string }
        deidentified: { type: boolean, const: true }
    AiInferenceResultData:
      type: object
      required: [dispatch_id, vendor, completed_at]
      properties:
        dispatch_id: { type: string }
        vendor: { type: string }
        completed_at: { type: string, format: date-time }
        findings_count: { type: integer }
        confidence_max: { type: number }
        round_trip_ms: { type: integer }
    AiDriftDetectedData:
      type: object
      required: [vendor, model_version, metric, delta_pct]
      properties:
        vendor: { type: string }
        model_version: { type: string }
        metric: { type: string, enum: [PPV, sensitivity, specificity, NPV] }
        delta_pct: { type: number }
        window: { type: string, enum: [week-over-week, month-over-month] }
    DoseDeviationData:
      type: object
      required: [study_instance_uid, protocol_id, dlp, target_dlp, deviation_ratio]
      properties:
        study_instance_uid: { type: string }
        protocol_id: { type: string }
        modality: { type: string }
        dlp: { type: number, description: dose length product (CT) }
        target_dlp: { type: number }
        deviation_ratio: { type: number }
        technologist_id: { type: string }
    MammographyRecallIssuedData:
      type: object
      properties:
        patient_id: { type: string }
        recall_reason: { type: string }
        birads_category: { type: string }
        recall_date: { type: string, format: date }
        screening_study_uid: { type: string }
    VnaFederationPulledData:
      type: object
      properties:
        legacy_vendor: { type: string, enum: [GE-EA, Philips-ISyntax-VNA, Sectra-VNA, Fujifilm-Synapse-VNA, Agfa-Impax-VNA, Merge-VNA] }
        study_instance_uid: { type: string }
        instance_count: { type: integer }
        checksum_verified: { type: boolean }
        pulled_at: { type: string, format: date-time }
    PatientPortalAccessGrantedData:
      type: object
      properties:
        patient_id: { type: string }
        study_instance_uid: { type: string }
        token_id: { type: string }
        consent_id: { type: string }
        ttl_seconds: { type: integer }
        granted_at: { type: string, format: date-time }
    MppsStateChangedData:
      type: object
      properties:
        mpps_uid: { type: string }
        study_instance_uid: { type: string }
        from_state: { type: string, enum: [SCHEDULED, IN_PROGRESS, DISCONTINUED, COMPLETED] }
        to_state: { type: string, enum: [SCHEDULED, IN_PROGRESS, DISCONTINUED, COMPLETED] }
        modality: { type: string }
        changed_at: { type: string, format: date-time }
    HangingProtocolAppliedData:
      type: object
      properties:
        study_instance_uid: { type: string }
        radiologist_id: { type: string }
        protocol_id: { type: string }
        match_tier: { type: integer, description: 1=exact-radiologist+modality+body, 2=radiologist+modality, 3=tenant-default, 4=fallback }
        applied_at: { type: string, format: date-time }
  messages:
    ImagingStudyReceived:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    ImagingStudyAcquired:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    ImagingStudyRead:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    ImagingReportSigned:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    CriticalResultCommunicated:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    PeerReviewCompleted:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    AiInferenceDispatched:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    AiInferenceResult:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    AiDriftDetected:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    DoseDeviation:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    MammographyRecallIssued:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    VnaFederationPulled:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    PatientPortalAccessGranted:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    MppsStateChanged:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
    HangingProtocolApplied:
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/CloudEventCore'
