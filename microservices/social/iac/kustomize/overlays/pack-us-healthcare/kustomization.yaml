# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: social-us-hc

resources:
  - ../../base

# Pack-US-Healthcare overlay per /specs/regulatory-packs.json#pack-us-healthcare
# - HIPAA 45 CFR §164.308-316 enforced.
# - PHI-account BAA required at tenant onboarding.
# - T1/T2 capabilities disabled by default; per-account opt-in only.
# - SEC 17a-4 + FINRA 4511 retention applies when financial-record posts active.
# - US COPPA — children < 13 require verifiable parental consent.
# - Federation OFF (HIPAA Safe Harbor; opt-in requires BAA + per-peer attestation).
# - Ads-substrate-stub OFF (always; HIPAA marketing rules).

patches:
  - target: {kind: HelmRelease, name: social}
    patch: |-
      - op: replace
        path: /spec/values/global/pack
        value: us-hc
      - op: replace
        path: /spec/values/capabilities/t2Auto/enabled
        value: false
      - op: replace
        path: /spec/values/capabilities/t1Assist/enabled
        value: false
      - op: replace
        path: /spec/values/federationGateway/enabled
        value: false
      - op: replace
        path: /spec/values/ageVerificationPolicy/packCoppaMinorThreshold
        value: 13
  - target: {kind: ConfigMap, name: social-retention-policy}
    patch: |-
      - op: replace
        path: /data/pack-us-hc-floor-days
        value: "2190"  # 6 years HIPAA §164.530(j)
      - op: replace
        path: /data/pack-us-hc-ceiling-days
        value: "3650"  # 10 years max
