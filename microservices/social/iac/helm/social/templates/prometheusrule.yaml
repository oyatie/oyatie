apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: social-burn-rate-rules
  namespace: social
  labels:
    app.kubernetes.io/name: social
    prometheus: mimir
spec:
  groups:
    - name: social-recording-rules
      interval: 60s
      rules:
        - record: social:post_create:availability_5m
          expr: |
            sum(rate(oya_social_post_create_total{result="success"}[5m]))
            /
            sum(rate(oya_social_post_create_total[5m]))
        - record: social:post_create:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_social_post_create_duration_seconds_bucket[5m]))
            )
        - record: social:feed_render:latency_p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(oya_social_feed_render_duration_seconds_bucket[5m]))
            )
        - record: social:feed_cache:hit_ratio_5m
          expr: |
            sum(rate(oya_social_feed_cache_hit_total[5m]))
            /
            sum(rate(oya_social_feed_cache_request_total[5m]))

    - name: social-burn-rate-alerts
      rules:
        - alert: SocialPostCreateFastBurn1h
          expr: |
            (1 - social:post_create:availability_5m) > 14.4 * (1 - 0.9995)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: social
          annotations:
            summary: "social post-create fast-burn (14.4x) for 5m"
            runbook_url: "https://oyatie.dev/microservices/social/runbooks/feed-cache-rebuild"

        - alert: SocialPostCreateSlowBurn6h
          expr: |
            (1 - avg_over_time(social:post_create:availability_5m[6h])) > 6 * (1 - 0.9995)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: social

        - alert: SocialFeedRenderLatencyHigh
          expr: |
            social:feed_render:latency_p95_5m > 0.2
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: social
            bc: feed-timeline

        - alert: SocialDualContextDenyDetected
          expr: |
            increase(oya_social_dual_context_denied_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: dual-context-isolation
            microservice: social
          annotations:
            summary: "social context-isolation invariant violation attempt detected"
            runbook_url: "https://oyatie.dev/microservices/social/policy/dual-context-isolation"

        - alert: SocialPersonalTierFederationAttempt
          expr: |
            increase(oya_social_personal_tier_federation_attempt_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: dual-context-isolation
            invariant: DCI-08
            microservice: social
          annotations:
            summary: "social Personal-tier federation attempt detected — compile-time invariant breach"
            runbook_url: "https://oyatie.dev/microservices/social/runbooks/federation-bridge-degraded"

        - alert: SocialFeedCacheHitRatioLow
          expr: |
            social:feed_cache:hit_ratio_5m < 0.7
          for: 15m
          labels:
            severity: warning
            sli: cache_hit_ratio
            microservice: social
            bc: feed-timeline
          annotations:
            runbook_url: "https://oyatie.dev/microservices/social/runbooks/feed-cache-rebuild"

        - alert: SocialModerationClassifierDrift
          expr: |
            sum(rate(oya_social_moderation_verdict_total{verdict=~"abuse|hate_speech|csam_suspect|harassment"}[15m]))
            > 5 *
            sum(rate(oya_social_moderation_verdict_total{verdict=~"abuse|hate_speech|csam_suspect|harassment"}[24h]))
          for: 10m
          labels:
            severity: warning
            sli: classifier_drift
            microservice: social
            eu_ai_act: high-risk
          annotations:
            summary: "social moderation classifier drift detected (≥5x baseline rate)"
            runbook_url: "https://oyatie.dev/microservices/social/runbooks/content-moderation-rollback"

    - name: social-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: social-llm-capability-circuit-open
          expr: max(oya_social_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: social
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "social LLM/capability circuit-breaker tripped open"
        - alert: social-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_social_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: social
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "social capability retry-budget exhausted"

    - name: social-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: social-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_social_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: social
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "social tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: social-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: social-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"social-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: social
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "social pod CPU saturation > 70% sustained 10m"
        - alert: social-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_social_responses_5xx_total[5m]))
            /
            sum(rate(oya_social_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: social
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "social 5xx rate > 1% sustained 5m"
        - alert: social-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_social_responses_total[5m]))
              /
              sum(rate(oya_social_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: social
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "social inbound RPS dropped > 90% vs prior hour"

    - name: social-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: social-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_social_request_success_total[1h]))
              /
              sum(rate(oya_social_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: social
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "social aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: social-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_social_request_success_total[6h]))
              /
              sum(rate(oya_social_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: social
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "social aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
