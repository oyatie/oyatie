# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: social-rest
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: post-composition-rest
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: social-websocket
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: websocket-gateway
  ports:
    - name: wss
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: social-user-profile
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: user-profile
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: social-feed-timeline
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: feed-timeline
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: social-search
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- if .Values.federationGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: social-federation-gateway
  namespace: social
  labels:
    app.kubernetes.io/name: social
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: social
    app.kubernetes.io/component: federation-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
