apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-community-social-csam-classifier-adapter-photodna
  namespace: social
spec:
  microservice: social
  bounded_context: csam-classification
  layer: adapter
  language: rust
  binding_adrs:
    - ADR-SOC-0003
    - ADR-0292
  backend: microsoft-photodna
  fallback_backends:
    - thorn-safer
    - google-csai-match
  emits_audit_classes:
    - oya.social.csam-detect
    - oya.social.csam-ncmec-report
    - oya.social.csam-incident-close
  cedar_fragment: policy/content-policy.cedar
  legal_basis:
    - 18-USC-2258A-NCMEC-mandatory-reporting
    - EU-CSAM-Regulation
