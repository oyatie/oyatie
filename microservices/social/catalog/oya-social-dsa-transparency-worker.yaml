apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-community-social-dsa-transparency-worker
  namespace: social
spec:
  microservice: social
  bounded_context: dsa-compliance
  layer: app
  language: rust
  binding_adrs:
    - ADR-0251
  emits_audit_classes:
    - oya.social.dsa-report-publish
    - oya.social.dsa-statement-of-reasons-emit
  scheduled:
    cadence_cron: "0 0 1 1,7 *"  # Semi-annual: Jan 1, Jul 1
  outputs:
    - eu-dsa-transparency-report.pdf
    - eu-dsa-transparency-report.md
    - eu-dsa-transparency-report.json
