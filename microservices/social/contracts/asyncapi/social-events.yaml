        $ref: '#/components/messages/AbuseReportFiled'

  verification-badge-issued:
    address: workflow-events/social.verification.badge_issued
    messages:
      VerificationBadgeIssuedMessage:
        $ref: '#/components/messages/VerificationBadgeIssued'

  profile-created:
    address: workflow-events/social.profile.created
    messages:
      ProfileCreatedMessage:
        $ref: '#/components/messages/ProfileCreated'

  profile-updated:
    address: workflow-events/social.profile.updated
    messages:
      ProfileUpdatedMessage:
        $ref: '#/components/messages/ProfileUpdated'

  profile-deleted:
    address: workflow-events/social.profile.deleted
    messages:
      ProfileDeletedMessage:
        $ref: '#/components/messages/ProfileDeleted'

  ediscovery-hold:
    address: workflow-events/social.ediscovery.hold
    messages:
      EDiscoveryHoldMessage:
        $ref: '#/components/messages/EDiscoveryHold'

  four-eyes-disclosure:
    address: workflow-events/social.disclosure.executed
    messages:
      FourEyesDisclosureMessage:
        $ref: '#/components/messages/FourEyesDisclosure'

  federation-opt-in:
    address: workflow-events/social.federation.opt_in
    messages:
      FederationOptInMessage:
        $ref: '#/components/messages/FederationOptIn'

  federation-activity-ingested:
    address: workflow-events/social.federation.activity_ingested
    messages:
      FederationActivityIngestedMessage:
        $ref: '#/components/messages/FederationActivityIngested'

  federation-activity-egressed:
    address: workflow-events/social.federation.activity_egressed
    messages:
      FederationActivityEgressedMessage:
        $ref: '#/components/messages/FederationActivityEgressed'

  # WebSocket frames (real-time delivery)
  ws-feed-update:
    address: ws/feed
    messages:
      FeedFrame:
        $ref: '#/components/messages/PostPublished'

  ws-notification:
    address: ws/notification
    messages:
      NotificationFrame:
        $ref: '#/components/messages/Notification'

  ws-reaction-frame:
    address: ws/reaction
    messages:
      ReactionFrame:
        $ref: '#/components/messages/ReactionAdded'

operations:
  emitPostPublished:
    action: send
    channel: {$ref: '#/channels/post-published'}
  emitPostEdited:
    action: send
    channel: {$ref: '#/channels/post-edited'}
  emitPostDeleted:
    action: send
    channel: {$ref: '#/channels/post-deleted'}
  emitRepostCreated:
    action: send
    channel: {$ref: '#/channels/repost-created'}
  emitQuotePostCreated:
    action: send
    channel: {$ref: '#/channels/quote-post-created'}
  emitCommentPublished:
    action: send
    channel: {$ref: '#/channels/comment-published'}
  emitReactionAdded:
    action: send
    channel: {$ref: '#/channels/reaction-added'}
  emitReactionRemoved:
    action: send
    channel: {$ref: '#/channels/reaction-removed'}
  emitFollowEdgeAdded:
    action: send
    channel: {$ref: '#/channels/follow-edge-added'}
  emitFollowEdgeRemoved:
    action: send
    channel: {$ref: '#/channels/follow-edge-removed'}
  emitBlockEdgeAdded:
    action: send
    channel: {$ref: '#/channels/block-edge-added'}
  emitMuteEdgeAdded:
    action: send
    channel: {$ref: '#/channels/mute-edge-added'}
  emitMentionEmitted:
    action: send
    channel: {$ref: '#/channels/mention-emitted'}
  emitHashtagEmission:
    action: send
    channel: {$ref: '#/channels/hashtag-emission'}
  emitModerationVerdictEmitted:
    action: send
    channel: {$ref: '#/channels/moderation-verdict-emitted'}
  emitAppealOpened:
    action: send
    channel: {$ref: '#/channels/appeal-opened'}
  emitAppealResolved:
    action: send
    channel: {$ref: '#/channels/appeal-resolved'}
  emitAbuseReportFiled:
    action: send
    channel: {$ref: '#/channels/abuse-report-filed'}
  emitVerificationBadgeIssued:
    action: send
    channel: {$ref: '#/channels/verification-badge-issued'}
  emitProfileCreated:
    action: send
    channel: {$ref: '#/channels/profile-created'}
  emitProfileUpdated:
    action: send
    channel: {$ref: '#/channels/profile-updated'}
  emitProfileDeleted:
    action: send
    channel: {$ref: '#/channels/profile-deleted'}
  emitEDiscoveryHold:
    action: send
    channel: {$ref: '#/channels/ediscovery-hold'}
  emitFourEyesDisclosure:
    action: send
    channel: {$ref: '#/channels/four-eyes-disclosure'}
  emitFederationOptIn:
    action: send
    channel: {$ref: '#/channels/federation-opt-in'}
  emitFederationActivityIngested:
    action: send
    channel: {$ref: '#/channels/federation-activity-ingested'}
  emitFederationActivityEgressed:
    action: send
    channel: {$ref: '#/channels/federation-activity-egressed'}

  # Consumed events
  consumeMessengerDeepLinkRequested:
    action: receive
    channel:
      address: workflow-events/messenger.deeplink.requested
    description: messenger requests deep-link metadata for a post
  consumeOntologyEntityChanged:
    action: receive
    channel:
      address: workflow-events/ontology.entity.changed
    description: ontology entity update refreshes mention-resolution cache
  consumeTenantRetentionPolicyUpdated:
    action: receive
    channel:
      address: workflow-events/tenancy.retention_policy.updated
  consumeAuditChainSealed:
    action: receive
    channel:
      address: workflow-events/audit_chain.sealed
  consumeMailActionCardEmitted:
    action: receive
    channel:
      address: workflow-events/mail.action_card.emitted

components:
  messages:
    PostPublished:
      name: PostPublished
      contentType: application/json
      payload: {$ref: '#/components/schemas/PostPublishedPayload'}
    PostEdited:
      name: PostEdited
      contentType: application/json
      payload: {$ref: '#/components/schemas/PostEditedPayload'}
    PostDeleted:
      name: PostDeleted
      contentType: application/json
      payload: {$ref: '#/components/schemas/PostDeletedPayload'}
    RepostCreated:
      name: RepostCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/RepostCreatedPayload'}
    QuotePostCreated:
      name: QuotePostCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/QuotePostCreatedPayload'}
    CommentPublished:
      name: CommentPublished
      contentType: application/json
      payload: {$ref: '#/components/schemas/CommentPublishedPayload'}
    ReactionAdded:
      name: ReactionAdded
      contentType: application/json
      payload: {$ref: '#/components/schemas/ReactionPayload'}
    ReactionRemoved:
      name: ReactionRemoved
      contentType: application/json
      payload: {$ref: '#/components/schemas/ReactionPayload'}
    FollowEdgeAdded:
      name: FollowEdgeAdded
      contentType: application/json
      payload: {$ref: '#/components/schemas/FollowEdgePayload'}
    FollowEdgeRemoved:
      name: FollowEdgeRemoved
      contentType: application/json
      payload: {$ref: '#/components/schemas/FollowEdgePayload'}
    BlockEdgeAdded:
      name: BlockEdgeAdded
