      payload: {$ref: '#/components/schemas/BlockEdgePayload'}
    MuteEdgeAdded:
      name: MuteEdgeAdded
      contentType: application/json
      payload: {$ref: '#/components/schemas/MuteEdgePayload'}
    MentionEmitted:
      name: MentionEmitted
      contentType: application/json
      payload: {$ref: '#/components/schemas/MentionEmittedPayload'}
    HashtagEmission:
      name: HashtagEmission
      contentType: application/json
      payload: {$ref: '#/components/schemas/HashtagEmissionPayload'}
    ModerationVerdictEmitted:
      name: ModerationVerdictEmitted
      contentType: application/json
      payload: {$ref: '#/components/schemas/ModerationVerdictPayload'}
    AppealOpened:
      name: AppealOpened
      contentType: application/json
      payload: {$ref: '#/components/schemas/AppealPayload'}
    AppealResolved:
      name: AppealResolved
      contentType: application/json
      payload: {$ref: '#/components/schemas/AppealPayload'}
    AbuseReportFiled:
      name: AbuseReportFiled
      contentType: application/json
      payload: {$ref: '#/components/schemas/AbuseReportPayload'}
    VerificationBadgeIssued:
      name: VerificationBadgeIssued
      contentType: application/json
      payload: {$ref: '#/components/schemas/VerificationBadgePayload'}
    ProfileCreated:
      name: ProfileCreated
      contentType: application/json
      payload: {$ref: '#/components/schemas/ProfilePayload'}
    ProfileUpdated:
      name: ProfileUpdated
      contentType: application/json
      payload: {$ref: '#/components/schemas/ProfilePayload'}
    ProfileDeleted:
      name: ProfileDeleted
      contentType: application/json
      payload: {$ref: '#/components/schemas/ProfilePayload'}
    EDiscoveryHold:
      name: EDiscoveryHold
      contentType: application/json
      payload: {$ref: '#/components/schemas/EDiscoveryHoldPayload'}
    FourEyesDisclosure:
      name: FourEyesDisclosure
      contentType: application/json
      payload: {$ref: '#/components/schemas/FourEyesDisclosurePayload'}
    FederationOptIn:
      name: FederationOptIn
      contentType: application/json
      payload: {$ref: '#/components/schemas/FederationOptInPayload'}
    FederationActivityIngested:
      name: FederationActivityIngested
      contentType: application/json
      payload: {$ref: '#/components/schemas/FederationActivityPayload'}
    FederationActivityEgressed:
      name: FederationActivityEgressed
      contentType: application/json
      payload: {$ref: '#/components/schemas/FederationActivityPayload'}
    Notification:
      name: Notification
      contentType: application/json
      payload: {$ref: '#/components/schemas/NotificationPayload'}

  schemas:
    PostPublishedPayload:
      type: object
      required: [post_id, author_ref, tenant_id, context_kind, visibility, posted_at, content_hash]
      properties:
        post_id: {type: string, format: ulid}
        author_ref: {type: string}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        kind: {type: string, enum: [post, repost, quote_post, comment]}
        parent_post_id: {type: string, format: ulid, nullable: true}
        visibility: {type: string, enum: [public, followers, list, private]}
        data_class: {type: string}
        body_present: {type: boolean}
        media_count: {type: integer}
        mention_count: {type: integer}
        hashtag_count: {type: integer}
        posted_at: {type: string, format: date-time}
        content_hash: {type: string}
        signature: {type: string}
    PostEditedPayload:
      type: object
      required: [post_id, edited_at, content_hash]
      properties:
        post_id: {type: string}
        editor_ref: {type: string}
        edited_at: {type: string, format: date-time}
        content_hash: {type: string}
        edit_kind: {type: string, enum: [body, media, mentions, hashtags]}
    PostDeletedPayload:
      type: object
      required: [post_id, deleted_at]
      properties:
        post_id: {type: string}
        deleter_ref: {type: string}
        deleted_at: {type: string, format: date-time}
        tombstone_only: {type: boolean, default: true}
    RepostCreatedPayload:
      type: object
      required: [repost_id, original_post_id, reposter_ref, created_at]
      properties:
        repost_id: {type: string}
        original_post_id: {type: string}
        reposter_ref: {type: string}
        created_at: {type: string, format: date-time}
    QuotePostCreatedPayload:
      type: object
      required: [quote_post_id, quoted_post_id, author_ref, body, created_at]
      properties:
        quote_post_id: {type: string}
        quoted_post_id: {type: string}
        author_ref: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}
    CommentPublishedPayload:
      type: object
      required: [comment_id, parent_post_id, author_ref, created_at]
      properties:
        comment_id: {type: string}
        parent_post_id: {type: string}
        author_ref: {type: string}
        created_at: {type: string, format: date-time}
    ReactionPayload:
      type: object
      required: [post_id, user_ref, emoji, action]
      properties:
        post_id: {type: string}
        user_ref: {type: string}
        emoji: {type: string}
        action: {type: string, enum: [added, removed]}
    FollowEdgePayload:
      type: object
      required: [follower_ref, followee_ref, action, at]
      properties:
        follower_ref: {type: string}
        followee_ref: {type: string}
        action: {type: string, enum: [added, removed]}
        at: {type: string, format: date-time}
    BlockEdgePayload:
      type: object
      required: [blocker_ref, blocked_ref, action, at]
      properties:
        blocker_ref: {type: string}
        blocked_ref: {type: string}
        action: {type: string, enum: [added, removed]}
        at: {type: string, format: date-time}
    MuteEdgePayload:
      type: object
      required: [muter_ref, muted_ref, action, at]
      properties:
        muter_ref: {type: string}
        muted_ref: {type: string}
        action: {type: string, enum: [added, removed]}
        at: {type: string, format: date-time}
    MentionEmittedPayload:
      type: object
      required: [post_id, target_kind, target_ref, mention_kind]
      properties:
        post_id: {type: string}
        target_kind: {type: string, enum: [Person, Team, Topic, Hashtag]}
        target_ref: {type: string}
        mention_kind: {type: string, enum: [direct, broadcast]}
    HashtagEmissionPayload:
      type: object
      required: [post_id, hashtag, emitted_at]
      properties:
        post_id: {type: string}
        hashtag: {type: string}
        pack: {type: string}
        emitted_at: {type: string, format: date-time}
    ModerationVerdictPayload:
      type: object
      required: [verdict_id, target_post_id, verdict, classifier_version, emitted_at]
      properties:
        verdict_id: {type: string}
        target_post_id: {type: string}
        verdict: {type: string, enum: [ok, spam, abuse, hate_speech, csam_suspect, self_harm_suspect, harassment, sensitive_media_unflagged]}
        confidence: {type: number, minimum: 0, maximum: 1}
        classifier_version: {type: string}
        statement_of_reasons:
          type: object
          description: EU DSA Art. 17 Statement of Reasons
          properties:
            grounds: {type: string}
            facts_and_circumstances: {type: string}
            automated_means: {type: boolean}
            redress: {type: string}
        eu_ai_act_label:
          type: string
          enum: [ai_generated_assessment, human_assessment, hybrid]
          description: EU AI Act Art. 50 transparency obligation
        emitted_at: {type: string, format: date-time}
    AppealPayload:
      type: object
      required: [appeal_id, appellant_ref, target_verdict_id, status, at]
      properties:
        appeal_id: {type: string}
        appellant_ref: {type: string}
        target_verdict_id: {type: string}
        status: {type: string, enum: [open, under_review, upheld, overturned]}
        reviewer_ref: {type: string, nullable: true}
        at: {type: string, format: date-time}
    AbuseReportPayload:
      type: object
      required: [report_id, reporter_ref, target_post_id, category, at]
      properties:
        report_id: {type: string}
        reporter_ref: {type: string}
        target_post_id: {type: string}
        category: {type: string}
        reason: {type: string}
        at: {type: string, format: date-time}
    VerificationBadgePayload:
      type: object
      required: [badge_id, target_profile_id, badge_kind, action, at]
      properties:
        badge_id: {type: string}
        target_profile_id: {type: string}
        badge_kind: {type: string, enum: [blue, organisation, government]}
        action: {type: string, enum: [issued, revoked]}
        actor_ref: {type: string}
        at: {type: string, format: date-time}
    ProfilePayload:
      type: object
      required: [profile_id, tenant_id, context_kind, handle, action, at]
      properties:
        profile_id: {type: string}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        handle: {type: string}
        action: {type: string, enum: [created, updated, deleted]}
        at: {type: string, format: date-time}
    EDiscoveryHoldPayload:
      type: object
      required: [hold_id, tenant_id, scope, action, executed_at]
      properties:
        hold_id: {type: string}
        tenant_id: {type: string}
        scope: {type: object}
        reason: {type: string}
        action: {type: string, enum: [opened, closed]}
        executed_by: {type: string}
        executed_at: {type: string, format: date-time}
    FourEyesDisclosurePayload:
      type: object
      required: [disclosure_id, tenant_id, post_ids, primary_approver, paired_approver, executed_at]
      properties:
        disclosure_id: {type: string}
        tenant_id: {type: string}
        post_ids: {type: array, items: {type: string}}
        reason: {type: string}
        primary_approver: {type: string}
        paired_approver: {type: string}
        executed_at: {type: string, format: date-time}
        signature_primary: {type: string}
        signature_paired: {type: string}
    FederationOptInPayload:
      type: object
      required: [tenant_id, action, at]
      properties:
        tenant_id: {type: string}
        action: {type: string, enum: [granted, revoked]}
        granted_by: {type: string}
        peer_allowlist:
          type: array
          items: {type: string}
        at: {type: string, format: date-time}
    FederationActivityPayload:
      type: object
      required: [activity_id, activity_type, peer_ref, context_kind, direction, at]
      properties:
        activity_id: {type: string}
        activity_type: {type: string, enum: [Create, Update, Delete, Follow, Like, Announce, Undo]}
        peer_ref: {type: string}
        context_kind: {type: string, enum: [Professional]}  # Personal NEVER federates
        direction: {type: string, enum: [inbox, outbox]}
        http_signature_valid: {type: boolean}
        at: {type: string, format: date-time}
    NotificationPayload:
      type: object
      required: [notification_id, recipient_ref, kind, created_at]
      properties:
        notification_id: {type: string}
        recipient_ref: {type: string}
        kind: {type: string, enum: [mention, reply, repost, quote_post, follow, like, milestone, moderation_verdict, appeal_resolved, system]}
        actor_ref: {type: string, nullable: true}
        post_id: {type: string, nullable: true}
        preview: {type: string}
        created_at: {type: string, format: date-time}
