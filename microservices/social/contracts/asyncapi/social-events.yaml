asyncapi: 3.1.0
info:
  title: oya-social — events
  version: 1.0.0
  summary: Real-time + Workflow events emitted by the social µservice
  description: |
    Two channel families:
    - **Real-time WebSocket** (`wss://social-{pack}.oyatie.com/ws/v1`):
      client-facing events delivered to authenticated session connections.
      Per-event Cedar evaluation; payloads scoped to the consumer's visibility.
    - **Workflow event bus** (cluster-internal AMQP / NATS):
      cross-µservice events consumed by ontology, audit-chain, messenger, mail, workflow-engine, foundry-runtime.

defaultContentType: application/json

servers:
  websocket-gateway:
    host: social-{pack}.oyatie.com
    protocol: wss
    description: Per-pack WebSocket gateway
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
  workflow-events-bus:
    host: workflow-events.social.svc.cluster.local
    protocol: amqp
    description: Internal AMQP bus

channels:
  post-published:
    address: workflow-events/social.post.published
    messages:
      PostPublishedMessage:
        $ref: '#/components/messages/PostPublished'
    description: A new post was published

  post-edited:
    address: workflow-events/social.post.edited
    messages:
      PostEditedMessage:
        $ref: '#/components/messages/PostEdited'

  post-deleted:
    address: workflow-events/social.post.deleted
    messages:
      PostDeletedMessage:
        $ref: '#/components/messages/PostDeleted'

  repost-created:
    address: workflow-events/social.repost.created
    messages:
      RepostCreatedMessage:
        $ref: '#/components/messages/RepostCreated'

  quote-post-created:
    address: workflow-events/social.quote_post.created
    messages:
      QuotePostCreatedMessage:
        $ref: '#/components/messages/QuotePostCreated'

  comment-published:
    address: workflow-events/social.comment.published
    messages:
      CommentPublishedMessage:
        $ref: '#/components/messages/CommentPublished'

  reaction-added:
    address: workflow-events/social.reaction.added
