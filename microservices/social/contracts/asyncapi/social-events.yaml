    messages:
      ReactionRemovedMessage:
        $ref: '#/components/messages/ReactionRemoved'

  follow-edge-added:
    address: workflow-events/social.follow_edge.added
    messages:
      FollowEdgeAddedMessage:
        $ref: '#/components/messages/FollowEdgeAdded'

  follow-edge-removed:
    address: workflow-events/social.follow_edge.removed
    messages:
      FollowEdgeRemovedMessage:
        $ref: '#/components/messages/FollowEdgeRemoved'

  block-edge-added:
    address: workflow-events/social.block_edge.added
