apiVersion: openslo/v1
kind: SLO
metadata:
  name: supply-chain-planning-latency-p99
  labels:
    service: supply-chain-planning
    sap_code: "SCM/APO"
spec:
  description: "Supply Chain Planning supply-chain-planning-latency-p99 objective; benchmarks SAP SCM/APO and SAP IBP | Oracle Supply Chain Planning | Workday Adaptive Planning supply-chain scenario counterpart | NetSuite Demand Planning | Microsoft Dynamics 365 Master Planning"
  service: supply-chain-planning
  indicator:
    metadata:
      name: supply-chain-planning-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"supply-chain-planning\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"supply-chain-planning\"}[5m]))"
  objectives:
    - displayName: supply-chain-planning-latency-p99
      target: 0.99
