asyncapi: 3.1.0
info:
  title: Supply Chain Planning Events
  version: 1.0.0
  description: AsyncAPI 3.1.0 channels for SAP SCM/APO parity events.
defaultContentType: application/json
channels:
  supply-chain-planning.demand-plan.events.v1:
    address: supply-chain-planning.demand-plan.events.v1
    messages:
      DemandPlanChanged:
        $ref: "#/components/messages/DemandPlanChanged"
  supply-chain-planning.supply-network-plan.events.v1:
    address: supply-chain-planning.supply-network-plan.events.v1
    messages:
      SupplyNetworkPlanChanged:
        $ref: "#/components/messages/SupplyNetworkPlanChanged"
  supply-chain-planning.available-to-promise.events.v1:
    address: supply-chain-planning.available-to-promise.events.v1
    messages:
      AvailableToPromiseChanged:
        $ref: "#/components/messages/AvailableToPromiseChanged"
  supply-chain-planning.replenishment-plan.events.v1:
    address: supply-chain-planning.replenishment-plan.events.v1
    messages:
      ReplenishmentPlanChanged:
        $ref: "#/components/messages/ReplenishmentPlanChanged"
  supply-chain-planning.transportation-plan.events.v1:
    address: supply-chain-planning.transportation-plan.events.v1
    messages:
      TransportationPlanChanged:
        $ref: "#/components/messages/TransportationPlanChanged"
  supply-chain-planning.planning-scenario.events.v1:
    address: supply-chain-planning.planning-scenario.events.v1
    messages:
      PlanningScenarioChanged:
        $ref: "#/components/messages/PlanningScenarioChanged"
components:
  messages:
    DemandPlanChanged:
      name: DemandPlanChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-DEMAND_PLAN-CHANGED
          bounded_context:
            type: string
            const: demand-plan
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    SupplyNetworkPlanChanged:
      name: SupplyNetworkPlanChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-SUPPLY_NETWORK_PLAN-CHANGED
          bounded_context:
            type: string
            const: supply-network-plan
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    AvailableToPromiseChanged:
      name: AvailableToPromiseChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-AVAILABLE_TO_PROMISE-CHANGED
          bounded_context:
            type: string
            const: available-to-promise
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    ReplenishmentPlanChanged:
      name: ReplenishmentPlanChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-REPLENISHMENT_PLAN-CHANGED
          bounded_context:
            type: string
            const: replenishment-plan
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    TransportationPlanChanged:
      name: TransportationPlanChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-TRANSPORTATION_PLAN-CHANGED
          bounded_context:
            type: string
            const: transportation-plan
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
    PlanningScenarioChanged:
      name: PlanningScenarioChanged
      payload:
        type: object
        required: [tenant_id, audit_event_class, bounded_context, occurred_at]
        properties:
          tenant_id:
            type: string
          audit_event_class:
            type: string
            const: EVT-SUPPLY_CHAIN_PLANNING-PLANNING_SCENARIO-CHANGED
          bounded_context:
            type: string
            const: planning-scenario
          marketplace_settlement_ref:
            type: string
          occurred_at:
            type: string
            format: date-time
