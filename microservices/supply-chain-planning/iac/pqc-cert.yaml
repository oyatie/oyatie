apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-supply-chain-planning-pqc
spec:
  secretName: oya-supply-chain-planning-tls
  commonName: supply-chain-planning.svc.oyatie.example
  privateKey:
    algorithm: Ed25519
  usages: [server auth, client auth]
  subject:
    organizations: [Oyatie]
  additionalOutputFormats:
    - type: CombinedPEM
