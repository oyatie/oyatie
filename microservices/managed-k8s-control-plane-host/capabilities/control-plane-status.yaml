# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:managed-k8s-control-plane-host:control-plane-status:v1
name: control-plane-status
namespace: managed-k8s-control-plane-host
display_name: Read the lifecycle status of a tenant control plane
description: |
  Read-only status of a tenant control plane: its current kernel status, tier,
  and API-server endpoint (once endpoint_ready or later). The seam
  oya-managed-k8s-sla-observability consumes to surface control-plane uptime +
  provisioning latency per cluster.

  design-spec maturity: served by the in-memory adapter today; the live status
  read is honest-deferred (kamaji-provider-live-integration).
owner_team: council-architecture + ops-platform
maturity: preview
created_at: 2026-05-27
related_adrs: [ADR-0376, ADR-0083, ADR-0105]
related_artifacts:
  - microservices/oya-managed-k8s-control-plane-host/PRD.md
  - microservices/oya-managed-k8s-control-plane-host/slos/provisioning-latency.openslo.yaml
autonomy_tier: T1
# T1 = read-only status; no mutation. Available to platform operators +
# the cluster-lifecycle / sla-observability services.
risk_class: minimal
inputs:
  - name: tenant_id
    type: string
    required: true
  - name: cluster_name
    type: string
    required: true
  - name: tier
    type: enum
    values: [hosted_kamaji, dedicated_talos_spoke]
    required: true
  - name: handle
    type: string
    required: true
outputs:
  - name: status
    type: enum
    values: [requested, datastore_bound, media_formed, provisioning, endpoint_ready, active, draining, deleted, failed]
  - name: endpoint
    type: string
    required: false
audit_chain_seal_events: []
