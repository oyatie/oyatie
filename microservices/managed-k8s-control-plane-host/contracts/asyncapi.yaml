asyncapi: 3.1.0
info:
  title: Managed-Kubernetes Control-Plane Host — Events
  version: 0.1.0
  description: >-
    Audit-chain seal events emitted by the control-plane-host concern (ADR-0376).
    Every provision/teardown/datastore-bind/tier-select decision emits one
    immutable, hash-chained record into evidence/audit-chain.jsonl. design-spec
    maturity: the emitter wiring lands with the live-integration follow-on; the
    event schema is contracted here so consumers (sla-observability, audit-chain)
    can design against it.
  license:
    name: Apache-2.0
defaultContentType: application/json
channels:
  controlPlaneLifecycle:
    address: oya.managed-k8s.control-plane.lifecycle
    description: Control-plane lifecycle seal events (one per state-changing decision).
    messages:
      tierSelected:
        $ref: '#/components/messages/TierSelected'
      datastoreBound:
        $ref: '#/components/messages/DatastoreBound'
      provisioned:
        $ref: '#/components/messages/Provisioned'
      tornDown:
        $ref: '#/components/messages/TornDown'
operations:
  emitControlPlaneLifecycle:
    action: send
    channel:
      $ref: '#/channels/controlPlaneLifecycle'
    summary: Emit a control-plane lifecycle seal event.
components:
  messages:
    TierSelected:
      name: tierSelected
      title: Control-plane tier selected
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ControlPlaneSealEvent'
    DatastoreBound:
      name: datastoreBound
      title: Hosted-tier datastore bound
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ControlPlaneSealEvent'
    Provisioned:
      name: provisioned
      title: Control plane provisioned (active)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ControlPlaneSealEvent'
    TornDown:
      name: tornDown
      title: Control plane torn down (deleted)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ControlPlaneSealEvent'
  schemas:
    ControlPlaneSealEvent:
      type: object
      required: [version, event, tenant_id, cluster_name, tier, status, occurred_at]
      properties:
        version:
          type: string
          const: '1'
          description: ADR-0154 canonical event schema version header.
        event:
          type: string
          enum:
            - oya.managed-k8s.control-plane.tier-selected
            - oya.managed-k8s.control-plane.datastore-bound
            - oya.managed-k8s.control-plane.provisioned
            - oya.managed-k8s.control-plane.torn-down
        tenant_id:
          type: string
        cluster_name:
          type: string
        tier:
          type: string
          enum: [hosted_kamaji, dedicated_talos_spoke]
        datastore_class:
          type: string
          enum: [etcd_per_tenant, pooled_relational]
          description: Present for hosted-tier datastore-bound events.
        status:
          type: string
          enum: [requested, datastore_bound, media_formed, provisioning, endpoint_ready, active, draining, deleted, failed]
        occurred_at:
          type: string
          format: date-time
