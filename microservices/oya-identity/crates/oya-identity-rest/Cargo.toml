[package]
name = "oya-identity-rest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = false
description = "Axum HTTP adapter for oya-identity: exposes OIDC/OAuth endpoints over oya-identity-kernel."

[package.metadata.oya]
microservice = "oya-identity"
bounded_context = "identity-substrate"
layer = "rest"
wave = "wave-c"
owner_team = "axis-identity"
binding_adrs = ["ADR-0476"]
data_classification = "PII_USER_DATA"
criticality_tier = "platform-critical"

[lib]
name = "oya_identity_rest"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-identity-kernel = { path = "../oya-identity-kernel" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
