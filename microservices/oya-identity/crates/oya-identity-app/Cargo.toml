[package]
name = "oya-identity-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Runnable binary: wires oya-identity-kernel + oya-identity-rest + storage into the deployed service."

[package.metadata.oya]
microservice = "oya-identity"
bounded_context = "identity-substrate"
layer = "app"
wave = "wave-c"
owner_team = "axis-identity"
binding_adrs = ["ADR-0476"]
data_classification = "PII_USER_DATA"
criticality_tier = "platform-critical"

[lib]
name = "oya_identity_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-identity"
path = "src/main.rs"

[dependencies]
oya-identity-kernel = { path = "../oya-identity-kernel" }
oya-identity-rest = { path = "../oya-identity-rest" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
