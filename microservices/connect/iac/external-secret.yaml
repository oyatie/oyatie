# External Secret Operator — connect microservice
# Binding ADR: ADR-0296 (library-first credential sidecar), ADR-0255 §D-4 (provider-credential BYOK)
# Syncs per-connect secrets from OpenBao to Kubernetes Secret objects
# Hyperscaler precedent: AWS Secrets Manager + External Secrets Operator; GCP Secret Manager

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: connect-openbao-store
  namespace: connect
spec:
  provider:
    vault:
      server: "https://openbao.cloud-secrets.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "connect-service-role"
          serviceAccountRef:
            name: connect-service-account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connect-pagerduty-service-key
  namespace: connect
  annotations:
    description: "PagerDuty service key — emergency-services class; elevated TTL 300s"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: connect-openbao-store
    kind: SecretStore
  target:
    name: connect-pagerduty-service-key
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: service_key
      remoteRef:
        key: "secret/connect/pagerduty/service-key"
        property: service_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connect-internal-signing-key
  namespace: connect
  annotations:
    description: "Ed25519 signing key for audit-event emission per ADR-0263 + ADR-0296"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: connect-openbao-store
    kind: SecretStore
  target:
    name: connect-internal-signing-key
    creationPolicy: Owner
  data:
    - secretKey: ed25519_private_key
      remoteRef:
        key: "secret/connect/signing/audit-event-key"
        property: private_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connect-tls-production
  namespace: connect
  annotations:
    description: "TLS certificate for connect ingress (ECH + PQC hybrid cert per ADR-0253)"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: connect-openbao-store
    kind: SecretStore
  target:
    name: connect-tls-production
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: "secret/connect/tls/production"
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: "secret/connect/tls/production"
        property: private_key
