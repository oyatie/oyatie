# SPIFFE Workload Identity — connect microservice
# Binding ADR: ADR-0295 (bootstrap CI SPIFFE + kill-switch), ADR-0296 (sidecar isolation)
# Every connect crate's workload gets a SPIFFE SVID from the cluster SPIRE server
# Hyperscaler precedent: AWS SPIFFE/SPIRE deployment; Istio workload identity

apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connect-connector-catalog-rest
spec:
  spiffeIDTemplate: "spiffe://oyatie.app/ns/connect/sa/connect-connector-catalog-rest"
  podSelector:
    matchLabels:
      app: connect-connector-catalog-rest
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connect
  ttl: 1h
  dnsNameTemplates:
    - "connect-connector-catalog-rest.connect.svc.cluster.local"
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connect-oauth-broker-rest
spec:
  spiffeIDTemplate: "spiffe://oyatie.app/ns/connect/sa/connect-oauth-broker-rest"
  podSelector:
    matchLabels:
      app: connect-oauth-broker-rest
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connect
  ttl: 1h
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connect-webhook-receiver-edge
spec:
  spiffeIDTemplate: "spiffe://oyatie.app/ns/connect/sa/connect-webhook-receiver-edge"
  podSelector:
    matchLabels:
      app: connect-webhook-receiver-edge
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connect
  ttl: 1h
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: connect-connector-adapter-worker
  annotations:
    note: "Kata-isolated pod; SVID bound to Kata VM identity, not host kernel"
spec:
  spiffeIDTemplate: "spiffe://oyatie.app/ns/connect/sa/connect-connector-adapter-worker"
  podSelector:
    matchLabels:
      app: connect-connector-adapter-worker
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: connect
  ttl: 1h
---
# Kill-switch: annotate namespace to revoke all SVIDs in <30s
# kubectl annotate ns connect oya.kill-switch=true
# This triggers SPIRE to rotate all SVIDs to a revoked state per ADR-0295
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-kill-switch-config
  namespace: connect
  annotations:
    description: "Kill-switch config for SPIFFE SVID revocation per ADR-0295"
data:
  kill_switch_enabled: "false"
  kill_switch_revocation_reason: ""
  # When set to true by ops-sre: SPIRE rotates all connect SVIDs; connector activity halts in <30s
