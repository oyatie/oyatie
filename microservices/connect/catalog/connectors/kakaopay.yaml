name: kakaopay
display_name: KakaoPay (카카오페이)
category: payments
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Process KakaoPay payments, subscriptions, and refunds via KakaoPay API.
  Receive real-time payment result notifications via KakaoPay webhooks.
  Hyperscaler precedent: KakaoPay (40M+ registered users in Korea).
  pack-kr required: KISA ISMS-P + KR-FSS AML obligations.

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [payment.success, payment.fail, subscription.success]

rate_limit:
  tier: standard
  requests_per_second: 50
  burst: 100

actions:
  - name: readyPayment
    description: Initialize a KakaoPay payment
    data_classes: [FINANCIAL_TRANSACTION, PII_PHONE]
  - name: approvePayment
    description: Approve a KakaoPay payment after user redirect
    data_classes: [FINANCIAL_TRANSACTION]
  - name: cancelPayment
    description: Cancel or refund a payment
    data_classes: [FINANCIAL_TRANSACTION]
  - name: orderSubscription
    description: Create a recurring subscription (정기결제)
    data_classes: [FINANCIAL_TRANSACTION, PII_PHONE]

compliance:
  pii_fields: [item_name, quantity, partner_user_id]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-kr]
  kr_fss_aml_reporting: required
  kr_isms_p: required
  note: "pack-kr mandatory; KR domestic payment method only"

data_residency:
  vendor_data_region: kr
  cross_border_transfer_ok: false
  kr_domestic_only: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
