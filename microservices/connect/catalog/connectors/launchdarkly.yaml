name: launchdarkly
display_name: LaunchDarkly
category: feature-management
publisher_namespace: oyatie
version: "1.1.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage feature flags, targeting rules, and experiments via LaunchDarkly REST API v2.
  Receive real-time flag change events via LaunchDarkly Webhooks.
  Hyperscaler precedent: LaunchDarkly's own Slack/Jira/Datadog integrations.

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [flag.created, flag.updated, experiment.started, experiment.stopped]

rate_limit:
  tier: standard
  requests_per_second: 50
  burst: 100

actions:
  - name: toggleFlag
    description: Enable or disable a feature flag for an environment
    data_classes: [INTERNAL_ONLY]
  - name: updateTargetingRule
    description: Update the targeting rules for a flag
    data_classes: [INTERNAL_ONLY]
  - name: createFlag
    description: Create a new feature flag
    data_classes: [INTERNAL_ONLY]
  - name: getFlag
    description: Read current flag configuration
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
