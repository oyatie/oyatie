name: hubspot
display_name: HubSpot
category: crm
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage contacts, deals, companies, tickets, and marketing emails via HubSpot
  CRM API v3. Receive real-time CRM events via HubSpot Webhooks.
  Hyperscaler precedent: HubSpot App Marketplace (1000+ integrations).

auth:
  flows: [oauth2_pkce]
  token_rotation: true
  vendor_refresh_token_ttl_days: 180

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [contact.creation, contact.propertyChange, deal.creation, deal.propertyChange]

rate_limit:
  tier: standard
  requests_per_10s: 100
  burst: 150

actions:
  - name: createContact
    description: Create a HubSpot contact
    data_classes: [PII_EMAIL, PII_PHONE, CRM_RECORD]
  - name: updateDeal
    description: Update a deal's properties
    data_classes: [CRM_RECORD, FINANCIAL_PIPELINE]
  - name: createNote
    description: Create a CRM note on a contact or deal
    data_classes: [CRM_RECORD]
  - name: listContacts
    description: List contacts with optional filters
    data_classes: [PII_EMAIL, CRM_RECORD]
  - name: associateObjects
    description: Associate two CRM objects (e.g. contact + deal)
    data_classes: [CRM_RECORD]

compliance:
  pii_fields: [contact.properties.email, contact.properties.phone, contact.properties.firstname, contact.properties.lastname]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
