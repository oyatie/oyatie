name: dropbox
display_name: Dropbox
category: storage
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Upload, download, share files and manage folders via Dropbox API v2.
  Receive file/folder change events via Dropbox webhooks.
  Hyperscaler precedent: Zapier Dropbox integration; Boomi Dropbox connector.

auth:
  flows: [oauth2_pkce]
  token_rotation: true

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [file.change]

rate_limit:
  tier: standard
  requests_per_second: 50
  burst: 100

actions:
  - name: uploadFile
    description: Upload a file to Dropbox
    data_classes: [TENANT_FILE_DATA]
  - name: downloadFile
    description: Download a file from Dropbox
    data_classes: [TENANT_FILE_DATA]
  - name: createSharedLink
    description: Create a shared link for a file
    data_classes: [TENANT_FILE_DATA]
  - name: listFolder
    description: List files in a folder
    data_classes: [TENANT_FILE_DATA]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
