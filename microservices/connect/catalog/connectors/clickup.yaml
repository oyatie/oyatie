name: clickup
display_name: ClickUp
category: project-management
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage tasks, lists, spaces, and comments via ClickUp REST API v2.
  Receive task and list change events via ClickUp Webhooks.
  Hyperscaler precedent: Zapier ClickUp integration; n8n ClickUp node.

auth:
  flows: [oauth2_pkce, personal_access_token]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [taskCreated, taskUpdated, taskStatusUpdated, taskAssigneeUpdated]

rate_limit:
  tier: standard
  requests_per_minute: 100
  burst: 200

actions:
  - name: createTask
    description: Create a task in a list
    data_classes: [INTERNAL_ONLY]
  - name: updateTaskStatus
    description: Change the status of a task
    data_classes: [INTERNAL_ONLY]
  - name: addComment
    description: Add a comment to a task
    data_classes: [INTERNAL_ONLY]
  - name: listTasks
    description: List tasks in a list with filters
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [assignees[].email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
