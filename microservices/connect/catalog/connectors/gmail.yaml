name: gmail
display_name: Gmail (Google Workspace)
category: email
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send, read, and manage Gmail messages and threads via Gmail API v1.
  Receive real-time new-email events via Gmail Push Notifications (Google Pub/Sub).
  Hyperscaler precedent: Zapier Gmail integration (most-used email connector).

auth:
  flows: [oauth2_pkce]
  token_rotation: true
  vendor_refresh_token_ttl_days: unlimited

webhook:
  supported: true
  method: google_pubsub_push
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [message.received]

rate_limit:
  tier: standard
  daily_quota_units: 1000000000
  requests_per_100s: 250

actions:
  - name: sendEmail
    description: Send an email from the authenticated account
    data_classes: [PII_EMAIL, MESSAGING_CONTENT]
  - name: readThread
    description: Read a full email thread
    data_classes: [PII_EMAIL, MESSAGING_CONTENT]
  - name: listMessages
    description: List messages matching a query
    data_classes: [PII_EMAIL]
  - name: createLabel
    description: Create a Gmail label
    data_classes: [INTERNAL_ONLY]
  - name: addLabel
    description: Apply a label to messages
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [message.payload.headers[To], message.payload.headers[From], message.payload.headers[Subject]]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc
  sensitive_content_dlp_required: true

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
