name: asana
display_name: Asana
category: project-management
publisher_namespace: oyatie
version: "1.3.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create tasks, projects, and sections; manage assignments and comments via
  Asana REST API. Receive real-time task and project events via Asana Webhooks.
  Hyperscaler precedent: Zapier Asana integration; n8n Asana node.

auth:
  flows: [oauth2_pkce, personal_access_token]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [task.created, task.changed, project.created, story.created]

rate_limit:
  tier: standard
  requests_per_minute: 1500
  burst: 3000

actions:
  - name: createTask
    description: Create a new Asana task
    data_classes: [INTERNAL_ONLY]
  - name: updateTask
    description: Update task properties
    data_classes: [INTERNAL_ONLY]
  - name: listTasks
    description: List tasks in a project
    data_classes: [INTERNAL_ONLY]
  - name: addTaskToProject
    description: Add an existing task to a project
    data_classes: [INTERNAL_ONLY]
  - name: createComment
    description: Add a comment (story) to a task
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [task.assignee.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
