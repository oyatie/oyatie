name: opsgenie
display_name: OpsGenie (Atlassian)
category: incident-management
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Trigger, acknowledge, and close OpsGenie alerts and incidents via OpsGenie REST API v2.
  Receive alert events via OpsGenie Webhooks.
  CRITICAL: Like PagerDuty, OpsGenie alert triggers are emergency-services adjacent;
  MUST NOT be throttled during incident surges.

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [alert.created, alert.acknowledged, alert.closed, alert.escalated]

rate_limit:
  tier: high
  requests_per_minute: 3600
  burst: 7200
  emergency_services_bypass: true

actions:
  - name: createAlert
    description: Create an OpsGenie alert (EMERGENCY_SERVICES adjacent)
    data_classes: [INCIDENT_METADATA]
    emergency_services_class: true
  - name: acknowledgeAlert
    description: Acknowledge an alert
    data_classes: [INCIDENT_METADATA]
  - name: closeAlert
    description: Close an alert
    data_classes: [INCIDENT_METADATA]
  - name: listOnCallParticipants
    description: List on-call participants for a schedule
    data_classes: [PII_EMAIL, PII_PHONE]

compliance:
  pii_fields: [responders[].username, note]
  pii_excluded_from_dlq: false
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

critical_path:
  emergency_services_adjacent: true
  never_throttle: true
  dlq_alert_threshold: 1
  note: "OpsGenie alert triggers must not be throttled; secondary alert if DLQ depth > 0"

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
