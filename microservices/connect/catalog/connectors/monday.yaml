name: monday
display_name: Monday.com
category: project-management
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Create and manage boards, items, and subitems via Monday.com GraphQL API v2.
  Receive real-time item change events via Monday.com Webhooks.
  Hyperscaler precedent: Zapier Monday.com integration; n8n Monday.com node.

auth:
  flows: [oauth2_pkce, personal_access_token]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [item_created, item_updated, status_changed, date_arrived]

rate_limit:
  tier: standard
  requests_per_minute: 5000
  burst: 10000

actions:
  - name: createItem
    description: Create an item on a board
    data_classes: [INTERNAL_ONLY]
  - name: updateItem
    description: Update column values on an item
    data_classes: [INTERNAL_ONLY]
  - name: createSubitem
    description: Create a subitem under an item
    data_classes: [INTERNAL_ONLY]
  - name: moveItemToGroup
    description: Move an item to a different group
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [creator.email, assignee.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
