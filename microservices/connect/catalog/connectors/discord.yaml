name: discord
display_name: Discord
category: messaging
publisher_namespace: oyatie
version: "1.2.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send messages to Discord channels, manage server members, and receive real-time
  gateway events via Discord Bot API and Webhooks.
  Hyperscaler precedent: Discord's Zapier integration; n8n Discord node.

auth:
  flows: [oauth2_pkce, bot_token]
  token_rotation: false

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [MESSAGE_CREATE, GUILD_MEMBER_ADD, INTERACTION_CREATE]

rate_limit:
  tier: standard
  requests_per_second: 50
  burst: 100
  global_rate_limit: 50

actions:
  - name: sendChannelMessage
    description: Send a message to a Discord channel
    data_classes: [TENANT_MESSAGING_CONTENT]
  - name: createWebhookMessage
    description: Post via Discord Incoming Webhook
    data_classes: [TENANT_MESSAGING_CONTENT]
  - name: listGuildMembers
    description: List members of a Discord guild
    data_classes: [PII_USERNAME]
  - name: addGuildMemberRole
    description: Assign a role to a guild member
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [author.email, member.user.email]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-br]
  gdpr_schrems_ii_mechanism: scc
  minor_protection: required
  note: "Discord has significant minor user population; pack-eu minor-protection overlay mandatory"

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
