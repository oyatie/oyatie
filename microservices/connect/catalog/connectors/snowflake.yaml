name: snowflake
display_name: Snowflake
category: data-warehouse
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Execute SQL queries, load data via COPY INTO, manage streams and tasks via
  Snowflake SQL API v2 and Snowpipe. No webhook support; polling-based triggers.
  Hyperscaler precedent: Fivetran Snowflake connector; dbt Cloud Snowflake integration.

auth:
  flows: [key_pair_byok, oauth2_pkce]
  token_rotation: false
  key_pair_rotation_recommended_days: 365

webhook:
  supported: false
  note: "Snowflake does not support outbound webhooks; use Snowflake streams + task polling."

rate_limit:
  tier: enterprise
  warehouse_concurrency: configurable
  concurrent_queries_per_warehouse: 8

actions:
  - name: executeQuery
    description: Execute a SQL query and return results
    data_classes: [TENANT_DATA_WAREHOUSE]
  - name: copyIntoTable
    description: Load data from staged files into a table via COPY INTO
    data_classes: [TENANT_DATA_WAREHOUSE]
  - name: createStream
    description: Create a Snowflake stream on a table for CDC
    data_classes: [INTERNAL_ONLY]
  - name: listDatabases
    description: List available databases in the account
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
