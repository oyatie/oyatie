name: datadog
display_name: Datadog
category: observability
publisher_namespace: oyatie
version: "1.5.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Submit custom metrics, create monitor alerts, manage incidents, and receive
  real-time alert events via Datadog API v2 and Webhooks.
  Hyperscaler precedent: Datadog's own integration marketplace (800+ integrations).
  CRITICAL: Datadog monitor alerts may be emergency-services adjacent (infra alerts
  feeding PagerDuty); connector must not be throttled during alert storms.

auth:
  flows: [api_key_byok]
  token_rotation: false
  api_key_rotation_recommended_days: 90

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [alert.triggered, alert.recovered, incident.created, monitor.status_changed]

rate_limit:
  tier: high
  requests_per_second: 300
  burst: 600

actions:
  - name: submitMetrics
    description: Submit custom metrics to Datadog
    data_classes: [TELEMETRY]
  - name: createMonitor
    description: Create a new Datadog monitor
    data_classes: [INTERNAL_ONLY]
  - name: createEvent
    description: Post a custom event to the Datadog event stream
    data_classes: [INTERNAL_ONLY]
  - name: listAlerts
    description: List triggered monitor alerts
    data_classes: [INTERNAL_ONLY]
  - name: createIncident
    description: Declare a Datadog incident
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: []
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

critical_path:
  emergency_services_adjacent: true
  note: "Alert events feeding PagerDuty MUST not be throttled during incident surges"

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
