name: google-drive
display_name: Google Drive
category: storage
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Upload, download, manage files and folders via Google Drive API v3.
  Receive real-time file change events via Google Drive push notifications.
  Hyperscaler precedent: Zapier Google Drive integration; Boomi Google Drive connector.

auth:
  flows: [oauth2_pkce]
  token_rotation: true
  vendor_refresh_token_ttl_days: unlimited

webhook:
  supported: true
  method: google_drive_push_notifications
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [file.create, file.update, file.delete, folder.create]

rate_limit:
  tier: standard
  requests_per_100s_per_user: 100
  requests_per_100s: 1000

actions:
  - name: uploadFile
    description: Upload a file to Google Drive
    data_classes: [TENANT_FILE_DATA]
  - name: downloadFile
    description: Download a file from Google Drive
    data_classes: [TENANT_FILE_DATA]
  - name: createFolder
    description: Create a new folder
    data_classes: [INTERNAL_ONLY]
  - name: shareFile
    description: Share a file with specific users
    data_classes: [PII_EMAIL, TENANT_FILE_DATA]
  - name: listFiles
    description: List files with query filter
    data_classes: [TENANT_FILE_DATA]

compliance:
  pii_fields: [file.owners[].emailAddress, permission.emailAddress]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: true

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
