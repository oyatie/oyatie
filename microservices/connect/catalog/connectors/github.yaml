name: github
display_name: GitHub
category: developer-tools
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Manage repositories, issues, pull requests, and CI checks via GitHub REST API v3
  and GraphQL API v4. Receive repository events via GitHub Webhooks.
  Hyperscaler precedent: GitHub Actions marketplace; Zapier GitHub integration.

auth:
  flows: [oauth2_pkce, github_app, pat_token]
  token_rotation: true
  vendor_refresh_token_ttl_days: 365

webhook:
  supported: true
  signing_algorithm: hmac-sha256
  replay_window_seconds: 300
  events: [push, pull_request, issues, workflow_run, check_run]

rate_limit:
  tier: standard
  requests_per_minute: 60
  authenticated_requests_per_hour: 5000
  burst: 120

actions:
  - name: createIssue
    description: Create a GitHub issue
    data_classes: [INTERNAL_ONLY]
  - name: createPullRequest
    description: Open a pull request
    data_classes: [INTERNAL_ONLY]
  - name: listRepositories
    description: List repositories for the authenticated user or org
    data_classes: [INTERNAL_ONLY]
  - name: addIssueComment
    description: Add a comment to an issue
    data_classes: [INTERNAL_ONLY]
  - name: triggerWorkflow
    description: Trigger a GitHub Actions workflow dispatch event
    data_classes: [INTERNAL_ONLY]

compliance:
  pii_fields: [committer.email, author.email, user.login]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: us
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
