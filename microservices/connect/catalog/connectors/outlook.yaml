name: outlook
display_name: Microsoft Outlook (Microsoft 365)
category: email
publisher_namespace: oyatie
version: "2.0.0"
status: active
security_review_attested: true
sbom_provided: true
sunset_notice_issued: false

description: |
  Send, read, and manage Outlook emails, calendar events, and contacts via
  Microsoft Graph API v1.0. Receive real-time change notifications via
  Microsoft Graph webhooks (change notifications).
  Hyperscaler precedent: Microsoft Power Automate Outlook connector.

auth:
  flows: [oauth2_pkce, client_credentials]
  token_rotation: true
  vendor_access_token_ttl_seconds: 3600

webhook:
  supported: true
  signing_algorithm: microsoft-graph-validation-token
  replay_window_seconds: 300
  events: [message.received, event.created, contact.updated]

rate_limit:
  tier: standard
  service_limit_requests_per_10s: 10000
  burst: 20000

actions:
  - name: sendEmail
    description: Send an email via Microsoft Graph /sendMail
    data_classes: [PII_EMAIL, MESSAGING_CONTENT]
  - name: listMessages
    description: List inbox messages with filter
    data_classes: [PII_EMAIL, MESSAGING_CONTENT]
  - name: createCalendarEvent
    description: Create a calendar event and invite attendees
    data_classes: [PII_EMAIL, CALENDAR_DATA]
  - name: createContact
    description: Create an Outlook contact
    data_classes: [PII_EMAIL, PII_PHONE]

compliance:
  pii_fields: [message.from.emailAddress.address, message.toRecipients[].emailAddress.address, attendees[].emailAddress.address]
  pii_excluded_from_dlq: true
  pack_allow_list: [pack-eu, pack-us, pack-kr, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
  hipaa_baa_available: true
  gdpr_schrems_ii_mechanism: scc

data_residency:
  vendor_data_region: configurable
  tenant_can_pin_region: true
  cross_border_transfer_ok: true
  pack_cn_blocked: false

catalog_record_binding_adr: ADR-0249
last_security_review: 2026-05-20
