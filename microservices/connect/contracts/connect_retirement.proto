syntax = "proto3";

package oyatie.connect.retirement.v1;

service ConnectRetirement {
  rpc GetRetirementStatus(RetirementStatusRequest) returns (RetirementStatusResponse);
}

message RetirementStatusRequest {
  string tenant_id = 1;
}

message RetirementStatusResponse {
  string status = 1;
  repeated string subservice_ids = 2;
  string retirement_plan_ref = 3;
  string audit_event = 4;
}
