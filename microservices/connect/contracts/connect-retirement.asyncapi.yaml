asyncapi: 3.1.0
info:
  title: Connect Retirement Events
  version: 0.1.0
channels:
  connectRetirementEvents:
    address: oya.connect.retirement.events
    messages:
      statusChanged:
        $ref: '#/components/messages/RetirementStatusChanged'
operations:
  publishRetirementStatus:
    action: send
    channel:
      $ref: '#/channels/connectRetirementEvents'
components:
  messages:
    RetirementStatusChanged:
      payload:
        type: object
        required: [status, subservice_id, evidence_ref]
        properties:
          status:
            type: string
          subservice_id:
            type: string
          evidence_ref:
            type: string
