openapi: 3.2.0
info:
  title: Customer Relationship Management API
  version: 1.0.0
  summary: SAP CRM parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/crm
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP CRM Customer Relationship Management"
  - "Oracle Fusion Sales and Service"
  - "Workday customer and service-workflow counterpart"
  - "NetSuite CRM"
  - "Microsoft Dynamics 365 Customer Engagement"
paths:
  /v1/crm/account-master:
    post:
      summary: Create or amend Customer Relationship Management account-master
      operationId: crm_account_master_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountMasterCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/crm/opportunity:
    post:
      summary: Create or amend Customer Relationship Management opportunity
      operationId: crm_opportunity_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/crm/quote:
    post:
      summary: Create or amend Customer Relationship Management quote
      operationId: crm_quote_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/crm/service-case:
    post:
      summary: Create or amend Customer Relationship Management service-case
      operationId: crm_service_case_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCaseCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/crm/campaign:
    post:
      summary: Create or amend Customer Relationship Management campaign
      operationId: crm_campaign_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/crm/loyalty-ledger:
    post:
      summary: Create or amend Customer Relationship Management loyalty-ledger
      operationId: crm_loyalty_ledger_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyLedgerCommand"
      responses:
        "202":
          description: Accepted with signed audit event
components:
  schemas:
    AccountMasterCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    OpportunityCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    QuoteCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
