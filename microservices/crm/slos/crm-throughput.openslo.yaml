apiVersion: openslo/v1
kind: SLO
metadata:
  name: crm-throughput
  labels:
    service: crm
    sap_code: "CRM"
spec:
  description: "Customer Relationship Management crm-throughput objective; benchmarks SAP CRM Customer Relationship Management | Oracle Fusion Sales and Service | Workday customer and service-workflow counterpart | NetSuite CRM | Microsoft Dynamics 365 Customer Engagement"
  service: crm
  indicator:
    metadata:
      name: crm-throughput-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_crm_accepted_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_crm_received_total[5m]))"
  objectives:
    - displayName: crm-throughput
      target: 0.995
