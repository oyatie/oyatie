apiVersion: openslo/v1
kind: SLO
metadata:
  name: account-master-success-rate
  labels:
    service: crm
    sap_code: "CRM"
spec:
  description: "Customer Relationship Management account-master-success-rate objective; benchmarks SAP CRM Customer Relationship Management | Oracle Fusion Sales and Service | Workday customer and service-workflow counterpart | NetSuite CRM | Microsoft Dynamics 365 Customer Engagement"
  service: crm
  indicator:
    metadata:
      name: account-master-success-rate-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_crm_account_master_success_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_crm_account_master_attempt_total[5m]))"
  objectives:
    - displayName: account-master-success-rate
      target: 0.999
