schema_version: "2.0"
name: crm-quote-export
microservice: crm
bounded_context: quote
autonomy_tier: T1
risk_class: regulated-erp
audit_event_class: EVT-CRM-QUOTE-EXPORT
policy_fragments:
  - microservices/crm/policy/quote-authorization.cedar
benchmarks:
  - "SAP CRM Customer Relationship Management"
  - "Oracle Fusion Sales and Service"
  - "Workday customer and service-workflow counterpart"
  - "NetSuite CRM"
  - "Microsoft Dynamics 365 Customer Engagement"
inputs:
  required: [tenant_id, principal_id, idempotency_key, compliance_packs]
transport:
  rest: OpenAPI 3.2.0
  events: AsyncAPI 3.1.0
  grpc: proto3
settlement_boundary: marketplace-settles-tenant-deals-per-ADR-0314
