[package]
name = "oya-crm-revenue-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the CRM revenue application surface."

[package.metadata.oya]
microservice = "crm"
title = "CRM"
bounded_context = "front-office-revenue"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-crm + council-product"
data_classification = "tenant-scoped customer and revenue records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/crm-v1.proto"

[lib]
name = "oya_crm_revenue_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-crm-revenue"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
