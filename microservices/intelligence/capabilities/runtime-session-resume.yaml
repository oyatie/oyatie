# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-runtime:session-resume:v1
name: session-resume
namespace: foundry-runtime
display_name: Resume Session
description: |
  Resume an existing session by session_id. Validates the principal's tenant matches the
  session's owning tenant (Cedar tenant-scope). Restores conversation history + scratchpad
  from Valkey hot tier; on cache miss, falls back to Postgres cold restore (cold-load budget
  p99 ≤100ms per PRD performance targets).

owner_team: axis-foundry-runtime
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0025, ADR-0131]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-runtime.yaml
  - microservices/intelligence/policy/runtime-isolation.md

autonomy_level: T1
# T1 = read own-tenant session.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: session_id
    type: string
    pattern: '^[0-9A-Z]{26}$'
    required: true

outputs:
  - name: session_id
    type: string
  - name: tenant_id
    type: string
  - name: opened_at
    type: timestamp
  - name: last_active_at
    type: timestamp
  - name: status
    type: enum
    values: [active, evicted, terminated, soft_deleted]
  - name: turn_count
    type: integer
  - name: scratchpad_size_bytes
    type: integer
  - name: cold_restore_occurred
    type: boolean
    description: true if Valkey miss → Postgres restore happened
  - name: signature
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING       # when conversation history carries user identifiers
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_PIPA_ART23  # hashed tenant id

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-runtime.session.resumed

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Valkey MGET on tenant-prefixed session key (cache hit) OR
    - Postgres SELECT on session_mutation_log + replay (cache miss)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/session-resume-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: hot-read-p99-≤10ms AND cold-restore-p99-≤100ms AND cross-tenant-refusal-correctness
  cadence: per-release
  reference: PRD §"Performance" targets

sunset:
  status: none
  notes: ""
