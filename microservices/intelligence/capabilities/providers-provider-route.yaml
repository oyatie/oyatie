# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-providers:provider-route:v1
name: provider-route
namespace: foundry-providers
display_name: Route a Provider Request (decide only)
description: |
  Compute the router decision for a given (tenant, capability_profile,
  constraints) tuple without invoking the upstream provider. Returns a
  RouterDecision with the selected vendor, transport, region, candidate
  set, and reason. Used by tenant-config validation, dry-run rollouts,
  and explainability surfaces.

owner_team: axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0025, ADR-0028, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/provider-router.yaml
  - microservices/intelligence/contracts/proto/provider-invoke.proto
  - microservices/intelligence/policy/provider-router-tenant-scope.cedar

autonomy_level: T1
# T1 = read-only metadata; no sensitive data touched; no audit-chain write
# beyond a RouterDecided event (which contains no prompt bytes).

inputs:
  - name: tenant_id
    type: string
    required: true
  - name: pack
    type: enum
    values: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
    required: true
  - name: capability_profile
    type: object
    required: true
  - name: request_fingerprint
    type: string
    description: "BLAKE3 hex of (system_prompt + user_prompt); no prompt bytes"
    required: true
  - name: constraints
    type: object
    required: false

outputs:
  - name: decision_id
    type: string
  - name: selected_vendor
    type: enum
    values: [anthropic, openai, gemini, in-house]
  - name: selected_transport
    type: enum
    values: [api, subscription, in-house]
  - name: selected_region
    type: string
  - name: residency_compliant
    type: boolean
  - name: reason
    type: string
  - name: candidate_set
    type: array

data_classes_touched:
  - BEHAVIORAL_AI_USAGE  # request fingerprint + capability profile
  - AUDIT                # RouterDecided emission

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry.providers.router-decided

cost_profile:
  type: per-decision
  estimated_cost_usd_per_call: 0.0000001
  cost_drivers:
    - In-process router decision (Valkey token-bucket read + provider-config read + Cedar evaluate)

cedar_policy_fragments:
  - microservices/intelligence/policy/provider-router-tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/provider-route-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: decision-correctness-against-residency-and-capability-rules
  cadence: per-release
  reference: data-residency.md matrix + capability-fit weighting

sunset:
  status: none
  notes: ""
