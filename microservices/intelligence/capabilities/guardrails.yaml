# Canonical-base: specs/capabilities/canonical-tier-schema.json
id: cap:intelligence:guardrails:v1
name: guardrails
namespace: intelligence
display_name: Guardrails (refusal-baseline + EU AI Act Annex III + per-pack overlays)
description: |
  Pre- and post-call content classification + refusal-baseline application + EU AI Act
  Annex III refusal layer + per-pack refusal-floor overlays + abuse-defence integration.

owner_team: council-privacy + axis-intelligence + ops-security
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0255, ADR-0250, ADR-0251]

autonomy_tier: T2
eu_ai_act_risk_class: high
# Guardrails capability itself is high-risk: it makes refusal decisions that affect rights.
# Gated via 2-person-rule on Cedar fragment mutation + multispectrum review.

inputs:
  - name: dispatch_envelope
    type: object
    required: true
  - name: provider_response
    type: object
    required: false   # null on pre-call

outputs:
  - name: refusal_decision
    type: object
    schema: RefusalDecision

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - PII_SENSITIVE
  - PHI
  - SENSITIVE_PIPA_ART23
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-federal
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa
  - pack-cn
  - pack-uk

evidence_topic: intelligence/dispatch.refused

cost_profile:
  type: per-classification
  estimated_cost_usd_per_call: 0.0002
  cost_drivers:
    - classifier model inference (small; on-substrate)

cedar_policy_fragments:
  - microservices/intelligence/policy/refusal-baseline.cedar
  - microservices/intelligence/policy/eu-ai-act-high-risk.cedar
  - microservices/intelligence/policy/abuse-defence.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/guardrails-canonicalen.jsonl
  pass_threshold: 0.99
  eval_metric: refusal-floor-coverage-and-false-positive-rate
  cadence: per-release + weekly + per-Cedar-mutation

sunset:
  status: none
