# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-supervisor:deploy-capability:v1
name: deploy-capability
namespace: foundry-supervisor
display_name: Deploy a Tenant Capability
description: |
  Admit a tenant-authored capability definition; validate against schema + autonomy-ceiling
  + cost budget; initiate canary rollout (1 % → 10 % → 50 % → 100 %); gate phase
  advances on observability `EligibilityChanged` verdict per ADR-0139.

owner_team: axis-foundry-control-plane
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0024, ADR-0139, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/foundry-supervisor-control-plane.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-supervisor.yaml
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_level: T2
# T2 = read-only sensitive data + write to ledger; not destructive

inputs:
  - name: tenant
    type: string
    pattern: '^tenant_[a-f0-9]{16}$'
    required: true
  - name: capability_id
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: capability_yaml
    type: bytes
    required: true
    description: OpenSLO-style YAML; validated against capability v1 schema
  - name: actor
    type: string
    required: true
    description: PR-author identity (SPIFFE or OIDC)

outputs:
  - name: deployment_id
    type: string
    format: ulid
  - name: initial_rollout_phase
    type: enum
    values: [admitted]
  - name: signature
    type: string
    description: Ed25519 signature by supervisor controller

data_classes_touched:
  - INTERNAL_ONLY     # capability YAML text
  - BEHAVIORAL_TENANT_PRODUCT  # deployment metadata
  - AUDIT             # admit event is an audit-chain record

regulatory_packs_consumed:
  - oya-pack-kr
  - oya-pack-eu
  - oya-pack-us
  - oya-pack-us-healthcare
  - oya-pack-jp
  - oya-pack-sg
  - oya-pack-au
  - oya-pack-in
  - oya-pack-br
  - oya-pack-ae
  - oya-pack-ksa

evidence_topic: oya.foundry.supervisor.capability.deployed
# Emits to audit-chain evidence-topic stream per Bominal ADR-0028.

cost_profile:
  type: per-deployment
  estimated_cost_usd_per_call: 0.001
  cost_drivers:
    - Postgres write (deployment row + capability version row)
    - Cedar fragment evaluation
    - Ed25519 signing

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/deploy-capability-baseline.jsonl
  pass_threshold: 0.99
  eval_metric: schema-validation-correctness + autonomy-ceiling-enforcement
  cadence: per-release

sunset:
  status: none
  notes: ""
