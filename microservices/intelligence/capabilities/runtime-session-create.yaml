# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-runtime:session-create:v1
name: session-create
namespace: foundry-runtime
display_name: Create Session
description: |
  Create a new session for multi-turn capability invocation. Returns a session_id; the session
  carries the tenant_id, jurisdiction (pack), and an initial empty scratchpad. Subsequent
  capability-execute calls referencing this session_id will read/write its conversation history
  + scratchpad atomically through SessionStore.

owner_team: axis-foundry-runtime
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0025, ADR-0117, ADR-0131]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-runtime.yaml
  - microservices/intelligence/policy/data-residency.md

autonomy_level: T1
# T1 = read-only metadata + write to own tenant scope; lower tier than T2 capability-execute.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: jurisdiction_hint
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
    required: false
    description: |
      Advisory; the runtime resolves the canonical jurisdiction from tenancy µservice's
      tenant_jurisdiction record. Cross-pack session creation is refused per
      policy/data-residency.md.
  - name: initial_metadata
    type: object
    required: false
  - name: ttl_hours
    type: integer
    minimum: 1
    maximum: 168
    default: 24

outputs:
  - name: session_id
    type: string
  - name: opened_at
    type: timestamp
  - name: jurisdiction
    type: enum
    values: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
  - name: signature
    type: string

data_classes_touched:
  - INTERNAL_ONLY        # session id is internal-only at this layer
  - SENSITIVE_PIPA_ART23 # hashed tenant id

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-runtime.session.created

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Valkey SET on tenant-prefixed key
    - Postgres INSERT on session_mutation_log

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/session-create-baseline.jsonl
  pass_threshold: 1.0
  eval_metric: session-creation-success-rate AND cross-pack-refusal-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
