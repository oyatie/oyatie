# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-supervisor:query-fleet-state:v1
name: query-fleet-state
namespace: foundry-supervisor
display_name: Query Tenant Fleet State
description: |
  Read the current per-tenant fleet state (agent count, healthy count, draining count,
  per-capability slices) for promotion-readiness checks, tenant dashboards, and reviewer-agent
  consumption.

owner_team: axis-foundry-control-plane
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0139, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/foundry-supervisor-control-plane.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-supervisor.yaml
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_level: T1
# T1 = read-only operational data; non-destructive

inputs:
  - name: tenant
    type: string
    pattern: '^tenant_[a-f0-9]{16}$'
    required: true

outputs:
  - name: fleet_state
    type: object
    schema: FleetState (per openapi/foundry-supervisor.yaml)
  - name: snapshot_at
    type: timestamp
  - name: evaluator_version
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT

regulatory_packs_consumed:
  - oya-pack-kr
  - oya-pack-eu
  - oya-pack-us
  - oya-pack-us-healthcare
  - oya-pack-jp
  - oya-pack-sg
  - oya-pack-au
  - oya-pack-in
  - oya-pack-br
  - oya-pack-ae
  - oya-pack-ksa

evidence_topic: ""  # read-only; no audit-chain event emitted

cost_profile:
  type: per-query
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - Postgres read (with RLS scope) — cached in Valkey materialized view

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/auditor-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/query-fleet-state-baseline.jsonl
  pass_threshold: 0.999
  eval_metric: snapshot-freshness-≤-30s + tenant-isolation-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
