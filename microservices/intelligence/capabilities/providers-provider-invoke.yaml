# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-providers:provider-invoke:v1
name: provider-invoke
namespace: foundry-providers
display_name: Invoke a Provider
description: |
  Compose the router decision with adapter dispatch into a single call.
  Returns the provider's response along with the audit-chain evidence_ref
  (the ProviderInvoked event reference) and the Ed25519-signed envelope
  covering (request_hash, response_hash, metadata).

owner_team: axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0025, ADR-0026, ADR-0028, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/provider-router.yaml
  - microservices/intelligence/contracts/proto/provider-invoke.proto
  - microservices/intelligence/policy/provider-router-tenant-scope.cedar
  - microservices/intelligence/policy/credential-isolation.md

autonomy_level: T2
# T2 = read sensitive data (prompts include PII per DPIA) + write to audit-chain (ProviderInvoked event)
# Per ADR-0022 autonomy tiers (Bominal-inherited).

inputs:
  - name: tenant_id
    type: string
    pattern: '^[a-z][a-z0-9-]*$'
    required: true
  - name: pack
    type: enum
    values: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
    required: true
  - name: capability_profile
    type: object
    schema: CapabilityProfile (per openapi)
    required: true
  - name: prompt
    type: object
    schema: Prompt (per openapi)
    required: true
  - name: constraints
    type: object
    schema: RoutingConstraints (per openapi)
    required: false

outputs:
  - name: decision_id
    type: string
  - name: response
    type: object
    schema: ProviderResponseBody
  - name: evidence_ref
    type: string
  - name: request_hash
    type: string
  - name: response_hash
    type: string
  - name: envelope_signature
    type: string
  - name: cost_usd
    type: number
  - name: latency_ms
    type: number

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_GDPR_ART9  # conditional pack-us-healthcare / pack-eu
  - SENSITIVE_PIPA_ART23 # conditional pack-kr
  - AUTH_CREDENTIAL      # resolved in-process; never persisted by this capability
  - AUDIT                # ProviderInvoked emission

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry.providers.invocation

cost_profile:
  type: per-invocation
  estimated_cost_usd_per_call: variable_by_vendor_and_token_count
  cost_drivers:
    - Upstream vendor cost-per-1K-tokens
    - In-process router decision (negligible; ≤ $0.0000001)
    - OpenBao credential resolution (negligible)

cedar_policy_fragments:
  - microservices/intelligence/policy/provider-router-tenant-scope.cedar
  - microservices/intelligence/policy/openbao-credential.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/provider-invoke-baseline.jsonl
  pass_threshold: 0.95
  eval_metric: response-shape-conformance + cost-within-bounds + latency-within-budget
  cadence: per-release
  reference: Per-vendor docs (Anthropic / OpenAI / Google); ADR-0026 in-house parity baseline

sunset:
  status: none
  notes: ""
