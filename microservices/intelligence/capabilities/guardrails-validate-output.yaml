# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-guardrails:validate-output:v1
name: validate-output
namespace: foundry-guardrails
display_name: Validate Provider Output
description: |
  Validate a candidate provider output (post-invocation) against the foundry-guardrails
  output-validator ensemble: data-exfiltration detector, secret-leak detector (regex +
  entropy + known-secret-pattern), hallucinated-tool-args detector, AI-slop detector,
  content-safety detectors. Returns verdict (allow / block / redact) + redaction_diff
  when redaction applied.

owner_team: axis-foundry-guardrails
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/agent-operating-contract.json]
related_artifacts:
  - microservices/intelligence/contracts/openapi/guardrails.yaml
  - microservices/intelligence/policy/guardrail-enforcement.md

autonomy_level: T2

inputs:
  - name: output_text
    type: string
    required: true
    max_length: 10485760  # 10MB
  - name: tool_args
    type: object
    required: false
  - name: tenant_id_hashed
    type: string
    required: true
  - name: invocation_id
    type: string
    required: true
  - name: original_prompt_hash
    type: string
    required: false

outputs:
  - name: verdict
    type: enum
    values: [allow, block, redact]
  - name: block_reason
    type: enum
    nullable: true
  - name: redaction_diff
    type: object
    nullable: true
  - name: detector_versions
    type: object
  - name: evaluated_at
    type: timestamp
  - name: audit_chain_id
    type: string

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PHI
  - SECRET            # when leak detected
  - INTERNAL_ONLY
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-guardrails.decision.validate

cost_profile:
  type: per-validation
  estimated_cost_usd_per_call: 0.0002
  cost_drivers:
    - Heuristic + secret-leak detector
    - Classifier-model inference (50% rate)
    - LLM-judge fallback (2% rate)
    - audit-chain seal

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/validate-output-baseline.jsonl
  pass_threshold: 0.95
  eval_metric: composite-recall-precision-against-baseline-fixtures
  cadence: per-release + per-classifier-model-rollout

sunset:
  status: none
  notes: ""
