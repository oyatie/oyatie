# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:intelligence:dispatch:v1
name: dispatch
namespace: intelligence
display_name: Dispatch (text + image + audio + video, single-shot + streaming)
description: |
  Issue a model call against one of 16 first-class providers. Library-first; the network surface
  is the opt-in fallback per ADR-0255 amendment.

owner_team: axis-intelligence
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0255, ADR-0255-amendment-library-first, ADR-0263, ADR-0296]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/intelligence-v1.yaml
  - microservices/intelligence/contracts/proto/intelligence-v1.proto
  - microservices/intelligence/policy/dispatch-authorization.cedar

autonomy_tier: T2
eu_ai_act_risk_class: limited
# Categories triggered as conditional high-risk only when annex_iii_categories field is non-empty;
# enforced via eu-ai-act-high-risk.cedar gate.

inputs:
  - name: envelope
    type: object
    schema: DispatchEnvelope (per openapi-intelligence-v1.yaml)
    required: true

outputs:
  - name: outcome
    type: object
    schema: DispatchOutcome (per openapi-intelligence-v1.yaml)

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - PII_SENSITIVE
  - PHI                     # pack-us-healthcare only via BAA
  - SENSITIVE_PIPA_ART23    # pack-kr only with consent grant
  - FINANCIAL
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-federal
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa
  - pack-cn
  - pack-uk

evidence_topic: intelligence/dispatch.completed
evidence_topics_secondary:
  - intelligence/dispatch.refused
  - intelligence/dispatch.failed
  - intelligence/audit-tap.committed

cost_profile:
  type: per-dispatch
  estimated_cost_usd_per_call: 0.005
  cost_drivers:
    - provider invocation cost
    - guardrails classifier inference
    - attribution citation rendering
    - audit-tap commit

cedar_policy_fragments:
  - microservices/intelligence/policy/dispatch-authorization.cedar
  - microservices/intelligence/policy/refusal-baseline.cedar
  - microservices/intelligence/policy/eu-ai-act-high-risk.cedar
  - microservices/intelligence/policy/byok-gating.cedar
  - microservices/intelligence/policy/abuse-defence.cedar
  - microservices/intelligence/policy/provider-routing.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/dispatch-canonicalen.jsonl
  pass_threshold: 0.95
  eval_metric: refusal-correctness-and-quality-vs-reference
  cadence: per-release + nightly

sunset:
  status: none
  notes: ""
