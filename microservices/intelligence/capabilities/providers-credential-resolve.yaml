# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-providers:credential-resolve:v1
name: credential-resolve
namespace: foundry-providers
display_name: Resolve a Provider Credential
description: |
  Resolve a SecretReference URI to a ResolvedCredential opaque value for
  use by an adapter pod. The capability NEVER exposes credential bytes
  to any caller other than the adapter that requested it; the
  ResolvedCredential value is dropped (zeroized) immediately after use.

  This capability is invoked exclusively by foundry-providers adapter pods
  via the OpenBao agent socket. It is NOT exposed on the public REST or
  gRPC surface; it is an internal capability and listed here for
  catalog completeness + audit visibility.

owner_team: ops-security + axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0025, ADR-0028, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/policy/credential-isolation.md
  - microservices/intelligence/policy/openbao-credential.cedar
  - microservices/intelligence/threat-model.md (T-01)

autonomy_level: T3
# T3 = privileged ops; credential resolution is the highest-sensitivity
# capability in the µservice; 2-person rule applies to rotation/revoke
# (per CI-INV-09).

inputs:
  - name: secret_reference
    type: string
    pattern: '^openbao://[a-z0-9-]+/[a-z0-9-]+/providers/[a-z0-9-]+/[a-z0-9-]+(\?version=\d+)?$'
    required: true
  - name: caller_spiffe_id
    type: string
    required: true
  - name: caller_decision_id
    type: string
    required: true

outputs:
  - name: lease_id
    type: string
  - name: lease_expires_at
    type: timestamp
  - name: resolved_credential
    type: opaque
    description: |
      In-process ResolvedCredential opaque value. NOT serialised,
      NOT loggable, NOT visible to any non-adapter caller. Implements
      Drop with zeroize per credential-isolation.md CI-INV-02.

data_classes_touched:
  - AUTH_CREDENTIAL      # the resolved credential (in-memory only)
  - AUDIT                # CredentialResolved emission

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry.providers.credential-resolved

cost_profile:
  type: per-resolution
  estimated_cost_usd_per_call: 0.00000001
  cost_drivers:
    - OpenBao agent local socket read (sub-ms with lease cache)

cedar_policy_fragments:
  - microservices/intelligence/policy/openbao-credential.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/credential-resolve-baseline.jsonl
  pass_threshold: 1.0
  eval_metric: zero-credential-byte-leak + correct-lease-binding + deny-on-cross-tenant
  cadence: per-release + per-quarter-red-team
  reference: credential-isolation.md CI-INV-01..CI-INV-10

sunset:
  status: none
  notes: ""
