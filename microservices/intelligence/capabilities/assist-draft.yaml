id: cap:intelligence:assist-draft:v1
name: assist-draft
namespace: intelligence
display_name: Draft Assistance
description: |
  Generate an advisory draft for a no-code builder or product workflow while
  preserving deterministic commit/apply controls outside the AI surface.

owner_team: axis-intelligence
maturity: scaffolded
created_at: 2026-05-18
related_adrs: [ADR-0215, ADR-0219, ADR-0220]
related_artifacts:
  - microservices/intelligence/contracts/openapi/intelligence.yaml
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_tier: T2
inputs:
  - name: principal_id
    type: string
    required: true
  - name: context_id
    type: string
    required: true
  - name: builder_surface
    type: string
    required: true
  - name: prompt
    type: string
    required: true

outputs:
  - name: draft_id
    type: string
  - name: suggested_patch
    type: object
  - name: refusal_reason
    type: string

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFYING
  - PII_SENSITIVE
  - FINANCIAL
  - HEALTH
  - AUDIT

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

evidence_topic: oya.intelligence.assist-draft.completed
eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/assist-draft-canonicalen.jsonl
  pass_threshold: 0.995
  eval_metric: context-bound-draft-refusal-correctness
  cadence: per-release
