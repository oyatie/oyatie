# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-eval:replay-execute:v1
name: replay-execute
namespace: foundry-eval
display_name: Replay Past Production Trace Against Candidate Route
description: |
  Execute a sampled past production invocation trace against a candidate
  provider route with deterministic-seed asserted; emit ReplayDivergence event
  when divergence ≥ 100ms tolerance per ADR-0024. Substrate of model-upgrade
  gating + drift detection.

owner_team: axis-foundry
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0023, ADR-0024, ADR-0026, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/asyncapi/eval-events.yaml
  - microservices/intelligence/policy/tenant-isolation.md
  - microservices/intelligence/runbooks/replay-divergence-investigation.md

autonomy_level: T2

inputs:
  - name: capability_id
    type: string
    required: true
  - name: sample_cohort
    type: enum
    values: [random, error-paths, high-traffic, recent-week, deterministic-seed-only]
    required: false
    default: deterministic-seed-only
  - name: candidate_route
    type: object
    schema: ProviderRoute
    required: true
  - name: max_samples
    type: integer
    minimum: 1
    maximum: 10000
    required: false
    default: 100
  - name: divergence_tolerance_ms
    type: integer
    required: false
    default: 100

outputs:
  - name: replay_session_id
    type: uuid
  - name: samples_executed
    type: integer
  - name: divergences_detected
    type: integer
  - name: max_divergence_ms
    type: integer
  - name: per_subject_dek_unwrap_count
    type: integer
  - name: signature
    type: bytes

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_QUASI_IDENTIFIER  # trace span attrs may carry quasi-identifiers from source µservice
  - PHI  # pack-us-healthcare; per-subject DEK envelope governs access
  - SENSITIVE_PIPA_ART23  # pack-kr; per-subject DEK envelope
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-eval.replay.divergence-detected

cost_profile:
  type: per-replay-sample
  estimated_cost_usd_per_sample: 0.005
  cost_drivers:
    - Provider model API token (candidate route invocation)
    - S3 GET (replay trace fetch)
    - KMS unwrap (per-subject DEK)
    - Divergence detection + audit emission

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/tenant-isolation.md

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/replay-execute-baseline.jsonl
  pass_threshold: 0.95
  eval_metric: divergence-tolerance-correctness
  cadence: per-release

sunset:
  status: none
  notes: ""
