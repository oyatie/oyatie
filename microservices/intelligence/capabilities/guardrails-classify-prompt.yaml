# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-guardrails:classify-prompt:v1
name: classify-prompt
namespace: foundry-guardrails
display_name: Classify Pre-Invocation Prompt
description: |
  Classify a candidate prompt (pre-invocation) against the foundry-guardrails ensemble
  (heuristic + classifier-model + LLM-judge fallback for ambiguous). Returns verdict
  (allow / block / redact) + block_reason + cedar_policy_ids + classifier_model_versions.
  The classification is the gate decision consumed by foundry-runtime's invocation
  orchestrator before dispatching to foundry-providers.

owner_team: axis-foundry-guardrails
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0131, ADR-0140 (retired per ADR-0145)]
related_specs: [/specs/agent-operating-contract.json]
related_artifacts:
  - microservices/intelligence/contracts/openapi/guardrails.yaml
  - microservices/intelligence/contracts/proto/guardrails.proto
  - microservices/intelligence/policy/guardrail-enforcement.md

autonomy_level: T2
# T2 = sensitive read + write to audit-chain ledger; per ADR-0022.

inputs:
  - name: prompt_text
    type: string
    required: true
    max_length: 10485760  # 10MB
  - name: tenant_id_hashed
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: capability_id
    type: string
    required: true
  - name: session_turn_count
    type: integer
    minimum: 0
    required: false
  - name: autonomy_level_claim
    type: enum
    values: [T0, T1, T2, T3, T4]
    required: true
  - name: invocation_id
    type: string
    pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'   # ULID
    required: true

outputs:
  - name: verdict
    type: enum
    values: [allow, block, redact]
  - name: block_reason
    type: enum
    values:
      - pii
      - phi
      - jailbreak_injection
      - content_safety_toxicity
      - content_safety_self_harm
      - content_safety_sexual
      - content_safety_violence
      - content_safety_minors
      - content_safety_hate
      - content_safety_weapons
      - content_safety_illegal
      - autonomy_level_exceeded
      - policy_deny
      - llm_judge_budget_exceeded
      - ai_slop
    nullable: true
  - name: cedar_policy_ids
    type: array
  - name: classifier_model_versions
    type: object
  - name: ensemble_score
    type: number
  - name: evaluated_at
    type: timestamp
  - name: audit_chain_id
    type: string
    description: Ed25519-sealed reference per Bominal ADR-0028

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING        # transient (in-memory only)
  - PHI                    # transient (pack-us-healthcare)
  - SENSITIVE_PIPA_ART23
  - INTERNAL_ONLY
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry-guardrails.decision.classify
# Every classify is audit-emitted per `policy/tenant-isolation.md` §"Audit Trail".

cost_profile:
  type: per-classification
  estimated_cost_usd_per_call: 0.0001
  cost_drivers:
    - Heuristic detector (~$0.000001)
    - Classifier-model inference ONNX (~$0.00005)
    - LLM-judge fallback (only when ambiguous; ~$0.001-$0.01 via foundry-providers; 5% rate)
    - Cedar evaluation (~$0.000001)
    - audit-chain seal (~$0.00001)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar
  - microservices/intelligence/policy/auditor-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/classify-prompt-baseline.jsonl
  pass_threshold: 0.95   # recall on jailbreak fixtures + precision on legitimate
  eval_metric: composite-recall-precision-against-baseline-fixtures
  cadence: per-release + per-classifier-model-rollout
  reference: MITRE ATLAS + OWASP LLM Top 10 (2025) attack catalogues

sunset:
  status: none
  notes: ""
