asyncapi: 3.1.0
info:
  title: Intelligence Events
  version: 0.1.0
  description: Audit-chain sealed events for consumer intelligence surfaces.
defaultContentType: application/json
channels:
  assist-draft-completed:
    address: oyatie.intelligence.assist-draft.completed.v1
    messages:
      completed:
        $ref: '#/components/messages/AssistDraftCompleted'
  policy-refused:
    address: oyatie.intelligence.policy.refused.v1
    messages:
      refused:
        $ref: '#/components/messages/PolicyRefused'
  retrieval-context-bound:
    address: oyatie.intelligence.retrieval.context-bound.v1
    messages:
      contextBound:
        $ref: '#/components/messages/RetrievalContextBound'
operations:
  publishAssistDraftCompleted:
    action: send
    channel: { $ref: '#/channels/assist-draft-completed' }
  publishPolicyRefused:
    action: send
    channel: { $ref: '#/channels/policy-refused' }
  publishRetrievalContextBound:
    action: send
    channel: { $ref: '#/channels/retrieval-context-bound' }
components:
  messages:
    AssistDraftCompleted:
      name: AssistDraftCompleted
      payload:
        $ref: '#/components/schemas/IntelligenceEvent'
    PolicyRefused:
      name: PolicyRefused
      payload:
        $ref: '#/components/schemas/IntelligenceEvent'
    RetrievalContextBound:
      name: RetrievalContextBound
      payload:
        $ref: '#/components/schemas/IntelligenceEvent'
  schemas:
    IntelligenceEvent:
      type: object
      required: [event_id, principal_id, context_id, capability, audit_chain_seal]
      properties:
        event_id: { type: string }
        principal_id: { type: string }
        context_id: { type: string }
        capability: { type: string }
        refusal_reason: { type: string }
        audit_chain_seal: { type: string }
