openapi: 3.2.0
info:
  title: cloud-intelligence-providers / provider-router
  version: 0.1.0
  description: |
    REST surface for the cloud-intelligence-providers µservice's provider-router.
    Tenants and workload µservices invoke this surface to dispatch
    capability-routed AI-provider calls. All credentials are referenced
    via OpenBao SecretReference URIs — never embedded.
  contact:
    name: cloud-intelligence
    email: cloud-intelligence@oyatie.com
  license:
    name: Internal
servers:
  - url: https://cloud-intelligence-providers.{pack}.oyatie.com/v1
    description: Per-pack provider-router endpoint
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
security:
  - oidc: []
  - mtls: []
paths:
  /router/decide:
    post:
      operationId: routerDecide
      summary: Decide which provider should serve a given request
      description: |
        Returns a `RouterDecision` containing the selected provider, transport,
        region, and a `decision_id` traceable through audit-chain. Does NOT
        invoke the provider — only emits the decision. Use `/router/invoke`
        to execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingRequest'
      responses:
        '200':
          description: Decision computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterDecision'
        '403':
          description: Cedar deny (cross-tenant or residency-violating)
        '422':
          description: NoCompliantProvider — no provider satisfies the constraints
        '429':
          description: Per-tenant rate limit exceeded
  /router/invoke:
    post:
      operationId: routerInvoke
      summary: Decide + invoke the selected provider
      description: |
        Compose `routerDecide` + adapter dispatch into a single call. Returns
        the provider's response along with the `decision_id` and
        `evidence_ref` (the audit-chain ProviderInvoked event reference).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInvokeRequest'
      responses:
        '200':
          description: Provider invoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInvokeResponse'
        '403':
          description: Cedar deny
        '422':
          description: NoCompliantProvider
        '429':
          description: Rate limited
        '502':
          description: Upstream provider error (failover attempted but exhausted)
        '504':
          description: Upstream provider timeout
  /providers/health:
    get:
      operationId: providersHealth
      summary: Read per-provider rolling-window health snapshot
      parameters:
        - in: query
          name: vendor
          schema:
            type: string
          description: filter by vendor name
        - in: query
          name: pack
          schema:
            type: string
          description: filter by pack
      responses:
        '200':
          description: Health snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderHealthSnapshot'
  /providers/capabilities:
    get:
      operationId: providersCapabilities
      summary: List capability catalogue per provider
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityProfile'
  /providers/config/{tenant}:
    get:
      operationId: getTenantProviderConfig
      summary: Read this tenant's provider configuration
      parameters:
        - in: path
          name: tenant
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant provider config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProviderConfig'
    put:
      operationId: updateTenantProviderConfig
      summary: Update this tenant's provider configuration (capability profile, ceilings, opt-outs)
      parameters:
        - in: path
          name: tenant
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantProviderConfig'
      responses:
        '200':
          description: Updated
        '403':
          description: Cedar deny
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.{pack}.oyatie.com/.well-known/openid-configuration
    mtls:
      type: mutualTLS
  schemas:
    RoutingRequest:
      type: object
      required: [tenant_id, pack, capability_profile, request_fingerprint]
      properties:
        tenant_id: {type: string}
        pack: {type: string, enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]}
        capability_profile:
          $ref: '#/components/schemas/CapabilityProfile'
        request_fingerprint:
          type: string
          description: |
            BLAKE3 hash of the (system_prompt + user_prompt) bytes.
            Hash only — prompts are NOT carried over /router/decide.
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
    RouterDecision:
      type: object
      required: [decision_id, selected_vendor, selected_transport, selected_region, residency_compliant, reason]
      properties:
        decision_id: {type: string}
        selected_vendor: {type: string, enum: [anthropic, openai, gemini, in-house]}
        selected_transport: {type: string, enum: [api, subscription, in-house]}
        selected_region: {type: string}
        residency_compliant: {type: boolean}
        reason: {type: string, description: "Human-readable explanation of the routing choice"}
        candidate_set:
          type: array
          items: {$ref: '#/components/schemas/ProviderCandidate'}
    ProviderCandidate:
      type: object
      properties:
        vendor: {type: string}
        transport: {type: string}
        region: {type: string}
        capability_fit_score: {type: number}
        cost_per_1k_tokens_usd: {type: number}
        p99_latency_ms: {type: number}
        availability_rolling_15m: {type: number}
        eligible: {type: boolean}
        rejection_reason: {type: string, nullable: true}
    CapabilityProfile:
      type: object
      required: [name, requirements]
      properties:
        name: {type: string}
        requirements:
          type: object
          properties:
            context_window_tokens: {type: integer}
            response_latency_p99_ms: {type: integer}
            supports_tool_use: {type: boolean}
            supports_vision: {type: boolean}
            supports_audio: {type: boolean}
            requires_phi_redaction: {type: boolean}
            requires_zdr: {type: boolean}
    RoutingConstraints:
      type: object
      properties:
        forbidden_vendors:
          type: array
          items: {type: string}
        forbidden_transports:
          type: array
          items: {type: string}
        prefer_in_house: {type: boolean}
        cost_ceiling_per_call_usd: {type: number}
        latency_ceiling_p99_ms: {type: integer}
    ProviderInvokeRequest:
      type: object
      required: [tenant_id, pack, capability_profile, prompt]
      properties:
        tenant_id: {type: string}
        pack: {type: string}
        capability_profile:
          $ref: '#/components/schemas/CapabilityProfile'
        prompt:
          type: object
          properties:
            system: {type: string}
            messages:
              type: array
              items: {type: object}
        constraints:
          $ref: '#/components/schemas/RoutingConstraints'
        evidence_attach: {type: boolean, default: true}
    ProviderInvokeResponse:
      type: object
      required: [decision_id, response, evidence_ref, request_hash, response_hash]
      properties:
        decision_id: {type: string}
        response:
          type: object
          description: vendor response, schema-normalized to oya canonical shape
        evidence_ref:
          type: string
          description: "audit-chain ProviderInvoked event id"
        request_hash: {type: string, description: "BLAKE3 hash of request bytes"}
        response_hash: {type: string, description: "BLAKE3 hash of response bytes"}
        envelope_signature: {type: string, description: "Ed25519 signature over (request_hash || response_hash || metadata)"}
        cost_usd: {type: number}
        latency_ms: {type: number}
        usage:
          type: object
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
    ProviderHealthSnapshot:
      type: object
      properties:
        vendor: {type: string}
        transport: {type: string}
        region: {type: string}
        availability_rolling_15m: {type: number}
        p99_latency_ms: {type: number}
        error_rate_rolling_5m: {type: number}
        cost_per_1k_tokens_usd: {type: number}
        demoted: {type: boolean}
        demoted_until: {type: string, format: date-time, nullable: true}
    TenantProviderConfig:
      type: object
      properties:
        tenant_id: {type: string}
        pack: {type: string}
        capability_profile:
          $ref: '#/components/schemas/CapabilityProfile'
        per_vendor_credential_refs:
          type: object
          additionalProperties: {type: string, description: "openbao:// URI"}
        cost_ceilings_per_day_usd:
          type: object
          additionalProperties: {type: number}
        forbidden_vendors:
          type: array
          items: {type: string}
        adapter_pins:
          type: object
          additionalProperties: {type: string}
