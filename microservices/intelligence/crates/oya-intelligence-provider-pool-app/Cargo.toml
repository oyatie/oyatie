[package]
name = "oya-intelligence-provider-pool-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Provider-pool composition root (usecase layer per ADR-0105). Wires the pure provider-pool-kernel routing function (round-robin / least-used / least-latency / least-remaining / sticky over BTreeSet membership + AccountHealthMap + UsageSnapshotMap) into an end-to-end dispatch use-case: load pool registry, drive failover through the kernel's fallback_chain on retryable failures, mutate health on consecutive-failure quarantine, and surface a typed Unimplemented boundary for OpenBao secret resolution + Bedrock-shape audit emission downstreams. Path-deps on the kernel + the sibling account-kernel only; no NEW external workspace dependency seam. Mirrors the workload-identity-app + llm-gateway-app composition pattern (ports + in-memory adapters + production transport adapter; default-deny on error; ADR-0083 Tier-3 panic-free)."

# INVARIANT: path-deps on the provider-pool kernel + the sibling account kernel
# only. The composition layer adds tokio/futures-util/bytes/tracing for the
# production hyper-backed transport (mirroring how the llm-gateway-app composes
# the same backbone). No NEW external workspace dependency seam.
[dependencies]
oya-intelligence-provider-pool-kernel = { path = "../oya-intelligence-provider-pool-kernel" }
oya-intelligence-account-kernel = { path = "../oya-intelligence-account-kernel" }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
bytes = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lib]
name = "oya_intelligence_provider_pool_app"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
