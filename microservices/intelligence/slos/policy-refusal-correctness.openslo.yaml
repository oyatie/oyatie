apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-policy-refusal-correctness
spec:
  service: intelligence
  indicator:
    metadata:
      name: policy-refusal-correctness
    spec:
      ratioMetric:
        good:
          metricSource:
            query: sum(rate(oya_intelligence_policy_refusal_total{expected="true"}[5m]))
        total:
          metricSource:
            query: sum(rate(oya_intelligence_policy_refusal_total[5m]))
  objectives:
    - target: 1.0
