apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-refusal-false-negative-rate
  displayName: "Intelligence — Refusal False-Negative Rate"
  labels:
    microservice: intelligence
    bc: guardrails
    tier: substrate
    pack: all
spec:
  service: oya-intelligence
  description: >
    Fraction of dispatch requests that passed the guardrails stack but were later found to be
    harmful (false negative — should have been refused). Measured via human-review queue,
    trust-and-safety reports, and mandatory-reporter signals. A high value is a safety/compliance
    risk. Per ADR-0255 + EU AI Act Art. 9 risk-management + HIPAA minimum-necessary.
    Hyperscaler precedent: Anthropic policy-adherence red-team metrics; Google DeepMind safety eval.
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "False-negative rate ≤ 0.1% rolling 30d"
      op: lte
      value: 0.001
      target: 0.999
  indicator:
    metadata:
      name: refusal-false-negative-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: >
                sum(rate(oya_intelligence_guardrails_refusal_total{outcome="false_negative"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: >
                sum(rate(oya_intelligence_dispatch_total[5m]))
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: refusal-false-negative-burn-fast
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 14.4
            lookbackWindow: 1h
        alertWhenBreaching: true
        notificationTargets:
          - targetRef: ops-security-pagerduty
          - targetRef: council-privacy-pagerduty
