# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-dispatch-api-availability
  displayName: "intelligence: dispatch-API availability 99.95%"
  labels:
    microservice: intelligence
    bounded_context: model-routing
    sli_class: availability
    tier: substrate
    plane: control
    owner_team: axis-intelligence
    pack_scope: all
spec:
  service: intelligence
  description: |
    Dispatch-API availability. A dispatch is "good" when the substrate returns a non-5xx
    DispatchOutcome (including refusal — refusals are by design, not failures) within the
    deadline. Per ADR-0255.
  indicator:
    metadata:
      name: intelligence-dispatch-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_dispatch_total{status=~"completed|refused"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_dispatch_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "30d rolling dispatch-API availability ≥ 99.95%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
