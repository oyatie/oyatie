# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-providers-pool-seat-availability
  displayName: "intelligence-providers-pool: seat availability ≥ 1 seat available"
  labels:
    microservice: intelligence-providers-pool
    bounded_context: providers-pool
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-intelligence-providers
    pack_scope: all
spec:
  service: intelligence-providers-pool
  description: |
    Provider-pool seat availability SLO. At least one seat in the pool must be
    in `available=true` state at any point in time. A seat is available when its
    `HealthState` is not `Unhealthy` and no active cooldown window is in effect.
    This SLO guards against total-pool blackout where all provider seats are
    rate-limited or quarantined simultaneously.

    Metric source: `provider_pool_seat_available` gauge emitted by the
    `OtelMetricsSink` in `oya-intelligence-provider-pool-app`, scraped by
    the Prometheus PodMonitor on the `/metrics` endpoint.

    Burn-rate alerts use the canonical 14×/6× multi-window thresholds from
    the canonical-base template (ADR-0064).

  indicator:
    metadata:
      name: intelligence-providers-pool-seat-availability-ratio
    spec:
      ratioMetric:
        counter: false
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                clamp_min(
                  min by (pool_id) (
                    sum by (pool_id) (
                      provider_pool_seat_available{microservice="intelligence-providers-pool"}
                    )
                  ) > 0,
                  0
                )
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                1

  objectives:
    - displayName: "At least one seat available per pool window"
      target: 0.999
      timeWindow:
        - duration: 28d
          isRolling: true

  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: intelligence-providers-pool-seat-fast-burn
      spec:
        description: "Fast burn: pool seat availability exhausting error budget at >14× rate over 1h/5m"
        alertWhenNoData: true
        alertWhenBreaching: true
        conditions:
          - kind: AlertCondition
            metadata:
              name: fast-burn-1h-14x
            spec:
              conditionType: BurnRate
              op: gte
              threshold: 14
              lookbackWindow: 1h
              alertAfter: 2m
          - kind: AlertCondition
            metadata:
              name: fast-burn-5m-14x
            spec:
              conditionType: BurnRate
              op: gte
              threshold: 14
              lookbackWindow: 5m
              alertAfter: 1m
    - kind: AlertPolicy
      metadata:
        name: intelligence-providers-pool-seat-slow-burn
      spec:
        description: "Slow burn: pool seat availability exhausting error budget at >6× rate over 6h/30m"
        alertWhenNoData: false
        alertWhenBreaching: true
        conditions:
          - kind: AlertCondition
            metadata:
              name: slow-burn-6h-6x
            spec:
              conditionType: BurnRate
              op: gte
              threshold: 6
              lookbackWindow: 6h
              alertAfter: 15m
          - kind: AlertCondition
            metadata:
              name: slow-burn-30m-6x
            spec:
              conditionType: BurnRate
              op: gte
              threshold: 6
              lookbackWindow: 30m
              alertAfter: 5m
