apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-refusal-false-positive-rate
  displayName: "Intelligence — Refusal False-Positive Rate"
  labels:
    microservice: intelligence
    bc: guardrails
    tier: substrate
    pack: all
spec:
  service: oya-intelligence
  description: >
    Fraction of dispatch requests refused that were later found to be legitimate (false positive).
    Measured via human-review queue outcomes + canonicalen-set regression. Tracks guardrails
    over-refusal; a high value harms UX. Per ADR-0255 §C + documentation-rigor §3.2.5.
    Hyperscaler precedent: OpenAI content-policy recall/precision metrics; Anthropic policy
    adherence eval set.
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "False-positive rate ≤ 2% rolling 30d"
      op: lte
      value: 0.02
      target: 0.98
  indicator:
    metadata:
      name: refusal-false-positive-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: >
                sum(rate(oya_intelligence_guardrails_refusal_total{outcome="false_positive"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: >
                sum(rate(oya_intelligence_guardrails_refusal_total[5m]))
  alertPolicies:
    - kind: AlertPolicy
      metadata:
        name: refusal-false-positive-burn-fast
      spec:
        condition:
          kind: BurnRateCondition
          spec:
            burnRateThreshold: 14.4
            lookbackWindow: 1h
        alertWhenBreaching: true
        notificationTargets:
          - targetRef: axis-intelligence-pagerduty
