# TimescaleDB extension post-install hook — runs against the foundry
# µservice's Postgres 18.4 database (Tier 1 OLTP per ADR-0184).
microservice: "foundry"
postgresHost: "foundry-postgres-primary.foundry.svc.cluster.local"
postgresPort: 5432
postgresDatabase: "foundry"
postgresUserSecret: "foundry-postgres-admin"  # OpenBao-resolved
extensionVersion: "2.26.4"

# Hypertables declared by this µservice (rendered into the post-install job).
# Caller can extend per-µservice without editing the chart.
hypertables: []
# Example shape (foundry has none by default; agentic-workflow µservices
# would populate this list):
# hypertables:
#   - name: "workflow_execution_metrics"
#     timeColumn: "ts"
#     spaceColumn: "tenant_id"
#     cardinalityClass: "medium"  # → chunk_interval = 1 day
#     retentionDays: 90
