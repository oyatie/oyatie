# ClickHouse parity_analytics cluster for foundry-eval
# Per ADR-0024 + ADR-0026 + threat-model T-I-01

pack: kr
region: ap-seoul-1

clickhouse:
  image: clickhouse/clickhouse-server:24.3
  shards: 3
  replicas: 3  # per shard

  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "32Gi"

  storage:
    size: "200Gi"
    storageClass: oya-block-ssd

  # Multitenancy enforced (per policy/tenant-isolation.md TI-01)
  multitenancyEnforced: true

  # RBAC enforced (per threat-model T-I-01)
  rbac:
    enabled: true
    rolesPath: /etc/clickhouse-server/roles.d/
    tenantBoundReadRole: tenant_bound_read

  # Sealed-partition (week-based; read-only post-seal)
  partitioning:
    parityAnalytics:
      partitionExpression: "toMonday(ts)"
      sealAfterDays: 7
      readOnlyAfterSeal: true

  # HMAC per row (per threat-model T-T-04)
  hmacEnabled: true

  zookeeper:
    enabled: true
    replicas: 3
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    storage:
      size: "20Gi"
      storageClass: oya-block-ssd

  # Pod anti-affinity (cross-AZ)
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: clickhouse-foundry-eval
        topologyKey: topology.kubernetes.io/zone

  # Network policy
  networkPolicy:
    enabled: true
    ingressAllowedFrom:
      - parity-analyzer-worker
      - parity-analyzer-rest
      - eval-runner-worker

  # OpenBao integration for credentials
  secrets:
    openBaoMountPath: "/var/run/secrets/openbao"

  # Pod security
  podSecurityContext:
    fsGroup: 101
    runAsUser: 101
    runAsNonRoot: true

  # Backup
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionPolicy: "30d"
    s3Bucket: "s3://foundry-eval-clickhouse-backup-kr/"

  # Cardinality limits per-tenant (per threat-model T-D-02)
  cardinalityLimits:
    maxSeriesPerTenant: 1000000
    maxRowsPerQuery: 100000000
