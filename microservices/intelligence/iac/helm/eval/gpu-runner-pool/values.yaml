# GPU runner pool — foundry-eval eval-case dispatcher pool
# Per ADR-0024 + threat-model T-E-01 (sandbox isolation)

# Per-pack override via Kustomize overlay; default is XS tier sizing.
pack: kr
region: ap-seoul-1

replicaCount: 4
maxReplicas: 50

image:
  repository: registry.oyatie.com/foundry-eval/gpu-runner
  tag: "1.0.0-cuda12.4-gvisor"
  pullPolicy: IfNotPresent

# Resource requests + limits per pod
resources:
  requests:
    cpu: "2"
    memory: "8Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: "1"

# Sandbox configuration (gVisor by default; Kata for high-risk capabilities)
sandbox:
  runtimeClass: gvisor
  # Override per-capability via PodSpec annotation `oya-sandbox: kata`
  highRiskCapabilities:
    runtimeClass: kata
  seccompProfile: runtime/default
  appArmorProfile: runtime/default
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# NetworkPolicy egress allowlist (provider model APIs only)
networkPolicy:
  enabled: true
  egressAllowlist:
    - api.openai.com
    - api.anthropic.com
    - generativelanguage.googleapis.com
    - api.x.ai
    - inference.oyatie.internal  # in-house variant
    - foundry-evidence.oyatie.internal
    - foundry-providers.oyatie.internal

# PriorityClass for publish-gate runs > nightly runs > on-demand
priorityClass:
  publishGate:
    name: foundry-eval-publish
    value: 10000
  nightly:
    name: foundry-eval-nightly
    value: 5000
  onDemand:
    name: foundry-eval-on-demand
    value: 1000

# HPA configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Per-pod ephemeral filesystem
ephemeralStorage:
  enabled: true
  sizeLimit: "10Gi"

# OpenBao SecretReference for provider API keys
secrets:
  openBaoMountPath: "/var/run/secrets/openbao"
  refreshIntervalSeconds: 300

# ServiceAccount + Role binding
serviceAccount:
  create: true
  name: foundry-eval-gpu-runner

# Pod security admission
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# OTel instrumentation
otelInstrumentation:
  enabled: true
  endpoint: alloy.observability.svc.cluster.local:4317

# Per-pod egress firewall (defense-in-depth alongside NetworkPolicy)
egressFirewall:
  enabled: true
  allowedDomains: []  # rendered from networkPolicy.egressAllowlist

# Pre-warmed pool: 2 standby pods
prewarmedPool:
  enabled: true
  size: 2

# Node selector (GPU-eligible nodes)
nodeSelector:
  workload: foundry-eval-gpu
  nvidia.com/gpu.present: "true"

# Tolerations for GPU taints
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
