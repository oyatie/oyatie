# Default values for oya-intelligence Helm chart
# Authority: ADR-0255 + ADR-0254 + ADR-0253 + ADR-0296 + ADR-0248
# Override per-environment in overlays/pack-*/values.yaml

replicaCount: 3

image:
  repository: ghcr.io/oyatie/oya-intelligence
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Cell tier per ADR-0248 §D-1
cellTier: 3

# Substrate vs product per ADR-0245
tier: substrate

# Runtime class: Kata + Cloud Hypervisor per ADR-0254
runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  create: true
  name: oya-intelligence
  annotations:
    spiffe.io/spiffeid: "spiffe://oyatie/intelligence/dispatch"

service:
  grpc:
    port: 50051
    protocol: TCP
  http3:
    port: 443
    protocol: UDP
  metrics:
    port: 9090
    protocol: TCP

# HTTP/3 + QUIC per ADR-0253; fallback chain: HTTP/3 → HTTP/2 → HTTP/1.1
transport:
  primary: http3_quic
  fallback:
    - h2
    - h1_1
  http10_forbidden: true

# TLS per ADR-0253
tls:
  minVersion: "1.3"
  aead_only: true
  hsts_max_age: 63072000
  hsts_include_subdomains: true
  hsts_preload: true
  ct_required: true
  ocsp_stapling: true

# ECH per ADR-0253
ech:
  enabled: true
  key_rotation_days: 90
  graceful_degradation: true

# PQC hybrid per ADR-0253
pqc:
  enabled: true
  kem: X25519MLKEM768
  signature: "ed25519+ml_dsa_65"
  classical_fallback: true

# OpenBao sidecar per ADR-0296
openbaosidecar:
  enabled: true
  image: ghcr.io/oyatie/openbao-sidecar:latest
  role: oya-intelligence
  ttl_seconds: 60        # max credential handle TTL
  socket_path: /var/run/openbao/openbao.sock

# Policy evaluation: library-first per ADR-0246 amendment
policyEvaluationMode: library_first

# Provider credential mode per ADR-0255 §D-4
providerCredentialMode: platform_default  # override per tenant pack

# HLC time coordination per ADR-0252
timeCoordination:
  tier: hlc_default

# Observability per ADR-0263
observability:
  otlp_endpoint: "observability-collector.observability.svc.cluster.local:4317"
  metrics_path: /metrics
  trace_sampling_rate: "0.1"

# Abuse defence per ADR-0297
abuseDefence:
  cedarpolicy: policy/abuse-defence.cedar
  emergencyBypassPolicy: policy/critical-path-emergency-services.cedar
  botScoreHeader: "X-Oya-Bot-Score"

# Resource limits
resources:
  intelligence:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
  openbaosidecar:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Horizontal pod autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  minAvailable: 2

# Topology spread: across zones per ADR-0248
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
