# Helm values for the foundry-evidence Postgres HA evidence-index.
# Append-only INSERT-only role for writer; retention-cascade-only UPDATE/DELETE.

postgresql-ha:
  postgresql:
    image:
      registry: ocir.oyatie.com
      repository: bitnami-mirror/postgresql-repmgr
      tag: 16.4.0-debian-12-r2  # LTS pin
    replicaCount: 3
    persistence:
      enabled: true
      storageClass: oci-fast
      size: 500Gi
    pdb:
      create: true
      minAvailable: 2
    audit:
      logHostname: true
      logConnections: true
      logDisconnections: true
      pgAuditLog: "ddl, role, write"
    extraEnvVars:
      - name: POSTGRESQL_SHARED_PRELOAD_LIBRARIES
        value: "pgaudit,pg_stat_statements"
  pgpool:
    image:
      registry: ocir.oyatie.com
      repository: bitnami-mirror/pgpool
      tag: 4.5.4-debian-12-r0  # LTS pin
    replicaCount: 2
    pdb:
      create: true
      minAvailable: 1

initdb:
  # Role grants: writer is INSERT-only on evidence_pack table; reader is SELECT-only;
  # retention-cascader has UPDATE/DELETE but only invoked via Cedar-gated RPC.
  scripts:
    01-roles.sql: |
      CREATE ROLE foundry_evidence_writer LOGIN NOINHERIT;
      CREATE ROLE foundry_evidence_reader LOGIN NOINHERIT;
      CREATE ROLE foundry_evidence_retention_cascader LOGIN NOINHERIT;
    02-schema.sql: |
      CREATE SCHEMA IF NOT EXISTS foundry_evidence;

      CREATE TABLE foundry_evidence.evidence_pack (
        pack_id ULID PRIMARY KEY,
        schema_version TEXT NOT NULL,
        tenant_id TEXT NOT NULL,
        invocation_id ULID NOT NULL,
        attempt_no INT NOT NULL,
        source_microservice TEXT NOT NULL,
        agent_id TEXT,
        capability_id TEXT,
        autonomy_level_decision TEXT NOT NULL,
        invocation_ts TIMESTAMPTZ NOT NULL,
        sealed_at TIMESTAMPTZ,
        pack TEXT NOT NULL,
        payload_data_class TEXT NOT NULL,
        prompt_payload_sha TEXT NOT NULL,
        output_payload_sha TEXT NOT NULL,
        pack_payload_sha TEXT NOT NULL,
        eval_verdict_at_invocation JSONB,
        guardrail_decisions JSONB,
        autonomy_level_rationale_hash TEXT,
        audit_event_id ULID,
        merkle_inclusion_proof_hash TEXT,
        sealed BOOLEAN NOT NULL DEFAULT false,
        audit_chain_emit_pending BOOLEAN NOT NULL DEFAULT true,
        partial BOOLEAN NOT NULL DEFAULT false,
        missing_sources TEXT[],
        supersedes_pack_ref ULID,
        superseded_by_pack_ref ULID,
        framework_tags TEXT[],
        subject_hash TEXT,
        subject_restricted BOOLEAN,
        UNIQUE (tenant_id, invocation_id, attempt_no)
      );

      CREATE INDEX evidence_pack_tenant_ts_idx ON foundry_evidence.evidence_pack (tenant_id, invocation_ts DESC);
      CREATE INDEX evidence_pack_invocation_id_idx ON foundry_evidence.evidence_pack (invocation_id);
      CREATE INDEX evidence_pack_subject_hash_idx ON foundry_evidence.evidence_pack (subject_hash) WHERE subject_hash IS NOT NULL;

      GRANT INSERT ON foundry_evidence.evidence_pack TO foundry_evidence_writer;
      GRANT SELECT ON foundry_evidence.evidence_pack TO foundry_evidence_reader;
      GRANT SELECT, UPDATE, DELETE ON foundry_evidence.evidence_pack TO foundry_evidence_retention_cascader;

      -- Warm + cold partitions
      CREATE TABLE foundry_evidence.evidence_pack_warm (LIKE foundry_evidence.evidence_pack INCLUDING ALL);
      CREATE TABLE foundry_evidence.evidence_pack_cold_index (
        pack_id ULID PRIMARY KEY,
        tenant_id TEXT NOT NULL,
        invocation_ts TIMESTAMPTZ NOT NULL,
        audit_event_id ULID NOT NULL,
        pack_payload_sha TEXT NOT NULL,
        cold_blob_uri TEXT NOT NULL
      );

      GRANT INSERT, SELECT ON foundry_evidence.evidence_pack_warm TO foundry_evidence_retention_cascader;
      GRANT INSERT, SELECT ON foundry_evidence.evidence_pack_cold_index TO foundry_evidence_retention_cascader;
      GRANT SELECT ON foundry_evidence.evidence_pack_warm TO foundry_evidence_reader;
      GRANT SELECT ON foundry_evidence.evidence_pack_cold_index TO foundry_evidence_reader;

      -- Audit-of-audits read log
      CREATE TABLE foundry_evidence.evidence_query_log (
        read_audit_event_id ULID PRIMARY KEY,
        principal_spiffe_id TEXT NOT NULL,
        tenant_id TEXT NOT NULL,
        read_at TIMESTAMPTZ NOT NULL,
        query_summary JSONB NOT NULL,
        pack_ids_returned ULID[]
      );
      GRANT INSERT, SELECT ON foundry_evidence.evidence_query_log TO foundry_evidence_writer;
      GRANT SELECT ON foundry_evidence.evidence_query_log TO foundry_evidence_reader;
