# Kubernetes Deployment for intelligence µservice
# Authority: ADR-0254 (K8s + Cloud Hypervisor + Kata pods)
# Owner: axis-intelligence + ops-platform
# Cell tier: Tier-3 per-tenant (per ADR-0248 §D-1)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-intelligence
  namespace: intelligence
  labels:
    app: oya-intelligence
    version: "0.1.0"
    tier: substrate
    cell_tier: "3"
  annotations:
    adr_ref: "ADR-0254, ADR-0248, ADR-0296"
    spiffe_trust_domain: "spiffe://oyatie/intelligence"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oya-intelligence
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        app: oya-intelligence
        version: "0.1.0"
      annotations:
        # Kata Containers isolation per ADR-0254
        io.containerd.cri.runtime-handler: kata-containers
        # Ambient mesh waypoint per Cilium ambient eBPF
        istio.io/use-waypoint: intelligence-waypoint
        # SPIFFE attestation per ADR-0295
        spiffe.io/spiffeid: "spiffe://oyatie/intelligence/dispatch"
    spec:
      serviceAccountName: oya-intelligence
      # Cloud Hypervisor + Kata per ADR-0254
      runtimeClassName: kata-cloud-hypervisor
      containers:
        - name: intelligence
          image: ghcr.io/oyatie/oya-intelligence:0.1.0
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http3
              containerPort: 443
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: OYA_MICROSERVICE
              value: intelligence
            - name: OYA_CELL_TIER
              value: "3"
            - name: OYA_POLICY_EVALUATION_MODE
              value: library_first
            - name: OYA_TRANSPORT
              value: "http3_quic_primary,h2_fallback,h1_fallback"
            - name: OPENBAO_ADDR
              value: "unix:///var/run/openbao/openbao.sock"
          volumeMounts:
            - name: openbao-socket
              mountPath: /var/run/openbao
              readOnly: false
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # OpenBao sidecar — credential isolation per ADR-0296
        # Provider credentials NEVER enter intelligence process memory
        # Sidecar issues short-lived CredentialHandle bound to provider URL + TTL + tenant + audience
        - name: openbao-sidecar
          image: ghcr.io/oyatie/openbao-sidecar:latest
          ports:
            - name: unix-socket
              containerPort: 0
          volumeMounts:
            - name: openbao-socket
              mountPath: /var/run/openbao
            - name: openbao-config
              mountPath: /etc/openbao
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: openbao-socket
          emptyDir:
            medium: Memory
        - name: openbao-config
          secret:
            secretName: intelligence-openbao-config
        - name: tls-certs
          secret:
            secretName: intelligence-pqc-tls

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: oya-intelligence
