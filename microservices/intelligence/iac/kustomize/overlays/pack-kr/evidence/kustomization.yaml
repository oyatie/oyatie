# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foundry-evidence

resources:
  - ../../base

patches:
  - target:
      kind: HelmRelease
      name: foundry-evidence-evidence-builder
    patch: |-
      - op: replace
        path: /spec/values/pack
        value: pack-kr
      - op: replace
        path: /spec/values/packRegion
        value: ap-seoul-1
      - op: replace
        path: /spec/values/config/rateLimits/perTenantSustainedInvPerSec
        value: 8000  # KR pack at M01: 8k/s sustained; per capacity-model.md
  - target:
      kind: HelmRelease
      name: foundry-evidence-postgres
    patch: |-
      - op: replace
        path: /spec/values/postgresql-ha/postgresql/persistence/size
        value: 500Gi
  - target:
      kind: HelmRelease
      name: foundry-evidence-evidence-blob-store
    patch: |-
      - op: replace
        path: /spec/values/pack
        value: pack-kr
      - op: replace
        path: /spec/values/packRegion
        value: ap-seoul-1

commonAnnotations:
  oyatie.dev/pack: pack-kr
  oyatie.dev/jurisdiction-code: KR
  oyatie.dev/retention-default: "3y"  # KR PIPA Art. 29; substrate-managed
