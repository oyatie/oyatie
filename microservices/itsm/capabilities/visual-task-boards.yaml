apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-visual-task-boards
  service: itsm
spec:
  businessCapability: service-management
  capability: visual-task-boards
  counterparts:
    - "ServiceNow Visual Task Boards"
    - "Jira Service Management Boards"
    - "Freshservice Kanban"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    board_kinds:
      - per_agent_inbox
      - per_team_sprint
      - per_major_incident_board
      - per_change_calendar
    operations:
      - create_lane
      - move_card_between_lanes
      - swimlane_filter
      - wip_limit_enforce
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
    dataClass: board_state
  cedarGate: microservices/itsm/policy/visual-task-boards-authorization.cedar
  tenantClassSupport:
    demo_trial: true
    paid: true
