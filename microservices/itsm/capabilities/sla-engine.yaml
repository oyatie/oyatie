apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-sla-engine
  service: itsm
spec:
  businessCapability: service-management
  capability: sla-engine
  counterparts:
    - "ServiceNow SLA Engine"
    - "Jira Service Management SLA"
    - "Freshservice SLA Policies"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0252, ADR-0263, ADR-0328]
  surface:
    operations:
      - declare_sla_contract
      - declare_ola_contract
      - declare_uc_underpinning_contract
      - start_clock
      - pause_clock_per_business_hours_or_blocker
      - resume_clock
      - detect_breach_event_driven
      - escalate_on_breach
      - seal_breach_evidence_to_audit_chain
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
    dataClass: sla_clock_state
  cedarGate: microservices/itsm/policy/sla-engine-authorization.cedar
  causality:
    clock_source: HLC default per ADR-0252 KS#12
    truetime_tier_opt_in: paid + fin_grade_pack
  performanceClaim:
    breach_detection_p99_ms: 15000
    counterpart_servicenow_p99_ms: 120000
    advantage_factor: 8
  ipReference: microservices/itsm/IP-030-sla-breach-remediation-loop.md
  tenantClassSupport:
    demo_trial: true
    paid: true
