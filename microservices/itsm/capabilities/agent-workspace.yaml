apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-agent-workspace
  service: itsm
spec:
  businessCapability: service-management
  capability: agent-workspace
  counterparts:
    - "ServiceNow Agent Workspace (Configurable Workspace)"
    - "Jira Service Management Queues"
    - "Freshservice Agent Console"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    audience: AGENT_RESPONDER | AGENT_SUPERVISOR
    panes:
      - inbox_priority_queue
      - active_ticket_detail
      - related_cmdb_panel
      - similar_kb_articles_panel
      - sla_clock_strip
      - agent_assistant_panel
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
    audienceType: AGENT_RESPONDER
    dataClass: incident_ticket
  cedarGate: microservices/itsm/policy/agent-workspace-authorization.cedar
  ontologyProjection: oya-ontology-itsm-agent-workspace-projection
  routesToSubstrate:
    - application
    - ops-dashboard-control-center
  tenantClassSupport:
    demo_trial: true
    paid: true
  paid_metering:
    per_seat: agent_seats_provisioned_max_in_period
