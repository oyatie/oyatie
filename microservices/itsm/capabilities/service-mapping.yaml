apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-service-mapping
  service: itsm
spec:
  businessCapability: service-management
  capability: service-mapping
  counterparts:
    - "ServiceNow Service Mapping (top-down)"
    - "BMC Helix Service Mapping"
    - "Atlassian Insight Service Graph"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    operations:
      - declare_business_service
      - traverse_application_layer
      - traverse_middleware_layer
      - traverse_infrastructure_layer
      - render_dependency_graph
      - detect_relation_drift
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
    dataClass: service_dependency_relation
  cedarGate: microservices/itsm/policy/service-mapping-authorization.cedar
  performanceClaim:
    three_hop_traversal_p99_ms: 380
    counterpart_servicenow_three_hop_p99_ms: 1400
    advantage_factor: 3.7
  substrateBinding:
    cmdb: read-only on cmdb relation graph; writes only into itsm-owned dependency_relation projection
  ipReference: microservices/itsm/IP-027-cmdb-reconciliation-graph.md
  tenantClassSupport:
    demo_trial: false
    paid: true
