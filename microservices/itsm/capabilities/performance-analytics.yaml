apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-performance-analytics
  service: itsm
spec:
  businessCapability: service-management
  capability: performance-analytics
  counterparts:
    - "ServiceNow Performance Analytics"
    - "Atlassian Reports for JSM"
    - "Freshservice Analytics Plus"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    kpi_packs:
      - incident_lifecycle_mttr_mtbf
      - change_success_rate
      - cab_throughput
      - csat_trend
      - sla_breach_rate
      - cmdb_health_score
      - ai_deflection_rate
    visualization_kinds:
      - scorecard
      - trend_line
      - sla_compliance_heatmap
      - waterfall_change_throughput
      - benchmark_compare
  tenantScope:
    requiredFields: [tenant_id, principal_id, audience_type, purpose, data_class]
    dataClass: kpi_snapshot
  cedarGate: microservices/itsm/policy/performance-analytics-authorization.cedar
  routesToSubstrate:
    - analytics
    - observability
  tenantClassSupport:
    demo_trial: false
    paid: true
