apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-self-service-portal
  service: itsm
spec:
  businessCapability: service-management
  capability: self-service-portal
  counterparts:
    - "ServiceNow Service Portal (Washington DC)"
    - "Jira Service Management Customer Portal"
    - "Freshservice Self-Service"
  bindingAdrs: [ADR-0064, ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328, ADR-0331]
  surface:
    audience: requester | end_user_employee
    flows:
      - browse_knowledge_base
      - create_ticket
      - check_ticket_status
      - lookup_my_assets
      - submit_service_request
    deflection_target_percent: 35
  tenantScope:
    requiredFields: [tenant_id, requester_principal_id, audience_type, purpose, data_class]
    audienceType: REQUESTER
    dataClass: requester_self_service
  cedarGate: microservices/itsm/policy/self-service-portal-authorization.cedar
  ontologyProjection: oya-ontology-itsm-requester-projection
  workflowTemplate: oya-workflow-itsm-self-service-deflection
  auditEvent: itsm.self-service-portal.invoked
  observabilityAdr: ADR-0263
  marketplaceSettlement: DealSet
  routesToSubstrate:
    - community
    - tasks
  tenantClassSupport:
    demo_trial: true
    paid: true
  packOverlays:
    - SOC-2
    - ISO-27001
    - GDPR
    - KR-PIPA
    - HIPAA
