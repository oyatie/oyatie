apiVersion: oyatie.dev/v2
kind: CapabilityRecord
metadata:
  name: itsm-discovery
  service: itsm
spec:
  businessCapability: service-management
  capability: discovery
  counterparts:
    - "ServiceNow Discovery (separate product line)"
    - "Jira Service Management Assets discovery"
    - "Freshservice Probe Discovery"
  bindingAdrs: [ADR-0105, ADR-0131, ADR-0243, ADR-0244, ADR-0263, ADR-0328]
  surface:
    agent_kinds:
      - snmp_scanner
      - wmi_scrape
      - ssh_inventory
      - kubernetes_label_scrape
      - aws_resource_inventory
      - oci_resource_inventory
      - azure_resource_inventory_optional
      - cloud_compute_µservice_internal
    output: cmdb_ci_candidate (routed to cmdb µservice for reconciliation per IP-027)
  tenantScope:
    requiredFields: [tenant_id, discovery_principal_id, audience_type, purpose, data_class]
    dataClass: cmdb_ci_candidate
  cedarGate: microservices/itsm/policy/discovery-authorization.cedar
  substrateBinding:
    cmdb: produces ci_candidate events; cmdb µservice owns merge + dedupe + lifecycle
  tenantClassSupport:
    demo_trial: false
    paid: true
  rationale: discovery is a paid-tier capability per ADR-0331; demo/trial tenants enter CIs manually within the 200-CI cap
