apiVersion: openslo/v1
kind: SLO
metadata:
  name: itsm-sla-breach-detection
  labels:
    service: itsm
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: itsm
  description: SLA breach detection completeness for incident, change, problem, CMDB, knowledge base, and service-level management operations.
  indicator:
    metadata:
      name: sla-breach-detection
      labels:
        domain_object: ServiceManagementRecord
        operator_audience: IT_SERVICE_MANAGER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_sla_breach_detection_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_itsm_sla_breach_detection_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: SLA breach detection completeness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
