apiVersion: oyatie.dev/v1
kind: NetworkPolicy
metadata:
  name: itsm-network-policy
  labels:
    service: itsm
    binding_adr: ADR-0253-amendment
spec:
  service: itsm
  tenantScoped: true
  audienceType: ITIL_OPERATOR
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/service-management-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["ServiceNow ITSM", "Jira Service Management", "BMC Remedy", "Zendesk Support", "Freshdesk"]
