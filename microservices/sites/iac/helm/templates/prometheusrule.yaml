{{/*
PrometheusRule — fast-burn + slow-burn alert rules per SLO.
Aligns with slos/*.openslo.yaml alertPolicyRef bindings.
*/}}
{{- if $.Values.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-sites-slo-burn-rules
  namespace: sites
  labels:
    microservice: sites
    release: kube-prometheus-stack
spec:
  groups:
    - name: sites-page-render-latency
      interval: 30s
      rules:
        - alert: sites-page-render-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_sites_page_render_seconds_bucket{le="0.20"}[1h]))
              /
              sum(rate(oya_sites_page_render_seconds_count[1h]))
            )) > 14 * (1 - 0.99)
          for: 2m
          labels: {severity: page, slo: page-render-latency, burn: fast-1h-14x}
          annotations:
            summary: "Page-render latency burning 14x over 1h"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/publish-pipeline-rollback.md"
        - alert: sites-page-render-slow-burn-6h-6x
          expr: |
            (1 - (
              sum(rate(oya_sites_page_render_seconds_bucket{le="0.20"}[6h]))
              /
              sum(rate(oya_sites_page_render_seconds_count[6h]))
            )) > 6 * (1 - 0.99)
          for: 15m
          labels: {severity: ticket, slo: page-render-latency, burn: slow-6h-6x}

    - name: sites-publish-latency
      interval: 30s
      rules:
        - alert: sites-publish-fast-burn-1h-14x
          expr: |
            (1 - (
              sum(rate(oya_sites_publish_duration_seconds_bucket{le="5", site_size_class="medium"}[1h]))
              /
              sum(rate(oya_sites_publish_duration_seconds_count{site_size_class="medium"}[1h]))
            )) > 14 * (1 - 0.95)
          for: 2m
          labels: {severity: page, slo: publish-latency, burn: fast-1h-14x}
          annotations:
            summary: "Publish pipeline latency burning 14x over 1h"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/publish-pipeline-rollback.md"

    - name: sites-acme-renew-latency
      interval: 30s
      rules:
        - alert: sites-cert-expiry-near-page
          expr: |
            min(oya_sites_cert_expiry_seconds) < 86400
          for: 5m
          labels: {severity: page, slo: acme-renew-latency, slo_target: 86400s}
          annotations:
            summary: "TLS cert expires within 24h — ACME renewal failed"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/acme-cert-renewal-failure.md"
        - alert: sites-cert-expiry-near-ticket
          expr: |
            min(oya_sites_cert_expiry_seconds) < 604800
          for: 1h
          labels: {severity: ticket, slo: acme-renew-latency}
          annotations:
            summary: "TLS cert expires within 7d"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/acme-cert-renewal-failure.md"

    - name: sites-accessibility-wcag-correctness
      interval: 30s
      rules:
        - alert: sites-wcag-correctness-any-fail-page
          expr: |
            sum(rate(oya_sites_wcag_aa_validation_total{result="failed"}[5m])) > 0
          for: 1m
          labels: {severity: page, slo: accessibility-wcag-correctness, slo_target: 1.0}
          annotations:
            summary: "WCAG 2.2 AA correctness FAILED — Sev-1 for pack-us-healthcare patient portals"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/page-export-corruption.md"

    - name: sites-seo-meta-correctness
      interval: 30s
      rules:
        - alert: sites-seo-correctness-any-fail-page
          expr: |
            sum(rate(oya_sites_seo_meta_validation_total{result="failed"}[5m])) > 0
          for: 1m
          labels: {severity: page, slo: seo-meta-correctness, slo_target: 1.0}
          annotations:
            summary: "SEO meta correctness FAILED"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/page-export-corruption.md"

    - name: sites-search-cross-tenant-leak
      interval: 30s
      rules:
        - alert: sites-search-cross-tenant-leak-page
          expr: |
            sum(rate(oya_sites_search_cross_tenant_result_total[5m])) > 0
          for: 1m
          labels: {severity: page, sev: 1}
          annotations:
            summary: "Cross-tenant search result LEAK detected — Sev-1; immediate runbook"
            runbook_url: "https://oyatie.dev/microservices/sites/incident-response.md"

    - name: sites-cdn-cache
      interval: 30s
      rules:
        - alert: sites-cdn-cache-hit-ratio-low
          expr: |
            (
              sum(rate(oya_sites_cdn_cache_hit_total[5m]))
              /
              sum(rate(oya_sites_cdn_request_total[5m]))
            ) < 0.30
          for: 15m
          labels: {severity: page, slo: page-render-latency}
          annotations:
            summary: "CDN cache hit ratio < 30% for > 15m; origin overwhelmed risk"
            runbook_url: "https://oyatie.dev/microservices/sites/runbooks/cdn-cache-purge-cascade.md"
{{- end }}

    - name: sites-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: sites-llm-capability-circuit-open
          expr: max(oya_sites_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: sites
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "sites LLM/capability circuit-breaker tripped open"
        - alert: sites-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_sites_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: sites
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "sites capability retry-budget exhausted"

    - name: sites-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: sites-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_sites_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: sites
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "sites tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: sites-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: sites-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"sites-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: sites
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sites pod CPU saturation > 70% sustained 10m"
        - alert: sites-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_sites_responses_5xx_total[5m]))
            /
            sum(rate(oya_sites_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: sites
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sites 5xx rate > 1% sustained 5m"
        - alert: sites-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_sites_responses_total[5m]))
              /
              sum(rate(oya_sites_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: sites
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "sites inbound RPS dropped > 90% vs prior hour"

    - name: sites-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: sites-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_sites_request_success_total[1h]))
              /
              sum(rate(oya_sites_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: sites
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "sites aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: sites-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_sites_request_success_total[6h]))
              /
              sum(rate(oya_sites_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: sites
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "sites aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
