{{/*
ServiceMonitor — Prometheus scrape config; per-µservice job labels.
*/}}
{{- if $.Values.serviceMonitor.enabled }}
{{- range $bc := list "site" "page" "block" "theme" "navigation" "url-routing" "domain-binding" "seo" "cms-collection" "search" "cdn-delivery" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oya-sites-{{ $bc }}-sm
  namespace: sites
  labels:
    microservice: sites
    bc: {{ $bc }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      microservice: sites
      bc: {{ $bc }}
  namespaceSelector:
    matchNames: [sites]
  endpoints:
    - port: metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      scrapeTimeout: 25s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace}
        - {sourceLabels: [__meta_kubernetes_pod_label_microservice], targetLabel: microservice}
        - {sourceLabels: [__meta_kubernetes_pod_label_bc], targetLabel: bc}
{{- end }}
{{- end }}
