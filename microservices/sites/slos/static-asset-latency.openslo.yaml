# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-static-asset-latency
  displayName: "sites: static-asset latency p95 (CDN warm)"
  labels:
    microservice: sites
    bc: cdn-delivery
    sli_class: latency
    tier: hero-product
    owner_team: axis-sites
    pack_scope: all
    data_classes: PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    Static-asset (CSS/JS/image) p95 latency SLO. A request is "good" when the
    CDN edge serves the cached asset in ≤ 100ms. PRD-sites §"Performance" target.
    Origin cache misses fall under page-render-latency SLO instead.
  service: sites
  indicator:
    metadata: {name: sites-static-asset-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_static_asset_seconds_bucket{cache_state="hit"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 0.10
      displayName: "30d rolling p95 ≤ 100ms"
  alertPolicies:
    - alertPolicyRef: sites-static-asset-fast-burn-1h-14x
    - alertPolicyRef: sites-static-asset-slow-burn-6h-6x
