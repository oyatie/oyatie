# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-page-render-latency
  displayName: "sites: page-render latency p95"
  labels:
    microservice: sites
    bc: cdn-delivery
    sli_class: latency
    tier: hero-product
    owner_team: axis-sites
    pack_scope: all
    data_classes: PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    Page-render p95 latency SLO. A request is "good" when the page-render
    round-trip (auth → fetch published artifact → respond with HTML +
    headers) returns in ≤ 200ms. PRD-sites §"Performance" target.
  service: sites
  indicator:
    metadata: {name: sites-page-render-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_sites_page_render_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.20
      displayName: "30d rolling p95 ≤ 200ms"
  alertPolicies:
    - alertPolicyRef: sites-page-render-fast-burn-1h-14x
    - alertPolicyRef: sites-page-render-slow-burn-6h-6x
    - alertPolicyRef: sites-page-render-ticket-burn-3d-1x
