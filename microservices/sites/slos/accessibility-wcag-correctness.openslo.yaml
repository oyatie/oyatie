# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: sites-accessibility-wcag-correctness
  displayName: "sites: accessibility WCAG 2.2 AA correctness (100%)"
  labels:
    microservice: sites
    bc: page
    sli_class: correctness
    tier: correctness-bound
    owner_team: axis-sites
    pack_scope: all
    data_classes: PUBLIC_BY_TENANT_CHOICE
spec:
  description: |
    Accessibility WCAG 2.2 AA correctness SLO. A page-publish is "good" when
    the page passes the publish-time WCAG 2.2 AA checker (alt-text presence;
    contrast 4.5:1; heading-order; landmark structure; keyboard
    navigability; lang attribute; ARIA name/role/value). Target 100%.
    For pack-us-healthcare patient portals, override is REFUSED entirely
    per ADA Title III + Section 508 alignment.
  service: sites
  indicator:
    metadata: {name: sites-wcag-aa-correctness}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_sites_wcag_aa_validation_total{result="passed"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_sites_wcag_aa_validation_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      op: gte
      value: 1.0
      displayName: "30d rolling 100% WCAG 2.2 AA correctness at publish"
  alertPolicies:
    - alertPolicyRef: sites-wcag-correctness-any-fail-page
