openapi: 3.2.0
info:
  title: Quality Management API
  version: 1.0.0
  summary: SAP QM parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/quality-management
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP QM Quality Management"
  - "Oracle Fusion Quality Management"
  - "Workday Extend quality-workflow counterpart"
  - "NetSuite Quality Management"
  - "Microsoft Dynamics 365 Supply Chain Quality Management"
paths:
  /v1/quality-management/inspection-plan:
    post:
      summary: Create or amend Quality Management inspection-plan
      operationId: quality_management_inspection_plan_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionPlanCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/quality-management/inspection-lot:
