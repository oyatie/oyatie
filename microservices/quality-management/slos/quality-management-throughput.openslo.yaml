apiVersion: openslo/v1
kind: SLO
metadata:
  name: quality-management-throughput
  labels:
    service: quality-management
    sap_code: "QM"
spec:
  description: "Quality Management quality-management-throughput objective; benchmarks SAP QM Quality Management | Oracle Fusion Quality Management | Workday Extend quality-workflow counterpart | NetSuite Quality Management | Microsoft Dynamics 365 Supply Chain Quality Management"
  service: quality-management
  indicator:
    metadata:
      name: quality-management-throughput-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_quality_management_accepted_total[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(oya_quality_management_received_total[5m]))"
  objectives:
    - displayName: quality-management-throughput
      target: 0.995
