# api-gateway — ECH configuration (Encrypted Client Hello)
# Per ADR-0253 + draft-ietf-tls-esni-22 + RFC 9460.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-api-gateway-ech-config
  namespace: api-gateway
data:
  ech-public-name: "edge.oyatie.com"  # outer SNI; opaque to attackers
  ech-version: "0xfe0d"  # draft-22
  kdf: "HKDF-SHA256"
  aead: "AES-128-GCM"
  ech-config-rotation-days: "90"
---
# DNS HTTPS RR (managed via terraform/dns.tf — see iac/dns.tf)
# Example:
#   api.oyatie.com. 300 IN HTTPS 1 . alpn=h3,h2 ipv6hint=::1 ech=AEX+DQBB...
apiVersion: external-dns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oya-api-gateway-https-rr
spec:
  endpoints:
  - dnsName: api.oyatie.com
    recordType: HTTPS
    recordTTL: 300
    targets:
    - '1 . alpn=h3,h2 ipv6hint=::1 ech=${ECH_CONFIG_BASE64}'
