# api-gateway — SPIRE trust bundle binding
# Per ADR-0295 (SPIFFE workload identity + bootstrap CI + kill-switch).
apiVersion: v1
kind: ConfigMap
metadata:
  name: oya-api-gateway-spire-bundle
  namespace: api-gateway
data:
  spire-server: spire.spire-system.svc.cluster.local:8081
  trust-domain: oyatie.cell-${CELL_ID}
  svid-ttl-seconds: "3600"  # 1 hour rotation
  bundle-refresh-seconds: "30"
  bundle-pinned-thumbprints:
  - sha256:abc123...  # placeholder; real fingerprints managed via secret
  kill-switch-path: /etc/spire/kill-switch
  kill-switch-engaged-action: deny-all  # when engaged, refuse all calls
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: api-gateway-envoy
spec:
  spiffeIDTemplate: spiffe://oyatie.cell-${CELL_ID}/api-gateway/envoy
  podSelector:
    matchLabels:
      app: envoy
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: api-gateway
  workloadSelectorTemplates:
  - "k8s:ns:api-gateway"
  - "k8s:sa:api-gateway-envoy"
  - "k8s:pod-label:app:envoy"
  ttl: 1h
  dnsNameTemplates:
  - api-gateway-envoy.api-gateway.svc.cluster.local
