id: cap:api-gateway:tls-handshake-terminate:v1
name: tls-handshake-terminate
namespace: api-gateway
display_name: TLS 1.3 + ECH + PQC handshake termination
description: |
  Terminate inbound TLS 1.3 handshake at the Tier-0 edge. ECH (RFC 9460 + draft-ietf-tls-esni-22)
  + PQC hybrid (X25519MLKEM768) advertised. Graceful degradation for non-supporting peers.

owner_team: axis-network + ops-security
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0253, ADR-0295, ADR-0296]
related_artifacts:
  - microservices/api-gateway/iac/cert-manager.yaml
  - microservices/api-gateway/iac/ech-config.yaml
  - microservices/api-gateway/iac/pqc-cert.yaml
  - microservices/api-gateway/runbooks/tls-cert-rotation.md
  - microservices/api-gateway/runbooks/ech-key-rotation.md
  - microservices/api-gateway/runbooks/pqc-cert-rotation.md

autonomy_tier: T0

inputs:
  - name: client_hello
    type: bytes
    description: TLS 1.3 ClientHello frame
    required: true

outputs:
  - name: negotiated_version
    type: enum
    values: [TLS_1_3]
  - name: cipher_suite
    type: string
  - name: kem_group
    type: string
  - name: signature_alg
    type: string
  - name: ech_status
    type: enum
    values: [applied, not-applied, not-negotiated]
  - name: pqc_negotiated
    type: boolean
  - name: handshake_duration_us
    type: integer

evidence_topic: oya.api_gateway.tls.handshake
cost_profile:
  type: per-handshake
  estimated_cost_usd_per_call: 0.00001

sunset:
  status: none
