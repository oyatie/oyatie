id: cap:api-gateway:edge-cedar-eval:v1
name: edge-cedar-eval
namespace: api-gateway
display_name: Edge Cedar Policy Evaluation
description: |
  Per-request Cedar fragment evaluation via the caller-side oya-shared-policy-eval library
  (per ADR-0246+amendment). Sub-1ms p99 admission decision; emits permit/deny audit event
  per ADR-0263 with the matched fragment ID.

owner_team: axis-network + ops-security
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0157, ADR-0243, ADR-0246, ADR-0263, ADR-0294]
related_specs: [/specs/cedar-fragment-schema.json]
related_artifacts:
  - microservices/api-gateway/policy/route-authorization.cedar
  - microservices/api-gateway/policy/rate-limit.cedar
  - microservices/api-gateway/policy/abuse-defence.cedar
  - microservices/api-gateway/policy/tls-policy.cedar
  - microservices/api-gateway/policy/sov-cloud-overlay.cedar
  - microservices/api-gateway/policy/tenant-scope.cedar

autonomy_tier: T0
# T0 = read-only; this capability NEVER mutates state.

inputs:
  - name: principal_context
    type: object
    schema: PrincipalContext
    required: true
  - name: action
    type: string
    required: true
  - name: resource_context
    type: object
    schema: ResourceContext
    required: true

outputs:
  - name: decision
    type: enum
    values: [permit, deny]
  - name: matched_fragment_id
    type: string
  - name: eval_duration_us
    type: integer

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-us
  - pack-eu
  - pack-kr
  - pack-cn-pipl-2021
  - pack-us-healthcare
  - pack-fedramp-high
  - pack-il5
  - pack-il6
  - pack-ksa-pdpl
  - pack-ae-pdpl

evidence_topic: oya.api_gateway.cedar.eval

cost_profile:
  type: per-evaluation
  estimated_cost_usd_per_call: 0.0000002
  cost_drivers:
    - Caller-side library Cedar AST eval
    - Fragment cache lookup (cell-local)

cedar_policy_fragments:
  - microservices/api-gateway/policy/route-authorization.cedar
  - microservices/api-gateway/policy/rate-limit.cedar
  - microservices/api-gateway/policy/abuse-defence.cedar
  - microservices/api-gateway/policy/tls-policy.cedar
  - microservices/api-gateway/policy/sov-cloud-overlay.cedar

eval_set:
  golden_inputs_path: microservices/api-gateway/capabilities/eval/edge-cedar-golden.jsonl
  pass_threshold: 0.999
  eval_metric: decision-correctness-against-reference-cedar-eval

sunset:
  status: none
