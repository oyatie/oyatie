openapi: 3.2.0
info:
  title: Treasury API
  version: 1.0.0
  summary: SAP TRM parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/treasury
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP TRM Treasury and Risk Management"
  - "Oracle Fusion Cash Management"
  - "Workday Financial Management cash and treasury counterpart"
  - "NetSuite Cash Management"
  - "Microsoft Dynamics 365 Finance Cash and Bank"
paths:
  /v1/treasury/cash-position:
    post:
      summary: Create or amend Treasury cash-position
      operationId: treasury_cash_position_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashPositionCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/treasury/liquidity-forecast:
    post:
      summary: Create or amend Treasury liquidity-forecast
      operationId: treasury_liquidity_forecast_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiquidityForecastCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/treasury/bank-account:
    post:
      summary: Create or amend Treasury bank-account
      operationId: treasury_bank_account_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/treasury/debt-instrument:
    post:
      summary: Create or amend Treasury debt-instrument
      operationId: treasury_debt_instrument_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInstrumentCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/treasury/fx-exposure:
    post:
      summary: Create or amend Treasury fx-exposure
      operationId: treasury_fx_exposure_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxExposureCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/treasury/hedge-designation:
    post:
      summary: Create or amend Treasury hedge-designation
      operationId: treasury_hedge_designation_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HedgeDesignationCommand"
      responses:
        "202":
          description: Accepted with signed audit event
components:
  schemas:
    CashPositionCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    LiquidityForecastCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
        compliance_packs:
          type: array
          items:
            type: string
        marketplace_settlement_ref:
          type: string
        payload:
          type: object
    BankAccountCommand:
      type: object
      required: [tenant_id, principal_id, idempotency_key, payload, compliance_packs]
      properties:
        tenant_id:
          type: string
        principal_id:
          type: string
        idempotency_key:
          type: string
