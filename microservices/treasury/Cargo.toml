[package]
name = "oya-treasury-cash-app"
edition = "2024"
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Treasury cash and liquidity application surface."

[package.metadata.oya]
microservice = "treasury"
title = "Treasury"
bounded_context = "cash-liquidity"
layer = "app"
wave = "wave-3"
owner_team = "axis-erp-treasury + council-product"
data_classification = "tenant-scoped treasury records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/treasury-v1.proto"

[lib]
name = "oya_treasury_cash_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-treasury-cash"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.95.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
