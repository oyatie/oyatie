asyncapi: 3.1.0
info:
  title: Financial Planning Local Operational Events
  version: 1.0.0
  description: Events for budget locking, forecast recalculation, variance explanation, close-cycle workflow, FX rate, and board-report operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  financial-planning.local-ops.v1:
    address: financial-planning.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/financial-planning.local-ops.v1'
    messages:
      - $ref: '#/channels/financial-planning.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/financial-planning.local-ops.v1'
    messages:
      - $ref: '#/channels/financial-planning.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: FinancialPlanningDomainEvent
      title: Financial Planning domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['budget.locked', 'forecast.recalculated', 'variance.explained', 'close.cycle.advanced'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['budget_line', 'forecast_version', 'variance_explanation', 'close_cycle', 'fx_rate', 'board_report'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: FinancialPlanningSloBurnEvent
      title: Financial Planning SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'financial-planning' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'budget.locked' }
