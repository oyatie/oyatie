asyncapi: 3.1.0
info:
  title: Financial Planning Events
  version: 1.0.0
  description: Tenant-scoped event contract for forecast, scenario, consolidation, and board-report evidence.
defaultContentType: application/json
channels:
  financial-planning.events.v1:
    address: financial-planning.events.v1
    messages:
      financialPlanningActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/financial-planning.events.v1'
    messages:
      - $ref: '#/channels/financial-planning.events.v1/messages/financialPlanningActionAccepted'
components:
  messages:
    ActionAccepted:
      name: FinancialPlanningActionAccepted
      title: Financial Planning action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
