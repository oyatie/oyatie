apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-audit-emission-lag
  labels:
    service: financial-planning
    adr: ADR-0139
spec:
  service: financial-planning
  indicator:
    metadata:
      name: audit-emission-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_audit_emission_lag_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_audit_emission_lag_total[5m]))
  objectives:
    - displayName: Financial Planning audit-emission-lag
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
