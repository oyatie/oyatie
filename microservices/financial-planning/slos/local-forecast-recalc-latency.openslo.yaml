apiVersion: openslo/v1
kind: SLO
metadata:
  name: financial-planning-forecast-recalc-latency
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: financial-planning
  description: Forecast recalculation latency for budget locking, forecast recalculation, variance explanation, close-cycle workflow, FX rate, and board-report operations.
  indicator:
    metadata:
      name: forecast-recalc-latency
      labels:
        domain_object: PlanningCycle
        operator_audience: FPNA_CONTROLLER
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_forecast_recalc_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_financial_planning_forecast_recalc_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Forecast recalculation latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
