apiVersion: oyatie.dev/v1
kind: SecretBinding
metadata:
  name: financial-planning-local-openbao-binding
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  serviceAccount: financial-planning-local-ops
  vaultPath: kv/financial-planning/local-ops
  rotation:
    maxAge: 24h
    notifyTopic: financial-planning.local-ops.v1
  requiredFor:
    - forecast-worker
    - budget-locker
