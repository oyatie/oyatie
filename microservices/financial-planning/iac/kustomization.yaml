apiVersion: oyatie.dev/v1
kind: Kustomization
metadata:
  name: financial-planning-kustomization
  labels:
    service: financial-planning
    binding_adr: ADR-0253-amendment
spec:
  service: financial-planning
  tenantScoped: true
  audienceType: FINANCE_PLANNING_OWNER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/forecast-scenario-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Anaplan", "Workday Adaptive Planning", "OneStream", "Vena", "Pigment"]
