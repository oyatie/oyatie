apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: financial-planning-local-slo-burn
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: financial-planning.local.slo
      rules:
        - alert: FinancialPlanningLocalSloBurn
          expr: (sum(rate(oya_financial_planning_close_cycle_latency_good_total[5m])) / sum(rate(oya_financial_planning_close_cycle_latency_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: financial-planning
          annotations:
            summary: Financial Planning close-cycle-latency burn
            runbook: microservices/financial-planning/runbooks/local-close-cycle-latency-burn.md
