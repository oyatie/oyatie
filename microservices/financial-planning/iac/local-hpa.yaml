apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: financial-planning-forecast-worker
  labels:
    service: financial-planning
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: financial-planning-forecast-worker
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_financial_planning_close_cycle_latency_inflight
        target:
          type: AverageValue
          averageValue: "100"
