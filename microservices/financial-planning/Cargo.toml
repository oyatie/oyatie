[package]
name = "oya-financial-planning-forecast-scenario-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Financial Planning forecast scenario application surface."

[package.metadata.oya]
microservice = "financial-planning"
title = "Financial Planning"
bounded_context = "forecast-scenario"
layer = "app"
wave = "wave-3-k"
owner_team = "axis-financial-planning + council-product"
data_classification = "tenant-scoped operational records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0132", "ADR-0316"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/financial-planning-v1.proto"

[lib]
name = "oya_financial_planning_forecast_scenario_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-financial-planning-forecast-scenario"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.95.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
