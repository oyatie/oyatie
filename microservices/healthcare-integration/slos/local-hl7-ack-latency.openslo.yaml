apiVersion: openslo/v1
kind: SLO
metadata:
  name: healthcare-integration-hl7-ack-latency
  labels:
    service: healthcare-integration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: healthcare-integration
  description: HL7 acknowledgement latency for HL7 ingestion, FHIR exchange, HIPAA access controls, PHI delivery, consent synchronization, and audit completeness operations.
  indicator:
    metadata:
      name: hl7-ack-latency
      labels:
        domain_object: ClinicalExchange
        operator_audience: HEALTHCARE_INTEGRATION_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_hl7_ack_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_healthcare_integration_hl7_ack_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: HL7 acknowledgement latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
