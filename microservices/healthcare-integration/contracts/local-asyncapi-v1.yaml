asyncapi: 3.1.0
info:
  title: Healthcare Integration Local Operational Events
  version: 1.0.0
  description: Events for HL7 ingestion, FHIR exchange, HIPAA access controls, PHI delivery, consent synchronization, and audit completeness operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  healthcare-integration.local-ops.v1:
    address: healthcare-integration.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/healthcare-integration.local-ops.v1'
    messages:
      - $ref: '#/channels/healthcare-integration.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/healthcare-integration.local-ops.v1'
    messages:
      - $ref: '#/channels/healthcare-integration.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: HealthcareIntegrationDomainEvent
      title: Healthcare Integration domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['hl7.message.ingested', 'fhir.bundle.exchanged', 'phi.delivery.authorized', 'hipaa.audit.completed'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['hl7_message', 'fhir_bundle', 'phi_delivery', 'patient_consent', 'hipaa_audit', 'breakglass_event'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: HealthcareIntegrationSloBurnEvent
      title: Healthcare Integration SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'healthcare-integration' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'hl7.message.ingested' }
