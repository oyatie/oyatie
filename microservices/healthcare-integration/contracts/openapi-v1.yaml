openapi: 3.2.0
info:
  title: Healthcare Integration API
  version: 1.0.0
  summary: clinical interoperability, consent, break-glass, and regulated health-record provenance
  x-binding-adrs: [ADR-0105, ADR-0243, ADR-0244, ADR-0253-amendment, ADR-0258, ADR-0314, ADR-0321]
servers:
  - url: https://api.oyatie.example/healthcare-integration/v1
    description: HTTP/3 default, HTTP/2 and HTTP/1.1 fallback, strict TLS 1.3, ECH, PQC hybrid where negotiated
paths:
  /healthcare-integration/capabilities:
    get:
      operationId: listHealthcareIntegrationCapabilities
      summary: List tenant-scoped Healthcare Integration capabilities
      security: [{ tenantBearer: [] }]
      x-audience-type: HEALTHCARE_OPERATOR
      x-marketplace-settlement: DealSet
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
  /healthcare-integration/actions/{action_id}:
    post:
      operationId: invokeHealthcareIntegrationAction
      summary: Invoke a Cedar-gated Healthcare Integration action
      security: [{ tenantBearer: [] }]
      parameters:
        - in: path
          name: action_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Accepted with audit-chain evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CapabilityList:
      type: object
      required: [tenant_id, capabilities]
      properties:
        tenant_id: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: ['fhir-read', 'hl7-route', 'break-glass-authorize', 'consent-sync', 'ehr-provenance-seal', 'patient-match-review'] }
    ActionRequest:
      type: object
      required: [tenant_id, principal_id, purpose, data_class, deal_set_id]
      properties:
        tenant_id: { type: string }
        principal_id: { type: string }
        purpose: { type: string }
        data_class: { type: string, enum: ['fhir_resource', 'hl7_message', 'break_glass_event', 'clinical_consent'] }
        deal_set_id: { type: string }
    ActionAccepted:
      type: object
      required: [audit_event_class, workflow_run_id, ontology_object_ref]
      properties:
        audit_event_class: { type: string }
        workflow_run_id: { type: string }
        ontology_object_ref: { type: string }
