# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
istiod:
  image:
    tag: "1.29.2"  # LTS pin per docs/standards/cloud-k8s-stack.md
  meshConfig:
    accessLogFile: "/dev/stdout"
    accessLogFormat: json
    enableTracing: true
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_DNS_AUTO_ALLOCATE: "true"
      tracing:
        zipkin:
          address: tempo.observability.svc.cluster.local:9411
    rootNamespace: istio-system
  pilot:
    autoscaleMin: 3            # HA per capacity-model.md
    autoscaleMax: 20
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        memory: 2Gi
  global:
    proxy:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi  # per capacity-model.md sidecar baseline
    proxy_init:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
    mtls:
      mode: STRICT  # MANDATORY per policy/cluster-isolation.md CI-05; LEAN-enforced
  # Default-deny posture: every tenant namespace gets default-deny AuthorizationPolicy at creation.
  # See network-policy BC's usecase for derivation from Cedar fragments.
