# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-cloud-k8s-karpenter
description: |
  Karpenter Kubernetes node autoscaler per ADR-0198. Replaces Cluster
  Autoscaler with sub-minute scale-up, bin-packing optimization, and native
  spot/preemptible support. NodePool CRD per workload class:
    - app-tier (general-purpose)
    - batch-tier (compute-optimized + spot)
    - gpu-tier (GPU instances, on-demand only)
    - regulatory-tier (sovereign-region-pinned)
type: application
version: 0.1.0
appVersion: "1.11.1"  # Karpenter stable per docs/standards/autoscaling-canonical.md (verified 2026-05-18)
maintainers:
  - name: axis-cloud-k8s
    email: axis-cloud-k8s@oyatie.com
dependencies:
  - name: karpenter
    version: "^1.11.0"
    repository: oci://public.ecr.aws/karpenter
