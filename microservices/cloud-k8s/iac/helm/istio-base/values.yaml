# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
base:
  # Istio base: CRDs + cluster-scoped resources only.
  # Per ADR-0121 §"Version pins": LTS 1.29.2.
  global:
    istioNamespace: istio-system
  defaultRevision: "1-29-2"
  enableCRDTemplates: true
  # Strict mTLS mesh-wide enforced by istiod chart, not base; base only installs CRDs.
  validationURL: ""
