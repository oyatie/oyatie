# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay (M01 launch pack)
# Per policy/data-residency.md: kr-cluster-1 in OCI ap-seoul-1 + on-prem KR primary cell.
# Per ADR-0121: kubeadm + containerd + Istio + Envoy + Cilium + CSI all pack-pinned.
# Per KR PIPA Art. 23-2: cross-border replication forbidden.

resources:
  - ../../base

namespace: cloud-k8s-system

commonLabels:
  oyatie/pack: pack-kr
  oyatie/jurisdiction: kr
  oyatie/data-residency: pack-kr-resident-only

patches:
  - target:
      kind: HelmRelease
      name: cilium
    patch: |-
      - op: add
        path: /spec/values/k8sServiceHost
        value: "kr-cluster-1.kubernetes.local"

  - target:
      kind: HelmRelease
      name: istiod
    patch: |-
      - op: add
        path: /spec/values/meshConfig/defaultConfig/tracing/zipkin/address
        value: "tempo-pack-kr.observability.svc.cluster.local:9411"

  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels/oyatie.dev~1pack
        value: "pack-kr"

configMapGenerator:
  - name: cloud-k8s-pack-config
    namespace: cloud-k8s-system
    literals:
      - pack=pack-kr
      - region=ap-seoul-1
      - kms_key_id=ocid1.key.oc1.ap-seoul-1.<key-id>
      - audit_retention_years=5  # KR commercial code + KR-FSS sector minimum
      - cross_border_replication=forbidden  # per KR PIPA Art. 23-2
      - control_plane_count=1  # M01 launch; 3 subsequent-to-M04-completion HA per ADR-0121
      - worker_count=17  # per capacity-model.md XS tier
