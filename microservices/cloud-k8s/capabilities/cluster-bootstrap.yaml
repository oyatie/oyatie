# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:cloud-k8s:cluster-bootstrap:v1
name: cluster-bootstrap
namespace: cloud-k8s
display_name: Bootstrap Kubernetes Cluster (kubeadm init)
description: |
  Bootstrap a fresh Kubernetes cluster via kubeadm init on cloud-iac-provisioned
  control-plane node(s). Brings up: kube-apiserver, kube-controller-manager,
  kube-scheduler, etcd, Cilium CNI, Istio control plane, Envoy ingress gateway,
  Kyverno admission, kubernetes-api-proxy, CSI drivers per backend.

  Idempotent: if cluster already exists, returns existing cluster_id without
  mutation. Re-bootstrap requires explicit `force: true` + 2-person rule.

  Emits ClusterBootstrapped Workflow event on success. Audit-chain-emits per
  invocation (success OR failure).

owner_team: axis-cloud
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0121, ADR-0131]
related_specs: [/specs/per-microservice-flat-layout.json]
related_artifacts:
  - microservices/cloud-k8s/contracts/openapi/cloud-k8s.yaml
  - microservices/cloud-k8s/contracts/proto/cloud-k8s.proto
  - microservices/cloud-k8s/policy/cluster-isolation.md

autonomy_tier: T3
# T3 = state-mutating, high-risk; 2-person rule + Cedar policy + audit-chain emit
# required. Approver must be a distinct SPIFFE identity (not the agent invoking).

inputs:
  - name: pack
    type: enum
    values: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]
    required: true
  - name: region
    type: string
    required: true
    description: OCI region or on-prem datacenter identifier
  - name: kubeadm_version
    type: string
    required: true
    description: e.g. "v1.35.0"; must match docs/standards/cloud-k8s-stack.md LTS pin
  - name: approver
    type: string
    required: true
    description: SPIFFE SVID of 2nd person (per 2-person rule for T3)
  - name: reason
    type: string
    required: true
    description: RFC-formatted justification; recorded in audit-chain
  - name: force
    type: boolean
    required: false
    default: false
    description: Re-bootstrap existing cluster (DESTRUCTIVE; requires extra elevation)

outputs:
  - name: cluster_id
    type: string
  - name: bootstrapped_at
    type: timestamp
  - name: kubeadm_version
    type: string
  - name: evidence_sha
    type: string
    description: SHA-256 of kubeadm init output + component versions
  - name: signature
    type: string
    description: Ed25519 signature by cluster-bootstrap-worker SPIFFE identity

data_classes_touched:
  - INTERNAL_ONLY
  - SECRET   # kubeadm join token, etcd encryption key
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.cloud-k8s.cluster.bootstrap

cost_profile:
  type: per-bootstrap
  estimated_cost_usd_per_call: 0.50
  cost_drivers:
    - Single kubeadm init invocation (constant cost)
    - Helm install of 9 component charts (~5min)
    - One-time event emission to audit-chain
  ongoing_monthly_cost_usd: 7100  # XS tier per cost-budget.md
  cost_drivers_ongoing:
    - Per cost-budget.md XS tier

cedar_policy_fragments:
  - microservices/cloud-k8s/policy/cluster-isolation.md (CI-07 api-proxy mediation)
  - microservices/cloud-k8s/policy/auditor-scope.cedar (auditor read scope)

eval_set:
  reference_inputs_path: microservices/cloud-k8s/capabilities/eval/cluster-bootstrap-reference.jsonl
  pass_threshold: 0.99
  eval_metric: bootstrap-completion-within-30min-p99
  cadence: per-release

sla:
  bootstrap_completion_p99_seconds: 1800  # 30min per PRD
  node_join_p99_seconds: 300  # 5min

sunset:
  status: none
  notes: ""
