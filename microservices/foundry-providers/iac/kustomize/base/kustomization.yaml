apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oya-foundry-providers

# Base resources (per-pack overlays in iac/kustomize/overlays/<pack>/).
resources: []

# Common labels stamped on every resource.
commonLabels:
  app.kubernetes.io/part-of: oya-foundry-providers
  oya.microservice: foundry-providers

# Per-pack overlays should:
# 1. Set namespace to oya-foundry-providers-<pack>.
# 2. Override Helm values via kustomize-helm chart inflation.
# 3. Set residency.pack to the pack code.
# 4. Bind to per-pack OpenBao endpoint + per-pack KMS keyring.
# 5. Enable canary cohort weighting per ADR-0026 for in-house adapter.

helmCharts: []
