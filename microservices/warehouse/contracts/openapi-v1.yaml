openapi: 3.2.0
info:
  title: Warehouse API
  version: 1.0.0
  summary: SAP EWM parity API with marketplace settlement boundaries
servers:
  - url: https://api.oyatie.example/warehouse
    description: HTTP/3 default, ECH advertised, PQC hybrid offered when supported
x-enterprise-benchmarks:
  - "SAP EWM Extended Warehouse Management"
  - "Oracle Fusion Warehouse Management"
  - "Workday inventory-operations counterpart"
  - "NetSuite WMS"
  - "Microsoft Dynamics 365 Warehouse Management"
paths:
  /v1/warehouse/inbound-delivery:
    post:
      summary: Create or amend Warehouse inbound-delivery
      operationId: warehouse_inbound_delivery_mutate
      x-transport:
        default: HTTP/3
        fallback: [HTTP/2, HTTP/1.1]
        ech: advertised
        pqc: X25519MLKEM768-when-supported
      x-bnf-version: "BNF v4.1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundDeliveryCommand"
      responses:
        "202":
          description: Accepted with signed audit event
  /v1/warehouse/outbound-delivery:
