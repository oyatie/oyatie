syntax = "proto3";

package oya.warehouse.v1;

option java_package = "dev.oyatie.warehouse.v1";

// SAP EWM; benchmarks: SAP EWM Extended Warehouse Management | Oracle Fusion Warehouse Management | Workday inventory-operations counterpart | NetSuite WMS | Microsoft Dynamics 365 Warehouse Management
// Transport binding: HTTP/3 default at REST edge, gRPC over mTLS internally, ECH/PQC at ingress where supported.

message InboundDeliveryCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message InboundDeliveryResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message OutboundDeliveryCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message OutboundDeliveryResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message PutawayTaskCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message PutawayTaskResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message PickingWaveCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message PickingWaveResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message YardAppointmentCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message YardAppointmentResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

message LaborAssignmentCommand {
  string tenant_id = 1;
  string principal_id = 2;
  string idempotency_key = 3;
  repeated string compliance_packs = 4;
  string marketplace_settlement_ref = 5;
}

message LaborAssignmentResult {
  string tenant_id = 1;
  string audit_event_class = 2;
  string status = 3;
}

service WarehouseService {
  rpc MutateInboundDelivery (InboundDeliveryCommand) returns (InboundDeliveryResult);
  rpc MutateOutboundDelivery (OutboundDeliveryCommand) returns (OutboundDeliveryResult);
  rpc MutatePutawayTask (PutawayTaskCommand) returns (PutawayTaskResult);
  rpc MutatePickingWave (PickingWaveCommand) returns (PickingWaveResult);
  rpc MutateYardAppointment (YardAppointmentCommand) returns (YardAppointmentResult);
  rpc MutateLaborAssignment (LaborAssignmentCommand) returns (LaborAssignmentResult);
}
