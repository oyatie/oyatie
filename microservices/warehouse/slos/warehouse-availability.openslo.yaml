apiVersion: openslo/v1
kind: SLO
metadata:
  name: warehouse-availability
  labels:
    service: warehouse
    sap_code: "EWM"
spec:
  description: "Warehouse warehouse-availability objective; benchmarks SAP EWM Extended Warehouse Management | Oracle Fusion Warehouse Management | Workday inventory-operations counterpart | NetSuite WMS | Microsoft Dynamics 365 Warehouse Management"
  service: warehouse
  indicator:
    metadata:
      name: warehouse-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"warehouse\",status=~\"2..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"warehouse\"}[5m]))"
  objectives:
    - displayName: warehouse-availability
      target: 0.999
