apiVersion: openslo/v1
kind: SLO
metadata:
  name: warehouse-latency-p99
  labels:
    service: warehouse
    sap_code: "EWM"
spec:
  description: "Warehouse warehouse-latency-p99 objective; benchmarks SAP EWM Extended Warehouse Management | Oracle Fusion Warehouse Management | Workday inventory-operations counterpart | NetSuite WMS | Microsoft Dynamics 365 Warehouse Management"
  service: warehouse
  indicator:
    metadata:
      name: warehouse-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"warehouse\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"warehouse\"}[5m]))"
  objectives:
    - displayName: warehouse-latency-p99
      target: 0.99
