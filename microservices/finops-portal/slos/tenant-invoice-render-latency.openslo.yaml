# OpenSLO v1alpha — tenant invoice render latency
# Per ADR-0130 self-SLO promotion + ADR-0180-slo-composition.
# Authored 2026-05-18 (seed).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-tenant-invoice-render-latency
  displayName: "finops-portal — tenant invoice first-paint latency"
  labels:
    microservice: finops-portal
    bounded_context: tenant-billing-presentation
    plane: control
    sli_kind: latency
spec:
  description: |
    Tenant-facing invoice presentation must paint within 2 s p95.
    Backend query against Mimir + Postgres rollup is bounded; PDF
    render is asynchronous.
  service: finops-portal
  indicator:
    metadata:
      name: tenant-invoice-render-latency-ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_tenant_invoice_render_latency_ms_bucket{le="2000"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_tenant_invoice_render_latency_ms_count[5m]
                ))
  objectives:
    - displayName: "p95 ≤ 2000 ms (28d window)"
      target: 0.95
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-render-burn-rate
