# OpenSLO v1alpha — credit-application correctness
# Per ADR-0130 + ADR-0162 audit-log integrity + ADR-0174.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-credit-application-correctness
  displayName: "finops-portal — credit-application correctness"
  labels:
    microservice: finops-portal
    bounded_context: credit-ledger
    plane: control
    sli_kind: correctness
spec:
  description: |
    Every credit applied to a tenant ledger MUST be sealed to the
    audit chain under class CreditApplied within 30 s of the
    `append` call. Misses are a SEV-2 because they break the
    append-only invariant the regulator-evidence emit relies on
    (per ADR-0162).
  service: finops-portal
  indicator:
    metadata:
      name: credit-application-seal-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_credit_apply_total{audit_seal="success"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_credit_apply_total[5m]
                ))
  objectives:
    - displayName: "100 % audit-sealed (28d window)"
      target: 1.0
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-credit-seal-miss-page
