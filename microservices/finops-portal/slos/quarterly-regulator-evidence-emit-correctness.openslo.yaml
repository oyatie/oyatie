# OpenSLO v1alpha — quarterly regulator-evidence emit correctness
# Per ADR-0130 + ADR-0174 + ADR-0162.
# Authored 2026-05-18 (seed).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-quarterly-regulator-evidence-correctness
  displayName: "finops-portal — quarterly regulator-evidence emit correctness"
  labels:
    microservice: finops-portal
    bounded_context: focus-export
    plane: control
    sli_kind: correctness
spec:
  description: |
    Every quarterly cost report MUST be emitted to the audit chain with
    class FinOpsQuarterlyReport, signed by ops-finops key, within the
    quarter-close + 5-day window. Any miss is a SEV-2 incident per
    ADR-0174.
  service: finops-portal
  indicator:
    metadata:
      name: quarterly-regulator-evidence-correct-emit
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_quarterly_report_emit_total{outcome="signed-sealed"}[90d]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_quarterly_report_emit_total[90d]
                ))
  objectives:
    - displayName: "100% signed-sealed (quarterly window)"
      target: 1.0
      timeWindow:
        - duration: 90d
          isRolling: true
  alertPolicies:
    - finops-portal-quarterly-emit-page-on-miss
