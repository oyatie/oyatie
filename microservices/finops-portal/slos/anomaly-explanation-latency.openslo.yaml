# OpenSLO v1alpha — anomaly-explanation generation latency
# Per ADR-0130 + ADR-0199 anomaly handling.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-anomaly-explanation-latency
  displayName: "finops-portal — anomaly-explanation generation latency"
  labels:
    microservice: finops-portal
    bounded_context: anomaly-explanation
    plane: control
    sli_kind: latency
spec:
  description: |
    From `TenantCostAnomalySpike` fire to a populated explanation
    rendered in the finops-portal UI: ≤ 30 s p95. Sustained breach
    delays incident triage; SEV-3.
  service: finops-portal
  indicator:
    metadata:
      name: anomaly-explanation-generation-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_anomaly_explain_seconds_bucket{le="30"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_anomaly_explain_seconds_count[5m]
                ))
  objectives:
    - displayName: "p95 ≤ 30 s (28d window)"
      target: 0.95
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-anomaly-explain-burn-rate
