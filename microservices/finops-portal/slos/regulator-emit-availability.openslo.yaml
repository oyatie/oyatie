# OpenSLO v1alpha — quarterly regulator-emit availability
# Per ADR-0130 + ADR-0174.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-regulator-emit-availability
  displayName: "finops-portal — quarterly regulator-emit availability"
  labels:
    microservice: finops-portal
    bounded_context: focus-export
    plane: control
    sli_kind: availability
spec:
  description: |
    Quarterly regulator-evidence emit MUST land on audit-chain
    within quarter-close + 5 days. Any miss is SEV-2 per ADR-0174.
    This SLO measures the per-quarter success across 4 quarters
    rolling.
  service: finops-portal
  indicator:
    metadata:
      name: quarterly-regulator-emit-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_quarterly_report_emit_total{outcome="signed-sealed",within_cure_window="true"}[365d]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_quarterly_report_emit_total[365d]
                ))
  objectives:
    - displayName: "100 % on-time (4Q rolling)"
      target: 1.0
      timeWindow:
        - duration: 365d
          isRolling: true
  alertPolicies:
    - finops-portal-quarterly-emit-page-on-miss
