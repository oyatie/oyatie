# OpenSLO v1alpha — cost-allocation-policy change application latency
# Per ADR-0130 self-SLO promotion + ADR-0174 chargeback formula.
# Authored 2026-05-18.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: finops-portal-cost-allocation-policy-change-latency
  displayName: "finops-portal — policy-change application latency"
  labels:
    microservice: finops-portal
    bounded_context: cost-allocation-policy
    plane: control
    sli_kind: latency
spec:
  description: |
    From the moment ops-finops promotes a CostAllocationPolicy to
    `active` until the policy is visible to downstream consumers
    (OpenCost custom-pricing config + Mimir recording rules), the
    propagation must complete within 60 s p95.

    A breach means the next invoice composition may use a stale
    policy. Sustained breach is SEV-3.
  service: finops-portal
  indicator:
    metadata:
      name: cost-allocation-policy-change-propagation-seconds
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_policy_propagation_seconds_bucket{le="60"}[5m]
                ))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(
                  finops_portal_policy_propagation_seconds_count[5m]
                ))
  objectives:
    - displayName: "p95 ≤ 60 s (28d window)"
      target: 0.95
      timeWindow:
        - duration: 28d
          isRolling: true
  alertPolicies:
    - finops-portal-policy-propagation-burn-rate
