openapi: 3.2.0
info:
  title: finops-portal tenant invoice public API
  version: "0.1.0"
  description: |
    Tenant-facing invoice + credit-ledger + drill-down API.
    Authority: ADR-0199 cost-attribution canonical + ADR-0174 chargeback.
    Tier-A 4-INV applies to the kernel types that back this surface; the
    HTTP surface itself is a thin adapter over `finops-portal-tenant-billing-presentation-usecase`.
  contact:
    name: ops-finops council
    email: ops-finops@oyatie.com
servers:
  - url: https://api.oyatie.com
    description: production
  - url: https://api-staging.oyatie.com
    description: staging
security:
  - bearerAuth: []
tags:
  - name: invoices
  - name: credit-ledger
  - name: dashboards
  - name: focus-export
paths:
  /v1/tenants/{tenant_id}/invoices:
    get:
      tags: [invoices]
      summary: List tenant invoice periods
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: list of recent invoice periods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePeriodList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/TenantBoundary" }
  /v1/tenants/{tenant_id}/invoices/{period}:
    get:
      tags: [invoices]
      summary: Fetch the invoice for the given period
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: period
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        - in: query
          name: locale
          schema: { type: string, default: "en-US" }
      responses:
        "200":
          description: invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInvoice" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
  /v1/tenants/{tenant_id}/invoices/{period}.pdf:
    get:
      tags: [invoices]
      summary: Stream the invoice PDF
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: period
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: pdf
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
  /v1/tenants/{tenant_id}/invoices/{period}/finalize:
    post:
      tags: [invoices]
      summary: Finalize the invoice (ops-finops only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: period
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: finalized invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInvoice" }
        "409": { $ref: "#/components/responses/AlreadyFinalized" }
        "403": { $ref: "#/components/responses/TenantBoundary" }
  /v1/tenants/{tenant_id}/credit-ledger:
    get:
      tags: [credit-ledger]
      summary: Tenant credit ledger view for a period
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: period
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: ledger view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditLedgerView" }
  /v1/tenants/{tenant_id}/credit-ledger/entries:
    post:
      tags: [credit-ledger]
      summary: Append a credit ledger entry (customer-success / ops-finops)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditApplicationInput" }
      responses:
        "201":
          description: appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditApplication" }
        "409": { description: idempotency conflict }
  /v1/tenants/{tenant_id}/dashboards/{dashboard}/embed-url:
    get:
      tags: [dashboards]
      summary: Issue short-lived signed Grafana embed URL
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: dashboard
          required: true
          schema: { type: string, enum: [tenant-cost-drilldown, fleet-cost-rollup, anomaly-investigation] }
      responses:
        "200":
          description: signed url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedEmbedUrl" }
  /v1/tenants/{tenant_id}/focus-export:
    post:
      tags: [focus-export]
      summary: Trigger a FOCUS 1.3 export for the tenant + period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FocusExportRequest" }
      responses:
        "202":
          description: export accepted; poll location for completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusExportReceipt" }
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: finops-portal
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: missing or invalid JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TenantBoundary:
      description: principal cannot access the tenant resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotFound:
      description: no invoice exists for tenant+period
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AlreadyFinalized:
      description: invoice was already finalized; idempotent get instead
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    InvoicePeriodList:
      type: object
      required: [tenant_id, periods]
      properties:
        tenant_id: { type: string, format: uuid }
        periods:
          type: array
          items: { $ref: "#/components/schemas/InvoicePeriodSummary" }
    InvoicePeriodSummary:
      type: object
      required: [period, status, total_amount_cents]
      properties:
        period: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        status: { type: string, enum: [draft, finalized] }
        total_amount_cents: { type: integer, format: int64 }
        is_quarter_close: { type: boolean, default: false }
    TenantInvoice:
      type: object
      required: [tenant_id, period, lines, total_amount_cents, status]
      properties:
        tenant_id: { type: string, format: uuid }
        period: { type: string }
        status: { type: string, enum: [draft, finalized] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        credits:
          type: array
          items: { $ref: "#/components/schemas/CreditApplication" }
        total_amount_cents: { type: integer, format: int64 }
        presentation_currency: { type: string, default: "usd" }
        presentation_total: { type: number, format: double }
    InvoiceLine:
      type: object
      required: [cost_center, workload_class, amount_cents]
      properties:
        cost_center: { type: string }
        workload_class: { type: string, enum: [app, batch, gpu, storage, network, control] }
        amount_cents: { type: integer, format: int64 }
        service_category: { type: string }
        sub_account_id: { type: string }
        tags:
          type: object
          additionalProperties: { type: string }
    CreditApplication:
      type: object
      required: [id, tenant_id, source, amount_cents, issued_at]
      properties:
        id: { type: string, format: ulid }
        tenant_id: { type: string, format: uuid }
        source: { type: string, enum: [Negotiated, CommittedUse, SlaRefund] }
        amount_cents: { type: integer, format: int64 }
        issued_at: { type: string, format: date-time }
        applied_period: { type: string }
        reverses_id: { type: string, format: ulid, nullable: true }
    CreditApplicationInput:
      type: object
      required: [source, amount_cents, applied_period]
      properties:
        source: { type: string, enum: [Negotiated, CommittedUse, SlaRefund] }
        amount_cents: { type: integer, format: int64 }
        applied_period: { type: string }
        idempotency_key: { type: string }
    CreditLedgerView:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        period: { type: string }
        applied_credits_cents: { type: integer, format: int64 }
        carry_forward_cents: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CreditApplication" }
    SignedEmbedUrl:
      type: object
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    FocusExportRequest:
      type: object
      required: [period]
      properties:
        period: { type: string }
        format: { type: string, enum: [parquet, csv], default: parquet }
    FocusExportReceipt:
      type: object
      properties:
        export_id: { type: string, format: ulid }
        status: { type: string, enum: [pending, ready, failed] }
        download_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string }
        message: { type: string }
        correlation_id: { type: string }
