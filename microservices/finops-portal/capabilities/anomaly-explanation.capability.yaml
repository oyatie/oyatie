# Capability declaration — anomaly-explanation
# Authored 2026-05-18.
# Authority: ADR-0083 + EU AI Act Annex III risk classification.
schema_version: "1.0"
capability:
  id: anomaly-explanation
  microservice: finops-portal
  bounded_context: anomaly-explanation
  description: |
    Given a TenantCostAnomalySpike alert, produce a deterministic
    root-cause attribution (top contributing dimensions + correlated
    events). The output is consumed by humans (on-call ops-finops)
    and informs the recommendation engine (IP-012) for follow-up
    action.
  surface:
    public_api: false
    internal_api: true
  inputs:
    - anomaly (id, fired_at, observed_cost, baseline_cost)
    - cost slices (hourly granularity)
    - correlated events
    - tenant anomaly profile
  outputs:
    - explanation (top contributions, correlated events, confidence)
    - recommendation (NoOpKnownSafe | AwaitConfirmation | OpenFoundryTicket | PageCustomerSuccess)
  risk_class:
    risk_class: limited
    rationale: |
      The capability surfaces a deterministic explanation;
      humans (ops-finops) decide what to do with it. The
      recommendation engine outputs a SUGGESTION that the
      on-call rotation chooses to act on or not. Per EU AI Act,
      "limited risk" applies because:
      (1) No automated decision; outputs go to a human.
      (2) The algorithm is deterministic and auditable (no ML).
      (3) Tenants can request the explanation themselves and
          contest via customer-success.
    human_in_loop: true
    transparency_requirement: |
      Every explanation carries a `confidence ∈ [0.0, 1.0]`
      score with a transparent computation; the algorithm is
      documented in IP-011. No black-box ML.
    contestability: |
      Tenants disagreeing with an explanation can request a
      raw cost-slice download via customer-success.
  pii_classification:
    - tenant_id (medium)
    - dollar_amounts (medium)
    - correlated_events (low — system-level only)
  rate_limit:
    per_tenant_per_hour: 30
    per_fleet_per_minute: 600
  slo_bindings:
    - slos/anomaly-explanation-latency.openslo.yaml
  audit_chain_events:
    - AnomalyExplained
    - AnomalySuppressed
    - AnomalyRecommendationAcceptedByOncall
  retired: false
