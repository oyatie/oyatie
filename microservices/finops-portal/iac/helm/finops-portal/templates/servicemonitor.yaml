apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "oya.fullname" . }}
  labels:
    {{- include "oya.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      {{- include "oya.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_oya_io_cost_center]
          targetLabel: cost_center
        - sourceLabels: [__meta_kubernetes_pod_label_oya_io_workload_class]
          targetLabel: workload_class
        - sourceLabels: [__meta_kubernetes_pod_label_oya_io_regulatory_pack]
          targetLabel: regulatory_pack
