{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oya.fullname" . }}
  labels:
    {{- include "oya.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oya.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oya.io/scope: tenant-frontends
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              oya.io/scope: ops-portal
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    {{- range .Values.networkPolicy.egressAllowList }}
    - to:
        - namespaceSelector:
            matchLabels:
              oya.io/microservice: {{ . }}
    {{- end }}
{{- end }}
