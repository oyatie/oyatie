apiVersion: openslo/v1
kind: Service
metadata:
  name: ci-webhook-gateway
  displayName: CI Webhook Gateway
spec:
  description: >
    First-hop webhook receiver that gates PRs against dev by kicking the Jenkins
    oyaCiLane pipeline (ADR-0363/0366/0367/0374).
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ci-webhook-gateway-dispatch-latency-p99
spec:
  service: ci-webhook-gateway
  description: >
    p99 webhook-received -> Jenkins-kicked latency. Bounded per ADR-0112's
    carried-forward latency budget (p50 < 500ms, p99 < 5s).
  indicator:
    metadata:
      name: dispatch_latency_ms_p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(ci_webhook_gateway_dispatch_latency_ms_bucket{le="5000"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(ci_webhook_gateway_dispatch_latency_ms_count[5m]))
  objectives:
    - displayName: dispatch p99 latency <= 5000ms
      target: 0.99
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ci-webhook-gateway-signature-verify-availability
spec:
  service: ci-webhook-gateway
  description: >
    Fraction of deliveries whose signature verification completes without a
    server-side fault (5xx). Signature MISMATCH (401) is a correct outcome and
    counts as good; only 503 (secret unavailable) / 5xx faults count as bad.
  indicator:
    metadata:
      name: verify_non_fault_ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(ci_webhook_gateway_deliveries_total{outcome!~"5.."}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(ci_webhook_gateway_deliveries_total[5m]))
  objectives:
    - displayName: non-fault verification >= 99.9%
      target: 0.999
