{{- if .Values.externalSecret.enabled }}
# ExternalSecret pulls forgejo_ed25519_pub, jenkins_api_token, and github_token
# from OpenBao at secret/oya/ci-webhook-gateway via the External Secrets Operator.
# ADR-0387: ci-webhook-gateway-talos-deploy; ADR-0181: signed-image-promotion-required.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-secrets" .Values.microservice.id | trunc 63 | trimSuffix "-" | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0387: ci-webhook-gateway-talos-deploy
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
  annotations:
    oyatie.com/non-claim: {{ .Values.externalSecret.nonClaim | quote }}
    oyatie.com/audit-chain-event: "EVT-CI-WEBHOOK-GATEWAY-SECRET-SYNC"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: forgejo_ed25519_pub
      remoteRef:
        key: {{ .Values.externalSecret.openbaoPath | quote }}
        property: forgejo_ed25519_pub
    - secretKey: jenkins_api_token
      remoteRef:
        key: {{ .Values.externalSecret.openbaoPath | quote }}
        property: jenkins_api_token
    - secretKey: github_token
      remoteRef:
        key: {{ .Values.externalSecret.openbaoPath | quote }}
        property: github_token
{{- end }}
