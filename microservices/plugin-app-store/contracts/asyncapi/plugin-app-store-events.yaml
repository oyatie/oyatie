# Canonical-base: specs/contracts/asyncapi-3-1-canonical-envelope.yaml (SWEEP-I Slice 3 per ADR-0064)
# Version: AsyncAPI 3.1.0 — released 2026-01-31; current latest as of 2026-05-18.
asyncapi: 3.1.0
info:
  title: Oyatie Plugin/App Store Events
  version: 1.0.0
  description: |
    Async event surface for plugin-app-store.
    Lifecycle + install + vetting + per-plugin-permissions + rate-limit + subscription + audit events
    routed via the workflow-engine event bus.
servers:
  workflow-engine-event-bus:
    host: workflow-engine.oyatie.internal:9092
    protocol: kafka
    description: Internal event bus (Workflow + Ontology adapter layer)
channels:
  plugin-lifecycle-events:
    address: oya.plugin-app-store.plugin-lifecycle
    description: Plugin version state machine transitions
    messages:
      pluginSubmitted:
        $ref: '#/components/messages/PluginSubmitted'
      pluginVettingPassed:
        $ref: '#/components/messages/PluginVettingPassed'
      pluginVettingRejected:
        $ref: '#/components/messages/PluginVettingRejected'
      pluginPublished:
        $ref: '#/components/messages/PluginPublished'
      pluginRevoked:
        $ref: '#/components/messages/PluginRevoked'
  plugin-install-events:
    address: oya.plugin-app-store.plugin-install
    description: Per-tenant install + uninstall + permission events
    messages:
      pluginInstalled:
        $ref: '#/components/messages/PluginInstalled'
      pluginUninstalled:
        $ref: '#/components/messages/PluginUninstalled'
      pluginPermissionGranted:
        $ref: '#/components/messages/PluginPermissionGranted'
      pluginPermissionRevoked:
        $ref: '#/components/messages/PluginPermissionRevoked'
  plugin-rate-limit-events:
    address: oya.plugin-app-store.rate-limit
    messages:
      pluginRateLimitBreached:
        $ref: '#/components/messages/PluginRateLimitBreached'
  plugin-subscription-events:
    address: oya.plugin-app-store.subscription
    messages:
      pluginSubscriptionTierChanged:
        $ref: '#/components/messages/PluginSubscriptionTierChanged'
  plugin-action-stream:
    address: oya.plugin-app-store.plugin-action
    description: Per-plugin action audit trail; consumed by audit-chain µservice
    messages:
      pluginActionExecuted:
        $ref: '#/components/messages/PluginActionExecuted'
operations:
  emitPluginLifecycle:
    action: send
    channel: { $ref: '#/channels/plugin-lifecycle-events' }
  emitPluginInstall:
    action: send
    channel: { $ref: '#/channels/plugin-install-events' }
  emitPluginRateLimit:
    action: send
    channel: { $ref: '#/channels/plugin-rate-limit-events' }
  emitPluginSubscription:
    action: send
    channel: { $ref: '#/channels/plugin-subscription-events' }
  emitPluginAction:
    action: send
    channel: { $ref: '#/channels/plugin-action-stream' }
components:
  messages:
    PluginSubmitted:
      payload:
        $ref: '#/components/schemas/PluginLifecycleEvent'
    PluginVettingPassed:
      payload:
        $ref: '#/components/schemas/PluginLifecycleEvent'
    PluginVettingRejected:
      payload:
        $ref: '#/components/schemas/PluginVettingRejectedEvent'
    PluginPublished:
      payload:
        $ref: '#/components/schemas/PluginLifecycleEvent'
    PluginRevoked:
      payload:
        $ref: '#/components/schemas/PluginRevokedEvent'
    PluginInstalled:
      payload:
        $ref: '#/components/schemas/PluginInstallEvent'
    PluginUninstalled:
      payload:
        $ref: '#/components/schemas/PluginInstallEvent'
    PluginPermissionGranted:
      payload:
        $ref: '#/components/schemas/PluginPermissionEvent'
    PluginPermissionRevoked:
      payload:
        $ref: '#/components/schemas/PluginPermissionEvent'
    PluginRateLimitBreached:
      payload:
        $ref: '#/components/schemas/PluginRateLimitBreachedEvent'
    PluginSubscriptionTierChanged:
      payload:
        $ref: '#/components/schemas/PluginSubscriptionTierChangedEvent'
    PluginActionExecuted:
      payload:
        $ref: '#/components/schemas/PluginActionEvent'
  schemas:
    PluginLifecycleEvent:
      type: object
      required: [event_id, plugin_id, version, state_before, state_after, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        version: { type: string }
        state_before: { type: string }
        state_after: { type: string }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: ulid }
    PluginVettingRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/PluginLifecycleEvent'
        - type: object
          required: [rejection_stage, rejection_reason]
          properties:
            rejection_stage: { type: string }
            rejection_reason:
              type: object
              additionalProperties: true
    PluginRevokedEvent:
      allOf:
        - $ref: '#/components/schemas/PluginLifecycleEvent'
        - type: object
          required: [revocation_reason]
          properties:
            revocation_reason: { type: string }
    PluginInstallEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, version, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        version: { type: string }
        occurred_at: { type: string, format: date-time }
    PluginPermissionEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, capability, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        capability: { type: string }
        scope: { type: string }
        occurred_at: { type: string, format: date-time }
    PluginRateLimitBreachedEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, observed_rps, configured_rps, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        observed_rps: { type: number }
        configured_rps: { type: number }
        occurred_at: { type: string, format: date-time }
    PluginSubscriptionTierChangedEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, tier_before, tier_after, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        tier_before: { type: string }
        tier_after: { type: string }
        occurred_at: { type: string, format: date-time }
    PluginActionEvent:
      type: object
      required: [event_id, tenant_id, plugin_id, installation_id, action, occurred_at]
      properties:
        event_id: { type: string, format: ulid }
        tenant_id: { type: string, format: ulid }
        plugin_id: { type: string, format: ulid }
        installation_id: { type: string, format: ulid }
        action: { type: string }
        data_classes_touched:
          type: array
          items: { type: string }
        occurred_at: { type: string, format: date-time }
