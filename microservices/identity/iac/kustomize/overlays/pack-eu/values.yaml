# pack-eu overlay per GDPR Art. 32 + ADR-0179
packLabel: eu
zitadel:
  zitadelConfig:
    externalDomain: identity-eu.oyatie.com
    Telemetry:
      Endpoint: otel-collector.observability-eu.svc.cluster.local:4317
webauthn:
  attestation: indirect  # tightened to direct for pack-eu-regulated tenants
  rpId: identity-eu.oyatie.com
openbao:
  hsm:
    type: aws-cloudhsm
    region: eu-central-1
auditEmitter:
  retention_years: 7  # GDPR Art. 30 + national overlays
edgeAuthz:
  geo_default: allow
