# pack-ksa sovereign overlay per ADR-0179
packLabel: ksa
zitadel:
  zitadelConfig:
    externalDomain: identity-ksa.oyatie.com
    Telemetry:
      Endpoint: otel-collector.observability-ksa.svc.cluster.local:4317
webauthn:
  attestation: direct
  rpId: identity-ksa.oyatie.com
openbao:
  hsm:
    type: thales-luna
    location: ksa-riyadh-on-prem
aaguidRefresher:
  enforce_l1_plus: true
auditEmitter:
  retention_years: 5
edgeAuthz:
  geo_default: deny
  geo_allow: [SA]  # KSA-only residency
sovereign:
  air_gapped: true
  cross_pack_replication: forbidden
  dual_operator_for_critical: true
