apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: identity-geo-asn-block
  namespace: istio-ingress
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match: { context: GATEWAY }
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.geoip
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.geoip.v3.Geoip
            xff_config:
              xff_num_trusted_hops: 1
            provider:
              name: maxmind
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.geoip_providers.maxmind.v3.MaxMindConfig
                country_db_path: /etc/envoy/geoip/GeoLite2-Country.mmdb
                asn_db_path: /etc/envoy/geoip/GeoLite2-ASN.mmdb
                country_header: x-geoip-country
                asn_header: x-geoip-asn
---
# Per-pack overlay tightens; this is the base posture (no global block).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: identity-asn-deny-list
  namespace: istio-ingress
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match: { context: GATEWAY }
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              -- Block requests from known-botnet ASNs.
              -- Updated quarterly by ops-security via PR.
              local DENY_ASNS = { "AS9009", "AS200651" }  -- example placeholders
              function envoy_on_request(request_handle)
                local asn = request_handle:headers():get("x-geoip-asn")
                if asn then
                  for _, deny in ipairs(DENY_ASNS) do
                    if asn == deny then
                      request_handle:respond(
                        { [":status"] = "403", ["x-block-reason"] = "asn" },
                        "blocked-by-asn-deny-list"
                      )
                      return
                    end
                  end
                end
              end
