apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zitadel-restrict
  namespace: identity-{{ .Values.packLabel }}
  labels:
    pack: {{ .Values.packLabel | quote }}
    app.kubernetes.io/part-of: identity
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  # Ingress: only from Istio Ambient waypoint + Prometheus scraper.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: istio-system
            app: ztunnel
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
  # Egress: only to Postgres + OpenBao + audit-chain + FIDO-MDS3 (via internet egress proxy).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: identity-postgres
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cloud-secrets
            app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: audit-chain
            app.kubernetes.io/name: audit-chain-server
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # DNS resolution.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    # FIDO-MDS3 fetch via egress gateway only.
    - toFQDNs:
        - matchName: mds.fidoalliance.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
