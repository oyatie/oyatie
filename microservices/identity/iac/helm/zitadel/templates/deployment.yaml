apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: identity-{{ .Values.packLabel }}
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: identity-{{ .Values.packLabel }}
    app.kubernetes.io/component: zitadel-server
    app.kubernetes.io/part-of: identity
    pack: {{ .Values.packLabel | quote }}
    istio.io/dataplane-mode: ambient
spec:
  replicas: {{ .Values.zitadel.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/instance: identity-{{ .Values.packLabel }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/instance: identity-{{ .Values.packLabel }}
        pack: {{ .Values.packLabel | quote }}
        sidecar.istio.io/inject: "false"  # ambient mode; no sidecar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/debug/metrics"
    spec:
      serviceAccountName: zitadel
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.zitadel.podSecurityContext | nindent 8 }}
      containers:
        - name: zitadel
          image: "{{ .Values.zitadel.image.repository }}:{{ .Values.zitadel.image.tag }}"
          imagePullPolicy: {{ .Values.zitadel.image.pullPolicy }}
          args: ["start-from-init", "--config", "/etc/zitadel/config.yaml", "--steps", "/etc/zitadel/steps.yaml", "--masterkey-file", "/var/openbao/secrets/masterkey"]
          ports:
            - name: oidc
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: zitadel-postgres-user, key: host } }
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              valueFrom: { secretKeyRef: { name: zitadel-postgres-user, key: port } }
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              valueFrom: { secretKeyRef: { name: zitadel-postgres-user, key: database } }
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              valueFrom: { secretKeyRef: { name: zitadel-postgres-user, key: username } }
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: zitadel-postgres-user, key: password } }
            - name: ZITADEL_EXTERNALDOMAIN
              value: identity-{{ .Values.packLabel }}.oyatie.com
            - name: ZITADEL_EXTERNALSECURE
              value: "true"
            - name: ZITADEL_LOG_LEVEL
              value: info
            - name: ZITADEL_METRICS_PROMETHEUS_ENABLED
              value: "true"
          resources:
            {{- toYaml .Values.zitadel.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.zitadel.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/zitadel
              readOnly: true
            - name: openbao-secrets
              mountPath: /var/openbao/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /ready
              port: admin
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
      volumes:
        - name: config
          configMap:
            name: zitadel-config
        - name: openbao-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: openbao-zitadel-{{ .Values.packLabel }}
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          # Spread across AZs per ADR-0148 layered mesh.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: zitadel
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
