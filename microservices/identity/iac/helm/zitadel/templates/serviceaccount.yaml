apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel
  namespace: identity-{{ .Values.packLabel }}
  labels:
    app.kubernetes.io/part-of: identity
    pack: {{ .Values.packLabel | quote }}
  annotations:
    # SPIFFE identity binding per ADR-0148.
    spiffe.io/spiffeid: spiffe://identity.{{ .Values.packLabel }}.oyatie.dev/sa/zitadel-server
