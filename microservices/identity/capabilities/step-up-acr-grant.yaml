# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:identity:step-up-acr-grant:v1
name: step-up-acr-grant
namespace: identity
display_name: Grant ACR step-up
description: |
  Orchestrate the step-up flow per ADR-0189: select factor sequence for
  required ACR class (elevated / sensitive / critical), drive WebAuthn
  re-tap + optional hardware-key + optional JIT IT-approval, mint a new
  OIDC token with elevated acr + bumped acr_event_at on success.

owner_team: axis-identity
maturity: stable
created_at: 2026-05-18
related_adrs: [ADR-0189]

autonomy_tier: T1
# T1 = orchestrated multi-step ceremony with factor evaluation; not pure
# deterministic protocol.

risk_class: limited
# Factor-class decisioning carries limited risk under EU AI Act Annex IV
# operational-decisioning; not high-risk (no profiling for hiring etc.).

inputs:
  - name: required_acr
    type: string
    enum: [elevated, sensitive, critical]
    required: true
  - name: return_to
    type: uri
    required: true
  - name: resource_uri
    type: uri
    required: true
  - name: current_acr
    type: string
    required: true

outputs:
  - name: new_id_token
    type: string
  - name: new_acr
    type: string
  - name: acr_event_at
    type: integer

slo_targets:
  - oya-identity-step-up-grant-latency

audit_events_emitted:
  - IdentityStepUpGranted
  - IdentityStepUpDenied

failure_modes:
  - factor_failed (401 + retry)
  - max_attempts_exceeded (423 Locked)
  - it_approval_timeout (401)
  - resource_not_bound_to_approval (403)

security_controls:
  - Per-resource IT-approval token (one-time-use, 5min TTL)
  - Rate-limit 3 grants per user per 60s
  - Second-factor must be different from first (no repeat same Passkey)
  - Hardware key (FIDO-MDS3 L2+) required for critical class
