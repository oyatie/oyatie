# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:identity:scim-user-provision:v1
name: scim-user-provision
namespace: identity
display_name: Provision user via SCIM 2.0
description: |
  Inbound SCIM 2.0 (RFC 7643/7644) user lifecycle: create / update / suspend /
  delete. Driven by enterprise IdPs (Okta / Microsoft Entra / Google Workspace).

  Cascade: emits IdentityUserProvisioned which fans out to tenancy µservice
  (per-tenant inventory) and audit-chain.

owner_team: axis-identity
maturity: stable
created_at: 2026-05-18
related_adrs: [ADR-0190]

autonomy_tier: T2
# T2 = bulk operations with vendor-specific dialect handling.

risk_class: limited
# Lifecycle propagation may affect access decisioning downstream; limited.

inputs:
  - name: tenant
    type: string
    required: true
  - name: scim_request_body
    type: object (SCIM JSON)
    required: true
  - name: scim_bearer
    type: string
    required: true

outputs:
  - name: scim_response_body
    type: object (SCIM JSON)

slo_targets:
  - oya-identity-scim-availability

audit_events_emitted:
  - IdentityScimRequestReceived
  - IdentityUserProvisioned / IdentityUserSuspended / IdentityUserDeleted

failure_modes:
  - bearer_invalid (401)
  - cross_tenant_attempt (403)
  - uniqueness_conflict (409)
  - invalid_filter (400)
  - upstream_zitadel_5xx (503)

security_controls:
  - Per-tenant bearer rotated 90d
  - Constant-time bearer comparison
  - Cedar policy enforces principal.scim_bearer_tenant_id == resource.tenant_id
  - Idempotency-key required per ADR-0149
