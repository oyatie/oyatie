# microservices/identity/capabilities/tenant-class-caps.yaml
# Per ADR-0331 §D-5. tenant_class quota declarations for the identity µservice.
# Per ADR-0322 substance bar: every numeric value below is bespoke for identity.

apiVersion: oyatie.platform/v1
kind: TenantClassCaps
metadata:
  microservice: identity
  adr_refs:
    - ADR-0329  # tier system retired
    - ADR-0330  # tenant_class replacement model
    - ADR-0331  # cross-µservice adoption template
    - ADR-0244  # tenant scoping primitive
    - ADR-0243  # Cedar gate
    - ADR-0316  # superseded by ADR-0329 (kept for traceability)
    - ADR-0117  # OpenBao SecretReference substrate
    - ADR-identity-001  # JWKS rotation cadence
    - ADR-identity-003  # SCIM rate limits
    - ADR-identity-005  # JIT IT-approval (critical ACR)
  authored_by: wave-15a-identity-fix
  authored_at: 2026-05-21

demo_trial:
  # Hard caps — enforced by Cedar fragment policies/tenant-class.cedar clause (3).
  # All values are µservice-specific; substance bar applies.
  caps:
    max_users_per_tenant:                  25
    max_passkeys_per_user:                 5
    max_active_sessions_per_tenant:        50
    scim_ops_per_minute_per_tenant:        30          # ADR-identity-003 derated for trial (vs paid 100)
    oidc_token_issues_per_day_per_tenant:  5000
    webauthn_authentications_per_day:      2500
    aaguid_attestations_kept_unique:       50
    external_idp_federations:              0           # demo_trial cannot bind external IdPs
    hris_adapter_connections:              0           # demo_trial cannot connect HRIS
    max_step_up_acr_level:                 "aal2_passkey_uv"   # critical is paid-only per clause (7)
    concurrent_scim_bearers_per_tenant:    1

  # Time gate per ADR-0330 §B.3.4.
  time_expiry_days:                30
  expiry_grace_days:                7

  # Cap-breach behavior per ADR-0330 §B.3.11.
  cap_breach_response:             soft_deny           # read paths remain open during grace
  cap_breach_grace_days:           7
  cap_breach_notification:         email_and_in_app

  # SLO posture per ADR-0330 §B.3.5 (best-effort, uniform quality bar).
  slo_class:                       best_effort
  slo_oidc_token_issue_p95_ms:     150                 # paid target = 50ms; demo_trial best-effort
  slo_webauthn_authenticate_p95_ms: 300                # paid target = 100ms
  slo_scim_provisioning_p99_ms:    2000                # paid target = 500ms
  slo_availability_pct:            99.0

  # Forbidden surfaces per ADR-0330 §B.3.6..B.3.8 + ADR-0331 §D-4.
  forbidden_features:
    - compliance_pack_activation
    - provider_byok_enable
    - external_idp_federation_bind
    - hris_adapter_connect
    - marketplace_publish_listing
    - marketplace_purchase_listing
    - sovereign_cell_routing
    - step_up_acr_critical
    - jit_it_approval_request
    - tenant_admin_break_glass

  # Default infrastructure per ADR-0329 §B2.026 + ADR-0330 §B.3.2.
  default_deployment_context:      guest-on-oci
  default_iac_module:              iac/oci-guest/always-free/

paid:
  # No caps by default; paid tenants scale with their contracted billing components.
  caps: {}

  # No time gate.
  time_expiry_days:                null

  # SLO posture per ADR-0330 §B.4.4 (contractual, uniform quality bar with paid commitment).
  slo_class:                       contractual
  slo_oidc_token_issue_p95_ms:     50
  slo_oidc_token_issue_p99_ms:     100
  slo_webauthn_authenticate_p95_ms: 100
  slo_webauthn_authenticate_p99_ms: 200
  slo_scim_provisioning_p99_ms:    500
  slo_jwks_availability_pct:       99.999
  slo_availability_pct:            99.95

  # Permitted billing_components emitted by identity per ADR-0331 §D-1.7..D-1.9.
  # identity emits per_seat (active-seat count) and per_usage (token issuance,
  # WebAuthn authentication, SCIM operations). It does NOT directly emit
  # revenue_share — that is the marketplace + payments µservices.
  permitted_billing_components:
    - per_seat
    - per_usage

  # Permitted surfaces.
  permitted_features:
    - compliance_pack_activation
    - provider_byok_enable
    - external_idp_federation_bind
    - hris_adapter_connect
    - marketplace_publish_listing
    - marketplace_purchase_listing
    - sovereign_cell_routing
    - step_up_acr_critical
    - jit_it_approval_request
    - tenant_admin_break_glass
    - cross_tenant_collaboration
    - mobile_sdk_extended_session

  # Default infrastructure choice (paid tenants select at provisioning per ADR-0330 §B.4.2).
  default_deployment_context_choice:
    - oyatie-public-cloud
    - guest-on-aws
    - guest-on-oci
    - on-prem
    - colo
    - oyatie-as-cloud-provider

  # Usage meters that identity emits to cloud-billing for per_usage billing
  # component. Per ADR-0331 §D-1.10 + ADR-0263 emission contract.
  per_usage_meter_shape:
    - identity.oidc.token_issued_per_thousand
    - identity.webauthn.authentication_per_thousand
    - identity.scim.operations_per_thousand
    - identity.step_up.grant_per_thousand
    - identity.session.active_concurrent_seconds_per_million

  # Per_seat seat-counting unit for identity per ADR-0330 §B.6.2..B.6.3.
  per_seat_unit:
    name: "active_human_user"
    deactivation_grace_days: 7
    over_seat_behavior:      fail_closed_with_clear_error
