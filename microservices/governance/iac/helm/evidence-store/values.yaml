# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Evidence-store values (OCI Object Storage; S3-compatible)
# Per microservices/governance/policy/data-residency.md per-pack overlay
# Per microservices/governance/threat-model.md §T-I-02
# Per microservices/governance/compliance.md SOC 2 CC7.4 + ISO 27001 A.5.33

global:
  microservice: governance
  pack: pack-kr                        # overridden per overlay
  region: ap-seoul-1

bucket:
  name: governance-evidence-pack-kr
  # Region pinned per data-residency
  region: ap-seoul-1

  # Compliance-mode object-lock per SOC 2 CC7.4
  objectLock:
    enabled: true
    mode: COMPLIANCE                   # vs GOVERNANCE; COMPLIANCE refuses retention shortening
    defaultRetentionDays: 2557         # 7y baseline

  # Per-pack retention overrides (refer to policy/data-residency.md)
  retentionByDataClass:
    AUDIT: 2557                        # 7y (SOC 2 + ISO 27001)
    BEHAVIORAL_TENANT_PRODUCT: 730     # 2y (non-audit views)
    INTERNAL_ONLY: 730
    # pack-us-healthcare overlay extends AUDIT to 2192 (6y; HIPAA §164.316(b)(2))
    # pack-kr overlay extends commercial-code-bound to 1827 (5y)

  versioning:
    enabled: true

  # SSE-KMS per pack KMS keyring
  encryption:
    type: SSE-KMS
    kmsKeyId: ${KMS_KEYRING_PACK_KR}    # injected from OpenBao
    customerManaged: true

  # Bucket policy: deny public access + cross-account
  publicAccessBlock:
    blockPublicAcls: true
    ignorePublicAcls: true
    blockPublicPolicy: true
    restrictPublicBuckets: true

  # T-I-02 mitigation: deny external principals
  bucketPolicy:
    refuseExternalPrincipal: true
    refuseInsecureTransport: true

  # Per-microservice key prefix per cost-budget.md sharding
  prefixStructure:
    pattern: "{microservice}/{year}/{month}/{lane-id}/{finding-hash}.blob"
    objectsPerPrefixCap: 100000000     # 100M; partition trigger

  # Lifecycle: hot (Standard) → cold (Archive) at 90d
  lifecycleRules:
    - id: hot-to-cold-90d
      enabled: true
      transitions:
        - days: 90
          storageClass: ARCHIVE
      noncurrentVersionExpiration:
        days: 365

  # Quarterly review per runbooks/aggregation-rebuild.md
  reviewCadence: quarterly

iam:
  # Per-µservice scoped role
  evidenceEmitterRole:
    name: governance-evidence-emitter-write
    permissions:
      - "s3:PutObject"
      - "s3:PutObjectAcl"
      - "s3:GetObject"
    resourceScope: "arn:oci:s3:::governance-evidence-pack-kr/*"

  replayReaderRole:
    name: governance-replay-reader
    permissions:
      - "s3:GetObject"
      - "s3:ListBucket"
    resourceScope: "arn:oci:s3:::governance-evidence-pack-kr/*"

  # Auditor JIT role per auditor-scope.cedar
  auditorJitRole:
    name: governance-auditor-jit
    permissions:
      - "s3:GetObject"
      - "s3:ListBucket"
    resourceScope: "arn:oci:s3:::governance-evidence-pack-kr/*"
    sessionTtlSeconds: 3600           # 1h max

monitoring:
  prometheus:
    enabled: true
    exporter:
      image: ghcr.io/oyatie/s3-exporter:0.1.0

audit:
  cloudTrailEquivalent:
    enabled: true                      # OCI Audit Service
    target: audit-chain.audit-chain.svc.cluster.local
