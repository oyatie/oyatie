# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Postgres HA values for governance µservice
# Per microservices/governance/capacity-model.md §"Worked example: oyatie XS tier"
# Per microservices/governance/multi-region.md §"Topology per pack"
# Per microservices/governance/threat-model.md §T-T-03 + §F-05

global:
  microservice: governance
  pack: pack-kr                        # overridden per overlay
  region: ap-seoul-1

postgresql:
  version: "16"
  numberOfInstances: 3                 # 1 primary + 2 sync replicas (HA per F-05)

  # Sizing per capacity-model.md XS tier
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  volume:
    size: 50Gi
    storageClass: oci-bv-balanced       # OCI Block Volume Balanced perf tier

  parameters:
    # Sync replication for RPO=0 per multi-region.md
    synchronous_commit: "on"
    synchronous_standby_names: "ANY 2 (replica-0, replica-1)"
    # Per-µservice fairness via per-runner role
    max_connections: "200"
    shared_buffers: "2GB"
    work_mem: "16MB"
    maintenance_work_mem: "256MB"
    # WAL-G compatible
    archive_mode: "on"
    archive_command: "wal-g wal-push %p"
    # Logical replication for read-replica scaling
    wal_level: "logical"
    max_wal_senders: "10"
    max_replication_slots: "10"

  # T-T-03: row-level security + per-runner role separation
  initSql:
    - "CREATE ROLE lane_runtime_writer;"
    - "CREATE ROLE replay_reader;"
    - "CREATE ROLE governance_admin;"
    - "ALTER TABLE findings ENABLE ROW LEVEL SECURITY;"
    - "CREATE POLICY tenant_isolation ON findings FOR SELECT USING (microservice = current_setting('app.microservice'));"

  # Backups via WAL-G to S3 (per OCI-compatible S3)
  backups:
    walg:
      enabled: true
      target: s3://governance-postgres-backup-pack-kr/
      schedule: "0 */4 * * *"           # every 4h base backup
      retention: 30d                    # 30d base; WAL continuous

  monitoring:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

  # Failover per F-05 (≤30s auto-failover)
  patroni:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576    # 1 MB
    synchronous_mode: true              # required for RPO=0

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["governance-postgres"]
          topologyKey: kubernetes.io/hostname

  tolerations: []

  networkPolicy:
    enabled: true
    allowedNamespaces:
      - governance
    allowedHosts:
      - lane-runtime
      - policy-engine
      - evidence-emitter
      - aggregation-indexer

connections:
  # Per-component pool sizes
  laneRuntime:
    poolSize: 30
    role: lane_runtime_writer
  policyEngine:
    poolSize: 20
    role: lane_runtime_writer
  evidenceEmitter:
    poolSize: 30
    role: lane_runtime_writer
  aggregationIndexer:
    poolSize: 10
    role: lane_runtime_writer
  replayApi:
    poolSize: 20
    role: replay_reader
