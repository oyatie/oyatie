# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs
# pack-KR overlay over default values.yaml.

global:
  pack: pack-kr
  region: ap-seoul-1

waypoint:
  replicaCount: 2                              # KR pack — single-region HA
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
    oyatie/regulatory-pack: pack-kr

authorizationPolicy:
  fragments:
    pack-kr:
      - pack-kr-pipa-art-17-cross-border

observability:
  tracing:
    samplingRate: 100
