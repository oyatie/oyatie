# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs
# pack-KSA overlay over default values.yaml.
#
# Sovereign tier: waypoint runs under kata-clh-sev-snp (AMD SEV-SNP confidential VM)
# per ADR-0147 ladder + ADR-0174 sovereign-tier override.

global:
  pack: pack-ksa
  region: me-jeddah-1

waypoint:
  replicaCount: 2
  runtimeClassName: kata-clh-sev-snp           # sovereign-tier confidential VM
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
    oyatie/regulatory-pack: pack-ksa
    oyatie/amd-sev-snp: "true"

authorizationPolicy:
  fragments:
    pack-ksa:
      - pack-ksa-pdpl-sovereign-routing

observability:
  tracing:
    samplingRate: 100
