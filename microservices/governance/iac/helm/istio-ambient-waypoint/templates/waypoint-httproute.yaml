{{- /*
  HTTPRoute resources for L7 policy under the waypoint Gateway.
  Per ADR-0174 + Gateway API v1.0.

  Each HTTPRoute attaches to the waypoint Gateway and exposes one in-namespace
  service through the L7 dataplane. AuthorizationPolicy (sibling template) then
  enforces regulatory rules on the HTTPRoute's path/method matches.

  Default routes catch all traffic and let AuthZ decide the regulatory outcome.
  Per-pack overlays add specific routes for:
    - /tasks/auto-assign (pack-eu, pack-kr) for employment context
    - /foundry/providers (pack-eu) for AI Act Annex III
    - /mail/egress    (pack-eu, pack-kr) for cross-border egress
    - /recordings/{id}  (pack-us-healthcare) for HIPAA min-necessary
    - /messenger/dm     (pack-us-healthcare) for PHI in DMs
    - /anonymous/legal-disclosure (pack-eu, pack-kr) for legal-process gating
*/}}
{{- range $route := .Values.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Values.waypoint.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: istio-ambient-waypoint-route
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: oyatie-mesh
    oyatie/microservice: governance
    oyatie/pack: {{ $.Values.global.pack }}
    oyatie/region: {{ $.Values.global.region }}
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
  annotations:
    oyatie.adr/primary: ADR-0174
spec:
  parentRefs:
    {{- range $route.parentRefs }}
    - name: {{ .name }}
      kind: Gateway
      group: gateway.networking.k8s.io
    {{- end }}
  rules:
    {{- range $rule := $route.rules }}
    - matches:
        {{- range $match := $rule.matches }}
        - {{- if $match.path }}
          path:
            type: {{ $match.path.type }}
            value: {{ $match.path.value }}
          {{- end }}
          {{- if $match.method }}
          method: {{ $match.method }}
          {{- end }}
          {{- if $match.headers }}
          headers:
            {{- toYaml $match.headers | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if $rule.filters }}
      filters:
        {{- toYaml $rule.filters | nindent 8 }}
      {{- end }}
      {{- if $rule.backendRefs }}
      backendRefs:
        {{- toYaml $rule.backendRefs | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
