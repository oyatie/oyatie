{{- /*
  AuthorizationPolicy v1beta1 (Istio Security CRD) wiring per ADR-0174.

  This template emits a CATCH-ALL DENY AuthorizationPolicy that anchors the
  waypoint at L7. The per-pack regulatory anchor fragments live as Kustomize
  component resources at:
    microservices/governance/iac/kustomize/components/istio-waypoint-policies/

  The per-pack overlay composes the relevant fragments into the namespace
  alongside this catch-all. The catch-all acts as the deny-by-default base
  layer; pack-anchor fragments are higher-priority ALLOW rules with regulatory
  envelope shaping carried in EnvoyFilter siblings.

  Reference fragment list (compiled per pack from .Values.authorizationPolicy.fragments):
    pack-eu              : pack-eu-risk_anchor-iii-refusal,
                            pack-eu-gdpr-art-22-routing,
                            pack-eu-dsa-transparency
    pack-kr              : pack-kr-pipa-art-17-cross-border
    pack-us-healthcare   : pack-us-healthcare-hipaa-minimum-necessary
    pack-ksa             : pack-ksa-pdpl-sovereign-routing
    pack-uae             : pack-uae-pdpl-cybersecurity-council
*/}}
{{- if .Values.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.waypoint.name }}-deny-by-default
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: istio-ambient-waypoint-authzpolicy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: oyatie-mesh
    oyatie/microservice: governance
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/region: {{ .Values.global.region }}
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-role: deny-by-default
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.cedar.source: "policy/tenant-scope.cedar"
    oyatie.fragments-composed: |
      {{- $pack := .Values.global.pack -}}
      {{- $fragments := index .Values.authorizationPolicy.fragments $pack -}}
      {{- if $fragments }}
      {{- range $fragments }}
      - {{ . }}
      {{- end }}
      {{- end }}
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ .Values.waypoint.name }}
  action: DENY
  rules:
    # Deny-by-default at the catch-all path. The per-pack ALLOW fragments (loaded
    # via Kustomize from components/istio-waypoint-policies/) raise the bar by
    # adding specific ALLOW rules with regulatory-anchor labels.
    - to:
        - operation:
            paths: ["/*"]
      when:
        # The deny fires only when no upstream ALLOW matched; this is the
        # standard Istio deny-by-default idiom under Gateway API targetRefs.
        - key: request.auth.claims[iss]
          notValues: ["https://oyatie.example/issuer/internal"]
---
# Catch-all AuditLogging policy: every waypoint decision (allow or deny) is
# annotated for the observability µservice + audit-chain seal emission.
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: {{ .Values.waypoint.name }}-audit-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.waypoint.name }}
    app.kubernetes.io/component: istio-ambient-waypoint-telemetry
    oyatie/pack: {{ .Values.global.pack }}
    oyatie/adr: ADR-0174
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ .Values.waypoint.name }}
  accessLogging:
    - providers:
        - name: otel
      match:
        mode: CLIENT_AND_SERVER
  tracing:
    - providers:
        - name: tempo
      randomSamplingPercentage: {{ .Values.observability.tracing.samplingRate }}
      customTags:
        oyatie.pack:
          literal:
            value: {{ .Values.global.pack | quote }}
        oyatie.regulatory_tier:
          literal:
            value: "tier-2-a"
        oyatie.adr:
          literal:
            value: "ADR-0174"
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: ALL_METRICS
          tagOverrides:
            oyatie_pack:
              value: {{ .Values.global.pack | quote }}
            oyatie_regulatory_tier:
              value: "tier-2-a"
{{- end }}
