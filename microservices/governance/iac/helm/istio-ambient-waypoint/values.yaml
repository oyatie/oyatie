# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
# Per ADR-0174 — Istio Ambient waypoint for regulatory-heavy packs
# Default values; pack-specific overlays under values-<pack>.yaml override.

global:
  microservice: governance
  pack: pack-eu                                # overridden per overlay
  region: eu-frankfurt-1                       # overridden per overlay
  istioVersion: "1.24.1"                       # LTS pin per Chart.yaml appVersion
  istioRevision: "1-24"                        # canary-channel revision tag

# -----------------------------------------------------------------------------
# Waypoint deployment shape (Envoy-as-waypoint)
# -----------------------------------------------------------------------------
waypoint:
  enabled: true
  # Waypoint name per Gateway API spec — namespace + suffix
  name: oyatie-regulatory-waypoint
  # Replica count for HA (≥2 mandatory for regulatory enforcement availability)
  replicaCount: 2
  # Pod anti-affinity: spread across nodes for HA
  antiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
  # Pod disruption budget per ADR-0148 Tier-2 availability target
  pdb:
    enabled: true
    minAvailable: 1
  image:
    # Istio proxy (Envoy) image; matches istioVersion pinned in global
    repository: docker.io/istio/proxyv2
    tag: "1.24.1-distroless"                   # distroless per ADR-0146
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: oyatie-istio-pullsecret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Pod security context (CIS restricted; ADR-0146)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1337
    runAsGroup: 1337
    fsGroup: 1337
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # RuntimeClass selection — default runc; sovereign/confidential packs override to kata-clh-sev-snp
  runtimeClassName: istio-ambient-waypoint
  # Node affinity to Istio-Ambient-capable nodes (cell-pack-<pack> tier per ADR-0174 + cell PRD)
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
  tolerations: []
  # Topology spread for multi-AZ
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: oyatie-regulatory-waypoint

# -----------------------------------------------------------------------------
# Gateway API resource (waypoint binding)
# -----------------------------------------------------------------------------
gateway:
  enabled: true
  gatewayClassName: istio-waypoint
  # Listener: terminates mTLS-from-ztunnel, exposes L7 to AuthorizationPolicy
  listeners:
    - name: mesh-l7
      port: 15008                              # Istio Ambient waypoint port
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same                           # waypoint is per-namespace
  addresses: []

# -----------------------------------------------------------------------------
# HTTPRoute resources (L7 routing under the waypoint)
# -----------------------------------------------------------------------------
httpRoutes:
  # Default route catches all in-namespace traffic and lets AuthZ decide
  - name: catch-all
    parentRefs:
      - name: oyatie-regulatory-waypoint
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # No filter on default path; AuthZ at L7 decides outcome

# -----------------------------------------------------------------------------
# AuthorizationPolicy (Cedar-emitted)
# -----------------------------------------------------------------------------
authorizationPolicy:
  enabled: true
  # The list of pack-anchor fragments to compose. Each fragment is owned by
  # microservices/governance/iac/kustomize/components/istio-waypoint-policies/.
  # The Helm chart references them by name; Kustomize composition wires the
  # actual CRDs into the cluster. This field declares WHICH fragments apply
  # per pack so the auditor can read one source of truth.
  fragments:
    pack-eu:
      - pack-eu-risk_anchor-iii-refusal
      - pack-eu-gdpr-art-22-routing
      - pack-eu-dsa-transparency
    pack-kr:
      - pack-kr-pipa-art-17-cross-border
    pack-us-healthcare:
      - pack-us-healthcare-hipaa-minimum-necessary
    pack-ksa:
      - pack-ksa-pdpl-sovereign-routing
    pack-uae:
      - pack-uae-pdpl-cybersecurity-council

# -----------------------------------------------------------------------------
# Regulatory response shape (carried in EnvoyFilter Lua / Wasm)
# -----------------------------------------------------------------------------
regulatoryResponseShape:
  enabled: true
  # GDPR Art. 22 response on automated-decision denial
  gdprArt22:
    statusCode: 451                            # Unavailable For Legal Reasons (RFC 7725)
    headers:
      X-Oyatie-Regulation: "GDPR-Art-22"
      X-Oyatie-Right-To-Human-Review: "true"
      X-Oyatie-Review-Endpoint: "https://app.oyatie.example/dsr/human-review"
    bodyTemplate: |
      {
        "regulation": "GDPR Art. 22",
        "decision": "denied",
        "reason": "automated_decision_refused_for_employment_context",
        "right_to_human_review": {
          "available": true,
          "endpoint": "https://app.oyatie.example/dsr/human-review",
          "sla_business_days": 30
        }
      }
  # EU DSA Art. 17 statement-of-reasons
  euDsaArt17:
    statusCode: 451
    headers:
      X-Oyatie-Regulation: "EU-DSA-Art-17"
      X-Oyatie-Statement-Of-Reasons: "embedded"
    bodyTemplate: |
      {
        "regulation": "EU DSA Art. 17",
        "statement_of_reasons": {
          "decision_type": "content_moderation_action",
          "facts_and_circumstances": "see body.detail",
          "legal_ground": "Terms of Service §<svc-version>",
          "redress_path": "https://app.oyatie.example/dsa/redress",
          "out_of_court_dispute_settlement": "https://app.oyatie.example/dsa/oocs"
        }
      }
  # EU AI Act Annex III §4 employment-context refusal
  euAiActAnnexIII:
    statusCode: 451
    headers:
      X-Oyatie-Regulation: "EU-AI-Act-Annex-III-4"
      X-Oyatie-Human-Oversight: "required"
    bodyTemplate: |
      {
        "regulation": "EU AI Act 2024/1689 Annex III §4",
        "decision": "refused_high_risk_ai_employment_context",
        "human_oversight": {
          "endpoint": "https://app.oyatie.example/ai-act/human-oversight",
          "art_14_compliance": true
        }
      }
  # KR PIPA Art. 17 cross-border egress refusal
  krPipaArt17:
    statusCode: 451
    headers:
      X-Oyatie-Regulation: "KR-PIPA-Art-17"
      X-Oyatie-Cross-Border-Refused: "true"
    bodyTemplate: |
      {
        "regulation": "KR PIPA Art. 17",
        "decision": "cross_border_transfer_refused",
        "consent_required": true,
        "alternative_pseudonymous_processing_endpoint": "https://app.oyatie.example/pipa/22-2"
      }
  # HIPAA minimum-necessary scrubbing
  hipaaMinNecessary:
    statusCode: 200
    headers:
      X-Oyatie-Regulation: "HIPAA-164-502"
      X-Oyatie-Minimum-Necessary-Applied: "true"
    # Field-level scrubbing via Wasm filter; the Wasm module name is canonical:
    wasmModule: "oyatie-hipaa-min-necessary-scrubber:0.1.0"
    scrubbedFields:
      - "patient.ssn"
      - "patient.dob"
      - "patient.diagnosis"
      - "patient.prescription"
      - "provider.npi"
      - "claim.full"
  # KSA PDPL sovereign routing
  ksaPdpl:
    statusCode: 451
    headers:
      X-Oyatie-Regulation: "KSA-PDPL-Art-29"
      X-Oyatie-Sovereign-Routing: "applied"
      X-Oyatie-SAMA-Monitor: "true"
    bodyTemplate: |
      {
        "regulation": "KSA PDPL Art. 29 + SAMA-CSF v1.0",
        "decision": "sovereign_routing_applied",
        "data_residency": "ksa",
        "regulatory_monitor": "SAMA"
      }
  # UAE PDPL cross-border + Cybersecurity Council
  uaePdpl:
    statusCode: 451
    headers:
      X-Oyatie-Regulation: "UAE-PDPL-Art-22"
      X-Oyatie-Cross-Border-Refused: "true"
      X-Oyatie-Cybersecurity-Council-Monitor: "true"
    bodyTemplate: |
      {
        "regulation": "UAE Federal Decree-Law 45/2021 (PDPL) Art. 22-24",
        "decision": "cross_border_transfer_refused",
        "data_residency": "uae",
        "regulatory_monitor": "uae_cybersecurity_council"
      }

# -----------------------------------------------------------------------------
# Observability (waypoint Envoy access logs → observability µservice)
# -----------------------------------------------------------------------------
observability:
  enabled: true
  accessLog:
    enabled: true
    format: json
    fields:
      - timestamp
      - method
      - path
      - response_code
      - response_flags
      - upstream_cluster
      - downstream_remote_address
      - x-request-id
      - x-b3-traceid
      - oyatie.regulation
      - oyatie.regulation.article
      - oyatie.regulation.action
      - oyatie.pack
      - oyatie.tenant
    sink: otel-collector.observability.svc.cluster.local:4317
  metrics:
    enabled: true
    prometheusScrape: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        prometheus: oyatie-mesh-prometheus
  tracing:
    enabled: true
    provider: tempo
    endpoint: tempo.observability.svc.cluster.local:4317
    samplingRate: 100                          # 100% trace sampling on regulated traffic

# -----------------------------------------------------------------------------
# Audit-chain integration
# -----------------------------------------------------------------------------
auditChain:
  enabled: true
  # Every denied request emits an audit-chain seal at the waypoint
  emitOnDeny: true
  emitOnAllow: false                           # allows are not regulatory events
  sink: audit-chain.audit-chain.svc.cluster.local:50051
  sealKind: REGULATORY_WAYPOINT_DECISION

# -----------------------------------------------------------------------------
# ztunnel (Ambient L4 on-ramp)
# -----------------------------------------------------------------------------
# Note: ztunnel is operated cluster-wide as a DaemonSet by the istio-system
# install; this chart does NOT install ztunnel. It only declares the
# expectation that ztunnel is present (via a precondition check helm hook).
ztunnel:
  expected: true
  precondition:
    daemonSet: ztunnel
    namespace: istio-system
    minVersion: "1.24.1"

# -----------------------------------------------------------------------------
# Cilium interop (this waypoint layers on Cilium per ADR-0148)
# -----------------------------------------------------------------------------
ciliumInterop:
  # Declares the dataplane-mode label this chart expects on the target namespace
  dataplaneModeLabel:
    key: istio.io/dataplane-mode
    value: ambient
  # CNP exemption: ztunnel/waypoint traffic uses Istio mTLS, not Cilium mTLS,
  # for in-namespace traffic. The cell µservice's policy compiler emits a CNP
  # exemption fragment matching the waypoint workload selector.
  cnpExemption:
    enabled: true
    workloadSelectorMatchLabels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint

# -----------------------------------------------------------------------------
# Compliance metadata
# -----------------------------------------------------------------------------
compliance:
  adr: ADR-0174
  ownerAxis: axis-governance
  legalAxisSignOffRequired: true
  evidenceArtifacts:
    - waypoint-deployment.yaml
    - waypoint-gateway.yaml
    - waypoint-httproute.yaml
    - waypoint-authzpolicy.yaml
