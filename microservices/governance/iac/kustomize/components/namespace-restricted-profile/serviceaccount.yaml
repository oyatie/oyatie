apiVersion: v1
kind: ServiceAccount
metadata:
  # name is overridden per-µservice via commonAnnotations / namePrefix
  name: PLACEHOLDER_SERVICEACCOUNT
  namespace: PLACEHOLDER_NAMESPACE
  annotations:
    # SPIFFE identity comes from per-µservice overlay
    spiffe.io/spiffe-id: spiffe://oyatie.dev/microservice/PLACEHOLDER_NAMESPACE
automountServiceAccountToken: true
