apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Canonical Kustomize component (SWEEP-J Slice 3 per ADR-0064).
# Applies pod-security-standards "restricted" labels + istio-injection enabled
# label commonly to every resource composed under it. Per-µservice base files
# provide their own namespace.yaml/serviceaccount.yaml (with µservice-specific
# annotations the canonical component cannot know).
#
# Consumer pattern: every per-µservice base/kustomization.yaml composes this
#   component via `components: [../../../../governance/iac/kustomize/components/namespace-restricted-profile]`
#
# Migrated 2026-05-18 from "bundle namespace+serviceaccount as resources" to
# "apply commonLabels overlay only" because per-µservice namespaces carry
# µservice-specific labels (oyatie/owning-axis, oyatie.dev/microservice,
# oyatie.dev/invariants, etc.) that the canonical component cannot enumerate.

commonLabels:
  istio-injection: enabled
  pod-security.kubernetes.io/enforce: restricted
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/warn: restricted
