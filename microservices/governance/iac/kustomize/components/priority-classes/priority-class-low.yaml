# oya-low — best-effort workloads (batch jobs, backfill workers,
# report generation, scheduled crons).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: oya-low
  labels:
    oyatie/priority-tier: low
value: 1000
globalDefault: false
description: |
  Best-effort workloads — batch jobs, backfill workers, report
  generation, scheduled crons. Preempted by every other oyatie
  tier. Per ADR-0145 + Fix-Agent-I Tier-A landing.
