# Canonical PriorityClass manifests per ADR-0145 Tier-A landing
# (Fix-Agent-I, 2026-05-18). Composed by every µservice's overlay
# so workloads can declare their priority tier via the helm helper
# `oya.priorityClass.{critical|important|standard|low}`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - priority-class-critical.yaml
  - priority-class-important.yaml
  - priority-class-standard.yaml
  - priority-class-low.yaml
