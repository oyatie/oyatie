apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-sg canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: SG (PDPA). Region: ap-singapore-1.

commonAnnotations:
  oyatie/pack: pack-sg
  oyatie/jurisdiction: sg
  oyatie/region: ap-singapore-1
  oyatie/data-residency: sg-resident
  oyatie/kms-key-ref: ocikms://sg/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-sg
      - REGION=ap-singapore-1
      - JURISDICTION=sg
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.ap-singapore-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=sg-resident
      - CDN_EDGE_REGION=ap-singapore-1
