apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-us canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: US (CCPA + state laws). Region: us-ashburn-1.

commonAnnotations:
  oyatie/pack: pack-us
  oyatie/jurisdiction: us
  oyatie/region: us-ashburn-1
  oyatie/data-residency: us-resident
  oyatie/kms-key-ref: ocikms://us/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-us
      - REGION=us-ashburn-1
      - JURISDICTION=us
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.us-ashburn-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=us-resident
      - CDN_EDGE_REGION=us-ashburn-1
