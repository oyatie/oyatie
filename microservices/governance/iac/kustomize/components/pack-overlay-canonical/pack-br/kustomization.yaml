apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-br canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: BR (LGPD). Region: sa-saopaulo-1.

commonAnnotations:
  oyatie/pack: pack-br
  oyatie/jurisdiction: br
  oyatie/region: sa-saopaulo-1
  oyatie/data-residency: br-resident
  oyatie/kms-key-ref: ocikms://br/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-br
      - REGION=sa-saopaulo-1
      - JURISDICTION=br
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.sa-saopaulo-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=br-resident
      - CDN_EDGE_REGION=sa-saopaulo-1
