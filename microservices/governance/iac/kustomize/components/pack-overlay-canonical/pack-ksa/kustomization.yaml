apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-ksa canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: KSA (PDPL). Region: me-jeddah-1.

commonAnnotations:
  oyatie/pack: pack-ksa
  oyatie/jurisdiction: ksa
  oyatie/region: me-jeddah-1
  oyatie/data-residency: ksa-resident
  oyatie/kms-key-ref: ocikms://ksa/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-ksa
      - REGION=me-jeddah-1
      - JURISDICTION=ksa
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.me-jeddah-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=ksa-resident
      - CDN_EDGE_REGION=me-jeddah-1
