apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# pack-ae canonical overlay component (SWEEP-I Slice 3 per ADR-0064 + ADR-0117).
# Pack: AE (PDPL). Region: me-dubai-1.

commonAnnotations:
  oyatie/pack: pack-ae
  oyatie/jurisdiction: ae
  oyatie/region: me-dubai-1
  oyatie/data-residency: ae-resident
  oyatie/kms-key-ref: ocikms://ae/master-key

configMapGenerator:
  - name: pack-residency
    literals:
      - PACK=pack-ae
      - REGION=me-dubai-1
      - JURISDICTION=ae
      - OCI_OBJECTSTORAGE_ENDPOINT=https://objectstorage.me-dubai-1.oraclecloud.com
      - LLM_PROVIDER_RESIDENCY=ae-resident
      - CDN_EDGE_REGION=me-dubai-1
