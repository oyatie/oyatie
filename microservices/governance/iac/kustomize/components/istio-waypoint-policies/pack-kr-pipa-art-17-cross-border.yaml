---
# pack-kr KR PIPA Art. 17 cross-border egress refusal at the Istio Ambient
# waypoint. Per ADR-0174. Per KR PIPA Arts. 17 (cross-border transfer),
# 22-2 (alternative pseudonymous processing), 28 (breach notification).
#
# Decision shape: DENY any outbound request whose target is outside the KR
# residency boundary AND that carries personal information AND that lacks
# explicit consent under Art. 17. The waypoint shapes the response with
# the Art. 22-2 alternative pseudonymous-processing endpoint for the data
# subject's right of redress.
#
# Also covers 통신비밀보호법 Art. 9 lawful interception envelope shape: the
# waypoint refuses non-court-ordered traffic intercept requests directly at L7.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   forbid(principal, action == Action::"cross_border_transfer",
#          resource in Resource::"kr-personal-info")
#     when { !resource.has_explicit_consent_under_pipa_art_17 };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-kr-pipa-art-17-cross-border
  namespace: pack-kr
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-kr
    oyatie/regulation: KR-PIPA-Art-17
    oyatie/regulation-article: "17"
    oyatie/regulation-action: "refuse-cross-border"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "KR PIPA Arts. 17 (cross-border), 22-2 (alternative pseudonymous processing), 28 (breach notification); 통신비밀보호법 Art. 9 (lawful interception)"
    oyatie.cedar.source: "microservices/governance/policy/kr-pipa.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    # Cross-border egress refusal: any request whose destination header
    # indicates a non-KR residency target and that carries PII gets denied.
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "GET"]
            paths:
              - "/mail/*/egress"
              - "/mail/*/forward"
              - "/drive/*/share-external"
              - "/calendar/*/share-external"
              - "/recordings/*/export"
              - "/notes/*/share-external"
              - "/foundry/providers/*/invoke"
      when:
        - key: request.headers[x-oyatie-destination-residency]
          notValues: ["kr", "pack-kr"]
        - key: request.headers[x-oyatie-pii-present]
          values: ["true", "yes", "1"]
        - key: request.headers[x-oyatie-pipa-art-17-consent]
          notValues: ["explicit-recorded"]
    # 통신비밀보호법 Art. 9 lawful interception envelope: only court-ordered
    # interception headers are permitted; non-court-ordered intercept requests
    # are denied at L7.
    - to:
        - operation:
            methods: ["POST"]
            paths:
              - "/anonymous/*/legal-disclosure"
              - "/messenger/*/lawful-intercept"
      when:
        - key: request.headers[x-oyatie-legal-process-type]
          notValues: ["kr-court-order-art-9", "kr-prosecutor-warrant-art-9"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-kr-pipa-art-17-response-shape
  namespace: pack-kr
  labels:
    oyatie/pack: pack-kr
    oyatie/regulation: KR-PIPA-Art-17
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-kr-pipa-art-17") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "KR-PIPA-Art-17")
                      response_handle:headers():add("x-oyatie-cross-border-refused", "true")
                      response_handle:headers():add("x-oyatie-alternative-endpoint",
                        "https://app.oyatie.example/pipa/22-2")
                      local body = [[
                        {
                          "regulation": "KR PIPA Art. 17",
                          "decision": "cross_border_transfer_refused",
                          "consent_required": true,
                          "consent_form_endpoint": "https://app.oyatie.example/pipa/consent/17",
                          "alternative_pseudonymous_processing": {
                            "available": true,
                            "endpoint": "https://app.oyatie.example/pipa/22-2",
                            "art_22_2_basis": "pseudonymous_processing_within_kr"
                          },
                          "breach_notification_path": "https://app.oyatie.example/pipa/28",
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
