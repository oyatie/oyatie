---
# Canonical Istio AuthorizationPolicy + EnvoyFilter fragments per ADR-0174.
#
# Each fragment is a self-contained AuthorizationPolicy (+ optional EnvoyFilter
# for response shaping) that anchors a single regulatory rule to a single
# pack-namespace target. Per-pack overlays compose only the fragments that
# apply to that pack:
#
#   pack-eu              composes pack-eu-risk_anchor-iii-refusal +
#                                  pack-eu-gdpr-art-22-routing +
#                                  pack-eu-dsa-transparency
#   pack-kr              composes pack-kr-pipa-art-17-cross-border
#   pack-us-healthcare   composes pack-us-healthcare-hipaa-minimum-necessary
#   pack-ksa             composes pack-ksa-pdpl-sovereign-routing
#   pack-uae             composes pack-uae-pdpl-cybersecurity-council
#
# All fragments are emitted by the governance µservice's Cedar policy compiler
# from policy/tenant-scope.cedar (per ADR-0174 Operational §1-3).
#
# Consumer pattern (per-µservice base/kustomization.yaml):
#   components:
#     - ../../../../governance/iac/kustomize/components/istio-waypoint-policies

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - pack-eu-risk_anchor-iii-refusal.yaml
  - pack-eu-gdpr-art-22-routing.yaml
  - pack-eu-dsa-transparency.yaml
  - pack-kr-pipa-art-17-cross-border.yaml
  - pack-us-healthcare-hipaa-minimum-necessary.yaml
  - pack-ksa-pdpl-sovereign-routing.yaml
  - pack-uae-pdpl-cybersecurity-council.yaml

commonLabels:
  oyatie/adr: ADR-0174
  oyatie/regulatory-tier: tier-2-a
  oyatie/policy-source: cedar-compiled
