---
# pack-eu GDPR Art. 22 automated-decision routing at the Istio Ambient waypoint.
# Per ADR-0174. Per GDPR 2016/679 Art. 22 (the data subject has the right not
# to be subject to a decision based solely on automated processing).
#
# Decision shape: ROUTE automated-decision requests to the human-review queue
# when the resource is flagged as carrying significant or legal effects on the
# data subject. The waypoint denies the direct automated path and shapes the
# response with the human-review endpoint per the Art. 22(3) right.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   forbid(principal, action == Action::"automated_decision_make",
#          resource in Resource::"gdpr-art-22-significant-effect")
#     when { resource.significant_or_legal_effect &&
#            !principal.has_explicit_consent };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-eu-gdpr-art-22-routing
  namespace: pack-eu
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-eu
    oyatie/regulation: GDPR-Art-22
    oyatie/regulation-article: "22"
    oyatie/regulation-action: "route-to-human-review"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "GDPR 2016/679 Art. 22 (automated individual decision-making, including profiling)"
    oyatie.cedar.source: "microservices/governance/policy/gdpr-art-22.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH"]
            paths:
              - "/tasks/*/auto-assign"
              - "/foundry/providers/*/invoke"
              - "/workflow/*/automated-decision"
              - "/community/*/automated-moderation"
              - "/anonymous/*/automated-disclosure"
      when:
        - key: request.headers[x-oyatie-decision-effect]
          values: ["significant", "legal", "employment-impact", "credit-impact", "insurance-impact"]
        - key: request.headers[x-oyatie-decision-mode]
          values: ["automated", "fully-automated"]
        - key: request.headers[x-oyatie-explicit-consent]
          notValues: ["present"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-eu-gdpr-art-22-routing-response-shape
  namespace: pack-eu
  labels:
    oyatie/pack: pack-eu
    oyatie/regulation: GDPR-Art-22
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-eu-gdpr-art-22-routing") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "GDPR-Art-22")
                      response_handle:headers():add("x-oyatie-right-to-human-review", "true")
                      response_handle:headers():add("x-oyatie-review-endpoint",
                        "https://app.oyatie.example/dsr/human-review")
                      response_handle:headers():add("x-oyatie-sla-business-days", "30")
                      local body = [[
                        {
                          "regulation": "GDPR Art. 22",
                          "decision": "denied",
                          "reason": "automated_decision_with_significant_or_legal_effect",
                          "right_to_human_review": {
                            "available": true,
                            "endpoint": "https://app.oyatie.example/dsr/human-review",
                            "sla_business_days": 30,
                            "art_22_3_right": "express_point_of_view_and_contest_decision"
                          },
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
