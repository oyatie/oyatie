---
# pack-eu Annex III §4 employment-context refusal at the Istio Ambient waypoint.
# Per ADR-0174. Per EU AI Act 2024/1689 Annex III §4 (employment) + Art. 14
# (human oversight) + Art. 26 (deployer obligations).
#
# Decision shape: DENY any high-risk AI request flagged as employment-context
# auto-decision that lacks the required human-oversight token. The waypoint
# responds with EnvoyFilter-shaped 451 + JSON body referencing Art. 14 human
# oversight endpoint.
#
# Compiled from policy/tenant-scope.cedar fragment:
#   forbid(principal, action == Action::"automated_decision_make",
#          resource in Resource::"ai-act-risk_anchor-iii-employment")
#     when { resource.high_risk && !principal.has_human_oversight_token };

apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: pack-eu-risk_anchor-iii-refusal
  namespace: pack-eu                           # overridden per regulated µservice namespace via overlay
  labels:
    oyatie/microservice: governance
    oyatie/pack: pack-eu
    oyatie/regulation: EU-AI-Act-Annex-III-4
    oyatie/regulation-article: "Annex-III-4"
    oyatie/regulation-action: "refuse"
    oyatie/adr: ADR-0174
    oyatie/regulatory-tier: tier-2-a
    oyatie/policy-source: cedar-compiled
  annotations:
    oyatie.adr/primary: ADR-0174
    oyatie.regulation.citation: "EU AI Act 2024/1689 Annex III §4 (employment); Art. 14 (human oversight); Art. 26 (deployer obligations)"
    oyatie.cedar.source: "microservices/governance/policy/eu-ai-act-risk_anchor-iii.cedar"
    oyatie.legal.signoff: required
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: oyatie-regulatory-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            methods: ["POST", "PUT", "PATCH"]
            paths:
              - "/foundry/providers/*/invoke"
              - "/foundry/providers/*/inference"
              - "/tasks/*/auto-assign"
              - "/tasks/*/automated-priority"
      when:
        - key: request.headers[x-oyatie-ai-risk-tier]
          values: ["high-risk-risk_anchor-iii"]
        - key: request.headers[x-oyatie-decision-mode]
          values: ["automated", "fully-automated"]
        - key: request.headers[x-oyatie-context]
          values: ["employment", "hr", "candidate-screening", "performance-review"]
        - key: request.headers[x-oyatie-human-oversight-token]
          notValues: ["present"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pack-eu-risk_anchor-iii-refusal-response-shape
  namespace: pack-eu
  labels:
    oyatie/pack: pack-eu
    oyatie/regulation: EU-AI-Act-Annex-III-4
    oyatie/adr: ADR-0174
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: oyatie-regulatory-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_response(response_handle)
                  local status = response_handle:headers():get(":status")
                  if status == "403" or status == "401" then
                    local rule = response_handle:headers():get("x-istio-rule-matched")
                    if rule and string.find(rule, "pack-eu-risk_anchor-iii-refusal") then
                      response_handle:headers():replace(":status", "451")
                      response_handle:headers():replace("content-type", "application/json")
                      response_handle:headers():add("x-oyatie-regulation", "EU-AI-Act-Annex-III-4")
                      response_handle:headers():add("x-oyatie-human-oversight", "required")
                      response_handle:headers():add("x-oyatie-human-oversight-endpoint",
                        "https://app.oyatie.example/ai-act/human-oversight")
                      local body = [[
                        {
                          "regulation": "EU AI Act 2024/1689 Annex III §4",
                          "decision": "refused_high_risk_ai_employment_context",
                          "human_oversight": {
                            "endpoint": "https://app.oyatie.example/ai-act/human-oversight",
                            "art_14_compliance": true,
                            "art_26_deployer_obligation": "logged"
                          },
                          "audit_chain_seal": "embedded-via-waypoint"
                        }
                      ]]
                      response_handle:body():setBytes(body)
                    end
                  end
                end
