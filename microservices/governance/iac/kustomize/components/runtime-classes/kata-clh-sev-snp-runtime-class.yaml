---
# Kata Containers + Cloud Hypervisor + AMD SEV-SNP RuntimeClass — full-VM
# isolation with cryptographic memory protection via the kata-clh-sev-snp
# handler. Per ADR-0147 (amended 2026-05-18). Selected workload classes:
#   - cryptographic workers (blind-signature ceremony, KMS-bound signers,
#     signing oracles) — default tier
#   - sovereign-tier untrusted-content overrides (KSA-government,
#     EU-defense, etc.)
#   - sovereign-tier federation-gateway upgrades
#
# AMD SEV-SNP ("Secure Encrypted Virtualization — Secure Nested Paging")
# provides memory encryption + integrity protection + interrupt protection
# against the host hypervisor — required for sovereign tenants with
# cryptographic memory-isolation guarantees. Host pool requires AMD EPYC
# Milan or newer with SEV-SNP enabled in firmware (AWS m7a + Azure
# DCasv5/ECasv5 + GCP C3D-Confidential). FIPS 140-3 Level 3 tenants
# further upgrade to bare HSM (RuntimeClass-less).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-sev-snp
  labels:
    oyatie/runtime-class: kata-clh-sev-snp
    oyatie/workload-classes: "crypto,untrusted-content-sovereign,federation-gateway-sovereign"
    oyatie/adr: ADR-0147
    oyatie/vmm: cloud-hypervisor
    oyatie/confidential-compute: amd-sev-snp
handler: kata-clh-sev-snp
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: kata-clh-sev-snp
    oyatie/kvm: "true"
    oyatie/amd-sev-snp: "true"
overhead:
  podFixed:
    cpu: "200m"
    memory: "256Mi"
