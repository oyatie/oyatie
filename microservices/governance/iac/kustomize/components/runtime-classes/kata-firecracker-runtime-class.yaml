---
# Kata Containers (Firecracker) RuntimeClass — microVM per-pod isolation via
# kata-fc handler. Optimised for per-request ephemeral workloads (sub-200 ms
# cold start). Selected workload class per ADR-0147:
#   - per-request ephemeral isolation (serverless-style execution where each
#     request gets its own microVM)
#
# Pattern mirrors AWS Lambda's Firecracker model. Long-running pods should
# select kata-qemu instead (better steady-state throughput).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
  labels:
    oyatie/runtime-class: kata-fc
    oyatie/workload-classes: "per-request-isolation"
    oyatie/adr: ADR-0147
handler: kata-fc
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: kata-fc
    oyatie/nested-virt: "true"
overhead:
  podFixed:
    cpu: "100m"
    memory: "128Mi"
