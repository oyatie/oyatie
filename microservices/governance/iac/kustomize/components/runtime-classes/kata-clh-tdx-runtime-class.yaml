---
# Kata Containers + Cloud Hypervisor + Intel TDX RuntimeClass — full-VM
# isolation with Intel Trust Domain Extensions confidential compute via the
# kata-clh-tdx handler. Per ADR-0147 (amended 2026-05-18). Selected
# workload classes:
#   - AI inference with GPU passthrough under confidential-compute tier
#     (Whisper-large, ML model inference on protected weights)
#   - confidential-compute tier overrides for any workload that prefers
#     Intel TDX over AMD SEV-SNP
#
# Intel TDX provides hardware-isolated Trust Domains (TDs) with
# memory-encryption + integrity + attestation against the host hypervisor.
# Typically paired with GPU passthrough (NVIDIA H100/H200 with confidential
# compute) for AI inference workloads where model weights or inference
# inputs must remain protected from the host.
#
# Host pool requires Intel Sapphire Rapids or newer (Xeon Scalable 4th gen+)
# with TDX enabled in firmware (Azure DCsv5/ECsv5 TDX preview, GCP
# C3-Confidential, Intel Tiber Trust Services).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-tdx
  labels:
    oyatie/runtime-class: kata-clh-tdx
    oyatie/workload-classes: "ai-inference-confidential,confidential-compute-intel"
    oyatie/adr: ADR-0147
    oyatie/vmm: cloud-hypervisor
    oyatie/confidential-compute: intel-tdx
handler: kata-clh-tdx
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: kata-clh-tdx
    oyatie/kvm: "true"
    oyatie/intel-tdx: "true"
overhead:
  podFixed:
    cpu: "200m"
    memory: "256Mi"
