---
# Istio Ambient waypoint RuntimeClass per ADR-0174.
#
# The waypoint pod itself runs an Envoy proxy in a regular runc container —
# no special sandboxing is required for the proxy process. This RuntimeClass
# is registered for *policy clarity*: cell scheduling, observability, and
# audit-chain emission can match on `runtimeClassName=istio-ambient-waypoint`
# to identify waypoint pods cleanly across the fleet.
#
# Sovereign / confidential tiers (pack-ksa-sovereign, pack-uae-sovereign,
# pack-us-healthcare-bcs-confidential) override the runtime to
# `kata-clh-sev-snp` per ADR-0147 ladder. The override is applied at the
# per-pack Helm values level (waypoint.runtimeClassName), not on this
# RuntimeClass.
#
# Per ADR-0147 ladder (amended 2026-05-18: Cloud Hypervisor primary).
# Per ADR-0148 (Cilium primary; Istio Ambient as Tier-2 opt-in).
# Per ADR-0174 (regulatory-pack waypoint adoption).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: istio-ambient-waypoint
  labels:
    oyatie/runtime-class: istio-ambient-waypoint
    oyatie/workload-classes: "regulatory-waypoint-envoy"
    oyatie/adr: ADR-0174
    oyatie/adr-related: "ADR-0044,ADR-0147,ADR-0148"
    oyatie/status: active
handler: runc
scheduling:
  nodeSelector:
    oyatie/istio-ambient-waypoint-supported: "true"
overhead:
  podFixed:
    cpu: "50m"
    memory: "64Mi"
