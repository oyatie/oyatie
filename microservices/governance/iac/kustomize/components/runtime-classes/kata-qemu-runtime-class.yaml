---
# Kata Containers (QEMU) RuntimeClass — full-VM isolation via kata-qemu handler.
# Selected workload classes per ADR-0147:
#   - cryptographic workers (blind-signature ceremony, KMS-bound signers)
#   - sovereign-tier tenant override for untrusted-content workloads
#   - confidential-compute tier for AI inference (paired with GPU passthrough)
#
# Host pool requires nested-virtualization (AWS metal/m6a + EQX bare-metal +
# Azure CC-DC-series). Cells claiming kata-qemu must declare nested-virt
# capability in cell.host_pool.runtime_classes per cell PRD §scheduling.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
  labels:
    oyatie/runtime-class: kata-qemu
    oyatie/workload-classes: "crypto,untrusted-content-sovereign,ai-inference-confidential"
    oyatie/adr: ADR-0147
handler: kata-qemu
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: kata-qemu
    oyatie/nested-virt: "true"
overhead:
  podFixed:
    cpu: "250m"
    memory: "256Mi"
