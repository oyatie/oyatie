---
# Wasmtime (runwasi) RuntimeClass — WebAssembly runtime via wasmtime handler.
# Selected workload classes per ADR-0147:
#   - WASM-only workers (sandboxed WebAssembly execution; capability-based
#     security model; sub-millisecond cold start)
#
# Used by foundry-runtime for tenant-supplied WASM extension points and by
# workflow-studio for WASM-compiled custom node executors.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: wasmtime
  labels:
    oyatie/runtime-class: wasmtime
    oyatie/workload-classes: "wasm-workers"
    oyatie/adr: ADR-0147
handler: wasmtime
scheduling:
  nodeSelector:
    oyatie/runtime-class-supported: wasmtime
overhead:
  podFixed:
    cpu: "10m"
    memory: "16Mi"
