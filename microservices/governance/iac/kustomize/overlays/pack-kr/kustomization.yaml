# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# Pack-kr overlay for governance µservice
# Per microservices/governance/multi-region.md §"Topology per pack" — pack-kr single-region
# Per microservices/governance/policy/data-residency.md §"pack-kr"
# Per microservices/governance/compliance.md §"KR PIPA + KR-ISMS-P"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: governance-pack-kr

resources:
  - ../../base

commonLabels:
  pack: pack-kr
  region: ap-seoul-1
  jurisdiction-code: KR
  data-residency: ap-seoul-1

commonAnnotations:
  oyatie.example/residency-pack: pack-kr
  oyatie.example/kms-keyring: oci.kms.ap-seoul-1.governance
  oyatie.example/audit-retention-days: "1827"  # 5y per KR commercial code; AUDIT 7y baseline retained
  oyatie.example/dr-pair-region: ""             # single-region acceptable for KR

configMapGenerator:
  - name: governance-pack-config
    literals:
      - PACK=pack-kr
      - REGION=ap-seoul-1
      - JURISDICTION=KR
      - POSTGRES_HOST=postgres.governance-pack-kr.svc.cluster.local
      - S3_BUCKET=governance-evidence-pack-kr
      - KMS_KEYRING=oci.kms.ap-seoul-1.governance
      - AUDIT_CHAIN_HOST=audit-chain.audit-chain-pack-kr.svc.cluster.local
      - OPENBAO_HOST=openbao.cloud-secrets-pack-kr.svc.cluster.local
      - MIMIR_TENANT=pack-kr
      - DPIA_LOCALE=ko-KR

# Pack-specific resource adjustments
patches:
  # Sensitive-info refusal at sanitiser (KR PIPA Art. 23: RRN-class)
  - path: patches/pii-sanitiser-rrn.yaml
    target:
      kind: ConfigMap
      name: governance-app-config
  # Per-pack KMS keyring
  - path: patches/kms-keyring-pack-kr.yaml
    target:
      kind: Deployment
  # Per-pack retention override (AUDIT 7y baseline; commercial-code AUDIT 5y minimum)
  - path: patches/retention-pack-kr.yaml
    target:
      kind: ConfigMap
      name: governance-app-config

# Pack-specific images (none required at M01; same images, pack-distinguished via env)
images: []

# Replicas per capacity-model.md XS tier
replicas:
  - name: lane-runtime
    count: 2
  - name: policy-engine
    count: 2
  - name: evidence-emitter
    count: 2
  - name: aggregation-indexer
    count: 2

# Pack-specific NetworkPolicy
patchesStrategicMerge:
  - networkpolicy-pack-kr.yaml

# Reference future packs follow the same pattern:
#   iac/kustomize/overlays/pack-eu/kustomization.yaml
#   iac/kustomize/overlays/pack-us/kustomization.yaml
#   iac/kustomize/overlays/pack-us-healthcare/kustomization.yaml
#   ... per microservices/governance/multi-region.md Wave 2..11
