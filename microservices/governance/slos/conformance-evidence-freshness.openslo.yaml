# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-conformance-evidence-freshness
  displayName: "governance: conformance evidence freshness 24h cadence"
  labels:
    microservice: governance
    bounded_context: evidence-emitter
    sli_class: freshness
    tier: internal-substrate
    plane: audit
    owner_team: axis-governance + ops-compliance
    pack_scope: all
spec:
  service: governance
  description: |
    Conformance evidence freshness SLO. An evidence record for any check-
    crate is "good" when the most-recent emission is ≤ 24h old. Required
    for compliance attestations + masterplan progress reporting. Per
    PRD §"Evidence Cadence" + handoff #13.
  indicator:
    metadata:
      name: governance-evidence-freshness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_evidence_age_seconds_bucket{le="86400"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_evidence_age_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "≥ 99% of crates emit evidence every 24h over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
