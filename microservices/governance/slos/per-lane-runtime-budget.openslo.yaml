# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-governance-per-lane-runtime-budget
  displayName: "governance: per-lane runtime budget p95 ≤ 30s"
  labels:
    microservice: governance
    bounded_context: lane-runtime
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-governance
    pack_scope: all
spec:
  service: governance
  description: |
    Per-lane runtime budget SLO. A CI-lane invocation is "good" when it
    completes within ≤ 30s p95 on the standard lane runner (4 vCPU,
    8 GB RAM). Required to keep PR-pipeline total runtime within the
    declared ≤ 5-min wall-clock budget per registry/quality/lanes.yaml.
  indicator:
    metadata:
      name: governance-lane-runtime-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_lane_runtime_duration_seconds_bucket{le="30"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_governance_lane_runtime_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 30s per-lane for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
