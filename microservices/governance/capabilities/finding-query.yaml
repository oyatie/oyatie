# Foundry Capability: finding-query

Query Findings + lane runs + evidence + admission verdicts (tenant-scoped or auditor-scoped).

## Surface

| Surface | Endpoint | Auth |
|---|---|---|
| REST | `GET /findings`, `GET /findings/{id}`, `GET /lane-runs`, `GET /evidence/{blob_id}`, `GET /admission-verdict` | OIDC + tenant-scope.cedar OR auditor-scope.cedar |
| gRPC | `GovernanceQuery.*`, `GovernanceEvidence.GetEvidenceBlob`, `GovernanceEvidence.VerifySignature` | mTLS + SPIFFE + same Cedar |
| CLI | `cargo run -p oya-dev-cli -- governance {finding-query,lane-status,evidence-get}` | local + OIDC |

## Capability boundary

Inputs:
- `microservice`: required (tenant must own).
- `window_start`, `window_end`: optional date range (defaults: last 7 days).
- `severity`: optional filter.
- `view`: `audit` (restricted) OR `non-audit` (default).
- `page_token`: opaque cursor for pagination.

Outputs:
- `FindingPage` or `LaneRunPage` with `next_page_token`.
- Signed Finding records (with Ed25519 signature + audit-chain seal reference).
- Evidence blob streams.
- Admission verdict snapshot.

Side effects:
- Read-only.
- Cedar evaluation per call; refusal emits `cedar-refused` log event.

## Pre-conditions

- Caller authenticated.
- Caller has the corresponding Cedar permit (`ReadFinding`, `ReadLaneRun`, `ReadEvidenceBlob`, `QueryAdmissionVerdict`).
- For audit-view: caller is `ops-security` OR `ExternalAuditor` in active window.

## Post-conditions

- Page returned within p99 ≤ 200ms.
- No write side-effects.

## Failure modes

| Mode | Recovery |
|---|---|
| Cedar refusal | 403 with `policy_fragment` annotation; caller adjusts scope or escalates |
| Window exceeds 7y retention | 404 with `retention-expired` error |
| Replay-query latency degraded (F-05 Postgres failover) | Reads from replica; verdict carries `stale_replica=true` flag |
| Cross-pack residency violation | Refused per `data-residency.md` Cedar fragment |

## SLO

- Query p99 ≤ 200ms.
- Evidence-blob retrieval p99 ≤ 2s.
- Availability 99.9% monthly (lower than lane-execute; non-real-time path).

## Versioning

- Capability version: v1 (M01 launch).

