# Foundry Capability: audit-refresh

Quarterly + on-demand refresh of the industry-best-practice baseline pins + the aggregation indices regen.

## Surface

| Surface | Endpoint | Auth |
|---|---|---|
| Cron | `.github/workflows/governance-baseline-refresh.yml` (first Monday of each quarter) | `axis-foundry-bot` identity |
| REST | `POST /baseline-pins/refresh` (council-architecture only) | OIDC + role=council-architecture |
| CLI | `cargo run -p oya-dev-cli -- governance baseline-refresh --quarter <YYYY-QN>` | local |
| CLI | `cargo run -p oya-dev-cli -- governance aggregation rebuild` | local |

## Capability boundary

### Industry-baseline refresh

Inputs:
- `quarter`: e.g., `2026-Q2`.
- Optional `axis`: refresh a single axis only.

Behaviour:
- Fetch each baseline source per the table in `runbooks/industry-baseline-refresh.md`.
- Diff vs pinned SHA.
- Open auto-PR if any baseline moved.
- Label `softer-baseline-proposed` if relaxation detected; require council-architecture explicit approval.
- Write `evidence/audits/industry-best-practice-conformance/<quarter>.json` at merge.

Outputs:
- Pull-request URL.
- Per-axis diff summary.

Side effects:
- Updates `/specs/industry-best-practice-conformance.json`.
- Emits `BaselinePinUpdated` event when merged.

### Aggregation rebuild

Inputs:
- Optional `microservice`: scope rebuild to one µservice's sources.
- Optional `pack`: pack-specific overlay.
- Flag `--hold-lock` to acquire Postgres advisory lock.

Behaviour:
- Walk per-µservice sources (`microservices/<ms>/{PRD.md,catalog/**,slos/**,specs/**,contracts/**,policy/**}`).
- Regenerate central indices: `docs/prds/INDEX.md`, `registry/catalog/<crate>.yaml`, `/specs/microservices/<product>.json` aggregation.
- Refuse if hand-edits detected (per F-04).
- Commit via scoped PAT (per `policy/ci-scope.cedar` P5).

Outputs:
- Commit SHA of the regen.
- Divergence report (if hand-edits found).

Side effects:
- Writes to central-index paths only.
- Emits `AggregationIndexRegenerated` event.

## Pre-conditions

- Caller authenticated.
- For baseline refresh: caller is `axis-foundry-bot` (cron) OR `council-architecture` (manual).
- For aggregation rebuild: caller has `governance.aggregation.rebuild` Cedar action.

## Post-conditions

- Baseline refresh: PR opened OR rejected with rationale.
- Aggregation rebuild: central indices match per-µservice sources OR divergence report emitted.

## Failure modes

| Mode | Recovery |
|---|---|
| Baseline source unreachable (F-08) | Retry with backoff; fall back to cached; escalate after 72h |
| Softer baseline proposed (F-12) | Auto-PR labels + requires explicit council-architecture approval |
| Aggregation divergence (F-04) | `runbooks/aggregation-rebuild.md` §A |
| Scope-PAT overrun (F-15) | `runbooks/aggregation-rebuild.md` §B; engage ops-security |

## SLO

- Quarterly baseline refresh: complete within 2 hours of cron fire (p99).
- Aggregation rebuild: full-repo regen p99 ≤ 5 min.
- Availability: best-effort; non-real-time path.

## Versioning

- Capability version: v1 (M01 launch).

