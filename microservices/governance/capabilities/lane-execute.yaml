# Foundry Capability: lane-execute

Execute one or more fitness lanes against a target ref (PR, SHA, microservice).

## Surface

| Surface | Endpoint | Auth |
|---|---|---|
| REST | `POST /lanes/{lane_id}/dispatch` (per `openapi/governance.yaml`) | OIDC + ci-scope.cedar |
| gRPC | `GovernanceLaneRuntime.DispatchLane` (per `proto/governance.proto`) | mTLS + SPIFFE |
| CLI | `cargo run -p oya-dev-cli -- gate validate <lane> --microservice <ms> [--sha <sha>]` | local-runner identity |

## Capability boundary

Inputs:
- `lane_id`: must be a registered lane per `lane-runtime` BC.
- `microservice`: must be in the active `Microservice` ontology.
- `sha`: must be a reachable Git SHA in the oyatie repo.
- `pr_number`: optional; if set, full PR context is loaded.
- `runner_profile`: defaults to the lane's default profile.

Outputs:
- `LaneRun` record (verdict + duration + signed).
- One or more `Finding` records (if severity ≠ PASS).
- Audit-chain seal record.

Side effects:
- Postgres `lane_runs` row inserted.
- Postgres `findings` rows inserted (one per violation).
- S3 evidence blob written.
- audit-chain seal emitted.
- Workflow event `LaneFailed` emitted (if non-PASS).

## Pre-conditions

- Caller authenticated (OIDC bearer OR SPIFFE workload identity).
- Caller has the `governance.lane.execute` Cedar action permitted by `ci-scope.cedar` P1 + P6.
- Lane is registered (per `lane-execution.md` Invariant 8).
- ARC runner pool has capacity (per `capacity-model.md`).

## Post-conditions

- Lane verdict persisted + signed within p99 ≤ 60s.
- Finding (if any) is canonically-signed + audit-chain sealed.
- `AuditCompleted` event emitted when full PR suite finishes.

## Failure modes

| Mode | Recovery |
|---|---|
| Lane timeout (Invariant 3 bound) | SIGKILL + Finding `lane-resource-overrun` |
| Lane runner OOM (F-01) | Re-queue once; refuse with `pr-too-large` if structural |
| Lane registry inconsistency (F-09) | Engage `runbooks/lane-failure-triage.md` §C1 |
| Postgres unavailable (F-05) | Outbox pattern; backfill on recovery |
| Network outage | Per-runner allow-list; refuse outbound to non-allow-listed hosts |

## SLO

- Per-lane execution p99 ≤ 10s.
- Full ~50-lane set p99 ≤ 60s.
- Availability 99.95% monthly.

## Versioning

- Capability version: v1 (initial, M01 launch).
- Backwards-compatibility: SemVer; major bumps follow ADR-####.

