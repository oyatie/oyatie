openapi: 3.2.0
info:
  title: oya-translate — MT + i18n localization REST surface
  version: 1.0.0
  summary: Translation / batch / language-detect / TM / QE / document / real-time / glossary / termbase REST surface
  description: |
    REST surface for the translate µservice. Covers single-segment translation, batch translation,
    language detection, TM leverage, QE scoring, document round-trip translation,
    real-time caption translation streaming, and CRUD over glossary + termbase.

    Authentication: OIDC bearer + `X-Tenant-Id` header. Pack residency enforced server-side
    per ADR-TRANSLATE-0004. EU AI Act Art. 50 transparency disclosure emitted per call when
    jurisdiction = EU; Art. 13 transparency-to-deployer evidence recorded per QE call.

    Standards interop: OASIS XLIFF 2.1, LISA TMX 1.4, ISO 30042 (TBX), RFC 5646 BCP 47,
    ISO 639-3, ICU MessageFormat, CLDR plural rules.
  contact:
    name: axis-translate
    email: axis-translate@oyatie.com
  license:
    name: Proprietary — oyatie
  x-oyatie-microservice: translate
  x-oyatie-related-adrs: [ADR-0056, ADR-0105, ADR-0135, ADR-0139, ADR-0131, ADR-0132, ADR-0133, ADR-TRANSLATE-0001, ADR-TRANSLATE-0002, ADR-TRANSLATE-0003, ADR-TRANSLATE-0004, ADR-TRANSLATE-0005, ADR-TRANSLATE-0006]

servers:
  - url: https://translate-{pack}.oyatie.com/v1
    description: Per-pack endpoint (kr | eu | us | us-healthcare | jp | sg | au | in | br | ae | ksa | cn-stub)
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa, cn-stub]

security:
  - bearerOIDC: []

paths:
  /translate:
    post:
      operationId: translateText
      summary: Translate a single text segment (≤ 500 chars typical)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TranslateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranslateResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/EngineDegraded'}

  /batch-translate:
    post:
      operationId: batchTranslate
      summary: Translate up to 100 segments concurrently
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchTranslateRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchTranslateResponse'}
        '413': {description: Payload too large (max 100 segments)}
        '503': {$ref: '#/components/responses/EngineDegraded'}

  /detect-language:
    post:
      operationId: detectLanguage
      summary: Detect BCP 47 + ISO 639-3 language of input ≤ 4 KB
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DetectLanguageRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DetectLanguageResponse'}
        '413': {description: Payload too large (max 4 KB)}

  /tm-leverage:
    post:
      operationId: tmLeverage
      summary: Query translation memory for fuzzy/ICE/exact leverage candidates
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TmLeverageRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TmLeverageResponse'}

  /qe-score:
    post:
      operationId: qeScore
      summary: Score translation quality (0-100) without reference (COMET-Kiwi-class)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QeScoreRequest'}
      responses:
        '200':
          description: OK; EU AI Act Art. 13 disclosure record emitted on jurisdiction=EU
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QeScoreResponse'}

  /document-translate:
    post:
      operationId: documentTranslate
      summary: Translate a document round-trip (DOCX/PPTX/XLSX/PDF/HTML/Markdown/PO/XLIFF/ARB/.strings/.resx/.properties)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DocumentTranslateRequest'}
      responses:
        '202':
          description: Accepted; document-translate job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentTranslateJob'}
        '413': {description: Payload too large}

  /document-translate/{jobId}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getDocumentTranslateJob
      summary: Get document-translate job status + download URL when sealed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentTranslateJob'}
        '404': {$ref: '#/components/responses/NotFound'}

  /real-time-translate/stream:
    post:
      operationId: realTimeTranslateStream
      summary: Open a streaming caption-translate session (WebSocket via Upgrade or gRPC sibling)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamSessionOpenRequest'}
      responses:
        '101':
          description: Switching protocols to WebSocket; per-chunk caption translate egresses
        '200':
          description: Session opened (gRPC sibling path)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreamSessionOpenResponse'}

  /bulk-translate:
    post:
      operationId: bulkTranslate
      summary: Submit a bulk-translate job (XLIFF / TMX / TBX / JSON-i18n / ARB / .po / multi-file)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/PackHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/BulkTranslateRequest'}
      responses:
        '202':
          description: Accepted; bulk-translate job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkTranslateJob'}

  /bulk-translate/{jobId}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getBulkTranslateJob
      summary: Get bulk-translate job status + result manifest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkTranslateJob'}

  /glossary:
    get:
      operationId: listGlossary
      summary: List glossary entries for the tenant (paginated)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: query
          name: project_id
          schema: {type: string, format: ulid}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlossaryList'}
    post:
      operationId: createGlossaryEntry
      summary: Create a glossary entry
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlossaryEntry'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlossaryEntry'}

  /glossary/{entryId}:
    parameters:
      - in: path
        name: entryId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getGlossaryEntry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlossaryEntry'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateGlossaryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlossaryEntry'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlossaryEntry'}
    delete:
      operationId: deleteGlossaryEntry
      responses:
        '204': {description: Deleted}

  /termbase:
    get:
      operationId: listTermbases
      summary: List per-tenant termbases
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TermbaseList'}
    post:
      operationId: createTermbase
      summary: Create a termbase (per project)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TermbaseCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Termbase'}

  /termbase/{termbaseId}:
    parameters:
      - in: path
        name: termbaseId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getTermbase
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Termbase'}
    delete:
      operationId: deleteTermbase
      responses:
        '204': {description: Deleted}

  /termbase/{termbaseId}/import-tbx:
    parameters:
      - in: path
        name: termbaseId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    post:
      operationId: importTbx
      summary: Import ISO 30042 (TBX) into the termbase
      requestBody:
        required: true
        content:
          application/xml:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Accepted; import job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TermbaseImportJob'}

  /termbase/{termbaseId}/export-tbx:
    parameters:
      - in: path
        name: termbaseId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: exportTbx
      summary: Export termbase as ISO 30042 (TBX) document
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema: {type: string, format: binary}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: translate
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerOIDC:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth-{pack}.oyatie.com/oauth/authorize
          tokenUrl: https://auth-{pack}.oyatie.com/oauth/token
          scopes:
            translate.translate: Single + batch translate
            translate.detect: Language detection
            translate.tm: TM leverage read + commit
            translate.qe: Quality estimation
            translate.document: Document translate
            translate.stream: Real-time stream
            translate.bulk: Bulk translate jobs
            translate.glossary: Glossary CRUD
            translate.termbase: Termbase CRUD

  parameters:
    TenantIdHeader:
      in: header
      name: X-Tenant-Id
      required: true
      schema: {type: string}
    PackHeader:
      in: header
      name: X-Pack
      required: true
      schema: {type: string, enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa, cn-stub]}

  responses:
    Forbidden:
      description: Forbidden (Cedar deny / cross-tenant / residency violation)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Rate-limited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    EngineDegraded:
      description: All upstream MT engines degraded; client should retry with backoff
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri}
        oyatie_audit_event_id: {type: string}

    TranslateRequest:
      type: object
      required: [text, target_locale]
      properties:
        text: {type: string, maxLength: 5000}
        source_locale: {type: string, nullable: true, description: BCP 47; auto-detect if absent}
        target_locale: {type: string}
        content_class: {type: string, enum: [marketing, legal, medical, code_comment, ui_string, technical, generic, employment, credit_scoring]}
        project_id: {type: string, format: ulid, nullable: true}
        require_qe: {type: boolean, default: false, description: when true, returns QE score (extra latency)}
        formality: {type: string, enum: [default, formal, informal], default: default}

    TranslateResponse:
      type: object
      required: [translation, engine]
      properties:
        translation: {type: string}
        engine: {type: string, enum: [in-house, anthropic, openai, google-translate, deepl]}
        engine_region: {type: string}
        tm_leverage: {type: string, enum: [exact, ice, fuzzy, none]}
        tm_leverage_score: {type: number, nullable: true}
        qe_score: {type: number, nullable: true}
        content_hash: {type: string}
        evidence_event_id: {type: string, format: ulid}
        ai_disclosure_label: {type: string, description: visible Art. 50 disclosure for EU pack}

    BatchTranslateRequest:
      type: object
      required: [segments, target_locale]
      properties:
        segments:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id: {type: string}
              text: {type: string, maxLength: 5000}
              source_locale: {type: string, nullable: true}
              content_class: {type: string}
        target_locale: {type: string}
        project_id: {type: string, format: ulid, nullable: true}

    BatchTranslateResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              translation: {type: string}
              engine: {type: string}
              tm_leverage: {type: string}
              qe_score: {type: number, nullable: true}
              error: {type: string, nullable: true}

    DetectLanguageRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, maxLength: 4096}

    DetectLanguageResponse:
      type: object
      properties:
        detected_bcp47: {type: string}
        detected_iso_639_3: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        alternates:
          type: array
          items:
            type: object
            properties:
              bcp47: {type: string}
              confidence: {type: number}

    TmLeverageRequest:
      type: object
      required: [text, source_locale, target_locale, project_id]
      properties:
        text: {type: string}
        source_locale: {type: string}
        target_locale: {type: string}
        project_id: {type: string, format: ulid}

    TmLeverageResponse:
      type: object
      properties:
        candidates:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              tm_unit_id: {type: string, format: ulid}
              source_text: {type: string}
              target_text: {type: string}
              match: {type: string, enum: [exact, ice, fuzzy, none]}
              match_score: {type: number}

    QeScoreRequest:
      type: object
      required: [source_text, target_text, source_locale, target_locale]
      properties:
        source_text: {type: string}
        target_text: {type: string}
        source_locale: {type: string}
        target_locale: {type: string}

    QeScoreResponse:
      type: object
      properties:
        score: {type: number, minimum: 0, maximum: 100}
        confidence_interval:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number}
        qe_model_version: {type: string}
        review_recommended: {type: boolean}
        eu_ai_act_disclosure_id: {type: string, format: ulid, nullable: true, description: present when jurisdiction=EU}

    DocumentTranslateRequest:
      type: object
      required: [file, target_locale]
      properties:
        file: {type: string, format: binary}
        source_locale: {type: string, nullable: true}
        target_locale: {type: string}
        format: {type: string, enum: [docx, pptx, xlsx, pdf, html, markdown, po, xliff, arb, strings, resx, properties]}
        fidelity_tier: {type: string, enum: [A, B, C], default: A}

    DocumentTranslateJob:
      type: object
      properties:
        job_id: {type: string, format: ulid}
        status: {type: string, enum: [queued, running, sealed, failed]}
        progress_pct: {type: number, minimum: 0, maximum: 100}
        result_url: {type: string, format: uri, nullable: true}
        fidelity_tier_achieved: {type: string, enum: [A, B, C], nullable: true}
        evidence_event_id: {type: string, format: ulid, nullable: true}

    StreamSessionOpenRequest:
      type: object
      required: [source_locale, target_locale]
      properties:
        source_locale: {type: string}
        target_locale: {type: string}
        meet_session_id: {type: string, format: ulid, nullable: true}
        correction_replay_window_ms: {type: integer, default: 800}

    StreamSessionOpenResponse:
      type: object
      properties:
        session_id: {type: string, format: ulid}
        ws_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}

    BulkTranslateRequest:
      type: object
      required: [file, target_locale]
      properties:
        file: {type: string, format: binary}
        format: {type: string, enum: [xliff, tmx, tbx, json_i18n, arb, po, strings, resx, properties]}
        source_locale: {type: string, nullable: true}
        target_locale: {type: string}
        project_id: {type: string, format: ulid, nullable: true}
        webhook_url: {type: string, format: uri, nullable: true}

    BulkTranslateJob:
      type: object
      properties:
        job_id: {type: string, format: ulid}
        status: {type: string, enum: [queued, running, sealed, failed]}
        segment_count: {type: integer}
        progress_pct: {type: number}
        result_manifest_url: {type: string, format: uri, nullable: true}
        evidence_event_id: {type: string, format: ulid, nullable: true}

    GlossaryEntry:
      type: object
      properties:
        entry_id: {type: string, format: ulid}
        project_id: {type: string, format: ulid}
        source_term: {type: string}
        target_locale: {type: string}
        target_term: {type: string}
        part_of_speech: {type: string, nullable: true}
        note: {type: string, nullable: true}
        register: {type: string, nullable: true}
        do_not_translate: {type: boolean, default: false}

    GlossaryList:
      type: object
      properties:
        entries:
          type: array
          items: {$ref: '#/components/schemas/GlossaryEntry'}
        next_cursor: {type: string, nullable: true}

    TermbaseCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        project_id: {type: string, format: ulid, nullable: true}
        source_locale: {type: string}
        target_locales:
          type: array
          items: {type: string}

    Termbase:
      type: object
      properties:
        termbase_id: {type: string, format: ulid}
        name: {type: string}
        project_id: {type: string, format: ulid, nullable: true}
        source_locale: {type: string}
        target_locales: {type: array, items: {type: string}}
        concept_count: {type: integer}
        created_at: {type: string, format: date-time}

    TermbaseList:
      type: object
      properties:
        termbases:
          type: array
          items: {$ref: '#/components/schemas/Termbase'}

    TermbaseImportJob:
      type: object
      properties:
        job_id: {type: string, format: ulid}
        status: {type: string, enum: [queued, running, completed, failed]}
        imported_count: {type: integer, nullable: true}
        validation_errors:
          type: array
          items:
            type: object
            properties:
              line: {type: integer}
              message: {type: string}
