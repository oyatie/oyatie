apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: translate-burn-rate-rules
  namespace: translate
  labels:
    app.kubernetes.io/name: translate
    prometheus: mimir
spec:
  groups:
    - name: translate-recording-rules
      interval: 60s
      rules:
        - record: translate:translation_request:availability_5m
          expr: |
            sum(rate(oya_translate_translation_request_total{result="success"}[5m]))
            /
            sum(rate(oya_translate_translation_request_total[5m]))
        - record: translate:translation_request:latency_p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(oya_translate_translation_request_duration_seconds_bucket[5m]))
            )
        - record: translate:caption_stream:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_translate_caption_stream_chunk_duration_seconds_bucket[5m]))
            )

    - name: translate-burn-rate-alerts
      rules:
        - alert: TranslateTranslationRequestFastBurn1h
          expr: |
            (1 - translate:translation_request:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: translate
          annotations:
            summary: "translate translation-request fast-burn (14.4x) for 5m"

        - alert: TranslateTranslationRequestSlowBurn6h
          expr: |
            (1 - avg_over_time(translate:translation_request:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: translate

        - alert: TranslateDataResidencyViolation
          expr: |
            increase(oya_translate_data_residency_violation_total[1m]) > 0
          for: 0s
          labels:
            severity: critical
            policy: data-residency-bound-inference
            microservice: translate
            p0: "true"
          annotations:
            summary: "translate P0: data-residency invariant violation (HARD)"
            runbook_url: "https://oyatie.dev/microservices/translate/runbooks/sovereign-tenant-cross-region-leak-incident-p0"

        - alert: TranslateQeBoundViolation
          expr: |
            increase(oya_translate_qe_bound_violation_total[1m]) > 0
          for: 0s
          labels:
            severity: critical
            policy: eu-ai-act-bound
            microservice: translate
          annotations:
            summary: "translate QE bound-violation (score outside 0..100 envelope)"
            runbook_url: "https://oyatie.dev/microservices/translate/runbooks/quality-estimation-rollback"

        - alert: TranslateCaptionStreamP99Burn
          expr: |
            translate:caption_stream:latency_p99_5m > 0.4
          for: 5m
          labels:
            severity: critical
            sli: real-time-caption-latency
            microservice: translate
          annotations:
            summary: "translate caption stream p99 > 400 ms"
            runbook_url: "https://oyatie.dev/microservices/translate/runbooks/real-time-caption-stream-stall"

        - alert: TranslateDocumentSandboxPanic
          expr: |
            increase(oya_translate_doc_pandoc_panic_total[5m]) + increase(oya_translate_doc_libreoffice_panic_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            microservice: translate
          annotations:
            summary: "translate document sandbox panic — possible CVE / escape attempt"
            runbook_url: "https://oyatie.dev/microservices/translate/runbooks/document-round-trip-corruption"

    - name: translate-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: translate-llm-capability-circuit-open
          expr: max(oya_translate_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: translate
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "translate LLM/capability circuit-breaker tripped open"
        - alert: translate-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_translate_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: translate
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "translate capability retry-budget exhausted"

    - name: translate-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: translate-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_translate_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: translate
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "translate tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: translate-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: translate-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"translate-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: translate
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "translate pod CPU saturation > 70% sustained 10m"
        - alert: translate-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_translate_responses_5xx_total[5m]))
            /
            sum(rate(oya_translate_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: translate
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "translate 5xx rate > 1% sustained 5m"
        - alert: translate-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_translate_responses_total[5m]))
              /
              sum(rate(oya_translate_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: translate
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "translate inbound RPS dropped > 90% vs prior hour"

    - name: translate-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: translate-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_translate_request_success_total[1h]))
              /
              sum(rate(oya_translate_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: translate
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "translate aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: translate-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_translate_request_success_total[6h]))
              /
              sum(rate(oya_translate_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: translate
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "translate aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
