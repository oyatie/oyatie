# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: translate-burn-rate-rules
  namespace: translate
  labels:
    app.kubernetes.io/name: translate
    prometheus: mimir
spec:
  groups:
    - name: translate-recording-rules
      interval: 60s
      rules:
        - record: translate:translation_request:availability_5m
          expr: |
            sum(rate(oya_translate_translation_request_total{result="success"}[5m]))
            /
            sum(rate(oya_translate_translation_request_total[5m]))
        - record: translate:translation_request:latency_p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(oya_translate_translation_request_duration_seconds_bucket[5m]))
            )
        - record: translate:caption_stream:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_translate_caption_stream_chunk_duration_seconds_bucket[5m]))
            )

    - name: translate-burn-rate-alerts
      rules:
        - alert: TranslateTranslationRequestFastBurn1h
          expr: |
            (1 - translate:translation_request:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: translate
          annotations:
            summary: "translate translation-request fast-burn (14.4x) for 5m"

        - alert: TranslateTranslationRequestSlowBurn6h
          expr: |
            (1 - avg_over_time(translate:translation_request:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: translate

        - alert: TranslateDataResidencyViolation
          expr: |
            increase(oya_translate_data_residency_violation_total[1m]) > 0
          for: 0s
          labels:
            severity: critical
            policy: data-residency-bound-inference
            microservice: translate
            p0: "true"
          annotations:
            summary: "translate P0: data-residency invariant violation (HARD)"
            runbook_url: "https://oyatie.com/microservices/translate/runbooks/sovereign-tenant-cross-region-leak-incident-p0"

        - alert: TranslateQeBoundViolation
          expr: |
            increase(oya_translate_qe_bound_violation_total[1m]) > 0
          for: 0s
          labels:
            severity: critical
            policy: eu-ai-act-bound
            microservice: translate
          annotations:
            summary: "translate QE bound-violation (score outside 0..100 envelope)"
            runbook_url: "https://oyatie.com/microservices/translate/runbooks/quality-estimation-rollback"

        - alert: TranslateCaptionStreamP99Burn
          expr: |
            translate:caption_stream:latency_p99_5m > 0.4
          for: 5m
          labels:
            severity: critical
            sli: real-time-caption-latency
            microservice: translate
          annotations:
            summary: "translate caption stream p99 > 400 ms"
            runbook_url: "https://oyatie.com/microservices/translate/runbooks/real-time-caption-stream-stall"

        - alert: TranslateDocumentSandboxPanic
          expr: |
            increase(oya_translate_doc_pandoc_panic_total[5m]) + increase(oya_translate_doc_libreoffice_panic_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            microservice: translate
          annotations:
            summary: "translate document sandbox panic — possible CVE / escape attempt"
            runbook_url: "https://oyatie.com/microservices/translate/runbooks/document-round-trip-corruption"
