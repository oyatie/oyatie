{{- range tuple "translationRequestRest" "batchTranslateWorker" "realTimeStreamGateway" "documentLocalizationWorker" "tmLeverageWorker" "qualityEstimationWorker" "mtEngineRouter" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translate-{{ . | kebabcase }}
  namespace: translate
  labels:
    app.kubernetes.io/name: translate
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: oya-translate
    oyatie/microservice: translate
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: translate
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: translate
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      {{- if $c.runtimeClassName }}
      runtimeClassName: {{ $c.runtimeClassName }}
      {{- end }}
      serviceAccountName: translate-{{ . | kebabcase }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: translate-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args:
            - "--component={{ . | kebabcase }}"
            - "--pack={{ $.Values.global.pack }}"
            {{- if eq . "realTimeStreamGateway" }}
            - "--correction-replay-window-ms={{ $c.correctionReplayWindowMs }}"
            {{- end }}
            {{- if eq . "qualityEstimationWorker" }}
            - "--qe-model-tag={{ $c.modelTag }}"
            {{- end }}
            {{- if eq . "documentLocalizationWorker" }}
            - "--pandoc-version={{ $c.pandocVersion }}"
            - "--libreoffice-version={{ $c.libreofficeVersion }}"
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9091}
            {{- if eq . "realTimeStreamGateway" }}
            - {name: wss, containerPort: 8443}
            {{- end }}
          resources:
            requests: {{- toYaml $c.resources.requests | nindent 14 }}
            limits: {{- toYaml $c.resources.limits | nindent 14 }}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef: {name: translate-openbao-injected}
          env:
            - name: OYATIE_PACK
              value: {{ $.Values.global.pack | quote }}
            - name: OYATIE_DATA_RESIDENCY_ENFORCE
              value: {{ $.Values.dataResidency.enforce | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
{{- end }}
