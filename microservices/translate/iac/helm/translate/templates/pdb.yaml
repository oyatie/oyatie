# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
{{- range tuple "translationRequestRest" "realTimeStreamGateway" "mtEngineRouter" "tmLeverageWorker" "qualityEstimationWorker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: translate-{{ . | kebabcase }}-pdb
  namespace: translate
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: translate
      app.kubernetes.io/component: {{ . | kebabcase }}
{{- end }}
