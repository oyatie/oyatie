apiVersion: v2
name: oya-translate
description: |
  Helm chart for the translate µservice — translation-request / batch-translate /
  language-detection / translation-memory / termbase-and-glossary / mt-engine-router /
  quality-estimation / document-localization / real-time-stream / glossary /
  file-import-export BCs deployed as horizontally-scaled, tenant-sharded,
  residency-bound, audit-grade workloads. Per ADR-0131 flat layout + ADR-0130
  SLO-gated promotion + ADR-TRANSLATE-0004 data-residency invariant.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-translate
    email: axis-translate@oyatie.dev
keywords:
  - translate
  - machine-translation
  - tms
  - translation-memory
  - quality-estimation
  - document-localization
  - real-time-captions
  - eu-ai-act
  - data-residency
dependencies:
  - name: meilisearch
    version: "0.10.0"
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
