# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-qe-score-latency
  displayName: "translate: quality-estimation score latency p99"
  labels:
    microservice: translate
    bc: quality-estimation
    sli_class: latency
    service_classification: hero-and-substrate
    owner_team: axis-translate + axis-foundry-runtime
    pack_scope: all
    risk_classification: limited_risk
spec:
  description: |
    Quality-estimation latency p99 SLO. A request is "good" when `/qe-score`
    returns a 0-100 score within ≤ 200 ms p99 (COMET-Kiwi-class model on in-house
    foundry-runtime endpoint). PRD §"Performance" FR-08.
    EU AI Act Art. 13 disclosure record required per call when jurisdiction = EU.
  service: translate
  indicator:
    metadata: {name: translate-qe-score-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99,
                sum by (le) (rate(oya_translate_qe_score_duration_seconds_bucket[5m])))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.999
      op: lte
      value: 0.200
      displayName: "30d rolling p99 ≤ 200 ms"
  alertPolicies:
    - alertPolicyRef: translate-qe-fast-burn-1h-14x
    - alertPolicyRef: translate-qe-slow-burn-6h-6x
    - alertPolicyRef: translate-qe-bound-violation
