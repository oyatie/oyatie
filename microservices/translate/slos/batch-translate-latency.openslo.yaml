# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: translate-batch-translate-latency
  displayName: "translate: 100-segment batch-translate latency p95"
  labels:
    microservice: translate
    bc: batch-translate
    sli_class: latency
    service_classification: hero-and-substrate
    owner_team: axis-translate
    pack_scope: all
    data_classes: PII_IDENTIFYING,BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Batch-translate latency p95 SLO. A batch call is "good" when 100 segments
    submitted in one POST `/batch-translate` returns within ≤ 1.5 s p95 (concurrent
    fan-out to in-house + TM leverage). PRD §"Performance" FR-02.
  service: translate
  indicator:
    metadata: {name: translate-batch-translate-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95,
                sum by (le) (rate(oya_translate_batch_translate_duration_seconds_bucket{batch_size_bucket="100"}[5m])))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 1.5
      displayName: "30d rolling p95 ≤ 1.5 s for 100-segment batches"
  alertPolicies:
    - alertPolicyRef: translate-batch-fast-burn-1h-14x
    - alertPolicyRef: translate-batch-slow-burn-6h-6x
