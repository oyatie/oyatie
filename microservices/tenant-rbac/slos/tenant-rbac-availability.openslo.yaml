apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenant-rbac-availability
  labels:
    service: tenant-rbac
    sap_code: "suite"
spec:
  description: "Tenant RBAC API availability objective for governed HR, payroll, accounting, and ERP composition routes; production evidence remains unclaimed until runtime telemetry lands."
  service: tenant-rbac
  indicator:
    metadata:
      name: tenant-rbac-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_count{service=\"tenant-rbac\",http_response_status_code=~\"2..|3..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_server_request_duration_count{service=\"tenant-rbac\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: tenant-rbac-availability
      target: 0.999
