apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenant-rbac-audit-emission-lag-p99
  labels:
    service: tenant-rbac
    sap_code: "suite"
spec:
  description: "Tenant RBAC audit-chain emission freshness objective for later WAL/outbox/Merkle runtime integration; production evidence remains unclaimed until runtime telemetry lands."
  service: tenant-rbac
  indicator:
    metadata:
      name: tenant-rbac-audit-emission-lag-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(audit_chain_emit_lag_bucket{service=\"tenant-rbac\",le=\"30\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(audit_chain_emit_lag_count{service=\"tenant-rbac\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: tenant-rbac-audit-emission-lag-p99
      target: 0.99
