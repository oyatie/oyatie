apiVersion: v2
name: oya-tasks
description: |
  Helm chart for the tasks µservice — task-store / project-list / view-engine /
  dependency-graph / recurrence / search-index / importers BCs deployed as
  horizontally-scaled, tenant-sharded, dual-context-isolated workloads. Per
  ADR-0131 flat layout + ADR-0130 SLO-gated promotion + ADR-TASKS-0001 hybrid
  custom-field model + ADR-TASKS-0002 cycle-prevention invariant +
  ADR-TASKS-0004 LexoRank + Loro CRDT + ADR-TASKS-0006 EU AI Act Annex III §4
  refusal.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-tasks
    email: axis-tasks@oyatie.dev
keywords:
  - tasks
  - task-management
  - project-management
  - kanban
  - gantt
  - dependency-graph
  - recurring-tasks
  - linear-class
  - asana-class
  - jira-class
dependencies:
  - name: meilisearch
    version: "0.10.0"
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
