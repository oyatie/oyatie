apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tasks-burn-rate-rules
  namespace: tasks
  labels:
    app.kubernetes.io/name: tasks
    prometheus: mimir
spec:
  groups:
    - name: tasks-recording-rules
      interval: 60s
      rules:
        - record: tasks:task_create:availability_5m
          expr: |
            sum(rate(oya_tasks_task_create_total{result="success"}[5m]))
            /
            sum(rate(oya_tasks_task_create_total[5m]))
        - record: tasks:task_list:latency_p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_tasks_task_list_latency_seconds_bucket[5m]))
            )
        - record: tasks:search_query:latency_p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(oya_tasks_search_query_latency_seconds_bucket[5m]))
            )
        - record: tasks:bulk_edit:availability_5m
          expr: |
            sum(rate(oya_tasks_bulk_edit_total{result="success"}[5m]))
            /
            sum(rate(oya_tasks_bulk_edit_total[5m]))
        - record: tasks:dependency_cycle:refusal_5m
          expr: |
            sum(rate(oya_tasks_dependency_cycle_refused_total[5m]))

    - name: tasks-burn-rate-alerts
      rules:
        - alert: TasksTaskCreateFastBurn1h
          expr: |
            (1 - tasks:task_create:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: tasks
          annotations:
            summary: "tasks task-create fast-burn (14.4x) for 5m"

        - alert: TasksTaskCreateSlowBurn6h
          expr: |
            (1 - avg_over_time(tasks:task_create:availability_5m[6h])) > 6 * (1 - 0.999)
          for: 30m
          labels:
            severity: warning
            burn_window: 6h
            sli: availability
            microservice: tasks

        - alert: TasksTaskListLatencyHigh
          expr: |
            tasks:task_list:latency_p99_5m > 0.5
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: tasks

        - alert: TasksDependencyCycleRefusalRateAnomaly
          expr: |
            tasks:dependency_cycle:refusal_5m > 5
          for: 5m
          labels:
            severity: warning
            sli: invariant
            microservice: tasks
          annotations:
            summary: "tasks dependency cycle refusals elevated — surge in client retries or attack"
            runbook_url: "https://oyatie.dev/microservices/tasks/runbooks/dependency-cycle-storm"

        - alert: TasksAutoAssignFairnessAnomaly
          expr: |
            abs(
              avg by (cohort) (oya_tasks_auto_assign_acceptance_ratio)
              - on() group_left() avg(oya_tasks_auto_assign_acceptance_ratio)
            ) > 0.2
          for: 30m
          labels:
            severity: critical
            policy: eu-ai-act-annex-iii-section-4
            microservice: tasks
          annotations:
            summary: "tasks T2 auto-assign fairness deviation > 20% (Annex III §4 employment-context)"
            runbook_url: "https://oyatie.dev/microservices/tasks/runbooks/auto-assign-fairness-drift"

        - alert: TasksRecurringMaterializerBacklog
          expr: |
            oya_tasks_recurring_materializer_queue_depth_seconds > 60
          for: 15m
          labels:
            severity: warning
            microservice: tasks

        - alert: TasksSearchIndexDegradedFallback
          expr: |
            increase(oya_tasks_search_degraded_fallback_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
            sli: degraded-mode
            microservice: tasks
          annotations:
            summary: "tasks search fell back to direct-Postgres tsvector path (Meilisearch unhealthy)"
            runbook_url: "https://oyatie.dev/microservices/tasks/runbooks/search-index-rebuild"

    - name: tasks-hyperscaler-overlay-circuit-breaker
      interval: 60s
      rules:
        # INV-CIRCUIT-BREAKER-BULKHEAD per /specs/hyperscaler-architecture-invariants.json
        - alert: tasks-llm-capability-circuit-open
          expr: max(oya_tasks_capability_circuit_state{state="open"}) > 0
          for: 1m
          labels:
            severity: page
            microservice: tasks
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "tasks LLM/capability circuit-breaker tripped open"
        - alert: tasks-llm-capability-retry-budget-exhausted
          expr: sum(increase(oya_tasks_capability_retry_budget_exhausted_total[5m])) > 0
          for: 1m
          labels:
            severity: page
            microservice: tasks
            inv: INV-CIRCUIT-BREAKER-BULKHEAD
          annotations:
            summary: "tasks capability retry-budget exhausted"

    - name: tasks-hyperscaler-overlay-tenant-rate-limit
      interval: 60s
      rules:
        # INV-SHUFFLE-SHARDING per /specs/hyperscaler-architecture-invariants.json
        - alert: tasks-tenant-rate-limit-429-surge
          expr: |
            sum by (tenant_id) (
              rate(oya_tasks_responses_429_total[5m])
            ) > 50
          for: 5m
          labels:
            severity: ticket
            microservice: tasks
            inv: INV-SHUFFLE-SHARDING
          annotations:
            summary: "tasks tenant {{ $labels.tenant_id }} 429 rate > 50/s sustained 5m (token bucket exhausted)"

    - name: tasks-hyperscaler-overlay-golden-signals
      interval: 60s
      rules:
        # INV-FOUR-GOLDEN-SIGNALS per /specs/hyperscaler-architecture-invariants.json
        # (latency covered by per-SLO burn-rate alerts; this group covers traffic + errors + saturation)
        - alert: tasks-saturation-cpu-over-70pct
          expr: avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"tasks-.*"}[5m])) > 0.7
          for: 10m
          labels:
            severity: ticket
            microservice: tasks
            golden_signal: saturation
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "tasks pod CPU saturation > 70% sustained 10m"
        - alert: tasks-errors-5xx-rate-spike
          expr: |
            sum(rate(oya_tasks_responses_5xx_total[5m]))
            /
            sum(rate(oya_tasks_responses_total[5m])) > 0.01
          for: 5m
          labels:
            severity: page
            microservice: tasks
            golden_signal: errors
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "tasks 5xx rate > 1% sustained 5m"
        - alert: tasks-traffic-drop-90pct
          expr: |
            (
              sum(rate(oya_tasks_responses_total[5m]))
              /
              sum(rate(oya_tasks_responses_total[1h] offset 1h))
            ) < 0.1
          for: 10m
          labels:
            severity: page
            microservice: tasks
            golden_signal: traffic
            inv: INV-FOUR-GOLDEN-SIGNALS
          annotations:
            summary: "tasks inbound RPS dropped > 90% vs prior hour"

    - name: tasks-hyperscaler-overlay-error-budget-burn
      interval: 60s
      rules:
        # INV-SLO-ERROR-BUDGET per /specs/hyperscaler-architecture-invariants.json
        # Multi-window burn-rate citation rule. The full per-SLO burn-rate alerts
        # are in the per-SLO rule groups above; this rule materially binds the
        # INV-SLO-ERROR-BUDGET label onto a representative SLI so the
        # conformance gate can audit by label query.
        - alert: tasks-error-budget-fast-burn-1h-14x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_tasks_request_success_total[1h]))
              /
              sum(rate(oya_tasks_request_total[1h]))
            )) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: page
            microservice: tasks
            slo: aggregate-availability
            burn: fast-1h-14x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "tasks aggregate availability fast-burn (1h 14.4x); per-SLO burn-rate alerts above are authoritative"
        - alert: tasks-error-budget-slow-burn-6h-6x-aggregate
          expr: |
            (1 - (
              sum(rate(oya_tasks_request_success_total[6h]))
              /
              sum(rate(oya_tasks_request_total[6h]))
            )) > 6 * (1 - 0.999)
          for: 15m
          labels:
            severity: ticket
            microservice: tasks
            slo: aggregate-availability
            burn: slow-6h-6x
            inv: INV-SLO-ERROR-BUDGET
          annotations:
            summary: "tasks aggregate availability slow-burn (6h 6x); per-SLO burn-rate alerts above are authoritative"
