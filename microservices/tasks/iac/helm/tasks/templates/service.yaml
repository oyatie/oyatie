# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: tasks-rest
  namespace: tasks
  labels: {app.kubernetes.io/name: tasks}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: task-store-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-view-engine
  namespace: tasks
  labels: {app.kubernetes.io/name: tasks}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: view-engine-rest
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: wss, port: 443, targetPort: 8443}
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-search
  namespace: tasks
  labels: {app.kubernetes.io/name: tasks}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasks
    app.kubernetes.io/component: search-index-worker
  ports:
    - {name: http, port: 80, targetPort: 8080}
