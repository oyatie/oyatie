# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
global:
  pack: kr
  cluster: tasks
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-tasks-app
  tag: "1.0.0"

# Per-component resourceTier (canonical-base: oya.resourceRequests dispatcher).
# See microservices/governance/iac/helm/_oya-helpers/templates/_helpers.tpl for
# canonical CPU/memory grids per tier letter.
taskStoreRest:
  replicas: 4
  resourceTier: M
  hpa:
    minReplicas: 4
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70

customFieldWorker:
  replicas: 2
  resourceTier: S

recurringTaskMaterializer:
  replicas: 2
  resourceTier: S

dependencyGraphValidator:
  replicas: 2
  resourceTier: S

searchIndexWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

viewEngineRest:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 1500m, memory: 1.5Gi}
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 70

webhookFanoutWorker:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1500m, memory: 1Gi}

# Substrate secrets via OpenBao SecretReference
openbao:
  postgresUrl: "${openbao:secret/tasks/postgres-url}"
  valkeyUrl: "${openbao:secret/tasks/valkey-url}"
  meilisearchKey: "${openbao:secret/tasks/meilisearch-master-key}"
  tenantDekRootKey: "${openbao:secret/tasks/tenant-dek-root-key}"
  ed25519AuditSigningKey: "${openbao:secret/tasks/ed25519-audit-signing-key}"

meilisearch:
  enabled: true
