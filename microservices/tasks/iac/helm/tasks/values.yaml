global:
  pack: kr
  cluster: tasks
  imageRegistry: ghcr.io/oyatie
  imagePullPolicy: IfNotPresent

image:
  repository: oya-tasks-app
  tag: "1.0.0"

taskStoreRest:
  replicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}
  hpa:
    minReplicas: 4
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70

customFieldWorker:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

recurringTaskMaterializer:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

dependencyGraphValidator:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

searchIndexWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 2000m, memory: 4Gi}

viewEngineRest:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: 1500m, memory: 1.5Gi}
  hpa:
    minReplicas: 3
    maxReplicas: 60
    targetCPUUtilizationPercentage: 70

webhookFanoutWorker:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: 1500m, memory: 1Gi}

# Substrate secrets via OpenBao SecretReference
openbao:
  postgresUrl: "${openbao:secret/tasks/postgres-url}"
  redisUrl: "${openbao:secret/tasks/redis-url}"
  meilisearchKey: "${openbao:secret/tasks/meilisearch-master-key}"
  tenantDekRootKey: "${openbao:secret/tasks/tenant-dek-root-key}"
  ed25519AuditSigningKey: "${openbao:secret/tasks/ed25519-audit-signing-key}"

meilisearch:
  enabled: true
