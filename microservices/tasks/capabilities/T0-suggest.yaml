# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T0-suggest capabilities — tasks µservice
#
# Autonomy Tier 0: "suggest only; human accepts/rejects". Tasks surfaces here
# are safe-by-construction because their effect is a UI suggestion the user
# can accept or ignore. No autonomous action; no data flow change.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 + ADR-0140 (retired per ADR-0145) + ADR-TASKS-0006.
# Per EU AI Act Art. 50 transparency (AI-generated suggestions labelled).

doc_class: AutonomyTierCatalog
microservice: tasks
tier: T0
owner_team: axis-tasks + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T0-task-suggest-next
    name: "Next-task suggestion (smart picker)"
    description: |
      The user has just completed a task or is in idle state in the
      task UI; the assistant suggests the next-best task to work on,
      ranked by priority + due-date + recent context + dependency
      chain (e.g., "this task unblocks 5 others").
      Suggestion is rendered as a clickable chip; user accepts (click)
      or ignores. No state change.
    surface: assistant-ui (REST POST /v1/assist/next-task-suggest)
    triggers:
      - user completed a task; idle state for ≥ 30s
      - user explicitly clicks "What should I work on next?"
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis (admin opted in; per-user opt-out)
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted: INTERNAL_ONLY (task id list + ranking rationale; no task content)
    cross_tenant_consultation:
      allowed: no (tasks has NO cross-tenant grant per task-isolation.md Invariant 1)
    model:
      primary: tenant-default-llm (foundry-runtime managed) for task ranking
      fallback: rule-based heuristic (priority + due-date + dependency-blocker count)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 300
    audit_event: TaskNextSuggestionShown (per-suggestion; minimal payload — task id hash list + score)
    fallback_on_model_failure: silent skip — falls back to heuristic
    risk_classification: minimal-risk (Annex III §4 NOT triggered — suggesting, not assigning)
    user_label: "AI suggestion — click to accept" (Art. 50 transparency)

  - id: T0-task-suggest-priority
    name: "Task priority suggestion (P0..P3)"
    description: |
      When the user creates a new task with minimal metadata, the
      assistant suggests a priority (P0..P3) based on title + description
      + parent project + due-date hints. Suggestion shown; user can
      accept, override, or ignore.
    surface: compose-ui (REST POST /v1/assist/priority-suggest)
    triggers:
      - user creates a new task with title + description but no priority set
      - user explicitly requests "suggest priority"
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted: INTERNAL_ONLY (priority + rationale text)
    model:
      primary: tenant-default-llm
      fallback: rule-based (default P2)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 250
    audit_event: TaskPrioritySuggestionShown
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk
    user_label: "AI suggestion — Tab to accept"

  - id: T0-task-suggest-label
    name: "Task label / tag suggestion"
    description: |
      Suggest labels from the tenant's label vocabulary based on title +
      description + parent project. Multiple labels surfaced as chips;
      user accepts (click), removes (X), or types their own.
    surface: compose-ui (REST POST /v1/assist/label-suggest)
    triggers:
      - user creates a new task with title + description but no labels set
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING]
    data_class_emitted: INTERNAL_ONLY (label id list)
    model:
      primary: tenant-default-llm
      fallback: empty (no fallback — fail-silent)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 200
    audit_event: TaskLabelSuggestionShown
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk
    user_label: "AI suggestion — click to accept"

  - id: T0-task-suggest-due-date
    name: "Task due-date suggestion from natural language"
    description: |
      Parse natural-language hints in task title ("tomorrow", "next Friday",
      "EOY", "before Q3 demo") into a concrete due-date. Surface as
      "did you mean Friday Oct 18?"; user accepts, edits, or ignores.
    surface: compose-ui (REST POST /v1/assist/due-date-suggest)
    triggers:
      - user creates a new task with date-hint phrase in title
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (parsed date)
    model:
      primary: tenant-default-llm (chronological parser)
      fallback: rule-based (chrono-rs regex)
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 150
    audit_event: TaskDueDateSuggestionShown
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk
    user_label: "AI suggestion — Tab to accept"

verification:
  - All T0 suggestions emit a Cedar-evaluable principal/action/resource triple to `policy/tenant-scope.cedar` BEFORE model invocation.
  - All T0 suggestions emit an audit-chain event (Ed25519-sealed; non-content payload only) on suggestion-shown + suggestion-accepted.
  - All T0 suggestions are labelled per EU AI Act Art. 50 in the UI surface.
  - All T0 suggestions respect dual-context isolation: Personal-context suggestions NEVER consult Professional-context data; Professional-context suggestions NEVER consult Personal-context data. Enforced at `oya-tasks-task-store-domain` per PRD AC-07.
  - T0 suggestions do NOT create, modify, or delete tasks without explicit user action.

references:
  - /specs/agentic-tiers.json — autonomy tier spec.
  - ADR-0140 — Cedar policy enforcement substrate.
  - ADR-0133 — autonomy tiering as industry-best-practice axis.
  - ADR-TASKS-0006 — AI auto-assign + EU AI Act Annex III §4 bounds.
  - EU AI Act Regulation (EU) 2024/1689 — Art. 50 transparency.
  - microservices/tasks/PRD.md FR-20.
  - microservices/tasks/policy/task-isolation.md — dual-context enforcement.
  - microservices/calendar/capabilities/T0-suggest.yaml — sibling reference.
