apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-webhook-fire-latency
  displayName: "tasks: webhook fire p95 (from commit to dispatch)"
  labels:
    microservice: tasks
    bc: task-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
spec:
  description: |
    Webhook fire p95 latency SLO. A webhook dispatch is "good" when it
    fires within ≤ 200ms from the originating task-write commit. PRD-
    tasks §"Performance". Notification timing observable per Hyrum #5
    in migration-from-connect.md.
  service: tasks
  indicator:
    metadata: {name: tasks-webhook-fire-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_tasks_webhook_fire_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.2
      displayName: "30d rolling p95 ≤ 200ms"
  alertPolicies:
    - alertPolicyRef: tasks-webhook-fire-fast-burn-1h-14x
    - alertPolicyRef: tasks-webhook-fire-slow-burn-6h-6x
