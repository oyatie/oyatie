apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-task-create-latency
  displayName: "tasks: task create p95"
  labels:
    microservice: tasks
    bc: task-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: PROFESSIONAL_TASK_CONTENT
spec:
  description: |
    Task create p95 latency SLO. A write is "good" when task creation
    (sync write + async fanout dispatched) completes in ≤ 80ms. PRD-tasks
    §"Performance".
  service: tasks
  indicator:
    metadata: {name: tasks-task-create-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_tasks_task_create_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.08
      displayName: "30d rolling p95 ≤ 80ms"
  alertPolicies:
    - alertPolicyRef: tasks-task-create-fast-burn-1h-14x
    - alertPolicyRef: tasks-task-create-slow-burn-6h-6x
