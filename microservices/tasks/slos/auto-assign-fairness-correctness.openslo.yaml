apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-auto-assign-fairness-correctness
  displayName: "tasks: T2 auto-assign fairness (per-protected-class ≥ 0.8)"
  labels:
    microservice: tasks
    bc: task-store
    sli_class: correctness
    tier: load-bearing-invariant
    owner_team: axis-tasks + council-privacy + foundry-runtime
    pack_scope: [pack-eu, pack-us]
    data_classes: BEHAVIORAL_TENANT_PRODUCT
    compliance: [PRD-AC-12, ADR-TASKS-0006, EEOC-UGESP-1978, EU-AI-ACT-Annex-III-§4]
spec:
  description: |
    AI auto-assign fairness correctness SLO. T2 auto-assign decisions
    (where permitted by Cedar layer; see capabilities/T2-auto.yaml +
    policy/dual-context-isolation.cedar) must maintain per-protected-
    class accept-rate ≥ 0.8 (4/5 rule per EEOC UGESP 1978 §1607.4(D)).

    Per ADR-TASKS-0006, this SLO is checked WEEKLY; threshold breach
    triggers auto-rollback per runbooks/ai-assign-classifier-rollback.md.

    **EU AI Act Annex III §4** + **EEOC UGESP 1978** are the regulatory
    authorities. **Auto-assign in employment-context is REFUSED at
    Cedar layer for pack-eu / pack-kr / pack-jp / pack-au + for pack-us
    until this SLO is green sustained.** Target = 100% (no error budget;
    any breach is Sev-1).

    Per-protected-class is sliced by tenant-declared protected-class
    schema (e.g., gender, ethnicity, age-band, disability-status) at
    tenant onboarding; tenant DPA controls the schema.
  service: tasks
  indicator:
    metadata: {name: tasks-auto-assign-fairness}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              min(oya_tasks_auto_assign_fairness_score by (protected_class))
  timeWindow:
    - duration: 7d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 1.0
      op: gte
      value: 0.8
      displayName: "100% of timeslices: per-protected-class accept-rate ≥ 0.8 (4/5 rule)"
  alertPolicies:
    - alertPolicyRef: tasks-auto-assign-fairness-breach-page
