# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-search-latency
  displayName: "tasks: cross-project search p95"
  labels:
    microservice: tasks
    bc: search-index
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: PROFESSIONAL_TASK_CONTENT
spec:
  description: |
    Cross-project search p95 latency SLO. A query is "good" when full-
    text search across a tenant's projects completes in ≤ 300ms via
    Meilisearch (or degraded Postgres-trigram fallback). PRD-tasks
    §"Performance".
  service: tasks
  indicator:
    metadata: {name: tasks-search-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_tasks_search_query_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.3
      displayName: "30d rolling p95 ≤ 300ms"
  alertPolicies:
    - alertPolicyRef: tasks-search-fast-burn-1h-14x
    - alertPolicyRef: tasks-search-slow-burn-6h-6x
