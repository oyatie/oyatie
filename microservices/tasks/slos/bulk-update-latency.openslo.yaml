# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-bulk-update-latency
  displayName: "tasks: bulk-update 100 tasks p95"
  labels:
    microservice: tasks
    bc: task-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: PROFESSIONAL_TASK_CONTENT
spec:
  description: |
    Bulk-update 100 tasks p95 latency SLO. A bulk write of exactly 100
    tasks (atomic per-batch) is "good" when it completes in ≤ 300ms.
    PRD-tasks AC-05.
  service: tasks
  indicator:
    metadata: {name: tasks-bulk-update-100-p95}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.95, sum(rate(oya_tasks_bulk_update_seconds_bucket{batch_size="100"}[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.3
      displayName: "30d rolling p95 ≤ 300ms (100-task batch)"
  alertPolicies:
    - alertPolicyRef: tasks-bulk-update-fast-burn-1h-14x
    - alertPolicyRef: tasks-bulk-update-slow-burn-6h-6x
