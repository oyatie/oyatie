apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-task-update-latency
  displayName: "tasks: task update p99"
  labels:
    microservice: tasks
    bc: task-store
    sli_class: latency
    tier: hero-product
    owner_team: axis-tasks
    pack_scope: all
    data_classes: PROFESSIONAL_TASK_CONTENT
spec:
  description: |
    Task update p99 latency SLO. A write is "good" when single-field
    task update completes in ≤ 50ms. PRD-tasks §"Performance".
  service: tasks
  indicator:
    metadata: {name: tasks-task-update-p99}
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(oya_tasks_task_update_seconds_bucket[5m])) by (le))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Timeslices
  objectives:
    - target: 0.99
      op: lte
      value: 0.05
      displayName: "30d rolling p99 ≤ 50ms"
  alertPolicies:
    - alertPolicyRef: tasks-task-update-fast-burn-1h-14x
    - alertPolicyRef: tasks-task-update-slow-burn-6h-6x
