apiVersion: openslo/v1
kind: SLO
metadata:
  name: tasks-dependency-cycle-detection-correctness
  displayName: "tasks: dependency-cycle detection correctness (must be 100%)"
  labels:
    microservice: tasks
    bc: dependency-graph
    sli_class: correctness
    tier: load-bearing-invariant
    owner_team: axis-tasks
    pack_scope: all
    data_classes: BEHAVIORAL_TENANT_PRODUCT
    compliance: [PRD-AC-02, ADR-TASKS-0002]
spec:
  description: |
    Dependency-cycle detection correctness SLO. A dependency-edge write
    that would create a cycle is "good" iff it is REFUSED with a
    `DependencyCycle::Refused` outcome AND no edge row is written. Any
    case where a cycle-creating edge is admitted is a catastrophic
    correctness failure of PRD AC-02 + ADR-TASKS-0002. Target = 100%.
    No error budget.
  service: tasks
  indicator:
    metadata: {name: tasks-dependency-cycle-refusal-ratio}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_tasks_dependency_cycle_refused_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_tasks_dependency_cycle_attempt_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 1.0
      displayName: "100% cycle refusal (no error budget; any leak is Sev-1)"
  alertPolicies:
    - alertPolicyRef: tasks-dependency-cycle-any-leak-page
