apiVersion: openslo/v1
kind: SLO
metadata:
  name: real-estate-latency-p99
  labels:
    service: real-estate
    sap_code: "RE-FX"
spec:
  description: "Real Estate real-estate-latency-p99 objective; benchmarks SAP RE-FX Flexible Real Estate Management | Oracle Fusion Lease Accounting | Workday Lease Accounting | NetSuite Fixed Assets and lease-accounting counterpart | Microsoft Dynamics 365 Finance Lease Accounting"
  service: real-estate
  indicator:
    metadata:
      name: real-estate-latency-p99-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_bucket{service=\"real-estate\",le=\"0.35\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_request_duration_seconds_count{service=\"real-estate\"}[5m]))"
  objectives:
    - displayName: real-estate-latency-p99
      target: 0.99
