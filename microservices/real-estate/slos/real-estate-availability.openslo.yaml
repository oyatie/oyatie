apiVersion: openslo/v1
kind: SLO
metadata:
  name: real-estate-availability
  labels:
    service: real-estate
    sap_code: "RE-FX"
spec:
  description: "Real Estate real-estate-availability objective; benchmarks SAP RE-FX Flexible Real Estate Management | Oracle Fusion Lease Accounting | Workday Lease Accounting | NetSuite Fixed Assets and lease-accounting counterpart | Microsoft Dynamics 365 Finance Lease Accounting"
  service: real-estate
  indicator:
    metadata:
      name: real-estate-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"real-estate\",status=~\"2..\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(http_requests_total{service=\"real-estate\"}[5m]))"
  objectives:
    - displayName: real-estate-availability
      target: 0.999
