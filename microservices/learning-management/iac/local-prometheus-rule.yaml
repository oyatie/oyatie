apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: learning-management-local-slo-burn
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: learning-management.local.slo
      rules:
        - alert: LearningManagementLocalSloBurn
          expr: (sum(rate(oya_learning_management_content_delivery_latency_good_total[5m])) / sum(rate(oya_learning_management_content_delivery_latency_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: learning-management
          annotations:
            summary: Learning Management content-delivery-latency burn
            runbook: microservices/learning-management/runbooks/local-content-delivery-burn.md
