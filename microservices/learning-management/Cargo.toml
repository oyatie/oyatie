[package]
name = "oya-learning-management-course-progress-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Rust source scaffold for the Oyatie learning-management microservice."
authors = ["Oyatie Council Architecture"]
repository = "https://github.com/oyatie/oyatie"
keywords = ["oyatie", "learning-management", "microservice"]
categories = ["development-tools"]

[package.metadata.oya]
microservice = "learning-management"
bounded_context = "course-progress"
architecture_layers = "ADR-0105-13-layer-enum-with-ADR-0106-usecase"
contracts = ["openapi-v1", "grpc-v1", "asyncapi-v1"]
scaffold_wave = "Wave-3-K"
scaffold_agent = "codex-rust-src-scaffolds-w2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oya-learning-management-service"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
