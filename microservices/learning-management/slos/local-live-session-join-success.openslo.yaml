apiVersion: openslo/v1
kind: SLO
metadata:
  name: learning-management-live-session-join-success
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: learning-management
  description: Live learning sessions joined successfully for course delivery, cohort enrollment, assessment submission, certificate issuance, and learning content operations.
  indicator:
    metadata:
      name: live-session-join-success
      labels:
        domain_object: LearningCohort
        operator_audience: LEARNING_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_live_session_join_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_live_session_join_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Live learning sessions joined successfully
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
