apiVersion: openslo/v1
kind: SLO
metadata:
  name: learning-management-course-progress-freshness
  labels:
    service: learning-management
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: learning-management
  description: Learner progress projection freshness for course delivery, cohort enrollment, assessment submission, certificate issuance, and learning content operations.
  indicator:
    metadata:
      name: course-progress-freshness
      labels:
        domain_object: LearningCohort
        operator_audience: LEARNING_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_course_progress_freshness_good_total[1h])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_course_progress_freshness_total[1h])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Learner progress projection freshness
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
