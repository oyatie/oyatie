apiVersion: openslo/v1
kind: SLO
metadata:
  name: learning-management-policy-decision-latency
  labels:
    service: learning-management
    adr: ADR-0139
spec:
  service: learning-management
  indicator:
    metadata:
      name: policy-decision-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_policy_decision_latency_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_learning_management_policy_decision_latency_total[5m]))
  objectives:
    - displayName: Learning Management policy-decision-latency
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
