apiVersion: oyatie.dev/v1
kind: EchConfig
metadata:
  name: contract-lifecycle-management-ech-config
  labels:
    service: contract-lifecycle-management
    binding_adr: ADR-0253-amendment
spec:
  service: contract-lifecycle-management
  tenantScoped: true
  audienceType: LEGAL_OPERATIONS_OWNER
  transport:
    default: HTTP/3
    fallback: [HTTP/2, HTTP/1.1]
    tlsMinVersion: "1.3"
    ech: enabled
    pqcHybrid: X25519MLKEM768
  policy:
    cedarDefaultDeny: policy/contract-obligation-authorization.cedar
    abuseDefence: policy/abuse-defence.cedar
  marketplaceSettlement: DealSet
  benchmarks: ["Ironclad", "Conga CLM", "LinkSquares", "Agiloft", "Icertis"]
