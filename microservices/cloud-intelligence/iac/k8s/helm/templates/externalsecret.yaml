# External Secrets Operator resources for cloud-intelligence
# SecretStore uses Kubernetes auth against OpenBao Transit
# Binding ADRs: ADR-0296 (library-first credential sidecar), ADR-0384 (cloud-intelligence path-b)
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cloud-intelligence-openbao-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0384: cloud-intelligence-path-b
spec:
  provider:
    vault:
      server: "https://openbao.cloud-secrets.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloud-intelligence-service-role"
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloud-intelligence-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0384: cloud-intelligence-path-b
  annotations:
    description: "OAuth refresh tokens and OpenBao access token for cloud-intelligence gateway — elevated TTL 300s"
spec:
  refreshInterval: {{ .Values.secret.refreshInterval | quote }}
  secretStoreRef:
    name: cloud-intelligence-openbao-store
    kind: SecretStore
  target:
    name: {{ .Values.secret.secretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: openbao_token
      remoteRef:
        key: {{ .Values.secret.openbaoPath | quote }}
        property: openbao_token
    - secretKey: anthropic_refresh_token
      remoteRef:
        key: {{ .Values.secret.openbaoPath | quote }}
        property: anthropic_refresh_token
    - secretKey: openai_api_key
      remoteRef:
        key: {{ .Values.secret.openbaoPath | quote }}
        property: openai_api_key
    - secretKey: gemini_api_key
      remoteRef:
        key: {{ .Values.secret.openbaoPath | quote }}
        property: gemini_api_key
