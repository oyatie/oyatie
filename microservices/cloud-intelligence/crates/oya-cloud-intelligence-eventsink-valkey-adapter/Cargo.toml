[package]
name = "oya-cloud-intelligence-eventsink-valkey-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Valkey Stream EventSink adapter for the cloud-intelligence OAuth subscription pool
# (ADR-0384 Path B, Stage-7 D6 production seam).
#
# Implements `EventSink` from `oya-cloud-intelligence-kernel` by
# emitting `LlmGatewayEvent` to Valkey Stream
# `cloud-intelligence-receipts:<tenant>` via XADD.
#
# ADR citations: ADR-0083, ADR-0105, ADR-0131, ADR-0384.

[lib]
name = "oya_cloud_intelligence_eventsink_valkey_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-intelligence-kernel = { path = "../oya-cloud-intelligence-kernel" }
serde.workspace = true
tracing.workspace = true
# redis crate provides Valkey-compatible client (Valkey is a Redis fork with
# identical protocol). Not yet in workspace deps — pinned directly per
# ADR-0090 blessed-allowlist; workspace consolidation deferred.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "streams"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
