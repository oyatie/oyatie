[package]
name = "oya-cloud-intelligence-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# OAuth subscription-pool app crate (ADR-0384 Path B, Stage-6).
# Composition + binary entry-point for the cloud-intelligence µservice.
# Wires:
#   kernel (pool + AuthzGate seam) + Cedar adapter + REST adapter + in-process stubs
#   into build_app() -> Arc<AppState>, then serves the axum router via tokio::main.
#
# Real OpenBao adapter and ClickHouse/Valkey sinks are Stage-7 items.

[[bin]]
name = "cloud-intelligence"
path = "src/main.rs"

[lib]
name = "oya_cloud_intelligence_app"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-cloud-intelligence-kernel = { path = "../oya-cloud-intelligence-kernel" }
oya-cloud-intelligence-rest = { path = "../oya-cloud-intelligence-rest" }
oya-cloud-intelligence-authz-cedar-adapter = { path = "../oya-cloud-intelligence-authz-cedar-adapter" }
oya-cloud-intelligence-openbao-adapter = { path = "../oya-cloud-intelligence-openbao-adapter" }
oya-cloud-intelligence-eventsink-clickhouse-adapter = { path = "../oya-cloud-intelligence-eventsink-clickhouse-adapter" }
oya-cloud-intelligence-eventsink-valkey-adapter = { path = "../oya-cloud-intelligence-eventsink-valkey-adapter" }
oya-shared-olap-clickhouse-adapter = { path = "../../../../crates/oya-shared-olap-clickhouse-adapter" }
tokio.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
