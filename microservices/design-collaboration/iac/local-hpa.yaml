apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: design-collaboration-file-loader
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: design-collaboration-file-loader
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_design_collaboration_file_load_time_inflight
        target:
          type: AverageValue
          averageValue: "100"
