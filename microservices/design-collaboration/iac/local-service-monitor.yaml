apiVersion: oyatie.dev/v1
kind: ServiceMonitor
metadata:
  name: design-collaboration-local-ops
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  service: design-collaboration
  endpoints:
    - port: http3
      path: /metrics
      interval: 30s
  metricAllowList:
    - oya_design_collaboration_file_load_time_good_total
    - oya_design_collaboration_version_save_latency_good_total
  tenantScoped: true
  policyFiles:
    - policies/local-file-open-entitlement.cedar
