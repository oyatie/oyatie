apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: design-collaboration-local-slo-burn
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  groups:
    - name: design-collaboration.local.slo
      rules:
        - alert: DesignCollaborationLocalSloBurn
          expr: (sum(rate(oya_design_collaboration_file_load_time_good_total[5m])) / sum(rate(oya_design_collaboration_file_load_time_total[5m]))) < 0.99
          for: 10m
          labels:
            severity: page
            service: design-collaboration
          annotations:
            summary: Design Collaboration file-load-time burn
            runbook: microservices/design-collaboration/runbooks/local-file-load-time-burn.md
