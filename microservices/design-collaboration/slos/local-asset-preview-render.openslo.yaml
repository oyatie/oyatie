apiVersion: openslo/v1
kind: SLO
metadata:
  name: design-collaboration-asset-preview-render
  labels:
    service: design-collaboration
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: design-collaboration
  description: Asset previews rendered for active files for design file loading, version saving, comment synchronization, asset preview, permission checks, and handoff export operations.
  indicator:
    metadata:
      name: asset-preview-render
      labels:
        domain_object: DesignFile
        operator_audience: DESIGN_WORKSPACE_ADMIN
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_asset_preview_render_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_design_collaboration_asset_preview_render_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Asset previews rendered for active files
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
