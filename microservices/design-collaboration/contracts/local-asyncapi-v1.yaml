asyncapi: 3.1.0
info:
  title: Design Collaboration Local Operational Events
  version: 1.0.0
  description: Events for design file loading, version saving, comment synchronization, asset preview, permission checks, and handoff export operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  design-collaboration.local-ops.v1:
    address: design-collaboration.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/design-collaboration.local-ops.v1'
    messages:
      - $ref: '#/channels/design-collaboration.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/design-collaboration.local-ops.v1'
    messages:
      - $ref: '#/channels/design-collaboration.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: DesignCollaborationDomainEvent
      title: Design Collaboration domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['design.file.opened', 'version.saved', 'comment.synced', 'handoff.exported'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['design_file', 'version_snapshot', 'comment_thread', 'asset_preview', 'handoff_spec', 'design_permission'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: DesignCollaborationSloBurnEvent
      title: Design Collaboration SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'design-collaboration' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'design.file.opened' }
