asyncapi: 3.1.0
info:
  title: Design Collaboration Events
  version: 1.0.0
  description: Tenant-scoped event contract for design systems, prototype links, asset versioning, and design review.
defaultContentType: application/json
channels:
  design-collaboration.events.v1:
    address: design-collaboration.events.v1
    messages:
      designCollaborationActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/design-collaboration.events.v1'
    messages:
      - $ref: '#/channels/design-collaboration.events.v1/messages/designCollaborationActionAccepted'
components:
  messages:
    ActionAccepted:
      name: DesignCollaborationActionAccepted
      title: Design Collaboration action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
