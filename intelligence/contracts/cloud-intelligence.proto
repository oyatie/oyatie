// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// Oyatie Cloud Intelligence service — admin/internal gRPC contract.
//
// Design + research grounding: intelligence/PRD.md §4 and
// intelligence/design/hyperscaler-best-practice-brief.md.
// This is the ADMIN/INTERNAL control-plane surface (the data plane is the
// OpenAI-compatible REST surface in cloud-intelligence.openapi.yaml). It mirrors the
// admin operations in the OpenAPI `admin` tag: pool status, key refresh, status, accounts, analytics, and circuit-breaker resume.
//
// Authority: ADR-0090 (hyper backbone), ADR-0105 (layered kernel/rest),
// ADR-0145 inter-µservice communication, ADR-0373 (key-pool resilience).
//
// The field shapes mirror the IMPLEMENTED pure kernel
// (crates/oya-cloud-intelligence-kernel/src/lib.rs): ProviderChannel enum, the
// active/blacklisted KeyState with a cooldown-until timestamp, KeyPool::active_count,
// and the hash-only KeyFingerprint. No raw key material is ever carried on the wire
// (brief §5 — keys appear only as fingerprints).

syntax = "proto3";

package oyatie.cloud_intelligence.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/oyatie/cloud-intelligence-sdk-go/v1;cloudintelligence";
option java_multiple_files = true;
option java_package = "co.oyatie.cloud_intelligence.v1";

// Control-plane service — internal admin realm only. SPIFFE workload identity and
// owned-policy-engine-port decisions enforce authorization.
service LlmGatewayAdmin {
  // Report key-pool health across all provider channels.
  rpc PoolStatus(PoolStatusRequest) returns (PoolStatusResponse);

  // Force an out-of-band key-pool refresh from owned-secret-provider-port for one provider.
  // Idempotent. Never reads keys from disk/env (brief §5, §7).
  rpc KeyRefresh(KeyRefreshRequest) returns (KeyRefreshResponse);

  // Report gateway, route-controller, model-inventory, credential-worker, and policy readiness.
  rpc GatewayStatus(GatewayStatusRequest) returns (GatewayStatusResponse);

  // Return redacted provider account/seat status for tenant operations views.
  rpc AccountStatus(AccountStatusRequest) returns (AccountStatusResponse);

  // Return aggregated analytics for cloud dashboard/admin API surfaces.
  rpc AnalyticsSummary(AnalyticsSummaryRequest) returns (AnalyticsSummaryResponse);

  // Return redacted status for cloud-intelligence agent runtime profiles and workflows.
  rpc AgentRuntimeStatus(AgentRuntimeStatusRequest) returns (AgentRuntimeStatusResponse);

  // Return redacted status for controller-owned tenant agent schedules.
  rpc AgentScheduleStatus(AgentScheduleStatusRequest) returns (AgentScheduleStatusResponse);

  // Return redacted scheduled parity/drift canary status with Retry-After hints.
  rpc ParityCanaryStatus(ParityCanaryStatusRequest) returns (ParityCanaryStatusResponse);

  // Resume a circuit breaker or budget guard after policy-authorized operator action.
  rpc ResumeCircuitBreaker(ResumeCircuitBreakerRequest) returns (ResumeCircuitBreakerResponse);

  // Evaluate platform safety policy and return fail-closed enforcement for critical signals.
  rpc EvaluateSafety(SafetyEvaluationRequest) returns (SafetyEvaluationResponse);

  // Return redacted escalation status for manual-review queues.
  rpc SafetyEscalationStatus(SafetyEscalationStatusRequest) returns (SafetyEscalationStatusResponse);

  // Request audited break-glass access to a sealed evidence handle.
  rpc RequestBreakGlassEvidenceAccess(BreakGlassEvidenceAccessRequest) returns (BreakGlassEvidenceAccessResponse);
}

// === Common ===

message RequestMeta {
  string x_request_id = 1;     // uuid; trace correlation + audit envelope correlationId
  string idempotency_key = 2;  // uuid; required on mutations (KeyRefresh)
  string client_user_agent = 3;
}

// Upstream provider dialect a pool serves. Mirrors the kernel ProviderChannel enum.
enum ProviderChannel {
  PROVIDER_CHANNEL_UNSPECIFIED = 0;
  PROVIDER_CHANNEL_OPENAI = 1;     // Authorization: Bearer <key>
  PROVIDER_CHANNEL_ANTHROPIC = 2;  // x-api-key + anthropic-version
  PROVIDER_CHANNEL_GEMINI = 3;     // x-goog-api-key
}

// Lifecycle state of a single pooled key. Mirrors the kernel KeyState
// (Active | Blacklisted { cooldown_until_millis }).
enum KeyLifecycleState {
  KEY_LIFECYCLE_STATE_UNSPECIFIED = 0;
  KEY_LIFECYCLE_STATE_ACTIVE = 1;       // eligible for selection
  KEY_LIFECYCLE_STATE_BLACKLISTED = 2;  // in cooldown until cooldown_until
}

message Error {
  // One of: invalid_request_error, authentication_error, permission_error,
  //         not_found_error, gateway_key_exhausted, gateway_provider_unavailable, api_error
  string type = 1;
  string message = 2;
  string request_id = 3;
}

// === PoolStatus ===

message PoolStatusRequest {
  RequestMeta meta = 1;
  // Optional filter; empty = all channels.
  repeated ProviderChannel channels = 2;
}

// Hash-only view of one pooled key. NEVER carries raw key material — only the
// kernel KeyFingerprint (a non-reversible hash) and lifecycle state (brief §5).
message PooledKeyStatus {
  string key_fingerprint = 1;          // hash-only; safe to log/return
  KeyLifecycleState state = 2;
  uint32 failure_count = 3;            // consecutive failures since last success/restore
  google.protobuf.Timestamp cooldown_until = 4; // set only when BLACKLISTED
}

message PoolStatus {
  ProviderChannel channel = 1;
  uint32 total_keys = 2;
  uint32 active_keys = 3;        // KeyPool::active_count at evaluation time
  uint32 blacklisted_keys = 4;
  // Soonest cooldown-restore across blacklisted keys; unset if none blacklisted.
  // The gateway returns this as Retry-After on a 503 gateway_key_exhausted (brief §10).
  google.protobuf.Timestamp soonest_restore = 5;
  repeated PooledKeyStatus keys = 6;
}

message PoolStatusResponse {
  repeated PoolStatus pools = 1;
  Error error = 2; // unset on success
}

// === KeyRefresh ===

message KeyRefreshRequest {
  RequestMeta meta = 1;
  // Which provider pool to refresh from owned-secret-provider-port.
  ProviderChannel channel = 2;
}

message KeyRefreshResponse {
  ProviderChannel channel = 1;
  uint32 keys_loaded = 2;
  google.protobuf.Timestamp refreshed_at = 3;
  string source = 4; // always "owned-secret-provider-port" (brief §5, §7 — never disk/env)
  Error error = 5;   // unset on success
}

// === GatewayStatus ===

message GatewayStatusRequest {
  RequestMeta meta = 1;
}

message GatewayBoundaryStatus {
  string secret_resolution = 1; // owned-secret-provider-port
  string authorization = 2;     // owned-policy-engine-port
}

message GatewayStatusResponse {
  string status = 1; // ok | degraded | unavailable
  bool route_controller_ready = 2;
  bool model_inventory_ready = 3;
  bool credential_worker_ready = 4; // owned-secret-provider-port reachability + lease readiness
  bool policy_engine_ready = 5;     // owned-policy-engine-port decision readiness
  Error error = 6;                  // unset on success
  bool default_data_plane_ready = 7;
  bool secret_provider_ready = 8;
  uint32 registered_pools = 9;
  GatewayBoundaryStatus boundaries = 10;
}

// === AccountStatus ===

message AccountStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;          // empty = caller-authorized tenant set
  ProviderChannel channel = 3;   // unspecified = all channels
}

message AccountStatusItem {
  string tenant_id = 1;
  ProviderChannel channel = 2;
  string seat_id = 3;
  string state = 4; // authorized | active | cooldown | blacklisted
  google.protobuf.Timestamp cooldown_until = 5;
  double headroom_percent = 6;
}

message AccountStatusResponse {
  repeated AccountStatusItem accounts = 1;
  Error error = 2; // unset on success
  string redaction = 3; // secret-handles-redacted
}

// === AnalyticsSummary ===

message AnalyticsSummaryRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;   // empty = caller-authorized tenant set
  string window = 3;      // e.g. PT5M, PT1H, P1D
}

message AnalyticsSummaryResponse {
  string window = 1;
  uint64 request_count = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  double rate_limit_utilization_percent = 5;
  Error error = 6; // unset on success
}

// === Agent runtime / schedule / parity canary status ===

message AgentRuntimeStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2; // empty = caller-authorized tenant set
  string runtime_profile_ref = 3;
}

message AgentRuntimeProfileStatus {
  string kind = 1; // AgentRuntimeProfile
  string tenant_id = 2;
  string name = 3;
  string model_route_ref = 4;
  string prompt_profile_ref = 5;
  string thinking_policy_ref = 6;
  string tool_compatibility_profile_ref = 7;
  string sandbox_policy_ref = 8;
  bool cloud_intelligence_owned_control_plane = 9;
  bool embeds_model_runtime = 10;
  bool installs_cli_or_tui_surface = 11;
}

message AgentWorkflowStatus {
  string kind = 1; // AgentWorkflowStatus
  string workflow_ref = 2;
  string runtime_profile_ref = 3;
  string delegation_policy_ref = 4;
  repeated string generation_adapters = 5; // claude | codex | gemini
  string routing_advisor_scope = 6;        // routing-decision-only
  string policy_engine_port = 7;           // owned-policy-engine-port
  string evidence_visibility = 8;          // redacted-structured-evidence
  string sealed_evidence_handle_ref = 9;
  bool requires_secondary_review_for_critical_blocks = 10;
  bool raw_payload_included = 11;           // false on normal status path
}

message AgentRuntimeStatusResponse {
  repeated AgentRuntimeProfileStatus runtimes = 1;
  repeated AgentWorkflowStatus workflow_statuses = 2;
  Error error = 3; // unset on success
}

message AgentScheduleStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2; // empty = caller-authorized tenant set
  string schedule_ref = 3;
}

message AgentScheduleStatusItem {
  string kind = 1; // AgentScheduleStatus
  string schedule_ref = 2;
  string state = 3; // queued | running | passed | failed | blocked
  string controller_owner = 4;
  string policy_engine_port = 5;   // owned-policy-engine-port
  string evidence_visibility = 6;  // redacted-structured-evidence
  string sealed_evidence_handle_ref = 7;
  bool raw_payload_included = 8;   // false on normal status path
  string next_run_window = 9;      // optional ISO-8601 duration until the next run; empty when unknown
}

message AgentScheduleStatusResponse {
  repeated AgentScheduleStatusItem statuses = 1;
  Error error = 2; // unset on success
}

message ParityCanaryStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2; // empty = caller-authorized tenant set
  string plan_ref = 3;
}

message ParityCanaryStatusItem {
  string kind = 1; // ParityCanaryStatus
  string artifact_family = 2; // external-proxy-reference
  string capability_namespace = 3; // XPROXY
  string plan_ref = 4;
  string state = 5; // passed | failed | running | inconclusive
  uint32 retry_after_seconds = 6; // emit as Retry-After when non-zero
  string evidence_visibility = 7; // redacted-structured-evidence
  string sealed_evidence_handle_ref = 8;
  bool raw_payload_included = 9; // false on normal status path
}

message ParityCanaryStatusResponse {
  repeated ParityCanaryStatusItem statuses = 1;
  Error error = 2; // unset on success
}

// === ResumeCircuitBreaker ===

message ResumeCircuitBreakerRequest {
  RequestMeta meta = 1;
  string scope = 2;  // tenant/provider/model or GatewayCircuitBreaker resource name
  string reason = 3;
}

message ResumeCircuitBreakerResponse {
  string scope = 1;
  string status = 2; // not_implemented until resume mutation is wired
  google.protobuf.Timestamp resumed_at = 3;
  Error error = 4; // unset on success
}

// === Safety / guardrail control plane ===

enum EvidenceDataClass {
  EVIDENCE_DATA_CLASS_UNSPECIFIED = 0;
  EVIDENCE_DATA_CLASS_PUBLIC_OR_OPERATIONAL_METADATA = 1;
  EVIDENCE_DATA_CLASS_PERSONAL_DATA = 2;
  EVIDENCE_DATA_CLASS_REGULATED_HEALTH_DATA = 3;
  EVIDENCE_DATA_CLASS_PAYMENT_OR_FINANCIAL_DATA = 4;
  EVIDENCE_DATA_CLASS_CREDENTIAL_OR_SECRET = 5;
  EVIDENCE_DATA_CLASS_TENANT_BOUNDARY_VIOLATION = 6;
  EVIDENCE_DATA_CLASS_PROMPT_INJECTION_OR_JAILBREAK = 7;
  EVIDENCE_DATA_CLASS_SECURITY_EXPLOIT_OR_BREACH = 8;
  EVIDENCE_DATA_CLASS_SELF_HARM_OR_HARM_TO_OTHERS = 9;
  EVIDENCE_DATA_CLASS_CHILD_SAFETY_OR_ABUSE = 10;
  EVIDENCE_DATA_CLASS_FRAUD_OR_HOSTILE_PATTERN = 11;
  EVIDENCE_DATA_CLASS_FAULT_OR_ANOMALY = 12;
}

message SafetyEvaluationRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;
  repeated string critical_categories = 3;
  EvidenceDataClass data_class = 4;
  bool raw_payload_included = 5; // must be false on normal evaluation path
}

message SafetyEvaluationResponse {
  string signal_id = 1;
  bool blocked = 2;
  bool quarantined = 3;
  bool secondary_agentic_review_required = 4;
  bool manual_review_required = 5;
  bool tenant_can_override_platform_critical_block = 6; // always false for critical blocks
  string policy_engine_port = 7; // always "owned-policy-engine-port"
  Error error = 8; // unset on success
}

message SafetyEscalationStatusRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;
  string escalation_id = 3;
}

message SafetyEscalationStatusResponse {
  string escalation_id = 1;
  string status = 2; // pending_secondary_review | pending_manual_review | closed
  bool secondary_agentic_review_completed = 3;
  bool secondary_agentic_review_flagged_unsafe = 4;
  string default_evidence_visibility = 5; // redacted-structured-evidence
  Error error = 6;
}

message BreakGlassEvidenceAccessRequest {
  RequestMeta meta = 1;
  string tenant_id = 2;
  string evidence_id = 3;
  string reason = 4;
}

message BreakGlassEvidenceAccessResponse {
  string evidence_id = 1;
  string status = 2; // requested | denied | granted
  bool audited = 3;
  bool encrypted_handle_only = 4;
  string secret_provider_port = 5; // always "owned-secret-provider-port"
  Error error = 6;
}
