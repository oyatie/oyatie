// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.intelligence.v1;

service IntelligenceAssist {
  rpc CreateAssistDraft (AssistDraftRequest) returns (AssistDraftResponse);
}

service IntelligenceRetrieval {
  rpc CreateRetrieval (RetrievalRequest) returns (RetrievalResponse);
}

message AssistDraftRequest {
  string principal_id = 1;
  string context_id = 2;
  string consent_grant_id = 3;
  string builder_surface = 4;
  string prompt = 5;
}

message AssistDraftResponse {
  string draft_id = 1;
  string status = 2;
  string suggested_patch_json = 3;
  string refusal_reason = 4;
  string audit_event = 5;
}

message RetrievalRequest {
  string principal_id = 1;
  string context_id = 2;
  string consent_grant_id = 3;
  string query = 4;
}

message RetrievalResponse {
  string retrieval_id = 1;
  string status = 2;
  repeated RetrievalCitation citations = 3;
  string refusal_reason = 4;
  string audit_event = 5;
}

message RetrievalCitation {
  string source_id = 1;
  string context_id = 2;
}
