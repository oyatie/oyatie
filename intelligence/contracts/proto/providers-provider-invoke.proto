// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
// foundry-providers — provider-invoke gRPC contract
// Cross-µservice consumption: foundry-runtime, workflow-engine, agents.
syntax = "proto3";

package oya.foundry.providers.v1;

import "google/protobuf/timestamp.proto";

option go_package = "oyatie.dev/proto/foundry/providers/v1;foundryproviders";

// =============================================================================
// ProviderInvoker — primary RPC surface for workload µservices
// =============================================================================
service ProviderInvoker {
  // Route + invoke one provider call.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);

  // Compute routing decision without invoking (dry-run; used by tenant-config
  // validation paths).
  rpc Decide(DecideRequest) returns (DecideResponse);

  // Stream of responses for streaming-capable vendors (Anthropic streaming,
  // OpenAI streaming, Gemini streaming, in-house streaming).
  rpc InvokeStream(InvokeRequest) returns (stream InvokeStreamChunk);
}

// =============================================================================
// Health + capability inspection (sidecar surface; non-tenant)
// =============================================================================
service ProviderHealth {
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
}

message InvokeRequest {
  string tenant_id = 1;
  string pack = 2;
  CapabilityProfile capability_profile = 3;
  Prompt prompt = 4;
  RoutingConstraints constraints = 5;
  bool evidence_attach = 6;  // default true; emit ProviderInvoked event
}

message DecideRequest {
  string tenant_id = 1;
  string pack = 2;
  CapabilityProfile capability_profile = 3;
  string request_fingerprint = 4;  // BLAKE3 hex; no prompt bytes
  RoutingConstraints constraints = 5;
}

message DecideResponse {
  string decision_id = 1;
  string selected_vendor = 2;
  string selected_transport = 3;
  string selected_region = 4;
  bool residency_compliant = 5;
  string reason = 6;
  repeated ProviderCandidate candidate_set = 7;
}

message InvokeResponse {
  string decision_id = 1;
  string vendor = 2;
  string model_id = 3;
  ProviderResponseBody response = 4;
  string evidence_ref = 5;       // audit-chain event id
  string request_hash = 6;        // BLAKE3 hex
  string response_hash = 7;       // BLAKE3 hex
  string envelope_signature = 8;  // Ed25519 hex
  double cost_usd = 9;
  uint64 latency_ms = 10;
  Usage usage = 11;
}

message InvokeStreamChunk {
  string decision_id = 1;
  oneof chunk {
    ChunkContent content = 2;
    ChunkUsage usage = 3;
    ChunkError error = 4;
    ChunkDone done = 5;
  }
}

message ChunkContent {
  string content_text = 1;
  bytes content_bytes = 2;
  string content_type = 3;
}

message ChunkUsage { Usage usage = 1; }
message ChunkError { string error_code = 1; string error_message = 2; }
message ChunkDone {
  string evidence_ref = 1;
  string request_hash = 2;
  string response_hash = 3;
  string envelope_signature = 4;
  double cost_usd = 5;
}

message CapabilityProfile {
  string name = 1;
  Requirements requirements = 2;
}

message Requirements {
  uint32 context_window_tokens = 1;
  uint32 response_latency_p99_ms = 2;
  bool supports_tool_use = 3;
  bool supports_vision = 4;
  bool supports_audio = 5;
  bool requires_phi_redaction = 6;
  bool requires_zdr = 7;
}

message Prompt {
  string system = 1;
  repeated PromptMessage messages = 2;
}

message PromptMessage {
  string role = 1;   // "user" | "assistant" | "tool"
  string content = 2;
  repeated ToolCall tool_calls = 3;
}

message ToolCall {
  string tool_name = 1;
  string arguments_json = 2;
}

message RoutingConstraints {
  repeated string forbidden_vendors = 1;
  repeated string forbidden_transports = 2;
  bool prefer_in_house = 3;
  double cost_ceiling_per_call_usd = 4;
  uint32 latency_ceiling_p99_ms = 5;
}

message ProviderCandidate {
  string vendor = 1;
  string transport = 2;
  string region = 3;
  double capability_fit_score = 4;
  double cost_per_1k_tokens_usd = 5;
  uint32 p99_latency_ms = 6;
  double availability_rolling_15m = 7;
  bool eligible = 8;
  string rejection_reason = 9;
}

message ProviderResponseBody {
  string content_text = 1;
  bytes content_bytes = 2;
  string content_type = 3;
  repeated ToolCall tool_calls = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message Usage {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

message SnapshotRequest {
  string vendor = 1;     // optional filter
  string pack = 2;       // optional filter
  string transport = 3;  // optional filter
}

message SnapshotResponse {
  repeated ProviderHealthSnapshot snapshots = 1;
}

message ProviderHealthSnapshot {
  string vendor = 1;
  string transport = 2;
  string region = 3;
  double availability_rolling_15m = 4;
  uint32 p99_latency_ms = 5;
  double error_rate_rolling_5m = 6;
  double cost_per_1k_tokens_usd = 7;
  bool demoted = 8;
  google.protobuf.Timestamp demoted_until = 9;
}

message ListCapabilitiesRequest {}
message ListCapabilitiesResponse {
  repeated CapabilityProfile profiles = 1;
}
