openapi: 3.2.0
info:
  title: oya-intelligence-guardrails
  version: 1.0.0
  summary: REST API for foundry-guardrails — prompt classification, output validation, autonomy-ceiling enforcement, content-safety, jailbreak detection, AI-slop detection
  description: |
    Tenant-facing and runtime-facing REST surface. All endpoints require OIDC + Cedar policy
    authorization (per `microservices/intelligence/policy/*.cedar`) and are tenant-scoped
    via the X-Scope-OrgID header.

    Cross-cutting authentication:
    - For foundry-runtime callers: SPIFFE mTLS attestation (only sanctioned in-cluster caller).
    - For tenant operator direct callers: OIDC bearer in Authorization: Bearer <jwt> + tenant_id claim.
    - X-Scope-OrgID MUST match the principal's tenant; mismatch returns 401.
  contact:
    name: axis-foundry-guardrails
    url: https://oyatie.com/teams/axis-foundry-guardrails
  license:
    name: Internal
servers:
  - url: https://guardrails-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
    SPIFFE:
      type: mutualTLS
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/tenant-isolation.md`
    InvocationID:
      in: header
      name: X-Invocation-ID
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'  # ULID
  schemas:
    ClassifyPromptRequest:
      type: object
      required: [prompt_text, capability_id, autonomy_level_claim]
      properties:
        prompt_text: {type: string, maxLength: 10485760}
        capability_id: {type: string}
        session_turn_count: {type: integer, minimum: 0}
        autonomy_level_claim: {type: string, enum: [T0, T1, T2, T3, T4]}
    Classification:
      type: object
      required: [verdict, evaluated_at, audit_chain_id]
      properties:
        verdict: {type: string, enum: [allow, block, redact]}
        block_reason:
          type: string
          enum:
            - pii
            - phi
            - jailbreak_injection
            - content_safety_toxicity
            - content_safety_self_harm
            - content_safety_sexual
            - content_safety_violence
            - content_safety_minors
            - content_safety_hate
            - content_safety_weapons
            - content_safety_illegal
            - autonomy_level_exceeded
            - policy_deny
            - llm_judge_budget_exceeded
            - ai_slop
        cedar_policy_ids: {type: array, items: {type: string}}
        classifier_model_versions:
          type: object
          additionalProperties: {type: string}
        ensemble_score: {type: number}
        evaluated_at: {type: string, format: date-time}
        audit_chain_id: {type: string}
    ValidateOutputRequest:
      type: object
      required: [output_text]
      properties:
        output_text: {type: string, maxLength: 10485760}
        tool_args: {type: object}
        original_prompt_hash: {type: string}
    Validation:
      type: object
      required: [verdict, evaluated_at, audit_chain_id]
      properties:
        verdict: {type: string, enum: [allow, block, redact]}
        block_reason: {type: string, nullable: true}
        redaction_diff:
          type: object
          properties:
            original_hash: {type: string}
            redacted_text: {type: string}
            redacted_spans: {type: array}
        detector_versions:
          type: object
          additionalProperties: {type: string}
        evaluated_at: {type: string, format: date-time}
        audit_chain_id: {type: string}
    EnforceAutonomyRequest:
      type: object
      required: [capability_id, requested_autonomy_level, pack]
      properties:
        capability_id: {type: string}
        requested_autonomy_level: {type: string, enum: [T0, T1, T2, T3, T4]}
        pack: {type: string, enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]}
        subject_class: {type: string, enum: [adult, minor, vulnerable, unknown]}
    AutonomyDecision:
      type: object
      properties:
        verdict: {type: string, enum: [allow, block]}
        effective_ceiling: {type: string, enum: [T0, T1, T2, T3, T4]}
        ceiling_source: {type: string}
        cedar_policy_ids: {type: array, items: {type: string}}
        audit_chain_id: {type: string}
    DecisionDetail:
      type: object
      description: |
        GDPR Art. 22 + EU AI Act Art. 13 transparency surface — explanation of an
        automated decision. Returned on every block; queryable for 30d (longer for
        HIPAA tenants).
      properties:
        decision_id: {type: string}
        invocation_id: {type: string}
        decision_kind: {type: string, enum: [classify, validate, autonomy]}
        verdict: {type: string}
        block_reason: {type: string, nullable: true}
        cedar_policy_ids: {type: array, items: {type: string}}
        classifier_model_versions:
          type: object
          additionalProperties: {type: string}
        evaluated_at: {type: string, format: date-time}
        explanation:
          type: string
          description: Human-readable explanation derived from block_reason + cedar_policy_ids
    FalsePositiveBudget:
      type: object
      properties:
        tenant_id_hashed: {type: string}
        used_this_month: {type: integer}
        total_this_month: {type: integer}
        reset_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []
  - SPIFFE: []

paths:
  /v1/classify-prompt:
    post:
      summary: Classify a candidate prompt pre-invocation
      operationId: classifyPrompt
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InvocationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassifyPromptRequest'}
      responses:
        '200':
          description: Classification verdict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Classification'}
        '401': {description: OIDC / SPIFFE missing or X-Scope-OrgID mismatch}
        '403': {description: Cedar policy denied}
        '429': {description: Rate limit exceeded}

  /v1/validate-output:
    post:
      summary: Validate a candidate provider output
      operationId: validateOutput
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InvocationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidateOutputRequest'}
      responses:
        '200':
          description: Validation verdict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Validation'}

  /v1/enforce-autonomy:
    post:
      summary: Enforce effective autonomy ceiling per ADR-0022
      operationId: enforceAutonomy
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnforceAutonomyRequest'}
      responses:
        '200':
          description: Autonomy decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutonomyDecision'}

  /v1/decisions/{decision_id}:
    get:
      summary: Decision detail (GDPR Art. 22 + EU AI Act Art. 13 transparency)
      operationId: getDecisionDetail
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: decision_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Decision detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionDetail'}
        '404':
          description: Decision not found or beyond retention

  /v1/false-positive-budget:
    get:
      summary: Read tenant's FP escalation budget
      operationId: getFalsePositiveBudget
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      responses:
        '200':
          description: Budget state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FalsePositiveBudget'}

  /v1/decisions/{decision_id}/mark-false-positive:
    post:
      summary: Tenant marks a block as false-positive (consumes FP budget)
      operationId: markFalsePositive
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: decision_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining_budget: {type: integer}
        '429': {description: Budget exhausted}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (classifier serving reachable; cedar bundle loaded; postgres reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
