openapi: 3.2.0
info:
  title: oya-intelligence-supervisor
  version: 1.0.0
  summary: REST API for the foundry-supervisor control plane — capability admit/deploy/rollback, fleet query, kill-switch engage/disengage, autonomy entitlement query
  description: |
    Tenant-facing + operator-facing REST surface for the Foundry control plane.
    All endpoints require OIDC + Cedar policy authorization (per `microservices/intelligence/policy/*.cedar`)
    and are tenant-scoped via the X-Scope-OrgID header convention.

    Authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT carries the
    principal's tenant_id claim. The X-Scope-OrgID header MUST match the claim;
    mismatch returns 401.

    Authorization: Cedar default-deny; per-tenant scope enforced for tenant operators;
    auditor + CI + public-read scopes handled by separate Cedar fragments.

    Two-person rule: fleet-wide kill-switch engage requires two distinct
    X-Signature-Bundle headers (one per signer); single-signer fleet-wide engage
    returns 403.
  contact:
    name: axis-foundry-control-plane
    url: https://oyatie.com/teams/axis-foundry-control-plane
  license:
    name: Internal
servers:
  - url: https://foundry-supervisor-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant_[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/supervisor-isolation.md`
    Tenant:
      in: path
      name: tenant
      required: true
      schema:
        type: string
        pattern: '^tenant_[a-f0-9]{16}$'
    CapabilityId:
      in: path
      name: capability_id
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
    AgentId:
      in: path
      name: agent_id
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      in: path
      name: deployment_id
      required: true
      schema:
        type: string
        format: ulid
  schemas:
    CapabilityDefinition:
      type: object
      required: [id, version, tenant, autonomy_level, cost_budget_per_invocation, runtime, schema]
      properties:
        id: {type: string}
        version: {type: string, example: "1.0.0"}
        tenant: {type: string}
        autonomy_level: {type: string, enum: [T0, T1, T2, T3]}
        cost_budget_per_invocation: {type: number}
        runtime:
          type: object
          properties:
            provider: {type: string, enum: [anthropic, openai, gemini, vertex, bedrock]}
            model: {type: string}
        schema: {type: object}
        high_risk_domain:
          type: string
          enum: [none, employment, law-enforcement, migration, justice, biometric, critical-infrastructure, education, essential-services]
          description: high-risk sub-domain when applicable
    AgentDeployment:
      type: object
      required: [deployment_id, capability_id, current_version, rollout_phase, verdict, tenant]
      properties:
        deployment_id: {type: string, format: ulid}
        capability_id: {type: string}
        tenant: {type: string}
        current_version: {type: string}
        prior_version: {type: string, nullable: true}
        rollout_phase: {type: string, enum: [admitted, canary-1pct, canary-10pct, canary-50pct, rolled-out, rolled-back, held]}
        verdict: {type: string, enum: [pending, eligible, held, rejected, rollback]}
        advanced_at: {type: string, format: date-time}
    FleetState:
      type: object
      required: [tenant, agent_count, healthy_count, draining_count, capabilities]
      properties:
        tenant: {type: string}
        agent_count: {type: integer}
        healthy_count: {type: integer}
        draining_count: {type: integer}
        capabilities:
          type: array
          items:
            type: object
            properties:
              capability_id: {type: string}
              current_version: {type: string}
              agent_count: {type: integer}
    KillSwitch:
      type: object
      required: [scope, target, engaged, reason]
      properties:
        scope: {type: string, enum: [fleet, tenant, capability, agent]}
        target: {type: string}
        engaged: {type: boolean}
        reason:
          type: string
          enum: [cross_tenant_leak, runaway_cost, safety_breach, breach_response, compliance_demand, autonomy_violation, guardrail_violation, fast_burn_breach, manual_override, post_mortem_remediation]
          nullable: true
        engaged_at: {type: string, format: date-time, nullable: true}
        disengaged_at: {type: string, format: date-time, nullable: true}
        engaged_by: {type: string, nullable: true}
        signatures:
          type: array
          items: {type: string}
          description: Ed25519 signatures from authorising principals (2 for fleet-wide; 1 otherwise)
    AutonomyEntitlement:
      type: object
      required: [tenant, capability, tier, granted_by, expires_at]
      properties:
        tenant: {type: string}
        capability: {type: string, nullable: true, description: "null = applies to all tenant capabilities"}
        tier: {type: string, enum: [T0, T1, T2, T3]}
        granted_by: {type: string, description: "DPO + ops-security signatures"}
        granted_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /tenants/{tenant}/capabilities:
    get:
      summary: List capabilities deployed for a tenant
      operationId: listCapabilities
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CapabilityDefinition'}
        '401': {description: OIDC missing or X-Scope-OrgID mismatch}
        '403': {description: Cedar policy denied}

  /tenants/{tenant}/capabilities/{capability_id}:
    get:
      summary: Read one capability definition (current version)
      operationId: getCapability
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/CapabilityId'
      responses:
        '200':
          description: Capability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityDefinition'}
        '404': {description: Not found}

    post:
      summary: Admit a new capability version (initiate canary rollout)
      operationId: admitCapability
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/CapabilityId'
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {$ref: '#/components/schemas/CapabilityDefinition'}
      responses:
        '202':
          description: Admitted; canary rollout initiated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDeployment'}
        '422': {description: Schema or autonomy-ceiling violation}

  /tenants/{tenant}/capabilities/{capability_id}/deployments:
    get:
      summary: List deployments for a capability
      operationId: listDeployments
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/CapabilityId'
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentDeployment'}

  /tenants/{tenant}/deployments/{deployment_id}/rollback:
    post:
      summary: Rollback a deployment to a prior version
      operationId: rollbackDeployment
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/DeploymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, target_version]
              properties:
                reason: {type: string, enum: [fast_burn_breach, slow_burn_breach, manual_override, eval_regression, guardrail_violation, post_mortem_remediation]}
                target_version: {type: string}
      responses:
        '202':
          description: Rollback initiated
        '403': {description: Cedar denied}

  /tenants/{tenant}/fleet-state:
    get:
      summary: Read tenant's current fleet state
      operationId: getFleetState
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Fleet state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FleetState'}

  /tenants/{tenant}/drain:
    post:
      summary: Drain tenant's fleet (stop new invocations; complete in-flight)
      operationId: drainFleet
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, grace_period_seconds]
              properties:
                reason: {type: string}
                grace_period_seconds: {type: integer, minimum: 0, maximum: 3600}
      responses:
        '202': {description: Drain initiated}

  /kill-switch:
    post:
      summary: Engage kill-switch (per-scope; fleet requires 2 signatures)
      operationId: engageKillSwitch
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: header
          name: X-Signature-Bundle
          required: true
          description: Comma-separated OpenBao JIT signature(s). Fleet scope requires 2.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, target, reason]
              properties:
                scope: {type: string, enum: [fleet, tenant, capability, agent]}
                target: {type: string}
                reason: {type: string, enum: [cross_tenant_leak, runaway_cost, safety_breach, breach_response, compliance_demand, autonomy_violation, guardrail_violation, fast_burn_breach, manual_override, post_mortem_remediation]}
      responses:
        '202':
          description: Engaged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '403': {description: Cedar denied OR insufficient signatures}

    delete:
      summary: Disengage kill-switch
      operationId: disengageKillSwitch
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: header
          name: X-Signature-Bundle
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, target, reason]
              properties:
                scope: {type: string, enum: [fleet, tenant, capability, agent]}
                target: {type: string}
                reason: {type: string, example: "cause-cleared"}
      responses:
        '202': {description: Disengaged}

  /kill-switch/state:
    get:
      summary: Read current kill-switch state for scopes the principal can read
      operationId: getKillSwitchState
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: scope
          schema: {type: string, enum: [fleet, tenant, capability, agent]}
        - in: query
          name: target
          schema: {type: string}
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/KillSwitch'}

  /tenants/{tenant}/autonomy-entitlements:
    get:
      summary: List autonomy entitlements for a tenant (read-only; mutation is OpenBao-only)
      operationId: listAutonomyEntitlements
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AutonomyEntitlement'}

  /autonomy-precondition:
    post:
      summary: Per-invocation precondition check (called by foundry-runtime; SPIFFE-restricted)
      operationId: evaluateAutonomyPrecondition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, capability, requested_autonomy_level]
              properties:
                tenant: {type: string}
                capability: {type: string}
                requested_autonomy_level: {type: string, enum: [T0, T1, T2, T3]}
                request_id: {type: string}
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: {type: string, enum: [permit, deny]}
                  reason: {type: string}
                  cedar_evaluation_ms: {type: number}
        '403': {description: Not foundry-runtime SPIFFE identity}

  /validate-capability:
    post:
      summary: Schema-validate a capability YAML (public, anonymous; see public-read.cedar)
      operationId: validateCapabilitySchema
      security: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {$ref: '#/components/schemas/CapabilityDefinition'}
      responses:
        '200':
          description: Valid
        '422':
          description: Invalid; per-line errors returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        line: {type: integer}
                        column: {type: integer}
                        message: {type: string}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (Postgres + Valkey + Operator-lease healthy)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
