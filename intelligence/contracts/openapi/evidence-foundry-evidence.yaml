openapi: 3.2.0
info:
  title: oya-intelligence-evidence
  version: 1.0.0
  description: |
    Foundry-specific evidence frontend. Per-capability-invocation evidence packs
    aggregated from foundry-runtime + foundry-eval + foundry-guardrails +
    foundry-supervisor and emitted to the global audit-chain substrate for
    Merkle-sealing.

    Owners: axis-foundry-evidence.
    Cedar: policy/tenant-scope.cedar + policy/regulator-export-scope.cedar +
           policy/ci-scope.cedar + policy/public-read.cedar +
           policy/auditor-scope.cedar.
    SLOs: see PRD.md NFR table + slos/.
  contact:
    name: axis-foundry-evidence

servers:
  - url: https://foundry-evidence.{pack}.internal/v1
    variables:
      pack:
        default: pack-kr
        enum: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

security:
  - spiffe: []
  - tenantToken: []

paths:
  /invocations:
    post:
      operationId: recordInvocation
      summary: Record a Foundry capability invocation and enqueue evidence-pack assembly
      description: |
        Synchronous receipt; pack assembly + audit-chain seal is asynchronous.
        Per PRD.md FR-01; p99 ≤ 500 ms.
      security:
        - spiffe: [foundry-evidence-record]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvocationEnvelope'}
      responses:
        '202':
          description: Receipt issued; pack assembly in flight.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordInvocationReceipt'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/SubstrateDegraded'}

  /evidence-packs:
    get:
      operationId: queryEvidencePacks
      summary: Query evidence packs by tenant + optional filters
      description: Per PRD.md FR-05 + FR-07; p99 ≤ 100 ms; every read audit-emitted.
      security:
        - spiffe: [foundry-evidence-query]
        - tenantToken: [foundry-evidence-query]
      parameters:
        - {name: tenant_id, in: query, required: true, schema: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}}
        - {name: time_range_start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: time_range_end, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: invocation_id, in: query, schema: {type: string, format: ulid}}
        - {name: agent_id, in: query, schema: {type: string}}
        - {name: capability_id, in: query, schema: {type: string}}
        - {name: autonomy_level, in: query, schema: {type: string, enum: [T0, T1, T2, T3]}}
        - {name: framework_filter, in: query, schema: {type: string, enum: [eu-ai-act, hipaa, gdpr, kr-pipa, soc2, iso-27001]}}
        - {name: include_superseded, in: query, schema: {type: boolean, default: false}}
        - {name: include_partial, in: query, schema: {type: boolean, default: true}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
      responses:
        '200':
          description: Page of evidence packs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidencePackPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /evidence-packs/{pack_id}:
    get:
      operationId: getEvidencePack
      summary: Get one evidence pack by id (metadata; plaintext gated separately)
      security:
        - spiffe: [foundry-evidence-query]
        - tenantToken: [foundry-evidence-query]
      parameters:
        - {name: pack_id, in: path, required: true, schema: {type: string, format: ulid}}
        - {name: include_plaintext, in: query, schema: {type: boolean, default: false}, description: 'plaintext is Cedar-gated on sensitive_data_entitlements'}
      responses:
        '200':
          content: {application/json: {schema: {$ref: '#/components/schemas/EvidencePack'}}}
          description: OK.
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /regulator-exports:
    post:
      operationId: requestRegulatorExport
      summary: Request a framework-filtered, signed evidence-pack bundle
      description: |
        Per PRD.md FR-06. 2-person rule enforced via Cedar
        policy/regulator-export-scope.cedar. Asynchronous; bundle assembly
        p99 ≤ 30 s per 10k packs.
      security:
        - spiffe: [foundry-evidence-regulator-export]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegulatorExportRequest'}
      responses:
        '202':
          content: {application/json: {schema: {$ref: '#/components/schemas/RegulatorExportReceipt'}}}
          description: Accepted; bundle in flight.
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /regulator-exports/{bundle_id}:
    get:
      operationId: getRegulatorExportStatus
      summary: Retrieve regulator-export status + bundle metadata
      security:
        - spiffe: [foundry-evidence-regulator-export, foundry-evidence-read-regulator-export-metadata]
      parameters:
        - {name: bundle_id, in: path, required: true, schema: {type: string, format: ulid}}
      responses:
        '200':
          content: {application/json: {schema: {$ref: '#/components/schemas/RegulatorExportBundleStatus'}}}
          description: OK.
        '404': {$ref: '#/components/responses/NotFound'}

  /transparency/schema-versions:
    get:
      operationId: getSchemaVersions
      summary: Public-read schema-version registry (no auth)
      description: Per policy/public-read.cedar; exposes no tenant data.
      responses:
        '200':
          content: {application/json: {schema: {$ref: '#/components/schemas/SchemaVersionRegistry'}}}
          description: OK.

  /transparency/claim-matrix:
    get:
      operationId: getClaimMatrix
      summary: Public-read claim-matrix per ADR-0133
      description: Honest claims + declared gaps; CI-asserted.
      responses:
        '200':
          content: {application/json: {schema: {$ref: '#/components/schemas/ClaimMatrix'}}}
          description: OK.

  /transparency/framework-profiles:
    get:
      operationId: getFrameworkProfiles
      summary: Public-read of supported regulator-export framework profiles
      responses:
        '200':
          content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkProfiles'}}}
          description: OK.

  /health/ready:
    get:
      operationId: readiness
      summary: Readiness probe
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}

components:
  securitySchemes:
    spiffe:
      type: mutualTLS
      description: SPIFFE-bound mTLS; principal SPIFFE ID extracted from client cert.
    tenantToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived tenant operator JWT issued by tenancy µservice.

  schemas:
    InvocationEnvelope:
      type: object
      required:
        [invocation_id, attempt_no, tenant_id, source_microservice, agent_id,
         capability_id, autonomy_level_decision, invocation_ts, payload_data_class,
         prompt_payload_sha, output_payload_sha, pack, idempotency_key, schema_version]
      properties:
        schema_version: {type: string, enum: ['1.0']}
        invocation_id: {type: string, format: ulid}
        attempt_no: {type: integer, minimum: 1}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        source_microservice: {type: string, enum: [foundry-runtime, foundry-guardrails, foundry-supervisor, foundry-eval]}
        agent_id: {type: string}
        capability_id: {type: string}
        autonomy_level_decision: {type: string, enum: [T0, T1, T2, T3]}
        invocation_ts: {type: string, format: date-time}
        pack: {type: string}
        idempotency_key: {type: string, format: ulid}
        payload_data_class:
          type: string
          enum: [INTERNAL_ONLY, BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PII_QUASI_IDENTIFIER, SENSITIVE_PIPA_ART23, PHI, AUDIT, SECRET]
        prompt_payload_sha: {type: string, description: 'sha256 of canonical prompt blob; blob in audit-chain WORM'}
        output_payload_sha: {type: string, description: 'sha256 of canonical output blob; blob in audit-chain WORM'}
        model_version: {type: string, nullable: true}
        provider: {type: string, nullable: true}
        request_token_count: {type: integer, nullable: true}
        response_token_count: {type: integer, nullable: true}
        subject_hash: {type: string, nullable: true}
        framework_tags:
          type: array
          items: {type: string, enum: [eu-ai-act, hipaa, gdpr, kr-pipa, soc2, iso-27001]}

    RecordInvocationReceipt:
      type: object
      required: [pack_id, accepted_at, sealed, audit_chain_emit_pending]
      properties:
        pack_id: {type: string, format: ulid}
        accepted_at: {type: string, format: date-time}
        sealed: {type: boolean, description: false at receipt; true once audit-chain bridge has emitted}
        audit_chain_emit_pending: {type: boolean}
        audit_event_id: {type: string, format: ulid, nullable: true, description: present once substrate has issued event_id}

    EvidencePack:
      type: object
      required:
        [pack_id, tenant_id, invocation_id, attempt_no, source_microservice,
         autonomy_level_decision, invocation_ts, payload_data_class,
         prompt_payload_sha, output_payload_sha, sealed, audit_chain_emit_pending,
         schema_version, partial]
      properties:
        pack_id: {type: string, format: ulid}
        schema_version: {type: string}
        tenant_id: {type: string}
        invocation_id: {type: string, format: ulid}
        attempt_no: {type: integer}
        source_microservice: {type: string}
        agent_id: {type: string}
        capability_id: {type: string}
        autonomy_level_decision: {type: string, enum: [T0, T1, T2, T3]}
        invocation_ts: {type: string, format: date-time}
        sealed_at: {type: string, format: date-time, nullable: true}
        pack: {type: string}
        payload_data_class: {type: string}
        prompt_payload_sha: {type: string}
        output_payload_sha: {type: string}
        eval_verdict_at_invocation:
          type: object
          nullable: true
          properties:
            eval_set_id: {type: string}
            verdict: {type: string, enum: [pass, fail, advisory]}
            verdict_recorded_at: {type: string, format: date-time}
        guardrail_decisions:
          type: array
          items:
            type: object
            properties:
              guardrail_id: {type: string}
              guardrail_version: {type: string}
              decision: {type: string, enum: [allow, block, escalate]}
              rationale_hash: {type: string}
        autonomy_level_rationale_hash: {type: string, nullable: true}
        audit_event_id: {type: string, format: ulid, nullable: true}
        merkle_inclusion_proof_hash: {type: string, nullable: true}
        sealed: {type: boolean}
        audit_chain_emit_pending: {type: boolean}
        partial: {type: boolean, description: true if assembly window expired before all signals arrived}
        missing_sources: {type: array, items: {type: string}, description: present when partial=true}
        supersedes_pack_ref: {type: string, format: ulid, nullable: true}
        superseded_by_pack_ref: {type: string, format: ulid, nullable: true}
        framework_tags: {type: array, items: {type: string}}
        subject_hash: {type: string, nullable: true}
        subject_restricted: {type: boolean, nullable: true}
        plaintext:
          type: object
          nullable: true
          description: present only when include_plaintext=true AND Cedar permits
          properties:
            prompt: {type: string}
            output: {type: string}

    EvidencePackPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EvidencePack'}
        next_cursor: {type: string, nullable: true}

    RegulatorExportRequest:
      type: object
      required:
        [tenant_id, framework, time_range_start, time_range_end,
         requester_principal, approver_principal, approver_role,
         receiving_bucket_scc_id, dpa_export_plan_id, source_pack]
      properties:
        tenant_id: {type: string}
        framework: {type: string, enum: [eu-ai-act, hipaa, gdpr, kr-pipa, soc2, iso-27001]}
        time_range_start: {type: string, format: date-time}
        time_range_end: {type: string, format: date-time}
        requester_principal: {type: string}
        approver_principal: {type: string}
        approver_role: {type: string, enum: [RegulatorExporter]}
        receiving_bucket_scc_id: {type: string}
        dpa_export_plan_id: {type: string}
        source_pack: {type: string}
        receiving_pack: {type: string, nullable: true}
        cross_pack_scc_attestation_id: {type: string, nullable: true}
        engagement_id: {type: string, nullable: true}
        supersedes_bundle_id: {type: string, format: ulid, nullable: true, description: present when this is a reissue per runbooks/regulator-export-reissue.md}

    RegulatorExportReceipt:
      type: object
      required: [bundle_id, accepted_at, status]
      properties:
        bundle_id: {type: string, format: ulid}
        accepted_at: {type: string, format: date-time}
        status: {type: string, enum: [accepted, assembling]}

    RegulatorExportBundleStatus:
      type: object
      required: [bundle_id, status, framework, tenant_id]
      properties:
        bundle_id: {type: string, format: ulid}
        status: {type: string, enum: [accepted, assembling, sealed, delivered, failed, withdrawn]}
        framework: {type: string}
        tenant_id: {type: string}
        time_range_start: {type: string, format: date-time}
        time_range_end: {type: string, format: date-time}
        pack_count: {type: integer}
        bundle_signature: {type: string, nullable: true}
        bundle_merkle_root: {type: string, nullable: true}
        delivery_receipts:
          type: array
          items:
            type: object
            properties:
              channel: {type: string}
              delivered_at: {type: string, format: date-time}
              acknowledged_at: {type: string, format: date-time, nullable: true}

    SchemaVersionRegistry:
      type: object
      properties:
        invocation_envelope:
          type: array
          items:
            type: object
            properties:
              version: {type: string}
              status: {type: string, enum: [current, deprecated, sunset]}
              sunset_at: {type: string, format: date-time, nullable: true}
        evidence_pack:
          type: array
          items:
            type: object
            properties:
              version: {type: string}
              status: {type: string}
              sunset_at: {type: string, format: date-time, nullable: true}

    ClaimMatrix:
      type: object
      description: ADR-0133 claim matrix; CI-asserted; honest gaps declared.
      properties:
        claims:
          type: array
          items:
            type: object
            properties:
              claim_id: {type: string}
              dimension: {type: string}
              claim_text: {type: string}
              status: {type: string, enum: [asserted, aspirational, declared-gap]}
              ci_lane: {type: string, nullable: true}
              evidence_ref: {type: string, nullable: true}

    FrameworkProfiles:
      type: object
      properties:
        profiles:
          type: array
          items:
            type: object
            properties:
              framework: {type: string}
              required_fields: {type: array, items: {type: string}}
              optional_fields: {type: array, items: {type: string}}
              citation_anchors: {type: array, items: {type: string}}

    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        detail: {type: object, nullable: true}

  responses:
    ValidationError:
      description: Validation error.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    Unauthorized:
      description: Missing or invalid SPIFFE/tenant credentials.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    Forbidden:
      description: Cedar refusal.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    RateLimited:
      description: Per-tenant or per-source rate limit hit.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    SubstrateDegraded:
      description: audit-chain substrate degraded; receipt may carry sealed=false.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
    NotFound:
      description: Not found.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
