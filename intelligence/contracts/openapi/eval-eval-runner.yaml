openapi: 3.2.0
info:
  title: foundry-eval Eval Runner API
  version: 1.0.0
  description: |
    REST surface for the foundry-eval eval-runner BC. Exposes publish-gate verdict,
    eval-run history, ad-hoc eval-run dispatch, and EU AI Act §15/§17 evidence
    retrieval. Per ADR-0024 (eval harness) + ADR-0131 (per-microservice flat
    layout) + ADR-0140 (retired per ADR-0145) (Cedar policy).
  contact:
    name: axis-foundry
    email: axis-foundry@oyatie.internal
  license:
    name: oyatie-internal
servers:
  - url: https://foundry-eval.{pack}.oyatie.com/v1
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
security:
  - oidc: ['foundry-eval:read']
paths:
  /capabilities/{capability_id}/publish-gate:
    get:
      summary: Read the latest publish-gate verdict for a capability
      operationId: getPublishGateVerdict
      tags: [publish-gate]
      parameters:
        - in: path
          name: capability_id
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]*$'
      responses:
        '200':
          description: Verdict found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishGateVerdict'
        '403':
          description: Forbidden (Cedar deny)
        '404':
          description: No eval-set registered for capability
  /capabilities/{capability_id}/eval-runs:
    get:
      summary: List recent eval-runs for a capability
      operationId: listEvalRuns
      tags: [eval-runs]
      parameters:
        - in: path
          name: capability_id
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 500
        - in: query
          name: provider_route
          schema:
            type: string
      responses:
        '200':
          description: Eval-run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvalRun'
  /capabilities/{capability_id}/eval-runs:trigger:
    post:
      summary: Trigger an ad-hoc eval-run
      operationId: triggerEvalRun
      tags: [eval-runs]
      security:
        - oidc: ['foundry-eval:trigger']
      parameters:
        - in: path
          name: capability_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunTriggerRequest'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunReceipt'
        '429':
          description: Rate-limited (per-capability-owner budget exhausted)
  /capabilities/{capability_id}/eu-ai-act/section-15:
    get:
      summary: Retrieve EU AI Act §15 accuracy + robustness evidence
      operationId: getEuAiActSection15Evidence
      tags: [compliance]
      parameters:
        - in: path
          name: capability_id
          required: true
          schema:
            type: string
        - in: query
          name: time_window_start
          schema:
            type: string
            format: date-time
        - in: query
          name: time_window_end
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Section 15 evidence payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuAiActSection15Evidence'
  /capabilities/{capability_id}/eu-ai-act/section-17:
    get:
      summary: Retrieve EU AI Act §17 logging payload
      operationId: getEuAiActSection17Log
      tags: [compliance]
      parameters:
        - in: path
          name: capability_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Section 17 logging
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuAiActSection17Log'
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://oidc.oyatie.com/.well-known/openid-configuration
  schemas:
    PublishGateVerdict:
      type: object
      required: [capability_id, version, verdict, evaluated_at, evaluator_version, signature]
      properties:
        capability_id:
          type: string
        version:
          type: string
        verdict:
          type: string
          enum: [eligible, held_eval_set_missing, held_adversarial_failure, held_linguistic_minima, held_stale_run, rejected]
        adversarial_cohort_pass:
          type: boolean
        linguistic_cohort_pass:
          type: boolean
        latest_run_pass_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
        latest_run_at:
          type: string
          format: date-time
        evaluated_at:
          type: string
          format: date-time
        evaluator_version:
          type: string
        signature:
          type: string
          description: Ed25519 signature by eval-runner-worker SPIFFE identity
    EvalRun:
      type: object
      required: [run_id, capability_id, version, route, started_at, completed_at, aggregate, passed]
      properties:
        run_id:
          type: string
          format: uuid
        capability_id:
          type: string
        version:
          type: string
        route:
          $ref: '#/components/schemas/ProviderRoute'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        aggregate:
          $ref: '#/components/schemas/EvalAggregate'
        passed:
          type: boolean
        eu_ai_act_section_15_accuracy_metric:
          type: number
        eu_ai_act_section_17_logging_payload_ref:
          type: string
    EvalRunTriggerRequest:
      type: object
      required: [version, route, reason]
      properties:
        version:
          type: string
        route:
          $ref: '#/components/schemas/ProviderRoute'
        reason:
          type: string
          minLength: 10
          maxLength: 1000
        cohorts:
          type: array
          items:
            type: string
            enum: [happy-path, adversarial-prompt-injection, adversarial-data-class, adversarial-autonomy-bypass, adversarial-tool-exfil, linguistic-kr, linguistic-jp, linguistic-en, deterministic-seed, replay]
    EvalRunReceipt:
      type: object
      required: [run_id, queued_at]
      properties:
        run_id:
          type: string
          format: uuid
        queued_at:
          type: string
          format: date-time
        estimated_completion_at:
          type: string
          format: date-time
    ProviderRoute:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
        variant:
          type: string
          description: e.g. "in-house-v3", "anthropic-claude-4.7-opus"
    EvalAggregate:
      type: object
      required: [pass_rate, total_cases, per_cohort]
      properties:
        pass_rate:
          type: number
          format: float
        total_cases:
          type: integer
        per_cohort:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CohortAggregate'
    CohortAggregate:
      type: object
      required: [name, pass_rate, cases]
      properties:
        name:
          type: string
        pass_rate:
          type: number
          format: float
        cases:
          type: integer
        p95_score:
          type: number
    EuAiActSection15Evidence:
      type: object
      required: [capability_id, version, accuracy_metric, robustness_metric, cybersecurity_metric, generated_at]
      properties:
        capability_id:
          type: string
        version:
          type: string
        accuracy_metric:
          type: number
          format: float
        robustness_metric:
          type: number
          format: float
          description: derived from adversarial cohort pass rate
        cybersecurity_metric:
          type: number
          format: float
          description: derived from tool-exfil adversarial cohort + sandbox isolation evidence
        generated_at:
          type: string
          format: date-time
    EuAiActSection17Log:
      type: object
      required: [capability_id, time_window_start, time_window_end, entries]
      properties:
        capability_id:
          type: string
        time_window_start:
          type: string
          format: date-time
        time_window_end:
          type: string
          format: date-time
        entries:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
              event_type:
                type: string
              timestamp:
                type: string
                format: date-time
              signature:
                type: string
