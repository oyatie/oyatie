openapi: 3.2.0
info:
  title: oya-intelligence
  version: 1.0.0
  summary: Two-layer AI Substrate REST API — dispatch, providers, guardrails, eval, attribution
  description: |
    Network-opt-in REST surface for the intelligence µservice per ADR-0255 and the ADR-0255
    amendment (library-first network-opt-in clarification). The canonical dispatch path is
    in-process via the SDK (`oya-intelligence-dispatch-sdk-{rs,ts,py,swift,kotlin,dart,go}`);
    this REST surface is the fallback for cross-language callers and the brand-ux-surface running
    in a browser.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT carries
    the principal's tenant_id + audience-claim. Cedar `dispatch-authorization.cedar` enforces
    audience binding.

    Cross-cutting tenancy: `X-Tenant-Id` header MUST match the JWT's tenant_id claim; mismatch
    returns 401.
  contact:
    name: axis-intelligence
    url: https://oyatie.com/teams/axis-intelligence
  license:
    name: Internal
servers:
  - url: https://intelligence-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, us-fed, jp, sg, au, in, br, ae, ksa, cn, uk]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: intelligence
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XTenantId:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per policy/tenant-isolation.md
    XAudienceTag:
      in: header
      name: X-Audience-Tag
      required: true
      schema:
        type: string
        enum: [consumer, developer, internal-foundry]
  schemas:
    DispatchEnvelope:
      type: object
      required: [envelope_version, tenant_id, audience_tag, purpose, modality, prompt, config]
      properties:
        envelope_version: {type: string, enum: ["1.0"]}
        envelope_id: {type: string, description: ULID per call}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        audience_tag: {type: string, enum: [consumer, developer, internal-foundry]}
        purpose: {type: string}
        modality: {type: string, enum: [text, image, audio, video, multi]}
        provider_hint: {type: string, enum: [auto, anthropic, openai, google, vertex, bedrock, azure-openai, cohere, mistral, vllm, sglang, tensorrt-llm, apple-foundation, openrouter, together, groq, huggingface-inference, replicate]}
        model_hint: {type: string, nullable: true}
        prompt:
          type: object
          required: [parts]
          properties:
            parts:
              type: array
              items: {$ref: '#/components/schemas/PromptPart'}
        tools:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ToolDef'}
        config:
          $ref: '#/components/schemas/DispatchConfig'
        secret_reference:
          $ref: '#/components/schemas/SecretReference'
        pack: {type: string, nullable: true}
        consent_grant_id: {type: string, nullable: true}
        rfia_id: {type: string, nullable: true, description: EU AI Act Art. 27 FRIA reference for Annex III dispatch}
        annex_iii_categories:
          type: array
          nullable: true
          items: {type: string}
    PromptPart:
      type: object
      required: [role, kind]
      properties:
        role: {type: string, enum: [system, user, assistant, tool]}
        kind: {type: string, enum: [text, image_url, image_base64, audio_blob, video_blob, tool_response]}
        content: {type: string, nullable: true}
        content_b64: {type: string, nullable: true, format: byte}
        content_ref: {type: string, nullable: true, description: optional caller-resolvable reference}
        untrusted_content: {type: boolean, default: false, description: caller-flag for untrusted-content delimiter handling}
    ToolDef:
      type: object
      required: [name, description, schema]
      properties:
        name: {type: string}
        description: {type: string}
        schema: {type: object, description: JSON Schema for tool input}
    DispatchConfig:
      type: object
      properties:
        temperature: {type: number, nullable: true, minimum: 0, maximum: 2}
        top_p: {type: number, nullable: true, minimum: 0, maximum: 1}
        max_tokens: {type: integer, nullable: true}
        stop:
          type: array
          nullable: true
          items: {type: string}
        stream: {type: boolean, default: false}
        json_mode: {type: boolean, default: false}
        seed: {type: integer, nullable: true}
    SecretReference:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [openbao_path, platform_default]}
        value: {type: string, nullable: true, description: "openbao_path: ${openbao:secret/<tenant>/<provider>}"}
        bound_tenant: {type: string, nullable: true}
    DispatchOutcome:
      type: object
      required: [envelope_id, status]
      properties:
        envelope_id: {type: string}
        status: {type: string, enum: [streaming, completed, refused, failed]}
        refusal:
          $ref: '#/components/schemas/RefusalDecision'
        output:
          $ref: '#/components/schemas/DispatchOutput'
        routing_decision:
          $ref: '#/components/schemas/RoutingDecision'
        audit_tap_record_id: {type: string}
        cost:
          $ref: '#/components/schemas/CostRecord'
        error:
          $ref: '#/components/schemas/DispatchError'
    RefusalDecision:
      type: object
      required: [decision_id, reason]
      properties:
        decision_id: {type: string}
        reason:
          type: string
          enum:
            - csam
            - violence
            - self_harm
            - extremism
            - coppa
            - eu_ai_act_annex_iii_cat_1
            - eu_ai_act_annex_iii_cat_2
            - eu_ai_act_annex_iii_cat_3
            - eu_ai_act_annex_iii_cat_4
            - eu_ai_act_annex_iii_cat_5
            - eu_ai_act_annex_iii_cat_6
            - eu_ai_act_annex_iii_cat_7
            - eu_ai_act_annex_iii_cat_8
            - pci_scope_refused
            - data_residency_violation
            - cost_cap_exceeded
            - credential_unavailable
            - provider_saturated
            - consent_missing
            - modality_budget_exceeded
            - phi_provider_not_baa
            - gdpr_art9_lawful_basis_missing
            - pipa_art23_consent_missing
            - prompt_injection_detected
            - rfia_required
        pack_overlay_applied: {type: string, nullable: true}
        copy_localized: {type: string, description: pack-localized refusal copy for brand-ux-surface}
    DispatchOutput:
      type: object
      properties:
        parts:
          type: array
          items: {$ref: '#/components/schemas/PromptPart'}
        citations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/Citation'}
        eval_score: {type: number, nullable: true, minimum: 0, maximum: 1}
    Citation:
      type: object
      required: [source_uri, span]
      properties:
        source_uri: {type: string}
        span:
          type: object
          properties:
            start: {type: integer}
            end: {type: integer}
        confidence: {type: number, minimum: 0, maximum: 1}
        attribution_kind: {type: string, enum: [direct_quote, paraphrase, factual_claim]}
    RoutingDecision:
      type: object
      required: [provider, model]
      properties:
        provider: {type: string}
        model: {type: string}
        region: {type: string}
        latency_first_token_ms: {type: integer}
        streaming_tokens_per_sec: {type: number}
        provider_credential_kind: {type: string, enum: [tenant_byok, platform_default]}
    CostRecord:
      type: object
      properties:
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        vision_tokens: {type: integer, nullable: true}
        audio_seconds: {type: integer, nullable: true}
        video_seconds: {type: integer, nullable: true}
        input_cost_usd: {type: number}
        output_cost_usd: {type: number}
        modality_cost_usd: {type: number, nullable: true}
        total_cost_usd: {type: number}
        cost_owner: {type: string, enum: [tenant_byok, platform_default]}
    DispatchError:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
        provider_error: {type: object, nullable: true}
        retry_after_seconds: {type: integer, nullable: true}
    EvalRecord:
      type: object
      properties:
        eval_id: {type: string}
        envelope_id: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        method: {type: string, enum: [canonicalen_set_match, judge_model_score, classifier_pass]}
        evaluated_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /dispatch:
    post:
      summary: Issue a dispatch (single-shot or streaming)
      operationId: issueDispatch
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XAudienceTag'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchEnvelope'}
      responses:
        '200':
          description: Dispatch completed (non-streaming)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchOutcome'}
        '202':
          description: Dispatch streaming; subscribe via SSE on the streaming-endpoint
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream of DispatchOutcome chunks
        '400':
          description: Malformed envelope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: OIDC missing or X-Tenant-Id mismatch
        '403':
          description: Cedar policy denied (dispatch-authorization, refusal-baseline, eu-ai-act-high-risk, abuse-defence)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchOutcome'}
        '429':
          description: Provider rate-limit saturated OR tenant quota exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /dispatch/{envelope_id}:
    get:
      summary: Read dispatch outcome (for previously-issued streaming dispatch)
      operationId: getDispatchOutcome
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: path
          name: envelope_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchOutcome'}

  /dispatch/stream/{envelope_id}:
    get:
      summary: Subscribe to streaming dispatch via SSE
      operationId: streamDispatch
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: path
          name: envelope_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}

  /providers:
    get:
      summary: List currently-routable providers for the principal's pack
      operationId: listProviders
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: {type: string}
                    model: {type: string}
                    modalities:
                      type: array
                      items: {type: string}
                    region: {type: string}
                    credential_kind: {type: string, enum: [tenant_byok, platform_default, both]}
                    available: {type: boolean}

  /providers/{provider}/health:
    get:
      summary: Provider adapter health probe
      operationId: getProviderHealth
      parameters:
        - in: path
          name: provider
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: {type: string}
                  status: {type: string, enum: [up, degraded, down, circuit-broken]}
                  latency_p99_ms: {type: integer}
                  budget_remaining_pct: {type: number}

  /eval/records/{envelope_id}:
    get:
      summary: Read eval record for a dispatch (if eval ran)
      operationId: getEvalRecord
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: path
          name: envelope_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Eval record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvalRecord'}
        '404':
          description: No eval record (sampled out or not applicable)

  /audit-tap/{envelope_id}:
    get:
      summary: Read the audit-tap record id for a dispatch (forensic; auditor-scope-gated)
      operationId: getAuditTapRecord
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: path
          name: envelope_id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Record reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_tap_record_id: {type: string}
                  audit_chain_seal_id: {type: string}
                  emitted_at: {type: string, format: date-time}
                  signature: {type: string}

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (audit-chain reachable; credential-resolver healthy)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
