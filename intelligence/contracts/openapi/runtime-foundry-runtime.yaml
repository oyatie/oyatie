openapi: 3.2.0
info:
  title: oya-intelligence-runtime
  version: 1.0.0
  summary: REST API for the foundry-runtime µservice — capability invocation, session read, autonomy ceiling read, descriptor validation
  description: |
    Tenant-facing and operator-facing REST surface for the capability-executor + session-state +
    capability-registry-cache BCs. All endpoints require OIDC + Cedar policy authorization
    (per `microservices/intelligence/policy/*.cedar`) and are tenant-scoped via the
    X-Scope-OrgID header.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`. The JWT carries
    the principal's tenant_id claim. The X-Scope-OrgID header MUST match the claim; mismatch
    returns 401.
  contact:
    name: axis-foundry-runtime
    url: https://oyatie.com/teams/axis-foundry-runtime
  license:
    name: Internal
servers:
  - url: https://foundry-runtime-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
      description: hashed-tenant-id per `policy/runtime-isolation.md`
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 128
      description: client-supplied idempotency key; if a request with the same key arrives within 24h, the prior response is returned
    CapabilityId:
      in: path
      name: capability_id
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9:-]*$'
    InvocationId:
      in: path
      name: invocation_id
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Z]{26}$'  # ULID
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Z]{26}$'
  schemas:
    DispatchRequest:
      type: object
      required: [capability_id, input]
      properties:
        capability_id: {type: string, pattern: '^[a-z][a-z0-9:-]*$'}
        session_id: {type: string, nullable: true, description: optional; if omitted, runtime creates a new session}
        input:
          type: object
          description: capability-specific input payload
          additionalProperties: true
        autonomy_level_declared:
          type: integer
          minimum: 0
          maximum: 4
          description: per ADR-0022; runtime refuses dispatch above tenant ceiling
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 60
        metadata:
          type: object
          additionalProperties: {type: string}
    Invocation:
      type: object
      required: [invocation_id, capability_id, status, started_at]
      properties:
        invocation_id: {type: string}
        capability_id: {type: string}
        session_id: {type: string, nullable: true}
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        result:
          type: object
          additionalProperties: true
          nullable: true
        failure_reason:
          type: string
          enum: [provider_unreachable, guardrail_block, autonomy_violation, timeout, runtime_drain_lost, descriptor_invalid, internal_error]
          nullable: true
        autonomy_level_used: {type: integer, minimum: 0, maximum: 4}
        provider_invocation_count: {type: integer}
        guardrail_invocation_count: {type: integer}
        evaluator_version: {type: string}
    Session:
      type: object
      required: [session_id, tenant_id, opened_at, status]
      properties:
        session_id: {type: string}
        tenant_id: {type: string}
        opened_at: {type: string, format: date-time}
        last_active_at: {type: string, format: date-time}
        status:
          type: string
          enum: [active, evicted, terminated, soft_deleted]
        turn_count: {type: integer}
        scratchpad_size_bytes: {type: integer}
    AutonomyCeiling:
      type: object
      required: [tenant_id, ceiling, effective_at]
      properties:
        tenant_id: {type: string}
        ceiling: {type: integer, minimum: 0, maximum: 4}
        effective_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 from tenancy µservice}
    CapabilityDescriptor:
      type: object
      required: [capability_id, tenant_id, declared_autonomy_level, version, signature]
      properties:
        capability_id: {type: string}
        tenant_id: {type: string}
        declared_autonomy_level: {type: integer, minimum: 0, maximum: 4}
        version: {type: string}
        purpose_of_use: {type: string}
        risk_class:
          type: string
          enum: [minimal_risk, limited_risk, high_risk_auto_decision, prohibited]
        regulatory_packs_consumed:
          type: array
          items: {type: string}
        signature: {type: string, description: Ed25519 from foundry-supervisor}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /capabilities/{capability_id}/dispatch:
    post:
      summary: Dispatch a capability invocation
      operationId: dispatchCapability
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchRequest'}
      responses:
        '202':
          description: Invocation accepted; running asynchronously
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '200':
          description: Invocation completed synchronously (short-lived capability)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '401':
          description: OIDC missing or X-Scope-OrgID mismatch
        '403':
          description: Cedar policy denied OR autonomy ceiling exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Rate limit / capability concurrency limit exceeded
          headers:
            Retry-After:
              schema: {type: integer}
        '503':
          description: Sibling unreachable; retry advised

  /invocations/{invocation_id}:
    get:
      summary: Read invocation by ID
      operationId: getInvocation
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InvocationId'
      responses:
        '200':
          description: Invocation record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '404':
          description: Not found

  /invocations/{invocation_id}/cancel:
    post:
      summary: Cancel a running invocation
      operationId: cancelInvocation
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/InvocationId'
      responses:
        '202':
          description: Cancellation accepted; running invocation will reach terminal state ≤5s
        '409':
          description: Invocation already in terminal state
        '404':
          description: Not found

  /sessions/{session_id}:
    get:
      summary: Read session metadata + turn history
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}

  /autonomy-ceiling:
    get:
      summary: Read own tenant's autonomy tier ceiling
      operationId: getAutonomyCeiling
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      responses:
        '200':
          description: Ceiling
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutonomyCeiling'}

  /capabilities/{capability_id}:
    get:
      summary: Read capability descriptor (current version mirrored locally)
      operationId: getCapabilityDescriptor
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/CapabilityId'
      responses:
        '200':
          description: Descriptor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityDescriptor'}

  /validate-capability-descriptor:
    post:
      summary: Schema-validate a capability descriptor (public, anonymous; see public-read.cedar)
      operationId: validateCapabilityDescriptorSchema
      security: []
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {$ref: '#/components/schemas/CapabilityDescriptor'}
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
        '422':
          description: Invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        line: {type: integer}
                        column: {type: integer}
                        message: {type: string}

  /health:
    get:
      summary: Liveness probe (Kubernetes)
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness probe (cache reachable + Valkey reachable + sibling siblings reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
