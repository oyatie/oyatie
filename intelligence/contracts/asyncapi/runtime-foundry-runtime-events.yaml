asyncapi: 3.1.0
info:
  title: oya-intelligence-runtime — invocation lifecycle events
  version: 1.0.0
  summary: InvocationStarted, InvocationStepEmitted, InvocationCompleted, InvocationFailed, InvocationCancelled, AutonomyViolationDetected, SessionEvicted, RuntimePodDrained
  description: |
    Cross-µservice Workflow events emitted by `oya-intelligence-runtime-invocation-orchestrator-worker`
    and `oya-intelligence-runtime-runtime-pool-worker`. Per ADR-0025 + ADR-0131.

    Consumers:
    - `foundry-evidence` µservice (Ed25519 audit-chain seal per Bominal ADR-0028)
    - `observability` µservice (OTel ingestion + dashboards)
    - `workflow-engine` µservice (workflow-step continuation on InvocationCompleted)
    - `grafana-oncall` (incident paging on AutonomyViolationDetected + RuntimePodDrained anomaly)
  contact:
    name: axis-foundry-runtime

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.foundry-runtime.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus consumed by foundry-evidence + workflow-engine + observability.

channels:
  invocation-started:
    address: workflow-events/foundry-runtime.invocation.started
    messages:
      InvocationStartedMessage:
        $ref: '#/components/messages/InvocationStarted'
    description: A capability invocation has been accepted and is starting.

  invocation-step-emitted:
    address: workflow-events/foundry-runtime.invocation.step
    messages:
      InvocationStepEmittedMessage:
        $ref: '#/components/messages/InvocationStepEmitted'
    description: A per-step event within an invocation (provider call, guardrail call).

  invocation-completed:
    address: workflow-events/foundry-runtime.invocation.completed
    messages:
      InvocationCompletedMessage:
        $ref: '#/components/messages/InvocationCompleted'
    description: An invocation reached terminal success.

  invocation-failed:
    address: workflow-events/foundry-runtime.invocation.failed
    messages:
      InvocationFailedMessage:
        $ref: '#/components/messages/InvocationFailed'
    description: An invocation reached terminal failure.

  invocation-cancelled:
    address: workflow-events/foundry-runtime.invocation.cancelled
    messages:
      InvocationCancelledMessage:
        $ref: '#/components/messages/InvocationCancelled'
    description: An invocation was cancelled by tenant or supervisor or pod drain.

  autonomy-violation-detected:
    address: workflow-events/foundry-runtime.autonomy.violation
    messages:
      AutonomyViolationDetectedMessage:
        $ref: '#/components/messages/AutonomyViolationDetected'
    description: Capability dispatch refused above tenant autonomy ceiling (per ADR-0022).

  session-evicted:
    address: workflow-events/foundry-runtime.session.evicted
    messages:
      SessionEvictedMessage:
        $ref: '#/components/messages/SessionEvicted'
    description: Valkey evicted a session (LRU or TTL).

  runtime-pod-drained:
    address: workflow-events/foundry-runtime.runtime.pod.drained
    messages:
      RuntimePodDrainedMessage:
        $ref: '#/components/messages/RuntimePodDrained'
    description: A runtime pod was retired via drain primitive.

  capability-registry-updated:
    address: workflow-events/foundry.capability.registry.updated
    messages:
      CapabilityRegistryUpdatedMessage:
        $ref: '#/components/messages/CapabilityRegistryUpdated'
    description: A capability descriptor has been added or modified at foundry-supervisor (consumed by runtime cache).

  tenant-tier-ceiling-changed:
    address: workflow-events/tenancy.tenant.tier.ceiling.changed
    messages:
      TenantTierCeilingChangedMessage:
        $ref: '#/components/messages/TenantTierCeilingChanged'
    description: Tenant autonomy tier ceiling changed (consumed by runtime executor).

operations:
  emitInvocationStarted:
    action: send
    channel:
      $ref: '#/channels/invocation-started'
  emitInvocationStepEmitted:
    action: send
    channel:
      $ref: '#/channels/invocation-step-emitted'
  emitInvocationCompleted:
    action: send
    channel:
      $ref: '#/channels/invocation-completed'
  emitInvocationFailed:
    action: send
    channel:
      $ref: '#/channels/invocation-failed'
  emitInvocationCancelled:
    action: send
    channel:
      $ref: '#/channels/invocation-cancelled'
  emitAutonomyViolationDetected:
    action: send
    channel:
      $ref: '#/channels/autonomy-violation-detected'
  emitSessionEvicted:
    action: send
    channel:
      $ref: '#/channels/session-evicted'
  emitRuntimePodDrained:
    action: send
    channel:
      $ref: '#/channels/runtime-pod-drained'
  consumeCapabilityRegistryUpdated:
    action: receive
    channel:
      $ref: '#/channels/capability-registry-updated'
  consumeTenantTierCeilingChanged:
    action: receive
    channel:
      $ref: '#/channels/tenant-tier-ceiling-changed'

components:
  messages:
    InvocationStarted:
      name: InvocationStarted
      contentType: application/json
      summary: Capability invocation accepted; running
      payload:
        $ref: '#/components/schemas/InvocationStartedPayload'

    InvocationStepEmitted:
      name: InvocationStepEmitted
      contentType: application/json
      summary: Per-step event within an invocation
      payload:
        $ref: '#/components/schemas/InvocationStepEmittedPayload'

    InvocationCompleted:
      name: InvocationCompleted
      contentType: application/json
      summary: Invocation reached terminal success
      payload:
        $ref: '#/components/schemas/InvocationCompletedPayload'

    InvocationFailed:
      name: InvocationFailed
      contentType: application/json
      summary: Invocation reached terminal failure
      payload:
        $ref: '#/components/schemas/InvocationFailedPayload'

    InvocationCancelled:
      name: InvocationCancelled
      contentType: application/json
      summary: Invocation cancelled
      payload:
        $ref: '#/components/schemas/InvocationCancelledPayload'

    AutonomyViolationDetected:
      name: AutonomyViolationDetected
      contentType: application/json
      summary: Capability dispatch refused above ceiling
      payload:
        $ref: '#/components/schemas/AutonomyViolationDetectedPayload'

    SessionEvicted:
      name: SessionEvicted
      contentType: application/json
      summary: Session evicted from hot tier
      payload:
        $ref: '#/components/schemas/SessionEvictedPayload'

    RuntimePodDrained:
      name: RuntimePodDrained
      contentType: application/json
      summary: Runtime pod retired
      payload:
        $ref: '#/components/schemas/RuntimePodDrainedPayload'

    CapabilityRegistryUpdated:
      name: CapabilityRegistryUpdated
      contentType: application/json
      summary: Capability descriptor changed at supervisor
      payload:
        $ref: '#/components/schemas/CapabilityRegistryUpdatedPayload'

    TenantTierCeilingChanged:
      name: TenantTierCeilingChanged
      contentType: application/json
      summary: Tenant autonomy ceiling changed
      payload:
        $ref: '#/components/schemas/TenantTierCeilingChangedPayload'

  schemas:
    InvocationStartedPayload:
      type: object
      required: [invocation_id, tenant_id, capability_id, started_at, autonomy_level_used]
      properties:
        invocation_id: {type: string, description: ULID}
        tenant_id: {type: string, pattern: '^tenant:[a-f0-9]{16}$'}
        capability_id: {type: string}
        session_id: {type: string, nullable: true}
        autonomy_level_used: {type: integer, minimum: 0, maximum: 4}
        started_at: {type: string, format: date-time}
        runtime_pod_id: {type: string}
        signature: {type: string, description: Ed25519 by runtime SPIFFE identity}

    InvocationStepEmittedPayload:
      type: object
      required: [invocation_id, step_index, step_kind, emitted_at]
      properties:
        invocation_id: {type: string}
        step_index: {type: integer}
        step_kind: {type: string, enum: [provider_call, guardrail_call, session_read, session_write, tool_call]}
        sibling_called: {type: string, nullable: true, enum: [foundry-providers, foundry-guardrails, foundry-evidence, foundry-supervisor]}
        duration_ms: {type: integer}
        outcome: {type: string, enum: [ok, error, refused, timeout]}
        emitted_at: {type: string, format: date-time}
        signature: {type: string}

    InvocationCompletedPayload:
      type: object
      required: [invocation_id, completed_at, total_duration_ms]
      properties:
        invocation_id: {type: string}
        completed_at: {type: string, format: date-time}
        total_duration_ms: {type: integer}
        provider_invocation_count: {type: integer}
        guardrail_invocation_count: {type: integer}
        result_size_bytes: {type: integer}
        evaluator_version: {type: string}
        signature: {type: string}

    InvocationFailedPayload:
      type: object
      required: [invocation_id, failed_at, failure_reason]
      properties:
        invocation_id: {type: string}
        failed_at: {type: string, format: date-time}
        failure_reason:
          type: string
          enum: [provider_unreachable, guardrail_block, autonomy_violation, timeout, runtime_drain_lost, descriptor_invalid, internal_error]
        failure_detail: {type: string}
        signature: {type: string}

    InvocationCancelledPayload:
      type: object
      required: [invocation_id, cancelled_at, reason]
      properties:
        invocation_id: {type: string}
        cancelled_at: {type: string, format: date-time}
        reason:
          type: string
          enum: [tenant_request, supervisor_request, runtime_drain]
        requestor: {type: string}
        signature: {type: string}

    AutonomyViolationDetectedPayload:
      type: object
      required: [tenant_id, capability_id, requested_autonomy_level, ceiling_at_check_time, detected_at]
      properties:
        tenant_id: {type: string}
        capability_id: {type: string}
        requested_autonomy_level: {type: integer, minimum: 0, maximum: 4}
        ceiling_at_check_time: {type: integer, minimum: 0, maximum: 4}
        principal_spiffe: {type: string}
        invocation_id_attempted: {type: string, nullable: true}
        detected_at: {type: string, format: date-time}
        signature: {type: string}

    SessionEvictedPayload:
      type: object
      required: [session_id, tenant_id, evicted_at, reason]
      properties:
        session_id: {type: string}
        tenant_id: {type: string}
        evicted_at: {type: string, format: date-time}
        reason: {type: string, enum: [ttl_expired, lru, manual_evict, dsr_cascade, tenant_terminated]}
        turn_count_at_eviction: {type: integer}
        signature: {type: string}

    RuntimePodDrainedPayload:
      type: object
      required: [pod_id, drained_at, in_flight_at_start, parked_count, lost_count, reason]
      properties:
        pod_id: {type: string}
        drained_at: {type: string, format: date-time}
        in_flight_at_start: {type: integer}
        parked_count: {type: integer}
        lost_count: {type: integer, description: should be 0 outside FM-11 incident}
        reason: {type: string, enum: [scheduled_maintenance, credential_rotation, autonomy_quarantine, image_vulnerability, cluster_drain, sev1_breach_response]}
        signature: {type: string}

    CapabilityRegistryUpdatedPayload:
      type: object
      required: [capability_id, tenant_id, action, version, signature]
      properties:
        capability_id: {type: string}
        tenant_id: {type: string}
        action: {type: string, enum: [created, modified, deleted]}
        version: {type: string}
        descriptor_signature: {type: string, description: Ed25519 by foundry-supervisor}
        committed_at: {type: string, format: date-time}
        signature: {type: string, description: Ed25519 by foundry-supervisor over the event envelope}

    TenantTierCeilingChangedPayload:
      type: object
      required: [tenant_id, prev_ceiling, new_ceiling, effective_at, signature]
      properties:
        tenant_id: {type: string}
        prev_ceiling: {type: integer, minimum: 0, maximum: 4}
        new_ceiling: {type: integer, minimum: 0, maximum: 4}
        effective_at: {type: string, format: date-time}
        reason: {type: string}
        approved_by:
          type: array
          items: {type: string}
          minItems: 2
          description: 2-person rule per ADR-0022 ceiling-elevation process
        signature: {type: string, description: Ed25519 by tenancy µservice}
