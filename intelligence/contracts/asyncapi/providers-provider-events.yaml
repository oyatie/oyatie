asyncapi: 3.1.0
info:
  title: foundry-providers — event stream
  version: 0.1.0
  description: |
    AsyncAPI 2.6 spec for the foundry-providers µservice event stream.
    Consumed by audit-chain (foundry-evidence), observability, and tenant
    operator dashboards. All events carry the Ed25519 envelope signature
    so downstream consumers verify authenticity.
defaultContentType: application/json
servers:
  oya-intelligence-providers-events:
    url: nats://foundry-providers.{pack}.oyatie.com:4222
    protocol: nats
    description: NATS JetStream per pack
channels:
  oya.foundry.providers.invocation:
    description: ProviderInvoked event — emitted on every successful provider call
    subscribe:
      message:
        $ref: '#/components/messages/ProviderInvoked'
  oya.foundry.providers.router-decided:
    description: RouterDecided event — emitted on every router decision (including denies)
    subscribe:
      message:
        $ref: '#/components/messages/RouterDecided'
  oya.foundry.providers.credential-resolved:
    description: CredentialResolved event — emitted on every OpenBao resolve
    subscribe:
      message:
        $ref: '#/components/messages/CredentialResolved'
  oya.foundry.providers.credential-rotated:
    description: CredentialRotated event — emitted by rotation runbook
    subscribe:
      message:
        $ref: '#/components/messages/CredentialRotated'
  oya.foundry.providers.credential-revoked:
    description: CredentialRevoked event — emitted by revoke runbook
    subscribe:
      message:
        $ref: '#/components/messages/CredentialRevoked'
  oya.foundry.providers.provider-health-changed:
    description: Health snapshot transitions (demoted / recovered)
    subscribe:
      message:
        $ref: '#/components/messages/ProviderHealthChanged'
  oya.foundry.providers.adapter-pinned:
    description: Adapter version pinned per tenant
    subscribe:
      message:
        $ref: '#/components/messages/AdapterPinned'
  oya.foundry.providers.eu-ai-act-disclosure:
    description: EU AI Act Art. 50 disclosure record (emitted alongside ProviderInvoked when jurisdiction is EU)
    subscribe:
      message:
        $ref: '#/components/messages/EuAiActDisclosure'
components:
  messages:
    ProviderInvoked:
      name: ProviderInvoked
      payload:
        type: object
        required: [tenant_id, pack, principal_spiffe_id, decision_id, vendor, transport, model_id, request_hash, response_hash, envelope_signature, latency_ms, cost_usd, evidence_ref, occurred_at]
        properties:
          tenant_id: {type: string}
          pack: {type: string}
          principal_spiffe_id: {type: string}
          decision_id: {type: string}
          vendor: {type: string, enum: [anthropic, openai, gemini, in-house]}
          transport: {type: string, enum: [api, subscription, in-house]}
          model_id: {type: string}
          jurisdiction_code: {type: string}
          request_hash: {type: string, description: "BLAKE3 hex"}
          response_hash: {type: string, description: "BLAKE3 hex"}
          system_prompt_hash: {type: string}
          envelope_signature: {type: string, description: "Ed25519"}
          latency_ms: {type: number}
          cost_usd: {type: number}
          prompt_tokens: {type: integer}
          completion_tokens: {type: integer}
          credential_ref: {type: string, description: "openbao:// URI; NEVER credential bytes"}
          credential_lease_id: {type: string}
          evidence_ref: {type: string}
          occurred_at: {type: string, format: date-time}
    RouterDecided:
      name: RouterDecided
      payload:
        type: object
        required: [tenant_id, decision_id, selected_vendor, candidate_set, reason, residency_compliant, occurred_at]
        properties:
          tenant_id: {type: string}
          pack: {type: string}
          decision_id: {type: string}
          selected_vendor: {type: string, nullable: true}
          selected_transport: {type: string, nullable: true}
          selected_region: {type: string, nullable: true}
          residency_compliant: {type: boolean}
          reason: {type: string}
          candidate_set:
            type: array
            items:
              type: object
              properties:
                vendor: {type: string}
                transport: {type: string}
                eligible: {type: boolean}
                rejection_reason: {type: string, nullable: true}
          occurred_at: {type: string, format: date-time}
    CredentialResolved:
      name: CredentialResolved
      payload:
        type: object
        required: [tenant_id, vendor, credential_ref, lease_id, caller_ctx_hash, occurred_at]
        properties:
          tenant_id: {type: string}
          pack: {type: string}
          vendor: {type: string}
          credential_ref: {type: string, description: "openbao:// URI"}
          lease_id: {type: string}
          caller_ctx_hash: {type: string, description: "BLAKE3 of (spiffe_id || decision_id)"}
          occurred_at: {type: string, format: date-time}
    CredentialRotated:
      name: CredentialRotated
      payload:
        type: object
        required: [tenant_id, vendor, credential_ref, old_version, new_version, approvers, reason, occurred_at]
        properties:
          tenant_id: {type: string}
          vendor: {type: string}
          credential_ref: {type: string}
          old_version: {type: integer}
          new_version: {type: integer}
          approvers:
            type: array
            items: {type: string, description: "principal id; minimum 2"}
            minItems: 2
          reason: {type: string}
          occurred_at: {type: string, format: date-time}
    CredentialRevoked:
      name: CredentialRevoked
      payload:
        type: object
        required: [tenant_id, vendor, credential_ref, approvers, reason, occurred_at]
        properties:
          tenant_id: {type: string}
          vendor: {type: string}
          credential_ref: {type: string}
          approvers:
            type: array
            items: {type: string}
            minItems: 2
          reason: {type: string}
          severity: {type: string, enum: [Sev-1, Sev-2]}
          occurred_at: {type: string, format: date-time}
    ProviderHealthChanged:
      name: ProviderHealthChanged
      payload:
        type: object
        properties:
          vendor: {type: string}
          transport: {type: string}
          region: {type: string}
          previous_state: {type: string, enum: [healthy, degraded, demoted]}
          new_state: {type: string, enum: [healthy, degraded, demoted]}
          burn_rate_window: {type: string}
          occurred_at: {type: string, format: date-time}
    AdapterPinned:
      name: AdapterPinned
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          vendor: {type: string}
          version: {type: string}
          approvers:
            type: array
            items: {type: string}
            minItems: 2
          reason: {type: string}
          occurred_at: {type: string, format: date-time}
    EuAiActDisclosure:
      name: EuAiActDisclosure
      payload:
        type: object
        description: EU AI Act Reg. (EU) 2024/1689 Art. 50 transparency disclosure
        properties:
          tenant_id: {type: string}
          decision_id: {type: string}
          provider_name: {type: string}
          model_id: {type: string}
          model_version_or_date: {type: string}
          jurisdiction: {type: string}
          system_prompt_hash: {type: string}
          response_hash: {type: string}
          request_id: {type: string}
          occurred_at: {type: string, format: date-time}
