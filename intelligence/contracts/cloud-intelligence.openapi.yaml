openapi: 3.2.0
info:
  title: Oyatie Cloud Intelligence API
  version: 1.0.0
  description: |
    Multi-provider cloud-intelligence AI gateway — a key-pool reverse proxy fronting OpenAI/Codex,
    Anthropic, and Google Gemini behind ONE canonical OpenAI-compatible wire surface.

    Design + research grounding: intelligence/PRD.md and
    intelligence/design/hyperscaler-best-practice-brief.md (brief §2 REST API
    contract). The OpenAI Chat Completions / Embeddings / Models surface is the de-facto
    industry standard (Azure APIM imports OpenAI- and Anthropic-Messages-conformant
    endpoints; Kong AI Proxy normalizes to llm/v1/*), so a stock OpenAI SDK works with
    zero custom client code.

    Error envelope is the OpenAI shape VERBATIM: {"error":{"message","type","param","code"}}.
    Gateway-specific failures map into this envelope with distinguishing `type` values
    (gateway_key_exhausted, gateway_provider_unavailable, budget_exceeded) so an OpenAI SDK
    surfaces them without crashing (brief §2, §10).

    Two security schemes (brief §2 "Adopt"): `ingressBearer` for the agent/tenant data plane
    and `adminBearer` for control-plane ops. Token comparison is constant-time (subtle crate)
    — a documented contract guarantee, not an implementation detail.

    Streaming (brief §1 Architecture): POST /v1/chat/completions with "stream": true returns
    Content-Type text/event-stream; each event is `data: `-prefixed JSON; the stream
    terminates with exactly one `data: [DONE]` sentinel line. SSE bytes are passed through
    from the upstream provider and are NEVER buffered, parsed, or logged.
  contact:
    name: council-foundry
    url: https://github.com/oyatie/oyatie/blob/dev/docs/AGENTS.md
  license:
    name: Internal
servers:
  - url: https://cloud-intelligence.{cell}.oyatie.com
    description: Cell-routed cloud-intelligence gateway ingress
    variables:
      cell:
        default: dev
        enum: [dev, kr-seoul-1, eu-frankfurt-1, us-east-1, ksa-1, uae-1]
security:
  - ingressBearer: []
tags:
  - name: inference
    description: Canonical OpenAI-compatible inference data plane (ingress realm)
  - name: models
    description: Model discovery (ingress realm)
  - name: admin
    description: Control-plane key-pool operations (admin realm — separate security scheme)
  - name: internal
    description: Liveness/readiness/metrics
paths:
  /healthz:
    get:
      tags: [internal]
      summary: Lightweight health probe
      security: []
      responses:
        '200':
          description: ok
  /livez:
    get:
      tags: [internal]
      summary: Kubernetes liveness probe
      security: []
      responses:
        '200':
          description: alive
  /readyz:
    get:
      tags: [internal]
      summary: Readiness — verifies at least one provider pool has an active credential handle and the owned-secret-provider-port is reachable
      security: []
      responses:
        '200':
          description: ready
        '503':
          description: not ready (no active key in any pool, or secret-provider unreachable)
  /metrics:
    get:
      tags: [internal]
      summary: Prometheus/OpenTelemetry exposition (oya_cloud_intelligence_*)
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }

  /v1/chat/completions:
    post:
      tags: [inference]
      summary: Create a chat completion (stream or non-stream)
      description: |
        OpenAI-compatible chat completion. The gateway selects an active key from the
        caller's per-tenant pool for the requested model's provider, injects the provider
        auth header, and proxies upstream. On a transient upstream failure the proxy rotates
        keys (never past the first streamed token), then falls back to a configured alternate
        provider pool, then fails 503 (brief §1, §10 failure ladder).

        When `stream` is true the response is `text/event-stream`: each chunk is a
        `data: `-prefixed JSON `ChatCompletionChunk`, and the stream ends with a single
        `data: [DONE]` line. TTFT (time-to-first-token) is the headline SLI
        (slos/ttft.openslo.yaml).
      operationId: createChatCompletion
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OyatieTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            Completion. Non-stream returns application/json (ChatCompletion).
            Stream (`"stream": true`) returns text/event-stream terminated by `data: [DONE]`.
          headers:
            x-oyatie-tokens-remaining:
              $ref: '#/components/headers/TokensRemaining'
            x-oyatie-ratelimit-remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events. Each event: `data: {ChatCompletionChunk JSON}\n\n`.
                  Final line is the literal sentinel `data: [DONE]`. Bytes are passed through
                  from the provider unmodified.
              examples:
                streamSample:
                  summary: SSE chunk stream ending in [DONE]
                  value: |
                    data: {"id":"chatcmpl-1","object":"chat.completion.chunk","choices":[{"index":0,"delta":{"content":"Hel"}}]}

                    data: {"id":"chatcmpl-1","object":"chat.completion.chunk","choices":[{"index":0,"delta":{"content":"lo"}}]}

                    data: {"id":"chatcmpl-1","object":"chat.completion.chunk","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}

                    data: [DONE]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'


  /v1/messages:
    post:
      tags: [inference]
      summary: Create an Anthropic-compatible message
      description: |
        Anthropic Messages-compatible ingress. The gateway routes by explicit provider prefix,
        model policy, protocol shape, and tenant defaults, then translates or passes through
        according to the selected WireProfile. Prompt/body logging remains default-off.
      operationId: createAnthropicMessage
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OyatieTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Message response or SSE stream when stream=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events using provider-compatible message delta chunks.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/messages/count_tokens:
    post:
      tags: [inference]
      summary: Count Anthropic-compatible message tokens
      description: Count tokens using route policy and provider-adapter accounting without persisting prompt bodies.
      operationId: countAnthropicMessageTokens
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OyatieTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Token count estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/complete:
    post:
      tags: [inference]
      summary: Legacy completion compatibility allowlist
      description: Legacy compatibility route. Disabled unless a tenant WireProfile explicitly allows it.
      operationId: createLegacyCompletion
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OyatieTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyCompletionRequest'
      responses:
        '200':
          description: Legacy completion response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCompletionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/embeddings:
    post:
      tags: [inference]
      summary: Create embeddings
      description: OpenAI-compatible embeddings. Same key-pool selection + failover ladder as chat completions (non-streaming).
      operationId: createEmbeddings
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OyatieTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Embedding vectors
          headers:
            x-oyatie-tokens-remaining:
              $ref: '#/components/headers/TokensRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/models:
    get:
      tags: [models]
      summary: List models reachable through the gateway
      description: OpenAI-compatible model list aggregated across configured provider pools.
      operationId: listModels
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/v1/pools:
    get:
      tags: [admin]
      summary: Key-pool status across all provider channels
      description: |
        Returns per-pool health: total keys, active count, blacklisted count, soonest
        cooldown-restore timestamp. Keys are identified ONLY by hash fingerprint — no raw
        key material is ever returned (brief §5). Admin realm only.
      operationId: getPoolStatus
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Pool status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/pools/{provider}/refresh:
    post:
      tags: [admin]
      summary: Force a key-pool refresh from owned secret-provider adapter for one provider
      description: |
        Triggers an out-of-band re-read of secret/data/agent-gateway/{provider} from owned secret-provider adapter
        and rebuilds the in-memory pool. Idempotent. Never reads keys from disk/env (brief §5, §7).
        Admin realm only.
      operationId: refreshPool
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, gemini]
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /admin/v1/tenants/{tenant_id}/providers/{provider}/pool:
    get:
      tags: [admin]
      summary: Tenant-scoped provider subscription-pool status
      description: |
        Returns secret-redacted status for one tenant/provider pool. This is the
        static boot-time LLM proxy + tenant-scoped subscription-pooling surface:
        it exposes seat counts and readiness only, never provider credential
        handles, OAuth refresh tokens, or API keys.
      operationId: getTenantProviderPoolStatus
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProviderPath'
      responses:
        '200':
          description: Tenant/provider pool status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProviderPoolStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/v1/status:
    get:
      tags: [admin]
      summary: Gateway, route-controller, and worker status
      operationId: getGatewayStatus
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Cloud control-plane status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/accounts:
    get:
      tags: [admin]
      summary: Provider account/seat status without raw credentials
      operationId: listAccounts
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Redacted account/seat status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/analytics:
    get:
      tags: [admin]
      summary: Aggregated analytics summary
      operationId: getAnalyticsSummary
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Analytics summary by tenant/provider/model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/analytics/stream:
    get:
      tags: [admin]
      summary: Read-only analytics event stream
      operationId: streamAnalytics
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Server-Sent Events for redacted analytics/status updates.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/resume:
    post:
      tags: [admin]
      summary: Resume a circuit breaker or budget guard
      operationId: resumeCircuitBreaker
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeCircuitBreakerRequest'
      responses:
        '501':
          description: Resume mutation is not implemented yet; the gateway fails closed instead of returning a false success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeCircuitBreakerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /admin/v1/tenants/{tenant_id}/providers/{provider}/subscriptions:
    post:
      tags: [admin]
      summary: Register a tenant-scoped provider subscription handle
      description: |
        Adds an opaque secret handle to a tenant/provider pool. The request accepts
        OAuth-subscription or API-key credential modes, but the value must be a
        handle reference to owned secret-provider/KMS-backed storage; raw provider credentials
        are rejected and are never echoed in the response.
      operationId: registerTenantProviderSubscription
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SubscriptionRegistrationIdempotencyKey'
        - $ref: '#/components/parameters/AdminTenantHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProviderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantProviderSubscriptionRegistrationRequest'
      responses:
        '201':
          description: Subscription handle registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProviderSubscriptionRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate seat_id already exists in the tenant/provider pool.


  /admin/v1/agent-runtimes:
    get:
      tags: [admin]
      summary: List internal agent runtime profiles and redacted workflow status
      description: Cloud-intelligence primitive status surface for tenant-controlled agent runtimes. Returns resource refs, policy-port readiness, adapter names, and sealed evidence handles only.
      operationId: listAgentRuntimeProfiles
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Agent runtime profiles and workflow status.
          content:
            application/json:
              schema:
                type: object
                required: [runtimes, workflow_statuses]
                properties:
                  runtimes:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRuntimeProfile' }
                  workflow_statuses:
                    type: array
                    items: { $ref: '#/components/schemas/AgentWorkflowStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/agent-schedules:
    get:
      tags: [admin]
      summary: List controller-owned agent schedules and redacted status
      description: Schedules are reconciled by workers/controllers and expose status refs only; no embedded cron runner or local task surface is part of this API.
      operationId: listAgentSchedules
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Agent schedules and status.
          content:
            application/json:
              schema:
                type: object
                required: [schedules, statuses]
                properties:
                  schedules:
                    type: array
                    items: { $ref: '#/components/schemas/AgentSchedule' }
                  statuses:
                    type: array
                    items: { $ref: '#/components/schemas/AgentScheduleStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/parity/canaries:
    get:
      tags: [admin]
      summary: List scheduled parity/drift canary plans and redacted status
      description: Read-only status for parity and drift canaries. Deltas open governed work items; evidence is represented by sealed handles and Retry-After semantics.
      operationId: listParityCanaries
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Parity/drift canary plans and status.
          content:
            application/json:
              schema:
                type: object
                required: [plans, statuses]
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/ParityCanaryPlan' }
                  statuses:
                    type: array
                    items: { $ref: '#/components/schemas/ParityCanaryStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/guardrails:
    get:
      tags: [admin]
      summary: List tenant-visible guardrail detection profiles
      description: Platform floor profiles are automatic, fail-closed, and cannot be weakened by tenant policy overlays.
      operationId: listGuardrailProfiles
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Guardrail profiles and signal policy.
          content:
            application/json:
              schema:
                type: object
                required: [profiles, signal_policy]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/GuardrailDetectionProfile' }
                  signal_policy:
                    $ref: '#/components/schemas/SafetySignalPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/guardrails/escalations:
    get:
      tags: [admin]
      summary: List safety escalations requiring manual review
      description: Critical blocks require secondary internal review before manual escalation. Returned evidence is redacted by default.
      operationId: listSafetyEscalations
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Manual-review escalation state.
          content:
            application/json:
              schema:
                type: object
                required: [escalations]
                properties:
                  escalations:
                    type: array
                    items: { $ref: '#/components/schemas/ManualReviewEscalation' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/evidence/retention:
    get:
      tags: [admin]
      summary: List evidence-retention profiles
      description: Normal requests do not store raw payloads. Guardrail-triggered evidence uses sealed encrypted handles with data-class TTLs and audited break-glass raw access only.
      operationId: listEvidenceRetentionProfiles
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Evidence retention profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/EvidenceRetentionProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/v1/redaction/profiles:
    get:
      tags: [admin]
      summary: List in-transit redaction profiles
      description: Sensitive classes block/quarantine. Trivial personal data is redacted or reversibly tokenized only when tenant policy approves restoration after model output.
      operationId: listRedactionProfiles
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/AdminTenantHeader'
      responses:
        '200':
          description: Redaction profiles.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/InTransitRedactionProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


components:
  securitySchemes:
    ingressBearer:
      type: http
      scheme: bearer
      description: |
        Ingress data-plane realm. The bearer token is an Oyatie ingress proxy-key that maps
        to a tenant id and its per-tenant key pool + budget tier. Compared in constant time
        (subtle crate) — documented contract guarantee (brief §2, §5).
    adminBearer:
      type: http
      scheme: bearer
      description: |
        Admin control-plane realm — DISTINCT from ingressBearer. Authorizes pool status and
        key-refresh ops through owned-policy-engine-port decisions. Compared in constant time. An ingress token is never valid here and
        vice versa (owned-policy-engine-port default-deny cross-realm policy).
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
        format: uuid
      description: Distributed-trace correlation; auto-generated if absent. Becomes the audit/usage envelope correlationId.
    OyatieTenant:
      name: X-Oyatie-Tenant
      in: header
      schema:
        type: string
      description: |
        Optional explicit tenant override (admin/dogfood only). Normally the tenant is derived
        from the ingress bearer token; this header is ignored unless the token is privileged.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Required on mutating admin ops; 24h window.
    SubscriptionRegistrationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: |
        Required bounded ASCII operation key for subscription registration. This
        endpoint treats duplicate seat_id as the replay/conflict guard rather than
        implementing the global UUID replay-window idempotency contract.
    AdminTenantHeader:
      name: X-Oya-Admin-Tenant
      in: header
      required: true
      schema:
        type: string
      description: |
        Required admin tenant assertion (fail-closed, default-deny). It must match the
        administered tenant — the tenant_id path segment on tenant-scoped routes, else the
        gateway tenant. Requests without it are rejected 403.
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Tenant whose provider pool is being administered.
    ProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [anthropic, codex, gemini]
      description: Provider pool. `anthropic` covers Claude subscriptions; `codex` covers OpenAI/Codex subscriptions; `gemini` covers Google Gemini API-key seats.
  headers:
    RetryAfter:
      schema: { type: integer }
      description: |
        Seconds until the caller may retry. On a 429/503 the gateway sets this from the upstream
        provider `Retry-After` when present, else the soonest key-pool cooldown-restore time
        (brief §10 — all-keys-cooling-down fast-fails with Retry-After = soonest restore; never
        a DoS amplifier per OWASP LLM10).
    TokensRemaining:
      schema: { type: integer, format: int64 }
      description: Remaining token budget for the calling tenant in the current window (brief §8).
    RateLimitRemaining:
      schema: { type: integer, format: int64 }
      description: Remaining requests for the calling tenant in the current window.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            invalidRequest:
              value: { error: { message: "model is required", type: "invalid_request_error", param: "model", code: null } }
    Unauthorized:
      description: Missing or invalid bearer token (constant-time check failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            authError:
              value: { error: { message: "invalid bearer token", type: "authentication_error", param: null, code: "invalid_api_key" } }
    Forbidden:
      description: Wrong realm or cross-tenant (owned policy-engine forbid)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            forbidden:
              value: { error: { message: "admin realm required", type: "permission_error", param: null, code: null } }
    NotFound:
      description: Unknown model or provider
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: |
        Per-tenant rate or token budget exceeded, OR upstream rate-limit propagated.
        Always carries Retry-After (brief §2, §8, §10). `type` distinguishes the cause:
        `budget_exceeded` (tenant token/cost budget), `rate_limit_error` (request rate or
        upstream 429 propagated).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        x-oyatie-tokens-remaining:
          $ref: '#/components/headers/TokensRemaining'
        x-oyatie-ratelimit-remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            budgetExceeded:
              value: { error: { message: "tenant token budget exhausted for window", type: "budget_exceeded", param: null, code: "insufficient_quota" } }
            rateLimited:
              value: { error: { message: "rate limit reached", type: "rate_limit_error", param: null, code: "rate_limit_exceeded" } }
    InternalError:
      description: Unexpected gateway error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: |
        No usable upstream capacity. Always carries Retry-After. `type` distinguishes the cause
        (brief §10 — key-exhaustion vs provider-outage are separate states/error types/SLIs):
        `gateway_key_exhausted` (every key in the pool is blacklisted/cooling-down) or
        `gateway_provider_unavailable` (provider-wide outage, circuit breaker open, fallback
        exhausted).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            keyExhausted:
              value: { error: { message: "all provider keys are in cooldown; retry after soonest restore", type: "gateway_key_exhausted", param: null, code: null } }
            providerOutage:
              value: { error: { message: "upstream provider unavailable and no fallback succeeded", type: "gateway_provider_unavailable", param: null, code: null } }
  schemas:
    ErrorEnvelope:
      type: object
      description: OpenAI error envelope, verbatim (brief §2).
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type:
              type: string
              description: |
                OpenAI error types plus gateway-specific values. One of:
                invalid_request_error, authentication_error, permission_error, not_found_error,
                rate_limit_error, budget_exceeded, gateway_key_exhausted,
                gateway_provider_unavailable, api_error.
            param: { type: string, nullable: true }
            code: { type: string, nullable: true }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: "Provider-routed model id, e.g. gpt-4o, claude-3-7-sonnet, gemini-2.0-flash" }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream:
          type: boolean
          default: false
          description: "When true, response is text/event-stream terminated by `data: [DONE]`."
        max_tokens: { type: integer, format: int32, minimum: 1 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        stop:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        stream_options:
          type: object
          description: >-
            When include_usage is set true, the final stream chunk carries token usage for
            metering (brief §8 — meter on actual returned tokens).
          properties:
            include_usage: { type: boolean }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        name: { type: string }
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items: { $ref: '#/components/schemas/ChatChoice' }
        usage: { $ref: '#/components/schemas/Usage' }
    ChatChoice:
      type: object
      required: [index, message]
      properties:
        index: { type: integer }
        message: { $ref: '#/components/schemas/ChatMessage' }
        finish_reason: { type: string, nullable: true, enum: [stop, length, content_filter, tool_calls, null] }
    Usage:
      type: object
      description: Token counts as returned by the provider; the basis for billing metering (brief §8).
      properties:
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        total_tokens: { type: integer, format: int64 }
    EmbeddingsRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        encoding_format: { type: string, enum: [float, base64], default: float }
    EmbeddingsResponse:
      type: object
      required: [object, data, model]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: '#/components/schemas/EmbeddingVector' }
        model: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
    EmbeddingVector:
      type: object
      required: [object, index, embedding]
      properties:
        object: { type: string, const: embedding }
        index: { type: integer }
        embedding:
          type: array
          items: { type: number, format: float }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: '#/components/schemas/Model' }
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer, format: int64 }
        owned_by: { type: string, description: "Provider channel: openai | anthropic | gemini" }
    PoolStatusResponse:
      type: object
      required: [pools]
      properties:
        pools:
          type: array
          items: { $ref: '#/components/schemas/PoolStatus' }
    PoolStatus:
      type: object
      required: [provider, total_keys, active_keys, blacklisted_keys]
      properties:
        provider: { type: string, enum: [openai, anthropic, gemini] }
        total_keys: { type: integer }
        active_keys: { type: integer, description: "KeyPool::active_count at evaluation time" }
        blacklisted_keys: { type: integer }
        soonest_restore_epoch_ms:
          type: integer
          format: int64
          nullable: true
          description: Soonest cooldown-restore timestamp across blacklisted keys; null if none blacklisted.
        key_fingerprints:
          type: array
          description: Hash-only fingerprints (never raw keys) for the keys in this pool (brief §5).
          items: { type: string }
    RefreshResult:
      type: object
      required: [provider, keys_loaded, refreshed_at]
      properties:
        provider: { type: string, enum: [openai, anthropic, gemini] }
        keys_loaded: { type: integer }
        refreshed_at: { type: string, format: date-time }
        source: { type: string, const: owned-secret-provider-port }
    TenantProviderPoolStatus:
      type: object
      required: [tenant_id, provider, total_seats, ready]
      properties:
        tenant_id: { type: string }
        provider: { type: string, enum: [anthropic, codex, gemini] }
        total_seats: { type: integer, minimum: 0 }
        ready:
          type: boolean
          description: True when at least one seat is selectable in this tenant/provider pool.
    TenantProviderSubscriptionRegistrationRequest:
      type: object
      required: [seat_id, subscription_id, credential_mode, secret_handle]
      properties:
        seat_id: { type: string, minLength: 1 }
        subscription_id: { type: string, minLength: 1 }
        credential_mode:
          type: string
          enum: [oauth_subscription, api_key]
        secret_handle:
          type: string
          minLength: 1
          pattern: '^(secret-ref://|kms-ref://).+'
          description: Opaque owned secret-provider/KMS-backed handle only; raw provider credentials are rejected.
    TenantProviderSubscriptionRegistrationResponse:
      type: object
      required: [tenant_id, provider, seat_id, status]
      properties:
        tenant_id: { type: string }
        provider: { type: string, enum: [anthropic, codex, gemini] }
        seat_id: { type: string }
        status: { type: string, enum: [registered] }

    AnthropicMessageRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model: { type: string, description: Provider-routed model id or provider-prefixed model id. }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AnthropicMessage' }
        system:
          oneOf:
            - { type: string }
            - { type: array, items: { $ref: '#/components/schemas/AnthropicContentBlock' } }
        max_tokens: { type: integer, minimum: 1 }
        stream: { type: boolean, default: false }
        thinking:
          type: object
          additionalProperties: true
          description: Preserved only when the route ThinkingPolicy explicitly permits pass-through.
    AnthropicMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content:
          oneOf:
            - { type: string }
            - { type: array, items: { $ref: '#/components/schemas/AnthropicContentBlock' } }
    AnthropicContentBlock:
      type: object
      required: [type]
      properties:
        type: { type: string }
        text: { type: string }
        id: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: true }
    AnthropicMessageResponse:
      type: object
      required: [id, type, role, model, content]
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string }
        content:
          type: array
          items: { $ref: '#/components/schemas/AnthropicContentBlock' }
        stop_reason: { type: string, nullable: true }
        usage: { $ref: '#/components/schemas/Usage' }
    TokenCountResponse:
      type: object
      required: [input_tokens]
      properties:
        input_tokens: { type: integer, format: int64, minimum: 0 }
    LegacyCompletionRequest:
      type: object
      required: [model, prompt, max_tokens_to_sample]
      properties:
        model: { type: string }
        prompt: { type: string }
        max_tokens_to_sample: { type: integer, minimum: 1 }
        stream: { type: boolean, default: false }
    LegacyCompletionResponse:
      type: object
      required: [completion, stop_reason, model]
      properties:
        completion: { type: string }
        stop_reason: { type: string, nullable: true }
        model: { type: string }
    GatewayStatusResponse:
      type: object
      required: [status, route_controller_ready, model_inventory_ready, credential_worker_ready, policy_engine_ready, boundaries]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        route_controller_ready: { type: boolean }
        model_inventory_ready: { type: boolean }
        credential_worker_ready: { type: boolean, description: owned-secret-provider-port reachability and lease readiness. }
        policy_engine_ready: { type: boolean, description: owned-policy-engine-port decision readiness. }
        default_data_plane_ready: { type: boolean }
        secret_provider_ready: { type: boolean }
        registered_pools: { type: integer, minimum: 0 }
        boundaries:
          type: object
          required: [secret_resolution, authorization]
          properties:
            secret_resolution: { type: string, const: owned-secret-provider-port }
            authorization: { type: string, const: owned-policy-engine-port }
    AccountStatusResponse:
      type: object
      required: [accounts, redaction]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountStatus' }
        redaction: { type: string, const: secret-handles-redacted }
    AccountStatus:
      type: object
      required: [tenant_id, provider, seat_id, state]
      properties:
        tenant_id: { type: string }
        provider: { type: string, enum: [anthropic, codex, gemini] }
        seat_id: { type: string }
        state: { type: string, enum: [authorized, active, cooldown, blacklisted] }
        cooldown_until: { type: string, format: date-time, nullable: true }
        headroom_percent: { type: number, minimum: 0, maximum: 100 }
    AnalyticsSummaryResponse:
      type: object
      required: [window, request_count, input_tokens, output_tokens]
      properties:
        window: { type: string }
        request_count: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        rate_limit_utilization_percent: { type: number, minimum: 0, maximum: 100 }
    ResumeCircuitBreakerRequest:
      type: object
      required: [scope, reason]
      properties:
        scope: { type: string, description: tenant/provider/model or GatewayCircuitBreaker resource name. }
        reason: { type: string, minLength: 1 }
    ResumeCircuitBreakerResponse:
      type: object
      required: [scope, status]
      properties:
        scope: { type: string }
        status: { type: string, enum: [not_implemented] }
    AgentRuntimeProfile:
      type: object
      required: [kind, tenant_id, name, model_route_ref, prompt_profile_ref, thinking_policy_ref, tool_compatibility_profile_ref, sandbox_policy_ref, cloud_intelligence_owned_control_plane, embeds_model_runtime, installs_cli_or_tui_surface]
      properties:
        kind: { type: string, const: AgentRuntimeProfile }
        tenant_id: { type: string }
        name: { type: string }
        model_route_ref: { type: string }
        prompt_profile_ref: { type: string }
        thinking_policy_ref: { type: string }
        tool_compatibility_profile_ref: { type: string }
        sandbox_policy_ref: { type: string }
        cloud_intelligence_owned_control_plane: { type: boolean, const: true }
        embeds_model_runtime: { type: boolean, const: false }
        installs_cli_or_tui_surface: { type: boolean, const: false }
    AgentSchedule:
      type: object
      required: [kind, tenant_id, name, schedule_ref, runtime_profile_ref, execution_externalized_to_controller, embeds_local_cron]
      properties:
        kind: { type: string, const: AgentSchedule }
        tenant_id: { type: string }
        name: { type: string }
        schedule_ref: { type: string }
        runtime_profile_ref: { type: string }
        execution_externalized_to_controller: { type: boolean, const: true }
        embeds_local_cron: { type: boolean, const: false }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
    AgentDelegationPolicy:
      type: object
      required: [kind, allowed_generation_adapters, policy_engine_port, policy_gated, allows_routing_advisor_generation]
      properties:
        kind: { type: string, const: AgentDelegationPolicy }
        allowed_generation_adapters:
          type: array
          items: { type: string, enum: [claude, codex, gemini] }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        policy_gated: { type: boolean, const: true }
        allows_routing_advisor_generation: { type: boolean, const: false }
    AgentWorkflowStatus:
      type: object
      required: [kind, workflow_ref, runtime_profile_ref, delegation_policy_ref, generation_adapters, routing_advisor_scope, policy_engine_port, evidence_visibility, requires_secondary_review_for_critical_blocks, raw_payload_included]
      properties:
        kind: { type: string, const: AgentWorkflowStatus }
        tenant_id: { type: string }
        workflow_ref: { type: string }
        runtime_profile_ref: { type: string }
        delegation_policy_ref: { type: string }
        generation_adapters:
          type: array
          items: { type: string, enum: [claude, codex, gemini] }
        routing_advisor_scope: { type: string, const: routing-decision-only }
        routing_advisor_models:
          type: array
          items: { type: string }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        requires_secondary_review_for_critical_blocks: { type: boolean, const: true }
        raw_payload_included: { type: boolean, const: false }
    AgentScheduleStatus:
      type: object
      required: [kind, schedule_ref, state, controller_owner, policy_engine_port, evidence_visibility, raw_payload_included]
      properties:
        kind: { type: string, const: AgentScheduleStatus }
        schedule_ref: { type: string }
        state: { type: string, enum: [queued, running, passed, failed, blocked] }
        next_run_window: { type: string, nullable: true }
        controller_owner: { type: string }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        raw_payload_included: { type: boolean, const: false }
    ParityCanaryPlan:
      type: object
      required: [kind, tenant_id, name, artifact_family, capability_namespace, schedule_ref, probes, compatibility_canaries, controller_owned, opens_pr_or_task_on_delta, audit_event_required, embeds_local_cron, writes_raw_prompts_or_secrets]
      properties:
        kind: { type: string, const: ParityCanaryPlan }
        tenant_id: { type: string }
        name: { type: string }
        artifact_family: { type: string, const: external-proxy-reference }
        capability_namespace: { type: string, const: XPROXY }
        schedule_ref: { type: string }
        probes:
          type: array
          items: { type: string }
        compatibility_canaries:
          type: array
          items: { type: string }
        controller_owned: { type: boolean, const: true }
        opens_pr_or_task_on_delta: { type: boolean, const: true }
        audit_event_required: { type: boolean, const: true }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        embeds_local_cron: { type: boolean, const: false }
        writes_raw_prompts_or_secrets: { type: boolean, const: false }
    ParityCanaryStatus:
      type: object
      required: [kind, plan_ref, state, evidence_visibility, raw_payload_included]
      properties:
        kind: { type: string, const: ParityCanaryStatus }
        plan_ref: { type: string }
        state: { type: string, enum: [passed, failed, running, inconclusive] }
        retry_after_seconds: { type: integer, nullable: true }
        retry_after_header: { type: string, const: Retry-After }
        evidence_visibility: { type: string, const: redacted-structured-evidence }
        sealed_evidence_handle_ref: { type: string, nullable: true }
        raw_payload_included: { type: boolean, const: false }
    EvidenceDataClass:
      type: string
      enum:
        - public_or_operational_metadata
        - personal_data
        - regulated_health_data
        - payment_or_financial_data
        - credential_or_secret
        - tenant_boundary_violation
        - prompt_injection_or_jailbreak
        - security_exploit_or_breach
        - self_harm_or_harm_to_others
        - child_safety_or_abuse
        - fraud_or_hostile_pattern
        - fault_or_anomaly
    GuardrailDetectionProfile:
      type: object
      required: [kind, name, critical_categories, automatic_block_and_quarantine, mandatory_secondary_agentic_review, manual_review_required_after_secondary_review, tenant_may_weaken_platform_floor]
      properties:
        kind: { type: string, const: GuardrailDetectionProfile }
        name: { type: string }
        critical_categories:
          type: array
          items: { type: string }
        automatic_block_and_quarantine: { type: boolean, const: true }
        mandatory_secondary_agentic_review: { type: boolean, const: true }
        manual_review_required_after_secondary_review: { type: boolean, const: true }
        tenant_may_weaken_platform_floor: { type: boolean, const: false }
        policy_engine_port: { type: string, const: owned-policy-engine-port }
    SafetySignalPolicy:
      type: object
      required: [kind, platform_automatic_enforcement, tenant_policy_receives_signals, tenant_policy_receives_recommendations, tenant_can_override_platform_critical_block]
      properties:
        kind: { type: string, const: SafetySignalPolicy }
        platform_automatic_enforcement: { type: boolean, const: true }
        tenant_policy_receives_signals: { type: boolean, const: true }
        tenant_policy_receives_recommendations: { type: boolean, const: true }
        tenant_can_override_platform_critical_block: { type: boolean, const: false }
    ManualReviewEscalation:
      type: object
      required: [kind, escalation_id, required_for_critical_blocks, secondary_agentic_review_must_run_first, default_evidence_visibility, raw_payload_break_glass_only]
      properties:
        kind: { type: string, const: ManualReviewEscalation }
        escalation_id: { type: string }
        status: { type: string, enum: [pending_secondary_review, pending_manual_review, closed] }
