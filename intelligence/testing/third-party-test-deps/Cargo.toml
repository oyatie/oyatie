[package]
name = "intelligence-third-party-test-deps"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Reindeer dev-dep forcing crate (ADR-0554 affected-set / move-22a).
#
# Reindeer (git 681727c) does NOT vendor dev-only dependencies of workspace
# members: `FeatureResolver::enable_crate_for_platform` recurses to enable
# dependent crates only for `DepKind::Normal | DepKind::Build`, with
# `DepKind::Dev => false` (reindeer src/index.rs:393-397). So crates declared
# solely under `[dev-dependencies]` (proptest) never enter the platform-enablement
# walk and are never emitted to third-party/BUCK — even though they are first-order
# `public_targets` (index.rs:144-167). The virtual workspace manifest also forbids
# `include_top_level = true` (index.rs:102-106).
#
# This crate's SOLE purpose is to promote those test-only crates to NORMAL
# dependencies in ONE first-party crate, so reindeer's Normal-kind walk vendors
# them (and their transitive closure) into third-party/BUCK. It is never linked
# into any shipped binary; it exists only to make the vendored targets exist for
# the intelligence test suite (core/kernel proptest invariants) to depend on
# under buck2.
#
# `httpmock` WAS forced here too and no longer is. ADR-0709 D-6 Rule 2 fails a
# dependency on the cost of what it DRAGS IN rather than on the crate itself, and
# httpmock was the sole parent of the discontinued async-std runtime, hyper 0.14,
# http 0.2, winapi 0.3.9 and syn 1.0.109. It is replaced by the first-party
# `scripted-http-server` crate beside this one, which is a workspace member and so
# needs no forcing: reindeer does not vendor first-party crates at all.
[dependencies]
proptest = "1.5"
