apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-detection-graph-store-community-detection-availability
  displayName: detection graph-store-community-detection availability
  labels:
    microservice: detection
    bounded_context: graph-store-community-detection
    owner_team: axis-detection
    pack_scope: all
spec:
  service: detection
  description: Graph Store and Community Detection SLO bound to ADR-0307 and ADR-0263.
  indicator:
    metadata:
      name: detection-graph-store-community-detection-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: "sum(rate(oya_detection_graph_store_community_detection_success_total[5m]))"
        total:
          metricSource:
            type: Prometheus
            spec:
              query: "sum(rate(oya_detection_graph_store_community_detection_requests_total[5m]))"
  objectives:
    -
      target: 0.999
      displayName: 30d rolling availability
  timeWindow:
    -
      duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
