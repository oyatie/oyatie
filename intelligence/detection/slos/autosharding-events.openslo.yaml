# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (Wave 15-ZF-15 per ADR-0346, ADR-0347, ADR-0348, ADR-0349)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: detection-autosharding-hot-split-latency
  displayName: "detection autosharding HOT-SPLIT p99 latency"
  labels:
    microservice: detection
    doctrine_wave: wave-15-zf-15
    adr_0346: oya-verify-must-run-full-ci-mirror
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: jenkins-argocd-self-hostable-ci-cd-substrate
    automation_mode: dynamic_sharding
    automation_event: hot_split
    enforced_by: oya-governance-dynamic-sharding-threshold-coverage
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_purpose: "oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix."
    adr_0347_enforced_by: "oya-governance-lane-prefix-vocabulary"
    adr_0348_enforced_by: "oya-governance-dynamic-sharding-threshold-coverage; oya-governance-audit-chain-emit-on-automation-events"
    adr_0349_enforced_by: "oya-governance-jenkins-github-actions-parity"
spec:
  description: "ADR-0348 makes DYNAMIC SHARDING split hot shards when shard p99 latency exceeds SLO or utilization exceeds 80%; this SLO bounds detection hot-split latency and requires audit-chain emission under ADR-0348, governance lane vocabulary under ADR-0347, local CI mirror validation under ADR-0346, and Jenkins/GitHub Actions parity under ADR-0349."
  indicator:
    metadata:
      name: detection-autosharding-hot-split-latency-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_hot_split_duration_seconds_bucket{microservice="detection",automation_event="hot_split"}[5m])) by (le))'
  objectives:
    - displayName: "99% of HOT-SPLIT events complete within 300s over 30d"
      target: 0.99
      op: lte
      value: 300
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: detection-autosharding-rebalance-migration-time
  displayName: "detection AUTO-REBALANCE migration p99 duration"
  labels:
    microservice: detection
    doctrine_wave: wave-15-zf-15
    adr_0346: oya-verify-must-run-full-ci-mirror
    adr_0347: foundry-fitness-to-governance-bulk-rename
    adr_0348: autosharding-auto-rebalance-dynamic-sharding
    adr_0349: jenkins-argocd-self-hostable-ci-cd-substrate
    automation_mode: auto_rebalance
    automation_event: tenant_migration
    enforced_by: oya-governance-auto-rebalance-residency-honored
  annotations:
    adr_refs: "ADR-0346, ADR-0347, ADR-0348, ADR-0349"
    adr_0346_enforced_by: "oya-governance-oya-verify-ci-mirror-coverage; oya-governance-oya-verify-ci-step-exit-semantics; oya-governance-oya-submit-calls-verify"
    adr_0347_enforced_by: "oya-governance-no-foundry-fitness-residue; oya-governance-lane-prefix-vocabulary; oya-governance-rename-inventory-presence"
    adr_0348_enforced_by: "oya-governance-auto-rebalance-residency-honored; oya-governance-audit-chain-emit-on-automation-events; oya-governance-tenant-migration-reversibility"
    adr_0349_purpose: "Jenkins augments rather than replaces GitHub Actions; ArgoCD is the canonical GitOps CD orchestrator."
spec:
  description: "ADR-0348 makes AUTO-REBALANCE migrate tenants from hot cells to cooler cells while honoring residency and compliance packs; this SLO bounds detection rebalance migration time and requires observable, reversible, audit-chain-emitting automation enforced with ADR-0346, ADR-0347, and ADR-0349 governance lanes."
  indicator:
    metadata:
      name: detection-autosharding-rebalance-migration-time-indicator
    spec:
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(oya_autosharding_rebalance_migration_duration_seconds_bucket{microservice="detection",automation_event="tenant_migration"}[5m])) by (le, migration_distance))'
  objectives:
    - displayName: "99% of intra-region AUTO-REBALANCE migrations complete within 600s over 30d"
      target: 0.99
      op: lte
      value: 600
    - displayName: "99% of cross-region AUTO-REBALANCE migrations complete within 3600s over 30d"
      target: 0.99
      op: lte
      value: 3600
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
