[package]
name = "intelligence-provider-pool-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Provider-pool composition root (usecase layer per ADR-0105). Wires the pure provider-pool-kernel routing function (round-robin / least-used / least-latency / least-remaining / sticky over BTreeSet membership + AccountHealthMap + UsageSnapshotMap) into an end-to-end dispatch use-case: load pool registry, drive failover through the kernel's fallback_chain on retryable failures, mutate health on consecutive-failure quarantine, and surface a typed Unimplemented boundary for OpenBao secret resolution + Bedrock-shape audit emission downstreams. Path-deps on the kernel + the sibling account-kernel only; no NEW external workspace dependency seam. Mirrors the workload-identity-app + cloud-intelligence-app composition pattern (ports + in-memory adapters + production transport adapter; default-deny on error; ADR-0083 Tier-3 panic-free)."

# INVARIANT: path-deps on the provider-pool kernel + the sibling account kernel
# only for the LIBRARY. The composition layer adds tokio/futures-util/bytes/tracing
# for the production hyper-backed transport (mirroring how the cloud-intelligence-app
# composes the same backbone). No NEW external workspace dependency seam in the library.
#
# The [[bin]] composition root (src/main.rs, pooling-convergence slice 1,
# .omc/pooling-convergence.json) additionally path-deps on the bespoke hyper backbone
# (oya-http-runtime-hyper-adapter Layer 5 + router/middleware kernels) and the
# anthropic/openai compat-api ingress crates to bind a runnable process. These are
# workspace-internal path-deps, not a new external workspace dependency seam.
[dependencies]
intelligence-provider-pool-kernel = { path = "../provider-pool-kernel" }
intelligence-account-kernel = { path = "../account-kernel" }
http-runtime-hyper-adapter = { path = "../../../base/http-runtime-hyper-adapter" }
http-router-kernel = { path = "../../../base/http-router-kernel" }
http-middleware-kernel = { path = "../../../base/http-middleware-kernel" }
intelligence-anthropic-compat-api = { path = "../../adapters/anthropic-compat-api" }
intelligence-openai-compat-api = { path = "../../adapters/openai-compat-api" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false }
bytes = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lib]
name = "intelligence_provider_pool_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "intelligence-provider-pool"
path = "src/main.rs"

[lints]
workspace = true
