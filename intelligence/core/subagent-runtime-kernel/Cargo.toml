[package]
# Naming justification (per feedback_naming_justification):
#   - BNF v4.1:        oya - foundry - subagent-runtime - kernel
#   - slot-2 µservice: `foundry` (registered; internal engineering platform).
#   - bc-tokens:       `subagent-runtime` (kebab tokens; bounded context is
#                      the per-facet subagent invocation substrate — the
#                      port + value-objects that close the
#                      `subagent_runtime_pending=true` gap in IP-004/IP-005/IP-006).
#   - layer (slot-N):  `kernel` — closed 12-value enum {kernel, domain,
#                      usecase, app, adapter, infrastructure, cli, rest,
#                      grpc, worker, sdk, api} per ADR-0056 amended by
#                      ADR-0105+ADR-0106+ADR-0565. ✓
#   - Sibling pattern: every other `foundry-*-kernel` crate (the
#                      port-in-kernel substrate; adapter impls live
#                      one ring out, binary entrypoints two rings out).
#   - Introducing IP:  M01-P17-IP-009 (subagent runtime).
name = "intelligence-subagent-runtime-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "intelligence_subagent_runtime_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-account-kernel = { path = "../account-kernel" }

[lints]
workspace = true

[package.metadata.oya]
context     = "foundry"
role        = "kernel"
feature     = "subagent-runtime"
capability  = ""
layer       = "kernel"
audit_chain = true

[package.metadata.oya.lifecycle]
stage = "scaffolded"
introducing_ip = "M01-P17-IP-009"
