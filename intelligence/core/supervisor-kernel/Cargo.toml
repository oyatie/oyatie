# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=supervisor; layer=kernel (12-layer-enum L1).
#         Justification: pure-kernel value types + port traits for the foundry
#         supervisor lane (M02-P06). No I/O. No provider-specific code.

[package]
name = "intelligence-supervisor-kernel"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "intelligence_supervisor_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-autonomy-ceiling-kernel = { path = "../autonomy-ceiling-kernel" }
oya-intelligence-account-domain = { path = "../../../oya/intelligence/crates/oya-intelligence-account-domain" }

[lints]
workspace = true
