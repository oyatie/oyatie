[package]
# Naming justification (per feedback_naming_justification):
#   - BNF v4.1:        foundry - subagent-runtime - app
#   - slot-2 µservice: `foundry` (registered; internal engineering platform).
#   - bc-tokens:       `subagent-runtime` (kebab tokens; same bounded
#                      context as the kernel sibling — per-facet subagent
#                      invocation substrate). The kernel ships the port;
#                      this app ships the binary entrypoint + adapter
#                      implementations (live Anthropic HTTP + deterministic
#                      mock re-export).
#   - layer (slot-N):  `app` — closed 12-value enum {kernel, domain,
#                      usecase, app, adapter, infrastructure, cli, rest,
#                      grpc, worker, sdk, api} per ADR-0056 amended by
#                      ADR-0105+ADR-0106+ADR-0565. ✓
#   - Sibling pattern: every other `tools/foundry-*-app` crate
#                      (banned-primitives, pr-review-dispatcher, etc.).
#   - Introducing IP:  M01-P17-IP-009 (subagent runtime).
name = "intelligence-subagent-runtime-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[[bin]]
name = "intelligence-subagent-runtime-app"
path = "src/main.rs"

[lib]
name = "intelligence_subagent_runtime_app"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-account-kernel = { path = "../account-kernel" }
intelligence-subagent-runtime-kernel = { path = "../subagent-runtime-kernel" }
intelligence-subagent-runtime-usecase = { path = "../subagent-runtime-usecase" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.oyatie]
context     = "foundry"
role        = "app"
feature     = "subagent-runtime"
capability  = ""
layer       = "app"
audit_chain = true

[package.metadata.oyatie.lifecycle]
stage = "scaffolded"
introducing_ip = "M01-P17-IP-009"
