[package]
# Naming justification:
#   - BNF v4.1:        oya - foundry - subagent-runtime - usecase
#   - slot-2 µservice: `foundry`.
#   - bc-tokens:       `subagent-runtime` (per-facet subagent invocation
#                      orchestration shared by dispatcher apps and the
#                      deployable runtime app).
#   - layer (slot-N):  `usecase` per ADR-0106: shared application/use-case
#                      orchestration over kernel ports, no concrete adapters,
#                      no deployable binary. Keeps dispatcher apps from
#                      importing another `app` crate.
name = "intelligence-subagent-runtime-usecase"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "foundry"
bounded_context = "subagent-runtime"
kind = "shared"
layer = "usecase"
purpose = "Shared use-case orchestration for the subagent-runtime panel: canonical facet fan-out plus kernel type re-exports. No I/O and no deployable binary; dispatcher apps depend here instead of importing the subagent runtime app."
lifecycle.stage = "scaffolded"
introducing_ip = "M01-P17-IP-009"

[dependencies]
intelligence-subagent-runtime-kernel = { path = "../subagent-runtime-kernel" }

[lib]
name = "intelligence_subagent_runtime_usecase"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
