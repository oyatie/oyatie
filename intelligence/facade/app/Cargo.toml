[package]
name = "intelligence-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# OAuth subscription-pool app crate (ADR-0384 Path B, Stage-6).
# Composition + binary entry-point for the intelligence-app µservice.
# Wires:
#   kernel (pool + AuthzGate seam) + Cedar adapter + REST adapter + in-process stubs
#   into build_app() -> Arc<AppState>, then serves the axum router via tokio::main.
#
# Real OpenBao adapter and ClickHouse/Valkey sinks are Stage-7 items.

[[bin]]
name = "intelligence-app"
path = "src/main.rs"

[lib]
name = "intelligence_app"
path = "src/lib.rs"
doctest = false

[dependencies]
shared-olap-clickhouse-adapter = { path = "../../../data/adapters/olap-clickhouse" }
intelligence-kernel = { path = "../../core/kernel" }
intelligence-rest = { path = "../../adapters/rest" }
intelligence-authz-cedar-adapter = { path = "../../adapters/authz-cedar-adapter" }
intelligence-openbao-adapter = { path = "../../adapters/openbao-adapter" }
intelligence-eventsink-clickhouse-adapter = { path = "../../adapters/eventsink-clickhouse-adapter" }
intelligence-eventsink-valkey-adapter = { path = "../../adapters/eventsink-valkey-adapter" }

tokio.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
