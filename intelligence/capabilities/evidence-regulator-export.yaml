# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-evidence:regulator-export:v1
name: regulator-export
namespace: foundry-evidence
display_name: Issue Framework-filtered Regulator Evidence Bundle
description: |
  Assemble + sign a regulator-grade evidence-pack bundle scoped to
  (tenant, framework, time-range). Framework ∈ {eu-ai-act, hipaa, gdpr,
  kr-pipa, soc2, iso-27001}. 2-person rule enforced via Cedar.
  Per PRD.md FR-06 + ADR-0131.

owner_team: axis-foundry-evidence + council-privacy
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0024, ADR-0028, ADR-0117, ADR-0131, ADR-0133]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/policy/regulator-export-scope.cedar
  - microservices/intelligence/policy/data-residency.md
  - microservices/intelligence/runbooks/regulator-export-reissue.md

autonomy_level: T3
# T3: external delivery to regulator; 2-person rule + DPA-recorded plan required.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: framework
    type: enum
    values: [eu-ai-act, hipaa, gdpr, kr-pipa, soc2, iso-27001]
    required: true
  - name: time_range_start
    type: timestamp
    required: true
  - name: time_range_end
    type: timestamp
    required: true
  - name: requester_principal
    type: string
    required: true
    description: SPIFFE ID of RegulatorExporter principal
  - name: approver_principal
    type: string
    required: true
    description: SPIFFE ID of distinct RegulatorExporter principal (2-person rule)
  - name: receiving_bucket_scc_id
    type: string
    required: true
  - name: dpa_export_plan_id
    type: string
    required: true
  - name: source_pack
    type: string
    required: true
  - name: engagement_id
    type: string
    required: false
  - name: supersedes_bundle_id
    type: string
    format: ulid
    required: false
    description: present for reissue per runbooks/regulator-export-reissue.md

outputs:
  - name: bundle_id
    type: string
    format: ulid
  - name: bundle_signature
    type: string
  - name: bundle_merkle_root
    type: string
  - name: pack_count
    type: integer
  - name: sealed_at
    type: timestamp
  - name: delivery_status
    type: enum
    values: [pending, delivered, failed]

data_classes_touched:
  - INTERNAL_ONLY
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_PIPA_ART23
  - PHI
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry_evidence.regulator_export.completed

cost_profile:
  type: per-bundle
  estimated_cost_usd_per_bundle: 0.10
  cost_drivers:
    - Postgres range scan (≤ 1 s per 10k packs)
    - Framework-profile field selection (≤ 200 ms per 10k packs)
    - audit-chain pack-set Merkle-bundling (≤ 2 s per 10k packs)
    - Ed25519 bundle signature (≤ 50 ms; HSM via audit-chain bridge)
    - S3 export-bucket upload (variable; depends on bundle size)

cedar_policy_fragments:
  - microservices/intelligence/policy/regulator-export-scope.cedar
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/data-residency.md

framework_profiles:
  eu-ai-act:
    required_fields:
      [invocation_id, agent_id, capability_id, model_version, provider,
       autonomy_level_decision, autonomy_level_rationale_hash,
       guardrail_decisions, eval_verdict_at_invocation, invocation_ts]
    citation_anchors: ["EU AI Act Art. 12 (logs)", "EU AI Act Art. 18 (technical documentation)", "EU AI Act Art. 26 (deployer obligations)"]
  hipaa:
    required_fields:
      [invocation_id, principal_spiffe_id, invocation_ts, capability_id,
       payload_data_class, prompt_payload_sha, output_payload_sha, audit_event_id]
    citation_anchors: ["HIPAA §164.312(b) audit controls", "HIPAA §164.308(a)(1)(ii)(D) information system activity review", "HIPAA §164.316(b)(2) retention"]
  gdpr:
    required_fields:
      [invocation_id, tenant_id, subject_hash, payload_data_class, invocation_ts,
       autonomy_level_decision, audit_event_id]
    citation_anchors: ["GDPR Art. 30 ROPA", "GDPR Art. 22 automated decision"]
  kr-pipa:
    required_fields:
      [invocation_id, tenant_id, subject_hash, payload_data_class, invocation_ts,
       audit_event_id, source_microservice]
    citation_anchors: ["KR PIPA Art. 29 safety measures", "KR PIPA Art. 23 sensitive information"]
  soc2:
    required_fields:
      [invocation_id, principal_spiffe_id, invocation_ts, capability_id,
       autonomy_level_decision, audit_event_id]
    citation_anchors: ["SOC 2 CC4.1 monitoring", "SOC 2 CC7.2 change management"]
  iso-27001:
    required_fields:
      [invocation_id, principal_spiffe_id, invocation_ts, capability_id,
       autonomy_level_decision, audit_event_id]
    citation_anchors: ["ISO 27001 A.5.28 access controls", "ISO 27001 A.8.15 logging"]

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/regulator-export-baseline.jsonl
  pass_threshold: 1.0  # framework-profile field-completeness is strict
  eval_metric: framework-profile-field-completeness
  cadence: per-release + per-framework-profile-change
  reference: EU AI Act + HIPAA + GDPR + KR PIPA + SOC 2 + ISO 27001 published text

sunset:
  status: none
  notes: ""
