id: cap:intelligence:context-aware-retrieval:v1
name: context-aware-retrieval
namespace: intelligence
display_name: Context-Aware Retrieval
description: |
  Retrieve tenant or personal knowledge only inside the caller's active
  context and consent graph grants.

owner_team: axis-intelligence
maturity: scaffolded
created_at: 2026-05-18
related_adrs: [ADR-0215, ADR-0220]
related_artifacts:
  - microservices/intelligence/contracts/openapi/intelligence.yaml
  - microservices/intelligence/contracts/proto/intelligence.proto
  - microservices/intelligence/policy/tenant-scope.cedar

autonomy_tier: T2
inputs:
  - name: principal_id
    type: string
    required: true
  - name: context_id
    type: string
    required: true
  - name: query
    type: string
    required: true
  - name: consent_grant_id
    type: string
    required: true

outputs:
  - name: retrieval_id
    type: string
  - name: citations
    type: array
  - name: refusal_reason
    type: string

data_classes_touched:
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFYING
  - PII_SENSITIVE
  - FINANCIAL
  - HEALTH
  - AUDIT

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar

evidence_topic: oya.intelligence.retrieval.context-bound
eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/context-aware-retrieval-canonicalen.jsonl
  pass_threshold: 1.0
  eval_metric: cross-context-refusal-correctness
  cadence: per-release
