# Oyatie Cloud Intelligence — capability catalog
#
# Design + research grounding: intelligence/PRD.md and
# intelligence/design/hyperscaler-best-practice-brief.md.
# Tiers/risk per the repo capability classification; policy_action references
# owned policy-engine actions. The current policy fixture is mapped by a
# transient authz adapter; slo_anchor references slos/*.openslo.yaml.
#
# Note on risk_class: the gateway brokers AI inference traffic and pooled provider
# credentials, so most data-plane capabilities are `high` (denial-of-wallet / sensitive
# information disclosure exposure per OWASP LLM10/LLM02, brief §5). Pure control-plane
# observability is `medium`.

microservice: cloud-intelligence
owner: council-foundry
introducing_phase: LLM-GATEWAY-PRODUCTION-DESIGN
research_brief: intelligence/design/hyperscaler-best-practice-brief.md

capabilities:
  - capability_id: cloud-intelligence.chat.completions
    capability_name: OpenAI-Compatible Chat Completions (stream + non-stream)
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Canonical OpenAI-shaped POST /v1/chat/completions with SSE byte-passthrough
      (data: [DONE] sentinel). AI inference egress path; carries tenant prompt/completion
      content (OWASP LLM02 exposure surface). Brief §1, §2.
    data_class: [TENANT_PRIVATE, AI_PROMPT, AI_COMPLETION]
    policy_action: InvokeChatCompletion
    realm: ingress
    slo_anchor: intelligence/observability/slos/ttft.openslo.yaml

  - capability_id: cloud-intelligence.embeddings
    capability_name: OpenAI-Compatible Embeddings
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Canonical POST /v1/embeddings over the same key-pool + failover ladder. Carries
      tenant input text. Brief §2.
    data_class: [TENANT_PRIVATE, AI_PROMPT]
    policy_action: InvokeEmbeddings
    realm: ingress
    slo_anchor: intelligence/observability/slos/end-to-end-latency.openslo.yaml

  - capability_id: cloud-intelligence.models.list
    capability_name: Model Discovery
    ip_anchor: IP-001
    tier: T2
    risk_class: minimal
    rationale: GET /v1/models aggregated across configured provider pools; no tenant content.
    data_class: [INTERNAL_ONLY]
    policy_action: ListModels
    realm: ingress
    slo_anchor: n/a

  - capability_id: cloud-intelligence.key-pool.state-machine
    capability_name: Key-Pool Failure→Blacklist→Jittered-Cooldown→Restore State Machine
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Pure kernel state machine (crates/oya-cloud-intelligence-kernel) — round-robin select,
      per-key failure-count blacklist threshold, jittered cooldown, lazy restore. Front-line
      denial-of-wallet / key-exhaustion control (OWASP LLM10). Brief §1, §10.
    data_class: [INTERNAL_ONLY]
    policy_action: n/a
    realm: internal
    slo_anchor: intelligence/observability/slos/availability.openslo.yaml
    surface_evidence:
      - crates/oya-cloud-intelligence-kernel/src/lib.rs

  - capability_id: cloud-intelligence.failover.ladder
    capability_name: In-Key-Retry → Rotate → Provider-Fallback → Graceful-503 Failover Ladder
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Bounded idempotent retry on transient statuses (never past first streamed token), key
      rotation, provider fallback, then OpenAI-shaped 503 + Retry-After. Honors upstream
      Retry-After. Brief §1, §10.
    data_class: [INTERNAL_ONLY]
    policy_action: n/a
    realm: internal
    slo_anchor: intelligence/observability/slos/error-rate.openslo.yaml

  - capability_id: cloud-intelligence.tenant.budgets
    capability_name: Per-Tenant Key Pools + Concurrent Token Budgets
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Per-tenant key pool isolation; limits keyed on tenant id; concurrent budget windows;
      80% soft-warn then 429 budget_exceeded; reserved headroom vs shared provider TPM.
      Brief §6, §8.
    data_class: [TENANT_PRIVATE, BILLING]
    policy_action: InvokeChatCompletion
    realm: ingress
    slo_anchor: n/a

  - capability_id: cloud-intelligence.secrets.secret-provider
    capability_name: Owned Secret-Provider Key Store (handle-only, periodic refresh)
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Provider keys resolve ONLY through owned secret-provider/KMS handles,
      in-memory only, never from disk/env, never logged. Kernel sees only a hash
      fingerprint. Brief §5, §7.
    data_class: [SECRET_REFERENCE]
    policy_action: RefreshKeyPool
    realm: admin
    slo_anchor: n/a
    surface_evidence:
      - crates/oya-cloud-intelligence-rest/src/keystore.rs

  - capability_id: cloud-intelligence.auth.two-realm
    capability_name: Two Constant-Time Auth Realms (admin + ingress)
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      Admin and ingress bearer tokens compared in constant time (subtle). Cross-realm
      default-deny via owned policy-engine port. Brief §2, §5.
    data_class: [SECRET_REFERENCE]
    policy_action: n/a
    realm: both
    slo_anchor: n/a
    surface_evidence:
      - crates/oya-cloud-intelligence-rest/src/auth.rs

  - capability_id: cloud-intelligence.audit.emission
    capability_name: Bedrock-Shaped Immutable Audit + Low-PII Metering Emission
    ip_anchor: IP-001
    tier: T2
    risk_class: high
    rationale: >-
      llm.audit.v1 (immutable, 100%, hash-chained into evidence/audit-chain.jsonl,
      alert-if-disabled) + llm.usage.v1 (sampleable metering). Prompt/completion bodies
      default-OFF, opt-in body-spill to residency-pinned bucket. Brief §3, §7, §9.
    data_class: [AUDIT_INTERNAL, BILLING]
    policy_action: ReadAudit
    realm: admin
    slo_anchor: intelligence/observability/slos/completeness.openslo.yaml

  - capability_id: cloud-intelligence.admin.pool-status
    capability_name: Admin Pool Status + Key Refresh
    ip_anchor: IP-001
    tier: T2
    risk_class: medium
    rationale: >-
      GET pool status (hash-only fingerprints, active/blacklisted counts, soonest restore) +
      POST force-refresh. Admin realm only. Brief §10.
    data_class: [INTERNAL_ONLY]
    policy_action: ReadPoolStatus
    realm: admin
    slo_anchor: n/a

  - capability_id: cloud-intelligence.observability.metrics
    capability_name: OTel/Prometheus Metrics + Hash-Only Structured Logging
    ip_anchor: IP-001
    tier: T2
    risk_class: medium
    rationale: >-
      oya_cloud_intelligence_* metrics (per-key success/failure, retries, upstream-latency
      histogram, ttft histogram, active-key gauge, per-tenant token counters); logs identify
      keys only by fingerprint, never raw key/prompt/completion. Brief §4, §5.
    data_class: [INTERNAL_ONLY]
    policy_action: n/a
    realm: internal
    slo_anchor: intelligence/observability/slos/availability.openslo.yaml
    surface_evidence:
      - crates/oya-cloud-intelligence-rest/src/metrics.rs
      - crates/oya-cloud-intelligence-rest/src/logging.rs
