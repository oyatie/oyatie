# Canonical-base: specs/capabilities/canonical-tier-schema.json
id: cap:intelligence:attribution:v1
name: attribution
namespace: intelligence
display_name: Attribution (citation rendering, source provenance)
description: |
  Extract citations from caller-supplied retrieval context (caller-side RAG per ADR-0255);
  render them as inline anchors in the output; emit provenance graph for the audit-tap record.

owner_team: axis-intelligence
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0255]

autonomy_tier: T1
eu_ai_act_risk_class: limited

inputs:
  - name: dispatch_outcome
    type: object
    required: true
  - name: caller_supplied_retrieval_context
    type: object
    required: false

outputs:
  - name: citations
    type: array
    schema: "[Citation]"

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - all packs

evidence_topic: intelligence/dispatch.completed

cost_profile:
  type: per-rendering
  estimated_cost_usd_per_call: 0.00002
  cost_drivers:
    - text-alignment scoring

cedar_policy_fragments:
  - microservices/intelligence/policy/dispatch-authorization.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/attribution-canonicalen.jsonl
  pass_threshold: 0.90
  eval_metric: citation-precision-recall
  cadence: per-release

sunset:
  status: none
