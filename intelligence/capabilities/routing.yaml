# Canonical-base: specs/capabilities/canonical-tier-schema.json
id: cap:intelligence:routing:v1
name: routing
namespace: intelligence
display_name: Model-router (per-pack provider selection)
description: |
  Select provider + model for a dispatch given tenant pack, audience, modality, cost-budget,
  provider-availability, provider-credential BYOK/platform-default credential kind (ADR-0255 §D-4), and EU AI Act / HIPAA / FedRAMP
  / KR-CSAP constraints.

owner_team: axis-intelligence
maturity: stable
created_at: 2026-05-20
related_adrs: [ADR-0255, ADR-0145]

autonomy_tier: T1
eu_ai_act_risk_class: minimal

inputs:
  - name: dispatch_envelope
    type: object
    required: true
  - name: provider_health_snapshot
    type: object
    required: true

outputs:
  - name: routing_decision
    type: object
    schema: RoutingDecision

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - AUDIT

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-us-federal
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa
  - pack-cn
  - pack-uk

evidence_topic: intelligence/routing.decided

cost_profile:
  type: per-evaluation
  estimated_cost_usd_per_call: 0.00001
  cost_drivers:
    - provider-health snapshot read

cedar_policy_fragments:
  - microservices/intelligence/policy/provider-routing.cedar
  - microservices/intelligence/policy/byok-gating.cedar

eval_set:
  canonicalen_inputs_path: microservices/intelligence/capabilities/eval/routing-canonicalen.jsonl
  pass_threshold: 1.0
  eval_metric: pack-conformance-1.0
  cadence: per-release

sunset:
  status: none
