# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:foundry-evidence:evidence-query:v1
name: evidence-query
namespace: foundry-evidence
display_name: Query Evidence Packs (per-tenant + per-invocation)
description: |
  Read per-invocation evidence packs by (tenant, time-range, optional filters).
  Cedar-gated; every read is itself audit-emitted via audit-chain
  (audit-of-audits) per Bominal ADR-0028 §"Self-observability". Per PRD.md
  FR-05 + FR-07; p99 ≤ 100 ms.

owner_team: axis-foundry-evidence
maturity: stable
created_at: 2026-05-17
related_adrs: [ADR-0028, ADR-0056, ADR-0131]
related_artifacts:
  - microservices/intelligence/PRD.md
  - microservices/intelligence/contracts/openapi/foundry-evidence.yaml
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/auditor-scope.cedar

autonomy_level: T1
# T1: read; emits its own audit event (audit-of-audits); never mutates pack data.

inputs:
  - name: tenant_id
    type: string
    pattern: '^tenant:[a-f0-9]{16}$'
    required: true
  - name: time_range_start
    type: timestamp
    required: true
  - name: time_range_end
    type: timestamp
    required: true
  - name: invocation_id
    type: string
    format: ulid
    required: false
  - name: agent_id
    type: string
    required: false
  - name: capability_id
    type: string
    required: false
  - name: autonomy_level
    type: enum
    values: [T0, T1, T2, T3]
    required: false
  - name: framework_filter
    type: enum
    values: [eu-ai-act, hipaa, gdpr, kr-pipa, soc2, iso-27001]
    required: false
  - name: include_superseded
    type: boolean
    required: false
    default: false
  - name: include_partial
    type: boolean
    required: false
    default: true
  - name: include_plaintext
    type: boolean
    required: false
    default: false
    description: |
      Plaintext returned only when Cedar policy/tenant-scope.cedar PERMIT 3 evaluates true:
      principal must carry sensitive_data_entitlement for the pack's payload_data_class.
  - name: cursor
    type: string
    required: false
  - name: limit
    type: integer
    required: false
    default: 100
    maximum: 1000

outputs:
  - name: items
    type: array
    schema_ref: oya-intelligence-evidence-evidence-query-domain::EvidencePack
  - name: next_cursor
    type: string
    nullable: true
  - name: read_audit_event_id
    type: string
    format: ulid
    description: audit-of-audits event_id emitted to audit-chain at read time

data_classes_touched:
  - INTERNAL_ONLY
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING
  - PII_QUASI_IDENTIFIER
  - SENSITIVE_PIPA_ART23
  - PHI
  - AUDIT
  # plaintext exposure additionally gated by sensitive_data_entitlements

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

evidence_topic: oya.foundry_evidence.read

cost_profile:
  type: per-query
  estimated_cost_usd_per_call: 0.000005
  cost_drivers:
    - Postgres B-tree lookup on (tenant_id, time_range, invocation_id)
    - Cedar evaluation (≤ 5 ms)
    - audit-of-audits emit to audit-chain (≤ 100 ms)
    - Optional plaintext fetch from substrate WORM (≤ 50 ms)

cedar_policy_fragments:
  - microservices/intelligence/policy/tenant-scope.cedar
  - microservices/intelligence/policy/auditor-scope.cedar
  - microservices/intelligence/policy/ci-scope.cedar

eval_set:
  baseline_inputs_path: microservices/intelligence/capabilities/eval/evidence-query-baseline.jsonl
  pass_threshold: 0.999
  eval_metric: query-correctness-and-cedar-refusal
  cadence: per-release
  reference: PRD.md FR-05 + FR-07; threat-model.md T-I-01..T-I-05

sunset:
  status: none
  notes: ""
