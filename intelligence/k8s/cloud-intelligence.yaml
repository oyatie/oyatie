apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-intelligence-control-plane
  namespace: cloud-intelligence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-intelligence-control-plane
  namespace: cloud-intelligence
rules:
  - apiGroups: ["intelligence-app.oyatie.io"]
    resources:
      - providerbackends
      - modelroutes
      - modelaliassets
      - promptprofiles
      - thinkingpolicies
      - subscriptionseats
      - wireprofiles
      - toolcompatibilityprofiles
      - gatewaycircuitbreakers
      - capabilityparitybaselines
      - agentruntimeprofiles
      - agentmemorybindings
      - agentskillbundles
      - agentschedules
      - agentdelegationpolicies
      - agentworkspacebindings
      - guardraildetectionprofiles
      - evidenceretentionprofiles
      - intransitredactionprofiles
      - safetysignalpolicies
      - manualreviewescalations
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-intelligence-control-plane
  namespace: cloud-intelligence
subjects:
  - kind: ServiceAccount
    name: cloud-intelligence-control-plane
    namespace: cloud-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-intelligence-control-plane
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: intelligence-app-gateway
  namespace: cloud-intelligence
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cloud-intelligence
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-intelligence-default-deny
  namespace: cloud-intelligence
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-controller
  namespace: cloud-intelligence
spec:
  replicas: 2
  selector: { matchLabels: { app: route-controller } }
  template:
    metadata: { labels: { app: route-controller } }
    spec:
      serviceAccountName: cloud-intelligence-control-plane
      containers:
        - name: route-controller
          image: registry.registry.svc.cluster.local:5000/cloud-intelligence:dev
          imagePullPolicy: Always
          env: [{ name: OYATIE_WORKER_KIND, value: route-controller }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
          livenessProbe: { httpGet: { path: /livez, port: 8080 } }
---
