  name: safety-enforcement-controller
  namespace: cloud-intelligence
spec:
  replicas: 2
  selector: { matchLabels: { app: safety-enforcement-controller } }
  template:
    metadata: { labels: { app: safety-enforcement-controller } }
    spec:
      serviceAccountName: cloud-intelligence-control-plane
      containers:
        - name: safety-enforcement-controller
          image: registry.registry.svc.cluster.local:5000/cloud-intelligence:dev
          env: [{ name: OYATIE_WORKER_KIND, value: safety-enforcement-controller }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
          livenessProbe: { httpGet: { path: /livez, port: 8080 } }
