# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-evidence-chain-integrity-correctness
  displayName: "foundry-evidence: chain integrity correctness 100% (bridges to audit-chain)"
  labels:
    microservice: foundry
    bounded_context: evidence
    sli_class: correctness
    tier: load-bearing-invariant
    plane: audit
    owner_team: axis-foundry-evidence + axis-audit-chain
    pack_scope: all
    invariant: INV-FOUNDRY-EVIDENCE-CHAIN-INTEGRITY
spec:
  service: foundry-evidence
  description: |
    Evidence chain integrity correctness SLO. An emitted evidence record
    is "good" when it lands in audit-chain with a verifying Merkle path
    AND a matching Ed25519 signature. Any evidence record without a
    chained audit-row = correctness violation. Target = 100%.
  indicator:
    metadata:
      name: foundry-evidence-chain-integrity-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_evidence_chain_verify_total{outcome="intact"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_evidence_chain_verify_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% evidence-chain integrity (no error budget; any miss is Sev-1)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
