# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-guardrails-shadow-mode-fp-budget
  displayName: "foundry-guardrails: shadow-mode false-positive budget < 1%"
  labels:
    microservice: foundry
    bounded_context: guardrails
    sli_class: correctness
    tier: internal-substrate
    plane: data
    owner_team: axis-foundry-guardrails + council-policy
    pack_scope: all
spec:
  service: foundry-guardrails
  description: |
    Guardrails shadow-mode false-positive budget SLO. A shadow-mode
    decision is "good" when it does NOT flag a known-good (baseline-labeled)
    invocation as a violation. FP rate < 1% before promoting shadow rule
    to enforced. Per ADR-0085 shadow-mode-before-enforce + ratchet policy.
  indicator:
    metadata:
      name: foundry-guardrails-shadow-fp-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_guardrails_shadow_decision_total{verdict_correct="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_guardrails_shadow_decision_total[5m]))
  objectives:
    - target: 0.99
      displayName: "≥ 99% correctness on baseline set (< 1% FP rate) over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
