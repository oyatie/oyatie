# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-eval-determinism-correctness
  displayName: "foundry-eval: deterministic-replay correctness 100% (load-bearing)"
  labels:
    microservice: foundry
    bounded_context: eval
    sli_class: correctness
    tier: load-bearing-invariant
    plane: control
    owner_team: axis-foundry-eval
    pack_scope: all
    invariant: INV-FOUNDRY-EVAL-DETERMINISM
spec:
  service: foundry-eval
  description: |
    Eval deterministic-replay correctness SLO. A re-run of the same eval
    set on the same model+seed+capability-version is "good" when its
    verdict matches the original. Any drift = load-bearing invariant
    failure (ratchet decisions are no longer reliable). Per ADR-0024
    deterministic-replay invariant. Target = 100%.
  indicator:
    metadata:
      name: foundry-eval-determinism-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_eval_replay_total{outcome="deterministic"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_eval_replay_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% replay-determinism (no error budget; any drift is Sev-1)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
