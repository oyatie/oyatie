apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-intelligence-availability
  displayName: "Cloud Intelligence Availability"
  labels:
    microservice: cloud-intelligence
    surface: ingress
    adr: "ADR-0373"
    research_brief: "microservices/cloud-intelligence/design/hyperscaler-best-practice-brief.md#4"
spec:
  service: cloud-intelligence
  description: |
    Availability = ratio of ingress responses that are NOT a 5xx and NOT a gateway-originated
    error (brief §4 — "ratio non-5xx/non-gateway-error"). A gateway-originated 503
    (gateway_key_exhausted / gateway_provider_unavailable) counts AGAINST availability because
    it is a gateway-capacity failure; a tenant 429 (budget/rate) does NOT (it is correct
    backpressure, recorded against the error-rate SLI's exclusion set instead).
  indicator:
    metadata: { name: non-error-ratio }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(cloud_intelligence_requests_total{
                  service="cloud-intelligence",code!~"5..",gateway_error="false"
                }[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(cloud_intelligence_requests_total{service="cloud-intelligence"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.9% availability"
      target: 0.999
  alertPolicies:
    - name: cloud-intelligence-availability-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-cloud-intelligence
          - target: opsgenie-cloud-intelligence
    - name: cloud-intelligence-availability-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: cloud-intelligence-availability-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: cloud-intelligence-availability-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
