# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-runtime-availability
  displayName: Foundry Runtime — Capability Dispatch Availability
  labels:
    microservice: foundry-runtime
    bc: capability-executor
    tenant_class: demo_trial,paid
spec:
  service: foundry-runtime
  description: |
    Fraction of capability-dispatch requests that complete without 5xx error. Measured against the
    capability-executor REST + gRPC surface. Excludes 4xx (tenant error) and 401/403 (auth) per
    Google SRE Workbook ch. 5 convention.
  indicator:
    metadata:
      name: dispatch-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_dispatch_requests_total{outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_dispatch_requests_total{outcome=~"success|server_error"}[5m]))
  objectives:
    - displayName: 99.95% monthly availability
      target: 0.9995
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
