# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-runtime-capability-registry-freshness
  displayName: Foundry Runtime — Capability Registry Cache Freshness
  labels:
    microservice: foundry-runtime
    bc: capability-registry-cache
    tenant_class: demo_trial,paid
spec:
  service: foundry-runtime
  description: |
    Capability registry cache freshness — fraction of time the local mirror is no more than 30s
    behind the foundry-supervisor source-of-truth. Per PRD §"Performance Targets" hot-reload ≤30s
    + FM-04 fail-graceful semantics.
  indicator:
    metadata:
      name: cache-freshness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_registry_cache_age_under_30s_seconds_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_registry_cache_observation_seconds_total[5m]))
  objectives:
    - displayName: 99.5% of time cache age ≤ 30s
      target: 0.995
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
