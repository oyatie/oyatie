# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-eval-run-latency
  displayName: "foundry-eval: eval-run latency p95 ≤ 5min for 100-case set"
  labels:
    microservice: foundry
    bounded_context: eval
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-foundry-eval
    pack_scope: all
spec:
  service: foundry-eval
  description: |
    Eval-run latency p95 SLO. A run is "good" when a 100-case eval set
    (deterministic-replay against fixed model+seed per ADR-0024) completes
    in ≤ 5min p95. Required for autonomous-pipeline ratchet decisions.
  indicator:
    metadata:
      name: foundry-eval-run-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_eval_run_duration_seconds_bucket{le="300"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_eval_run_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 5min per 100-case eval for 95% of windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
