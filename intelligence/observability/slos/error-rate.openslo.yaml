apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-intelligence-error-rate
  displayName: "Cloud Intelligence Error Rate"
  labels:
    microservice: cloud-intelligence
    surface: ingress
    adr: "ADR-0373"
    research_brief: "intelligence/design/hyperscaler-best-practice-brief.md#4"
spec:
  service: cloud-intelligence
  description: |
    Error-rate SLI (brief §4). "Good" = responses that are NOT a gateway-originated error.
    CRITICAL EXCLUSION (brief §4 "Adopt"): client-cancellations AND upstream-attributable
    429/Retry-After waits are EXCLUDED from the error budget and recorded separately — they
    are not gateway faults. Concretely the `good` set excludes outcome="client_cancelled" and
    outcome="upstream_rate_limited" from the denominator, so a provider rate-limit storm does
    not burn the gateway's error budget (it burns the provider's, surfaced via the per-provider
    breaker metrics).

    This SLI also distinguishes the gateway's OWN failure types (brief §10): gateway_key_exhausted
    vs gateway_provider_unavailable are both errors here, but are separately labeled so the
    runbooks (key-exhaustion vs provider-outage) can be driven independently.
  indicator:
    metadata: { name: non-gateway-error-ratio }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_cloud_intelligence_requests_total{
                  service="cloud-intelligence",gateway_error="false",
                  outcome!~"client_cancelled|upstream_rate_limited"
                }[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_cloud_intelligence_requests_total{
                  service="cloud-intelligence",
                  outcome!~"client_cancelled|upstream_rate_limited"
                }[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≤ 0.5% gateway-originated error rate (99.5% good)"
      target: 0.995
  alertPolicies:
    - name: cloud-intelligence-error-rate-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-cloud-intelligence
          - target: opsgenie-cloud-intelligence
    - name: cloud-intelligence-error-rate-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: cloud-intelligence-error-rate-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: cloud-intelligence-error-rate-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
