# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-runtime-dispatch-latency
  displayName: Foundry Runtime — Capability Dispatch Latency p99 ≤ 50ms
  labels:
    microservice: foundry-runtime
    bc: capability-executor
    tenant_class: demo_trial,paid
spec:
  service: foundry-runtime
  description: |
    Capability dispatch latency p99 — time from request acceptance at REST/gRPC boundary to first
    provider call dispatched. Excludes LLM round-trip latency (owned by foundry-providers SLO).
    Per PRD §"Performance Targets": p99 ≤50ms headline scalability requirement.
  indicator:
    metadata:
      name: dispatch-latency-p99
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_dispatch_latency_seconds_bucket{le="0.05"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_dispatch_latency_seconds_count[5m]))
  objectives:
    - displayName: 99% of dispatches ≤ 50ms over 30d
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
