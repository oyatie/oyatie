apiVersion: openslo/v1
kind: SLO
metadata:
  name: intelligence-app-end-to-end-latency
  displayName: "Cloud Intelligence End-to-End Latency (non-stream)"
  labels:
    microservice: intelligence-app
    surface: non-stream
    adr: "ADR-0373"
    research_brief: "microservices/intelligence-app/design/hyperscaler-best-practice-brief.md#4"
spec:
  service: intelligence-app
  description: |
    End-to-end latency SLI for NON-STREAMING responses (brief §4 — "End-to-end latency
    (non-stream)"). For streamed requests, TTFT (slos/ttft.openslo.yaml) is the right signal,
    so this SLI deliberately measures only stream="false" responses (chat completions without
    `"stream": true`, and all /v1/embeddings). Ratio of non-stream requests completing within
    the threshold.

    TARGET CAVEAT (brief §4): no official vendor SLO. p95 < 2000ms is a conservative starting
    hypothesis for the non-stream path (dominated by upstream provider completion time plus the
    gateway's failover overhead); replace with a measured baseline.
  indicator:
    metadata: { name: e2e-latency-p95 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(intelligence_app_request_duration_seconds_bucket{
                  service="intelligence-app",stream="false",outcome!="client_cancelled",le="2.0"
                }[5m])) by (operation)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(intelligence_app_request_duration_seconds_count{
                  service="intelligence-app",stream="false",outcome!="client_cancelled"
                }[5m])) by (operation)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "non-stream p95 < 2000ms (provisional — replace with measured baseline)"
      target: 0.95
  alertPolicies:
    - name: intelligence-app-e2e-latency-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-intelligence-app
          - target: opsgenie-intelligence-app
    - name: intelligence-app-e2e-latency-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: intelligence-app-e2e-latency-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: intelligence-app-e2e-latency-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
