# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-providers-availability-google
  displayName: "foundry-providers: Google (Gemini) adapter availability 99.5%"
  labels:
    microservice: foundry
    bounded_context: providers
    sli_class: availability
    tier: internal-substrate
    plane: data
    owner_team: axis-foundry-providers
    pack_scope: all
    provider: google
spec:
  service: foundry-providers
  description: |
    Google (Gemini)-provider availability SLO. A call is "good" when the
    foundry-providers Google adapter receives a non-5xx response within
    deadline. Provider-side 429 + 503 counted as bad. Matches Google
    Vertex AI public SLA target.
  indicator:
    metadata:
      name: foundry-providers-google-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_providers_call_total{provider="google",outcome="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_providers_call_total{provider="google"}[5m]))
  objectives:
    - target: 0.995
      displayName: "30d rolling Google availability ≥ 99.5%"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
