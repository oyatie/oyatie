# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: foundry-runtime-correctness
  displayName: Foundry Runtime — Invocation Correctness (No Autonomy Bypass; No Cross-Tenant)
  labels:
    microservice: foundry-runtime
    bc: capability-executor
    tenant_class: demo_trial,paid
spec:
  service: foundry-runtime
  description: |
    Correctness: zero autonomy-ceiling-violation that succeeded (i.e., dispatched despite ceiling
    refusal); zero cross-tenant data access events. Per PRD §"Acceptance Criteria" AC-04 + AC-06
    + threat-model T-E-01 + T-I-01.
  indicator:
    metadata:
      name: correctness-violation-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_invocations_total[5m]))
                  - sum(rate(oya_foundry_runtime_correctness_violation_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_runtime_invocations_total[5m]))
  objectives:
    - displayName: 100% correctness target (zero correctness violations)
      target: 1.0
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
