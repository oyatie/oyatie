apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-assist-draft-latency
spec:
  service: intelligence
  indicator:
    metadata:
      name: assist-draft-latency
    spec:
      ratioMetric:
        good:
          metricSource:
            query: sum(rate(oya_intelligence_assist_draft_duration_seconds_bucket{le="3"}[5m]))
        total:
          metricSource:
            query: sum(rate(oya_intelligence_assist_draft_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
