# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-evidence-emit-latency
  displayName: "foundry-evidence: evidence emit latency p95 ≤ 1s per record"
  labels:
    microservice: foundry
    bounded_context: evidence
    sli_class: latency
    tier: internal-substrate
    plane: audit
    owner_team: axis-foundry-evidence
    pack_scope: all
spec:
  service: foundry-evidence
  description: |
    Evidence emit latency p95 SLO. An evidence-emit (capability invocation
    record → seal-request → audit-chain ack) is "good" when it completes
    in ≤ 1s p95. Per PRD §"Performance Targets" evidence-bridge path.
  indicator:
    metadata:
      name: foundry-evidence-emit-latency-p95
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_evidence_emit_duration_seconds_bucket{le="1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_evidence_emit_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 1s for 95% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
