apiVersion: openslo/v1
kind: SLO
metadata:
  name: cloud-intelligence-ttft
  displayName: "Cloud Intelligence Time-To-First-Token (HEADLINE SLI)"
  labels:
    microservice: cloud-intelligence
    surface: chat-completions-stream
    sli_role: headline
    adr: "ADR-0373"
    research_brief: "microservices/cloud-intelligence/design/hyperscaler-best-practice-brief.md#4"
spec:
  service: cloud-intelligence
  description: |
    HEADLINE streaming SLI (brief §4): for a streaming gateway, total latency is the WRONG
    primary signal — time-to-first-token (TTFT) is. This SLO is the ratio of streamed
    /v1/chat/completions requests whose first SSE byte is emitted within the threshold.

    TARGET CAVEAT (brief §4): there is NO official vendor SLO for TTFT; published "good" ranges
    vary widely (~200ms–1s). The p95 < 1500ms target below is a CONSERVATIVE STARTING HYPOTHESIS
    to be replaced with a measured baseline once the gateway is live. Treat as provisional.

    EXCLUSIONS (brief §4): client-cancelled streams and upstream-attributable
    429/Retry-After waits are excluded from this budget and recorded separately (see
    slos/error-rate.openslo.yaml).
  indicator:
    metadata: { name: ttft-p95 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(cloud_intelligence_ttft_seconds_bucket{
                  service="cloud-intelligence",stream="true",outcome!="client_cancelled",le="1.5"
                }[5m])) by (provider)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(cloud_intelligence_ttft_seconds_count{
                  service="cloud-intelligence",stream="true",outcome!="client_cancelled"
                }[5m])) by (provider)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "TTFT p95 < 1500ms (provisional — replace with measured baseline)"
      target: 0.95
  alertPolicies:
    - name: cloud-intelligence-ttft-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-cloud-intelligence
          - target: opsgenie-cloud-intelligence
    - name: cloud-intelligence-ttft-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: cloud-intelligence-ttft-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: cloud-intelligence-ttft-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
