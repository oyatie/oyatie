# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-providers-circuit-breaker-correctness
  displayName: "foundry-providers: circuit-breaker correctness 100% (INV-CIRCUIT-BREAKER-BULKHEAD)"
  labels:
    microservice: foundry
    bounded_context: providers
    sli_class: correctness
    tier: load-bearing-invariant
    plane: data
    owner_team: axis-foundry-providers
    pack_scope: all
    invariant: INV-CIRCUIT-BREAKER-BULKHEAD
spec:
  service: foundry-providers
  description: |
    Circuit-breaker correctness SLO. When a provider crosses its failure-
    threshold, the breaker MUST trip within the declared window AND
    upstream calls MUST fail fast (no cascade). Per ADR-0086 bulkhead +
    circuit-breaker invariant. Target = 100% — any leak across an open
    breaker is a Sev-2 cascade-risk event.
  indicator:
    metadata:
      name: foundry-providers-cb-correctness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_providers_cb_trip_event_total{outcome="correct"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_foundry_providers_cb_trip_event_total[5m]))
  objectives:
    - target: 1.0
      displayName: "100% breaker correctness (any cascade-leak is Sev-2)"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
