apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-dispatch-api-latency
  displayName: "intelligence: dispatch-API server-side latency p99 < 250ms"
  labels:
    microservice: intelligence
    bounded_context: model-routing
    sli_class: latency
    tier: substrate
    plane: control
    owner_team: axis-intelligence
    pack_scope: all
spec:
  service: intelligence
  description: |
    Substrate-side latency (envelope admission → audit-tap commit; EXCLUDING provider response
    streaming time). Per ADR-0255 + capacity-model.md.
  indicator:
    metadata:
      name: intelligence-dispatch-server-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_dispatch_server_latency_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_dispatch_server_latency_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling: 99% of dispatches complete substrate-side within 250ms"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
