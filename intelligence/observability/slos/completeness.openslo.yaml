apiVersion: openslo/v1
kind: SLO
metadata:
  name: intelligence-app-completeness
  displayName: "Cloud Intelligence Stream Completeness"
  labels:
    microservice: intelligence-app
    surface: chat-completions-stream
    sli_role: streaming-unique
    adr: "ADR-0373"
    research_brief: "microservices/intelligence-app/design/hyperscaler-best-practice-brief.md#4"
spec:
  service: intelligence-app
  description: |
    STREAMING-UNIQUE SLI (brief §4 — "a streaming-unique Completeness SLI: [DONE]-terminated vs
    truncated"). A streamed /v1/chat/completions is COMPLETE when its SSE stream terminated with
    the `data: [DONE]` sentinel (or a provider-native finish_reason), and INCOMPLETE/TRUNCATED
    when the stream ended without it (e.g. the gateway aborted+rotated past a TTFT hard-timeout,
    or the upstream dropped mid-stream).

    This is the SLI the failure ladder's "never hang a stream" guarantee (brief §10) is measured
    against: an aborted-and-not-recovered stream is an incompleteness budget burn.

    EXCLUSION: client-initiated cancellations are NOT truncations (the client chose to stop) and
    are excluded from the denominator.
  indicator:
    metadata: { name: done-terminated-ratio }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(intelligence_app_stream_total{
                  service="intelligence-app",termination="done_sentinel"
                }[5m])) by (provider)
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(intelligence_app_stream_total{
                  service="intelligence-app",termination!="client_cancelled"
                }[5m])) by (provider)
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.5% of streams terminate with [DONE] (not truncated)"
      target: 0.995
  alertPolicies:
    - name: intelligence-app-completeness-burnrate-fastburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: fastburn }
            spec: { op: gte, threshold: 14.4, lookbackWindow: 1h, alertAfter: 2m }
        notificationTargets:
          - target: pagerduty-intelligence-app
          - target: opsgenie-intelligence-app
    - name: intelligence-app-completeness-burnrate-mediumburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: mediumburn }
            spec: { op: gte, threshold: 6.0, lookbackWindow: 6h, alertAfter: 15m }
    - name: intelligence-app-completeness-burnrate-slowburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: slowburn }
            spec: { op: gte, threshold: 3.0, lookbackWindow: 1d, alertAfter: 1h }
    - name: intelligence-app-completeness-burnrate-trickleburn
      kind: AlertPolicy
      spec:
        conditions:
          - kind: AlertCondition
            metadata: { name: trickleburn }
            spec: { op: gte, threshold: 1.0, lookbackWindow: 3d, alertAfter: 6h }
