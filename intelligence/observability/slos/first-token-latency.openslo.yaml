apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-intelligence-first-token-latency
  displayName: "intelligence: first-token latency p99 < 2.0s (consumer)"
  labels:
    microservice: intelligence
    bounded_context: model-routing
    sli_class: latency
    tier: substrate
    plane: data
    owner_team: axis-intelligence
    pack_scope: all
spec:
  service: intelligence
  description: |
    First-token latency for streaming dispatch (consumer audience). Includes substrate-side
    admission + provider first-byte. Per consumer-UX expectation.
  indicator:
    metadata:
      name: intelligence-first-token-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_first_token_latency_seconds_bucket{audience="consumer",le="2.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_intelligence_first_token_latency_seconds_count{audience="consumer"}[5m]))
  objectives:
    - target: 0.99
      displayName: "30d rolling: 99% of consumer first-tokens within 2.0s"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: oya-canonical-burn-rate-multi-window
