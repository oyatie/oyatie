# ECH (Encrypted Client Hello) configuration for intelligence µservice
# Authority: ADR-0253 §D row 12 — ECH enabled wherever platform terminates TLS
# RFC 9460 + draft-ietf-tls-esni-22
# Owner: ops-security + axis-intelligence
# Rotation cadence: ≥90 days (per docs/runbooks/cedar-fragment-emergency-rollback.md cadence)

apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligence-ech-config
  namespace: intelligence
  labels:
    app: oya-intelligence
    component: ech
    managed-by: oya-iac
  annotations:
    adr_ref: ADR-0253
    rotation_cadence_days: "90"
    enforcement_lane: oya-governance-adr-adherence-matrix
data:
  ech_enabled: "true"

  # ECH key rotation
  # Keys are stored in OpenBao at:
  #   ${openbao:secret/oyatie/intelligence/ech/active_key}
  #   ${openbao:secret/oyatie/intelligence/ech/pending_key}
  # Rotation triggers runbooks/sidecar-credential-handle-expired.md (adapted for ECH)
  ech_key_source: "openbao"
  ech_key_path: "secret/oyatie/intelligence/ech"
  ech_key_rotation_days: "90"

  # HTTPS RR DNS publishing
  # Per ADR-0253: publish HTTPS RR with ech= config in DNS via ADR-0273 DKIM/SPF/DMARC toolchain
  dns_https_rr_enabled: "true"
  dns_zone: "intelligence.api.oyatie.com"
  dns_ttl_seconds: "300"

  # Graceful degradation
  # ECH-disabled clients fall through to standard TLS 1.3 without breakage
  ech_graceful_degradation: "true"

  # Cell ingresses that serve ECH config-id
  cell_ingresses:
    - tier: "Tier-0"
      region: "us-east-1"
    - tier: "Tier-1"
      region: "eu-west-1"
    - tier: "Tier-1"
      region: "ap-northeast-2"
    - tier: "Tier-2"
      region: "ap-southeast-1"
    - tier: "Tier-3"
      region: "per-tenant"
