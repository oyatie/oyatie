# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base for the foundry-supervisor namespace, applied identically per-pack
# with pack-specific overlays for: residency region, retention overrides,
# OpenBao secret-reference URIs, replica scaling tier.
# Per ADR-0131 §"Foundry split" + multi-region.md DR posture.

namespace: foundry-supervisor

resources:
  - namespace.yaml
  - openbao-secret-references.yaml
  - spiffe-identities.yaml
  - service-mesh-tenant-headers.yaml

helmCharts:
  - name: oya-intelligence-supervisor-postgres
    valuesFile: ../../helm/postgres/values.yaml
    releaseName: postgres
    namespace: foundry-supervisor
  - name: oya-intelligence-supervisor-redis
    valuesFile: ../../helm/redis/values.yaml
    releaseName: redis
    namespace: foundry-supervisor
  - name: oya-intelligence-supervisor-controller
    valuesFile: ../../helm/supervisor-controller/values.yaml
    releaseName: supervisor
    namespace: foundry-supervisor

commonLabels:
  app.kubernetes.io/part-of: oya-intelligence-supervisor
  oyatie/microservice: foundry-supervisor
