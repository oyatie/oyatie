# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oya-intelligence-providers

# Base resources (per-pack overlays in iac/kustomize/overlays/<pack>/).
resources: []

# Common labels stamped on every resource.
commonLabels:
  app.kubernetes.io/part-of: oya-intelligence-providers
  oya.microservice: foundry-providers

# Per-pack overlays should:
# 1. Set namespace to oya-intelligence-providers-<pack>.
# 2. Override Helm values via kustomize-helm chart inflation.
# 3. Set residency.pack to the pack code.
# 4. Bind to per-pack OpenBao endpoint + per-pack KMS keyring.
# 5. Enable canary cohort weighting per ADR-0026 for in-house adapter.

helmCharts: []
