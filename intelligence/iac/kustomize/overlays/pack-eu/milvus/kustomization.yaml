# EU pack overlay for Milvus per ADR-0049 + ADR-0010. Pins region to
# eu-frankfurt; StrictEU residency.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: foundry-eu

resources: []

patches:
  - target:
      kind: MilvusCluster
      name: oya-intelligence-milvus
    patch: |
      - op: replace
        path: /spec/externalS3/region
        value: "eu-frankfurt"
      - op: replace
        path: /spec/externalS3/host
        value: "seaweedfs-s3-eu.observability-eu.svc.cluster.local"

labels:
  - includeSelectors: true
    pairs:
      oya.pack: "eu"
      oya.adr: "0010,0049,0192"
