# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
# foundry-eval pack-eu overlay
# Per policy/data-residency.md + EU AI Act + GDPR.
#
# Overrides for pack-eu deployment in OCI eu-frankfurt-1 (DR pair eu-amsterdam-1).
# - KMS keyring + S3 bucket region locked to EU.
# - Cross-region replication forbidden outside EU.
# - EU AI Act §15 + §17 evidence extended retention (6y per Art. 17(2) high-risk).
# - GDPR Arts. 44-50 cross-border transfer SCC required if invoked.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: foundry-eval

commonLabels:
  oya-pack-id: eu

commonAnnotations:
  oya-residency-region: eu-frankfurt-1
  oya-residency-dr-pair: eu-amsterdam-1
  oya-eu-ai-act-high-risk: "true"
  oya-eu-ai-act-section-15-retention-years: "6"
  oya-eu-ai-act-section-17-retention-years: "6"
  oya-gdpr-art-32-status: "verified"

patches:
  - target:
      kind: HelmRelease
      name: foundry-eval-clickhouse
    patch: |-
      - op: replace
        path: /spec/values/clickhouse/region
        value: eu-frankfurt-1
      - op: replace
        path: /spec/values/clickhouse/storage/storageClass
        value: oya-block-ssd-eu
  - target:
      kind: HelmRelease
      name: foundry-eval-baseline-store
    patch: |-
      - op: replace
        path: /spec/values/minio/serverSideEncryption/kmsKeyId
        value: alias/oya-intelligence-eval-kek-eu
      - op: replace
        path: /spec/values/minio/buckets/0/name
        value: oya-intelligence-eval-baselines-eu
      - op: replace
        path: /spec/values/minio/buckets/1/name
        value: oya-intelligence-eval-replay-eu
      - op: replace
        path: /spec/values/minio/buckets/0/lifecyclePolicies/0/transitions/0/days
        value: 90
      - op: replace
        path: /spec/values/minio/buckets/1/lifecyclePolicies/1/expiration/days
        value: 2190  # 6y for EU AI Act high-risk
  - target:
      kind: HelmRelease
      name: foundry-eval-postgres
    patch: |-
      - op: replace
        path: /spec/values/cluster/backup/barmanObjectStore/destinationPath
        value: s3://foundry-eval-postgres-backup-eu/
