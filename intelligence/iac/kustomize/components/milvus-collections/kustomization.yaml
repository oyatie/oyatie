# Reusable Kustomize component for per-tenant Milvus collection bootstrap
# per ADR-0192 §"Kustomize per-tenant collection bootstrap".
# Per-tenant CRs (MilvusDatabase / MilvusCollection / MilvusPartition) are
# emitted by overlays; this component declares the schema-template variant.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - database-template.yaml
  - collection-template.yaml
  - partition-template.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: milvus-collections
      app.kubernetes.io/part-of: oya-intelligence-milvus
      oya.adr: "0192"
