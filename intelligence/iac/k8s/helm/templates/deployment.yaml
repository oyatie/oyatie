{{- $imageDigest := .Values.image.digest | default "" -}}
{{- if and .Values.image.cosign.required (not (and (regexMatch "^sha256:[0-9a-f]{64}$" $imageDigest) (regexMatch "[1-9a-f]" (trimPrefix "sha256:" $imageDigest)))) -}}
{{- fail "image.digest must be set to a real non-zero sha256 digest when image.cosign.required=true" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.id | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0384: cloud-intelligence-path-b
    oyatie.com/cargo-package: {{ .Values.microservice.cargoPackage | quote }}
    oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
    oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
    oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
    oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
    oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
    oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
        oya.io/tenant-id: {{ .Values.workloadLabels.tenantId | quote }}
        oya.io/cost-center: {{ .Values.workloadLabels.costCenter | quote }}
        oya.io/workload-class: {{ .Values.workloadLabels.workloadClass | quote }}
        oya.io/regulatory-pack: {{ .Values.workloadLabels.regulatoryPack | quote }}
        oyatie.com/dogfood-substrate: {{ .Values.workloadLabels.dogfoodSubstrate | quote }}
        oyatie.com/product-goal: {{ .Values.workloadLabels.productGoal | quote }}
      annotations:
        cosign.sigstore.dev/required: {{ .Values.image.cosign.required | quote }}
        oyatie.com/image-digest: {{ $imageDigest | quote }}
        oyatie.com/image-promotion-policy: {{ .Values.image.cosign.policy | quote }}
        oyatie.com/audit-chain-event: "microservice-deployment"
        # Cosign annotation block per ADR-0181: require-signed-images Kyverno policy
        # The image reference below MUST be pinned by digest; tag is informational only.
        # Kyverno ClusterPolicy verify-image-signatures validates cosign.sigstore.dev/required="true"
        # and that the image digest matches a valid cosign signature in the Sigstore transparency log.
        oyatie.com/cosign-keyless-issuer: "https://accounts.google.com"
        oyatie.com/cosign-keyless-subject-regexp: "^sa-cloud-intelligence@oyatie\\.iam\\.gserviceaccount\\.com$"
    spec:
      runtimeClassName: {{ .Values.podRuntime.runtimeClassName | quote }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}{{- if $imageDigest }}@{{ $imageDigest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: OYATIE_CLOUD_INTEL_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: OYATIE_CLOUD_INTEL_TENANT_ID
              value: {{ .Values.config.tenantId | quote }}
            - name: OYATIE_CLOUD_INTEL_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: OYATIE_CLOUD_INTEL_INITIAL_SEATS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: initial_seats
                  optional: true
            - name: OYATIE_CLOUD_INTEL_TENANT_PROVIDER_POOLS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: tenant_provider_pools
                  optional: true
            - name: OYATIE_CLOUD_INTEL_SECRET_PROVIDER_URL
              value: {{ .Values.secretProvider.url | quote }}
            - name: OYATIE_MICROSERVICE
              value: {{ .Values.microservice.id | quote }}
            - name: OYATIE_CARGO_PACKAGE
              value: {{ .Values.microservice.cargoPackage | quote }}
            - name: OYATIE_IMAGE_PROMOTION_POLICY
              value: {{ .Values.config.imagePromotionPolicy | quote }}
            {{- if .Values.otel.enabled }}
            - name: OYATIE_OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: OYATIE_CLOUD_INTEL_SECRET_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: secret_provider_token
            - name: OYATIE_CLOUD_INTEL_CLICKHOUSE_URL
              value: {{ .Values.clickhouse.url | quote }}
            - name: OYATIE_CLOUD_INTEL_CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: OYATIE_CLOUD_INTEL_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: clickhouse_password
            - name: OYATIE_CLOUD_INTEL_ADMIN_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: admin_bearer_token
                  optional: true
            - name: OYATIE_CLOUD_INTEL_INGRESS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.secretName | quote }}
                  key: ingress_bearer_token
                  optional: true
            - name: OYATIE_CLOUD_INTEL_ANTHROPIC_AUTH_MODE
              value: {{ .Values.providerCompliance.anthropic.authMode | quote }}
            - name: OYATIE_CLOUD_INTEL_ANTHROPIC_OAUTH_STATUS
              value: {{ .Values.providerCompliance.anthropic.oauthStatus | quote }}
            - name: OYATIE_CLOUD_INTEL_CODEX_AUTH_MODE
              value: {{ .Values.providerCompliance.codex.authMode | quote }}
            - name: OYATIE_CLOUD_INTEL_CODEX_OAUTH_STATUS
              value: {{ .Values.providerCompliance.codex.oauthStatus | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
