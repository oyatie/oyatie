# External Secrets Operator resources for intelligence-app
# SecretStore projects launch-time handles from the owned cloud-secrets adapter.
# Binding ADRs: ADR-0296 (library-first credential sidecar), ADR-0384 (intelligence-app path-b)
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: intelligence-app-secret-provider-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0384: intelligence-app-path-b
spec:
  provider:
    # ESO currently uses the Vault-compatible provider shape for the backing
    # adapter; intelligence-app consumes only the owned secret-provider port.
    vault:
      server: {{ .Values.secretProvider.url | quote }}
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "intelligence-app-service-role"
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: intelligence-app-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0384: intelligence-app-path-b
  annotations:
    description: "Opaque secret-provider handles and launch tokens for intelligence-app gateway — elevated TTL 300s"
spec:
  refreshInterval: {{ .Values.secret.refreshInterval | quote }}
  secretStoreRef:
    name: intelligence-app-secret-provider-store
    kind: SecretStore
  target:
    name: {{ .Values.secret.secretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: secret_provider_token
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: secret_provider_token
    - secretKey: clickhouse_password
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: clickhouse_password
    - secretKey: admin_bearer_token
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: admin_bearer_token
    - secretKey: ingress_bearer_token
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: ingress_bearer_token
    # Handles only: provider credentials remain behind the owned secret-provider
    # / KMS port and are resolved by opaque handle at request time.
    - secretKey: initial_seats
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: initial_seats
    - secretKey: tenant_provider_pools
      remoteRef:
        key: {{ .Values.secret.providerPath | quote }}
        property: tenant_provider_pools
