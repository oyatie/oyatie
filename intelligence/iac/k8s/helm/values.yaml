microservice:
  id: cloud-intelligence
  cargoPackage: oya-cloud-intelligence-app
  tenantClass: contributor

replicaCount: 1

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-intelligence
  automountToken: false
  nonClaim: "static-promotion-manifest-only-no-live-sync"

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-intelligence
  tag: "0.1.0"
  # Replaced by scripts/build/build-and-push-cloud-intelligence.sh after image publish.
  # Operator action item per microservices/cloud-intelligence/runbooks/enroll-first-subscription.md step 0.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  tenantId: oyatie-dogfood
  imagePromotionPolicy: cosign-required

secretProvider:
  # Owned cloud-secrets/cloud-kms adapter endpoint. The concrete backing engine
  # is transient and hidden behind this port.
  url: https://cloud-secrets-adapter.cloud-secrets.svc.cluster.local:8200

clickhouse:
  url: http://clickhouse.analytics.svc:8123
  user: default

providerCompliance:
  anthropic:
    authMode: oauth_subscription
    # Production OAuth subscription proxying remains fail-closed until source
    # review/legal/provider evidence records APPROVED.
    oauthStatus: PENDING
  codex:
    authMode: api_key
    oauthStatus: API_ONLY

secret:
  providerPath: secret/oya/cloud-intelligence
  secretName: cloud-intelligence-secrets
  refreshInterval: 5m

gateway:
  enabled: true
  routeNameSuffix: proxy
  parentRef:
    name: oyatie-ingress-gateway
    namespace: istio-ingress
    sectionName: https
  hostnames:
    - cloud-intelligence.oyatie.com
  pathPrefixes:
    - /anthropic
    - /openai
    - /gemini
  nonClaim: "static-promotion-manifest-only-no-live-sync"
  openapiContract: microservices/cloud-intelligence/contracts/cloud-intelligence.openapi.yaml
  tlsTermination: edge-pqc
  echConfigRef: ech-config-intelligence
  pqcCertificateRef: pqc-cert-intelligence

networkPolicy:
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: istio-ingress
  egressSecretProviderNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: cloud-secrets

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

workloadLabels:
  tenantId: oyatie-dogfood
  costCenter: fd001-backbone
  workloadClass: app
  regulatoryPack: generic
  dogfoodSubstrate: oyatie-cloud
  productGoal: fd-001
