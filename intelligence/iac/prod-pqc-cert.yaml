# PQC (Post-Quantum Cryptography) hybrid certificate configuration
# Authority: ADR-0253 §D row 12 — PQC hybrid enabled where client+server pair both negotiate it
# KEM: X25519MLKEM768 (draft-kwiatkowski-tls-ecdhe-mlkem-02 + IANA codepoint 0x11ec)
# Signature: ed25519+ml_dsa_65 for new certificate chains issued by oyatie-rooted CAs
# Owner: ops-security
# Companion: docs/runbooks/cedar-fragment-emergency-rollback.md (key ceremony cadence)

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: intelligence-pqc-hybrid-cert
  namespace: intelligence
  labels:
    app: oya-intelligence
    component: pqc-cert
    managed-by: oya-iac
  annotations:
    adr_ref: ADR-0253
    enforcement_lane: oya-governance-adr-adherence-matrix
spec:
  secretName: intelligence-pqc-tls
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days before expiry
  subject:
    organizations:
      - oyatie
  commonName: intelligence.api.oyatie.com
  dnsNames:
    - intelligence.api.oyatie.com
    - intelligence-grpc.api.oyatie.com
  issuerRef:
    name: oyatie-pqc-cluster-issuer
    kind: ClusterIssuer
  privateKey:
    algorithm: Ed25519
    encoding: PKCS8
  # PQC hybrid negotiation
  # KEM: X25519MLKEM768; classical fallback: X25519 / P-256
  # Per ADR-0253: non-PQ clients fall through to classical curves without breakage
  # Never refuse a session because peer lacks PQC (adoption-curve principle)
  keystores:
    pkcs12:
      create: false
  additionalOutputFormats:
    - type: DER

---
# PQC TLS profile for Envoy / ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligence-pqc-tls-profile
  namespace: intelligence
  labels:
    app: oya-intelligence
    component: pqc-tls-profile
  annotations:
    adr_ref: ADR-0253
data:
  tls_min_version: "TLSv1.3"
  # Cipher suites: AEAD-only; no CBC, no RC4, no 3DES
  cipher_suites: >
    TLS_AES_256_GCM_SHA384,
    TLS_CHACHA20_POLY1305_SHA256,
    TLS_AES_128_GCM_SHA256
  # KEM preferences: PQC hybrid first, classical fallback
  kem_preferences: >
    X25519MLKEM768,
    X25519,
    P-256
  # Signature preferences: PQC hybrid first
  signature_preferences: >
    ed25519+ml_dsa_65,
    Ed25519,
    ECDSA-P256-SHA256
  hsts_max_age: "63072000"
  hsts_include_subdomains: "true"
  hsts_preload: "true"
  certificate_transparency_required: "true"
  ocsp_stapling: "true"
  no_insecure_skip_verify: "true"
  no_mitm_bypass_headers: "true"
