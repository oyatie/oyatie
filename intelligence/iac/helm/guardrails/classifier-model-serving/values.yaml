classifierModelServing:
  image:
    registry: docker.io
    repository: oyatie/classifier-model-serving
    tag: "v1.18.0"          # ONNX Runtime server LTS pin per docs/standards/lts-versions-verified.md
    pullPolicy: IfNotPresent
  models:
    - id: pii-phi
      version: "2026.05.17"
      sha: "${MODEL_PII_PHI_SHA}"
      cosignKey: "${openbao:secret/foundry-guardrails/cosign/pack-${PACK}-pub}"
      modelArtifactUri: "s3://foundry-guardrails-${PACK}-models/pii-phi/${MODEL_PII_PHI_VERSION}.onnx"
      replicas: 4
      status: enforce       # shadow | enforce | sunsetted
    - id: jailbreak
      version: "2026.05.17"
      sha: "${MODEL_JAILBREAK_SHA}"
      cosignKey: "${openbao:secret/foundry-guardrails/cosign/pack-${PACK}-pub}"
      modelArtifactUri: "s3://foundry-guardrails-${PACK}-models/jailbreak/${MODEL_JAILBREAK_VERSION}.onnx"
      replicas: 4
      status: enforce
    - id: content-safety
      version: "2026.05.17"
      sha: "${MODEL_CONTENT_SAFETY_SHA}"
      cosignKey: "${openbao:secret/foundry-guardrails/cosign/pack-${PACK}-pub}"
      modelArtifactUri: "s3://foundry-guardrails-${PACK}-models/content-safety/${MODEL_CONTENT_SAFETY_VERSION}.onnx"
      replicas: 4
      status: enforce
    - id: ai-slop
      version: "2026.05.17"
      sha: "${MODEL_AI_SLOP_SHA}"
      cosignKey: "${openbao:secret/foundry-guardrails/cosign/pack-${PACK}-pub}"
      modelArtifactUri: "s3://foundry-guardrails-${PACK}-models/ai-slop/${MODEL_AI_SLOP_VERSION}.onnx"
      replicas: 4
      status: enforce
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  cosignIntegrityCheck:
    enabled: true            # MANDATORY per policy/tenant-isolation.md TI-13
    initContainer:
      image:
        registry: docker.io
        repository: sigstore/cosign
        tag: "v2.4.0"
      script: /scripts/init-verify.sh
  metrics:
    enabled: true
    port: 9100
  serviceAccount:
    create: true
    name: foundry-guardrails-classifier-model-serving
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  networkPolicy:
    enabled: true
    allowFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/part-of: oya-intelligence-guardrails
    denyEgressTo:
      - cidrs: ["0.0.0.0/0"]
    egressAllowList:
      - host: "objectstorage.${REGION}.oraclecloud.com"
        port: 443                 # model artifact fetch only at startup
      - port: 9100
  service:
    type: ClusterIP
    port: 8000
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  hpa:
    enabled: true
    minReplicas: 4
    maxReplicas: 200
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
      - type: Pods
        pods:
          metric:
            name: foundry_guardrails_classifier_request_duration_seconds_p99
          target:
            type: AverageValue
            averageValue: "40m"  # 40ms; SLI guard against p99 > 80ms
