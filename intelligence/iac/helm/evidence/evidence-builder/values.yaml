# Helm values for the foundry-evidence evidence-builder stack.
# Five Deployments composed from the single oya-intelligence-evidence-evidence-pack-builder-app binary
# with role-flagged entrypoints:
#   - recorder-rest      (sync receipt API)
#   - pack-builder-worker (signal aggregation + pack assembly)
#   - audit-chain-bridge (substrate emit; sole cross-µservice path)
#   - regulator-export-worker (framework-filtered bundle assembly)
#   - archive-cascade-worker (hot→warm→cold)
# All Deployments share the same binary image; differ by entrypoint args + replicas.

image:
  repository: ocir.oyatie.com/foundry-evidence/evidence-builder
  tag: "1.0.0"  # LTS pin; matches oya-intelligence-evidence-evidence-pack-builder-app crate version
  pullPolicy: IfNotPresent
  pullSecret: ocir-pull

serviceAccount:
  create: true
  name: foundry-evidence
  spiffe:
    enabled: true
    socket: "/run/spire/sockets/agent.sock"

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

deployments:
  recorderRest:
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 24
      targetCPUUtilizationPercentage: 70
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 2, memory: 2Gi}
    pdb:
      minAvailable: 2
    listen: 8080
  packBuilderWorker:
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 24
      customMetrics:
        - type: External
          external:
            metricName: oya_foundry_evidence_pack_assembly_queue_depth
            target: 1000
    resources:
      requests: {cpu: 1, memory: 1Gi}
      limits: {cpu: 4, memory: 4Gi}
    pdb:
      minAvailable: 2
  auditChainBridge:
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      customMetrics:
        - type: External
          external:
            metricName: oya_foundry_evidence_audit_chain_emit_backlog_depth_seconds
            target: 30
    resources:
      requests: {cpu: 500m, memory: 256Mi}
      limits: {cpu: 2, memory: 1Gi}
    pdb:
      minAvailable: 2
  regulatorExportWorker:
    replicas: 2  # isolated pool per failure-modes.md FM-T-D-05
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 2, memory: 2Gi}
  archiveCascadeWorker:
    replicas: 1  # leader-elected
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: 1, memory: 1Gi}
    cronSchedule: "0 3 * * *"  # daily at 03:00 pack-local

config:
  postgres:
    secretRef: foundry-evidence-postgres
    pool:
      maxConnections: 25
      idleTimeoutSeconds: 60
    roles:
      writer: foundry_evidence_writer
      reader: foundry_evidence_reader
      retentionCascader: foundry_evidence_retention_cascader
  auditChainBridge:
    endpoint: "https://audit-chain.{{ .Values.pack }}.internal"
    retry:
      maxAttempts: 8
      initialBackoffMs: 100
      maxBackoffMs: 30000
    deadLetterBucket: "foundry-evidence-deadletter-{{ .Values.pack }}"
  s3:
    deadLetterBucket: "foundry-evidence-deadletter-{{ .Values.pack }}"
    region: "{{ .Values.packRegion }}"
  cedar:
    policyDir: "/etc/foundry-evidence/policy"
  observability:
    promExporterPort: 9091
    otelEndpoint: "http://opentelemetry-collector.observability.svc:4317"
  rateLimits:
    perTenantSustainedInvPerSec: 10000
    perTenantPeakInvPerSec: 40000
    perSourceMicroserviceGlobalInvPerSec: 100000
    perTenantEvidenceQueryQps: 1000
    perEngagementConcurrentBundles: 10

# Pack-specific overlay supplies pack + packRegion + pack-local retention windows.
pack: pack-kr
packRegion: ap-seoul-1

networkPolicies:
  enabled: true
  allowEgressTo:
    - audit-chain.{{ .Values.pack }}.svc.cluster.local
    - workflow-events.foundry-evidence.svc.cluster.local
    - foundry-evidence-postgres.foundry-evidence.svc.cluster.local
    - opentelemetry-collector.observability.svc.cluster.local
    - object-storage.{{ .Values.packRegion }}.oci.oraclecloud.com
