apiVersion: v2
name: foundry-evidence-evidence-blob-store
description: |
  Cross-µservice IAM subscription that grants foundry-evidence the read-side
  access to the audit-chain-owned WORM bucket. foundry-evidence does NOT own
  its own WORM; substrate WORM is owned by audit-chain µservice per ADR-0131.
  Also provisions a small foundry-evidence-owned dead-letter bucket and a
  regulator-export staging bucket (NOT WORM; ephemeral; lifecycle ≤ 7 days).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords: [foundry-evidence, blob-store, audit-chain-bridge, dead-letter, regulator-export-staging]
home: https://github.com/oyatie/oyatie/tree/main/microservices/intelligence-evidence
maintainers:
  - name: axis-foundry-evidence
    email: axis-foundry-evidence@oyatie.com
annotations:
  oyatie.dev/microservice: foundry-evidence
  oyatie.dev/lts-pinned: "true"
