# oya-intelligence-providers-redis Helm values

redis:
  image:
    tag: "7.4.1"   # LTS pin
  architecture: replication
  sentinel:
    enabled: true
    quorum: 2
  auth:
    enabled: true
    existingSecret: ""   # password resolved via OpenBao SecretReference at app startup
  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: oci-bv-ha
    resources:
      requests: {cpu: "200m", memory: "512Mi"}
      limits: {cpu: "1000m", memory: "1Gi"}
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 5Gi
      storageClass: oci-bv-ha
    resources:
      requests: {cpu: "200m", memory: "512Mi"}
      limits: {cpu: "1000m", memory: "1Gi"}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: oya-observability

residency:
  pack: ""   # set per-overlay
