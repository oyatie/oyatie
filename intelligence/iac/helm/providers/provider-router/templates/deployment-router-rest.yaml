apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-intelligence-providers-router-rest
  labels:
    app.kubernetes.io/name: oya-intelligence-providers-router-rest
    app.kubernetes.io/part-of: oya-intelligence-providers
    oya.microservice: foundry-providers
spec:
  replicas: {{ .Values.router-rest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oya-intelligence-providers-router-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oya-intelligence-providers-router-rest
        spiffe.io/identity: "spiffe://oyatie.dev/foundry-providers/router-rest/pack/{{ .Values.residency.pack }}"
      annotations:
        # Istio mTLS STRICT enforced at namespace level via PeerAuthentication
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: oya-intelligence-providers-router-rest
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router-rest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: internal
          env:
            - name: OYA_PACK
              value: "{{ .Values.residency.pack }}"
            - name: OYA_POSTGRES_ENDPOINT
              value: "{{ .Values.postgres.endpoint }}"
            - name: OYA_POSTGRES_PASSWORD_SECRET_REFERENCE
              value: "{{ .Values.postgres.passwordSecretReference }}"
            - name: OYA_REDIS_ENDPOINT
              value: "{{ .Values.redis.endpoint }}"
            - name: OYA_REDIS_PASSWORD_SECRET_REFERENCE
              value: "{{ .Values.redis.passwordSecretReference }}"
            - name: OYA_OPENBAO_AGENT_SOCKET
              value: "{{ .Values.openbao.agent.socketPath }}"
            - name: OYA_OTEL_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"
            - name: OYA_NATS_ENDPOINT
              value: "{{ .Values.eventEmission.nats.endpoint }}"
          resources:
            {{- toYaml .Values.router-rest.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /internal/ready, port: 9090}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /internal/healthz, port: 9090}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: openbao-agent-sock
              mountPath: /var/run/openbao
              readOnly: true
        - name: openbao-agent
          image: "{{ .Values.openbao.agent.image }}"
          args:
            - "agent"
            - "-config=/etc/openbao/agent.hcl"
          volumeMounts:
            - name: openbao-agent-sock
              mountPath: /var/run/openbao
            - name: openbao-agent-config
              mountPath: /etc/openbao
              readOnly: true
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
      volumes:
        - name: openbao-agent-sock
          emptyDir: {}
        - name: openbao-agent-config
          configMap:
            name: oya-intelligence-providers-openbao-agent-config
      affinity:
        podAntiAffinity:
          {{- toYaml .Values.router-rest.podAntiAffinity | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: oya-intelligence-providers-router-rest
  labels:
    app.kubernetes.io/name: oya-intelligence-providers-router-rest
    app.kubernetes.io/part-of: oya-intelligence-providers
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oya-intelligence-providers-router-rest
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: internal
