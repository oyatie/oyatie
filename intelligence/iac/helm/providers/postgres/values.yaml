# oya-intelligence-providers-postgres Helm values
# Per-pack override in iac/kustomize/overlays/<pack>/postgres-values.yaml

postgresql:
  image:
    tag: "16.4.0"   # LTS pin
  architecture: replication
  auth:
    existingSecret: ""   # NOTE: passwords resolved via OpenBao SecretReference at app startup;
                         # this chart does NOT manage app passwords.
    enablePostgresUser: true
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: oci-bv-ha
    resources:
      requests: {cpu: "1000m", memory: "2Gi"}
      limits: {cpu: "2000m", memory: "4Gi"}
    pgHbaConfiguration: |
      local   all             all                                     trust
      host    all             all             0.0.0.0/0               scram-sha-256
      host    replication     all             0.0.0.0/0               scram-sha-256
  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 50Gi
      storageClass: oci-bv-ha
    resources:
      requests: {cpu: "1000m", memory: "2Gi"}
      limits: {cpu: "2000m", memory: "4Gi"}
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"   # 02:00 UTC daily
      storage:
        existingClaim: oya-intelligence-providers-postgres-backups
        size: 200Gi
        storageClass: oci-bv-archive
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: oya-observability

residency:
  pack: ""   # set per-overlay; encryption-at-rest key from per-pack KMS keyring

extraDatabases:
  - name: providers
    owner: providers_app
