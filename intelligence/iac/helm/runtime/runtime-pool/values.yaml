# Foundry Runtime pool — per-pack XS tier baseline per capacity-model.md
# Verify against capacity-model.md formulae before changing replica counts.

global:
  pack: pack-kr  # overridden by kustomize overlay
  imageRegistry: oyatie-internal.registry/foundry-runtime
  imageTag: "1.0.0"  # LTS pin

# Per-component resourceTier (canonical-base: oya.resourceRequests dispatcher).
# Tier letters resolve to canonical CPU/memory grids in
# microservices/governance/iac/helm/_oya-helpers/templates/_helpers.tpl.

# capability-executor-app
capabilityExecutor:
  replicas: 4
  resourceTier: L
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: true
    seccompProfile: { type: RuntimeDefault }
    capabilities: { drop: ["ALL"] }
  appArmorProfile: runtime/default
  autoscaling:
    enabled: true
    minReplicas: 3        # HA quorum
    maxReplicas: 200      # per capacity-model.md ceiling
    targetCPUUtilizationPercentage: 70

# invocation-orchestrator-app + worker
invocationOrchestrator:
  app:
    replicas: 2
    resourceTier: M
  worker:
    replicas: 2
    resourceTier: M

# runtime-pool-app + worker + pool warm pods
runtimePool:
  app:
    replicas: 2
    resourceTier: M
  worker:
    replicas: 2
    resourceTier: M
  warmPods:
    baseline: 8
    maxBurst: 100         # HPA ceiling per capacity-model.md
    coldStartBudgetMs: 500  # ADR-0020

# session-state-app
sessionState:
  replicas: 2
  resourceTier: L

# capability-registry-cache-app + worker
capabilityRegistryCache:
  app:
    replicas: 2
    resourceTier: M   # in-memory cache headroom (tier M: req 500m/1Gi, lim 2/4Gi)
  worker:
    replicas: 2
    resourceTier: M

# Pod-baseline security per runtime-isolation.md TI-11
podBaseline:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  seccompProfile: { type: RuntimeDefault }
  appArmorProfile: runtime/default
  capabilities: { drop: ["ALL"] }
  automountServiceAccountToken: false  # SPIRE injects SVID via spiffe-helper

# Istio mesh integration (per runtime-isolation.md TI-10)
istio:
  mtls: STRICT  # MANDATORY per policy/runtime-isolation.md TI-10
  authorizationPolicy:
    # Refuse non-sibling SPIFFE identities
    allowedSiblings:
      - "spiffe://oyatie/foundry-providers/*"
      - "spiffe://oyatie/foundry-guardrails/*"
      - "spiffe://oyatie/foundry-evidence/*"
      - "spiffe://oyatie/foundry-supervisor/*"
      - "spiffe://oyatie/tenancy/*"
      - "spiffe://oyatie/workflow-engine/*"
      - "spiffe://oyatie/ops-portal/*"

# NetworkPolicy default-deny + sibling-allowlist
networkPolicy:
  defaultDeny: true
  allowSiblings:
    - foundry-providers
    - foundry-guardrails
    - foundry-evidence
    - foundry-supervisor
    - tenancy
  allowInfrastructure:
    - oya-intelligence-runtime-redis  # in-cluster
    - oya-intelligence-runtime-postgres  # in-cluster

# OpenBao SecretReference materialisation
openBao:
  enabled: true
  secretReferences:
    - { name: redis-auth,         path: "secret/foundry-runtime/redis/auth" }
    - { name: postgres-creds,     path: "secret/foundry-runtime/postgres/creds" }
    - { name: spire-trust-bundle, path: "secret/foundry-runtime/spire/trust-bundle" }
    - { name: supervisor-pubkey,  path: "secret/foundry-runtime/supervisor-pubkey/ed25519" }
    - { name: tenancy-pubkey,     path: "secret/foundry-runtime/tenancy-pubkey/ed25519" }
