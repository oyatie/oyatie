redis-cluster:
  image:
    tag: "7.4.0"  # LTS pin
  cluster:
    nodes: 12      # 6 shards × (1 primary + 1 replica)
    replicas: 1    # replicas per shard
  auth:
    enabled: true
    usePassword: true
    existingSecret: "${openbao:secret/foundry-runtime/redis/auth}"
    existingSecretPasswordKey: password
  tls:
    enabled: true
    authClients: true
    existingSecret: foundry-runtime-redis-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    certCAFilename: ca.crt
  persistence:
    enabled: true
    size: 50Gi    # AOF + RDB per shard
    storageClass: oci-bv  # OCI block-volume
  metrics:
    enabled: true  # Prometheus exporter
  # ACL declared in expected-acl.txt; validated via oya-check-session-prefix-isolation
  configmap: |
    # ACL configuration (per policy/runtime-isolation.md TI-02)
    aclfile /etc/redis/acl/acl.conf
    # MANDATORY: default user disabled per TI-02
    user default off
    # Per-tenant role declared dynamically by control plane on tenant onboarding;
    # commands restricted to GET / SET / DEL / SCAN / MGET / MSET / EXPIRE on
    # prefix-scoped keys.
    requirepass <materialised-from-openbao>
    # Cluster discovery
    cluster-enabled yes
    cluster-config-file /data/cluster.conf
    cluster-node-timeout 5000
    # AOF + RDB
    appendonly yes
    appendfsync everysec
    # Memory + eviction
    maxmemory 4gb
    maxmemory-policy allkeys-lru
