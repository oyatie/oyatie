# PrometheusRule — Milvus burn-rate SLO alerts per ADR-0186 Stage 5
# (4-window burn-rate from ADR-0139). Source-of-truth is the OpenSLO
# manifest at microservices/intelligence/slos/milvus.openslo.yaml; this is
# the sloth-compiled output.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oya-intelligence-milvus-slo
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: observability
    oya.adr: "0139,0186,0192"
spec:
  groups:
    - name: oya-intelligence-milvus.slo.search-latency.4-window
      interval: 30s
      rules:
        # SLO target: 99% of search requests <30ms (hot HNSW path per ADR-0192).
        # 4-window burn rates per ADR-0139.
        - alert: MilvusSearchLatencyBurnRate_FastBurn
          expr: |
            (
              histogram_quantile(0.99, sum(rate(milvus_proxy_req_latency_bucket{operation="Search"}[1h])) by (le)) > 0.030
              and
              histogram_quantile(0.99, sum(rate(milvus_proxy_req_latency_bucket{operation="Search"}[5m])) by (le)) > 0.030
            )
          for: 2m
          labels:
            severity: page
            slo_window: 1h
          annotations:
            summary: "Milvus search latency burn rate (1h window)"
            runbook: "microservices/intelligence/runbooks/milvus.md#search-latency"
        - alert: MilvusSearchLatencyBurnRate_SlowBurn
          expr: |
            histogram_quantile(0.99, sum(rate(milvus_proxy_req_latency_bucket{operation="Search"}[6h])) by (le)) > 0.030
          for: 15m
          labels:
            severity: page
            slo_window: 6h
          annotations:
            summary: "Milvus search latency burn rate (6h window)"

    - name: oya-intelligence-milvus.slo.ingest.4-window
      interval: 30s
      rules:
        - alert: MilvusIngestBacklog
          expr: milvus_datacoord_segment_num{state="Sealed"} > 5000
          for: 5m
          labels:
            severity: ticket
          annotations:
            summary: "Milvus sealed-segment backlog exceeds 5K — index build catching up"

    - name: oya-intelligence-milvus.cluster.health
      interval: 30s
      rules:
        - alert: MilvusCoordinatorDown
          expr: up{job=~"milvus-.*coord"} == 0
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "Milvus coordinator down — active/passive failover should engage"
