# Network policy — Milvus access is restricted to the foundry namespace
# + the observability namespace (scrape) + the analytics namespace (if
# present). No cross-cell traffic; cross-region replication is via the
# Milvus operator's per-cell backup-and-restore flow (ADR-0049).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oya-intelligence-milvus
  namespace: {{ .Release.Namespace }}
  labels:
    oya.adr: "0192,0148"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: milvus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: foundry
        - namespaceSelector:
            matchLabels:
              name: observability
        - namespaceSelector:
            matchLabels:
              name: analytics
      ports:
        - protocol: TCP
          port: 19530   # Milvus gRPC
        - protocol: TCP
          port: 9091    # Milvus metrics
  egress:
    - {}  # Allow egress to etcd, Pulsar, SeaweedFS, OpenBao — namespaced
