# Prometheus ServiceMonitor — OpenTelemetry Collector scrapes Milvus
# metrics + forwards to Mimir per ADR-0186 Stage 1+2.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oya-intelligence-milvus
  namespace: {{ .Release.Namespace }}
  labels:
    prometheus: observability
    oya.adr: "0186,0192"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      honorLabels: true
      metricRelabelings:
        # Add cell + tenant + pack labels per ADR-0186 §"Operational"
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: cell_id
        - sourceLabels: [__meta_kubernetes_pod_label_oya_pack]
          targetLabel: pack
