# Canonical-base: microservices/governance/iac/helm/_oya-helpers
# Milvus 2.6.x disaggregated cluster — production cell defaults per ADR-0192
# §"Sizing model (target capacity)". Per-cell sizing target: 1B vectors;
# HNSW M=16 ef_construction=200; 6 query nodes (3 search + 3 index),
# 4 data nodes, 2 index nodes; coordinator HA active+passive per coord type.

milvus-operator:
  enabled: true

milvus:
  # MilvusCluster CR — the operator reconciles this into the four-plane
  # disaggregated shape.
  cluster:
    enabled: true
  image:
    all:
      repository: milvusdb/milvus
      # ADR-0192 §"Sizing model" — pinned to 2.6.15 verified 2026-05-18.
      tag: "v2.6.15"
      pullPolicy: IfNotPresent

  # --- Access plane (proxy) ---
  proxy:
    replicas: 4
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

  # --- Coordinator plane (active + passive per coord type) ---
  rootCoordinator:
    replicas: 2  # active + passive
    activeStandby:
      enabled: true
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
  queryCoordinator:
    replicas: 2
    activeStandby:
      enabled: true
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
  dataCoordinator:
    replicas: 2
    activeStandby:
      enabled: true
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
  indexCoordinator:
    replicas: 2
    activeStandby:
      enabled: true
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"

  # --- Worker plane ---
  queryNode:
    # 3 search + 3 index = 6 query nodes per ADR-0192 §"Sizing model"
    replicas: 6
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
      limits:
        cpu: "8000m"
        memory: "32Gi"
    # GPU acceleration — optional per ADR-0192 §"GPU acceleration"; opt-in
    # via cell capacity plan. Default OFF; per-cell overlay flips ON.
    gpu:
      enabled: false
  dataNode:
    replicas: 4
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
  indexNode:
    replicas: 2
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
    gpu:
      enabled: false

  # --- Storage plane ---
  etcd:
    enabled: true
    replicaCount: 3  # Raft quorum
    auth:
      rbac:
        create: true
    persistence:
      storageClass: "csi-fast"  # ADR-0161 fast CSI class
      size: "20Gi"

  pulsar:
    enabled: true
    components:
      autorecovery: true
      pulsar_manager: false
    zookeeper:
      replicaCount: 3
    bookkeeper:
      replicaCount: 4
      configData:
        # Per-volume isolation per ADR-0049 cross-region replication policy
        journalDirectories: "/pulsar/data/bookkeeper/journal"
    broker:
      replicaCount: 3

  minio:
    # The chart bundles SeaweedFS as the S3-compat layer; oyatie replaces with
    # SeaweedFS per Fix-S via the externalS3 path below.
    enabled: false

  externalS3:
    enabled: true
    # Concrete bucket per cell; rendered from cell-meta capacity plan.
    host: "seaweedfs-s3.observability.svc.cluster.local"
    port: "8333"
    # ADR-0043 — OpenBao SecretReference; no plaintext credentials inline.
    useSSL: false
    bucketName: "milvus"
    rootPath: "files"
    useIAM: false
    cloudProvider: "aws"
    iamEndpoint: ""
    region: "kr-seoul"  # overridden per pack-kr / pack-eu overlay

  # --- Authentication + RBAC ---
  authorizationEnabled: true
  rootPassword:
    # ADR-0043 — credentials sourced from OpenBao via External Secrets
    # Operator pre-deployment; the chart consumes the resolved secret.
    existingSecret: "milvus-root-password"
    existingSecretKey: "password"

  # --- Resource quotas per-database / per-collection ---
  # Per ADR-0192 §"Multi-tenancy isolation" and ADR-0155
  quotaAndLimits:
    enabled: true
    quotaCenterCollectInterval: 3
    dml:
      enabled: true
      upsertRate:
        collection:
          max: 1000  # rows/sec per collection; override per tenant
    dql:
      enabled: true
      searchRate:
        collection:
          max: 500  # qps per collection; override per tenant
    limitWriting:
      ttProtection:
        enabled: true
        maxTimeTickDelay: 300
      memProtection:
        enabled: true
        dataNodeMemoryLowWaterLevel: 0.85
        dataNodeMemoryHighWaterLevel: 0.95

  # --- Observability per ADR-0186 ---
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        prometheus: observability
  log:
    level: "info"
    format: "json"  # OpenTelemetry-friendly per ADR-0186 Stage 1

  # --- Backup tool (ADR-0192 §"Backup and disaster recovery") ---
  backupTool:
    enabled: true
    schedule: "0 2 * * *"  # daily incremental at 02:00 UTC
    fullBackupSchedule: "0 3 * * 0"  # weekly full at Sunday 03:00 UTC
    destination:
      type: "s3"
      bucket: "milvus-backup"
      prefix: "{{ .Values.cellId }}"
