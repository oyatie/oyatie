apiVersion: v2
name: oya-intelligence
description: >
  Helm chart for the intelligence µservice — canonical AI Substrate per ADR-0255.
  Deploys dispatch kernel, guardrails stack, credential-resolver sidecar (ADR-0296),
  audit-tap worker, and brand-ux-surface SDK endpoints. Includes OpenBao sidecar,
  Kata Containers runtime class (ADR-0254), HTTP/3 + ECH + PQC ingress (ADR-0253).
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - intelligence
  - ai-substrate
  - dispatch
  - guardrails
  - credential-resolver
  - audit-tap
home: https://github.com/oyatie/oyatie/tree/main/microservices/intelligence
sources:
  - https://github.com/oyatie/oyatie
maintainers:
  - name: axis-intelligence
    email: axis-intelligence@oyatie.internal
annotations:
  adr_ref: "ADR-0255, ADR-0254, ADR-0253, ADR-0296, ADR-0248"
  cell_tier: "3"
  tier: substrate
  enforcement_lane: oya-governance-microservice-doc-set
