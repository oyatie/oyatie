[package]
name = "intelligence-authz-cedar-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Cedar (cedar-policy crate, Apache-2.0, AWS) adapter implementing the kernel's
# AuthzGate trait (ADR-0384 D7). Evaluates kernel AuthzRequests against the
# bundled policy at intelligence/policy/cloud-intelligence.cedar with
# Cedar's deny-by-default + forbid-wins semantics (ADR-0183 inheritance).

[dependencies]
intelligence-kernel = { path = "../../core/kernel" }
cedar-policy = { workspace = true }

[lib]
name = "intelligence_authz_cedar_adapter"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
