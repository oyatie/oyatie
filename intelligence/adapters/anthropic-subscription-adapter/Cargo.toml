[package]
name = "intelligence-anthropic-subscription-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "intelligence_anthropic_subscription_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-account-domain = { path = "../../core/account-domain" }
intelligence-account-kernel = { path = "../../core/account-kernel" }
intelligence-oauth-subscription-kernel = { path = "../../core/oauth-subscription-kernel" }
oya-http-runtime-hyper-adapter = { path = "../../../libs/oya-http-runtime-hyper-adapter" }
tokio = { workspace = true, features = ["sync", "time", "net"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures-util = { version = "0.3", features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[lints]
workspace = true
