[package]
name = "intelligence-rest"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# OAuth subscription-pool REST adapter (ADR-0384 Path B, Stage-6 GREEN).
# Owns:
#   D2 — axum reverse-proxy router
#   D3 — Anthropic provider adapter + async OAuth refresh (reqwest async, Item 1)
#         + upstream OAuth singleflight (Item 2)
#   D6 — EventSink fan-out to ClickHouse + Valkey Stream (trait mock here)
#   D8 — owned secret-provider envelope-encrypted refresh-token storage (trait mock here)
#
# Codex provider adapter is deferred to a follow-up PR (see TODO in lib.rs).

[lib]
name = "intelligence_rest"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-kernel = { path = "../../core/kernel" }
intelligence-codex-adapter = { path = "../codex-adapter" }
intelligence-gemini-adapter = { path = "../gemini-adapter" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { workspace = true, features = ["sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
intelligence-kernel = { path = "../../core/kernel" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# First-party scripted HTTP test server. Replaces `httpmock`, which ADR-0709 D-6
# Rule 2 fails on what it DRAGS IN (async-std, hyper 0.14, http 0.2, winapi 0.3.9,
# syn 1.0.109) rather than on the crate itself.

serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1"
bytes.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[lints]
workspace = true
