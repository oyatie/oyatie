[package]
name = "intelligence-eventsink-clickhouse-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# ClickHouse EventSink adapter for the cloud-intelligence OAuth subscription pool
# (ADR-0384 Path B, Stage-7 D6 production seam).
#
# Implements `EventSink` from `intelligence-kernel` by
# INSERTing `LlmGatewayEvent` rows into the `cloud_intelligence_receipts`
# table via the shared ClickHouse adapter (ADR-0193).
#
# ADR citations: ADR-0083, ADR-0105, ADR-0131, ADR-0193, ADR-0384.

[lib]
name = "intelligence_eventsink_clickhouse_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-kernel = { path = "../../core/kernel" }


serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
