[package]
name = "intelligence-codex-sdk"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "OpenAI Codex SDK adapter — JSONL app-server transport (consolidated from consolidate/codex-snapshot-2026-06-08 sdk/rust)"

[lib]
name = "intelligence_codex_sdk"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread"] }

[features]
default = []
async = ["dep:tokio"]
runtime = []

[lints]
workspace = true
