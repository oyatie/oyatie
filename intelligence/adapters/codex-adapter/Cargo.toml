[package]
name = "intelligence-codex-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# OpenAI Codex OAuth subscription-pool adapter (ADR-0384 Path B, v1 provider scope).
# Owns:
#   D3 — Codex provider adapter: token refresh via chatgpt.com session endpoint
#         + async reqwest proxy to backend-api/codex/responses.
#
# Wire format is reverse-engineered from auth2api / CLIProxyAPI (Stage-6 gap #11).
# Operator must manually obtain the refresh token from a logged-in ChatGPT session.
# cli_version impersonation is hard-coded; operator must update on Codex CLI bumps.

[lib]
name = "intelligence_codex_adapter"
path = "src/lib.rs"
doctest = false

[dependencies]
intelligence-kernel = { path = "../../core/kernel" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-core = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# default-features=false drops the optional `cookies` feature (basic-cookies /
# lalrpop codegen, no buck2 fixup). Tests use only the generic header/path/body
# matchers, never httpmock's cookie matcher.
httpmock = { version = "0.7", default-features = false }
serde_json.workspace = true
bytes.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"

[lints]
workspace = true
