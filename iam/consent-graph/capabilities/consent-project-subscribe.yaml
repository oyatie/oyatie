apiVersion: oya.dev/v1
kind: Capability
metadata:
  name: consent-project-subscribe
  description: Subscribe to a cross-tenant projection topic minted by an active agreement.
spec:
  microservice: consent-graph
  tier: T2
  risk_class: limited
  rationale: |
    Subscribing to a projection topic activates the data flow. Cedar policy + Pulsar ACL gate access;
    T2 = transactional audit + per-tenant rate limit + read-only.
  audit_emission:
    - oya.consent-graph.projection-mint
    - oya.consent-graph.projection-subscribe
    - oya.consent-graph.projection-read
    - oya.consent-graph.projection-destroy
  required_authorization:
    - grantee.role:integration-engineer
    - cedar-policy permit (auto-enforced)
  reversibility:
    revocable_state_set: [Active, Suspended]
    revocation_propagation_max: 1s
  failure_mode: fail-closed
  hyperscaler_invariants:
    - INV-SHUFFLE-SHARDING
    - INV-SLO-ERROR-BUDGET
  pack_overlays_supported:
    - kr
    - eu
    - us
    - us-healthcare
    - jp
    - sg
    - au
    - in
    - br
    - ae
    - ksa
