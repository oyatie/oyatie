apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-sovereignty-violation-zero
  displayName: Sovereignty violation — zero
spec:
  description: |
    Any projection emission whose topic.region != grantor.region OR whose payload contains
    cross-border-forbidden classifier fields is a sovereignty violation. Target = 1.0.
    Authority: ADR-0214 §2.5 + ADR-SVC-CG-004 + IP-009.
  service: consent-graph
  indicator:
    metadata:
      name: sovereignty-violation-zero
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_consent_graph_projection_emit_total[5m])) -
                sum(rate(oya_consent_graph_sovereignty_violation_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_projection_emit_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% sovereignty-preserving
      target: 1.0
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P0
      burnRate: 14.4
      window: 5m
    - severity: P0
      burnRate: 1.0
      window: 1h
