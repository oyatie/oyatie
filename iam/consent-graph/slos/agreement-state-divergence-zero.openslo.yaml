apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-agreement-state-divergence-zero
  displayName: Agreement state divergence — zero
spec:
  description: |
    Grantor + grantee must agree on agreement state at any time. Divergences detected by hourly
    reconciliation. Target = 1.0 (no divergence).
    Authority: ADR-0214 §2.6 + IP-013.
  service: consent-graph
  indicator:
    metadata:
      name: agreement-state-divergence-zero
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_consent_graph_state_check_total[5m])) -
                sum(rate(oya_consent_graph_state_divergence_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_state_check_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 100% consistent
      target: 1.0
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P1
      burnRate: 14.4
      window: 1h
    - severity: P2
      burnRate: 3.0
      window: 24h
