apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-revocation-propagation-latency
  displayName: Revocation propagation latency
spec:
  description: |
    p99 end-to-end latency from revocation originate → all subscribers receipted (CacheInvalidated,
    ProjectionPaused, TopicDestroyed).
    Authority: ADR-0214 §2.4 + ADR-SVC-CG-002.
  service: consent-graph
  indicator:
    metadata:
      name: revocation-propagation-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_revocation_propagation_seconds_bucket{le="1.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_revocation_propagation_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 99% within 1 second
      target: 0.99
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P0
      burnRate: 14.4
      window: 1h
    - severity: P1
      burnRate: 6.0
      window: 6h
