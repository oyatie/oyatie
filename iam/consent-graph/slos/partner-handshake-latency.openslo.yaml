apiVersion: openslo/v1
kind: SLO
metadata:
  name: oya-consent-graph-partner-handshake-latency
  displayName: Partner-directory handshake latency
spec:
  description: |
    p95 three-leg handshake duration (initiate + respond + finalize + audit-chain root proof).
    Authority: ADR-0214 §1 + IP-014.
  service: consent-graph
  indicator:
    metadata:
      name: partner-handshake-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_handshake_duration_seconds_bucket{le="30.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: sum(rate(oya_consent_graph_handshake_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: 95% within 30 seconds
      target: 0.95
      op: gte
  owner: axis-consent-graph
  hyperscalerGroup: HG-CONSENT
  alerts:
    - severity: P2
      burnRate: 14.4
      window: 1h
    - severity: P3
      burnRate: 3.0
      window: 24h
