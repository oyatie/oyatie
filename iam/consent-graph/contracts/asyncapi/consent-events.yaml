asyncapi: 3.1.0
info:
  title: consent-graph events
  version: 0.1.0
  description: |
    AsyncAPI 3.1 channels for cross-tenant projection feed, revocation propagation, agreement lifecycle,
    and audit-bridge bilateral emissions. Authority: ADR-0214 §2.4 + §2.5 + §2.6.
  contact:
    name: axis-consent-graph
defaultContentType: application/json
servers:
  pulsar-grantor-region:
    host: 'pulsar-{region}.oya.internal:6651'
    protocol: pulsar+ssl
    description: Per-grantor-region Pulsar cluster (TLS).
    security:
      - $ref: '#/components/securitySchemes/mTLS'
      - $ref: '#/components/securitySchemes/PulsarTenantJwt'
channels:
  oya.consent-graph.agreement-lifecycle.v1:
    address: persistent://oya-tenant-{grantor_tenant}/consent-graph/agreement-lifecycle-v1
    description: Agreement lifecycle transitions (Drafted/Offered/Accepted/Active/Suspended/Revoked/Expired/Amended).
    messages:
      AgreementLifecycleEvent:
        $ref: '#/components/messages/AgreementLifecycleEvent'
    parameters:
      grantor_tenant:
        description: Grantor tenant id
  oya.consent-graph.revocation.v1:
    address: persistent://oya-tenant-{grantor_tenant}/consent-graph/revocation-v1
    description: |
      Real-time revocation propagation. High-priority lane; geo-replicated across all regions.
      Subscribers in enforcement-app, projection-gateway-app, ontology cross-tenant subscriber,
      analytics cross-tenant subscriber, observability metric stream subscriber.
    messages:
      RevocationEvent:
        $ref: '#/components/messages/RevocationEvent'
    parameters:
      grantor_tenant: {}
  oya.consent-graph.audit-bridge.v1:
    address: persistent://oya-tenant-{grantor_tenant}/consent-graph/audit-bridge-v1
    description: Async path for bilateral audit emission (latency-relaxed events).
    messages:
      BilateralAuditEvent:
        $ref: '#/components/messages/BilateralAuditEvent'
    parameters:
      grantor_tenant: {}
  oya.consent-graph.projection.v1:
    address: persistent://oya-tenant-{grantor_tenant}/cross-tenant-projection/{topic_name}
    description: |
      Per-(grantor, grantee, entity) cross-tenant projection topics. Scope-narrowed payloads.
      Topic resides in grantor's region (sovereignty pin per ADR-SVC-CG-004).
      Topic naming: oya.consent-graph.projection.v1.<grantor_short>.<grantee_short>.<entity_short>.<agreement_short>
    messages:
      ProjectionEvent:
        $ref: '#/components/messages/ProjectionEvent'
    parameters:
      grantor_tenant: {}
      topic_name: {}
  oya.consent-graph.projection-mint.v1:
    address: persistent://oya-system/consent-graph/projection-mint-v1
    description: Lifecycle events for projection topic mint/destroy (control plane).
    messages:
      ProjectionMintEvent:
        $ref: '#/components/messages/ProjectionMintEvent'
operations:
  publishAgreementLifecycle:
    action: send
    channel:
      $ref: '#/channels/oya.consent-graph.agreement-lifecycle.v1'
    summary: Emit agreement lifecycle event
    messages:
      - $ref: '#/channels/oya.consent-graph.agreement-lifecycle.v1/messages/AgreementLifecycleEvent'
  publishRevocation:
    action: send
    channel:
      $ref: '#/channels/oya.consent-graph.revocation.v1'
    summary: Originate revocation; high-priority lane
    messages:
      - $ref: '#/channels/oya.consent-graph.revocation.v1/messages/RevocationEvent'
  subscribeRevocation:
    action: receive
    channel:
      $ref: '#/channels/oya.consent-graph.revocation.v1'
    summary: Subscribers consume revocation events and invalidate local state
    messages:
      - $ref: '#/channels/oya.consent-graph.revocation.v1/messages/RevocationEvent'
  publishBilateralAudit:
    action: send
    channel:
      $ref: '#/channels/oya.consent-graph.audit-bridge.v1'
    messages:
      - $ref: '#/channels/oya.consent-graph.audit-bridge.v1/messages/BilateralAuditEvent'
  publishProjection:
    action: send
    channel:
      $ref: '#/channels/oya.consent-graph.projection.v1'
    summary: Grantor-side projection emission (scope-narrowed)
    messages:
      - $ref: '#/channels/oya.consent-graph.projection.v1/messages/ProjectionEvent'
  subscribeProjection:
    action: receive
    channel:
      $ref: '#/channels/oya.consent-graph.projection.v1'
    summary: Grantee subscribes cross-region read-only (per ADR-SVC-CG-004)
    messages:
      - $ref: '#/channels/oya.consent-graph.projection.v1/messages/ProjectionEvent'
components:
  securitySchemes:
    mTLS:
      type: X509
      description: SPIFFE workload identity-bound mTLS
    PulsarTenantJwt:
      type: oauth2
      description: Per-agreement JWT minted at projection topic mint; audience = topic; expiry ≤ agreement.expiration
      flows:
        clientCredentials:
          tokenUrl: https://identity.oya.dev/oauth2/token
          scopes:
            consent-graph:project.subscribe: subscribe to a specific projection topic
  messages:
    AgreementLifecycleEvent:
      name: AgreementLifecycleEvent
      title: Agreement lifecycle transition
      contentType: application/json
      payload:
        type: object
        required: [event_type, agreement_id, schema_version, timestamp]
        properties:
          event_type:
            type: string
            enum: [agreement-drafted, agreement-offered, agreement-accepted, agreement-amended,
                   agreement-suspended, agreement-revoked, agreement-expired]
          agreement_id: { type: string, format: ulid }
          grantor: { type: string }
          grantee: { type: string }
          previous_state: { type: string }
          new_state: { type: string }
          schema_version: { type: integer }
          actor: { type: string }
          timestamp: { type: string, format: date-time }
          payload: { type: object, additionalProperties: true }
    RevocationEvent:
      name: RevocationEvent
      title: Real-time revocation
      headers:
        type: object
        properties:
          priority:
            type: string
            enum: [high]
            description: Always 'high' for revocation; dedicates priority lane
          deadline_unix_ms: { type: integer }
      payload:
        type: object
        required: [revocation_id, agreement_id, reason, initiated_at, deadline_at]
        properties:
          revocation_id: { type: string, format: ulid }
          agreement_id: { type: string }
          grantor: { type: string }
          grantee: { type: string }
          reason:
            type: string
            enum: [GrantorInitiated, GranteeInitiated, DataSubjectInitiated, ContractEnded,
                   PolicyViolation, SecurityIncident, ExpirationCascade, DsarErasure,
                   PartnerOffboarded]
          initiated_by: { type: object, additionalProperties: true }
          initiated_at: { type: string, format: date-time }
          deadline_at: { type: string, format: date-time }
    BilateralAuditEvent:
      name: BilateralAuditEvent
      title: Async bilateral audit emission
      payload:
        type: object
        properties:
          event_id: { type: string, format: ulid }
          agreement_id: { type: string }
          event_type: { type: string }
          timestamp: { type: string, format: date-time }
          grantor_payload: { type: object, additionalProperties: true }
          grantee_payload: { type: object, additionalProperties: true }
    ProjectionEvent:
      name: ProjectionEvent
      title: Cross-tenant projection event
      headers:
        type: object
        properties:
          agreement_id: { type: string }
          schema_version: { type: integer }
      payload:
        type: object
        oneOf:
          - $ref: '#/components/schemas/ProjectionRowPayload'
          - $ref: '#/components/schemas/AggregateBucketPayload'
          - $ref: '#/components/schemas/AttestedAnswerPayload'
    ProjectionMintEvent:
      name: ProjectionMintEvent
      payload:
        type: object
        properties:
          event_type:
            type: string
            enum: [mint, destroy, acl-changed]
          agreement_id: { type: string }
          topic_name: { type: string }
          region: { type: string }
          timestamp: { type: string, format: date-time }
  schemas:
    ProjectionRowPayload:
      type: object
      properties:
        kind: { type: string, const: row }
        agreement_id: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        row: { type: object, additionalProperties: true }
        emitted_at: { type: string, format: date-time }
        redaction_applied:
          type: array
          items: { type: string }
    AggregateBucketPayload:
      type: object
      properties:
        kind: { type: string, const: aggregate }
        agreement_id: { type: string }
        entity_type: { type: string }
        group_by: { type: object, additionalProperties: true }
        measures: { type: object, additionalProperties: true }
        k: { type: integer }
        dp_noise: { type: object, nullable: true, additionalProperties: true }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
    AttestedAnswerPayload:
      type: object
      properties:
        kind: { type: string, const: attested-answer }
        query_id: { type: string }
        agreement_id: { type: string }
        answer: { type: object, additionalProperties: true }
        answered_at: { type: string, format: date-time }
        signature: { type: string, format: byte }
        witness_audit_seal:
          type: object
          properties:
            chain_id: { type: string }
            seq: { type: integer }
