// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";
// Authority: ADR-0214 cross-tenant real-time visibility.
// proto3 wire format. Used for internal gRPC between consent-graph-app and enforcement-app
// + cross-µservice integration (ontology, audit-chain, observability).

package oya.consent_graph.v1;

option go_package = "github.com/oya/consent-graph/v1";
option java_package = "dev.oya.consent_graph.v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ─────────────────────────────────────────────────────────────────────
// Services
// ─────────────────────────────────────────────────────────────────────

service AgreementService {
  rpc Draft(DraftAgreementRequest) returns (DraftAgreementResponse);
  rpc Offer(OfferAgreementRequest) returns (Empty);
  rpc Accept(AcceptAgreementRequest) returns (Empty);
  rpc Amend(AmendAgreementRequest) returns (DraftAgreementResponse);
  rpc Revoke(RevokeAgreementRequest) returns (Empty);
  rpc Read(ReadAgreementRequest) returns (DataSharingAgreement);
  rpc List(ListAgreementsRequest) returns (ListAgreementsResponse);
}

service EnforcementService {
  // Hot path: Cedar evaluation. p99 ≤10ms. Fail-closed.
  rpc Evaluate(EnforcementRequest) returns (EnforcementDecision);
  // Bulk check for projection-emit (avoids per-event RPC).
  rpc EvaluateBatch(EnforcementBatchRequest) returns (EnforcementBatchResponse);
  rpc Invalidate(InvalidatePolicyRequest) returns (Empty);
  rpc CacheStats(Empty) returns (PolicyCacheStats);
}

service RevocationService {
  rpc Originate(OriginateRevocationRequest) returns (OriginateRevocationResponse);
  rpc ConfirmReceipt(ConfirmReceiptRequest) returns (Empty);
  rpc ListReceipts(ListReceiptsRequest) returns (ListReceiptsResponse);
}

service ProjectionGatewayService {
  rpc Mint(MintProjectionRequest) returns (MintProjectionResponse);
  rpc Destroy(DestroyProjectionRequest) returns (Empty);
  rpc SetAcl(SetAclRequest) returns (Empty);
}

service AuditBridgeService {
  rpc EmitBilateral(BilateralAuditEmitRequest) returns (BilateralAuditEmitResponse);
}

service PartnerDirectoryService {
  rpc HandshakeInitiate(HandshakeInitiateRequest) returns (HandshakeRespondPayload);
  rpc HandshakeRespond(HandshakeRespondRequest) returns (HandshakeRespondPayload);
  rpc HandshakeFinalize(HandshakeFinalizeRequest) returns (Empty);
  rpc Read(ReadPartnerRequest) returns (PartnerTenant);
  rpc Suspend(SuspendPartnerRequest) returns (Empty);
  rpc Offboard(OffboardPartnerRequest) returns (Empty);
}

// ─────────────────────────────────────────────────────────────────────
// Common
// ─────────────────────────────────────────────────────────────────────

message Empty {}

enum AgreementState {
  AGREEMENT_STATE_UNSPECIFIED = 0;
  DRAFTED = 1;
  OFFERED = 2;
  ACCEPTED = 3;
  ACTIVE = 4;
  SUSPENDED = 5;
  REVOKED = 6;
  EXPIRED = 7;
}

enum SharingMode {
  SHARING_MODE_UNSPECIFIED = 0;
  PROJECTION = 1;
  AGGREGATE = 2;
  ATTESTED_QUERY = 3;
}

enum RevocationReason {
  REVOCATION_REASON_UNSPECIFIED = 0;
  GRANTOR_INITIATED = 1;
  GRANTEE_INITIATED = 2;
  DATA_SUBJECT_INITIATED = 3;
  CONTRACT_ENDED = 4;
  POLICY_VIOLATION = 5;
  SECURITY_INCIDENT = 6;
  EXPIRATION_CASCADE = 7;
  DSAR_ERASURE = 8;
  PARTNER_OFFBOARDED = 9;
}

enum EnforcementOutcome {
  ENFORCEMENT_OUTCOME_UNSPECIFIED = 0;
  PERMIT = 1;
  DENY = 2;
  INDETERMINATE = 3;
}

enum DenyReason {
  DENY_REASON_UNSPECIFIED = 0;
  NO_AGREEMENT = 1;
  AGREEMENT_REVOKED = 2;
  AGREEMENT_SUSPENDED = 3;
  AGREEMENT_EXPIRED = 4;
  SCOPE_NOT_PERMITTED = 5;
  PURPOSE_OF_USE_MISMATCH = 6;
  SOVEREIGNTY_VIOLATION = 7;
  RATE_LIMIT_EXCEEDED = 8;
  CEDAR_POLICY_DENY = 9;
  PARTNER_SUSPENDED = 10;
  INVALID_PRINCIPAL = 11;
  STALE_REVOCATION_CHECK = 12;
}

enum TenantClass {
  TENANT_CLASS_UNSPECIFIED = 0;
  DEMO_TRIAL = 1;
  PAID = 2;
}

enum PartnerState {
  PARTNER_STATE_UNSPECIFIED = 0;
  ONBOARDING = 1;
  VERIFIED = 2;
  PARTNER_ACTIVE = 3;
  PARTNER_SUSPENDED = 4;
  OFFBOARDED = 5;
}

// ─────────────────────────────────────────────────────────────────────
// Entities
// ─────────────────────────────────────────────────────────────────────

message EntityScope {
  string entity_type = 1;
  FieldSet field_set = 2;
  string predicate = 3;  // Cedar sublanguage predicate; optional
}

message FieldSet {
  oneof kind {
    bool all_fields = 1;
    StringList allow = 2;
    StringList deny = 3;
  }
}

message StringList {
  repeated string values = 1;
}

message SharingTerms {
  string purpose_of_use = 1;
  SharingMode mode = 2;
  google.protobuf.Struct redaction = 3;
  uint32 k_anonymity = 4;       // populated for Aggregate mode
  double epsilon = 5;            // DP noise; 0 = disabled
  double delta = 6;
  uint32 max_qps = 7;
}

message SovereigntyCfg {
  string grantor_region = 1;
  repeated string permitted_grantee_regions = 2;
  bool cross_border_transfer_permitted = 3;
  bool geo_replicate_to_grantee_region = 4;
  string residency_overlay_pack = 5;
}

message ChainLink {
  string chain_id = 1;
  uint64 seq = 2;
  google.protobuf.Timestamp sealed_at = 3;
  bytes merkle_root = 4;
}

message BilateralChainLink {
  ChainLink grantor = 1;
  ChainLink grantee = 2;
  bytes paired_hmac = 3;
}

message DataSharingAgreement {
  string agreement_id = 1;
  string grantor = 2;
  string grantee = 3;
  EntityScope scope = 4;
  SharingTerms terms = 5;
  AgreementState state = 6;
  google.protobuf.Struct state_payload = 7;
  SovereigntyCfg sovereignty = 8;
  string cedar_policy_id = 9;
  BilateralChainLink bilateral_chain_link = 10;
  bool revocable = 11;
  google.protobuf.Timestamp expiration = 12;
  uint32 schema_version = 13;
  uint64 version = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// ─────────────────────────────────────────────────────────────────────
// Agreement RPCs
// ─────────────────────────────────────────────────────────────────────

message DraftAgreementRequest {
  string grantor = 1;
  string grantee = 2;
  EntityScope scope = 3;
  SharingTerms terms = 4;
  SovereigntyCfg sovereignty = 5;
  google.protobuf.Timestamp expiration = 6;
  string template_id = 7;
}

message DraftAgreementResponse {
  string agreement_id = 1;
}

message OfferAgreementRequest  { string agreement_id = 1; }
message AcceptAgreementRequest { string agreement_id = 1; }

message AmendAgreementRequest {
  string agreement_id = 1;
  EntityScope new_scope = 2;
  SharingTerms new_terms = 3;
}

message RevokeAgreementRequest {
  string agreement_id = 1;
  RevocationReason reason = 2;
  string idempotency_key = 3;
}

message ReadAgreementRequest { string agreement_id = 1; }

message ListAgreementsRequest {
  string grantor = 1;
  string grantee = 2;
  AgreementState state = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message ListAgreementsResponse {
  repeated DataSharingAgreement agreements = 1;
  string next_page_token = 2;
}

// ─────────────────────────────────────────────────────────────────────
// Enforcement RPCs
// ─────────────────────────────────────────────────────────────────────

message EnforcementContext {
  string purpose_of_use = 1;
  google.protobuf.Timestamp request_time = 2;
  string request_region = 3;
  TenantClass tenant_class = 4;
  uint64 prior_revocation_check_ms_ago = 5;
  string trace_id = 6;
}

message ResourceRef {
  string entity_type = 1;
  string entity_id = 2;
}

message EnforcementRequest {
  string request_id = 1;
  string grantor = 2;
  string grantee = 3;
  string principal = 4;
  string action = 5;  // "project.subscribe", "project.read", "attested.query", "aggregate.read"
  ResourceRef resource = 6;
  EnforcementContext context = 7;
  string agreement_id_hint = 8;
}

message EnforcementDecision {
  EnforcementOutcome outcome = 1;
  DenyReason deny_reason = 2;
  string matched_agreement = 3;
  string determining_policy_id = 4;
  repeated string reasons = 5;
  uint64 eval_duration_ns = 6;
  bool cache_hit = 7;
}

message EnforcementBatchRequest {
  repeated EnforcementRequest requests = 1;
}

message EnforcementBatchResponse {
  repeated EnforcementDecision decisions = 1;
}

message InvalidatePolicyRequest { string agreement_id = 1; }

message PolicyCacheStats {
  uint64 size = 1;
  double hit_rate = 2;
  uint64 evictions_total = 3;
  uint64 oldest_entry_age_seconds = 4;
}

// ─────────────────────────────────────────────────────────────────────
// Revocation RPCs
// ─────────────────────────────────────────────────────────────────────

message OriginateRevocationRequest {
  string agreement_id = 1;
  RevocationReason reason = 2;
  string idempotency_key = 3;
}

message OriginateRevocationResponse { string revocation_id = 1; }

message ConfirmReceiptRequest {
  string revocation_id = 1;
  string subscriber_service = 2;
  string subscriber_region = 3;
  string action_taken = 4;
  uint64 propagation_latency_ms = 5;
}

message ListReceiptsRequest { string revocation_id = 1; }

message ListReceiptsResponse {
  repeated RevocationReceipt receipts = 1;
}

message RevocationReceipt {
  string revocation_id = 1;
  string subscriber_service = 2;
  string subscriber_region = 3;
  google.protobuf.Timestamp propagated_at = 4;
  uint64 propagation_latency_ms = 5;
  string action_taken = 6;
}

// ─────────────────────────────────────────────────────────────────────
// Projection-gateway RPCs
// ─────────────────────────────────────────────────────────────────────

message MintProjectionRequest { string agreement_id = 1; }

message MintProjectionResponse {
  string topic_id = 1;
  string topic_name = 2;
  string region = 3;
}

message DestroyProjectionRequest { string topic_id = 1; }

message SetAclRequest {
  string topic_id = 1;
  repeated TopicAclEntry acl = 2;
}

message TopicAclEntry {
  string principal = 1;
  repeated string permissions = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// ─────────────────────────────────────────────────────────────────────
// Audit-bridge RPCs
// ─────────────────────────────────────────────────────────────────────

message BilateralAuditEmitRequest {
  string event_id = 1;
  string agreement_id = 2;
  string event_type = 3;
  google.protobuf.Struct grantor_payload = 4;
  google.protobuf.Struct grantee_payload = 5;
}

message BilateralAuditEmitResponse {
  string event_id = 1;
  BilateralChainLink chain_link = 2;
  ChainLink confirm_grantor = 3;
  ChainLink confirm_grantee = 4;
}

// ─────────────────────────────────────────────────────────────────────
// Partner-directory RPCs
// ─────────────────────────────────────────────────────────────────────

message Anchors {
  bytes x509_spki = 1;
  bytes pulsar_jwt_pub = 2;
  bytes audit_chain_merkle_root = 3;
  uint32 audit_chain_schema_version = 4;
}

message HandshakeInitiateRequest {
  string peer_tenant_id = 1;
  Anchors anchors_proposed = 2;
  bytes nonce = 3;
}

message HandshakeRespondRequest {
  string initiator_tenant_id = 1;
  Anchors anchors_proposed = 2;
  bytes nonce = 3;
}

message HandshakeRespondPayload {
  Anchors anchors = 1;
  bytes nonce = 2;
  bytes hmac_over_initiator_nonce_and_self_anchors = 3;
}

message HandshakeFinalizeRequest {
  bytes hmac_over_responder_nonce_and_self_anchors = 1;
}

message ReadPartnerRequest { string peer_tenant_id = 1; }
message SuspendPartnerRequest { string peer_tenant_id = 1; string reason = 2; }
message OffboardPartnerRequest { string peer_tenant_id = 1; string reason = 2; }

message PartnerTenant {
  string local_tenant_id = 1;
  string peer_tenant_id = 2;
  PartnerState state = 3;
  Anchors peer_anchors = 4;
  google.protobuf.Timestamp handshake_initiated_at = 5;
  google.protobuf.Timestamp handshake_completed_at = 6;
  google.protobuf.Timestamp state_changed_at = 7;
}
