{{- range $sa := list "consent-graph-app" "enforcement-app" "revocation-app" "projection-gateway-worker" "audit-bridge-worker" "partner-directory-app" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace }}
  labels: { app.kubernetes.io/part-of: consent-graph }
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: consent-graph-config-reader
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: consent-graph-config-reader
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: consent-graph-config-reader
subjects:
  - { kind: ServiceAccount, name: consent-graph-app,         namespace: {{ .Values.namespace }} }
  - { kind: ServiceAccount, name: enforcement-app,           namespace: {{ .Values.namespace }} }
  - { kind: ServiceAccount, name: revocation-app,            namespace: {{ .Values.namespace }} }
  - { kind: ServiceAccount, name: projection-gateway-worker, namespace: {{ .Values.namespace }} }
  - { kind: ServiceAccount, name: audit-bridge-worker,       namespace: {{ .Values.namespace }} }
  - { kind: ServiceAccount, name: partner-directory-app,     namespace: {{ .Values.namespace }} }
