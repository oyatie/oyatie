apiVersion: apps/v1
kind: Deployment
metadata:
  name: enforcement-app
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: enforcement-app
    app.kubernetes.io/part-of: consent-graph
spec:
  replicas: {{ .Values.apps.enforcement.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: enforcement-app } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enforcement-app
        app.kubernetes.io/part-of: consent-graph
        ambient.istio.io/redirection: enabled
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.ports.metrics }}"
    spec:
      serviceAccountName: enforcement-app
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/usr/local/bin/oya-consent-graph-enforcement-app"]
          ports:
            - { name: grpc, containerPort: {{ .Values.ports.grpc }} }
            - { name: metrics, containerPort: {{ .Values.ports.metrics }} }
            - { name: health, containerPort: {{ .Values.ports.health }} }
          env:
            - { name: OYA_REGION, value: "{{ .Values.region }}" }
            - { name: OYA_CEDAR_CACHE_SIZE, value: "{{ .Values.cedar.cacheSize }}" }
          readinessProbe: { httpGet: { path: /readyz, port: health }, initialDelaySeconds: 30, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /livez,  port: health }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: {{ toYaml .Values.apps.enforcement.resources | nindent 12 }}
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enforcement-app
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enforcement-app
  minReplicas: {{ .Values.hpa.enforcement.minReplicas }}
  maxReplicas: {{ .Values.hpa.enforcement.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric: { name: oya_consent_graph_evaluate_requests_per_second }
        target: { type: AverageValue, averageValue: "{{ .Values.hpa.enforcement.targetRequestsPerPod }}" }
{{- end }}
