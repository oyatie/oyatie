apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-graph-app
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: consent-graph-app
    app.kubernetes.io/part-of: consent-graph
    oya.dev/microservice: consent-graph
    oya.dev/region: {{ .Values.region }}
    oya.dev/pack: {{ .Values.pack }}
spec:
  replicas: {{ .Values.apps.consentGraph.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: consent-graph-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-graph-app
        app.kubernetes.io/part-of: consent-graph
        ambient.istio.io/redirection: enabled
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.ports.metrics }}"
    spec:
      serviceAccountName: consent-graph-app
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/oya-consent-graph-agreement-app"]
          ports:
            - { name: rest, containerPort: {{ .Values.ports.rest }} }
            - { name: grpc, containerPort: {{ .Values.ports.grpc }} }
            - { name: metrics, containerPort: {{ .Values.ports.metrics }} }
            - { name: health, containerPort: {{ .Values.ports.health }} }
          env:
            - { name: OYA_REGION, value: "{{ .Values.region }}" }
            - { name: OYA_PACK, value: "{{ .Values.pack }}" }
            - { name: OYA_POSTGRES_HOST, value: "{{ .Values.postgres.host }}" }
            - { name: OYA_POSTGRES_DB, value: "{{ .Values.postgres.database }}" }
            - { name: OYA_PULSAR_URL, value: "{{ .Values.pulsar.brokerUrl }}" }
            - { name: OYA_PULSAR_ADMIN_URL, value: "{{ .Values.pulsar.adminUrl }}" }
            - { name: OYA_OPENBAO_ENDPOINT, value: "{{ .Values.openbao.endpoint }}" }
            - { name: OYA_IDENTITY_ENDPOINT, value: "{{ .Values.identity.endpoint }}" }
            - { name: OYA_AUDIT_CHAIN_ENDPOINT, value: "{{ .Values.auditChain.endpoint }}" }
            - { name: OYA_OTEL_ENDPOINT, value: "{{ .Values.observability.otelEndpoint }}" }
            - { name: OYA_CEDAR_CACHE_SIZE, value: "{{ .Values.cedar.cacheSize }}" }
            - { name: OYA_CEDAR_FRESHNESS_BUDGET_MS, value: "{{ .Values.cedar.freshnessBudgetMs }}" }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: health }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{ toYaml .Values.apps.consentGraph.resources | nindent 12 }}
