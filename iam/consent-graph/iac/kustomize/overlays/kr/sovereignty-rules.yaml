apiVersion: oya.dev/v1
kind: SovereigntyRules
metadata:
  name: kr-pack-sovereignty
spec:
  pack: kr
  default_cross_border_transfer_permitted: false
  permitted_grantee_regions_default:
    - ap-northeast-2
  cross_border_lawful_basis_required:
    - consent
    - contract-necessity
    - legal-obligation
  forbidden_destinations:
    - eu-*
    - us-*
    - cn-*
  adequacy_decisions:
    - eu-west-1
    - eu-central-1
  geo_replicate_permitted: false
  sensitive_categories_k_anonymity_min: 10
  audit_chain_retention_years: 7
  dsar_clock_days: 10
