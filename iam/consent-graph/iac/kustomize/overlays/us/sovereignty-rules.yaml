apiVersion: oya.dev/v1
kind: SovereigntyRules
metadata:
  name: us-pack-sovereignty
spec:
  pack: us
  default_cross_border_transfer_permitted: false
  permitted_grantee_regions_default:
    - us-east-1
    - us-east-2
    - us-west-1
    - us-west-2
  adequacy_decisions:
    - ca-*
    - gb-*
    - eu-* (via SCC)
  geo_replicate_permitted: true
  sensitive_categories_k_anonymity_min: 5
  audit_chain_retention_years: 7
  dsar_clock_days: 45
