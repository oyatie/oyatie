apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: identity-ddos-xdp
  labels:
    app.kubernetes.io/part-of: identity
    purpose: ddos-xdp-l3l4-drop
spec:
  # Cilium XDP drop policy attached at NIC level.
  # Drops obvious L3/L4 patterns BEFORE the kernel TCP stack.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: identity
  ingress:
    - fromCIDRSet:
        - cidr: 0.0.0.0/0
          # except: ASN-deny-list mapped to CIDR (populated by ops-security).
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "80",  protocol: TCP }
  # Cilium L3/L4 + XDP per ADR-0148 Tier 1.
  # Drop thresholds tuned per pack baseline (+ 20σ).
