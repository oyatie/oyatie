apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: identity-coraza-waf
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: identity
spec:
  workloadSelector:
    labels: { istio: ingressgateway }
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.wasm
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            value:
              config:
                vm_config:
                  runtime: envoy.wasm.runtime.v8
                  code:
                    local:
                      filename: /etc/envoy/wasm/coraza-v3.25.0.wasm
                configuration:
                  "@type": type.googleapis.com/google.protobuf.StringValue
                  value: |
                    {
                      "rules": [
                        "Include @owasp_crs/*.conf",
                        "SecRuleEngine On",
                        "SecAuditLog /dev/null",
                        "SecRequestBodyLimit 13107200",
                        "SecRequestBodyAccess On",
                        "SecResponseBodyAccess Off",

                        # Custom oyatie rules (9999100-9999199 reserved).
                        "SecRule REQUEST_URI \"@contains eyJ\" \"id:9999100,phase:1,deny,msg:'OAuth bearer-in-URL detected'\"",
                        "SecRule REQUEST_HEADERS:User-Agent \"@gt 2048\" \"id:9999102,phase:1,deny,msg:'UA too long'\"",
                        "SecRule REQUEST_HEADERS \"@gt 50\" \"id:9999103,phase:1,deny,msg:'Too many headers'\""
                      ],
                      "default_directive": "PARANOIA-LEVEL 2"
                    }
# Coraza WAF v3 + OWASP CRS v4.25.0 LTS per ADR-0191. [^1]
# [^1]: Versions current as of 2026-05-18.
