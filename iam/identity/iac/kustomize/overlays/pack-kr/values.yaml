# pack-kr overlay per ADR-0179 sovereign-cloud-per-regional-pack + ADR-0188 attestation policy
packLabel: kr
zitadel:
  zitadelConfig:
    externalDomain: identity-kr.oyatie.com
    Telemetry:
      Endpoint: otel-collector.observability-kr.svc.cluster.local:4317
webauthn:
  attestation: direct
  rpId: identity-kr.oyatie.com
openbao:
  hsm:
    type: thales-luna
    partition: kr-fss-partition-1
aaguidRefresher:
  enforce_l1_plus: true
auditEmitter:
  retention_years: 5  # KR-FSS sector
edgeAuthz:
  geo_default: allow
  geo_deny: [DPRK, KP]  # placeholder; per ops-security pack-kr policy
