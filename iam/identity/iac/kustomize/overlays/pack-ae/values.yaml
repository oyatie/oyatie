# pack-ae overlay per UAE data-protection regulation + ADR-0179
packLabel: ae
zitadel:
  zitadelConfig:
    externalDomain: identity-ae.oyatie.com
    Telemetry:
      Endpoint: otel-collector.observability-ae.svc.cluster.local:4317
webauthn:
  attestation: direct
  rpId: identity-ae.oyatie.com
openbao:
  hsm:
    type: thales-dpod
    region: ae-dubai
aaguidRefresher:
  enforce_l1_plus: true
auditEmitter:
  retention_years: 1
edgeAuthz:
  geo_default: allow
