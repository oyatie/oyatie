# Default values for identity-zitadel.
# Override in per-pack overlays under iac/kustomize/overlays/pack-<pack>/values.yaml.
# Authority: ADR-0187, ADR-0117 (SecretReference), ADR-0146 (distroless-nonroot),
# ADR-0148 (Cilium + Ambient).

zitadel:
  replicaCount: 3
  image:
    # Pinned by digest per ADR-0181 image-promotion-pipeline.
    # Update digest in concert with appVersion bumps in Chart.yaml.
    repository: ghcr.io/zitadel/zitadel
    tag: v2.55.0
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: "1", memory: "1Gi" }
    limits:   { cpu: "2", memory: "2Gi" }

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: { type: RuntimeDefault }

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    readOnlyRootFilesystem: true

  service:
    type: ClusterIP
    ports:
      admin: 8080
      oidc:  8443

  zitadelConfig:
    # Per-pack overrides set externalSecure, externalDomain, externalPort.
    externalSecure: true
    externalDomain: identity-PACK.oyatie.com
    externalPort: 443
    tls:
      enabled: true
    # Postgres connection via OpenBao SecretReference per ADR-0117.
    database:
      cockroach:
        enabled: false
      postgres:
        enabled: true
        host: postgres-zitadel.identity.svc.cluster.local
        port: 5432
        database: zitadel
        admin:
          existingSecret:
            name: zitadel-postgres-admin
            key: connection-string
        user:
          existingSecret:
            name: zitadel-postgres-user
            key: connection-string
    # JWT signing key in OpenBao; rotation every 90d per ADR-0117.
    masterkeyExistingSecret:
      name: zitadel-masterkey
      key: masterkey
    # OIDC issuer config.
    log:
      level: info
      formatter:
        format: json
    metrics:
      enabled: true
      prometheus:
        enabled: true
        port: 9100

# Auto-scaling per capacity-model year-1.
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod-disruption budget for safe rolling.
pdb:
  enabled: true
  minAvailable: 2

# Istio Ambient enrolment per ADR-0148.
istio:
  ambient:
    enabled: true
    waypoint: identity-waypoint

# NetworkPolicy — restrict ingress to Envoy waypoint + egress to Postgres.
networkPolicy:
  enabled: true
  ingressAllowFrom:
    - namespaceSelector: { matchLabels: { name: istio-ingress } }
  egressAllowTo:
    - namespaceSelector: { matchLabels: { name: identity-postgres } }
    - namespaceSelector: { matchLabels: { name: cloud-secrets } }

# OpenBao SecretReference resolution.
openbao:
  enabled: true
  agentInjector:
    enabled: true
  # SecretReference paths per ADR-0117.
  secretReferences:
    postgresDsn: "${openbao:secret/identity/PACK/postgres-dsn}"
    jwtSigningKey: "${openbao:secret/identity/PACK/jwt-signing-key}"
    masterkey: "${openbao:secret/identity/PACK/masterkey}"
    adminBootstrap: "${openbao:secret/identity/PACK/admin-bootstrap-password}"

# WebAuthn relying-party config.
webauthn:
  rpId: identity-PACK.oyatie.com
  rpName: oyatie identity
  attestation: indirect      # tightened to "direct" in regulated-pack overlay
  userVerification: required

# SCIM endpoint.
scim:
  enabled: true
  basePath: /scim/v2
  maxItemsPerPage: 200

# FIDO-MDS3 AAGUID refresh worker.
aaguidRefresher:
  enabled: true
  scheduleCron: "0 */24 * * *"
  fidoMds3Endpoint: https://mds.fidoalliance.org/

# Audit emitter bridge to audit-chain µservice.
auditEmitter:
  enabled: true
  auditChainEndpoint: audit-chain.svc.cluster.local:9090
  retryAttempts: 3
  dlqPostgresConnection: "${openbao:secret/identity/PACK/audit-dlq-dsn}"

# Pack-overlay placeholder; per-pack overlay sets to actual pack identifier.
packLabel: PACK
