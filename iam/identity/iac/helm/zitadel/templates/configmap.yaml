apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: identity-{{ .Values.packLabel }}
  labels:
    app.kubernetes.io/part-of: identity
    pack: {{ .Values.packLabel | quote }}
data:
  config.yaml: |
    # Zitadel runtime config per pack. Authority: ADR-0187.
    ExternalSecure: true
    ExternalDomain: identity-{{ .Values.packLabel }}.oyatie.com
    ExternalPort: 443
    TLS:
      Enabled: true
    Log:
      Level: info
      Formatter:
        Format: json
    Metrics:
      Prometheus:
        Enabled: true
        Port: 9100
    Telemetry:
      # Use in-pack OTel collector per ADR-0186 observability backplane.
      Endpoint: otel-collector.observability-{{ .Values.packLabel }}.svc.cluster.local:4317
    DefaultInstance:
      DefaultLanguage: en
      OIDCSettings:
        AccessTokenLifetime: 15m
        IdTokenLifetime: 24h
        RefreshTokenIdleExpiration: 30d
        RefreshTokenExpiration: 90d
    WebAuthN:
      RPID: identity-{{ .Values.packLabel }}.oyatie.com
      RPName: oyatie identity
      UserVerification: required
      Attestation: indirect    # overlay tightens to direct in regulated packs
    SAML:
      Enabled: true
      DefaultLifetime: 5m
  steps.yaml: |
    Steps:
      - 1
      - 2
      - 3
