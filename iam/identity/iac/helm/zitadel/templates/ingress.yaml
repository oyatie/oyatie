apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: identity-{{ .Values.packLabel }}
  labels:
    app.kubernetes.io/part-of: identity
    pack: {{ .Values.packLabel | quote }}
spec:
  parentRefs:
    - name: identity-gateway
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - identity-{{ .Values.packLabel }}.oyatie.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth/v2 }
      backendRefs:
        - name: zitadel
          port: 8443
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: /webauthn }
      backendRefs:
        - name: zitadel
          port: 8443
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: /scim/v2 }
      backendRefs:
        - name: zitadel
          port: 8443
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: /.well-known }
      backendRefs:
        - name: zitadel
          port: 8443
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: /step-up }
      backendRefs:
        - name: zitadel
          port: 8443
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: /admin }
      backendRefs:
        - name: zitadel
          port: 8080
          weight: 100
