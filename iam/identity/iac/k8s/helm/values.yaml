microservice:
  id: identity
  cargoPackage: oya-identity
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-identity

image:
  registry: registry.oyatie.dev
  repository: oya-identity
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  grpcPort: 8081
  grpcTargetPort: 8081

identity:
  issuer: https://idp.oyatie.com
  audience: oya-cloud-kms
  # Secret holding the RFC 7517 JWKS document (key: jwks.json). Key custody
  # moves to the G02 KMS port; the mount contract stays the same.
  jwksSecretName: oya-identity-jwks
  # Secret holding the ES256 issuer signing key (key: signing-key.pk8). The
  # runtime serves OIDC discovery/JWKS only when OYA_IDENTITY_SIGNING_KEY_PATH is
  # present, so the chart wires the mounted key path explicitly.
  # Default EMPTY: the issuer surface is config-gated OFF, matching the binary
  # default (no OYA_IDENTITY_SIGNING_KEY_PATH => no discovery/JWKS routes).
  # Deployments that issue tokens opt in by naming the secret, e.g.
  # `oya-identity-signing-key`.
  signingKeySecretName: ""
  signingKeySecretKey: signing-key.pk8
  signingKeyPath: /etc/oya-identity/signing/signing-key.pk8
  # Optional bring-up principal seed (key: principals.json). The durable
  # principal store lands behind the G03 repository port.
  principalsConfigMapName: ""

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-identity-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    permit(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class == "{{ .Values.microservice.tenantClass }}"
    };

    forbid(
      principal,
      action,
      resource
    ) when {
      resource.microservice == "{{ .Values.microservice.id }}" &&
      principal.tenant_class != "{{ .Values.microservice.tenantClass }}"
    };

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
