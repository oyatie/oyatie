# Canonical-base: specs/catalog/canonical-crate-record-schema.json
name: oya-identity-workload-oidc-adapter
role: adapter
context: identity
bounded_context: workload-identity
plane: control
slo: oya-identity-oidc-token-verify-latency
contracts_consumed: []
contracts_exposed: []
regulatory_packs_consumed: []
lifecycle: { state: incubating, preview_since: 2026-05-26, stable_since: null, deprecated_since: null }
traceability:
  github_issue: "oya-governance-pipeline://identity-workload-t3-2026-05-26"
  source_adrs: [ADR-0002, ADR-0131]
allowed_dependency_edges: [oya-identity-workload-domain]
external_crates: [ring, base64, serde, serde_json]
data_classes_owned: [INTERNAL_ONLY, AUTHENTICATION, PII_IDENTIFYING]
operational_classes_owned: [AUTHENTICATION]
autonomy_tier_required: T0
notes: >
  Workload OIDC token validation core. Verifies a compact JWS
  (RS256/RS384/RS512, ES256) against issuer JWKs using ring (BoringSSL-backed,
  OSI-clean), checks iss/aud/exp/nbf/iat with a caller-supplied clock, then
  projects verified claims into a workload principal. RSA JWKs (n/e) are
  bridged to ring via an in-crate PKCS#1 RSAPublicKey DER encoder.
