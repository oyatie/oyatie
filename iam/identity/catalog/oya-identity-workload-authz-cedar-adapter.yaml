notes: >
  Cedar PARC authorization gate over the workload-identity domain:
  deny-by-default, explicit-permit, forbid-wins, and a lifecycle precondition.
  Ships a faithful in-crate Cedar-semantics evaluator behind the
  WorkloadAuthorizer trait; the upstream cedar-policy crate (Apache-2.0,
  declared in manifest.json#consumes_upstream_oss) is the documented drop-in
  swap target and is not vendored in this offline workspace.
