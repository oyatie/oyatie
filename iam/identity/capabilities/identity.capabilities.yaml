# Canonical-base: specs/capabilities/canonical-tier-schema.json
# Workload-identity bounded context capabilities (ADR-0002, ADR-0131, ADR-0183).
# Bounded context: workload-identity — machine-to-machine identity + authorization.
# Design grounding: microservices/identity/design/hyperscaler-best-practice-brief.md
namespace: identity
bounded_context: workload-identity
owner_team: axis-identity
created_at: 2026-05-26
related_adrs: [ADR-0002, ADR-0131, ADR-0183]
related_artifacts:
  - microservices/identity/workload-identity/PRD.md
  - microservices/identity/contracts/identity.openapi.yaml
  - microservices/identity/contracts/identity.asyncapi.yaml
  - microservices/identity/contracts/identity.proto
  - microservices/identity/policy/identity.cedar

capabilities:
  - id: cap:identity:workload-authorize:v1
    name: workload-authorize
    display_name: Authorize a workload PARC tuple (PDP)
    description: |
      Evaluate a (principal, action, resource, context) tuple against the
      tenant-scoped Cedar policy set and return {decision, determiningPolicies,
      errors}. Mirrors AWS Verified Permissions IsAuthorized. Default-deny +
      forbid-overrides-permit; empty determiningPolicies on DENY = implicit deny.
    autonomy_tier: T0
    risk_class: none
    tenant_class: T0
    inputs:
      - { name: policyStoreId, type: string, required: true }
      - { name: principal, type: object, required: true }
      - { name: action, type: object, required: true }
      - { name: resource, type: object, required: true }
      - { name: context, type: object, required: false }
    outputs:
      - { name: decision, type: string }          # ALLOW | DENY
      - { name: determiningPolicies, type: array }
      - { name: errors, type: array }
    slo_targets:
      - identity-workload-authorize-latency-p99
      - identity-workload-decision-correctness
    audit_events_emitted:
      - IdentityWorkloadAuthorizationDecided
    failure_modes:
      - policy-store-unavailable (503, fail-closed DENY)
      - caller-unauthorized (403)
      - quota-exceeded (429)
    security_controls:
      - Default-deny + forbid-overrides-permit (Cedar formal properties)
      - Tenant == trust-domain isolation on every permit
      - Embedded in-process Cedar for hot path (FinOps brief §8)
      - Fail-closed on store unavailability

  - id: cap:identity:workload-token-validate:v1
    name: workload-token-validate
    display_name: Validate an OIDC/JWS workload token
    description: |
      Run the ordered 8-step RFC 8725/9068 validation pipeline against cached
      JWKS using ring. The token header `alg` is never trusted; the algorithm is
      bound server-side per kid (the #1 JWT vuln class). Returns normalized
      RFC 9068 claims or a typed failure.
    autonomy_tier: T0
    risk_class: none
    tenant_class: T0
    inputs:
      - { name: token, type: string, required: true }
      - { name: expectedAudience, type: string, required: false }
      - { name: expectedIssuer, type: string, required: false }
    outputs:
      - { name: valid, type: boolean }
      - { name: claims, type: object }
    slo_targets:
      - identity-workload-validation-availability
    audit_events_emitted:
      - IdentityWorkloadTokenValidated
    failure_modes:
      - algorithm-mismatch (422)
      - issuer-untrusted (422)
      - audience-mismatch (422)
      - expired (422)
      - jwks-unavailable (503, fail-closed)
    security_controls:
      - Server-side algorithm allowlist per kid (RFC 8725 §3.1)
      - Reject alg:none (RFC 8725 §3.2)
      - Key-belongs-to-issuer check (RFC 8725 §3.8)
      - jku/x5u allowlist-gated, kid sanitized (SSRF defense §3.10)
      - Clock skew bounded ≤60s, never disable-able (RFC 9068)

  - id: cap:identity:workload-principal-lifecycle:v1
    name: workload-principal-lifecycle
    display_name: Transition a WorkloadPrincipal lifecycle state
    description: |
      Drive a WorkloadPrincipal through provision → active → suspended → retired.
      suspend/retire write the principal to the fast revocation denylist
      consulted at validate-time; retired ids are tombstoned and never reused.
    autonomy_tier: T1
    risk_class: limited
    tenant_class: T1
    inputs:
      - { name: principalId, type: string, required: true }
      - { name: transition, type: string, required: true }  # suspend | retire
      - { name: reason, type: string, required: true }
    outputs:
      - { name: principal, type: object }
    slo_targets:
      - identity-workload-validation-availability
    audit_events_emitted:
      - IdentityWorkloadPrincipalSuspended
      - IdentityWorkloadPrincipalRetired
    failure_modes:
      - invalid-transition (409/422)
      - caller-unauthorized (403)
    security_controls:
      - Explicit transition sub-resources (no status PATCH)
      - Principal-id immutability + non-reuse (tombstoned on retire)
      - Every transition sealed to the audit chain
