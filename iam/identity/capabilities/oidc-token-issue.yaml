# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:identity:oidc-token-issue:v1
name: oidc-token-issue
namespace: identity
display_name: Issue OIDC ID-token
description: |
  Issue a signed OIDC ID-token + access-token pair for an authenticated
  principal. Carries the canonical claims tenant_id, acr, purpose,
  data_class plus standard OIDC claims iss/aud/sub/iat/exp/jti.

  Hot path: every consumer µservice call originates from a token issued
  here. The JWKS endpoint serves the public key; consumer µservices
  cache it 24h.

owner_team: axis-identity
maturity: stable
created_at: 2026-05-18
related_adrs: [ADR-0145, ADR-0187]
related_artifacts:
  - iam/identity/PRD.md
  - iam/identity/contracts/openapi/identity.yaml
  - iam/identity/contracts/proto/identity.proto

autonomy_tier: T0
# T0 = hot-path operation; sub-80ms p99; called by every consumer.
# No agent decisioning; deterministic protocol implementation.

risk_class: none
# OIDC issuance is administrative; no AI decisioning.

inputs:
  - name: grant_type
    type: string
    pattern: '^(authorization_code|refresh_token|device_code|client_credentials)$'
    required: true
  - name: client_id
    type: string
    required: true
  - name: client_secret
    type: string
    required: false # public clients use PKCE instead
  - name: code
    type: string
    required: false
  - name: code_verifier
    type: string
    required: false

outputs:
  - name: access_token
    type: string
  - name: id_token
    type: string
  - name: refresh_token
    type: string
  - name: expires_in
    type: integer

slo_targets:
  - oya-identity-oidc-token-issue-latency
  - oya-identity-jwks-availability

audit_events_emitted:
  - IdentityOidcTokenIssued

failure_modes:
  - invalid_grant (400)
  - invalid_client (401)
  - upstream_zitadel_5xx (503)

security_controls:
  - PKCE mandatory for public clients
  - Per-tenant client_secret in OpenBao
  - Rate-limit 100rps/tenant + 10rps/IP at edge
  - JWT signing key in HSM (regulated packs)
