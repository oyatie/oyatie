id: cap:identity:multi-context-principal-resolve:v1
name: multi-context-principal-resolve
namespace: identity
display_name: Resolve Active Principal Context
description: |
  Resolve the active context for a principal and return the context envelope
  required by Cedar, audit-chain slicing, and downstream microservices.

owner_team: axis-identity
maturity: scaffolded
created_at: 2026-05-18
related_adrs: [ADR-0215]
related_artifacts:
  - iam/identity/contracts/openapi/multi-context-split.yaml
  - iam/identity/contracts/proto/multi_context_split.proto
  - iam/identity/policy/context-split.cedar

autonomy_tier: T1
inputs:
  - name: principal_id
    type: string
    required: true
  - name: requested_context_id
    type: string
    required: false
  - name: purpose
    type: string
    required: true

outputs:
  - name: principal_id
    type: string
  - name: active_context_id
    type: string
  - name: context_type
    type: enum
    values: [personal, work, healthcare, marketplace, community]
  - name: allowed_context_switches
    type: array

data_classes_touched:
  - PII_IDENTIFYING
  - AUTHENTICATION
  - AUDIT

cedar_policy_fragments:
  - iam/identity/policy/context-split.cedar

evidence_topic: oya.identity.context.resolved
eval_set:
  core_inputs_path: microservices/identity/capabilities/eval/multi-context-principal-resolve-core.jsonl
  pass_threshold: 1.0
  eval_metric: context-isolation-and-switch-refusal-correctness
  cadence: per-release
