# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json
id: cap:identity:webauthn-authenticate:v1
name: webauthn-authenticate
namespace: identity
display_name: Authenticate via WebAuthn Level-3
description: |
  WebAuthn assertion ceremony: present credential, verify signature against
  stored public key, enforce sign-count monotonicity (clone-detection), mint
  OIDC session on success.

  Hot path for every interactive sign-in. Conditional UI (autofill) is
  the preferred mode for SignInForm pages.

owner_team: axis-identity
maturity: stable
created_at: 2026-05-18
related_adrs: [ADR-0188]

autonomy_tier: T0
risk_class: none

inputs:
  - name: challenge_id
    type: string
    required: true
  - name: credential_id
    type: bytes
    required: true
  - name: client_data_json
    type: bytes
    required: true
  - name: authenticator_data
    type: bytes
    required: true
  - name: signature
    type: bytes
    required: true
  - name: user_handle
    type: bytes
    required: false

outputs:
  - name: access_token
    type: string
  - name: id_token
    type: string
  - name: credential_id
    type: bytes

slo_targets:
  - identity-webauthn-authenticate-latency

audit_events_emitted:
  - IdentitySignInSucceeded
  - IdentitySignInFailed

failure_modes:
  - challenge_not_found (400)
  - challenge_expired (401)
  - assertion_invalid (401)
  - sign_count_regression (401 + credential revoked)
  - credential_not_found (404)

security_controls:
  - Sign-count monotonic; regression triggers credential revocation
  - AAGUID allowlist enforced in regulated packs (FIDO-MDS3 L1+)
  - RP-ID locked to <pack>.oyatie.dev (anti-phishing)
  - Challenge TTL 300s
  - Rate-limit 5/IP/60s on finish endpoint
