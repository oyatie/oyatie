openapi: 3.2.0
info:
  title: Oyatie Workload-Identity Authorization API
  version: 1.0.0
  summary: Workload-principal token validation + Cedar PARC authorization (PDP API).
  description: |
    REST contract for the workload-identity bounded context of the `identity`
    µservice (crates `identity-workload-domain`, `identity-workload-oidc-adapter`,
    `identity-workload-authz-cedar-adapter` per ADR-0002 + ADR-0131).

    This is the **PDP (Policy Decision Point) API**. Callers are PEPs (Policy
    Enforcement Points) — Envoy waypoints, sidecars, in-process gates — that ask
    this service for an authorization decision over a (principal, action, resource,
    context) tuple, optionally first validating an OIDC/JWS bearer token.

    Design is grounded in the hyperscaler best-practice brief
    (`microservices/identity/design/hyperscaler-best-practice-brief.md`):

    - `/authorize` mirrors AWS Verified Permissions (AVP) `IsAuthorized`: a PARC
      request returns `{decision, determiningPolicies, errors}`. An empty
      `determiningPolicies` array on a `DENY` is an **implicit deny** (no policy
      matched) and MUST be distinguished from an explicit `forbid` (brief §2, §9).
    - `/tokens/validate` validates a compact JWS against the server-side
      algorithm allowlist (RFC 8725 §3.1) and normalizes RFC 9068 access-token
      claims; it NEVER trusts the token header `alg` (brief load-bearing flag #1).
    - Authorization failures return **403, never 404** — existence of a resource
      or policy is never leaked through the status code (brief §2).
    - The typed error schema enumerates the exact failure reasons the brief calls
      out: algorithm-mismatch, issuer-untrusted, audience-mismatch, expired,
      jwks-unavailable, principal-suspended.

    Fail-closed posture (brief §10): on any uncertainty — no key, store
    unreachable, malformed token, suspended principal — the service denies.
  contact:
    name: axis-identity
    url: https://github.com/oyatie/oyatie/blob/dev/microservices/identity/README.md
  license:
    name: Internal
servers:
  - url: https://api.{cell}.oyatie.io/identity/workload/v1
    description: Cell-routed workload-identity PDP API (north-south via API gateway, ADR-0182)
    variables:
      cell:
        default: dev
        enum: [dev, kr-seoul-1, eu-frankfurt-1, us-east-1, sg-1, au-1, jp-1, ksa-1, ae-1, in-1, br-1]
security:
  - bearerAuth: []
tags:
  - name: authorize
    description: Cedar PARC authorization decisions (PDP).
  - name: tokens
    description: OIDC/JWS workload-token validation.
  - name: principals
    description: WorkloadPrincipal lifecycle transitions.
  - name: internal
    description: Liveness / readiness probes.
paths:
  /healthz:
    get:
      tags: [internal]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: process is live
  /readyz:
    get:
      tags: [internal]
      summary: Readiness probe — verifies JWKS cache warm + policy store reachable (or embedded-Cedar fallback armed)
      operationId: getReadyz
      security: []
      responses:
        '200':
          description: ready to serve authorize + validate
        '503':
          description: |
            Not ready. Per the fail-closed posture, `503` here means the PDP will
            answer `/authorize` with `DENY` until the policy store or JWKS cache
            recovers. PEPs MUST treat upstream 503 as deny, never as allow.
  /authorize:
    post:
      tags: [authorize]
      summary: Authorize a (principal, action, resource, context) tuple
      operationId: authorize
      description: |
        Evaluate the Cedar PARC tuple against the tenant-scoped policy set
        (`microservices/identity/policy/identity.cedar`). Mirrors AVP
        `IsAuthorized` (brief §2). Default-deny + forbid-overrides-permit are
        guaranteed by the Cedar evaluator (Cedar formal properties, brief §10).

        `determiningPolicies` lists the policy ids that decided the outcome:
        - `DENY` with a non-empty `determiningPolicies` = an explicit `forbid` won.
        - `DENY` with an **empty** `determiningPolicies` = **implicit deny**
          (no `permit` matched). Both are denials; the distinction is preserved
          for audit forensics and is emitted on `identity.authz.decision.v1`.

        On authorization failure this endpoint returns the decision body with
        HTTP `200` (the request was a well-formed query that was answered);
        a `403` is returned only when the *caller itself* is not authorized to
        ask the PDP. Existence is never leaked: a malformed/unknown resource type
        surfaces as a typed `errors[]` entry, not a `404`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
            examples:
              implicitDeny:
                summary: No policy matches → implicit deny
                value:
                  policyStoreId: tenant_acme
                  principal: { entityType: "Oya::WorkloadPrincipal", entityId: "spiffe://acme.oyatie.com/ns/payments/sa/ledger-writer" }
                  action: { actionType: "Oya::Action", actionId: "ledger:Write" }
                  resource: { entityType: "Oya::Ledger", entityId: "tenant_acme/ledger/main" }
                  context: { mfa_present: false, source_cell: "eu-frankfurt-1" }
      responses:
        '200':
          description: Decision rendered (ALLOW or DENY). HTTP 200 means the query was answered, not that access was granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDecision'
              examples:
                explicitForbid:
                  summary: Explicit forbid won
                  value:
                    decision: DENY
                    determiningPolicies: [{ policyId: "forbid-suspended-principal" }]
                    errors: []
                implicitDeny:
                  summary: No permit matched
                  value:
                    decision: DENY
                    determiningPolicies: []
                    errors: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/PolicyStoreUnavailable'
  /authorize:batch:
    post:
      tags: [authorize]
      summary: Batch-authorize many tuples in one round trip (AVP BatchIsAuthorized analog)
      operationId: batchAuthorize
      description: |
        Evaluate up to 30 PARC tuples that share one `policyStoreId` (and may
        share a common `entities` set) in a single call. Per the FinOps brief
        (§8), batching collapses the dominant per-call network cost on the hot
        authorize path. Each sub-request is decided independently; one bad tuple
        yields a per-item `errors[]` entry and does not fail the batch.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAuthorizationRequest'
      responses:
        '200':
          description: Per-item decisions, index-aligned with the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAuthorizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/PolicyStoreUnavailable'
  /tokens/validate:
    post:
      tags: [tokens]
      summary: Validate an OIDC/JWS workload token (RFC 9068 + RFC 8725 pipeline)
      operationId: validateToken
      description: |
        Run the ordered, fail-fast 8-step validation pipeline (brief §1):
        (1) resolve `kid` → key from the cached JWKS;
        (2) verify the signature against the **server-side algorithm allowlist**
            bound to that `kid` (ES256 / RS256 / RS384 / RS512 via `ring`);
        (3) reject `alg:none`;
        (4) validate `iss` and that the key belongs to the issuer;
        (5) validate `aud` binding;
        (6) validate `exp` / `nbf` / `iat` with a configurable skew ≤ 60s;
        (7) sanitize `kid`, allowlist-gate any `jku` / `x5u` (SSRF defense);
        (8) require an explicit `typ`.

        The token header `alg` is NEVER trusted; the algorithm is chosen
        server-side per `kid` (RFC 8725 §3.1, the #1 JWT vuln class). On success,
        the normalized RFC 9068 claim set is returned and projected into a
        WorkloadPrincipal reference.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenValidationRequest'
      responses:
        '200':
          description: Token is valid; normalized claims returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: |
            Token was well-formed but failed validation. The body carries the
            typed reason (algorithm-mismatch / issuer-untrusted / audience-mismatch
            / expired / jwks-unavailable). `422` (not `200 {valid:false}`) makes
            the failure unambiguous to PEPs and keeps the fail-closed contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/JwksUnavailable'
  /authorize-with-token:
    post:
      tags: [authorize, tokens]
      summary: Validate a token, then authorize using the projected principal (AVP IsAuthorizedWithToken analog)
      operationId: authorizeWithToken
      description: |
        One round trip that (a) runs the `/tokens/validate` pipeline on the
        supplied bearer, (b) projects the verified claims into the request
        principal, and (c) evaluates the PARC tuple. If validation fails the call
        returns `422` with the typed token error and performs **no** authorization
        (fail-closed). A suspended/retired principal surfaces as a `DENY` whose
        determining policy is `forbid-suspended-principal`, plus a
        `principal-suspended` entry in `errors[]`.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeWithTokenRequest'
      responses:
        '200':
          description: Token valid; decision rendered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Token failed validation; no authorization performed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/PolicyStoreUnavailable'
  /principals/{principalId}:suspend:
    post:
      tags: [principals]
      summary: Suspend a WorkloadPrincipal (active → suspended)
      operationId: suspendPrincipal
      description: |
        Explicit lifecycle transition sub-resource (brief §2 — transitions are
        modeled as `:suspend` / `:retire` actions, never a status PATCH). A
        suspended principal is added to the fast revocation denylist consulted at
        token-validate time; because workload tokens are short-lived (minutes),
        revocation latency is bounded by token TTL + denylist propagation
        (brief §1, §10). Returns `403` (never `404`) if the caller may not manage
        this principal.
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Principal suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadPrincipal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          description: Transition not allowed from current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /principals/{principalId}:retire:
    post:
      tags: [principals]
      summary: Retire a WorkloadPrincipal (active|suspended → retired, terminal)
      operationId: retirePrincipal
      description: |
        Terminal transition. A retired principal id is **tombstoned and never
        reused** (brief §5 — principal-id immutability + non-reuse). All tokens
        for the principal are denied at validate-time thereafter. Idempotent: a
        second retire of an already-retired principal returns `200` with the
        existing tombstone.
      parameters:
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleTransitionRequest'
      responses:
        '200':
          description: Principal retired (tombstoned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadPrincipal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidTransition'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Caller (PEP) authentication — the workload token of the calling enforcement point itself.
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Trace correlation id, echoed on the response and the emitted decision event.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: Optional idempotency key for safe retries of authorize.
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        description: SPIFFE-shaped workload principal id, e.g. `spiffe://<trust-domain>/ns/<ns>/sa/<name>`.
        maxLength: 512
  responses:
    BadRequest:
      description: Malformed request body or parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Caller (PEP) bearer is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Caller is authenticated but not permitted to perform this operation, OR a
        no-policy-match on a management action. Returned as **403, never 404** so
        resource/policy existence is not leaked (brief §2).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Per-tenant authorize quota exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: Lifecycle transition not allowed from the principal's current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PolicyStoreUnavailable:
      description: |
        Policy store unreachable and embedded-Cedar fallback could not render a
        decision. Fail-closed: PEPs MUST treat this as DENY.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    JwksUnavailable:
      description: |
        JWKS could not be fetched and the in-memory last-known-good cache is empty
        or expired. Fail-closed: validation is refused (brief §10).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    EntityRef:
      type: object
      description: Cedar entity reference (type + id), as used by AVP.
      required: [entityType, entityId]
      properties:
        entityType:
          type: string
          example: "Oya::WorkloadPrincipal"
        entityId:
          type: string
          example: "spiffe://acme.oyatie.com/ns/payments/sa/ledger-writer"
    ActionRef:
      type: object
      required: [actionType, actionId]
      properties:
        actionType: { type: string, example: "Oya::Action" }
        actionId: { type: string, example: "ledger:Write" }
    AuthorizationRequest:
      type: object
      required: [policyStoreId, principal, action, resource]
      properties:
        policyStoreId:
          type: string
          description: Tenant-scoped Cedar policy partition id. Equals the tenant trust domain (brief §6).
          example: tenant_acme
        principal: { $ref: '#/components/schemas/EntityRef' }
        action: { $ref: '#/components/schemas/ActionRef' }
        resource: { $ref: '#/components/schemas/EntityRef' }
        context:
          type: object
          additionalProperties: true
          description: |
            Cedar context record (the C in PARC). Operational, non-PII signals
            only — e.g. `mfa_present`, `source_cell`, `request_time`. PII claims
            are never placed here (brief §7 — classify PII vs operational).
        entities:
          type: array
          description: Optional inline Cedar entity definitions + parent edges for this evaluation.
          items: { $ref: '#/components/schemas/EntityDefinition' }
    EntityDefinition:
      type: object
      required: [identifier]
      properties:
        identifier: { $ref: '#/components/schemas/EntityRef' }
        attributes:
          type: object
          additionalProperties: true
        parents:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
    AuthorizationDecision:
      type: object
      required: [decision, determiningPolicies, errors]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY]
        determiningPolicies:
          type: array
          description: |
            Policy ids that decided the outcome. **Empty on a DENY = implicit deny**
            (no permit matched); non-empty on a DENY = an explicit forbid won.
          items:
            type: object
            required: [policyId]
            properties:
              policyId: { type: string }
        errors:
          type: array
          description: Non-fatal evaluation errors (e.g. unrecognized entity type, missing attribute).
          items: { $ref: '#/components/schemas/Error' }
    BatchAuthorizationRequest:
      type: object
      required: [policyStoreId, requests]
      properties:
        policyStoreId: { type: string, example: tenant_acme }
        entities:
          type: array
          description: Shared entity set applied to every sub-request.
          items: { $ref: '#/components/schemas/EntityDefinition' }
        requests:
          type: array
          maxItems: 30
          minItems: 1
          items:
            type: object
            required: [principal, action, resource]
            properties:
              principal: { $ref: '#/components/schemas/EntityRef' }
              action: { $ref: '#/components/schemas/ActionRef' }
              resource: { $ref: '#/components/schemas/EntityRef' }
              context: { type: object, additionalProperties: true }
    BatchAuthorizationResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: Index-aligned with `requests`.
          items:
            allOf:
              - $ref: '#/components/schemas/AuthorizationDecision'
    TokenValidationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Compact JWS (header.payload.signature). The header `alg` is NOT trusted (RFC 8725 §3.1).
        expectedAudience:
          type: string
          description: Required `aud` binding for this PEP/resource (brief §5 confused-deputy defense).
        expectedIssuer:
          type: string
          description: Optional issuer override; defaults to the tenant trust-domain → JWKS map.
        nowUnixSeconds:
          type: integer
          format: int64
          description: Optional caller-supplied clock for deterministic verification; server clock used if omitted.
    TokenValidationResult:
      type: object
      required: [valid, claims]
      properties:
        valid:
          type: boolean
          enum: [true]
        claims: { $ref: '#/components/schemas/Rfc9068Claims' }
        principalRef:
          $ref: '#/components/schemas/EntityRef'
    Rfc9068Claims:
      type: object
      description: Normalized RFC 9068 JWT access-token claims.
      required: [iss, sub, aud, exp, iat]
      properties:
        iss: { type: string, description: Issuer; validated against the trust-domain JWKS map. }
        sub: { type: string, description: Subject — the immutable workload principal id. PII-class is operational/identifying per brief §7. }
        aud:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        exp: { type: integer, format: int64 }
        iat: { type: integer, format: int64 }
        nbf: { type: integer, format: int64 }
        client_id: { type: string }
        jti: { type: string, description: Token id used for replay forensics (brief §5, §9); the token body is never logged, only sub + jti. }
        azp: { type: string }
        tenant_id: { type: string, description: Trust domain = tenant (brief §6). }
        scope: { type: string }
    AuthorizeWithTokenRequest:
      type: object
      required: [policyStoreId, token, action, resource]
      properties:
        policyStoreId: { type: string }
        token: { type: string }
        expectedAudience: { type: string }
        action: { $ref: '#/components/schemas/ActionRef' }
        resource: { $ref: '#/components/schemas/EntityRef' }
        context: { type: object, additionalProperties: true }
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityDefinition' }
    LifecycleTransitionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Operator-supplied reason, sealed into the emitted lifecycle event.
          maxLength: 1024
        actor:
          type: string
          description: Acting principal id (operator or automation) for the audit record.
    WorkloadPrincipal:
      type: object
      required: [principalId, trustDomain, tenantId, state]
      properties:
        principalId:
          type: string
          description: SPIFFE-shaped, immutable, never-reused id.
          example: "spiffe://acme.oyatie.com/ns/payments/sa/ledger-writer"
        trustDomain:
          type: string
          description: SPIFFE trust domain == tenant (brief §6).
          example: "acme.oyatie.com"
        tenantId:
          type: string
          example: tenant_acme
        state:
          type: string
          enum: [provision, active, suspended, retired]
          description: Lifecycle state. `retired` is terminal + tombstoned.
        capabilities:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        claims:
          type: object
          additionalProperties: true
          description: Operational claims projected onto the principal (no token bodies persisted, brief §7).
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [reason, message]
      properties:
        reason:
          type: string
          description: |
            Stable machine-readable reason. The enum encodes the exact failure
            classes the best-practice brief calls out (§2, §5).
          enum:
            - algorithm-mismatch
            - issuer-untrusted
            - audience-mismatch
            - expired
            - not-yet-valid
            - jwks-unavailable
            - principal-suspended
            - principal-retired
            - policy-store-unavailable
            - unrecognized-entity-type
            - missing-attribute
            - malformed-token
            - alg-none-rejected
            - jku-not-allowlisted
            - invalid-transition
            - quota-exceeded
            - caller-unauthorized
        message:
          type: string
          description: Human-readable detail. Never contains token bodies, secrets, or PII.
        policyStoreId:
          type: string
        requestId:
          type: string
