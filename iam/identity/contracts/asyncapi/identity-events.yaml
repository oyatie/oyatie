asyncapi: 3.1.0
info:
  title: identity — events
  version: 1.0.0
  summary: 18 sealed events emitted by the identity µservice per ADR-0162.
  description: |
    Every event is Ed25519-signed by the per-pack identity signing key and
    sealed in `audit-chain` µservice per Bominal ADR-0028. Downstream
    consumers verify signatures + Merkle proof before acting.

    Per ADR-0162 per-tenant audit-log slicing: each event carries
    `tenant_id` for per-tenant replay queries.

    Authoritative event list — DO NOT ADD events without amending this
    contract + manifest.json#audit_chain.seal_events + audit-chain
    µservice ContentValidator.
  contact:
    name: axis-identity

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.identity.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus
  audit-chain-bridge:
    host: audit-chain.svc.cluster.local
    protocol: https
    description: Ed25519-signed bridge to audit-chain µservice

channels:
  identity.user.lifecycle:
    address: identity.user.lifecycle.v1
    messages:
      UserProvisioned: { $ref: '#/components/messages/UserProvisioned' }
      UserReactivated: { $ref: '#/components/messages/UserReactivated' }
      UserSuspended: { $ref: '#/components/messages/UserSuspended' }
      UserDeleted: { $ref: '#/components/messages/UserDeleted' }
  identity.signin:
    address: identity.signin.v1
    messages:
      SignInSucceeded: { $ref: '#/components/messages/SignInSucceeded' }
      SignInFailed: { $ref: '#/components/messages/SignInFailed' }
  identity.step-up:
    address: identity.step-up.v1
    messages:
      StepUpGranted: { $ref: '#/components/messages/StepUpGranted' }
      StepUpDenied: { $ref: '#/components/messages/StepUpDenied' }
  identity.webauthn:
    address: identity.webauthn.v1
    messages:
      WebAuthnRegistered: { $ref: '#/components/messages/WebAuthnRegistered' }
      WebAuthnRevoked: { $ref: '#/components/messages/WebAuthnRevoked' }
  identity.scim:
    address: identity.scim.v1
    messages:
      ScimRequestReceived: { $ref: '#/components/messages/ScimRequestReceived' }
  identity.oidc:
    address: identity.oidc.v1
    messages:
      OidcTokenIssued: { $ref: '#/components/messages/OidcTokenIssued' }
      OidcTokenRevoked: { $ref: '#/components/messages/OidcTokenRevoked' }
      JwksRotated: { $ref: '#/components/messages/JwksRotated' }
  identity.federation:
    address: identity.federation.v1
    messages:
      ExternalIdpBound: { $ref: '#/components/messages/ExternalIdpBound' }
      ExternalIdpUnbound: { $ref: '#/components/messages/ExternalIdpUnbound' }
  identity.hris:
    address: identity.hris.v1
    messages:
      HrisHirePulled: { $ref: '#/components/messages/HrisHirePulled' }
      HrisTerminationPulled: { $ref: '#/components/messages/HrisTerminationPulled' }

operations:
  emitUserProvisioned:
    action: send
    channel: { $ref: '#/channels/identity.user.lifecycle' }
    messages: [ { $ref: '#/channels/identity.user.lifecycle/messages/UserProvisioned' } ]
  emitSignInSucceeded:
    action: send
    channel: { $ref: '#/channels/identity.signin' }
    messages: [ { $ref: '#/channels/identity.signin/messages/SignInSucceeded' } ]
  emitStepUpGranted:
    action: send
    channel: { $ref: '#/channels/identity.step-up' }
    messages: [ { $ref: '#/channels/identity.step-up/messages/StepUpGranted' } ]

components:
  schemas:
    EventEnvelope:
      type: object
      required: [event_id, event_type, tenant_id, timestamp_unix_micros, payload, signature_b64, signing_key_kid]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        tenant_id: { type: string }
        pack: { type: string }
        user_id: { type: string }
        actor: { type: string }
        timestamp_unix_micros: { type: integer }
        payload: { type: object }
        signature_b64: { type: string }
        signing_key_kid: { type: string }
  messages:
    UserProvisioned:
      name: IdentityUserProvisioned
      title: Identity user provisioned
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    UserReactivated:
      name: IdentityUserReactivated
      title: Identity user reactivated
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    UserSuspended:
      name: IdentityUserSuspended
      title: Identity user suspended
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    UserDeleted:
      name: IdentityUserDeleted
      title: Identity user deleted
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    SignInSucceeded:
      name: IdentitySignInSucceeded
      title: Identity sign-in succeeded
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    SignInFailed:
      name: IdentitySignInFailed
      title: Identity sign-in failed
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    StepUpGranted:
      name: IdentityStepUpGranted
      title: Step-up grant
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    StepUpDenied:
      name: IdentityStepUpDenied
      title: Step-up denied
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    WebAuthnRegistered:
      name: IdentityWebAuthnRegistered
      title: WebAuthn credential registered
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    WebAuthnRevoked:
      name: IdentityWebAuthnRevoked
      title: WebAuthn credential revoked
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    ScimRequestReceived:
      name: IdentityScimRequestReceived
      title: SCIM request received
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    OidcTokenIssued:
      name: IdentityOidcTokenIssued
      title: OIDC token issued
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    OidcTokenRevoked:
      name: IdentityOidcTokenRevoked
      title: OIDC token revoked
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    JwksRotated:
      name: IdentityJwksRotated
      title: JWKS rotated
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    ExternalIdpBound:
      name: IdentityExternalIdpBound
      title: External IdP federation binding added
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    ExternalIdpUnbound:
      name: IdentityExternalIdpUnbound
      title: External IdP federation binding removed
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    HrisHirePulled:
      name: IdentityHrisHirePulled
      title: HRIS hire pulled
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
    HrisTerminationPulled:
      name: IdentityHrisTerminationPulled
      title: HRIS termination pulled
      contentType: application/json
      payload: { $ref: '#/components/schemas/EventEnvelope' }
