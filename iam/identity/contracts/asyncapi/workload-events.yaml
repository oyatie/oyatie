asyncapi: 3.1.0
info:
  title: identity-workload — events
  version: 1.0.0
  summary: Sealed decision-log events emitted by the workload-identity service.
  description: |
    The workload-identity service emits exactly one immutable record per
    authorize call (`workload.decision.v1`) and per token validation
    (`workload.token-validation.v1`) per ADR-0162 + PRD §3.3 / AC-W-13. Each
    event is Ed25519-signed by the per-pack identity signing key and sealed in
    the `audit-chain` µservice. Downstream consumers verify signature + Merkle
    proof before acting.

    Authoritative event list — DO NOT ADD events without amending this contract
    + manifest.json#audit_chain.seal_events + the audit-chain ContentValidator.
  contact:
    name: axis-identity

defaultContentType: application/json

servers:
  workflow-events-bus:
    host: workflow-events.identity.svc.cluster.local
    protocol: amqp
    description: Internal AMQP event bus
  audit-chain-bridge:
    host: audit-chain.svc.cluster.local
    protocol: https
    description: Ed25519-signed bridge to audit-chain µservice

channels:
  workload.decision:
    address: workload.decision.v1
    messages:
      WorkloadAuthorizeDecided: { $ref: '#/components/messages/WorkloadAuthorizeDecided' }
  workload.token-validation:
    address: workload.token-validation.v1
    messages:
      WorkloadTokenValidated: { $ref: '#/components/messages/WorkloadTokenValidated' }

operations:
  emitWorkloadAuthorizeDecided:
    action: send
    channel: { $ref: '#/channels/workload.decision' }
    messages:
      - { $ref: '#/channels/workload.decision/messages/WorkloadAuthorizeDecided' }
  emitWorkloadTokenValidated:
    action: send
    channel: { $ref: '#/channels/workload.token-validation' }
    messages:
      - { $ref: '#/channels/workload.token-validation/messages/WorkloadTokenValidated' }

components:
  schemas:
    EventEnvelope:
      type: object
      required: [event_id, event_type, tenant_id, timestamp_unix_micros, payload, signature_b64, signing_key_kid]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        tenant_id: { type: string }
        pack: { type: string }
        workload_id: { type: string }
        actor: { type: string }
        timestamp_unix_micros: { type: integer }
        payload: { type: object }
        signature_b64: { type: string }
        signing_key_kid: { type: string }
    WorkloadDecisionPayload:
      type: object
      required: [workload_id, effect, reason_kind]
      properties:
        workload_id: { type: string }
        effect:
          type: string
          enum: [ALLOW, DENY]
        reason_kind:
          type: string
          enum: [explicitPermit, explicitForbid, defaultDeny, principalNotOperational]
        policy_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        deny_stage:
          type: string
          description: For a fail-closed deny, the stage that denied.
          enum: [policy, token-rejected, principal-unknown, revoked, store-unavailable]
    WorkloadTokenValidationPayload:
      type: object
      required: [outcome]
      properties:
        workload_id: { type: string }
        outcome:
          type: string
          enum: [validated, validation-failed]
        failure_class:
          type: string
          description: For validation-failed, the OIDC error class.
  messages:
    WorkloadAuthorizeDecided:
      name: WorkloadAuthorizeDecided
      title: Workload authorize decided
      contentType: application/json
      summary: One immutable record per authorize call (permit or fail-closed deny).
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/WorkloadDecisionPayload' }
    WorkloadTokenValidated:
      name: WorkloadTokenValidated
      title: Workload token validated
      contentType: application/json
      summary: One immutable record per token validation (success or failure).
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              payload: { $ref: '#/components/schemas/WorkloadTokenValidationPayload' }
