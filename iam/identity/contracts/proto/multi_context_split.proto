// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

package oyatie.identity.context.v1;

service PrincipalContextResolver {
  rpc ResolvePrincipalContext (ResolvePrincipalContextRequest) returns (PrincipalContextEnvelope);
}

message ResolvePrincipalContextRequest {
  string principal_id = 1;
  string requested_context_id = 2;
  string purpose = 3;
}

message PrincipalContextEnvelope {
  string principal_id = 1;
  string active_context_id = 2;
  ContextType context_type = 3;
  string tenant_id = 4;
  string organization_id = 5;
  string sovereignty_region = 6;
  repeated string allowed_context_switches = 7;
  string audit_event = 8;
}

enum ContextType {
  CONTEXT_TYPE_UNSPECIFIED = 0;
  CONTEXT_TYPE_PERSONAL = 1;
  CONTEXT_TYPE_WORK = 2;
  CONTEXT_TYPE_HEALTHCARE = 3;
  CONTEXT_TYPE_MARKETPLACE = 4;
  CONTEXT_TYPE_COMMUNITY = 5;
}
