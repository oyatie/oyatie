// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

// Authority: ADR-0145 internal service RPC, ADR-0187 Zitadel canonical IdP.
// Transport identity: SPIFFE mTLS/TLS 1.3 over HTTP/2; bearer tokens are verification payloads.
//
// Internal-only proto3 for ext_authz between Envoy waypoint and Cedar PDP +
// internal admin RPC between identity µservice and its workers. NOT exposed
// externally — external surface is OpenAPI 3.2 in identity.yaml.

package oya.identity.v1;

// =============================================================================
// ext_authz contract (consumed by Envoy ext_authz filter at waypoint).
// =============================================================================

service IdentityVerifier {
  // Verify a bearer token, return the canonical claims + verification status.
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  // Bulk verify for performance hot paths.
  rpc VerifyBatch(VerifyBatchRequest) returns (VerifyBatchResponse);
}

message VerifyRequest {
  string bearer = 1;
  string expected_issuer = 2;
  string expected_audience = 3;
  int64 now_unix_seconds = 4;
}

message VerifyResponse {
  bool ok = 1;
  oneof outcome {
    Claims claims = 2;
    VerifyError error = 3;
  }
}

message Claims {
  string iss = 1;
  repeated string aud = 2;
  string sub = 3;
  int64 iat = 4;
  int64 exp = 5;
  optional int64 nbf = 6;
  string tenant_id = 7;
  AcrLevel acr = 8;
  optional int64 acr_event_at = 9;
  optional string purpose = 10;
  optional string data_class = 11;
  optional string jti = 12;
}

enum AcrLevel {
  ACR_UNSPECIFIED = 0;
  ACR_ROUTINE = 1;
  ACR_ELEVATED = 2;
  ACR_SENSITIVE = 3;
  ACR_CRITICAL = 4;
}

message VerifyError {
  ErrorKind kind = 1;
  string detail = 2;
}

enum ErrorKind {
  ERROR_UNSPECIFIED = 0;
  ERROR_MALFORMED = 1;
  ERROR_UNKNOWN_KID = 2;
  ERROR_ALG_MISMATCH = 3;
  ERROR_SIGNATURE_INVALID = 4;
  ERROR_ISSUER_MISMATCH = 5;
  ERROR_AUDIENCE_MISMATCH = 6;
  ERROR_EXPIRED = 7;
  ERROR_NOT_YET_VALID = 8;
  ERROR_MISSING_CLAIM = 9;
  ERROR_INVALID_CLAIM = 10;
}

message VerifyBatchRequest {
  repeated VerifyRequest requests = 1;
}

message VerifyBatchResponse {
  repeated VerifyResponse responses = 1;
}

// =============================================================================
// Internal admin RPC (between identity µservice and its operational tools).
// Used by `oya identity ...` CLI.
// =============================================================================

service IdentityAdmin {
  rpc RotateJwks(RotateJwksRequest) returns (RotateJwksResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc ListUserCredentials(ListUserCredentialsRequest) returns (ListUserCredentialsResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc PinUserAcr(PinUserAcrRequest) returns (PinUserAcrResponse);
}

message RotateJwksRequest {
  string pack = 1;
  RotateMode mode = 2;
}

enum RotateMode {
  ROTATE_MODE_UNSPECIFIED = 0;
  ROTATE_MODE_SCHEDULED = 1;
  ROTATE_MODE_EMERGENCY = 2;
}

message RotateJwksResponse {
  bool ok = 1;
  string new_kid = 2;
  string old_kid = 3;
}

message RevokeSessionRequest {
  string tenant_id = 1;
  string user_id = 2;
  string reason = 3;
}

message RevokeSessionResponse {
  bool ok = 1;
  int32 sessions_revoked = 2;
}

message ListUserCredentialsRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ListUserCredentialsResponse {
  repeated CredentialMeta credentials = 1;
}

message CredentialMeta {
  bytes credential_id = 1;
  string aaguid = 2;
  repeated string transports = 3;
  bool backup_eligible = 4;
  bool backup_state = 5;
  int64 last_used_at_unix = 6;
  int64 created_at_unix = 7;
  optional int64 revoked_at_unix = 8;
}

message RevokeCredentialRequest {
  string tenant_id = 1;
  bytes credential_id = 2;
  string reason = 3;
  string operator_ticket = 4;
}

message RevokeCredentialResponse {
  bool ok = 1;
}

message PinUserAcrRequest {
  string tenant_id = 1;
  string user_id = 2;
  AcrLevel acr_floor = 3;
  int64 duration_seconds = 4;
  string reason = 5;
}

message PinUserAcrResponse {
  bool ok = 1;
  int64 expires_at_unix = 2;
}
