// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

// Workload-identity PDP gRPC contract.
//
// Authority: ADR-0002 (tenant-and-identity-kernel), ADR-0131 (flat per-µservice
// layout), ADR-0183 (Cedar app-authz). Bounded context: workload-identity
// (crates identity-workload-domain / -oidc-adapter / -authz-cedar-adapter).
//
// This is the east-west (mesh-internal, ADR-0145) face of the same PDP whose
// north-south face is contracts/identity.openapi.yaml. It is the hot-path
// surface for Envoy ext_authz waypoints and in-process PEPs.
//
// Design grounding — microservices/identity/design/hyperscaler-best-practice-brief.md:
//   * Authorize mirrors AVP IsAuthorized: PARC tuple -> {decision,
//     determining_policies, errors}. determining_policies EMPTY on DENY =
//     implicit deny; non-empty on DENY = explicit forbid (brief §2, §9).
//   * ValidateToken runs the RFC 8725/9068 8-step pipeline; the token header
//     `alg` is never trusted — the algorithm is bound server-side per kid
//     (brief load-bearing flag #1).
//   * Fail-closed everywhere: unknown key, unreachable store, bad token, or
//     suspended principal all resolve to DENY (brief §10).

package oya.identity.workload.v1;

// =============================================================================
// Services
// =============================================================================

// Policy Decision Point. Callers are Policy Enforcement Points.
service WorkloadAuthorizer {
  // Evaluate one PARC tuple against the tenant-scoped Cedar policy set.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // Evaluate many PARC tuples in one round trip (AVP BatchIsAuthorized analog).
  // FinOps: collapses per-call network cost on the hot path (brief §8).
  rpc BatchAuthorize(BatchAuthorizeRequest) returns (BatchAuthorizeResponse);

  // Validate a token, then authorize using the projected principal
  // (AVP IsAuthorizedWithToken analog). Token failure => DENY, no eval.
  rpc AuthorizeWithToken(AuthorizeWithTokenRequest) returns (AuthorizeResponse);
}

// OIDC/JWS workload-token validation (the OIDC adapter, ring-backed).
service WorkloadTokenValidator {
  // Run the ordered 8-step RFC 8725/9068 validation pipeline.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

// =============================================================================
// Authorization messages
// =============================================================================

message EntityRef {
  string entity_type = 1; // e.g. "Oya::WorkloadPrincipal"
  string entity_id = 2;   // e.g. "spiffe://acme.oyatie.com/ns/payments/sa/ledger-writer"
}

message ActionRef {
  string action_type = 1; // e.g. "Oya::Action"
  string action_id = 2;   // e.g. "ledger:Write"
}

message EntityDefinition {
  EntityRef identifier = 1;
  // Cedar entity attributes, JSON-encoded scalar/record values keyed by name.
  map<string, string> attributes_json = 2;
  repeated EntityRef parents = 3;
}

message AuthorizeRequest {
  // Tenant-scoped Cedar policy partition == tenant trust domain (brief §6).
  string policy_store_id = 1;
  EntityRef principal = 2;
  ActionRef action = 3;
  EntityRef resource = 4;
  // Cedar context (the C in PARC). Operational signals only, never PII.
  map<string, string> context_json = 5;
  repeated EntityDefinition entities = 6;
  string request_id = 7;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY = 2;
}

message DeterminingPolicy {
  string policy_id = 1;
}

message AuthorizeResponse {
  Decision decision = 1;
  // EMPTY on DENY = implicit deny (no permit matched).
  // Non-empty on DENY = an explicit forbid won (brief §9).
  repeated DeterminingPolicy determining_policies = 2;
  repeated DecisionError errors = 3;
}

message BatchAuthorizeRequest {
  string policy_store_id = 1;
  repeated EntityDefinition entities = 2; // shared across sub-requests
  repeated SubAuthorize requests = 3;     // max 30
  string request_id = 4;
}

message SubAuthorize {
  EntityRef principal = 1;
  ActionRef action = 2;
  EntityRef resource = 3;
  map<string, string> context_json = 4;
}

message BatchAuthorizeResponse {
  // Index-aligned with BatchAuthorizeRequest.requests.
  repeated AuthorizeResponse results = 1;
}

message AuthorizeWithTokenRequest {
  string policy_store_id = 1;
  string token = 2;            // compact JWS; header alg NOT trusted
  string expected_audience = 3;
  ActionRef action = 4;
  EntityRef resource = 5;
  map<string, string> context_json = 6;
  repeated EntityDefinition entities = 7;
}

// =============================================================================
// Token-validation messages
// =============================================================================

message ValidateTokenRequest {
  string token = 1;              // compact JWS (header.payload.signature)
  string expected_audience = 2;  // required aud binding (brief §5)
  string expected_issuer = 3;    // optional; defaults to trust-domain JWKS map
  // Optional caller-supplied clock for deterministic verification.
  int64 now_unix_seconds = 4;
}

message ValidateTokenResponse {
  bool valid = 1;
  oneof outcome {
    Rfc9068Claims claims = 2;
    DecisionError error = 3;
  }
}

// Normalized RFC 9068 JWT access-token claims.
message Rfc9068Claims {
  string iss = 1;
  repeated string aud = 2;
  string sub = 3; // immutable workload principal id
  int64 iat = 4;
  int64 exp = 5;
  optional int64 nbf = 6;
  optional string client_id = 7;
  // Token id for replay forensics; the token body itself is never logged
  // (brief §9 — log sub + jti, never the token).
  optional string jti = 8;
  optional string azp = 9;
  string tenant_id = 10; // trust domain = tenant (brief §6)
  optional string scope = 11;
}

// =============================================================================
// Typed errors — enumerates the exact failure classes from the brief (§2, §5).
// =============================================================================

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_ALGORITHM_MISMATCH = 1;   // header alg != server-bound alg for kid
  ERROR_REASON_ISSUER_UNTRUSTED = 2;
  ERROR_REASON_AUDIENCE_MISMATCH = 3;
  ERROR_REASON_EXPIRED = 4;
  ERROR_REASON_NOT_YET_VALID = 5;        // nbf in the future beyond skew
  ERROR_REASON_JWKS_UNAVAILABLE = 6;
  ERROR_REASON_PRINCIPAL_SUSPENDED = 7;
  ERROR_REASON_PRINCIPAL_RETIRED = 8;
  ERROR_REASON_POLICY_STORE_UNAVAILABLE = 9;
  ERROR_REASON_UNRECOGNIZED_ENTITY_TYPE = 10;
  ERROR_REASON_MISSING_ATTRIBUTE = 11;
  ERROR_REASON_MALFORMED_TOKEN = 12;
  ERROR_REASON_ALG_NONE_REJECTED = 13;   // RFC 8725 §3.2
  ERROR_REASON_JKU_NOT_ALLOWLISTED = 14; // SSRF defense, brief §5
}

message DecisionError {
  ErrorReason reason = 1;
  // Human-readable detail. Never contains token bodies, secrets, or PII.
  string message = 2;
}
