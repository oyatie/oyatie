openapi: 3.2.0
info:
  title: identity-workload
  version: 1.0.0
  summary: Workload (machine-to-machine) identity authorize + token-validation + principal-lifecycle surface
  description: |
    The workload-identity service surface per ADR-0002 (tenant+identity kernel)
    and `microservices/identity/workload-identity/PRD.md` §1.2. It authenticates
    workload OIDC tokens (RS256/384/512, ES256 via ring; RFC 8725 hardened) and
    authorizes PARC requests through the real Cedar engine (deny-by-default,
    forbid-wins).

    This is a Policy Enforcement Point: every error path FAILS CLOSED.
    - An authorization deny is `403` — NEVER a `404` (a deny must not be
      downgraded to "not found", which would leak existence + weaken
      default-deny).
    - A token-validation failure is `422` — the body was well-formed JSON but
      the credential inside it did not validate; the policy engine is never
      consulted (PRD §3.4).
    - A backing-store / JWKS unavailability is `503` and is treated as a hard
      deny (PRD §5 fail-closed posture).

    Every authorize call and every token validation emits exactly one immutable
    audit record (AsyncAPI channels `workload.decision.v1` /
    `workload.token-validation.v1`).
  contact:
    name: axis-identity
    url: https://oyatie.com/teams/axis-identity
  license:
    name: Apache-2.0
servers:
  - url: https://identity-{pack}.oyatie.com
    description: Per-pack workload-identity endpoint
    variables:
      pack:
        default: eu
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]
tags:
  - name: workload-authz
    description: Workload PARC authorization (Cedar PDP)
  - name: workload-token
    description: Workload OIDC token validation
  - name: workload-lifecycle
    description: Workload principal lifecycle (suspend / retire)

paths:
  /authorize:
    post:
      tags: [workload-authz]
      summary: Authorize an already-verified workload principal
      description: |
        Authorize a PARC request for a principal the caller (a trusted PEP) has
        already authenticated out of band. Returns `200` with an ALLOW decision
        or `403` with a DENY decision (never `404`).
      operationId: postWorkloadAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: authorization decision (effect ALLOW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: malformed principal body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: authorization denied (DENY decision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'

  "/authorize:batch":
    post:
      tags: [workload-authz]
      summary: Authorize a batch of token-bearing requests
      description: |
        Authorize many token-bearing requests in one round trip. Returns `200`
        with one decision per request in order; each fail-closed item collapses
        to a DENY decision in the body so a batch never leaks an allow.
      operationId: postWorkloadAuthorizeBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAuthorizeRequest'
      responses:
        '200':
          description: per-request decisions, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAuthorizeResponse'

  /authorize-with-token:
    post:
      tags: [workload-authz]
      summary: Validate a raw workload JWT, then authorize
      description: |
        The full hot path: validate the workload JWT (RFC 8725 hardened),
        resolve the persisted principal, reject if revoked / non-operational,
        then authorize. `200` ALLOW, `403` DENY (incl. unknown subject and
        revoked — never `404`), `422` token-invalid, `503` store/JWKS
        unavailable (fail-closed).
      operationId: postWorkloadAuthorizeWithToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeWithTokenRequest'
      responses:
        '200':
          description: authorization decision (effect ALLOW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '403':
          description: authorization denied (DENY decision; incl. unknown/revoked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '422':
          description: token failed validation (PRD §3.4); engine not consulted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: backing store / JWKS unavailable — fail-closed deny
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /tokens/validate:
    post:
      tags: [workload-token]
      summary: Validate a raw workload JWT
      description: |
        Validate a workload JWT and return the projected principal identity
        (tenant, workload id, owning capability, SPIFFE trust domain, lifecycle
        state, scopes). No authorization is performed. A validation failure is a
        `422` (PRD §3.4).
      operationId: postWorkloadTokenValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: verified principal projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
        '422':
          description: token failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  "/principals/{id}:suspend":
    post:
      tags: [workload-lifecycle]
      summary: Suspend (revoke) a workload principal
      description: |
        Suspend a principal (Active -> Suspended) and add it to the revocation
        denylist so the hot path denies it before its short-lived token expires
        (PRD §3.5). AIP-136 custom method.
      operationId: postWorkloadPrincipalSuspend
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^wl_[A-Za-z0-9._-]+$' }
      responses:
        '200':
          description: principal suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLifecycleResponse'
        '400':
          description: invalid workload id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: principal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: illegal lifecycle transition for the current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: backing store / denylist unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  "/principals/{id}:retire":
    post:
      tags: [workload-lifecycle]
      summary: Retire (terminal) a workload principal
      description: |
        Retire a principal to the terminal Retired state and revoke it. The id
        is tombstoned and never re-provisioned (PRD §3.5 / AC-W-14). AIP-136
        custom method.
      operationId: postWorkloadPrincipalRetire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^wl_[A-Za-z0-9._-]+$' }
      responses:
        '200':
          description: principal retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalLifecycleResponse'
        '400':
          description: invalid workload id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: principal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: illegal lifecycle transition for the current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: backing store / denylist unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

components:
  schemas:
    ClaimValue:
      type: object
      description: A typed claim value (closed set mirroring the domain ClaimValue).
      required: [kind]
      properties:
        kind:
          type: string
          enum: [text, bool, int, textList]
        value:
          description: The value, shaped by `kind`.
          oneOf:
            - type: string
            - type: boolean
            - type: integer
            - type: array
              items: { type: string }
    Resource:
      type: object
      required: [resourceType, resourceId]
      properties:
        resourceType: { type: string }
        resourceId: { type: string }
        attributes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ClaimValue' }
          description: Optional PDP-visible resource attributes, including tenant_id for same-tenant policies.
    AuthorizeWithTokenRequest:
      type: object
      required: [token, action, resource]
      properties:
        token:
          type: string
          description: Compact JWS workload token (data_class AUTHENTICATION).
        action: { type: string, example: "cloud.kms.Decrypt" }
        resource: { $ref: '#/components/schemas/Resource' }
        context:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ClaimValue' }
    AuthorizeRequest:
      type: object
      required: [tenantId, workloadId, owningCapability, action, resource]
      properties:
        tenantId: { type: string, pattern: '^ten_.+$' }
        workloadId: { type: string, pattern: '^wl_.+$' }
        owningCapability: { type: string, pattern: '^cap\..+$' }
        scopes:
          type: array
          items: { type: string }
        claims:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ClaimValue' }
        action: { type: string }
        resource: { $ref: '#/components/schemas/Resource' }
        context:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ClaimValue' }
    BatchAuthorizeRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/AuthorizeWithTokenRequest' }
    DecisionReason:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [explicitPermit, explicitForbid, defaultDeny, principalNotOperational]
        policyId:
          type: string
          description: Present for explicitPermit / explicitForbid.
        state:
          type: string
          description: Present for principalNotOperational.
    AuthorizeResponse:
      type: object
      required: [effect, reason]
      properties:
        effect:
          type: string
          enum: [ALLOW, DENY]
        reason: { $ref: '#/components/schemas/DecisionReason' }
    BatchAuthorizeResponse:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/AuthorizeResponse' }
    ValidateTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Compact JWS workload token (data_class AUTHENTICATION).
    ValidateTokenResponse:
      type: object
      required: [tenantId, workloadId, owningCapability, trustDomain, state, scopes]
      properties:
        tenantId: { type: string }
        workloadId: { type: string }
        owningCapability: { type: string }
        trustDomain:
          type: string
          description: SPIFFE trust domain (spiffe://<tenant>); always equals the tenant.
          example: "spiffe://ten_acme"
        state:
          type: string
          enum: [provisioned, active, suspended, retired]
        scopes:
          type: array
          items: { type: string }
    PrincipalLifecycleResponse:
      type: object
      required: [workloadId, state]
      properties:
        workloadId: { type: string }
        state:
          type: string
          enum: [provisioned, active, suspended, retired]
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - TOKEN_INVALID
                - FORBIDDEN
                - DEPENDENCY_UNAVAILABLE
                - VALIDATION_ERROR
                - NOT_FOUND
            message: { type: string }
            details: { type: string, nullable: true }
