[package]
name = "iam-identity-workload-api"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload-identity API DTO contract layer: transport-neutral request/response shapes for the workload authorize + token-validation + principal-lifecycle REST surface (PRD §1.2), converting to/from the pure workload-identity domain. Owns no crypto, no policy, no I/O. Task T3."

# INVARIANT: api layer depends inward on the pure domain only. It carries no
# adapter/app dependency (serde DTOs <-> domain values). Mirrors the flat
# accounting-journal-api exemplar.
[dependencies]
iam-identity-workload-domain = { path = "../../core/identity-workload-domain" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
name = "iam_identity_workload_api"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
