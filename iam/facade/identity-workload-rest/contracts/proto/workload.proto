// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

// Authority: ADR-0002 tenant+identity kernel, ADR-0183 Cedar app-authz,
// RFC 8725 JWT BCP. Internal-only proto3 for the workload-identity (machine-to-
// machine) authorize + token-validation surface, consumed by trusted PEPs
// (Envoy ext_authz at the waypoint, sidecars, the api-gateway). The external
// HTTP surface is OpenAPI 3.2 in ../openapi/workload.yaml.
//
// Fail-closed contract: a deny is a DECISION_EFFECT_DENY response, never an
// RPC error; a token-validation failure carries a typed error; the engine is
// never consulted on a rejected token.

package oya.identity.workload.v1;

// =============================================================================
// WorkloadAuthorizer — PARC authorization (Cedar PDP: deny-by-default,
// forbid-wins, order-independent).
// =============================================================================

service WorkloadAuthorizer {
  // Authorize a raw workload JWT against a PARC action/resource/context: the
  // full validate -> resolve -> authorize hot path.
  rpc AuthorizeWithToken(AuthorizeWithTokenRequest) returns (AuthorizeResponse);

  // Authorize an already-verified principal supplied by a trusted PEP.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // Authorize a batch of token-bearing requests in one round trip.
  rpc AuthorizeBatch(BatchAuthorizeRequest) returns (BatchAuthorizeResponse);
}

// =============================================================================
// WorkloadTokenValidator — OIDC token validation (RS256/384/512, ES256;
// RFC 8725 hardened: alg:none rejected, typ checked, jku/x5u allowlisted,
// kid->alg bound). No authorization is performed.
// =============================================================================

service WorkloadTokenValidator {
  // Validate a workload JWT and return the projected principal identity.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

// --- Shared values ----------------------------------------------------------

message ClaimValue {
  oneof value {
    string text = 1;
    bool boolean = 2;
    int64 integer = 3;
    StringList text_list = 4;
  }
}

message StringList {
  repeated string values = 1;
}

message Resource {
  string resource_type = 1;
  string resource_id = 2;
  // Resource attributes visible to PDP resource conditions, for example
  // tenant_id for same-tenant Cedar policies.
  map<string, ClaimValue> attributes = 3;
}

// --- Authorize requests -----------------------------------------------------

message AuthorizeWithTokenRequest {
  string token = 1; // data_class: AUTHENTICATION
  string action = 2;
  Resource resource = 3;
  map<string, ClaimValue> context = 4;
}

message AuthorizeRequest {
  string tenant_id = 1;
  string workload_id = 2;
  string owning_capability = 3;
  repeated string scopes = 4;
  map<string, ClaimValue> claims = 5;
  string action = 6;
  Resource resource = 7;
  map<string, ClaimValue> context = 8;
}

message BatchAuthorizeRequest {
  repeated AuthorizeWithTokenRequest requests = 1;
}

// --- Authorize responses ----------------------------------------------------

enum DecisionEffect {
  DECISION_EFFECT_UNSPECIFIED = 0;
  DECISION_EFFECT_ALLOW = 1;
  DECISION_EFFECT_DENY = 2;
}

enum DecisionReasonKind {
  DECISION_REASON_KIND_UNSPECIFIED = 0;
  DECISION_REASON_KIND_EXPLICIT_PERMIT = 1;
  DECISION_REASON_KIND_EXPLICIT_FORBID = 2;
  DECISION_REASON_KIND_DEFAULT_DENY = 3;
  DECISION_REASON_KIND_PRINCIPAL_NOT_OPERATIONAL = 4;
}

message DecisionReason {
  DecisionReasonKind kind = 1;
  // Present for EXPLICIT_PERMIT / EXPLICIT_FORBID.
  optional string policy_id = 2;
  // Present for PRINCIPAL_NOT_OPERATIONAL.
  optional string state = 3;
}

message AuthorizeResponse {
  DecisionEffect effect = 1;
  DecisionReason reason = 2;
}

message BatchAuthorizeResponse {
  repeated AuthorizeResponse decisions = 1;
}

// --- Token validation -------------------------------------------------------

message ValidateTokenRequest {
  string token = 1; // data_class: AUTHENTICATION
}

enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  WORKLOAD_STATE_PROVISIONED = 1;
  WORKLOAD_STATE_ACTIVE = 2;
  WORKLOAD_STATE_SUSPENDED = 3;
  WORKLOAD_STATE_RETIRED = 4;
}

message ValidateTokenResponse {
  bool ok = 1;
  oneof outcome {
    VerifiedPrincipal principal = 2;
    ValidationError error = 3;
  }
}

message VerifiedPrincipal {
  string tenant_id = 1;
  string workload_id = 2;
  string owning_capability = 3;
  // SPIFFE trust domain (spiffe://<tenant>); always equals the tenant.
  string trust_domain = 4;
  WorkloadState state = 5;
  repeated string scopes = 6;
}

message ValidationError {
  ValidationErrorKind kind = 1;
  string detail = 2;
}

enum ValidationErrorKind {
  VALIDATION_ERROR_KIND_UNSPECIFIED = 0;
  VALIDATION_ERROR_KIND_MALFORMED = 1;
  VALIDATION_ERROR_KIND_ALG_NONE = 2;
  VALIDATION_ERROR_KIND_INVALID_TYPE = 3;
  VALIDATION_ERROR_KIND_UNTRUSTED_KEY_SOURCE_URL = 4;
  VALIDATION_ERROR_KIND_ALGORITHM_MISMATCH = 5;
  VALIDATION_ERROR_KIND_UNKNOWN_KEY = 6;
  VALIDATION_ERROR_KIND_SIGNATURE_INVALID = 7;
  VALIDATION_ERROR_KIND_ISSUER_MISMATCH = 8;
  VALIDATION_ERROR_KIND_AUDIENCE_MISMATCH = 9;
  VALIDATION_ERROR_KIND_EXPIRED = 10;
  VALIDATION_ERROR_KIND_NOT_YET_VALID = 11;
  VALIDATION_ERROR_KIND_MISSING_CLAIM = 12;
}
