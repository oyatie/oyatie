[package]
name = "iam-cloud-pdp-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Runnable cloud-iam policy-decision-point service (ADR-0559, G004 slice 1): composes the shared embedded Cedar PDP (iam/adapters/pdp-cedar) behind gRPC + REST authorization-decision endpoints with health/readiness, fail-closed boot (policy-load failure = boot refusal), structured decision-audit emission behind the kernel DecisionAuditSink port, and deny-by-default on every surface. API-only service: no CLI, declarative policy bundles are the management surface (cli_surface_policy)."
build = "build.rs"

[dependencies]
iam-cloud-pdp-kernel = { path = "../../core/cloud-pdp-kernel" }
iam-cloud-pdp-bundle-file = { path = "../../adapters/cloud-pdp-bundle-file" }
shared-pdp-kernel = { path = "../../core/shared-pdp-kernel" }
iam-pdp-cedar = { path = "../../adapters/pdp-cedar" }
shared-platform-contracts-kernel = { path = "../../../base/shared-platform-contracts-kernel" }
shared-ulid-id-kernel = { path = "../../core/shared-ulid-id-kernel" }
iam-identity-workload-domain = { path = "../../core/identity-workload-domain" }
iam-identity-workload-svid-kernel = { path = "../../core/identity-workload-svid-kernel" }
iam-identity-workload-svid-trustd = { path = "../../adapters/identity-workload-svid-trustd" }
os-trustd-domain = { path = "../../../os/core/trustd-domain" }
http-runtime-hyper-adapter = { path = "../../../base/http-runtime-hyper-adapter" }
x509-parser = { workspace = true }
aws-lc-rs = "1.17.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# gRPC delivery surface — tonic 0.14 server-side (client stubs generated too,
# for the in-repo E2E suite and later PEP-pointing slices).
prost.workspace = true
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-core = { version = "0.3", default-features = false }
async-stream = "0.3"

[build-dependencies]
# Proto codegen — mirrors the oya-identity-workload-rest build.rs pattern.
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
reqwest = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { version = "0.1", default-features = false }
iam-identity-workload-svid-operator-k8s = { path = "../../adapters/identity-workload-svid-operator-k8s" }
iam-identity-workload-svid-operator-kernel = { path = "../../core/identity-workload-svid-operator-kernel" }
base64 = { version = "0.22", default-features = false, features = ["std"] }
shared-audit-digest-adapter-awslc = { path = "../../core/shared-audit-digest-adapter-awslc" }
shared-audit-event-kernel = { path = "../../core/shared-audit-event-kernel" }

[lib]
name = "iam_cloud_pdp_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "iam-cloud-pdp-app"
path = "src/main.rs"

[lints]
workspace = true
