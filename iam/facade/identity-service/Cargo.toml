[package]
name = "iam-identity-service"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "iam-identity-service runnable service binary: composes the workload-identity use-case core behind axum REST + tonic gRPC with fail-closed PEP semantics, env-driven config, static JWKS, Cedar policies, and graceful K8s-native shutdown (G005 / ADR-0536 IdP domain)."

[[bin]]
name = "iam-identity-service"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
iam-identity-oidc-issuer-kernel = { path = "../../core/identity-oidc-issuer-kernel" }
iam-identity-workload-domain = { path = "../../core/identity-workload-domain" }
iam-identity-workload-app = { path = "../identity-workload-app" }
iam-identity-workload-authz-cedar = { path = "../../adapters/identity-workload-authz-cedar" }
iam-identity-workload-oidc = { path = "../../adapters/identity-workload-oidc" }
iam-identity-workload-rest = { path = "../identity-workload-rest" }
shared-scim-server-kernel = { path = "../../core/shared-scim-server-kernel" }
identity-scim-store-postgres = { path = "../../adapters/identity-scim-store-postgres" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
aws-lc-rs = { workspace = true }
base64 = "0.22.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# E2E: drive the live REST socket with reqwest and the live gRPC socket with
# the tonic-generated client; tower for in-process router oneshot tests.
reqwest = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
