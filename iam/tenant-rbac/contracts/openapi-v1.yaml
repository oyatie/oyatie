{
  "openapi": "3.2.0",
  "info": {
    "title": "Tenant RBAC API",
    "version": "0.1.0",
    "summary": "Suite policy, group rollup, Workflow, incident rollback, and ops metadata contracts.",
    "description": "Preview contract surface aligned to the transport-neutral oya-tenant-rbac-api DTO crate. This artifact defines wire shape for later runtime adapters; it does not claim a deployed endpoint.",
    "x-oyatie-contract-status": "preview-not-deployed",
    "x-oyatie-non-claims": [
      "no deployed HTTP runtime",
      "no authentication enforcement runtime",
      "no storage adapter",
      "no Workflow dispatch execution",
      "no incident rollback runtime",
      "no OpenTofu execution",
      "no cloud service integration claim"
    ],
    "x-source-standard": "OpenAPI Specification 3.2.0 official spec.openapis.org rendering checked 2026-05-23"
  },
  "servers": [
    {
      "url": "https://api.oyatie.example/tenant-rbac/v1",
      "description": "Preview tenant-scoped URL shape for future adapters; not deployed by this changeset."
    }
  ],
  "paths": {
    "/tenant-rbac/v1/policy-admissions": {
      "post": {
        "operationId": "admitTenantRbacServiceWrite",
        "summary": "Admit a child HR/Payroll/Accounting write through the tenant RBAC policy gateway.",
        "x-oyatie-app-function": "oya_tenant_rbac_domain::admit_service_write",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ServiceWriteAdmissionRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Preview contract response for future runtime adapters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantRbacAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/tenant-rbac/v1/group-close-rollups": {
      "post": {
        "operationId": "rollUpTenantRbacGroupClose",
        "summary": "Roll up legal-entity close state into a group projection.",
        "x-oyatie-app-function": "oya_tenant_rbac_domain::roll_up_group_close_status",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/GroupCloseRollupRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Preview contract response for future runtime adapters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantRbacAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/tenant-rbac/v1/cross-service-workflow-plans": {
      "post": {
        "operationId": "planTenantRbacCrossServiceWorkflow",
        "summary": "Plan Workflow-owned cross-service routing metadata.",
        "x-oyatie-app-function": "oya_tenant_rbac_domain::plan_cross_service_workflow + oya_tenant_rbac_usecase::prepare_cross_service_workflow_envelope",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CrossServiceWorkflowPlanRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Preview contract response for future runtime adapters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantRbacAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/tenant-rbac/v1/incident-rollback-plans": {
      "post": {
        "operationId": "planTenantRbacIncidentRollback",
        "summary": "Plan rollback/quarantine-first incident metadata.",
        "x-oyatie-app-function": "oya_tenant_rbac_domain::plan_incident_rollback + oya_tenant_rbac_usecase::prepare_incident_rollback_envelope",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IncidentRollbackPlanRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Preview contract response for future runtime adapters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantRbacAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    },
    "/tenant-rbac/v1/ops-commands": {
      "post": {
        "operationId": "prepareTenantRbacOpsCommand",
        "summary": "Prepare a metadata-only ops command envelope without manual SSH execution.",
        "x-oyatie-app-function": "oya_tenant_rbac_usecase::prepare_tenant_rbac_ops_envelope",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TenantRbacOpsCommandRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Preview contract response for future runtime adapters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TenantRbacAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "tenantBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "ApiErrorEnvelope": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "VALIDATION_ERROR",
                  "DOMAIN_ERROR",
                  "AUTH_REQUIRED",
                  "FORBIDDEN"
                ]
              },
              "message": {
                "type": "string"
              },
              "details": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          }
        }
      },
      "TenantRbacAccepted": {
        "type": "object",
        "required": [
          "accepted",
          "topic",
          "idempotencyKey",
          "schemaVersion"
        ],
        "properties": {
          "accepted": {
            "type": "boolean"
          },
          "topic": {
            "type": "string"
          },
          "idempotencyKey": {
            "type": "string"
          },
          "schemaVersion": {
            "type": "integer",
            "minimum": 1
          },
          "service": {
            "type": "string",
            "const": "tenant-rbac"
          }
        }
      },
      "ServiceWriteAdmissionRequest": {
        "type": "object",
        "required": [
          "service",
          "writeKind",
          "tenantId",
          "legalEntityId",
          "payloadDataClass",
          "auditEvidenceRef",
          "policyGatewayRef",
          "idempotencyKey",
          "sequence"
        ],
        "properties": {
          "service": {
            "$ref": "#/components/schemas/TenantRbacService"
          },
          "writeKind": {
            "type": "string",
            "enum": [
              "HR_LIFECYCLE",
              "PAYROLL_CLOSE",
              "ACCOUNTING_JOURNAL"
            ]
          },
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "legalEntityId": {
            "$ref": "#/components/schemas/LegalEntityId"
          },
          "payloadDataClass": {
            "$ref": "#/components/schemas/DataClass"
          },
          "auditEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "policyGatewayRef": {
            "type": "string",
            "pattern": "^policy/tenant-rbac/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 1,
            "x-data-class": "INTERNAL_ONLY"
          },
          "sequence": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "GroupCloseRollupRequest": {
        "type": "object",
        "required": [
          "tenantId",
          "groupId",
          "jurisdiction",
          "dashboardProjectionRef",
          "legalEntities"
        ],
        "properties": {
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "groupId": {
            "type": "string",
            "pattern": "^grp_[A-Za-z0-9_-]+$",
            "x-data-class": "INTERNAL_ONLY"
          },
          "jurisdiction": {
            "$ref": "#/components/schemas/Jurisdiction"
          },
          "dashboardProjectionRef": {
            "type": "string",
            "pattern": "^projection/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "legalEntities": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/LegalEntityCloseSnapshotRequest"
            }
          }
        }
      },
      "LegalEntityCloseSnapshotRequest": {
        "type": "object",
        "required": [
          "tenantId",
          "legalEntityId",
          "payrollCloseState",
          "accountingCloseState",
          "payrollEvidenceRef",
          "accountingEvidenceRef",
          "payrollCloseVersion",
          "accountingCloseVersion"
        ],
        "properties": {
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "legalEntityId": {
            "$ref": "#/components/schemas/LegalEntityId"
          },
          "payrollCloseState": {
            "$ref": "#/components/schemas/CloseBoundaryState"
          },
          "accountingCloseState": {
            "$ref": "#/components/schemas/CloseBoundaryState"
          },
          "payrollEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "accountingEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "payrollCloseVersion": {
            "type": "integer",
            "minimum": 0
          },
          "accountingCloseVersion": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "CrossServiceWorkflowPlanRequest": {
        "type": "object",
        "required": [
          "tenantId",
          "workflowRef",
          "objectGraphRelationshipRef",
          "routingOwner",
          "relationshipOwner",
          "services",
          "gateEvidenceRefs",
          "gateClosureAuthority",
          "idempotencyKey"
        ],
        "properties": {
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "workflowRef": {
            "type": "string",
            "pattern": "^workflow/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "objectGraphRelationshipRef": {
            "type": "string",
            "pattern": "^object-graph/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "routingOwner": {
            "type": "string",
            "enum": [
              "WORKFLOW",
              "CHILD_SERVICE_HR",
              "CHILD_SERVICE_PAYROLL",
              "CHILD_SERVICE_ACCOUNTING",
              "AI_AGENT"
            ]
          },
          "relationshipOwner": {
            "type": "string",
            "enum": [
              "OBJECT_GRAPH",
              "CHILD_SERVICE_HR",
              "CHILD_SERVICE_PAYROLL",
              "CHILD_SERVICE_ACCOUNTING",
              "AI_AGENT"
            ]
          },
          "services": {
            "type": "array",
            "minItems": 3,
            "items": {
              "$ref": "#/components/schemas/TenantRbacService"
            }
          },
          "gateEvidenceRefs": {
            "type": "array",
            "minItems": 4,
            "items": {
              "$ref": "#/components/schemas/DeterministicGateEvidenceRequest"
            }
          },
          "gateClosureAuthority": {
            "type": "string",
            "enum": [
              "DETERMINISTIC_GATE_SET",
              "HUMAN_APPROVER",
              "AI_SUGGESTION"
            ]
          },
          "aiSuggestionRef": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^ai/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 1,
            "x-data-class": "INTERNAL_ONLY"
          }
        }
      },
      "DeterministicGateEvidenceRequest": {
        "type": "object",
        "required": [
          "gate",
          "evidenceRef"
        ],
        "properties": {
          "gate": {
            "type": "string",
            "enum": [
              "HUMAN_APPROVAL",
              "EVIDENCE_ATTACHED",
              "ROLLBACK_PLAN_ATTACHED",
              "LEGAL_ENTITY_BOUNDARY_CHECKED"
            ]
          },
          "evidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          }
        }
      },
      "IncidentRollbackPlanRequest": {
        "type": "object",
        "required": [
          "tenantId",
          "incidentId",
          "trigger",
          "firstAction",
          "remediationRoute",
          "canaryEvidenceRef",
          "incidentEvidenceRef",
          "rollbackEvidenceRef",
          "convergenceRef",
          "idempotencyKey"
        ],
        "properties": {
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "incidentId": {
            "type": "string",
            "pattern": "^inc_[A-Za-z0-9_-]+$",
            "x-data-class": "INTERNAL_ONLY"
          },
          "trigger": {
            "type": "string",
            "enum": [
              "CANARY_SLO_BREACH",
              "PRODUCTION_INCIDENT",
              "EVIDENCE_GATE_FAILURE"
            ]
          },
          "firstAction": {
            "type": "string",
            "enum": [
              "ROLLBACK",
              "QUARANTINE",
              "REMEDIATE"
            ]
          },
          "remediationRoute": {
            "type": "string",
            "enum": [
              "OPEN_TOFU",
              "OYA_OPS",
              "OPS_CONSOLE",
              "MANUAL_SSH"
            ]
          },
          "canaryEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "incidentEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "rollbackEvidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "convergenceRef": {
            "type": "string",
            "pattern": "^(opentofu|ops)/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 1,
            "x-data-class": "INTERNAL_ONLY"
          }
        }
      },
      "TenantRbacOpsCommandRequest": {
        "type": "object",
        "required": [
          "tenantId",
          "route",
          "commandKind",
          "evidenceRef",
          "changePlanRef",
          "idempotencyKey"
        ],
        "properties": {
          "tenantId": {
            "$ref": "#/components/schemas/TenantId"
          },
          "route": {
            "type": "string",
            "enum": [
              "MAKEFILE_TARGET",
              "OYA_OPS",
              "OPS_CONSOLE",
              "MANUAL_SSH"
            ]
          },
          "commandKind": {
            "type": "string",
            "enum": [
              "BOOTSTRAP",
              "INSTALL",
              "PLAN",
              "APPLY",
              "ROLLBACK",
              "DAY2_CHANGE"
            ]
          },
          "evidenceRef": {
            "$ref": "#/components/schemas/AuditEvidenceRef"
          },
          "changePlanRef": {
            "type": "string",
            "pattern": "^opentofu/.+",
            "x-data-class": "INTERNAL_ONLY"
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 1,
            "x-data-class": "INTERNAL_ONLY"
          }
        }
      },
      "TenantId": {
        "type": "string",
        "pattern": "^ten_[A-Za-z0-9_-]+$",
        "x-data-class": "INTERNAL_ONLY"
      },
      "LegalEntityId": {
        "type": "string",
        "pattern": "^le_[A-Za-z0-9_-]+$",
        "x-data-class": "INTERNAL_ONLY"
      },
      "AuditEvidenceRef": {
        "type": "string",
        "pattern": "^audit/.+",
        "x-data-class": "INTERNAL_ONLY"
      },
      "TenantRbacService": {
        "type": "string",
        "enum": [
          "HR",
          "PAYROLL",
          "ACCOUNTING"
        ]
      },
      "DataClass": {
        "type": "string",
        "enum": [
          "PUBLIC",
          "INTERNAL_ONLY",
          "PII_IDENTIFYING",
          "FINANCIAL"
        ]
      },
      "Jurisdiction": {
        "type": "string",
        "enum": [
          "KOREA",
          "UNITED_STATES",
          "EUROPEAN_UNION"
        ]
      },
      "CloseBoundaryState": {
        "type": "string",
        "enum": [
          "OPEN",
          "TRIAL_CLOSED",
          "PRODUCTION_CLOSED",
          "QUARANTINED"
        ]
      }
    },
    "responses": {
      "ValidationError": {
        "description": "Validation or domain error envelope.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ApiErrorEnvelope"
            }
          }
        }
      }
    }
  },
  "security": [
    {
      "tenantBearer": []
    }
  ]
}
