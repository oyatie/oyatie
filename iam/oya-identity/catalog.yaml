apiVersion: oyatie.io/catalog/v2
kind: Service
metadata:
  name: oya-identity
  microservice: oya-identity
  bounded_context: identity-substrate
spec:
  role: tenant-service
  context: identity-substrate
  data_classes_owned:
    - PII_USER_DATA
  operational_classes_owned:
    - AUDIT
  binding_adrs:
    - ADR-0476
    - ADR-0509
  pattern: single-crate-per-service
  wave: wave-c
  owner_team: axis-identity
  criticality_tier: platform-critical
  crates:
    - oya-identity
