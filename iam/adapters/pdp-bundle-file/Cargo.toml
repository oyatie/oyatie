[package]
name = "iam-pdp-bundle-file"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "File-backed PolicyBundleStore adapter for the iam PDP service (ADR-0559, G004 slice 1): loads a declarative policy-bundle JSON document from a mounted path (ConfigMap transport in K8s) with closed-schema parsing and fail-closed errors. Transitional transport — the policy-bundle CRD + operator distribution fabric replaces this adapter behind the same kernel port (ADR-0550 adapters are deliberately throwaway)."

[dependencies]
iam-pdp-kernel = { path = "../../core/pdp-kernel" }


# First legal iam/ -> libs/shared-audit-* lib->lib edge (no inversion): the
# OWNED aws-lc-rs Ed25519 verifier (ADR-0506, ring-free) for signed-bundle
# verify-on-load, and its ports (ChainVerifier, hex codec).


serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "iam_pdp_bundle_file"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
