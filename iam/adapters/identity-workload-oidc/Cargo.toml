[package]
name = "iam-identity-workload-oidc"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload OIDC token validation core: verifies a compact JWS (RS256/384/512, ES256) against issuer JWKs via aws-lc-rs, then projects verified claims into a workload principal. Task T3."

[dependencies]
iam-identity-workload-domain = { path = "../../core/identity-workload-domain" }
aws-lc-rs = { workspace = true }
base64 = "0.22.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "iam_identity_workload_oidc"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
