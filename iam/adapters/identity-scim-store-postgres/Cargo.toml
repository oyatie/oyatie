[package]
name = "iam-identity-scim-store-postgres"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Review-only Postgres/RLS storage + write-statement plan for the SCIM UserStore/GroupStore ports: declarative tenant-scoped Users/Groups tables, RLS policies, per-tenant userName uniqueness, and the parameterized statements a future durable adapter must use. Transient adapter behind the owned-shaped kernel ports (oya-data is the G003 owned-data cutover); opens no connection and claims no runtime."

[lib]
name = "iam_identity_scim_store_postgres"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
