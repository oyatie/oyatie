[package]
name = "identity-scim-store-postgres"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Real async sqlx/Postgres SCIM UserStore/GroupStore adapters: per-transaction tenant GUC (oyatie.tenant_id) + RLS isolation over a PgPool, per-tenant userName uniqueness. Transient adapter behind the owned-shaped kernel ports; aws-lc-rs TLS only (ADR-0506)."

[dependencies]
shared-scim-server-kernel = { path = "../../core/scim-server-kernel" }
shared-postgres-command-adapter-sqlx = { path = "../../../data/adapters/postgres-command-sqlx" }
shared-postgres-command-kernel = { path = "../../../data/core/postgres-command-kernel" }



sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# Live integration tests `.await` the boxed-future methods behind an env gate.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
name = "identity_scim_store_postgres"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
