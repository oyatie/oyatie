[package]
name = "iam-cloud-pdp-bundle-file"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "File-backed PolicyBundleStore adapter for the cloud-iam PDP service (ADR-0559, G004 slice 1): loads a declarative policy-bundle JSON document from a mounted path (ConfigMap transport in K8s) with closed-schema parsing and fail-closed errors. Transitional transport — the policy-bundle CRD + operator distribution fabric replaces this adapter behind the same kernel port (ADR-0550 adapters are deliberately throwaway)."

[dependencies]
iam-cloud-pdp-kernel = { path = "../../core/cloud-pdp-kernel" }
shared-pdp-kernel = { path = "../../core/shared-pdp-kernel" }
shared-platform-contracts-kernel = { path = "../../../base/shared-platform-contracts-kernel" }
shared-audit-digest-adapter-awslc = { path = "../../core/shared-audit-digest-adapter-awslc" }
shared-audit-event-kernel = { path = "../../core/shared-audit-event-kernel" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "iam_cloud_pdp_bundle_file"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
