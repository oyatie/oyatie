version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload-identity domain kernel (PURE, zero deps): workload principal model + PARC authorization decision types per ADR-0002. Task T3 workload-identity service."

# INVARIANT: this crate has ZERO dependencies (not even workspace crates).
