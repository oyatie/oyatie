[package]
name = "shared-scim-server-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "SCIM 2.0 (RFC 7643/7644) server kernel: trait + reference impl with axum-shaped handlers. Authority: ADR-0190. In-house from inception; HTTP surface seen by Okta/Entra/Workspace is OURS, not Zitadel's."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
# Async store/server ports (bare Pin<Box<dyn Future>>): the integration tests
# `.await` them under #[tokio::test].
tokio = { version = "1", features = ["macros", "rt"] }

[lib]
name = "shared_scim_server_kernel"
path = "src/lib.rs"
doctest = false

[[test]]
name = "scim_server_kernel"
path = "tests/scim_server_kernel.rs"

[lints]
workspace = true
