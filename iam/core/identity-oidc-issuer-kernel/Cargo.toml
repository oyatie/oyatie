[package]
name = "iam-identity-oidc-issuer-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Human-identity OIDC issuer kernel (PURE, zero deps): OIDC discovery doc, JWKS publication + signing-key lifecycle, ID/access-token claim shapes, clock-skew validation, signing-key port trait. Authority: ADR-0002 tenant+identity kernel, ADR-0162 per-tenant audit log slicing, ADR-0182 north-south vs east-west separation, ADR-0187 Zitadel canonical IdP, ADR-0189 step-up ACR. IP-002."

# INVARIANT: this crate has ZERO dependencies (not even workspace crates).
# It is the pure domain core for human-identity OIDC issuance. The
# architecture-boundaries gate permits a `kernel` crate to import only
# kernel/domain peers, and this one imports none so the cryptographic
# implementation is plug-in via the [`JwsSigner`] port trait.
[dependencies]

[lib]
name = "iam_identity_oidc_issuer_kernel"
path = "src/lib.rs"
doctest = false

[[test]]
name = "oidc_issuer_kernel"
path = "tests/oidc_issuer_kernel.rs"

[lints]
workspace = true
