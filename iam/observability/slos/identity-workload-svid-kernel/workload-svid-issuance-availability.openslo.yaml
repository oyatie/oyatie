# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# G002 slice-1 (ADR-0561): the workload X.509-SVID issuance surface is the trust
# root for PDP mTLS caller-auth. Per CLAUDE.md (observability_substrate) a service
# cannot promote past dev without slos/*.openslo.yaml; this SLO bounds issuance
# availability so a stalled CA cannot silently starve callers of SVIDs (which,
# fail-closed, denies legitimate workload traffic at the PDP).
apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-workload-svid-issuance-availability
  displayName: "workload X.509-SVID issuance availability"
  labels:
    microservice: identity
    bounded_context: workload
    component: svid-issuance
    tier: control-plane
    plane: control
spec:
  service: identity-workload-svid
  description: "Availability of the workload X.509-SVID issuance surface (the trustd-backed SecurityService::handle_certificate issuance path, ADR-0561). Issuance is the prerequisite for PDP mTLS caller-auth: a workload that cannot obtain a fresh SVID cannot authenticate, and the PDP fail-closes to deny. The error budget therefore bounds spurious denials of legitimate workload traffic caused by issuance unavailability."
  indicator:
    metadata:
      name: identity-workload-svid-issuance-availability-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(identity_workload_svid_issuance_total{code!~"5.."}[5m]))'
        total:
          metricSource:
            type: prometheus
            spec:
              query: 'sum(rate(identity_workload_svid_issuance_total[5m]))'
  objectives:
    - displayName: "99.9% of SVID issuance requests complete without server error over rolling 30d"
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
