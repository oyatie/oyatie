apiVersion: openslo/v1
kind: SLO
metadata:
  name: tenant-rbac-readiness-gate-correctness
  labels:
    service: tenant-rbac
    sap_code: "suite"
spec:
  description: "Tenant RBAC cloud-readiness gate correctness objective: cloud claims must remain blocked whenever listener, IdP, durable storage, Workflow, audit, deployment, or production SLO evidence is missing."
  service: tenant-rbac
  indicator:
    metadata:
      name: tenant-rbac-readiness-gate-correctness-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(tenant_rbac_readiness_gate_result_total{service=\"tenant-rbac\",result=\"correct\"}[5m]))"
        total:
          metricSource:
            type: prometheus
            spec:
              query: "sum(rate(tenant_rbac_readiness_gate_result_total{service=\"tenant-rbac\"}[5m]))"
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: tenant-rbac-readiness-gate-correctness
      target: 0.9999
