apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-scim-availability
  displayName: "identity: SCIM endpoint availability 99.95%"
  labels:
    microservice: identity
    bounded_context: scim-server
    sli_class: availability
    owner_team: axis-identity
spec:
  service: identity
  description: SCIM endpoint non-5xx availability per ADR-0190.
  indicator:
    metadata: { name: identity-scim-availability }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_scim_request_total{http_status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_scim_request_total[5m]))
  objectives:
    - target: 0.9995
      displayName: "99.95% availability over 30d (≤ 4.4h/yr)"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
