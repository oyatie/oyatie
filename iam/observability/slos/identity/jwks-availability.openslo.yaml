apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-jwks-availability
  displayName: "identity: JWKS endpoint availability 99.999%"
  labels:
    microservice: identity
    bounded_context: oidc-issuer
    sli_class: availability
    owner_team: axis-identity
    severity: critical
spec:
  service: identity
  description: |
    JWKS endpoint availability — every consumer µservice's auth posture
    depends on this. Five-nines target (≤ 5.26 min/yr unplanned downtime).
  indicator:
    metadata: { name: identity-jwks-availability }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_jwks_request_total{http_status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_jwks_request_total[5m]))
  objectives:
    - target: 0.99999
      displayName: "99.999% availability over 30d (≤ 5.26 min/yr)"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
