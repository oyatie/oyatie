apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-aaguid-refresh-freshness
  displayName: "identity: AAGUID allowlist freshness ≤ 48h"
  labels:
    microservice: identity
    bounded_context: webauthn-relying-party
    sli_class: freshness
    owner_team: axis-identity
spec:
  service: identity
  description: |
    FIDO-MDS3 AAGUID allowlist freshness — refresh worker target 24h
    cadence; alert if stale > 48h. Regulated packs depend on this freshness
    to enforce attestation policy.
  indicator:
    metadata: { name: identity-aaguid-refresh-freshness }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_aaguid_refresh_total{stale="false"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_aaguid_refresh_total[5m]))
  objectives:
    - target: 0.999
      displayName: "AAGUID allowlist fresh ≥ 99.9% over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
