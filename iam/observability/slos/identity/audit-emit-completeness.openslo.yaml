apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-audit-emit-completeness
  displayName: "identity: audit emit completeness 1.0"
  labels:
    microservice: identity
    bounded_context: audit-emitter
    sli_class: correctness
    owner_team: axis-identity
spec:
  service: identity
  description: |
    Every event MUST seal into audit-chain. Compliance posture (SOC 2,
    GDPR Art. 30, HIPAA §164.316) depends on 1.0 completeness.
  indicator:
    metadata: { name: identity-audit-emit-completeness }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_audit_emit_total{sealed="true"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_audit_emit_total[5m]))
  objectives:
    - target: 1.0
      displayName: "completeness = 1.0 over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
