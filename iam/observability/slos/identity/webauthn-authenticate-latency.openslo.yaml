apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-webauthn-authenticate-latency
  displayName: "identity: WebAuthn assertion p99 ≤ 100ms"
  labels:
    microservice: identity
    bounded_context: webauthn-relying-party
    sli_class: latency
    owner_team: axis-identity
spec:
  service: identity
  description: WebAuthn assertion (finish_authentication) p99 latency.
  indicator:
    metadata: { name: identity-webauthn-auth-p99 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_webauthn_authenticate_duration_seconds_bucket{le="0.1"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_webauthn_authenticate_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 100ms for 99% of 5min windows over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
