apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-workload-authorize-latency-p99
  displayName: "identity/workload: PDP authorize p99 ≤ 10ms (hot path)"
  labels:
    microservice: identity
    bounded_context: workload-identity
    sli_class: latency
    tier: hero-substrate
    owner_team: axis-identity
    adr: "ADR-0002"
spec:
  service: identity
  description: |
    Hot-path authorization latency for the workload-identity PDP `/authorize`
    (Cedar PARC evaluation). The brief (§4) warns that a centralized PDP adds a
    network hop, so the budget targets in-process / embedded-Cedar evaluation:
    p99 ≤ 10ms over a rolling 30-day window. This is the DATA-plane authorize
    SLI and is intentionally separated from the looser control-plane lifecycle
    write latency (suspend/retire), which is eventually consistent (brief §4, §10).
  indicator:
    metadata:
      name: identity-workload-authorize-p99
    spec:
      # thresholdMetric (brief §4 — latency SLI uses op:lte against a duration).
      thresholdMetric:
        metricSource:
          type: Prometheus
          spec:
            query: |
              histogram_quantile(0.99, sum(rate(
                identity_workload_authorize_duration_seconds_bucket[5m]
              )) by (le))
  objectives:
    - displayName: "p99 ≤ 0.010s"
      op: lte
      value: 0.010
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
