apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-zitadel-instance-health
  displayName: "identity: Zitadel pod health 99.99%"
  labels:
    microservice: identity
    bounded_context: zitadel-instance-controller
    sli_class: availability
    owner_team: axis-identity + ops-sre-reliability
spec:
  service: identity
  description: |
    Zitadel pod availability per pack — sum(up{job="zitadel"}) / count(up).
    Four-nines target across 3-replica HA topology.
  indicator:
    metadata: { name: identity-zitadel-instance-health }
    spec:
      ratioMetric:
        counter: false
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(up{job="zitadel"})
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(up{job="zitadel"})
  objectives:
    - target: 0.9999
      displayName: "99.99% pod availability over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
