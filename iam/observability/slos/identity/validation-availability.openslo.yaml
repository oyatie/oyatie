apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-workload-validation-availability
  displayName: "identity/workload: token-validation availability ≥ 99.9%"
  labels:
    microservice: identity
    bounded_context: workload-identity
    sli_class: availability
    tier: hero-substrate
    owner_team: axis-identity
    adr: "ADR-0002"
spec:
  service: identity
  description: |
    Availability of the workload-token validation path (`/tokens/validate` +
    `/authorize-with-token`). A request is "good" when the validator renders a
    definitive verdict (valid, or a typed 422 failure) WITHOUT a 5xx. Per the
    brief (§4, §10), JWKS-fetch failures that exhaust the last-known-good cache
    surface as 503 and therefore BURN this budget — that is intentional, because
    a JWKS outage with an empty cache is a fail-closed hard-deny and must be
    visible to error-budget accounting, not hidden.
  indicator:
    metadata:
      name: identity-workload-validation-non5xx-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(
                  identity_workload_validate_request_total{http_status!~"5.."}[5m]
                ))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_workload_validate_request_total[5m]))
  objectives:
    - displayName: "99.9% definitive non-5xx verdicts"
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
