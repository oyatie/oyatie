apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-oidc-token-verify-latency
  displayName: "identity: OIDC token-verify (cache-hit) p999 ≤ 8ms"
  labels:
    microservice: identity
    bounded_context: oidc-issuer
    sli_class: latency
    tier: internal-substrate
    owner_team: axis-identity
spec:
  service: identity
  description: |
    OIDC token verification latency (JWKS-cached). Every authorised consumer
    request is verified locally with cached JWKS; p999 ≤ 8ms.
  indicator:
    metadata: { name: identity-oidc-verify-p999 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_oidc_verify_duration_seconds_bucket{le="0.008"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_oidc_verify_duration_seconds_count[5m]))
  objectives:
    - target: 0.999
      displayName: "p999 ≤ 8ms for 99.9% of 5min windows over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
