# Canonical-base: specs/openslo/canonical-envelope-schema.json (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-oidc-token-issue-latency
  displayName: "identity: OIDC token-issue p99 ≤ 80ms"
  labels:
    microservice: identity
    bounded_context: oidc-issuer
    sli_class: latency
    tier: internal-substrate
    plane: control
    owner_team: axis-identity
    pack_scope: all
spec:
  service: identity
  description: |
    OIDC token-issuance p99 latency. Every consumer µservice depends on this
    hot path. p99 ≤ 80ms target per capacity-model year-1 baseline.
  indicator:
    metadata: { name: identity-oidc-issue-p99 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_oidc_issue_duration_seconds_bucket{le="0.08"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_oidc_issue_duration_seconds_count[5m]))
  objectives:
    - target: 0.99
      displayName: "p99 ≤ 80ms for 99% of 5min windows over 30d"
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
