apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-step-up-grant-latency
  displayName: "identity: step-up grant p95 ≤ 8s"
  labels:
    microservice: identity
    bounded_context: step-up-orchestrator
    sli_class: latency
    owner_team: axis-identity
spec:
  service: identity
  description: |
    Step-up ACR grant flow latency p95. UX-bound; bigger window because user
    interaction (Passkey tap / hardware key) dominates the latency.
  indicator:
    metadata: { name: identity-step-up-p95 }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_step_up_grant_duration_seconds_bucket{le="8.0"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_step_up_grant_duration_seconds_count[5m]))
  objectives:
    - target: 0.95
      displayName: "p95 ≤ 8s for 95% of 5min windows over 30d"
  timeWindow: [{ duration: 30d, isRolling: true }]
  budgetingMethod: Occurrences
  alertPolicies: [{ alertPolicyRef: canonical-burn-rate-multi-window }]
