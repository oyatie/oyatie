apiVersion: openslo/v1
kind: SLO
metadata:
  name: identity-workload-decision-correctness
  displayName: "identity/workload: authz decision correctness ≥ 99.999%"
  labels:
    microservice: identity
    bounded_context: workload-identity
    sli_class: correctness
    tier: hero-substrate
    owner_team: axis-identity
    adr: "ADR-0002"
spec:
  service: identity
  description: |
    Correctness of authorization decisions, measured continuously against a
    golden policy-decision test set (brief §4 — ratioMetric vs a golden set).
    A synthetic prober replays a fixed corpus of PARC tuples with known-correct
    expected decisions (explicit-permit, explicit-forbid, implicit-deny,
    suspended-principal, cross-trust-domain, sensitive-write-without-mfa) on a
    schedule; a "good" event is a replay whose rendered decision AND
    determining-policy set match the golden expectation. Because a wrong
    authorization decision is a security event, the objective is 5 nines and a
    miss should open a sev0 (see runbooks/policy-store-unavailable.md).
  indicator:
    metadata:
      name: identity-workload-decision-correctness-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(
                  identity_workload_golden_decision_total{match="true"}[5m]
                ))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(identity_workload_golden_decision_total[5m]))
  objectives:
    - displayName: "99.999% golden-set decision match"
      target: 0.99999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  alertPolicies:
    - alertPolicyRef: canonical-burn-rate-multi-window
