# Canonical-base: specs/openslo/canonical-envelope-schema.json (ADR-0064 canonical envelope).
# G002 slice-1b-iii-c (ADR-0561): the in-cluster SVID-delivery operator PRODUCES
# the cloud-iam-pdp-svid Secret the PDP mTLS PEP boots from (fail-closed). Per
# CLAUDE.md (observability_substrate) a service cannot promote past dev without
# slos/*.openslo.yaml; this SLO bounds delivery availability so a stalled operator
# cannot silently let the PDP's SVID expire — which, fail-closed, refuses PDP boot
# and denies all caller traffic.
apiVersion: openslo/v1
kind: SLO
metadata:
  name: iam-svid-operator-delivery-availability
  displayName: "iam SVID-delivery operator availability"
  labels:
    microservice: iam
    bounded_context: workload
    component: svid-delivery-operator
    tier: control-plane
    plane: control
    adr_0510: transient-svid-operator-kube-adapter
  annotations:
    instrumentation_status: target-only
    current_runtime_signal: "structured tracing event iam_svid_operator_reconcile"
    exporter_gap: "Prometheus histogram iam_svid_operator_reconcile_convergence_seconds_bucket is not exported in this slice."
    current_actuation_scope: "The operator reconciles the cloud-iam-pdp-svid kubernetes.io/tls Secret: Issue on cold start, Rotate within the pre-expiry window, Noop when fresh; minting roots on the trustd EcdsaP256 CA via the unchanged SigningBackend seam (cloud-kms sealing-root swap deferred, ADR-0561 D4/D5)."
spec:
  service: iam
  description: "Target SLO for the availability of the in-cluster SVID-delivery operator that produces and rotates the PDP's cloud-iam-pdp-svid Secret. The operator is the single in-cluster producer of the PDP mTLS material: a stalled operator that fails to issue or rotate the SVID lets the delivered leaf expire, and the PDP's fail-closed boot then refuses to serve — denying ALL caller authorization traffic. The error budget therefore bounds spurious PDP-wide denials caused by SVID-delivery unavailability. The operator emits the structured wide-event iam_svid_operator_reconcile with convergence_seconds; the Prometheus histogram below is the target exporter mapping, not a claim that the exporter is live in this slice."
  indicator:
    metadata:
      name: iam-svid-operator-delivery-availability-sli
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: 'histogram_quantile(0.99, sum(rate(iam_svid_operator_reconcile_convergence_seconds_bucket{microservice="iam"}[5m])) by (le))'
  objectives:
    - displayName: "99% of SVID-delivery reconcile cycles converge within 60s over rolling 30d"
      target: 0.99
      op: lte
      value: 60
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
