{{- $imageDigest := .Values.image.digest | default "" -}}
{{- if and .Values.image.cosign.required (not (and (regexMatch "^sha256:[0-9a-f]{64}$" $imageDigest) (regexMatch "[1-9a-f]" (trimPrefix "sha256:" $imageDigest)))) -}}
{{- fail "image.digest must be set to a real non-zero sha256 digest when image.cosign.required=true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.id | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/cargo-package: {{ .Values.microservice.cargoPackage | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.microservice.id | quote }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
      annotations:
        cosign.sigstore.dev/required: {{ .Values.image.cosign.required | quote }}
        oyatie.com/image-digest: {{ $imageDigest | quote }}
        oyatie.com/image-promotion-policy: {{ .Values.image.cosign.policy | quote }}
        oyatie.com/audit-chain-event: "microservice-deployment"
    spec:
      runtimeClassName: {{ .Values.podRuntime.runtimeClassName | quote }}
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}{{- if $imageDigest }}@{{ $imageDigest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: OYA_MICROSERVICE
              value: {{ .Values.microservice.id | quote }}
            - name: OYA_CARGO_PACKAGE
              value: {{ .Values.microservice.cargoPackage | quote }}
            - name: OYA_OTEL_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OYA_IMAGE_PROMOTION_POLICY
              value: {{ .Values.config.imagePromotionPolicy | quote }}
            # G002 slice-1b-iii (ADR-0561): the delivered mTLS cert mount. The PDP
            # production boot builds an MtlsContext from this directory and FAIL-CLOSES
            # (boot refusal, never plain TCP) if the SVID material is absent. The
            # operator that PRODUCES the oya-cloud-iam-pdp-svid Secret is slice-1b-iii-c;
            # until it lands the pod correctly fail-closes without the mount.
            - name: OYA_CLOUD_IAM_PDP_MTLS_CERT_DIR
              value: "/etc/oya-cloud-iam-pdp/tls"
          volumeMounts:
            - name: pdp-svid
              mountPath: /etc/oya-cloud-iam-pdp/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        # G002 slice-1b-iii (ADR-0561): the projected SVID Secret carrying the PDP
        # server leaf/key + the trusted CA bundle (kubernetes.io/tls shape:
        # tls.crt/tls.key/ca.crt). Produced by the SVID operator (slice-1b-iii-c);
        # the PDP fail-closes without it.
        - name: pdp-svid
          secret:
            secretName: oya-cloud-iam-pdp-svid
