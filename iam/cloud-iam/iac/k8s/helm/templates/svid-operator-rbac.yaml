{{- if .Values.svidOperator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.svidOperator.serviceAccount.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0510: transient-svid-operator-kube-adapter
  annotations:
    oyatie.com/non-claim: {{ .Values.svidOperator.serviceAccount.nonClaim | quote }}
automountServiceAccountToken: {{ .Values.svidOperator.serviceAccount.automountToken }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.svidOperator.name | quote }}
  namespace: {{ .Values.svidOperator.watchedNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
rules:
  # The operator PRODUCES + rotates exactly the oya-cloud-iam-pdp-svid Secret.
  # SCOPED rule: get/update/patch are constrained by resourceNames to that single
  # Secret — it observes leaf expiry (get) and projects the kubernetes.io/tls
  # material (update/patch). Kubernetes RBAC honors resourceNames for
  # get/update/patch/delete; delete is NOT granted (fail-closed: the operator
  # never removes the SVID Secret).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["oya-cloud-iam-pdp-svid"]
    verbs: ["get", "update", "patch"]
  # NAMESPACE-scoped rule (the RBAC floor, not a wider claim). Per the Kubernetes
  # RBAC reference: `create` (and `deletecollection`) can NEVER be resourceNames-
  # scoped (the object name is not known at authorization time); `list`/`watch`
  # CAN be resourceNames-scoped, but ONLY when the client sends a matching
  # metadata.name field selector — otherwise the request is denied. The operator
  # only ever creates oya-cloud-iam-pdp-svid, and its informer SHOULD narrow
  # list/watch with a metadata.name=oya-cloud-iam-pdp-svid field selector; once
  # the binary guarantees that selector, list/watch can also carry
  # resourceNames: ["oya-cloud-iam-pdp-svid"] here. Until then, scoping them would
  # 403 the operator, so they stay namespace-wide. To additionally shield other
  # Secrets in a shared namespace, run the operator in a Secret-isolated namespace
  # (watchedNamespace).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.svidOperator.name | quote }}
  namespace: {{ .Values.svidOperator.watchedNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    oyatie.com/adr-0349: argocd-managed
subjects:
  - kind: ServiceAccount
    name: {{ .Values.svidOperator.serviceAccount.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.svidOperator.name | quote }}
{{- end }}
