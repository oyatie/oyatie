{{- if .Values.svidOperator.enabled }}
{{- $operatorDigest := .Values.svidOperator.image.digest | default "" -}}
{{- if and .Values.svidOperator.image.cosign.required (not (and (regexMatch "^sha256:[0-9a-f]{64}$" $operatorDigest) (regexMatch "[1-9a-f]" (trimPrefix "sha256:" $operatorDigest)))) -}}
{{- fail "svidOperator.image.digest must be set to a real non-zero sha256 digest when svidOperator.image.cosign.required=true" -}}
{{- end -}}
{{- if not .Values.svidOperator.cellId -}}
{{- fail "svidOperator.cellId must be set to the real cell id (forms the platform SVID authority); the operator binary fail-closes otherwise" -}}
{{- end -}}
{{- /* GH #980 join-token bootstrap contract: the operator reads OYATIE_SVID_OPERATOR_JOIN_TOKEN
       from svidOperator.joinToken.secretName and fail-closes if it is empty, so the chart MUST
       NOT enable the operator without a provisioning path for that Secret. Fail the render unless
       exactly one is selected: the ESO ExternalSecret (default) OR an explicit preProvisioned
       acknowledgement that an owned out-of-band mechanism supplies it. */ -}}
{{- if and (not .Values.svidOperator.joinToken.externalSecret.enabled) (not .Values.svidOperator.joinToken.preProvisioned) -}}
{{- fail "svidOperator.joinToken has no provisioning contract: set joinToken.externalSecret.enabled=true (ESO->OpenBao, preferred) OR joinToken.preProvisioned=true to acknowledge an owned out-of-band Secret. The operator fail-closes without OYATIE_SVID_OPERATOR_JOIN_TOKEN." -}}
{{- end -}}
{{- if and .Values.svidOperator.joinToken.externalSecret.enabled .Values.svidOperator.joinToken.preProvisioned -}}
{{- fail "svidOperator.joinToken: choose exactly ONE provisioning path — joinToken.externalSecret.enabled and joinToken.preProvisioned are mutually exclusive (preProvisioned opts OUT of the ESO ExternalSecret)." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.svidOperator.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/adr-0510: transient-svid-operator-kube-adapter
    oyatie.com/cargo-package: {{ .Values.svidOperator.cargoPackage | quote }}
spec:
  replicas: {{ .Values.svidOperator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.svidOperator.name | quote }}
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: {{ .Values.microservice.tenantClass | quote }}
      annotations:
        cosign.sigstore.dev/required: {{ .Values.svidOperator.image.cosign.required | quote }}
        oyatie.com/image-digest: {{ $operatorDigest | quote }}
        oyatie.com/image-promotion-policy: {{ .Values.svidOperator.image.cosign.policy | quote }}
        oyatie.com/audit-chain-event: "cloud-iam-svid-operator-deployment"
    spec:
      runtimeClassName: {{ .Values.podRuntime.runtimeClassName | quote }}
      serviceAccountName: {{ .Values.svidOperator.serviceAccount.name | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.svidOperator.image.registry }}/{{ .Values.svidOperator.image.repository }}{{- if $operatorDigest }}@{{ $operatorDigest }}{{- else }}:{{ .Values.svidOperator.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.svidOperator.image.pullPolicy | quote }}
          command:
            - /usr/local/bin/cloud-iam-pdp-svid-operator
          env:
            - name: OYATIE_MICROSERVICE
              value: {{ .Values.microservice.id | quote }}
            - name: OYATIE_CARGO_PACKAGE
              value: {{ .Values.svidOperator.cargoPackage | quote }}
            - name: OYATIE_SVID_OPERATOR_CELL_ID
              value: {{ .Values.svidOperator.cellId | quote }}
            - name: OYATIE_SVID_OPERATOR_NAMESPACE
              value: {{ .Values.svidOperator.watchedNamespace | quote }}
            - name: OYATIE_SVID_OPERATOR_TTL_SECS
              value: {{ .Values.svidOperator.ttlSecs | quote }}
            - name: OYATIE_SVID_OPERATOR_ROTATION_WINDOW_SECS
              value: {{ .Values.svidOperator.rotationWindowSecs | quote }}
            - name: OYATIE_SVID_OPERATOR_JOIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.svidOperator.joinToken.secretName | quote }}
                  key: {{ .Values.svidOperator.joinToken.secretKey | quote }}
          resources:
{{ toYaml .Values.svidOperator.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
