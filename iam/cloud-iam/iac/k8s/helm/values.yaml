microservice:
  id: cloud-iam
  cargoPackage: oya-cloud-iam-app
  tenantClass: contributor

replicaCount: 2

podRuntime:
  runtimeClassName: kata-cloud-hypervisor

serviceAccount:
  name: oya-cloud-iam

image:
  registry: registry.oyatie.dev
  repository: oya-cloud-iam
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-cloud-iam-cedar
  # Per-service authorization policy. DATA, never a shared template.
  policy: |
    // Deployed Cedar mirrors the authored PBAC policy directories for this capability.
    // Broad tenant-class-only permits are forbidden by the cedar-deploy-parity gate.

    // Source: cedar/policies.cedar
    permit(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ComputeAutoshardingPlacement", Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-iam" &&
      context.doctrine.adr_0348 == true &&
      context.autosharding_mode == "control_plane_driven" &&
      context.honors_residency == true &&
      context.compliance_pack_check_result == "pass" &&
      context.residency_check_result == "pass" &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action in [Action::"ExecuteAutoRebalance", Action::"ExecuteDynamicSharding"],
      resource is ShardingAutomation
    ) when {
      resource.microservice == "cloud-iam" &&
      (
        context.honors_residency == false ||
        context.compliance_pack_check_result != "pass" ||
        context.residency_check_result != "pass" ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal == ServicePrincipal::"oyatie.control-plane.cell-orchestrator",
      action == Action::"MigrateTenantCrossJurisdiction",
      resource is TenantMigration
    ) unless {
      resource.microservice == "cloud-iam" &&
      context.cedar_permit_id != "" &&
      context.cross_jurisdiction_permit_id != "" &&
      context.audit_chain_emit == true
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunCiMirror",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iam" &&
      context.doctrine.adr_0346 == true &&
      context.oya_verify_ci_required == true &&
      context.steps.cargo_fmt_all_check == true &&
      context.steps.cargo_check_workspace_all_targets == true &&
      context.steps.cargo_clippy_workspace_all_targets_d_warnings == true &&
      context.steps.cargo_nextest_workspace_no_fail_fast == true &&
      context.steps.oya_gate_run_all_ci_required == true &&
      context.step_exit_semantics == "block_on_exit_0_each_step" &&
      context.exit_code_contract in [0, 1, 2]
    };

    permit(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action == Action::"RunSelfHostedCi",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iam" &&
      context.doctrine.adr_0349 == true &&
      context.github_actions_parity_ok == true &&
      context.jcasc_declared == true &&
      context.lane_prefix in ["oya-governance", "oya-check"] &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.pipeline.ci",
      action in [Action::"RunCiMirror", Action::"RunSelfHostedCi"],
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iam" &&
      (
        context.github_actions_parity_ok == false ||
        context.jcasc_declared == false ||
        context.lane_id.matches("^oya-governance-.*$")
      )
    };

    permit(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-iam" &&
      context.doctrine.adr_0349 == true &&
      context.cosign_signature_verified == true &&
      context.tenant_namespace_isolated == true &&
      context.cedar_policy_gate_granted == true &&
      context.audit_chain_emit == true
    };

    forbid(
      principal == ServicePrincipal::"oyatie.argocd.gitops",
      action == Action::"SyncApplication",
      resource is GitOpsApplication
    ) when {
      resource.microservice == "cloud-iam" &&
      (
        context.cosign_signature_verified == false ||
        context.tenant_namespace_isolated == false ||
        context.audit_chain_emit != true
      )
    };

    forbid(
      principal,
      action == Action::"AuthorGovernanceLane",
      resource is ServiceCiSurface
    ) when {
      resource.microservice == "cloud-iam" &&
      context.doctrine.adr_0347 == true &&
      context.lane_id.matches("^oya-governance-.*$") &&
      context.historical_reference != true
    };

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# G002 slice-1b-iii-c (ADR-0561, ADR-0510): the in-cluster SVID-delivery operator
# that PRODUCES + rotates the oya-cloud-iam-pdp-svid Secret the PDP mTLS PEP boots
# from. Roots issuance on the trustd EcdsaP256 CA via the unchanged SigningBackend
# seam (cloud-kms per-cell sealing-root swap deferred, ADR-0561 D4/D5).
svidOperator:
  enabled: true
  name: oya-cloud-iam-pdp-svid-operator
  cargoPackage: oya-cloud-iam-pdp-svid-operator
  replicaCount: 1
  # The namespace the projected oya-cloud-iam-pdp-svid Secret is written into.
  watchedNamespace: cloud-iam
  # The cell id forming the platform SVID authority
  # (spiffe://oyatie.cell-<id>/platform/cloud-iam-pdp). Release/cell automation
  # must inject the real cell id; the empty default fail-closes the binary on boot.
  cellId: ""
  ttlSecs: 3600
  rotationWindowSecs: 600
  image:
    registry: registry.oyatie.dev
    repository: oya-cloud-iam-pdp-svid-operator
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
    cosign:
      required: true
      policy: ADR-0181
  serviceAccount:
    name: oya-cloud-iam-pdp-svid-operator
    automountToken: true
    nonClaim: "operator writes only the oya-cloud-iam-pdp-svid Secret in its namespace and emits reconcile events"
  # The cluster join token gating SVID issuance (operator-internal). The binary
  # fail-closes if it is empty. GH #980: the chart now ships a declarative
  # provisioning contract instead of silently assuming a hand-provisioned Secret.
  # The deployment preflight (svid-operator-deployment.yaml) FAILS the render
  # unless exactly one provisioning path is selected: either externalSecret
  # (ESO->OpenBao, default below) or preProvisioned=true (explicit, audited
  # acknowledgement that the Secret is supplied out-of-band).
  joinToken:
    secretName: oya-cloud-iam-pdp-svid-operator-join-token
    secretKey: join-token
    # Set true ONLY to acknowledge the join-token Secret is provisioned by another
    # owned mechanism; this opts OUT of the ESO ExternalSecret below. Leaving both
    # this false AND externalSecret.enabled false fail-closes the render.
    preProvisioned: false
    # Preferred path: provision the join token from OpenBao via the External
    # Secrets Operator, using a dedicated OpenBao role/store for the cloud-iam join-token prefix.
    externalSecret:
      enabled: true
      refreshInterval: 1h
      secretStoreRef:
        name: openbao-cloud-iam-svid-operator
        kind: ClusterSecretStore
      # OpenBao KV path + property the join token is read from (KV v2 under the
      # `secret` mount; path convention mirrors cloud-k8s/.../openbao-secret-references.yaml).
      openbaoPath: cloud-iam/pdp-svid-operator/join-token
      openbaoProperty: join-token
  pdb:
    # Single-replica operator: maxUnavailable lets node drains proceed (the pod
    # reschedules) instead of wedging on minAvailable==replicaCount.
    maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
