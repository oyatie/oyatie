// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.cloud_iam.v1;

// Metadata-only design/spec maturity contract for cloud-iam.
// This proto is review evidence for API shape; it does not prove a live gRPC server.
message CloudIamDesignSurfaceRequest {
  string tenant_id = 1;
  string service_id = 2;
  string design_surface = 3;
}

message CloudIamDesignSurfaceResponse {
  string service_id = 1;
  string design_surface = 2;
  string evidence_ref = 3;
  string non_claim = 4;
}

service CloudIamDesignSurfaceService {
  rpc DescribeDesignSurface(CloudIamDesignSurfaceRequest) returns (CloudIamDesignSurfaceResponse);
}
