findings:
  - severity: HIGH
    file: specs/stage1-admission-envelope.schema.json:216
    title: SCM relationship receipt does not bind the protected-base repository
    issue: >-
      The receipt has only repository, which is required by Rust to equal the
      candidate exact-head repository. The receipt separately binds protected-base
      commit, tree, and merge base, but has no protected-base repository field to
      equal protected_parent.repository. Git object IDs alone do not identify the
      protected repository/server namespace. The fixture explicitly uses different
      protected and candidate repositories while the receipt identifies only the
      candidate repository.
    evidence:
      - specs/stage1-admission-envelope.schema.json:216-262 closes the SCM receipt without protected_base_repository.
      - libs/oya-stage1-closure/src/lib.rs:3887-3912 mirrors that field list.
      - libs/oya-stage1-closure/src/lib.rs:3964-3975 binds repository to exact_head and merge base to protected_parent commit only.
      - libs/oya-stage1-closure/tests/fixtures/admission-envelope.json:6-8,17-19,41-48 uses distinct protected/candidate repositories and candidate-only SCM repository.
      - docs/decisions/ADR-0622-mechanism-neutral-pre-roadmap-stage1-evidence-epoch.md:206-210 requires protected facts to bind both protected-base and candidate repositories.
    fix: >-
      Add a required protected_base_repository (and, preferably, explicit
      head_repository) field to the SCM receipt schema, fixture, Rust required
      and allowed lists, and semantic validation. Require exact equality with
      protected_parent.repository, then add negative tests for repository mismatch
      in both envelope and sibling linkage validation.
  - severity: MEDIUM
    file: specs/stage1-protected-facts.schema.json:2555
    title: Protected-facts schema retains a stale alternate admission-envelope contract
    issue: >-
      An unreachable $defs.admission_envelope remains in the protected-facts schema
      even though admission is now a sibling external-controller input. It diverges
      from the canonical admission schema by omitting pull_request and
      scm_relationship_receipt. The corresponding source loop still skips an
      admission_envelope candidate record although that property is deliberately
      excluded. This leaves a misleading alternate contract and dead bypass branch
      that future consumers can accidentally reference.
    evidence:
      - specs/stage1-protected-facts.schema.json:2555-2631 defines the stale alternate envelope.
      - specs/stage1-admission-envelope.schema.json:8-26 requires pull_request and scm_relationship_receipt.
      - libs/oya-stage1-closure/src/lib.rs:3613-3616 skips the obsolete record name.
      - libs/oya-stage1-closure/tests/stage1_closure.rs:2180-2194 verifies only that candidate_records excludes the property, not that the stale definition and skip are absent.
    fix: >-
      Delete the obsolete $defs.admission_envelope and remove the dead skip. Add a
      regression asserting no protected-facts definition/property can expose an
      admission envelope; keep the canonical sibling schema as the sole contract.
  - severity: LOW
    file: libs/oya-stage1-closure/src/lib.rs:867
    title: Protected receipt artifact bindings are validated twice
    issue: >-
      Two adjacent identical loops validate the same thirteen artifact-binding
      fields. BTreeSet deduplication hides duplicate findings, but the repetition
      adds needless work and makes future changes liable to diverge.
    evidence:
      - libs/oya-stage1-closure/src/lib.rs:867-908 contains two identical field lists and validation calls.
    fix: Delete the second loop and retain a single shared field list.

