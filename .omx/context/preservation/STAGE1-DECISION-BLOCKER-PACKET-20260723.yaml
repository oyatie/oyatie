principal_boundary:
  statement: >-
    "Assume qualified authorization" authorizes autonomous in-scope
    preparation and execution. It does not authenticate founder/council
    identity, create professional qualification or affected-party standing,
    prove operations capacity or custody control, delegate veto or pilot
    accountability, manufacture independent humans through agent aliases,
    prove fresh-context isolation, establish trust roots, or create
    server-side protected admission.
  forbidden_inference: >-
    Repository authors, local agents, subagents, process aliases, source
    schemas, booleans, principal_id strings, or self-issued signatures must not
    be relabeled as any irreducible qualified principal above.

invalidation_rules:
  - >-
    Any program, controlling authority, evidence contract, parser/IR,
    producer/evaluator/materializer, policy, subject, or subject-scope mutation
    opens a new epoch and invalidates every receipt derived from the prior
    epoch unless the controlling contract explicitly proves a narrower
    dependency boundary.
  - Any C04 population or C06 comparator-scope mutation invalidates C05 onward.
  - Any custody key, policy, or trust-root mutation invalidates dependent evidence.
  - Any C12 successor mutation invalidates all C13, C14, and C15 receipts.
  - Any candidate head movement invalidates exact-head review and CI evidence.
  - Any protected-parent promotion requires successor restack and fresh admission.
  - >-
    Context exposure invalidates every affected C13 reviewer receipt and every
    affected C14 or C15 oracle, blind-reader, or QPA receipt. Exposure of the
    shared cold-review packet or isolation mechanism invalidates the complete
    C13-C15 review join.

