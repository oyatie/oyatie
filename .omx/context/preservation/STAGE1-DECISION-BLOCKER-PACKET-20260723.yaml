      - 1364
    reason: >-
      Each successor was repaired against the exact local predecessor. A squash
      promotion changes the protected parent, so restack freshness, exact-head
      review, required CI, merge, and post-merge proof serialize at admission.
  archive:
    current_rule: git-object-history-only
    readable_current_tree_archive_allowed: false
    confidentiality_claim: false
    qualification: >-
      Removing a body from the current tree prevents ordinary checkout/search
      discovery and authority confusion. It does not make reachable Git history
      confidential or unreadable to a deliberate history search.
    stronger_retention_requirement: >-
      Future-agent-inaccessible retention requires a qualified external
      custodian outside repository objects, refs, forge access, bundles, and
      agent credentials. Public history rewrite or no-rewrite disposition
      requires explicit founder/admin/custodian authority and independent
      verification.
  execution_graph:
    prepare_plane: >-
      Schemas, fixtures, protocol drafts, source inventory, worktree repair,
      bounded diagnostics, and non-authoritative review may run concurrently.
    satisfy_plane: >-
      C01, C02, and C03 may converge independently; their join permits C04.
      C04 permits C06; C06 then permits C05 collection, analysis, citation, and
      satisfaction. C07, C08, and C09 also depend on C04. C10 and C11 are
      siblings after the C04-C09 join. C12 freezes the joined successor. C13's
      sixteen lens reviews and C14 dissent may then run concurrently against
      that same immutable successor. C15 oracle and blind-reader reproduction
      follow the C13-C14 join, then the qualified planning authority decides
      planning-entry scope. Protected admission remains external.
    forbidden_in_proposed_source:
      - scheduler
      - queue
      - lease
      - retry-controller
      - work-in-progress-controller
      - roadmap-dispatch

