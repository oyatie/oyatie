  qualified_pass_possible_only_when: >-
    Every C01-C15 control, protected admission condition, exact-object review,
    required context, qualified-human authority category, fresh-context receipt,
    sixteen-lens receipt, and context-free exit gate is independently
    authenticated against one immutable successor.
  until_then: >-
    Preserve HOLD(Planning), do not dispatch a roadmap or implementation, do not
    merge the stale remote PR heads, and do not infer authority from local
    engineering success.
