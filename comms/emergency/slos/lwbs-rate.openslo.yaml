apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-lwbs-rate
  displayName: ED Left-Without-Being-Seen Rate
  labels:
    microservice: emergency
    domain: healthcare.emergency.lwbs
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    LWBS encounters as a percent of total arrivals.
    Target ≤ 2%, ceiling ≤ 4%.
  service: emergency
  indicator:
    metadata: { name: lwbs-rate }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_emergency_arrivals_total[28d])) - sum(rate(oya_emergency_lwbs_total[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(oya_emergency_arrivals_total[28d]))
  objectives:
    - displayName: LWBS ≤ 2%
      target: 0.98
    - displayName: LWBS ceiling ≤ 4%
      target: 0.96
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
