apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-protocol-bundle-compliance
  displayName: ED Sepsis 3-hour Bundle Compliance
  labels:
    microservice: emergency
    domain: healthcare.emergency.sepsis
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Sepsis 3-hour bundle (lactate, blood cultures, broad-spectrum antibiotic,
    30 mL/kg crystalloid) completed within window. Target ≥ 90%.
  service: emergency
  indicator:
    metadata: { name: sepsis-bundle-3h }
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_sepsis_bundle_within_window_total[28d]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(increase(oya_emergency_sepsis_protocol_activations_total[28d]))
  objectives:
    - displayName: sepsis 3h bundle compliance ≥ 90%
      target: 0.90
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
