apiVersion: openslo/v1
kind: SLO
metadata:
  name: emergency-boarding-burden
  displayName: ED Boarding Burden
  labels:
    microservice: emergency
    domain: healthcare.emergency.boarding
    canonical_adrs: "ADR-0251,ADR-0332"
spec:
  description: |
    Count of admitted patients held in ED past 4 h.
    Daily ceiling tunable per facility; default target ≤ 5 concurrent.
  service: emergency
  indicator:
    metadata: { name: boarding-4h-count }
    spec:
      thresholdMetric:
        metricSource:
          type: prometheus
          spec:
            query: |
              max_over_time(oya_emergency_boarding_4h_count[1d])
  objectives:
    - displayName: ≤ 5 concurrent boarders past 4h
      op: lte
      value: 5
      target: 0.85
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
