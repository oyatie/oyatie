# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:meet:t0-suggest:v1
name: meeting-topic-and-participant-hint
namespace: meet
display_name: Meeting Topic + Participant Hint Suggestions
description: |
  T0 capability: given the meeting context (calendar event + invitee list +
  prior meeting history bounded by Cedar policy), emit ≤ 3 ranked meeting-topic
  suggestions and ≤ 5 ranked participant-hint candidates for the host at
  meeting-create time. T0 = suggestion only; no autonomous action. Always
  presented to the user; no action taken without confirmation.

owner_team: axis-meet + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-MEET-0006]
related_artifacts:
  - microservices/meet/PRD.md (FR-01)
  - microservices/meet/contracts/openapi/meet.yaml
  - microservices/meet/policy/meeting-scope.cedar

autonomy_tier: T0
# T0 = suggest-only; per ADR-0022 autonomy tiers (Bominal-inherited).
# No state mutation; no autonomous action.

inputs:
  - name: calendar_event_id
    type: string
    required: false
  - name: invitee_refs
    type: array
    items: {type: string}
    max_items: 100
    required: true
  - name: composing_user_ref
    type: string
    required: true
  - name: prior_meeting_count_lookback
    type: integer
    default: 10
    description: How many prior meetings between the composing user and invitees to consider as context

outputs:
  - name: topic_suggestions
    type: array
    max_items: 3
    items:
      type: object
      properties:
        text: {type: string, maxLength: 100}
        confidence: {type: number, minimum: 0, maximum: 1}
        rationale_token: {type: string, description: opaque rationale id for audit replay}
  - name: participant_hints
    type: array
    max_items: 5
    items:
      type: object
      properties:
        target_kind: {type: string, enum: [Person, Team]}
        target_ref: {type: string}
        rationale: {type: string, enum: [recurring_collab, calendar_overlap, prior_thread_mention, role_relevance]}
        confidence: {type: number}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

regulatory_packs_consumed:
  - pack-kr
  - pack-eu
  - pack-us
  - pack-us-healthcare  # MUST DISABLE for PHI rooms per HIPAA Safe Harbour
  - pack-us-financial
  - pack-jp
  - pack-sg
  - pack-au
  - pack-in
  - pack-br
  - pack-ae
  - pack-ksa

pack_overrides:
  pack-us-healthcare:
    disabled_for_phi_rooms: true
    reason: HIPAA 45 CFR §164.514 Safe Harbour — no derived inferences over PHI
  pack-eu:
    risk_classification: minimal_risk
    transparency_obligation: must-label-as-AI-suggested per EU AI Act Art. 50
    reference_adr: ADR-MEET-0006
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in required
  pack-us-financial:
    disabled_by_default: true
    reason: SEC 17a-4 supervised-comms; topic-inference over investment-discussion not permitted without compliance approval

evidence_topic: oya.meet.capability.t0_suggest.evidence

cost_profile:
  type: per-suggestion-batch
  estimated_cost_usd_per_call: 0.0010
  cost_drivers:
    - LLM inference (small open-weights model; on-prem GPU pool)
    - Ontology lookup for participant-hint candidates
    - Calendar µservice lookup for prior-meeting context

cedar_policy_fragments:
  - microservices/meet/policy/meeting-scope.cedar
  - microservices/meet/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/meet/capabilities/eval/t0-suggest-baseline.jsonl
  pass_threshold: 0.88
  eval_metric: topic-suggestion-relevance vs human-rater baseline; participant-hint precision@1
  cadence: per-release

sunset:
  status: none
