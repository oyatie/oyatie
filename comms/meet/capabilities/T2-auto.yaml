# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:meet:t2-auto:v1
name: auto-mute-noise-detect-and-auto-translate
namespace: meet
display_name: Auto-Mute on Background Noise + Auto-Translate Caption Overlay
description: |
  T2 capability: autonomous classification + bounded side-effects WITHOUT
  per-invocation user confirmation. Two sub-capabilities:

  1. Auto-mute-on-noise  — small classifier detects sustained background
     noise on a participant's mic; auto-mutes with a banner notification.
     Reversible by participant in one click.
  2. Auto-translate-caption-overlay  — when caption language differs from
     the participant's preferred-locale, automatically overlay a translated
     caption alongside the original. Both visible.

  All side-effects are reversible by the user; no destructive ops; full
  audit-chain trail.

owner_team: axis-meet + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133, ADR-MEET-0002, ADR-MEET-0006]
related_artifacts:
  - microservices/meet/PRD.md
  - comms/meet/policy/meeting-scope.cedar

autonomy_tier: T2
# T2 = autonomous classification + side-effects bounded to user-reversible
# state; no destructive ops; full audit-chain trail.

inputs:
  - name: instance_id
    type: string
    required: true
  - name: audio_or_caption_frame
    type: object
    required: true

outputs:
  - name: mute_decision
    type: object
    properties:
      muted: {type: boolean}
      participant_user_ref: {type: string}
      confidence: {type: number}
      reason: {type: string, enum: [sustained_background_noise, sudden_loud_noise, keyboard_typing_pattern, other]}
      reversible: {type: boolean, default: true}
  - name: translation_overlay
    type: object
    properties:
      target_locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
      translated_text: {type: string}
      detected_source_locale: {type: string}
      provider: {type: string, enum: [local-mbart, local-nllb, none]}
      ai_generated_label: {type: string, default: "AI-translated"}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

e2e_mode_interaction:
  refused: true
  reason: ADR-MEET-0003 — T2 over server-side audio/captions Cedar-denied in e2e_mode=true; client-side variants permitted but out of scope here

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-us-financial, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    auto_mute: enabled
    auto_translate: disabled_for_phi_rooms
    reason: HIPAA — third-party translation provider not BAA-covered; only on-prem local-mbart permitted
  pack-us-financial:
    auto_mute: enabled
    auto_translate: enabled_with_supervisor_review
    reason: FINRA Rule 3110 supervisory review applies to translated supervised-comms
  pack-eu:
    risk_classification:
      auto_mute: limited_risk
      auto_translate: limited_risk
    transparency_obligation: tenant-admin must disclose to end-users in privacy notice; per ADR-MEET-0006
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in + per-user end-user notice

evidence_topic: oya.meet.capability.t2_auto.evidence

cost_profile:
  type: per-event
  estimated_cost_usd_per_event: 0.0003
  cost_drivers:
    - Background-noise classifier inference (small model, batched)
    - Translation inference (when invoked)

cedar_policy_fragments:
  - comms/meet/policy/meeting-scope.cedar
  - comms/meet/policy/tenant-scope.cedar

eval_set:
  baseline_inputs_path: microservices/meet/capabilities/eval/t2-auto-baseline.jsonl
  pass_threshold:
    auto_mute_false_positive: 0.02
    auto_translate_bleu: 0.40
  eval_metric: |
    auto-mute precision@1 (false-mute < 2 %);
    auto-translate BLEU vs reference + human-eval Likert
  cadence: per-release
  reference: chrF++ + COMET (translation); macro-F1 (noise classifier)

rollback:
  ttl_seconds: 0  # T2 outputs are reversible by participant in one click; "rollback" = un-mute + remove overlay
  audit_trail: every classification + translation emits to evidence_topic with hash + reasoning_token

sunset:
  status: none
