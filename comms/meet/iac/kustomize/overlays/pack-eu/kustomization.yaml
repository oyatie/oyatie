# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meet
resources: [../../base]
commonAnnotations:
  oyatie/pack: "eu"
  oyatie/region: "eu-central-1"
  oyatie/legal-citations: |
    GDPR Arts. 5/6/7/13/14/17/22/25/32/35/44-50. ePrivacy Directive Art. 5(3).
    EU AI Act Art. 50 transparency for transcription + summary + translation.
    MiFID II Art. 16(7) recorded-communications retention applies to
    financial-services tenants.
