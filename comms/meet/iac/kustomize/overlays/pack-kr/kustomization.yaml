# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: meet
resources: [../../base]
commonAnnotations:
  oyatie/pack: "kr"
  oyatie/region: "ap-northeast-2"
  oyatie/legal-citations: |
    KR PIPA Arts. 15/22-2/23/28/29 + 통신비밀보호법 Art. 3 recording consent +
    전자상거래법. Recording requires explicit participant consent per Art. 15.
