# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: meet-burn-rate-rules
  namespace: meet
  labels:
    app.kubernetes.io/name: meet
    prometheus: mimir
spec:
  groups:
    - name: meet-recording-rules
      interval: 60s
      rules:
        - record: meet:participant_join:availability_5m
          expr: |
            sum(rate(oya_meet_participant_join_total{result="success"}[5m]))
            /
            sum(rate(oya_meet_participant_join_total[5m]))
        - record: meet:media_g2g_latency:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(oya_meet_media_glass_to_glass_seconds_bucket[5m]))
            )

    - name: meet-burn-rate-alerts
      rules:
        - alert: MeetParticipantJoinFastBurn1h
          expr: |
            (1 - meet:participant_join:availability_5m) > 14.4 * (1 - 0.999)
          for: 5m
          labels:
            severity: critical
            burn_window: 1h
            sli: availability
            microservice: meet
          annotations:
            summary: "meet participant-join fast-burn (14.4x) for 5m"
            runbook_url: "https://oyatie.com/microservices/meet/runbooks/sfu-degraded"

        - alert: MeetMediaG2GLatencyP99High
          expr: |
            meet:media_g2g_latency:p99_5m > 0.25
          for: 10m
          labels:
            severity: warning
            sli: latency
            microservice: meet
            bc: media

        - alert: MeetLiveStreamEgressUnauthorized
          expr: |
            increase(oya_meet_live_stream_egress_unauthorized_total[1h]) > 0
          for: 1m
          labels:
            severity: critical
            policy: tenant-opt-in
            microservice: meet
          annotations:
            summary: "meet live-stream-egress to unauthorized RTMP endpoint detected"
