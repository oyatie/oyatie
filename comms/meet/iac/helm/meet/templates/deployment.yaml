# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-J Slice 2 per ADR-0064)
{{- range tuple "meetingRoomRest" "signalingGateway" "transcriptionWorker" "recordingMuxWorker" "webinarFanoutWorker" "liveStreamEgressWorker" }}
{{- $c := index $.Values . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meet-{{ . | kebabcase }}
  namespace: meet
  labels:
    app.kubernetes.io/name: meet
    app.kubernetes.io/component: {{ . | kebabcase }}
    app.kubernetes.io/part-of: oya-meet
    oyatie/microservice: meet
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: meet
      app.kubernetes.io/component: {{ . | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meet
        app.kubernetes.io/component: {{ . | kebabcase }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      {{- /* Container sandboxing runtime ladder per ADR-0147; component declares
            workloadClass which dispatches to the right canonical helper. */}}
      {{- if eq ($c.workloadClass | default "") "ai-inference" }}
      {{- include "oya.runtimeClassName.aiInference" $ | nindent 6 }}
      {{- else if eq ($c.workloadClass | default "") "untrusted-content" }}
      {{- include "oya.runtimeClassName.untrustedContent" $ | nindent 6 }}
      {{- else if eq ($c.workloadClass | default "") "crypto" }}
      {{- include "oya.runtimeClassName.crypto" $ | nindent 6 }}
      {{- else if eq ($c.workloadClass | default "") "federation-gateway" }}
      {{- include "oya.runtimeClassName.federationGateway" $ | nindent 6 }}
      {{- end }}
      {{- if $c.nodeSelector }}
      nodeSelector: {{- toYaml $c.nodeSelector | nindent 8 }}
      {{- end }}
      serviceAccountName: meet-{{ . | kebabcase }}
      securityContext:
        {{- include "oya.securityContext.podStandard65534" $ | nindent 8 }}
      containers:
        - name: meet-{{ . | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--component={{ . | kebabcase }}", "--pack={{ $.Values.global.pack }}"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9091}
            - {name: ws, containerPort: 8443}
          resources:
            requests: {{- toYaml $c.resources.requests | nindent 14 }}
            limits: {{- toYaml $c.resources.limits | nindent 14 }}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            {{- include "oya.probes.httpHealthReadiness8080" $ | nindent 12 }}
          envFrom:
            - secretRef: {name: meet-openbao-injected}
          securityContext:
            {{- include "oya.securityContext.restrictedContainerInline" $ | nindent 12 }}
{{- end }}
