microservice:
  id: mail
  cargoPackage: oya-mail
  tenantClass: contributor

workloadLabels:
  tenantId: fd001-dogfood
  costCenter: fd001-backbone
  workloadClass: app
  regulatoryPack: generic
  dogfoodSubstrate: oyatie-cloud
  productGoal: fd-001

replicaCount: 2

topologySpread:
  # Enabled for FD-001 Oyatie Cloud dogfood static posture. Deployment models
  # with different node-label conventions must override this explicitly before
  # live rollout; this is not live scheduler placement evidence.
  enabled: true

podRuntime:
  runtimeClassName: runc

serviceAccount:
  name: oya-mail
  # FD-001 app workloads do not need Kubernetes API credentials by default.
  # Keep token projection off unless a future live controller/RBAC slice proves need.
  automountToken: false
  nonClaim: static-serviceaccount-template-only-no-live-cluster-rbac-tokenreview-or-bound-token-issuance

networkPolicy:
  # Static app network boundary for FD-001 Oyatie Cloud dogfood posture.
  # Live CNI enforcement, namespace labels, and traffic-flow proof remain separate rollout evidence.
  enabled: true
  nonClaim: static-networkpolicy-template-only-no-live-cni-admission-traffic-flow-or-network-isolation-proof
  ingress:
    gatewayNamespaceName: oya-gateway
  egress:
    dnsNamespaceName: kube-system
    otelNamespaceName: observability
    otelPort: 4317

image:
  registry: registry.oyatie.dev
  repository: oya-mail
  tag: "0.1.0"
  # Release automation must inject a real signed image digest. Keep the
  # pre-release default empty so local checks do not carry fake digests.
  digest: ""
  pullPolicy: IfNotPresent
  cosign:
    required: true
    policy: ADR-0181

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

gateway:
  # Disabled by default so chart installation does not accidentally expose a
  # service before a pack-owned Gateway listener, DNS record, ECH config, and
  # PQC/classical certificate are provisioned and audited.
  enabled: false
  routeNameSuffix: http
  parentRef:
    name: oyatie-public-edge
    namespace: oya-gateway
    sectionName: https
  hostnames:
    - mail-kr.oyatie.com
  pathPrefix: /v1
  tlsTermination: parent-gateway-tls13-ech-pqc
  openapiContract: comms/mail/contracts/openapi/mail.yaml
  echConfigRef: comms/mail/iac/ech-config.yaml
  pqcCertificateRef: comms/mail/iac/pqc-cert.yaml
  nonClaim: static-httproute-template-only-no-live-gateway-dns-tls-or-cloud-rollout

config:
  environment: production
  auditChainEnabled: true
  imagePromotionPolicy: cosign-required

cedar:
  enabled: true
  policyConfigMapName: oya-mail-cedar

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
