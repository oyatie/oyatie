# OpenBao policy bindings for mail µservice
# Authority: ADR-0296 + ADR-0273

apiVersion: openbao.io/v1
kind: PolicyBinding
metadata:
  name: mail-openbao-policy
spec:
  policies:
    - name: mail-dkim-signing
      paths:
        - "secret/data/+/mail/dkim-signing-key":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.mail.dkim-key-mint
    - name: mail-mailbox-encryption-key
      paths:
        - "secret/data/+/mail/mailbox-encryption-key":
            capabilities: [read]
            ttl_seconds: 60
    - name: mail-s3-kms-reference
      paths:
        - "secret/data/+/mail/s3-kms-reference":
            capabilities: [read]
            ttl_seconds: 60
    - name: mail-intelligence-byok
      paths:
        - "secret/data/+/byok/intelligence-provider":
            capabilities: [read]
            ttl_seconds: 60
            audit_class: oya.mail.tenant-byok-mint
    - name: mail-url-reputation-api-key
      paths:
        - "secret/data/+/mail/url-reputation-api-key":
            capabilities: [read]
            ttl_seconds: 60
  sidecar:
    enabled: true
    image: openbao-sidecar:1.18
    ttl_seconds: 60
    refresh_advance_seconds: 10
    audit_emit_class: oya.mail.credential-mint
