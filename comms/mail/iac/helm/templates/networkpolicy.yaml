apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      oyatie/bc: {{ .Values.bc }}
      oyatie/layer: {{ .Values.layer }}
  policyTypes: [Ingress, Egress]
  ingress:
{{- if eq .Values.bc "inbound-smtp" }}
    # Public SMTP receive (RFC 5321 :25 + :465 STARTTLS)
    - from: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 25, protocol: TCP}, {port: 465, protocol: TCP}]
{{- end }}
{{- if eq .Values.bc "outbound-smtp" }}
    # SMTP submission (:587) from authenticated tenant clients
    - from: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 587, protocol: TCP}]
{{- end }}
{{- if eq .Values.bc "imap-frontend" }}
    # IMAP/JMAP/REST/IMAPS (:143 + :993 + :443)
    - from: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 143, protocol: TCP}, {port: 993, protocol: TCP}, {port: 443, protocol: TCP}, {port: 4190, protocol: TCP}]
{{- end }}
    # Mesh-internal (sidecar)
    - from: [{namespaceSelector: {matchLabels: {linkerd.io/is-control-plane: "true"}}}]
  egress:
    # OpenBao secrets
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloud-secrets}}}]
      ports: [{port: 8200, protocol: TCP}]
    # Postgres
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{port: 5432, protocol: TCP}]
    # Tantivy
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: tantivy}}}]
      ports: [{port: 8080, protocol: TCP}]
    # Rspamd
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: rspamd}}}]
      ports: [{port: 11332, protocol: TCP}]
    # DNS (for MX lookup; DKIM DNS verify; SPF lookup)
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: TCP}, {port: 53, protocol: UDP}]
{{- if eq .Values.bc "outbound-smtp" }}
    # Recipient MX servers (anywhere)
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 25, protocol: TCP}, {port: 465, protocol: TCP}, {port: 587, protocol: TCP}]
{{- end }}
    # S3 object storage
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 443, protocol: TCP}]
