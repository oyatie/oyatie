apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  namespace: {{ .Release.Namespace }}
  labels:
    oyatie/microservice: mail
    release: prometheus
spec:
  selector:
    matchLabels:
      oyatie/bc: {{ .Values.bc }}
      oyatie/layer: {{ .Values.layer }}
  endpoints:
    - port: metrics
      interval: {{ .Values.global.serviceMonitor.interval | default "30s" }}
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_oyatie_pack]
          targetLabel: pack
        - sourceLabels: [__meta_kubernetes_pod_label_oyatie_bc]
          targetLabel: bc
        - sourceLabels: [__meta_kubernetes_pod_label_oyatie_layer]
          targetLabel: layer
