apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "oya-mail.fullname" . }}-{{ .Values.bc }}-{{ .Values.layer }}
  minReplicas: {{ .Values.hpa.minReplicas | default 4 }}
  maxReplicas: {{ .Values.hpa.maxReplicas | default 50 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
{{- if eq .Values.bc "outbound-smtp" }}
    - type: Pods
      pods:
        metric: { name: oya_mail_outbound_queue_depth_seconds }
        target: { type: AverageValue, averageValue: "30" }
{{- end }}
{{- if eq .Values.bc "inbound-smtp" }}
    - type: Pods
      pods:
        metric: { name: oya_mail_inbound_smtp_session_concurrent }
        target: { type: AverageValue, averageValue: "200" }
{{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 10, periodSeconds: 60}]
