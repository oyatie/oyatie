# oya-mail top-level Helm values
# Per-pack overlays in microservices/mail/iac/kustomize/overlays/pack-<id>/
# Per ADR-0131 + ADR-0133.

global:
  microservice: mail
  pack: kr                                # overridden by Kustomize overlay
  imageRegistry: registry.oyatie.dev
  imageTag: "0.1.0"
  pullPolicy: IfNotPresent
  mesh:
    enabled: true
    sidecar: linkerd                       # or istio
  serviceMonitor:
    enabled: true
    interval: 30s
  podDisruptionBudget:
    minAvailable: "50%"
  networkPolicy:
    enabled: true

# Canonical-base resource tier (oya.resourceRequests dispatcher).
# Tier letter resolves to canonical CPU/memory grids in
# microservices/governance/iac/helm/_oya-helpers/templates/_helpers.tpl.
# Mail's per-BC/per-layer Deployment template consumes this value.
resourceTier: S

postfix:
  enabled: true
  replicas: 4                              # HPA scales 4..50
  ports: [25, 465, 587]
  tls: { enabled: true, minVersion: "TLSv1.3" }   # RFC 8314

dovecot:
  enabled: true
  replicas: 4
  ports: [143, 993]                        # IMAP + IMAPS
  managesieve: { enabled: true, port: 4190 }     # RFC 5804

stalwart:
  enabled: false                           # default off; toggle per tenant_class + workload profile
  replicas: 2
  ports: [25, 465, 587, 143, 993, 4190]   # unified backend

postgres:
  enabled: true
  primary:
    persistence: { enabled: true, size: 500Gi }
  replicas: { sync: 1, async: 2 }
  rls: { enabled: true }                  # MANDATORY per ADR-0117
  citus:
    enabled: false                         # auto-flips when single-Postgres > 80%

rspamd:
  enabled: true
  replicas: 4
  valkey: { enabled: true, replicas: 3 }

tantivy:
  enabled: true
  replicas: 2
  persistence: { enabled: true, size: 200Gi }
  perTenantPartition: true

openbao:
  endpoint: openbao.cloud-secrets.svc.cluster.local:8200
  paths:
    dkim: ${openbao:secret/mail/{tenant}/dkim/{selector}}
    tenant_dek: ${openbao:secret/mail/{tenant}/dek}
    s3_creds: ${openbao:secret/mail/{pack}/s3}
    smtp_tls_cert: ${openbao:secret/mail/{pack}/mta-tls}

s3:
  endpoint: ${OCI_OBJECTSTORAGE_ENDPOINT}
  bucket: ${OCI_MAIL_BUCKET}
  sseKms: { enabled: true, kmsKeyAlias: 'alias/oya-mail-{tenant}' }
  objectLock: { enabled: true }            # ON for HIPAA + KR-FSS overlays
  versioning: { enabled: true }

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 50
  cpuTargetPct: 70

prometheus:
  rules:
    - alert: mail-outbound-queue-backup
      expr: oya_mail_outbound_queue_depth_seconds > 60
      for: 5m
      labels: { severity: page, runbook: smtp-queue-backup.md }
    - alert: mail-dkim-key-overdue
      expr: oya_mail_dkim_key_age_days > 90
      for: 1h
      labels: { severity: page, runbook: dkim-key-rotation.md }
    - alert: mail-cross-context-leak
      expr: increase(oya_mail_cross_context_routing_leak_total[5m]) > 0
      for: 1m
      labels: { severity: page, runbook: incident-response.md }
    - alert: mail-personal-pillar-hold-attempt
      expr: increase(oya_mail_personal_pillar_hold_attempt_total[5m]) > 0
      for: 1m
      labels: { severity: page, runbook: incident-response.md }
