# External Secrets Operator + OpenBao bindings for mail
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mail-openbao
spec:
  provider:
    vault:
      server: https://openbao.oyatie-internal.example:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mail
          serviceAccountRef:
            name: mail-app
            namespace: mail
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-dkim-signing-key
  namespace: mail
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: mail-openbao
    kind: ClusterSecretStore
  target:
    name: mail-dkim-signing-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mail/dkim-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-mailbox-encryption-key
  namespace: mail
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: mail-openbao
    kind: ClusterSecretStore
  target:
    name: mail-mailbox-encryption-key
  dataFrom:
    - extract:
        key: mail/mailbox-encryption-key
