# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pack-kr overlay — KR PIPA + 전자문서법 + KR-FSS overlay
# Per IP-015 + policy/data-residency.md
namespace: mail

resources:
  - ../../base

patches:
  - target: {kind: ConfigMap, name: mail-retention-policy-config}
    patch: |-
      - op: replace
        path: /data/kr_fss_floor_days
        value: "1825"   # 5y per KR Commercial Code Art. 33
      - op: replace
        path: /data/audit_log_floor_days
        value: "365"    # 1y per KR PIPA Enforcement Decree Art. 30
  - target: {kind: Deployment, name: mail-mailbox-store-app}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_KMS_ENDPOINT, value: "kms.ap-seoul-1.oci.oraclecloud.com"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_PACK_RESIDENCY_LOCKED, value: "kr"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OYA_PIPA_ART23_ENFORCED, value: "true"}

commonLabels:
  oyatie/pack: kr
  compliance/kr-pipa: "true"
  compliance/kr-fss: conditional
