apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-mail-anti-phishing-kernel
  namespace: mail
spec:
  microservice: mail
  bounded_context: anti-phishing
  layer: kernel
  language: rust
  binding_adrs:
    - ADR-0297
    - ADR-0273
  classifier:
    type: ml_impersonation_detector
    output_range: "[0..100]"
    label: phishing_score
  emits_audit_classes:
    - oya.mail.anti-phishing-block
    - oya.mail.anti-phishing-quarantine
    - oya.mail.anti-phishing-release
  cedar_fragment: policy/anti-phishing.cedar
