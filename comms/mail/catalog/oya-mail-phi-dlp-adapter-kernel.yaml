apiVersion: catalog.oyatie/v2
kind: Component
metadata:
  name: oya-mail-phi-dlp-adapter-kernel
  namespace: mail
spec:
  microservice: mail
  bounded_context: phi-dlp
  layer: kernel
  language: rust
  binding_adrs:
    - ADR-0251
    - ADR-0255
  classifier:
    type: phi_detector
    similar_to:
      - microsoft_presidio
      - aws_comprehend_medical
  emits_audit_classes:
    - oya.mail.phi-detect
    - oya.mail.phi-redact
    - oya.mail.phi-block-outbound
  cedar_fragment: policy/phi-dlp.cedar
