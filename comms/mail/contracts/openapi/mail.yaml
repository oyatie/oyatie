openapi: 3.2.0
info:
  title: oya-mail — JMAP-compatible REST facade
  version: 1.0.0
  summary: Mailbox / message / thread / search / legal-hold / eDiscovery / DLP REST surface
  description: |
    REST facade for the mail µservice. Mirrors JMAP (RFC 8620/8621) semantics where possible to
    minimize impedance for JMAP-aware clients while exposing a JSON-over-HTTP surface friendlier
    to non-JMAP tooling. Tenant + dual-context (Personal/Professional) isolation enforced by the
    `ContextBoundaryGuard` port per `microservices/mail/policy/dual-context-isolation.md`.

    Authentication: OIDC bearer + `X-Tenant-Id` header. Personal-context principals MUST set
    `X-Mail-Context: Personal`; Professional-context principals MUST set `X-Mail-Context:
    Professional` and `X-Tenant-Id`. Cedar policies in `comms/mail/policy/*.cedar`
    are evaluated server-side; the API is a thin transport.

    Standards interop: SMTP (RFC 5321), SMTP-Submission (RFC 6409), IMAP4rev2 (RFC 9051), JMAP-Core
    (RFC 8620), JMAP-Mail (RFC 8621), MIME (RFC 2045-2049), DKIM (RFC 6376 + RFC 8463 Ed25519),
    SPF (RFC 7208), DMARC (RFC 7489), ARC (RFC 8617), S/MIME (RFC 8551), OpenPGP (RFC 9580 +
    RFC 4880), MTA-STS (RFC 8461), TLS-RPT (RFC 8460), SMTP TLS (RFC 3207, RFC 8314).
  contact:
    name: axis-mail
    email: axis-mail@oyatie.com
  license:
    name: Proprietary — oyatie
  x-oyatie-microservice: mail
  x-oyatie-related-adrs: [ADR-0056, ADR-0105, ADR-0135, ADR-0139, ADR-0131, ADR-0132, ADR-0133]

servers:
  - url: https://mail-{pack}.oyatie.com/v1
    description: Per-pack endpoint (kr | eu | us | us-healthcare | jp | sg | au | in | br | ae | ksa)
    variables:
      pack:
        default: kr
        enum: [kr, eu, us, us-healthcare, jp, sg, au, in, br, ae, ksa]

security:
  - bearerOIDC: []
  - hardwareToken: []   # required for HIPAA pack + KR-FSS tenants

paths:
  /mailboxes:
    get:
      operationId: listMailboxes
      summary: List mailboxes visible to the caller's context
      parameters:
        - $ref: '#/components/parameters/MailContextHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: query
          name: context_kind
          schema: {type: string, enum: [Personal, Professional]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailboxList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /mailboxes/{mailboxId}:
    parameters:
      - in: path
        name: mailboxId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/MailContextHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getMailbox
      summary: Read mailbox metadata + folder tree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mailbox'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /mailboxes/{mailboxId}/threads:
    parameters:
      - in: path
        name: mailboxId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/MailContextHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: listThreads
      summary: List threads in the mailbox (paginated by `next_cursor`)
      parameters:
        - in: query
          name: folder
          schema: {type: string, default: INBOX}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThreadList'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /mailboxes/{mailboxId}/messages/{messageId}:
    parameters:
      - in: path
        name: mailboxId
        required: true
        schema: {type: string, format: ulid}
      - in: path
        name: messageId
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/MailContextHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getMessage
      summary: Read a single message (headers + body + parts)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailMessage'}
            message/rfc822:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteMessage
      summary: Soft-delete a message (subject to retention + legal-hold)
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Conflict — message under legal hold
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /messages:
    post:
      operationId: sendMessage
      summary: Submit an outbound message (RFC 6409 SMTP-Submission peer)
      parameters:
        - $ref: '#/components/parameters/MailContextHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          message/rfc822:
            schema: {type: string, format: binary}
          application/json:
            schema: {$ref: '#/components/schemas/OutboundEnvelope'}
      responses:
        '202':
          description: Accepted (queued; DKIM-signed; will be delivered)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionReceipt'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Payload too large (max 25 MB)}
        '422':
          description: Unprocessable (DLP quarantine; spam-block; SPF/DMARC alignment fail at submit)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /search:
    post:
      operationId: searchMail
      summary: Encrypted-token search over the caller's accessible mailboxes
      parameters:
        - $ref: '#/components/parameters/MailContextHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResultPage'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /legal-holds:
    post:
      operationId: engageLegalHold
      summary: Engage a scoped legal hold (Professional-pillar only; four-eyes required)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LegalHoldEngageRequest'}
      responses:
        '201':
          description: Hold engaged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalHold'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Personal-pillar mailbox in scope (DCI-04 forbidden)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /legal-holds/{holdId}:
    parameters:
      - in: path
        name: holdId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    delete:
      operationId: releaseLegalHold
      summary: Release a hold (four-eyes required)
      responses:
        '204': {description: Released}
        '403': {$ref: '#/components/responses/Forbidden'}

  /ediscovery/exports:
    post:
      operationId: createEdiscoveryExport
      summary: Request a sealed eDiscovery export over a scope
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EdiscoveryExportRequest'}
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdiscoveryExportJob'}

  /ediscovery/exports/{exportId}:
    parameters:
      - in: path
        name: exportId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    get:
      operationId: getEdiscoveryExport
      summary: Read export job status + chain-of-custody seal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdiscoveryExportJob'}

  /dlp/quarantine:
    get:
      operationId: listDlpQuarantine
      summary: List held outbound messages awaiting reviewer release
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: query
          name: status
          schema: {type: string, enum: [held, released, redacted_and_released, discarded, disputed]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DlpQuarantineList'}

  /dlp/quarantine/{quarantineId}/release:
    parameters:
      - in: path
        name: quarantineId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    post:
      operationId: releaseDlpQuarantine
      summary: Release a quarantined outbound message (four-eyes for PHI/PCI)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DlpReleaseDecision'}
      responses:
        '202': {description: Release queued}
        '403': {$ref: '#/components/responses/Forbidden'}

  /tenants/{tenantId}/dkim/rotate:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: {type: string}
    post:
      operationId: rotateDkimKey
      summary: Rotate the tenant DKIM key (planned or emergency)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DkimRotateRequest'}
      responses:
        '202':
          description: Rotation initiated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DkimRotateReceipt'}

  /admin/mailboxes/{mailboxId}/restore:
    parameters:
      - in: path
        name: mailboxId
        required: true
        schema: {type: string, format: ulid}
      - $ref: '#/components/parameters/TenantIdHeader'
    post:
      operationId: restoreMailbox
      summary: Initiate PITR mailbox restore (admin scope; dual-context invariants preserved)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailboxRestoreRequest'}
      responses:
        '202':
          description: Restore queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailboxRestoreJob'}

  /health:
    get:
      summary: Liveness probe
      responses:
        '200': {description: healthy}
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200': {description: ready}
        '503': {description: not ready}
components:
  x-oyatie-sharding-automation-event-surface:
    microservice: mail
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    bearerOIDC:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth-{pack}.oyatie.com/oauth/authorize
          tokenUrl: https://auth-{pack}.oyatie.com/oauth/token
          scopes:
            mail.read: Read mailbox + message
            mail.send: Submit outbound
            mail.search: Encrypted-token search
            mail.legal_hold: Engage / release holds (Professional only)
            mail.ediscovery: Request eDiscovery export
            mail.admin: Admin scope (per-tenant)
    hardwareToken:
      type: apiKey
      in: header
      name: X-Hardware-Token-Assertion
      description: WebAuthn / FIDO2 assertion for high-assurance tenants (HIPAA, KR-FSS)

  parameters:
    MailContextHeader:
      in: header
      name: X-Mail-Context
      required: true
      schema: {type: string, enum: [Personal, Professional]}
    TenantIdHeader:
      in: header
      name: X-Tenant-Id
      required: false
      schema: {type: string}
      description: Required when X-Mail-Context=Professional; forbidden when Personal

  responses:
    Forbidden:
      description: Forbidden (Cedar deny or dual-context cross-boundary)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Rate-limited
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri}
        oyatie_audit_event_id: {type: string, description: ULID of audit-chain event if applicable}

    Mailbox:
      type: object
      required: [mailbox_id, context_kind, owner_ref, region]
      properties:
        mailbox_id: {type: string, format: ulid}
        tenant_id: {type: string, nullable: true, description: null when context_kind=Personal}
        context_kind: {type: string, enum: [Personal, Professional]}
        owner_ref: {type: string}
        aliases: {type: array, items: {type: string, format: email}}
        quota_policy: {type: object}
        region: {type: string}
        retention_policy_id: {type: string, format: ulid}

    MailboxList:
      type: object
      properties:
        mailboxes: {type: array, items: {$ref: '#/components/schemas/Mailbox'}}

    Thread:
      type: object
      properties:
        thread_id: {type: string, format: ulid}
        subject_token_ciphertext: {type: string, description: encrypted subject token; cannot index plaintext}
        message_count: {type: integer}
        last_received_at: {type: string, format: date-time}
        flags: {type: array, items: {type: string}}

    ThreadList:
      type: object
      properties:
        threads: {type: array, items: {$ref: '#/components/schemas/Thread'}}
        next_cursor: {type: string, nullable: true}

    MailMessage:
      type: object
      required: [message_id, mailbox_id, headers_ciphertext, body_ciphertext]
      properties:
        message_id: {type: string}
        mailbox_id: {type: string, format: ulid}
        tenant_id: {type: string, nullable: true}
        context_kind: {type: string, enum: [Personal, Professional]}
        headers_ciphertext: {type: string, description: AES-GCM-256 over headers}
        body_ciphertext: {type: string, description: AES-GCM-256 over body}
        parts:
          type: array
          items:
            type: object
            properties:
              content_type: {type: string}
              size_bytes: {type: integer}
              blob_id: {type: string}
              cid: {type: string, nullable: true}
        flags: {type: array, items: {type: string}}
        retention_policy_id: {type: string, format: ulid}
        legal_hold_ids: {type: array, items: {type: string, format: ulid}}
        data_class: {type: string, enum: [PII_IDENTIFYING, PHI, BEHAVIORAL_TENANT_PRODUCT, AUDIT, SENSITIVE_PIPA_ART23]}
        received_at: {type: string, format: date-time}
        dkim:
          type: object
          properties:
            result: {type: string, enum: [pass, fail, none, neutral, policy, temperror, permerror]}
            selector: {type: string}
            domain: {type: string}
            algorithm: {type: string, enum: [ed25519-sha256, rsa-sha256]}
        spf: {type: object, properties: {result: {type: string, enum: [pass, fail, softfail, neutral, none, temperror, permerror]}}}
        dmarc: {type: object, properties: {result: {type: string, enum: [pass, fail, bestguesspass, none]}}}
        arc: {type: object, properties: {chain_validation: {type: string, enum: [pass, fail, none]}, chain_length: {type: integer}}}

    OutboundEnvelope:
      type: object
      required: [from, to, mime]
      properties:
        from: {type: string, format: email}
        to: {type: array, items: {type: string, format: email}}
        cc: {type: array, items: {type: string, format: email}}
        bcc: {type: array, items: {type: string, format: email}}
        subject: {type: string}
        mime: {type: string, format: byte, description: base64-encoded RFC 5322 / MIME body}
        sign_smime: {type: boolean, default: false}
        sign_openpgp: {type: boolean, default: false}
        handoff_workflow_id: {type: string, nullable: true, description: optional Workflow handoff binding}
        consent_basis_ref: {type: string, nullable: true, description: tenant policy basis for Workflow handoff per PRD FR-09}

    SubmissionReceipt:
      type: object
      properties:
        message_id: {type: string}
        queued_at: {type: string, format: date-time}
        dkim_selector_used: {type: string}
        dlp_decision: {type: string, enum: [pass, quarantined]}
        quarantine_id: {type: string, format: ulid, nullable: true}

    SearchRequest:
      type: object
      required: [encrypted_tokens]
      properties:
        encrypted_tokens: {type: array, items: {type: string}}
        scope: {type: string, enum: [mailbox, folder, thread]}
        scope_id: {type: string}
        date_range: {type: object, properties: {from: {type: string, format: date-time}, to: {type: string, format: date-time}}}
        limit: {type: integer, default: 50, maximum: 200}
        cursor: {type: string}

    SearchResultPage:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              message_id: {type: string}
              mailbox_id: {type: string}
              score: {type: number}
              token_match_count: {type: integer}
        next_cursor: {type: string, nullable: true}

    LegalHoldEngageRequest:
      type: object
      required: [scope, approver_a, approver_b]
      properties:
        scope:
          type: object
          properties:
            mailbox_ids: {type: array, items: {type: string, format: ulid}}
            date_range: {type: object, properties: {from: {type: string, format: date-time}, to: {type: string, format: date-time}}}
            query: {type: string, description: encrypted-token-query for scope refinement}
        approver_a: {$ref: '#/components/schemas/HoldApproval'}
        approver_b: {$ref: '#/components/schemas/HoldApproval'}
        reason: {type: string}

    HoldApproval:
      type: object
      required: [oidc_subject, signed_at, ed25519_signature]
      properties:
        oidc_subject: {type: string}
        signed_at: {type: string, format: date-time}
        ed25519_signature: {type: string}

    LegalHold:
      type: object
      properties:
        hold_id: {type: string, format: ulid}
        tenant_id: {type: string}
        scope: {type: object}
        engaged_at: {type: string, format: date-time}
        released_at: {type: string, format: date-time, nullable: true}
        approvers: {type: array, items: {$ref: '#/components/schemas/HoldApproval'}}
        chain_of_custody_seal: {type: string, description: Ed25519 audit-chain seal}

    EdiscoveryExportRequest:
      type: object
      required: [hold_id, requested_by]
      properties:
        hold_id: {type: string, format: ulid}
        requested_by: {type: string}
        retention_expires_at: {type: string, format: date-time}
        plaintext_disclosure_approver: {$ref: '#/components/schemas/HoldApproval', nullable: true}

    EdiscoveryExportJob:
      type: object
      properties:
        export_id: {type: string, format: ulid}
        hold_id: {type: string, format: ulid}
        status: {type: string, enum: [queued, running, sealed, expired, failed]}
        artifact_digest: {type: string, description: SHA-256 over the sealed bundle}
        chain_of_custody_seal: {type: string, description: Ed25519 over (export_id || artifact_digest || approver chain)}
        expires_at: {type: string, format: date-time}
        download_url: {type: string, format: uri, nullable: true, description: presigned URL, valid 24h}

    DlpQuarantineList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              quarantine_id: {type: string, format: ulid}
              held_at: {type: string, format: date-time}
              status: {type: string}
              match_rule_ids: {type: array, items: {type: string}}
              data_class_inferred: {type: string}

    DlpReleaseDecision:
      type: object
      required: [decision, reviewer]
      properties:
        decision: {type: string, enum: [release, redact_and_release, discard, escalate]}
        reviewer: {$ref: '#/components/schemas/HoldApproval'}
        second_reviewer: {$ref: '#/components/schemas/HoldApproval', nullable: true, description: required for PHI/PCI scope}
        redaction_spans:
          type: array
          items:
            type: object
            properties:
              start: {type: integer}
              end: {type: integer}

    DkimRotateRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, enum: [planned, emergency_compromise, offboarding, audit_finding]}
        new_selector: {type: string, description: optional; engine generates if omitted}
        algorithms: {type: array, items: {type: string, enum: [ed25519, rsa2048]}, default: [ed25519, rsa2048]}

    DkimRotateReceipt:
      type: object
      properties:
        rotation_id: {type: string, format: ulid}
        new_selector: {type: string}
        dns_propagation_check_eta_seconds: {type: integer}
        overlap_window_days: {type: integer, default: 14}

    MailboxRestoreRequest:
      type: object
      required: [restore_to_timestamp, requested_by]
      properties:
        restore_to_timestamp: {type: string, format: date-time}
        requested_by: {type: string}
        approver_a: {$ref: '#/components/schemas/HoldApproval'}
        approver_b: {$ref: '#/components/schemas/HoldApproval', nullable: true, description: required when restore crosses an active legal-hold window}
        reason: {type: string}

    MailboxRestoreJob:
      type: object
      properties:
        job_id: {type: string, format: ulid}
        mailbox_id: {type: string, format: ulid}
        status: {type: string, enum: [queued, running, complete, failed]}
        restored_to: {type: string, format: date-time}
        eta_seconds: {type: integer}
