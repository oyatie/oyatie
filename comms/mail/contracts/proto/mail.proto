// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

// oya-mail — gRPC contract
// Internal sibling-service gRPC contract; public clients use contracts/openapi/mail.yaml.
// Per ADR-0131 + ADR-0132 + ADR-0133.

syntax = "proto3";

package oya.mail.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// =========================================================================
// Service: Mail
// =========================================================================
//
// Authn: SPIFFE mTLS/TLS 1.3 authenticates the calling workload; forwarded user claims are
// application authorization context and do not make this a public RPC surface.
// Authz: Cedar policy evaluation server-side; same fragments as REST.
// Tenancy: per-request metadata "x-tenant-id" + "x-mail-context".
// Pack residency: server enforces; cross-pack calls refused.

service Mail {
  // ----- Mailbox / message read paths -----
  rpc ListMailboxes(ListMailboxesRequest) returns (ListMailboxesResponse);
  rpc GetMailbox(GetMailboxRequest) returns (Mailbox);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetMessage(GetMessageRequest) returns (MailMessage);
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);

  // ----- Outbound submission -----
  rpc SendMessage(SendMessageRequest) returns (SubmissionReceipt);

  // ----- Search -----
  rpc SearchMail(SearchMailRequest) returns (SearchResultPage);
  rpc StreamSearchMail(SearchMailRequest) returns (stream SearchResult);

  // ----- Legal hold -----
  rpc EngageLegalHold(EngageLegalHoldRequest) returns (LegalHold);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (google.protobuf.Empty);
  rpc ListLegalHolds(ListLegalHoldsRequest) returns (ListLegalHoldsResponse);

  // ----- eDiscovery -----
  rpc CreateEdiscoveryExport(CreateEdiscoveryExportRequest) returns (EdiscoveryExportJob);
  rpc GetEdiscoveryExport(GetEdiscoveryExportRequest) returns (EdiscoveryExportJob);

  // ----- DLP -----
  rpc ListDlpQuarantine(ListDlpQuarantineRequest) returns (ListDlpQuarantineResponse);
  rpc ReleaseDlpQuarantine(ReleaseDlpQuarantineRequest) returns (google.protobuf.Empty);

  // ----- Admin -----
  rpc RotateDkim(RotateDkimRequest) returns (DkimRotateReceipt);
  rpc RestoreMailbox(RestoreMailboxRequest) returns (MailboxRestoreJob);

  // ----- Streaming subscriptions (events) -----
  rpc StreamMessageReceived(StreamRequest) returns (stream MessageReceivedEvent);
  rpc StreamReputationChanged(StreamRequest) returns (stream ReputationChangedEvent);
}

// =========================================================================
// Common types
// =========================================================================

enum ContextKind {
  CONTEXT_KIND_UNSPECIFIED = 0;
  CONTEXT_KIND_PERSONAL = 1;
  CONTEXT_KIND_PROFESSIONAL = 2;
}

enum DataClass {
  DATA_CLASS_UNSPECIFIED = 0;
  DATA_CLASS_PII_IDENTIFYING = 1;
  DATA_CLASS_PHI = 2;
  DATA_CLASS_BEHAVIORAL_TENANT_PRODUCT = 3;
  DATA_CLASS_AUDIT = 4;
  DATA_CLASS_SENSITIVE_PIPA_ART23 = 5;
  DATA_CLASS_SECRET = 6;
}

enum DkimResult {
  DKIM_RESULT_UNSPECIFIED = 0;
  DKIM_RESULT_PASS = 1;
  DKIM_RESULT_FAIL = 2;
  DKIM_RESULT_NONE = 3;
  DKIM_RESULT_NEUTRAL = 4;
  DKIM_RESULT_POLICY = 5;
  DKIM_RESULT_TEMPERROR = 6;
  DKIM_RESULT_PERMERROR = 7;
}

enum SpfResult {
  SPF_RESULT_UNSPECIFIED = 0;
  SPF_RESULT_PASS = 1;
  SPF_RESULT_FAIL = 2;
  SPF_RESULT_SOFTFAIL = 3;
  SPF_RESULT_NEUTRAL = 4;
  SPF_RESULT_NONE = 5;
  SPF_RESULT_TEMPERROR = 6;
  SPF_RESULT_PERMERROR = 7;
}

enum DmarcResult {
  DMARC_RESULT_UNSPECIFIED = 0;
  DMARC_RESULT_PASS = 1;
  DMARC_RESULT_FAIL = 2;
  DMARC_RESULT_BESTGUESSPASS = 3;
  DMARC_RESULT_NONE = 4;
}

enum AbuseVerdict {
  ABUSE_VERDICT_UNSPECIFIED = 0;
  ABUSE_VERDICT_CLEAN = 1;
  ABUSE_VERDICT_SPAM = 2;
  ABUSE_VERDICT_PHISH = 3;
  ABUSE_VERDICT_MALWARE = 4;
  ABUSE_VERDICT_DLP = 5;
}

enum BounceClass {
  BOUNCE_CLASS_UNSPECIFIED = 0;
  BOUNCE_CLASS_HARD = 1;
  BOUNCE_CLASS_SOFT = 2;
  BOUNCE_CLASS_TRANSIENT = 3;
  BOUNCE_CLASS_MAILBOX_FULL = 4;
  BOUNCE_CLASS_REJECTED_POLICY = 5;
  BOUNCE_CLASS_UNKNOWN = 6;
}

message Mailbox {
  string mailbox_id = 1;
  string tenant_id = 2;   // empty when Personal
  ContextKind context_kind = 3;
  string owner_ref = 4;
  repeated string aliases = 5;
  string region = 6;
  string retention_policy_id = 7;
}

message Thread {
  string thread_id = 1;
  bytes subject_token_ciphertext = 2;
  uint32 message_count = 3;
  google.protobuf.Timestamp last_received_at = 4;
  repeated string flags = 5;
}

message MimePart {
  string content_type = 1;
  uint64 size_bytes = 2;
  string blob_id = 3;
  string cid = 4;
}

message Dkim {
  DkimResult result = 1;
  string selector = 2;
  string domain = 3;
  string algorithm = 4;   // ed25519-sha256 | rsa-sha256
}

message Spf { SpfResult result = 1; }
message Dmarc { DmarcResult result = 1; }
message Arc {
  string chain_validation = 1;  // pass | fail | none
  uint32 chain_length = 2;
}

message MailMessage {
  string message_id = 1;
  string mailbox_id = 2;
  string tenant_id = 3;
  ContextKind context_kind = 4;
  bytes headers_ciphertext = 5;
  bytes body_ciphertext = 6;
  repeated MimePart parts = 7;
  repeated string flags = 8;
  string retention_policy_id = 9;
  repeated string legal_hold_ids = 10;
  DataClass data_class = 11;
  google.protobuf.Timestamp received_at = 12;
  Dkim dkim = 13;
  Spf spf = 14;
  Dmarc dmarc = 15;
  Arc arc = 16;
}

// =========================================================================
// Requests / responses
// =========================================================================

message ListMailboxesRequest {
  ContextKind context_kind = 1;
}
message ListMailboxesResponse {
  repeated Mailbox mailboxes = 1;
}

message GetMailboxRequest { string mailbox_id = 1; }

message ListThreadsRequest {
  string mailbox_id = 1;
  string folder = 2;       // default INBOX
  string cursor = 3;
  uint32 limit = 4;        // 1..200
}
message ListThreadsResponse {
  repeated Thread threads = 1;
  string next_cursor = 2;
}

message GetMessageRequest {
  string mailbox_id = 1;
  string message_id = 2;
}

message DeleteMessageRequest {
  string mailbox_id = 1;
  string message_id = 2;
}

message OutboundEnvelope {
  string from = 1;
  repeated string to = 2;
  repeated string cc = 3;
  repeated string bcc = 4;
  string subject = 5;
  bytes mime = 6;          // RFC 5322 / MIME body
  bool sign_smime = 7;
  bool sign_openpgp = 8;
  string handoff_workflow_id = 9;
  string consent_basis_ref = 10;
}

message SendMessageRequest {
  OutboundEnvelope envelope = 1;
}

message SubmissionReceipt {
  string message_id = 1;
  google.protobuf.Timestamp queued_at = 2;
  string dkim_selector_used = 3;
  bool dlp_quarantined = 4;
  string quarantine_id = 5;
}

message DateRange {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message SearchMailRequest {
  repeated string encrypted_tokens = 1;
  string scope = 2;          // mailbox | folder | thread
  string scope_id = 3;
  DateRange date_range = 4;
  uint32 limit = 5;
  string cursor = 6;
}

message SearchResult {
  string message_id = 1;
  string mailbox_id = 2;
  double score = 3;
  uint32 token_match_count = 4;
}

message SearchResultPage {
  repeated SearchResult results = 1;
  string next_cursor = 2;
}

message HoldApproval {
  string oidc_subject = 1;
  google.protobuf.Timestamp signed_at = 2;
  bytes ed25519_signature = 3;
}

message HoldScope {
  repeated string mailbox_ids = 1;
  DateRange date_range = 2;
  string query = 3;
}

message EngageLegalHoldRequest {
  HoldScope scope = 1;
  HoldApproval approver_a = 2;
  HoldApproval approver_b = 3;
  string reason = 4;
}

message LegalHold {
  string hold_id = 1;
  string tenant_id = 2;
  HoldScope scope = 3;
  google.protobuf.Timestamp engaged_at = 4;
  google.protobuf.Timestamp released_at = 5;
  repeated HoldApproval approvers = 6;
  bytes chain_of_custody_seal = 7;
}

message ReleaseLegalHoldRequest {
  string hold_id = 1;
  HoldApproval releaser_a = 2;
  HoldApproval releaser_b = 3;
}

message ListLegalHoldsRequest {
  string tenant_id = 1;
}
message ListLegalHoldsResponse {
  repeated LegalHold holds = 1;
}

message CreateEdiscoveryExportRequest {
  string hold_id = 1;
  string requested_by = 2;
  google.protobuf.Timestamp retention_expires_at = 3;
  HoldApproval plaintext_disclosure_approver = 4;
}

message EdiscoveryExportJob {
  string export_id = 1;
  string hold_id = 2;
  string status = 3;     // queued | running | sealed | expired | failed
  bytes artifact_digest = 4;
  bytes chain_of_custody_seal = 5;
  google.protobuf.Timestamp expires_at = 6;
  string download_url = 7;
}

message GetEdiscoveryExportRequest { string export_id = 1; }

message ListDlpQuarantineRequest {
  string status = 1;
}
message DlpQuarantineEntry {
  string quarantine_id = 1;
  google.protobuf.Timestamp held_at = 2;
  string status = 3;
  repeated string match_rule_ids = 4;
  DataClass data_class_inferred = 5;
}
message ListDlpQuarantineResponse {
  repeated DlpQuarantineEntry items = 1;
}

message DlpRedactionSpan {
  uint32 start = 1;
  uint32 end = 2;
}
message ReleaseDlpQuarantineRequest {
  string quarantine_id = 1;
  string decision = 2;    // release | redact_and_release | discard | escalate
  HoldApproval reviewer = 3;
  HoldApproval second_reviewer = 4;
  repeated DlpRedactionSpan redaction_spans = 5;
}

message RotateDkimRequest {
  string tenant_id = 1;
  string reason = 2;       // planned | emergency_compromise | offboarding | audit_finding
  string new_selector = 3;
  repeated string algorithms = 4;
}
message DkimRotateReceipt {
  string rotation_id = 1;
  string new_selector = 2;
  uint32 dns_propagation_check_eta_seconds = 3;
  uint32 overlap_window_days = 4;
}

message RestoreMailboxRequest {
  string mailbox_id = 1;
  google.protobuf.Timestamp restore_to_timestamp = 2;
  string requested_by = 3;
  HoldApproval approver_a = 4;
  HoldApproval approver_b = 5;
  string reason = 6;
}

message MailboxRestoreJob {
  string job_id = 1;
  string mailbox_id = 2;
  string status = 3;
  google.protobuf.Timestamp restored_to = 4;
  uint32 eta_seconds = 5;
}

message StreamRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp since = 2;
}

message MessageReceivedEvent {
  string event_id = 1;
  string message_id = 2;
  string mailbox_id = 3;
  ContextKind context_kind = 4;
  DkimResult dkim_result = 5;
  SpfResult spf_result = 6;
  DmarcResult dmarc_result = 7;
  AbuseVerdict abuse_verdict = 8;
  google.protobuf.Timestamp emitted_at = 9;
  bytes signature = 10;
}

message ReputationChangedEvent {
  string event_id = 1;
  string ip_pool = 2;
  string dkim_domain = 3;
  double score = 4;
  double previous_score = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  bytes signature = 7;
}
