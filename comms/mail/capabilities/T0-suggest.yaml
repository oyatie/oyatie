# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T0-suggest capabilities — mail µservice
#
# Autonomy Tier 0: "suggest only; human accepts/rejects". Mail surfaces here are
# safe-by-construction because their effect is a UI suggestion the user can
# accept or ignore. No autonomous action; no data flow change.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133 §"autonomy tiering".
# Per ADR-0140 (retired per ADR-0145) Cedar policy enforcement.
# Per EU AI Act Art. 50 transparency (AI-generated suggestions labelled to user).

doc_class: AutonomyTierCatalog
microservice: mail
tier: T0
owner_team: axis-mail + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T0-mail-draft-suggestion
    name: "Smart-compose draft suggestion"
    description: |
      The user is composing a mail; the assistant suggests a next phrase, a
      sentence completion, or a closing line. Suggestion is rendered as ghost
      text; user accepts (Tab) or ignores. No data is sent without user clicking
      Send. No suggestion is auto-applied.
    surface: compose-ui (REST POST /v1/assist/draft-suggest)
    triggers:
      - user is typing in compose body
      - user explicitly requests "complete this paragraph"
    consent_basis:
      personal_context: implicit-on-use (user typing in their own compose UI)
      professional_context: tenant-policy-basis (admin opted tenant in; per-user opt-out available)
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (suggestion text)
    model:
      primary: tenant-default-llm (foundry-runtime managed)
      fallback: rule-based template
      private_inference: tenant-DEK-wrapped prompt; no cross-tenant training
    latency_budget_p99_ms: 250
    audit_event: MailDraftSuggestionShown (per-suggestion; minimal payload — prompt hash + suggestion hash; never plaintext)
    fallback_on_model_failure: silent skip
    risk_classification: minimal-risk (Annex III §3 NOT triggered — not employment/HR decision-making)
    user_label: "AI suggestion — Tab to accept" (Art. 50 transparency)

  - id: T0-mail-subject-suggest
    name: "Subject-line suggestion"
    description: |
      Before send, suggest a subject line based on the body. Suggestion shown;
      user can accept, ignore, or write their own.
    surface: compose-ui
    triggers: ["user has body but no subject", "explicit assist click"]
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY
    latency_budget_p99_ms: 200
    audit_event: MailSubjectSuggestionShown
    risk_classification: minimal-risk
    user_label: "AI subject suggestion"

  - id: T0-mail-thread-summary
    name: "Thread summary suggestion"
    description: |
      A long thread is rendered with an "AI summary" overlay button. Clicking
      generates a 3-bullet summary inline; never auto-applied; never sent over
      the wire. Stored in encrypted-token cache for 24h to amortise re-render
      cost.
    surface: reader-ui (REST POST /v1/assist/thread-summary)
    triggers: ["user clicks summary"]
    consent_basis:
      personal_context: explicit-click
      professional_context: explicit-click + tenant-policy-basis
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (summary text shown only to viewer)
    latency_budget_p99_ms: 1500
    audit_event: MailThreadSummaryGenerated
    risk_classification: minimal-risk
    user_label: "AI summary — generated on demand"
    pack_restrictions:
      pack-us-healthcare:
        - if thread contains PHI: PHI-aware model required (BAA-bound model); regular model REFUSED
        - cache TTL reduced to 4h
      pack-kr:
        - sensitive PII (Art. 23): summary generation refused unless user opted in to AI assistance at signup

  - id: T0-mail-search-query-suggest
    name: "Search query suggestion"
    description: |
      In the search bar, suggest queries based on recent activity + folder
      context. Suggestions never auto-execute; user must press Enter.
    surface: search-ui
    triggers: ["search bar focused", "user types ≥ 2 chars"]
    consent_basis:
      personal_context: implicit-on-use
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY
    latency_budget_p99_ms: 100
    audit_event: MailSearchSuggestionShown (sampled at 1%; rate-limited)
    risk_classification: minimal-risk
    user_label: subtle "AI" badge on suggestions

  - id: T0-mail-folder-organizer-suggest
    name: "Folder organizer suggestion"
    description: |
      Suggest folders to create + a starter rule set based on a user's recent
      mail patterns. Rendered as "Want to organize? Create these 3 folders?"
      with checkboxes; user must explicitly accept each suggestion before any
      folder/rule is created.
    surface: settings-ui
    triggers: ["user clicks 'organize my mailbox'"]
    consent_basis:
      personal_context: explicit-click
      professional_context: explicit-click + tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY
    latency_budget_p99_ms: 2000
    audit_event: MailFolderOrganizerSuggestionShown
    risk_classification: minimal-risk
    user_label: "AI suggested folders — review before applying"

constraints_all_capabilities:
  - principle: dual-context-aware
    rule: |
      All T0 surfaces enforce `principal.context == mailbox.context_kind` per
      `policy/dual-context-isolation.md` Invariant DCI-02 via the
      ContextBoundaryGuard port. Cross-context inference is forbidden.

  - principle: no-cross-tenant-training
    rule: |
      No tenant's mail content is used to train any model that serves another
      tenant. Per-tenant fine-tuning is opt-in via `MailAiTrainingConsent`
      Ontology object (Bominal ADR-0028 data-use-boundary).

  - principle: PII-redaction-before-emit
    rule: |
      Any data class > INTERNAL_ONLY is redacted from suggestion responses by
      the redactor in `oya-mail-mailbox-store-domain::redact_pii`. Lane
      `oya-governance-pii-redaction-conformance` enforces.

  - principle: transparency-label-mandatory
    rule: |
      Per EU AI Act Art. 50, every T0 surface MUST render a visible "AI" label.
      Lane `oya-governance-ai-act-transparency` greps UI templates.

verification:
  - cargo nextest -p oya-mail-mailbox-store-usecase --test capabilities::T0
  - oya gate validate autonomy-tier --microservice mail --tier T0
  - quarterly: review audit-event rate vs adoption — under-used capabilities sunset

references:
  - /specs/agentic-tiers.json v1.0
  - ADR-0133 §"autonomy tiering"
  - ADR-0140 Cedar policy enforcement
  - EU AI Act Regulation (EU) 2024/1689 Art. 50 + Art. 72 + Annex III
  - microservices/mail/policy/dual-context-isolation.md Invariant DCI-02
  - microservices/mail/dpia.md R-08 (AI assistance)
  - microservices/mail/threat-model.md T-D-03 (rule poisoning)
