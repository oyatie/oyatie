# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T2-auto capabilities — mail µservice
#
# Autonomy Tier 2: "autonomous; reversible without user knowledge for short
# windows". Mail surfaces here act on the user's behalf without per-action
# confirmation, but every action is audited + reversible within a defined
# window AND user can opt-out + see all actions taken.
#
# T2 is the highest tier in oyatie mail at M03. T3 ("autonomous; irreversible
# fast") is OUT OF SCOPE for mail; mail decisions are too consequential.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133.
# Per ADR-0140 (retired per ADR-0145) Cedar policy enforcement.
# Per EU AI Act Annex III where applicable.

doc_class: AutonomyTierCatalog
microservice: mail
tier: T2
owner_team: axis-mail + foundry-runtime + council-privacy + ops-security
date: 2026-05-17
review_cadence: per-capability-launch + monthly subsequent-to-launch + quarterly steady-state

capabilities:
  - id: T2-mail-auto-archive
    name: "Auto-archive aged threads"
    description: |
      Threads with no new activity for N days (default 90; user-configurable per
      folder) are automatically moved to Archive. Reversible: any auto-archived
      thread can be reopened with a single click; reactivated thread returns to
      Inbox view with "AI archived this — restore?" banner for 30 days. Does
      NOT auto-delete; Archive is retained per retention policy.
    surface: mailbox-store-worker (daily sweep)
    triggers: time-based (daily sweep); per-thread last-activity > threshold
    consent_basis:
      personal_context: explicit-opt-in at mailbox creation (default: OFF)
      professional_context: tenant-policy-basis (admin opt-in; per-user opt-out)
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT (per-thread archive event)
    audit_event: MailAutoArchiveExecuted (per-thread; rate-bounded to 1k/h/user)
    risk_classification: minimal-risk (not Annex III)
    reversibility_window_days: 30
    safety_net:
      - any thread containing a legal-hold scope is EXCLUDED
      - any thread tagged "important" by user is EXCLUDED
      - any thread in pack-us-healthcare PHI-class scope: PHI-aware classifier confirms safe-to-archive (retention preserved)
      - any thread with pending Workflow handoff: EXCLUDED until handoff resolves
    user_visibility:
      - daily digest "Auto-archived 23 threads — restore any in 30 days"
      - settings panel "View AI actions on my mailbox" with full audit trail
    rollback_runbook: runbooks/spam-rule-rollback.md (auto-archive uses same classifier infrastructure)

  - id: T2-mail-auto-reply-out-of-office
    name: "Out-of-office auto-reply"
    description: |
      User configures OOO message + window; mail auto-replies to inbound mail
      during that window. Generates the reply via the configured template +
      optional LLM personalization (if tenant opted in).
    surface: inbound-smtp adapter (per-mailbox OOO rule)
    triggers: inbound message during configured OOO window
    consent_basis:
      personal_context: user-self-configures
      professional_context: user-self-configures within tenant-policy bounds (admin can mandate OOO disclaimer)
    data_class_processed: [PII_IDENTIFYING]
    data_class_emitted: PII_IDENTIFYING (auto-reply contains user's name + return date)
    audit_event: MailOooAutoReplied (per-trigger; rate-limited per RFC 3834 §3.2 + §5)
    risk_classification: minimal-risk
    reversibility_window: not applicable (replied; recipient already received)
    safety_net:
      - RFC 3834 §5 loop detection (do not reply to bulk mail; do not reply to mailer-daemon)
      - per-recipient throttle: 1 OOO reply per 7 days
      - mailing list detection (List-Id / Precedence: bulk): NO reply
      - bounce-suppression: do not reply to bounces (per RFC 3834 §4)
    user_visibility:
      - "OOO active" indicator in compose UI
      - daily count of OOO replies sent

  - id: T2-mail-auto-categorize
    name: "Auto-categorize incoming mail (Primary / Promotions / Updates / Social / Forums)"
    description: |
      Inbound mail auto-routed to category folders (Gmail-style). Routing is
      decided by classifier; user can re-route + the system learns
      (per-mailbox; not cross-tenant).
    surface: inbound-smtp adapter + mailbox-store domain
    triggers: every inbound message
    consent_basis:
      personal_context: explicit-opt-in (default: OFF; can be enabled in settings)
      professional_context: tenant-policy-basis (some tenants disable; some mandate)
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT (per-message category assignment)
    audit_event: MailMessageCategorized
    risk_classification: limited-risk (categorisation affects user attention; transparency required)
    reversibility_window_days: indefinite (user can re-route at any time)
    safety_net:
      - personal-pillar: never crosses pillar; categorisation is per-mailbox
      - new-sender heuristic: first email from a new sender lands in Primary by default; conservative
      - tenant override: tenant can disable categories (regulated industries often do)
      - reversal learning: user re-route within 30 days re-trains the per-mailbox model

  - id: T2-mail-dlp-enforcement
    name: "DLP outbound auto-block (held for reviewer)"
    description: |
      Outbound mail with DLP-rule match is AUTO-HELD in quarantine. User
      receives notification "Your message to <recipient> is held; reviewer will
      decide within X hours". Reviewer flow per `runbooks/dlp-quarantine-release.md`.
    surface: outbound-smtp adapter
    triggers: every outbound submission
    consent_basis:
      personal_context: provider-class abuse handling (RFC 5321 §7.8); explicit at signup
      professional_context: tenant-policy-basis (DLP mandatory for org-pillar)
    data_class_processed: [PII_IDENTIFYING, PHI (HIPAA), PCI (PCI scope tenants), BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT (quarantine event with rule ids)
    audit_event: DlpQuarantined
    risk_classification:
      - default: limited-risk
      - high-risk: when DLP includes employment / educational classification → Annex III §3-4 → conformity assessment required
    reversibility_window: until reviewer decides (default SLA 2 h)
    safety_net:
      - sender notified within 60s
      - per-tenant SLA for reviewer decision (default 2h; configurable)
      - escalation to two-reviewer (four-eyes) for PHI / PCI per `policy/data-residency.md` pack overlay
      - false-positive surge runbook: `runbooks/dlp-quarantine-release.md` + `runbooks/spam-rule-rollback.md`

  - id: T2-mail-retention-expiry-sweep
    name: "Retention expiry sweep"
    description: |
      Nightly worker iterates mailboxes; identifies messages past retention
      horizon AND not under any legal-hold; soft-deletes (T+30d hard-delete).
      Audit-emit every batch. Hold-before-purge invariant per
      `policy/dual-context-isolation.md` Invariant DCI-04.
    surface: retention-policy-worker (cron 02:00 per pack)
    triggers: time-based; per-mailbox schedule
    consent_basis: tenant-policy-basis (mandatory; statutory floor)
    data_class_processed: [PII_IDENTIFYING, AUDIT]
    data_class_emitted: AUDIT (per-batch ledger entry)
    audit_event: RetentionExpired
    risk_classification: out-of-scope (not AI; deterministic policy enforcement)
    reversibility_window_days: 30 (soft-delete window; restorable via `runbooks/mailbox-restore-from-backup.md`)
    safety_net:
      - statutory_floor check refuses expiry below regulator minimum (KR-FSS 5y; HIPAA 6y; GDPR Art. 5(1)(e) minimum-necessary)
      - hold-before-purge invariant: any message with active legal_hold_ids → SKIPPED
      - per-batch dry-run preview to tenant admin (settings)
      - tenant override: tenant can pause retention engine for forensic windows
      - CI lane `retention-floor-conformance` refuses configs below floor

  - id: T2-mail-reputation-auto-throttle
    name: "Tenant reputation auto-throttle"
    description: |
      Tenant reputation score drops below threshold → submission rate auto-reduced;
      tenant notified; resumes after score recovers OR after operator
      intervention via `runbooks/smtp-queue-backup.md` Path B.
    surface: outbound-smtp adapter (rate-limiter at submit + per-recipient)
    triggers: reputation-score threshold cross
    consent_basis: provider-class abuse handling (RFC 5321 §7.8; tenant-policy-basis at onboarding)
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT
    audit_event: MailDeliverabilityReputationChanged + MailDeliverabilityAutoThrottled
    risk_classification: minimal-risk
    reversibility_window: continuous (auto-unthrottle on recovery)
    safety_net:
      - tenant admin notified within 5 min of throttle
      - hard floor: never drops below 10% of baseline submission rate (avoids deliverability cliff)
      - operator override per `runbooks/smtp-queue-backup.md`

constraints_all_capabilities:
  - principle: dual-context-strict
    rule: every T2 path enforces ContextBoundaryGuard
  - principle: legal-hold-immutable
    rule: T2 actions NEVER affect messages under active legal-hold (DCI-04 + retention floor)
  - principle: reversibility-window-mandatory
    rule: every T2 action has documented reversibility OR explicit "irreversible-but-bounded" classification with user notice
  - principle: per-action-audit
    rule: every T2 action audit-chained Ed25519 with reason + actor (system) + reversal-token (where applicable)
  - principle: opt-out-always-possible
    rule: user can disable T2 capabilities (except DLP outbound for Professional; statutory)
  - principle: rollback-rapid
    rule: rollback runbook per capability; classifier rule rollback ≤ 15 min
  - principle: AI-Act-conformity-when-applicable
    rule: Annex III triggers (employment / education / sensitive) → conformity assessment before deploy

eu_ai_act_compliance:
  - Annex III §3 + §4 conformity assessment triggers when T2-mail-dlp-enforcement or T2-mail-auto-categorize operates on employment / education mail
  - Art. 9 risk management documented per capability
  - Art. 10 data governance for training data
  - Art. 13 transparency surfaces ("AI did X")
  - Art. 14 human oversight: user reversal + reviewer release paths
  - Art. 15 accuracy + robustness: per-capability FP/FN budgets in cost-budget.md
  - Art. 72 post-market monitoring telemetry in audit-chain
  - Art. 50 transparency labels on every user-facing action

verification:
  - cargo nextest -p oya-mail-inbound-smtp-usecase --test capabilities::T2
  - cargo nextest -p oya-mail-outbound-smtp-usecase --test capabilities::T2::dlp_enforcement
  - cargo nextest -p oya-mail-retention-policy-domain --test capabilities::T2::retention_sweep
  - oya gate validate autonomy-tier --microservice mail --tier T2
  - oya gate validate ai-act-conformance --microservice mail
  - oya gate validate retention-floor-conformance --microservice mail
  - monthly subsequent-to-launch: reversibility audit; user-reversal rate; FP/FN telemetry
  - quarterly steady-state: capability adoption + sunset review

references:
