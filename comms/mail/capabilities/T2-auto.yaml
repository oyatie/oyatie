  - RFC 5321 §7.8 (Abuse Reporting Format)
  - EU AI Act Regulation (EU) 2024/1689 Arts. 9, 10, 13, 14, 15, 50, 72; Annex III; Annex IV
  - HIPAA §164.312, §164.316, §164.502(b)
  - KR PIPA Arts. 22-2, 23, 28, 29
  - PCI DSS v4.0 Req. 3 + 4
  - microservices/mail/policy/dual-context-isolation.md Invariants DCI-04, DCI-06
  - microservices/mail/dpia.md R-04, R-06, R-08
  - comms/mail/runbooks/dlp-quarantine-release.md
