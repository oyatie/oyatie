# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
# T1-assist capabilities — mail µservice
#
# Autonomy Tier 1: "assist with user confirmation; user reviews + commits". Mail
# surfaces here propose an action; user must affirmatively accept before it
# executes. Distinct from T0 in that T1 actions actually mutate state (send
# mail, apply rule, archive thread) on accept.
#
# Per `/specs/agentic-tiers.json` v1.0 + ADR-0133.
# Per ADR-0140 (retired per ADR-0145) Cedar policy enforcement.
# Per EU AI Act Art. 50 (transparency) + Annex III if applicable.

doc_class: AutonomyTierCatalog
microservice: mail
tier: T1
owner_team: axis-mail + foundry-runtime + council-privacy
date: 2026-05-17
review_cadence: per-capability-launch + quarterly

capabilities:
  - id: T1-mail-smart-compose
    name: "Smart-compose — full draft generation"
    description: |
      Beyond next-phrase suggestion (T0), this surface generates a FULL draft
      response or new message based on user-provided context (e.g., "reply to
      this thread acknowledging receipt + asking for invoice"). Generated draft
      lands in the compose pane; user reviews + edits + clicks Send.
    surface: compose-ui (REST POST /v1/assist/compose-draft)
    triggers: ["user clicks 'generate response'", "user gives natural-language brief"]
    consent_basis:
      personal_context: explicit-click
      professional_context: explicit-click + tenant-policy-basis (admin opt-in)
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (rendered to user only)
    model:
      primary: tenant-default-llm
      fallback: refuse with "manual compose required"
    latency_budget_p99_ms: 4000
    audit_event: MailComposeDraftGenerated
    risk_classification: limited-risk (Art. 50 transparency required)
    user_label: "AI-generated draft — review before sending"
    constraint_on_send:
      - draft is never sent without user clicking Send
      - send action emits `MessageSent` with `ai_assisted=true` flag in audit
      - tenant policy may require "AI-assisted send requires explicit toggle" — enforced via Cedar `permit ... when {principal has ai_assisted_send_confirmed}`

  - id: T1-mail-smart-classifier
    name: "Spam + phishing + DLP classifier (live decision)"
    description: |
      Inbound mail classifier (Rspamd + ML model fusion) decides spam | phish |
      malware | dlp | clean. Tier-1 because the decision is automatic, BUT the
      user remains the final arbiter: marked-spam goes to Spam folder where
      user can recover with one click ("Not Spam"); DLP outbound is held in
      quarantine awaiting reviewer release per `runbooks/dlp-quarantine-release.md`.
    surface: inbound-smtp adapter + outbound-smtp adapter (per-mailbox decision)
    triggers: every inbound message; every outbound submission
    consent_basis:
      personal_context: implicit-on-use (provider-class filtering, RFC 5321 §7.8 abuse handling)
      professional_context: tenant-policy-basis (mandatory for org-pillar mail)
    data_class_processed: [PII_IDENTIFYING, PHI (HIPAA pack), BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT (verdict + match rule ids; never plaintext)
    model:
      primary: Rspamd + tenant-fine-tuned classifier
      fallback: rule-based only
    latency_budget_p99_ms: 100
    audit_event: AbuseVerdictDecided
    risk_classification:
      - default: limited-risk
      - high-risk-trigger: when classifier is applied to employment-context mail (Annex III §3 + 4 employment recruitment) — conformity assessment required before deployment per pack-eu overlay
    user_label: spam folder + "Not Spam" reversal; outbound quarantine notification
    explainability:
      per-decision: top-3 contributing rules + scores in audit payload
      tenant-dashboard: aggregated stats; per-rule fire rate; FP/FN rates
    rollback_runbook: runbooks/spam-rule-rollback.md

  - id: T1-mail-translate
    name: "Translate inbound message"
    description: |
      Inbound message in a language not in user's preferred set; user clicks
      "Translate" → translation overlay rendered inline. Never replaces the
      original; never persisted (per-session cache only).
    surface: reader-ui
    triggers: ["user clicks 'translate'", "language detection differs from user preference"]
    consent_basis:
      personal_context: explicit-click
      professional_context: explicit-click + tenant-policy-basis
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (translation shown to viewer)
    latency_budget_p99_ms: 2000
    audit_event: MailTranslateRequested
    risk_classification: minimal-risk
    user_label: "Translated by AI; original preserved"
    pack_restrictions:
      pack-kr: KR-resident translation model; data stays in KR
      pack-eu: EU-resident model; cross-pack translation requires SCC
      pack-us-healthcare: PHI-bound model only; non-BAA model refused

  - id: T1-mail-handoff-to-workflow
    name: "Convert mail to Workflow task"
    description: |
      User reads a Professional-context mail + clicks "Create Workflow Task";
      assistant extracts payload (action, due date, parties, attachments); user
      reviews extracted form + edits + commits. Commit emits
      `MailWorkflowHandoffCreated` audit per PRD FR-09. Forbidden on
      Personal-context (Invariant DCI-06).
    surface: reader-ui (REST POST /v1/assist/workflow-handoff)
    triggers: ["user clicks 'Create Task'"]
    consent_basis:
      personal_context: REFUSED (DCI-06)
      professional_context: explicit-click + (user-explicit OR tenant-policy-basis per PRD FR-09)
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: AUDIT (handoff event + payload digest)
    latency_budget_p99_ms: 1500
    audit_event: MailWorkflowHandoffCreated
    risk_classification: limited-risk
    user_label: "AI-extracted task — review fields before creating"
    explainability: per-field provenance (which paragraph/sentence the extracted value came from)

  - id: T1-mail-attachment-action-card
    name: "Attachment action card (PDF / ICS / contract review)"
    description: |
      An attachment is opened by the user; assistant offers contextual actions:
      "Sign this PDF", "Add this ICS to calendar", "Summarize this contract".
      Each action requires user confirmation; no auto-action.
    surface: reader-ui
    triggers: ["user opens attachment + content-type matches a known handler"]
    consent_basis:
      personal_context: explicit-click
      professional_context: explicit-click + tenant-policy-basis
    data_class_processed: [PII_IDENTIFYING, BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: per-action
    latency_budget_p99_ms: 2000
    audit_event: MailAttachmentActionCardOffered + MailAttachmentActionAccepted (per accept)
    risk_classification: minimal-risk
    user_label: "AI suggestion based on attachment"

  - id: T1-mail-thread-prioritization
    name: "Thread prioritization scoring"
    description: |
      Compute a 0-100 importance score per thread; render alongside the thread
      list. Does NOT re-order automatically; rendering is sortable by user
      preference. User can disable per-mailbox.
    surface: list-ui
    triggers: continuous (on every new message; bulk-rescore daily)
    consent_basis:
      personal_context: implicit-on-use (per-user; opt-out at any time)
      professional_context: tenant-policy-basis
    data_class_processed: [BEHAVIORAL_TENANT_PRODUCT]
    data_class_emitted: INTERNAL_ONLY (score shown to viewer)
    latency_budget_p99_ms: 500
    audit_event: MailThreadPriorityScored (sampled)
    risk_classification: limited-risk
    user_label: '"AI-prioritized" badge on each scored thread'

constraints_all_capabilities:
  - principle: dual-context-strict
    rule: ContextBoundaryGuard enforced; Personal mail invisible to Professional context AI
  - principle: explicit-user-consent
    rule: every T1 action requires user click before mutation
  - principle: PII-aware-redaction
    rule: outputs redacted; never echoes SECRET-class
  - principle: explainability-required
    rule: per-decision contributing-features available on demand
  - principle: tenant-fine-tune-opt-in
    rule: per-tenant fine-tuning requires explicit MailAiTrainingConsent
  - principle: rollback-rapid
    rule: rule/model rollback ≤ 15 min via `runbooks/spam-rule-rollback.md`

eu_ai_act_compliance:
  - Art. 9 Risk Management (high-risk classifiers): conformity assessment + technical documentation per Annex IV
  - Art. 10 Data Governance: training data audited for bias + PII
  - Art. 13 Transparency: user-facing labels mandatory (Art. 50)
  - Art. 14 Human Oversight: user reversal (Not Spam) always available
  - Art. 15 Accuracy + robustness: per-tenant FP/FN budgets in cost-budget.md
  - Art. 72 Post-market monitoring: ongoing FP/FN telemetry sealed in audit-chain

verification:
  - cargo nextest -p oya-mail-mailbox-store-usecase --test capabilities::T1
  - cargo nextest -p oya-mail-inbound-smtp-usecase --test capabilities::T1::classifier
  - oya gate validate autonomy-tier --microservice mail --tier T1
  - oya gate validate ai-act-conformance --microservice mail (per pack-eu overlay)
  - quarterly: telemetry review per-capability

references:
  - /specs/agentic-tiers.json v1.0
  - ADR-0133 §"autonomy tiering"
  - ADR-0140 Cedar policy enforcement
  - EU AI Act Regulation (EU) 2024/1689 Arts. 9, 10, 13, 14, 15, 50, 72; Annex III; Annex IV
  - HIPAA §164.312 (access integrity) + §164.502(b) (minimum necessary)
  - KR PIPA Arts. 22-2, 23, 28
  - microservices/mail/policy/dual-context-isolation.md Invariant DCI-06
  - microservices/mail/dpia.md R-04 (DLP), R-08 (AI assistance)
  - microservices/mail/threat-model.md T-D-03, T-I-03
  - microservices/mail/runbooks/spam-rule-rollback.md
  - microservices/mail/runbooks/dlp-quarantine-release.md
