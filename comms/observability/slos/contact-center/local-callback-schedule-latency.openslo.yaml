apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-callback-schedule-latency
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: contact-center
  description: Callback scheduling latency for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  indicator:
    metadata:
      name: callback-schedule-latency
      labels:
        domain_object: OmnichannelInteraction
        operator_audience: CONTACT_CENTER_SUPERVISOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_callback_schedule_latency_good_total[5m])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_callback_schedule_latency_total[5m])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Callback scheduling latency
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
