apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-recording-consent-correctness
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: contact-center
  description: Recording actions with consent evidence for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  indicator:
    metadata:
      name: recording-consent-correctness
      labels:
        domain_object: OmnichannelInteraction
        operator_audience: CONTACT_CENTER_SUPERVISOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_recording_consent_correctness_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_recording_consent_correctness_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Recording actions with consent evidence
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
