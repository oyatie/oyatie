apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-audit-emission-lag
  labels:
    service: contact-center
    adr: ADR-0139
spec:
  service: contact-center
  indicator:
    metadata:
      name: audit-emission-lag
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_audit_emission_lag_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_audit_emission_lag_total[5m]))
  objectives:
    - displayName: Contact Center audit-emission-lag
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
