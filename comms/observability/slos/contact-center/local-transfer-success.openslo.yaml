apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-transfer-success
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
    promotion_gate: ADR-0139
spec:
  service: contact-center
  description: Warm and cold transfers completed with target agent acknowledgement for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations.
  indicator:
    metadata:
      name: transfer-success
      labels:
        domain_object: OmnichannelInteraction
        operator_audience: CONTACT_CENTER_SUPERVISOR
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_transfer_success_good_total[30d])) by (tenant_id, cell_tier)
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_transfer_success_total[30d])) by (tenant_id, cell_tier)
  objectives:
    - displayName: Warm and cold transfers completed with target agent acknowledgement
      target: 0.99
  timeWindow:
    - duration: 30d
      isRolling: true
