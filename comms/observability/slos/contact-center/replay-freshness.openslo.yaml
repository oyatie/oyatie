apiVersion: openslo/v1
kind: SLO
metadata:
  name: contact-center-replay-freshness
  labels:
    service: contact-center
    adr: ADR-0139
spec:
  service: contact-center
  indicator:
    metadata:
      name: replay-freshness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_replay_freshness_good_total[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: sum(rate(oya_contact_center_replay_freshness_total[5m]))
  objectives:
    - displayName: Contact Center replay-freshness
      target: 0.999
  timeWindow:
    - duration: 30d
      isRolling: true
