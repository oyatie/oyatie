# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-screen-share-start-latency
  displayName: "meet: screen-share start p95 ≤ 800ms"
  labels:
    microservice: meet
    bc: screen-share
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Time from presenter "share screen" click to first remote-rendered frame.
    Includes OS screen-capture init + LiveKit track-publish + simulcast layer
    negotiation.
  service: meet
  indicator:
    metadata:
      name: meet-screen-share-start
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_screen_share_start_seconds_bucket{le="0.8"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_screen_share_start_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "p95 screen-share start ≤ 800ms"
