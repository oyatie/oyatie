# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-availability
  displayName: "meet: room-create + participant-join availability 99.95% monthly"
  labels:
    microservice: meet
    bc: cross-cutting
    sli_class: availability
    owner_team: axis-meet
spec:
  description: |
    Composite availability SLO for the core meet user journey: tenant can
    create a meeting room AND a participant can join. "Good" requests are
    those returning 2xx (or 202 for lobby pending) for room-create and
    join endpoints.
  service: meet
  indicator:
    metadata:
      name: meet-availability
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_room_create_total{result="success"}[5m]))
                +
                sum(rate(oya_meet_participant_join_total{result="success"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_room_create_total[5m]))
                +
                sum(rate(oya_meet_participant_join_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9995
      displayName: "99.95% availability over 30d"
