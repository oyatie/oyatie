# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: meet-live-caption-latency
  displayName: "meet: live caption p99 ≤ 500ms"
  labels:
    microservice: meet
    bc: transcription
    sli_class: latency
    owner_team: axis-meet
spec:
  description: |
    Live caption end-to-end latency: audio chunk ingest → Whisper-medium
    streaming inference (faster-whisper on GPU) → caption frame delivered to
    subscriber via WebSocket. Reference: OpenAI Whisper paper + ADR-MEET-0002.
  service: meet
  indicator:
    metadata:
      name: meet-live-caption
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_live_caption_lag_seconds_bucket{le="0.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_meet_live_caption_lag_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.99
      displayName: "p99 live caption lag ≤ 500ms"
