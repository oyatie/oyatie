apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-jmap-mailbox-fetch-latency
  displayName: Mail JMAP mailbox fetch latency
  labels:
    microservice: mail
    binding_adr: ADR-0253
spec:
  service: mail
  description: |
    JMAP mailbox fetch (top 50 messages by date) returns within 200ms P99 on a
    1000-message mailbox. Burn-rate alerts trigger the JMAP-frontend incident path.
  objectives:
    - displayName: Mailbox fetch ≤200ms
      target: 0.99
      sliRef:
        ratioMetric:
          counter: true
          good:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_mail_jmap_mailbox_fetch_duration_seconds_bucket{le="0.2"}[5m]))'
          total:
            metricSource:
              type: prometheus
              spec: 'sum(rate(oya_mail_jmap_mailbox_fetch_total[5m]))'
  alertPolicy:
    burnRate:
      - threshold: 14
        lookback: 1h
        runbook: comms/mail/runbooks/smtp-queue-backup.md
      - threshold: 6
        lookback: 6h
