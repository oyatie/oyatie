# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: mail-inbound-receive-availability
  displayName: "mail: inbound SMTP receive availability"
  labels:
    microservice: mail
    bc: inbound-smtp
    sli_class: availability
    tier: hero-product
    owner_team: axis-mail
    pack_scope: all
spec:
  description: |
    Inbound SMTP availability SLO. A DATA command is "good" when the receiver
    accepts + persists within ≤ 1s p99 (PRD §"Performance"). Counted by
    accepted/total at the SMTP receiver. RFC 5321 §4.5.4 graceful 421 temp-fail
    is NOT counted as "bad" (RFC-compliant retry).
  service: mail
  indicator:
    metadata: {name: mail-inbound-receive-success-ratio}
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_mail_inbound_smtp_data_accepted_total{pack=~".+"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_mail_inbound_smtp_data_total{pack=~".+"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9995  # 99.95% per PRD
      displayName: "30d rolling availability ≥ 99.95%"
  alertPolicies:
    - alertPolicyRef: mail-inbound-fast-burn-1h-14x
    - alertPolicyRef: mail-inbound-slow-burn-6h-6x
    - alertPolicyRef: mail-inbound-ticket-burn-3d-1x
