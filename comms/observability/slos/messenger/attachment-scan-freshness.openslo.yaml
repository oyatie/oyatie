# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-attachment-scan-freshness
  displayName: "messenger: attachment malware-scan completion ≤ 60s p99"
  labels:
    microservice: messenger
    bc: file-attachment
    sli_class: freshness
    owner_team: axis-messenger + ops-security
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Freshness SLI: time from upload finalize → scan-result label
    (clean | infected | error). 99 % of attachments must reach a terminal
    scan state within 60 s. Scanning chain: OPSWAT MetaDefender (primary)
    → ClamAV (fallback) per `policy/attachment-malware-quarantine.md`.
  service: messenger
  indicator:
    metadata:
      name: messenger-attachment-scan-freshness
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_attachment_scan_duration_seconds_bucket{le="60"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_attachment_scan_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "demo_trial best-effort: p99 attachment-scan ≤ 60 s"
    - target: 0.99
      displayName: "paid contractual: p99 attachment-scan ≤ 60 s"
