# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-voice-video-quality
  displayName: "messenger: voice/video media quality (MOS ≥ 4.0 + packet-loss < 1 %)"
  labels:
    microservice: messenger
    bc: huddles
    sli_class: correctness
    owner_team: axis-messenger
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Composite correctness SLI for in-call media quality across LiveKit SFU
    sessions. A "good" minute is one where the session has MOS ≥ 4.0,
    packet-loss < 1 %, jitter < 30 ms. Reference: ITU-T G.107 (E-model).
  service: messenger
  indicator:
    metadata:
      name: messenger-media-quality
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_media_minute_good_total[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_media_minute_total[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "demo_trial best-effort: ≥ 95 % of in-call minutes meet quality envelope"
    - target: 0.97
      displayName: "paid contractual: ≥ 97 % of in-call minutes meet quality envelope"
