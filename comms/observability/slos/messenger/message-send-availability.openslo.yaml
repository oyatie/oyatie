# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-message-send-availability
  displayName: "messenger: message-send availability"
  labels:
    microservice: messenger
    bc: message-stream
    sli_class: availability
    owner_team: axis-messenger
    pack_scope: all
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Availability SLO for the POST message → fanout-ack path. A request is "good"
    when it returns 2xx from the channel-store-rest API AND the broadcast worker
    has acked durable handoff to Valkey Streams (RESP3 wire-compatible) within the per-cell broadcast
    window. Per Google SRE Workbook ch. 5 multi-window multi-burn-rate.
  service: messenger
  indicator:
    metadata:
      name: messenger-message-send-success-ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_message_send_total{result="success",pack=~".+"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_message_send_total{pack=~".+"}[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.999
      displayName: "demo_trial best-effort: 30d rolling availability ≥ 99.9 %"
    - target: 0.9995  # 99.95 % availability
      displayName: "paid contractual: 30d rolling availability ≥ 99.95 %"
  alertPolicies:
    - alertPolicyRef: messenger-fast-burn-1h-14x
    - alertPolicyRef: messenger-slow-burn-6h-6x
    - alertPolicyRef: messenger-ticket-burn-3d-1x
