# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-voice-video-setup
  displayName: "messenger: voice/video call setup p95 ≤ 1.5s"
  labels:
    microservice: messenger
    bc: huddles
    sli_class: latency
    owner_team: axis-messenger
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Time from "create huddle / start call" request to first media frame
    received by the initiating client. Spans:
    - SDP offer/answer exchange,
    - ICE gathering (with STUN; TURN if needed),
    - LiveKit SFU room allocation + DTLS handshake.
    Reference: RFC 8825 (WebRTC), RFC 8866 (SDP), RFC 8445 (ICE).
  service: messenger
  indicator:
    metadata:
      name: messenger-huddle-setup
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_huddle_setup_seconds_bucket{le="1.5"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_huddle_setup_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9
      displayName: "demo_trial best-effort: p95 voice/video setup ≤ 1.5s"
    - target: 0.95
      displayName: "paid contractual: p95 voice/video setup ≤ 1.5s"
