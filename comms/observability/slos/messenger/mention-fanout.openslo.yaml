# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-mention-fanout
  displayName: "messenger: @mention resolve + fanout p99 ≤ 250ms"
  labels:
    microservice: messenger
    bc: mention-router
    sli_class: latency
    owner_team: axis-messenger
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Time from MessagePosted with mention tokens → MentionEmitted event +
    WebSocket notification on each recipient frame. Includes Ontology
    lookup for Person/Team/Channel identity resolution.
  service: messenger
  indicator:
    metadata:
      name: messenger-mention-fanout
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_mention_fanout_duration_seconds_bucket{le="0.25"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_mention_fanout_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "demo_trial best-effort: p99 mention fanout ≤ 250ms"
    - target: 0.99
      displayName: "paid contractual: p99 mention fanout ≤ 250ms"
