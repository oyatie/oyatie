# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-read-receipt-fanout
  displayName: "messenger: read-receipt per-recipient fanout p99 ≤ 150ms"
  labels:
    microservice: messenger
    bc: read-receipt-tracker
    sli_class: latency
    owner_team: axis-messenger
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    Per-recipient last-read-cursor fan-out latency. Coalesced under 250ms
    windows; idempotent under backpressure. Reference: PRD §"Performance
    NFR" row "Read-receipt fan-out".
  service: messenger
  indicator:
    metadata:
      name: messenger-read-receipt-fanout
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_read_receipt_fanout_duration_seconds_bucket{le="0.15"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_read_receipt_fanout_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.95
      displayName: "demo_trial best-effort: p99 read-receipt fanout ≤ 150ms"
    - target: 0.99
      displayName: "paid contractual: p99 read-receipt fanout ≤ 150ms"
