# Canonical-base: specs/openslo/canonical-envelope-schema.json + canonical-burn-rate-alert-template.openslo.yaml (SWEEP-I Slice 4 per ADR-0064)
apiVersion: openslo/v1
kind: SLO
metadata:
  name: messenger-search-latency
  displayName: "messenger: search p95 ≤ 400ms over 10M-msg corpus"
  labels:
    microservice: messenger
    bc: message-stream
    sli_class: latency
    owner_team: axis-messenger
    tenant_class: demo_trial,paid
    demo_trial_slo_class: best_effort
    paid_slo_class: contractual
    tenant_class_eligibility: demo_trial,paid
    paid_billing_components_emitted: per_seat,per_usage
    tenant_class_principal_claim: principal.tenant_class
    demo_trial_caps_ref: comms/messenger/manifest.json#/tenant_class_adoption/demo_trial_caps
    paid_compliance_gate_ref: comms/messenger/policy/tenant-class.cedar#activate_compliance_pack
spec:
  description: |
    p95 latency for GET /search with Cedar-filtered post-process. Corpus
    baseline 10M messages per paid tenant (large-tenant envelope). Beyond
    10M messages, latency follows the search-adapter scaling curve and
    tenant_class SLO objectives apply (see capacity-model.md).
  service: messenger
  indicator:
    metadata:
      name: messenger-search-latency
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_search_duration_seconds_bucket{le="0.4"}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(oya_messenger_search_duration_seconds_count[5m]))
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - target: 0.9
      displayName: "demo_trial best-effort: p95 search ≤ 400ms"
    - target: 0.95
      displayName: "paid contractual: p95 search ≤ 400ms"
