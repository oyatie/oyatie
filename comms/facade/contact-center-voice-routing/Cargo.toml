[package]
name = "comms-contact-center-voice-routing"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust src scaffold for the Contact Center voice routing application surface."

[package.metadata.oya]
microservice = "contact-center"
title = "Contact Center"
bounded_context = "voice-routing"
layer = "app"
wave = "wave-3-k"
owner_team = "axis-contact-center + council-product"
data_classification = "tenant-scoped operational records with audit evidence"
criticality_tier = "product-critical"
binding_adrs = ["ADR-0105", "ADR-0131", "ADR-0132", "ADR-0316"]
openapi = "contracts/openapi-v1.yaml"
asyncapi = "contracts/asyncapi-v1.yaml"
protobuf = "contracts/contact-center-v1.proto"

[lib]
name = "comms_contact_center_voice_routing"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "comms-contact-center-voice-routing-bin"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
