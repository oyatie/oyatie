# comms-email US-healthcare pack overlay — ADR-0064 + ADR-0201 (HIPAA).
pack: us-healthcare
allowed_providers: [ses, postal]   # BAA-only providers
default_provider: ses
regions: [us-east-1]
cross_region_allowed: false
dmarc:
  new_tenant_default: quarantine
  post_warmup_default: reject
data_residency:
  enforced: true
  allowed_processing_regions: [us-east-1]
hipaa:
  enabled: true
  baa_required: true
  phi_attachment_encryption: required
