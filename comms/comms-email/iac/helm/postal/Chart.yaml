apiVersion: v2
name: oya-comms-email-postal
description: |
  ADR-0201 Postal self-hosted email server (sovereign / air-gapped
  tier). AGPL upstream. Default Helm chart for tenants that cannot
  use AWS SES. Wired through the `EmailComms` kernel
  (`PostalEmailComms` adapter in
  `crates/oya-shared-email-comms-kernel`). Per-tenant DKIM keys
  live in OpenBao (ADR-0173). SPF + DMARC enforced at preflight.
type: application
version: 0.1.0
appVersion: "3.0.0"
home: https://github.com/oyatie/oyatie
sources:
  - https://github.com/postalserver/postal
maintainers:
  - name: oyatie-substrate-comms
    email: substrate@oyatie.local
keywords:
  - email
  - smtp
  - postal
  - dkim
  - spf
  - dmarc
  - adr-0201
annotations:
  oyatie.io/adr: ADR-0201
  oyatie.io/microservice: comms-email
  oyatie.io/provider: postal
  oyatie.io/sovereign-tier: "true"
