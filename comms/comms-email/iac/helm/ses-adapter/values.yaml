# comms-email SES adapter — config-only (no Helm chart needed for
# the SES SaaS itself). This values file is consumed by the
# comms-email µservice's Helm chart to enable / configure the SES
# adapter feature flag.
ses:
  enabled: true
  region: ""                # parent wires per cluster
  configuration_set_prefix: oya-tenant-
  sns_topic_arn: ""         # parent wires
  iam_role_arn: ""          # parent wires (assumed role with SES permissions)
  feedback:
    sns_topic_arn: ""
  rate_ceiling:
    burst: 14000
    rate_per_second: 200
