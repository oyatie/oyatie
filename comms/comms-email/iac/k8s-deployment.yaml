# comms-email — K8s deployment per ADR-0254
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comms-email-outbound-sender
  namespace: oya-comms-email
spec:
  replicas: 3
  selector:
    matchLabels:
      app: comms-email-outbound-sender
  template:
    metadata:
      labels:
        app: comms-email-outbound-sender
        oyatie.io/spiffe-id: spiffe://oyatie/comms-email/outbound-sender
      annotations:
        io.katacontainers.config.hypervisor.path: /usr/local/bin/cloud-hypervisor
        oyatie.io/ech-config-id: ech-2026-05
        oyatie.io/pqc-hybrid: X25519MLKEM768
    spec:
      runtimeClassName: kata
      containers:
        - name: outbound-sender
          image: ghcr.io/oyatie/comms-email-outbound-sender:0.1.0
          ports:
            - name: http3
              containerPort: 443
              protocol: UDP
            - name: https
              containerPort: 443
              protocol: TCP
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 2Gi }
