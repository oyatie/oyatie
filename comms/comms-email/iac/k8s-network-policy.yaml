apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comms-email-default-deny
  namespace: oya-comms-email
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comms-email-allow-substrate
  namespace: oya-comms-email
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: comms-email
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oyatie.io/substrate-tier: "true"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: UDP, port: 443 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: oya-observability } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: oya-audit-chain } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: oya-cloud-secrets } }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: UDP, port: 443 }
    # Allow egress to SMTP providers
    - to: []
      ports:
        - { protocol: TCP, port: 25 }
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 587 }
