// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

// ADR-0201 canonical transactional-email substrate.
// Internal-only sibling-service gRPC projection; public clients use the OpenAPI REST surface.

package oya.comms_email.v1;

option go_package = "github.com/oyatie/oya/comms_email/v1;commsemail";

service CommsEmail {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc OnboardFromDomain(OnboardFromDomainRequest) returns (OnboardFromDomainResponse);
  rpc ListFromDomains(ListFromDomainsRequest) returns (ListFromDomainsResponse);
  rpc RotateDkim(RotateDkimRequest) returns (RotateDkimResponse);
  rpc RevokeDkim(RevokeDkimRequest) returns (RevokeDkimResponse);
}

message SendMessageRequest {
  string idempotency_key = 1;
  string audit_correlation_id = 2;
  string tenant_id = 3;
  string from = 4;
  string reply_to = 5;
  repeated string to = 6;
  string subject = 7;
  string template_id = 8;
  string locale = 9;
  map<string, string> vars = 10;
}

message SendMessageResponse {
  string provider = 1; // ses | postal | mailgun | smtp
  string provider_message_id = 2;
}

message OnboardFromDomainRequest {
  string tenant_id = 1;
  string from_domain = 2;
  string locale_pack = 3;
  string support_inbox = 4;
  string provider_preference = 5;
}

message OnboardFromDomainResponse {
  string onboarding_id = 1;
  string status = 2;
  repeated DnsRecordToPublish dns_records_to_publish = 3;
}

message DnsRecordToPublish {
  string kind = 1; // SPF | DKIM | DMARC
  string host = 2;
  string value = 3;
}

message ListFromDomainsRequest {
  string tenant_id = 1;
}

message ListFromDomainsResponse {
  repeated FromDomainSummary domains = 1;
}

message FromDomainSummary {
  string from_domain = 1;
  string state = 2;
  string current_selector = 3;
  int64 next_rotation_epoch_s = 4;
}

message RotateDkimRequest {
  string tenant_id = 1;
  string from_domain = 2;
}

message RotateDkimResponse {
  string new_selector = 1;
}

message RevokeDkimRequest {
  string tenant_id = 1;
  string from_domain = 2;
  string selector = 3;
  string reason = 4;
}

message RevokeDkimResponse {
  bool ok = 1;
}
