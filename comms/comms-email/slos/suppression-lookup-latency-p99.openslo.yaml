apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-suppression-lookup-latency-p99
  displayName: "comms-email · suppression list lookup p99 latency"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: hot-path
spec:
  service: comms-email
  description: |
    Hot-path preflight suppression lookup p99. Target: 5 ms.
  indicator:
    metadata:
      name: suppression_lookup_p99_ms
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: |
                histogram_quantile(0.99,
                  sum by (le) (rate(comms_email_suppression_lookup_ms_bucket[5m])))
                <= 5
        total:
          metricSource:
            spec:
              query: count_over_time(up{job="comms-email"}[5m])
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 ≤ 5 ms"
      target: 0.99
