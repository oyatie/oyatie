apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-audit-chain-emit-lag-p99
  displayName: "comms-email · audit chain emit lag p99"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: audit
spec:
  service: comms-email
  description: |
    p99 wall-clock from internal event creation to audit chain
    seal. Target: 5 s.
  indicator:
    metadata:
      name: audit_chain_emit_lag_p99_ms
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: |
                histogram_quantile(0.99,
                  sum by (le) (rate(comms_email_audit_emit_lag_ms_bucket[5m])))
                <= 5000
        total:
          metricSource:
            spec:
              query: count_over_time(up{job="comms-email"}[5m])
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "p99 ≤ 5 s"
      target: 0.99
