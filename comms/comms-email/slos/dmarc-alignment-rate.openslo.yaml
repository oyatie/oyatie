apiVersion: openslo/v1
kind: SLO
metadata:
  name: comms-email-dmarc-alignment-rate
  displayName: "comms-email · DMARC alignment rate (post-warmup tenants)"
  labels:
    microservice: comms-email
    adr: ADR-0201
    pillar: security
spec:
  service: comms-email
  description: |
    Fraction of delivered sends that pass DMARC alignment per
    DMARC RUA reports, scoped to tenants past their 14-day
    warm-up window. Target: 99%.
  indicator:
    metadata:
      name: dmarc_alignment_rate
    spec:
      ratioMetric:
        good:
          metricSource:
            spec:
              query: sum(rate(comms_email_dmarc_aligned_total{warmup="complete"}[24h]))
        total:
          metricSource:
            spec:
              query: sum(rate(comms_email_dmarc_report_total{warmup="complete"}[24h]))
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "≥ 99%"
      target: 0.99
