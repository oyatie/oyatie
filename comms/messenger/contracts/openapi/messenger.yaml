openapi: 3.2.0
info:
  title: oya-messenger
  version: 1.0.0
  summary: REST API for the messenger µservice — channel CRUD, message CRUD, threads, presence, search, attachments
  description: |
    Tenant-facing REST surface for the messenger µservice. All endpoints require
    OIDC + Cedar authorisation (per `comms/messenger/policy/*.cedar`)
    and are tenant-scoped via `X-Scope-OrgID` header.

    Real-time path is via WebSocket at `wss://messenger-{pack}.oyatie.com/ws/v1`
    documented in `contracts/asyncapi/messenger-events.yaml`.

    Cross-cutting authentication: OIDC bearer in `Authorization: Bearer <jwt>`.
    The JWT carries the principal's tenant_id claim. The X-Scope-OrgID header
    MUST match the claim; mismatch returns 401.
  contact:
    name: axis-messenger
    url: https://oyatie.com/teams/axis-messenger
  license:
    name: Internal
servers:
  - url: https://messenger-{pack}.oyatie.com/api/v1
    description: Per-pack endpoint
    variables:
      pack:
        enum: [kr, eu, us, us-hc, jp, sg, au, in, br, ae, ksa]
        default: kr

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: messenger
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - oya-governance-oya-verify-ci-mirror-coverage
          - oya-governance-oya-verify-ci-step-exit-semantics
          - oya-governance-oya-verify-skip-flag-allowlist
          - oya-governance-oya-submit-calls-verify
          - oya-governance-oya-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every oya-governance-* CI lane prefix in the Oyatie corpus RENAMES to oya-governance-* in a single bulk-rename pull request.
        enforced_by:
          - oya-governance-no-foundry-fitness-residue
          - oya-governance-lane-prefix-vocabulary
          - oya-governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - oya-governance-sharding-automation-coverage
          - oya-governance-autosharding-manual-mode-refusal
          - oya-governance-auto-rebalance-residency-honored
          - oya-governance-dynamic-sharding-threshold-coverage
          - oya-governance-audit-chain-emit-on-automation-events
          - oya-governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - oya-governance-jenkins-github-actions-parity
          - oya-governance-argocd-application-cosign-verified
          - oya-governance-argocd-tenant-namespace-isolation
          - oya-governance-jenkins-jcasc-only
          - oya-governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://auth.oyatie.com/.well-known/openid-configuration
  parameters:
    XScopeOrgID:
      in: header
      name: X-Scope-OrgID
      required: true
      schema:
        type: string
        pattern: '^tenant:[a-f0-9]{16}$'
    XContextKind:
      in: header
      name: X-Context-Kind
      required: true
      schema:
        type: string
        enum: [Personal, Professional]
      description: Dual-context invariant per parallel ADR-0238
    # Tier-A canonical parameter components (Fix-Agent-I, 2026-05-18).
    # Per ADR-0149..ADR-0151. Every state-changing op MUST ref
    # IdempotencyKey; every list op MUST ref Cursor + PageSize;
    # every op SHOULD ref XRequestId.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
      description: |
        Opaque idempotency key per docs/standards/idempotency-keys-canonical.md
        (Stripe + AWS ClientToken pattern). Server caches the response
        keyed by (tenant_id, capability_id, Idempotency-Key) for 24h.
    XRequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        format: ulid
      description: |
        Per-request correlation id (ULID) per
        docs/standards/request-id-canonical.md. If absent, the edge
        middleware mints one and echoes it on the response.
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: |
        Opaque cursor for cursor pagination per
        docs/standards/cursor-pagination-canonical.md. Mutually
        exclusive with offset (FORBIDDEN).
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size; server may clamp to [1, 100].
    ChannelId:
      in: path
      name: channel_id
      required: true
      schema:
        type: string
        format: ulid
    MessageId:
      in: path
      name: message_id
      required: true
      schema:
        type: string
        format: ulid
    ThreadId:
      in: path
      name: thread_id
      required: true
      schema:
        type: string
        format: ulid
  schemas:
    Channel:
      type: object
      required: [channel_id, tenant_id, context_kind, kind, name, created_at]
      properties:
        channel_id: {type: string, format: ulid}
        tenant_id: {type: string}
        context_kind: {type: string, enum: [Personal, Professional]}
        kind: {type: string, enum: [Public, Private, DM, GroupDM]}
        name: {type: string, maxLength: 80}
        topic: {type: string, maxLength: 250, nullable: true}
        member_count: {type: integer}
        retention_policy_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        archived_at: {type: string, format: date-time, nullable: true}
    Message:
      type: object
      required: [message_id, channel_id, author_ref, context_kind, posted_at]
      properties:
        message_id: {type: string, format: ulid}
        channel_id: {type: string, format: ulid}
        thread_id: {type: string, format: ulid, nullable: true}
        author_ref: {type: string, description: SPIFFE-style author identity}
        context_kind: {type: string, enum: [Personal, Professional]}
        body: {type: string, description: For Professional only — body plaintext after tenant-DEK decrypt; for Personal returns ciphertext}
        body_ciphertext: {type: string, format: byte, nullable: true}
        data_class: {type: string, enum: [BEHAVIORAL_TENANT_PRODUCT, PII_IDENTIFYING, PHI, PERSONAL]}
        attachment_refs:
          type: array
          items: {type: string, format: ulid}
        mention_refs:
          type: array
          items: {type: string}
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji: {type: string}
              count: {type: integer}
              users: {type: array, items: {type: string}}
        edited_at: {type: string, format: date-time, nullable: true}
        deleted_at: {type: string, format: date-time, nullable: true}
        posted_at: {type: string, format: date-time}
        content_hash: {type: string, description: sha256(plaintext or ciphertext) — integrity check}
    Thread:
      type: object
      required: [thread_id, channel_id, parent_message_id, participant_count]
      properties:
        thread_id: {type: string, format: ulid}
        channel_id: {type: string, format: ulid}
        parent_message_id: {type: string, format: ulid}
        participant_count: {type: integer}
        reply_count: {type: integer}
        last_reply_at: {type: string, format: date-time, nullable: true}
    Reaction:
      type: object
      required: [emoji]
      properties:
        emoji: {type: string, maxLength: 64}
    Presence:
      type: object
      required: [user_ref, state, updated_at]
      properties:
        user_ref: {type: string}
        state: {type: string, enum: [Online, Away, DoNotDisturb, Offline]}
        custom_status: {type: string, maxLength: 100, nullable: true}
        updated_at: {type: string, format: date-time}
    Attachment:
      type: object
      required: [attachment_id, blob_ref, digest_sha256, size_bytes, mime_type, scan_status]
      properties:
        attachment_id: {type: string, format: ulid}
        blob_ref: {type: string, description: signed-URL (≤15min TTL)}
        digest_sha256: {type: string}
        size_bytes: {type: integer}
        mime_type: {type: string}
        scan_status: {type: string, enum: [pending, clean, infected, error]}
        preview_url: {type: string, nullable: true}
    SearchResult:
      type: object
      required: [results, took_ms]
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              message: {$ref: '#/components/schemas/Message'}
              channel_id: {type: string}
              score: {type: number}
              highlight: {type: string}
        total_hits: {type: integer}
        took_ms: {type: integer}
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object}

security:
  - OIDC: []

paths:
  /channels:
    get:
      summary: List channels the caller is a member of
      operationId: listChannels
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/XContextKind'
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Channel list
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: {$ref: '#/components/schemas/Channel'}
                  next_cursor: {type: string, nullable: true}
        '401': {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/schemas/Error'}
    post:
      summary: Create a channel
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/XContextKind'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: {type: string, enum: [Public, Private, DM, GroupDM]}
                name: {type: string, maxLength: 80}
                topic: {type: string, maxLength: 250}
                initial_members:
                  type: array
                  items: {type: string}
                retention_policy_id: {type: string}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}

  /channels/{channel_id}:
    get:
      summary: Read a channel
      operationId: getChannel
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
    delete:
      summary: Archive a channel (soft-delete; retention-purge worker handles eventual)
      operationId: archiveChannel
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '202': {description: Archived}

  /channels/{channel_id}/members:
    get:
      summary: List channel members
      operationId: listChannelMembers
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Member list
    post:
      summary: Add a member (channel-admin only)
      operationId: addChannelMember
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '201': {description: Added}

  /channels/{channel_id}/members/{user_ref}:
    delete:
      summary: Remove a member (channel-admin only)
      operationId: removeChannelMember
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - in: path
          name: user_ref
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}

  /channels/{channel_id}/messages:
    get:
      summary: List messages in a channel
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - in: query
          name: before_message_id
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: {$ref: '#/components/schemas/Message'}
    post:
      summary: Post a message
      operationId: postMessage
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
                body_ciphertext: {type: string, format: byte, description: For Personal-context DMs E2E ciphertext only}
                thread_id: {type: string, format: ulid, nullable: true}
                attachment_refs:
                  type: array
                  items: {type: string, format: ulid}
                mention_refs:
                  type: array
                  items: {type: string}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}

  /channels/{channel_id}/messages/{message_id}:
    get:
      summary: Read a message
      operationId: getMessage
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
    patch:
      summary: Edit own message
      operationId: editMessage
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: string}
      responses:
        '200': {description: Edited}
    delete:
      summary: Delete own message (tombstone)
      operationId: deleteMessage
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204': {description: Deleted}

  /channels/{channel_id}/messages/{message_id}/reactions:
    post:
      summary: Add a reaction to a message
      operationId: addReaction
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reaction'}
      responses:
        '201': {description: Added}

  /channels/{channel_id}/messages/{message_id}/reactions/{emoji}:
    delete:
      summary: Remove own reaction
      operationId: removeReaction
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
        - in: path
          name: emoji
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}

  /channels/{channel_id}/messages/{message_id}/read:
    post:
      summary: Mark message as read (updates last-read cursor)
      operationId: markRead
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '202': {description: Accepted (coalesced)}

  /threads/{thread_id}/replies:
    get:
      summary: List thread replies
      operationId: listThreadReplies
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: Replies
    post:
      summary: Post a thread reply
      operationId: postThreadReply
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
      responses:
        '201': {description: Created}

  /attachments:
    post:
      summary: Initiate multipart attachment upload
      operationId: initiateAttachmentUpload
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size_bytes, mime_type]
              properties:
                filename: {type: string}
                size_bytes: {type: integer, maximum: 5368709120}
                mime_type: {type: string}
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment_id: {type: string}
                  upload_urls:
                    type: array
                    items: {type: string}
                  finalize_url: {type: string}

  /attachments/{attachment_id}:
    get:
      summary: Read attachment metadata + signed blob URL
      operationId: getAttachment
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: attachment_id
          required: true
          schema: {type: string, format: ulid}
      responses:
        '200':
          description: Attachment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}

  /search:
    get:
      summary: Search messages across channels caller can read
      operationId: searchMessages
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: query
          name: q
          required: true
          schema: {type: string}
        - in: query
          name: channel_id
          schema: {type: string}
        - in: query
          name: before
          schema: {type: string, format: date-time}
        - in: query
          name: after
          schema: {type: string, format: date-time}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Results (Cedar-filtered server-side)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResult'}

  /presence/{user_ref}:
    get:
      summary: Read another user's presence (membership-bound)
      operationId: getPresence
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
        - in: path
          name: user_ref
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Presence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Presence'}

  /presence/me:
    put:
      summary: Update own presence
      operationId: updateOwnPresence
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [Online, Away, DoNotDisturb, Offline]}
                custom_status: {type: string, maxLength: 100}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Presence'}

  /holds:
    post:
      summary: Open eDiscovery hold (compliance-officer entitlement required)
      operationId: openEDiscoveryHold
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: object
                  properties:
                    channel_ids: {type: array, items: {type: string}}
                    user_refs: {type: array, items: {type: string}}
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                reason: {type: string}
      responses:
        '201':
          description: Hold opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold_id: {type: string}

  /disclosures:
    post:
      summary: Request four-eyes disclosure (paired action)
      operationId: requestDisclosure
      parameters:
        - $ref: '#/components/parameters/XScopeOrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids, reason, paired_approver_id]
              properties:
                message_ids: {type: array, items: {type: string}}
                reason: {type: string}
                paired_approver_id: {type: string, description: Second principal must independently approve}
      responses:
        '202':
          description: Awaiting paired approval

  /health:
    get:
      summary: Liveness
      operationId: getHealth
      security: []
      responses:
        '200': {description: alive}

  /ready:
    get:
      summary: Readiness (Postgres + Valkey + S3 reachable)
      operationId: getReady
      security: []
      responses:
        '200': {description: ready}
        '503': {description: not ready}
