# Canonical-base: specs/capabilities/canonical-tier-schema.json + eu-ai-act-risk-class-registry.json (SWEEP-I Slice 5 per ADR-0064)
id: cap:messenger:t2-auto:v1
name: auto-mute-categorize-translate
namespace: messenger
display_name: Auto-Mute + Auto-Categorize + Auto-Translate
description: |
  T2 capability: autonomous classification + side-effecting actions WITHOUT
  per-invocation user confirmation. Three sub-capabilities:

  1. Auto-mute  — low-signal channels muted in the per-user inbox view
     (mute toggles in-app notification only; never deletes content).
  2. Auto-categorize  — classification labels applied to messages
     (e.g., "decision", "question", "ack") for downstream filtering.
  3. Auto-translate  — on-the-fly translation overlay for users whose
     preferred locale differs from message locale. Original always retained.

  All three preserve original content; none delete, edit, or send.

owner_team: axis-messenger + axis-foundry-runtime
maturity: preview
created_at: 2026-05-17
related_adrs: [ADR-0022, ADR-0135, ADR-0131, ADR-0133]
related_artifacts:
  - microservices/messenger/PRD.md
  - microservices/messenger/policy/dual-context-isolation.md

autonomy_tier: T2
# T2 = autonomous classification + side-effects bounded to user inbox view;
# no destructive ops; full audit-chain trail.

inputs:
  - name: message
    type: object
    required: true
  - name: target_user_ref  # only for translate / auto-mute
    type: string
    required: false

outputs:
  - name: mute_decision
    type: object
    properties:
      muted: {type: boolean}
      confidence: {type: number}
      reason: {type: string}
  - name: categories
    type: array
    items:
      type: object
      properties:
        label: {type: string, enum: [decision, question, ack, status_update, social, action_required]}
        confidence: {type: number}
  - name: translation
    type: object
    properties:
      target_locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
      translated_text: {type: string}
      detected_source_locale: {type: string}
      provider: {type: string, enum: [local-mbart, deepl, none]}

data_classes_touched:
  - BEHAVIORAL_TENANT_PRODUCT
  - PII_IDENTIFYING

context_kind_constraint:
  Personal: client-side-only (E2E plaintext); server-side T2 forbidden
  Professional: server-side; tenant-admin must opt-in per-channel
  enforcement: oya-check-dual-context-isolation + Cedar permit only when entitlement present

regulatory_packs_consumed: [pack-kr, pack-eu, pack-us, pack-us-healthcare, pack-jp, pack-sg, pack-au, pack-in, pack-br, pack-ae, pack-ksa]

pack_overrides:
  pack-us-healthcare:
    auto_translate_disabled_for_phi: true
    reason: HIPAA — third-party translation provider not BAA-covered; only on-prem local-mbart
  pack-eu:
    risk_classification:
      auto-mute: limited_risk
      auto-categorize: limited_risk
      auto-translate: minimal_risk
    transparency_obligation: tenant-admin must disclose to end-users in privacy notice
  pack-kr:
    kr_pipa_art28_consent: tenant-admin-opt-in + per-user end-user notice

evidence_topic: oya.messenger.capability.t2_auto.evidence

cost_profile:
  type: per-message
  estimated_cost_usd_per_call: 0.0002  # batched; classifier is small open-weights
  cost_drivers:
    - Classifier inference (small model, batched)
    - Translation inference (large model when invoked)

cedar_policy_fragments:
  - microservices/messenger/policy/channel-scope.cedar
  - microservices/messenger/policy/tenant-scope.cedar

eval_set:
  reference_inputs_path: microservices/messenger/capabilities/eval/t2-auto-reference.jsonl
  pass_threshold: 0.93
  eval_metric: |
    auto-mute precision@1 (false-mute < 2 %);
    auto-categorize macro-F1 over 6 labels;
    auto-translate BLEU vs reference + human-eval Likert
  cadence: per-release
  reference: chrF++ + COMET (translation); macro-F1 (classification)

rollback:
  ttl_seconds: 0  # T2 outputs are overlays in user view; "rollback" = stop emitting; no state to revert
  audit_trail: every classification + translation emits to evidence_topic with hash + reasoning_token

sunset:
  status: none
