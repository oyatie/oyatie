# Canonical-base: microservices/governance/iac/kustomize/components/{namespace-restricted-profile,pack-overlay-canonical/<pack>} (SWEEP-I Slice 3 per ADR-0064)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messenger-us-hc

resources:
  - ../../base

# Pack-US-Healthcare overlay per /specs/regulatory-packs.json#pack-us-healthcare
# - HIPAA 45 CFR §164.308-316 enforced.
# - PHI-channel BAA required at tenant onboarding.
# - T0/T1/T2 capabilities disabled by default; per-channel opt-in only.
# - SEC 17a-4 + FINRA 4511 retention applies when financial-record channels active.

patches:
  - target: {kind: HelmRelease, name: messenger}
    patch: |-
      - op: replace
        path: /spec/values/global/pack
        value: us-hc
      - op: replace
        path: /spec/values/capabilities/t2Auto/enabled
        value: false
      - op: replace
        path: /spec/values/capabilities/t1Assist/enabled
        value: false
  - target: {kind: ConfigMap, name: messenger-retention-policy}
    patch: |-
      - op: replace
        path: /data/pack-us-hc-floor-days
        value: "2190"  # 6 years HIPAA standard
