# Canonical-base: microservices/governance/iac/helm/_oya-helpers — helpers via {{ include "oya.X" $ }} (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v1
kind: Service
metadata:
  name: messenger-rest
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: messenger
    app.kubernetes.io/component: message-stream-rest
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: messenger-websocket
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: messenger
    app.kubernetes.io/component: websocket-gateway
  ports:
    - name: wss
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: messenger-channel-store
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: messenger
    app.kubernetes.io/component: channel-store
  ports:
    - name: http
      port: 80
      targetPort: 8080
