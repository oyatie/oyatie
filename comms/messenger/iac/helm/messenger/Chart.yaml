# Canonical-base: microservices/governance/iac/helm/_oya-helpers (SWEEP-I Slice 2 per ADR-0064)
apiVersion: v2
name: oya-messenger
description: |
  Helm chart for the messenger µservice — channel-store / message-stream /
  presence / file-attachment / mention-router / thread-tree / read-receipt /
  huddles BCs deployed as horizontally-scaled, tenant-sharded workloads.
  Per ADR-0131 flat layout + ADR-0139 SLO-gated promotion.
type: application
version: 0.1.0
appVersion: "1.0.0"
maintainers:
  - name: axis-messenger
    email: axis-messenger@oyatie.com
keywords:
  - messenger
  - chat
  - real-time
  - websocket
  - huddles
  - voice
  - video
dependencies:
  - name: livekit-server
    version: "1.6.2"  # LiveKit OSS LTS
    repository: https://helm.livekit.io
    condition: livekit.enabled
  - name: coturn
    version: "0.2.0"
    repository: https://k8s-at-home.com/charts/
    condition: coturn.enabled
  - name: meilisearch
    version: "0.10.0"
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    condition: meilisearch.enabled
