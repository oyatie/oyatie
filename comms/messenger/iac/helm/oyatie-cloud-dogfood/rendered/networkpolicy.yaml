apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: messenger-network-boundary
  labels:
    app.kubernetes.io/name: messenger
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/network-boundary: app-ingress-egress
    oya.io/tenant-id: fd001-dogfood
    oya.io/cost-center: fd001-backbone
    oya.io/workload-class: app
    oya.io/regulatory-pack: generic
    oyatie.com/dogfood-substrate: oyatie-cloud
    oyatie.com/product-goal: fd-001
  annotations:
    oyatie.com/non-claim: static-rendered-networkpolicy-only-no-live-cni-admission-traffic-flow-or-network-isolation-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: messenger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oya-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
