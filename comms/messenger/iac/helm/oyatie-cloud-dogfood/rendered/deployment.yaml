# Static rendered manifest snapshot for ADR-0199 tenant-cost-label coverage.
# Source chart: comms/messenger/iac/k8s/helm/templates/deployment.yaml
# Source values: comms/messenger/iac/k8s/helm/values.yaml
# Non-claim: not applied to any Kubernetes cluster; no ArgoCD sync, admission, or OpenCost report is claimed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messenger
  labels:
    app.kubernetes.io/name: messenger
    app.kubernetes.io/part-of: oyatie-microservices
    app.kubernetes.io/managed-by: Helm
    oyatie.com/adr-0349: argocd-managed
    oyatie.com/cargo-package: oya-messenger
    oya.io/tenant-id: fd001-dogfood
    oya.io/cost-center: fd001-backbone
    oya.io/workload-class: app
    oya.io/regulatory-pack: generic
    oyatie.com/dogfood-substrate: oyatie-cloud
    oyatie.com/product-goal: fd-001
  annotations:
    oyatie.com/non-claim: static-rendered-manifest-snapshot-only-no-cluster-apply-or-opencost-report
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: messenger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messenger
        app.kubernetes.io/part-of: oyatie-microservices
        istio.io/dataplane-mode: ambient
        oyatie.com/tenant-class: contributor
        oya.io/tenant-id: fd001-dogfood
        oya.io/cost-center: fd001-backbone
        oya.io/workload-class: app
        oya.io/regulatory-pack: generic
        oyatie.com/dogfood-substrate: oyatie-cloud
        oyatie.com/product-goal: fd-001
      annotations:
        cosign.sigstore.dev/required: "true"
        oyatie.com/image-digest: ""
        oyatie.com/image-promotion-policy: ADR-0181
        oyatie.com/audit-chain-event: microservice-deployment
    spec:
      runtimeClassName: kata-cloud-hypervisor
      serviceAccountName: oya-messenger
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: messenger
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: messenger
      containers:
        - name: app
          # Intentionally blank: static evidence snapshots are not deployable without release automation.
          image: ""
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OYA_MICROSERVICE
              value: messenger
            - name: OYA_CARGO_PACKAGE
              value: oya-messenger
            - name: OYA_OTEL_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OYA_IMAGE_PROMOTION_POLICY
              value: cosign-required
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
