asyncapi: 3.1.0
info:
  title: Contact Center Local Operational Events
  version: 1.0.0
  description: Events for omnichannel routing, voice call handling, transfer success, callback scheduling, and recording consent operations with tenant, policy, and SLO evidence.
defaultContentType: application/json
channels:
  contact-center.local-ops.v1:
    address: contact-center.local-ops.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      sloBurnEvent:
        $ref: '#/components/messages/SloBurnEvent'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/contact-center.local-ops.v1'
    messages:
      - $ref: '#/channels/contact-center.local-ops.v1/messages/domainEvent'
  publishSloBurnEvent:
    action: send
    channel:
      $ref: '#/channels/contact-center.local-ops.v1'
    messages:
      - $ref: '#/channels/contact-center.local-ops.v1/messages/sloBurnEvent'
components:
  messages:
    DomainEvent:
      name: ContactCenterDomainEvent
      title: Contact Center domain event
      payload:
        type: object
        required: [tenant_id, event_name, resource_id, data_class, audit_event_id, occurred_at]
        properties:
          tenant_id: { type: string }
          event_name: { type: string, enum: ['interaction.route.assigned', 'voice.call.transferred', 'callback.scheduled', 'recording.consent.recorded'] }
          resource_id: { type: string }
          data_class: { type: string, enum: ['conversation_record', 'call_recording', 'routing_state', 'transfer_event', 'agent_presence', 'callback_request'] }
          audit_event_id: { type: string }
          occurred_at: { type: string, format: date-time }
    SloBurnEvent:
      name: ContactCenterSloBurnEvent
      title: Contact Center SLO burn event
      payload:
        type: object
        required: [tenant_id, service, slo_name, burn_rate, objective, window, first_domain_event]
        properties:
          tenant_id: { type: string }
          service: { type: string, const: 'contact-center' }
          slo_name: { type: string }
          burn_rate: { type: number }
          objective: { type: number }
          window: { type: string }
          first_domain_event: { type: string, const: 'interaction.route.assigned' }
