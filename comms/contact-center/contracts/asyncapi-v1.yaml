asyncapi: 3.1.0
info:
  title: Contact Center Events
  version: 1.0.0
  description: Tenant-scoped event contract for real-time voice routing, recording consent, and agent-state operations.
defaultContentType: application/json
channels:
  contact-center.events.v1:
    address: contact-center.events.v1
    messages:
      contactCenterActionAccepted:
        $ref: '#/components/messages/ActionAccepted'
operations:
  publishActionAccepted:
    action: send
    channel:
      $ref: '#/channels/contact-center.events.v1'
    messages:
      - $ref: '#/channels/contact-center.events.v1/messages/contactCenterActionAccepted'
components:
  messages:
    ActionAccepted:
      name: ContactCenterActionAccepted
      title: Contact Center action accepted
      payload:
        type: object
        required: [tenant_id, principal_id, audit_event_class, event_time, deal_set_id]
        properties:
          tenant_id: { type: string }
          principal_id: { type: string }
          audit_event_class: { type: string }
          event_time: { type: string, format: date-time }
          deal_set_id: { type: string }
          transport_profile: { type: string, const: h3-h2-h1-strict-tls13-ech-pqc }
