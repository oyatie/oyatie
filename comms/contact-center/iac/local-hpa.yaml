apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contact-center-voice-router
  labels:
    service: contact-center
    suite: local-operational-primitive
    adr: ADR-0130
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contact-center-voice-router
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: oya_contact_center_call_drop_rate_inflight
        target:
          type: AverageValue
          averageValue: "100"
