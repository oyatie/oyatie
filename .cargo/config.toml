# Linker policy — hermetic / portable-by-default, fast-by-opt-in.
#
# DEFAULT (committed): NO linker override. A clean checkout builds with the platform's stock
# toolchain (cc/ld on Linux; clang->lld is the rustc default on macOS since 1.74) and needs NO
# extra tool installed. This satisfies the just-works / hermetic doctrine: `git clone && cargo
# build` MUST succeed on a fresh box and on CI runners with zero manual steps. (The Buck2 graph
# is the hermetic build-of-record; this cargo config is the developer / accounting-gate
# convenience layer.)
#
# OPT-IN FAST LINKER (local dev): `mold` gives much faster Linux link times. Enable it WITHOUT
# making it a hard build dependency — install mold, then either:
#     export RUSTFLAGS="-C link-arg=-fuse-ld=mold"
# or drop an un-tracked personal override (e.g. ~/.cargo/config.toml) with:
#     [target.x86_64-unknown-linux-gnu]
#     linker = "clang"
#     rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# Rationale (supersedes the prior unconditional-mold config, ADR-0488): forcing
# `-fuse-ld=mold` in the committed config breaks every box / CI runner that lacks mold
# (`clang: error: invalid linker name in argument '-fuse-ld=mold'`) — a hermeticity defect that
# a warm dev tree (mold pre-installed) silently masks. Portable-by-default fixes the clean-
# checkout build; opt-in keeps the fast local link path for those who provision mold.

# Cargo-native test resources for the inventory-backed gate fleet (ADR-0716).
#
# Buck binds the accounting producer as a declared test resource. Cargo has no stable
# cross-package `CARGO_BIN_EXE_*` propagation, so the package-local integration target builds the
# inventory binaries and this repository config names them as logical Cargo test resources. At
# runtime the test plumbing resolves each `cargo-test-binary:` name beside its own executable;
# this remains correct for a fresh clone, target triples, and any `CARGO_TARGET_DIR` without
# committing a machine- or worktree-specific path. The adapter materializes a missing SCM snapshot
# through the existing Rust emitter, then delegates to the unchanged producer. It is not an
# admission or operator CLI.
#
# `force` deliberately stays false (Cargo's default). CI's explicit, materializer-backed
# OYA_CI_PRODUCER_BIN therefore wins, while a plain `cargo test --workspace` receives the adapter.
[env]
OYA_CI_PRODUCER_BIN = "cargo-test-binary:oya-cloud-ci-cargo-test-producer-adapter"
OYA_CI_CARGO_TEST_PRODUCER_BIN = "cargo-test-binary:oya-cloud-ci-accounting-registry-app"
OYA_CI_CARGO_TEST_SCM_FACTS_EMITTER_BIN = "cargo-test-binary:oya-cloud-ci-scm-facts-emitter-app"
OYA_CI_CARGO_TEST_REORG_CODEMOD_BIN = "cargo-test-binary:oya-reorg-codemod"
OYA_CI_EMITTER_BIN = "cargo-test-binary:oya-cloud-ci-scm-facts-emitter-app"
OYA_CI_CODEMOD_BIN = "cargo-test-binary:oya-reorg-codemod"
OYA_CI_ENFORCEMENT_LIVENESS_PRODUCER = { value = "cargo-test-binary:oya-cloud-ci-accounting-registry-app", force = false }
OYA_CI_ENFORCEMENT_LIVENESS_CLAUDE_SETTINGS = { value = ".claude", relative = true }
OYA_CI_ENFORCEMENT_LIVENESS_CODEX_HOOKS = { value = ".codex", relative = true }
OYA_CI_ENFORCEMENT_LIVENESS_HOOKS_DIR = { value = "tools/hooks", relative = true }

