# templates/foundry-supervisor/gemini.toml
version = 1
provider_family = "Gemini"
target_root = "~"

[provider_overrides]
disable_skills = true
omitted_hook_events = ["SubagentStart","SubagentStop","PreCompact","PreToolUse","PostToolUse"]

[[mcp_servers]]
name = "oya-mcp-gateway"
transport = "Stdio"
command_or_url = "$WORKSPACE_ROOT/target/release/oya-mcp-gateway"

[[permissions]]
rule = "Bash(grit *)"

[[allowed_tools]]
name = "Read"
