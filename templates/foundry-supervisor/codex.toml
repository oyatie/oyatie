# templates/foundry-supervisor/codex.toml
version = 1
provider_family = "OpenAIOrCodex"
target_root = "~"

[provider_overrides]
disable_skills = true
omitted_hook_events = []

[[hooks]]
event = "Stop"
command = "$WORKSPACE_ROOT/tools/foundry-supervisor-stop-hook"
args = []

[[mcp_servers]]
name = "oya-mcp-gateway"
transport = "Stdio"
command_or_url = "$WORKSPACE_ROOT/target/release/oya-mcp-gateway"

# Stale `Bash(grit *)` permission removed 2026-05-18 — grit pipeline retired per ADR-0116 +
# superseded by oya vcs canonical (feedback_oya_vcs_canonical_2026_05_16; cargo run -p oya-dev-cli -- vcs ...).
# Canonical VCS primitive is `oya vcs`; Codex-launched supervisors invoke it via cargo, no special permission rule needed.

[[allowed_tools]]
name = "Read"
