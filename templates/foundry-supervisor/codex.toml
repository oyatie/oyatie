# templates/foundry-supervisor/codex.toml
version = 1
provider_family = "OpenAIOrCodex"
target_root = "~"

[provider_overrides]
disable_skills = true
omitted_hook_events = []

[[hooks]]
event = "Stop"
command = "$WORKSPACE_ROOT/tools/foundry-supervisor-stop-hook"
args = []

[[mcp_servers]]
name = "oya-mcp-gateway"
transport = "Stdio"
command_or_url = "$WORKSPACE_ROOT/target/release/oya-mcp-gateway"

[[permissions]]
rule = "Bash(grit *)"

[[allowed_tools]]
name = "Read"
