[package]
name = "oya-ops-workspace-shell-runtime"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
oya-ops-workspace-shell-kernel = { path = "../oya-ops-workspace-shell-kernel" }
oya-ops-workspace-shell-application = { path = "../oya-ops-workspace-shell-application" }
oya-ops-workspace-shell-adapter = { path = "../oya-ops-workspace-shell-adapter" }
oya-ops-workspace-shell-rest = { path = "../oya-ops-workspace-shell-rest" }
oya-http-router-kernel = { path = "../oya-http-router-kernel" }
oya-http-middleware-kernel = { path = "../oya-http-middleware-kernel" }
oya-http-runtime-hyper-adapter = { path = "../oya-http-runtime-hyper-adapter" }
tokio.workspace = true
# bytes removed per ADR-0092: kernel body is Vec<u8>; only the hyper adapter
# needs bytes, and this runtime consumes the adapter's already-converted types.


[lib]
name = "oya_ops_workspace_shell_runtime"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-ops-workspace-shell"
path = "src/main.rs"

[lints]
workspace = true
