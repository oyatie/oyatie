openapi: 3.2.0
info:
  title: Rippling REST API (oya-connector-rippling-adapter snapshot)
  version: v1-snapshot
servers:
  - url: https://api.rippling.com/platform/api
paths:
  /employees:
    get:
      operationId: listEmployees
      responses: { '200': { description: Employees page } }
    post:
      operationId: createEmployee
      responses: { '201': { description: Employee created } }
  /employees/{id}:
    get:
      operationId: getEmployee
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: Employee } }
    patch:
      operationId: updateEmployee
      responses: { '200': { description: Employee updated } }
    delete:
      operationId: deleteEmployee
      responses: { '204': { description: Deleted } }
  /devices:
    get:
      operationId: listDevices
      responses: { '200': { description: Devices page } }
  /transactions:
    get:
      operationId: listTransactions
      responses: { '200': { description: Transactions page } }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
security:
  - apiKey: []
