[package]
name = "oya-shared-hyperscaler-metrics-adapter-otlp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Env-gated OpenTelemetry OTLP/HTTP metrics adapter for the shared
# HyperscalerMetrics trait. The Prometheus adapter remains the default local
# scrape implementation; this crate is an explicit exporter harness for cloud
# collector integration and production composition roots.

[dependencies]
oya-shared-hyperscaler-metrics-kernel = { path = "../oya-shared-hyperscaler-metrics-kernel" }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["metrics"] }

[lints]
workspace = true
