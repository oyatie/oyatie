[package]
name = "oya-check-documentation"
version.workspace = true
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "LEAN-A5 — verify oyatie documentation suite coverage per ADR-0063 + ADR-0064"

[lib]
name = "oya_check_documentation"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-check-documentation"
