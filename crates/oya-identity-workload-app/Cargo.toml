[package]
name = "oya-identity-workload-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload-identity service core (usecase layer): orchestrates the workload-identity domain + OIDC token validation + Cedar authz adapters into the OIDC -> principal-lifecycle -> authorize flow (provision/activate/suspend/retire + default-deny hot authorize path) per ADR-0002. Task T3 workload-identity service."

# INVARIANT: only path-deps on the three workload-identity crates. The usecase
# layer introduces NO external workspace dependency of its own: ring/serde are
# owned by the OIDC adapter and cedar-policy by the authz-cedar adapter; this
# crate composes the typed boundaries those crates already expose. It stays
# serde-free / thiserror-free, mirroring the domain + cedar-adapter siblings
# (explicit error enums with hand-written Display/Error impls).
[dependencies]
oya-identity-workload-domain = { path = "../oya-identity-workload-domain" }
oya-identity-workload-oidc-adapter = { path = "../oya-identity-workload-oidc-adapter" }
oya-identity-workload-authz-cedar-adapter = { path = "../oya-identity-workload-authz-cedar-adapter" }

[lib]
name = "oya_identity_workload_app"
path = "src/lib.rs"
doctest = false

# TEST-ONLY: the acceptance tests mint a real ES256 workload JWT so the full
# OIDC -> principal -> Cedar authorize path runs against the REAL adapters (no
# token stubs). `ring` + `base64` are the same crypto/encoding primitives the
# OIDC adapter validates with (already in Cargo.lock; OSI-clean per the runtime
# dependency allowlist). They are NOT workspace `[dependencies]` seam crates and
# carry no dependency-rationales entry, so this dev-only use stays seam-clean.
# These do not appear in the crate's library dependency surface.
[dev-dependencies]
ring = "0.17.14"
base64 = "0.22.1"

[lints]
workspace = true
