[package]
name = "oya-llm-gateway-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# PURE kernel layer (ADR-0105 Layer 1): no I/O, no HTTP, no async runtime, no
# external crates. Mirrors the std-only discipline of oya-http-router-kernel.
# The key-pool state machine lives here so it can be unit-tested exhaustively
# and reused by any runtime (the rest adapter is the only current consumer).
[dependencies]

[lib]
name = "oya_llm_gateway_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
