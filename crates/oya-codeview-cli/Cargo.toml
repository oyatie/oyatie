[package]
name = "oya-codeview-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[[bin]]
name = "oya-codeview-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
