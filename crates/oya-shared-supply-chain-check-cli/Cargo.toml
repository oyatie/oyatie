[package]
name = "oya-shared-supply-chain-check-cli"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "shared"
bounded_context = "supply-chain-check"
kind = "shared"
layer = "cli"
purpose = "LEAN-A3: wraps cargo deny check with augmented JSON output for LEAN-A1 orchestrator consumption."

[[bin]]
name = "oya-shared-supply-chain-check-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
