# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=supervisor; layer=kernel (12-layer-enum L1).
#         Justification: pure-kernel value types + port traits for the foundry
#         supervisor lane (M02-P06). No I/O. No provider-specific code.

[package]
name = "oya-foundry-supervisor-kernel"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "oya_foundry_supervisor_kernel"
path = "src/lib.rs"
doctest = false

[dependencies]
oya-foundry-autonomy-ceiling-kernel = { path = "../oya-foundry-autonomy-ceiling-kernel" }
oya-foundry-account-domain = { path = "../oya-foundry-account-domain" }

[lints]
workspace = true
