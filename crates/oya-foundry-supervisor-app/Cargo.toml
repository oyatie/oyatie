# Naming: oya-<product>-<feature>-<layer> per v4 BNF.
#         product=foundry; feature=supervisor; layer=app (12-layer-enum L5).
#         Justification: daemon binary — composes supervisor-kernel port traits with
#         jsonl-supervisor-adapter I/O seam; exposes hyper webhook endpoint; owns
#         tick_once call chain and max_in_flight enforcement (M02-P06).

[package]
name = "oya-foundry-supervisor-app"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[[bin]]
name = "oya-foundry-supervisor"
path = "src/main.rs"

[lib]
name = "oya_foundry_supervisor_app"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "heartbeat"
path = "benches/heartbeat.rs"
harness = false

[dependencies]
oya-foundry-supervisor-kernel = { path = "../oya-foundry-supervisor-kernel" }
oya-foundry-jsonl-supervisor-adapter = { path = "../oya-foundry-jsonl-supervisor-adapter" }
oya-foundry-claude-account-adapter = { path = "../oya-foundry-claude-account-adapter" }
oya-foundry-codex-account-adapter = { path = "../oya-foundry-codex-account-adapter" }
oya-foundry-gemini-account-adapter = { path = "../oya-foundry-gemini-account-adapter" }
oya-foundry-route-policy-kernel = { path = "../oya-foundry-route-policy-kernel" }
oya-foundry-account-domain = { path = "../oya-foundry-account-domain" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
oya-foundry-settings-template-kernel = { version = "0.1.0", path = "../oya-foundry-settings-template-kernel" }
oya-foundry-settings-template-adapter = { version = "0.1.0", path = "../oya-foundry-settings-template-adapter" }
oya-foundry-autonomy-ceiling-domain = { version = "0.1.0", path = "../oya-foundry-autonomy-ceiling-domain" }
oya-foundry-supervisor-security-adapter = { version = "0.1.0", path = "../oya-foundry-supervisor-security-adapter" }
oya-foundry-account-adapter-inmemory = { version = "0.1.0", path = "../oya-foundry-account-adapter-inmemory" }

[lints]
workspace = true
