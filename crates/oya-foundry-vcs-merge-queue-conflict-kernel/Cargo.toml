[package]
# Naming justification (per feedback_naming_justification):
#   - BNF v4.1:  oya - foundry - vcs-merge-queue-conflict - kernel
#   - slot-2 µservice: `foundry` (registered).
#   - bc-tokens: `vcs-merge-queue-conflict` (kebab tokens; bounded context
#                is the projected-merge-state algorithm + 3-invariant
#                validator from ADR-0111).
#   - layer (slot-N): `kernel` — pure-domain port-in-kernel per ADR-0056;
#                no I/O, no clock, no shelling out to git. The runner
#                (oya-foundry-vcs-merge-queue-fix-loop-app) invokes
#                `git merge-tree` and feeds the parsed output into this
#                kernel's `validate_projected_merge_state(...)` function.
#
# ADR-0111 wave-A "Naming justification" section authorizes this new
# crate as the home for the projected-merge-state algorithm, keeping
# the existing oya-foundry-vcs-merge-queue-fix-loop-app as the binary
# dispatcher per port-in-kernel discipline.
name = "oya-foundry-vcs-merge-queue-conflict-kernel"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "foundry"
bounded_context = "vcs-merge-queue-conflict"
kind = "shared"
layer = "kernel"
purpose = "Pure-domain port-in-kernel for ADR-0111 projected-merge-state simulation + 3-invariant validator (diff cleanliness via parsed git-merge-tree output, path-overlap check, sha well-formedness). No I/O; std-only deps."
lifecycle.stage = "scaffolded"
introducing_ip = "M-CC-P11-IP-002"

[dependencies]

[lib]
name = "oya_foundry_vcs_merge_queue_conflict_kernel"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
