[package]
name = "oya-identity-workload-oidc-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Workload OIDC token validation core: verifies a compact JWS (RS256/384/512, ES256) against issuer JWKs via aws-lc-rs, then projects verified claims into a workload principal. Task T3."

[dependencies]
oya-identity-workload-domain = { path = "../oya-identity-workload-domain" }
# aws-lc-rs: canonical Phase-1 crypto backend (ADR-0506). Drop-in ring
# replacement backed by AWS-LC (FIPS-validatable BoringSSL fork).
# Apache-2.0 + ISC — OSI-clean. Exports ring-compatible signature/digest/rand
# module paths so call sites need only rename the extern crate prefix.
aws-lc-rs = { workspace = true }
# base64: JWS segment + JWK coordinate decoding (MIT/Apache-2.0). Locked.
base64 = "0.22.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "oya_identity_workload_oidc_adapter"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
