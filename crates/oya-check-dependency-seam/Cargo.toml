[package]
name = "oya-check-dependency-seam"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Per ADR-0092 D13: composite seam-discipline lane with 6 sub-checks (3
# mechanical + 3 multispectrum-bar). Per ADR-0056 §"Check-namespace
# exemption": oya-check-* crates are BNF-exempt. This crate is std-only at
# the kernel layer — sub-check implementations that need TOML/JSON parsers
# may be added behind features later (FixupTask F-LANE-SEAM-IMPL).

[dependencies]
# Reusable std-only JSON top-level-object parser (CONV-1 substring-grep
# replacement). Extracted from this crate per user directive 2026-05-15:
# "shouldn't we make a reusable json parser?". Internal workspace path dep;
# no external transitives.
oya-json-kernel = { path = "../oya-json-kernel" }

[lib]
name = "oya_check_dependency_seam"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-check-dependency-seam"
path = "src/main.rs"
