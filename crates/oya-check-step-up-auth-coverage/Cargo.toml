[package]
name = "oya-check-step-up-auth-coverage"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Advisory-mode gate scanning OpenAPI 3.x specs for missing x-acr-required on sensitive mutating operations. Authority: ADR-0189."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
serde_yaml = "0.9"

[lib]
name = "oya_check_step_up_auth_coverage"
path = "src/lib.rs"
doctest = false

[[test]]
name = "step_up_auth_coverage"
path = "tests/step_up_auth_coverage.rs"

[lints]
workspace = true
