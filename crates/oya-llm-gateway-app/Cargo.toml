[package]
name = "oya-llm-gateway-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "LLM gateway composition-root (usecase layer per ADR-0105). Path-deps on the kernel (pure key-pool state machine) and the rest adapter (OpenAI-canonical surface, byte-passthrough SSE). Owns the upstream-transport port + the production hyper-backed adapter + the in-memory dev/test fakes; lifecycle/wire-up (load PoolPolicy + keys from typed config, build KeyPool, mount the OpenAI router, serve over hyper). Mirrors the workload-identity app's composition pattern (ports + in-memory adapters; default-deny on error; ADR-0083 Tier-3 panic-free)."

# INVARIANT: path-deps on the two LLM-gateway crates only. The composition
# layer adds the same hyper + axum + bytes + futures-util backbone the rest
# adapter already declares (those are blessed in the dependency-rationales
# allowlist for this gateway lane); no NEW external workspace dependency seam.
[dependencies]
oya-llm-gateway-kernel = { path = "../oya-llm-gateway-kernel" }
oya-llm-gateway-rest = { path = "../oya-llm-gateway-rest" }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Test client + harness for the acceptance suite. Drives the gateway over a
# real TCP socket on localhost — no network egress.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false }

[lib]
name = "oya_llm_gateway_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oya-llm-gateway-app"
path = "src/main.rs"

[lints]
workspace = true
