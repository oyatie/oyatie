[package]
name = "oya-foundry-vcs-changeset-state-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[package.metadata.oya]
vertical = "foundry"
bounded_context = "vcs-changeset-state"
kind = "shared"
layer = "app"
purpose = "Composition root for the agentic-VCS changeset state machine (ADR-0110): `append` subcommand reads registry/vcs/changeset-event-log.json, runs the monotonic-event-log validator against the candidate event, appends + atomically writes back. Ed25519 signing is wave-B."
lifecycle.stage = "scaffolded"

[dependencies]
oya-foundry-vcs-changeset-state-kernel = { path = "../oya-foundry-vcs-changeset-state-kernel" }
serde_json = { workspace = true }

[[bin]]
name = "oya-foundry-vcs-changeset-state-app"
path = "src/main.rs"

[lints]
workspace = true
