# compliance µservice — Secret bindings declaration
# Binding: ADR-0296 (sidecar isolation) + ADR-0255 §D-4 (BYOK everywhere — provider BYOK,
# distinct from encryption BYOK)
apiVersion: oyatie.io/secrets/v1
kind: SecretBindings
metadata:
  name: compliance-bindings
  microservice: compliance
spec:
  bindings:
    - name: signing-key
      openbao_path: "secret/{tenant_id}/compliance/signing-key"
      kind: ed25519
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/compliance/evidence-collector
        - spiffe://oyatie/compliance/regulator-evidence-emit
    - name: seal-key
      openbao_path: "secret/{tenant_id}/compliance/seal-key"
      kind: cosign-keyless-oidc
      ttl_seconds: 60
      rotation_days: 90
      consumer_principals:
        - spiffe://oyatie/compliance/evidence-collector
    - name: dsar-encryption-key
      openbao_path: "secret/{tenant_id}/compliance/dsar-encryption-key"
      kind: aes-256-gcm
      ttl_seconds: 60
      rotation_days: 30
      consumer_principals:
        - spiffe://oyatie/compliance/dsar-orchestrator
  provider_credential_mode: tenant_byok
  encryption_credential_mode: tenant_byok
