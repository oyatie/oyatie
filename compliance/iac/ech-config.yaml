# compliance µservice — ECH (Encrypted Client Hello, RFC 9460 + draft-ietf-tls-esni-22)
# Per ADR-0253 — published as DNS HTTPS RR
apiVersion: oyatie.io/network/v1
kind: ECHConfig
metadata:
  name: compliance-ech
  microservice: compliance
spec:
  config_id: ech-2026-05
  algorithm: "HKDF-SHA256+AES-128-GCM"
  public_name: "compliance.oyatie.io"
  rotation_days: 90
  dns_https_rr:
    - ech_b64: "AEX+DQBBJgAgACA..."
      ipv4_hint: ["203.0.113.1"]
      ipv6_hint: ["2001:db8::1"]
  graceful_degradation: true
