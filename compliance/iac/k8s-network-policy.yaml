# compliance µservice — NetworkPolicy (Cilium L4 + Ambient ztunnel per manifest mesh_layering)
# Bootstrap-tier-1 SPIFFE attestation + kill-switch per ADR-0295
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliance-default-deny
  namespace: compliance
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliance-allow-substrate
  namespace: compliance
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: compliance
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oyatie.io/substrate-tier: "true"
        - podSelector:
            matchLabels:
              oyatie.io/spiffe-attested: "true"
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: audit-chain
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-secrets
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443
