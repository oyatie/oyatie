# compliance µservice — K8s base deployment per ADR-0254
# Companion: iac/helm/evidence-collector + iac/k8s-network-policy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-evidence-collector
  namespace: compliance
  labels:
    app.kubernetes.io/name: compliance
    app.kubernetes.io/component: evidence-collector
    oyatie.io/cell-tier: tier-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliance-evidence-collector
  template:
    metadata:
      labels:
        app: compliance-evidence-collector
        oyatie.io/spiffe-id: spiffe://oyatie/compliance/evidence-collector
      annotations:
        # Cloud Hypervisor + Kata per ADR-0254 for PII/PHI workloads
        io.katacontainers.config.hypervisor.path: /usr/local/bin/cloud-hypervisor
        oyatie.io/openbao-secret-binding: secret/{tenant_id}/compliance/signing-key
        oyatie.io/ech-config-id: ech-2026-05
        oyatie.io/pqc-hybrid: X25519MLKEM768
    spec:
      runtimeClassName: kata
      containers:
        - name: evidence-collector
          image: ghcr.io/oyatie/compliance-evidence-collector:0.1.0
          ports:
            - name: http3
              containerPort: 443
              protocol: UDP
            - name: https
              containerPort: 443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 443
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /livez
              port: 443
              scheme: HTTPS
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
