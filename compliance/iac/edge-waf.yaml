# compliance µservice — Edge WAF + bot-management per ADR-0297 + docs/standards §3.2.3
apiVersion: oyatie.io/network/v1
kind: EdgeWAF
metadata:
  name: compliance-edge-waf
  microservice: compliance
spec:
  bot_management:
    provider: in-house-equivalent
    ja4_enabled: true
    ja4plus_enabled: true
    http2_frame_pattern: true
    http3_qpack_pattern: true
    score_header: "X-Oya-Bot-Score"
  rate_limits:
    per_ip:
      auth_routes: { rpm: 30,  burst: 10 }
      write_routes: { rpm: 60, burst: 20 }
      read_routes: { rpm: 300, burst: 100 }
      admin_routes: { rpm: 10, burst: 5 }
    per_fingerprint:
      enabled: true
      window_seconds: 60
    per_tenant:
      enabled: true
  challenges:
    captcha:
      providers: [hcaptcha, turnstile, cloudflare-challenge]
      trigger_bot_score: 60
      ux_floor:
        a11y_audio_alternative: true
        a11y_keyboard_navigable: true
        a11y_time_pressured: false
        cognitive_load_seconds_max: 10
        session_continuity_preserved: true
  device_attestation:
    web: webauthn-origin-binding
    ios: app-attest
    android: play-integrity
  honeypots:
    routes:
      - /v1/internal-audit-debug
      - /v1/legacy-evidence-export
  friendly_crawler_partners_allowlist:
    - googlebot
    - bingbot
    - oyatie-accredited-researchers
  default_path_latency_budget_ms: 2
