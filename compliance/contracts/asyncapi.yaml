asyncapi: 3.1.0
info:
  title: Oyatie Compliance Event Surface
  version: 0.1.0
  description: |
    Compliance µservice event topics per ADR-0145 + ADR-0153.
    Inbound: cross-µservice evidence fan-in.
    Outbound: DSAR / artifact-emitted / seal-verify-failed events.

defaultContentType: application/json

channels:
  oya.compliance.evidence.in:
    description: Cross-µservice evidence fan-in (subscribes to fleet outbox)
    messages:
      ciBuildComplete: {$ref: '#/components/messages/CiBuildComplete'}
      deployPromoted: {$ref: '#/components/messages/DeployPromoted'}
      accessReviewComplete: {$ref: '#/components/messages/AccessReviewComplete'}
      backupDrillComplete: {$ref: '#/components/messages/BackupDrillComplete'}
      vulnScanComplete: {$ref: '#/components/messages/VulnScanComplete'}
      phiAccess: {$ref: '#/components/messages/PhiAccess'}
  oya.compliance.artifact.emitted:
    description: 'Compliance artifact emitted (downstream subscribers: ontology, audit-chain)'
    messages:
      artifactEmitted: {$ref: '#/components/messages/ArtifactEmitted'}
  oya.compliance.dsar.lifecycle:
    description: DSAR lifecycle events
    messages:
      dsarOpened: {$ref: '#/components/messages/DsarOpened'}
      dsarClosed: {$ref: '#/components/messages/DsarClosed'}
  oya.compliance.audit.alarm:
    description: Audit anomaly + seal verify failure events
    messages:
      sealVerifyFailed: {$ref: '#/components/messages/SealVerifyFailed'}
      anomalyDetected: {$ref: '#/components/messages/AnomalyDetected'}

components:
  messages:
    CiBuildComplete:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          build_hash: {type: string}
          ts_unix_ms: {type: integer, format: int64}
    DeployPromoted:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          image_digest: {type: string}
          environment: {type: string}
          ts_unix_ms: {type: integer, format: int64}
    AccessReviewComplete:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          reviewer_spiffe_id: {type: string}
          ts_unix_ms: {type: integer, format: int64}
    BackupDrillComplete:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          drill_id: {type: string}
          rpo_seconds: {type: integer}
          rto_seconds: {type: integer}
          ts_unix_ms: {type: integer, format: int64}
    VulnScanComplete:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          image_digest: {type: string}
          cve_count: {type: integer}
          ts_unix_ms: {type: integer, format: int64}
    PhiAccess:
      payload:
        type: object
        properties:
          tenant_id: {type: string}
          subject_pseudonym: {type: string}
          accessor_spiffe_id: {type: string}
          purpose: {type: string, enum: [treatment, payment, healthcare-ops, research, audit, dsar]}
          cedar_decision: {type: string, enum: [allow, deny]}
          ts_unix_ms: {type: integer, format: int64}
    ArtifactEmitted:
      payload:
        type: object
        properties:
          artifact_id: {type: string}
          kind: {type: string}
          framework: {type: string}
          tenant_id: {type: string}
          seal_hex: {type: string}
    DsarOpened:
      payload:
        type: object
        properties:
          request_id: {type: string}
          tenant_id: {type: string}
          subject_pseudonym: {type: string}
          opened_unix_ms: {type: integer, format: int64}
    DsarClosed:
      payload:
        type: object
        properties:
          request_id: {type: string}
          tenant_id: {type: string}
          closed_unix_ms: {type: integer, format: int64}
          completion_kind: {type: string, enum: [export, delete, rectify]}
    SealVerifyFailed:
      payload:
        type: object
        properties:
          artifact_id: {type: string}
          tenant_id: {type: string}
          ts_unix_ms: {type: integer, format: int64}
    AnomalyDetected:
      payload:
        type: object
        properties:
          detector: {type: string}
          severity: {type: string, enum: [sev-1, sev-2, sev-3, sev-4]}
          context: {type: object}
