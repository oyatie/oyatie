openapi: 3.2.0
info:
  title: Oyatie Compliance API
  version: 0.1.0
  description: |
    Compliance µservice REST API per ADR-0182 + ADR-0209.
    Covers DSAR (GDPR), evidence coverage, manual upload, audit-chain seal verify.
  contact:
    name: axis-compliance
servers:
  - url: https://api.oyatie.com/compliance/v1

paths:
  /dsar/export:
    post:
      summary: Open a DSAR export request
      operationId: dsarExport
      tags: [dsar]
      security:
        - zitadelOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarRequest'
      responses:
        '202':
          description: Request accepted; processing async
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsarRequestAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CircuitBroken'

  /dsar/delete:
    post:
      summary: Open a DSAR deletion request
      operationId: dsarDelete
      tags: [dsar]
      security: [{zitadelOidc: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsarRequestAccepted'}

  /dsar/rectify:
    post:
      summary: Open a DSAR rectification request
      operationId: dsarRectify
      tags: [dsar]
      security: [{zitadelOidc: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsarRectifyRequest'
      responses:
        '202': {description: Accepted}

  /dsar/{request_id}:
    get:
      summary: Get DSAR status
      operationId: dsarStatus
      tags: [dsar]
      security: [{zitadelOidc: []}]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DsarStatus'}

  /evidence/coverage:
    get:
      summary: Get per-framework evidence coverage
      operationId: evidenceCoverage
      tags: [evidence]
      security: [{zitadelOidc: []}]
      parameters:
        - {name: framework, in: query, required: true, schema: {type: string, enum: [soc2-type-2, gdpr, hipaa, pci-dss]}}
        - {name: tenant, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Coverage report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoverageReport'}

  /evidence/artifact/{artifact_id}:
    get:
      summary: Get artifact metadata + seal hex
      operationId: getArtifact
      tags: [evidence]
      security: [{zitadelOidc: []}]
      parameters:
        - {name: artifact_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceArtifact'}

  /evidence/manual-upload:
    post:
      summary: Manual evidence upload (pen-test, BAA, etc.)
      operationId: manualUpload
      tags: [evidence]
      security: [{zitadelOidc: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ManualUploadForm'}
      responses:
        '201': {description: Uploaded}
        '413': {description: Payload too large}
        '415': {description: Unsupported MIME}

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: compliance
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  securitySchemes:
    zitadelOidc:
      type: openIdConnect
      openIdConnectUrl: https://zitadel.oya.svc/.well-known/openid-configuration
  schemas:
    DsarRequest:
      type: object
      required: [tenant_id, subject_id_pseudonym]
      properties:
        tenant_id: {type: string}
        subject_id_pseudonym: {type: string}
        delivery_contact_pseudonym: {type: string}
    DsarRectifyRequest:
      allOf:
        - $ref: '#/components/schemas/DsarRequest'
        - properties:
            field_path: {type: string}
            new_value: {}
    DsarRequestAccepted:
      type: object
      properties:
        request_id: {type: string}
        opened_unix_ms: {type: integer, format: int64}
        eta_unix_ms: {type: integer, format: int64}
    DsarStatus:
      type: object
      properties:
        request_id: {type: string}
        state: {type: string, enum: [open, processing, completed, failed]}
        elapsed_days: {type: integer}
        statutory_sla_days: {type: integer, default: 30}
        target_sla_days: {type: integer, default: 5}
    CoverageReport:
      type: object
      properties:
        framework: {type: string}
        tenant_id: {type: string}
        gaps:
          type: array
          items:
            type: object
            properties:
              missing_artifact_kind: {type: string}
              microservice: {type: string}
    EvidenceArtifact:
      type: object
      properties:
        artifact_id: {type: string}
        kind: {type: string}
        framework: {type: string}
        tenant_id: {type: string}
        audit_chain_seal_hex: {type: string, minLength: 64, maxLength: 64}
        emitted_unix_ms: {type: integer, format: int64}
    ManualUploadForm:
      type: object
      required: [artifact_kind, framework, tenant_id, file_payload]
      properties:
        artifact_kind: {type: string}
        framework: {type: string}
        tenant_id: {type: string}
        metadata: {type: string, description: "JSON metadata"}
        file_payload: {type: string, format: binary}
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: string}
              message: {type: string}
    RateLimited:
      description: Rate limited
    CircuitBroken:
      description: Circuit broken (DSAR backlog)
