// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13
syntax = "proto3";

package oyatie.compliance.v1;

service ComplianceEvidence {
  rpc RecordEvidence(EvidenceRecordRequest) returns (EvidenceRecordResponse);
}

message EvidenceRecordRequest {
  string tenant_id = 1;
  string framework_id = 2;
  string control_id = 3;
  string evidence_ref = 4;
}

message EvidenceRecordResponse {
  string evidence_id = 1;
  string status = 2;
  string audit_event = 3;
}
