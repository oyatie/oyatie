apiVersion: openslo/v1
kind: SLO
metadata:
  name: breach-notify-authority-72h
  microservice: compliance
spec:
  service: compliance
  description: "GDPR Article 33 — 72h supervisory authority notification SLA."
  binding_adrs: [ADR-0251]
  indicator:
    metricSource:
      type: prometheus
      spec:
        query: "histogram_quantile(0.99, sum(rate(compliance_breach_notify_authority_seconds_bucket[30d])) by (le)) <= 259200"
  objectives:
    - target: 0.9999
      timeWindow: 30d
