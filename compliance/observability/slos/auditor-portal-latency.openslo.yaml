apiVersion: openslo/v1
kind: SLO
metadata:
  name: auditor-portal-latency
  displayName: Auditor portal p99 latency
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                histogram_quantile(0.99, rate(compliance_auditor_portal_request_seconds_bucket[5m])) < 0.8
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                rate(compliance_auditor_portal_request_seconds_count[5m])
  objectives:
    - displayName: p99 auditor portal latency ≤ 800ms
      target: 0.99
