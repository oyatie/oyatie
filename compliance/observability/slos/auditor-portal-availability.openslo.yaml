apiVersion: openslo/v1
kind: SLO
metadata:
  name: auditor-portal-availability
  displayName: Auditor portal availability during engagements
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_auditor_portal_request_success_total[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_auditor_portal_request_total[28d]))
  objectives:
    - displayName: Auditor portal availability ≥ 99.95% during engagements
      target: 0.9995
