apiVersion: openslo/v1
kind: SLO
metadata:
  name: dsar-completion-time
  displayName: DSAR completion time
  labels:
    microservice: compliance
    framework: gdpr
spec:
  service: compliance
  budgetingMethod: Occurrences
  description: |
    GDPR Art. 12 statutory: 30 days. Internal target: 5 days for automated requests.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_dsar_completion_total{microservice="compliance",completion_days_le="5"}[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_dsar_completion_total{microservice="compliance"}[28d]))
  objectives:
    - displayName: 95% of DSARs complete within 5 days (target)
      target: 0.95
    - displayName: 99% of DSARs complete within 30 days (statutory)
      target: 0.99
