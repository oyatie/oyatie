apiVersion: openslo/v1
kind: SLO
metadata:
  name: audit-chain-seal-verify-success
  displayName: Audit-chain seal verify success rate
  labels:
    microservice: compliance
    severity: sev-1
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_seal_verify_success_total[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_seal_verify_total[28d]))
  objectives:
    - displayName: Seal verify success ≥ 99.999%
      target: 0.99999
