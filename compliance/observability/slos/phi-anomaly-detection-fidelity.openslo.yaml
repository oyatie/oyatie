apiVersion: openslo/v1
kind: SLO
metadata:
  name: phi-anomaly-detection-fidelity
  displayName: PHI access anomaly detection fidelity
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  description: |
    Anomaly detector must catch ≥ 99% of injected anomaly fixtures in synthetic tests.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_phi_anomaly_detected_total[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_phi_anomaly_injected_total[28d]))
  objectives:
    - displayName: ≥ 99% of injected anomalies caught
      target: 0.99
