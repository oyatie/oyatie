apiVersion: openslo/v1
kind: SLO
metadata:
  name: pack-publish-soak-respected
  microservice: compliance
spec:
  service: compliance
  description: "Every pack-overlay publish honors the ≥60s Cedar fragment soak per ADR-0294."
  binding_adrs: [ADR-0294, ADR-0251]
  indicator:
    metricSource:
      type: prometheus
      spec:
        query: "sum(rate(compliance_pack_publish_soak_respected_total[5m])) / sum(rate(compliance_pack_publish_total[5m]))"
  objectives:
    - target: 1.000
      timeWindow: 30d
