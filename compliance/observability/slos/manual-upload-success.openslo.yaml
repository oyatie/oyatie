apiVersion: openslo/v1
kind: SLO
metadata:
  name: manual-upload-success
  displayName: Manual evidence upload success rate
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_manual_upload_success_total[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_manual_upload_total[28d]))
  objectives:
    - displayName: Manual upload success rate ≥ 99% (over 28-day window)
      target: 0.99
