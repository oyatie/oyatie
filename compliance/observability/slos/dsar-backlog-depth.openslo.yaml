apiVersion: openslo/v1
kind: SLO
metadata:
  name: dsar-backlog-depth
  displayName: DSAR backlog depth
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(compliance_dsar_open) - count(compliance_dsar_open > 100)
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                count(compliance_dsar_open)
  objectives:
    - displayName: DSAR backlog ≤ 100 per tenant
      target: 0.999
