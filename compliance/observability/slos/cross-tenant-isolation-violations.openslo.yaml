apiVersion: openslo/v1
kind: SLO
metadata:
  name: cross-tenant-isolation-violations
  displayName: Cross-tenant isolation violations (zero-tolerance)
  labels:
    microservice: compliance
    severity: sev-1
spec:
  service: compliance
  budgetingMethod: Occurrences
  description: |
    Any cross-tenant DSAR / evidence assembly violation is a Sev-1 incident.
    SLO objective is 100% (zero violations). Any failure triggers paging.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_request_total{microservice="compliance"}[28d])) -
                sum(rate(compliance_cross_tenant_violation_total{microservice="compliance"}[28d]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(compliance_request_total{microservice="compliance"}[28d]))
  objectives:
    - displayName: Zero cross-tenant isolation violations
      target: 1.0
