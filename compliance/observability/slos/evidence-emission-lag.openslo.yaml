apiVersion: openslo/v1
kind: SLO
metadata:
  name: evidence-emission-lag
  displayName: Evidence emission lag (event → artifact emit)
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                histogram_quantile(0.99, rate(compliance_emit_lag_seconds_bucket[5m])) < 60
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                rate(compliance_emit_lag_seconds_count[5m])
  objectives:
    - displayName: 99% of artifacts emit within 60 seconds of source event
      target: 0.99
