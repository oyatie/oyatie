apiVersion: openslo/v1
kind: SLO
metadata:
  name: evidence-coverage-rollup
  displayName: Per-framework evidence coverage rollup
  labels:
    microservice: compliance
spec:
  service: compliance
  budgetingMethod: Occurrences
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum by (framework) (compliance_required_artifacts_emitted{microservice="compliance"})
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum by (framework) (compliance_required_artifacts_total{microservice="compliance"})
  objectives:
    - displayName: 100% of required artifacts emitted per framework per quarter
      target: 1.0
