[package]
name = "os-kubernetes-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Port of the Talos Kubernetes subsystem: kubelet config, static pods, control-plane bootstrap, manifests, and k8s COSI controllers."

[lib]
name = "os_kubernetes_domain"
path = "src/lib.rs"
doctest = false

[dependencies]
os-kernel = { path = "../kernel" }
os-runtime-cri-domain = { path = "../runtime-cri-domain" }

# Test-only, and it has always been: every `os_secrets_domain` use in this crate
# is inside a `#[cfg(test)] mod tests`. That crate models Talos PKI rather than
# implementing it and lives behind its non-default `modeled-crypto` feature, so
# the dependency is declared where it is actually used and the library build
# does not link it at all.
[dev-dependencies]
os-secrets-domain = { path = "../secrets-domain", features = ["modeled-crypto"] }

[lints]
workspace = true
