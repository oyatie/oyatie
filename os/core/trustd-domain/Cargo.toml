[package]
name = "os-trustd-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Rust port of the Talos trustd subsystem: cluster CA, PKI, certificate issuance/signing, the SecurityService API, join-token verification, and node cert rotation."

[lib]
name = "os_trustd_domain"
path = "src/lib.rs"
doctest = false

[dependencies]
os-kernel = { path = "../kernel" }
aws-lc-rs = { workspace = true }
rcgen = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }

[lints]
workspace = true
