[package]
name = "os-network-domain"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Network message builders/parsers and Linux rtnetlink/ioctl surface for the operating-system Talos port."

[lib]
name = "os_network_domain"
path = "src/lib.rs"
doctest = false

[dependencies]
os-kernel = { path = "../kernel" }
os-kernel-abi = { path = "../../ports/kernel-abi" }

# Linux-only: the real rtnetlink/ioctl syscall surface in `linux_net` is built
# from raw `libc` FFI (no other external crates). On non-Linux hosts only the
# pure message builders/parsers compile, so libc is not pulled in there.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
