# Standalone package root: excluded from the monorepo Cargo workspace until
# integ/build absorbs membership (Cargo.lock sole-owner). Explicit fields + a
# local [workspace] table keep `cargo metadata` / supplementary cargo test working
# without inheriting the parent root workspace. members=["."] satisfies the
# nested-workspace census (oya-workspace-members-kernel requires the array).
[workspace]
members = ["."]
resolver = "2"

[package]
name = "os-oci-executor-oracle"
edition = "2024"
version = "0.1.0"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"
description = "Differential-oracle harness skeleton for the owned OCI executor (youki/runc/crun as oracles only)."

[lib]
name = "os_oci_executor_oracle"
path = "src/lib.rs"
doctest = false

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
