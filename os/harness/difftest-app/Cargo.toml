[package]
name = "os-difftest-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "Differential validation of the operating-system Rust port against Go oracle TSV vectors."

[lib]
name = "os_difftest_app"
path = "src/lib.rs"
doctest = false

[dependencies]
os-controllers-domain = { path = "../../core/controllers-domain" }
os-init-app = { path = "../../core/init-app" }
os-kernel = { path = "../../core/kernel" }
os-kubernetes-domain = { path = "../../core/kubernetes-domain" }
os-machine-config-domain = { path = "../../core/machine-config-domain" }
os-network-domain = { path = "../../core/network-domain" }
os-platform-domain = { path = "../../core/platform-domain" }
os-runtime-cri-domain = { path = "../../core/runtime-cri-domain" }
os-secrets-domain = { path = "../../core/secrets-domain" }

[lints]
workspace = true
