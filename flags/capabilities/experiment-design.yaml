apiVersion: oyatie.io/v2
kind: Capability
metadata:
  name: experiment-design
  microservice: feature-flags
  binding-adr: ADR-0159
spec:
  displayName: Experiment Design
  description: |
    Create, activate, and conclude A/B + multivariate experiments.
    Supports Bayesian, frequentist, and sequential (mSPRT) statistical methods.
    Activation requires step-up auth Class B (affects live traffic).
    Fairness audit required per EU AI Act for high-risk experiment surfaces.
  tier: T2
  risk_class: high
  audience_types:
    - B2B
    - INTERNAL_AGENT
  transport:
    grpc: oyatie.feature_flags.v1.ExperimentService/CreateExperiment
    rest: POST /api/v1/experiments
  slo_ref: slos/experiment-result-freshness.openslo.yaml
  cedar_permit: policy/experiment-design-authorization.cedar
  step_up_required: true
  step_up_class: B
  audit_emitted: true
  audit_event_classes:
    - ExperimentCreated
    - ExperimentActivated
    - ExperimentConcluded
