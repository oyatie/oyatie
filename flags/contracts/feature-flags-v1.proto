// oyatie.contract.exposure: internal-only
// oyatie.contract.transport: grpc-http2
// oyatie.contract.identity: spiffe-mtls-tls13

syntax = "proto3";

// feature-flags-v1.proto
// Binding ADR: ADR-0159 (feature-flag substrate)
// Transport: internal sibling-service gRPC over HTTP/2 with mTLS/TLS 1.3.
// Generated code: feature-flags-flag-api crate
// Versioning: SemVer per ADR-0258

package oyatie.feature_flags.v1;

option java_package = "com.oyatie.feature_flags.v1";
option go_package = "github.com/oyatie/feature-flags/v1;feature_flags_v1";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// FlagEvaluationService — hot path; p99 ≤1ms cell-local
// ─────────────────────────────────────────────────────────────────────────────
service FlagEvaluationService {
  // Evaluate a boolean flag
  rpc EvaluateBoolean(EvaluateBooleanRequest) returns (EvaluateBooleanResponse);
  // Evaluate a string flag
  rpc EvaluateString(EvaluateStringRequest) returns (EvaluateStringResponse);
  // Evaluate a number flag
  rpc EvaluateNumber(EvaluateNumberRequest) returns (EvaluateNumberResponse);
  // Evaluate a JSON object flag
  rpc EvaluateObject(EvaluateObjectRequest) returns (EvaluateObjectResponse);
  // Batch evaluate multiple flags in a single RPC (reduces SDK round-trips)
  rpc EvaluateBatch(EvaluateBatchRequest) returns (EvaluateBatchResponse);
  // SSE-equivalent streaming: push flag-state-changed events to SDK
  rpc StreamFlagUpdates(StreamFlagUpdatesRequest) returns (stream FlagUpdateEvent);
}

// ─────────────────────────────────────────────────────────────────────────────
// FlagManagementService — control plane; step-up auth required for mutations
// ─────────────────────────────────────────────────────────────────────────────
service FlagManagementService {
  rpc CreateFlag(CreateFlagRequest) returns (FlagDefinition);
  rpc GetFlag(GetFlagRequest) returns (FlagDefinition);
  rpc UpdateFlag(UpdateFlagRequest) returns (FlagDefinition);
  rpc ArchiveFlag(ArchiveFlagRequest) returns (ArchiveFlagResponse);
  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse);
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);
  rpc UndoFlagMutation(UndoFlagMutationRequest) returns (FlagDefinition);
}

// ─────────────────────────────────────────────────────────────────────────────
// KillSwitchService — emergency flag disable; Class C step-up auth
// ─────────────────────────────────────────────────────────────────────────────
service KillSwitchService {
  rpc EngageKillSwitch(EngageKillSwitchRequest) returns (EngageKillSwitchResponse);
  rpc DisengageKillSwitch(DisengageKillSwitchRequest) returns (DisengageKillSwitchResponse);
  rpc ListActiveKillSwitches(ListKillSwitchesRequest) returns (ListKillSwitchesResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// ExperimentService — experiment design and management
// ─────────────────────────────────────────────────────────────────────────────
service ExperimentService {
  rpc CreateExperiment(CreateExperimentRequest) returns (Experiment);
  rpc ActivateExperiment(ActivateExperimentRequest) returns (Experiment);
  rpc ConcludeExperiment(ConcludeExperimentRequest) returns (ExperimentResult);
  rpc GetExperimentResults(GetExperimentResultsRequest) returns (ExperimentResult);
}

// ─────────────────────────────────────────────────────────────────────────────
// Shared evaluation context — OpenFeature SSEP compatible
// ─────────────────────────────────────────────────────────────────────────────
message EvaluationContext {
  string tenant_id = 1;           // REQUIRED per ADR-0244
  string principal_id = 2;        // For rollout hashing; not stored
  string persona_tier = 3;        // B2C | B2B | INTERNAL_AGENT | EMERGENCY_SERVICES
  repeated string cohort_ids = 4; // Cohort targeting
  repeated string consent_purposes = 5; // Per ADR-0272
  string audience_type = 6;       // Per ADR-0244 audience_type
}

message EvaluateBooleanRequest {
  string flag_key = 1;
  bool default_value = 2;
  EvaluationContext context = 3;
}

message EvaluateBooleanResponse {
  bool value = 1;
  string variant = 2;
  string reason = 3;  // TARGETING_MATCH | PERCENTAGE_ROLLOUT | DEFAULT | KILL_SWITCH | PACK_OVERRIDE
  string error_code = 4;
  string flag_key = 5;
}

message EvaluateStringRequest {
  string flag_key = 1;
  string default_value = 2;
  EvaluationContext context = 3;
}

message EvaluateStringResponse {
  string value = 1;
  string variant = 2;
  string reason = 3;
  string error_code = 4;
  string flag_key = 5;
}

message EvaluateNumberRequest {
  string flag_key = 1;
  double default_value = 2;
  EvaluationContext context = 3;
}

message EvaluateNumberResponse {
  double value = 1;
  string variant = 2;
  string reason = 3;
  string error_code = 4;
  string flag_key = 5;
}

message EvaluateObjectRequest {
  string flag_key = 1;
  bytes default_value_json = 2;  // JSON-encoded default
  EvaluationContext context = 3;
}

message EvaluateObjectResponse {
  bytes value_json = 1;           // JSON-encoded result
  string variant = 2;
  string reason = 3;
  string error_code = 4;
  string flag_key = 5;
}

message EvaluateBatchRequest {
  repeated EvaluateBooleanRequest boolean_flags = 1;
  repeated EvaluateStringRequest string_flags = 2;
  repeated EvaluateNumberRequest number_flags = 3;
  EvaluationContext context = 4;  // Shared context for all evaluations
}

message EvaluateBatchResponse {
  repeated EvaluateBooleanResponse boolean_results = 1;
  repeated EvaluateStringResponse string_results = 2;
  repeated EvaluateNumberResponse number_results = 3;
}

message StreamFlagUpdatesRequest {
  string tenant_id = 1;
  repeated string flag_keys = 2;  // Empty = subscribe to all tenant flags
}

message FlagUpdateEvent {
  string event_type = 1;  // flag-state-changed | kill-switch-activated | pack-override-applied
  string flag_key = 2;
  string tenant_id = 3;
  string new_default_variant = 4;
  google.protobuf.Timestamp timestamp = 5;
  string hlc_timestamp = 6;  // Per ADR-0252
}

// ─────────────────────────────────────────────────────────────────────────────
// Flag management messages
// ─────────────────────────────────────────────────────────────────────────────
message FlagDefinition {
  string flag_key = 1;
  string tenant_id = 2;
  string flag_type = 3;
  string default_variant = 4;
  string lifecycle_state = 5;
  string intent = 6;
  google.protobuf.Timestamp sunset_at = 7;
  repeated TargetingRule targeting_rules = 8;
  bool audit_required = 9;
  bool has_pack_override = 10;
  bool undo_window_open = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message TargetingRule {
  string variant = 1;
  double percentage = 2;
  string cedar_predicate = 3;
}

message CreateFlagRequest {
  string flag_key = 1;
  string flag_type = 2;
  string default_variant = 3;
  string intent = 4;
  google.protobuf.Timestamp sunset_at = 5;
  repeated TargetingRule targeting_rules = 6;
  bool audit_required = 7;
  string step_up_token = 8;  // Class A minimum
}

message GetFlagRequest {
  string flag_key = 1;
  string tenant_id = 2;
}

message UpdateFlagRequest {
  string flag_key = 1;
  string tenant_id = 2;
  optional string lifecycle_state = 3;
  repeated TargetingRule targeting_rules = 4;
  optional google.protobuf.Timestamp sunset_at = 5;
  optional bool audit_required = 6;
  string step_up_token = 7;  // Class B for live flags
}

message ArchiveFlagRequest {
  string flag_key = 1;
  string tenant_id = 2;
  string step_up_token = 3;
}

message ArchiveFlagResponse { bool success = 1; }

message DeleteFlagRequest {
  string flag_key = 1;
  string tenant_id = 2;
  string step_up_token = 3;  // Class C
}

message DeleteFlagResponse { bool success = 1; }

message ListFlagsRequest {
  string tenant_id = 1;
  string lifecycle_state = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message ListFlagsResponse {
  repeated FlagDefinition flags = 1;
  string next_page_token = 2;
}

message UndoFlagMutationRequest {
  string flag_key = 1;
  string tenant_id = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Kill-switch messages
// ─────────────────────────────────────────────────────────────────────────────
message EngageKillSwitchRequest {
  string flag_key = 1;
  string tenant_id = 2;
  string reason = 3;          // Required for audit
  string incident_id = 4;     // Optional
  string step_up_token = 5;   // Class C required
}

message EngageKillSwitchResponse {
  string flag_key = 1;
  google.protobuf.Timestamp engaged_at = 2;
  repeated string propagation_target_cells = 3;
  string audit_event_id = 4;
}

message DisengageKillSwitchRequest {
  string flag_key = 1;
  string tenant_id = 2;
  string step_up_token = 3;   // Class B
}

message DisengageKillSwitchResponse { bool success = 1; }

message ListKillSwitchesRequest { string tenant_id = 1; }

message ListKillSwitchesResponse {
  repeated FlagDefinition active_kill_switches = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Experiment messages
// ─────────────────────────────────────────────────────────────────────────────
message ExperimentVariant {
  string name = 1;
  double allocation_percentage = 2;
  bytes flag_value_json = 3;
}

message CreateExperimentRequest {
  string experiment_key = 1;
  string flag_key = 2;
  string tenant_id = 3;
  repeated ExperimentVariant variants = 4;
  string primary_metric = 5;
  repeated string secondary_metrics = 6;
  double allocation_percentage = 7;
  string statistical_method = 8;  // bayesian | frequentist | sequential_msprt
  double minimum_detectable_effect = 9;
  double significance_threshold = 10;
}

message ActivateExperimentRequest {
  string experiment_id = 1;
  string tenant_id = 2;
  string step_up_token = 3;  // Class B
}

message ConcludeExperimentRequest {
  string experiment_id = 1;
  string tenant_id = 2;
  string winner_variant = 3;
  string conclusion_reason = 4;
}

message Experiment {
  string experiment_id = 1;
  string experiment_key = 2;
  string tenant_id = 3;
  string flag_key = 4;
  string lifecycle_state = 5;
  bool has_sample_size_estimate = 6;
  repeated ExperimentVariant variants = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp activated_at = 9;
}

message GetExperimentResultsRequest {
  string experiment_id = 1;
  string tenant_id = 2;
}

message ExperimentResult {
  string experiment_id = 1;
  string winner_variant = 2;
  double statistical_significance = 3;
  double p_value = 4;
  double bayesian_posterior_probability = 5;
  bool sample_ratio_mismatch_detected = 6;
  bytes feature_importance_json = 7;  // LIME/SHAP per EU AI Act Art. 13
  google.protobuf.Timestamp concluded_at = 8;
}
