openapi: 3.2.0
info:
  title: Oyatie Feature Flags API
  version: 1.0.0
  description: |
    OpenFeature-compatible runtime feature-flag substrate. Implements the OpenFeature
    Server-Side Evaluation specification (SSEP) with per-tenant Cedar targeting,
    experiment design, and emergency kill-switch surfaces.

    Hyperscaler precedents: LaunchDarkly Evaluation API, Statsig Server SDK,
    Unleash API, OpenFeature SSEP.

    Transport: HTTP/3 + QUIC default; fallback HTTP/2 > HTTP/1.1.
    Auth: Bearer JWT (mTLS SVID for µservice-to-µservice calls per ADR-0295).
    Step-up auth: X-Step-Up-Token header required for mutation endpoints.
  contact:
    name: axis-governance
    email: feature-flags-oncall@oyatie.internal
  license:
    name: Internal
  x-binding-adr: ADR-0159
  x-openfeature-ssep-version: "0.1.0"
  x-deprecation-policy: "MINOR-deprecated features sunset after 2 minor versions (≈6 months). See CHANGELOG.md."

servers:
  - url: https://feature-flags.internal/api/v1
    description: Internal substrate endpoint (mTLS SVID required)
  - url: https://feature-flags.{tenant_id}.oyatie.com/api/v1
    description: Per-tenant endpoint
    variables:
      tenant_id:
        description: Tenant identifier

tags:
  - name: evaluation
    description: Flag evaluation (hot path; ≤1ms p99 cell-local)
  - name: management
    description: Flag CRUD lifecycle (step-up auth required)
  - name: experiments
    description: Experiment design and management
  - name: killswitch
    description: Emergency kill-switch operations
  - name: stream
    description: SSE streaming for push-based cache invalidation

paths:
  /flags/{flag_key}/evaluate:
    post:
      operationId: evaluateFlag
      summary: Evaluate a feature flag
      description: |
        OpenFeature-compatible flag evaluation. Returns the resolved variant for
        the given evaluation context. Cell-local evaluation; p99 ≤1ms with warm cache.

        Emergency-services principals (audience_type=EMERGENCY_SERVICES) bypass
        all rate limits per §3.2.3 life-safety hard rule.
      tags: [evaluation]
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,127}$'
          description: Flag key (BNF v4.1 slug format)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagEvaluationRequest'
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEvaluationResponse'
        '404':
          description: Flag not found; default variant returned (never 404 for client)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEvaluationResponse'
        '429':
          description: Rate limit exceeded (not returned for EMERGENCY_SERVICES audience)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-slo-ref: slos/flag-eval-latency.openslo.yaml

  /flags:
    get:
      operationId: listFlags
      summary: List flag definitions for a tenant
      tags: [management]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: lifecycle_state
          in: query
          schema:
            $ref: '#/components/schemas/FlagLifecycleState'
        - name: page_token
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Flag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagListResponse'
    post:
      operationId: createFlag
      summary: Create a new flag definition
      description: |
        Step-up auth required: Class A minimum (passkey).
        Triggers FlagCreated audit event (sealed per ADR-0028).
        Cedar fragment for targeting rule soaks ≥60s before activation (ADR-0294).
      tags: [management]
      security:
        - BearerAuth: []
        - StepUpAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlagRequest'
      responses:
        '201':
          description: Flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDefinition'
        '409':
          description: Flag key already exists for tenant

  /flags/{flag_key}:
    get:
      operationId: getFlag
      summary: Get a flag definition
      tags: [management]
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flag definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDefinition'
        '404':
          description: Flag not found
    patch:
      operationId: updateFlag
      summary: Update a flag definition
      description: |
        Step-up auth Class B required for live flags.
        Step-up auth Class C required for kill_switch type flags.
        15-second undo window opens after successful mutation.
      tags: [management]
      security:
        - BearerAuth: []
        - StepUpAuth: []
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlagRequest'
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagDefinition'
    delete:
      operationId: deleteFlag
      summary: Hard-delete an archived flag
      description: Step-up auth Class C required. Flag must be in archived state.
      tags: [management]
      security:
        - BearerAuth: []
        - StepUpAuth: []
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Flag deleted

  /flags/{flag_key}/undo:
    post:
      operationId: undoFlagMutation
      summary: Undo last flag mutation (within 15-second window)
      tags: [management]
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mutation undone
        '409':
          description: Undo window expired (>15s since last mutation)

  /flags/{flag_key}/kill-switch:
    post:
      operationId: engageKillSwitch
      summary: Engage kill-switch (force flag off for all tenants)
      description: |
        Step-up auth Class C required (TOTP + passkey).
        Propagates to all cells ≤1s via Kafka broadcast.
        Emits KillSwitchEngaged audit event (sealed).
        CANNOT be used on emergency-services-bypass-flag or healthcare-break-glass-enable.
      tags: [killswitch]
      security:
        - BearerAuth: []
        - StepUpAuth: []
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchRequest'
      responses:
        '200':
          description: Kill-switch engaged; propagating to all cells
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitchResponse'
        '403':
          description: Cannot kill-switch an emergency-services flag
    delete:
      operationId: disengageKillSwitch
      summary: Disengage kill-switch
      description: Step-up auth Class B required.
      tags: [killswitch]
      security:
        - BearerAuth: []
        - StepUpAuth: []
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Kill-switch disengaged

  /experiments:
    post:
      operationId: createExperiment
      summary: Create an experiment
      tags: [experiments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'

  /experiments/{experiment_id}/activate:
    post:
      operationId: activateExperiment
      summary: Activate experiment (routes live traffic)
      description: Step-up auth Class B required. Sample-size estimate required before activation.
      tags: [experiments]
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Experiment activated

  /experiments/{experiment_id}/conclude:
    post:
      operationId: concludeExperiment
      summary: Conclude experiment and select winner
      tags: [experiments]
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcludeExperimentRequest'
      responses:
        '200':
          description: Experiment concluded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResult'

  /flags/stream:
    get:
      operationId: streamFlagUpdates
      summary: SSE stream for push-based flag cache invalidation
      description: |
        Server-Sent Events stream. Emits flag-state-changed, kill-switch-activated,
        kill-switch-deactivated, pack-override-applied events.
        Transport: HTTP/3 SSE preferred; falls back to HTTP/2.
      tags: [stream]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /flags/{flag_key}/appeal:
    post:
      operationId: appealFlagDecision
      summary: Appeal a flag evaluation block or adverse decision
      description: |
        Per GDPR Art. 22 + EU AI Act Art. 86: every adverse-action decision
        carries an appeal URL. Routes to ops-dashboard-control-center human
        review queue. SLA ≤30 days.
      tags: [management]
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealRequest'
      responses:
        '202':
          description: Appeal submitted; routed to human review

components:
  x-oyatie-sharding-automation-event-surface:
    microservice: feature-flags
    wave: 15-ZF-13
    artifact_type: contracts
    scope: OpenAPI components metadata for the sharding_automation event surface.
    wire_shape: Extension-only annotation; no paths, operations, schemas, requestBodies, responses, headers, securitySchemes, or examples are added.
    doctrine_refs:
      ADR-0346:
        purpose: >-
          Establish that ./bin/oya verify --ci-required is the canonical local pre-push verifier and MUST locally mirror the full CI matrix and MUST block on exit-0 of EACH step before returning success to the caller.
        enforced_by:
          - governance-verify-ci-mirror-coverage
          - governance-verify-ci-step-exit-semantics
          - governance-verify-skip-flag-allowlist
          - governance-submit-calls-verify
          - governance-verify-exit-code-contract
      ADR-0347:
        purpose: >-
          Declare that every governance-* CI lane prefix in the Oyatie corpus RENAMES to governance-* in a single bulk-rename pull request.
        enforced_by:
          - governance-no-foundry-fitness-residue
          - governance-lane-prefix-vocabulary
          - governance-rename-inventory-presence
      ADR-0348:
        purpose: >-
          Declare that cellular topology MUST support three control-plane-driven automation modes: AUTOSHARDING, AUTO-REBALANCE, and DYNAMIC SHARDING.
        enforced_by:
          - governance-sharding-automation-coverage
          - governance-autosharding-manual-mode-refusal
          - governance-auto-rebalance-residency-honored
          - governance-dynamic-sharding-threshold-coverage
          - governance-audit-chain-emit-on-automation-events
          - governance-tenant-migration-reversibility
        event_surface:
          autosharding: tenant_to_cell_shard_placement is computed by the control plane automatically.
          auto_rebalance: tenant migration honors residency and compliance pack constraints and is observable, reversible, and audit-chain-emit per ADR-0263.
          dynamic_sharding: HOT-SPLIT and COLD-MERGE shard-count operations are atomic and audit-emit.
          manifest_block: sharding_automation declares autosharding, auto_rebalance, and dynamic_sharding sub-blocks.
      ADR-0349:
        purpose: >-
          Declare Jenkins (LTS) and ArgoCD as the two canonical self-hostable CI/CD substrates for the Oyatie corpus.
        enforced_by:
          - governance-jenkins-github-actions-parity
          - governance-argocd-application-cosign-verified
          - governance-argocd-tenant-namespace-isolation
          - governance-jenkins-jcasc-only
          - governance-deploy-audit-chain-emit
    consumer_guidance:
      generators: Ignore this x-extension for SDK and server wire generation.
      governance: Use this x-extension as doctrine metadata for sharding_automation event-surface review only.
  schemas:
    FlagEvaluationRequest:
      type: object
      required: [tenant_id, principal_id, flag_type]
      description: OpenFeature-compatible evaluation context
      properties:
        tenant_id:
          type: string
          description: Tenant identifier (required for scoping; per ADR-0244)
          example: acme-corp
        principal_id:
          type: string
          description: Principal identifier (hashed for rollout; not stored)
          example: user-abc
        persona_tier:
          type: string
          enum: [B2C, B2B, INTERNAL_AGENT, EMERGENCY_SERVICES, FRIENDLY_CRAWLER_PARTNER, MINOR_TARGETED]
          description: Persona tier for targeting rules (per ADR-0244 audience_type)
          example: B2C
        cohort_ids:
          type: array
          items:
            type: string
          description: Cohort membership for targeting rules
          example: ["beta-users", "mobile-v2-testers"]
        flag_type:
          type: string
          enum: [boolean, string, number, object]
          description: Expected variant type (OpenFeature typed evaluation)
        consent_purposes:
          type: array
          items:
            type: string
          description: Active consent purposes (per ADR-0272 cookie consent)
          example: ["analytics", "personalization"]
        audience_type:
          type: string
          description: Audience type override (for EMERGENCY_SERVICES; requires attestation)

    FlagEvaluationResponse:
      type: object
      required: [flag_key, value, reason, variant]
      properties:
        flag_key:
          type: string
        value:
          description: Resolved variant value (typed per flag_type)
          oneOf:
            - type: boolean
            - type: string
            - type: number
            - type: object
        variant:
          type: string
          description: Variant name (e.g., "on", "off", "red", "control")
        reason:
          type: string
          enum: [TARGETING_MATCH, PERCENTAGE_ROLLOUT, DEFAULT, KILL_SWITCH, PACK_OVERRIDE, DISABLED]
          description: Why this variant was returned
        error_code:
          type: string
          description: OpenFeature error code if evaluation failed
        metadata:
          type: object
          description: Additional evaluation metadata (experiment_id if applicable)

    FlagDefinition:
      type: object
      required: [flag_key, tenant_id, flag_type, default_variant, lifecycle_state, intent]
      properties:
        flag_key:
          type: string
        tenant_id:
          type: string
        flag_type:
          type: string
          enum: [boolean, string, number, object, kill_switch, experiment]
        default_variant:
          type: string
        lifecycle_state:
          $ref: '#/components/schemas/FlagLifecycleState'
        intent:
          type: string
          enum: [release_toggle, experiment, permission_toggle, kill_switch]
        sunset_at:
          type: string
          format: date-time
          description: Required for release_toggle and experiment flags; CI red if past due
        targeting_rules:
          type: array
          items:
            $ref: '#/components/schemas/TargetingRule'
        pack_overrides:
          type: object
          description: Pack-mandated override values (read-only for tenant admins)
        audit_required:
          type: boolean
          default: false
          description: If true, every evaluation emits a sealed audit event
        has_pack_override:
          type: boolean
          readOnly: true
        undo_window_open:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FlagLifecycleState:
      type: string
      enum: [draft, active, kill_switch_active, archived, deleted]

    TargetingRule:
      type: object
      required: [variant]
      properties:
        variant:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
        cedar_predicate:
          type: string
          description: Cedar v4.2 predicate string; evaluated by shared-policy-eval

    CreateFlagRequest:
      type: object
      required: [flag_key, flag_type, default_variant, intent]
      properties:
        flag_key:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,127}$'
        flag_type:
          type: string
          enum: [boolean, string, number, object, kill_switch, experiment]
        default_variant:
          type: string
        intent:
          type: string
          enum: [release_toggle, experiment, permission_toggle, kill_switch]
        sunset_at:
          type: string
          format: date-time
        targeting_rules:
          type: array
          items:
            $ref: '#/components/schemas/TargetingRule'
        audit_required:
          type: boolean
          default: false

    UpdateFlagRequest:
      type: object
      properties:
        lifecycle_state:
          $ref: '#/components/schemas/FlagLifecycleState'
        targeting_rules:
          type: array
          items:
            $ref: '#/components/schemas/TargetingRule'
        sunset_at:
          type: string
          format: date-time
        audit_required:
          type: boolean

    KillSwitchRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          description: Human-readable reason for kill-switch activation (required for audit)
        incident_id:
          type: string
          description: Optional incident tracking ID

    KillSwitchResponse:
      type: object
      properties:
        flag_key:
          type: string
        engaged_at:
          type: string
          format: date-time
        propagation_target_cells:
          type: array
          items:
            type: string
        audit_event_id:
          type: string
          format: uuid

    CreateExperimentRequest:
      type: object
      required: [experiment_key, flag_key, variants, primary_metric]
      properties:
        experiment_key:
          type: string
        flag_key:
          type: string
        variants:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ExperimentVariant'
        primary_metric:
          type: string
        secondary_metrics:
          type: array
          items:
            type: string
        allocation_percentage:
          type: number
          minimum: 0
          maximum: 100
          default: 100
        statistical_method:
          type: string
          enum: [bayesian, frequentist, sequential_msprt]
          default: bayesian
        minimum_detectable_effect:
          type: number
        significance_threshold:
          type: number
          default: 0.95

    ExperimentVariant:
      type: object
      required: [name, allocation_percentage]
      properties:
        name:
          type: string
        allocation_percentage:
          type: number
        flag_value:
          description: Flag value when this variant is active

    Experiment:
      type: object
      properties:
        experiment_id:
          type: string
          format: uuid
        experiment_key:
          type: string
        tenant_id:
          type: string
        lifecycle_state:
          type: string
          enum: [draft, active, paused, concluded]
        has_sample_size_estimate:
          type: boolean

    ConcludeExperimentRequest:
      type: object
      required: [winner_variant]
      properties:
        winner_variant:
          type: string
        conclusion_reason:
          type: string

    ExperimentResult:
      type: object
      properties:
        experiment_id:
          type: string
          format: uuid
        winner_variant:
          type: string
        statistical_significance:
          type: number
        p_value:
          type: number
        bayesian_posterior_probability:
          type: number
        sample_ratio_mismatch_detected:
          type: boolean
        feature_importance:
          type: object
          description: LIME/SHAP feature importance for explainability (EU AI Act Art. 13)

    FlagListResponse:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/FlagDefinition'
        next_page_token:
          type: string

    AppealRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        contact_email:
          type: string
          format: email

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retry_after_seconds:
          type: integer

    FlagDefinitionExport:
      type: object
      description: DSAR export format per ADR-0276 (GDPR Art. 20 portability)
      properties:
        tenant_id:
          type: string
        exported_at:
          type: string
          format: date-time
        flags:
          type: array
          items:
            $ref: '#/components/schemas/FlagDefinition'
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: mTLS SVID for µservice-to-µservice (ADR-0295); Bearer JWT for human principals
    StepUpAuth:
      type: apiKey
      in: header
      name: X-Step-Up-Token
      description: Step-up auth token (Class A/B/C per docs/standards/step-up-auth-classes.md)

security:
  - BearerAuth: []
