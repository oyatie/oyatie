asyncapi: 3.1.0
info:
  title: Oyatie Feature Flag Events
  version: 0.1.0
channels:
  featureFlagEvents:
    address: oya.feature_flags.events
    messages:
      changed:
        $ref: '#/components/messages/FlagChanged'
      evaluated:
        $ref: '#/components/messages/FlagEvaluated'
operations:
  publishFlagEvent:
    action: send
    channel:
      $ref: '#/channels/featureFlagEvents'
components:
  messages:
    FlagChanged:
      payload:
        type: object
        required: [tenant_id, flag_key, actor_id]
        properties:
          tenant_id:
            type: string
          flag_key:
            type: string
          actor_id:
            type: string
    FlagEvaluated:
      payload:
        type: object
        required: [tenant_id, flag_key, variant]
        properties:
          tenant_id:
            type: string
          flag_key:
            type: string
          variant:
            type: string
