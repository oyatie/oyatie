# Edge WAF configuration — feature-flags
# Binding ADR: ADR-0297 (abuse-defence: anti-bot + anti-spoof + anti-scrape)
# UX floor: legitimate users (no abuse signals) experience zero added latency
# LIFE-SAFETY: EMERGENCY_SERVICES audience_type bypasses ALL WAF rules

apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: feature-flags-edge-waf
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0297
    ux-floor: "bot-score gate adds ≤2ms p99; zero friction for legitimate users"
spec:
  parentRefs:
    - name: oyatie-edge-gateway
      namespace: ingress
  rules:
    # Emergency-services bypass FIRST (highest priority)
    - matches:
        - headers:
            - name: X-Oyatie-Audience-Type
              value: EMERGENCY_SERVICES
      backendRefs:
        - name: feature-flags-evaluator
          port: 8080
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Oyatie-WAF-Bypass
                value: "emergency-services"

    # Rate limiting (evaluation path — high throughput)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/flags
          method: POST
      backendRefs:
        - name: feature-flags-evaluator
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: policy.oyatie.io
            kind: RateLimitPolicy
            name: feature-flags-eval-rate-limit

    # Rate limiting (mutation path — strict)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/flags
          method: PATCH
      backendRefs:
        - name: feature-flags-evaluator
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: policy.oyatie.io
            kind: RateLimitPolicy
            name: feature-flags-mutation-rate-limit
---
apiVersion: policy.oyatie.io/v1
kind: RateLimitPolicy
metadata:
  name: feature-flags-eval-rate-limit
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0297
    ux-floor: "EMERGENCY_SERVICES tenants exempt; elevated floor 10x"
spec:
  limits:
    - name: per-tenant-eval
      dimensions:
        - header: X-Oyatie-Tenant-Id
      rateLimit:
        unit: minute
        requestsPerUnit: 100000  # 100k eval/min per tenant
    - name: per-ip-eval
      dimensions:
        - remoteAddress: {}
      rateLimit:
        unit: minute
        requestsPerUnit: 10000
    # Bot-score gate (passive; pre-computed at edge)
    - name: high-bot-score-block
      dimensions:
        - header: X-Oyatie-Bot-Score
          operator: gte
          value: "95"
      action: block
      # UX floor: only blocks when score > 95; legitimate users unaffected
---
apiVersion: policy.oyatie.io/v1
kind: RateLimitPolicy
metadata:
  name: feature-flags-mutation-rate-limit
  namespace: feature-flags
spec:
  limits:
    - name: per-principal-mutation
      dimensions:
        - header: X-Oyatie-Principal-Id
      rateLimit:
        unit: minute
        requestsPerUnit: 60   # 60 mutations/min per principal (anti-flag-flooding)
