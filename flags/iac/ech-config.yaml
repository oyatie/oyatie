# ECH (Encrypted Client Hello) configuration — feature-flags
# Binding ADR: ADR-0253 (HTTP/3 + ECH + PQC)
# RFC 9460 + draft-ietf-tls-esni-22
# Key rotation: ≥90 days (automated via oya-intelligence-key-rotation-worker)

apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-ech-config
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0253
    rotation-cadence: "90d"
    rotation-runbook: "docs/runbooks/ech-key-rotation.md"
data:
  ech-config: |
    # ECH config published in DNS HTTPS RR via ADR-0273 toolchain
    # Format: ECHConfigList (RFC 9460 §4)
    # Generated by: oya-tls-config-generator --service feature-flags --mode ech
    #
    # ECH-enabled clients will use the outer SNI for routing;
    # inner SNI (feature-flags.internal) is encrypted.
    #
    # Degradation: ECH-disabled clients fall through to standard TLS 1.3
    # without breakage (graceful degradation per ADR-0253).
    #
    # DNS HTTPS RR example:
    #   feature-flags.internal. 300 IN HTTPS 1 . alpn="h3,h2" ech=<base64_ech_config>
    #
    ech_config_version: "1.0"
    public_key_algorithm: X25519
    max_name_length: 64
    cipher_suites:
      - HKDF-SHA256/AES-128-GCM
      - HKDF-SHA256/ChaCha20-Poly1305
    outer_sni: "*.oyatie.internal"
    inner_sni: "feature-flags.internal"
    key_rotation_days: 90
    # Keys are fetched from OpenBao at runtime; not stored here
    key_ref: "${openbao:secret/platform/feature-flags/ech-private-key}"
