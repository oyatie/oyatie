apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: feature-flags-credentials
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0296
    oyatie.io/ttl: "60s"
spec:
  refreshInterval: 55s   # Refresh before ≤60s TTL expires
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: feature-flags-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          microservice: feature-flags
  data:
    - secretKey: postgres-read-password
      remoteRef:
        key: "secret/platform/feature-flags/postgres/read"
        property: password
    - secretKey: postgres-write-password
      remoteRef:
        key: "secret/platform/feature-flags/postgres/write"
        property: password
    - secretKey: audit-signing-key
      remoteRef:
        key: "secret/platform/feature-flags/audit-signing-key"
        property: private_key
    - secretKey: pack-overlay-signing-key
      remoteRef:
        key: "secret/platform/feature-flags/pack-overlay-signing-key"
        property: private_key
    - secretKey: kafka-credentials
      remoteRef:
        key: "secret/platform/feature-flags/kafka/credentials"
        property: sasl_password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-flags-evaluator
  namespace: feature-flags
  annotations:
    spiffe.io/service-name: "feature-flags-evaluator"
    openbao.io/role: "feature-flags-evaluator"
    binding-adr: ADR-0295
