# PQC (Post-Quantum Cryptography) certificate configuration — feature-flags
# Binding ADR: ADR-0253 (HTTP/3 + ECH + PQC)
# KEM hybrid: X25519MLKEM768 (IANA codepoint 0x11ec)
# Signature hybrid: ed25519+ml_dsa_65
# Non-PQ clients fall through to classical curves (X25519/P-256) without breakage

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: feature-flags-pqc-cert
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0253
    pqc-kem: "X25519MLKEM768"
    pqc-sig: "ed25519+ml_dsa_65"
    rotation-cadence: "90d"
spec:
  secretName: feature-flags-pqc-tls
  duration: 2160h   # 90 days (shorter than classical due to PQ migration cadence)
  renewBefore: 360h # Renew 15 days before expiry
  issuerRef:
    name: oyatie-internal-ca
    kind: ClusterIssuer
  commonName: feature-flags.internal
  dnsNames:
    - feature-flags.internal
    - feature-flags.svc.cluster.local
  usages:
    - server auth
    - client auth
  # PQC hybrid TLS profile per ADR-0253
  # Implemented via cert-manager + sigstore/Fulcio supply-chain doctrine
  privateKey:
    algorithm: Ed25519      # Classical baseline
    # PQC hybrid configured via TLS stack policy (not cert-manager field)
    # X25519MLKEM768 KEM negotiated in ClientHello/ServerHello extensions
    rotationPolicy: Always
---
# TLS policy enforcing ADR-0253 requirements
apiVersion: networking.k8s.io/v1alpha1
kind: TLSPolicy
metadata:
  name: feature-flags-tls-policy
  namespace: feature-flags
  annotations:
    binding-adr: ADR-0253
spec:
  targetRef:
    group: apps
    kind: Deployment
    name: feature-flags-evaluator
  defaults:
    tls:
      minVersion: TLS13          # TLS 1.3 floor per ADR-0253
      cipherSuites:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      # No CBC ciphers; no TLS 1.2 or below
      clientValidation:
        caCertificateRef:
          group: ""
          kind: Secret
          name: oyatie-internal-ca-cert
      # PQC KEM preference: X25519MLKEM768 > X25519 > P-256
      keyExchange:
        - X25519MLKEM768         # PQC hybrid (IANA 0x11ec)
        - X25519                  # Classical fallback
        - P-256                   # Classical fallback
