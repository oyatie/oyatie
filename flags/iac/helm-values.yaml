# Helm values — feature-flags
# Binding ADR: ADR-0159 + ADR-0253 (HTTP/3) + ADR-0254 (Cloud Hypervisor)
# Override per-cell in overlays/pack-<pack_id>/values.yaml

global:
  microservice: feature-flags
  tier: "2"
  substrate: true
  bindingAdr: ADR-0159

image:
  repository: oyatie.io/feature-flags-evaluator
  pullPolicy: IfNotPresent
  tag: ""  # Overridden per deploy

replicaCount: 4

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetCustomMetric:
    name: feature_flag_eval_queue_depth
    targetAverageValue: "1000"

resources:
  requests:
    cpu: "500m"
    memory: "256Mi"
  limits:
    cpu: "2000m"
    memory: "512Mi"

# Cloud Hypervisor + Kata pods per ADR-0254
runtimeClassName: kata-clh

# HTTP/3 + QUIC per ADR-0253
ingress:
  enabled: true
  className: nginx-quic
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/http2: "true"
    nginx.ingress.kubernetes.io/http3: "true"
    nginx.ingress.kubernetes.io/alt-svc: 'h3=":443"; ma=86400'
    nginx.ingress.kubernetes.io/tls-min-version: TLSv1.3
    nginx.ingress.kubernetes.io/hsts: "max-age=63072000; includeSubDomains; preload"
    nginx.ingress.kubernetes.io/ech-enabled: "true"    # ECH per ADR-0253
    nginx.ingress.kubernetes.io/pqc-enabled: "true"    # PQC hybrid per ADR-0253
  hosts:
    - host: feature-flags.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: feature-flags-tls
      hosts:
        - feature-flags.internal

# OpenBao sidecar per ADR-0296
openBaoAgent:
  enabled: true
  image: openbao/openbao-agent:latest
  ttl: "60s"
  role: feature-flags-evaluator

# SPIFFE workload identity per ADR-0295
spiffe:
  enabled: true
  serviceName: feature-flags-evaluator

# Service mesh per ADR-0254
cilium:
  l4: true
  ambientZtunnel: true
  ambientWaypoint: false

# Observability per ADR-0263
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  protocol: grpc

# Cell-specific overrides (populated by CI per ADR-0248)
cell:
  id: ""
  tier: "2"
  sovereignConstraints: []

# Pack overlays
packs:
  hipaa:
    enabled: false
    cell: us-healthcare-cell
  pciDss:
    enabled: false
  fedRamp:
    enabled: false
    cell: us-gov-cell-1
  krFss:
    enabled: false
    cell: kr-cell-1
