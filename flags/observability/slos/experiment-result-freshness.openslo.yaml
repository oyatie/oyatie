apiVersion: openslo/v1
kind: SLO
metadata:
  name: feature-flags-experiment-result-freshness
  labels:
    microservice: feature-flags
    bc: experiment
    binding-adr: ADR-0159
spec:
  description: |
    Experiment results (statistical significance, conversion rates) are
    updated within 60 seconds of metric event ingestion p95.
    Hyperscaler precedent: Statsig reports results within 60s of event ingestion;
    Optimizely Stats Engine updates every 5 minutes.
    Capacity math: 860GB/day metric events → ClickHouse ingest lag target ≤60s.
  service: feature-flags
  sloOwner: axis-governance
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: experiment results fresh within 60s
      op: lte
      value: 60.0
      target: 0.95
  indicator:
    metadata:
      name: experiment-result-freshness-lag
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(experiment_result_computation_lag_seconds_bucket{le="60.0"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(experiment_result_computation_lag_seconds_count[5m]))
  alerting:
    burnRateAlerts:
      - shortWindow: 15m
        longWindow: 1h
        burnRateThreshold: 10
        severity: warning
        description: "Experiment results stale — ClickHouse ingest or computation lag"
