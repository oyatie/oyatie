# Canonical-base: specs/openslo/canonical-envelope-schema.json
apiVersion: openslo/v1
kind: SLO
metadata:
  name: flags-availability
  displayName: "flags — OpenFeature evaluation API availability"
  labels:
    microservice: flags
    sli: availability
    data_classes: TENANT_CONFIG
spec:
  service: flags
  description: |
    Availability of the OFREP evaluation endpoint (non-5xx responses).
    99.99% target reflects the sub-ms evaluation critical path (ADR-0481):
    flag resolution is synchronous + in-process; no I/O on the hot path.
    non_claim: design target; metric is populated once the service is deployed.
  indicator:
    spec:
      ratioMetric:
        good:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="flags",status!~"5.."}[5m]))
        total:
          metricSource:
            type: Prometheus
            spec:
              query: |
                sum(rate(http_requests_total{job="flags"}[5m]))
  objectives:
    - displayName: "99.99% non-5xx over rolling 30d"
      target: 0.9999
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
