apiVersion: openslo/v1
kind: SLO
metadata:
  name: feature-flags-flag-eval-latency
  labels:
    microservice: feature-flags
    bc: flag
    binding-adr: ADR-0159
spec:
  description: |
    Cell-local flag evaluation latency p99 ≤1ms target.
    Hyperscaler precedent: LaunchDarkly SDKs target <1ms local eval;
    Statsig reports p99 <0.5ms for server-side evaluation.
    Capacity math: 100k eval/s per replica at 1ms p99 → Little's Law L=100.
  service: feature-flags
  sloOwner: axis-governance
  timeWindow:
    - duration: 28d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: p99 latency ≤1ms
      op: lte
      value: 0.001
      target: 0.99
  indicator:
    metadata:
      name: flag-eval-p99-latency
    spec:
      ratioMetric:
        good:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(feature_flag_eval_duration_seconds_bucket{le="0.001",job="feature-flags-evaluator-rest"}[5m]))
        total:
          metricSource:
            type: prometheus
            spec:
              query: |
                sum(rate(feature_flag_eval_duration_seconds_count{job="feature-flags-evaluator-rest"}[5m]))
  alerting:
    burnRateAlerts:
      - shortWindow: 5m
        longWindow: 1h
        burnRateThreshold: 14
        severity: critical
        description: "Fast burn: flag eval latency SLO burning 14× — page immediately"
      - shortWindow: 30m
        longWindow: 6h
        burnRateThreshold: 5
        severity: warning
        description: "Slow burn: flag eval latency SLO degrading"
