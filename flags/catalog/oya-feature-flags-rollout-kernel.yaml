# Canonical-base: specs/catalog/canonical-crate-record-schema.json (ADR-0064)
name: oya-feature-flags-rollout-kernel
role: kernel
context: feature-flags
plane: control
slo: flag-state-propagation
contracts_consumed: []
contracts_exposed:
  - flags/contracts/feature-flags-v1.proto
regulatory_packs_consumed: [oya-pack-eu, oya-pack-us, oya-pack-kr, oya-pack-fedramp]
lifecycle: {state: incubating, preview_since: 2026-05-20}
traceability:
  github_issue: "oya-governance-pipeline://feature-flags-buildout-2026-05-20"
  source_adrs: [ADR-0105, ADR-0131, ADR-0159, ADR-0160, ADR-0243, ADR-0248, ADR-0263]
allowed_dependency_edges:
  - oya-feature-flags-flag-kernel
  - oya-feature-flags-targeting-kernel
  - oya-shared-policy-eval
  - oya-shared-hlc
  - oya-shared-tenant-context
data_classes_owned: [ROLLOUT_STAGE, ROLLOUT_PERCENTAGE, ROLLOUT_GATE_RESULT]
operational_classes_owned: [ROLLOUT_ADVANCE_COUNTER, ROLLOUT_ROLLBACK_COUNTER, SLO_GATE_EVAL_DURATION]
autonomy_tier_required: T1
rollout_stages_percent: [0, 1, 10, 50, 100]
slo_gate_required: true
release_runtime_safety_policy: flags/release/runtime-safety-policy.json
release_runtime_safety_verification_mode: data-only-declaration
release_runtime_safety_rust_first_rationale: "No standalone non-Rust validator; cloud-ci Rust/Buck2 gates own rust-first and artifact-accounting enforcement for this declaration until a dedicated Rust runtime-safety gate exists."
accepted_runtime_safety_authority:
  - specs/agentic-slo-gated-promotion.json
  - specs/feature-flag-substrate-canonical.json
  - specs/brownout-degradation-signal.json
context_only_runtime_safety_adrs:
  - docs/decisions/ADR-0700-ci-admission-live-apex.md
  - docs/decisions/ADR-0706-observability-live-apex.md
brownout_degradation_signal: specs/brownout-degradation-signal.json
runtime_safety_claim_ceiling:
  declaration_only: true
  live_rollout_execution: false
  tenant_traffic: false
  oya_cd_parity_or_cutover: false
naming_justification: "oya-feature-flags-rollout-kernel — BC=rollout + layer=kernel per ADR-0105 13-layer BNF v4.1; progressive-delivery gating; SLO-gated advance per ADR-0160"
